    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값» (명세 9장)
 *
 * 주 색상은 남색·파랑, 강조는 청록과 주황을 «조금만» 쓴다.
 * 윤리적 판단의 선택지에는 빨강·초록을 쓰지 않는다.
 * 정답·오답처럼 보이면 학생이 눈치를 보며 고르기 때문이다(명세 9.1).
 * 그래서 아래에 성공(초록)·실패(빨강) 색을 아예 만들어 두지 않았다.
 * 오류는 «주황 + ⚠ 글자» 로만 알린다.
 * ------------------------------------------------------------------ */
:root {
  /* 남색 계열 — 제목·버튼·강조선 */
  --navy-900: #0f2547;
  --navy-800: #16345f;
  --navy-700: #1b3a6b;
  --navy-600: #24508f;
  --navy-100: #e5ecf7;
  --navy-050: #f2f6fc;

  /* 청록 — 보조 강조 */
  --teal-700: #0d6c7a;
  --teal-100: #dff1f3;

  /* 주황 — 주의·오류 표시(색만으로 뜻을 전하지 않는다) */
  --amber-700: #a75a06;
  --amber-100: #fdf0dd;

  /* 회색 */
  --ink-900: #16202e;
  --ink-700: #37455a;
  --ink-500: #5d6b80;
  --ink-300: #9aa6b7;
  --ink-200: #ccd4de;
  --ink-100: #e6eaf0;
  --ink-050: #f5f7fa;
  --white: #ffffff;

  /* 코드 상자 — 높은 대비 */
  --code-bg: #14243c;
  --code-fg: #eef3fb;
  --code-dim: #9fb6d6;

  /* 간격 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --radius: 12px;
  --radius-sm: 8px;

  /* 터치 영역 최소 44px (명세 9.1) */
  --touch: 44px;

  --shadow-1: 0 1px 2px rgba(15, 37, 71, 0.08), 0 2px 8px rgba(15, 37, 71, 0.06);
  --shadow-2: 0 4px 16px rgba(15, 37, 71, 0.12);

  --font-body: "Pretendard", "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, sans-serif;
  --font-code: "D2Coding", "Cascadia Mono", "Consolas", "Courier New", monospace;

  /* 본문 최대 너비 — 학생용 (명세 9.1) */
  --student-width: 760px;
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-900);
  background: var(--ink-050);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3 {
  margin: 0;
  line-height: 1.35;
  word-break: keep-all;
}

p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

/* 초점 표시를 없애지 않는다 (명세 9.3) */
:focus-visible {
  outline: 3px solid var(--teal-700);
  outline-offset: 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--sp-3) var(--sp-4);
  background: var(--navy-700);
  color: var(--white);
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--white);
  border: 1px solid var(--ink-100);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  margin-bottom: var(--sp-4);
  overflow: hidden;
}

.card--accent {
  border-left: 4px solid var(--teal-700);
}

.card__head {
  padding: var(--sp-4) var(--sp-4) 0;
}

.card__eyebrow {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--navy-600);
  margin-bottom: var(--sp-1);
}

.card__title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy-900);
}

.card__desc {
  margin-top: var(--sp-2);
  font-size: 0.95rem;
  color: var(--ink-700);
}

.card__body {
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.subhead {
  font-size: 1rem;
  font-weight: 700;
  color: var(--navy-800);
  padding-top: var(--sp-2);
  border-top: 1px solid var(--ink-100);
}

.para {
  color: var(--ink-900);
}

.quote {
  margin: 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--teal-100);
  border-radius: var(--radius-sm);
  font-weight: 600;
  color: var(--navy-900);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--touch);
  padding: 0 var(--sp-5);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  background: var(--ink-100);
  color: var(--ink-900);
  transition: background-color 0.15s ease, border-color 0.15s ease;
}

.btn:hover:not(:disabled) {
  background: var(--ink-200);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--navy-700);
  color: var(--white);
}
.btn--primary:hover:not(:disabled) {
  background: var(--navy-800);
}

.btn--ghost {
  background: var(--white);
  border-color: var(--ink-200);
  color: var(--navy-800);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--navy-050);
}

.btn--tiny {
  min-height: 36px;
  padding: 0 var(--sp-3);
  font-size: 0.85rem;
  background: var(--white);
  border-color: var(--ink-200);
  color: var(--navy-700);
}

.btn--wide {
  flex: 1 1 auto;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
}

.btn-row--tools {
  gap: var(--sp-2);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.field__label {
  font-weight: 600;
  color: var(--navy-900);
  font-size: 0.98rem;
}

.field__help {
  font-size: 0.85rem;
  color: var(--ink-500);
}

.input {
  width: 100%;
  min-height: var(--touch);
  padding: var(--sp-3);
  font-family: inherit;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--ink-900);
  background: var(--white);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
}

.input:focus {
  border-color: var(--navy-600);
}

.input--area {
  resize: vertical;
  min-height: 96px;
}

.input--mono {
  font-family: var(--font-code);
}

.input--short {
  max-width: 220px;
}

.field__count {
  font-size: 0.82rem;
  color: var(--ink-500);
  text-align: right;
}

.field__count--ok {
  color: var(--teal-700);
  font-weight: 600;
}

/* 오류는 색 + 아이콘 + 글자로 알린다 (명세 9.3) */
.field__error {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--amber-700);
  background: var(--amber-100);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
}

.field--invalid .input {
  border-color: var(--amber-700);
  border-width: 2px;
}

/* ------------------------------ 선택형 ------------------------------ */

.choices {
  margin: 0;
  padding: 0;
  border: 0;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.choices--invalid {
  padding: var(--sp-3);
  border: 2px solid var(--amber-700);
  border-radius: var(--radius-sm);
}

.choice {
  position: relative;
}

.choice__radio {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

/* 선택지 색은 모두 같다. 어떤 보기도 «정답처럼» 보이지 않게 한다(명세 9.1) */
.choice__label {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  min-height: var(--touch);
  padding: var(--sp-3);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--white);
  cursor: pointer;
}

.choice__label:hover {
  background: var(--navy-050);
}

.choice__mark {
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border: 2px solid var(--ink-300);
  border-radius: 50%;
  background: var(--white);
}

.choice__radio:checked + .choice__label {
  border-color: var(--navy-700);
  border-width: 2px;
  background: var(--navy-050);
  padding: calc(var(--sp-3) - 1px);
}

.choice__radio:checked + .choice__label .choice__mark {
  border-color: var(--navy-700);
  box-shadow: inset 0 0 0 4px var(--navy-700);
}

.choice__radio:focus-visible + .choice__label {
  outline: 3px solid var(--teal-700);
  outline-offset: 2px;
}

.choice__text {
  color: var(--ink-900);
}

/* ------------------------------ 체크박스 ------------------------------ */

.check {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.check__row {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  min-height: var(--touch);
  padding: var(--sp-3);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--white);
}

.check__box {
  width: 22px;
  height: 22px;
  margin: 2px 0 0;
  flex: 0 0 auto;
  accent-color: var(--navy-700);
}

.check__label {
  cursor: pointer;
  font-weight: 600;
  color: var(--ink-900);
}

/* ------------------------------ 힌트 조각 ------------------------------ */

.chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
}

.chips__note {
  font-size: 0.8rem;
  color: var(--ink-500);
}

.chip {
  min-height: 32px;
  padding: 0 var(--sp-3);
  font-family: var(--font-code);
  font-size: 0.85rem;
  color: var(--navy-700);
  background: var(--navy-050);
  border: 1px dashed var(--ink-200);
  border-radius: 999px;
  cursor: pointer;
}

.chip:hover {
  background: var(--navy-100);
}

.hint-notice {
  font-size: 0.88rem;
  color: var(--ink-700);
  background: var(--ink-050);
  border-left: 3px solid var(--ink-300);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* ------------------------------ 코드 상자 ------------------------------ */

.codeblock {
  margin: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--navy-900);
}

.codeblock__cap {
  padding: var(--sp-2) var(--sp-3);
  background: var(--navy-900);
  color: var(--code-dim);
  font-size: 0.82rem;
  font-weight: 600;
}

.codeblock__pre {
  margin: 0;
  padding: var(--sp-4);
  background: var(--code-bg);
  color: var(--code-fg);
  font-family: var(--font-code);
  font-size: 0.95rem;
  line-height: 1.8;
  /* 들여쓰기와 줄바꿈을 그대로 지킨다. 가로로만 넘긴다(명세 4.1 화면2) */
  white-space: pre;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  tab-size: 4;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.alert--warn {
  background: var(--amber-100);
  border: 1px solid var(--amber-700);
  color: var(--ink-900);
}

.alert--info {
  background: var(--navy-050);
  border: 1px solid var(--navy-100);
}

.alert__title {
  font-weight: 700;
  color: var(--amber-700);
}

.alert__list {
  margin: 0;
  padding-left: 1.2em;
  font-size: 0.92rem;
}

.banner {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  align-items: flex-start;
}

.banner--warn {
  background: var(--white);
  border: 1px solid var(--amber-700);
}

.banner__title {
  font-weight: 700;
  color: var(--amber-700);
}

.banner__text {
  font-size: 0.9rem;
  color: var(--ink-700);
}

.toast-region {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
  width: min(92vw, 520px);
}

.toast {
  background: var(--navy-900);
  color: var(--white);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-2);
  font-size: 0.92rem;
}

/* ------------------------------ 읽기 전용 되보기 ------------------------------ */

.readback {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--sp-2) 0;
  border-bottom: 1px dashed var(--ink-100);
}

.readback:last-child {
  border-bottom: 0;
}

.readback__label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-500);
}

.readback__value {
  /* 학생이 쓴 줄바꿈을 그대로 살린다 (명세 9.2) */
  white-space: pre-wrap;
  color: var(--ink-900);
}
    </style>
    <style data-from="styles/student.css">
/* ------------------------------------------------------------------
 * 학생용 화면 (명세 9.1)
 *   · 모바일 세로 화면을 먼저 생각하고 만든다
 *   · 본문 최대 너비 760px, 가운데 정렬
 *   · 아래쪽 [이전]/[다음] 은 늘 같은 자리에 고정한다
 * ------------------------------------------------------------------ */

body {
  /* 아래 고정 버튼에 내용이 가리지 않도록 자리를 비워 둔다 */
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}

/* ------------------------------ 머리말 ------------------------------ */

.app-head {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--white);
  border-bottom: 1px solid var(--ink-100);
}

.app-head__inner {
  max-width: var(--student-width);
  margin: 0 auto;
  padding: var(--sp-3) var(--sp-4);
}

.app-head__eyebrow {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--navy-600);
  margin-bottom: var(--sp-2);
}

.progress__label {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}

.progress__step {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--navy-700);
}

/* 색만으로 상태를 알리지 않는다. 단계 이름을 늘 함께 적는다(명세 4.2) */
.progress__name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-900);
}

.progress__bar {
  height: 8px;
  border-radius: 999px;
  background: var(--ink-100);
  overflow: hidden;
}

.progress__fill {
  height: 100%;
  width: 0;
  background: var(--navy-700);
  transition: width 0.25s ease;
}

/* ------------------------------ 본문 ------------------------------ */

.app-main {
  max-width: var(--student-width);
  margin: 0 auto;
  padding: var(--sp-4);
}

.app-main:focus {
  outline: none;
}

.screen {
  display: block;
}

/* 작은 보조 버튼도 학생 화면에서는 손가락으로 누를 수 있어야 한다.
   공통 값은 36px 이지만(교사용 표에서 촘촘하게 쓰인다) 학생용에서는 44px 로 키운다(명세 9.1). */
.btn--tiny {
  min-height: var(--touch);
}

.step-tag {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.step-tag__num {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--white);
  background: var(--navy-700);
  border-radius: 999px;
  padding: 4px var(--sp-3);
}

.step-tag__time {
  font-size: 0.82rem;
  color: var(--ink-500);
}

/* ------------------------------ 시작 화면 ------------------------------ */

.hero {
  padding: var(--sp-4) 0 var(--sp-5);
}

.hero__title {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--navy-900);
  margin-bottom: var(--sp-2);
}

.hero__desc {
  color: var(--ink-700);
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: var(--sp-3) var(--sp-4);
}

/* 학번을 풀어서 되읽어 주는 줄 — 「→ 1학년 3반 12번 맞나요?」 */
.seat-echo {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--teal-700);
}

.field--inline .input {
  max-width: 100%;
}

.privacy {
  grid-column: 1 / -1;
  font-size: 0.85rem;
  color: var(--ink-500);
  background: var(--ink-050);
  border-radius: var(--radius-sm);
  padding: var(--sp-2) var(--sp-3);
}

/* 공용 기기 넘겨받기 안내 — 눈에 띄되 앞서지 않게 */
.handoff {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2) var(--sp-3);
  padding-top: var(--sp-2);
  border-top: 1px dashed var(--ink-100);
}

.handoff__text {
  font-size: 0.85rem;
  color: var(--ink-500);
}

.unit-block + .unit-block {
  margin-top: var(--sp-5);
}

.unit-block__title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--navy-700);
  padding-bottom: var(--sp-2);
  border-bottom: 2px solid var(--navy-100);
  margin-bottom: var(--sp-3);
}

.topic-grid {
  display: grid;
  gap: var(--sp-3);
}

.topic-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  text-align: left;
  min-height: var(--touch);
  padding: var(--sp-4);
  border: 1px solid var(--ink-200);
  border-radius: var(--radius-sm);
  background: var(--white);

    }

    var fields = AE.topics.fieldsOf(topic, "initial");
    var task = a.taskFields || {};
    fields.forEach(function (f) {
      var m = checkText(task[f.key], f.min, f.label);
      if (m) errors["taskFields." + f.key] = m;
    });

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 토론 단계 (명세 4.1 화면4) */
  function validateDiscussion(discussion) {
    var errors = {};
    var d = discussion || {};
    var msg = checkText(d.newInsight, LIMITS.insightMin, "새롭게 알게 된 점");
    if (msg) errors.newInsight = msg;
    if (d.completed !== true) errors.completed = "«토론을 마쳤어요» 를 확인해 주세요.";
    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 최종 판단 단계 (명세 4.1 화면5) */
  function validateFinal(topic, answer, principle) {
    var errors = {};
    var a = answer || {};

    if (!text(a.choice)) errors.choice = "최종 선택을 골라 주세요.";
    else if (topic.initial.choices.indexOf(text(a.choice)) === -1) {
      errors.choice = "최종 선택을 골라 주세요.";
    }

    if (topic.final.reason) {
      var msg = checkText(a.reason, topic.final.reason.min, "최종 이유");
      if (msg) errors.reason = msg;
    }

    if (CHANGE_TYPES.indexOf(text(a.changeType)) === -1) {
      errors.changeType = "토론 후 생각이 어떻게 되었는지 골라 주세요.";
    }

    var fields = AE.topics.fieldsOf(topic, "final");
    var task = a.taskFields || {};
    fields.forEach(function (f) {
      var m = checkText(task[f.key], f.min, f.label);
      if (m) errors["taskFields." + f.key] = m;
    });

    var pm = checkText(principle, LIMITS.principleMin, "나의 AI 활용 원칙");
    if (pm) errors.personalPrinciple = pm;

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /** 제출 직전 전체 검사 (명세 4.1 화면6) */
  function validateAll(topic, state) {
    var errors = {};
    function merge(prefix, result) {
      Object.keys(result.errors).forEach(function (k) {
        errors[prefix + k] = result.errors[k];
      });
    }
    merge("student.", validateStudent(state.student));
    merge("initial.", validateInitial(topic, state.initial));
    merge("discussion.", validateDiscussion(state.discussion));
    merge("final.", validateFinal(topic, state.final, state.personalPrinciple));
    if (state.honestyConfirmed !== true) {
      errors.honestyConfirmed = "정직성 확인에 체크해 주세요.";
    }
    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 보낼 자료 만들기 (명세 7.3)                                           */
  /* ------------------------------------------------------------------ */

  /** 추가 칸을 정해진 키만 남기고 정리한다(모르는 키는 버린다). */
  function pickTaskFields(topic, phase, values) {
    var out = {};
    var src = values || {};
    AE.topics.fieldsOf(topic, phase).forEach(function (f) {
      if (Object.prototype.hasOwnProperty.call(src, f.key)) {
        out[f.key] = clip(src[f.key]);
      }
    });
    return out;
  }

  /** 현지 시각을 +09:00 형태로 (명세 7.3 clientSubmittedAt) */
  function localIsoString(date) {
    var d = date || new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var offsetMin = -d.getTimezoneOffset();
    var sign = offsetMin >= 0 ? "+" : "-";
    var abs = Math.abs(offsetMin);
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      "T" +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds()) +
      sign +
      two(Math.floor(abs / 60)) +
      ":" +
      two(abs % 60)
    );
  }

  /**
   * 학생 화면의 상태 → 서버로 보낼 JSON (명세 7.3 그대로)
   * 서버는 여기서 온 이름·시간을 그대로 믿지 않고 다시 검사한다.
   */
  function buildSubmission(state, options) {
    var opt = options || {};
    var topic = AE.topics.byId(state.topicId);
    var s = state.student || {};
    var id = text(s.studentId);
    var seat = parseStudentId(id) || {};
    return {
      action: "submit",
      schemaVersion: SCHEMA_VERSION,
      lessonId: AE.LESSON_ID || "lesson3_9_1",
      submissionId: text(state.submissionId) || "",
      student: {
        studentId: id,
        name: clip(s.name, LIMITS.nameMax),
        /* 학번에서 갈라 낸 값도 함께 보낸다.
           선생님 화면에서 학년·반으로 거르고 자리순으로 정렬하는 데 쓴다. */
        grade: seat.grade,
        classNumber: seat.classNumber,
        studentNumber: seat.studentNumber
      },
      topicId: state.topicId,
      topicTitle: topic ? topic.title : "",
      initialAnswer: {
        choice: clip(state.initial && state.initial.choice),
        reason: clip(state.initial && state.initial.reason),
        taskFields: pickTaskFields(topic, "initial", state.initial && state.initial.taskFields)
      },
      discussion: {
        newInsight: clip(state.discussion && state.discussion.newInsight),
        completed: !!(state.discussion && state.discussion.completed)
      },
      finalAnswer: {
        choice: clip(state.final && state.final.choice),
        reason: clip(state.final && state.final.reason),
        changeType: clip(state.final && state.final.changeType),
        taskFields: pickTaskFields(topic, "final", state.final && state.final.taskFields)
      },
      personalPrinciple: clip(state.personalPrinciple),
      honestyConfirmed: state.honestyConfirmed === true,
      clientSubmittedAt: opt.now ? localIsoString(opt.now) : localIsoString()
    };
  }

  /* ------------------------------------------------------------------ */
  /* 중복 제출 기준 (명세 7.6)                                             */
  /* ------------------------------------------------------------------ */

  /**
   * 둘이 같으면 «같은 학생의 같은 활동» 이다.
   *   studentId + topicId
   *
   * · 이름은 넣지 않는다. 동명이인을 같은 학생으로 보지 않기 위해서다.
   *   (반대로 학생이 이름을 고쳐 다시 내도 같은 제출로 본다)
   * · 학번 하나가 학년·반·번호를 모두 담고 있으므로 이것으로 충분하다.
   * · 대신 «학년도가 바뀌면» 10312 가 다시 생긴다.
   *   해마다 새 폴더를 쓰면 섞이지 않는다. apps-script/README.md 참고.
   *
   * ★ 이 규칙은 apps-script/student/Code.gs 의 dedupeKey_ 와 «뜻이 같아야» 한다.
   *   한쪽만 바뀌면 재제출이 갱신되지 않고 새로 쌓인다.
   *   tests/apps-script.test.js 가 두 판단이 같은지 자동으로 확인한다.
   */
  function dedupeKey(sub) {
    var s = (sub && sub.student) || {};
    return [text(s.studentId), text(sub && sub.topicId)].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 읽기 — 교사용                                               */
  /* ------------------------------------------------------------------ */

  /** 빠진 칸이 있어도 화면이 깨지지 않도록 형태를 맞춘다. */
  function normalize(raw) {
    var r = raw || {};
    var s = r.student || {};
    var id = text(s.studentId);
    /* 학년·반·번호가 빠져 있으면 학번에서 갈라 낸다 */
    var seat = parseStudentId(id);
    if (!seat) {
      seat = {
        grade: toInt(s.grade),
        classNumber: toInt(s.classNumber),
        studentNumber: toInt(s.studentNumber)
      };
      /* 거꾸로, 학번 없이 저장된 옛 자료라면 학년·반·번호로 학번을 되살린다 */
      if (!id) id = composeStudentId(seat);
    }
    return {
      submissionId: text(r.submissionId),
      student: {
        studentId: id,
        name: text(s.name),
        grade: seat.grade,
        classNumber: seat.classNumber,
        studentNumber: seat.studentNumber
      },
      topicId: text(r.topicId),
      topicTitle: text(r.topicTitle) || AE.topics.titleOf(r.topicId),
      initialAnswer: {
        choice: text(r.initialAnswer && r.initialAnswer.choice),
        reason: text(r.initialAnswer && r.initialAnswer.reason),
        taskFields: (r.initialAnswer && r.initialAnswer.taskFields) || {}
      },
      discussion: {
        newInsight: text(r.discussion && r.discussion.newInsight),
        completed: !!(r.discussion && r.discussion.completed)
      },
      finalAnswer: {
        choice: text(r.finalAnswer && r.finalAnswer.choice),
        reason: text(r.finalAnswer && r.finalAnswer.reason),
        changeType: text(r.finalAnswer && r.finalAnswer.changeType),
        taskFields: (r.finalAnswer && r.finalAnswer.taskFields) || {}
      },
      personalPrinciple: text(r.personalPrinciple),
      honestyConfirmed: r.honestyConfirmed === true,
      teacherMemo: text(r.teacherMemo),
      clientSubmittedAt: text(r.clientSubmittedAt),
      serverSubmittedAt: text(r.serverSubmittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      status: text(r.status) || "완료"
    };
  }

  /** 정렬용 숫자 — 학번이 곧 순서다 (10312) */
  function seatOrder(sub) {
    var s = (sub && sub.student) || {};
    var n = parseInt(text(s.studentId), 10);
    if (!isNaN(n)) return n;
    /* 학번이 없는 옛 자료를 대비한 뒷길 */
    var g = isNaN(s.grade) ? 0 : s.grade;
    var c = isNaN(s.classNumber) ? 0 : s.classNumber;
    var no = isNaN(s.studentNumber) ? 0 : s.studentNumber;
    return g * 10000 + c * 100 + no;
  }

  /** 「1학년 3반 12번」 */
  function seatLabel(sub) {
    var s = (sub && sub.student) || {};
    var parts = [];
    if (!isNaN(s.grade)) parts.push(s.grade + "학년");
    if (!isNaN(s.classNumber)) parts.push(s.classNumber + "반");
    if (!isNaN(s.studentNumber)) parts.push(s.studentNumber + "번");
    return parts.join(" ");
  }

  /** 「10312 홍길동」 — 표와 상세에서 학생을 가리키는 짧은 이름 */
  function studentLabel(sub) {
    var s = (sub && sub.student) || {};
    return [text(s.studentId), text(s.name)].filter(Boolean).join(" ");
  }

  /* ------------------------------------------------------------------ */
  /* 요약 (명세 6.3)                                                      */
  /* ------------------------------------------------------------------ */

  /**
   * 숫자로 «윤리 점수» 를 만들지 않는다. 세는 것만 한다(명세 6.3 마지막 문단).
   */
  function summarize(subs) {
    var list = subs || [];
    var byTopic = {};
    var changeTypeCounts = {};
    var students = {};

    CHANGE_TYPES.forEach(function (c) {
      changeTypeCounts[c] = 0;
    });

    list.forEach(function (sub) {
      var tid = sub.topicId || "(주제 없음)";
      byTopic[tid] = (byTopic[tid] || 0) + 1;

      var ct = sub.finalAnswer && sub.finalAnswer.changeType;
      if (ct) changeTypeCounts[ct] = (changeTypeCounts[ct] || 0) + 1;

      var s = sub.student || {};
      students[String(s.studentId || [s.grade, s.classNumber, s.studentNumber].join("-"))] = true;
    });

    return {
      totalSubmissions: list.length,
      uniqueStudents: Object.keys(students).length,
      byTopic: byTopic,
      changeTypeCounts: changeTypeCounts
    };
  }

  /** 선택형 문항의 응답 분포 (명세 6.6) */
  function choiceCounts(subs, topicId, phase) {
    var topic = AE.topics.byId(topicId);
    if (!topic) return [];
    var counts = {};
    topic.initial.choices.forEach(function (c) {
      counts[c] = 0;
    });
    (subs || []).forEach(function (sub) {
      if (sub.topicId !== topicId) return;
      var ans = phase === "initial" ? sub.initialAnswer : sub.finalAnswer;
      var choice = ans && ans.choice;
      if (choice && Object.prototype.hasOwnProperty.call(counts, choice)) counts[choice] += 1;
      else if (choice) counts[choice] = (counts[choice] || 0) + 1;
    });
    var total = 0;
    Object.keys(counts).forEach(function (k) {
      total += counts[k];
    });
    return Object.keys(counts).map(function (k) {
      return {
        label: k,
        count: counts[k],
        percent: total > 0 ? Math.round((counts[k] / total) * 1000) / 10 : 0
      };
    });
  }

  /* ------------------------------------------------------------------ */
  /* CSV (명세 6.7)                                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 엑셀 수식 주입 막기.
   * = + - @ 또는 탭·캐리지리턴으로 시작하는 값 앞에 작은따옴표를 붙이면
   * 엑셀이 «글자» 로 읽는다. 학생이 =1+1 이라고 써도 계산되지 않는다.
   */
  function guardFormula(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (s.length === 0) return s;
    if (/^[=+\-@\t\r]/.test(s)) return "'" + s;
    return s;
  }

  /** 한 칸을 CSV 규칙에 맞게 감싼다. */
  function csvCell(value) {
    var s = guardFormula(value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /**
   * 지금 화면에 보이는 제출들에 필요한 열을 만든다.
   * 고정 열 + 주제별 추가 칸(있는 것만).
   */
  function csvColumns(subs) {
    var cols = [
      { key: "serverSubmittedAt", label: "제출 시각" },
      { key: "serverUpdatedAt", label: "최종 수정 시각" },
      { key: "studentId", label: "학번" },
      { key: "name", label: "이름" },
      { key: "grade", label: "학년" },
      { key: "classNumber", label: "반" },
      { key: "studentNumber", label: "번호" },
      { key: "topicId", label: "주제 ID" },
      { key: "topicTitle", label: "주제" },
      { key: "initialChoice", label: "최초 판단" },
      { key: "initialReason", label: "최초 이유" },
      { key: "newInsight", label: "토론에서 새롭게 알게 된 점" },
      { key: "finalChoice", label: "최종 판단" },
      { key: "finalReason", label: "최종 이유" },
      { key: "changeType", label: "생각 변화" },
      { key: "personalPrinciple", label: "나의 AI 활용 원칙" },
      { key: "honestyConfirmed", label: "정직성 확인" },
      { key: "status", label: "제출 상태" },
      { key: "teacherMemo", label: "교사 메모" }
    ];

    /* 화면에 있는 주제들의 추가 칸을 열로 펼친다.
       주제가 섞여 있어도 열 이름이 겹치지 않도록 주제 ID 를 앞에 붙인다. */
    var seen = {};
    (subs || []).forEach(function (sub) {
      if (seen[sub.topicId]) return;
      seen[sub.topicId] = true;
      var topic = AE.topics.byId(sub.topicId);
      if (!topic) return;
      AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
        cols.push({
          key: "initial:" + topic.id + ":" + f.key,
          label: "[" + topic.id + "] 최초-" + AE.topics.labelOf(f)
        });
      });
      AE.topics.fieldsOf(topic, "final").forEach(function (f) {
        cols.push({
          key: "final:" + topic.id + ":" + f.key,
          label: "[" + topic.id + "] 최종-" + AE.topics.labelOf(f)
        });
      });
    });

    return cols;
  }

  /** 열 하나의 값을 제출에서 꺼낸다. */
  function cellValue(sub, key) {
    if (key.indexOf(":") !== -1) {
      var parts = key.split(":");
      var phase = parts[0];
      var topicId = parts[1];
      var fieldKey = parts[2];
      if (sub.topicId !== topicId) return "";
      var ans = phase === "initial" ? sub.initialAnswer : sub.finalAnswer;
      var tf = (ans && ans.taskFields) || {};
      return tf[fieldKey] === undefined ? "" : String(tf[fieldKey]);
    }
    var s = sub.student || {};
    switch (key) {
      case "studentId":
        return s.studentId || "";
      case "grade":
        return isNaN(s.grade) ? "" : String(s.grade);
      case "classNumber":
        return isNaN(s.classNumber) ? "" : String(s.classNumber);
      case "studentNumber":
        return isNaN(s.studentNumber) ? "" : String(s.studentNumber);
      case "name":
        return s.name || "";
      case "initialChoice":
        return (sub.initialAnswer && sub.initialAnswer.choice) || "";
      case "initialReason":
        return (sub.initialAnswer && sub.initialAnswer.reason) || "";
      case "newInsight":
        return (sub.discussion && sub.discussion.newInsight) || "";
      case "finalChoice":
        return (sub.finalAnswer && sub.finalAnswer.choice) || "";
      case "finalReason":
        return (sub.finalAnswer && sub.finalAnswer.reason) || "";
      case "changeType":
        return (sub.finalAnswer && sub.finalAnswer.changeType) || "";
      case "honestyConfirmed":
        return sub.honestyConfirmed ? "확인함" : "";
      default:
        return sub[key] === undefined || sub[key] === null ? "" : String(sub[key]);
    }
  }

  /**
   * CSV 본문을 만든다. 맨 앞의 ﻿ 가 «UTF-8 BOM» 이다.
   * 이것이 있어야 엑셀이 한글을 깨뜨리지 않고 연다(명세 6.7).
   */
  function toCsv(subs) {
    var cols = csvColumns(subs);
    var lines = [];
    lines.push(
      cols
        .map(function (c) {
          return csvCell(c.label);
        })
        .join(",")
    );
    (subs || []).forEach(function (sub) {
      lines.push(
        cols
          .map(function (c) {
            return csvCell(cellValue(sub, c.key));
          })
          .join(",")
      );
    });
    return "﻿" + lines.join("\r\n") + "\r\n";
  }

  /** 파일 이름 — 예) AI디지털윤리_control-1_1학년3반_2026-08-17.csv (명세 6.7) */
  function csvFileName(filters, now) {
    var d = now || new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var date = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
    var parts = ["AI디지털윤리"];
    if (filters && filters.topicId) parts.push(filters.topicId);
    var seat = "";
    if (filters && filters.grade) seat += filters.grade + "학년";
    if (filters && filters.classNumber) seat += filters.classNumber + "반";
    if (seat) parts.push(seat);
    parts.push(date);
    /* 파일 이름에 쓸 수 없는 글자를 없앤다(윈도우 기준) */
    return parts.join("_").replace(/[\\/:*?"<>|]/g, "") + ".csv";
  }

  /**
   * 오류 목록에 쓸 «어디의 무엇인지» 한 줄.
   *   "최초 판단 · 빠진 코드 한 줄 — 이 칸을 채워 주세요."
   * validateAll 이 준 열쇠(initial.taskFields.missingLine)를 사람 말로 바꾼다.
   */
  function describeError(topic, key, message) {
    var sections = {
      student: "학생 정보",
      initial: "최초 판단",
      discussion: "토론",
      final: "최종 판단",
      honestyConfirmed: "정직성 확인"
    };
    var head = key.split(".")[0];
    var section = sections[head] || "";
    var fieldName = "";

    var mark = "taskFields.";
    var at = key.indexOf(mark);
    if (at !== -1 && topic) {
      var fieldKey = key.slice(at + mark.length);
      var phase = head === "initial" ? "initial" : "final";
      AE.topics.fieldsOf(topic, phase).forEach(function (f) {
        if (f.key === fieldKey) fieldName = AE.topics.labelOf(f);
      });
    } else if (/personalPrinciple$/.test(key)) {
      fieldName = "나의 AI 활용 원칙";
    }

    return (section ? section + " · " : "") + (fieldName ? fieldName + " — " : "") + message;
  }

  AE.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    toInt: toInt,
    josa: josa,
    describeError: describeError,
    validateStudent: validateStudent,
    validateInitial: validateInitial,
    validateDiscussion: validateDiscussion,
    validateFinal: validateFinal,
    validateAll: validateAll,
    buildSubmission: buildSubmission,
    localIsoString: localIsoString,
    dedupeKey: dedupeKey,
    normalize: normalize,
    parseStudentId: parseStudentId,
    composeStudentId: composeStudentId,
    describeStudentId: describeStudentId,
    seatOrder: seatOrder,
    seatLabel: seatLabel,
    studentLabel: studentLabel,
    summarize: summarize,
    choiceCounts: choiceCounts,
    guardFormula: guardFormula,
    csvCell: csvCell,
    csvColumns: csvColumns,
    cellValue: cellValue,
    toCsv: toCsv,
    csvFileName: csvFileName
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = AE.schema;
  }
})();
    </script>

    <script data-from="student/s00-core.js">
/**
 * 학생용 코어 — 이름 공간과 작은 도구들
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.AE 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → shared/constants → shared/topics → shared/schema
 *   → s00-core → s10-ui → s20-store → s30-api → s40-timer → s50-screens → s90-app
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});

  /** 빈 상태 — 새 주제를 열 때의 출발점 */
  function emptyState(topicId) {
    return {
      version: 1,
      topicId: topicId || "",
      step: 1,
      student: { studentId: "", name: "" },
      initial: { choice: "", reason: "", taskFields: {} },
      discussion: { newInsight: "", completed: false },
      final: { choice: "", reason: "", changeType: "", taskFields: {} },
      personalPrinciple: "",
      honestyConfirmed: false,
      submissionId: "",
      submitted: null
    };
  }

  /**
   * 저장해 둔 자료를 지금 형태에 맞춘다.
   * 예전에 저장한 자료에 빠진 칸이 있어도 화면이 깨지지 않게 한다.
   */
  function normalizeState(raw, topicId) {
    var base = emptyState(topicId);
    var r = raw || {};
    base.topicId = r.topicId || topicId || "";
    /* 0 = 시작 화면, 1~5 = 활동 단계, 6 = 제출 완료 */
    base.step = typeof r.step === "number" && r.step >= 0 && r.step <= 6 ? r.step : 1;
    ["studentId", "name"].forEach(function (k) {
      if (r.student && r.student[k] !== undefined && r.student[k] !== null) {
        base.student[k] = String(r.student[k]);
      }
    });
    if (r.initial) {
      base.initial.choice = String(r.initial.choice || "");
      base.initial.reason = String(r.initial.reason || "");
      base.initial.taskFields = r.initial.taskFields || {};
    }
    if (r.discussion) {
      base.discussion.newInsight = String(r.discussion.newInsight || "");
      base.discussion.completed = r.discussion.completed === true;
    }
    if (r.final) {
      base.final.choice = String(r.final.choice || "");
      base.final.reason = String(r.final.reason || "");
      base.final.changeType = String(r.final.changeType || "");
      base.final.taskFields = r.final.taskFields || {};
    }
    base.personalPrinciple = String(r.personalPrinciple || "");
    base.honestyConfirmed = r.honestyConfirmed === true;
    base.submissionId = String(r.submissionId || "");
    base.submitted = r.submitted || null;
    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    var s = state;
    if (s.initial.choice || s.initial.reason) return true;
    if (s.discussion.newInsight) return true;
    if (s.final.choice || s.final.reason || s.final.changeType) return true;
    if (s.personalPrinciple) return true;
    var any = false;
    [s.initial.taskFields, s.final.taskFields].forEach(function (tf) {
      Object.keys(tf || {}).forEach(function (k) {
        if (String(tf[k] || "").trim()) any = true;
      });
    });
    return any;
  }

  /** 주소창의 ?topic= 값을 읽는다. 모르는 값이면 null. */
  function topicFromQuery() {
    if (typeof location === "undefined") return null;
    var search = location.search || "";
    var m = search.match(/[?&]topic=([^&]+)/);
    if (!m) return null;
    var id = decodeURIComponent(m[1]);
    return AE.topics.byId(id) ? id : null;
  }

  /** 시각을 「2026-08-17 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  S.emptyState = emptyState;
  S.normalizeState = normalizeState;
  S.hasContent = hasContent;
  S.topicFromQuery = topicFromQuery;
  S.formatTime = formatTime;

  if (typeof module !== "undefined" && module.exports) module.exports = S;
})();
    </script>
    <script data-from="student/s10-ui.js">
/**
 * 화면 부품 (명세 9.1 · 9.3)
 *
 * 여기서 만드는 요소는 모두 «텍스트로» 넣는다(textContent).
 * innerHTML 에 사람이 쓴 글을 넣지 않는다 — 스크립트가 섞여 들어갈 수 없게 하기 위해서다.
 *
 * 접근성 약속
 *   · 모든 입력에는 <label for> 을 붙인다
 *   · 오류는 색이 아니라 «아이콘 + 글자» 로도 알린다
 *   · 글자 수 안내는 aria-live 로 시끄럽게 읽지 않는다(입력 중 매 글자 낭독 방지)
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return (prefix || "f") + "-" + uid;
  }

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  /**
   * 요소 하나를 만든다.
   *   el("p", { class: "note", text: "안녕" })
   *   el("button", { class: "btn", text: "다음", on: { click: fn }, attrs: { type: "button" } })
   */
  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /** 카드 한 장 */
  function card(opts, children) {
    var o = opts || {};
    var head = [];
    if (o.eyebrow) head.push(el("p", { class: "card__eyebrow", text: o.eyebrow }));
    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));
    var parts = [];
    if (head.length) parts.push(el("div", { class: "card__head" }, head));
    parts.push(el("div", { class: "card__body" }, children || []));
    return el("section", { class: "card" + (o.tone ? " card--" + o.tone : "") }, parts);
  }

  /** 파이썬 코드 상자 — 들여쓰기와 줄바꿈을 그대로 지킨다(명세 2장 6번) */
  function codeBlock(code, caption) {
    var pre = el("pre", { class: "codeblock__pre", attrs: { tabindex: "0" } }, [
      el("code", { text: code })
    ]);
    return el("figure", { class: "codeblock" }, [
      caption ? el("figcaption", { class: "codeblock__cap", text: caption }) : null,
      pre
    ]);
  }

  /** 글자 수 안내 문구 */
  function countText(value, min) {
    var len = AE.schema.contentLength(value);
    if (!min) return "공백 제외 " + len + "자";
    return "공백 제외 " + len + "자 / 최소 " + min + "자";
  }

  /**
   * 서술형·단답형 입력 한 칸.
   * spec : { key, label, min, placeholder, help, multiline, mono, hints }
   * 돌려주는 것 : { root, input, setError, refresh }
   */
  function field(spec, value, onInput) {
    var id = nextId("in");
    var errId = id + "-err";
    var cntId = id + "-cnt";

    var input = spec.multiline
      ? el("textarea", {
          class: "input input--area" + (spec.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            rows: spec.rows || 3,
            placeholder: spec.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (AE.LIMITS && AE.LIMITS.textMax) || 1000
          }
        })
      : el("input", {
          class: "input" + (spec.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            type: "text",
            placeholder: spec.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (AE.LIMITS && AE.LIMITS.textMax) || 1000
          }
        });
    input.value = value || "";

    var counter = el("p", { class: "field__count", id: cntId, text: countText(input.value, spec.min) });
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

    function refresh() {
      counter.textContent = countText(input.value, spec.min);
      var enough = !spec.min || AE.schema.contentLength(input.value) >= spec.min;
      counter.className = "field__count" + (enough ? " field__count--ok" : "");
    }

    input.addEventListener("input", function () {
      refresh();
      if (onInput) onInput(input.value);
    });

    var children = [
      el("label", { class: "field__label", text: spec.label, attrs: { for: id } }),
      spec.help ? el("p", { class: "field__help", text: spec.help }) : null
    ];

    /* 힌트 조각 — 정답이 아니라 «생각을 여는 예시» 라고 분명히 적는다(명세 5.4) */
    if (spec.hints && spec.hints.length) {
      var chips = spec.hints.map(function (hint) {
        return el("button", {
          class: "chip",
          text: hint,
          attrs: { type: "button", "aria-label": "예시 넣기: " + hint },
          on: {
            click: function () {
              input.value = input.value ? input.value + " " + hint : hint;
              refresh();
              if (onInput) onInput(input.value);
              input.focus();
            }
          }
        });
      });
      children.push(
        el("div", { class: "chips" }, [
          el("span", { class: "chips__note", text: "예시(정답 아님):" })
        ].concat(chips))
      );
    }

    children.push(input, counter, error);

    var rootEl = el("div", { class: "field" }, children);

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", cntId + " " + errId);
        rootEl.classList.add("field--invalid");
      } else {
        error.textContent = "";
        error.hidden = true;
        input.removeAttribute("aria-invalid");
        input.setAttribute("aria-describedby", cntId);
        rootEl.classList.remove("field--invalid");
      }
    }

    refresh();
    return { root: rootEl, input: input, setError: setError, refresh: refresh };
  }

  /**
   * 선택형(라디오) 한 묶음.
   * 정답·오답처럼 보이지 않도록 색으로 구분하지 않는다(명세 9.1).
   */
  function radioGroup(spec, value, onChange) {
    var name = nextId("rg");
    var errId = name + "-err";
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

    var options = spec.options.map(function (opt, i) {
      var id = name + "-" + i;
      var radio = el("input", {
        class: "choice__radio",
        id: id,
        attrs: { type: "radio", name: name, value: opt }
      });
      radio.checked = value === opt;
      radio.addEventListener("change", function () {
        if (radio.checked && onChange) onChange(opt);
      });
      return el("div", { class: "choice" }, [
        radio,
        el("label", { class: "choice__label", attrs: { for: id } }, [
          el("span", { class: "choice__mark", attrs: { "aria-hidden": "true" } }),
          el("span", { class: "choice__text", text: opt })
        ])
      ]);
    });

    var legend = el("legend", { class: "field__label", text: spec.legend });
    var fieldset = el("fieldset", { class: "choices", attrs: { "aria-describedby": errId } }, [
      legend
    ].concat(options, [error]));

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
        fieldset.classList.add("choices--invalid");
      } else {
        error.textContent = "";
        error.hidden = true;
        fieldset.classList.remove("choices--invalid");
      }
    }

    return { root: fieldset, setError: setError };
  }

  /** 체크박스 한 개 */
  function checkbox(labelText, checked, onChange) {
    var id = nextId("cb");
    var errId = id + "-err";
    var box = el("input", { id: id, attrs: { type: "checkbox" }, class: "check__box" });
    box.checked = !!checked;
    box.addEventListener("change", function () {
      if (onChange) onChange(box.checked);
    });
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });
    var rootEl = el("div", { class: "check" }, [
      el("div", { class: "check__row" }, [
        box,
        el("label", { class: "check__label", text: labelText, attrs: { for: id } })
      ]),
      error
    ]);
    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
      } else {
        error.textContent = "";
        error.hidden = true;
      }
    }
    return { root: rootEl, input: box, setError: setError };
  }

  /** 읽기 전용으로 다시 보여 주는 줄 (검토 화면 · 최종 화면) */
  function readback(label, value) {
    return el("div", { class: "readback" }, [
      el("p", { class: "readback__label", text: label }),
      el("p", { class: "readback__value", text: value || "(작성하지 않음)" })
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */

  function toast(message, kind) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast" + (kind ? " toast--" + kind : ""), text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 스크린 리더에게 한 번만 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  /** 첫 번째 오류 칸으로 이동한다 */
  function focusFirstError(container) {
    var target = container.querySelector("[aria-invalid='true'], .choices--invalid input");
    if (target && typeof target.focus === "function") {
      target.focus();
      if (typeof target.scrollIntoView === "function") {
        target.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }
  }

  S.ui = {
    $: $,
    el: el,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    field: field,
    radioGroup: radioGroup,
    checkbox: checkbox,
    readback: readback,
    toast: toast,
    announce: announce,
    focusFirstError: focusFirstError,
    countText: countText
  };
})();

    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 2장 5번 · 7.1 · 7.7)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답변의 최종 저장소가 아니다. 최종 저장은 서버가 한다.
 *
 * 담는 것
 *   <앞머리>:student            학생 정보 (주제를 바꿔도 다시 입력하지 않게)
 *   <앞머리>:draft:<주제ID>     주제별 작성 내용과 현재 단계
 *   <앞머리>:session            마지막으로 열었던 주제
 *   <앞머리>:pending            서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다(명세 11장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});

  var PREFIX = (AE.CONFIG && AE.CONFIG.autosaveKeyPrefix) || "ai-ethics-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }
  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      return false;
    }
  }
  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }
  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function (topicId) {
      return PREFIX + ":draft:" + topicId;
    },
    session: function () {
      return PREFIX + ":session";
    },
    pending: function () {
      return PREFIX + ":pending";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  /**
   * 선생님이 알려 준 «제출 주소».
   * 주제마다 다시 넣지 않도록 학생 정보와 같은 자리에 따로 기억해 둔다.
   * (다른 학생에게 기기를 넘길 때도 주소는 그대로 두는 편이 편하다 — 같은 반이니까)
   */
  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return {
      studentId: String(v.studentId || ""),
      name: String(v.name || "")
    };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 주제별 작성 내용 ------------------------------ */

  function loadDraft(topicId) {
    if (!topicId) return null;
    var raw = readJson(keys.draft(topicId), null);
    if (!raw) return null;
    return S.normalizeState(raw, topicId);
  }

  function saveDraft(state) {
    if (!state || !state.topicId) return;
    safeSet(keys.draft(state.topicId), JSON.stringify(state));
    safeSet(keys.session(), JSON.stringify({ topicId: state.topicId, step: state.step }));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft(topicId) {
    if (!topicId) return;
    safeRemove(keys.draft(topicId));
  }

  function loadSession() {
    var v = readJson(keys.session(), null);
    if (!v || !v.topicId) return null;
    if (!AE.topics.byId(v.topicId)) return null;
    return v;
  }

  function clearSession() {
    safeRemove(keys.session());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 지우는 것 : 학생 정보 · 마지막으로 열었던 주제 · 6개 주제의 작성 내용
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   *   연결이 돌아오면 다시 보낼 수 있게 그것만 남긴다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.session());
    (AE.topics && AE.topics.all ? AE.topics.all : []).forEach(function (t) {
      safeRemove(keys.draft(t.id));
    });
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /**
   * 서버로 보내지 못한 제출을 담아 둔다.
   * 같은 학생·같은 주제는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게).
   */
  function queuePending(payload) {
    var list = readJson(keys.pending(), []);
    if (!Array.isArray(list)) list = [];
    var key = AE.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return AE.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = AE.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return AE.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    loadSession: loadSession,
    clearSession: clearSession,
    clearAll: clearAll,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();

    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 7.1 · 7.3 · 7.4 · 7.7)
 *
 * 길은 둘뿐이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl 로 보낸다.
 *
 * 실패하면 절대 답안을 버리지 않는다. 임시 저장에 남기고 [다시 제출] 을 열어 준다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 이유
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(AE.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(AE.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 같은 규칙으로 «같은 학생의 같은 주제» 는 갱신한다(명세 7.6).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = AE.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();
    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (AE.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }
    var record = JSON.parse(JSON.stringify(payload));
    delete record.action;
    record.status = "완료";
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      record.teacherMemo = list[found].teacherMemo || "";
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      record.teacherMemo = "";
      list.push(record);
    }
    writeDemoAll(list);
    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) {
      return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));
    }

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        var data;
        try {
          data = JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
        return data;
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return AE.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (AE.config.isDemo()) {
      /* 데모는 즉시 끝나지만, 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({
        ok: false,
        kind: "no-url",
        message: "제출 주소가 없습니다. 선생님이 알려 주신 주소를 넣어 주세요."
      });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다.
             내부 경로·스택은 서버가 애초에 보내지 않는다(명세 7.7). */
          message: (data && data.message) || AE.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: AE.MESSAGES.networkFail };
      }
    );
  }

  /** 데모 저장분을 모두 지운다(수업 준비용). */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();
    </script>
    <script data-from="student/s40-timer.js">
/**
 * 토론 타이머 (명세 4.1 화면4 · 9.3)
 *
 * 지켜야 할 것
 *   · 시간이 끝나도 «아무것도 지우지 않고, 자동 제출하지 않는다». 안내만 한다.
 *   · 남은 시간을 스크린 리더에 매초 읽어 주지 않는다. 1분·30초·종료에만 알린다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});

  function format(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /**
   * options : { seconds, onTick(remain), onNotice(message), onEnd() }
   * 돌려주는 것 : { start, pause, reset, dispose, isRunning, remain }
   */
  function create(options) {
    var o = options || {};
    var total = o.seconds || 180;
    var remain = total;
    var handle = null;
    /** 이미 알린 지점은 다시 알리지 않는다 */
    var announced = {};

    function tick() {
      remain -= 1;
      if (remain <= 0) {
        remain = 0;
        stop();
        if (o.onTick) o.onTick(remain);
        if (o.onNotice) o.onNotice("토론 시간이 끝났습니다. 이어서 작성해도 됩니다.");
        if (o.onEnd) o.onEnd();
        return;
      }
      if (o.onTick) o.onTick(remain);
      if (remain === 60 && !announced[60]) {
        announced[60] = true;
        if (o.onNotice) o.onNotice("1분 남았습니다.");
      }
      if (remain === 30 && !announced[30]) {
        announced[30] = true;
        if (o.onNotice) o.onNotice("30초 남았습니다.");
      }
    }

    function start() {
      if (handle || remain <= 0) return;
      handle = setInterval(tick, 1000);
    }

    function stop() {
      if (handle) {
        clearInterval(handle);
        handle = null;
      }
    }

    function reset() {
      stop();
      remain = total;
      announced = {};
      if (o.onTick) o.onTick(remain);
    }

    return {
      start: start,
      pause: stop,
      reset: reset,
      dispose: stop,
      isRunning: function () {
        return handle !== null;
      },
      remain: function () {
        return remain;
      },
      total: total
    };
  }

  S.timer = { create: create, format: format };

  if (typeof module !== "undefined" && module.exports) module.exports = S.timer;
})();
