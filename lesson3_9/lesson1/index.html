    <script data-from="student/s50-screens.js">
/**
 * 학생용 화면 6개 (명세 4.1)
 *
 *   0 시작        학생 정보 · 주제 고르기
 *   1 상황 확인   AI 코드/사례 읽기          (약 2분)
 *   2 개인 판단   선택 + 이유 + 주제별 칸    (약 2분)
 *   3 함께 토론   질문 · 3분 타이머 · 메모   (약 3분)
 *   4 최종 판단   최초 판단 다시 보기 + 확정 (약 2분)
 *   5 확인·제출   요약 · 정직성 확인 · 제출  (약 1분)
 *   6 제출 완료   내 제출 내용만 확인
 *
 * 화면마다 돌려주는 것
 *   { node, nextLabel, prevLabel, validate(), onEnter(), onLeave(), hideNav }
 *   validate() 는 문제가 없으면 null, 있으면 { 항목: "메시지" } 를 돌려준다.
 *
 * ★ 학습 내용은 여기에 적지 않는다. 전부 shared/topics.js 에서 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});
  var ui = S.ui;
  var el = ui.el;

  /* ------------------------------------------------------------------ */
  /* 공통 작은 부품                                                       */
  /* ------------------------------------------------------------------ */

  /** 학생 정보 한 칸 (짧은 입력 + 오류 자리) */
  function infoField(spec, value, onInput) {
    var id = "info-" + spec.key;
    var errId = id + "-err";
    var input;
    if (spec.options) {
      input = el("select", { class: "input input--short", id: id }, [].concat(
        [el("option", { text: spec.placeholder || "선택", attrs: { value: "" } })],
        spec.options.map(function (o) {
          return el("option", { text: o.label, attrs: { value: o.value } });
        })
      ));
    } else {
      input = el("input", {
        class: "input input--short",
        id: id,
        attrs: {
          type: spec.numeric ? "number" : "text",
          inputmode: spec.numeric ? "numeric" : null,
          min: spec.min !== undefined ? spec.min : null,
          max: spec.max !== undefined ? spec.max : null,
          step: spec.numeric ? "1" : null,
          maxlength: spec.maxlength || null,
          placeholder: spec.placeholder || "",
          autocomplete: "off"
        }
      });
    }
    input.value = value === undefined || value === null ? "" : String(value);
    input.addEventListener("input", function () {
      if (onInput) onInput(input.value);
    });
    input.addEventListener("change", function () {
      if (onInput) onInput(input.value);
    });

    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });
    var rootEl = el("div", { class: "field field--inline" }, [
      el("label", { class: "field__label", text: spec.label, attrs: { for: id } }),
      input,
      error
    ]);

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", errId);
        rootEl.classList.add("field--invalid");
      } else {
        error.textContent = "";
        error.hidden = true;
        input.removeAttribute("aria-invalid");
        input.removeAttribute("aria-describedby");
        rootEl.classList.remove("field--invalid");
      }
    }
    return { root: rootEl, input: input, setError: setError };
  }

  /** 주제의 추가 칸들을 한 번에 만든다. */
  function buildTaskFields(topic, phase, store, save) {
    var specs = AE.topics.fieldsOf(topic, phase);
    var made = {};
    var nodes = specs.map(function (spec) {
      var f = ui.field(spec, store[spec.key] || "", function (value) {
        store[spec.key] = value;
        save();
      });
      made[spec.key] = f;
      return f.root;
    });
    return { nodes: nodes, fields: made };
  }

  /** 화면 맨 위의 단계 안내 (「2/5 개인 판단 · 약 2분」) */
  function stepHeading(step) {
    var info = AE.STEPS[step];
    if (!info || !info.counted) return null;
    var label = step + "/5 " + info.label;
    return el("p", { class: "step-tag" }, [
      el("span", { class: "step-tag__num", text: label }),
      info.minutes ? el("span", { class: "step-tag__time", text: "약 " + info.minutes + "분" }) : null
    ]);
  }

  /** 오류 목록을 화면 위에 모아 보여 준다 */
  function errorSummary(messages) {
    if (!messages.length) return null;
    return el("div", { class: "alert alert--warn", attrs: { role: "alert" } }, [
      el("p", { class: "alert__title", text: "⚠ 아직 채우지 않은 항목이 있습니다" }),
      el(
        "ul",
        { class: "alert__list" },
        messages.map(function (m) {
          return el("li", { text: m });
        })
      )
    ]);
  }

  /* ================================================================== */
  /* 0. 시작 화면                                                        */
  /* ================================================================== */

  function startScreen(app) {
    var state = app.state;
    var fields = {};
    var selectedTopic = state.topicId || "";
    var topicError = el("p", { class: "field__error", attrs: { role: "alert", hidden: true } });

    /* 학생이 넣는 것은 «학번» 과 «이름» 둘뿐이다 */
    var infoSpecs = [
      {
        key: "studentId",
        label: "학번",
        numeric: true,
        maxlength: AE.LIMITS.studentIdDigits,
        placeholder: "예) 10312"
      },
      { key: "name", label: "이름", maxlength: AE.LIMITS.nameMax, placeholder: "예) 홍길동" }
    ];

    /* 학번을 풀어서 보여 준다 — 잘못 눌렀는지 학생이 바로 알 수 있게 */
    var seatEcho = el("p", { class: "seat-echo" });
    function refreshSeatEcho() {
      var said = AE.schema.describeStudentId(state.student.studentId);
      seatEcho.textContent = said ? "→ " + said + " 맞나요?" : "";
      seatEcho.hidden = !said;
    }

    var infoNodes = infoSpecs.map(function (spec) {
      var f = infoField(spec, state.student[spec.key], function (value) {
        state.student[spec.key] = value;
        S.store.saveStudent(state.student);
        if (spec.key === "studentId") refreshSeatEcho();
        app.save();
      });
      fields[spec.key] = f;
      if (spec.key === "studentId") f.root.appendChild(seatEcho);
      return f.root;
    });
    refreshSeatEcho();

    /* 주제 카드 — 단원별로 나눈다 */
    var cardButtons = {};
    function paintSelection() {
      Object.keys(cardButtons).forEach(function (id) {
        var pressed = id === selectedTopic;
        cardButtons[id].setAttribute("aria-pressed", pressed ? "true" : "false");
        cardButtons[id].classList.toggle("topic-card--on", pressed);
      });
    }

    var unitBlocks = AE.topics.byUnit().map(function (unit) {
      var cards = unit.topics.map(function (topic) {
        var btn = el(
          "button",
          {
            class: "topic-card",
            attrs: { type: "button", "aria-pressed": "false" },
            on: {
              click: function () {
                selectedTopic = topic.id;
                paintSelection();
                topicError.hidden = true;
                ui.announce(topic.title + " 주제를 선택했습니다.");
              }
            }
          },
          [
            el("span", { class: "topic-card__id", text: topic.id }),
            el("span", { class: "topic-card__title", text: topic.title }),
            el("span", { class: "topic-card__concept", text: topic.concepts }),
            el(
              "span",
              { class: "topic-card__tags" },
              topic.competencies.map(function (c) {
                return el("span", { class: "tag", text: c });
              })
            )
          ]
        );
        cardButtons[topic.id] = btn;
        return btn;
      });
      return el("div", { class: "unit-block" }, [
        el("h3", { class: "unit-block__title", text: unit.title }),
        el("div", { class: "topic-grid" }, cards)
      ]);
    });
    paintSelection();

    var node = el("div", { class: "screen screen--start" }, [
      el("div", { class: "hero" }, [
        el("h1", { class: "hero__title", text: "프로그래밍으로 생각하는 AI·디지털 윤리" }),
        el("p", {
          class: "hero__desc",
          text: "AI가 만든 코드와 사용 상황을 살펴보고, 근거를 들어 판단해 봅시다."
        })
      ]),
      ui.card({ title: "내 정보" }, [
        el("div", { class: "info-grid" }, infoNodes),
        el("p", { class: "privacy", text: AE.MESSAGES.privacy }),
        /* 공용 태블릿을 넘겨받았을 때 — 앞 학생의 이름과 답이 남아 있으면 지운다 */
        el("div", { class: "handoff" }, [
          el("p", { class: "handoff__text", text: "앞사람의 답이 남아 있나요?" }),
          el("button", {
            class: "btn btn--tiny",
            text: "이 기기 비우고 처음부터",
            attrs: { type: "button" },
            on: {
              click: function () {
                var left = S.store.clearAll();
                var msg =
                  left > 0
                    ? "지웠습니다. 아직 보내지 못한 답안 " + left + "개는 남겨 두었습니다."
                    : "지웠습니다. 이름과 답을 새로 입력해 주세요.";
                ui.toast(msg);
                app.resetForNewStudent();
              }
            }
          })
        ])
      ]),
      ui.card(
        { title: "오늘의 활동 주제를 고르세요", desc: "선생님이 안내한 주제를 선택합니다." },
        unitBlocks.concat([topicError])
      )
    ]);

    function validate() {
      var errors = {};
      var res = AE.schema.validateStudent(state.student);
      Object.keys(fields).forEach(function (k) {
        fields[k].setError(res.errors[k] || null);
      });
      Object.keys(res.errors).forEach(function (k) {
        errors[k] = res.errors[k];
      });

      if (!selectedTopic) {
        topicError.textContent = "⚠ 활동 주제를 하나 골라 주세요.";
        topicError.hidden = false;
        errors.topicId = "활동 주제를 하나 골라 주세요.";
      } else {
        topicError.hidden = true;
      }

      if (Object.keys(errors).length === 0) {
        /* 주제를 바꿨다면 그 주제에 저장해 둔 내용을 이어서 쓴다 */
        app.switchTopic(selectedTopic);
        return null;
      }
      return errors;
    }

    return { node: node, nextLabel: "시작하기", prevLabel: null, validate: validate };
  }

  /* ================================================================== */
  /* 1. 상황 확인                                                        */
  /* ================================================================== */

  function situationScreen(app) {
    var topic = app.topic();
    var gate = AE.CONFIG.readGateSeconds || 5;
    var remain = gate;
    var handle = null;

    var body = [];
    (topic.situation.paragraphs || []).forEach(function (p) {
      body.push(el("p", { class: "para", text: p }));
    });
    if (topic.situation.code) {
      body.push(ui.codeBlock(topic.situation.code, topic.situation.codeCaption));
    }
    if (topic.situation.cases) {
      body.push(
        el(
          "ul",
          { class: "case-list" },
          topic.situation.cases.map(function (c) {
            return el("li", { class: "case" }, [
              el("span", { class: "case__label", text: c.label }),
              el("span", { class: "case__text", text: c.text })
            ]);
          })
        )
      );
    }
    (topic.situation.afterParagraphs || []).forEach(function (p) {
      body.push(el("p", { class: "para", text: p }));
    });

    var node = el("div", { class: "screen" }, [
      stepHeading(1),
      ui.card(
        {
          eyebrow: topic.unitTitle + " · " + topic.id,
          title: topic.title,
          desc: "연계 개념 — " + topic.concepts
        },
        body
      ),
      ui.card({ title: "핵심 질문", tone: "accent" }, [
        el("blockquote", { class: "quote", text: topic.coreQuestion })
      ]),
      el("p", { class: "gate-note", id: "gate-note", text: "잠시 읽어 보세요. " + gate + "초 후 다음으로 넘어갈 수 있습니다." })
    ]);

    function onEnter() {
      app.setNextEnabled(false);
      var note = node.querySelector("#gate-note");
      handle = setInterval(function () {
        remain -= 1;
        if (remain <= 0) {
          clearInterval(handle);
          handle = null;
          if (note) note.textContent = "다 읽었다면 [다음: 나의 판단] 을 눌러 주세요.";
          app.setNextEnabled(true);
          return;
        }
        if (note) note.textContent = "잠시 읽어 보세요. " + remain + "초 후 다음으로 넘어갈 수 있습니다.";
      }, 1000);
    }

    function onLeave() {
      if (handle) clearInterval(handle);
      handle = null;
      app.setNextEnabled(true);
    }

    return {
      node: node,
      nextLabel: "다음: 나의 판단",
      prevLabel: "주제 다시 고르기",
      validate: function () {
        return null;
      },
      onEnter: onEnter,
      onLeave: onLeave
    };
  }

  /* ================================================================== */
  /* 2. 개인 판단                                                        */
  /* ================================================================== */

  function initialScreen(app) {
    var topic = app.topic();
    var state = app.state;
    var made = { choice: null, reason: null, task: {} };

    var choice = ui.radioGroup(
      { legend: topic.initial.choiceLabel, options: topic.initial.choices },
      state.initial.choice,
      function (value) {
        state.initial.choice = value;
        app.save();
      }
    );
    made.choice = choice;

    var body = [choice.root];

    if (topic.initial.reason) {
      var reason = ui.field(
        {
          label: topic.initial.reason.label,
          min: topic.initial.reason.min,
          placeholder: topic.initial.reason.placeholder,
          multiline: true,
          rows: 4
        },
        state.initial.reason,
        function (value) {
          state.initial.reason = value;
          app.save();
        }
      );
      made.reason = reason;
      body.push(reason.root);
    }

    if (topic.initial.hintNotice) {
      body.push(el("p", { class: "hint-notice", text: topic.initial.hintNotice }));
    }

    var task = buildTaskFields(topic, "initial", state.initial.taskFields, app.save);
    made.task = task.fields;
    body = body.concat(task.nodes);

    var node = el("div", { class: "screen" }, [
      stepHeading(2),
      ui.card({ eyebrow: topic.id, title: "나의 판단", desc: topic.coreQuestion }, body)
    ]);

    function validate() {
      var res = AE.schema.validateInitial(topic, state.initial);
      made.choice.setError(res.errors.choice || null);
      if (made.reason) made.reason.setError(res.errors.reason || null);
      Object.keys(made.task).forEach(function (k) {
        made.task[k].setError(res.errors["taskFields." + k] || null);
      });
      return res.ok ? null : res.errors;
    }

    return { node: node, nextLabel: "다음: 함께 토론", prevLabel: "이전", validate: validate };
  }

  /* ================================================================== */
  /* 3. 함께 토론                                                        */
  /* ================================================================== */

  function discussionScreen(app) {
    var topic = app.topic();
    var state = app.state;

    var display = el("p", { class: "timer__time", text: S.timer.format(AE.CONFIG.discussionSeconds) });
    var status = el("p", { class: "timer__status", text: "아직 시작하지 않았습니다." });
    var startBtn;
    var timer = S.timer.create({
      seconds: AE.CONFIG.discussionSeconds,
      onTick: function (remain) {
        display.textContent = S.timer.format(remain);
      },
      onNotice: function (message) {
        status.textContent = message;
        ui.announce(message);
      },
      onEnd: function () {
        /* 시간이 끝나도 입력은 그대로 살아 있다 (명세 4.1 화면4) */
        startBtn.textContent = "다시 시작";
        display.classList.add("timer__time--done");
      }
    });

    startBtn = el("button", {
      class: "btn btn--ghost",
      text: "타이머 시작",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (timer.remain() <= 0) {
            timer.reset();
            display.classList.remove("timer__time--done");
          }
          if (timer.isRunning()) {
            timer.pause();
            startBtn.textContent = "이어서 시작";
            status.textContent = "잠시 멈췄습니다.";
          } else {
            timer.start();
            startBtn.textContent = "일시정지";
            status.textContent = "토론 중입니다. 시간이 끝나도 작성한 내용은 지워지지 않습니다.";
          }
        }
      }
    });

    var insight = ui.field(
      {
        label: "친구의 의견에서 새롭게 알게 된 점",
        min: AE.LIMITS.insightMin,
        placeholder: "예) 속도에 따라 정지 거리도 달라진다는 이야기를 들었다.",
        multiline: true,
        rows: 3
      },
      state.discussion.newInsight,
      function (value) {
        state.discussion.newInsight = value;
        app.save();
      }
    );

    var done = ui.checkbox("토론을 마쳤어요", state.discussion.completed, function (checked) {
      state.discussion.completed = checked;
      app.save();
    });

    var node = el("div", { class: "screen" }, [
      stepHeading(3),
      ui.card({ eyebrow: topic.id, title: "짝·모둠 토론", desc: topic.discussion.guide }, [
        el(
          "ol",
          { class: "qlist" },
          topic.discussion.questions.map(function (q) {
            return el("li", { class: "qlist__item", text: q });
          })
        ),
        el("div", { class: "timer" }, [
          el("div", { class: "timer__box" }, [
            el("p", { class: "timer__label", text: "토론 시간" }),
            display
          ]),
          el("div", { class: "timer__side" }, [startBtn, status])
        ])
      ]),
      ui.card({ title: "토론 메모" }, [insight.root, done.root])
    ]);

    function validate() {
      var res = AE.schema.validateDiscussion(state.discussion);
      insight.setError(res.errors.newInsight || null);
      done.setError(res.errors.completed || null);
      return res.ok ? null : res.errors;
    }

    return {
      node: node,
      nextLabel: "다음: 최종 판단",
      prevLabel: "이전",
      validate: validate,
      onLeave: function () {
        timer.dispose();
      }
    };
  }

  /* ================================================================== */
  /* 4. 최종 판단과 나의 원칙                                             */
  /* ================================================================== */

  function finalScreen(app) {
    var topic = app.topic();
    var state = app.state;
    var made = { choice: null, reason: null, change: null, task: {}, principle: null };

    /* 최초 판단 다시 보기 — 읽기 전용 */
    var initialBack = [ui.readback("최초 선택", state.initial.choice)];
    if (topic.initial.reason) {
      initialBack.push(ui.readback("최초 이유", state.initial.reason));
    }
    AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
      initialBack.push(ui.readback(AE.topics.labelOf(f), state.initial.taskFields[f.key]));
    });
    initialBack.push(ui.readback("토론에서 새롭게 알게 된 점", state.discussion.newInsight));

    var choice = ui.radioGroup(
      { legend: "최종 선택", options: topic.initial.choices },
      state.final.choice || "",
      function (value) {
        state.final.choice = value;
        app.save();
      }
    );
    made.choice = choice;

    var reason = ui.field(
      {
        label: topic.final.reason.label,
        min: topic.final.reason.min,
        placeholder: topic.final.reason.placeholder,
        multiline: true,
        rows: 4
      },
      state.final.reason,
      function (value) {
        state.final.reason = value;
        app.save();
      }
    );
    made.reason = reason;

    /* 생각 변화 — 자동 판정하지 않고 학생이 고른다 (명세 4.1 화면5) */
    var change = ui.radioGroup(
      { legend: "토론 후 생각이 바뀌었나요?", options: AE.CHANGE_TYPES },
      state.final.changeType,
      function (value) {
        state.final.changeType = value;
        app.save();
      }
    );
    made.change = change;

    var body = [choice.root, reason.root, change.root];

    if (topic.final.recordTitle) {
      body.push(el("h3", { class: "subhead", text: topic.final.recordTitle }));
      if (topic.final.recordIntro) body.push(el("p", { class: "para", text: topic.final.recordIntro }));
    }

    /* 문장 완성이 있으면 미리보기를 함께 보여 준다 */
    var previewNode = null;
    function refreshPreview() {
      if (!previewNode) return;
      previewNode.textContent = AE.topics.sentencePreview(topic, state.final.taskFields);
    }

    if (topic.final.sentence) {
      body.push(el("h3", { class: "subhead", text: topic.final.sentence.label }));
    }

    var task = buildTaskFields(topic, "final", state.final.taskFields, function () {
      app.save();
      refreshPreview();
    });
    made.task = task.fields;
    body = body.concat(task.nodes);

    if (topic.final.sentence) {
      previewNode = el("p", { class: "sentence__text" });
      refreshPreview();
      body.push(
        el("div", { class: "sentence" }, [
          el("p", { class: "sentence__label", text: "완성 문장 미리보기" }),
          previewNode
        ])
      );
    }

    /* 나의 AI 활용 원칙 */
    var principle = ui.field(
      {
        label: topic.principle.label,
        min: AE.LIMITS.principleMin,
        placeholder: topic.principle.placeholder,
        multiline: true,
        rows: 3
      },
      state.personalPrinciple,
      function (value) {
        state.personalPrinciple = value;
        app.save();
      }
    );
    made.principle = principle;

    var starterBtn = el("button", {
      class: "btn btn--tiny",
      text: "시작 문장 넣기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!principle.input.value.trim()) {
            principle.input.value = topic.principle.starter.replace(/\.\.\.$/, " ");
          } else {
            principle.input.value = topic.principle.starter.replace(/\.\.\.$/, " ") + principle.input.value;
          }
          state.personalPrinciple = principle.input.value;
          principle.refresh();
          app.save();
          principle.input.focus();
        }
      }
    });

    var principleTools = [starterBtn];
    if (topic.principle.fromSentence && topic.final.sentence) {
      principleTools.push(
        el("button", {
          class: "btn btn--tiny",
          text: "완성한 문장 가져오기",
          attrs: { type: "button" },
          on: {
            click: function () {
              var text = AE.topics.sentencePreview(topic, state.final.taskFields);
              if (text.indexOf("__________") !== -1) {
                ui.toast("빈칸을 모두 채운 뒤 가져올 수 있습니다.");
                return;
              }
              principle.input.value = text;
              state.personalPrinciple = text;
              principle.refresh();
              app.save();
              principle.input.focus();
            }
          }
        })
      );
    }

    var node = el("div", { class: "screen" }, [
      stepHeading(4),
      ui.card({ title: "내가 처음에 쓴 것", desc: "토론 전 판단입니다. 여기서는 고칠 수 없습니다." }, initialBack),
      ui.card({ eyebrow: topic.id, title: "최종 판단" }, body),
      ui.card({ title: "나의 AI 활용 원칙" }, [
        el("p", { class: "starter", text: "시작 예시 — " + topic.principle.starter }),
        el("div", { class: "btn-row btn-row--tools" }, principleTools),
        principle.root
      ])
    ]);

    function validate() {
      var res = AE.schema.validateFinal(topic, state.final, state.personalPrinciple);
      made.choice.setError(res.errors.choice || null);
      made.reason.setError(res.errors.reason || null);
      made.change.setError(res.errors.changeType || null);
      made.principle.setError(res.errors.personalPrinciple || null);
      Object.keys(made.task).forEach(function (k) {
        made.task[k].setError(res.errors["taskFields." + k] || null);
      });
      return res.ok ? null : res.errors;
    }

    return { node: node, nextLabel: "다음: 확인·제출", prevLabel: "이전", validate: validate };
  }

  /* ================================================================== */
  /* 5. 검토 및 제출                                                     */
  /* ================================================================== */

  /** 제출 내용을 한 화면에 요약한다. 제출 완료 화면에서도 같은 함수를 쓴다. */
  function summaryBlocks(app, withEdit) {
    var topic = app.topic();
    var state = app.state;

    function group(title, step, rows) {
      var head = [el("h3", { class: "sum__title", text: title })];
      if (withEdit) {
        head.push(
          el("button", {
            class: "btn btn--tiny",
            text: "수정",
            attrs: { type: "button", "aria-label": title + " 수정하기" },
            on: {
              click: function () {
                app.goTo(step);
              }
            }
          })
        );
      }
      return el("section", { class: "sum" }, [el("div", { class: "sum__head" }, head)].concat(rows));
    }

    var said = AE.schema.describeStudentId(state.student.studentId);
    var studentRows = [
      ui.readback(
        "학생",
        [state.student.studentId, state.student.name].filter(Boolean).join(" ") +
          (said ? "  (" + said + ")" : "")
      ),
      ui.readback("주제", topic.id + " · " + topic.title)
    ];

    var initialRows = [ui.readback("최초 선택", state.initial.choice)];
    if (topic.initial.reason) initialRows.push(ui.readback("최초 이유", state.initial.reason));
    AE.topics.fieldsOf(topic, "initial").forEach(function (f) {
      initialRows.push(ui.readback(AE.topics.labelOf(f), state.initial.taskFields[f.key]));
    });

    var finalRows = [
      ui.readback("최종 선택", state.final.choice),
      ui.readback("최종 이유", state.final.reason),
      ui.readback("생각 변화", state.final.changeType)
    ];
    AE.topics.fieldsOf(topic, "final").forEach(function (f) {
      finalRows.push(ui.readback(AE.topics.labelOf(f), state.final.taskFields[f.key]));
    });
    if (topic.final.sentence) {
      finalRows.push(ui.readback("완성 문장", AE.topics.sentencePreview(topic, state.final.taskFields)));
    }

    return [
      group("학생 정보", 0, studentRows),
      group("최초 판단", 2, initialRows),
      group("토론 메모", 3, [
        ui.readback("새롭게 알게 된 점", state.discussion.newInsight),
        ui.readback("토론 완료", state.discussion.completed ? "예" : "아니오")
      ]),
      group("최종 판단", 4, finalRows),
      group("나의 AI 활용 원칙", 4, [ui.readback(topic.principle.label, state.personalPrinciple)])
    ];
  }

  function reviewScreen(app) {
    var state = app.state;
    var busy = false;

    /* ── 제출 주소 (선생님이 링크로 알려 준 주소) ──────────────────
       설정 파일에 미리 적어 두었거나 데모 모드면 이 칸은 나오지 않는다. */
    var endpointField = null;
    if (AE.config.needsUrlInput()) {
      endpointField = infoField(
        {
          key: "endpoint",
          label: "제출 주소 (선생님이 알려 주신 주소)",
          placeholder: "https://script.google.com/macros/s/.../exec"
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
      /* 주소는 길어서 한 줄을 다 쓴다 */
      endpointField.input.classList.remove("input--short");
      endpointField.input.setAttribute("inputmode", "url");
      endpointField.input.setAttribute("spellcheck", "false");
    }

    var honesty = ui.checkbox(
      "나는 내 판단과 토론 결과를 바탕으로 답변을 작성했습니다.",
      state.honestyConfirmed,
      function (checked) {
        state.honestyConfirmed = checked;
        app.save();
      }
    );

    var statusBox = el("div", { class: "submit-status", attrs: { "aria-live": "polite" } });
    var errorBox = el("div", { class: "submit-error", attrs: { hidden: true } });

    var submitBtn = el("button", {
      class: "btn btn--primary btn--wide",
      text: "제출하기",
      attrs: { type: "button" }
    });

    var retryBtn = el("button", {
      class: "btn btn--ghost",
      text: "다시 제출",
      attrs: { type: "button", hidden: true },
      on: {
        click: function () {
          doSubmit();
        }
      }
    });

    function showError(message) {
      ui.clear(errorBox);
      errorBox.appendChild(
        el("div", { class: "alert alert--warn", attrs: { role: "alert" } }, [
          el("p", { class: "alert__title", text: "⚠ 제출하지 못했습니다" }),
          el("p", { class: "alert__text", text: message }),
          el("p", {
            class: "alert__text",
            text: "작성한 답변은 이 기기에 그대로 남아 있습니다. 잠시 뒤 다시 제출해 주세요."
          })
        ])
      );
      errorBox.hidden = false;
      retryBtn.hidden = false;
    }

    function setBusy(on) {
      busy = on;
      submitBtn.disabled = on;
      retryBtn.disabled = on;
      submitBtn.textContent = on ? "제출 중…" : "제출하기";
      statusBox.textContent = on ? "제출하고 있습니다. 잠시만 기다려 주세요." : "";
    }

    function doSubmit() {
      /* 중복 클릭 방지 — 처리 중이면 아무 일도 하지 않는다 (명세 4.1 화면6) */
      if (busy) return;

      /* 주소부터 본다 — 다 써 놓고 주소가 없어 못 보내는 일이 없게 */
      if (endpointField) {
        var typed = endpointField.input.value.trim();
        if (!typed) {
          endpointField.setError("선생님이 알려 주신 제출 주소를 넣어 주세요.");
          endpointField.input.focus();
          return;
        }
        if (!AE.config.looksLikeUrl(typed)) {
          endpointField.setError("주소가 올바르지 않습니다. https:// 로 시작하는 주소를 붙여 넣어 주세요.");
          endpointField.input.focus();
          return;
        }
        endpointField.setError(null);
        S.store.saveEndpoint(typed);
      }

      var check = AE.schema.validateAll(app.topic(), state);
      honesty.setError(check.errors.honestyConfirmed || null);
      if (!check.ok) {
        var topic = app.topic();
        var messages = Object.keys(check.errors).map(function (k) {
          return AE.schema.describeError(topic, k, check.errors[k]);
        });
        ui.clear(errorBox);
        errorBox.appendChild(errorSummary(messages));
        errorBox.hidden = false;
        ui.announce("아직 채우지 않은 항목이 있습니다.");
        return;
      }

      errorBox.hidden = true;
      retryBtn.hidden = true;
      setBusy(true);

      var payload = AE.schema.buildSubmission(state);
      var url = endpointField ? endpointField.input.value.trim() : "";
      S.api.submit(payload, url).then(function (result) {
        setBusy(false);
        if (result.ok) {
          state.submissionId = result.submissionId;
          state.submitted = {
            submissionId: result.submissionId,
            serverSubmittedAt: result.serverSubmittedAt,
            serverUpdatedAt: result.serverUpdatedAt,
            updated: result.updated,
            demo: !!result.demo
          };
          /* 성공한 뒤에야 «못 보낸 목록» 에서 뺀다 (명세 7.7) */
          S.store.removePending(payload);
          app.save();
          app.goTo(6);
          return;
        }
        /* 실패 — 답안을 남기고 재시도 길을 연다 */
        S.store.queuePending(payload);
        app.save();
        showError(result.message);
      });
    }

    submitBtn.addEventListener("click", doSubmit);

    var node = el("div", { class: "screen" }, [
      stepHeading(5),
      ui.card({ title: "제출 전 확인", desc: "고칠 항목이 있으면 [수정] 을 눌러 그 화면으로 갑니다." }, summaryBlocks(app, true)),
      ui.card({ title: "정직성 확인" }, [
        honesty.root,
        endpointField
          ? el("div", { class: "endpoint" }, [
              endpointField.root,
              el("p", {
                class: "endpoint__help",
                text: "한 번 넣으면 이 기기에 기억되어 다음 주제에서는 다시 넣지 않아도 됩니다."
              })
            ])
          : null,
        errorBox,
        el("div", { class: "btn-row" }, [submitBtn, retryBtn]),
        statusBox
      ])
    ]);

    return { node: node, nextLabel: null, prevLabel: "이전", validate: null, hideNext: true };
  }

  /* ================================================================== */
  /* 6. 제출 완료                                                        */
  /* ================================================================== */

  function doneScreen(app) {
    var state = app.state;
    var info = state.submitted || {};
    var when = S.formatTime(info.serverUpdatedAt || info.serverSubmittedAt);

    var rows = [
      ui.readback("제출 시각", when),
      ui.readback("제출 완료 번호", info.submissionId),
      ui.readback("처리", info.updated ? "이전 제출을 최신 내용으로 갱신했습니다." : "새로 제출했습니다.")
    ];

    var node = el("div", { class: "screen" }, [
      ui.card({ title: "제출을 마쳤습니다", tone: "accent" }, rows.concat([
        el("p", {
          class: "para",
          text: info.demo
            ? "데모 모드입니다. 이 내용은 선생님께 전달되지 않고 이 기기에만 남아 있습니다."
            : "같은 주제로 다시 제출하면 새 줄이 생기지 않고 최신 내용으로 바뀝니다."
        })
      ])),
      ui.card({ title: "내가 제출한 내용" }, summaryBlocks(app, false)),
      el("div", { class: "btn-row" }, [
        el("button", {
          class: "btn btn--ghost",
          text: "고쳐서 다시 제출하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              app.goTo(5);
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost",
          text: "다른 주제 하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              app.goTo(0);
            }
          }
        })
      ])
    ]);

    return { node: node, nextLabel: null, prevLabel: null, validate: null, hideNav: true };
  }

  S.screens = [
    startScreen,
    situationScreen,
    initialScreen,
    discussionScreen,
    finalScreen,
    reviewScreen,
    doneScreen
  ];
})();
    </script>
    <script data-from="student/s90-app.js">
/**
 * 학생용 앱 본체 — 화면 이동 · 진행률 · 자동 저장 · 복원 (명세 4.2)
 *
 * 이 파일이 하는 일
 *   · 주소(#topic=…&step=…) 와 임시 저장을 보고 «어디서부터 다시 할지» 를 정한다
 *   · 아래쪽 [이전]/[다음] 버튼을 늘 같은 자리에 둔다
 *   · [다음] 을 누를 때 그 화면의 검사를 돌린다
 *   · 입력이 바뀔 때마다 임시 저장한다
 *   · 제출을 마치지 않고 페이지를 떠나려 하면 한 번 물어본다
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var AE = root.AE || (root.AE = {});
  var S = AE.student || (AE.student = {});
  if (typeof document === "undefined") return;

  var ui = S.ui;
  var el = ui.el;

  var state = null;
  var current = null; // 지금 화면 객체
  var hashLock = false;
  var saveTimer = null;

  /* ------------------------------------------------------------------ */
  /* 주소 다루기                                                          */
  /* ------------------------------------------------------------------ */

  function readHash() {
    var hash = (location.hash || "").replace(/^#/, "");
    if (!hash) return null;
    var out = {};
    hash.split("&").forEach(function (pair) {
      var kv = pair.split("=");
      if (kv.length === 2) out[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
    });
    var topicId = AE.topics.byId(out.topic) ? out.topic : null;
    var step = /^\d+$/.test(out.step || "") ? parseInt(out.step, 10) : null;
    if (step !== null && (step < 0 || step > 6)) step = null;
    if (!topicId && step === null) return null;
    return { topicId: topicId, step: step };
  }

  function writeHash() {
    var want = "#topic=" + encodeURIComponent(state.topicId || "") + "&step=" + state.step;
    if (location.hash === want) return;
    hashLock = true;
    location.hash = want;
    setTimeout(function () {
      hashLock = false;
    }, 0);
  }

  /* ------------------------------------------------------------------ */
  /* 저장                                                                 */
  /* ------------------------------------------------------------------ */

  function save() {
    if (!state || !state.topicId) return;
    if (saveTimer) clearTimeout(saveTimer);
    /* 한 글자마다 저장하면 느려진다. 잠깐 모았다가 저장한다. */
    saveTimer = setTimeout(function () {
      S.store.saveDraft(state);
      S.store.saveStudent(state.student);
      saveTimer = null;
    }, 250);
  }

  function saveNow() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    if (state && state.topicId) S.store.saveDraft(state);
    if (state) S.store.saveStudent(state.student);
  }

  /* ------------------------------------------------------------------ */
  /* 머리말 — 진행률 · 데모 안내 · 못 보낸 제출                             */
  /* ------------------------------------------------------------------ */

  /**
   * 학생 화면 위쪽 알림.
   *
   * 데모 모드 안내는 «학생 화면에는 두지 않는다»(2026-08-17).
   * 수업에서 학생이 볼 화면을 깨끗하게 하기 위해서다.
   * 대신 두 곳에 남겨 두어 «설정을 깜빡했을 때» 조용히 넘어가지 않게 했다.
   *   · 제출 완료 화면 — 「선생님께 전달되지 않았습니다」 한 줄
   *   · 교사용 대시보드 — 큰 경고 띠
   */
  function renderBanner() {
    var box = ui.$("#banner-area");
    ui.clear(box);

    var pending = S.store.loadPending();
    if (pending.length > 0 && !AE.config.isDemo()) {
      var btn = el("button", {
        class: "btn btn--tiny",
        text: "지금 다시 보내기",
        attrs: { type: "button" },
        on: {
          click: function () {
            btn.disabled = true;
            btn.textContent = "보내는 중…";
            var jobs = pending.map(function (p) {
              /* 담아 둔 것은 «실패하던 그때» 의 사진이다.
                 그 뒤 학생이 답을 고쳤을 수 있으므로, 지금 저장된 내용으로 다시 만든다.
                 그래야 고친 답이 아니라 옛 답이 올라가는 일이 없다. */
              var latest = S.store.loadDraft(p.topicId);
              var topic = AE.topics.byId(p.topicId);
              var payload = p;
              if (latest && topic && AE.schema.validateAll(topic, latest).ok) {
                payload = AE.schema.buildSubmission(latest);
              }
              return S.api.submit(payload).then(function (r) {
                /* 지울 때는 «담아 둘 때 쓴» 열쇠로 지운다 (둘의 열쇠는 같다) */
                if (r.ok) S.store.removePending(p);
                return r.ok;
              });
            });
            Promise.all(jobs).then(function (results) {
              var okCount = results.filter(Boolean).length;
              ui.toast(
                okCount === results.length
                  ? "보내지 못했던 답안을 모두 제출했습니다."
                  : "일부를 아직 보내지 못했습니다. 잠시 뒤 다시 시도해 주세요."
              );
              renderBanner();
            });
          }
        }
      });
      box.appendChild(
        el("div", { class: "banner banner--warn", attrs: { role: "status" } }, [
          el("p", { class: "banner__title", text: "아직 보내지 못한 답안이 " + pending.length + "개 있습니다" }),
          el("p", { class: "banner__text", text: "인터넷이 연결되면 다시 보낼 수 있습니다." }),
          btn
        ])
      );
    }
  }

  function renderProgress() {
    var wrap = ui.$("#progress-area");
    var info = AE.STEPS[state.step];
    var counted = info && info.counted;
    var percent = counted ? Math.round((state.step / 5) * 100) : state.step === 6 ? 100 : 0;

    ui.clear(wrap);
    wrap.appendChild(
      el("div", { class: "progress" }, [
        el("p", { class: "progress__label" }, [
          el("span", { class: "progress__step", text: counted ? state.step + "/5" : "" }),
          el("span", { class: "progress__name", text: info ? info.label : "" })
        ]),
        el(
          "div",
          {
            class: "progress__bar",
            attrs: {
              role: "progressbar",
              "aria-label": "활동 진행률",
              "aria-valuemin": "0",
              "aria-valuemax": "100",
              "aria-valuenow": String(percent),
              "aria-valuetext": (info ? info.label : "") + " " + percent + "%"
            }
          },
          [el("div", { class: "progress__fill" })]
        )
      ])
    );
    var fill = wrap.querySelector(".progress__fill");
    if (fill) fill.style.width = percent + "%";
  }

  /* ------------------------------------------------------------------ */
  /* 아래쪽 버튼                                                          */
  /* ------------------------------------------------------------------ */

  var nextBtn = null;
  var prevBtn = null;

  function renderNav(screen) {
    var navArea = ui.$("#nav-area");
    ui.clear(navArea);

    if (screen.hideNav) {
      navArea.hidden = true;
      return;
    }
    navArea.hidden = false;

    prevBtn = el("button", {
      class: "btn btn--ghost",
      text: screen.prevLabel || "이전",
      attrs: { type: "button", hidden: !screen.prevLabel },
      on: {
        click: function () {
          goTo(state.step - 1, { back: true });
        }
      }
    });

    nextBtn = el("button", {
      class: "btn btn--primary",
      text: screen.nextLabel || "다음",
      attrs: { type: "button", hidden: !!screen.hideNext || !screen.nextLabel },
      on: {
        click: function () {
          goTo(state.step + 1);
        }
      }
    });

    navArea.appendChild(el("div", { class: "nav" }, [prevBtn, nextBtn]));
  }

  function setNextEnabled(on) {
    if (nextBtn) nextBtn.disabled = !on;
  }

  /* ------------------------------------------------------------------ */
  /* 화면 그리기                                                          */
  /* ------------------------------------------------------------------ */

  function render() {
    var host = ui.$("#screen-root");
    if (current && current.onLeave) current.onLeave();
    ui.clear(host);

    var factory = S.screens[state.step] || S.screens[0];
    current = factory(app);
    host.appendChild(current.node);

    renderProgress();
    renderBanner();
    renderNav(current);

    if (current.onEnter) current.onEnter();

    /* 화면이 바뀌면 본문 처음으로 초점을 옮긴다(키보드·스크린 리더 사용자) */
    var main = ui.$("#app-main");
    if (main) {
      main.setAttribute("tabindex", "-1");
      main.focus({ preventScroll: true });
      if (typeof main.scrollIntoView === "function") main.scrollIntoView({ block: "start" });
    }
    var info = AE.STEPS[state.step];
    if (info) ui.announce((info.counted ? state.step + "단계 / 5단계 " : "") + info.label);

    writeHash();
  }

  function goTo(step, options) {
    var opt = options || {};
    if (step < 0) step = 0;
    if (step > 6) step = 6;

    /* 앞으로 갈 때만 검사한다. 뒤로 가기는 언제나 자유롭다. */
    if (!opt.back && !opt.force && step > state.step && current && current.validate) {
      var errors = current.validate();
      if (errors) {
        ui.announce("입력을 확인해 주세요.");
        ui.focusFirstError(current.node);
        return false;
      }
    }

    state.step = step;
    saveNow();
    render();
    return true;
  }

  /** 시작 화면에서 주제를 골랐을 때 — 그 주제의 저장분을 이어서 쓴다 */
  function switchTopic(topicId) {
    if (state.topicId === topicId) return;
    saveNow();
    var draft = S.store.loadDraft(topicId);
    var student = state.student;
    state = draft || S.emptyState(topicId);
    state.topicId = topicId;
    state.student = student; // 학생 정보는 주제가 바뀌어도 그대로
    app.state = state;
    if (state.step < 1) state.step = 1;
    saveNow();
  }

  /** 공용 기기를 다음 학생에게 넘길 때 — 화면을 빈 시작 화면으로 되돌린다 */
  function resetForNewStudent() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    state = S.emptyState("");
    state.step = 0;
    app.state = state;
    render();
  }

  var app = {
    state: null,
    resetForNewStudent: resetForNewStudent,
    topic: function () {
      return AE.topics.byId(state.topicId);
    },
    save: save,
    saveNow: saveNow,
    goTo: goTo,
    switchTopic: switchTopic,
    setNextEnabled: setNextEnabled,
    render: render
  };

  /* ------------------------------------------------------------------ */
  /* 시작하기                                                             */
  /* ------------------------------------------------------------------ */

  function decideStart() {
    var fromHash = readHash();
    var fromQuery = S.topicFromQuery();
    var session = S.store.loadSession();

    var topicId = (fromHash && fromHash.topicId) || fromQuery || (session && session.topicId) || "";
    var draft = topicId ? S.store.loadDraft(topicId) : null;
    var st = draft || S.emptyState(topicId);

    /* 학생 정보는 주제와 상관없이 이어 쓴다 */
    var saved = S.store.loadStudent();
    if (saved) {
      Object.keys(saved).forEach(function (k) {
        if (!st.student[k]) st.student[k] = saved[k];
      });
    }

    if (fromHash && fromHash.step !== null) st.step = fromHash.step;
    else if (draft) st.step = draft.step;
    else if (fromQuery) st.step = 1;
    else st.step = 0;

    /* 주제가 정해지지 않았으면 무조건 시작 화면 */
    if (!st.topicId) st.step = 0;

    /* 주소로 바로 들어왔는데 학생 정보가 비어 있으면 시작 화면부터 */
    if (st.step > 0) {
      var check = AE.schema.validateStudent(st.student);
      if (!check.ok) st.step = 0;
    }

    /* 이미 제출을 마친 자료라면 완료 화면을 보여 준다 */
    if (st.submitted && st.step < 6 && !(fromHash && fromHash.step !== null)) st.step = 6;

    return st;
  }

  function guardLeave() {
    root.addEventListener("beforeunload", function (e) {
      if (!state) return;
      if (state.submitted) return;
      if (!S.hasContent(state)) return;
      saveNow();
      e.preventDefault();
      /* 브라우저가 자체 문구를 보여 준다. 값을 넣어야 경고가 뜬다. */
      e.returnValue = AE.MESSAGES.leaveWarn;
      return AE.MESSAGES.leaveWarn;
    });
  }

  function watchHash() {
    root.addEventListener("hashchange", function () {
      if (hashLock) return;
      var h = readHash();
      if (!h) return;
      if (h.topicId && h.topicId !== state.topicId) {
        switchTopic(h.topicId);
      }
      if (h.step !== null && h.step !== state.step) {
        state.step = h.topicId || state.topicId ? h.step : 0;
        render();
        return;
      }
      render();
    });
  }

  function boot() {
    state = decideStart();
    app.state = state;

    render();
    guardLeave();
    watchHash();

    /* 창을 닫기 직전에도 마지막 내용을 남긴다 */
    root.addEventListener("pagehide", saveNow);
    root.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") saveNow();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
    </script>
