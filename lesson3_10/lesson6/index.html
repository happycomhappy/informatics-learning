.syntaxcard {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-3);
}

.syntaxcard__title {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  color: var(--color-primary-dark);
  margin-bottom: var(--space-2);
}

.syntaxcard__note {
  margin: 0 0 4px;
  font-size: 14px;
  line-height: 1.6;
}

.syntaxcard__note--why {
  color: var(--color-text-sub);
}

/* 내가 이은 회로·완성한 코드를 그대로 되짚는다 */
.myanswer {
  white-space: pre-wrap;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  font-size: 14px;
  line-height: 1.6;
}

.myanswer--code {
  font-family: var(--font-mono);
  font-size: 13px;
}

.myanswer--empty {
  color: var(--color-text-sub);
  font-style: italic;
}

/* ── 두 조건 단추 — «무엇을 누르는지 보이는» 카드 ────────────────────
 * 앞판은 넓은 파란 띠에 «▶ ▲ 건조» 뿐이어서, 무엇을 누르는지도
 * 누르면 무엇이 되는지도 알 수 없었다. 한 카드에 세 줄로 담는다.
 *   ① 어떤 환경인가   ② 센서값과 기준값의 관계   ③ 그래서 어떻게 되는가
 * ------------------------------------------------------------------ */
.runcard {
  flex: 1 1 260px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: var(--space-3) var(--space-4);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.runcard:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.runcard:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.runcard__top {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.runcard__icon {
  font-size: 18px;
}

.runcard__name {
  font-size: 17px;
  font-weight: 800;
  color: var(--color-text);
}

.runcard__label {
  font-size: 13px;
  color: var(--color-text-sub);
}

.runcard__sub {
  display: flex;
  flex-wrap: wrap;
  gap: 4px var(--space-3);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.runcard__value,
.runcard__cmp {
  /* 부모(.runcard__sub)의 색·굵기를 그대로 쓴다 — 이름만 두어 뜻이 보이게 한다 */
  color: inherit;
}

.runcard__result {
  color: var(--color-primary-dark);
}

.runcard__go {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  min-height: 34px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--color-primary);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
}

.runcard:hover .runcard__go {
  background: var(--color-primary-dark);
}

/* 돌려 본 조건 — ▶ 가 ✔ 로 바뀌고 테두리가 초록이 된다 */
.runcard--done {
  border-color: var(--color-true);
  background: var(--color-true-soft, #eefaf1);
}

.runcard--done .runcard__go {
  background: var(--color-true);
}

.runpair__note {
  margin: var(--space-2) 0 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ── 코딩 차례 칸 — 이름만 넣고 설명은 아래 한 줄로 ──────────────────
 * 설명까지 칸 안에 넣었더니 «코드 읽고 돌려 보기줄마다 하는 일을…» 처럼
 * 이름과 설명이 붙어 한 덩어리로 읽혔다. 이름표는 아예 꾸며 두지 않았었다.
 * ------------------------------------------------------------------ */
.modenav {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.modetabs__item {
  display: flex;
}

.modetab {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  /* 이제 «단추» 다 — 눌러서 차례를 옮긴다 */
  font-family: inherit;
  cursor: pointer;
}

/* 아직 열리지 않은 차례 — 자물쇠와 «흐린 모양» 을 함께 쓴다.
   disabled 로 두지 않는 까닭은, 눌렀을 때 «왜 안 열리는지» 를 말해 주기 위해서다
   (아무 반응 없는 단추가 가장 답답하다). */
.modetab--locked {
  opacity: 0.6;
  cursor: not-allowed;
}

.modetab:not(.modetab--on):not(.modetab--locked):hover {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
}

.modetab:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.modetab__name {
  font-size: 15px;
  font-weight: 800;
}

.modenav__note {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--color-text-sub);
}

/* ── 빈칸 채우기 — 코드 상자와 «같은 모양» 으로 ──────────────────────
 * 물음은 빈칸 «안» 에 적는다(placeholder). 글을 적기 시작하면 사라진다.
 * 앞판은 물음을 빈칸 위에 따로 적어 눈이 위아래를 오갔고, 고정 줄에는
 * 줄 번호가 없어 빈칸 줄만 번호가 튀어 보였다.
 * ------------------------------------------------------------------ */
.blanks__row {
  /* 세로로 쌓던 것을 «한 줄» 로 — [줄 번호] [코드] */
  flex-direction: row;
  align-items: center;
  gap: var(--space-3);
  padding: 1px 0;
}

.blanks__no {
  flex: 0 0 2.4em;
  text-align: right;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--tok-comment);
  user-select: none;
}

.blanks__inline {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  flex: 1 1 auto;
}

.blanks__input {
  /* 빈칸이 «그 줄 안» 에 있어 보이도록 줄 높이에 맞춘다 */
  align-self: center;
  min-height: 34px;
  max-width: 380px;
}

/* ── 코드 옆의 «줄마다 하는 일» ──────────────────────────────────────
 * 설명을 따로 떨어진 목록으로 두면 코드와 설명 사이를 눈으로 오가야 한다.
 * 그래서 코드 상자 «안» 에 설명 칸을 하나 더 둔다.
 *   [줄 번호] [코드] [설명]
 * 좁은 화면에서는 설명을 코드 아래로 내린다 — 옆에 두면 둘 다 좁아진다.
 * ------------------------------------------------------------------ */
.codeview--noted .codeline {
  display: grid;
  grid-template-columns: 2.4em minmax(0, 1fr) minmax(0, 24em);
  gap: var(--space-3);
  align-items: baseline;
  padding-top: 2px;
  padding-bottom: 2px;
}

.codeline__note {
  /* 코드는 «접지 않는다»(white-space: pre). 설명은 접어야 한다. */
  white-space: normal;
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.55;
  color: #d7e2f2;
}

/* 실행 중인 줄의 ▶ 는 격자 칸을 잡아먹지 않도록 띄워 놓는다 */
.codeview--noted .codeline__run {
  position: absolute;
  left: 2px;
}

@media (max-width: 820px) {
  .codeview--noted .codeline {
    grid-template-columns: 2.4em minmax(0, 1fr);
  }

  .codeline__note {
    grid-column: 2;
    padding-bottom: var(--space-2);
  }
}

/* 아직 돌려 보지 않았으면 값 칸은 «비어 있다» — 빈 칸이 자리를 잡지 않게 한다 */
.runstats:empty {
  display: none;
}

/* ── 결과 줄 — «LED 시뮬레이션 → 값 → 시리얼» 세 칸 ────────────────── */
.runrow {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.2fr);
  gap: var(--space-3);
  align-items: start;
}

@media (max-width: 820px) {
  .runrow {
    grid-template-columns: 1fr;
  }
}

.ledsim {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-2);
  text-align: center;
}

.ledsim__head {
  margin: 0 0 var(--space-1);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.ledsim__svg {
  display: block;
  width: 100%;
  max-width: 120px;
  height: auto;
  margin: 0 auto;
}

.ledsim__word {
  margin: var(--space-1) 0 0;
  font-size: 14px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.ledsim__word--on {
  color: var(--color-primary-dark);
}

.ledsim__bulb {
  fill: #c9ced6;
  stroke: #8b939e;
  stroke-width: 2;
}

.ledsim__bulb--on {
  fill: #ffd34d;
  stroke: #c9971a;
}

.ledsim__glow {
  fill: #ffe9a3;
  opacity: 0.75;
}

.ledsim__leg {
  stroke: #9aa3ae;
  stroke-width: 4;
  stroke-linecap: round;
}

.ledsim__dirt {
  fill: #6b4f2a;
}

.ledsim__water {
  fill: #2f6fd0;
}

.ledsim__blade {
  fill: #cfd6de;
  stroke: #8b939e;
  stroke-width: 1.5;
}

/* ── [정답 확인] 창의 결선표 ────────────────────────────────────────
 * 표 하나로 «이렇게 이으면 된다» 를 보인다.
 * 색은 동그라미와 «글자» 를 함께 낸다 — 색만으로 뜻을 전하지 않는다(명세 18장).
 * ------------------------------------------------------------------ */
/* 표를 담는 창은 기본 440px 보다 넓어야 한 줄이 접히지 않는다 */
.modal--wide {
  max-width: min(640px, calc(100vw - 32px));
}

.answer__box {
  margin: var(--space-3) 0 0;
  max-height: 58vh;
  overflow: auto;
}

.answer {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
}

.answer th,
.answer td {
  padding: var(--space-2) var(--space-3);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
  vertical-align: middle;
}

.answer th {
  background: var(--color-surface-alt, #f1f4f8);
  font-size: 13px;
  font-weight: 800;
  /* 흐린 회색은 이 옅은 바탕에서 대비가 4.5 에 못 미쳤다 */
  color: var(--color-text);
}

.answer__no {
  width: 2.4em;
  color: var(--color-text-sub);
  font-weight: 700;
}

.answer__wire {
  font-weight: 700;
  /* 「우노 5V ↔ 조도 VCC」 가 두 줄로 접히면 표가 읽기 어렵다.
     좁은 화면에서는 표 칸이 옆으로 밀린다(.answer__box 가 스크롤). */
  white-space: nowrap;
}

.answer__color {
  white-space: nowrap;
}

.answer__dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: -1px;
  border: 1px solid rgba(0, 0, 0, 0.25);
}

.answer__dot--red {
  background: #d63b2f;
}

.answer__dot--blue {
  background: #1d4ed8;
}

.answer__dot--orange {
  background: #ea580c;
}

.answer__dot--gray {
  background: #9aa3ae;
}

.answer__notes {
  margin: var(--space-3) 0 0;
  padding-left: 1.2em;
  font-size: 14px;
  line-height: 1.6;
  /* 흐린 회색은 대비가 4.5 에 못 미쳤다. 본문과 같은 색으로 둔다. */
  color: var(--color-text);
}

.answer__notes li {
  margin-bottom: 2px;
}

/* ── 이어 놓은 케이블 — «한 번 더 누르면» 지워진다 ──────────────────
 * 가는 선은 손가락으로 누르기 어려우므로 보이지 않는 굵은 선을 위에 겹친다.
 * 그 위에 손을 얹으면 선이 굵어지고 가운데에 ✕ 가 나타난다 —
 * 「누르면 지워진다」를 그림으로도 알리는 것이다.
 * ------------------------------------------------------------------ */
.wire__hit {
  fill: none;
  stroke: transparent;
  stroke-width: 20;
  cursor: pointer;
}

.wire__g:hover .wire,
.wire__g:focus-within .wire {
  stroke-width: 8;
}

.wire__x {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease;
}

.wire__g:hover .wire__x,
.wire__g:focus-within .wire__x {
  opacity: 1;
}

.wire__xbg {
  fill: #b1180f;
  stroke: #ffffff;
  stroke-width: 2;
}

.wire__xmark {
  fill: #ffffff;
  font-size: 13px;
  font-weight: 800;
}

.wire__hit:focus-visible {
  stroke: var(--color-primary);
  stroke-opacity: 0.35;
  outline: none;
}

.board__hint {
  margin: var(--space-2) 0 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-sub);
}

/* 우노 헤더의 구멍과 인쇄된 이름 — 실물처럼 «전부» 그린다.
   이 차시가 쓰지 않는 칸도 보이지만, 누를 수 있는 것은 여덟 개뿐이다. */
.uno__hole {
  fill: #ffffff;
  stroke: #55606d;
  stroke-width: 1.5;
}

.uno__pinname {
  fill: #ffffff;
  font-size: 10px;
  font-weight: 800;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* ── 브레드보드 ── */
.bb__railline {
  stroke-width: 2;
  stroke-dasharray: 6 4;
}

.bb__railline--plus {
  stroke: var(--rail-plus);
}

.bb__railline--minus {
  stroke: var(--rail-minus);
}

.bb__railmark {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
}

.bb__gap {
  fill: var(--bb-line);
  opacity: 0.45;
}

.bb__gaptext,
.bb__rowlabel,
.bb__colno {
  font-size: 10px;
  fill: var(--color-text-sub);
}

/* ── 조도센서 ── */
.cds__resin {
  fill: var(--cds-resin);
  opacity: 0.6;
}

.cds__face {
  fill: var(--cds-face);
  stroke: var(--cds-face-edge);
  stroke-width: 1.5;
}

.cds__shade {
  fill: var(--cds-shade);
}

.cds__ring {
  fill: none;
  stroke: var(--cds-face-edge);
  stroke-width: 2;
}

.cds__zig {
  stroke: var(--cds-zig);
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
}

.cds__zig--a {
  stroke: var(--cds-zig);
}

.cds__zig--b {
  stroke: #6b7684;
}

.cds__bus {
  stroke: var(--cds-zig);
  stroke-width: 4;
  stroke-linecap: round;
}

.cds__lead {
  stroke: var(--cds-lead);
  stroke-width: 3.5;
  stroke-linecap: round;
}

/* ── 센서 모듈 (조도·토양수분 공통) ── */
.mod__body {
  fill: var(--mod-board);
  stroke: var(--mod-board-edge);
  stroke-width: 2;
}

.mod__pad {
  fill: var(--mod-pad);
  stroke: var(--mod-pad-edge);
  stroke-width: 1;
}

.mod__trim {
  fill: var(--mod-trim);
  stroke: #1d4ed8;
  stroke-width: 1;
}

.mod__trimline {
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.mod__lamp {
  fill: var(--mod-lamp);
  stroke: #8b94a1;
  stroke-width: 1;
}

.mod__wire {
  stroke: var(--part-lead);
  stroke-width: 2;
}

.mod__name {
  font-size: 12px;
  font-weight: 700;
  fill: #fff;
}

.mod__padtext {
  font-size: 10px;
  font-weight: 700;
  fill: var(--color-text);
}

/* 기판 «위» 에 적는 작은 글 — 초록 바탕이므로 밝은 색이다 */
.mod__note {
  font-size: 10px;
  fill: #e6efe9;
}

/* ── 기판 «밖 흰 자리» 에 적는 글 ──────────────────────────────────
 * ★ .mod__note 의 밝은 색은 «초록 기판 위» 를 위한 것이다.
 *   흰 자리에 그대로 쓰면 글자가 아예 보이지 않는다 —
 *   실제로 「탐침만 흙에 넣는다」와 「방향 없음」이 그렇게 사라져 있었다.
 * ------------------------------------------------------------------ */
.mod__paper {
  font-size: 12px;
  font-weight: 700;
  fill: #1f2937;
}

/* 안전 수칙은 «눈에 띄어야» 한다 (명세 7장 ④ 탐침만 흙에).
   색만으로 알리지 않도록 글에 ⚠ 를 함께 붙인다(명세 18장). */
.mod__warn {
  font-size: 13px;
  font-weight: 800;
  fill: #b1180f;
}

.mod__state {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
}

/* ── LED ── */
.fig__led {
  fill: var(--led-off);
  stroke: var(--led-edge);
  stroke-width: 1.5;
}

.fig__led--on {
  fill: var(--led-on);
  stroke: #b58a1a;
}

.led__glow {
  fill: var(--led-glow);
  pointer-events: none;
}

.led__leg {
  stroke: var(--part-lead);
  stroke-width: 3;
  stroke-linecap: round;
}

/* ── 저항 ── */
.res__body {
  fill: var(--res-body);
  stroke: var(--res-body-edge);
  stroke-width: 1.5;
}

.res__lead {
  stroke: var(--part-lead);
  stroke-width: 3;
  stroke-linecap: round;
}

/* ── 토양수분 ── */
.soil__dirt {
  fill: var(--soil-dirt);
  stroke: var(--soil-dirt-edge);
  stroke-width: 1.5;
}

.soil__water {
  fill: var(--soil-water);
}

.soil__drop {
  fill: var(--soil-drop);
  stroke: #2f7fbf;
  stroke-width: 0.8;
}

.soil__current {
  stroke: var(--soil-current);
  stroke-width: 3;
  stroke-linecap: round;
}

.soil__arrow {
  fill: var(--soil-current);
}

.probe__blade {
  fill: var(--probe-blade);
  stroke: var(--probe-blade-edge);
  stroke-width: 1.2;
}

.probe__head {
  fill: var(--probe-head);
  stroke: #23282f;
  stroke-width: 1.5;
}

/* ── 위험 표시 ── */
.danger__ring {
  fill: none;
  stroke: var(--danger-ring);
  stroke-width: 3;
  stroke-dasharray: 8 5;
}

.danger__line {
  stroke: var(--danger-ring);
  stroke-width: 2;
  stroke-dasharray: 7 5;
}

/* ── 활용 사례 그림 ── */
.use__pole,
.use__pipe {
  stroke: var(--use-metal);
  stroke-width: 5;
  stroke-linecap: round;
  fill: none;
}

.use__lamp {
  fill: var(--use-lamp-off);
  stroke: #94a3b8;
  stroke-width: 1.2;
}

.use__lamp--on {
  fill: var(--use-lamp-on);
  stroke: #d9a52a;
}

.use__car {
  fill: #93b4d8;
  stroke: #5b7fa6;
  stroke-width: 1.5;
}

.use__wheel {
  fill: #3f4652;
  stroke: #23282f;
  stroke-width: 1.5;
}

.use__house {
  fill: var(--use-house);
  stroke: #93b4d8;
  stroke-width: 1.5;
}

.use__plant {
  fill: #6b4a2c;
}

.use__leaf {
  fill: var(--use-leaf);
  stroke: #37764c;
  stroke-width: 1;
}

.use__pot {
  fill: var(--use-pot);
  stroke: #96562f;
  stroke-width: 1.5;
}

.use__stem {
  stroke: var(--use-leaf);
  stroke-width: 3;
  stroke-linecap: round;
}

/* ── 눈금 그림 ── */
.scale__bar {
  fill: url(#none) var(--gauge-track);
  stroke: var(--color-border-strong);
  stroke-width: 1;
}

.scale__tick {
  stroke: var(--color-text-sub);
  stroke-width: 1.5;
}

.scale__num {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
}

/* ── 세 칸 표 그림 ── */
.step__box {
  fill: var(--color-primary-soft);
  stroke: var(--color-primary);
  stroke-width: 1.5;
}

.step__value {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-primary-dark);
}

.step__arrow {
  stroke: var(--color-text-sub);
  stroke-width: 2;
}

.step__arrowhead {
  fill: var(--color-text-sub);
}

/* ── 회로 단자 «이어져 있음» 표시 ── */
.pin--wired .pin__dot {
  stroke: var(--color-true-dark);
  stroke-width: 2.5;
}

.wirelegend__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ==================================================================
 * 3. 시뮬레이션 판과 눈금판
 * ================================================================== */

.sim {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.sim__scene {
  border-radius: var(--radius-sm);
  background: var(--color-muted-bg);
  padding: var(--space-2);
  overflow: hidden;
}

.sim__svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 240px;
}

.sim__sky {
  fill: #101a2b;
}

.sim__resline {
  stroke: var(--cds-zig);
  stroke-linecap: round;
}

.sim__row {
  display: grid;
  gap: var(--space-2);
}

.sim__label {
  font-weight: 600;
  font-size: var(--fs-small);
}

.sim__slide {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.sim__end {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  min-width: 3.5em;
  text-align: center;
}

.sim__range {
  flex: 1;
  min-height: var(--touch-min);
  accent-color: var(--color-primary);
}

.sim__now {
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-primary-dark);
}

.sim__btns {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.sim__warn {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
  border-left: 4px solid var(--color-false);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  margin: 0;
}

.sim__danger:empty {
  display: none;
}

/* ── 눈금판 ── */
.gauge {
  display: grid;
  gap: var(--space-1);
}

.gauge__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0;
}

.gauge__label {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  font-family: var(--font-mono);
}

.gauge__value {
  font-size: 24px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--color-primary-dark);
}

.gauge__track {
  position: relative;
  height: 20px;
  border-radius: 10px;
  background: var(--gauge-track);
  border: 1px solid var(--color-border-strong);
  overflow: visible;
}

.gauge__fill {
  height: 100%;
  border-radius: 10px 0 0 10px;
  background: var(--gauge-fill);
  transition: width var(--dur-highlight) ease-out;
}

/* 기준값 표시 — 색만으로 알리지 않도록 «▼» 를 함께 둔다 */
.gauge__mark {
  position: absolute;
  top: -8px;
  bottom: -8px;
  width: 0;
  border-left: 3px dashed var(--gauge-mark);
}

.gauge__mark::before {
  content: "▼ 기준";
  position: absolute;
  top: -16px;
  left: -18px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gauge-mark);
  white-space: nowrap;
}

.gauge__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  margin: 0;
  font-size: var(--fs-small);
  font-weight: 600;
}

.gauge__word {
  color: var(--color-text);
}

.gauge__res {
  color: var(--color-text-sub);
}

.gauge__scale {
  display: flex;
  justify-content: space-between;
  margin: 0;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--color-text-sub);
}

/* ==================================================================
 * 4. 실험 기록 칸
 * ================================================================== */

.record {
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  background: var(--color-surface);
  display: grid;
  gap: var(--space-3);
}

.record__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin: 0;
}

.record__icon {
  font-size: 18px;
}

.record__name {
  font-size: 17px;
}

.record__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  font-family: var(--font-mono);
}

.record__data {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--color-true-dark);
  background: var(--color-true-soft);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
}

/* ── 재어 본 값 목록 ── */
.measured {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.measured__item {
  display: flex;
  gap: var(--space-2);
  align-items: baseline;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  background: var(--color-muted-bg);
}

.measured__item--th {
  background: var(--color-primary-soft);
  border-color: var(--color-primary);
}

.measured__name {
  font-size: var(--fs-small);
}

.measured__value {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--color-primary-dark);
}

/* ── 기준값 정하기 줄 ── */
.thresholdrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  margin: var(--space-3) 0;
}

.thresholdrow__label {
  font-weight: 600;
  min-width: 8em;
}

.input--number {
  max-width: 8em;
  font-family: var(--font-mono);
  font-size: 18px;
  text-align: center;
}

/* ==================================================================
 * 5. 비교표 (5단계)
 * ================================================================== */

.cmp {
  display: grid;
  gap: var(--space-2);
  overflow-x: auto;
}

.cmp__row {
  display: grid;
  grid-template-columns: minmax(6em, 1fr) minmax(11em, 2fr) minmax(11em, 2fr);
  gap: var(--space-2);
  align-items: start;
}

.cmp__row--head {
  font-weight: 700;
  border-bottom: 2px solid var(--color-border-strong);
  padding-bottom: var(--space-2);
}

.cmp__cell {
  display: grid;
  gap: var(--space-1);
}

.cmp__cell--label {
  font-weight: 600;
  align-self: center;
  color: var(--color-text-sub);
}

.cmp__input {
  min-height: var(--touch-min);
}

.cmp__mark {
  font-size: 12px;
  color: var(--color-text-sub);
  min-height: 1.2em;
}

.cmp__mark--ok {
  color: var(--color-true-dark);
  font-weight: 600;
}

@media (max-width: 700px) {
  .cmp__row {
    grid-template-columns: 1fr;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: var(--space-2);
  }

  .cmp__row--head {
    display: none;
  }

  .cmp__cell::before {
    content: attr(aria-label);
  }
}

/* ==================================================================
 * 6. 코딩 차례 딱지와 잠긴 칸
 * ================================================================== */

.modetab__mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-muted-bg);
  font-size: 12px;
  font-weight: 700;
  flex: 0 0 auto;
}

.modetab--on .modetab__mark {
  background: var(--color-primary);
  color: #fff;
}

.modetab--done .modetab__mark {
  background: var(--color-true);
  color: #fff;
}

.panel--locked {
  opacity: 0.85;
  border-style: dashed;
}

.subhead--big {
  font-size: 20px;
  margin-top: var(--space-5);
  padding-top: var(--space-3);
  border-top: 2px solid var(--color-border);
}

/* ── 빈칸 채우기 ── */
.blanks__inline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

.blanks__row--fixed {
  padding: 0;
}

.blanks__feedback {
  display: grid;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.blanks__feedback:empty {
  display: none;
}

/* ── 조립하기 ── */
.assemble__grip {
  min-width: 36px;
}

.assemble__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

/* ── 편집기 줄 번호 ── */
.editor__no {
  display: block;
  text-align: right;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.6;
  color: var(--color-text-sub);
}

/* ==================================================================
 * 7. 알림 상자의 덧글
 * ================================================================== */

.alert__text {
  margin: 0;
}

.alert__why {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
}

.alert__fix {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  font-weight: 600;
}

.card--warn {
  border-left: 4px solid var(--color-false);
}

/* ==================================================================
 * 8. 형성평가 진행 점
 * ================================================================== */

.quiz__dot--on {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-primary-dark);
}

/* ==================================================================
 * 9. 시리얼 모니터 창 그림
 * ================================================================== */

.ide__win {
  fill: var(--color-console-bg);
  stroke: #0f172a;
  stroke-width: 1.5;
}

.ide__codetext {
  font-family: var(--font-mono);
  font-size: 12px;
  fill: var(--color-console-text);
}

.fig__leaderline {
  stroke: var(--color-text-sub);
  stroke-width: 1.2;
  stroke-dasharray: 4 3;
}

/* ==================================================================
 * 10. 인쇄
 * ================================================================== */

@media print {
  .sim__btns,
  .board__tools,
  .board__picker {
    display: none;
  }

  .foldout {
    break-inside: avoid;
  }

  /* 인쇄할 때는 접힌 것도 펼쳐 낸다 — 그러니 여백과 윗줄도 되살린다.
     («왜 평소에는 끄는가» 는 위쪽 .foldout__body 머리말 참고) */
  .foldout__body {
    display: block !important;
    padding: 0 var(--space-4) var(--space-4);
    border-top: 1px solid var(--color-border);
  }
}

/* ==================================================================
 * 11. 학습 흐름 다섯 칸 (1단계) — 명세 7장 «학습 흐름»
 *
 * student.css 의 `.flow` 는 앞 차시의 «세 칸» 을 담게 만든 것이라
 * 이 차시의 다섯 칸에서 4 + 1 로 접혔다. 게다가 `<ol>` 의 번호가
 * 상자 «밖» 에 「1.」 「2.」 로 따로 찍혀 상자 안의 동그란 번호와 겹쳐 보였다.
 *
 * 그래서 여기서 다시 정한다.
 *   · 목록 번호를 끈다 — 번호는 상자 «안» 의 동그라미가 맡는다
 *   · 다섯 칸을 «나란히» 둔다 (좁은 화면에서는 접힌다)
 *   · 번호와 이름을 상자 안에서 가운데로 모은다
 * ================================================================== */

.flow {
  /* ★ 상자 밖의 「1.」 「2.」 를 없앤다. 번호는 상자 안에 있다. */
  list-style: none;
  margin: 0;
  padding: 0;

  /* 다섯 칸을 나란히 — auto-fit 을 쓰지 않는다. 다섯이라고 못 박는다. */
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--space-2);
  align-items: stretch;
}

.flow__step {
  /* 상자 안을 가운데로 모은다 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  text-align: center;

  /* 손가락으로 누를 만한 높이 (누르는 것은 아니지만 눈으로도 «칸» 으로 보이게) */
  min-height: var(--touch-min);
  padding: var(--space-3) var(--space-2);

  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
}

.flow__no {
  /* student.css 의 24px 을 그대로 쓰되 줄어들지 않게 못 박는다 */
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
}

.flow__label {
  /* 위쪽 여백을 지운다 — 이제 gap 이 그 일을 한다 */
  margin-top: 0;
  font-size: var(--fs-small);
  line-height: 1.35;
  /* 「토양수분 실습」 처럼 긴 이름이 낱말 가운데서 끊기지 않게 */
  word-break: keep-all;
}

/* ── 좁은 화면 ──
   다섯 칸을 억지로 늘어놓으면 글자가 뭉개진다. 접는 것이 낫다. */
@media (max-width: 860px) {
  .flow {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 520px) {
  .flow {
    grid-template-columns: repeat(2, 1fr);
  }

  .flow__step {
    /* 아주 좁으면 번호와 이름을 한 줄로 — 위아래로 쌓으면 너무 길어진다 */
    flex-direction: row;
    justify-content: flex-start;
    text-align: left;
  }
}

/* ==================================================================
 * 12. 단계 머리말 — 딱지 · 제목 · 설명을 «위아래로» 쌓는다
 *
 * student.css 의 `.section-title` 은 앞 차시의 «한 줄 제목»
 *   [3단계] 회로 결선
 * 을 담게 만든 것이라 `display: flex; align-items: center` 다.
 *
 * 이 차시의 머리말은 세 덩이(딱지 · 제목 · 설명)이므로 그 자리에 넣으면
 *   · 셋이 «옆으로» 늘어서 제목과 설명이 나란히 붙고
 *   · 딱지가 눌려 「2단계」 가 「2단 / 계」 로 잘리고
 *   · 부모의 19px·굵기 800 이 설명 글까지 물들었다.
 *
 * 그래서 이 차시에서는 다시 정한다 — 딱지 → 제목 → 설명을 위아래로.
 * (2·3·4·5단계 머리말이 모두 이 규칙을 함께 쓴다)
 * ================================================================== */

.section-title {
  /* flex 를 끄고 위아래로 쌓는다 */
  display: block;
  margin: var(--space-6) 0 var(--space-4);

  /* ★ 자식에게 물려주지 않는다 — 크기와 굵기는 아래에서 저마다 정한다 */
  font-size: var(--fs-body);
  font-weight: 400;
}

.section-title:first-child {
  margin-top: 0;
}

/* ── 단계 딱지 (2단계 · 3단계 …) ── */
.section-title__tag {
  /* 글자가 들어갈 만큼 «저절로» 늘어나게 — 높이를 못 박지 않는다 */
  display: inline-block;
  min-width: 0;
  height: auto;
  padding: 3px 12px;
  margin: 0 0 var(--space-2);

  border-radius: 999px;
  background: var(--color-primary);
  color: #fff;

  font-size: var(--fs-small);
  font-weight: 700;
  line-height: 1.5;

  /* ★ 「2단계」 가 두 줄로 잘리지 않게 */
  white-space: nowrap;
}

/* ── 제목 ── */
.section-title h2 {
  margin: 0;
  font-size: var(--fs-h2);
  font-weight: 800;
  line-height: 1.35;
  /* 「두 센서의 원리 이해」 가 낱말 가운데서 끊기지 않게 */
  word-break: keep-all;
}

/* ── 설명 글 ── */
.section-title .para {
  /* 제목과 갈라 보이게 — 굵기를 되돌리고 색을 한 단계 옅게 */
  margin: var(--space-2) 0 0;
  max-width: var(--read-width);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.7;
  color: var(--color-text-sub);
  word-break: keep-all;
}

/* 제목 아래 옅은 줄 — «여기서 한 단계가 시작한다» 를 눈으로 알린다 */
.section-title {
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--color-border);
}

/* ==================================================================
 * 13. «채워지기 전» 에는 자리를 차지하지 않는다
 *
 * 화면 코드는 결과가 들어올 자리를 «빈 상자» 로 미리 만들어 둔다.
 *   .expresult  조건별 실행 결과   (실행을 누르기 전에는 비어 있다)
 *   .feedback   검사·안내 글       (검사를 누르기 전에는 비어 있다)
 *   .hintout    힌트               (힌트를 보기 전에는 비어 있다)
 *   .lint       5번 문법 도우미     (아무것도 적기 전에는 비어 있다)
 *
 * 이 가운데 .expresult 는 여백과 바탕색이 있어서, 비어 있는 동안
 * «옅은 초록 빈 띠» 로 보였다. (student.css 의 .board__status 는
 * 앞 차시에서 같은 일을 겪어 이미 :empty 를 달아 두었다)
 *
 * 그래서 «비어 있으면 아예 없는 것처럼» 둔다.
 * 자리를 미리 만드는 것은 코드의 편의일 뿐, 학생이 볼 일이 아니다.
 * ================================================================== */

.expresult:empty,
.feedback:empty,
.hintout:empty,
.lint:empty {
  display: none;
}

/* ==================================================================
 * 14. 그림과 설명을 «나란히» 둔다 (명세 18장)
 *
 * 앞판은 그림 아래에 설명이 길게 이어져서, 번호를 보고 아래로 눈을 내렸다가
 * 다시 올려야 했다. 그림이 클수록 그 거리가 멀어져 짝을 잃는다.
 *
 * 그래서 넓은 화면에서는 «그림 왼쪽 · 설명 오른쪽» 으로 나란히 둔다.
 *   ┌──────────────┬──────────┐
 *   │   그림        │ ① …      │
 *   │              │ ② …      │
 *   ├──────────────┤ ③ …      │
 *   │ 그림 설명글   │ ④ …      │
 *   └──────────────┴──────────┘
 * 좁은 화면에서는 위아래로 되돌린다.
 * ================================================================== */

.fig {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(230px, 0.62fr);
  grid-template-rows: auto auto;
  column-gap: var(--space-4);
  row-gap: var(--space-2);
  align-items: start;
}

.fig__canvas {
  grid-column: 1;
  grid-row: 1;
}

.fig__cap {
  grid-column: 1;
  grid-row: 2;
  margin-top: 0;
}

/* 설명 목록이 오른쪽 칸을 두 줄에 걸쳐 차지한다 */
.figleg {
  grid-column: 2;
  grid-row: 1 / span 2;

  list-style: none;
  margin: 0;
  padding: var(--space-3);
  display: grid;
  gap: var(--space-2);
  align-content: start;

  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

/* 좁은 그림(부품 하나짜리)은 SVG 의 min-width 가 이겨 칸을 밀어낸다.
   그래서 그림 칸 안에서만 옆으로 넘기게 둔다. */
.fig__canvas {
  overflow-x: auto;
}

/* ── 설명 한 줄 ── */
.figleg__item {
  display: grid;
  grid-template-columns: 1.7em 1fr;
  gap: var(--space-2);
  align-items: start;
}

.figleg__no {
  /* 그림 위의 번호 딱지와 «같은 모양» 으로 — 눈이 짝을 바로 찾게 */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
}

.figleg__body {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.figleg__name {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text);
  word-break: keep-all;
}

.figleg__note {
  font-size: 13px;
  line-height: 1.55;
  color: var(--color-text-sub);
  word-break: keep-all;
}

/* ── 좁은 화면 : 위아래로 되돌린다 ── */
@media (max-width: 900px) {
  .fig {
    grid-template-columns: 1fr;
  }

  .fig__canvas,
  .fig__cap,
  .figleg {
    grid-column: 1;
  }

  .fig__canvas {
    grid-row: auto;
  }

  .fig__cap {
    grid-row: auto;
  }

  .figleg {
    grid-row: auto;
  }
}

/* ==================================================================
 * 15. 활용 사례 그림 — 밤하늘 · 가로등 · 자동차 (명세 8.1)
 * ================================================================== */

.night__sky {
  fill: var(--night-sky);
  stroke: var(--night-sky-edge);
  stroke-width: 1.5;
}

.night__star {
  fill: var(--night-star);
  opacity: 0.85;
}

.night__moon {
  fill: var(--night-moon);
  opacity: 0.95;
}

.night__ground {
  fill: var(--night-ground);
}

.night__kerb {
  stroke: var(--night-kerb);
  stroke-width: 2;
}

/* ── 가로등 ── */
.lamp__base {
  fill: var(--lamp-metal-edge);
}

.lamp__pole {
  fill: var(--lamp-metal);
  stroke: var(--lamp-metal-edge);
  stroke-width: 1;
}

.lamp__arm {
  fill: none;
  stroke: var(--lamp-metal);
  stroke-width: 7;
  stroke-linecap: round;
}

.lamp__hood {
  fill: var(--lamp-hood);
  stroke: var(--lamp-metal-edge);
  stroke-width: 1.2;
}

.lamp__glass {
  fill: var(--lamp-glass);
  stroke: var(--lamp-glass-edge);
  stroke-width: 1.5;
}

/* 빛 기둥과 바닥에 고인 빛 — 위에서 아래로 옅어진다 */
.lamp__beam {
  fill: var(--lamp-beam);
  opacity: 0.22;
}

.lamp__pool {
  fill: var(--lamp-beam);
  opacity: 0.3;
}

/* ── 자동차 ── */
.car__shadow {
  fill: #0d1422;
  opacity: 0.45;
}

.car__body {
  fill: var(--car-body);
  stroke: var(--car-body-edge);
  stroke-width: 1.8;
}

.car__glass {
  fill: var(--car-glass);
  stroke: var(--car-glass-edge);
  stroke-width: 1.2;
}

.car__seam {
  stroke: var(--car-seam);
  stroke-width: 1.5;
}

.car__handle {
  fill: var(--car-glass);
}

.car__tyre {
  fill: var(--car-tyre);
}

.car__rim {
  fill: var(--car-rim);
  stroke: var(--car-hub);
  stroke-width: 1;
}

.car__hub {
  fill: var(--car-hub);
}

.car__head {
  fill: var(--car-head);
  stroke: var(--lamp-glass-edge);
  stroke-width: 1;
}

.car__tail {
  fill: var(--car-tail);
}

.car__beam {
  fill: var(--lamp-beam);
  opacity: 0.24;
}

/* ── 두 그림에 함께 쓰는 «조도센서» 몸통 ── */
.sensor__case {
  fill: var(--sensor-case);
  stroke: #14171b;
  stroke-width: 1;
}

/* 어두운 배경 위의 이름표 — 밝게 둔다 */
.use__caption {
  font-size: 13px;
  font-weight: 700;
  fill: var(--night-star);
  text-anchor: start;
  font-family: var(--font-sans);
}

/* ==================================================================
 * 16. 번호 표시 — «파란 동그라미 + 흰 숫자» 하나로
 *
 * 앞판의 번호는 동그라미가 «두 겹» 이었다.
 *   ① .fig__badgebg 에 걸린 흰 테두리(stroke: #ffffff)
 *   ② 그 안에 넣은 «동그라미 숫자» 글자 ①②③ — 글자 자체가 또 동그라미다
 *
 * 흰 테두리를 지운다. 글자를 맨 숫자로 바꾸는 일은
 * s45-figures.js 의 plainNo() 가 맡는다 (자료는 ①②③ 그대로 두고 «그릴 때만» 바꾼다).
 *
 * ★ 다른 흰 테두리는 건드리지 않는다.
 *   .pin__dot · .fig__hole · .fig__leaderdot · .fig__leaderhalo 의 흰 선은
 *   «청록 보드·검은 헤더·흰 종이 세 바탕 위에서 모두 보이게» 하려고 깐 것이다.
 *   숫자와는 상관이 없다.
 * ================================================================== */

.fig__badgebg {
  fill: var(--color-primary);
  stroke: none;
}

/* 숫자는 흰색으로, 동그라미 안에서 가운데 */
.fig__badgeno {
  fill: #ffffff;
  font-size: 13px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* ==================================================================
 * 17. 목록 표시(점·번호)를 끈다
 *
 * 이 앱은 «목록» 을 뜻이 있어서 쓴다 — 낭독기에 「항목 6개 중 1번째」 로
 * 읽히게 하려는 것이다. 그러나 «점과 번호» 는 화면에 보일 필요가 없다.
 * 칸마다 이미 테두리나 번호 딱지가 있어서 두 번 세는 셈이 된다.
 *
 *   .iocards   활용 사례 카드 — 칸 위에 굵은 색 띠가 있는데 그 옆에 점이 또 찍혔다
 *   .modetabs  코딩 차례 — 칸 안에 번호 딱지가 있는데 밖에 「1. 2. 3.」 이 또 찍혔다
 *
 * (.flow 는 위쪽 11번에서 같은 까닭으로 이미 껐다)
 *
 * ★ list-style 만 끄고 «목록» 자체는 그대로 둔다.
 *   <div> 로 바꾸면 낭독기가 개수를 세어 주지 못한다(명세 18장).
 * ================================================================== */

.iocards,
.modetabs {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* ==================================================================
 * 18. 시뮬레이션 판의 글씨 — 어느 배경에서나 읽히게
 *
 * ★ 왜 색 하나로는 안 되는가
 *   조도 판의 배경은 «슬라이더에 따라 밝기가 바뀐다»(.sim__sky 투명도 0.06 → 0.56).
 *   밝을 때 잘 보이는 색은 어두울 때 묻히고, 그 반대도 마찬가지다.
 *   실제로 앞판은 이랬다.
 *     .fig__chiptext  #cbd5e1 (밝은 회색) → 밝은 배경에서 안 보임 (토양 판)
 *     .fig__minitext  #1f2937 (거의 검정) → 어두운 배경에서 안 보임 (조도 판)
 *
 * ★ 그래서 «흰 글자 + 어두운 테두리» 로 둔다
 *   지도의 지명처럼, 흰 글자는 어두운 테두리와 늘 갈라지고
 *   어두운 테두리는 밝은 배경과 늘 갈라진다. 배경이 어떻게 바뀌어도 읽힌다.
 *   paint-order: stroke 는 «테두리를 먼저, 글자를 나중에» 그리게 해
 *   글자가 테두리에 파먹히지 않게 한다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 18장) — 이 글씨들은 눈금판의 숫자·상태 글자와
 * 같은 것을 다시 말해 주는 자리다.
 * ================================================================== */

/* ★ «조도 판만» 이다.
   조도 판의 배경은 슬라이더에 따라 밝기가 바뀌므로 테두리가 필요하다.
   토양 판(배선 그림)은 배경이 흰색으로 고정이고, 글자마다 놓이는 자리에 맞는
   이름(figtxt · figboard · figchip …)을 이미 쓰고 있다.
   여기서 .sim__scene text 로 넓게 걸면 그 이름들을 «덮어» 흰 글자로 만들어 버린다
   — 실제로 그랬고, 흰 배경 위 대비가 1.0 이 되었다. */
.sim--light .sim__scene text {
  fill: #ffffff;
  paint-order: stroke;
  stroke: rgba(9, 15, 27, 0.9);
  stroke-width: 3.2px;
  stroke-linejoin: round;
  stroke-linecap: round;
  font-weight: 800;
}

/* 조건 이름(«☾ 빛을 차단») 은 이 판에서 가장 먼저 읽어야 하는 글이다 */
.sim--light .sim__scene .fig__chiptext {
  font-size: 13px;
}

.sim--light .sim__scene .fig__minitext {
  font-size: 12.5px;
}

/* ==================================================================
 * 19. 시뮬레이션 판의 그림 크기를 줄인다
 *
 * 앞판은 카드 폭을 다 채워 638×240 으로 그려졌다. 슬라이더와 눈금판이
 * 아래에 이어지는데 그림이 그만큼 크면 «한 화면에» 함께 보이지 않는다.
 * 이 판의 알맹이는 «슬라이더를 움직이며 눈금이 바뀌는 것을 보는 것» 이므로
 * 그림은 거들기만 하면 된다.
 *
 * 높이를 못 박지 않고 폭만 줄인다 — 높이를 함께 못 박으면 그림이 눌려 찌그러진다.
 * ================================================================== */

.sim__scene {
  /* 줄인 그림을 가운데로 */
  display: flex;
  justify-content: center;
}

.sim__svg {
  width: 100%;
  max-width: 380px;
  height: auto;
  /* 아주 큰 화면에서 늘어나는 것만 막는다. 비율은 viewBox 가 지킨다. */
  max-height: none;
}

/* ==================================================================
 * 20. 그림 속 글자 — «어디에 놓이는가» 로 이름을 가른다
 *
 * ★ 앞판이 안 보였던 까닭
 *   student.css 의 두 이름이 «두 바탕» 에서 함께 쓰였다.
 *     .fig__chiptext  #cbd5e1 (밝은 회색)  → 흰 종이 위에서 대비 1.5
 *     .mod__note      #e6efe9 (밝은 초록)  → 흰 종이 위에서 대비 1.2
 *   초록 기판 위에서는 맞는 색이지만 종이 위에서는 묻힌다.
 *   한 이름을 두 뜻으로 쓰면 한쪽은 반드시 틀린다.
 *
 * 그래서 놓이는 자리로 이름을 가른다.
 *     figtxt     흰 종이 위  → 진한 글자
 *     figboard   초록 기판 위 → 밝은 글자
 *     figpad     금색 단자 옆 → 진한 글자, 작게
 *     figchip    검은 칩 위   → 밝은 글자, 아주 작게
 * ================================================================== */

/* ── 종이 위 (흰 배경) ── */
.figtxt {
  fill: var(--color-text);
  font-size: 12.5px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 이 차시에서 «쓰는» 곳 — 눈에 띄는 파랑 */
.figtxt--go {
  fill: var(--color-primary-dark);
}

/* 쓰지 않는 것 · 하지 말아야 하는 것 — 주의 색 */
.figtxt--off {
  fill: var(--color-false-dark);
}

.figtxt--code {
  font-family: var(--font-mono);
  font-size: 12px;
  fill: var(--color-primary-dark);
}

/* 색 있는 도형(흙·물) 위에 놓이는 글자만 테두리를 준다 */
.figtxt--halo {
  fill: #ffffff;
  paint-order: stroke;
  stroke: rgba(9, 15, 27, 0.9);
  stroke-width: 3.2px;
  stroke-linejoin: round;
}

/* ── 초록 기판 위 ── */
/* ★ 초록 기판(#2f7d4f)은 꽤 밝아서 옅은 초록 글자는 대비 4.5 를 못 넘는다.
   그래서 기판 위 글자는 «흰색» 으로 둔다 (5.0). */
.figboard {
  fill: #ffffff;
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figboard--title {
  fill: #ffffff;
  font-size: 12.5px;
  font-weight: 800;
}

/* 작은 이름표라도 대비를 낮추지 않는다.
   #bfd8c7 은 3.3, #e2f1e8 도 4.3 으로 기준(4.5)을 못 넘었다.
   «작으니까 옅게» 가 통하지 않는 바탕이다. 크기만 줄이고 색은 흰색으로 둔다. */
.figboard--dim {
  fill: #ffffff;
  font-size: 10.5px;
  opacity: 0.92;
}

/* ── 금색 단자 이름 (VCC · AO …) ── */
.figpad {
  fill: #2b2205;
  font-size: 11px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* ── 검은 칩 위의 품번 ── */
.figchip {
  fill: #d7dee8;
  font-size: 10px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-mono);
}

/* ==================================================================
 * 21. 비교기 모듈 그림의 새 부품
 * ================================================================== */

/* 나사 구멍 */
.mod__screw {
  fill: #1b3f2a;
  stroke: #14301f;
  stroke-width: 1;
}

/* 가변저항의 돌리는 자리 */
.mod__trimdial {
  fill: #dfe6ef;
  stroke: #9aa7b8;
  stroke-width: 1;
}

/* 비교기 칩과 다리 */
.mod__chip {
  fill: #23282f;
  stroke: #14171b;
  stroke-width: 1;
}

.mod__chipleg {
  stroke: #b9c3cf;
  stroke-width: 2;
  stroke-linecap: round;
}

/* VCC·GND 를 한 번호로 묶는 띠 */
.mod__group {
  stroke: var(--color-text-sub);
  stroke-width: 2;
  stroke-linecap: round;
}

/* ==================================================================
 * 22. «물이 닿을 때 ↔ 마를 때» 두 쪽 비교 그림 (명세 4.2 · 8.2)
 *
 * 첨부 자료의 설명 그림을 옮긴 것이다. 같은 부품이 조건에 따라 어떻게
 * 달라지는지 나란히 놓고 견준다.
 *
 * 색만으로 뜻을 전하지 않는다 — 물방울에 ○ / ✕ 를 «도형으로» 얹고,
 * 아래에 «저항 값 : 낮아짐 / 높아짐» 을 글자로 적는다.
 * ================================================================== */

/* 두 쪽을 가르는 점선 */
.cmpline {
  stroke: var(--color-border-strong);
  stroke-width: 2.5;
  stroke-dasharray: 9 7;
}

/* 물방울 */
.wdrop {
  fill: var(--soil-drop);
  stroke: #2f7fbf;
  stroke-width: 1.5;
}

.wdrop__shine {
  fill: #ffffff;
  opacity: 0.55;
}

/* ○ 는 «된다», ✕ 는 «안 된다» */
.wmark {
  fill: none;
  stroke-width: 4.5;
  stroke-linecap: round;
}

.wmark--ok {
  stroke: var(--color-error);
}

.wmark--no {
  stroke: #1f2937;
}

/* 굽은 화살표 */
.cmparrow {
  fill: none;
  stroke-width: 3.5;
  stroke-linecap: round;
}

.cmparrow--wet {
  stroke: var(--color-primary);
}

.cmparrow--dry {
  stroke: var(--color-false);
}

.cmphead--wet {
  fill: var(--color-primary);
}

.cmphead--dry {
  fill: var(--color-false);
}

/* 요약 딱지 — 테두리 색과 «글자» 를 함께 쓴다 */
.cmpbox {
  fill: #ffffff;
  stroke-width: 2;
}

.cmpbox--wet {
  stroke: var(--color-primary);
}

.cmpbox--dry {
  stroke: var(--color-false);
}

/* 탐침 판에 뚫린 구멍과 나사 구멍 */
.probe__vent {
  fill: #8b7638;
  opacity: 0.55;
}

.probe__hole {
  fill: #14171b;
  stroke: #3f4652;
  stroke-width: 1;
}

/* ==================================================================
 * 23. 배선 그림 — 우노 · 비교기 모듈 · 탐침 (첨부 자료 반영)
 *
 * ★ 이 판은 부품이 셋이라 조도 판보다 넓어야 글자가 읽힌다.
 *   조도 판은 380px 그대로 두고 이 판만 넓힌다.
 * ================================================================== */

.sim--soil .sim__svg {
  max-width: 520px;
}

/* FC-28 비교기 모듈 — 실물은 남색 기판이다 */
.fc28__body {
  fill: #16305c;
  stroke: #0d1f3d;
  stroke-width: 1.5;
}

.fc28__led {
  fill: #3f4652;
  stroke: #23282f;
  stroke-width: 1;
}

.fc28__led--on {
  fill: #4ade80;
  stroke: #16a34a;
}

.fc28__led--warn {
  fill: #f87171;
  stroke: #dc2626;
}

/* 우노 헤더의 핀 구멍 */
.wirepin {
  fill: #14171b;
  stroke: #b9c3cf;
  stroke-width: 1.5;
}

/* 케이블 — 색은 읽기 편하려고 쓰고, 무엇을 잇는지는 글자로 적는다 */
.cable {
  fill: none;
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.cable--red {
  stroke: #d63b2f;
}

.cable--black {
  stroke: #22262c;
}

.cable--yellow {
  stroke: #e3a008;
}

.cable--gray {
  stroke: #9aa3ae;
  stroke-width: 2.4;
}

/* 배선 그림의 작은 글자들 */
.figtxt--pin {
  font-size: 11px;
  font-family: var(--font-mono);
  fill: var(--color-primary-dark);
}

.figtxt--wire {
  font-size: 11.5px;
  font-family: var(--font-mono);
  fill: var(--color-text-sub);
}

.figtxt--muted {
  font-size: 10.5px;
  font-weight: 700;
  fill: var(--color-false-dark);
}

/* ==================================================================
 * 24. AO 를 «가리켜» 보이기 (비교기 모듈 그림)
 *
 * 앞판은 «← 이 차시는 여기를 쓴다» 였는데 화살표가 왼쪽을 가리켜
 * 무엇을 뜻하는지 알 수 없었다. 그래서 두 가지로 바꿨다.
 *   ⓐ AO 칸 전체에 옅은 테두리를 두른다
 *   ⓑ 글에서 AO 쪽으로 «위를 가리키는» 화살표를 그린다
 * ================================================================== */

.aohl {
  fill: var(--color-primary-soft);
  stroke: var(--color-primary);
  stroke-width: 2;
  stroke-dasharray: 6 4;
}

.aoarrow {
  stroke: var(--color-primary-dark);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.aohead {
  fill: var(--color-primary-dark);
}

/* ==================================================================
 * 25. 케이블을 «갈라» 보이게 — 흰 겉껍질
 *
 * 세 줄이 나란히 지나므로 색만으로는 어디서 갈라지는지 알기 어려웠다.
 * 색 선 아래에 굵은 흰 선을 깔면 선 사이에 흰 틈이 생겨 «세 줄» 로 또렷해진다.
 * (실물 배선 사진에서 선이 겹쳐도 구분되는 것과 같은 방법이다)
 * ================================================================== */

.cable__case {
  fill: none;
  stroke: var(--color-surface);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 꺾이는 자리의 점 — 눈으로 선을 따라가기 쉽게 */
.cable__dot {
  stroke: var(--color-surface);
  stroke-width: 1.6;
}

.cable__dot--red {
  fill: #d63b2f;
}

.cable__dot--black {
  fill: #22262c;
}

.cable__dot--yellow {
  fill: #e3a008;
}

/* 모듈 기판 «안» 에 적는 단자 이름 (VCC · GND · DO · AO) */
.figboard--pin {
  font-size: 9px;
  font-weight: 800;
  fill: #ffffff;
  font-family: var(--font-sans);
}

/* ==================================================================
 * 26. 시뮬레이션 단추의 터치 영역 (명세 18장 «터치 영역 44px 이상»)
 *
 * btn--small 은 앞 차시에서 물려받은 것이라 높이가 36px 였다.
 * 이 판의 단추는 학생이 «가장 많이 누르는» 것이므로 44px 을 지킨다.
 * 조건을 고르고 물을 주는 일이 이 판의 알맹이다.
 * ================================================================== */

.sim__btns .btn {
  min-height: var(--touch-min);
  padding-inline: var(--space-3);
}

/* ==================================================================
 * 27. 스마트팜 그림 — «재기 → 판단 → 급수» 흐름
 * ================================================================== */

.farm__house {
  fill: var(--use-house);
  stroke: #7ba8cf;
  stroke-width: 2;
  opacity: 0.75;
}

/* 온실 뼈대 — 이것이 있어야 «온실» 로 보인다 */
.farm__rib {
  stroke: #7ba8cf;
  stroke-width: 1.6;
  opacity: 0.85;
}

.farm__pipe {
  stroke: var(--use-metal);
  stroke-width: 5;
  stroke-linecap: round;
}

.farm__nozzle {
  stroke: var(--use-metal);
  stroke-width: 3;
  stroke-linecap: round;
}

.farm__stem {
  stroke: #37764c;
  stroke-width: 3;
  stroke-linecap: round;
}

/* 제어기 상자와 표시창 */
.farm__box {
  fill: #2b3444;
  stroke: #1a2230;
  stroke-width: 2;
}

.farm__screen {
  fill: #0f2a1c;
  stroke: #1f5138;
  stroke-width: 1.5;
}

.farm__read {
  fill: #6ee7a0;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-mono);
}

.farm__readsub {
  fill: #c7d2de;
  font-size: 10px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* «무엇을 읽은 값인가» — 숫자 위에 붙는 작은 이름표 */
.farm__readlabel {
  fill: #8fd7ff;
  font-size: 10px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-mono);
}

/* 「저항값이 아니라 아날로그값」 — 제어기 아래, 흰 종이 위 */
.farm__unit {
  fill: var(--color-text-sub);
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
}

.farm__unit--strong {
  fill: var(--color-primary-dark);
  font-size: 12px;
  font-weight: 800;
}

/* 값이 만들어지는 차례 — 저항은 «뒤» 에 있다 */
.farm__chain {
  fill: var(--color-text);
  font-size: 11px;
  font-weight: 700;
}


/* 흐름 화살표 — «무엇이 무엇을 시키는가» */
.farm__flow {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 2.6;
  stroke-dasharray: 8 6;
  stroke-linecap: round;
}

.farm__flowhead {
  fill: var(--color-primary);
}

.farm__flowlabel {
  fill: var(--color-primary-dark);
  font-size: 11.5px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* ==================================================================
 * 28. «단자 찾기» 화면 — 눌러야 할 단자를 크게
 *
 * 결선 화면과 달리 부품 두세 개만 내므로 그림을 크게 그릴 수 있다.
 * 단자 이름과 누르는 판을 함께 키워, 무엇을 눌러야 하는지 헷갈리지 않게 한다.
 * ================================================================== */

.board__svg--find {
  /* 결선 화면의 min-width(720px)를 물려받지 않는다 — 부품 몇 개뿐이다.
     폭은 «여기서» 정한다. s40-board.js 의 fitSvg 는 찾기 화면에서 손을 뗀다
     — 폭을 재서 폭을 정하면 스크롤바와 서로를 밀어 어긋나기 때문이다. */
  /* 320px 은 «단자를 44px 로 누를 수 있는» 가장 작은 폭이다.
     토양 쪽 틀이 244 단위 폭이고 누르는 판의 지름이 34 단위이므로
     320 / 244 × 34 ≈ 45px 이 된다. 손전화에서 20px 쯤 옆으로 밀리는 것은
     칸 안에서만 일어나고, 손가락보다 작은 단자보다는 낫다. */
  min-width: 320px;
  width: 100%;
  max-width: 560px;
  /* 조도 쪽 틀은 세로로 길다. 폭만 정해 두면 세로가 900px 을 넘어
     칸(max-height: 70vh) 안에서 또 위아래로 밀린다. 높이에도 뚜껑을 씌우면
     브라우저가 비율을 지키며 줄여 준다.
     70vh 에서 24px 을 빼는 까닭은 칸의 «안쪽 여백» 이다 — 그것을 빼지 않으면
     그림이 칸에 꼭 맞아 도리어 스크롤바가 생긴다. 뚜껑이 낮을수록 그림이
     작아지고 누르는 단자도 작아지므로, 스크롤이 나지 않는 선에서 가장 크게 둔다. */
  max-height: calc(70vh - 24px);
  height: auto;
  margin: 0 auto;
}

.board__svg--find .pin__label {
  font-size: 13px;
  font-weight: 800;
}

/* ── 부품 단자의 이름표 — «흰색이 아니라» 진한 글자 ──────────────────
 * .pin__label 의 흰색은 우노·브레드보드의 «검은 헤더 위» 를 위한 것이다.
 * 모듈·LED·저항의 단자는 기판 밖 흰 자리에 놓이므로 흰 글자면 보이지 않는다.
 * 실제로 VCC · AO · GND 가 그렇게 사라져 있었다.
 * 갈래마다 색을 달리해 읽기 쉽게 하되, 글자 자체가 이미 이름을 말하므로
 * 색만으로 뜻을 전하는 것은 아니다(명세 18장).
 * ------------------------------------------------------------------ */
.pin__label--part {
  fill: #1f2937;
  font-size: 12px;
  paint-order: stroke;
  stroke: var(--color-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.pin--hot .pin__label--part {
  fill: #b1180f;
}

.pin--gnd .pin__label--part {
  fill: #111827;
}

.pin--sig .pin__label--part {
  fill: #a2510a;
}

.board__svg--find .pin__label--part {
  font-size: 14px;
}

/* 기판에서 단자로 내려오는 다리 */
.mod__lead {
  stroke: #9aa3ae;
  stroke-width: 3.5;
  stroke-linecap: round;
}

/* 고를 수 있는 단자를 «옅은 고리» 로 미리 알려 준다 */
.board__svg--find .pin__dot {
  r: 9;
  stroke: var(--color-primary);
  stroke-width: 2.5;
}

.board__svg--find .pin:hover .pin__dot,
.board__svg--find .pin__hit:focus-visible + .pin__dot {
  fill: var(--color-primary);
}

.board__svg--find .pin__hit {
  cursor: pointer;
}

/* ── «단자 찾기» 의 물음 상자와 진행 점 ── */
.findask {
  border: 1px solid var(--color-primary);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-3);
}

.findask__step {
  margin: 0 0 var(--space-1);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-primary-dark);
}

.findask__q {
  margin: 0 0 var(--space-2);
  font-size: 18px;
  font-weight: 800;
  line-height: 1.45;
  word-break: keep-all;
}

.findask__how {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.finddots {
  display: flex;
  gap: var(--space-2);
  margin: 0 0 var(--space-2);
}

.finddots__dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: 12px;
  font-weight: 800;
}

.finddots__dot--done {
  background: var(--color-true);
  border-color: var(--color-true-dark);
  color: #fff;
}

.finddots__dot--now {
  background: var(--color-primary);
  border-color: var(--color-primary-dark);
  color: #fff;
}

    <script data-from="shared/config.js">
/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 15장)
 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «마지막 단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 15장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다. */
    autosaveKeyPrefix: "sensor1-draft-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 */
    loopLimit: 3,
    stepLimit: 20000,
    playSpeeds: [1, 4, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;

    /* 왼쪽 아래 — 이 차시의 부품. 우노 «아래», 브레드보드 «옆» 이다.
       이렇게 두어야 그림이 옆으로도 아래로도 지나치게 커지지 않는다. */
    cds: { x: 24, y: 300, w: 150, h: 116 },
    led: { x: 200, y: 300, w: 100, h: 150 },
    res: { x: 330, y: 310, w: 140, h: 100 },
    soil: { x: 24, y: 300, w: 180, h: 130 },
    probe: { x: 250, y: 300, w: 200, h: 190 }
  };

  /**
   * 아두이노 우노.
   *
   * 이 차시가 쓰는 것만 낸다. D0~D13 을 다 내면 단자가 서른 개를 넘어
   * 좁은 화면에서 손가락으로 고를 수 없다(명세 18장 «터치 영역 44px 이상»).
   */
  /** 우노 헤더 i 번째 칸의 x — 그림과 단자가 이 하나를 함께 쓴다 */
  function headerX(row, i) {
    var pitch = row.pitch || LAYOUT.unoHeader.pitch;
    return row.x + i * pitch + (i >= row.gapAt ? row.gap : 0);
  }

  function buildUno() {
    var pins = [];
    var H = LAYOUT.unoHeader;
    /** 이름으로 헤더 칸을 찾는다 — 같은 이름이 둘이면 몇 번째인지도 준다 */
    function at(row, name, nth) {
      var seen = 0;
      for (var i = 0; i < row.names.length; i += 1) {
        if (row.names[i] === name) {
          seen += 1;
          if (seen === (nth || 1)) return headerX(row, i);
        }
      }
      return row.x;
    }
    /* 위쪽 줄 — 디지털 (왼쪽부터 D2 · D3) */
    var digital = [
      { id: "D2", label: "D2", kind: "digital", note: "조도 실습 LED 신호" },
      { id: "D3", label: "D3", kind: "digital", note: "첨부 원자료가 쓴 핀 — 이 차시는 D2 를 쓴다" }
    ];
    digital.forEach(function (p) {
      pins.push({
        id: p.id,
        label: p.label,
        kind: p.kind,
        note: p.note,
        x: at(H.top, p.id),
        y: H.top.y,
        side: "bottom"
      });
    });

    /* 아래쪽 왼편 — 전원 */
    var power = [
      { id: "5V", label: "5V", kind: "power", note: "센서 모듈에 전기를 준다" },
      { id: "GND1", label: "GND", kind: "ground", note: "접지 (보드 안에서 GND 끼리 이어져 있다)" },
      { id: "GND2", label: "GND", kind: "ground", note: "접지 (GND1 과 같은 마디)" }
    ];
    power.forEach(function (p, i) {
      pins.push({
        id: p.id,
        label: p.label,
        kind: p.kind,
        note: p.note,
        /* GND 가 둘이므로 «몇 번째 GND» 인지로 찾는다 */
        x: at(H.bottom, p.label, p.id === "GND2" ? 2 : 1),
        y: H.bottom.y,
        side: "top"
      });
    });

    /* 아래쪽 오른편 — 아날로그 입력 */
    ["A0", "A1", "A2"].forEach(function (id, i) {
      pins.push({
        id: id,
        label: id,
        kind: "analog",
        note:
          id === "A0"
            ? "조도센서 모듈 AO 를 받는다"
            : id === "A1"
            ? "토양수분 모듈 AO 를 받는다"
            : "이 차시에서는 쓰지 않는다",
        x: at(H.bottom, id),
        y: H.bottom.y,
        side: "top"
      });
    });

    return {
      id: "uno",
      label: "아두이노 우노",
      short: "우노",
      x: LAYOUT.uno.x,
      y: LAYOUT.uno.y,
      w: LAYOUT.uno.w,
      h: LAYOUT.uno.h,
      pins: pins
    };
  }

  /**
   * 브레드보드. 명세 9장 «같은 열의 5개 구멍, 전원 레일» 을 실제 연결 관계로 담는다.
   *
   * 열 이름 : 1~12
   * 줄 이름 : A~E (위쪽 묶음) · F~J (아래쪽 묶음) — 가운데 홈으로 끊겨 있다
   * 레일    : plus(＋) · minus(−) 두 줄
   */
  function buildBreadboard() {
    var pins = [];
    var cols = 12;
    var x0 = LAYOUT.bb.x0;
    var y0 = LAYOUT.bb.y0;

    /* 전원 레일 — 구멍은 여섯 개만 내지만 전기적으로는 «한 마디» 다 */
    for (var r = 0; r < 6; r += 1) {
      pins.push({
        id: "P" + (r + 1),
        label: "＋",
        kind: "rail",
        rail: "plus",
        note: "＋ 레일 — 이 줄 전체가 한 마디다",
        x: x0 + r * PITCH * 2,
        y: y0
      });
      pins.push({
        id: "N" + (r + 1),
        label: "−",
        kind: "rail",
        rail: "minus",
        note: "− 레일 — 이 줄 전체가 한 마디다",
        x: x0 + r * PITCH * 2,
        y: y0 + PITCH
      });
    }

    /* 본판 — 같은 열이면 같은 마디 */
    var rowsTop = ["A", "B", "C", "D", "E"];
    var rowsBottom = ["F", "G", "H", "I", "J"];
    for (var c = 1; c <= cols; c += 1) {
      rowsTop.forEach(function (row, ri) {
        pins.push({
          id: row + c,
          label: row + c,
          kind: "hole",
          col: c,
          group: "top",
          note: c + "번 열 위쪽 묶음 — A" + c + "~E" + c + " 는 서로 이어져 있다",
          x: x0 + (c - 1) * PITCH,
          y: y0 + PITCH * (3 + ri)
        });
      });
      rowsBottom.forEach(function (row, ri) {
        pins.push({
          id: row + c,
          label: row + c,
          kind: "hole",
          col: c,
          group: "bottom",
          note: c + "번 열 아래쪽 묶음 — F" + c + "~J" + c + " 는 서로 이어져 있다",
          x: x0 + (c - 1) * PITCH,
          y: y0 + PITCH * (9 + ri)
        });
      });
    }

    return {
      id: "bb",
      label: "브레드보드",
      short: "브레드보드",
      x: LAYOUT.bb.x,
      y: LAYOUT.bb.y,
      w: LAYOUT.bb.w,
      h: LAYOUT.bb.h,
      /* 구멍의 첫 자리 — 그리는 쪽이 이것을 읽어 같은 자리에 그린다 */
      x0: x0,
      y0: y0,
      pins: pins
    };
  }

  /**
   * 조도센서 모듈 (명세 10.1)
   *
   * 첨부 자료의 CdS 소자는 다리에 «구분이 없다». 그러나 모듈로 만들면
   * VCC / AO / GND 라는 단자 구분이 생긴다 — 그 차이를 학생이 알아야 한다.
   */
  function buildCds() {
    return {
      id: "cds",
      label: "조도센서 모듈",
      short: "조도",
      /* ★ 단자는 기판 «아래 가장자리» 에 둔다.
         기판 안에 두었더니 누르는 동그라미가 기판 위의 글자(«CdS 광전도체»)를
         덮어 무엇을 누르는지 알 수 없었다. 실물 모듈이 그렇다. */
      x: LAYOUT.cds.x,
      y: LAYOUT.cds.y,
      w: LAYOUT.cds.w,
      h: LAYOUT.cds.h,
      pins: [
        {
          id: "VCC",
          label: "VCC",
          kind: "power",
          note: "전기를 받는 단자 — 우노의 5V 로 간다",
          x: LAYOUT.cds.x + 40,
          /* 실물 모듈처럼 기판 아래로 «다리» 가 나와 단자가 달린다.
             드는 자리를 26 띄우면 잇는 선이 보이고 이름표도 겹치지 않는다. */
          y: LAYOUT.cds.y + LAYOUT.cds.h + 26
        },
        {
          id: "AO",
          label: "AO",
          kind: "signal",
          note: "빛의 세기가 «연속값» 으로 나오는 단자 — A0 로 간다",
          x: LAYOUT.cds.x + 75,
          /* 실물 모듈처럼 기판 아래로 «다리» 가 나와 단자가 달린다.
             드는 자리를 26 띄우면 잇는 선이 보이고 이름표도 겹치지 않는다. */
          y: LAYOUT.cds.y + LAYOUT.cds.h + 26
        },
        {
          id: "GND",
          label: "GND",
          kind: "ground",
          note: "접지 단자 — 우노의 GND 로 간다",
          x: LAYOUT.cds.x + 110,
          /* 실물 모듈처럼 기판 아래로 «다리» 가 나와 단자가 달린다.
             드는 자리를 26 띄우면 잇는 선이 보이고 이름표도 겹치지 않는다. */
          y: LAYOUT.cds.y + LAYOUT.cds.h + 26
        }
      ]
    };
  }

  /** LED — 긴 다리가 양극(A), 짧은 다리가 음극(K). 명세 4.1 마지막 줄 */
  function buildLed() {
    return {
      id: "led",
      label: "LED",

      /* ★ 조도 모듈 «아래» 에 쌓는다. 모듈의 단자 이름표가 기판 밖으로

      x: LAYOUT.led.x,

          /* ★ 긴 다리(양극)는 «더 아래» 까지 내려온다 — 길이 차이가 실물처럼 보이게.
             K 보다 20 아래다. 두 단자 사이는 sqrt(50² + 20²) ≈ 54 로
             누르는 판(지름 34)이 서로 겹치지 않는다. */
          y: LAYOUT.led.y + 136
        },

          id: "K",
          label: "−(짧은 다리)",

  /** 220Ω 저항 — 양쪽 다리에 구분이 없다(어느 쪽을 어디에 꽂아도 같다) */

  /**

          x: LAYOUT.soil.x + 102,

  /** 탐침 — 흙에 꽂는 두 갈래 판 */
  function buildProbe() {
