    <script data-from="teacher/t00-core.js">
/**
 * 교사용 코어 — 이름 공간과 화면 부품
 *
 * 교사용은 학생용 파일을 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.
 * 그래서 학생용 빌드에 교사용 코드가 섞일 일도, 그 반대도 없다.
 *
 * ★ 학생이 쓴 글은 언제나 textContent 로만 넣는다.
 *   innerHTML 을 쓰지 않으므로 <script> 를 적어 낸 답안도 «글자» 로만 보인다.
 *
 * ★ 받은 자료를 브라우저에 «영구 저장하지 않는다»(명세 13장).
 *   localStorage 를 쓰지 않고 메모리에만 둔다. 창을 닫으면 사라진다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /** ISO 시각 → 「2026-08-18 10:20」 */
  function fmtTime(iso, withSeconds) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var base =
      d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) +
      " " + two(d.getHours()) + ":" + two(d.getMinutes());
    return withSeconds ? base + ":" + two(d.getSeconds()) : base;
  }

  /** 표 안에서 긴 글을 짧게 (전체 내용은 학생별 보기에서 본다) */
  function shorten(text, max) {
    var s = String(text || "");
    var limit = max || 18;
    return s.length > limit ? s.slice(0, limit) + "…" : s;
  }

  /** 백분율 — 나눌 것이 없으면 0 */
  function percent(part, whole) {
    if (!whole) return 0;
    return Math.round((part / whole) * 100);
  }

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  /* ------------------------------ 표 부품 ------------------------------ */

  /** 숫자 하나를 크게 보여 주는 칸 */
  /**
   * 숫자 한 칸.
   * 모양은 lesson3_7_1 교사용의 t-stat 과 같게 맞추었다 — 가운데 정렬, 큰 숫자, 작은 단위.
   * 단위는 `unit` 으로 따로 받아 숫자보다 작게 적는다.
   */
  function statCard(label, value, note, unit) {
    return el("div", { class: "t-stat" }, [
      el("p", { class: "t-stat__label", text: label }),
      el("p", { class: "t-stat__value" }, [
        el("span", { text: String(value) }),
        unit ? el("small", { text: " " + unit }) : null
      ]),
      note ? el("p", { class: "t-stat__note", text: note }) : null
    ]);
  }

  /** 숫자 칸들을 담는 격자 */
  function statRow(cards) {
    return el("div", { class: "t-stats" }, cards);
  }

  /**
   * 제목이 붙은 상자. lesson3_7_1 교사용의 panel() 과 같은 짜임새다.
   * { root, body } 를 돌려주므로 부르는 곳에서 body 에 내용을 붙인다.
   */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: ("panel " + (s.className || "")).trim() }, [head, body]);
    return { root: root, body: body };
  }

  /** 단추 한 줄 */
  function btnRow(children) {
    return el("div", { class: "btnrow" }, children);
  }

  /**
   * 가로 막대 하나. 숫자를 «글자로도» 함께 적는다(색만으로 알리지 않기 — 명세 13장).
   */
  function bar(label, value, whole, opts) {
    var o = opts || {};
    var pct = percent(value, whole);
    return el("div", { class: "bar" + (o.strong ? " bar--strong" : "") }, [
      el("p", { class: "bar__label" }, [
        el("span", { class: "bar__name", text: label }),
        el("span", { class: "bar__num", text: value + "명 (" + pct + "%)" })
      ]),
      el("div", { class: "bar__track" }, [
        el("div", { class: "bar__fill", attrs: { style: "width:" + pct + "%" } })
      ])
    ]);
  }

  /** 접었다 펼 수 있는 긴 글 */
  function longText(text) {
    var value = String(text || "");
    var body = el("p", { class: "longtext__body", text: value || "(작성하지 않음)" });
    if (value.length <= 120) return el("div", { class: "longtext" }, [body]);

    body.classList.add("longtext__body--clamp");
    var btn = el("button", {
      class: "btn btn--small btn--ghost",
      text: "펼치기",
      attrs: { type: "button", "aria-expanded": "false" },
      on: {
        click: function () {
          var clamped = body.classList.toggle("longtext__body--clamp");
          btn.textContent = clamped ? "펼치기" : "접기";
          btn.setAttribute("aria-expanded", clamped ? "false" : "true");
        }
      }
    });
    return el("div", { class: "longtext" }, [body, btn]);
  }

  /** 코드 상자 (읽기 전용) */
  function codeBox(source) {
    return el("pre", { class: "codeblock__pre" }, [el("code", { text: String(source || "(작성하지 않음)") })]);
  }

  /** 비어 있을 때의 안내 */
  function empty(message) {
    return el("p", { class: "t-empty", text: message });
  }

  T.core = {
    $: $,
    $$: $$,
    el: el,
    clear: clear,
    fmtTime: fmtTime,
    shorten: shorten,
    percent: percent,
    toast: toast,
    announce: announce,
    statCard: statCard,
    statRow: statRow,
    panel: panel,
    btnRow: btnRow,
    bar: bar,
    longText: longText,
    codeBox: codeBox,
    empty: empty
  };
})();
    </script>
    <script data-from="teacher/t10-data.js">
/**
 * 자료 불러오기와 통계 (명세 16장)
 *
 * 두 가지 길로 받는다.
 *   ① 업로드   : 학생이 내려받은 JSON 파일 여러 개를 한꺼번에 고른다
 *   ② 서버 목록: Apps Script 웹앱 주소로 물어 본다 (Google Drive 에 쌓인 제출)
 *
 * ★ 받은 자료는 «메모리에만» 둔다. localStorage 에 넣지 않는다(명세 18장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /* 화면이 살아 있는 동안만 갖고 있는 제출 목록 */
  var submissions = [];

  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /* ------------------------------------------------------------------ */
  /* 서버에 물어보기                                                      */
  /*                                                                    */
  /* ★ 두 가지 길로 물어본다. 한 길이 막혀도 다른 길로 간다.               */
  /*                                                                    */
  /*   ① fetch  — 보통 이것으로 된다                                     */
  /*   ② JSONP  — <script> 로 읽어 온다. CORS 를 타지 않는다              */
  /*                                                                    */
  /*   교사용 HTML 은 파일 하나짜리라 선생님이 보통 file:// 로 연다.        */
  /*   그때 출처(origin)가 null 이라 fetch 가 CORS 에 막히는데,            */
  /*   예전에는 그대로 «서버에 물어보고 있어요…» 에서 멈춰 있었다.          */
  /* ------------------------------------------------------------------ */

  /** 아무리 늦어도 이만큼 지나면 «못 했다» 고 알린다 (그냥 멈춰 있으면 안 된다) */
  var TIMEOUT_MS = 12000;

  var jsonpSeq = 0;

  /** 약속이 늦어지면 스스로 끊는다 */
  function withTimeout(promise, ms, message) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error(message));
      }, ms);

      promise.then(
        function (value) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(value);
        },
        function (err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(err);
        }
      );
    });
  }

  /**
   * JSONP — <script> 태그로 읽어 온다.
   * 서버가 callback 이름으로 감싼 자바스크립트를 돌려주므로 CORS 검사를 받지 않는다.
   */
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      if (typeof document === "undefined") {
        reject(new Error("이 환경에서는 JSONP 를 쓸 수 없습니다."));
        return;
      }

      jsonpSeq += 1;
      var name = "__pcTeacherCb" + jsonpSeq;
      var script = document.createElement("script");
      var done = false;

      function finish(err, data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          delete root[name];
        } catch (e) {
          root[name] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err);
        else resolve(data);
      }

      var timer = setTimeout(function () {
        finish(
          new Error(
            "서버가 제때 답하지 않았습니다. 주소가 /exec 로 끝나는지, " +
              "Code.gs 를 고친 뒤 «새 배포» 로 다시 올렸는지 확인해 주세요."
          )
        );
      }, TIMEOUT_MS);

      root[name] = function (data) {
        finish(null, data);
      };

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name;
      script.onerror = function () {
        finish(
          new Error(
            "서버에 닿지 못했습니다. 주소가 맞는지, 배포에서 실행을 «나» · 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
          )
        );
      };
      document.head.appendChild(script);
    });
  }

  /**
   * 서버에 한 번 물어본다.
   *   base  : /exec 주소
   *   query : "action=list&key=…"
   *
   * fetch 를 먼저 해 보고, 막히면 JSONP 로 다시 간다.
   * 둘 다 실패하면 «왜 안 되는지» 를 담아 거절한다.
   */
  function askServer(base, query) {
    var url = base + (base.indexOf("?") === -1 ? "?" : "&") + query;
    var f = getFetch();

    var viaFetch = !f
      ? Promise.reject(new Error("이 브라우저에서는 불러올 수 없습니다."))
      : withTimeout(
          f(url, { method: "GET", redirect: "follow" }).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          }),
          TIMEOUT_MS,
          "서버가 제때 답하지 않았습니다."
        ).then(function (body) {
          try {
            return JSON.parse(body);
          } catch (e) {
            /* 로그인 화면 HTML 이 돌아온 경우다 — 배포 설정이 잘못되었다 */
            throw new Error(
              "서버가 JSON 을 주지 않았습니다. 배포에서 실행을 «나», 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
            );
          }
        });

    return viaFetch.catch(function (firstErr) {
      /* file:// 에서 열었거나 CORS 에 막힌 것이다 — <script> 로 다시 가 본다 */
      return jsonp(url).catch(function (secondErr) {
        throw new Error(secondErr && secondErr.message ? secondErr.message : firstErr.message);
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 담기                                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 제출 하나를 넣는다. 같은 학생의 제출이 이미 있으면 «늦게 낸 것» 만 남긴다.
   * 돌려주는 것 : 'added' | 'updated' | 'kept' | 'skipped'
   */
  function put(raw) {
    if (!PC.schema.isThisLesson(raw)) return "skipped";

    var next = PC.schema.normalizeSubmission(raw);
    if (!next.studentId && !next.studentName) return "skipped";

    var key = PC.schema.dedupeKey(next);
    for (var i = 0; i < submissions.length; i += 1) {
      if (PC.schema.dedupeKey(submissions[i]) !== key) continue;

      var oldAt = submissions[i].serverUpdatedAt || submissions[i].submittedAt || "";
      var newAt = next.serverUpdatedAt || next.submittedAt || "";
      if (newAt >= oldAt) {
        submissions[i] = next;
        return "updated";
      }
      return "kept";
    }
    submissions.push(next);
    return "added";
  }

  /** JSON 글 한 덩어리를 담는다. 배열이어도, 하나여도, {items:[...]} 여도 받는다. */
  function putText(text) {
    var result = { added: 0, updated: 0, kept: 0, skipped: 0, error: "" };
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      result.error = "JSON 형식이 아닙니다.";
      return result;
    }

    var list = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [data];
    list.forEach(function (item) {
      var how = put(item);
      result[how] += 1;
    });
    return result;
  }

  /** 파일 여러 개를 읽어 담는다 (명세 16장 1장 «JSON 다중 열기·드래그») */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return Promise.resolve({ added: 0, updated: 0, kept: 0, skipped: 0, failed: [] });

    return Promise.all(
      files.map(function (file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({ name: file.name, text: String(reader.result || "") });
          };
          reader.onerror = function () {
            resolve({ name: file.name, text: null });
          };
          reader.readAsText(file, "utf-8");
        });
      })
    ).then(function (results) {
      var total = { added: 0, updated: 0, kept: 0, skipped: 0, failed: [] };
      results.forEach(function (r) {
        if (r.text === null) {
          total.failed.push(r.name + " (읽지 못함)");
          return;
        }
        var one = putText(r.text);
        if (one.error) {
          total.failed.push(r.name + " (" + one.error + ")");
          return;
        }
        total.added += one.added;
        total.updated += one.updated;
        total.kept += one.kept;
        total.skipped += one.skipped;
      });
      return total;
    });
  }

  /**
   * 서버(Apps Script)에서 제출 목록을 받아 온다.
   * 교사 열쇠는 화면에서 받아 그때그때 쓰고 저장하지 않는다.
   */
  function fetchFromServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query =
      "action=list&lessonId=" +
      encodeURIComponent(PC.LESSON_ID) +
      (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query)
      .then(function (data) {
        if (data && data.ok === false) {
          /* 서버가 «무엇이 잘못되었는지» 를 함께 보내면 그대로 붙여 준다.
             그러지 않으면 폴더 ID·권한·Drive API 중 무엇을 고쳐야 할지 알 수 없다. */
          var why = [data.message || "서버가 목록을 주지 않았습니다."];
          if (data.reason) why.push("(" + data.reason + ")");
          if (data.hint) why.push(data.hint);
          return { ok: false, message: why.join(" ") };
        }

        var list = Array.isArray(data) ? data : (data && data.items) || [];
        var count = { added: 0, updated: 0, kept: 0, skipped: 0 };
        list.forEach(function (item) {
          count[put(item)] += 1;
        });
        return {
          ok: true,
          count: count,
          total: list.length,
          /* 한 건도 없을 때 무엇을 켜야 하는지 알려 주려고 서버 안내를 그대로 들고 온다 */
          hint: (data && data.hint) || "",
          skipped: (data && data.skipped) || 0,
          truncated: data && data.truncated === true
        };
      })
      .catch(function (err) {
        return { ok: false, message: err && err.message ? err.message : "불러오지 못했습니다." };
      });
  }

  /**
   * 연결 확인 — 주소·열쇠·폴더·Drive API 가 준비되었는지 서버에 물어본다.
   * 목록을 불러오다 막혔을 때 «무엇이 빠졌는지» 를 먼저 짚어 보는 길이다.
   */
  function pingServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query = "action=ping" + (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query).catch(function (err) {
      return { ok: false, message: err && err.message ? err.message : "확인하지 못했습니다." };
    });
  }

  function all() {
    return submissions.slice();
  }

  function clearAll() {
    submissions = [];
  }

  function count() {
    return submissions.length;
  }

  /* ================================================================== */
  /* 통계 (명세 16.1)                                                     */
  /*                                                                    */
  /* ★ 이 차시는 센서가 «둘» 이다. 그래서 회로·코드·실험 통계를 모두            */
  /*   goal('light' | 'soil') 을 받아 «같은 함수» 로 낸다.                   */
  /*   두 벌로 적으면 한쪽만 고쳐 화면이 어긋난다.                            */
  /* ================================================================== */

  /** 관찰문을 채운 칸 수 — «실험 기록 완성도» 의 잣대다 */
  function observationCount(part) {
    return (part.experiments || []).filter(function (e) {
      return e.ran && String(e.observation || "").replace(/\s+/g, "").length >= 8;
    }).length;
  }

  /** 한 학생이 두 센서에서 남긴 «실험 기록 완성도» (0 ~ 6) */
  function recordScore(row) {
    return observationCount(row.light) + observationCount(row.soil);
  }

  /** 두 센서의 회로 오류 합계 (명세 16.2 두 번째 기준) */
  function errorTotal(row) {
    return (row.light.circuit.errors || []).length + (row.soil.circuit.errors || []).length;
  }

  /** 두 센서의 코드 테스트 통과 합계 (명세 16.2 세 번째 기준) */
  function passTotal(row) {
    return row.light.code.testsPassed + row.soil.code.testsPassed;
  }

  /**
   * 전체 요약 (명세 16장 2장)
   *   expected 는 «수업에 참여한 학생 수». 선생님이 넣으면 제출률을 낼 수 있다.
   */
  function summary(list, expected) {
    var rows = list || [];
    var total = rows.length;
    var scores = rows.map(function (r) {
      return r.assessment.score;
    });
    var passed = rows.filter(function (r) {
      return r.assessment.pass;
    }).length;

    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);

    /* 점수 분포 — 0,2,4,6,8,10 여섯 칸 */
    var buckets = [0, 2, 4, 6, 8, 10].map(function (v) {
      return {
        score: v,
        count: scores.filter(function (s) {
          return s === v;
        }).length
      };
    });

    var maxScore = (PC.ASSESS && PC.ASSESS.total) || 10;

    function doneBoth(pick) {
      return rows.filter(function (r) {
        return pick(r.light) && pick(r.soil);
      }).length;
    }

    return {
      total: total,
      expected: Number(expected) || 0,
      submitRate: expected ? T.core.percent(total, Number(expected)) : 0,
      average: total ? Math.round((sum / total) * 10) / 10 : 0,
      maxScore: maxScore,
      highest: total ? Math.max.apply(null, scores) : 0,
      lowest: total ? Math.min.apply(null, scores) : 0,
      perfect: scores.filter(function (v) {
        return v >= maxScore;
      }).length,
      passed: passed,
      failed: total - passed,
      passRate: T.core.percent(passed, total),
      buckets: buckets,

      /* 센서별 완료율 (명세 16장 2장 «조도·수분 실습 완료율») */
      lightCircuit: rows.filter(function (r) {
        return r.light.circuit.completed;
      }).length,
      soilCircuit: rows.filter(function (r) {
        return r.soil.circuit.completed;
      }).length,
      lightCode: rows.filter(function (r) {
        return r.light.code.passed;
      }).length,
      soilCode: rows.filter(function (r) {
        return r.soil.code.passed;
      }).length,
      bothCircuit: doneBoth(function (p) {
        return p.circuit.completed;
      }),
      bothCode: doneBoth(function (p) {
        return p.code.passed;
      }),
      /* 두 센서에서 세 조건씩 «여섯 칸» 을 모두 적은 학생 */
      fullRecords: rows.filter(function (r) {
        return recordScore(r) >= 6;
      }).length,
      extensionTried: rows.filter(function (r) {
        return r.soil.extension.tried;
      }).length
    };
  }

  /**
   * 문항별 분석 (명세 16장 3장)
   *   정답률 · 선택지 분포 · 오답 TOP2 · 주관식 원문
   */
  function questionStats(list) {
    var rows = list || [];
    return PC.quiz.QUESTIONS.map(function (q, index) {
      var answered = [];
      var correct = 0;

      rows.forEach(function (r) {
        /* 제출 규격에서 답안은 «문항 순서대로» 담긴 배열이다 (schema.js buildPayload) */
        var value = (r.assessment.answers || [])[index];
        var isRight = r.assessment.isCorrect[index] === true;
        if (isRight) correct += 1;
        answered.push({
          studentId: r.studentId,
          studentName: r.studentName,
          value: value === undefined ? null : value,
          correct: isRight
        });
      });

      var stat = {
        id: q.id,
        no: q.no,
        type: q.type,
        stem: q.stem,
        tag: q.tag,
        total: rows.length,
        correct: correct,
        rate: T.core.percent(correct, rows.length),
        distribution: [],
        worstChoices: [],
        texts: []
      };

      if (q.type === "choice") {
        stat.distribution = q.choices.map(function (label, i) {
          return {
            index: i,
            label: label,
            count: answered.filter(function (a) {
              return Number(a.value) === i;
            }).length
          };
        });

        /* 오답 TOP2 — 많이 고른 «틀린» 보기 둘 (명세 16.1 마지막 줄) */
        var answerIndex = PC.quiz.recoverChoiceIndex(q);
        stat.answerIndex = answerIndex;
        stat.worstChoices = stat.distribution
          .filter(function (d) {
            return d.index !== answerIndex && d.count > 0;
          })
          .sort(function (a, b) {
            return b.count - a.count;
          })
          .slice(0, 2);
        /* 고르지 않은 학생 수 */
        stat.blank = answered.filter(function (a) {
          return a.value === null || a.value === undefined || a.value === "";
        }).length;
      } else {
        stat.texts = answered.map(function (a) {
          return {
            studentId: a.studentId,
            studentName: a.studentName,
            text: String(a.value || ""),
            correct: a.correct
          };
        });
      }

      return stat;
    });
  }

  /**
   * 회로 수행 분석 — 센서 한 갈래 (명세 16.1 첫째·둘째 줄)
   *
   *   goal 'light' : AO/A0 누락 · LED 역극성 · 무저항 · D2 불일치
   *   goal 'soil'  : AO/DO 혼동 · A1 누락 · VCC/GND 역결선
   */
  function circuitStats(list, goal) {
    var rows = list || [];
    var key = goal === "soil" ? "soil" : "light";
    var errorCount = {};
    var riskyStudents = 0;

    rows.forEach(function (r) {
      var seen = {};
      (r[key].circuit.errors || []).forEach(function (code) {
        var name = String(code || "unknown");
        errorCount[name] = (errorCount[name] || 0) + 1;
        seen[name] = true;
      });
      /* 위험(단락·역결선·무저항)이 하나라도 있었던 학생 */
      var risky = Object.keys(seen).some(function (name) {
        return name.indexOf("missing:") !== 0;
      });
      if (risky) riskyStudents += 1;
    });

    /* 오류 이름을 사람 말로 바꾼다 */
    var titleOf = {};
    PC.circuit.DANGER_RULES.forEach(function (rule) {
      titleOf[rule.id] = rule.title;
    });
    titleOf["ao-do-swap"] = "AO 대신 DO 를 아날로그 핀에 이음";
    titleOf["led-reversed"] = "LED 역극성";
    titleOf["probe-short"] = "탐침 두 선이 서로 이어짐";
    (PC.circuit.REQUIRED[key] || []).forEach(function (req) {
      titleOf["missing:" + req.id] = "아직 잇지 않음 — " + req.short;
    });

    var frequent = Object.keys(errorCount)
      .map(function (code) {
        return { code: code, title: titleOf[code] || code, count: errorCount[code] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });

    var attempts = rows.map(function (r) {
      return r[key].circuit.attempts;
    });

    return {
      goal: key,
      label: key === "light" ? "조도" : "토양수분",
      total: rows.length,
      completed: rows.filter(function (r) {
        return r[key].circuit.completed;
      }).length,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      hintUsers: rows.filter(function (r) {
        return r[key].circuit.hintsUsed > 0;
      }).length,
      riskyStudents: riskyStudents,
      frequent: frequent
    };
  }

  /** 코드 수행 분석 — 센서 한 갈래 (명세 16.1 여섯째 줄) */
  function codeStats(list, goal) {
    var rows = list || [];
    var key = goal === "soil" ? "soil" : "light";
    var attempts = rows.map(function (r) {
      return r[key].code.attempts;
    });

    return {
      goal: key,
      label: key === "light" ? "조도" : "토양수분",
      total: rows.length,
      allPassed: rows.filter(function (r) {
        return r[key].code.passed;
      }).length,
      avgPassed: rows.length
        ? Math.round(
            (rows.reduce(function (a, r) {
              return a + r[key].code.testsPassed;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      withPinMismatch: rows.filter(function (r) {
        return (r[key].code.pinMismatch || []).length > 0;
      }).length,
      /* 코드를 아예 적지 않은 학생 */
      empty: rows.filter(function (r) {
        return !String(r[key].code.source || "").trim();
      }).length
    };
  }

  /**
   * 기준값 분포 (명세 16.1 넷째·다섯째 줄)
   *
   * ★ 「기준값을 복사했는지 실험에 근거해 정했는지 교사가 판단할 수 있는 원자료」 를 낸다.
   *   판단을 자동으로 «내리지 않는다» — 판단은 선생님이 한다.
   *   여기서는 «옮겨 적은 흔적», «실험에 근거한 흔적», «다시 살펴볼 값» 으로만 갈라 준다.
   */
  function thresholdStats(list, goal) {
    var rows = list || [];
    var key = goal === "soil" ? "soil" : "light";
    var preset = key === "light" ? PC.LIGHT_THRESHOLD : PC.SOIL_DRY_THRESHOLD;

    var values = {};
    var items = rows.map(function (r) {
      var part = r[key];
      var t = part.threshold;
      values[t] = (values[t] || 0) + 1;

      var measured = (part.experiments || [])
        .filter(function (e) {
          return e.ran;
        })
        .map(function (e) {
          return e.value;
        });
      var lo = measured.length ? Math.min.apply(null, measured) : 0;
      var hi = measured.length ? Math.max.apply(null, measured) : 0;

      var notes = observationCount(part);

      /* 흔적 가르기 — 명세 17장 THRESHOLD_HINTS 와 같은 잣대다 */
      var mark = "unknown";
      if (!t) mark = "none";
      else if (t === preset && notes === 0) mark = "copied";
      else if (measured.length >= 2 && t > lo && t < hi) mark = "reasoned";
      else if (measured.length >= 2 && (t < lo || t > hi)) mark = "outside";
      else if (t === preset) mark = "preset";

      return {
        studentId: r.studentId,
        studentName: r.studentName,
        threshold: t,
        measured: measured,
        low: lo,
        high: hi,
        observations: notes,
        mark: mark
      };
    });

    var counts = { none: 0, copied: 0, preset: 0, reasoned: 0, outside: 0, unknown: 0 };
    items.forEach(function (i) {
      counts[i.mark] = (counts[i.mark] || 0) + 1;
    });

    var distinct = Object.keys(values)
      .map(function (v) {
        return { value: Number(v), count: values[v] };
      })
      .filter(function (d) {
        return d.value > 0;
      })
      .sort(function (a, b) {
        return a.value - b.value;
      });

    return { goal: key, label: key === "light" ? "조도" : "건조", preset: preset, items: items, counts: counts, distinct: distinct };
  }

  /**
   * 학생별 실험 기록 (명세 16.1 세째 줄 «밝기 3조건과 수분 3조건의 측정값·관찰문»)
   */
  function experimentTable(list, goal) {
    var rows = list || [];
    var key = goal === "soil" ? "soil" : "light";
    var conds = ((PC.SENSORS || {})[key] || { conditions: [] }).conditions;

    return {
      goal: key,
      conditions: conds,
      rows: rows.map(function (r) {
        var byId = {};
        (r[key].experiments || []).forEach(function (e) {
          byId[e.condition] = e;
        });
        return {
          studentId: r.studentId,
          studentName: r.studentName,
          cells: conds.map(function (c) {
            var e = byId[c.id] || {};
            return {
              condition: c.id,
              label: c.label,
              value: e.value || 0,
              ran: e.ran === true,
              led: e.led || "",
              predict: e.predict || "",
              observation: e.observation || ""
            };
          }),
          threshold: r[key].threshold
        };
      })
    };
  }

  /**
   * 상위 3명 (명세 16.2)
   *   ① 형성평가 점수 내림차순
   *   ② 두 회로 오류 합계 오름차순
   *   ③ 두 코드 테스트 통과 합계 내림차순
   *   ④ 실험 기록 완성도 내림차순
   *   ⑤ 제출 시각 오름차순
   */
  function topThree(list) {
    return (list || [])
      .slice()
      .sort(function (a, b) {
        if (b.assessment.score !== a.assessment.score) return b.assessment.score - a.assessment.score;

        var ae = errorTotal(a);
        var be = errorTotal(b);
        if (ae !== be) return ae - be;

        var ap = passTotal(a);
        var bp = passTotal(b);
        if (bp !== ap) return bp - ap;

        var ar = recordScore(a);
        var br = recordScore(b);
        if (br !== ar) return br - ar;

        var at = a.serverUpdatedAt || a.submittedAt || "";
        var bt = b.serverUpdatedAt || b.submittedAt || "";
        return at < bt ? -1 : at > bt ? 1 : 0;
      })
      .slice(0, 3);
  }

  T.data = {
    pingServer: pingServer,
    put: put,
    putText: putText,
    readFiles: readFiles,
    fetchFromServer: fetchFromServer,
    all: all,
    clearAll: clearAll,
    count: count,
    summary: summary,
    questionStats: questionStats,
    circuitStats: circuitStats,
    codeStats: codeStats,
    thresholdStats: thresholdStats,
    experimentTable: experimentTable,
    topThree: topThree,
    observationCount: observationCount,
    recordScore: recordScore,
    errorTotal: errorTotal,
    passTotal: passTotal,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.data;
})();

    <script data-from="teacher/t15-roster.js">
/* ------------------------------------------------------------------
 * 학생 명단 파일 읽기 (교사용)
 *
 * 명단을 올리면 «제출하지 않은 학생» 까지 표에 나온다.
 * 이것이 5장(전체 명단·정오표)의 핵심이다 — 낸 사람만 보이면 누가 빠졌는지 알 수 없다.
 *
 *   .xlsx          브라우저 내장 기능만으로 읽는다.
 *                  ZIP(중앙 디렉터리) 직접 해석 + DecompressionStream('deflate-raw')
 *                  + DOMParser 로 sharedStrings.xml / sheet XML 파싱.
 *   .csv/.tsv/.txt 글자로 바로 읽는다.
 *
 * ★ 외부 라이브러리를 쓰지 않는다. lesson3_7_1 의 교사용과 같은 방법이다.
 *   고전 스크립트라서 file:// 에서도 열린다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ["학번", "학번호", "번호", "id", "studentid", "student_id", "학생번호"];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ["이름", "성명", "학생이름", "학생명", "name", "studentname", "student_name"];

  function norm(value) {
    return String(value === null || value === undefined ? "" : value)
      .trim()
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function has(list, value) {
    return list.indexOf(value) !== -1;
  }

  /* ---------------------------------------------------------------- */
  /* ZIP (xlsx) 풀기                                                   */
  /* ---------------------------------------------------------------- */

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다 (주석이 붙어 있을 수 있다) */
  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") {
      return Promise.reject(
        new Error("이 브라우저에서는 엑셀 파일을 직접 읽을 수 없어요. CSV 로 저장해 올려 주세요.")
      );
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function (buf) {
      return new Uint8Array(buf);
    });
  }

  /** xlsx(zip) 안에서 필요한 파일만 { 경로: 글 } 로 돌려준다 */
  function readZipEntries(buffer, wanted) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);
    if (eocd < 0) return Promise.reject(new Error("엑셀 파일 형식을 읽지 못했어요."));

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);
    var decoder = new TextDecoder("utf-8");
    var out = {};
    var jobs = [];

    for (var i = 0; i < count; i += 1) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;

      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));

      if (wanted(name)) {
        var lNameLen = view.getUint16(localOffset + 26, true);
        var lExtraLen = view.getUint16(localOffset + 28, true);
        var start = localOffset + 30 + lNameLen + lExtraLen;
        var raw = bytes.subarray(start, start + compressedSize);

        jobs.push(
          (function (entryName, entryRaw, entryMethod) {
            if (entryMethod === 0) {
              out[entryName] = decoder.decode(entryRaw);
              return Promise.resolve();
            }
            return inflateRaw(entryRaw).then(function (data) {
              out[entryName] = decoder.decode(data);
            });
          })(name, raw, method)
        );
      }

      offset += 46 + nameLen + extraLen + commentLen;
    }

    return Promise.all(jobs).then(function () {
      return out;
    });
  }

  /* ---------------------------------------------------------------- */
  /* xlsx → 2차원 배열                                                 */
  /* ---------------------------------------------------------------- */

  /** "C7" 같은 자리 이름에서 열 번호를 뽑는다 (A=0) */
  function colIndex(ref) {
    var letters = String(ref).replace(/[0-9]/g, "");
    var n = 0;
    for (var i = 0; i < letters.length; i += 1) n = n * 26 + (letters.charCodeAt(i) - 64);
    return Math.max(0, n - 1);
  }

  function sheetToRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, "application/xml");
    var rows = [];

    Array.prototype.forEach.call(doc.getElementsByTagName("row"), function (rowEl) {
      var cells = [];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"), function (c) {
        var ref = c.getAttribute("r") || "";
        var type = c.getAttribute("t");
        var text = "";

        if (type === "s") {
          var v = c.getElementsByTagName("v")[0];
          var idx = v ? Number(v.textContent) : -1;
          text = shared[idx] === undefined ? "" : shared[idx];
        } else if (type === "inlineStr") {
          text = Array.prototype.map
            .call(c.getElementsByTagName("t"), function (t) {
              return t.textContent;
            })
            .join("");
        } else {
          var v2 = c.getElementsByTagName("v")[0];
          text = v2 ? v2.textContent : "";
        }

        cells[ref ? colIndex(ref) : cells.length] = String(text === null || text === undefined ? "" : text).trim();
      });
      rows.push(cells);
    });

    return rows;
  }

  function readXlsx(file) {
    return file
      .arrayBuffer()
      .then(function (buffer) {
        return readZipEntries(buffer, function (name) {
          return (
            name === "xl/sharedStrings.xml" ||
            name === "xl/workbook.xml" ||
            /^xl\/worksheets\/sheet\d+\.xml$/.test(name)
          );
        });
      })
      .then(function (entries) {
        /* 공유 문자열 */
        var shared = [];
        if (entries["xl/sharedStrings.xml"]) {
          var doc = new DOMParser().parseFromString(entries["xl/sharedStrings.xml"], "application/xml");
          Array.prototype.forEach.call(doc.getElementsByTagName("si"), function (si) {
            shared.push(
              Array.prototype.map
                .call(si.getElementsByTagName("t"), function (t) {
                  return t.textContent;
                })
                .join("")
            );
          });
        }

        /* 첫 번째 시트를 쓴다 */
        var sheetName = Object.keys(entries)
          .filter(function (n) {
            return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
          })
          .sort()[0];
        if (!sheetName) throw new Error("엑셀에서 시트를 찾지 못했어요.");

        return sheetToRows(entries[sheetName], shared);
      });
  }

  /* ---------------------------------------------------------------- */
  /* csv / tsv → 2차원 배열                                            */
  /* ---------------------------------------------------------------- */

  function splitDelimited(text) {
    var clean = String(text || "").replace(/^﻿/, "");
    var delimiter = clean.indexOf("\t") !== -1 && clean.indexOf(",") === -1 ? "\t" : ",";
    var rows = [];
    var row = [];
    var cell = "";
    var quoted = false;

    for (var i = 0; i < clean.length; i += 1) {
      var ch = clean[i];
      if (quoted) {
        if (ch === '"') {
          if (clean[i + 1] === '"') {
            cell += '"';
            i += 1;
          } else {
            quoted = false;
          }
        } else {
          cell += ch;
        }
        continue;
      }
      if (ch === '"') {
        quoted = true;
      } else if (ch === delimiter) {
        row.push(cell.trim());
        cell = "";
      } else if (ch === "\n") {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") {
        cell += ch;
      }
    }
    row.push(cell.trim());
    if (
      row.some(function (c) {
        return c !== "";
      })
    ) {
      rows.push(row);
    }
    return rows;
  }

  /* ---------------------------------------------------------------- */
  /* 행 배열 → 학생 명단                                                */
  /* ---------------------------------------------------------------- */

  function pickColumns(rows) {
    /* 앞쪽 다섯 줄 안에서 머리글을 찾는다 */
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && has(ID_HEADERS, v)) idCol = c;
        if (nameCol < 0 && has(NAME_HEADERS, v)) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    /* 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다 */
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /** 행 배열에서 { students, warnings, columns } 를 만든다 (파일 없이도 검사할 수 있게 따로 둔다) */
  function fromRows(rows) {
    var picked = pickColumns(rows || []);
    var students = [];
    var warnings = [];
    var seen = {};

    (rows || []).forEach(function (cells, r) {
      if (r <= picked.headerRow) return;

      var list = cells || [];
      var id = String(list[picked.idCol] === undefined ? "" : list[picked.idCol]).trim();
      var name = String(list[picked.nameCol] === undefined ? "" : list[picked.nameCol]).trim();
      if (!id && !name) return;

      /* 머리글을 못 찾았는데 첫 줄이 「학번/이름」 같은 글자면 건너뛴다 */
      if (picked.headerRow < 0 && r === 0 && (has(ID_HEADERS, norm(id)) || has(NAME_HEADERS, norm(name)))) {
        return;
      }
      if (!id) {
        warnings.push(r + 1 + "행: 학번이 비어 있어 건너뛰었어요. (" + (name || "이름 없음") + ")");
        return;
      }
      if (seen[id]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 썼어요.");
        return;
      }
      seen[id] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }

    return { students: students, warnings: warnings, columns: picked };
  }

  /** 명단 파일을 읽어 { students, warnings, columns } 를 돌려준다 */
  function parseFile(file) {
    var name = String((file && file.name) || "").toLowerCase();

    if (name.slice(-4) === ".xls") {
      return Promise.reject(
        new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.")
      );
    }

    var readRows = name.slice(-5) === ".xlsx" ? readXlsx(file) : file.text().then(splitDelimited);
    return readRows.then(fromRows);
  }

  /** 학번 비교용 표준형 — 앞의 0 과 공백·기호를 없앤다 */
  function normalizeId(value) {
    var raw = String(value === null || value === undefined ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  T.roster = {
    parseFile: parseFile,
    normalizeId: normalizeId,
    /* 아래 둘은 검사에서 쓴다 (파일 없이 판단만 확인한다) */
    fromRows: fromRows,
    splitDelimited: splitDelimited
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.roster;
})();

    <script data-from="teacher/t30-views.js">
/**
 * 교사용 1장 «결과 불러오기» 와 2장 «요약·상위 3명» (명세 16장)
 *
 * 1장 : Apps Script 주소·교사 키, 연결 확인, JSON 다중 열기·드래그
 * 2장 : 제출 수, 평균, 이수, 조도·수분 실습 완료율, 상위 학생
 *
 * ★ 교사 키는 화면에서 받아 «그때그때 쓰고» 저장하지 않는다(명세 18장 마지막 줄).
 *   키를 프런트엔드 코드에 넣지도 않는다 — Apps Script 속성에만 둔다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  var K = T.core;
  var el = K.el;

  /* ================================================================== */
  /* 1장 — 결과 불러오기                                                  */
  /* ================================================================== */

  /* 1장의 화면은 «한 번만» 만든다.
     자료가 들어오면 ctx.refresh() 가 지금 장을 다시 그리는데, 1장을 그때마다 새로
     만들면 방금 넣은 교사 열쇠·상태 줄·자동 새로고침이 함께 지워진다.
     그래서 만든 판을 들고 있다가 그대로 다시 붙인다. */
  var loadNode = null;

  function loadView(ctx) {
    if (loadNode) return loadNode;

    var wrap = el("div", { class: "t-stack" });
    var refs = {};

    var box = K.panel({
      title: "📥 제출 결과 불러오기",
      hint: "공유 드라이브 폴더에 저장된 학생 답안(JSON)을 읽어 옵니다.",
      className: "t-source"
    });

    /* ── 상태 한 줄 ── */

    function setStatus(kind, message) {
      refs.status.className = "t-status" + (kind ? " is-" + kind : "");
      refs.status.textContent = message;
      K.announce(message);
    }

    /** 서버가 알려 준 «무엇을 켜야 하는지» 를 상태 줄 아래에 붙인다 */
    function note(message) {
      K.clear(refs.serverNote);
      if (message) refs.serverNote.appendChild(el("div", { class: "t-warn", text: message }));
    }

    function afterLoad(count, serverHint) {
      var message =
        "새로 " + count.added + "건, 갱신 " + count.updated + "건" +
        (count.skipped ? ", 다른 차시 " + count.skipped + "건 제외" : "") +
        (count.kept ? ", 오래된 제출 " + count.kept + "건 무시" : "");
      setStatus("ok", message + " — 모두 " + T.data.count() + "건");
      K.toast(message);
      if (T.data.count() === 0 && serverHint) note(serverHint);
      ctx.refresh();
    }

    /* ── 주소와 교사 열쇠 ── */

    refs.endpoint = el("input", {
      class: "t-source__input",
      attrs: {
        type: "url",
        placeholder: "https://script.google.com/macros/s/.../exec",
        "aria-label": "결과를 읽어올 교사용 Apps Script 주소",
        spellcheck: "false",
        autocomplete: "off"
      }
    });
    refs.endpoint.value = ctx.getEndpoint();

    /* 교사 열쇠는 «이 칸에만» 있다 — 저장하지 않고 그때그때 읽는다(명세 18장) */
    refs.teacherKey = el("input", {
      class: "t-source__input",
      attrs: { type: "password", placeholder: "교사 열쇠", "aria-label": "교사 열쇠", autocomplete: "off" }
    });

    var busy = false;

    function setBusy(on, label) {
      busy = on;
      btnServer.disabled = on;
      btnPing.disabled = on;
      btnServer.textContent = on ? label || "불러오는 중…" : "제출 결과 불러오기";
    }

    var btnServer = el("button", {
      class: "btn btn--primary",
      text: "제출 결과 불러오기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (busy) return;
          setBusy(true);
          note("");
          setStatus("loading", "서버에서 읽고 있어요…");
          ctx.setEndpoint(refs.endpoint.value);
          T.data.fetchFromServer(refs.endpoint.value, refs.teacherKey.value).then(function (out) {
            setBusy(false);
            if (!out.ok) {
              setStatus("error", out.message);
              return;
            }
            if (out.truncated) note("파일이 많아 일부만 받았습니다. 폴더를 나누어 주세요.");
            afterLoad(out.count, out.hint);
          });
        }
      }
    });

    /* 무엇이 빠졌는지 짚어 주는 단추 — 폴더·열쇠·Drive API 를 서버에 물어본다 */
    var btnPing = el("button", {
      class: "btn btn--ghost",
      text: "연결 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (busy) return;
          setBusy(true, "확인 중…");
          setStatus("loading", "서버에 물어보고 있어요…");
          T.data.pingServer(refs.endpoint.value, refs.teacherKey.value).then(function (r) {
            setBusy(false);
            if (!r || (r.ok === false && !r.driveAccess)) {
              setStatus("error", (r && r.message) || "확인하지 못했습니다.");
              return;
            }

            var lines = [];
            lines.push("폴더 설정 " + (r.folderConfigured ? "✔" : "✘ FOLDER_ID 를 넣어야 합니다"));
            lines.push("교사 열쇠 " + (r.teacherKeyConfigured ? "✔" : "✘ TEACHER_KEY 를 넣어야 합니다"));
            lines.push("폴더 훑는 길 : " + (r.driveAccess || "알 수 없음"));
            if (r.folderName) lines.push("폴더 «" + r.folderName + "» 에 제출 " + (r.fileCount || 0) + "개");
            if (r.reason) lines.push("(" + r.reason + ")");

            var good = r.ok !== false && r.folderConfigured && r.teacherKeyConfigured;
            setStatus(good ? "ok" : "error", lines.join(" · "));

            /* 다른 차시를 보고 있으면 그것이 가장 큰 고장이다 */
            if (r.lessonId && r.lessonId !== PC.LESSON_ID) {
              note("이 화면은 «" + PC.LESSON_ID + "» 차시용입니다. 서버가 보고 있는 차시는 «" + r.lessonId + "» 입니다.");
              return;
            }

            /* 공유 드라이브인데 Drive API 를 켜지 않은 것이 가장 흔한 고장이다 */
            note(
              r.driveApiEnabled === false
                ? "공유 드라이브를 쓰신다면 Apps Script 편집기 왼쪽 «서비스 +» 에서 Drive API 를 추가한 뒤 " +
                    "새 버전으로 다시 배포해 주세요. 켜지 않으면 목록이 비어 오고, 재제출이 덮어써지지 않습니다."
                : ""
            );
          });
        }
      }
    });

    /* ── 파일로 열기 ── */

    refs.fileInput = el("input", {
      class: "sr-only",
      id: "t-file",
      attrs: {
        type: "file",
        accept: ".json,application/json",
        multiple: true,
        "aria-label": "제출 JSON 파일 열기"
      }
    });
    refs.fileInput.addEventListener("change", function () {
      var files = refs.fileInput.files;
      if (files && files.length) {
        T.data.readFiles(files).then(function (r) {
          (r.failed || []).forEach(function (f) {
            note(f);
          });
          afterLoad(r);
        });
      }
      refs.fileInput.value = "";
    });

    var btnFile = el("button", {
      class: "btn btn--ghost",
      text: "JSON 파일 열기",
      attrs: { type: "button" },
      on: {
        click: function () {
          refs.fileInput.click();
        }
      }
    });

    box.body.appendChild(
      el("div", { class: "t-source__row" }, [
        refs.endpoint,
        refs.teacherKey,
        btnServer,
        btnPing,
        btnFile,
        refs.fileInput
      ])
    );

    /* ------------------------------------------------------------ */
    /* 30초 자동 새로고침                                             */
    /*                                                              */
    /* ★ «선생님이 켠 경우만» 동작한다. 기본은 꺼짐이다.                */
    /* ★ 교사 열쇠를 복사해 두지 않고 그때그때 칸에서 읽는다 —          */
    /*   칸을 지우면 자동 새로고침도 스스로 멈춘다.                     */
    /* ------------------------------------------------------------ */

    var refreshSeconds = (PC.CONFIG && PC.CONFIG.teacherRefreshSeconds) || 30;
    var autoId = "t-auto-refresh";
    refs.auto = el("input", { class: "check__input", id: autoId, attrs: { type: "checkbox" } });
    refs.autoNote = el("span", { class: "t-auto__note", attrs: { "aria-live": "polite" }, text: "" });

    function stopAuto() {
      if (refs.autoTimer) {
        root.clearInterval(refs.autoTimer);
        refs.autoTimer = null;
      }
      refs.autoNote.textContent = "";
    }

    function tickAuto() {
      var url = refs.endpoint.value;
      var key = refs.teacherKey.value;

      /* 주소나 열쇠가 비었으면 스스로 멈춘다 — 빈 값으로 서버를 두드리지 않는다 */
      if (!url || !key) {
        refs.auto.checked = false;
        stopAuto();
        setStatus("error", "주소와 교사 열쇠가 있어야 자동 새로고침이 됩니다. 껐습니다.");
        return;
      }

      T.data.fetchFromServer(url, key).then(function (out) {
        if (!out.ok) {
          /* 한 번 실패했다고 끄지는 않는다 — 잠깐 끊긴 것일 수 있다 */
          refs.autoNote.textContent = "마지막 새로고침 실패 : " + out.message;
          return;
        }
        refs.autoNote.textContent =
          K.fmtTime(new Date().toISOString(), true) +
          " 새로 " + out.count.added + "건 · 갱신 " + out.count.updated + "건";
        ctx.refresh();
      });
    }

    refs.auto.addEventListener("change", function () {
      stopAuto();
      if (!refs.auto.checked) return;
      refs.autoTimer = root.setInterval(tickAuto, refreshSeconds * 1000);
      refs.autoNote.textContent = refreshSeconds + "초마다 다시 읽습니다.";
      tickAuto();
    });

    box.body.appendChild(
      el("div", { class: "check t-auto" }, [
        refs.auto,
        el("label", {
          class: "check__label",
          attrs: { for: autoId },
          text: refreshSeconds + "초마다 자동으로 다시 읽기"
        }),
        refs.autoNote
      ])
    );

    refs.status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });
    refs.status.textContent = "주소와 교사 열쇠를 넣은 뒤 「제출 결과 불러오기」 를 눌러 주세요.";
    box.body.appendChild(refs.status);

    refs.serverNote = el("div");
    box.body.appendChild(refs.serverNote);

    /* ── 끌어다 놓기 ── */

    var drop = el("div", {
      class: "t-drop",
      text: "또는 드라이브에서 내려받은 JSON 파일들을 이곳에 끌어다 놓으세요."
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var files = Array.prototype.filter.call((e.dataTransfer && e.dataTransfer.files) || [], function (f) {
        return /\.json$/i.test(f.name);
      });
      if (files.length) {
        T.data.readFiles(files).then(function (r) {
          afterLoad(r);
        });
      } else {
        setStatus("error", "JSON 파일만 열 수 있어요.");
      }
    });
    box.body.appendChild(drop);

    /* ── 안내 두 줄 ── */

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", {
        text:
          "주소에서 바로 읽으려면 apps/teacher-analysis/Code.gs 를 웹앱으로 배포하고, " +
          "스크립트 속성의 TEACHER_KEY 를 위 칸에 넣어야 해요. 안 되면 [연결 확인] 을 눌러 보세요."
      })
    );
    hints.appendChild(
      el("li", {
        text:
          "배포가 어렵다면 드라이브 폴더에서 학번_이름.json 파일을 내려받아 " +
          "「JSON 파일 열기」 로 한꺼번에 선택해도 됩니다."
      })
    );
    box.body.appendChild(hints);

    wrap.appendChild(box.root);

    loadNode = wrap;
    return loadNode;
  }

  /* ================================================================== */
  /* 2장 — 요약과 상위 3명                                                */
  /*                                                                    */
  /* ★ 짜임새와 모양을 lesson3_10_5 의 2장(대시보드)과 «같게» 맞추었다.      */
  /*                                                                    */
  /*     🧮 예상 인원    숫자 한 칸 — 넣으면 제출률이 함께 나온다            */
  /*     📊 전체 요약    숫자 칸 → 점수 분포 → 두 센서 완료율               */
  /*     🏆 상위 3명     메달·등수 딱지·칭찬 한 줄이 든 «시상대» 카드         */
  /*                                                                    */
  /* ★ 앞판은 이 차시만의 세로 목록(t-top)이어서 앞 차시와 딴 화면이었다.     */
  /*   teacher.css 가 이미 갖고 있는 t-podium · t-card 를 쓴다 —           */
  /*   모양은 한곳에만 있어야 두 차시가 어긋나지 않는다.                     */
  /* ================================================================== */

  var MEDALS = ["🥇", "🥈", "🥉"];
  var RANK_TITLE = ["1등", "2등", "3등"];

  /**
   * 무엇을 잘했는지 골라 칭찬한다. 점수만 말하면 남는 것이 없다.
   * 이 차시는 «두 센서» 를 같은 방법으로 다루는 것이 핵심이라, 그것을 먼저 본다.
   */
  function praiseFor(rank, row) {
    var score = row.assessment.score;
    var full = (PC.ASSESS && PC.ASSESS.total) || 10;
    var errors = T.data.errorTotal(row);
    var bothCircuit = row.light.circuit.completed && row.soil.circuit.completed;
    var bothCode = row.light.code.passed && row.soil.code.passed;

    if (score >= full && errors === 0) {
      return "형성평가 만점에 두 센서 회로를 한 번의 오류 없이 마쳤어요. 오늘 배운 것을 모두 이해했습니다.";
    }
    if (bothCircuit && bothCode) {
      return "조도센서와 토양수분센서를 «같은 방법» 으로 다루었어요. 아날로그 입력과 조건 판단을 정확히 잡았습니다.";
    }
    if (score >= full - 2) {
      return "핵심 개념을 잘 잡았어요. 틀린 문항의 해설만 한 번 더 읽으면 완벽합니다.";
    }
    if (rank === 1) {
      return "이번 시간 가장 높은 점수예요. 끝까지 해낸 것이 무엇보다 좋습니다.";
    }
    return "끝까지 해냈어요. 센서값을 «읽어» 갈라지는 프로그램을 만든 것이 큰 걸음입니다.";
  }

  /** 제목이 붙은 작은 덩어리 (점수 분포 · 완료율) */
  function block(title, children) {
    return el("section", { class: "t-block" }, [
      el("h4", { class: "t-block__title", text: title })
    ].concat(children || []));
  }

  function summaryView(ctx) {
    var rows = ctx.rows();
    var wrap = el("div", { class: "t-stack" });

    if (rows.length === 0) {
      var box0 = K.panel({ title: "📊 전체 요약" });
      box0.body.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box0.root;
    }

    var s = T.data.summary(rows, ctx.getExpected());
    var N = rows.length;
    var pass = (PC.ASSESS || {}).passScore || 6;
    var step = (PC.ASSESS || {}).pointsEach || 2;

    /* ── 예상 인원 ──────────────────────────────────────────────────
       학생 자료가 아니라 «선생님이 넣는 값» 이므로 이 기기에 기억해 둔다. */

    var expectedBox = K.panel({
      title: "🧮 예상 인원",
      hint: "반 인원을 넣으면 제출률을 함께 보여 줍니다. 학생 자료가 아니므로 이 기기에 기억됩니다."
    });

    var expectedInput = el("input", {
      class: "input input--number",
      attrs: { type: "number", min: "0", max: "60", inputmode: "numeric", "aria-label": "예상 인원(명)" }
    });
    expectedInput.value = ctx.getExpected() ? String(ctx.getExpected()) : "";

    /* ★ input 이 아니라 change 로 듣는다 — 글자마다 화면을 다시 그리면
         칸이 새로 만들어져 «타이핑 중에 커서가 빠진다». */
    expectedInput.addEventListener("change", function () {
      ctx.setExpected(Number(expectedInput.value));
      ctx.refresh();
    });

    expectedBox.body.appendChild(
      el("div", { class: "t-inline" }, [expectedInput, el("span", { text: "명" })])
    );
    wrap.appendChild(expectedBox.root);

    /* ── 전체 요약 ────────────────────────────────────────────────── */

    var summary = K.panel({ title: "📊 전체 요약" });

    summary.body.appendChild(
      K.statRow([
        K.statCard("제출 학생", s.total, "", "명"),
        K.statCard("평균 점수", s.average, "", "/ " + s.maxScore + "점"),
        K.statCard("최고 점수", s.highest, "", "점"),
        K.statCard("최저 점수", s.lowest, "", "점"),
        K.statCard("만점자", s.perfect, "", "명"),
        /* 이 차시도 6점 이상이 이수다 — 선생님이 가장 먼저 보는 숫자여서 함께 둔다 */
        K.statCard("이수", s.passed, "미이수 " + s.failed + "명 · " + s.passRate + "%", "명")
      ])
    );

    /* 예상 인원을 넣었으면 «제출률» 을 함께 보인다 */
    if (ctx.getExpected() > 0) {
      summary.body.appendChild(
        K.statRow([
          K.statCard("예상 인원", ctx.getExpected(), "", "명"),
          K.statCard(
            "제출률",
            s.submitRate,
            "미제출 " + Math.max(0, ctx.getExpected() - s.total) + "명",
            "%"
          )
        ])
      );
    }

    /* 점수 분포 — 0·2·4·6·8·10점 여섯 칸 */
    summary.body.appendChild(
      block(
        "점수 분포",
        s.buckets.map(function (b) {
          return K.bar(b.score + "점" + (b.score >= pass ? " (이수)" : ""), b.count, N, {
            strong: b.score >= pass
          });
        })
      )
    );

    /* 두 센서 실습 완료율 (명세 16장 2장) — 이 차시에만 있는 칸이다 */
    summary.body.appendChild(
      block("두 센서 실습 완료율", [
        K.statRow([
          K.statCard("조도 회로", s.lightCircuit, K.percent(s.lightCircuit, N) + "%", "명"),
          K.statCard("조도 코드", s.lightCode, K.percent(s.lightCode, N) + "%", "명"),
          K.statCard("수분 회로", s.soilCircuit, K.percent(s.soilCircuit, N) + "%", "명"),
          K.statCard("수분 코드", s.soilCode, K.percent(s.soilCode, N) + "%", "명")
        ]),
        K.statRow([
          K.statCard("두 회로 모두", s.bothCircuit, K.percent(s.bothCircuit, N) + "%", "명"),
          K.statCard("두 코드 모두", s.bothCode, K.percent(s.bothCode, N) + "%", "명"),
          K.statCard("확장 활동", s.extensionTried, K.percent(s.extensionTried, N) + "%", "명")
        ]),
        el("p", {
          class: "t-note",
          text:
            "«두 회로 모두» 가 낮으면 회로 시간이 부족했던 것입니다. 3장에서 어느 오류가 많았는지 보고 " +
            "다음 시간에 그 부분을 먼저 짚어 주세요."
        })
      ])
    );

    summary.body.appendChild(
      el("p", {
        class: "panel__hint",
        text:
          "형성평가는 " + ((PC.ASSESS || {}).count || 5) + "문항 · 총 " + s.maxScore + "점이고 " +
          pass + "점 이상이면 이수입니다. 회로·코드 수행은 3장에서 봅니다."
      })
    );

    wrap.appendChild(summary.root);

    /* ── 상위 3명 (명세 16.2) ─────────────────────────────────────── */

    var podium = K.panel({
      title: "🏆 상위 3명",
      hint: "점수 → 회로 오류가 적은 순 → 코드 통과 → 실험 기록 → 제출이 빠른 순으로 뽑습니다."
    });

    var top = T.data.topThree(rows);
    if (!top.length) {
      podium.body.appendChild(el("p", { class: "t-empty", text: "표시할 학생이 없어요." }));
    } else {
      podium.body.appendChild(
        el(
          "div",
          { class: "t-podium" },
          top.map(function (r, i) {
            return el("article", { class: "t-card t-card--" + (i + 1) }, [
              el("div", {}, [
                el("span", { class: "t-card__medal", attrs: { "aria-hidden": "true" }, text: MEDALS[i] || "🎖" }),
                el("span", { class: "t-card__rank", text: RANK_TITLE[i] || i + 1 + "등" })
              ]),
              el("h4", { class: "t-card__name", text: r.studentName || "(이름 없음)" }),
              el("p", { class: "t-card__meta", text: "학번 " + (r.studentId || "-") }),
              el("p", { class: "t-card__score" }, [
                el("span", { text: String(r.assessment.score) }),
                el("small", { text: " 점 / " + (r.assessment.total || s.maxScore) + "점" })
              ]),
              el("p", {
                class: "t-card__meta",
                text:
                  "회로 오류 " + T.data.errorTotal(r) + "건 · 코드 통과 " + T.data.passTotal(r) + "개 · " +
                  K.fmtTime(r.serverUpdatedAt || r.submittedAt)
              }),
              el("p", {
                class: "t-card__praise",
                text: (r.studentName || "학생") + " 님, " + praiseFor(i + 1, r)
              })
            ]);
          })
        )
      );
    }

    podium.body.appendChild(
      el("p", {
        class: "t-note",
        text: "정답 점수만 보지 않습니다. 두 센서의 결선·코드 과정을 함께 봅니다(명세 22장)."
      })
    );

    wrap.appendChild(podium.root);
    return wrap;
  }

  T.views = { loadView: loadView, summaryView: summaryView };
})();
    </script>
    <script data-from="teacher/t35-analysis.js">
/**
 * 교사용 3장 «오답·수행 분석» (명세 16장 3장 · 16.1)
 *
 * 반드시 보아야 하는 것 (명세 16.1)
 *   ① 문항별 정답률과 선택지 분포, 오답 TOP2, 주관식 원문
 *   ② 조도 회로 완료율과 대표 오류
 *   ③ 토양 회로 완료율과 대표 오류
 *   ④ 두 센서의 코드 통과 수와 수정 횟수
 *   ⑤ 학생별 3조건 측정값·관찰문
 *   ⑥ 기준값 분포와 «실험에 근거했는가» 를 가늠할 원자료
 *
 * ★ 판단을 자동으로 «내리지 않는다». 원자료를 보여 주고 가름은 선생님이 한다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  var K = T.core;
  var el = K.el;
  var NOTES = PC.TEACHER_NOTES;

  /* ------------------------------------------------------------------ */
  /* ⓪ 가장 많이 틀린 문제 — 단추를 누를 때마다 «한 문제씩»                  */
  /*                                                                    */
  /* ★ 짜임새와 모양을 lesson3_10_5 의 3장과 «같게» 맞추었다.               */
  /*   오답률 막대 → 보기별 고른 사람 수 → 정답 → 해설 → 복습 방법.          */
  /*                                                                    */
  /* ★ 한 문제씩 여는 까닭 — 다섯 문항을 한꺼번에 늘어놓으면 «무엇부터         */
  /*   짚어 줄지» 가 흐려진다. 한 차시에 실제로 다룰 수 있는 것은 한두 문항이다. */
  /* ------------------------------------------------------------------ */

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** 한 수업에서 짚어 줄 만한 문항 수 */
  var WRONG_LIMIT = 2;

  /**
   * 틀린 학생이 많은 순서로 문항을 고른다.
   * 아무도 틀리지 않은 문항은 넣지 않는다 — 짚어 줄 것이 없다.
   */
  function topWrong(rows) {
    return T.data
      .questionStats(rows)
      .map(function (stat) {
        var wrong = stat.total - stat.correct;
        return { stat: stat, wrong: wrong, wrongRate: K.percent(wrong, stat.total) };
      })
      .filter(function (item) {
        return item.wrong > 0;
      })
      .sort(function (a, b) {
        if (b.wrong !== a.wrong) return b.wrong - a.wrong;
        return a.stat.no - b.stat.no; /* 같으면 문항 번호 순 */
      })
      .slice(0, WRONG_LIMIT);
  }

  /**
   * 문항에 맞는 «복습 방법» 을 오개념 자료에서 고른다.
   * 문항마다 손으로 짝지어 두지 않고 딱지(tag)로 잇는다 — 문항이 바뀌어도 따라온다.
   */
  var TAG_TO_MISCONCEPTION = {
    "조도센서 원리": "m1",
    "토양수분센서": "m3",
    "센서값 해석": "m2",
    "프로그램 실행 결과": "m5",
    "프로그램 완성형": "m4"
  };

  function teachTipFor(stat) {
    var wanted = TAG_TO_MISCONCEPTION[stat.tag];
    var found = null;
    (NOTES.MISCONCEPTIONS || []).forEach(function (m) {
      if (m.id === wanted) found = m;
    });
    return found ? found.how : "";
  }

  /** 오답 카드 한 장 */
  function wrongCard(item, order) {
    var stat = item.stat;
    var q = PC.quiz.byId(stat.id);
    var note = NOTES.byId(stat.id);
    var card = el("div", { class: "t-wrong__card" });

    card.appendChild(el("span", { class: "t-wrong__rank", text: "오답 " + order + "위" }));
    card.appendChild(el("h4", { class: "t-wrong__title", text: "문항 " + stat.no + " · " + stat.tag }));
    card.appendChild(el("p", { class: "t-wrong__prompt", text: stat.stem }));

    /* 문항에 코드가 붙어 있으면 그대로 보여 준다 */
    if (q && q.code) card.appendChild(K.codeBox(q.code));
    if (q && q.template) card.appendChild(K.codeBox(q.template));

    /* 오답률 막대 */
    card.appendChild(
      el("div", { class: "t-bar" }, [
        el("div", { class: "t-bar__fill", attrs: { style: "width:" + item.wrongRate + "%" } }),
        el("span", {
          class: "t-bar__label",
          text: stat.total + "명 중 " + item.wrong + "명이 틀렸어요 (" + item.wrongRate + "%)"
        })
      ])
    );

    /* 객관식 — 보기별로 몇 명이 골랐는가 */
    if (stat.type === "choice" && stat.distribution.length) {
      var answerIndex = typeof stat.answerIndex === "number" ? stat.answerIndex : -1;
      var maxWrong = 0;
      stat.distribution.forEach(function (d) {
        if (d.index !== answerIndex && d.count > maxWrong) maxWrong = d.count;
      });

      card.appendChild(
        el(
          "div",
          { class: "t-options" },
          stat.distribution.map(function (d) {
            var isAnswer = d.index === answerIndex;
            var isTopWrong = !isAnswer && d.count > 0 && d.count === maxWrong;
            return el(
              "div",
              { class: "t-option" + (isAnswer ? " is-answer" : "") + (isTopWrong ? " is-top-wrong" : "") },
              [
                el("span", {
                  class: "t-option__num",
                  attrs: { "aria-hidden": "true" },
                  text: CIRCLED[d.index] || String(d.index + 1)
                }),
                el("span", { class: "t-option__text", text: d.label + (isAnswer ? "  ← 정답" : "") }),
                el("span", { class: "t-option__count", text: d.count + "명" })
              ]
            );
          })
        )
      );
      if (stat.blank) {
        card.appendChild(el("p", { class: "t-note", text: "고르지 않은 학생 " + stat.blank + "명" }));
      }
    }

    /* 완성형 — 학생들이 실제로 쓴 «틀린» 답을 몇 개 보여 준다 */
    if (stat.type !== "choice" && stat.texts.length) {
      var wrongTexts = stat.texts.filter(function (t) {
        return !t.correct;
      });
      card.appendChild(
        el(
          "div",
          { class: "t-options" },
          wrongTexts.slice(0, 5).map(function (t) {
            return el("div", { class: "t-option" }, [
              el("span", { class: "t-option__text" }, [K.codeBox(String(t.text || "(무응답)"))]),
              el("span", { class: "t-option__count", text: t.studentId || "" })
            ]);
          })
        )
      );
      if (wrongTexts.length > 5) {
        card.appendChild(
          el("p", {
            class: "panel__hint",
            text: "틀린 답 " + wrongTexts.length + "개 중 앞 5개만 보여 줍니다. 나머지는 아래 «문항 분석» 에 모두 있습니다."
          })
        );
      }
    }

    /* 정답과 해설 */
    if (note) {
      card.appendChild(
        el("div", { class: "t-explain" }, [
          el("p", { class: "t-explain__label", text: "정답" }),
          el("p", {
            class: "t-answerline",
            text:
              stat.type === "choice" && note.answerIndex >= 0
                ? (CIRCLED[note.answerIndex] || "") + " " + note.answerText
                : note.answerText || ""
          }),
          el("p", { class: "t-explain__label", text: "해설" }),
          el("p", { text: note.explanation || "" })
        ])
      );
    }

    /* 이 문항과 이어지는 오개념 지도 — 있으면 복습 방법으로 붙인다 */
    var tip = teachTipFor(stat);
    if (tip) {
      card.appendChild(
        el("p", { class: "t-teach" }, [
          el("strong", { text: "💡 이렇게 복습해 보세요" }),
          el("span", { text: tip })
        ])
      );
    }

    return card;
  }

  function wrongPanel(rows) {
    var box = K.panel({
      title: "📌 가장 많이 틀린 문제",
      hint: "버튼을 누를 때마다 한 문제씩 해설과 함께 보여 줍니다. (최대 " + WRONG_LIMIT + "문제)"
    });

    var list = topWrong(rows);
    var index = -1;
    var progress = el("p", { class: "t-wrong__progress", attrs: { "aria-live": "polite" } });
    var body = el("div");

    function toStart() {
      index = -1;
      K.clear(body);
      btn.textContent = "가장 많이 틀린 문제 보기";
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
      K.announce("처음으로 돌아갔습니다.");
    }

    var btn = el("button", {
      class: "btn btn--primary",
      text: "가장 많이 틀린 문제 보기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!list.length) return;
          index += 1;

          /* 마지막까지 본 뒤 한 번 더 누르면 처음으로 돌아간다 */
          if (index >= list.length) {
            toStart();
            return;
          }

          /* 카드를 쌓지 않고 갈아 끼운다 — 한 번에 한 문제만 짚어 준다 */
          K.clear(body).appendChild(wrongCard(list[index], index + 1));

          var last = index === list.length - 1;
          btn.textContent = last ? "처음부터 다시 보기" : "다음 문제 보기";
          progress.textContent = index + 1 + " / " + list.length + " 문제 보는 중";
          K.announce("가장 많이 틀린 " + (index + 1) + "번째 문제, " + list[index].stat.no + "번 문항입니다.");
        }
      }
    });

    if (!list.length) {
      btn.disabled = true;
      btn.title = "모든 학생이 다섯 문항을 맞혔어요.";
      progress.textContent = "🎉 틀린 문항이 없어요. 모두 잘 이해했습니다.";
    } else {
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
    }

    box.body.appendChild(el("div", { class: "t-wrong__controls" }, [btn, progress]));
    box.body.appendChild(body);
    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ① 문항별 분석                                                        */
  /* ------------------------------------------------------------------ */

  function questionPanel(rows) {
    var box = K.panel({
      title: "📝 형성평가 문항 분석",
      hint: "정답률이 낮은 문항이 다음 시간에 다시 짚을 곳입니다."
    });

    var stats = T.data.questionStats(rows);
    var N = rows.length;

    stats.forEach(function (stat) {
      var note = NOTES.byId(stat.id) || {};
      var wrap = el("div", { class: "t-q" });

      wrap.appendChild(
        el("div", { class: "t-q__head" }, [
          el("span", { class: "t-q__no", text: stat.no + "번" }),
          el("span", { class: "t-q__tag", text: stat.tag }),
          el("span", {
            class: "t-q__rate" + (stat.rate >= 70 ? " t-q__rate--ok" : stat.rate < 50 ? " t-q__rate--low" : ""),
            text: "정답률 " + stat.rate + "% (" + stat.correct + "/" + N + ")"
          })
        ])
      );
      wrap.appendChild(el("p", { class: "t-q__stem", text: stat.stem }));

      if (stat.type === "choice") {
        /* 선택지 분포 — 정답 보기에 표시를 붙인다 */
        stat.distribution.forEach(function (d) {
          var isAnswer = d.index === stat.answerIndex;
          wrap.appendChild(
            K.bar(
              (isAnswer ? "★ 정답 " : "") + (d.index + 1) + ". " + d.label,
              d.count,
              N,
              { strong: isAnswer }
            )
          );
        });
        if (stat.blank) {
          wrap.appendChild(el("p", { class: "t-note", text: "고르지 않은 학생 " + stat.blank + "명" }));
        }
        if (stat.worstChoices.length) {
          wrap.appendChild(
            el("p", { class: "t-q__worst" }, [
              el("b", { text: "오답 TOP" + stat.worstChoices.length + " — " }),
              document.createTextNode(
                stat.worstChoices
                  .map(function (w) {
                    return (w.index + 1) + "번 «" + w.label + "» " + w.count + "명";
                  })
                  .join(" / ")
              )
            ])
          );
        }
      } else {
        /* 주관식 원문 (명세 16.1 마지막 줄) */
        var list = el("ul", { class: "t-texts" });
        stat.texts.forEach(function (t) {
          list.appendChild(
            el("li", { class: "t-texts__item" + (t.correct ? " t-texts__item--ok" : "") }, [
              el("span", { class: "t-texts__mark", attrs: { "aria-hidden": "true" }, text: t.correct ? "○" : "✕" }),
              el("span", { class: "t-texts__who", text: t.studentId + " " + t.studentName }),
              el("pre", { class: "t-texts__code", text: t.text || "(작성하지 않음)" })
            ])
          );
        });
        wrap.appendChild(el("p", { class: "t-subhead", text: "학생이 적은 답 (원문)" }));
        wrap.appendChild(list);
      }

      /* 지도 메모 — 정답·해설·흔한 오답 (명세 17장) */
      wrap.appendChild(
        el("details", { class: "t-fold" }, [
          el("summary", { class: "t-fold__sum", text: stat.no + "번 정답과 지도 메모" }),
          el("div", { class: "t-fold__body" }, [
            el("p", { class: "t-ans" }, [el("b", { text: "정답 — " }), document.createTextNode(note.answerText || "")]),
            el("p", { class: "t-why", text: note.explanation || "" }),
            note.commonWrong
              ? el("p", { class: "t-guide" }, [
                  el("b", { text: "지도 — " }),
                  document.createTextNode(note.commonWrong)
                ])
              : null
          ])
        ])
      );

      box.body.appendChild(wrap);
    });

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ②③ 회로 수행 — 두 센서를 나란히                                       */
  /* ------------------------------------------------------------------ */

  function circuitPanel(rows) {
    var box = K.panel({
      title: "🔌 회로 수행 분석",
      hint: "대표 오류가 곧 다음 시간에 먼저 짚을 곳입니다."
    });

    ["light", "soil"].forEach(function (goal) {
      var c = T.data.circuitStats(rows, goal);
      var N = rows.length;

      var block = el("div", { class: "t-block" });
      block.appendChild(el("h4", { class: "t-subhead", text: c.label + " 회로" }));
      block.appendChild(
        K.statRow([
          K.statCard("통과", c.completed, K.percent(c.completed, N) + "%", "명"),
          K.statCard("평균 시도", c.avgAttempts, "", "회"),
          K.statCard("힌트 쓴 학생", c.hintUsers, K.percent(c.hintUsers, N) + "%", "명"),
          K.statCard("위험 회로 겪음", c.riskyStudents, K.percent(c.riskyStudents, N) + "%", "명")
        ])
      );

      if (c.frequent.length === 0) {
        block.appendChild(K.empty("기록된 오류가 없습니다."));
      } else {
        block.appendChild(el("p", { class: "t-subhead", text: "대표 오류" }));
        c.frequent.slice(0, 6).forEach(function (f) {
          block.appendChild(K.bar(f.title, f.count, N));
        });
      }

      /* 명세 16.1 이 콕 집어 요구한 오류들이 «있었는지» 를 한 줄로 알려 준다 */
      var watch =
        goal === "light"
          ? [
              { code: "missing:cds-ao", label: "AO/" + PC.PINS.cds + " 누락" },
              { code: "led-reversed", label: "LED 역극성" },
              { code: "led-no-resistor", label: "무저항" },
              { code: "cds-reversed", label: "VCC/GND 역결선" }
            ]
          : [
              { code: "ao-do-swap", label: "AO/DO 혼동" },
              { code: "missing:soil-ao", label: PC.PINS.soil + " 누락" },
              { code: "soil-reversed", label: "VCC/GND 역결선" },
              { code: "probe-short", label: "탐침 단락" }
            ];

      var byCode = {};
      c.frequent.forEach(function (f) {
        byCode[f.code] = f.count;
      });

      var watchList = el("ul", { class: "t-watch" });
      watch.forEach(function (w) {
        var n = byCode[w.code] || 0;
        watchList.appendChild(
          el("li", { class: "t-watch__item" + (n > 0 ? " t-watch__item--hit" : "") }, [
            el("span", { class: "t-watch__mark", attrs: { "aria-hidden": "true" }, text: n > 0 ? "!" : "·" }),
            el("span", { class: "t-watch__name", text: w.label }),
            el("span", { class: "t-watch__num", text: n + "명" })
          ])
        );
      });
      block.appendChild(el("p", { class: "t-subhead", text: "특히 살펴볼 오류" }));
      block.appendChild(watchList);

      /* 정답 회로 (명세 17.1) */
      var answer = NOTES.CIRCUIT_ANSWERS[goal];
      block.appendChild(
        el("details", { class: "t-fold" }, [
          el("summary", { class: "t-fold__sum", text: answer.label + " 정답" }),
          el("div", { class: "t-fold__body" }, [
            el("pre", { class: "t-pre", text: answer.lines.join("\n") }),
            el("p", { class: "t-note", text: answer.allow })
          ])
        ])
      );

      box.body.appendChild(block);
    });

    /* 첨부 자료의 핀 어긋남 지도 메모 (명세 5장 마지막 두 줄) */
    box.body.appendChild(
      el("div", { class: "t-memo" }, [
        el("p", { class: "t-memo__title", text: NOTES.PIN_MEMO.title }),
        el("p", { class: "t-memo__body", text: NOTES.PIN_MEMO.body }),
        el("p", { class: "t-memo__guide", text: NOTES.PIN_MEMO.guide })
      ])
    );

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ④ 코드 수행                                                          */
  /* ------------------------------------------------------------------ */

  function codePanel(rows) {
    var box = K.panel({
      title: "💻 코드 수행 분석",
      hint: "검사 통과 수와 수정 횟수를 함께 봅니다(명세 16.1)."
    });

    ["light", "soil"].forEach(function (goal) {
      var c = T.data.codeStats(rows, goal);
      var N = rows.length;
      box.body.appendChild(el("h4", { class: "t-subhead", text: c.label + " 코드" }));
      box.body.appendChild(
        K.statRow([
          K.statCard("모두 통과", c.allPassed, K.percent(c.allPassed, N) + "%", "명"),
          K.statCard("평균 통과", c.avgPassed, "", "개"),
          K.statCard("평균 수정", c.avgAttempts, "", "회"),
          K.statCard("핀 불일치 겪음", c.withPinMismatch, K.percent(c.withPinMismatch, N) + "%", "명"),
          K.statCard("코드 비움", c.empty, "", "명")
        ])
      );
    });

    /* 학생별 최종 코드 (명세 16.1 여섯째 줄) */
    var fold = el("details", { class: "t-fold" }, [
      el("summary", { class: "t-fold__sum", text: "학생별 최종 코드 보기" })
    ]);
    var body = el("div", { class: "t-fold__body" });
    rows.forEach(function (r) {
      ["light", "soil"].forEach(function (goal) {
        var part = r[goal];
        body.appendChild(
          el("div", { class: "t-code" }, [
            el("p", { class: "t-code__who" }, [
              el("b", { text: r.studentId + " " + r.studentName }),
              el("span", {
                text:
                  " — " +
                  (goal === "light" ? "조도" : "수분") +
                  " · 검사 " +
                  part.code.testsPassed +
                  "/" +
                  part.code.testsTotal +
                  " · 수정 " +
                  part.code.attempts +
                  "회"
              })
            ]),
            K.codeBox(part.code.source)
          ])
        );
      });
    });
    fold.appendChild(body);
    box.body.appendChild(fold);

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ⑤ 학생별 실험 기록                                                    */
  /* ------------------------------------------------------------------ */

  function experimentPanel(rows) {
    var box = K.panel({
      title: "🧪 학생별 실험 기록",
      hint: "세 조건의 측정값과 관찰문입니다. 값만 있고 관찰이 비어 있으면 «눌러만 본» 것입니다."
    });

    ["light", "soil"].forEach(function (goal) {
      var table = T.data.experimentTable(rows, goal);
      box.body.appendChild(
        el("h4", { class: "t-subhead", text: (goal === "light" ? "조도" : "토양수분") + " 3조건" })
      );

      var wrap = el("div", { class: "t-tablewrap" });
      var head = el("tr", {}, [el("th", { text: "학번" }), el("th", { text: "이름" })]);
      table.conditions.forEach(function (c) {
        head.appendChild(el("th", { text: c.icon + " " + c.label }));
      });
      head.appendChild(el("th", { text: "기준값" }));
      head.appendChild(el("th", { text: "관찰" }));

      var body = el("tbody");
      table.rows.forEach(function (r) {
        var tr = el("tr", {}, [
          el("td", { class: "t-td--mono", text: r.studentId }),
          el("td", { text: r.studentName })
        ]);
        r.cells.forEach(function (cell) {
          tr.appendChild(
            el("td", { class: "t-td--mono" }, [
              el("span", { text: cell.ran ? String(cell.value) : "—" }),
              cell.led ? el("small", { text: " " + cell.led }) : null
            ])
          );
        });
        tr.appendChild(el("td", { class: "t-td--mono", text: r.threshold || "—" }));
        tr.appendChild(
          el("td", {
            text:
              r.cells.filter(function (c) {
                return String(c.observation || "").replace(/\s+/g, "").length >= 8;
              }).length + "/3"
          })
