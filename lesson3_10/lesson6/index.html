<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="고등학교 1학년 정보 · 조도센서와 토양수분감지센서로 환경 데이터 측정하기 학습 활동"
    />
    <meta name="robots" content="noindex" />
    <title>조도센서와 토양수분감지센서로 환경 데이터 측정하기</title>

    <!-- 스타일은 적은 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 18장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 18장). 몸통의 ＋ 표시와 단자 이름표 글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  /* ── 이 차시의 센서 (명세 18장) ──────────────────────────────
     ★ 밝음/어두움, 건조/습함, HIGH/LOW 를 «색으로만» 알리지 않는다.
       아래 색들은 늘 숫자·글자·아이콘과 «함께» 쓴다. */

  /* 조도센서 — CdS 소자 */
  --cds-resin: #cfd8e3;      /* 투명 수지 테두리 */
  --cds-face: #e8b96a;       /* 빛 받는 면 (황화카드뮴의 노란빛) */
  --cds-face-edge: #a97f31;
  --cds-zig: #3f4652;        /* 빗살 전극 */
  --cds-shade: #1f2937;      /* 어두울 때 덮이는 그늘 */
  --cds-lead: #9aa3ae;

  /* 토양수분센서 */
  --soil-dirt: #7a5a3a;      /* 흙 */
  --soil-dirt-edge: #5b4229;
  --soil-water: #2f7fbf;     /* 물기 */
  --soil-drop: #57a7e0;
  --soil-current: #1d4ed8;   /* 두 탐침 사이의 전류 */
  --probe-blade: #b9a15a;    /* 놋쇠 탐침 판 */
  --probe-blade-edge: #8b7638;
  --probe-head: #3f4652;

  /* 센서 모듈 기판 */
  --mod-board: #2f7d4f;
  --mod-board-edge: #1e5a37;
  --mod-pad: #d8b26a;
  --mod-pad-edge: #a8853f;
  --mod-trim: #2f6fb5;
  --mod-lamp: #b9c3cf;

  /* LED 와 저항 */
  --led-off: #c7ced8;
  --led-on: #f2c53d;
  --led-glow: rgba(242, 197, 61, 0.35);
  --led-edge: #8b8f96;
  --res-body: #d7c4a3;
  --res-body-edge: #a89272;

  /* 활용 사례 그림 — 밤하늘 · 가로등 · 자동차 (명세 8.1)
     ★ «어두워지면 켜진다» 를 보여야 하므로 배경을 «밤» 으로 둔다.
       밝은 등과 어두운 하늘의 대비가 이 그림의 알맹이다. */
  --night-sky: #1b2740;
  --night-sky-edge: #101a2b;
  --night-star: #e8eefb;
  --night-moon: #f6e7a8;
  --night-ground: #3a4356;
  --night-kerb: #59627a;

  --lamp-metal: #8e99ab;
  --lamp-metal-edge: #616b7d;
  --lamp-hood: #6b7688;
  --lamp-glass: #fdf3c4;
  --lamp-glass-edge: #d9b93f;
  --lamp-beam: #fdf0b8;

  --car-body: #3f7fc4;
  --car-body-edge: #245c98;
  --car-glass: #bcd9f2;
  --car-glass-edge: #7ba8cf;
  --car-tyre: #23282f;
  --car-rim: #b9c3cf;
  --car-hub: #6b7684;
  --car-head: #fdf3c4;
  --car-tail: #d94a3d;
  --car-seam: #2b6099;

  --sensor-case: #2f343b;

  /* 활용 사례 그림 */
  --use-lamp-off: #cbd5e1;
  --use-lamp-on: #fde68a;
  --use-metal: #94a3b8;
  --use-leaf: #4ca86a;
  --use-house: #dbeafe;
  --use-pot: #c2703f;

  /* 위험 표시 (5V-GND 단락 · 모듈 침수 · LED 무저항) */
  --danger-ring: #dc2626;

  /* 눈금판 */
  --gauge-track: #e5ebf2;
  --gauge-fill: #2563eb;
  --gauge-mark: #b45309;

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 18장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}
