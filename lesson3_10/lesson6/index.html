  /* ================================================================== */
  /* 2. 두 센서의 원리 (명세 8장)                                          */
  /* ================================================================== */

  /** 개념 카드 한 장 */
  function conceptCard(card, state, app) {
    var body = el("div", { class: "stack" });

    (card.body || []).forEach(function (line) {
      body.appendChild(el("p", { class: "para", text: line }));
    });

    if (card.figure && S.figures.has(card.figure)) {
      body.appendChild(S.figures.forCard(card.figure));
    }

    if (card.pins) {
      var table = el("ul", { class: "pinrules" });
      card.pins.forEach(function (p) {
        table.appendChild(
          el("li", { class: "pinrules__item" }, [
            el("b", { class: "pinrules__q", text: p.name }),
            el("span", { class: "pinrules__a", text: p.role + " → " + p.to })
          ])
        );
      });
      body.appendChild(table);
    }

    if (card.uses) {
      var uses = el("ul", { class: "iocards" });
      card.uses.forEach(function (u) {
        uses.appendChild(
          el("li", { class: "iocard iocard--output" }, [
            el("p", { class: "iocard__title", text: u.name }),
            el("p", { class: "iocard__detail", text: u.detail })
          ])
        );
      });
      body.appendChild(uses);
    }

    if (card.keyLine) {
      body.appendChild(
        el("p", { class: "keypoints__item", text: "핵심 — " + card.keyLine })
      );
    }
    if (card.caution) {
      body.appendChild(UI.alert("warn", card.caution));
    }

    /* ★ «읽었습니다» 확인 상자를 두지 않는다.
       2단계가 열리는 조건은 «개념 확인 3문항» 이고 이 상자는 아무것도 열지 않았다.
       아무 일도 하지 않는 상자를 카드마다 붙이면 학생은 «해야 하는 일» 로 오해한다. */
    return UI.card({ title: card.title }, [body]);
  }

  function concept(state, app) {
    var parts = [
      el("header", { class: "section-title" }, [
        el("p", { class: "section-title__tag", text: PC.stepTag("concept") }),
        el("h2", { text: "두 센서의 원리 이해" }),
        el("p", {
          class: "para",
          text: "슬라이더를 움직여 «환경이 바뀔 때 저항과 아날로그값이 어떻게 따라 바뀌는지» 를 눈으로 확인합니다."
        })
      ])
    ];

    /* ── 조도센서 탐구 (명세 8.1) ── */
    parts.push(el("h3", { class: "subhead subhead--big", text: "① 조도센서 탐구" }));
    L.LIGHT_CARDS.forEach(function (card) {
      parts.push(conceptCard(card, state, app));
    });
    parts.push(
      UI.card({ title: "직접 움직여 보기 — 빛의 세기", eyebrow: "어두움 → 밝음" }, [
        S.sim.lightSim({
          level: 55,
          onChange: function () {}
        }).root
      ])
    );

    /* ── 토양수분센서 탐구 (명세 8.2) ── */
    parts.push(el("h3", { class: "subhead subhead--big", text: "② 토양수분센서 탐구" }));
    L.SOIL_CARDS.forEach(function (card) {
      parts.push(conceptCard(card, state, app));
    });
    parts.push(
      UI.card({ title: "직접 움직여 보기 — 흙의 수분", eyebrow: "건조 → 보통 → 습함" }, [
        S.sim.soilSim({
          level: 50,
          /* 2단계는 «원리를 보는» 자리다. 침수 실습과 값 안내는 4단계가 맡는다. */
          showPractice: false,
          onChange: function () {}
        }).root
      ])
    );

    /* ── 공통 개념 (명세 4.3) ── */
    parts.push(el("h3", { class: "subhead subhead--big", text: "③ 두 센서에 함께 쓰이는 개념" }));
    L.COMMON_CARDS.forEach(function (card) {
      parts.push(conceptCard(card, state, app));
    });

    /* ── 개념 확인 세 문항 (명세 8.3) ── */
    var checks = el("div", { class: "stack" });
    L.CONCEPT_CHECKS.forEach(function (q, i) {
      var chosen = state.concept.choices[q.id];
      var passed = state.concept.checks[q.id] === true;

      var group = UI.choiceGroup(
        { name: "cc-" + q.id, legend: i + 1 + ". " + q.stem, choices: q.choices },
        chosen,
        function (index) {
          var ok = index === q.answer;
          app.update(function (s) {
            s.concept.choices[q.id] = index;
            s.concept.checks[q.id] = ok;
            s.concept.attempts += 1;
          });
          UI.announce(ok ? "맞았습니다." : "다시 생각해 보세요.");
        }
      );

      /* ★ 이것은 형성평가가 아니다 — 그 자리에서 답과 까닭을 알려 준다(명세 8.3) */
      var tell = null;
      if (chosen !== undefined) {
        tell = passed
          ? UI.alert("ok", "맞았습니다. " + q.why)
          : UI.alert("warn", "다시 생각해 보세요.", [
              el("p", { class: "alert__fix", text: "힌트 — 위 카드의 «핵심» 줄을 다시 읽어 보세요." })
            ]);
      }

      checks.appendChild(
        el("div", { class: "quizitem" }, [
          group,
          tell,
          el("span", {
            class: "badge" + (passed ? " badge--true" : ""),
            text: passed ? "통과" : chosen === undefined ? "아직" : "다시"
          })
        ])
      );
    });

    var passedCount = L.CONCEPT_CHECKS.filter(function (q) {
      return state.concept.checks[q.id] === true;
    }).length;

    parts.push(
      UI.card(
        {
          title: "개념 확인",
          eyebrow: passedCount + " / " + L.CONCEPT_CHECKS.length + " 통과",
          desc: "세 문항을 모두 맞히면 3단계가 열립니다. 틀려도 다시 고를 수 있습니다."
        },
        [checks]
      )
    );

    /* 값 해석이 어려운 학생을 위한 세 칸 표 (명세 17.3) */
    parts.push(
      UI.foldout("값 해석이 헷갈리면 — 세 칸으로 정리해 보기", function () {
        return el("div", { class: "stack" }, [
          S.figures.threeStep({
            caption: "조도센서 — 어두워졌을 때",
            env: "어두워짐",
            res: "저항 커짐",
            adc: "값 커짐",
            legend: [{ no: "※", name: "이 회로 모델에서", note: "어두울수록 아날로그값이 커진다" }]
          }),
          S.figures.threeStep({
            caption: "토양수분센서 — 물을 주었을 때",
            env: "수분 늘어남",
            res: "저항 작아짐",
            adc: "AO 값 작아짐",
            legend: [{ no: "※", name: "일반적인 저항식 모듈에서", note: "수분이 많을수록 출력값이 낮아진다" }]
          })
        ]);
      })
    );

    return el("div", { class: "stack" }, parts);
  }

  /* ================================================================== */
  /* 5. 두 센서 비교와 생활 문제 적용 (명세 12장)                            */
  /* ================================================================== */

  function compare(state, app) {
    var table = state.compare.table;
    var app5 = state.compare.application;

    /* ── 비교표 ── */
    var head = el("div", { class: "cmp__row cmp__row--head" }, [
      el("span", { class: "cmp__cell cmp__cell--label", text: "비교" }),
      el("span", { class: "cmp__cell", text: "조도센서" }),
      el("span", { class: "cmp__cell", text: "토양수분센서" })
    ]);

    var rows = [head];
    L.COMPARE_ROWS.forEach(function (row) {
      var cells = ["light", "soil"].map(function (side) {
        var key = row.id + ":" + side;
        var input = el("input", {
          class: "input cmp__input",
          attrs: {
            type: "text",
            "aria-label": row.label + " — " + (side === "light" ? "조도센서" : "토양수분센서"),
            placeholder: "여기에 적으세요"
          }
        });
        input.value = table[key] || "";

        var mark = el("span", { class: "cmp__mark" });

        function refresh() {
          var ok = L.compareMatch(row, side, input.value);
          var typed = PC.schema.contentLength(input.value) >= 2;
          mark.textContent = !typed ? "" : ok ? "✔ 뜻이 통합니다" : "· 다시 생각해 보세요";
          mark.className = "cmp__mark" + (typed && ok ? " cmp__mark--ok" : "");
        }

        input.addEventListener("input", function () {
          app.patch(function (s) {
            s.compare.table[key] = input.value;
          });
          refresh();
        });
        input.addEventListener("change", function () {
          app.rerenderNav();
        });
        refresh();

        return el("span", { class: "cmp__cell" }, [input, mark]);
      });

      rows.push(
        el("div", { class: "cmp__row" }, [
          el("span", { class: "cmp__cell cmp__cell--label", text: row.label })
        ].concat(cells))
      );
    });

    /* ── 내가 재어 본 값 되짚기 — 적용 설계의 근거가 된다 ── */
    function measuredList(goal, label) {
      var part = state[goal];
      var conds = (PC.SENSORS[goal] || {}).conditions || [];
      var ul = el("ul", { class: "measured" });
      conds.forEach(function (c) {
        var box = part.experiment.runs[c.id] || {};
        ul.appendChild(
          el("li", { class: "measured__item" }, [
            el("span", { class: "measured__name", text: c.icon + " " + c.label }),
            el("span", { class: "measured__value", text: box.ran ? String(box.value) : "—" })
          ])
        );
      });
      ul.appendChild(
        el("li", { class: "measured__item measured__item--th" }, [
          el("span", { class: "measured__name", text: "내가 정한 기준값" }),
          el("span", { class: "measured__value", text: part.threshold ? String(part.threshold) : "—" })
        ])
      );
      return UI.card({ title: label, eyebrow: "3·4단계에서 재어 본 값" }, [ul]);
    }

    /* ── 적용 과제 ── */
    var appFields = el("div", { class: "stack" });
    L.APPLICATION.fields.forEach(function (f) {
      var box = UI.field(
        {
          label: f.label,
          min: f.min,
          placeholder: f.placeholder,
          help: f.help,
          multiline: f.multiline === true,
          rows: 3
        },
        app5[f.id],
        function (v) {
          app.patch(function (s) {
            s.compare.application[f.id] = v;
          });
        }
      );
      box.input.addEventListener("change", function () {
        app.rerenderNav();
      });
      appFields.appendChild(box.root);
    });

    return el("div", { class: "stack" }, [
      el("header", { class: "section-title" }, [
        el("p", { class: "section-title__tag", text: PC.stepTag("compare") }),
        el("h2", { text: "두 센서 비교와 생활 문제 적용" }),
        el("p", {
          class: "para",
          text:
            "두 센서는 모두 저항 변화를 이용하지만 감지 대상과 값 해석이 다릅니다. " +
            "표를 채워 견주어 본 뒤, 배운 것으로 «스마트 화분» 을 설계해 봅니다."
        })
      ]),

      UI.card({ title: "① 두 센서 비교표", desc: "빈칸을 자기 말로 채우세요. 뜻이 통하면 됩니다." }, [
        el("div", { class: "cmp" }, rows)
      ]),

      el("div", { class: "split" }, [measuredList("light", "조도 측정값"), measuredList("soil", "토양수분 측정값")]),

      UI.card(
        {
          title: "② " + L.APPLICATION.title,
          eyebrow: "적용 과제",
          desc: L.APPLICATION.prompt
        },
        [
          UI.alert("info", "3·4단계에서 «자기가 재어 본 값» 을 근거로 적어 주세요. 예시를 옮겨 적으면 실제로는 동작하지 않습니다."),
          appFields
        ]
      ),

      UI.foldout("설계를 코드로 옮기면 어떤 모습일까?", function () {
        return el("div", { class: "stack" }, [
          el("p", {
            class: "para",
            text: "두 센서를 함께 쓰면 조건문이 둘로 늘어납니다. 참고로만 보세요 — 이 차시의 통과 조건은 아닙니다."
          }),
          UI.codeBlock(
            [
              "const int CDS = " + PC.PINS.cds + ";",
              "const int SOIL = " + PC.PINS.soil + ";",
              "const int LED = " + PC.PINS.ledNumber + ";",
              "const int DARK = " + (state.light.threshold || PC.LIGHT_THRESHOLD) + ";   // 내가 정한 값",
              "const int DRY  = " + (state.soil.threshold || PC.SOIL_DRY_THRESHOLD) + ";   // 내가 정한 값",
              "",
              "void setup() {",
              "  Serial.begin(9600);",
              "  pinMode(LED, OUTPUT);",
              "}",
              "",
              "void loop() {",
              "  int light = analogRead(CDS);",
              "  int soil  = analogRead(SOIL);",
              "",
              "  if (light > DARK) {",
              "    digitalWrite(LED, HIGH);",
              "  } else {",
              "    digitalWrite(LED, LOW);",
              "  }",
              "",
              "  if (soil > DRY) {",
              '    Serial.println("물을 주세요");',
              "  }",
              "  delay(500);",
              "}"
            ].join("\n"),
            "두 센서를 함께 쓰는 뼈대"
          )
        ]);
      })
    ]);
  }

  /* ================================================================== */
  /* 6. 형성평가와 제출 (명세 13장 · 15장)                                 */
  /* ================================================================== */

  /** 학번·이름 칸 */
  function studentCard(state, app, onChange) {
    var check = PC.schema.validateStudent(state.student);
    var locked = state.assessment.sealed === true;

    function fieldFor(key, label, help) {
      var id = UI.nextId("st");
      var input = el("input", {
        class: "input student-field__input",
        id: id,
        attrs: {
          type: key === "studentId" ? "text" : "text",
          inputmode: key === "studentId" ? "numeric" : null,
          maxlength: key === "studentId" ? String((PC.LIMITS || {}).studentIdMax || 10) : "20",
          placeholder: key === "studentId" ? "예 : 10312" : "예 : 홍길동",
          disabled: locked ? true : null,
          autocomplete: "off"
        }
      });
      input.value = state.student[key === "studentId" ? "studentId" : "name"] || "";
      input.addEventListener("input", function () {
        app.patch(function (s) {
          if (key === "studentId") s.student.studentId = input.value.replace(/\D/g, "");
          else s.student.name = input.value;
        });
        if (key === "studentId") input.value = input.value.replace(/\D/g, "");
        if (onChange) onChange();
      });
      input.addEventListener("change", function () {
        app.rerenderNav();
      });

      return el("div", { class: "student-field" }, [
        el("label", { class: "student-field__label", attrs: { for: id }, text: label }),
        input,
        help ? el("p", { class: "field__help", text: help }) : null
      ]);
    }

    var pretty = PC.schema.describeStudentId(state.student.studentId);

    return UI.card({ title: "내 정보", eyebrow: locked ? "제출을 마쳐 잠겼습니다" : "" }, [
      el("div", { class: "student-card__fields" }, [
        fieldFor("studentId", "학번", "숫자만 넣습니다. 다섯 자리면 학년·반·번호를 확인합니다."),
        fieldFor("name", "이름", "")
      ]),
      pretty ? el("p", { class: "student-card__badge", text: "확인 — " + pretty }) : null,
      check.ok ? null : UI.alert("warn", check.problems[0].message),
      el("p", { class: "student-card__privacy", text: (PC.MESSAGES || {}).privacy })
    ]);
  }

  /** 문항 하나 */
  function questionCard(q, state, app) {
    var locked = state.assessment.sealed === true;
    var answer = state.assessment.answers[q.id];

    var body = el("div", { class: "quiz__body" });

    if (q.code) body.appendChild(UI.codeBlock(q.code, "다음 코드"));

    /* ★ 회로를 «보여 주는» 문항 — 말로만 「기본 회로에서」 하면
       무엇이 이미 이어져 있는지 모르는 채로 답을 골라야 한다.
       읽는 줄 하나는 비워 두었다 — 그것이 그 문항의 답이다. */
    /* 그림으로 보이는 회로 — 글 목록보다 «실물처럼» 읽힌다.
       그림을 만들 수 없으면 아래 글 목록으로 내려간다. */
    var drawn = null;
    if (q.figure === "soilWiring" && S.figures && S.figures.quizSoilWiring) {
      drawn = S.figures.quizSoilWiring();
      body.appendChild(drawn);
    }

    if (q.wiring && !drawn) {
      var wireList = el("ul", { class: "quizwire__list" });
      (q.wiring.lines || []).forEach(function (line) {
        wireList.appendChild(el("li", { class: "quizwire__item", text: line }));
      });
      if (q.wiring.missing) {
        wireList.appendChild(
          el("li", { class: "quizwire__item quizwire__item--blank", text: q.wiring.missing })
        );
      }
      body.appendChild(
        el("figure", { class: "quizwire" }, [
          q.wiring.caption ? el("figcaption", { class: "quizwire__cap", text: q.wiring.caption }) : null,
          wireList
        ])
      );
    }

    if (q.type === "choice") {
      body.appendChild(
        (function () {
          var group = UI.choiceGroup(
            { name: "q-" + q.id, legend: q.stem, choices: q.choices },
            answer,
            function (index) {
              if (locked) return;
              app.update(function (s) {
                s.assessment.answers[q.id] = index;
              });
            }
          );
          if (locked) {
            group.querySelectorAll("input").forEach(function (input) {
              input.disabled = true;
            });
          }
          return group;
        })()
      );
    } else {
      /* 5번 — 두 줄 직접 입력 */
      body.appendChild(el("p", { class: "quiz__question", text: q.stem }));
      body.appendChild(UI.codeBlock(q.template, "채워야 하는 자리"));

      var area = el("textarea", {
        class: "input input--area input--mono",
        attrs: {
          rows: 3,
          placeholder: q.placeholder,
          spellcheck: "false",
          autocapitalize: "off",
          disabled: locked ? true : null,
          "aria-label": "5번 답 — 두 줄"
        }
      });
      area.value = answer || "";

      /* ★ 적는 동안 «조건» 을 걸지 않는다 (2026-08-25, 선생님 요청).
         세미콜론·괄호·「두 줄입니다」 같은 안내를 그때그때 내보이면
         학생이 «맞게 적었는지» 를 미리 가늠하게 되고, 형성평가가 아니라
         연습 문제가 된다. 맞고 틀림은 채점이 가린다.
         제출은 «빈칸이 아니면» 된다(quiz.isAnswered). */
      area.addEventListener("input", function () {
        app.patch(function (s) {
          s.assessment.answers[q.id] = area.value;
        });
        app.rerenderNav();
      });

      body.appendChild(area);
      body.appendChild(el("p", { class: "field__help", text: q.help }));
    }

    var answered = Q.isAnswered(q, answer);

    return el("article", { class: "quizitem" }, [
      el("div", { class: "quiz__meta" }, [
        el("span", { class: "quiz__no", text: q.no + "번" }),
        el("span", { class: "quiz__tags", text: q.tag }),
        el("span", { class: "quiz__counter", text: q.points + "점" }),
        el("span", { class: "badge" + (answered ? " badge--true" : ""), text: answered ? "답함" : "아직" })
      ]),
      q.type === "choice" ? null : null,
      body
    ]);
  }

  /** 채점 결과와 해설 — 제출을 마친 뒤에만 만든다 */
  function reviewCard(state) {
    var revealed = Q.reveal(state.assessment.answers);
    if (!revealed.allowed) return UI.alert("warn", revealed.reason);

    var g = revealed.graded;
    var list = el("div", { class: "stack" });

    revealed.items.forEach(function (item) {
      var q = Q.byId(item.id);
      var yours =
        q.type === "choice"
          ? item.yourAnswer === undefined || item.yourAnswer === ""
            ? "고르지 않음"
            : "제" + (Number(item.yourAnswer) + 1) + "번 — " + q.choices[Number(item.yourAnswer)]
          : String(item.yourAnswer || "");

      /* ★ 5번은 «한 줄에 1점» 이다 — 몇 점을 왜 받았는지 그 자리에서 보인다 */
      var scored = g.results.filter(function (r) {
        return r.id === item.id;
      })[0] || {};
      var partial = q.type === "code" && !item.correct && scored.points > 0;
      var state =
        q.type === "code"
          ? item.correct
            ? "정답 (" + scored.points + " / " + q.points + "점)"
            : scored.points > 0
            ? "부분 정답 (" + scored.points + " / " + q.points + "점)"
            : "오답 (0 / " + q.points + "점)"
          : item.correct
          ? "정답"
          : "오답";

      var lineNote = null;
      if (q.type === "code" && Array.isArray(scored.lines)) {
        var marks = el("ul", { class: "linescore" });
        ["값을 읽어 변수에 담는 줄", "그 값을 시리얼로 내보내는 줄"].forEach(function (label, i) {
          marks.appendChild(
            el("li", { class: "linescore__item" }, [
              el("span", {
                class: "linescore__mark" + (scored.lines[i] ? " linescore__mark--ok" : ""),
                attrs: { "aria-hidden": "true" },
                text: scored.lines[i] ? "○" : "✕"
              }),
              el("span", { class: "linescore__text", text: label }),
              el("span", { class: "linescore__pt", text: scored.lines[i] ? "1점" : "0점" })
            ])
          );
        });
        /* ★ 두 줄이 다 ○ 인데 1점인 경우가 있다 — 이어 붙이면 컴파일되지 않는 코드다.
           깎인 1점을 «따로 한 줄» 로 보이지 않으면 «1점 + 1점 = 1점» 처럼 읽힌다. */
        if (scored.mixed || scored.swapped) {
          marks.appendChild(
            el("li", { class: "linescore__item linescore__item--minus" }, [
              el("span", {
                class: "linescore__mark linescore__mark--minus",
                attrs: { "aria-hidden": "true" },
                text: "−"
              }),
              el("span", { class: "linescore__text", text: "두 줄을 함께 보면 컴파일되지 않습니다" }),
              el("span", { class: "linescore__pt", text: "−1점" })
            ])
          );
        }

        var why = scored.swapped
          ? "두 줄이 다 맞았지만 «순서» 가 뒤바뀌었습니다. 담지 않은 변수를 먼저 출력하면 컴파일되지 않습니다."
          : scored.mixed
          ? "두 줄이 다 맞았지만 «변수 이름» 이 서로 다릅니다. 두 줄에서 같은 이름을 써야 합니다."
          : "";
        lineNote = el("div", { class: "linescore__box" }, [
          el("p", { class: "linescore__head", text: "줄마다 1점" }),
          marks,
          why ? el("p", { class: "linescore__why", text: why }) : null
        ]);
      }

      list.appendChild(
        el("article", { class: "review" + (item.correct ? " review--ok" : partial ? " review--part" : "") }, [
          el("div", { class: "review__head" }, [
            el("span", {
              class: "review__mark",
              attrs: { "aria-hidden": "true" },
              text: item.correct ? "○" : partial ? "△" : "✕"
            }),
            el("span", { class: "review__state", text: item.no + "번 — " + state })
          ]),
          el("p", { class: "review__stem", text: item.stem }),
          el("p", { class: "my-answer" + (q.type === "code" ? " my-answer--code" : "") }, [
            el("b", { text: "내 답 : " }),
            document.createTextNode(yours)
          ]),
          el("p", { class: "review__answer" }, [
            el("b", { text: "정답 : " }),
            document.createTextNode(item.answerText)
          ]),
          lineNote,
          el("p", { class: "review__why", text: item.explanation })
        ])
      );
    });

    return el("div", { class: "stack" }, [
      el("div", { class: "score-card" }, [
        el("p", { class: "score-card__title", text: "채점 결과" }),
        el("p", { class: "score-card__value", text: g.score + " / " + g.total + "점" }),
        el("p", {
          class: "score-card__level",
          text: g.pass ? "이수 (" + (PC.ASSESS || {}).passScore + "점 이상)" : "미이수 — 다시 살펴봐요"
        }),
        el("p", {
          class: "score-card__comment",
          text: g.pass
            ? "두 센서의 원리와 값 해석을 잘 이해했습니다."
            : "틀린 문항의 해설을 읽고, 3·4단계의 실험 기록을 다시 살펴보세요."
        })
      ]),
      list
    ]);
  }

  /** ①② 가 붙은 구역 제목 — 5단계가 두 구역으로 나뉘어 있음을 보인다 */
  function sectionHead(tag, text, note) {
    return el("div", { class: "wrapsec" }, [
      el("h3", { class: "wrapsec__head" }, [
        el("span", { class: "wrapsec__tag", attrs: { "aria-hidden": "true" }, text: tag }),
        el("span", { text: text })
      ]),
      note ? el("p", { class: "wrapsec__note", text: note }) : null
    ]);
  }

  /**
   * ② 학습 정리 — 형성평가를 마친 뒤 열린다.
   *
   * ★ 왜 채점 뒤인가
   *   요약 안에 정답의 근거가 들어 있다. 문제를 풀기 전에 보여 주면
   *   형성평가가 «읽고 옮겨 적기» 가 된다(명세 13.1 과 같은 까닭이다).
   *
   * ★ 인쇄
   *   학생이 종이로 들고 갈 수 있어야 한다. 인쇄할 때는 이 구역만 남기고
   *   나머지(문항·제출·단추)는 print.css 가 감춘다.
   */
  function summarySection(state) {
    var graded = Q.gradeAll(state.assessment.answers);
    var shown = Q.reveal(state.assessment.answers);
    var name = String((state.student || {}).name || "").trim();
    var sid = String((state.student || {}).studentId || "").trim();

    var box = el("div", { class: "printarea" });

    /* 인쇄한 종이에도 «누구의 것인가» 가 있어야 한다 */
    box.appendChild(
      el("div", { class: "wrapdoc" }, [
        el("p", { class: "wrapdoc__title", text: PC.LESSON_TITLE }),
        el("p", {
          class: "wrapdoc__who",
          text:
            (sid ? sid + " " : "") +
            (name ? name : "") +
            (shown.allowed ? "   ·   형성평가 " + shown.graded.score + " / " + shown.graded.total + "점" : "")
        })
      ])
    );

    /* ── 오늘 배운 내용 ── */
    var list = el("ol", { class: "wraplist" });
    (L.WRAP_UP || []).forEach(function (text) {
      list.appendChild(el("li", { class: "wraplist__item", text: text }));
    });
    box.appendChild(
      UI.card({ title: "오늘 배운 내용", eyebrow: (L.WRAP_UP || []).length + "줄" }, [list])
    );

    /* ── 새로 나온 것 ── */
    var cards = el("div", { class: "syntaxcards" });
    (L.NEW_SYNTAX || []).forEach(function (f) {
      cards.appendChild(
        el("div", { class: "syntaxcard" }, [
          el("code", { class: "syntaxcard__title", text: f.name }),
          el("p", { class: "syntaxcard__note", text: f.what }),
          el("p", { class: "syntaxcard__note syntaxcard__note--why", text: f.why })
        ])
      );
    });
    box.appendChild(UI.card({ title: "이 차시에 새로 나온 것" }, [cards]));

    /* ── 내가 한 것 ── */
    var mine = el("div", { class: "stack" });
    ["light", "soil"].forEach(function (goal) {
      var part = state[goal] || {};
      var words = goal === "light" ? "조도센서" : "토양수분센서";
      var conns = ((part.circuit || {}).connections || [])
        .map(function (conn) {
          return (
            PC.circuit.describe(conn.fromComponent, conn.fromPin) +
            " ↔ " +
            PC.circuit.describe(conn.toComponent, conn.toPin)
          );
        })
        .join("\n");

      mine.appendChild(el("h4", { class: "subhead", text: words + " — 내가 이은 회로" }));
      mine.appendChild(
        el("div", { class: "myanswer" + (conns ? "" : " myanswer--empty") }, [
          el("span", { text: conns || "이은 케이블이 없습니다." })
        ])
      );
      mine.appendChild(el("h4", { class: "subhead", text: words + " — 내가 완성한 코드" }));
      mine.appendChild(
        el("div", { class: "myanswer myanswer--code" + ((part.code || {}).source ? "" : " myanswer--empty") }, [
          el("span", { text: (part.code || {}).source || "완성한 코드가 없습니다." })
        ])
      );
    });
    box.appendChild(UI.card({ title: "내가 한 것 되돌아보기" }, [mine]));

    return { root: box, graded: graded };
  }

  function assess(state, app) {
    var locked = state.assessment.sealed === true;
    var graded = state.assessment.graded === true;
    var gradedAll = Q.gradeAll(state.assessment.answers);

    var messageHost = el("div", { class: "feedback" });
    var confirmHost = el("div");

    /* 제출 주소 칸 — 설정에 주소가 없을 때만 (명세 15장) */
    var endpointField = null;
    if (PC.config.needsUrlInput()) {
      endpointField = UI.field(
        {
          label: "제출 주소",
          placeholder: "https://script.google.com/…/exec",
          help: "선생님이 알려 주신 주소를 넣으세요. 한 번 넣으면 이 기기에 기억됩니다."
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
    }

    var busy = false;

    /**
     * 제출할 수 있는가 — «누르는 그때» 의 상태로 본다.
     *
     * ★ 화면을 그릴 때 세어 둔 값(gradedAll)으로 보면, 5번 칸에 글을 적어도
     *   («고칠 때마다» 화면을 다시 그리지는 않으므로) 옛 숫자가 남아
     *   「지금 4개」 라며 막는다. 실제로 그랬다.
     */
    function guard() {
      var now = app.getState();
      var check = PC.schema.validateStudent(now.student);
      if (!check.ok) {
        UI.clear(messageHost).appendChild(UI.alert("warn", check.problems[0].message));
        return false;
      }
      var counted = Q.gradeAll(now.assessment.answers);
      if (!counted.allAnswered) {
        UI.clear(messageHost).appendChild(
          UI.alert("warn", "다섯 문항에 모두 답해야 제출할 수 있습니다. 지금 " + counted.answeredCount + "개.")
        );
        return false;
      }
      UI.clear(messageHost);
      return true;
    }

    var downloadBtn = UI.button("파일로 내기 (JSON)", {
      class: "btn btn--ghost",
      click: function () {
        if (!guard()) return;
        var payload = PC.schema.buildPayload(state);
        if (!S.api.download(payload)) {
          UI.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
          return;
        }
        UI.toast("파일을 내려받았습니다. 선생님께 내 주세요.");
        if (!locked) {
          S.store.saveStudent(state.student);
          app.update(function (s) {
            /* ★ 파일로 내는 것도 제출이다. 여기서도 답안이 잠긴다(명세 15장). */
            s.assessment.sealed = true;
            s.submitted = { at: new Date().toISOString(), via: "file" };
          });
        }
      }
    });

    function doSend() {
      busy = true;
      UI.clear(messageHost);
      var payload = PC.schema.buildPayload(state);
      S.store.saveStudent(state.student);

      S.api.submit(payload, endpointField ? endpointField.input.value : "").then(function (result) {
        busy = false;

        if (result.ok) {
          app.update(function (s) {
            s.submissionId = result.submissionId || "";
            s.submitted = {
              at: result.serverUpdatedAt || new Date().toISOString(),
              demo: result.demo === true,
              via: "server"
            };
            /* ★ 여기서 답안이 잠긴다 — 그 뒤에 [채점하기] 가 열린다 */
            s.assessment.sealed = true;
          });
          UI.toast("제출했습니다. 이제 채점할 수 있습니다.");
          return;
        }

        /* 실패했을 때는 «잠그지 않는다». 고쳐서 다시 낼 수 있어야 한다.
           답안도 버리지 않는다 — 임시 저장에 남기고 «파일로 내는 길» 을 그 자리에서 준다. */
        S.store.queuePending(payload);
        UI.clear(messageHost).appendChild(
          UI.alert("warn", result.message || (PC.MESSAGES || {}).networkFail, [
            el("p", {
              class: "alert__fix",
              text: "아직 제출되지 않았으니 답은 그대로 남아 있습니다. 아래 [파일로 내기] 로 받아 선생님께 내도 됩니다."
            }),
            el("div", { class: "btnrow" }, [downloadBtn])
          ])
        );
      });
    }

    var submitBtn = UI.button(locked ? "제출을 마쳤습니다" : "답안 제출하기", {
      disabled: locked || busy,
      click: function () {
        if (busy || locked) return;
        if (!guard()) return;

        UI.clear(confirmHost);
        var okBtn = UI.button("예, 제출합니다", {
          click: function () {
            UI.clear(confirmHost);
            doSend();
          }
        });
        confirmHost.appendChild(
          UI.alert("warn", "답안은 «한 번만» 제출할 수 있습니다. 정말 제출할까요?", [
            el("p", {
              class: "alert__fix",
              text: "제출한 뒤에는 답을 고칠 수 없습니다. 다섯 문항을 모두 다시 살펴본 뒤에 누르세요."
            }),
            el("p", {
              class: "alert__fix",
              text: "제출하면 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다."
            }),
            el("div", { class: "btnrow" }, [
              okBtn,
              UI.button("아니요, 더 확인하겠습니다", {
                class: "btn btn--ghost",
                click: function () {
                  UI.clear(confirmHost);
                }
              })
            ])
          ])
        );
        okBtn.focus();
      }
    });

    /**
     * ★ [채점하기] 는 «제출을 마친 뒤» 에만 열린다 (명세 13.1 · 15장).
     *   정답과 해설을 먼저 보고 답을 고치는 길을 막는 것이다.
     */
    var gradeBtn = UI.button("채점하기", {
      class: "btn btn--primary",
      disabled: !locked,
      title: locked ? "" : "답안을 제출하면 채점이 열립니다.",
      click: function () {
        if (state.assessment.sealed !== true) return; /* 두 겹으로 막는다 */
        app.update(function (s) {
          s.assessment.graded = true;
        });
      }
    });

    /* 문항 */
    var questions = el("div", { class: "stack" });
    Q.QUESTIONS.forEach(function (q) {
      questions.appendChild(questionCard(q, state, app));
    });

    /* 진행 점 다섯 개 */
    var dots = el("p", { class: "quiz__dots", attrs: { "aria-hidden": "true" } });
    Q.QUESTIONS.forEach(function (q) {
      dots.appendChild(
        el("span", {
          class: "quiz__dot" + (Q.isAnswered(q, state.assessment.answers[q.id]) ? " quiz__dot--on" : ""),
          text: String(q.no)
        })
      );
    });

    /* ★ 인쇄할 때는 문항·제출·단추를 감춘다(print.css 의 .noprint).
         종이에 남아야 하는 것은 ② 학습 정리뿐이다. */
    var parts = [
      el("header", { class: "section-title" }, [
        el("p", { class: "section-title__tag", text: PC.stepTag("assess") }),
        el("h2", { text: "형성평가와 학습 정리" }),
        el("p", {
          class: "para",
          text:
            "5문항 · 각 2점 · 10점 만점입니다. " +
            (PC.ASSESS || {}).passScore +
            "점 이상이면 이수입니다. 모두 답하고 제출하면 채점과 해설이 열리고, 그 뒤에 학습 정리가 나옵니다."
        })
      ]),
      sectionHead("①", "형성평가", "다섯 문항에 답하고 제출하면 채점이 열립니다."),
      studentCard(state, app, function () {}),
      UI.card(
        {
          title: "형성평가",
          eyebrow: gradedAll.answeredCount + " / " + Q.QUESTIONS.length + " 답함",
          desc: locked ? "제출을 마쳐 답안이 잠겼습니다." : "모두 답한 뒤 아래에서 제출하세요."
        },
        [dots, questions]
      )
    ];

    /* 제출 자리
       ★ 「답안은 한 번만 제출할 수 있습니다」 안내는 «단추를 누른 그때» 만 낸다
         (2026-08-25, 선생님 요청). 늘 띄워 두면 아직 아무것도 하지 않은 학생에게
         경고만 먼저 보이고, 정작 누를 때는 같은 말을 두 번 읽게 된다. */
    var submitBody = [
      locked
        ? UI.alert("ok", "제출을 마쳤습니다. " + (state.submitted ? S.formatTime(state.submitted.at) : ""))
        : null,
      endpointField ? endpointField.root : null,
      el("div", { class: "btnrow" }, [submitBtn, downloadBtn, gradeBtn]),
      confirmHost,
      messageHost
    ];

    parts.push(
      UI.card({ title: "제출", eyebrow: PC.config.isDemo() ? "데모 모드 — 이 기기에만 저장됩니다" : "" }, submitBody)
    );

    /* 채점 결과 */
    if (graded) {
      parts.push(UI.card({ title: "채점과 해설" }, [reviewCard(state)]));
    } else if (locked) {
      parts.push(UI.alert("info", "[채점하기] 를 누르면 점수와 해설이 열립니다."));
    }

    /* ★ 인쇄할 때 남아야 하는 것은 ② 학습 정리뿐이다.
         그래서 ① 쪽 전체를 «한 겹» 으로 싸서 noprint 를 붙인다 —
         칸마다 하나씩 붙이면 새 칸을 넣을 때 빠뜨린다. */
    var quizSide = el("div", { class: "stack noprint" }, parts);
    var out = [quizSide];

    /* ── ② 학습 정리 — 채점을 마친 뒤에 열린다 ── */
    if (graded) {
      out.push(
        sectionHead("②", "학습 정리", "오늘 배운 것을 한 장으로 모았습니다. 종이로 뽑아 두면 다음 차시에 도움이 됩니다.")
      );
      out.push(
        el("div", { class: "btnrow btnrow--one noprint" }, [
          UI.button("🖨 학습 정리 인쇄하기", {
            class: "btn btn--primary",
            click: function () {
              /* 인쇄 창을 띄우기만 한다. 무엇을 감출지는 print.css 가 정한다. */
              if (root.print) root.print();
              else UI.toast("이 브라우저에서는 인쇄를 열 수 없습니다.");
            }
          })
        ])
      );
      out.push(summarySection(state).root);
    } else {
      out.push(
        el("div", { class: "noprint" }, [
          UI.alert("info", "형성평가를 채점하면 «학습 정리» 가 열립니다. 종이로 인쇄해 가져갈 수 있습니다.")
        ])
      );
    }

    return el("div", { class: "stack" }, out);
  }

  /* ================================================================== */

  S.screens = {
    intro: intro,
    concept: concept,
    light: function (state, app) {
      return S.sensorScreen.build("light", state, app);
    },
    soil: function (state, app) {
      return S.sensorScreen.build("soil", state, app);
    },
    /* compare(비교·적용)는 2026-08-25 에 단계에서 뺐다.
       화면 코드는 남겨 둔다 — 되살릴 때 그대로 쓰기 위해서다.
       PC.STEPS 에 「compare」 가 없으므로 이 화면은 그려지지 않는다. */
    compare: compare,
    assess: assess
  };
})();
    </script>
    <script data-from="student/s90-app.js">
/**
 * 학생용 앱 (명세 6장)
 *
 * 하는 일
 *   · 다섯 단계 스테퍼를 그리고 «통과 조건» 에 따라 다음 단계를 연다
 *   · 화면을 다시 그린다
 *   · 바뀔 때마다 localStorage 에 저장한다 (새로고침해도 이어서 할 수 있게)
 *
 * 이전 단계로는 «언제나» 갈 수 있다. 다음 단계는 조건을 채워야 열린다(명세 6장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;

  var state = S.emptyState();

  var screenRoot = null;
  var navArea = null;
  var bannerArea = null;

  /* ------------------------------------------------------------------ */
  /* 상태 고치기                                                          */
  /* ------------------------------------------------------------------ */

  function save() {
    S.store.saveDraft(state);
  }

  /** 상태를 고치고 저장만 한다 — 글을 쓰는 중에 화면이 튀지 않게 */
  function patch(mutator) {
    mutator(state);
    save();
  }

  /** 상태를 고치고 화면을 다시 그린다 */
  function update(mutator) {
    mutator(state);
    save();
    render();
  }

  function goTo(index) {
    var steps = PC.STEPS;
    var target = Math.max(0, Math.min(steps.length - 1, index));
    if (!PC.schema.canGoTo(target, state)) {
      UI.toast(PC.MESSAGES.lockedStep);
      return;
    }
    update(function (s) {
      s.step = target;
    });
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
    UI.announce(steps[target].label + " 단계로 이동했습니다.");
  }

  var app = {
    update: update,
    patch: patch,
    goTo: goTo,
    /* 화면이 «지금» 상태를 볼 때 쓴다 — patch 로 고친 뒤 다시 그리지 않고
       표시만 손볼 때가 있다(4단계의 «마침» 딱지). */
    getState: function () {
      return state;
    },
    rerender: render,
    rerenderNav: function () {
      drawProgress();
      drawNav();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 진행 표시 (명세 18장 «단계 원·연결선·진행률»)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 상단 진행 표시 — 단계 원과 잇는 선, 그리고 진행률 (lesson3_7_1 과 같은 모양).
   *
   * 원 안의 숫자는 «몇 번째 단계» 이고, 마친 단계는 ✔ 로 바뀐다.
   * 색만으로 알리지 않도록 잠김·열림·마침을 낭독기용 글자로도 적는다.
   */
  function drawProgress() {
    var list = UI.$("#stepper-list");
    if (!list) return;

    var steps = PC.STEPS;
    var furthest = PC.schema.furthestStep(state);

    UI.clear(list);
    steps.forEach(function (step, i) {
      var done = i < furthest;
      var current = i === state.step;
      var open = i <= furthest;

      var state1 = done ? "is-done" : "";
      var state2 = current ? "is-current" : "";
      var state3 = open ? "" : "is-locked";

      var node = el("button", {
        class: "stepper__node",
        text: done ? "✔" : String(i + 1),
        attrs: {
          type: "button",
          disabled: open ? null : true,
          "aria-current": current ? "step" : null,
          "aria-label":
            i + 1 + "단계 " + step.label + " — " + (done ? "마침" : current ? "지금 단계" : open ? "열림" : "잠김")
        },
        on: {
          click: function () {
            goTo(i);
          }
        }
      });

      list.appendChild(
        el("li", { class: ["stepper__item", state1, state2, state3].filter(Boolean).join(" ") }, [
          node,
          el("span", { class: "stepper__label", attrs: { "aria-hidden": "true" }, text: step.short })
        ])
      );
    });

    /* 「3 / 6」 과 진행률 막대 */
    var current = UI.$("#progress-current");
    var total = UI.$("#progress-total");
    if (current) current.textContent = String(state.step + 1);
    if (total) total.textContent = String(steps.length);

    var percent = Math.round(((state.step + 1) / steps.length) * 100);
    var fill = UI.$("#progressbar-fill");
    var bar = UI.$("#progressbar");
    if (fill) fill.style.width = percent + "%";
    if (bar) {
      bar.setAttribute("aria-valuenow", String(percent));
      bar.setAttribute("aria-valuetext", state.step + 1 + " / " + steps.length + " 단계 · " + steps[state.step].label);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 아래쪽 이동 단추                                                     */
  /* ------------------------------------------------------------------ */

  function drawNav() {
    if (!navArea) return;
    var steps = PC.STEPS;
    var here = steps[state.step];
    var gate = PC.schema.checkStep(here.key, state);
    var last = state.step === steps.length - 1;

    var reasons = el("div", { class: "nav__reasons" });
    if (!gate.ok && !last) {
      reasons.appendChild(
        el("p", { class: "nav__reasonhead", text: "다음 단계를 열려면" })
      );
      var ul = el("ul", { class: "nav__reasonlist" });
      gate.reasons.forEach(function (r) {
        ul.appendChild(el("li", { text: r }));
      });
      reasons.appendChild(ul);
    }

    var buttons = el("div", { class: "nav__btns" }, [
      UI.button("← 이전", {
        class: "btn btn--ghost",
        disabled: state.step === 0,
        click: function () {
          goTo(state.step - 1);
        }
      }),
      last
        ? null
        : UI.button("다음 →", {
            disabled: !gate.ok,
            click: function () {
              goTo(state.step + 1);
            }
          })
    ]);

    UI.clear(navArea);
    navArea.appendChild(el("div", { class: "nav" }, [reasons, buttons]));
  }

  /* ------------------------------------------------------------------ */
  /* 알림 띠                                                              */
  /* ------------------------------------------------------------------ */

  function drawBanner() {
    if (!bannerArea) return;
    UI.clear(bannerArea);

    var pending = S.store.loadPending();
    if (pending.length > 0) {
      bannerArea.appendChild(
        UI.alert("warn", "아직 보내지 못한 제출이 " + pending.length + "건 있습니다. " + PC.stepTag("assess") + "에서 [다시 제출] 을 눌러 주세요.")
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 화면 그리기                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 글이 많은 화면은 읽기 좋은 너비로 좁히고, 회로·코드·비교표 화면은 넓게 쓴다.
   * (회로 그림과 코드 편집기, 다섯 줄 비교표는 넓을수록 편하다)
   */
  var WIDE_STEPS = { light: true, soil: true, compare: true };

  function render() {
    drawProgress();
    drawBanner();

    var step = PC.STEPS[state.step];
    var draw = S.screens[step.key];

    screenRoot.className = "screen " + (WIDE_STEPS[step.key] ? "screen--wide" : "screen--narrow");
    UI.clear(screenRoot);
    if (draw) screenRoot.appendChild(draw(state, app));

    drawNav();
  }

  /* ------------------------------------------------------------------ */
  /* 시작할 때 묻기 — 이어서 할까, 처음부터 할까                             */
  /* ------------------------------------------------------------------ */

  /**
   * 남아 있는 기록이 «물어볼 만한가».
   * 1단계에서 아무것도 하지 않고 새로 고친 것까지 묻는 것은 번거롭다.
   */
  function worthAsking(draft) {
    if (!draft) return false;
    if (draft.step > 0) return true;
    if (draft.submitted) return true;
    if (draft.student.studentId || draft.student.name) return true;
    return S.hasContent(draft);
  }

  /** 「처음부터 시작」 — 이 기기의 학습 기록을 지우고 1단계부터 다시 */
  function startOver() {
    var left = S.store.resetLearning();
    state = S.emptyState();
    render();
    UI.toast(
      left > 0
        ? "처음부터 시작합니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다."
        : "처음부터 시작합니다. 이전 기록을 지웠습니다."
    );
    UI.announce("이전 기록을 지웠습니다. 1단계부터 다시 시작합니다.");
  }

  function askResume(draft) {
    if (!worthAsking(draft)) return;
    if (!UI.askDialog) return; /* 아주 옛 브라우저 — 그냥 이어서 한다 */

    var stepNo = Math.min(PC.STEPS.length, Math.max(1, (draft.step || 0) + 1));

    UI.askDialog({
      title: "이어서 학습하시겠어요?",
      lines: [
        "이전에 " + stepNo + "단계까지 진행한 기록이 남아 있어요.",
        "처음부터 다시 시작하면 이전 기록은 지워집니다."
      ],
      okLabel: "이어서 학습하기",
      cancelLabel: "처음부터 시작",
      /* ★ Esc 로 닫으면 «이어서» 다. 실수로 기록이 사라지면 되돌릴 수 없다. */
      dismiss: "ok",
      onOk: function () {
        UI.announce(stepNo + "단계부터 이어서 학습합니다.");
      },
      onCancel: startOver
    });
  }

  /* ------------------------------------------------------------------ */
  /* 시작                                                                 */
  /* ------------------------------------------------------------------ */

  function start() {
    screenRoot = UI.$("#screen-root");
    navArea = UI.$("#nav-area");
    bannerArea = UI.$("#banner-area");
    if (!screenRoot) return;

    var draft = S.store.loadDraft();
    if (draft) state = draft;

    var saved = S.store.loadStudent();
    if (saved && !state.student.studentId) {
      state.student.studentId = saved.studentId;
      state.student.name = saved.name;
    }

    render();

    /* 남아 있는 기록이 있으면 «이어서 할지 처음부터 할지» 먼저 묻는다.
       공용 컴퓨터에서 앞 학생의 기록 위에 이어서 쓰는 일을 막는 것이 까닭이다. */
    askResume(draft);

    /* 작성 중에 실수로 창을 닫는 것을 막는다 */
    window.addEventListener("beforeunload", function (evt) {
      if (!S.hasContent(state) || state.submitted) return;
      evt.preventDefault();
      evt.returnValue = PC.MESSAGES.leaveWarn;
      return PC.MESSAGES.leaveWarn;
    });

    /* 이 기기의 흔적 지우기 — 공용 태블릿용 */
    var reset = UI.$("#reset-device");
    if (reset) {
      reset.addEventListener("click", function () {
        if (!window.confirm("이 기기에 저장된 내 학습 기록을 모두 지웁니다. 계속할까요?")) return;
        var left = S.store.clearAll();
        state = S.emptyState();
        render();
        UI.toast(left > 0 ? "지웠습니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다." : "지웠습니다.");
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  S.app = {
    getState: function () {
      return state;
    },
    _setState: function (next) {
      state = next;
    },
    render: render
  };
})();
    </script>
