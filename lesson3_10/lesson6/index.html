        );
        body.appendChild(tr);
      });

      wrap.appendChild(el("table", { class: "t-table" }, [el("thead", {}, [head]), body]));
      box.body.appendChild(wrap);

      /* 관찰문 원문 */
      var fold = el("details", { class: "t-fold" }, [
        el("summary", { class: "t-fold__sum", text: (goal === "light" ? "조도" : "수분") + " 관찰문 원문 보기" })
      ]);
      var foldBody = el("div", { class: "t-fold__body" });
      table.rows.forEach(function (r) {
        var block = el("div", { class: "t-obs" }, [
          el("p", { class: "t-obs__who", text: r.studentId + " " + r.studentName })
        ]);
        r.cells.forEach(function (cell) {
          block.appendChild(
            el("div", { class: "t-obs__row" }, [
              el("span", { class: "t-obs__cond", text: cell.label }),
              el("span", { class: "t-obs__val", text: cell.ran ? String(cell.value) : "—" }),
              el("div", { class: "t-obs__texts" }, [
                el("p", { class: "t-obs__predict" }, [
                  el("b", { text: "예상 — " }),
                  document.createTextNode(cell.predict || "(없음)")
                ]),
                el("p", { class: "t-obs__note" }, [
                  el("b", { text: "관찰 — " }),
                  document.createTextNode(cell.observation || "(없음)")
                ])
              ])
            ])
          );
        });
        foldBody.appendChild(block);
      });
      fold.appendChild(foldBody);
      box.body.appendChild(fold);
    });

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ⑥ 기준값 분포와 «근거» 가늠하기                                        */
  /* ------------------------------------------------------------------ */

  var MARK_WORD = {
    none: "정하지 않음",
    copied: "예시를 그대로 (관찰문 없음)",
    preset: "예시와 같은 값",
    reasoned: "재어 본 값 사이에 있음",
    outside: "재어 본 범위 밖",
    unknown: "판단할 자료 부족"
  };

  function thresholdPanel(rows) {
    var box = K.panel({
      title: "🎚 기준값 분포와 근거",
      hint:
        "«복사했는가, 실험에 근거해 정했는가» 를 가름할 원자료입니다. " +
        "웹앱이 판단을 내리지 않습니다 — 아래 표를 보고 선생님이 가리세요."
    });

    ["light", "soil"].forEach(function (goal) {
      var t = T.data.thresholdStats(rows, goal);
      var N = rows.length;

      box.body.appendChild(el("h4", { class: "t-subhead", text: t.label + " 기준값 (예시 " + t.preset + ")" }));

      box.body.appendChild(
        K.statRow([
          K.statCard("재어 본 값 사이", t.counts.reasoned || 0, "근거 있음", "명"),
          K.statCard("예시와 같은 값", (t.counts.copied || 0) + (t.counts.preset || 0), "확인 필요", "명"),
          K.statCard("범위 밖", t.counts.outside || 0, "물어볼 것", "명"),
          K.statCard("정하지 않음", t.counts.none || 0, "", "명")
        ])
      );

      /* 값 분포 */
      if (t.distinct.length) {
        var maxCount = Math.max.apply(
          null,
          t.distinct.map(function (d) {
            return d.count;
          })
        );
        var dist = el("div", { class: "t-dist" });
        t.distinct.forEach(function (d) {
          dist.appendChild(
            el("div", { class: "t-dist__item" }, [
              el("span", { class: "t-dist__value", text: String(d.value) }),
              el("span", {
                class: "t-dist__bar",
                attrs: { style: "width:" + Math.round((d.count / maxCount) * 100) + "%" }
              }),
              el("span", { class: "t-dist__num", text: d.count + "명" })
            ])
          );
        });
        box.body.appendChild(dist);
      }

      /* 학생별 원자료 */
      var wrap = el("div", { class: "t-tablewrap" });
      var head = el("tr", {}, [
        el("th", { text: "학번" }),
        el("th", { text: "이름" }),
        el("th", { text: "기준값" }),
        el("th", { text: "재어 본 값" }),
        el("th", { text: "관찰문" }),
        el("th", { text: "가늠" })
      ]);
      var body = el("tbody");
      t.items.forEach(function (i) {
        body.appendChild(
          el("tr", { class: i.mark === "copied" || i.mark === "outside" ? "t-tr--watch" : "" }, [
            el("td", { class: "t-td--mono", text: i.studentId }),
            el("td", { text: i.studentName }),
            el("td", { class: "t-td--mono", text: i.threshold || "—" }),
            el("td", { class: "t-td--mono", text: i.measured.length ? i.measured.join(", ") : "—" }),
            el("td", { text: i.observations + "/3" }),
            el("td", { text: MARK_WORD[i.mark] || i.mark })
          ])
        );
      });
      wrap.appendChild(el("table", { class: "t-table" }, [el("thead", {}, [head]), body]));
      box.body.appendChild(wrap);
      void N;
    });

    /* 가늠하는 잣대 (명세 17장 THRESHOLD_HINTS) */
    var hints = el("ul", { class: "t-hints" });
    NOTES.THRESHOLD_HINTS.forEach(function (h) {
      hints.appendChild(
        el("li", { class: "t-hints__item" }, [
          el("b", { class: "t-hints__title", text: h.title }),
          el("span", { class: "t-hints__detail", text: h.detail })
        ])
      );
    });
    box.body.appendChild(el("p", { class: "t-subhead", text: "가늠하는 잣대" }));
    box.body.appendChild(hints);

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* ⑦ 적용 설계와 보정 방법 (명세 12장 · 21장)                              */
  /* ------------------------------------------------------------------ */

  function applicationPanel(rows) {
    var box = K.panel({
      title: "🧭 적용 설계와 보정 방법",
      hint: "«보정 방법» 을 적었는지가 이 차시의 마지막 성취입니다(명세 21장)."
    });

    var withCalibration = rows.filter(function (r) {
      return String(r.application.calibration || "").replace(/\s+/g, "").length >= 10;
    }).length;

    box.body.appendChild(
      K.statRow([
        K.statCard("설계 작성", rows.filter(function (r) {
          return String(r.application.design || "").replace(/\s+/g, "").length >= 15;
        }).length, "", "명"),
        K.statCard("보정 방법 작성", withCalibration, K.percent(withCalibration, rows.length) + "%", "명")
      ])
    );

    rows.forEach(function (r) {
      box.body.appendChild(
        el("details", { class: "t-fold" }, [
          el("summary", { class: "t-fold__sum", text: r.studentId + " " + r.studentName }),
          el("div", { class: "t-fold__body" }, [
            el("p", { class: "t-field" }, [el("b", { text: "센서와 핀 — " }), document.createTextNode(r.application.sensors || "(없음)")]),
            el("p", { class: "t-field" }, [el("b", { text: "밝음/어두움 기준 — " }), document.createTextNode(r.application.lightRule || "(없음)")]),
            el("p", { class: "t-field" }, [el("b", { text: "건조/습함 기준 — " }), document.createTextNode(r.application.soilRule || "(없음)")]),
            el("p", { class: "t-field" }, [el("b", { text: "출력 조건 — " })]),
            K.longText(r.application.design),
            el("p", { class: "t-field" }, [el("b", { text: "보정 방법 — " })]),
            K.longText(r.application.calibration)
          ])
        ])
      );
    });

    return box.root;
  }

  /* ------------------------------------------------------------------ */

  function analysisView(ctx) {
    var rows = ctx.rows();
    if (rows.length === 0) {
      var box = K.panel({ title: "📌 가장 많이 틀린 문제" });
      box.body.appendChild(K.empty("먼저 1장에서 제출을 불러오세요."));
      return box.root;
    }

    /* ★ 2026-08-25 — 선생님 요청으로 3장을 앞 차시(lesson3_10_5)의 3장과 같게
         「가장 많이 틀린 문제」 + 「전체 명단 · 정오표」 두 가지로 두었다.
         아래 판들(문항 분석 · 회로 · 코드 · 실험 · 기준값 · 적용)은 그리지 않는다.
         함수는 그대로 남겨 둔다 — 되살릴 때 이 배열에 한 줄만 넣으면 된다
         (학생용 s60-screens.js 의 compare 를 남겨 둔 것과 같은 까닭이다). */
    var sheet = K.panel({
      title: "🧾 전체 명단 · 정오표",
      hint: "명단을 올리면 명단 순서대로, 미제출까지 한 표에서 봅니다."
    });
    sheet.body.appendChild(T.list.rosterPanel(ctx));
    sheet.body.appendChild(T.list.fullSheet(ctx));

    return el("div", { class: "t-stack" }, [wrongPanel(rows), sheet.root]);
  }

  T.analysis = {
    analysisView: analysisView,
    MARK_WORD: MARK_WORD,
    topWrong: topWrong,
    WRONG_LIMIT: WRONG_LIMIT
  };
})();
    </script>
    <script data-from="teacher/t45-list.js">
/**
 * 교사용 3장의 «명단·정오표» 와 4장 «정답·지도»
 *
 *   3장 (t35-analysis.js 가 불러 쓴다)
 *     · rosterPanel  XLSX/CSV 명단 올리기
 *     · fullSheet    학번·이름·점수·1~5번·회로·코드 표 (미제출까지) · CSV · 인쇄
 *
 *   4장
 *     · guideView    회로 정답 · 기준 코드 · 형성평가 정답과 해설 · 오개념 ·
 *                    최저수준 보장지도 · 수업 흐름 · 보는 잣대 (명세 17장)
 *
 * ★ 4장의 내용은 모두 shared/teacher-notes.js 에서 온다.
 *   학생용은 그 파일을 읽지 않는다 — build.mjs 가 그것을 검사한다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  var K = T.core;
  var el = K.el;
  var NOTES = PC.TEACHER_NOTES;

  /* ------------------------------------------------------------------ */
  /* 전체 명단 · 정오표 (3장)                                              */
  /*                                                                    */
  /* ★ 짜임새와 모양을 lesson3_10_5 의 정오표와 «같게» 맞추었다.            */
  /*   숫자 칸 → (명단이 없으면 안내) → 표 → 보기 설명 → 인쇄·CSV.          */
  /*                                                                    */
  /* ★ 4장의 markSheet 와 다른 표다.                                      */
  /*   이 표는 «형성평가» 를 보는 표라 학번·이름·점수·1~5번·회로·코드 뿐이고,  */
  /*   명단을 올리면 «미제출» 줄까지 한 표에 넣는다.                         */
  /*   4장의 표는 이수·조도/수분 네 칸·실험·제출 시각까지 보는 «수행» 표다.    */
  /* ------------------------------------------------------------------ */

  var MARK = { o: "O", x: "✕", none: "-" };
  var MARK_CLASS = { o: "is-o", x: "is-x", none: "is-none" };
  var MARK_LABEL = { o: "정답", x: "오답", none: "무응답" };

  /** 한 학생의 문항별 정오 — 답을 적지 않은 것과 틀린 것을 가른다 */
  function marksOf(row) {
    var out = {};
    PC.quiz.QUESTIONS.forEach(function (q, i) {
      var given = (row.assessment.answers || [])[i];
      var blank = given === null || given === undefined || String(given).trim() === "";
      out[q.id] = row.assessment.isCorrect[i] === true ? "o" : blank ? "none" : "x";
    });
    return out;
  }

  /**
   * 표에 실을 줄들을 만든다.
   *   명단이 있으면 «명단 순서» 로 놓고, 제출이 없는 학생은 미제출 줄이 된다.
   *   명단에 없는 학번으로 낸 학생은 뒤에 붙인다 — 학번을 잘못 넣은 것이 대개다.
   */
  function sheetRows(rows, roster) {
    var byId = {};
    rows.forEach(function (r) {
      byId[T.roster.normalizeId(r.studentId)] = r;
    });

    if (!roster.length) {
      return rows
        .slice()
        .sort(function (a, b) {
          return String(a.studentId).localeCompare(String(b.studentId));
        })
        .map(function (r) {
          return { studentId: r.studentId, name: r.studentName, data: r, inRoster: false };
        });
    }

    var seen = {};
    var out = roster.map(function (s) {
      var key = T.roster.normalizeId(s.id);
      seen[key] = true;
      return { studentId: s.id, name: s.name, data: byId[key] || null, inRoster: true };
    });

    rows.forEach(function (r) {
      if (!seen[T.roster.normalizeId(r.studentId)]) {
        out.push({ studentId: r.studentId, name: r.studentName, data: r, inRoster: false });
      }
    });
    return out;
  }

  function fullSheet(ctx) {
    var rows = ctx.rows();
    var roster = ctx.getRoster();

    var box = K.panel({
      title: "📋 전체 명단 · 정오표",
      hint: "제출한 학생은 점수와 문항별 정오(O · ✕)를, 제출하지 않은 학생은 「미제출」 로 표시해요."
    });

    if (!rows.length) {
      box.body.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box.root;
    }

    var list = sheetRows(rows, roster);
    var inRoster = roster.length
      ? list.filter(function (r) {
          return r.inRoster;
        })
      : list;
    var submitted = inRoster.filter(function (r) {
      return r.data;
    }).length;
    var missing = inRoster.length - submitted;
    var extra = roster.length ? list.length - inRoster.length : 0;

    var cards = [
      K.statCard(roster.length ? "명단 인원" : "제출 학생", roster.length || rows.length, "", "명"),
      K.statCard("제출", submitted, "", "명"),
      K.statCard("미제출", missing, "", "명")
    ];
    if (extra) cards.push(K.statCard("명단 밖 제출", extra, "", "명"));
    box.body.appendChild(K.statRow(cards));

    if (!roster.length) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint no-print",
          text: "학생 명단을 올리면 명단 순서대로, 명단에 있는 학생이 빠짐없이 표시돼요."
        })
      );
    }
    if (extra) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint",
          text: "명단에 없는 학번으로 낸 학생이 " + extra + "명 있어요. 표 아래쪽에 함께 두었습니다."
        })
      );
    }

    /* ── 표 ── */

    var head = el("tr", {}, [
      el("th", { attrs: { scope: "col" }, text: "학번" }),
      el("th", { attrs: { scope: "col" }, text: "이름" }),
      el("th", { attrs: { scope: "col" }, text: "점수" })
    ]
      .concat(
        PC.quiz.QUESTIONS.map(function (q) {
          return el("th", { attrs: { scope: "col", title: q.stem }, text: q.no + "번" });
        })
      )
      .concat([
        el("th", { attrs: { scope: "col" }, text: "회로" }),
        el("th", { attrs: { scope: "col" }, text: "코드" })
      ]));

    var body = list.map(function (row) {
      if (!row.data) {
        return el("tr", { class: "is-missing" }, [
          el("td", { text: row.studentId || "-" }),
          el("td", { text: row.name || "-" }),
          el("td", {
            class: "t-missing",
            text: "미제출",
            attrs: { colspan: String(3 + PC.quiz.QUESTIONS.length) }
          })
        ]);
      }

      var d = row.data;
      var marks = marksOf(d);

      /* 이 차시는 센서가 둘이다 — 회로도 코드도 «둘을 합쳐» 센다 */
      var circuitDone = (d.light.circuit.completed ? 1 : 0) + (d.soil.circuit.completed ? 1 : 0);
      var codePassed = T.data.passTotal(d);
      var codeTotal = (d.light.code.testsTotal || 0) + (d.soil.code.testsTotal || 0);

      return el("tr", {}, [
        el("td", { text: row.studentId || "-" }),
        el("td", { text: row.name || "-" }),
        el("td", { class: "t-score", text: d.assessment.score + "점" })
      ]
        .concat(
          PC.quiz.QUESTIONS.map(function (q) {
            var mark = marks[q.id] || "none";
            return el("td", {
              class: "t-mark " + MARK_CLASS[mark],
              text: MARK[mark],
              attrs: { "aria-label": q.no + "번 " + MARK_LABEL[mark] }
            });
          })
        )
        .concat([
          el("td", {
            class: "t-mark " + (circuitDone === 2 ? "is-o" : circuitDone ? "is-none" : "is-x"),
            text: circuitDone + "/2",
            attrs: { "aria-label": "회로 " + circuitDone + "개 통과" }
          }),
          el("td", {
            class: "t-mark " + (codeTotal && codePassed >= codeTotal ? "is-o" : "is-x"),
            text: codePassed + "/" + codeTotal
          })
        ]));
    });

    box.body.appendChild(
      el("div", { class: "t-table-wrap" }, [
        el("table", { class: "t-list-table" }, [el("thead", {}, [head]), el("tbody", {}, body)])
      ])
    );
    box.body.appendChild(
      el("p", {
        class: "panel__hint",
        text: "O 정답 · ✕ 오답 · - 무응답 · 회로 칸은 통과한 회로 수, 코드 칸은 통과한 검사 수입니다."
      })
    );

    /* ── 인쇄 · 내려받기 ── */

    box.body.appendChild(
      K.btnRow([
        el("button", {
          class: "btn btn--primary",
          text: "🖨 이 표 인쇄하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              if (root.print) root.print();
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost",
          text: "CSV 로 내려받기",
          attrs: { type: "button" },
          on: {
            click: function () {
              if (T.csv.download(rows)) K.toast("CSV 를 내려받았습니다.");
              else K.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
            }
          }
        })
      ])
    );
    box.body.appendChild(
      el("p", {
        class: "panel__hint no-print",
        text:
          "출력 날짜는 첫 장 위쪽에 한 번만 찍혀요. 인쇄 창에서 「머리글/바닥글」 을 끄면 " +
          "브라우저가 장마다 넣는 날짜·주소가 사라집니다."
      })
    );

    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* 학급 명단 올리기                                                     */
  /*                                                                    */
  /* ★ 2026-08-25 에 1장에서 이 장으로 옮겼다. 1장을 앞 차시와 같은 모양      */
  /*   («자료 불러오기» 판 하나)으로 두기 위해서다. 명단을 «쓰는» 곳이         */
  /*   바로 이 장이므로, 앞 차시(lesson3_10_5)도 명단 칸을 이 장에 둔다.      */
  /* ------------------------------------------------------------------ */

  function rosterPanel(ctx) {
    var box = K.panel({
      title: "📎 학생 명단 올리기",
      hint: "엑셀(.xlsx) 또는 CSV 를 올리면 제출하지 않은 학생까지 함께 표시돼요.",
      className: "t-roster-src no-print"
    });

    var status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });

    function say(kind, message) {
      status.className = "t-status" + (kind ? " is-" + kind : "");
      status.textContent = message;
    }

    var fileInput = el("input", {
      class: "sr-only",
      id: "t-roster-file",
      attrs: { type: "file", accept: ".xlsx,.csv,.tsv,.txt", "aria-label": "학생 명단 파일 고르기" }
    });

    function load(file) {
      if (!file) return;
      say("loading", "명단을 읽고 있어요…");

      /* ★ T.roster.parseFile 은 실패하면 «reject» 한다 (ok:false 를 돌려주지 않는다).
         그래서 두 번째 함수를 반드시 준다 — 주지 않으면 잘못된 파일에서 조용해진다. */
      T.roster.parseFile(file).then(
        function (out) {
          ctx.setRoster(out.students);
          K.announce("명단 " + out.students.length + "명을 읽었습니다.");
          if ((out.warnings || []).length) K.toast("건너뛴 줄 " + out.warnings.length + "개");
          /* 이 장을 다시 그린다 — 아래 «미제출» 칸이 새 명단으로 채워진다 */
          ctx.refresh();
        },
        function (err) {
          say("error", (err && err.message) || "명단을 읽지 못했어요.");
        }
      );
    }

    fileInput.addEventListener("change", function () {
      load(fileInput.files && fileInput.files[0]);
      fileInput.value = "";
    });

    var pick = el("button", {
      class: "btn btn--primary",
      text: "명단 파일 선택",
      attrs: { type: "button" },
      on: {
        click: function () {
          fileInput.click();
        }
      }
    });

    var clearBtn = el("button", {
      class: "btn btn--ghost",
      text: "명단 지우기",
      attrs: { type: "button" },
      on: {
        click: function () {
          ctx.setRoster([]);
          ctx.refresh();
        }
      }
    });
    clearBtn.hidden = ctx.getRoster().length === 0;

    /* 처음 상태는 «지금 명단이 있는가» 로만 정한다 — 이 장은 다시 그려질 수 있다 */
    if (ctx.getRoster().length) {
      say("ok", "명단 " + ctx.getRoster().length + "명과 제출 답안을 맞춰 아래 «미제출» 을 냈어요.");
    } else {
      say("", "명단을 올리면 미제출 학생까지 확인할 수 있어요.");
    }

    var drop = el("div", {
      class: "t-drop",
      text: "또는 명단 파일을 이곳에 끌어다 놓으세요. (.xlsx · .csv)"
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      load((e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) || null);
    });

    box.body.appendChild(el("div", { class: "t-source__row" }, [pick, clearBtn, fileInput]));
    box.body.appendChild(status);
    box.body.appendChild(drop);
    return box.root;
  }

  /* ------------------------------------------------------------------ */
  /* 4장 — 정답 · 지도                                                    */
  /*                                                                    */
  /* ★ 2026-08-25 에 4장을 «정답·지도» 로 다시 만들었다(선생님 요청).        */
  /*   앞 차시(lesson3_10_5)의 마지막 장과 같은 짜임새다 —                  */
  /*   경고 띠 → 회로 정답 → 기준 코드 → 형성평가 정답과 해설 →              */
  /*   오개념 → 최저수준 보장지도 → 수업 흐름 → 보는 잣대.                   */
  /*                                                                    */
  /* ★ 정오표·미제출은 3장이 낸다. 두 장에 같은 표를 두지 않는다.             */
  /* ★ 여기 나오는 내용은 모두 shared/teacher-notes.js 에서 온다.            */
  /*   학생용은 그 파일을 읽지 않는다 (build.mjs 가 검사한다).               */
  /* ------------------------------------------------------------------ */

  var CIRCLED_ANS = ["①", "②", "③", "④", "⑤", "⑥"];

  /** 제목이 붙은 한 덩어리 */
  function section(title, children) {
    return el("section", { class: "t-block" }, [el("h4", { class: "t-subhead", text: title })].concat(
      children || []
    ));
  }

  /** 회로 정답 한 갈래 — 한 줄 요약 · 잇는 차례 · 허용 범위 · 자주 나오는 오결선 */
  function circuitAnswer(goal) {
    var answer = NOTES.CIRCUIT_ANSWERS[goal];
    var out = [];

    /* 한 줄 요약은 «판정에 쓰는 정답 케이블» 에서 만든다 —
       손으로 또 적으면 회로를 고칠 때 한쪽만 바뀐다. */
    out.push(
      el("p", {
        class: "t-answerline",
        text: PC.circuit
          .answerWires(goal)
          .map(function (w) {
            return w.label;
          })
          .join(",  ")
      })
    );

    /* 잇는 차례와 «왜» — 회로 판정이 요구하는 것을 그대로 읽는다 */
    out.push(
      el(
        "ol",
        { class: "guide__steps" },
        (PC.circuit.REQUIRED[goal] || []).map(function (item) {
          return el("li", {}, [el("b", { text: item.label }), el("span", { text: " — " + item.why })]);
        })
      )
    );

    out.push(el("p", { class: "t-note", text: answer.allow }));

    /* 통과로 봐 주는 것들 (명세 10.1 · 17.1) */
    out.push(
      el(
        "ul",
        { class: "guide__errors" },
        PC.circuit.answerNotes(goal).map(function (line) {
          return el("li", { text: line });
        })
      )
    );

    out.push(el("h4", { class: "guide__sub", text: "자주 나오는 오결선" }));
    out.push(
      el(
        "ul",
        { class: "guide__errors" },
        (answer.commonErrors || []).map(function (e) {
          return el("li", {}, [el("b", { text: e.pattern + " — " }), el("span", { text: e.why })]);
        })
      )
    );

    return section(answer.label + " 정답", out);
  }

  /** 형성평가 한 문항 */
  function answerCard(q) {
    var note = NOTES.byId(q.id);
    if (!note) return null;

    /* ★ teacher-notes 의 answerText 는 이미 «③ 무엇무엇» 처럼 번호를 달고 있다.
       번호를 또 붙이면 «③ ③ 무엇무엇» 이 된다 — 달려 있으면 그대로 쓴다.
       (정답 글을 여기에 적지 않는다 — 정답은 teacher-notes.js 한 곳에만 둔다.) */
    var text = String(note.answerText || "");
    var numbered = CIRCLED_ANS.indexOf(text.slice(0, 1)) !== -1;
    var answerLine =
      q.type === "choice" && !numbered
        ? (CIRCLED_ANS[note.answerIndex] || note.answerIndex + 1 + "번") + " " + text
        : text;

    return el("div", { class: "guide__q" }, [
      el("p", { class: "guide__qhead", text: q.no + "번 · " + q.tag + " · " + q.points + "점" }),
      el("p", { class: "t-q__stem", text: q.stem }),
      q.code ? K.codeBox(q.code) : null,
      q.template ? K.codeBox(q.template) : null,

      q.type === "choice"
        ? el(
            "ol",
            { class: "guide__choices" },
            q.choices.map(function (c, i) {
              return el("li", { class: i === note.answerIndex ? "guide__choice--answer" : "" }, [
                el("span", { text: c }),
                i === note.answerIndex ? el("span", { class: "guide__mark", text: " ← 정답" }) : null
              ]);
            })
          )
        : K.codeBox(answerLine),

      el("p", { class: "t-answerline", text: "정답 : " + answerLine.replace(/\n/g, "  ⏎  ") }),
      el("p", { class: "guide__why", text: note.explanation || "" }),
      note.commonWrong
        ? el("p", { class: "guide__teach" }, [
            el("b", { text: "흔한 오답과 지도 — " }),
            el("span", { text: note.commonWrong })
          ])
        : null,

      /* 5번은 «한 줄에 1점» 이라 채점 규칙을 함께 적어 둔다 (명세 13장) */
      q.type !== "choice"
        ? el("p", {
            class: "t-note",
            text:
              "채점 규칙 — 줄바꿈·들여쓰기·낱말 사이 공백·주석은 봐주고, 함수 이름의 대소문자와 " +
              PC.PINS.soil +
              "(" +
              PC.PINS.cds +
              " 는 오답) · 두 줄의 순서 · 괄호와 세미콜론은 지켜야 합니다. " +
              "변수 이름은 soilMoisture · Soil_moisture · soilValue · val 을 모두 인정하지만 " +
              "두 줄에서 서로 다르면 «두 줄을 함께 보면 컴파일되지 않습니다» 로 1점을 뺍니다. " +
              "한 줄만 맞으면 1점입니다."
          })
        : null
    ]);
  }

  function guideView(ctx) {
    var box = K.panel({
      title: "🔑 정답 · 지도",
      hint: "이 장에는 정답이 그대로 적혀 있습니다. 학생에게 보이지 않도록 주의하세요."
    });

    box.body.appendChild(
      el("div", { class: "alert alert--warn" }, [
        el("span", { class: "alert__icon", attrs: { "aria-hidden": "true" }, text: "⚠" }),
        el("div", { class: "alert__body" }, [
          el("p", { text: "이 장에는 정답이 그대로 적혀 있습니다. 화면을 학생에게 보이지 않도록 주의하세요." })
        ])
      ])
    );

    /* ── 회로 정답 (명세 17.1) ── */
    box.body.appendChild(circuitAnswer("light"));
    box.body.appendChild(circuitAnswer("soil"));

    /* 원자료의 D2/D3 어긋남 안내 (명세 5장 마지막 두 줄) */
    box.body.appendChild(
      section(NOTES.PIN_MEMO.title, [
        el("p", { text: NOTES.PIN_MEMO.body }),
        el("p", { class: "guide__teach" }, [
          el("b", { text: "지도 — " }),
          el("span", { text: NOTES.PIN_MEMO.guide })
        ])
      ])
    );

    /* ── 기준 코드 ── */
    box.body.appendChild(
      section("기준 코드 — 조도센서", [
        K.codeBox(PC.arduino.REFERENCE_CODE.light),
        el("p", {
          class: "t-note",
          text:
            "값이 " +
            PC.LIGHT_THRESHOLD +
            " 보다 크면 «어두움» 이므로 LED 를 켠다. 이 회로 모델에서는 어두울수록 값이 크다 — " +
            "전압 분배 회로의 배치에 따라 방향이 반대가 될 수 있음을 학생에게 함께 알린다."
        })
      ])
    );
    box.body.appendChild(
      section("기준 코드 — 토양수분센서", [
        K.codeBox(PC.arduino.REFERENCE_CODE.soil),
        el("p", {
          class: "t-note",
          text:
            "값이 " +
            PC.SOIL_DRY_THRESHOLD +
            " 보다 크면 «건조» 다. 이 숫자는 저항값(Ω)이 아니라 0~" +
            PC.ADC_MAX +
            " 아날로그값이다(명세 17.2)."
        })
      ])
    );
    box.body.appendChild(
      section("선택 확장 — 물을 주세요", [K.codeBox(PC.arduino.REFERENCE_CODE.soilExt)])
    );

    /* ── 형성평가 정답과 해설 (명세 13장) ── */
    box.body.appendChild(
      section(
        "형성평가 정답과 해설",
        PC.quiz.QUESTIONS.map(answerCard).filter(Boolean)
      )
    );

    /* ── 반드시 지도할 오개념 (명세 17.2) ── */
    box.body.appendChild(
      section(
        "반드시 지도할 오개념",
        NOTES.MISCONCEPTIONS.map(function (m) {
          return el("div", { class: "guide__miscon" }, [
            el("p", {}, [el("b", { text: "학생 생각 : " }), el("span", { text: m.wrong })]),
            el("p", {}, [el("b", { text: "바른 개념 : " }), el("span", { text: m.right })]),
            el("p", { class: "guide__teach" }, [
              el("b", { text: "이렇게 지도합니다 : " }),
              el("span", { text: m.how })
            ])
          ]);
        })
      )
    );

    /* ── 최저수준 보장지도 (명세 17.3) ── */
    box.body.appendChild(
      section(
        "최저수준 보장지도",
        [
          el(
            "ul",
            { class: "t-support" },
            NOTES.SUPPORT.map(function (s) {
              return el("li", { class: "t-support__item" }, [
                el("b", { class: "t-support__when", text: s.when }),
                el("span", { class: "t-support__how", text: s.how })
              ]);
            })
          )
        ]
      )
    );

    /* ── 수업 흐름과 권장 시간 ── */
    box.body.appendChild(
      section("수업 흐름", [
        el(
          "ol",
          { class: "t-timeline" },
          NOTES.TIMELINE.map(function (t) {
            return el("li", { class: "t-timeline__item" }, [
              el("span", { class: "t-timeline__at", text: t.at }),
              el("span", { class: "t-timeline__what", text: t.what })
            ]);
          })
        ),
        el("div", { class: "t-table-wrap" }, [
          el("table", { class: "t-list-table" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { attrs: { scope: "col" }, text: "단계" }),
                el("th", { attrs: { scope: "col" }, text: "권장 시간" })
              ])
            ]),
            el(
              "tbody",
              {},
              PC.STEPS.map(function (s, i) {
                return el("tr", {}, [
                  el("td", { text: i + 1 + ". " + s.label }),
                  el("td", { text: s.minutes + "분" })
                ]);
              })
            )
          ])
        ])
      ])
    );

    /* ── 무엇을 보고 가리는가 (명세 16.1 · 16.2) ── */
    box.body.appendChild(
      section("기준값을 가늠하는 잣대", [
        el(
          "ul",
          { class: "guide__errors" },
          NOTES.THRESHOLD_HINTS.map(function (hint) {
            return el("li", {}, [
              el("b", { text: hint.title + " — " }),
              el("span", { text: hint.detail })
            ]);
          })
        )
      ])
    );
    box.body.appendChild(
      section("상위 3명을 가리는 순서", [
        el(
          "ol",
          { class: "guide__steps" },
          NOTES.TOP_RULES.map(function (r) {
            return el("li", { text: r });
          })
        )
      ])
    );
    box.body.appendChild(
      section("반드시 볼 것", [
        el(
          "ul",
          { class: "guide__errors" },
          NOTES.MUST_ANALYZE.map(function (r) {
            return el("li", { text: r });
          })
        )
      ])
    );

    return box.root;
  }

  T.list = {
    /* 4장 — 정답·지도 */
    guideView: guideView,
    /* 3장 — 명단 올리기와 «형성평가» 정오표 */
    rosterPanel: rosterPanel,
    fullSheet: fullSheet,
    sheetRows: sheetRows,
    marksOf: marksOf
  };
})();
    </script>
    <script data-from="teacher/t60-csv.js">
/**
 * CSV 내려받기 (명세 16장 4장 «CSV·인쇄»)
 *
 * 엑셀이 한글을 깨뜨리지 않도록 맨 앞에 BOM 을 붙인다(명세 20.3 «CSV BOM»).
 * 쉼표·따옴표·줄바꿈이 든 칸은 따옴표로 감싸고 안쪽 따옴표는 두 번 적는다.
 *
 * 이 차시는 센서가 «둘» 이므로 칸이 두 벌 나온다 — 조도 · 수분.
 * 열 이름은 사람이 읽어 뜻이 통하게 한글로 적는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function cell(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /** 센서 한 갈래의 열 이름 */
  function partHeaders(prefix) {
    return [
      prefix + "회로완료",
      prefix + "회로시도",
      prefix + "회로오류",
      prefix + "힌트",
      prefix + "코드통과",
      prefix + "코드검사",
      prefix + "코드시도",
      prefix + "핀불일치",
      prefix + "기준값",
      prefix + "조건1값",
      prefix + "조건2값",
      prefix + "조건3값",
      prefix + "관찰작성수"
    ];
  }

  /** 센서 한 갈래의 값 */
  function partCells(part) {
    var exps = part.experiments || [];
    return [
      part.circuit.completed ? "O" : "X",
      part.circuit.attempts,
      (part.circuit.errors || []).join(" / "),
      part.circuit.hintsUsed,
      part.code.passed ? "O" : "X",
      part.code.testsPassed + "/" + part.code.testsTotal,
      part.code.attempts,
      (part.code.pinMismatch || []).join(" / "),
      part.threshold || "",
      exps[0] && exps[0].ran ? exps[0].value : "",
      exps[1] && exps[1].ran ? exps[1].value : "",
      exps[2] && exps[2].ran ? exps[2].value : "",
      T.data.observationCount(part)
    ];
  }

  function toRows(list) {
    var questions = PC.quiz.QUESTIONS;

    var header = ["학번", "학년", "반", "번호", "이름", "제출시각", "점수", "총점", "이수"]
      .concat(
        questions.map(function (q) {
          return q.no + "번";
        })
      )
      .concat(partHeaders("조도_"))
      .concat(partHeaders("수분_"))
      .concat([
        "확장활동",
        "확장통과",
        "개념확인",
        "비교표작성",
        "설계",
        "보정방법",
        "5번주관식"
      ]);

    var rows = [header];

    (list || []).forEach(function (r) {
      var parsed = PC.schema.parseStudentId(r.studentId);
      var answers = r.assessment.answers || [];

      var line = [
        r.studentId,
        parsed.detailed ? parsed.grade : "",
        parsed.detailed ? parsed.classNo : "",
        parsed.detailed ? parsed.number : "",
        r.studentName,
        T.core.fmtTime(r.serverUpdatedAt || r.submittedAt, true),
        r.assessment.score,
        r.assessment.total,
        r.assessment.pass ? "이수" : "미이수"
      ];

      /* 문항별 O/X — 객관식은 «고른 번호» 를 함께 적는다 */
      questions.forEach(function (q, i) {
        var right = r.assessment.isCorrect[i] === true;
        var value = answers[i];
        if (q.type === "choice") {
          var picked = value === null || value === undefined || value === "" ? "-" : Number(value) + 1;
          line.push((right ? "O" : "X") + "(" + picked + ")");
        } else {
          line.push(right ? "O" : "X");
        }
      });

      line = line.concat(partCells(r.light)).concat(partCells(r.soil));

      /* 개념 확인 세 문항 */
      var checks = r.concept.checks || {};
      var conceptPassed = Object.keys(checks).filter(function (k) {
        return checks[k] === true;
      }).length;

      /* 비교표 — 채운 칸 수 */
      var table = r.comparison || {};
      var filled = Object.keys(table).filter(function (k) {
        return String(table[k] || "").replace(/\s+/g, "").length >= 2;
      }).length;

      line.push(r.soil.extension.tried ? "O" : "X");
      line.push(r.soil.extension.testsPassed || 0);
      line.push(conceptPassed + "/3");
      line.push(filled + "/10");
      line.push(r.application.design);
      line.push(r.application.calibration);
      line.push(String(answers[questions.length - 1] || ""));

      rows.push(line);
    });

    return rows;
  }

  function toText(list) {
    return toRows(list)
      .map(function (row) {
        return row.map(cell).join(",");
      })
      .join("\r\n");
  }

  function fileName() {
    var d = new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      "센서1차시_제출현황_" +
      d.getFullYear() +
      two(d.getMonth() + 1) +
      two(d.getDate()) +
      "_" +
      two(d.getHours()) +
      two(d.getMinutes()) +
      ".csv"
    );
  }

  function download(list) {
    if (typeof document === "undefined") return false;
    /* ★ BOM — 엑셀이 UTF-8 을 알아보게 한다 */
    var body = "﻿" + toText(list);
    try {
      var blob = new Blob([body], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  T.csv = {
    cell: cell,
    toRows: toRows,
    toText: toText,
    fileName: fileName,
    download: download,
    partHeaders: partHeaders
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.csv;
})();
    </script>
    <script data-from="teacher/t90-main.js">
/**
 * 교사용 화면 껍데기 (명세 16장 «한 번에 한 장만 표시하는 4장 구조»)
 *
 * ★ 짜임새와 모양을 lesson3_10_5 의 교사용 화면과 «같게» 맞추었다.
 *
 *   t-header    머리말 — 딱지 + 큰 제목 + 한 줄 설명
 *   t-printdate 인쇄물 맨 위에만 찍히는 날짜 (화면에서는 보이지 않는다)
 *   t-steps     위에 붙어 있는 «장» 이동 단추 — 번호 동그라미 + 이름
 *   t-page      네 장이 모두 문서에 있고, 한 장만 is-active 로 보인다
 *   t-pager     아래 [← 이전] · 「n / N장 · 이름」 · [다음 →] / [마침]
 *
 * ★ 앞판은 «t-chapters · t-footnav» 라는 «이 차시만의» 이름을 써서(teacher6.css)
 *   앞 차시와 모양이 달랐다 — 번호 동그라미가 없고, 인쇄 날짜도 없고,
 *   마지막 장의 「마침」 도 없고, 자료를 불러오기 전에 잠기지도 않았다.
 *   이제 teacher.css 가 이미 갖고 있는 이름(t-header · t-steps · t-page · t-pager)을 쓴다.
 *
 * ★ 장을 열 때 그 장의 내용을 만든다 — 미리 다 그려 두면 자료가 바뀔 때 어긋난다.
 * ★ 학생용 화면 코드를 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.
 * ★ 받은 자료는 메모리에만 둔다. 창을 닫으면 사라진다(명세 18장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  var CHAPTERS = [
    { key: "load", label: "결과 불러오기", short: "불러오기" },
    { key: "summary", label: "요약·상위 3명", short: "요약" },
    { key: "analysis", label: "형성평가 · 정오표", short: "평가" },
    { key: "guide", label: "정답 · 지도", short: "정답" }
  ];

  var at = 0;
  var endpoint = "";
  var roster = [];
  var expected = 0;

  /**
   * 예상 인원 — 제출률을 내는 데 쓴다(명세 16장 2장).
   *
   * ★ 학생 자료는 «메모리에만» 두지만, 예상 인원은 학생 자료가 아니라
   *   «선생님이 넣는 반 인원» 이다. 그래서 이 기기에 기억해 둔다.
   *   앞 차시(lesson3_10_5)와 같은 규칙이고, 2장의 안내에도 그렇게 적혀 있다.
   */
  var EXPECTED_KEY = "sensor1-teacher-expected";

  function loadExpected() {
    try {
      return Number(root.localStorage.getItem(EXPECTED_KEY)) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveExpected(value) {
    try {
      root.localStorage.setItem(EXPECTED_KEY, String(value || 0));
    } catch (e) {
      /* 저장이 막혀 있어도 화면은 그대로 쓸 수 있다 */
    }
  }

  var mainNode = null;
  var refs = {};
  var pageNodes = [];

  /* 화면들이 함께 쓰는 «지금 상태» */
  var ctx = {
    rows: function () {
      return T.data.all();
    },
    getEndpoint: function () {
      return endpoint;
    },
    setEndpoint: function (url) {
      endpoint = String(url || "").trim();
    },
    getRoster: function () {
      return roster.slice();
    },
    setRoster: function (list) {
      roster = Array.isArray(list) ? list.slice() : [];
    },
    getExpected: function () {
      /* 명단을 읽었으면 그것이 «참여한 학생 수» 의 기본값이다 */
      return expected || roster.length;
    },
    setExpected: function (n) {
      expected = Math.max(0, Math.min(200, Number(n) || 0));
      saveExpected(expected);
    },
    goTo: function (index) {
      go(index);
    },
    refresh: function () {
      redrawCurrent();
      updateHeader();
      updateSteps();
      updatePager();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 자료가 들어왔는가                                                    */
  /* ------------------------------------------------------------------ */

  /** «불러왔다» 는 깃발을 따로 두지 않는다 — 깃발과 실제 자료가 어긋날 수 있다. */
  function hasData() {
    return ctx.rows().length > 0;
  }

  /* ------------------------------------------------------------------ */
  /* 머리말 · 인쇄 날짜                                                   */
  /* ------------------------------------------------------------------ */

  function buildHeader(host) {
    refs.meta = el("p", { class: "t-head__meta" });
    host.appendChild(
      el("header", { class: "t-header" }, [
        el("p", {
          class: "t-header__eyebrow",
          text: "교사용 · " + PC.LESSON_UNIT + " · 센서 활용 1차시"
        }),
        el("h1", { class: "t-header__title", text: "제출 현황 분석" }),
        el("p", { class: "t-header__sub", text: PC.LESSON_TITLE }),
        refs.meta
      ])
    );
    updateHeader();

    /* 인쇄물 맨 위에만 한 번 찍히는 날짜 */
    refs.printDate = el("p", { class: "t-printdate" });
    host.appendChild(refs.printDate);
    stampPrintDate();
    if (root.addEventListener) root.addEventListener("beforeprint", stampPrintDate);
  }

  function updateHeader() {
    if (!refs.meta) return;
    K.clear(refs.meta);
    refs.meta.appendChild(el("span", { text: "불러온 제출 " + ctx.rows().length + "건" }));
    if (roster.length) refs.meta.appendChild(el("span", { text: " · 명단 " + roster.length + "명" }));
    refs.meta.appendChild(
      el("span", { class: "t-head__warn", text: " · 이 화면은 학생에게 보이지 않습니다" })
    );
  }

  /** 인쇄물 맨 위 날짜 (예 : 2026년 8월 25일 (화) 출력) */
  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();
    var day = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];
    refs.printDate.textContent =
      now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + day + ") 출력";
  }

  /* ------------------------------------------------------------------ */
  /* 장 이동 — 위 단추 줄                                                 */
  /* ------------------------------------------------------------------ */

  function buildSteps(host) {
    refs.steps = el("ol", { class: "t-steps", attrs: { "aria-label": "장 이동" } });

    CHAPTERS.forEach(function (c, i) {
      var btn = el(
        "button",
        {
          class: "t-steps__btn",
          attrs: {
            type: "button",
            "data-page": String(i + 1),
            "aria-label": i + 1 + "장 " + c.label + " 보기"
          },
          on: {
            click: function () {
              go(i);
            }
          }
        },
        [
          el("span", { class: "t-steps__no", text: String(i + 1) }),
          el("span", { class: "t-steps__label", text: c.label })
        ]
      );
      refs.steps.appendChild(el("li", { class: "t-steps__item" }, [btn]));
    });

    host.appendChild(el("nav", { class: "t-steps-wrap" }, [refs.steps]));
  }

  function updateSteps() {
    if (!refs.steps) return;
    K.$$(".t-steps__btn", refs.steps).forEach(function (btn) {
      var no = Number(btn.getAttribute("data-page"));
      var locked = no > 1 && !hasData();
      btn.classList.toggle("is-current", no === at + 1);
      btn.classList.toggle("is-locked", locked);
      btn.setAttribute("aria-current", no === at + 1 ? "page" : "false");
      btn.title = locked ? "먼저 제출 자료를 불러와 주세요." : "";
    });
  }

  /* ------------------------------------------------------------------ */
  /* 아래 이동 단추                                                       */
  /* ------------------------------------------------------------------ */

  function buildPager(host) {
    refs.prev = el("button", {
      class: "btn btn--ghost",
      text: "← 이전",
      attrs: { type: "button" },
      on: {
        click: function () {
          go(at - 1);
        }
      }
    });

    refs.next = el("button", {
      class: "btn btn--primary",
      text: "다음 →",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (at === CHAPTERS.length - 1) finishReview();
          else go(at + 1);
        }
      }
    });

    refs.hint = el("p", { class: "t-pager__hint", attrs: { "aria-live": "polite" } });
    host.appendChild(el("footer", { class: "t-pager" }, [refs.prev, refs.hint, refs.next]));
  }

  /**
   * 아래 이동 단추의 상태.
   *   · 1장에서는 자료를 불러와야 다음으로 넘어간다 — 빈 화면을 넘겨 봐도 얻을 것이 없다.
   *   · 마지막 장에서는 「마침」 이 된다.
   */
  function updatePager() {
    if (!refs.next) return;
    var last = at === CHAPTERS.length - 1;
    refs.prev.disabled = at === 0;

    if (!last) {
      refs.next.textContent = "다음 →";
      refs.next.classList.remove("btn--finish");
      refs.next.setAttribute("aria-label", "다음 장 보기");
      refs.next.disabled = at === 0 && !hasData();
      refs.next.title = refs.next.disabled ? "먼저 제출 자료를 불러와 주세요." : "";
    } else {
      refs.next.textContent = "마침";
      refs.next.classList.add("btn--finish");
      refs.next.disabled = false;
      refs.next.title = "";
      refs.next.setAttribute("aria-label", "분석 마치기");
    }

    refs.hint.textContent = at + 1 + " / " + CHAPTERS.length + "장 · " + CHAPTERS[at].label;
  }

  function finishReview() {
    refs.hint.textContent = "분석을 마쳤어요 🎉 위 단추나 「← 이전」 으로 다시 볼 수 있어요.";
    refs.next.disabled = true;
    K.toast("제출 현황 분석을 마쳤어요.");
    K.announce("제출 현황 분석을 마쳤습니다.");
  }

  /* ------------------------------------------------------------------ */
  /* 장 넘기기                                                            */
  /* ------------------------------------------------------------------ */

  function bodyFor(key) {
    if (key === "load") return T.views.loadView(ctx);
    if (key === "summary") return T.views.summaryView(ctx);
    if (key === "analysis") return T.analysis.analysisView(ctx);
    return T.list.guideView(ctx);
  }

  /** 지금 보고 있는 장의 내용을 다시 만든다 */
  function redrawCurrent() {
    var page = pageNodes[at];
    if (!page) return;
    K.clear(page);
    page.appendChild(bodyFor(CHAPTERS[at].key));
  }

  function go(index) {
    var target = Math.max(0, Math.min(CHAPTERS.length - 1, index));
    if (target > 0 && !hasData()) {
      K.toast("먼저 제출 자료를 불러와 주세요.");
      K.announce("먼저 제출 자료를 불러와 주세요.");
      return;
    }
    at = target;
    show();
  }

  function show() {
    pageNodes.forEach(function (page, i) {
      if (page) page.classList.toggle("is-active", i === at);
    });
    redrawCurrent();
    updateHeader();
    updateSteps();
    updatePager();

    if (root.scrollTo) root.scrollTo({ top: 0, behavior: "auto" });
    var page = pageNodes[at];
    if (page && page.focus) page.focus({ preventScroll: true });
    K.announce(at + 1 + "장 " + CHAPTERS[at].label);
  }

  /* ------------------------------------------------------------------ */

  function start() {
    mainNode = K.$("#t-main");
    if (!mainNode) return;
    K.clear(mainNode);

    expected = loadExpected();

    buildHeader(mainNode);
    buildSteps(mainNode);

    /* 네 장을 «미리 만들어» 두고 한 장만 보인다. 내용은 열 때 그린다. */
    pageNodes = CHAPTERS.map(function (c, i) {
      var page = el("section", {
        class: "t-page",
        attrs: { tabindex: "-1", "aria-label": i + 1 + "장 " + c.label }
      });
      mainNode.appendChild(page);
      return page;
    });

    buildPager(mainNode);
    show();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  T.main = {
    CHAPTERS: CHAPTERS,
    go: go,
    render: function () {
      ctx.refresh();
    },
    ctx: ctx
  };
})();
    </script>
