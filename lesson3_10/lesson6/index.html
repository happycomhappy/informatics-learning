 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(steps)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다(명세 14장 첫 줄).
 *
 * ★ 조도(3단계)와 토양수분(4단계)이 이 파일을 «그대로 나눠 쓴다».
 *   달라지는 것은 넘겨받는 goal 과 template 뿐이다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 10.2).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var kids = [no, lineNode(line)];
      /* ★ 줄마다 설명을 «코드 옆» 에 붙인다.
         따로 떨어진 목록으로 두면 코드와 설명을 눈으로 오가야 한다.
         설명이 없는 줄도 빈 칸을 두어 «설명 칸» 이 한 줄로 맞는다. */
      if (o.notes) {
        kids.push(
          UI.el("span", { class: "codeline__note", text: o.notes(line, i + 1) || "" })
        );
      }
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, kids);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" + (o.notes ? " codeview--noted" : "") }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 18장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 10.2) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 — 흩어진 줄을 바른 차례로 (명세 17.3 «블록 조립»)          */
  /* ------------------------------------------------------------------ */

  /**
   * 끌어 놓기(drag) 대신 ▲▼ 단추를 쓴다 — 키보드와 터치에서 모두 확실하게 동작한다(명세 18장).
   *
   *   lines    : A.ASSEMBLE_LINES[goal]
   *   order    : 저장해 둔 차례 (없으면 정해진 규칙으로 섞는다)
   *   onChange : (order, source, done) => void
   */
  function assembler(lines, order, onChange) {
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다. 줄 목록에서 만들어 내므로 줄을 늘리거나 줄여도 따라온다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 «길이와 이름까지» 맞을 때만 쓴다. 아니면 새로 섞는다. */
    function usable(saved) {
      if (!saved || saved.length !== lines.length) return false;
      return saved.every(function (id) {
        return byId[id];
      });
    }
    var current = (usable(order) ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });
    var summary = UI.el("p", { class: "assemble__help" });

    function sourceOf() {
      return current
        .map(function (id) {
          return byId[id].text;
        })
        .join("\n");
    }

    /** 바른 차례가 되었는가 */
    function isDone() {
      for (var i = 0; i < current.length; i += 1) {
        if (byId[current[i]].order !== i + 1) return false;
      }
      return true;
    }

    /** 몇 줄이 제자리에 있는가 — 「4 / 16 줄이 제자리」 */
    function inPlace() {
      var n = 0;
      current.forEach(function (id, i) {
        if (byId[id].order === i + 1) n += 1;
      });
      return n;
    }

    function tell() {
      if (onChange) onChange(current.slice(), sourceOf(), isDone());
    }

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      tell();
      UI.announce(index + 1 + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      /* 옮긴 줄의 단추에 초점을 다시 준다 — 키보드로 계속 옮길 수 있게 */
      var again = listHost.querySelector('[data-at="' + next + '"] .assemble__grip');
      if (again) again.focus();
    }

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, i) {
        var line = byId[id];
        var ok = line.order === i + 1;

        var up = UI.button("▲", {
          class: "btn btn--icon btn--small",
          attrs: { "aria-label": i + 1 + "번째 줄을 위로 옮기기" },
          click: function () {
            move(i, -1);
          }
        });
        var down = UI.button("▼", {
          class: "btn btn--icon btn--small",
          attrs: { "aria-label": i + 1 + "번째 줄을 아래로 옮기기" },
          click: function () {
            move(i, 1);
          }
        });
        up.classList.add("assemble__grip");
        if (i === 0) up.disabled = true;
        if (i === current.length - 1) down.disabled = true;

        listHost.appendChild(
          UI.el("li", { class: "assemble__item", attrs: { "data-at": String(i) } }, [
            UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
            UI.el("code", { class: "assemble__code" }, [lineNode(line.text)]),
            /* 색만으로 알리지 않는다 — 글자로도 적는다(명세 18장) */
            UI.el("span", {
              class: "assemble__slot",
              text: ok ? "제자리" : "",
              attrs: { "aria-hidden": ok ? "false" : "true" }
            }),
            UI.el("span", { class: "assemble__btns" }, [up, down])
          ])
        );
      });

      summary.textContent =
        inPlace() + " / " + current.length + " 줄이 제자리에 있습니다." + (isDone() ? " 다 맞췄습니다!" : "");
    }

    draw();

    return {
      root: UI.el("div", {}, [listHost, summary]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isDone: isDone,
      reshuffle: function () {
        current = scrambled();
        draw();
        tell();
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (명세 10.2 «빈칸 완성»)                                  */
  /* ------------------------------------------------------------------ */

  /**
   * 코드에서 «핵심이 되는 자리» 만 비워 두고 채우게 한다.
   *
   *   template : A.BLANK_TEMPLATE[goal]  — lines 안에 {{slotId}} 가 박혀 있다
   *   values   : 저장해 둔 답
   *   onChange : (source, values, done) => void
   *
   * ★ 힌트는 placeholder 가 아니라 «보이는 이름표» 로 둔다.
   *   placeholder 는 한 줄로만 그려져 좁은 화면에서 뒷글자가 잘린다.
   */
  function blanks(goal, template, values, onChange) {
    var tpl = template;
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var slotById = {};
    tpl.slots.forEach(function (s) {
      slotById[s.id] = s;
    });

    var host = UI.el("div", { class: "blanks" });
    var feedback = UI.el("div", { class: "blanks__feedback" });

    function sourceOf() {
      return A.fillTemplate(goal, current);
    }

    /** 모든 빈칸이 맞았는가 */
    function isDone() {
      return tpl.slots.every(function (s) {
        return A.checkBlank(goal, s.id, current[s.id]).ok;
      });
    }

    function drawFeedback() {
      UI.clear(feedback);
      var wrong = tpl.slots.filter(function (s) {
        var typed = String(current[s.id] || "").trim();
        return typed && !A.checkBlank(goal, s.id, typed).ok;
      });
      var blank = tpl.slots.filter(function (s) {
        return !String(current[s.id] || "").trim();
      });

      if (blank.length > 0) {
        feedback.appendChild(
          UI.alert("info", "아직 " + blank.length + "칸이 비어 있습니다.")
        );
      }
      wrong.forEach(function (s) {
        var box = A.checkBlank(goal, s.id, current[s.id]);
        feedback.appendChild(
          UI.alert("warn", "«" + s.hint + "» 칸을 다시 보세요.", [
            UI.el("p", { class: "alert__fix", text: box.why })
          ])
        );
      });
      if (blank.length === 0 && wrong.length === 0) {
        feedback.appendChild(UI.alert("ok", "빈칸을 모두 바르게 채웠습니다."));
      }
    }

    /** 줄 번호 — 코드 상자와 같은 자리에 같은 모양으로 */
    function numberOf(lineIndex) {
      return UI.el("span", {
        class: "blanks__no",
        attrs: { "aria-hidden": "true" },
        text: String(lineIndex + 1)
      });
    }

    tpl.lines.forEach(function (line, lineIndex) {
      var match = line.match(/\{\{(\w+)\}\}/);
      if (!match) {
        host.appendChild(
          UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
            numberOf(lineIndex),
            UI.el("code", { class: "blanks__fixed" }, [lineNode(line)])
          ])
        );
        return;
      }

      var slot = slotById[match[1]];
      var id = UI.nextId("blank");
      var indent = (line.match(/^\s*/) || [""])[0].length;

      var input = UI.el("input", {
        class: "input input--mono blanks__input",
        id: id,
        attrs: {
          type: "text",
          /* ★ 물음을 «빈칸 안» 에 적는다. 글을 적기 시작하면 저절로 사라진다.
             앞판은 물음을 빈칸 «위» 에 따로 적어, 눈이 위아래를 오가야 했다. */
          placeholder: slot.hint,
          spellcheck: "false",
          autocapitalize: "off",
          autocomplete: "off"
        }
      });
      input.value = current[slot.id] || "";
      input.addEventListener("input", function () {
        current[slot.id] = input.value;
        if (onChange) onChange(sourceOf(), current, isDone());
      });
      input.addEventListener("blur", drawFeedback);

      /* 빈칸이 «그 자리에» 있는 것처럼 보이게 앞뒤 글을 함께 낸다 */
      var before = line.slice(0, match.index).trim();
      var after = line.slice(match.index + match[0].length).trim();

      /* 낭독기에는 물음을 «이름표» 로 알려 준다 — 화면에는 빈칸 안에만 보인다 */
      input.setAttribute("aria-label", slot.hint);

      var row = UI.el("div", { class: "blanks__row" }, [
        numberOf(lineIndex),
        UI.el("div", { class: "blanks__inline" }, [
          before ? UI.el("code", { class: "blanks__fixed" }, [lineNode(before)]) : null,
          input,
          after ? UI.el("code", { class: "blanks__fixed" }, [lineNode(after)]) : null
        ])
      ]);
      if (indent) row.querySelector(".blanks__inline").style.paddingLeft = indent + "ch";
      host.appendChild(row);
    });

    drawFeedback();

    return {
      root: UI.el("div", {}, [host, feedback]),
      getSource: sourceOf,
      getValues: function () {
        return current;
      },
      isDone: isDone,
      refresh: drawFeedback
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터 (명세 4.3 · 10.3 · 11.3)                        */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (Number(ms) / 1000).toFixed(3) + "초";
  }

  /**
   * 시리얼 모니터 창.
   * 실제 아두이노 IDE 의 창처럼 «머리말 + 줄 목록» 으로 만든다.
   */
  function monitor(opts) {
    var o = opts || {};
    var body = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });

    var rootNode = UI.el("div", { class: "monitor" }, [
      UI.el("div", { class: "monitor__head" }, [
        UI.el("span", { class: "monitor__title", text: "시리얼 모니터" }),
        UI.el("span", { class: "monitor__where", text: o.baud ? o.baud + " bps" : "9600 bps" })
      ]),
      body,
      o.note ? UI.el("p", { class: "monitor__note", text: o.note }) : null
    ]);

    function show(lines, upTo) {
      UI.clear(body);
      var list = lines || [];
      var limit = upTo === undefined ? list.length : upTo;
      if (limit <= 0) {
        body.appendChild(UI.el("p", { class: "console__empty", text: "아직 출력이 없습니다." }));
        return;
      }
      list.slice(0, limit).forEach(function (item) {
        var text = typeof item === "string" ? item : item.text;
        var t = typeof item === "string" ? null : item.t;
        body.appendChild(
          UI.el("p", { class: "monitor__line" }, [
            t === null
              ? null
              : UI.el("span", { class: "monitor__t", attrs: { "aria-hidden": "true" }, text: seconds(t) }),
            UI.el("span", { class: "monitor__text", text: text })
          ])
        );
      });
      body.scrollTop = body.scrollHeight;
    }

    show([]);

    return { root: rootNode, show: show, clear: function () { show([]); } };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 실행 재생 — «지금 실행 줄» 을 한 걸음씩 (명세 10.3)                  */
  /* ------------------------------------------------------------------ */

  /**
   * arduino.js 가 남긴 «발자취(steps)» 를 되짚어 보여 준다.
   * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
   *
   *   view    : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   mon     : monitor 가 돌려준 것
   *   onStep  : (step, index) => void   — 바깥이 val · 조건식 · 핀 상태를 그린다
   */
  function player(view, mon, opts) {
    var o = opts || {};
    var steps = [];
    var serial = [];
    var at = -1;
    var timer = null;
    var speed = 1;

    function paint() {
      var step = steps[at] || null;
      if (view) view.highlight(step ? step.line : 0);
      if (mon) mon.show(serial, step ? step.serialCount : 0);
      if (o.onStep) o.onStep(step, at);
    }

    function stop() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      if (o.onPlayState) o.onPlayState(false);
    }

    function stepOnce() {
      if (at >= steps.length - 1) return false;
      at += 1;
      paint();
      return true;
    }

    function tickDelay() {
      var step = steps[at];
      var next = steps[at + 1];
      if (!step || !next) return 220;
      /* 가상 시간 차이를 실제 시간으로 옮긴다. 너무 길면 잘라 낸다. */
      var gap = Math.max(60, Math.min(700, next.t - step.t || 160));
      return speed === 0 ? 0 : Math.round(gap / speed);
    }

    function play() {
      stop();
      if (at >= steps.length - 1) at = -1;
      if (o.onPlayState) o.onPlayState(true);
      (function loop() {
        if (!stepOnce()) {
          stop();
          if (o.onFinish) o.onFinish();
          return;
        }
        if (at >= steps.length - 1) {
          stop();
          if (o.onFinish) o.onFinish();
          return;
        }
        timer = setTimeout(loop, tickDelay());
      })();
    }

    return {
      /** 새 실행 결과를 담는다 */
      load: function (result) {
        stop();
        steps = (result && result.steps) || [];
        serial = (result && result.serial) || [];
        at = -1;
        paint();
      },
      play: play,
      stop: stop,
      stepOnce: function () {
        stop();
        stepOnce();
      },
      /** 끝까지 한 번에 */
      finish: function () {
        stop();
        at = steps.length - 1;
        paint();
        if (o.onFinish) o.onFinish();
      },
      reset: function () {
        stop();
        at = -1;
        paint();
      },
      setSpeed: function (next) {
        speed = Number(next) || 1;
        return speed;
      },
      length: function () {
        return steps.length;
      },
      position: function () {
        return at;
      }
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    monitor: monitor,
    player: player,
    seconds: seconds
  };
})();

    <!-- 센서 슬라이더와 눈금판 (이 차시에서 새로 늘었다) -->
    <script data-from="student/s55-sim.js">
/**

 *

 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var ADC_MAX = PC.ADC_MAX === undefined ? 1023 : PC.ADC_MAX;

  /* ------------------------------------------------------------------ */
  /* 눈금판 — 값 하나를 세 가지 방법으로 보인다                              */
  /* ------------------------------------------------------------------ */

  function gauge(opts) {
    var o = opts || {};
    var bar = UI.el("div", { class: "gauge__fill" });

    var valueText = UI.el("span", { class: "gauge__value" });

    var resText = UI.el("span", { class: "gauge__res" });

    var rootNode = UI.el("div", { class: "gauge" }, [
      UI.el("p", { class: "gauge__head" }, [
        UI.el("span", { class: "gauge__label", text: o.label || "아날로그값" }),
        valueText
      ]),
      UI.el(
        "div",
        {
          class: "gauge__track",
          attrs: {
            role: "meter",
            "aria-label": o.label || "아날로그값",
            "aria-valuemin": "0",
            "aria-valuemax": String(ADC_MAX)

      UI.el("p", { class: "gauge__foot" }, [wordText, resText]),
      UI.el("p", { class: "gauge__scale", attrs: { "aria-hidden": "true" } }, [
        UI.el("span", { text: "0" }),
        UI.el("span", { text: String(Math.round(ADC_MAX / 2)) }),
        UI.el("span", { text: String(ADC_MAX) })
      ])
    ]);

    /**
     * 값을 그린다.
     *   spec = { value, word, resistance, threshold }
     */
    function set(spec) {
      var s = spec || {};
      var value = Math.max(0, Math.min(ADC_MAX, Number(s.value) || 0));
      var pct = (value / ADC_MAX) * 100;

      bar.style.width = pct.toFixed(1) + "%";

      rootNode.querySelector(".gauge__track").setAttribute("aria-valuenow", String(value));
      rootNode
        .querySelector(".gauge__track")

      wordText.textContent = s.word ? "상태 : " + s.word : "";
      resText.textContent = s.resistance ? "센서 저항 : " + s.resistance : "";

      if (s.threshold !== undefined && s.threshold !== null) {
        var tp = (Math.max(0, Math.min(ADC_MAX, Number(s.threshold))) / ADC_MAX) * 100;
        mark.style.left = tp.toFixed(1) + "%";
        mark.setAttribute("title", "기준값 " + s.threshold);

        mark.hidden = false;

  /* ------------------------------------------------------------------ */

  function slider(opts) {

  /* ------------------------------------------------------------------ */

  /**

  function lightSim(opts) {

      mpins.forEach(function (p) {
        svgNode.appendChild(
          UI.svg("rect", { x: p.x - 11, y: my + mh - 4, width: 22, height: 12, rx: 2, class: "mod__pad" })
        );
        /* ★ 단자 이름을 기판 «안» 에 적는다 — 어느 선이 어디로 가는지 그림에서 바로 읽히게 */
        svgNode.appendChild(
          UI.svg("text", { x: p.x, y: my + mh - 8, class: "figboard figboard--pin", "text-anchor": "middle" },
            [document.createTextNode(p.name)])
        );
      });

      /* 탐침 입력 두 단자 — 위쪽 */
      [mx + 30, mx + 58].forEach(function (x) {
        svgNode.appendChild(UI.svg("rect", { x: x - 8, y: my - 9, width: 16, height: 10, rx: 2, class: "mod__pad" }));
      });

      /* ================= 케이블 세 줄 ================= */
      /* 우노 아래 헤더 → 아래로 내려 → 옆으로 → 모듈 단자 아래로 */
      /**
       * 케이블 한 줄.
       *
       * ★ «흰 겉껍질» 을 먼저 깔고 그 위에 색 선을 얹는다.
       *   세 줄이 나란히 지나므로 색만으로는 어디서 갈라지는지 알기 어렵다.
       *   겉껍질이 선 사이에 흰 틈을 만들어 «세 줄» 로 또렷하게 보이게 한다.
       *   (실물 배선 사진에서 선이 겹칠 때 구분되는 것과 같은 방법이다)
       */
      function cable(fromX, toX, dropY, cls) {
        var d =
          "M" + fromX + " " + (uy + 127) +
          " L" + fromX + " " + dropY +
          " L" + toX + " " + dropY +
          " L" + toX + " " + (my + mh + 10);
        svgNode.appendChild(UI.svg("path", { d: d, class: "cable__case" }));
        svgNode.appendChild(UI.svg("path", { d: d, class: "cable cable--" + cls }));
        /* 꺾이는 자리에 점을 찍어 «어느 선인지» 눈으로 따라가기 쉽게 */
        svgNode.appendChild(UI.svg("circle", { cx: toX, cy: dropY, r: 3.4, class: "cable__dot cable__dot--" + cls }));
      }
      cable(pins[0].x, mpins[0].x, 216, "red");
      cable(pins[1].x, mpins[1].x, 200, "black");
      cable(pins[2].x, mpins[3].x, 184, "yellow");

      /* 케이블이 무엇을 잇는지 글자로도 (색만으로 알리지 않는다 — 명세 18장) */
      svgNode.appendChild(
        UI.svg("text", { x: 196, y: 236, class: "figtxt figtxt--wire", "text-anchor": "middle" },
          [document.createTextNode("5V→VCC · GND→GND · " + (PC.PINS || {}).soil + "→AO")])
      );

      /* ================= 탐침과 흙 (오른쪽) ================= */
      var px = 396;

      /* 화분 흙 */
      svgNode.appendChild(UI.svg("rect", { x: px - 22, y: 118, width: 148, height: 104, rx: 6, class: "soil__dirt" }));
      svgNode.appendChild(
        UI.svg("rect", {
          x: px - 22, y: 118, width: 148, height: 104, rx: 6,
          class: "soil__water", opacity: (0.08 + wet * 0.6).toFixed(2)
        })
      );

      /* 탐침 머리 — 잠기게 하면 흙 속으로 내려간다 */
      var headY = submerged ? 150 : 62;
      svgNode.appendChild(UI.svg("rect", { x: px + 10, y: headY, width: 84, height: 40, rx: 4, class: "probe__head" }));
      svgNode.appendChild(
        UI.svg("text", { x: px + 52, y: headY + 24, class: "figchip", "text-anchor": "middle" },
          [document.createTextNode("YL-69")])
      );
      /* 모듈 → 탐침 두 선 */
      [[mx + 30, px + 26], [mx + 58, px + 78]].forEach(function (pair) {
        var attrs = { x1: pair[0], y1: my - 9, x2: pair[1], y2: headY };
        svgNode.appendChild(UI.svg("line", Object.assign({}, attrs, { class: "cable__case" })));
        svgNode.appendChild(UI.svg("line", Object.assign({}, attrs, { class: "cable cable--gray" })));
      });

      /* 두 갈래 판 */
      [px + 26, px + 66].forEach(function (x) {
        svgNode.appendChild(
          UI.svg("path", {
            d: "M" + x + " " + (headY + 40) + " L" + (x + 14) + " " + (headY + 40) +
               " L" + (x + 14) + " 200 L" + (x + 7) + " 214 L" + x + " 200 Z",
            class: "probe__blade"
          })
        );
      });

      /* 물방울 — 수분이 많을수록 여럿 */
      var drops = Math.round(wet * 7);
      for (var i = 0; i < drops; i += 1) {
        svgNode.appendChild(
          UI.svg("circle", {
            cx: px - 8 + ((i * 37) % 128),
            cy: 136 + ((i * 27) % 72),
            r: 4.5,
            class: "soil__drop"
          })
        );
      }

      /* 두 판 사이의 전류 — 물이 많으면 굵다 */
      svgNode.appendChild(
        UI.svg("line", {
          x1: px + 40, y1: 178, x2: px + 66, y2: 178,
          class: "soil__current", "stroke-width": (1.5 + wet * 7).toFixed(1)
        })
      );

      if (submerged) {
        svgNode.appendChild(
          UI.svg("rect", { x: px + 4, y: headY - 6, width: 96, height: 52, rx: 6, class: "danger__ring" })
        );
      }

      /* 지금 상태를 글자로 — 눈금판과 같은 것을 다시 말해 준다 */
      svgNode.appendChild(
        UI.svg("text", { x: px + 52, y: 22, class: "figtxt figtxt--go", "text-anchor": "middle" },
          [document.createTextNode(r.cond.icon + " " + r.cond.label)])
      );
      svgNode.appendChild(
        UI.svg("text", { x: px + 52, y: 40, class: "figtxt", "text-anchor": "middle" },
          [document.createTextNode(level >= 50 ? "물 많음 → 저항 작음" : "물 적음 → 저항 큼")])
      );
      svgNode.appendChild(
        UI.svg("text", { x: px + 52, y: 240, class: "figtxt figtxt--muted", "text-anchor": "middle" },
          [document.createTextNode("제조사마다 핀 순서가 다를 수 있습니다")])
      );

      scene.appendChild(svgNode);
    }

    function drawDanger() {
      UI.clear(danger);
      if (!submerged) return;
      danger.appendChild(
        UI.alert("danger", "전자회로 모듈이 물에 잠겼습니다.", [
          UI.el("p", {
            class: "alert__fix",
            text: "탐침 부분만 토양에 넣고, 모듈의 전자회로 윗부분은 물에 닿지 않게 하세요. 이대로 두면 부품이 상합니다."
          })
        ])
      );
    }

    function paint(tell) {
      var r = reading();
      drawScene(r);
      drawDanger();
      g.set({
        value: r.value,
        word: r.cond.icon + " " + r.cond.label + " (" + r.cond.meaning + ")",
        resistance: PC.resistanceWord(ADC_MAX - r.value),
        threshold: o.threshold
      });
      sl.setNow(r.cond.label + " · 원시값 " + r.value);
      if (tell && o.onChange) o.onChange(level, r.value, r.id);
    }

    /** 물 주기 — 값이 시간에 따라 내려가는 애니메이션 (명세 11.3) */
    function water() {
      if (timer) return;
      var target = Math.min(95, level + 40);
      timer = setInterval(function () {
        level = Math.min(target, level + 4);
        sl.setValue(level);
        paint(true);
        if (level >= target) {
          clearInterval(timer);
          timer = null;
          UI.announce("물을 주었습니다. 원시값이 " + reading().value + " 로 내려갔습니다.");
        }
      }, 90);
    }

    /** 마르기 — 물을 준 뒤 시간이 지나는 것 */
    function dry() {
      if (timer) return;
      var target = Math.max(8, level - 40);
      timer = setInterval(function () {
        level = Math.max(target, level - 4);
        sl.setValue(level);
        paint(true);
        if (level <= target) {
          clearInterval(timer);
          timer = null;
          UI.announce("시간이 지나 흙이 말랐습니다. 원시값이 " + reading().value + " 로 올라갔습니다.");
        }
      }, 90);
    }

    /**
     * 단추 한 줄.
     *
     * ★ 순서 : 건조 · 보통 · 습함  →  물 주기 · 시간 지나기
     *   먼저 «어느 조건인가» 를 고르고, 그다음 «시간이 지나면 어떻게 되는가» 를 본다.
     *   앞판은 두 줄로 나뉘어 있었고 물 주기가 앞에 있어서, 학생이 조건을 고르기 전에
     *   물부터 주는 일이 많았다.
     */
    var buttons = UI.el(
      "div",
      { class: "sim__btns" },
      (PC.SOIL_CONDITIONS || [])
        .map(function (c) {
          return UI.button(c.icon + " " + c.label, {
            class: "btn btn--ghost btn--small",
            click: function () {
              if (timer) {
                clearInterval(timer);
                timer = null;
              }
              level = c.moisture;
              sl.setValue(level);
              paint(true);
              UI.announce(c.label + " 조건으로 바꿨습니다. 원시값 " + PC.soilValue(level));
            }
          });
        })
        .concat([
          UI.button("💧 물 주기", { class: "btn btn--ghost btn--small", click: water }),
          UI.button("⏳ 시간 지나기 (마름)", { class: "btn btn--ghost btn--small", click: dry })
        ])
    );

    var submergeToggle = UI.el("label", { class: "check" }, [
      (function () {
        var box = UI.el("input", { class: "check__input", attrs: { type: "checkbox" } });
        box.checked = submerged;
        box.addEventListener("change", function () {
          submerged = box.checked;
          paint(false);
          if (o.onSubmerge) o.onSubmerge(submerged);
        });
        return box;
      })(),
      UI.el("span", {
        class: "check__label",
        text: "모듈까지 물에 담가 보기 (해서는 안 되는 배치 — 무엇이 나타나는지 확인만)"
      })
    ]);

    paint(false);

    return {
      root: UI.el("div", { class: "sim sim--soil" }, [
        scene,
        sl.root,
        buttons,
        g.root,
        danger,
        /* ★ 침수 체크상자는 «실습(4단계)» 의 것이다 — 해서는 안 되는 배치를
           «해 보는» 활동(명세 11.1). 2단계 개념 화면은 원리를 보는 자리이므로 내지
           않는다. 부르는 곳에서 showPractice 로 켠다.
           값 안내(명세 11.3)는 s65-sensor.js 의 실험 칸이 조도·토양 «둘 다» 에게
           한 번씩 낸다 — 여기서 또 내면 4단계에만 두 번 나온다. */
        o.showPractice === false ? null : submergeToggle
      ]),
      getLevel: function () {
        return level;
      },
      getValue: function () {
        return reading().value;
      },
      getCondition: function () {
        return reading().id;
      },
      isSubmerged: function () {
        return submerged;
      },
      setLevel: function (v) {
        level = Number(v);
        sl.setValue(level);
        paint(false);
      },
      setThreshold: function (v) {
        o.threshold = v;
        paint(false);
      },
      stop: function () {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      },
      refresh: function () {
        paint(false);
      }
    };
  }

  S.sim = { gauge: gauge, slider: slider, lightSim: lightSim, soilSim: soilSim };
})();

    <!-- 3단계와 4단계가 함께 쓰는 실습 화면 -->
    <script data-from="student/s65-sensor.js">
/**
 * 센서 실습 화면 — 3단계(조도)와 4단계(토양수분)가 «이 파일 하나» 를 나눠 쓴다
 * (명세 10장 · 11장)
 *
 * 왜 하나로 두는가
 *   두 실습의 흐름이 똑같다 — 회로 결선 → 코딩 → 조건별 실행·기록.
 *   화면을 두 벌로 적으면 한쪽만 고쳐 두 단계가 어긋난다.
 *   달라지는 것은 goal('light' | 'soil') 하나이고,
 *   부품·정답 회로·기준 코드·조건 목록은 모두 shared/ 가 갖고 있다.
 *
 * 화면 순서
 *   A. 회로 결선   A-1 단자 찾기 → A-2 케이블 잇기 → A-3 점검과 전원
 *   B. 코딩        ① 예시 읽기 → ② 예시 실행 → ③ 빈칸 완성 → ④ 전체 수정
 *   C. 조건별 실행  세 조건에서 «예상 → 실행 → 관찰» 을 적고 기준값을 정한다
 *   D. (토양수분만) 선택 확장 — 물을 주세요 메시지
 *
 * ★ 명세 10.2 «예시를 관찰하기 전에는 편집기를 만들지 않는다» 를 지킨다.
 *   B 의 각 차례는 앞 차례를 마쳐야 열린다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;
  var C = PC.circuit;
  var A = PC.arduino;
  var L = PC.lesson;

  /* ------------------------------------------------------------------ */
  /* 갈래마다 다른 «말»                                                    */
  /* ------------------------------------------------------------------ */


  var WORDS = {
    light: {
      title: "조도센서 프로그램 및 실습",
      eyebrow: PC.stepTag("light"),
      sensor: "조도센서",
      pin: (PC.PINS || {}).cds,
      runLabel: "빛 조건",
      thresholdLabel: "우리 교실에 맞는 조도 기준값",
      thresholdHelp:
        "위에서 재어 본 세 값을 보고 정하세요. «밝음» 과 «어두움» 사이에 있어야 합니다. " +
        "예시 코드의 " +
        (PC.LIGHT_THRESHOLD || 500) +
        " 을 그대로 써도 되지만, 왜 그렇게 정했는지 적어야 합니다.",
      simKey: "lightSim",
      codeKey: "light"
    },
    soil: {
      title: "토양수분센서 프로그램 및 실습",
      eyebrow: PC.stepTag("soil"),
      sensor: "토양수분감지센서",
      pin: (PC.PINS || {}).soil,
      runLabel: "수분 조건",
      thresholdLabel: "우리 화분에 맞는 건조 기준값",
      thresholdHelp:
        "위에서 재어 본 세 원시값을 보고 정하세요. 이 값보다 크면 «건조» 로 봅니다. " +
        "예시의 " +
        (PC.SOIL_DRY_THRESHOLD || 800) +

      simKey: "soilSim",

    }
  };

  /* ------------------------------------------------------------------ */
  /* A. 회로 결선                                                         */
  /* ------------------------------------------------------------------ */

  /** A-1 단자 찾기 — 부품의 어느 단자가 무슨 일을 하는지 (명세 17.3) */
  function findSection(goal, part, app) {
    var tasks = C.FIND_TASKS[goal] || [];
    var box = el("div", { class: "panel" });
    var idx = Math.min(part.circuit.findIndex, tasks.length - 1);
    var done = part.circuit.findDone;

    var feedback = el("div", { class: "feedback" });

    var board = S.board.create({
      goal: goal,
      mode: "find",
      getState: function () {
        return app.getState()[goal].circuit;
      },
      onPick: function (compId, pinId) {
        var verdict = C.checkFind(goal, idx, compId, pinId);
        UI.clear(feedback);
        app.patch(function (s) {
          s[goal].circuit.findAttempts += 1;
          s[goal].circuit.findPicks[idx] = compId + ":" + pinId;
        });

        if (!verdict.ok) {
          feedback.appendChild(UI.alert("warn", verdict.message));
          UI.announce(verdict.message);
          return;
        }
        feedback.appendChild(UI.alert("ok", verdict.message));
        if (idx >= tasks.length - 1) {
          app.update(function (s) {
            s[goal].circuit.findDone = true;
          });
        } else {
          app.update(function (s) {
            s[goal].circuit.findIndex = idx + 1;
          });
        }
      }
    });

    box.appendChild(
      el("div", { class: "panel__head" }, [
        el("h3", { class: "panel__title", text: "A-1. 단자 찾기" }),
        el("span", { class: "badge" + (done ? " badge--true" : ""), text: done ? "마침" : idx + 1 + " / " + tasks.length })
      ])
    );

    if (done) {
      box.appendChild(UI.alert("ok", "단자의 역할을 모두 찾았습니다. 이제 케이블을 이어 봅시다."));
      box.appendChild(
        UI.foldout("단자 역할을 다시 보기", function () {
          var ul = el("ul", { class: "pinrules" });
          C.terminalList(goal)
            .filter(function (t) {
              return t.component !== "uno" && t.component !== "bb";
            })
            .forEach(function (t) {
              ul.appendChild(
                el("li", { class: "pinrules__item" }, [
                  el("b", { class: "pinrules__q", text: t.label }),
                  el("span", { class: "pinrules__a", text: t.note })
                ])
              );
            });
          return ul;
        })
      );
      return box;
    }

    /* ── 무엇을 해야 하는지 또렷하게 ──
       앞판은 물음 한 줄만 있어서 «어디를 어떻게» 해야 하는지 알 수 없었다.
       그래서 ① 몇 번째 물음인지 ② 무엇을 고르는지 ③ 어떻게 고르는지 를 나눠 적는다. */
    var ask = el("div", { class: "findask" }, [
      el("p", { class: "findask__step", text: idx + 1 + "번째 물음 (모두 " + tasks.length + "개)" }),
      el("p", { class: "findask__q", text: tasks[idx].ask }),
      el("p", {
        class: "findask__how",
        text: "아래 그림에서 단자(파란 동그라미)를 눌러 고르세요. 키보드는 Tab 으로 옮기고 Enter 로 고릅니다."
      })
    ]);

    /* 진행 점 — 몇 개를 마쳤는지 한눈에 */
    var dots = el("p", { class: "finddots", attrs: { "aria-hidden": "true" } });
    tasks.forEach(function (_, i) {
      dots.appendChild(
        el("span", {
          class: "finddots__dot" + (i < idx ? " finddots__dot--done" : i === idx ? " finddots__dot--now" : ""),
          text: String(i + 1)
        })
      );
    });

    box.appendChild(ask);
    box.appendChild(dots);
    box.appendChild(board.root);
    box.appendChild(feedback);
    return box;
  }

  /** A-2·A-3 케이블 잇기와 점검 */
  function wireSection(goal, part, app) {
    var box = el("div", { class: "panel" });
    var conns = part.circuit.connections;
    var verdict = C.checkCircuit(goal, conns);
    var power = C.canPowerOn(goal, conns);

    var board = S.board.create({
      goal: goal,
      mode: "wire",
      getState: function () {
        return app.getState()[goal].circuit;
      },
      getEnv: function () {

        var e = {};
        if (goal === "light") {
          /* 전원을 켠 뒤에는 지금 밝기와 기준값으로 LED 를 보인다 */
          var value = PC.lightValue(st.experiment.level);
          var th = st.threshold || PC.LIGHT_THRESHOLD;
          e.ledOn = st.circuit.powerOn && value > th;
        } else {
          e.moisture = st.experiment.level;
          e.submerged = st.submerged;

        return e;
      },
      onConnect: function (conn) {

          s[goal].circuit.connections.push(conn);
          s[goal].circuit.attempts += 1;
          /* 케이블을 바꾸면 «검사했다» 를 지운다 — 다시 눌러 확인해야 한다 */
          s[goal].circuit.checked = false;
          s[goal].circuit.completed = false;
          if (!C.canPowerOn(goal, s[goal].circuit.connections).ok) s[goal].circuit.powerOn = false;
        });
      },
      onRemove: function (index) {
        app.update(function (s) {
          s[goal].circuit.connections.splice(index, 1);
          s[goal].circuit.checked = false;
          s[goal].circuit.completed = false;
          if (!C.canPowerOn(goal, s[goal].circuit.connections).ok) s[goal].circuit.powerOn = false;
        });
      },
      onClear: function () {
        UI.askDialog({
          title: "케이블을 모두 지울까요?",
          lines: ["이어 놓은 케이블 " + conns.length + "개가 사라집니다."],
          okLabel: "모두 지우기",
          cancelLabel: "그만두기",
          dismiss: "cancel",
          onOk: function () {
            app.update(function (s) {
              s[goal].circuit.connections = [];
              s[goal].circuit.checked = false;
              s[goal].circuit.completed = false;
              s[goal].circuit.powerOn = false;
            });
          }
        });
      }
    });

    box.appendChild(
      el("div", { class: "panel__head" }, [
        el("h3", { class: "panel__title", text: "A-2. 케이블 잇기" }),
        el("span", {
          class: "badge" + (part.circuit.completed ? " badge--true" : ""),
          text: verdict.status.done + " / " + verdict.status.total
        })
      ])
    );
    box.appendChild(el("p", { class: "panel__hint", text: C.GOAL[goal] }));
    box.appendChild(board.root);

    /* ── 해야 할 연결 목록 ── */
    var condList = el("ul", { class: "condlist" });
    verdict.status.items.forEach(function (item) {
      condList.appendChild(UI.conditionRow(item.label, item.ok, item.ok ? "" : item.why));
    });
    box.appendChild(el("h4", { class: "subhead", text: "해야 할 연결" }));
    box.appendChild(condList);

    /* ── A-3 점검과 전원 ── */
    var check = el("div", { class: "panel__body" });

    check.appendChild(
      el("div", { class: "btnrow" }, [
        UI.button("회로 검사하기", {
          click: function () {
            var now = C.checkCircuit(goal, app.getState()[goal].circuit.connections);
            app.update(function (s) {
              s[goal].circuit.checked = true;
              s[goal].circuit.completed = now.ok;
              s[goal].circuit.attempts += 1;
              s[goal].circuit.errors = now.errors.map(function (e) {
                return e.code;
              });
            });
            UI.announce(now.ok ? "회로 검사를 통과했습니다." : "고칠 곳이 " + now.errors.length + "군데 있습니다.");
          }
        }),
        UI.button(part.circuit.powerOn ? "전원 끄기" : "전원 켜기", {
          class: "btn btn--ghost",
          disabled: !power.ok,
          title: power.ok ? "" : power.reason,
          click: function () {
            app.update(function (s) {
              s[goal].circuit.powerOn = !s[goal].circuit.powerOn;
            });
          }
        }),
        el("span", {
          class: "btnrow__note",
          text: power.ok ? "" : "⛔ " + power.reason + " — 고치기 전에는 전원을 넣을 수 없습니다."
        })
      ])
    );

    /* 힌트 세 단계 (명세 9장 마지막 줄) */
    var next = C.nextRequirement(goal, conns);
    if (next) {
      var level = part.circuit.hintLevels[next.id] || 0;
      var hint = C.hintFor(next.id, level);
      var hintBox = el("div", { class: "hintout" });
      if (level > 0 || part.circuit.hintLevels[next.id] !== undefined) {
        hintBox.appendChild(
          UI.alert("info", "힌트 " + (hint.level + 1) + " / " + hint.total + " — " + hint.text)
        );
      }
      check.appendChild(
        el("div", { class: "btnrow btnrow--one" }, [
          UI.button(level === 0 && part.circuit.hintLevels[next.id] === undefined ? "힌트 보기" : "더 자세한 힌트", {
            class: "btn btn--quiet btn--small",
            disabled: hint.last && part.circuit.hintLevels[next.id] !== undefined,
            click: function () {
              app.update(function (s) {
                var cur = s[goal].circuit.hintLevels[next.id];
                s[goal].circuit.hintLevels[next.id] = cur === undefined ? 0 : Math.min(2, cur + 1);
                s[goal].circuit.hintsUsed += 1;
              });
            }
          }),
          el("span", { class: "btnrow__label", text: "지금 볼 것 : " + next.label })
        ])
      );
      check.appendChild(hintBox);
    }

    /* 검사 결과 */
    if (part.circuit.checked) {
      if (verdict.ok) {
        check.appendChild(UI.alert("ok", "회로 결선을 통과했습니다. 이제 코드를 봅시다."));
        verdict.strays.forEach(function (s) {
          check.appendChild(
            UI.alert("info", "이 케이블은 회로에 쓰이지 않습니다 : " + s.label + " — 지워도 됩니다.")
          );
        });
      } else {
        verdict.errors.forEach(function (e) {
          check.appendChild(
            UI.alert(e.code.indexOf("missing:") === 0 ? "warn" : "danger", e.title, [
              e.detail ? el("p", { class: "alert__why", text: e.detail }) : null,
              e.fix ? el("p", { class: "alert__fix", text: "고치기 : " + e.fix }) : null
            ])
          );
        });
      }
    }

    box.appendChild(el("h4", { class: "subhead", text: "A-3. 점검과 전원" }));
    box.appendChild(check);

    /* 참고 — 첨부 자료가 어긋난 부분 (명세 5장)
       ★ 조도(3단계)의 「CdS 단품과 모듈은 무엇이 다른가?」 덧자료는
         2026-08-25 에 선생님 요청으로 뺐다. 단자 이름을 배우는 자리는
         A-1 «단자 찾기» 와 힌트 3단계에 그대로 있다. */
    if (goal !== "light") {
      box.appendChild(
        UI.foldout("AO 와 DO 를 바꿔 꽂으면 어떻게 되나?", function () {
          return el("div", { class: "stack" }, [
            el("p", {
              class: "para",
              text:
                "DO 는 모듈의 가변저항으로 정한 기준을 «넘었는가» 만 0 또는 1 로 알려 줍니다. " +
                "AO 대신 DO 를 " +
                WORDS.soil.pin +
                " 에 이으면 원시 아날로그값이 아니라 0/1 상태만 읽게 됩니다."
            }),
            el("p", { class: "para", text: "위 회로에서 실제로 바꿔 꽂고 [회로 검사하기] 를 눌러 보세요." })
          ]);
        })
      );
    }

    return box;
  }

  /* ------------------------------------------------------------------ */
  /* B. 코딩 (명세 10.2 «예시 읽기 → 예시 실행 → 빈칸 완성 → 전체 코드 수정») */
  /* ------------------------------------------------------------------ */

  /** 지금 어느 차례인가 — 앞 차례를 마쳐야 다음이 열린다 */
  /**
   * 지금 어느 차례인가 — «읽고 돌려 보기» 아니면 «빈칸 채우기» 둘뿐이다.
   * (2026-08-25 에 네 차례를 둘로 줄였다. lesson.js 의 CODE_STAGES 참고)
   */
  function codeStageOf(part) {
    return part.code.exampleRead ? "blank" : "read";
  }

  /**
   * 어느 조건을 돌려 보았는가 — 화면을 다시 그려도 남아야 하므로 여기에 둔다.
   * 제출 자료에는 넣지 않는다(제출 규격을 건드리지 않기 위해서다).
   */
  var ranPair = { light: {}, soil: {} };

  /** 두 조건을 다 돌려 보았는가 */
  function ranBothOf(goal) {
    var done = ranPair[goal] || {};
    return (RUN_PAIR[goal] || RUN_PAIR.light).every(function (id) {
      return done[id];
    });
  }

  /** ① 에서 돌려 보는 «두 조건» — 기준값을 사이에 두고 양쪽이다 */
  var RUN_PAIR = {
    light: ["dark", "bright"],
    soil: ["dry", "wet"]
  };

  /**
   * 코딩 차례 칸 — «눌러서» 옮겨 다닌다.
   *
   * ★ 앞판은 화면 맨 아래의 [읽고 돌려 보았습니다 — 빈칸 채우기로] 단추로만
   *   넘어갈 수 있었다. 차례 칸이 바로 위에 있는데 눌리지 않아, 학생이
   *   먼저 눌러 보고는 «아무 일도 일어나지 않는» 경험을 했다.
   *   그래서 칸 자체를 단추로 만들고 아래 단추는 없앴다.
   *
   * 다만 ② 는 «두 조건을 모두 돌려 본 뒤» 에만 열린다 — 명세 10.2 의
   * 「예시를 관찰하기 전에는 편집기를 만들지 않는다」를 지키기 위해서다.
   */
  function stageTabs(part, goal, app) {
    var here = codeStageOf(part);
    var order = ["read", "blank"];
    var atIndex = order.indexOf(here);
    /* 한 번 넘어간 뒤에는 언제나 오갈 수 있다 */
    var canGoBlank = ranBothOf(goal) || part.code.exampleRead;

    function goTo(index) {
      app.update(function (st) {
        st[goal].code.exampleRead = index > 0;
      });
      UI.announce(L.CODE_STAGES[index].label + " 차례입니다.");
    }

    /* ★ 차례 이름만 칸에 넣고, «무엇을 하는 차례인가» 는 아래 한 줄로 뺀다.
       설명까지 칸 안에 넣었더니 이름과 설명이 붙어 한 덩어리로 읽혔다.
       (설명은 지금 차례의 것만 보이면 된다) */
    var tabs = el(
      "ol",
      { class: "modetabs", attrs: { "aria-label": "코딩 차례" } },
      L.CODE_STAGES.map(function (stage, i) {
        var passed = i < atIndex;
        var current = i === atIndex;
        var locked = i === 1 && !canGoBlank;

        var btn = el(
          "button",
          {
            class:
              "modetab" +
              (current ? " modetab--on" : "") +
              (passed ? " modetab--done" : "") +
              (locked ? " modetab--locked" : ""),
            attrs: {
              type: "button",
              "aria-current": current ? "step" : null,
              "aria-disabled": locked ? "true" : null,
              title: locked ? "두 조건을 모두 돌려 본 뒤에 열립니다." : null
            }
          },
          [
            el("span", {
              class: "modetab__mark",
              attrs: { "aria-hidden": "true" },
              text: locked ? "🔒" : passed ? "✔" : String(i + 1)
            }),
            el("span", { class: "modetab__name", text: stage.label.replace(/^[①②③④]\s*/, "") })
          ]
        );
        btn.addEventListener("click", function () {
          /* ★ 잠겼는지는 «누르는 그때» 다시 본다.
             이 칸을 만든 뒤에 학생이 두 조건을 돌려 보았을 수 있다.
             («칸을 만들 때» 의 값으로 굳히면 화면을 다시 그려야만 열린다 —
             그러면 돌려 본 결과가 지워진다.) */
          var stillLocked =
            i === 1 && !ranBothOf(goal) && !app.getState()[goal].code.exampleRead;
          if (stillLocked) {
            UI.announce("두 조건을 모두 돌려 본 뒤에 열립니다.");
            return;
          }
          if (i !== atIndex) goTo(i);
        });

        return el("li", { class: "modetabs__item" }, [btn]);
      })
    );

    var now = L.CODE_STAGES[atIndex] || L.CODE_STAGES[0];
    return el("div", { class: "modenav" }, [
      tabs,
      el("p", { class: "modenav__note", text: now.detail })
    ]);
  }

  /**
   * ① 코드 읽고 돌려 보기.
   *
   * 한 자리에서 세 가지를 한다.
   *   · 전체 코드를 «설명과 나란히» 읽는다
   *   · 기준값을 사이에 둔 «두 조건» 으로 돌려 본다 (빛이 없을 때 / 밝을 때)
   *   · 두 조건을 모두 돌려 보아야 다음 차례가 열린다
   *
   * 돌려 보는 일은 «여기서만» 한다. 빈칸 채우기 차례에는 두지 않는다 —
   * 같은 일을 두 곳에 두면 화면이 다시 복잡해진다.
   */
  function stageRead(goal, part, app) {
    var source = A.REFERENCE_CODE[goal];
    var view = S.editor.codeView(source, {
      caption: "기준 프로그램 — 줄마다 하는 일을 «오른쪽» 에 적었습니다",
      /* ★ 설명을 코드 «옆» 에 붙인다. 따로 떨어진 목록으로 두면
         코드와 설명 사이를 눈으로 오가야 해서 읽기 어렵다. */
      notes: function (line) {
        return L.noteForLine(goal, line) || "";
      }
    });
    var mon = S.editor.monitor({ note: "Serial.println() 이 한 줄씩 여기에 옵니다." });
    var stats = el("div", { class: "runstats" });
    var pair = RUN_PAIR[goal] || RUN_PAIR.light;
    var done = ranPair[goal] || (ranPair[goal] = {});

    function statRow(label, value) {
      return el("div", { class: "runstat" }, [
        el("span", { class: "runstat__label", text: label }),
        el("span", { class: "runstat__value", text: value })
      ]);
    }

    /** 지금 어느 조건을 보고 있는지 — 값·조건식·LED 를 «글자» 로 함께 낸다 */
    function drawStats(condId, step) {
      UI.clear(stats);
      if (!condId) {
        /* ★ 아직 돌려 보지 않았을 때는 «아무것도» 적지 않는다.
           「아래 두 단추를 눌러 보세요」 는 바로 위의 진행 글이 이미 하는 말이었다. */
        ledPanel.set(null);
        return;
      }
      var cond = PC.conditionOf(goal, condId);
      var level = goal === "light" ? cond.lux : cond.moisture;
      var value = goal === "light" ? PC.lightValue(level) : PC.soilValue(level);
      var th = goal === "light" ? PC.LIGHT_THRESHOLD : PC.SOIL_DRY_THRESHOLD;
      var ledPin = (PC.PINS || {}).led;

      stats.appendChild(statRow("조건", cond.icon + " " + cond.label));
      stats.appendChild(statRow("센서값", String(value) + " / " + PC.ADC_MAX));
      stats.appendChild(statRow("val > " + th, value > th ? "True (참)" : "False (거짓)"));
      if (goal === "light") {
        var pinState = step && step.pins && step.pins[ledPin] ? step.pins[ledPin] : "—";
        stats.appendChild(statRow(ledPin, pinState));
        stats.appendChild(statRow("LED", pinState === "HIGH" ? "켜짐" : pinState === "LOW" ? "꺼짐" : "—"));
      } else {
        stats.appendChild(statRow("해석", PC.conditionOf("soil", PC.soilConditionOf(value)).label));
      }
      stats.appendChild(statRow("지금 실행 줄", step ? String(step.line) + "번 줄" : "—"));

      /* 옆의 시뮬레이션도 같은 것을 보인다 */
      if (goal === "light") {
        var pin = step && step.pins && step.pins[ledPin];
        ledPanel.set(pin === "HIGH" ? true : pin === "LOW" ? false : value > th);
      } else {
        ledPanel.set(value > th);
      }
    }

    /**
     * 결과 옆에 두는 «작은 시뮬레이션».
     *
     * 조도는 LED 가 켜지고 꺼지는 것을, 토양은 흙의 상태를 그림으로 보인다.
     * 숫자(센서값·조건식)만으로는 «그래서 무엇이 달라지는가» 가 와닿지 않는다.
     * 색만으로 알리지 않는다 — 아래에 «켜짐 / 꺼짐» 을 글자로 함께 적는다(명세 18장).
     */
    function buildLedPanel() {
      var svgNode = UI.svg("svg", {
        class: "ledsim__svg",
        viewBox: "0 0 120 150",
        role: "img",
        "aria-label": goal === "light" ? "LED 시뮬레이션" : "흙 상태 시뮬레이션"
      });
      var g = UI.svg("g", {});
      svgNode.appendChild(g);
      var word = el("p", { class: "ledsim__word" });
      var box = el("div", { class: "ledsim" }, [
        el("p", { class: "ledsim__head", text: goal === "light" ? "LED" : "흙 상태" }),
        svgNode,
        word
      ]);

      function paint(on) {
        UI.clear(g);
        if (goal === "light") {
          if (on) g.appendChild(UI.svg("circle", { cx: 60, cy: 58, r: 44, class: "ledsim__glow" }));
          /* 반원 몸통 + 다리 둘 — 결선 화면의 LED 와 같은 모양 */
          g.appendChild(
            UI.svg("path", {
              d: "M36 74 L36 58 A24 24 0 0 1 84 58 L84 74 Z",
              class: "ledsim__bulb" + (on ? " ledsim__bulb--on" : "")
            })
          );
          g.appendChild(UI.svg("line", { x1: 50, y1: 74, x2: 44, y2: 122, class: "ledsim__leg" }));
          g.appendChild(UI.svg("line", { x1: 70, y1: 74, x2: 76, y2: 108, class: "ledsim__leg" }));
          word.textContent = on === null ? "아직 돌려 보지 않았습니다" : on ? "켜짐 (HIGH)" : "꺼짐 (LOW)";
          word.className = "ledsim__word" + (on ? " ledsim__word--on" : "");
        } else {
          /* 토양 — 흙과 물기 */
          var wet = on === null ? 0 : on ? 0.15 : 0.6;
          g.appendChild(UI.svg("rect", { x: 14, y: 54, width: 92, height: 74, rx: 8, class: "ledsim__dirt" }));
          g.appendChild(
            UI.svg("rect", {
              x: 14, y: 54, width: 92, height: 74, rx: 8,
              class: "ledsim__water", opacity: String(wet)
            })
          );
          g.appendChild(UI.svg("rect", { x: 54, y: 22, width: 12, height: 84, rx: 3, class: "ledsim__blade" }));
          word.textContent =
            on === null ? "아직 돌려 보지 않았습니다" : on ? "마름 — 물이 필요합니다" : "젖음 — 물이 넉넉합니다";
          word.className = "ledsim__word" + (on ? " ledsim__word--on" : "");
        }
      }

      paint(null);
      return { root: box, set: paint };
    }

    var ledPanel = buildLedPanel();

    var watching = null;
    var player = S.editor.player(view, mon, {
      onStep: function (step) {
        drawStats(watching, step);
      },
      onFinish: function () {
        if (watching) done[watching] = true;
        markProgress();
      }
    });

    var progress = el("p", { class: "runpair__note" });

    function countDone() {
      return pair.filter(function (id) {
        return done[id];
      }).length;
    }

    function markProgress() {
      var n = countDone();
      progress.textContent =
        n >= pair.length
          ? "두 조건을 모두 돌려 보았습니다. 위의 «② 빈칸 채우기» 칸을 누르세요."
          : "돌려 본 조건 " + n + " / " + pair.length + " — 두 조건을 모두 돌려 보아야 ② 가 열립니다.";
      pair.forEach(function (id) {
        var b = document.getElementById("runcond-" + goal + "-" + id);
        if (!b) return;
        b.classList.toggle("runcard--done", !!done[id]);
        var mark = b.querySelector(".runcard__mark");
        var label = b.querySelector(".runcard__golabel");
        if (mark) mark.textContent = done[id] ? "✔" : "▶";
        if (label) label.textContent = done[id] ? "다시 돌려 보기" : "이 조건으로 돌려 보기";
      });
    }

    function runCondition(condId) {
      var cond = PC.conditionOf(goal, condId);
      var level = goal === "light" ? cond.lux : cond.moisture;
      var analog = {};
      analog[WORDS[goal].pin] = goal === "light" ? PC.lightValue(level) : PC.soilValue(level);
      watching = condId;
      drawStats(condId, null);
      var result = A.run(source, { analog: analog, loopLimit: 2 });
      player.load(result);
      player.play();
      /* 재생이 끝나기를 기다리지 않고도 «돌려 보았다» 로 친다 —
         끝까지 보지 않고 다음 조건을 눌러도 되게 하려는 것이다. */
      done[condId] = true;
      markProgress();

      /* 두 조건을 다 보면 ② 칸이 열린다.
         ★ 화면을 «다시 그리지 않는다» — 다시 그리면 방금 돌려 본 결과가 지워진다.
           자물쇠만 그 자리에서 푼다. (app.patch 는 화면을 다시 그리지 않는다) */
      if (countDone() >= pair.length) {
        app.patch(function (st) {
          st[goal].code.exampleRun = true;
          st[goal].code.ran = true;
          if (!st[goal].code.source) st[goal].code.source = source;
        });
        unlockBlankTab();
      }
    }

    /** ② 칸의 자물쇠를 그 자리에서 푼다 */
    function unlockBlankTab() {
      var tab = document.querySelector("#screen-root .modetab--locked");
      if (!tab) return;
      tab.classList.remove("modetab--locked");
      tab.removeAttribute("aria-disabled");
      tab.removeAttribute("title");
      var mark = tab.querySelector(".modetab__mark");
      if (mark) mark.textContent = "2";
    }

    /**
     * 두 조건 단추.
     *
     * ★ 앞판은 «▶ ▲ 건조» 처럼 넓은 파란 띠에 기호만 있었다.
     *   무엇을 누르는 것인지, 누르면 무엇이 되는지 알 수 없었다.
     *   그래서 한 단추에 세 가지를 담는다.
     *     ① 어떤 환경인가 (☾ 어두움 — 빛을 차단)
     *     ② 그때 센서값과 기준값의 관계 (990 · 기준 500 보다 큼)
     *     ③ 그래서 어떻게 되는가 (→ LED 켜짐)
     *   돌려 본 뒤에는 ▶ 가 ✔ 로 바뀐다 — 색만으로 알리지 않는다(명세 18장).
     */
    function runCard(id) {
      var cond = PC.conditionOf(goal, id);
      var level = goal === "light" ? cond.lux : cond.moisture;
      var value = goal === "light" ? PC.lightValue(level) : PC.soilValue(level);
      var th = goal === "light" ? PC.LIGHT_THRESHOLD : PC.SOIL_DRY_THRESHOLD;
      var over = value > th;
      var result =
        goal === "light" ? (over ? "LED 켜짐" : "LED 꺼짐") : over ? "마름" : "젖음";

      var go = el("span", { class: "runcard__go" }, [
        el("span", { class: "runcard__mark", attrs: { "aria-hidden": "true" }, text: "▶" }),
        el("span", { class: "runcard__golabel", text: "이 조건으로 돌려 보기" })
      ]);

      var b = el(
        "button",
        {
          class: "runcard" + (done[id] ? " runcard--done" : ""),
          attrs: {
            type: "button",
            "aria-label":
              cond.short +
              " — " +
              (cond.label !== cond.short ? cond.label : cond.meaning || "") +
              ". 센서값 " + value + ", 기준 " + th +
              " 보다 " + (over ? "큼" : "작음") + ", " + result + ". 이 조건으로 돌려 보기"
          }
        },
        [
          el("span", { class: "runcard__top" }, [
            el("span", { class: "runcard__icon", attrs: { "aria-hidden": "true" }, text: cond.icon }),
            el("span", { class: "runcard__name", text: cond.short }),
            /* 토양은 short 와 label 이 같은 말이다(«건조 건조» 가 되어 버린다).
               그때는 뜻(수분 적음·많음)을 대신 적는다. */
            el("span", {
              class: "runcard__label",
              text: cond.label !== cond.short ? cond.label : cond.meaning || ""
            })
          ]),
          el("span", { class: "runcard__sub" }, [
            el("span", { class: "runcard__value", text: "센서값 " + value }),
            el("span", { class: "runcard__cmp", text: "기준 " + th + " 보다 " + (over ? "큼" : "작음") }),
            el("span", { class: "runcard__result", text: "→ " + result })
          ]),
          go
        ]
      );
      b.id = "runcond-" + goal + "-" + id;
      b.addEventListener("click", function () {
        runCondition(id);
      });
      return b;
    }

    var runRow = el("div", { class: "runpair" });
    pair.forEach(function (id) {
      runRow.appendChild(runCard(id));
    });

    drawStats(null, null);
    markProgress();

    return el("div", { class: "stack" }, [
      UI.alert(
        "info",
        "먼저 «읽습니다». 오른쪽 설명을 보며 무엇을 하는 줄인지 확인한 뒤, 아래 두 조건으로 돌려 보세요."
      ),
      view.root,
      el("h4", { class: "subhead", text: "기준값 " + (goal === "light" ? PC.LIGHT_THRESHOLD : PC.SOIL_DRY_THRESHOLD) + " 을 사이에 둔 두 조건" }),
      runRow,
      progress,
      /* 값 범위는 «예시» 라고 값을 보이는 자리마다 알린다 (명세 11.3) */
      el("p", { class: "sim__warn", text: (PC.MESSAGES || {}).rawValueWarn || "" }),
      /* 왼쪽부터 «LED 시뮬레이션 → 값·조건식 → 시리얼» 순서다.
         눈으로 먼저 보고, 그 까닭을 숫자로 확인하고, 출력으로 확인한다. */
      el("div", { class: "runrow" }, [ledPanel.root, stats, mon.root])
    ]);
  }

  /**
   * ② 빈칸 채우기 — 여기서 «검사» 를 통과해야 C 가 열린다.
   *
   * ★ 앞판은 뒤에 「④ 전체 코드 수정」이 하나 더 있었고 검사도 거기서 했다.
   *   45분 한 차시에는 무거워 2026-08-25 에 뺐다(선생님 요청).
   *   그래서 빈칸을 모두 바르게 채우면 «그 자리에서» 검사를 돌려
   *   다음 단추를 열어 준다. 채운 코드가 곧 제출 코드가 된다.
   */
  function stageBlank(goal, part, app) {
    var tpl = A.BLANK_TEMPLATE[goal];
    var results = el("div", { class: "feedback" });

    var blanks = S.editor.blanks(goal, tpl, part.code.blanks, function (source, values, done) {
      app.patch(function (s) {
        s[goal].code.blanks = values;
        if (done) s[goal].code.source = source;
      });
      var btn = document.getElementById("blank-next-" + goal);
      if (btn) btn.disabled = !done;
    });

    /** 채운 코드를 실제로 검사한다 — 통과하면 C 가 열린다 */
    function runCheck() {
      var st = app.getState();
      var source = blanks.getSource();
      var check = A.validate(source, { goal: goal, connections: st[goal].circuit.connections });

      UI.clear(results);
      if (!check.syntax.ok) {
        results.appendChild(
          UI.alert("danger", (check.syntax.line ? check.syntax.line + "번 줄 — " : "") + check.syntax.message)
        );
      }
      /* 핀 불일치를 «따로» 알린다 (명세 14장 마지막 줄) */
      check.pinMismatch.forEach(function (m) {
        results.appendChild(
          UI.alert("danger", "코드와 회로의 핀이 다릅니다", [
            el("p", { class: "alert__why", text: m.message }),
            el("p", { class: "alert__fix", text: "회로 핀과 코드 핀은 반드시 같아야 합니다." })
          ])
        );
      });
      var list = el("ul", { class: "condlist" });
      check.results.forEach(function (r) {
        list.appendChild(UI.conditionRow(r.label, r.ok, r.ok ? "" : r.fix));
      });
      results.appendChild(
        el("p", { class: "expresult__head", text: "검사 " + check.passed + " / " + check.total + " 통과" })
      );
      results.appendChild(list);

      app.update(function (s) {
        s[goal].code.attempts += 1;
        s[goal].code.testsPassed = check.passed;
        s[goal].code.testsTotal = check.total;
        s[goal].code.passed = check.ok;
        s[goal].code.blanksDone = check.ok;
        s[goal].code.source = source;
        s[goal].code.syntaxError = check.syntax.ok ? null : check.syntax;
        s[goal].code.pinMismatch = check.pinMismatch;
      });
      UI.announce(check.ok ? "코드 검사를 통과했습니다." : check.passed + "개를 통과했습니다.");
    }

    var nextBtn = UI.button("다 채웠습니다 — 검사하기", { click: runCheck });
    nextBtn.id = "blank-next-" + goal;
    nextBtn.disabled = !blanks.isDone();

    /* ★ 검사를 누르면 화면이 통째로 다시 그려져 방금 그린 결과가 사라진다.
       그러니 «저장된 결과» 로 다시 그린다 — 무엇이 통과했는지 남아 있어야 한다. */
    if (part.code.attempts > 0) {
      results.appendChild(
        el("p", {
          class: "expresult__head",
          text: "검사 " + part.code.testsPassed + " / " + (part.code.testsTotal || "?") + " 통과"
        })
      );
      if (part.code.passed) {
        results.appendChild(UI.alert("ok", "코드 검사를 모두 통과했습니다. 아래 C 에서 조건별로 실행해 봅시다."));
      }
    }

    return el("div", { class: "stack" }, [
      UI.alert("info", "핵심이 되는 자리만 비워 두었습니다. 앞에서 읽은 것을 떠올려 채워 보세요."),
      blanks.root,
      /* ★ 「채운 코드 보기」 단추를 없앴다 (2026-08-25).
         위의 빈칸 상자가 이미 «채운 값이 들어간 코드 전체» 를 보이고 있어서,
         누르면 같은 코드가 두 번 나왔다. */
      el("div", { class: "btnrow btnrow--one" }, [nextBtn]),
      results
    ]);
  }

  function codeSection(goal, part, app) {
    var stage = codeStageOf(part);
    var body = stage === "read" ? stageRead(goal, part, app) : stageBlank(goal, part, app);


    return el("div", { class: "panel" }, [
      el("div", { class: "panel__head" }, [
        el("h3", { class: "panel__title", text: "B. 텍스트 코딩" }),
        el("span", {
          class: "badge" + (part.code.passed ? " badge--true" : ""),
          text: part.code.passed ? "검사 통과" : part.code.testsPassed + " / " + (part.code.testsTotal || "?")
        })
      ]),
      stageTabs(part, goal, app),
      body
    ]);
  }

  /* ------------------------------------------------------------------ */
  /* D. 선택 확장 — 토양수분만 (명세 12장)                                  */
  /* ------------------------------------------------------------------ */

  function extensionSection(part, app) {
    return UI.foldout("선택 확장 — «물을 주세요» 메시지 넣기 (빨리 마친 사람)", function () {
      var mon = S.editor.monitor({});

      /**
       * ★ 2026-08-25 에 이 칸의 «편집기» 를 뺐다(선생님 요청).
       *   바로 위에 같은 코드가 이미 «참고 — 확장 코드» 로 나와 있어서
       *   같은 코드가 두 번 보였다. B 의 「전체 코드 수정」을 뺀 것과 같은 까닭이다.
       *   그래서 이 칸은 «읽고 돌려 보는» 활동이 된다.
       *   확장 코드는 손대지 않으므로 제출에는 기준 코드가 그대로 담긴다.
       */
      var source = A.SOIL_EXT_CODE;

      function runBoth() {
        var dry = A.run(source, { analog: { A1: 900 }, loopLimit: 1 });
        var wet = A.run(source, { analog: { A1: 300 }, loopLimit: 1 });
        var lines = [];
        lines.push({ t: 0, text: "── 건조 (원시값 900) ──" });
        (dry.serial || []).forEach(function (line) {
          lines.push(line);
        });
        lines.push({ t: 0, text: "── 습함 (원시값 300) ──" });
        (wet.serial || []).forEach(function (line) {
          lines.push(line);
        });
        mon.show(lines);
        app.patch(function (st) {
          st.soil.extension.tried = true;
          st.soil.extension.source = source;
        });
      }

      return el("div", { class: "stack" }, [
        el("p", {
          class: "para",
          text:
            "건조 기준값보다 크면 «물을 주세요», 그렇지 않으면 «수분이 충분합니다» 를 출력하는 코드입니다. " +
            "두 조건으로 돌려 보고 무엇이 나오는지 확인해 봅시다."
        }),
        UI.codeBlock(source, "확장 코드"),
        el("div", { class: "btnrow btnrow--one" }, [
          UI.button("두 조건으로 돌려 보기", { class: "btn btn--primary btn--small", click: runBoth })
        ]),
        mon.root
      ]);
    });
  }

  /* ------------------------------------------------------------------ */
  /* 화면 하나 만들기                                                     */
  /* ------------------------------------------------------------------ */

  /**
   * goal 에 맞는 실습 화면을 만든다.
   * s60-screens.js 의 S.screens.light 와 S.screens.soil 이 이것을 부른다.
   */
  function build(goal, state, app) {
    var part = state[goal];
    var w = WORDS[goal];
    var gate = PC.schema.checkStep(goal, state);

    var head = el("header", { class: "section-title" }, [
      el("p", { class: "section-title__tag", text: w.eyebrow }),
      el("h2", { text: w.title }),
      el("p", {
        class: "para",
        text:
          w.sensor +
          " 를 " +
          w.pin +
          " 에 잇고, 코드로 값을 읽어 조건마다 어떻게 달라지는지 기록합니다."
      })
    ]);

    var parts = [head];

    /* A — 회로 */
    if (!part.circuit.findDone) {
      parts.push(findSection(goal, part, app));
    } else {
      parts.push(findSection(goal, part, app));
      parts.push(wireSection(goal, part, app));
    }

    /* B — 코딩 : 회로를 통과한 뒤에 연다 (명세 22장 «회로 핀과 코드 핀은 반드시 일치») */
    if (part.circuit.completed) {
      parts.push(codeSection(goal, part, app));
    } else {
      parts.push(
        el("div", { class: "panel panel--locked" }, [
          el("h3", { class: "panel__title", text: "B. 텍스트 코딩" }),
          UI.alert("info", "먼저 A 의 회로 검사를 통과해야 코딩이 열립니다. 회로와 코드의 핀이 같아야 하기 때문입니다.")
        ])
      );
    }

    /* ★ 「C. 조건별 실행과 기록」 칸은 2026-08-25 에 뺐다(선생님 요청).
         슬라이더·눈금판·시리얼 모니터가 B ① 의 «두 조건 돌려 보기» 와 겹쳤고,
         세 조건마다 «예상 → 실행 → 관찰» 을 적는 칸까지 있어 한 차시에 무거웠다.
       남은 것 — 토양수분(4단계)의 선택 확장 「물을 주세요」는 그대로 둔다. */
    if (part.code.passed && goal === "soil") {
      parts.push(extensionSection(part, app));
    }

    /* 다 마쳤을 때만 한 줄 알린다.
       ★ 「이 단계를 마치려면」 목록은 2026-08-25 에 뺐다(선생님 요청).
         잠긴 칸이 이미 «무엇을 먼저 해야 하는지» 를 그 자리에서 말하고 있어
         화면 아래에 같은 말을 또 늘어놓을 까닭이 없었다.
         [다음] 단추가 열리고 닫히는 규칙은 그대로다(schema.js 의 canGoTo). */
    if (gate.ok) {
      parts.push(UI.alert("ok", w.eyebrow + " 를 모두 마쳤습니다. 아래 [다음] 으로 넘어가세요."));
    }

    return el("div", { class: "stack" }, parts);
  }

  S.sensorScreen = { build: build, WORDS: WORDS, codeStageOf: codeStageOf };
})();
    </script>
    <script data-from="student/s60-screens.js">
/**
 * 학생용 화면 여섯 장 (명세 6장 ~ 13장)
 *
 *   1 시작하기        명세 7장
 *   2 두 센서 원리     명세 8장
 *   3 조도센서 실습    명세 10장   → s65-sensor.js 가 만든다
 *   4 토양수분 실습    명세 11장   → s65-sensor.js 가 만든다
 *   5 비교·적용        명세 12장
 *   6 형성평가·제출    명세 13장 · 15장
 *
 * 화면은 «상태를 읽어 그리기만» 한다. 판정은 shared/ 가 한다.
 * 학생이 적은 글은 innerHTML 이 아니라 textContent 로만 내보낸다(명세 18장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;
  var L = PC.lesson;
  var Q = PC.quiz;

  /* ================================================================== */
  /* 1. 시작하기 (명세 7장)                                               */
  /* ================================================================== */

  /**
   * 표시 순서는 명세 7장 그대로다 —
   * 눈길 문구 → 제목·부제 → 학습 목표 5개 → 학습 흐름 → 예상 시간 → 안전 수칙 → 시작 단추.
   *
   * ★ «아직 배우지 않은 내용을 1단계에서 질문하지 않는다»(명세 7장 마지막 줄).
   *   그래서 이 화면에는 문항이 하나도 없다. 넘어가는 조건은 «안전 수칙 확인» 하나다.
   */
  function intro(state, app) {
    var minutes = (PC.STEPS || []).reduce(function (sum, s) {
      return sum + (s.minutes || 0);
    }, 0);

    /* 학습 목표 */
    var goals = el("ol", { class: "goal-list" });
    (PC.GOALS || []).forEach(function (text, i) {
      goals.appendChild(
        el("li", { class: "goal-item" }, [
          el("span", { class: "goal-item__num", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
          el("span", { class: "goal-item__text", text: text })
        ])
      );
    });

    /* 학습 흐름 */
    var flow = el("ol", { class: "flow" });
    (PC.FLOW || []).forEach(function (label, i) {
      flow.appendChild(
        el("li", { class: "flow__step" }, [
          el("span", { class: "flow__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
          el("span", { class: "flow__label", text: label })
        ])
      );
    });

    /* 안전 수칙 */
    var safety = el("ol", { class: "safety" });
    (PC.SAFETY || []).forEach(function (text) {
      safety.appendChild(
        el("li", { class: "safety__item" }, [
          el("span", { class: "safety__mark", attrs: { "aria-hidden": "true" }, text: "!" }),
          el("span", { text: text })
        ])
      );
    });

    var checkbox = el("input", { class: "check__input", attrs: { type: "checkbox", id: "safety-read" } });
    checkbox.checked = state.intro.safetyRead === true;
    checkbox.addEventListener("change", function () {
      app.update(function (s) {
        s.intro.safetyRead = checkbox.checked;
      });
    });

    return el("div", { class: "stack" }, [
      el("section", { class: "hero" }, [
        el("p", { class: "hero__catch", text: PC.LESSON_HOOK }),

        }),

            "먼저 원리를 보고, 각각 회로와 코드를 다루어 본 뒤, 마지막에 견주어 봅니다."

      state.intro.safetyRead

              }
