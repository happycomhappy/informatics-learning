  var UNO = buildUno();
  var BB = buildBreadboard();
  var CDS = buildCds();
  var LED = buildLed();
  var RES = buildResistor();
  var SOIL = buildSoil();
  var PROBE = buildProbe();

  var COMPONENTS = {};
  [UNO, BB, CDS, LED, RES, SOIL, PROBE].forEach(function (c) {
    COMPONENTS[c.id] = c;
  });

  /** 실습마다 화면에 내놓는 부품 (명세 10.1 · 11.1) */
  /**
   * 실습마다 화면에 내놓는 부품 (명세 10.1 · 11.1)
   *
   *   parts      결선할 때 — 우노와 브레드보드까지 모두
   *   findParts  «단자 찾기» 를 할 때 — 답이 있는 부품만
   *
   * ★ 단자 찾기에 우노와 브레드보드를 함께 내놓지 않는 까닭
   *   찾는 답은 언제나 «센서 모듈이나 부품의 단자» 다. 우노의 헤더 스무 개와
   *   브레드보드 구멍 백스무 개를 함께 두면 눌러야 할 곳이 묻힌다.
   *   결선(A-2)에 가서야 우노와 브레드보드가 필요하다.
   */
  var SCENES = {
    light: {
      parts: ["uno", "bb", "cds", "led", "res"],
      findParts: ["cds", "led"],
      /* ★ 「단자 찾기」 화면은 부품을 «세로로» 쌓는다.
         결선 화면은 넓고 낮아야 하고(브레드보드가 옆에 있다),
         찾기 화면은 좁고 높아야 한다(틀이 좁을수록 그림이 크게 그려지고
         누르는 단자가 44px 을 넘는다 — 명세 18장).
         두 가지를 한 배치로는 채울 수 없어 «찾기 전용 자리» 를 따로 둔다. */
      findLayout: { cds: { x: 560, y: 24 }, led: { x: 560, y: 208 } },
      label: "조도센서 실습"
    },
    soil: {
      parts: ["uno", "bb", "soil", "probe"],
      /* ★ 탐침도 함께 낸다.
         모듈 하나만 내면 틀이 짧고 넓어져 그림이 2.3배로 부풀었다 —
         「비교기 모듈」 글자와 나사가 화면을 가득 채워 다른 화면과 딴판이었다.
         조도(모듈 + LED)처럼 «둘을 세로로» 두면 틀의 비율이 같아져
         3단계와 같은 크기로 그려진다. */
      findParts: ["soil", "probe"],
      findLayout: { soil: { x: 560, y: 24 }, probe: { x: 560, y: 230 } },
      label: "토양수분 실습"
    }
  };

  /* ------------------------------------------------------------------ */
  /* 2. 단자 찾기와 이름                                                  */
  /* ------------------------------------------------------------------ */

  function terminal(componentId, pinId) {
    var comp = COMPONENTS[componentId];
    if (!comp) return null;
    var found = null;
    comp.pins.forEach(function (p) {
      if (p.id === pinId) found = p;
    });
    return found;
  }

  /** 단자를 사람이 읽는 말로 — 「우노 5V」 처럼 */
  function describe(componentId, pinId) {
    var comp = COMPONENTS[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return componentId + " " + pinId;
    return comp.short + " " + (pin.short || pin.label);
  }

  /**
   * 이 단자가 속한 전기적 마디.
   *
   *   우노 GND1·GND2 → "uno:GND"          (보드 안에서 이어져 있다)
   *   브레드보드 A3   → "bb:top:3"          (같은 열 다섯 구멍이 한 마디)
   *   브레드보드 ＋   → "bb:rail:plus"      (레일 전체가 한 마디)
   *   그 밖          → "부품:단자"
   */
  function nodeOf(componentId, pinId) {
    if (componentId === "uno" && /^GND\d*$/.test(pinId)) return "uno:GND";
    if (componentId === "bb") {
      var pin = terminal("bb", pinId);
      if (!pin) return "bb:" + pinId;
      if (pin.kind === "rail") return "bb:rail:" + pin.rail;
      return "bb:" + pin.group + ":" + pin.col;
    }
    return componentId + ":" + pinId;
  }

  /** 마디를 사람이 읽는 말로 */
  function nodeLabel(node) {
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("bb:rail:") === 0) {
      return "브레드보드 " + (node.indexOf("plus") > 0 ? "＋" : "−") + " 레일";
    }
    if (node.indexOf("bb:") === 0) {
      var bits = node.split(":");
      return "브레드보드 " + bits[2] + "번 열(" + (bits[1] === "top" ? "A~E" : "F~J") + ")";
    }
    var parts = node.split(":");
    return describe(parts[0], parts[1]);
  }

  /* ------------------------------------------------------------------ */
  /* 3. 케이블                                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 하나를 만든다. 두 끝의 순서는 «뜻이 없다» — 항상 같은 순서로 담아
   * 「A→B」 와 「B→A」 가 같은 케이블로 세어지게 한다.
   */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin) || !terminal(to.component, to.pin)) return null;
    /* 같은 단자를 자기 자신과 잇는 것은 케이블이 아니다 */
    if (from.component === to.component && from.pin === to.pin) return null;

    var a = from.component + ":" + from.pin;
    var b = to.component + ":" + to.pin;
    var flip = a > b;
    var s = flip ? to : from;
    var e = flip ? from : to;

    return {
      fromComponent: s.component,
      fromPin: s.pin,
      toComponent: e.component,
      toPin: e.pin,
      /* 색은 «읽기 쉬우려고» 있는 것이다. 정오 판정에 쓰지 않는다(명세 9장) */
      color: color || null
    };
  }

  function connectionKey(conn) {
    if (!conn) return "";
    return conn.fromComponent + ":" + conn.fromPin + "|" + conn.toComponent + ":" + conn.toPin;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /** 회로의 어느 쪽 케이블인지 보고 색을 고른다 (읽기 편하도록) */
  function suggestColor(from, to) {
    var nodes = [nodeOf(from.component, from.pin), nodeOf(to.component, to.pin)];
    var touchesGround = nodes.some(function (n) {
      return n === "uno:GND" || n === "cds:GND" || n === "soil:GND" || n === "led:K" || n === "bb:rail:minus";
    });
    var touchesPower = nodes.some(function (n) {
      return n === "uno:5V" || n === "cds:VCC" || n === "soil:VCC" || n === "bb:rail:plus";
    });
    if (touchesPower) return "red";
    if (touchesGround) return "blue";
    return "orange";
  }

  /* ------------------------------------------------------------------ */
  /* 4. 마디 합치기 (union-find)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블이 합친 마디들을 푼다.
   * 돌려주는 것 : { find(node), members(node), nodes }
   */
  function solve(connections) {
    var parent = {};

    function root(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = root(a);
      var rb = root(b);
      if (ra === rb) return;
      /* 이름이 앞선 쪽을 대표로 둔다 — 결과가 «늘 같은 모양» 이어야 테스트가 쉽다 */
      if (ra < rb) parent[rb] = ra;
      else parent[ra] = rb;
    }

    (connections || []).forEach(function (conn) {
      if (!conn) return;
      union(nodeOf(conn.fromComponent, conn.fromPin), nodeOf(conn.toComponent, conn.toPin));
    });

    return {
      find: root,
      same: function (a, b) {
        return root(a) === root(b);
      },
      members: function (node) {
        var r = root(node);
        return Object.keys(parent).filter(function (n) {
          return root(n) === r;
        });
      },
      nodes: function () {
        return Object.keys(parent);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 소자를 지나는 길 찾기                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 두 마디 사이에 «걸쳐» 있는 소자들.
   *   symmetric  : 방향이 없다 (저항)
   *   그 밖       : a → b 로만 전류가 흐른다 (LED)
   */
  var DEVICES = [
    { id: "res", a: "R1", b: "R2", symmetric: true, word: RESISTOR_OHM + "Ω 저항" },
    { id: "led", a: "A", b: "K", symmetric: false, word: "LED" }
  ];

  /**
   * from 마디에서 to 마디까지 소자를 지나 가는 길을 모두 찾는다 (명세 10.1)
   *
   * 돌려주는 것 : [ [소자 id, …], … ]   ← 지나간 소자의 순서
   * 길이 없으면 빈 배열.
   */
  function pathsBetween(net, fromNode, toNode) {
    var out = [];

    function walk(node, used, trail) {
      if (net.same(node, toNode) && trail.length > 0) {
        out.push(trail.slice());
        return;
      }
      if (trail.length > 4) return; /* 이 차시의 회로는 소자 네 개를 넘지 않는다 */

      DEVICES.forEach(function (dev) {
        if (used[dev.id]) return;
        var ends = dev.symmetric
          ? [[dev.a, dev.b], [dev.b, dev.a]]
          : [[dev.a, dev.b]];
        ends.forEach(function (pair) {
          var inNode = dev.id + ":" + pair[0];
          var outNode = dev.id + ":" + pair[1];
          if (!net.same(node, inNode)) return;
          used[dev.id] = true;
          trail.push(dev.id);
          walk(outNode, used, trail);
          trail.pop();
          used[dev.id] = false;
        });
      });
    }

    walk(fromNode, {}, []);
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 6. 실습별 «해야 할 연결»                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 요구 하나 = { id, label, kind, check(net, connections) }
   *   kind 'node'  : 두 마디가 같아야 한다
   *   kind 'path'  : 소자를 지나는 직렬 회로가 있어야 한다
   *   kind 'pair'  : 두 쌍이 서로 이어져야 한다 (어느 쪽이 어느 쪽이든)
   */
  var REQUIRED = {
    light: [
      {
        id: "cds-vcc",
        label: "우노 5V → 조도센서 모듈 VCC",
        short: "5V-VCC",
        kind: "node",
        a: "uno:5V",
        b: "cds:VCC",
        why: "모듈에 전기가 들어가야 센서가 값을 만든다."
      },
      {
        id: "cds-ao",
        label: "우노 " + PINS.cds + " → 조도센서 모듈 AO",
        short: PINS.cds + "-AO",
        kind: "node",
        a: "uno:" + PINS.cds,
        b: "cds:AO",
        why: "AO 는 «연속값» 이 나오는 단자다. analogRead(" + PINS.cds + ") 가 이 선을 읽는다."
      },
      {
        id: "cds-gnd",
        label: "우노 GND → 조도센서 모듈 GND",
        short: "GND-GND",
        kind: "node",
        a: "uno:GND",
        b: "cds:GND",
        why: "전류가 돌아갈 길이 없으면 값이 뜬다."
      },
      {
        id: "led-series",
        label: "우노 " + PINS.led + " → " + RESISTOR_OHM + "Ω 저항 → LED 양극, LED 음극 → GND",
        short: PINS.led + "-저항-LED-GND",
        kind: "path",
        from: "uno:" + PINS.led,
        to: "uno:GND",
        needs: ["res", "led"],
        why:
          "저항이 LED 앞에 있어도 뒤에 있어도 «같은 직렬 회로» 다(명세 10.1). " +
          "다만 저항이 아예 없으면 LED 가 상한다."
      }
    ],
    soil: [
      {
        id: "soil-vcc",
        label: "우노 5V → 토양수분 모듈 VCC",
        short: "5V-VCC",
        kind: "node",
        a: "uno:5V",
        b: "soil:VCC",
        why: "제조사마다 핀 순서가 다르다. «자리» 가 아니라 VCC 라고 적힌 «글자» 를 읽는다."
      },
      {
        id: "soil-ao",
        label: "우노 " + PINS.soil + " → 토양수분 모듈 AO",
        short: PINS.soil + "-AO",
        kind: "node",
        a: "uno:" + PINS.soil,
        b: "soil:AO",
        why: "AO 로 읽어야 원시 아날로그값이 온다. DO 로 읽으면 0 또는 1 만 온다."
      },
      {
        id: "soil-gnd",
        label: "우노 GND → 토양수분 모듈 GND",
        short: "GND-GND",
        kind: "node",
        a: "uno:GND",
        b: "soil:GND",
        why: "접지가 없으면 값이 흔들린다."
      },
      {
        id: "soil-probe",
        label: "탐침 2핀 → 비교기 모듈의 탐침 입력 2핀",
        short: "탐침-모듈",
        kind: "pair",
        pairs: [
          ["probe:T1", "probe:T2"],
          ["soil:P1", "soil:P2"]
        ],
        why: "탐침의 두 선은 서로 구분이 없다. 어느 쪽을 어느 입력에 꽂아도 된다."
      }
    ]
  };

  /** 실습의 목표를 한 줄로 (명세 6장 통과 조건) */
  var GOAL = {
    light: "조도센서 모듈 세 단자와 LED 직렬 회로를 모두 잇는다.",
    soil: "토양수분 모듈 세 단자와 탐침 두 선을 모두 잇는다."
  };

  /* ------------------------------------------------------------------ */
  /* 7. 요구 하나하나 확인                                                 */
  /* ------------------------------------------------------------------ */

  function checkRequirement(req, net) {
    if (req.kind === "node") {
      return { id: req.id, ok: net.same(req.a, req.b), label: req.label, short: req.short };
    }
    if (req.kind === "path") {
      var paths = pathsBetween(net, req.from, req.to);
      var good = paths.filter(function (trail) {
        return req.needs.every(function (id) {
          return trail.indexOf(id) !== -1;
        });
      });
      return { id: req.id, ok: good.length > 0, label: req.label, short: req.short, paths: paths };
    }
    if (req.kind === "pair") {
      var left = req.pairs[0];
      var right = req.pairs[1];
      /* 짝을 어떻게 맞춰도 «두 쌍이 각각» 이어져 있으면 된다 */
      var straight = net.same(left[0], right[0]) && net.same(left[1], right[1]);
      var crossed = net.same(left[0], right[1]) && net.same(left[1], right[0]);
      /* 두 탐침이 «같은 마디» 로 합쳐지면 흙을 재는 것이 아니라 그냥 단락이다 */
      var shorted = net.same(left[0], left[1]);
      return {
        id: req.id,
        ok: (straight || crossed) && !shorted,
        shorted: shorted,
        label: req.label,
        short: req.short
      };
    }
    return { id: req.id, ok: false, label: req.label, short: req.short };
  }

  /** 실습 하나의 요구를 모두 확인한다 */
  function goalStatus(goal, connections) {
    var net = solve(connections);
    var list = (REQUIRED[goal] || []).map(function (req) {
      var got = checkRequirement(req, net);
      got.why = req.why;
      return got;
    });
    var done = list.filter(function (r) {
      return r.ok;
    }).length;
    return { items: list, done: done, total: list.length, ok: done === list.length };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 위험 — 전원을 넣으면 안 되는 회로 (명세 9장)                         */
  /* ------------------------------------------------------------------ */

  var DANGER_RULES = [
    {
      id: "power-short",
      title: "5V 와 GND 가 바로 이어졌습니다",
      detail:
        "전기가 부품을 지나지 않고 그대로 돌아갑니다. 큰 전류가 흘러 보드가 상합니다. " +
        "5V 와 GND 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      id: "led-no-resistor",
      title: "LED 에 저항이 없습니다",
      detail:
        "LED 가 " +
        PINS.led +
        " 와 GND 사이에 저항 없이 들어가 있습니다. 전류가 너무 많이 흘러 LED 가 상합니다.",
      fix: RESISTOR_OHM + "Ω 저항을 LED 앞이나 뒤에 직렬로 넣으세요."
    },
    {
      id: "cds-reversed",
      title: "조도센서 모듈의 VCC 와 GND 가 거꾸로입니다",
      detail: "VCC 가 GND 쪽에, GND 가 5V 쪽에 붙었습니다. 모듈이 상할 수 있습니다.",
      fix: "VCC 는 5V 로, GND 는 GND 로 바꿔 주세요."
    },
    {
      id: "soil-reversed",
      title: "토양수분 모듈의 VCC 와 GND 가 거꾸로입니다",
      detail: "VCC 가 GND 쪽에, GND 가 5V 쪽에 붙었습니다. 모듈이 상할 수 있습니다.",
      fix: "VCC 는 5V 로, GND 는 GND 로 바꿔 주세요."
    },
    {
      id: "ao-to-power",
      title: "신호 단자(AO)가 전원에 붙었습니다",
      detail: "AO 는 «값이 나오는» 단자입니다. 5V 나 GND 에 바로 붙이면 값을 읽을 수 없고 모듈이 상할 수 있습니다.",
      fix: "AO 는 아날로그 입력(" + PINS.cds + " 또는 " + PINS.soil + ")으로만 이으세요."
    }
  ];

  function dangerById(id) {
    var found = null;
    DANGER_RULES.forEach(function (r) {
      if (r.id === id) found = r;
    });
    return found;
  }

  /** 지금 회로의 위험을 모두 찾는다 */
  function dangers(goal, connections) {
    var net = solve(connections);
    var out = [];

    function add(id, extra) {
      var rule = dangerById(id);
      if (!rule) return;
      var item = { id: rule.id, title: rule.title, detail: rule.detail, fix: rule.fix };
      if (extra) item.detail = rule.detail + " " + extra;
      out.push(item);
    }

    /* ① 전원 직결 — 5V 와 GND 가 «케이블만으로» 이어졌는가 */
    if (net.same("uno:5V", "uno:GND")) add("power-short");

    /* ② LED 무저항 — D2→GND 길에 LED 는 있는데 저항이 없는 길이 있는가 */
    if (goal === "light") {
      var paths = pathsBetween(net, "uno:" + PINS.led, "uno:GND");
      var bare = paths.some(function (trail) {
        return trail.indexOf("led") !== -1 && trail.indexOf("res") === -1;
      });
      if (bare) add("led-no-resistor");
    }

    /* ③ 모듈 역결선 */
    if (net.same("cds:VCC", "uno:GND") && net.same("cds:GND", "uno:5V")) add("cds-reversed");
    if (net.same("soil:VCC", "uno:GND") && net.same("soil:GND", "uno:5V")) add("soil-reversed");

    /* ④ 신호 단자를 전원에 붙였는가 */
    ["cds:AO", "soil:AO"].forEach(function (node) {
      if (net.same(node, "uno:5V") || net.same(node, "uno:GND")) {
        add("ao-to-power", "(" + nodeLabel(node) + ")");
      }
    });

    /* 같은 위험을 두 번 적지 않는다 */
    var seen = {};
    return out.filter(function (d) {
      if (seen[d.id]) return false;
      seen[d.id] = true;
      return true;
    });
  }

  /** 전원을 넣어도 되는가 (명세 9장 «5V-GND 단락, 역결선, LED 무저항은 전원 인가를 막는다») */
  function canPowerOn(goal, connections) {
    var list = dangers(goal, connections);
    if (list.length > 0) {
      return { ok: false, reason: list[0].title, dangers: list };
    }
    return { ok: true, reason: "", dangers: [] };
  }

  /* ------------------------------------------------------------------ */
  /* 9. 오류를 «서로 다른 원인» 으로 갈라 알려 주기 (명세 9장 · 16.1)         */
  /* ------------------------------------------------------------------ */

  /** 케이블이 하나도 닿지 않은 단자들 — 「꽂는 것을 잊었다」 */
  function floatingLeads(goal, connections) {
    var used = {};
    (connections || []).forEach(function (c) {
      used[c.fromComponent + ":" + c.fromPin] = true;
      used[c.toComponent + ":" + c.toPin] = true;
    });

    var out = [];
    var parts = (SCENES[goal] || SCENES.light).parts;
    parts.forEach(function (id) {
      if (id === "uno" || id === "bb") return; /* 우노와 브레드보드는 남는 구멍이 있는 것이 정상 */
      COMPONENTS[id].pins.forEach(function (pin) {
        /* DO 는 이 차시에서 쓰지 않는다. 안 꽂혀 있는 것이 정상이다. */
        if (id === "soil" && pin.id === "DO") return;
        if (!used[id + ":" + pin.id]) out.push({ component: id, pin: pin.id, label: describe(id, pin.id) });
      });
    });
    return out;
  }

  /** 회로에 쓰이지 않는 케이블 — 「지워도 되는 선」 */
  function strayWires(goal, connections) {
    var status = goalStatus(goal, connections);
    if (!status.ok) return [];

    var out = [];
    (connections || []).forEach(function (conn, i) {
      var without = (connections || []).filter(function (_, j) {
        return j !== i;
      });
      /* 이 케이블을 지워도 통과하고, 위험도 늘지 않으면 «쓰이지 않는» 선이다 */
      if (goalStatus(goal, without).ok && dangers(goal, without).length <= dangers(goal, connections).length) {
        out.push({ index: i, connection: conn, label: labelOfConnection(conn) });
      }
    });
    return out;
  }

  function labelOfConnection(conn) {
    if (!conn) return "";
    return (
      describe(conn.fromComponent, conn.fromPin) + " ↔ " + describe(conn.toComponent, conn.toPin)
    );
  }

  /**
   * 회로 판정 — 화면이 그대로 보여 줄 수 있는 결과를 돌려준다.
   *
   * 돌려주는 것
   *   ok        모두 통과했는가 (위험이 없고 요구가 다 찼는가)
   *   status    요구 하나하나
   *   errors    [{ code, title, detail, fix }]
   *   dangers   위험 목록
   */
  function checkCircuit(goal, connections) {
    var conns = connections || [];
    var net = solve(conns);
    var status = goalStatus(goal, conns);
    var risky = dangers(goal, conns);
    var errors = [];

    /* ── ① 위험이 곧 오류다 ── */
    risky.forEach(function (d) {
      errors.push({ code: d.id, title: d.title, detail: d.detail, fix: d.fix });
    });

    /* ── ② AO 와 DO 혼동 (명세 11.1 · 16.1) ── */
    if (goal === "soil") {
      var aoOnAnalog = net.same("soil:AO", "uno:" + PINS.soil);
      var doOnAnalog = net.same("soil:DO", "uno:" + PINS.soil);
      if (doOnAnalog && !aoOnAnalog) {
        errors.push({
          code: "ao-do-swap",
          title: "AO 대신 DO 를 " + PINS.soil + " 에 이었습니다",
          detail:
            "DO 는 «가변저항으로 정한 기준을 넘었는가» 만 알려 주는 디지털 출력입니다. " +
            "그대로 읽으면 원시 아날로그값이 아니라 0 또는 1 만 오게 됩니다.",
          fix: "AO 를 " + PINS.soil + " 로 옮기세요. DO 는 이 차시에서 쓰지 않습니다."
        });
      }
    }

    /* ── ③ LED 역극성 (명세 9장 · 16.1) ── */
    if (goal === "light") {
      var forward = pathsBetween(net, "uno:" + PINS.led, "uno:GND").some(function (t) {
        return t.indexOf("led") !== -1;
      });
      var backward = pathsBetween(net, "uno:GND", "uno:" + PINS.led).some(function (t) {
        return t.indexOf("led") !== -1;
      });
      if (!forward && backward) {
        errors.push({
          code: "led-reversed",
          title: "LED 를 거꾸로 꽂았습니다",
          detail:
            "긴 다리(양극)가 GND 쪽, 짧은 다리(음극)가 " +
            PINS.led +
            " 쪽에 있습니다. LED 는 한쪽으로만 전류를 지나게 하므로 이대로는 켜지지 않습니다.",
          fix: "긴 다리를 " + PINS.led + " 쪽(저항 쪽)으로, 짧은 다리를 GND 쪽으로 바꿔 꽂으세요."
        });
      }
    }

    /* ── ④ 탐침 단락 ── */
    var probeReq = status.items.filter(function (r) {
      return r.id === "soil-probe";
    })[0];
    if (probeReq && probeReq.shorted) {
      errors.push({
        code: "probe-short",
        title: "탐침의 두 선이 서로 이어져 있습니다",
        detail: "두 선이 한 마디로 합쳐지면 흙의 저항을 재는 것이 아니라 그냥 단락입니다.",
        fix: "탐침 선 하나는 P1, 다른 하나는 P2 로 «따로» 이으세요."
      });
    }

    /* ── ⑤ 아직 남은 연결 (핀 누락) ── */
    status.items.forEach(function (item) {
      if (item.ok) return;
      /* 위험이나 위 오류로 이미 설명한 것은 두 번 적지 않는다 */
      if (item.id === "soil-probe" && probeReq && probeReq.shorted) return;
      if (item.id === "soil-ao" && errors.some(function (e) { return e.code === "ao-do-swap"; })) return;
      if (
        item.id === "led-series" &&
        errors.some(function (e) {
          return e.code === "led-reversed" || e.code === "led-no-resistor";
        })
      ) {
        return;
      }
      errors.push({
        code: "missing:" + item.id,
        title: "아직 잇지 않았습니다 — " + item.label,
        detail: item.why || "",
        fix: item.label + " 을 이어 주세요."
      });
    });

    return {
      ok: status.ok && risky.length === 0,
      status: status,
      errors: errors,
      dangers: risky,
      strays: status.ok ? strayWires(goal, conns) : [],
      floating: floatingLeads(goal, conns)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 10. 힌트 세 단계 (명세 9장 마지막 줄)                                  */
  /* ------------------------------------------------------------------ */

  /**
   * 힌트는 «개념 질문 → 단자 역할 → 구체적 연결» 세 단계다.
   * 단계를 건너뛰지 않는다. 답을 바로 주면 다음 회로에서 또 막힌다.
   */
  var HINTS = {
    "cds-vcc": [
      "센서도 «전기» 가 있어야 값을 만들 수 있습니다. 전기는 어디에서 옵니까?",
      "모듈의 VCC 는 «전기를 받는» 단자입니다. 우노에서 5V 라고 적힌 자리를 찾으세요.",
      "우노의 5V 와 조도센서 모듈의 VCC 를 케이블로 이으세요."
    ],
    "cds-ao": [
      "빛의 세기는 «켜짐/꺼짐» 두 가지가 아니라 «연속된 값» 입니다. 그런 값은 어느 핀으로 읽습니까?",
      "모듈의 AO(Analog Out)에서 연속값이 나옵니다. 우노의 아날로그 입력은 A 로 시작합니다.",
      "우노의 " + PINS.cds + " 와 조도센서 모듈의 AO 를 이으세요. 코드의 analogRead(" + PINS.cds + ") 가 이 선을 읽습니다."

    A2: "A2",
    A3: "A3",
    A4: "A4",
    A5: "A5",
    true: 1,
    false: 0
  };

  function tokenize(source) {
    var text = String(source === null || source === undefined ? "" : source);
    var out = [];
    var i = 0;
    var line = 1;

    function push(type, value) {
      out.push({ type: type, value: value, line: line });
    }

    while (i < text.length) {
      var ch = text.charAt(i);

      /* 줄바꿈 */
      if (ch === "\n") {
        line += 1;
        i += 1;
        continue;
      }
      if (/\s/.test(ch)) {
        i += 1;
        continue;
      }

      /* 주석 */
      if (ch === "/" && text.charAt(i + 1) === "/") {
        while (i < text.length && text.charAt(i) !== "\n") i += 1;
        continue;
      }
      if (ch === "/" && text.charAt(i + 1) === "*") {
        i += 2;
        while (i < text.length && !(text.charAt(i) === "*" && text.charAt(i + 1) === "/")) {
          if (text.charAt(i) === "\n") line += 1;
          i += 1;
        }
        if (i >= text.length) throw new ParseError("여는 /* 에 맞는 */ 가 없습니다.", line);
        i += 2;
        continue;
      }

      /* 글자열 */
      if (ch === '"') {
        var start = line;
        var buf = "";
        i += 1;
        while (i < text.length && text.charAt(i) !== '"') {
          if (text.charAt(i) === "\n") {
            throw new ParseError("큰따옴표(\") 를 닫지 않았습니다.", start);
          }
          if (text.charAt(i) === "\\" && i + 1 < text.length) {
            var esc = text.charAt(i + 1);
            buf += esc === "n" ? "\n" : esc === "t" ? "\t" : esc;
            i += 2;
            continue;
          }
          buf += text.charAt(i);
          i += 1;
        }
        if (i >= text.length) throw new ParseError("큰따옴표(\") 를 닫지 않았습니다.", start);
        i += 1;
        push("string", buf);
        continue;
      }

      /* 숫자 */
      if (/[0-9]/.test(ch)) {
        var num = "";
        while (i < text.length && /[0-9.]/.test(text.charAt(i))) {
          num += text.charAt(i);
          i += 1;
        }
        push("number", Number(num));
        continue;
      }

      /* 이름 */
      if (/[A-Za-z_]/.test(ch)) {
        var name = "";
        while (i < text.length && /[A-Za-z0-9_]/.test(text.charAt(i))) {
          name += text.charAt(i);
          i += 1;
        }
        push(KEYWORDS[name] ? "keyword" : "ident", name);
        continue;
      }

      /* 두 글자 기호 */
      var two = text.substr(i, 2);
      if (["==", "!=", ">=", "<=", "&&", "||", "++", "--", "+=", "-="].indexOf(two) !== -1) {
        push("op", two);
        i += 2;
        continue;
      }

      /* 한 글자 기호 */
      if ("{}();,.=<>+-*/%!&|[]".indexOf(ch) !== -1) {
        push("op", ch);
        i += 1;
        continue;
      }

      throw new ParseError("읽을 수 없는 글자 «" + ch + "» 가 있습니다.", line);
    }

    push("eof", "");
    return out;
  }

  /* ================================================================== */
  /* 2. 나무 세우기                                                       */
  /* ================================================================== */

  function parse(source) {
    var tokens = tokenize(source);
    var p = 0;

    function peek(offset) {
      return tokens[p + (offset || 0)] || tokens[tokens.length - 1];
    }
    function at(type, value) {
      var t = peek();
      return t.type === type && (value === undefined || t.value === value);
    }
    function next() {
      return tokens[p++];
    }
    function expect(type, value, what) {
      if (!at(type, value)) {
        var t = peek();
        throw new ParseError(
          (what || "«" + value + "»") + " 가 있어야 합니다. 여기에는 «" + (t.value || "끝") + "» 가 있습니다.",
          t.line
        );
      }
      return next();
    }

    /* ── 식 ── */

    function primary() {
      var t = peek();

      if (t.type === "number") {
        next();
        return { type: "num", value: t.value, line: t.line };
      }
      if (t.type === "string") {
        next();
        return { type: "str", value: t.value, line: t.line };
      }
      if (at("op", "(")) {
        next();
        var inner = expression();
        expect("op", ")", "닫는 괄호 )");
        return inner;
      }
      if (at("op", "-") || at("op", "!")) {
        var op = next();
        return { type: "unary", op: op.value, arg: primary(), line: op.line };
      }
      if (t.type === "ident") {
        next();
        /* Serial.println(...) 처럼 «점» 이 붙은 이름 */
        var name = t.value;
        while (at("op", ".")) {
          next();
          var part = expect("ident", undefined, "점 뒤의 이름");
          name += "." + part.value;
        }
        if (at("op", "(")) {
          next();
          var args = [];
          if (!at("op", ")")) {
            for (;;) {
              args.push(expression());
              if (at("op", ",")) {
                next();
                continue;
              }
              break;
            }
          }
          expect("op", ")", "닫는 괄호 )");
          return { type: "call", name: name, args: args, line: t.line };
        }
        /* 배열 꺼내기는 이 차시 범위 밖이지만, 적었을 때 뜻이 통하게 읽어는 준다 */
        if (at("op", "[")) {
          next();
          var index = expression();
          expect("op", "]", "닫는 대괄호 ]");
          return { type: "index", name: name, index: index, line: t.line };
        }
        return { type: "ident", name: name, line: t.line };
      }

      throw new ParseError("«" + (t.value || "끝") + "» 는 값이 될 수 없습니다.", t.line);
    }

    function multiplicative() {
      var left = primary();
      while (at("op", "*") || at("op", "/") || at("op", "%")) {
        var op = next();
        left = { type: "bin", op: op.value, left: left, right: primary(), line: op.line };
      }
      return left;
    }

    function additive() {
      var left = multiplicative();
      while (at("op", "+") || at("op", "-")) {
        var op = next();
        left = { type: "bin", op: op.value, left: left, right: multiplicative(), line: op.line };
      }
      return left;
    }

    function comparison() {
      var left = additive();
      while (at("op", ">") || at("op", "<") || at("op", ">=") || at("op", "<=") || at("op", "==") || at("op", "!=")) {
        var op = next();
        left = { type: "cmp", op: op.value, left: left, right: additive(), line: op.line };
      }
      return left;
    }

    function logical() {
      var left = comparison();
      while (at("op", "&&") || at("op", "||")) {
        var op = next();
        left = { type: "logic", op: op.value, left: left, right: comparison(), line: op.line };
      }
      return left;
    }

    function expression() {
      /* 대입 : IDENT = 식 */
      if (peek().type === "ident" && peek(1).type === "op" && peek(1).value === "=") {
        var target = next();
        next(); /* = */
        return { type: "assign", name: target.value, value: expression(), line: target.line };
      }
      return logical();
    }

    /* ── 문장 ── */

    function isTypeWord() {
      return (
        at("keyword", "int") || at("keyword", "long") || at("keyword", "float") || at("keyword", "unsigned")
      );
    }

    function varDecl() {
      var line = peek().line;
      var isConst = false;
      if (at("keyword", "const")) {
        next();
        isConst = true;
      }
      if (at("keyword", "unsigned")) next();
      var typeTok = next(); /* int · long · float */
      var nameTok = expect("ident", undefined, "변수 이름");
      var init = null;
      if (at("op", "=")) {
        next();
        init = expression();
      }
      expect("op", ";", "줄 끝의 세미콜론 ;");
      return {
        type: "var",
        varType: typeTok.value,
        isConst: isConst,
        name: nameTok.value,
        init: init,
        line: line
      };
    }

    function block() {
      var open = expect("op", "{", "여는 중괄호 {");
      var body = [];
      while (!at("op", "}")) {
        if (at("eof")) throw new ParseError("여는 중괄호 { 에 맞는 } 가 없습니다.", open.line);
        body.push(statement());
      }
      next();
      return { type: "block", body: body, line: open.line };
    }

    function statement() {
      if (at("op", "{")) return block();
      if (at("op", ";")) {
        next();
        return { type: "empty", line: peek().line };
      }

      if (at("keyword", "if")) {
        var line = next().line;
        expect("op", "(", "여는 괄호 (");
        var cond = expression();
        expect("op", ")", "닫는 괄호 )");
        var then = statement();
        var other = null;
        if (at("keyword", "else")) {
          next();
          other = statement();
        }
        return { type: "if", cond: cond, then: then, else: other, line: line };
      }

      if (at("keyword", "const") || isTypeWord()) return varDecl();

      var stmtLine = peek().line;
      var expr = expression();
      expect("op", ";", "줄 끝의 세미콜론 ;");
      return { type: "expr", expr: expr, line: stmtLine };
    }

    /* ── 프로그램 ── */

    var globals = [];
    var functions = {};
    var order = [];

    while (!at("eof")) {
      if (at("keyword", "void")) {
        var vline = next().line;
        var fname = expect("ident", undefined, "함수 이름");
        expect("op", "(", "여는 괄호 (");
        /* 인자는 이 차시 범위 밖이다. 적었으면 그냥 지나친다. */
        while (!at("op", ")")) {
          if (at("eof")) throw new ParseError("함수 괄호를 닫지 않았습니다.", vline);
          next();
        }
        next();
        var body = block();
        functions[fname.value] = { name: fname.value, body: body, line: vline };
        order.push(fname.value);
        continue;
      }
      if (at("keyword", "const") || isTypeWord()) {
        globals.push(varDecl());
        continue;
      }
      var bad = peek();
      throw new ParseError(
        "«" +
          (bad.value || "끝") +
          "» 부터는 읽을 수 없습니다. 이 차시에서는 변수 선언과 void setup() · void loop() 만 씁니다.",
        bad.line
      );
    }

    return { type: "program", globals: globals, functions: functions, order: order };
  }

  /** 문법이 맞는지만 본다. 틀리면 { ok:false, error:{message, line} } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      return {
        ok: false,
        ast: null,
        error: { message: err.message || String(err), line: err.line || 0 }
      };
    }
  }

  /* ================================================================== */
  /* 3. 나무 훑어보기 — 검사에 쓴다                                        */
  /* ================================================================== */

  function walk(node, visit) {
    if (!node || typeof node !== "object") return;
    visit(node);
    ["left", "right", "arg", "cond", "then", "else", "value", "init", "expr", "index"].forEach(function (k) {
      if (node[k]) walk(node[k], visit);
    });
    (node.args || []).forEach(function (a) {
      walk(a, visit);
    });
    (node.body || []).forEach(function (s) {
      walk(s, visit);
    });
  }

  function walkAll(ast, visit) {
    if (!ast) return;
    (ast.globals || []).forEach(function (g) {
      walk(g, visit);
    });
    Object.keys(ast.functions || {}).forEach(function (name) {
      walk(ast.functions[name].body, visit);
    });
  }

  /** 이름이 fnName 인 호출을 모두 모은다 */
  function callsIn(ast, fnName) {
    var out = [];
    walkAll(ast, function (node) {
      if (node.type === "call" && node.name === fnName) out.push(node);
    });
    return out;
  }

  /** 특정 함수 «안» 의 호출만 */
  function callsInFunction(ast, fnName, callName) {
    var fn = (ast.functions || {})[fnName];
    if (!fn) return [];
    var out = [];
    walk(fn.body, function (node) {
      if (node.type === "call" && node.name === callName) out.push(node);
    });
    return out;
  }

  /** 전역·지역 변수의 «처음 값» 을 사전으로 (핀 이름을 되짚는 데 쓴다) */
  function constantMap(ast) {
    var map = {};
    (ast.globals || []).forEach(function (g) {
      if (!g.init) return;
      if (g.init.type === "num") map[g.name] = g.init.value;
      else if (g.init.type === "ident" && CONSTANTS[g.init.name] !== undefined) {
        map[g.name] = CONSTANTS[g.init.name];
      }
    });
    walkAll(ast, function (node) {
      if (node.type === "var" && node.init && map[node.name] === undefined) {
        if (node.init.type === "num") map[node.name] = node.init.value;
        else if (node.init.type === "ident" && CONSTANTS[node.init.name] !== undefined) {
          map[node.name] = CONSTANTS[node.init.name];
        }
      }
    });
    return map;
  }

  /** 식 하나가 가리키는 핀 이름 ("A0" · 2 …) */
  function pinValueOf(node, map) {
    if (!node) return null;
    if (node.type === "num") return node.value;
    if (node.type === "str") return node.value;
    if (node.type === "ident") {
      if (CONSTANTS[node.name] !== undefined) return CONSTANTS[node.name];
      if (map[node.name] !== undefined) return map[node.name];
      return null;
    }
    return null;
  }

  /**
   * 코드가 쓴 핀을 갈래별로 모은다 (명세 14장 마지막 줄)
   * 돌려주는 것 : { analog: ["A0"], digital: ["D2"], raw: [...] }
   */
  function pinsUsed(ast) {
    var map = constantMap(ast);
    var analog = {};
    var digital = {};

    function name(value) {
      if (value === null || value === undefined) return "";
      var v = String(value).toUpperCase();
      if (/^A\d+$/.test(v)) return v;
      if (/^\d+$/.test(v)) return "D" + v;
      if (/^D\d+$/.test(v)) return v;
      return "";
    }

    callsIn(ast, "analogRead").forEach(function (call) {
      var n = name(pinValueOf(call.args[0], map));
      if (n) analog[n] = true;
    });
    ["digitalWrite", "digitalRead", "pinMode"].forEach(function (fn) {
      callsIn(ast, fn).forEach(function (call) {
        var n = name(pinValueOf(call.args[0], map));
        if (n) digital[n] = true;
      });
    });

    return {
      analog: Object.keys(analog),
      digital: Object.keys(digital),
      constants: map
    };
  }

  /* ================================================================== */
  /* 4. 실행                                                             */
  /* ================================================================== */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  var KNOWN_CALLS = [
    "pinMode",
    "analogRead",
    "digitalRead",
    "digitalWrite",
    "analogWrite",
    "delay",
    "map",
    "constrain",
    "Serial.begin",
    "Serial.print",
    "Serial.println"
  ];

  /**
   * 코드를 돌려 본다.
   *
   *   opts.analog      { A0: 512, A1: 800 }  ← 또는 (pinName, timeMs) => 값 을 주는 함수
   *   opts.loopLimit   loop() 를 몇 바퀴 (기본 3)
   *   opts.stepLimit   명령 수 상한 (기본 20000)
   *   opts.timeLimit   가상 시간 상한 ms (기본 20000)
   *
   * 돌려주는 것
   *   ok        문법과 실행이 모두 무사했는가
   *   error     { message, line }
   *   serial    [{ t, text, newline }]      시리얼 모니터에 찍힌 것
   *   lines     ["CDS_Sensor: 988", …]      줄 단위로 모은 것
   *   steps     [{ line, kind, detail, … }] 「지금 실행 줄」 을 보여 주기 위한 발자국
   *   pins      { D2: "HIGH" }              끝났을 때의 디지털 핀 상태
   *   iterations loop() 를 몇 바퀴 돌았는가
   *   elapsed   가상 시간(ms)
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit === undefined ? 3 : o.loopLimit;
    var stepLimit = o.stepLimit === undefined ? 20000 : o.stepLimit;
    var timeLimit = o.timeLimit === undefined ? 20000 : o.timeLimit;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        error: parsed.error,
        serial: [],
        lines: [],
        steps: [],
        pins: {},
        iterations: 0,
        elapsed: 0,
        stopped: "문법 오류"
      };
    }

    var ast = parsed.ast;
    var scopes = [{}];
    var serial = [];
    var steps = [];
    var pinModes = {};
    var pinState = {};
    var serialOpen = false;
    var elapsed = 0;
    var stepCount = 0;
    var iterations = 0;
    var stopped = "";
    var pending = ""; /* Serial.print 로 아직 줄바꿈이 안 된 글 */

    function analogValue(pinName) {
      var src = o.analog;
      if (typeof src === "function") return clampAdc(src(pinName, elapsed));
      if (src && src[pinName] !== undefined) {
        var v = src[pinName];
        return clampAdc(typeof v === "function" ? v(elapsed) : v);
      }
      /* 아무것도 꽂히지 않은 아날로그 핀은 «값이 뜬다». 0 으로 두면 학생이 오해한다. */
      return 0;
    }

    function clampAdc(value) {
      var n = Math.round(Number(value));
      if (isNaN(n)) return 0;
      if (n < 0) return 0;
      if (n > ADC_MAX) return ADC_MAX;
      return n;
    }

    function tick(line, kind, detail) {
      stepCount += 1;
      if (stepCount > stepLimit) throw new StopRun("명령이 너무 많습니다(" + stepLimit + "개 넘음).");
      if (elapsed > timeLimit) throw new StopRun("가상 시간이 " + timeLimit + "ms 를 넘었습니다.");
      steps.push({
        line: line,
        kind: kind,
        detail: detail || "",
        t: elapsed,
        serialCount: serial.length,
        pins: copyPins(),
        vars: snapshotVars()
      });
    }

    function copyPins() {
      var out = {};
      Object.keys(pinState).forEach(function (k) {
        out[k] = pinState[k];
      });
      return out;
    }

    function snapshotVars() {
      var out = {};
      scopes.forEach(function (s) {
        Object.keys(s).forEach(function (k) {
          out[k] = s[k];
        });
      });
      return out;
    }

    function declare(name, value, isConst) {
      scopes[scopes.length - 1][name] = value;
      if (isConst) {
        var box = scopes[scopes.length - 1];
        if (!box.__const) box.__const = {};
        box.__const[name] = true;
      }
    }

    function lookup(name) {
      for (var i = scopes.length - 1; i >= 0; i -= 1) {
        if (Object.prototype.hasOwnProperty.call(scopes[i], name)) return { box: scopes[i], has: true };
      }
      return { box: null, has: false };
    }

    function pinNameOf(value) {
      if (value === null || value === undefined) return "";
      var v = String(value).toUpperCase();
      if (/^A\d+$/.test(v)) return v;
      if (/^\d+$/.test(v)) return "D" + v;
      if (/^D\d+$/.test(v)) return v;
      return v;
    }

    function writeSerial(text, newline) {
      if (!serialOpen) {
        /* Serial.begin 을 부르지 않으면 실제 아두이노에서도 아무것도 오지 않는다 */
        return false;
      }
      pending += String(text);
      if (newline) {
        serial.push({ t: elapsed, text: pending });
        pending = "";
      }
      return true;
    }

    function evalNode(node) {
      if (!node) return 0;

      switch (node.type) {
        case "num":
          return node.value;
        case "str":
          return node.value;
        case "ident": {
          if (CONSTANTS[node.name] !== undefined) return CONSTANTS[node.name];
          var found = lookup(node.name);
          if (!found.has) {
            throw new ParseError("«" + node.name + "» 이라는 이름을 찾을 수 없습니다. 먼저 선언했는지 보세요.", node.line);
          }
          return found.box[node.name];
        }
        case "index": {
          throw new ParseError("배열은 이 차시의 시뮬레이터가 다루지 않습니다.", node.line);
        }
        case "unary": {
          var v = evalNode(node.arg);
          return node.op === "-" ? -Number(v) : Number(v) ? 0 : 1;
        }
        case "bin": {
          var a = Number(evalNode(node.left));
          var b = Number(evalNode(node.right));
          if (node.op === "+") {
            /* 글자열 잇기도 받아 준다 — Serial.print("a" + b) 를 적는 학생이 있다 */
            var la = evalNode(node.left);
            var lb = evalNode(node.right);
            if (typeof la === "string" || typeof lb === "string") return String(la) + String(lb);
            return a + b;
          }
          if (node.op === "-") return a - b;
          if (node.op === "*") return a * b;
          if (node.op === "/") {
            if (b === 0) throw new ParseError("0 으로 나눌 수 없습니다.", node.line);
            /* 아두이노의 int 나눗셈은 소수점을 버린다 */
            return Math.trunc(a / b);
          }
          if (node.op === "%") {
            if (b === 0) throw new ParseError("0 으로 나눈 나머지는 구할 수 없습니다.", node.line);
            return a % b;
          }
          return 0;
        }
        case "cmp": {
          var l = evalNode(node.left);
          var r = evalNode(node.right);
          var ln = typeof l === "string" ? l : Number(l);
          var rn = typeof r === "string" ? r : Number(r);
          switch (node.op) {
            case ">":
              return ln > rn ? 1 : 0;
            case "<":
              return ln < rn ? 1 : 0;
            case ">=":
              return ln >= rn ? 1 : 0;
            case "<=":
              return ln <= rn ? 1 : 0;
            case "==":
              return ln === rn ? 1 : 0;
            case "!=":
              return ln !== rn ? 1 : 0;
          }
          return 0;
        }
        case "logic": {
          var left = Number(evalNode(node.left)) !== 0;
          if (node.op === "&&") return left && Number(evalNode(node.right)) !== 0 ? 1 : 0;
          return left || Number(evalNode(node.right)) !== 0 ? 1 : 0;
        }
        case "assign": {
          var target = lookup(node.name);
          if (!target.has) {
            throw new ParseError(
              "«" + node.name + "» 을 먼저 선언해야 값을 넣을 수 있습니다. (예: int " + node.name + " = 0;)",
              node.line
            );
          }
          if (target.box.__const && target.box.__const[node.name]) {
            throw new ParseError("«" + node.name + "» 은 const 이므로 값을 바꿀 수 없습니다.", node.line);
          }
          var value = evalNode(node.value);
          target.box[node.name] = value;
          return value;
        }
        case "call":
          return callNode(node);
      }
      return 0;
    }

    function callNode(node) {
      var name = node.name;
      var args = node.args || [];

      if (KNOWN_CALLS.indexOf(name) === -1) {
        throw new ParseError(
          "«" +
            name +
            "()» 는 이 차시의 시뮬레이터가 모르는 함수입니다. 쓸 수 있는 것 : " +
            KNOWN_CALLS.join(", "),
          node.line
        );
      }

      if (name === "Serial.begin") {
        serialOpen = true;
        var baud = args.length ? Number(evalNode(args[0])) : 9600;
        tick(node.line, "serial-begin", "시리얼 통신 시작 (" + baud + " bps)");
        return 0;
      }

      if (name === "Serial.print" || name === "Serial.println") {
        var value = args.length ? evalNode(args[0]) : "";
        var shown = typeof value === "number" ? String(value) : String(value);
        var ok = writeSerial(shown, name === "Serial.println");
        tick(
          node.line,
          "serial",
          ok
            ? (name === "Serial.println" ? "출력(줄바꿈) : " : "출력 : ") + shown
            : "Serial.begin() 을 부르지 않아 아무것도 나가지 않았습니다."
        );
        return 0;
      }

      if (name === "pinMode") {
        var pm = pinNameOf(evalNode(args[0]));
        var modeVal = args.length > 1 ? Number(evalNode(args[1])) : 1;
        pinModes[pm] = modeVal === 1 ? "OUTPUT" : modeVal === 2 ? "INPUT_PULLUP" : "INPUT";
        tick(node.line, "pinmode", pm + " 를 " + pinModes[pm] + " 으로 정함");
        return 0;
      }

      if (name === "analogRead") {
        var ap = pinNameOf(evalNode(args[0]));
        var av = analogValue(ap);
        tick(node.line, "analog-read", "analogRead(" + ap + ") → " + av);
        return av;
      }

      if (name === "digitalRead") {
        var dp = pinNameOf(evalNode(args[0]));
        var dv = pinState[dp] === "HIGH" ? 1 : 0;
        tick(node.line, "digital-read", "digitalRead(" + dp + ") → " + (dv ? "HIGH" : "LOW"));
        return dv;
      }

      if (name === "digitalWrite") {
        var wp = pinNameOf(evalNode(args[0]));
        var wv = Number(evalNode(args[1])) !== 0 ? "HIGH" : "LOW";
        pinState[wp] = wv;
        var warn = pinModes[wp] === "OUTPUT" ? "" : " (pinMode(" + wp + ", OUTPUT) 을 먼저 부르는 것이 바릅니다)";
        tick(node.line, "digital-write", wp + " ← " + wv + warn);
        return 0;
      }

      if (name === "analogWrite") {
        var awp = pinNameOf(evalNode(args[0]));
        var awv = Number(evalNode(args[1]));
        pinState[awp] = awv > 0 ? "HIGH" : "LOW";
        tick(node.line, "analog-write", awp + " ← " + awv + " (PWM)");
        return 0;
      }

      if (name === "delay") {
        var ms = Number(evalNode(args[0])) || 0;
        if (ms < 0) throw new ParseError("delay() 에는 0 이상을 넣습니다.", node.line);
        elapsed += ms;
        tick(node.line, "delay", ms + "ms 기다림");
        return 0;
      }

      if (name === "map") {
        var v0 = Number(evalNode(args[0]));
        var i0 = Number(evalNode(args[1]));
        var i1 = Number(evalNode(args[2]));
        var o0 = Number(evalNode(args[3]));
        var o1 = Number(evalNode(args[4]));
        if (i1 === i0) return o0;
        return Math.trunc(((v0 - i0) * (o1 - o0)) / (i1 - i0) + o0);
      }

      if (name === "constrain") {
        var cv = Number(evalNode(args[0]));
        var lo = Number(evalNode(args[1]));
        var hi = Number(evalNode(args[2]));
        return cv < lo ? lo : cv > hi ? hi : cv;
      }

      return 0;
    }

    function execStatement(node) {
      if (!node) return;
      switch (node.type) {
        case "block": {
          scopes.push({});
          try {
            node.body.forEach(execStatement);
          } finally {
            scopes.pop();
          }
          return;
        }
        case "var": {
          var value = node.init ? evalNode(node.init) : 0;
          declare(node.name, value, node.isConst);
          tick(node.line, "declare", node.name + " = " + value);
          return;
        }
        case "expr":
          evalNode(node.expr);
          return;
        case "if": {
          var truth = Number(evalNode(node.cond)) !== 0;
          tick(node.line, "if", "조건식 → " + (truth ? "True (참)" : "False (거짓)"));
          if (truth) execStatement(node.then);
          else if (node.else) execStatement(node.else);
          return;
        }
        case "empty":
          return;
      }
    }

    try {
      /* 전역 변수 */
      ast.globals.forEach(function (g) {
        var value = g.init ? evalNode(g.init) : 0;
        declare(g.name, value, g.isConst);
      });

      if (!ast.functions.setup) throw new StopRun("void setup() 이 없습니다.");
      if (!ast.functions.loop) throw new StopRun("void loop() 이 없습니다.");

      steps.push({ line: ast.functions.setup.line, kind: "enter", detail: "setup() 시작", t: 0, serialCount: 0, pins: {}, vars: {} });
      execStatement(ast.functions.setup.body);

      for (var i = 0; i < loopLimit; i += 1) {
        iterations = i + 1;
        steps.push({
          line: ast.functions.loop.line,
          kind: "enter",
          detail: "loop() " + iterations + "번째 바퀴",
          t: elapsed,
          serialCount: serial.length,
          pins: copyPins(),
          vars: snapshotVars()
        });
        execStatement(ast.functions.loop.body);
      }
    } catch (err) {
      if (err instanceof StopRun || err.name === "StopRun") {
        stopped = err.reason;
      } else {
        /* 남은 글이 있으면 흘려보내고 오류를 돌려준다 */
        if (pending) serial.push({ t: elapsed, text: pending });
        return {
          ok: false,
          error: { message: err.message || String(err), line: err.line || 0 },
          serial: serial,
          lines: serial.map(function (s) {
            return s.text;
          }),
          steps: steps,
          pins: copyPins(),
          pinModes: pinModes,
          iterations: iterations,
          elapsed: elapsed,
          stopped: "실행 중 오류"
        };
      }
    }

    if (pending) serial.push({ t: elapsed, text: pending });

    return {
      ok: true,
      error: null,
      serial: serial,
      lines: serial.map(function (s) {
        return s.text;
      }),
      steps: steps,
      pins: copyPins(),
      pinModes: pinModes,
      iterations: iterations,
      elapsed: elapsed,
      stopped: stopped
    };
  }

  /**
   * 코드를 검사한다.
   *
   *   goal        'light' · 'soil' · 'soilExt'
   *   connections 회로 (핀 불일치를 함께 본다). 없으면 핀 검사를 건너뛴다.
   *
   * 돌려주는 것
   *   ok           문법이 맞고 검사를 모두 통과했는가
   *   syntax       { ok, message, line }
   *   results      [{ id, label, ok, fix }]
   *   passed/total
   *   pinMismatch  [{ code, circuit, message }]
   */
  function validate(source, ctx) {
    var c = ctx || {};
    var goal = c.goal || "light";
    var list = TESTS[goal] || TESTS.light;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        syntax: { ok: false, message: parsed.error.message, line: parsed.error.line },
        results: list.map(function (t) {
          return { id: t.id, label: t.label, ok: false, fix: t.fix };
        }),
        passed: 0,
        total: list.length,
        pinMismatch: []
      };
    }

    var ast = parsed.ast;
    var pins = pinsUsed(ast);

    var box = {
      ast: ast,
      source: String(source || ""),
      pins: pins,
      run: function (analog) {
        return run(source, { analog: analog, loopLimit: 1, stepLimit: 4000, timeLimit: 5000 });
      }
    };

    var results = list.map(function (t) {
      var ok = false;
      try {
        ok = !!t.test(box);
      } catch (e) {
        ok = false;
      }
      return { id: t.id, label: t.label, ok: ok, fix: t.fix };
    });

    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    var mismatch = [];
    if (c.connections && PCns.circuit) {
      mismatch = PCns.circuit.pinMismatch(goal === "soilExt" ? "soil" : goal, pins, c.connections);
    }

    return {
      ok: passed === list.length && mismatch.length === 0,
      syntax: { ok: true, message: "", line: 0 },
      results: results,
      passed: passed,
      total: list.length,
      pinMismatch: mismatch,
      pins: pins
    };
  }

  var MISCONCEPTIONS = [

        "두 개를 모두 다시 하게 하면 시간 안에 마치지 못한다."
    },
    {
      id: "s5",
      when: "빨리 마친 학생",
      how:
        "4단계 «선택 확장» 으로 건조 기준값을 정해 «물을 주세요» 를 출력하게 하고, " +

  /* ================================================================== */
  /* 5. 수업 진행 안내 (교사가 화면에서 바로 보는 흐름)                      */
  /* ================================================================== */

  var TIMELINE = [
    { at: "0~4분", what: "1단계 — 학습 목표와 안전 수칙 확인. 특히 «탐침만 흙에» 를 짚는다." },
    { at: "4~12분", what: "2단계 — 두 센서 원리. 슬라이더로 저항·아날로그값 변화를 함께 본다." },

  /** 상위 3명을 가리는 기준 (명세 16.2) — 교사 화면에 그대로 적어 둔다 */
  var TOP_RULES = [

  /** 교사용이 반드시 보아야 하는 분석 항목 (명세 16.1) */
  var MUST_ANALYZE = [
    "조도 회로 완료율과 대표 오류 : AO/" + PINS.cds + " 누락, LED 역극성, 무저항, " + PINS.led + " 불일치",
    "토양 회로 완료율과 대표 오류 : AO/DO 혼동, " + PINS.soil + " 누락, VCC/GND 역결선",
    "학생별 밝기 3조건과 수분 3조건의 측정값·관찰문",

    "형성평가 정오표, 오답 TOP2, 주관식 원문"

  /** 기준값이 «실험에 근거했는가» 를 교사가 가늠할 때 쓰는 잣대 */
  var THRESHOLD_HINTS = [
    {

    },
    {
      id: "reasoned",

      detail:
        "세 조건의 측정값이 모두 적혀 있고 기준값이 «보통» 구간과 «어두움» 구간 사이에 놓여 있으면 " +
        "값을 보고 정한 것이다."
    },
    {
      id: "outside",
      title: "다시 살펴볼 값",
      detail:
        "기준값이 자신이 적은 세 측정값의 범위를 완전히 벗어나 있으면(예 : 모든 값이 400~700 인데 기준 950) " +
        "어떤 근거로 정했는지 물어본다."

  ];

  /* ================================================================== */

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});

      ANSWERS.forEach(function (a) {
        if (a.id === id) found = a;
