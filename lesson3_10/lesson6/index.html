  var UNO = buildUno();
  var BB = buildBreadboard();
  var CDS = buildCds();
  var LED = buildLed();
  var RES = buildResistor();
  var SOIL = buildSoil();
  var PROBE = buildProbe();

  var COMPONENTS = {};
  [UNO, BB, CDS, LED, RES, SOIL, PROBE].forEach(function (c) {
    COMPONENTS[c.id] = c;
  });

  /** 실습마다 화면에 내놓는 부품 (명세 10.1 · 11.1) */
  /**
   * 실습마다 화면에 내놓는 부품 (명세 10.1 · 11.1)
   *
   *   parts      결선할 때 — 우노와 브레드보드까지 모두
   *   findParts  «단자 찾기» 를 할 때 — 답이 있는 부품만
   *
   * ★ 단자 찾기에 우노와 브레드보드를 함께 내놓지 않는 까닭
   *   찾는 답은 언제나 «센서 모듈이나 부품의 단자» 다. 우노의 헤더 스무 개와
   *   브레드보드 구멍 백스무 개를 함께 두면 눌러야 할 곳이 묻힌다.
   *   결선(A-2)에 가서야 우노와 브레드보드가 필요하다.
   */
  var SCENES = {
    light: {
      parts: ["uno", "bb", "cds", "led", "res"],
      findParts: ["cds", "led"],
      /* ★ 「단자 찾기」 화면은 부품을 «세로로» 쌓는다.
         결선 화면은 넓고 낮아야 하고(브레드보드가 옆에 있다),
         찾기 화면은 좁고 높아야 한다(틀이 좁을수록 그림이 크게 그려지고
         누르는 단자가 44px 을 넘는다 — 명세 18장).
         두 가지를 한 배치로는 채울 수 없어 «찾기 전용 자리» 를 따로 둔다. */
      findLayout: { cds: { x: 560, y: 24 }, led: { x: 560, y: 208 } },
      label: "조도센서 실습"
    },
    soil: {
      parts: ["uno", "bb", "soil", "probe"],
      /* ★ 탐침도 함께 낸다.
         모듈 하나만 내면 틀이 짧고 넓어져 그림이 2.3배로 부풀었다 —
         「비교기 모듈」 글자와 나사가 화면을 가득 채워 다른 화면과 딴판이었다.
         조도(모듈 + LED)처럼 «둘을 세로로» 두면 틀의 비율이 같아져
         3단계와 같은 크기로 그려진다. */
      findParts: ["soil", "probe"],
      findLayout: { soil: { x: 560, y: 24 }, probe: { x: 560, y: 230 } },
      label: "토양수분 실습"
    }
  };

  /* ------------------------------------------------------------------ */
  /* 2. 단자 찾기와 이름                                                  */
  /* ------------------------------------------------------------------ */

  function terminal(componentId, pinId) {
    var comp = COMPONENTS[componentId];
    if (!comp) return null;
    var found = null;
    comp.pins.forEach(function (p) {
      if (p.id === pinId) found = p;
    });
    return found;
  }

  /** 단자를 사람이 읽는 말로 — 「우노 5V」 처럼 */
  function describe(componentId, pinId) {
    var comp = COMPONENTS[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return componentId + " " + pinId;
    return comp.short + " " + (pin.short || pin.label);
  }

  /**
   * 이 단자가 속한 전기적 마디.
   *
   *   우노 GND1·GND2 → "uno:GND"          (보드 안에서 이어져 있다)
   *   브레드보드 A3   → "bb:top:3"          (같은 열 다섯 구멍이 한 마디)
   *   브레드보드 ＋   → "bb:rail:plus"      (레일 전체가 한 마디)
   *   그 밖          → "부품:단자"
   */
  function nodeOf(componentId, pinId) {
    if (componentId === "uno" && /^GND\d*$/.test(pinId)) return "uno:GND";
    if (componentId === "bb") {
      var pin = terminal("bb", pinId);
      if (!pin) return "bb:" + pinId;
      if (pin.kind === "rail") return "bb:rail:" + pin.rail;
      return "bb:" + pin.group + ":" + pin.col;
    }
    return componentId + ":" + pinId;
  }

  /** 마디를 사람이 읽는 말로 */
  function nodeLabel(node) {
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("bb:rail:") === 0) {
      return "브레드보드 " + (node.indexOf("plus") > 0 ? "＋" : "−") + " 레일";
    }
    if (node.indexOf("bb:") === 0) {
      var bits = node.split(":");
      return "브레드보드 " + bits[2] + "번 열(" + (bits[1] === "top" ? "A~E" : "F~J") + ")";
    }
    var parts = node.split(":");
    return describe(parts[0], parts[1]);
  }

  /* ------------------------------------------------------------------ */
  /* 3. 케이블                                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 하나를 만든다. 두 끝의 순서는 «뜻이 없다» — 항상 같은 순서로 담아
   * 「A→B」 와 「B→A」 가 같은 케이블로 세어지게 한다.
   */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin) || !terminal(to.component, to.pin)) return null;
    /* 같은 단자를 자기 자신과 잇는 것은 케이블이 아니다 */
    if (from.component === to.component && from.pin === to.pin) return null;

    var a = from.component + ":" + from.pin;
    var b = to.component + ":" + to.pin;
    var flip = a > b;
    var s = flip ? to : from;
    var e = flip ? from : to;

    return {
      fromComponent: s.component,
      fromPin: s.pin,
      toComponent: e.component,
      toPin: e.pin,
      /* 색은 «읽기 쉬우려고» 있는 것이다. 정오 판정에 쓰지 않는다(명세 9장) */
      color: color || null
    };
  }

  function connectionKey(conn) {
    if (!conn) return "";
    return conn.fromComponent + ":" + conn.fromPin + "|" + conn.toComponent + ":" + conn.toPin;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /** 회로의 어느 쪽 케이블인지 보고 색을 고른다 (읽기 편하도록) */
  function suggestColor(from, to) {
    var nodes = [nodeOf(from.component, from.pin), nodeOf(to.component, to.pin)];
    var touchesGround = nodes.some(function (n) {
      return n === "uno:GND" || n === "cds:GND" || n === "soil:GND" || n === "led:K" || n === "bb:rail:minus";
    });
    var touchesPower = nodes.some(function (n) {
      return n === "uno:5V" || n === "cds:VCC" || n === "soil:VCC" || n === "bb:rail:plus";
    });
    if (touchesPower) return "red";
    if (touchesGround) return "blue";
    return "orange";
  }

  /* ------------------------------------------------------------------ */
  /* 4. 마디 합치기 (union-find)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블이 합친 마디들을 푼다.
   * 돌려주는 것 : { find(node), members(node), nodes }
   */
  function solve(connections) {
    var parent = {};

    function root(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = root(a);
      var rb = root(b);
      if (ra === rb) return;
      /* 이름이 앞선 쪽을 대표로 둔다 — 결과가 «늘 같은 모양» 이어야 테스트가 쉽다 */
      if (ra < rb) parent[rb] = ra;
      else parent[ra] = rb;
    }

    (connections || []).forEach(function (conn) {
      if (!conn) return;
      union(nodeOf(conn.fromComponent, conn.fromPin), nodeOf(conn.toComponent, conn.toPin));
    });

    return {
      find: root,
      same: function (a, b) {
        return root(a) === root(b);
      },
      members: function (node) {
        var r = root(node);
        return Object.keys(parent).filter(function (n) {
          return root(n) === r;
        });
      },
      nodes: function () {
        return Object.keys(parent);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 소자를 지나는 길 찾기                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 두 마디 사이에 «걸쳐» 있는 소자들.
   *   symmetric  : 방향이 없다 (저항)
   *   그 밖       : a → b 로만 전류가 흐른다 (LED)
   */
  var DEVICES = [
    { id: "res", a: "R1", b: "R2", symmetric: true, word: RESISTOR_OHM + "Ω 저항" },
    { id: "led", a: "A", b: "K", symmetric: false, word: "LED" }
  ];

  /**
   * from 마디에서 to 마디까지 소자를 지나 가는 길을 모두 찾는다 (명세 10.1)
   *
   * 돌려주는 것 : [ [소자 id, …], … ]   ← 지나간 소자의 순서
   * 길이 없으면 빈 배열.
   */
  function pathsBetween(net, fromNode, toNode) {
    var out = [];

    function walk(node, used, trail) {
      if (net.same(node, toNode) && trail.length > 0) {
        out.push(trail.slice());
        return;
      }
      if (trail.length > 4) return; /* 이 차시의 회로는 소자 네 개를 넘지 않는다 */

      DEVICES.forEach(function (dev) {
        if (used[dev.id]) return;
        var ends = dev.symmetric
          ? [[dev.a, dev.b], [dev.b, dev.a]]
          : [[dev.a, dev.b]];
        ends.forEach(function (pair) {
          var inNode = dev.id + ":" + pair[0];
          var outNode = dev.id + ":" + pair[1];
          if (!net.same(node, inNode)) return;
          used[dev.id] = true;
          trail.push(dev.id);
          walk(outNode, used, trail);
          trail.pop();
          used[dev.id] = false;
        });
      });
    }

    walk(fromNode, {}, []);
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 6. 실습별 «해야 할 연결»                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 요구 하나 = { id, label, kind, check(net, connections) }
   *   kind 'node'  : 두 마디가 같아야 한다
   *   kind 'path'  : 소자를 지나는 직렬 회로가 있어야 한다
   *   kind 'pair'  : 두 쌍이 서로 이어져야 한다 (어느 쪽이 어느 쪽이든)
   */
  var REQUIRED = {
    light: [
      {
        id: "cds-vcc",
        label: "우노 5V → 조도센서 모듈 VCC",
        short: "5V-VCC",
        kind: "node",
        a: "uno:5V",
        b: "cds:VCC",
        why: "모듈에 전기가 들어가야 센서가 값을 만든다."
      },
      {
        id: "cds-ao",
        label: "우노 " + PINS.cds + " → 조도센서 모듈 AO",
        short: PINS.cds + "-AO",
        kind: "node",
        a: "uno:" + PINS.cds,
        b: "cds:AO",
        why: "AO 는 «연속값» 이 나오는 단자다. analogRead(" + PINS.cds + ") 가 이 선을 읽는다."
      },
      {
        id: "cds-gnd",
        label: "우노 GND → 조도센서 모듈 GND",
        short: "GND-GND",
        kind: "node",
        a: "uno:GND",
        b: "cds:GND",
        why: "전류가 돌아갈 길이 없으면 값이 뜬다."
      },
      {
        id: "led-series",
        label: "우노 " + PINS.led + " → " + RESISTOR_OHM + "Ω 저항 → LED 양극, LED 음극 → GND",
        short: PINS.led + "-저항-LED-GND",
        kind: "path",
        from: "uno:" + PINS.led,
        to: "uno:GND",
        needs: ["res", "led"],
        why:
          "저항이 LED 앞에 있어도 뒤에 있어도 «같은 직렬 회로» 다(명세 10.1). " +
          "다만 저항이 아예 없으면 LED 가 상한다."
      }
    ],
    soil: [
      {
        id: "soil-vcc",
        label: "우노 5V → 토양수분 모듈 VCC",
        short: "5V-VCC",
        kind: "node",
        a: "uno:5V",
        b: "soil:VCC",
        why: "제조사마다 핀 순서가 다르다. «자리» 가 아니라 VCC 라고 적힌 «글자» 를 읽는다."
      },
      {
        id: "soil-ao",
        label: "우노 " + PINS.soil + " → 토양수분 모듈 AO",
        short: PINS.soil + "-AO",
        kind: "node",
        a: "uno:" + PINS.soil,
        b: "soil:AO",
        why: "AO 로 읽어야 원시 아날로그값이 온다. DO 로 읽으면 0 또는 1 만 온다."
      },
      {
        id: "soil-gnd",
        label: "우노 GND → 토양수분 모듈 GND",
        short: "GND-GND",
        kind: "node",
        a: "uno:GND",
        b: "soil:GND",
        why: "접지가 없으면 값이 흔들린다."
      },
      {
        id: "soil-probe",
        label: "탐침 2핀 → 비교기 모듈의 탐침 입력 2핀",
        short: "탐침-모듈",
        kind: "pair",
        pairs: [
          ["probe:T1", "probe:T2"],
          ["soil:P1", "soil:P2"]
        ],
        why: "탐침의 두 선은 서로 구분이 없다. 어느 쪽을 어느 입력에 꽂아도 된다."
      }
    ]
  };

  /** 실습의 목표를 한 줄로 (명세 6장 통과 조건) */
  var GOAL = {
    light: "조도센서 모듈 세 단자와 LED 직렬 회로를 모두 잇는다.",
    soil: "토양수분 모듈 세 단자와 탐침 두 선을 모두 잇는다."
  };

  /* ------------------------------------------------------------------ */
  /* 7. 요구 하나하나 확인                                                 */
  /* ------------------------------------------------------------------ */

  function checkRequirement(req, net) {
    if (req.kind === "node") {
      return { id: req.id, ok: net.same(req.a, req.b), label: req.label, short: req.short };
    }
    if (req.kind === "path") {
      var paths = pathsBetween(net, req.from, req.to);
      var good = paths.filter(function (trail) {
        return req.needs.every(function (id) {
          return trail.indexOf(id) !== -1;
        });
      });
      return { id: req.id, ok: good.length > 0, label: req.label, short: req.short, paths: paths };
    }
    if (req.kind === "pair") {
      var left = req.pairs[0];
      var right = req.pairs[1];
      /* 짝을 어떻게 맞춰도 «두 쌍이 각각» 이어져 있으면 된다 */
      var straight = net.same(left[0], right[0]) && net.same(left[1], right[1]);
      var crossed = net.same(left[0], right[1]) && net.same(left[1], right[0]);
      /* 두 탐침이 «같은 마디» 로 합쳐지면 흙을 재는 것이 아니라 그냥 단락이다 */
      var shorted = net.same(left[0], left[1]);
      return {
        id: req.id,
        ok: (straight || crossed) && !shorted,
        shorted: shorted,
        label: req.label,
        short: req.short
      };
    }
    return { id: req.id, ok: false, label: req.label, short: req.short };
  }

  /** 실습 하나의 요구를 모두 확인한다 */
  function goalStatus(goal, connections) {
    var net = solve(connections);
    var list = (REQUIRED[goal] || []).map(function (req) {
      var got = checkRequirement(req, net);
      got.why = req.why;
      return got;
    });
    var done = list.filter(function (r) {
      return r.ok;
    }).length;
    return { items: list, done: done, total: list.length, ok: done === list.length };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 위험 — 전원을 넣으면 안 되는 회로 (명세 9장)                         */
  /* ------------------------------------------------------------------ */

  var DANGER_RULES = [
    {
      id: "power-short",
      title: "5V 와 GND 가 바로 이어졌습니다",
      detail:
        "전기가 부품을 지나지 않고 그대로 돌아갑니다. 큰 전류가 흘러 보드가 상합니다. " +
        "5V 와 GND 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      id: "led-no-resistor",
      title: "LED 에 저항이 없습니다",
      detail:
        "LED 가 " +
        PINS.led +
        " 와 GND 사이에 저항 없이 들어가 있습니다. 전류가 너무 많이 흘러 LED 가 상합니다.",
      fix: RESISTOR_OHM + "Ω 저항을 LED 앞이나 뒤에 직렬로 넣으세요."
    },
    {
      id: "cds-reversed",
      title: "조도센서 모듈의 VCC 와 GND 가 거꾸로입니다",
      detail: "VCC 가 GND 쪽에, GND 가 5V 쪽에 붙었습니다. 모듈이 상할 수 있습니다.",
      fix: "VCC 는 5V 로, GND 는 GND 로 바꿔 주세요."
    },
    {
      id: "soil-reversed",
      title: "토양수분 모듈의 VCC 와 GND 가 거꾸로입니다",
      detail: "VCC 가 GND 쪽에, GND 가 5V 쪽에 붙었습니다. 모듈이 상할 수 있습니다.",
      fix: "VCC 는 5V 로, GND 는 GND 로 바꿔 주세요."
    },
    {
      id: "ao-to-power",
      title: "신호 단자(AO)가 전원에 붙었습니다",
      detail: "AO 는 «값이 나오는» 단자입니다. 5V 나 GND 에 바로 붙이면 값을 읽을 수 없고 모듈이 상할 수 있습니다.",
      fix: "AO 는 아날로그 입력(" + PINS.cds + " 또는 " + PINS.soil + ")으로만 이으세요."
    }
  ];

  function dangerById(id) {
    var found = null;
    DANGER_RULES.forEach(function (r) {
      if (r.id === id) found = r;
    });
    return found;
  }

  /** 지금 회로의 위험을 모두 찾는다 */
  function dangers(goal, connections) {
    var net = solve(connections);
    var out = [];

    function add(id, extra) {
      var rule = dangerById(id);
      if (!rule) return;
      var item = { id: rule.id, title: rule.title, detail: rule.detail, fix: rule.fix };
      if (extra) item.detail = rule.detail + " " + extra;
      out.push(item);
    }

    /* ① 전원 직결 — 5V 와 GND 가 «케이블만으로» 이어졌는가 */
    if (net.same("uno:5V", "uno:GND")) add("power-short");

    /* ② LED 무저항 — D2→GND 길에 LED 는 있는데 저항이 없는 길이 있는가 */
    if (goal === "light") {
      var paths = pathsBetween(net, "uno:" + PINS.led, "uno:GND");
      var bare = paths.some(function (trail) {
        return trail.indexOf("led") !== -1 && trail.indexOf("res") === -1;
      });
      if (bare) add("led-no-resistor");
    }

    /* ③ 모듈 역결선 */
    if (net.same("cds:VCC", "uno:GND") && net.same("cds:GND", "uno:5V")) add("cds-reversed");
    if (net.same("soil:VCC", "uno:GND") && net.same("soil:GND", "uno:5V")) add("soil-reversed");

    /* ④ 신호 단자를 전원에 붙였는가 */
    ["cds:AO", "soil:AO"].forEach(function (node) {
      if (net.same(node, "uno:5V") || net.same(node, "uno:GND")) {
        add("ao-to-power", "(" + nodeLabel(node) + ")");
      }
    });

    /* 같은 위험을 두 번 적지 않는다 */
    var seen = {};
    return out.filter(function (d) {
      if (seen[d.id]) return false;
      seen[d.id] = true;
      return true;
    });
  }

  /** 전원을 넣어도 되는가 (명세 9장 «5V-GND 단락, 역결선, LED 무저항은 전원 인가를 막는다») */
  function canPowerOn(goal, connections) {
    var list = dangers(goal, connections);
    if (list.length > 0) {
      return { ok: false, reason: list[0].title, dangers: list };
    }
    return { ok: true, reason: "", dangers: [] };
  }

  /* ------------------------------------------------------------------ */
  /* 9. 오류를 «서로 다른 원인» 으로 갈라 알려 주기 (명세 9장 · 16.1)         */
  /* ------------------------------------------------------------------ */

  /** 케이블이 하나도 닿지 않은 단자들 — 「꽂는 것을 잊었다」 */
  function floatingLeads(goal, connections) {
    var used = {};
    (connections || []).forEach(function (c) {
      used[c.fromComponent + ":" + c.fromPin] = true;
      used[c.toComponent + ":" + c.toPin] = true;
    });

    var out = [];
    var parts = (SCENES[goal] || SCENES.light).parts;
    parts.forEach(function (id) {
      if (id === "uno" || id === "bb") return; /* 우노와 브레드보드는 남는 구멍이 있는 것이 정상 */
      COMPONENTS[id].pins.forEach(function (pin) {
        /* DO 는 이 차시에서 쓰지 않는다. 안 꽂혀 있는 것이 정상이다. */
        if (id === "soil" && pin.id === "DO") return;
        if (!used[id + ":" + pin.id]) out.push({ component: id, pin: pin.id, label: describe(id, pin.id) });
      });
    });
    return out;
  }

  /** 회로에 쓰이지 않는 케이블 — 「지워도 되는 선」 */
  function strayWires(goal, connections) {
    var status = goalStatus(goal, connections);
    if (!status.ok) return [];

    var out = [];
    (connections || []).forEach(function (conn, i) {
      var without = (connections || []).filter(function (_, j) {
        return j !== i;
      });
      /* 이 케이블을 지워도 통과하고, 위험도 늘지 않으면 «쓰이지 않는» 선이다 */
      if (goalStatus(goal, without).ok && dangers(goal, without).length <= dangers(goal, connections).length) {
        out.push({ index: i, connection: conn, label: labelOfConnection(conn) });
      }
    });
    return out;
  }

  function labelOfConnection(conn) {
    if (!conn) return "";
    return (
      describe(conn.fromComponent, conn.fromPin) + " ↔ " + describe(conn.toComponent, conn.toPin)
    );
  }

  /**
   * 회로 판정 — 화면이 그대로 보여 줄 수 있는 결과를 돌려준다.
   *
   * 돌려주는 것
   *   ok        모두 통과했는가 (위험이 없고 요구가 다 찼는가)
   *   status    요구 하나하나
   *   errors    [{ code, title, detail, fix }]
   *   dangers   위험 목록
   */
  function checkCircuit(goal, connections) {
    var conns = connections || [];
    var net = solve(conns);
    var status = goalStatus(goal, conns);
    var risky = dangers(goal, conns);
    var errors = [];

    /* ── ① 위험이 곧 오류다 ── */
    risky.forEach(function (d) {
      errors.push({ code: d.id, title: d.title, detail: d.detail, fix: d.fix });
    });

    /* ── ② AO 와 DO 혼동 (명세 11.1 · 16.1) ── */
    if (goal === "soil") {
      var aoOnAnalog = net.same("soil:AO", "uno:" + PINS.soil);
      var doOnAnalog = net.same("soil:DO", "uno:" + PINS.soil);
      if (doOnAnalog && !aoOnAnalog) {
        errors.push({
          code: "ao-do-swap",
          title: "AO 대신 DO 를 " + PINS.soil + " 에 이었습니다",
          detail:
            "DO 는 «가변저항으로 정한 기준을 넘었는가» 만 알려 주는 디지털 출력입니다. " +
            "그대로 읽으면 원시 아날로그값이 아니라 0 또는 1 만 오게 됩니다.",
          fix: "AO 를 " + PINS.soil + " 로 옮기세요. DO 는 이 차시에서 쓰지 않습니다."
        });
      }
    }

    /* ── ③ LED 역극성 (명세 9장 · 16.1) ── */
    if (goal === "light") {
      var forward = pathsBetween(net, "uno:" + PINS.led, "uno:GND").some(function (t) {
        return t.indexOf("led") !== -1;
      });
      var backward = pathsBetween(net, "uno:GND", "uno:" + PINS.led).some(function (t) {
        return t.indexOf("led") !== -1;
      });
      if (!forward && backward) {
        errors.push({
          code: "led-reversed",
          title: "LED 를 거꾸로 꽂았습니다",
          detail:
            "긴 다리(양극)가 GND 쪽, 짧은 다리(음극)가 " +
            PINS.led +
            " 쪽에 있습니다. LED 는 한쪽으로만 전류를 지나게 하므로 이대로는 켜지지 않습니다.",
          fix: "긴 다리를 " + PINS.led + " 쪽(저항 쪽)으로, 짧은 다리를 GND 쪽으로 바꿔 꽂으세요."
        });
      }
    }

    /* ── ④ 탐침 단락 ── */
    var probeReq = status.items.filter(function (r) {
      return r.id === "soil-probe";
    })[0];
    if (probeReq && probeReq.shorted) {
      errors.push({
        code: "probe-short",
        title: "탐침의 두 선이 서로 이어져 있습니다",
        detail: "두 선이 한 마디로 합쳐지면 흙의 저항을 재는 것이 아니라 그냥 단락입니다.",
        fix: "탐침 선 하나는 P1, 다른 하나는 P2 로 «따로» 이으세요."
      });
    }

    /* ── ⑤ 아직 남은 연결 (핀 누락) ── */
    status.items.forEach(function (item) {
      if (item.ok) return;
      /* 위험이나 위 오류로 이미 설명한 것은 두 번 적지 않는다 */
      if (item.id === "soil-probe" && probeReq && probeReq.shorted) return;
      if (item.id === "soil-ao" && errors.some(function (e) { return e.code === "ao-do-swap"; })) return;
      if (
        item.id === "led-series" &&
        errors.some(function (e) {
          return e.code === "led-reversed" || e.code === "led-no-resistor";
        })
      ) {
        return;
      }
      errors.push({
        code: "missing:" + item.id,
        title: "아직 잇지 않았습니다 — " + item.label,
        detail: item.why || "",
        fix: item.label + " 을 이어 주세요."
      });
    });

    return {
      ok: status.ok && risky.length === 0,
      status: status,
      errors: errors,
      dangers: risky,
      strays: status.ok ? strayWires(goal, conns) : [],
      floating: floatingLeads(goal, conns)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 10. 힌트 세 단계 (명세 9장 마지막 줄)                                  */
  /* ------------------------------------------------------------------ */

  /**
   * 힌트는 «개념 질문 → 단자 역할 → 구체적 연결» 세 단계다.
   * 단계를 건너뛰지 않는다. 답을 바로 주면 다음 회로에서 또 막힌다.
   */
  var HINTS = {
    "cds-vcc": [
      "센서도 «전기» 가 있어야 값을 만들 수 있습니다. 전기는 어디에서 옵니까?",
      "모듈의 VCC 는 «전기를 받는» 단자입니다. 우노에서 5V 라고 적힌 자리를 찾으세요.",
      "우노의 5V 와 조도센서 모듈의 VCC 를 케이블로 이으세요."
    ],
    "cds-ao": [
      "빛의 세기는 «켜짐/꺼짐» 두 가지가 아니라 «연속된 값» 입니다. 그런 값은 어느 핀으로 읽습니까?",
      "모듈의 AO(Analog Out)에서 연속값이 나옵니다. 우노의 아날로그 입력은 A 로 시작합니다.",
      "우노의 " + PINS.cds + " 와 조도센서 모듈의 AO 를 이으세요. 코드의 analogRead(" + PINS.cds + ") 가 이 선을 읽습니다."
    ],
    "cds-gnd": [
      "전류가 들어가면 «돌아 나올 길» 도 있어야 합니다. 그 길의 이름은 무엇입니까?",
      "GND 는 전류가 돌아가는 길입니다. 우노에는 GND 가 여러 개 있고 모두 보드 안에서 이어져 있습니다.",
      "우노의 GND 와 조도센서 모듈의 GND 를 이으세요."
    ],
    "led-series": [
      "LED 를 바로 " +
        PINS.led +
        " 와 GND 에 이으면 전류가 너무 많이 흐릅니다. 무엇을 하나 끼워야 합니까?",
      RESISTOR_OHM +
        "Ω 저항을 LED 와 «직렬» 로 넣습니다. LED 는 긴 다리가 양극(＋), 짧은 다리가 음극(−)입니다.",
      PINS.led +
        " → 저항 → LED 긴 다리, LED 짧은 다리 → GND 로 이으세요. 저항을 LED 뒤(음극과 GND 사이)에 두어도 같습니다."
    ],
    "soil-vcc": [
      "모듈에 전기를 넣으려면 어느 단자를 봐야 합니까? «자리» 로 찾습니까, «글자» 로 찾습니까?",
      "제조사마다 핀 순서가 다릅니다. 반드시 VCC 라고 «적힌 글자» 를 읽으세요.",
      "우노의 5V 와 토양수분 모듈의 VCC 를 이으세요."
    ],
    "soil-ao": [
      "수분량을 «숫자» 로 알고 싶습니다. AO 와 DO 중 어느 쪽이 숫자를 줍니까?",
      "AO 는 연속값, DO 는 기준을 넘었는지만 알려 주는 0/1 입니다. 이 차시는 AO 를 씁니다.",
      "우노의 " + PINS.soil + " 와 토양수분 모듈의 AO 를 이으세요."
    ],
    "soil-gnd": [
      "조도센서에서 GND 를 왜 이었는지 떠올려 보세요. 이 모듈도 같습니까?",
      "GND 는 두 센서 모두 «전류가 돌아가는 길» 입니다. 없으면 값이 흔들립니다.",
      "우노의 GND 와 토양수분 모듈의 GND 를 이으세요."
    ],
    "soil-probe": [
      "흙에 꽂는 탐침은 무엇을 재고 있습니까? 그 값이 어디로 가야 합니까?",
      "탐침 두 선은 비교기 모듈의 «탐침 입력» 두 자리로 들어갑니다. 두 선은 서로 구분이 없습니다.",
      "탐침선 1 을 모듈의 탐침 입력 1(P1) 로, 탐침선 2 를 탐침 입력 2(P2) 로 이으세요."
    ]
  };

  function hintFor(requirementId, level) {
    var list = HINTS[requirementId] || [];
    var i = Math.max(0, Math.min(list.length - 1, Number(level) || 0));
    return { text: list[i] || "", level: i, last: i >= list.length - 1, total: list.length };
  }

  /** 지금 «가장 먼저 해야 할» 요구 하나 — 힌트 단추가 이것을 가리킨다 */
  function nextRequirement(goal, connections) {
    var status = goalStatus(goal, connections);
    var pending = status.items.filter(function (r) {
      return !r.ok;
    });
    return pending.length > 0 ? pending[0] : null;
  }

  /* ------------------------------------------------------------------ */
  /* 11. 단자 찾기 과제 (명세 17.3 «단자 역할 카드와 목록 연결 방식»)          */
  /* ------------------------------------------------------------------ */

  var FIND_TASKS = {
    light: [
      { ask: "조도센서 모듈에서 «전기를 받는» 단자를 고르세요.", component: "cds", pin: "VCC" },
      { ask: "빛의 세기가 «연속값» 으로 나오는 단자를 고르세요.", component: "cds", pin: "AO" },
      { ask: "«전류가 돌아가는 길» 단자를 고르세요.", component: "cds", pin: "GND" },
      { ask: "LED 에서 «긴 다리(양극)» 를 고르세요.", component: "led", pin: "A" }
    ],
    soil: [
      { ask: "토양수분 모듈에서 «전기를 받는» 단자를 고르세요.", component: "soil", pin: "VCC" },
      {
        ask: "수분량이 «연속값» 으로 나오는 단자를 고르세요. (0/1 만 주는 단자가 아닙니다)",
        component: "soil",
        pin: "AO"
      },
      {
        ask: "«기준을 넘었는지만» 0 또는 1 로 알려 주는 단자를 고르세요.",
        component: "soil",
        pin: "DO"
      },
      { ask: "«전류가 돌아가는 길» 단자를 고르세요.", component: "soil", pin: "GND" }
    ]
  };

  /** 단자 찾기 채점 — 틀리면 왜 틀렸는지 말해 준다 */
  function checkFind(goal, taskIndex, componentId, pinId) {
    var task = (FIND_TASKS[goal] || [])[taskIndex];
    if (!task) return { ok: false, message: "" };
    if (task.component === componentId && task.pin === pinId) {
      return { ok: true, message: describe(componentId, pinId) + " — 맞습니다." };
    }
    var picked = terminal(componentId, pinId);
    return {
      ok: false,
      message:
        describe(componentId, pinId) +
        " 는 " +
        (picked && picked.note ? picked.note : "다른 일을 하는 단자") +
        " 입니다. 다시 골라 보세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 12. 코드와 회로의 핀이 같은가 (명세 14장 마지막 줄 · 22장)               */
  /* ------------------------------------------------------------------ */

  /** "A0" · "2" · "D2" 를 하나의 모양으로 */
  function pinName(value) {
    var v = String(value === null || value === undefined ? "" : value).trim().toUpperCase();
    if (!v) return "";
    if (/^A\d+$/.test(v)) return v;
    if (/^D\d+$/.test(v)) return v;
    if (/^\d+$/.test(v)) return "D" + v;
    return v;
  }

  /**
   * 코드가 쓴 핀과 회로가 이은 핀을 견준다.
   *
   * codePins  { analog: ["A0"], digital: ["D2"] }  ← arduino.js 가 만들어 준다
   * 돌려주는 것 : [{ code, circuit, kind, message }]
   */
  function pinMismatch(goal, codePins, connections) {
    var net = solve(connections || []);
    var out = [];
    var pins = codePins || {};

    function wiredNode(node, unoPin) {
      return net.same(node, "uno:" + unoPin);
    }

    if (goal === "light") {
      /* 아날로그 : 코드가 읽는 핀에 실제로 AO 가 붙어 있는가 */
      (pins.analog || []).forEach(function (p) {
        var name = pinName(p);
        if (!wiredNode("cds:AO", name)) {
          out.push({
            code: name,
            circuit: PINS.cds,
            kind: "analog",
            message:
              "코드는 analogRead(" +
              name +
              ") 로 읽는데, 회로에서 조도센서 AO 는 " +
              name +
              " 에 붙어 있지 않습니다. 둘을 같게 맞추세요."
          });
        }
      });
      /* 디지털 : 코드가 켜는 핀에 실제로 LED 직렬 회로가 걸려 있는가 */
      (pins.digital || []).forEach(function (p) {
        var name = pinName(p);
        var paths = pathsBetween(net, "uno:" + name, "uno:GND").filter(function (t) {
          return t.indexOf("led") !== -1;
        });
        if (paths.length === 0) {
          out.push({
            code: name,
            circuit: PINS.led,
            kind: "digital",
            message:
              "코드는 " +
              name +
              " 로 LED 를 켜는데, 회로에서 LED 가 " +
              name +
              " 에 걸려 있지 않습니다. " +
              "첨부 원자료처럼 " +
              (PCns.SOURCE_LED_PIN || "D3") +
              " 를 쓰려면 «회로도 함께» 옮겨야 합니다."
          });
        }
      });
    }

    if (goal === "soil") {
      (pins.analog || []).forEach(function (p) {
        var name = pinName(p);
        if (!wiredNode("soil:AO", name)) {
          out.push({
            code: name,
            circuit: PINS.soil,
            kind: "analog",
            message:
              "코드는 analogRead(" +
              name +
              ") 로 읽는데, 회로에서 토양수분 AO 는 " +
              name +
              " 에 붙어 있지 않습니다."
          });
        }
      });
    }

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 13. 지금 회로를 말로 (스크린 리더와 «목록 방식» 이 함께 쓴다)             */
  /* ------------------------------------------------------------------ */

  function describeCurrent(goal, connections) {
    var conns = connections || [];
    if (conns.length === 0) return "아직 케이블이 없습니다.";
    var lines = conns.map(function (c, i) {
      return i + 1 + ". " + labelOfConnection(c);
    });
    var status = goalStatus(goal, conns);
    lines.push("해야 할 연결 " + status.total + "개 중 " + status.done + "개를 마쳤습니다.");
    return lines.join(" ");
  }

  /** 화면에 낼 단자 목록 — «목록에서 골라 잇기» 방식이 이것을 쓴다(명세 9장) */
  function terminalList(goal) {
    var out = [];
    (SCENES[goal] || SCENES.light).parts.forEach(function (id) {
      COMPONENTS[id].pins.forEach(function (pin) {
        out.push({
          component: id,
          pin: pin.id,
          label: describe(id, pin.id),
          kind: pin.kind,
          note: pin.note || ""
        });
      });
    });
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 13. 정답 회로를 «표» 로 (화면의 [정답 확인] 이 이것을 쓴다)              */
  /* ------------------------------------------------------------------ */

  /**
   * 정답 결선표.
   *
   * ★ 판정은 이 표를 «쓰지 않는다». 판정은 전기적 마디로 한다(5장).
   *   그래서 저항을 LED 앞에 두든 뒤에 두든, 브레드보드 어느 구멍을 거치든
   *   통과한다. 이 표는 «가장 곧은 한 가지 길» 을 보여 주기 위한 것이다.
   */
  var ANSWER_WIRES = {
    light: [
      { from: ["uno", "5V"], to: ["cds", "VCC"], color: "red" },
      { from: ["uno", PINS.cds], to: ["cds", "AO"], color: "orange" },
      { from: ["uno", "GND1"], to: ["cds", "GND"], color: "blue" },
      { from: ["uno", PINS.led], to: ["res", "R1"], color: "orange" },
      { from: ["res", "R2"], to: ["led", "A"], color: "orange" },
      { from: ["led", "K"], to: ["uno", "GND2"], color: "blue" }
    ],
    soil: [
      { from: ["uno", "5V"], to: ["soil", "VCC"], color: "red" },
      { from: ["uno", PINS.soil], to: ["soil", "AO"], color: "orange" },
      { from: ["uno", "GND1"], to: ["soil", "GND"], color: "blue" },
      { from: ["probe", "T1"], to: ["soil", "P1"], color: "gray" },
      { from: ["probe", "T2"], to: ["soil", "P2"], color: "gray" }
    ]
  };

  var ANSWER_COLOR_WORD = {
    red: "빨강(전원)",
    blue: "파랑(접지)",
    orange: "주황(신호)",
    gray: "색 없음"
  };

  /** 「이만큼도 통과한다」 — 표 하나로는 담을 수 없는 것들 */
  var ANSWER_NOTES = {
    light: [
      "저항을 LED 뒤(음극과 GND 사이)에 두어도 같은 직렬 회로라 통과합니다.",
      "브레드보드를 거쳐도 «같은 열» 이면 어느 구멍이든 통과합니다.",
      "우노의 GND 는 보드 안에서 이어져 있어 어느 GND 든 됩니다.",
      "케이블 색은 읽기 편하려고 쓰는 것이며 채점에 쓰지 않습니다."
    ],
    soil: [
      "탐침 두 선은 서로 구분이 없어 바꿔 꽂아도 통과합니다.",
      "브레드보드를 거쳐도 «같은 열» 이면 어느 구멍이든 통과합니다.",
      "우노의 GND 는 보드 안에서 이어져 있어 어느 GND 든 됩니다.",
      "DO 는 이 차시에서 쓰지 않습니다 — 측정은 AO 로 합니다."
    ]
  };

  /** 다리 구분이 있는 단자는 «어느 쪽 다리인지» 를 함께 적는다 */
  function answerName(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    var tail = "";
    if (pin && pin.kind === "anode") tail = " (긴 다리)";
    else if (pin && pin.kind === "cathode") tail = " (짧은 다리)";
    return describe(componentId, pinId) + tail;
  }

  /** 화면이 그대로 표로 낼 수 있는 모양으로 */
  function answerWires(goal) {
    return (ANSWER_WIRES[goal] || []).map(function (row, i) {
      var from = answerName(row.from[0], row.from[1]);
      var to = answerName(row.to[0], row.to[1]);
      return {
        no: i + 1,
        from: from,
        to: to,
        label: from + " ↔ " + to,
        color: row.color,
        colorWord: ANSWER_COLOR_WORD[row.color] || row.color
      };
    });
  }

  function answerNotes(goal) {
    return (ANSWER_NOTES[goal] || []).slice();
  }

  /* ------------------------------------------------------------------ */

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.circuit = {
    answerWires: answerWires,
    answerNotes: answerNotes,
    PITCH: PITCH,
    HEADER_PITCH: HEADER_PITCH,
    UNO: UNO,
    UNO_HEADER: LAYOUT.unoHeader,
    headerX: headerX,
    BB: BB,
    CDS: CDS,
    LED: LED,
    RES: RES,
    SOIL: SOIL,
    PROBE: PROBE,
    COMPONENTS: COMPONENTS,
    SCENES: SCENES,
    DEVICES: DEVICES,
    REQUIRED: REQUIRED,
    GOAL: GOAL,
    DANGER_RULES: DANGER_RULES,
    FIND_TASKS: FIND_TASKS,
    HINTS: HINTS,
    terminal: terminal,
    terminalList: terminalList,
    describe: describe,
    nodeOf: nodeOf,
    nodeLabel: nodeLabel,
    makeConnection: makeConnection,
    connectionKey: connectionKey,
    sameConnection: sameConnection,
    hasConnection: hasConnection,
    suggestColor: suggestColor,
    labelOfConnection: labelOfConnection,
    solve: solve,
    pathsBetween: pathsBetween,
    goalStatus: goalStatus,
    checkRequirement: checkRequirement,
    checkCircuit: checkCircuit,
    dangers: dangers,
    canPowerOn: canPowerOn,
    floatingLeads: floatingLeads,
    strayWires: strayWires,
    hintFor: hintFor,
    nextRequirement: nextRequirement,
    checkFind: checkFind,
    pinName: pinName,
    pinMismatch: pinMismatch,
    describeCurrent: describeCurrent
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.circuit;
})();

    <script data-from="shared/arduino.js">
/**

      digital: Object.keys(digital),

  /* ================================================================== */

  function run(source, opts) {

    var loopLimit = o.loopLimit === undefined ? 3 : o.loopLimit;
    var stepLimit = o.stepLimit === undefined ? 20000 : o.stepLimit;
    var timeLimit = o.timeLimit === undefined ? 20000 : o.timeLimit;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        error: parsed.error,
        serial: [],
        lines: [],
        steps: [],
        pins: {},
        iterations: 0,
        elapsed: 0,
        stopped: "문법 오류"
      };
    }

    var ast = parsed.ast;
    var scopes = [{}];
    var serial = [];
    var steps = [];
    var pinModes = {};
    var pinState = {};
    var serialOpen = false;
    var elapsed = 0;
    var stepCount = 0;
    var iterations = 0;
    var stopped = "";
    var pending = ""; /* Serial.print 로 아직 줄바꿈이 안 된 글 */

    function analogValue(pinName) {
      var src = o.analog;
      if (typeof src === "function") return clampAdc(src(pinName, elapsed));
      if (src && src[pinName] !== undefined) {
        var v = src[pinName];
        return clampAdc(typeof v === "function" ? v(elapsed) : v);
      }
      /* 아무것도 꽂히지 않은 아날로그 핀은 «값이 뜬다». 0 으로 두면 학생이 오해한다. */
      return 0;
    }

    function clampAdc(value) {
      var n = Math.round(Number(value));
      if (isNaN(n)) return 0;
      if (n < 0) return 0;
      if (n > ADC_MAX) return ADC_MAX;
      return n;
    }

    function tick(line, kind, detail) {
      stepCount += 1;
      if (stepCount > stepLimit) throw new StopRun("명령이 너무 많습니다(" + stepLimit + "개 넘음).");
      if (elapsed > timeLimit) throw new StopRun("가상 시간이 " + timeLimit + "ms 를 넘었습니다.");
      steps.push({
        line: line,
        kind: kind,
        detail: detail || "",
        t: elapsed,
        serialCount: serial.length,
        pins: copyPins(),
        vars: snapshotVars()
      });
    }

    function copyPins() {
      var out = {};
      Object.keys(pinState).forEach(function (k) {
        out[k] = pinState[k];
      });
      return out;
    }

    function snapshotVars() {
      var out = {};
      scopes.forEach(function (s) {
        Object.keys(s).forEach(function (k) {
          out[k] = s[k];
        });
      });
      return out;
    }

    function declare(name, value, isConst) {
      scopes[scopes.length - 1][name] = value;
      if (isConst) {
        var box = scopes[scopes.length - 1];
        if (!box.__const) box.__const = {};
        box.__const[name] = true;
      }
    }

    function lookup(name) {
      for (var i = scopes.length - 1; i >= 0; i -= 1) {
        if (Object.prototype.hasOwnProperty.call(scopes[i], name)) return { box: scopes[i], has: true };
      }
      return { box: null, has: false };
    }

    function pinNameOf(value) {
      if (value === null || value === undefined) return "";
      var v = String(value).toUpperCase();
      if (/^A\d+$/.test(v)) return v;
      if (/^\d+$/.test(v)) return "D" + v;
      if (/^D\d+$/.test(v)) return v;
      return v;
    }

    function writeSerial(text, newline) {
      if (!serialOpen) {
        /* Serial.begin 을 부르지 않으면 실제 아두이노에서도 아무것도 오지 않는다 */
        return false;
      }
      pending += String(text);
      if (newline) {
        serial.push({ t: elapsed, text: pending });
        pending = "";
      }
      return true;
    }

    function evalNode(node) {
      if (!node) return 0;

      switch (node.type) {
        case "num":
          return node.value;
        case "str":
          return node.value;
        case "ident": {
          if (CONSTANTS[node.name] !== undefined) return CONSTANTS[node.name];
          var found = lookup(node.name);
          if (!found.has) {
            throw new ParseError("«" + node.name + "» 이라는 이름을 찾을 수 없습니다. 먼저 선언했는지 보세요.", node.line);
          }
          return found.box[node.name];
        }
        case "index": {
          throw new ParseError("배열은 이 차시의 시뮬레이터가 다루지 않습니다.", node.line);
        }
        case "unary": {
          var v = evalNode(node.arg);
          return node.op === "-" ? -Number(v) : Number(v) ? 0 : 1;
        }
        case "bin": {
          var a = Number(evalNode(node.left));
          var b = Number(evalNode(node.right));
          if (node.op === "+") {
            /* 글자열 잇기도 받아 준다 — Serial.print("a" + b) 를 적는 학생이 있다 */
            var la = evalNode(node.left);
            var lb = evalNode(node.right);
            if (typeof la === "string" || typeof lb === "string") return String(la) + String(lb);
            return a + b;
          }
          if (node.op === "-") return a - b;
          if (node.op === "*") return a * b;
          if (node.op === "/") {
            if (b === 0) throw new ParseError("0 으로 나눌 수 없습니다.", node.line);
            /* 아두이노의 int 나눗셈은 소수점을 버린다 */
            return Math.trunc(a / b);
          }
          if (node.op === "%") {
            if (b === 0) throw new ParseError("0 으로 나눈 나머지는 구할 수 없습니다.", node.line);
            return a % b;
          }
          return 0;
        }
        case "cmp": {
          var l = evalNode(node.left);
          var r = evalNode(node.right);
          var ln = typeof l === "string" ? l : Number(l);
          var rn = typeof r === "string" ? r : Number(r);
          switch (node.op) {
            case ">":
              return ln > rn ? 1 : 0;
            case "<":
              return ln < rn ? 1 : 0;
            case ">=":
              return ln >= rn ? 1 : 0;
            case "<=":
              return ln <= rn ? 1 : 0;
            case "==":
              return ln === rn ? 1 : 0;
            case "!=":
              return ln !== rn ? 1 : 0;
          }
          return 0;
        }
        case "logic": {
          var left = Number(evalNode(node.left)) !== 0;
          if (node.op === "&&") return left && Number(evalNode(node.right)) !== 0 ? 1 : 0;
          return left || Number(evalNode(node.right)) !== 0 ? 1 : 0;
        }
        case "assign": {
          var target = lookup(node.name);
          if (!target.has) {
            throw new ParseError(
              "«" + node.name + "» 을 먼저 선언해야 값을 넣을 수 있습니다. (예: int " + node.name + " = 0;)",
              node.line
            );
          }
          if (target.box.__const && target.box.__const[node.name]) {
            throw new ParseError("«" + node.name + "» 은 const 이므로 값을 바꿀 수 없습니다.", node.line);
          }
          var value = evalNode(node.value);
          target.box[node.name] = value;
          return value;
        }
        case "call":
          return callNode(node);
      }
      return 0;
    }

    function callNode(node) {
      var name = node.name;
      var args = node.args || [];

      if (KNOWN_CALLS.indexOf(name) === -1) {
        throw new ParseError(
          "«" +
            name +
            "()» 는 이 차시의 시뮬레이터가 모르는 함수입니다. 쓸 수 있는 것 : " +
            KNOWN_CALLS.join(", "),
          node.line
        );
      }

      if (name === "Serial.begin") {
        serialOpen = true;
        var baud = args.length ? Number(evalNode(args[0])) : 9600;
        tick(node.line, "serial-begin", "시리얼 통신 시작 (" + baud + " bps)");
        return 0;
      }

      if (name === "Serial.print" || name === "Serial.println") {
        var value = args.length ? evalNode(args[0]) : "";
        var shown = typeof value === "number" ? String(value) : String(value);
        var ok = writeSerial(shown, name === "Serial.println");
        tick(
          node.line,
          "serial",
          ok
            ? (name === "Serial.println" ? "출력(줄바꿈) : " : "출력 : ") + shown
            : "Serial.begin() 을 부르지 않아 아무것도 나가지 않았습니다."
        );
        return 0;
      }

      if (name === "pinMode") {
        var pm = pinNameOf(evalNode(args[0]));
        var modeVal = args.length > 1 ? Number(evalNode(args[1])) : 1;
        pinModes[pm] = modeVal === 1 ? "OUTPUT" : modeVal === 2 ? "INPUT_PULLUP" : "INPUT";
        tick(node.line, "pinmode", pm + " 를 " + pinModes[pm] + " 으로 정함");
        return 0;
      }

      if (name === "analogRead") {
        var ap = pinNameOf(evalNode(args[0]));
        var av = analogValue(ap);
        tick(node.line, "analog-read", "analogRead(" + ap + ") → " + av);
        return av;
      }

      if (name === "digitalRead") {
        var dp = pinNameOf(evalNode(args[0]));
        var dv = pinState[dp] === "HIGH" ? 1 : 0;
        tick(node.line, "digital-read", "digitalRead(" + dp + ") → " + (dv ? "HIGH" : "LOW"));
        return dv;
      }

      if (name === "digitalWrite") {
        var wp = pinNameOf(evalNode(args[0]));
        var wv = Number(evalNode(args[1])) !== 0 ? "HIGH" : "LOW";
        pinState[wp] = wv;
        var warn = pinModes[wp] === "OUTPUT" ? "" : " (pinMode(" + wp + ", OUTPUT) 을 먼저 부르는 것이 바릅니다)";
        tick(node.line, "digital-write", wp + " ← " + wv + warn);
        return 0;
      }

      if (name === "analogWrite") {
        var awp = pinNameOf(evalNode(args[0]));
        var awv = Number(evalNode(args[1]));
        pinState[awp] = awv > 0 ? "HIGH" : "LOW";
        tick(node.line, "analog-write", awp + " ← " + awv + " (PWM)");
        return 0;
      }

      if (name === "delay") {
        var ms = Number(evalNode(args[0])) || 0;
        if (ms < 0) throw new ParseError("delay() 에는 0 이상을 넣습니다.", node.line);
        elapsed += ms;
        tick(node.line, "delay", ms + "ms 기다림");
        return 0;
      }

      if (name === "map") {
        var v0 = Number(evalNode(args[0]));
        var i0 = Number(evalNode(args[1]));
        var i1 = Number(evalNode(args[2]));
        var o0 = Number(evalNode(args[3]));
        var o1 = Number(evalNode(args[4]));
        if (i1 === i0) return o0;
        return Math.trunc(((v0 - i0) * (o1 - o0)) / (i1 - i0) + o0);
      }

      if (name === "constrain") {
        var cv = Number(evalNode(args[0]));
        var lo = Number(evalNode(args[1]));
        var hi = Number(evalNode(args[2]));
        return cv < lo ? lo : cv > hi ? hi : cv;
      }

      return 0;
    }

    function execStatement(node) {
      if (!node) return;
      switch (node.type) {
        case "block": {
          scopes.push({});
          try {
            node.body.forEach(execStatement);
          } finally {
            scopes.pop();
          }
          return;
        }
        case "var": {
          var value = node.init ? evalNode(node.init) : 0;
          declare(node.name, value, node.isConst);
          tick(node.line, "declare", node.name + " = " + value);
          return;
        }
        case "expr":
          evalNode(node.expr);
          return;
        case "if": {
          var truth = Number(evalNode(node.cond)) !== 0;
          tick(node.line, "if", "조건식 → " + (truth ? "True (참)" : "False (거짓)"));
          if (truth) execStatement(node.then);
          else if (node.else) execStatement(node.else);
          return;
        }
        case "empty":
          return;
      }
    }

    try {
      /* 전역 변수 */
      ast.globals.forEach(function (g) {
        var value = g.init ? evalNode(g.init) : 0;
        declare(g.name, value, g.isConst);
      });

      if (!ast.functions.setup) throw new StopRun("void setup() 이 없습니다.");
      if (!ast.functions.loop) throw new StopRun("void loop() 이 없습니다.");

      steps.push({ line: ast.functions.setup.line, kind: "enter", detail: "setup() 시작", t: 0, serialCount: 0, pins: {}, vars: {} });
      execStatement(ast.functions.setup.body);

      for (var i = 0; i < loopLimit; i += 1) {
        iterations = i + 1;
        steps.push({
          line: ast.functions.loop.line,
          kind: "enter",
          detail: "loop() " + iterations + "번째 바퀴",
          t: elapsed,
          serialCount: serial.length,
          pins: copyPins(),
          vars: snapshotVars()
        });
        execStatement(ast.functions.loop.body);
      }
    } catch (err) {
      if (err instanceof StopRun || err.name === "StopRun") {
        stopped = err.reason;
      } else {
        /* 남은 글이 있으면 흘려보내고 오류를 돌려준다 */
        if (pending) serial.push({ t: elapsed, text: pending });
        return {
          ok: false,
          error: { message: err.message || String(err), line: err.line || 0 },
          serial: serial,
          lines: serial.map(function (s) {
            return s.text;
          }),
          steps: steps,
          pins: copyPins(),
          pinModes: pinModes,
          iterations: iterations,
          elapsed: elapsed,
          stopped: "실행 중 오류"
        };
      }
    }

    if (pending) serial.push({ t: elapsed, text: pending });

    return {
      ok: true,
      error: null,
      serial: serial,
      lines: serial.map(function (s) {
        return s.text;
      }),
      steps: steps,
      pins: copyPins(),
      pinModes: pinModes,
      iterations: iterations,
      elapsed: elapsed,
      stopped: stopped
    };
  }

  /* ================================================================== */
  /* 5. 코드 검사 (명세 10.2 · 11.2 · 20.2)                               */
  /* ================================================================== */

  /**
   * 검사 하나 = { id, label, fix, test(ctx) → bool }
   *   ctx = { ast, source, pins, run(analog) }
   *
   * 검사는 «학생이 무엇을 배웠는지» 를 보는 것이다. 글자를 그대로 견주지 않는다.
   */
  var TESTS = {
    light: [
      {
        id: "serial-begin",
        label: "Serial.begin(9600) 으로 시리얼을 연다",
        fix: "setup() 안에 Serial.begin(9600); 을 넣으세요.",
        test: function (ctx) {
          return callsInFunction(ctx.ast, "setup", "Serial.begin").length > 0;
        }
      },
      {
        id: "pinmode-led",
        label: "LED 핀을 OUTPUT 으로 정한다",
        fix: "setup() 안에 pinMode(LED, OUTPUT); 을 넣으세요.",
        test: function (ctx) {
          return callsInFunction(ctx.ast, "setup", "pinMode").length > 0;
        }
      },
      {
        id: "analog-read",
        label: "analogRead(" + PINS.cds + ") 로 조도센서를 읽는다",
        fix: "loop() 안에서 analogRead(" + PINS.cds + ") 로 값을 읽어 변수에 담으세요.",
        test: function (ctx) {
          return (
            callsInFunction(ctx.ast, "loop", "analogRead").length > 0 &&
            ctx.pins.analog.indexOf(PINS.cds) !== -1
          );
        }
      },
      {
        id: "serial-out",
        label: "읽은 값을 시리얼 모니터로 내보낸다",
        fix: 'Serial.print("CDS_Sensor: "); 와 Serial.println(val); 을 넣으세요.',
        test: function (ctx) {
          var out = ctx.run({ A0: 988 });
          return out.ok && out.lines.some(function (l) {
            return /988/.test(l);
          });
        }
      },
      {
        id: "threshold-if",
        label: "기준값과 비교하는 조건문이 있다",
        fix: "if (val > LIGHT_THRESHOLD) { … } else { … } 처럼 비교하는 조건문을 넣으세요.",
        test: function (ctx) {
          var found = false;
          walkAll(ctx.ast, function (node) {
            if (node.type === "if" && node.cond && (node.cond.type === "cmp" || node.cond.type === "logic")) {
              found = true;
            }
          });
          return found;
        }
      },
      {
        id: "dark-on",
        label: "어두울 때(값 988) LED 가 켜진다",
        fix: "이 회로에서는 어두울수록 값이 큽니다. val > 기준값 이면 digitalWrite(LED, HIGH) 가 되게 하세요.",
        test: function (ctx) {
          var out = ctx.run({ A0: 988 });
          return out.ok && out.pins[PINS.led] === "HIGH";
        }
      },
      {
        id: "bright-off",
        label: "밝을 때(값 320) LED 가 꺼진다",
        fix: "밝을 때는 digitalWrite(LED, LOW) 가 되어야 합니다.",
        test: function (ctx) {
          var out = ctx.run({ A0: 320 });
          return out.ok && out.pins[PINS.led] === "LOW";
        }
      },
      {
        id: "delay",
        label: "loop() 끝에 delay() 로 잠시 쉰다",
        fix: "loop() 끝에 delay(200); 을 넣으세요. 너무 빨리 읽으면 시리얼 모니터가 넘칩니다.",
        test: function (ctx) {
          return callsInFunction(ctx.ast, "loop", "delay").length > 0;
        }
      }
    ],
    soil: [
      {
        id: "serial-begin",
        label: "Serial.begin(9600) 으로 시리얼을 연다",
        fix: "setup() 안에 Serial.begin(9600); 을 넣으세요.",
        test: function (ctx) {
          return callsInFunction(ctx.ast, "setup", "Serial.begin").length > 0;
        }
      },
      {
        id: "analog-read",
        label: "analogRead(" + PINS.soil + ") 로 토양수분센서를 읽는다",
        fix: "loop() 안에서 analogRead(" + PINS.soil + ") 로 값을 읽으세요. " + PINS.cds + " 가 아닙니다.",
        test: function (ctx) {
          return (
            callsInFunction(ctx.ast, "loop", "analogRead").length > 0 &&
            ctx.pins.analog.indexOf(PINS.soil) !== -1
          );
        }
      },
      {
        id: "store-var",
        label: "읽은 값을 변수에 담는다",
        fix: "int soilMoisture = analogRead(" + PINS.soil + "); 처럼 변수에 담으세요.",
        test: function (ctx) {
          var found = false;
          walk((ctx.ast.functions.loop || {}).body, function (node) {
            if (
              node.type === "var" &&
              node.init &&
              node.init.type === "call" &&
              node.init.name === "analogRead"
            ) {
              found = true;
            }
          });
          return found;
        }
      },
      {
        id: "serial-label",
        label: "이름표와 값을 함께 출력한다",
        fix: 'Serial.print("Soil_moisture: "); 뒤에 Serial.println(soilMoisture); 를 넣으세요.',
        test: function (ctx) {
          var out = ctx.run({ A1: 880 });
          if (!out.ok) return false;
          var joined = out.lines.join("\n");
          return /880/.test(joined) && /[A-Za-z가-힣]/.test(joined);
        }
      },
      {
        id: "delay",
        label: "loop() 끝에 delay(100) 으로 잠시 쉰다",
        fix: "loop() 끝에 delay(100); 을 넣으세요.",
        test: function (ctx) {
          return callsInFunction(ctx.ast, "loop", "delay").length > 0;
        }
      }
    ],
    /** 선택 확장 — 건조 기준으로 «물을 주세요» 를 출력한다 (명세 11.3) */
    soilExt: [
      {
        id: "ext-if",
        label: "건조 기준값과 비교하는 조건문이 있다",
        fix: "if (soilMoisture > " + SOIL_DRY + ") { … } else { … } 를 넣으세요.",
        test: function (ctx) {
          var found = false;
          walkAll(ctx.ast, function (node) {
            if (node.type === "if" && node.cond && node.cond.type === "cmp") found = true;
          });
          return found;
        }
      },
      {
        id: "ext-dry",
        label: "건조할 때(값 900) 물을 주라는 글이 나온다",
        fix: '건조할 때 Serial.println("물을 주세요"); 가 나오게 하세요.',
        test: function (ctx) {
          var out = ctx.run({ A1: 900 });
          if (!out.ok) return false;
          var dryText = out.lines.join("\n");
          var wetOut = ctx.run({ A1: 300 });
          if (!wetOut.ok) return false;
          var wetText = wetOut.lines.join("\n");
          /* 두 조건에서 «다른 글» 이 나오는가 — 글귀를 그대로 견주지 않는다 */
          return dryText !== wetText;
        }
      },
      {
        id: "ext-wet",
        label: "수분이 충분할 때(값 300) 다른 글이 나온다",
        fix: 'else 쪽에 Serial.println("수분이 충분합니다"); 를 넣으세요.',
        test: function (ctx) {
          var out = ctx.run({ A1: 300 });
          if (!out.ok) return false;
          return out.lines.length > 0;
        }
      }
    ]
  };

  /**
   * 코드를 검사한다.
   *
   *   goal        'light' · 'soil' · 'soilExt'
   *   connections 회로 (핀 불일치를 함께 본다). 없으면 핀 검사를 건너뛴다.
   *
   * 돌려주는 것
   *   ok           문법이 맞고 검사를 모두 통과했는가
   *   syntax       { ok, message, line }
   *   results      [{ id, label, ok, fix }]
   *   passed/total
   *   pinMismatch  [{ code, circuit, message }]
   */
  function validate(source, ctx) {
    var c = ctx || {};
    var goal = c.goal || "light";
    var list = TESTS[goal] || TESTS.light;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        syntax: { ok: false, message: parsed.error.message, line: parsed.error.line },
        results: list.map(function (t) {

      fromPin: text(conn.fromPin),
      toComponent: text(conn.toComponent),
      toPin: text(conn.toPin),
      color: text(conn.color) || null
    };
  }

  /** 센서 한 갈래를 제출 모양으로 */
  function partPayload(part, goal) {
    var p = part || {};
    var circuit = p.circuit || {};
    var code = p.code || {};
    var experiment = p.experiment || {};
    var runs = experiment.runs || {};

    var conditions = ((PCns.SENSORS || {})[goal] || { conditions: [] }).conditions;
    var experiments = conditions.map(function (c) {
      var r = runs[c.id] || {};
      var item = {
        condition: c.id,
        conditionLabel: c.label,
        predict: clip(r.predict, 300),
        value: num(r.value),
        observation: clip(r.observation, LIMITS.textMax),
        ran: r.ran === true
      };
      /* 조도 실습에서는 LED 상태도 함께 남긴다 (명세 15장 light.experiments) */
      if (goal === "light") item.led = r.led === "ON" || r.led === true ? "ON" : "OFF";
      return item;
    });

    var out = {
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: num(circuit.attempts),
        errors: (circuit.errors || []).map(function (e) {
          return text(e).slice(0, 120);
        }),
        hintsUsed: num(circuit.hintsUsed),
        completed: circuit.completed === true,
        poweredOn: circuit.powerOn === true
      },
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        passed: code.passed === true,
        pinMismatch: (code.pinMismatch || []).map(function (m) {
          return text(m.code || m).slice(0, 60);
        })
      },
      experiments: experiments
    };

    /* 명세 15장의 이름을 그대로 쓴다 — light 는 threshold, soil 은 dryThreshold */
    if (goal === "light") out.threshold = num(p.threshold);
    else out.dryThreshold = num(p.threshold);

    /* 토양수분의 «선택 확장» (명세 11.3) */
    if (goal === "soil") {
      out.extension = {
        tried: (p.extension && p.extension.tried) === true,
        source: clip((p.extension || {}).source, LIMITS.codeMax || 4000),
        testsPassed: num((p.extension || {}).testsPassed)
      };
    }

    return out;
  }

  /**
   * 제출 자료 한 벌을 만든다.
   *
   *   options.now         제출 시각 (없으면 지금)
   *   options.submissionId 서버가 준 번호가 있으면 그대로
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var quiz = PCns.quiz;

    var answers = (s.assessment && s.assessment.answers) || {};
    var graded = quiz
      ? quiz.gradeAll(answers)
      : { isCorrect: [], score: 0, pass: false, total: 10, results: [] };

    /* 답안은 문항 순서대로 배열에 담는다 — 교사용이 열 번호로 읽는다 */
    var questions = quiz ? quiz.QUESTIONS : [];
    var answerList = questions.map(function (q) {
      var v = answers[q.id];
      if (q.type === "code") return clip(v, 600);
      return v === undefined || v === "" ? null : num(v);
    });

    var compare = s.compare || {};
    var table = compare.table || {};
    var comparePayload = {};
    ((PCns.lesson || {}).COMPARE_ROWS || []).forEach(function (row) {
      ["light", "soil"].forEach(function (side) {
        var key = row.id + ":" + side;
        comparePayload[key] = clip(table[key], 200);
      });
    });

    var app = compare.application || {};

    return {
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      lessonTitle: PCns.LESSON_TITLE || "",
      studentId: text((s.student || {}).studentId).trim(),
      studentName: text((s.student || {}).name).trim(),
      submittedAt: o.now || new Date().toISOString(),
      submissionId: text(o.submissionId || s.submissionId),

      light: partPayload(s.light, "light"),
      soil: partPayload(s.soil, "soil"),

      concept: {
        checks: (function () {
          var out = {};
          var checks = (s.concept || {}).checks || {};
          ((PCns.lesson || {}).CONCEPT_CHECKS || []).forEach(function (c) {
            out[c.id] = checks[c.id] === true;
          });
          return out;
        })(),
        attempts: num((s.concept || {}).attempts)
      },

      comparison: comparePayload,

      application: {
        sensors: clip(app.sensors, 300),
        lightRule: clip(app.lightRule, 300),
        soilRule: clip(app.soilRule, 300),
        design: clip(app.design, LIMITS.textMax),
        calibration: clip(app.calibration, LIMITS.textMax)
      },

      assessment: {
        answers: answerList,
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass
      },

      meta: {
        stepReached: num(s.step),
        userAgent: typeof navigator !== "undefined" ? text(navigator.userAgent).slice(0, 160) : ""
      }
    };
  }

  /** 같은 학생의 같은 차시를 하나로 세는 열쇠 */
  function dedupeKey(payload) {
    var p = payload || {};
    return text(p.lessonId) + "|" + text(p.studentId) + "|" + text(p.studentName).replace(/\s+/g, "");
  }

  /* ------------------------------------------------------------------ */
  /* 교사용이 읽을 때 — 빠진 칸을 채워 화면이 깨지지 않게                     */
  /* ------------------------------------------------------------------ */

  function normalizePart(raw, goal) {
    var p = raw || {};
    var circuit = p.circuit || {};
    var code = p.code || {};
    var conditions = ((PCns.SENSORS || {})[goal] || { conditions: [] }).conditions;

    var byId = {};
    (p.experiments || []).forEach(function (e) {
      if (e && e.condition) byId[e.condition] = e;
    });

    return {
      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors.map(text) : [],
        hintsUsed: num(circuit.hintsUsed),
        completed: circuit.completed === true,
        poweredOn: circuit.poweredOn === true
      },
      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        passed: code.passed === true,
        pinMismatch: Array.isArray(code.pinMismatch) ? code.pinMismatch.map(text) : []
      },
      experiments: conditions.map(function (c) {
        var e = byId[c.id] || {};
        return {
          condition: c.id,
          conditionLabel: c.label,
          predict: text(e.predict),
          value: num(e.value),
          observation: text(e.observation),
          ran: e.ran === true,
          led: text(e.led)
        };
      }),
      threshold: num(goal === "light" ? p.threshold : p.dryThreshold),
      extension: {
        tried: ((p.extension || {}).tried) === true,
        source: text((p.extension || {}).source),
        testsPassed: num((p.extension || {}).testsPassed)
      }
    };
  }

  function normalizeSubmission(raw) {
    var r = raw || {};
    var quiz = PCns.quiz;
    var questions = quiz ? quiz.QUESTIONS : [];
    var assessment = r.assessment || {};

    var answers = Array.isArray(assessment.answers) ? assessment.answers : [];
    var isCorrect = Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [];

    /* 정오표가 빠진 옛 파일이면 답으로 다시 채점한다 */
    if (isCorrect.length !== questions.length && quiz) {
      var map = {};
      questions.forEach(function (q, i) {
        map[q.id] = answers[i];
      });
      var graded = quiz.gradeAll(map);
      isCorrect = graded.isCorrect;
      if (!assessment.score) assessment.score = graded.score;
      if (assessment.pass === undefined) assessment.pass = graded.pass;
    }

    return {
      lessonId: text(r.lessonId),
      lessonTitle: text(r.lessonTitle),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      submittedAt: text(r.submittedAt),
      serverSubmittedAt: text(r.serverSubmittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),
      fileName: text(r.fileName),

      light: normalizePart(r.light, "light"),
      soil: normalizePart(r.soil, "soil"),

      concept: {
        checks: (r.concept || {}).checks || {},
        attempts: num((r.concept || {}).attempts)
      },
      comparison: r.comparison || {},
      application: {
        sensors: text((r.application || {}).sensors),
        lightRule: text((r.application || {}).lightRule),
        soilRule: text((r.application || {}).soilRule),
        design: text((r.application || {}).design),
        calibration: text((r.application || {}).calibration)
      },
      assessment: {
        answers: answers,
        isCorrect: isCorrect,
        score: num(assessment.score),
        total: num(assessment.total) || (PCns.ASSESS || {}).total || 10,
        pass: assessment.pass === true
      },
      meta: r.meta || {}
    };
  }

  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.schema = {
    LESSON_ID: LESSON_ID,
    text: text,
    clip: clip,
    contentLength: contentLength,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    sensorDone: sensorDone,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    cleanConnection: cleanConnection,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();

    <!-- 학생용 화면
         ★ 정답·해설 평문이 든 교사 자료 파일은 «여기에 없다». 교사용 HTML 만 그것을 읽는다.
            학생용에는 잠긴 정답(SEALED)만 들어간다 — shared/quiz.js 머리말 참고. -->
    <script data-from="student/s00-core.js">
/**
 * 학생용 코어 — 이름 공간과 «상태 그릇»
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.PC 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → constants → lesson → circuit → arduino → quiz → schema
 *   → s00-core → s10-ui → s20-store → s30-api → s40-board → s45-figures
 *   → s50-editor → s55-sim → s60-screens → s90-app
 *
 * ★ 상태의 «모양» 은 shared/schema.js 의 제출 규격과 짝을 맞춘다.
 *   조도와 토양수분이 «똑같은 모양» 을 갖게 한 것이 이 파일의 요점이다.
 *   그래서 3단계와 4단계가 화면 코드를 나눠 쓸 수 있다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /** 센서 한 갈래의 빈 상태 — 조도와 토양수분이 이것을 나눠 쓴다 */
  function emptyPart(goal) {
    var part = {
      /* A 단자 찾기 → B 결선 → C 점검·전원 */
      circuit: {
        findIndex: 0,
        findDone: false,
        findAttempts: 0,
        findPicks: {},
        connections: [],
        attempts: 0,
        errors: [],
        hintsUsed: 0,
        hintLevels: {},
        checked: false,
        completed: false,
        powerOn: false
      },

      /* 명세 10.2 — 예시 읽기 → 예시 실행 → 빈칸 완성 → 전체 수정.
         읽기 전에는 편집기를 «만들지 않는다». 그래서 단계를 기억한다. */
      code: {
        stage: "read",
        exampleRead: false,
        exampleRun: false,
        assembleOrder: [],
        assembleDone: false,
        blanks: {},
        blanksDone: false,
        source: "",
        testsPassed: 0,
        testsTotal: 0,
        attempts: 0,
        passed: false,
        ran: false,
        syntaxError: null,
        pinMismatch: []
      },

      /* 실험 — 조건마다 «예상 → 실행 → 관찰» */
      experiment: {
        runs: {},
        /* 슬라이더 위치. 조도는 밝기(0~100), 토양은 수분(0~100) */
        level: goal === "light" ? 55 : 50,
        lastValue: 0
      },

      /* 학생이 «직접 정한» 기준값 (명세 22장 «실제 데이터를 확인한 뒤 기준값을 정하는 과정») */
      threshold: 0,
      thresholdReason: ""
    };

    if (goal === "soil") {
      /* 선택 확장 — 물을 주세요 메시지 (명세 11.3) */
      part.extension = { tried: false, blanks: {}, source: "", testsPassed: 0, testsTotal: 0 };
      /* 모듈이 물에 잠겼는가 — 위험 상태 표시에 쓴다(명세 11.1) */
      part.submerged = false;
      /* 물 주기 애니메이션이 돌고 있는가 */
      part.watering = false;
    }

    return part;
  }

  /** 빈 상태 — 처음 열었을 때의 출발점 */
  function emptyState() {
    return {
      version: 1,
      /* STEPS 의 자리 번호 (0 = 시작하기) */
      step: 0,
      student: { studentId: "", name: "" },

      /* 1단계 — 넘어가는 조건은 «안전 수칙 확인» 하나다 (명세 6장 표) */
      intro: { safetyRead: false },

      /* 2단계 — 카드를 열어 보았는가 · 개념 확인 3문항 */
      concept: { opened: {}, choices: {}, checks: {}, attempts: 0 },

      /* 3단계 · 4단계 — 같은 모양이다 */
      light: emptyPart("light"),
      soil: emptyPart("soil"),

      /* 뺀 단계(비교·적용)의 자리 — 제출 규격을 지키려고 남겨 둔다 */
      compare: { table: {}, application: {} },

      /* 마지막 단계 — 형성평가·제출
         sealed = «답안을 냈다». 서버로 보내거나 JSON 으로 받아 낸 그 순간 참이 된다.
         참이 되면 답을 고칠 수 없고, 그때 비로소 [채점하기] 가 열린다.
         정답과 해설을 먼저 보고 답을 고치는 일을 막는 것이다(명세 13.1 · 15장). */
      assessment: { answers: {}, attempts: 0, graded: false, sealed: false },

      submissionId: "",
      submitted: null
    };
  }

  /* ------------------------------ 다듬기 ------------------------------ */

  function bool(v) {
    return v === true;
  }
  function num(v) {
    var n = Number(v);
    return isNaN(n) ? 0 : n;
  }
  function str(v) {
    return v === null || v === undefined ? "" : String(v);
  }
  function obj(v) {
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  }
  function arr(v) {
    return Array.isArray(v) ? v : [];
  }

  function normalizePart(raw, goal) {
    var base = emptyPart(goal);
    var r = obj(raw);

    var c = obj(r.circuit);
    base.circuit.findIndex = num(c.findIndex);
    base.circuit.findDone = bool(c.findDone);
    base.circuit.findAttempts = num(c.findAttempts);
    base.circuit.findPicks = obj(c.findPicks);
    base.circuit.connections = arr(c.connections)
      .map(function (item) {
        var conn = obj(item);
        return PC.circuit.makeConnection(
          { component: str(conn.fromComponent), pin: str(conn.fromPin) },
          { component: str(conn.toComponent), pin: str(conn.toPin) },
          str(conn.color) || null
        );
      })
      .filter(Boolean);
    base.circuit.attempts = num(c.attempts);
    base.circuit.errors = arr(c.errors).map(str);
    base.circuit.hintsUsed = num(c.hintsUsed);
    base.circuit.hintLevels = obj(c.hintLevels);
    base.circuit.checked = bool(c.checked);
    base.circuit.completed = bool(c.completed);
    base.circuit.powerOn = bool(c.powerOn);

    var code = obj(r.code);
    base.code.stage = str(code.stage) || "read";
    base.code.exampleRead = bool(code.exampleRead);
    base.code.exampleRun = bool(code.exampleRun);
    base.code.assembleOrder = arr(code.assembleOrder).map(str);
    base.code.assembleDone = bool(code.assembleDone);
    base.code.blanks = obj(code.blanks);
    base.code.blanksDone = bool(code.blanksDone);
    base.code.source = str(code.source);
    base.code.testsPassed = num(code.testsPassed);
    base.code.testsTotal = num(code.testsTotal);
    base.code.attempts = num(code.attempts);
    base.code.passed = bool(code.passed);
    base.code.ran = bool(code.ran);
    base.code.syntaxError = code.syntaxError || null;
    base.code.pinMismatch = arr(code.pinMismatch);

    var exp = obj(r.experiment);
    var runs = obj(exp.runs);
    base.experiment.runs = {};
    Object.keys(runs).forEach(function (id) {
      var item = obj(runs[id]);
      base.experiment.runs[id] = {
        predict: str(item.predict),
        ran: bool(item.ran),
        value: num(item.value),
        led: str(item.led),
        observation: str(item.observation)
      };
    });
    base.experiment.level = num(exp.level) || base.experiment.level;
    base.experiment.lastValue = num(exp.lastValue);

    base.threshold = num(r.threshold);
    base.thresholdReason = str(r.thresholdReason);

    if (goal === "soil") {
      var ext = obj(r.extension);
      base.extension.tried = bool(ext.tried);
      base.extension.blanks = obj(ext.blanks);
      base.extension.source = str(ext.source);
      base.extension.testsPassed = num(ext.testsPassed);
      base.extension.testsTotal = num(ext.testsTotal);
      base.submerged = bool(r.submerged);
      base.watering = false; /* 애니메이션 상태는 저장하지 않는다 */
    }

    /* ★ «회로를 통과했다» 는 기록만으로 유지하지 않는다.
       통과한 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 통과여서는 안 된다.
       저장 자료를 손으로 고쳐 통과를 만들어 두는 길도 이 두 줄이 막는다. */
    var verdict = PC.circuit.checkCircuit(goal, base.circuit.connections);
    if (!verdict.ok) {
      base.circuit.completed = false;
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.canPowerOn(goal, base.circuit.connections).ok) base.circuit.powerOn = false;

    /* ★ 코드 통과도 같다 — 저장된 코드를 지금 다시 검사한다. */
    if (base.code.passed) {
      var check = PC.arduino.validate(base.code.source, {
        goal: goal,
        connections: base.circuit.connections
      });
      base.code.passed = check.ok;
      base.code.testsPassed = check.passed;
      base.code.testsTotal = check.total;
    }

    return base;
  }

  /**
   * 저장해 둔 자료를 지금 형태에 맞춘다.
   * 예전에 저장한 자료에 빠진 칸이 있어도 화면이 깨지지 않게 한다.
   */
  function normalizeState(raw) {
    var base = emptyState();
    var r = obj(raw);
    var steps = PC.STEPS || [];

    base.step = num(r.step);
    if (base.step < 0 || base.step >= steps.length) base.step = 0;

    var student = obj(r.student);
    base.student.studentId = str(student.studentId);
    base.student.name = str(student.name);

    base.intro.safetyRead = bool(obj(r.intro).safetyRead);

    var concept = obj(r.concept);
    base.concept.opened = obj(concept.opened);
    base.concept.choices = obj(concept.choices);
    base.concept.checks = obj(concept.checks);
    base.concept.attempts = num(concept.attempts);

    base.light = normalizePart(r.light, "light");
    base.soil = normalizePart(r.soil, "soil");

    var compare = obj(r.compare);
    base.compare.table = obj(compare.table);
    base.compare.application = obj(compare.application);

    var assessment = obj(r.assessment);
    base.assessment.answers = obj(assessment.answers);
    base.assessment.attempts = num(assessment.attempts);
    base.assessment.graded = bool(assessment.graded);
    base.assessment.sealed = bool(assessment.sealed);

    base.submissionId = str(r.submissionId);
    base.submitted = r.submitted || null;

    /* 이미 제출을 마친 자료라면 답안은 잠긴 것이다.
       저장 자료에서 sealed 만 지워 답을 고치는 길을 막는다. */
    if (base.submitted) base.assessment.sealed = true;
    /* 잠기지 않았으면 채점 결과도 열려 있을 수 없다 */
    if (!base.assessment.sealed) base.assessment.graded = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다 */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /* ------------------------------ 작은 도구 ------------------------------ */

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    if (state.intro.safetyRead) return true;
    if (Object.keys(state.concept.checks).length > 0) return true;
    if (state.light.circuit.connections.length > 0 || state.soil.circuit.connections.length > 0) return true;
    if (state.light.code.source || state.soil.code.source) return true;
    if (Object.keys(state.light.experiment.runs).length > 0) return true;
    if (Object.keys(state.soil.experiment.runs).length > 0) return true;
    if (Object.keys(state.compare.table).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    return false;
  }

  /** 시각을 「2026-08-22 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  /** 3단계·4단계가 어느 상태 칸을 쓰는지 — 화면 코드가 이 함수로 갈래를 고른다 */
  function partOf(state, goal) {
    return goal === "soil" ? state.soil : state.light;
  }

  S.emptyState = emptyState;
  S.emptyPart = emptyPart;
  S.normalizeState = normalizeState;
  S.normalizePart = normalizePart;
  S.hasContent = hasContent;
  S.formatTime = formatTime;
  S.partOf = partOf;

  if (typeof module !== "undefined" && module.exports) module.exports = S;
})();
