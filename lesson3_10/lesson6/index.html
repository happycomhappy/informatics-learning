    <script data-from="student/s10-ui.js">
/**
 * 화면 부품 (명세 18장)
 *
 * 여기서 만드는 요소는 모두 «텍스트로» 넣는다(textContent).
 * innerHTML 에 사람이 쓴 글을 넣지 않는다 — 스크립트가 섞여 들어갈 수 없게 하기 위해서다.
 *
 * 접근성 약속 (명세 18장)
 *   · 모든 입력에는 <label for> 을 붙인다
 *   · 정답/오답·위험은 색이 아니라 «아이콘 + 글자» 로도 알린다
 *   · 터치 영역은 최소 44px
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /* 화면이 없는 곳(테스트)에서는 이 파일이 하는 일이 없다 */
  if (typeof document === "undefined") return;

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return (prefix || "f") + "-" + uid;
  }

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  /**
   * 요소 하나를 만든다.
   *   el("p", { class: "note", text: "안녕" })
   *   el("button", { class: "btn btn--primary", text: "다음", on: { click: fn }, attrs: { type: "button" } })
   */
  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  /** SVG 요소 — HTML 과 이름 공간이 달라 따로 만든다 */
  function svg(tag, attrs, children) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      node.setAttribute(k, String(v));
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /* ------------------------------ 카드 ------------------------------ */

  function card(opts, children) {
    var o = opts || {};
    var head = [];
    if (o.eyebrow) head.push(el("p", { class: "card__eyebrow", text: o.eyebrow }));
    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));

    var parts = [];
    if (head.length) parts.push(el("div", { class: "card__head" }, head));
    parts.push(el("div", { class: "card__body" }, children || []));
    return el("section", { class: "card" + (o.tone ? " card--" + o.tone : "") }, parts);
  }

  /** 코드 상자 — 들여쓰기와 줄바꿈을 그대로 지킨다 */
  function codeBlock(code, caption) {
    var pre = el("pre", { class: "codeblock__pre", attrs: { tabindex: "0" } }, [
      el("code", { text: code })
    ]);
    return el("figure", { class: "codeblock" }, [
      caption ? el("figcaption", { class: "codeblock__cap", text: caption }) : null,
      pre
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */

  /**
   * 알림 상자. 색만으로 뜻을 전하지 않도록 «아이콘 + 말머리» 를 함께 넣는다(명세 18장).
   *   tone : info · ok · warn · danger
   */
  var TONE_MARK = {
    info: { icon: "ℹ", word: "안내" },
    ok: { icon: "✔", word: "확인" },
    warn: { icon: "⚠", word: "주의" },
    danger: { icon: "⛔", word: "위험" }
  };

  function alert(tone, message, children) {
    var mark = TONE_MARK[tone] || TONE_MARK.info;
    return el("div", { class: "alert alert--" + tone, attrs: { role: tone === "danger" ? "alert" : null } }, [
      el("span", { class: "alert__icon", attrs: { "aria-hidden": "true" }, text: mark.icon }),
      el("div", { class: "alert__body" }, [
        el("p", { class: "alert__text" }, [
          el("b", { class: "alert__word", text: mark.word + " " }),
          document.createTextNode(String(message || ""))
        ])
      ].concat(children || []))
    ]);
  }

  /** 조건 목록 한 줄 — 「✔ 통과」 또는 「○ 아직」 (명세 9장 · 18장) */
  function conditionRow(label, ok, detail) {
    return el("li", { class: "cond" + (ok ? " cond--ok" : "") }, [
      el("span", { class: "cond__mark", attrs: { "aria-hidden": "true" }, text: ok ? "✔" : "○" }),
      el("div", { class: "cond__body" }, [
        el("p", { class: "cond__label" }, [
          el("span", { class: "sr-only", text: ok ? "충족함: " : "아직 못 함: " }),
          document.createTextNode(String(label))
        ]),
        detail ? el("p", { class: "cond__detail", text: detail }) : null
      ]),
      el("span", { class: "cond__state", text: ok ? "통과" : "아직" })
    ]);
  }

  /**
   * 접어 두는 덧자료 — «마쳐야 하는 것» 과 «더 보고 싶은 것» 을 갈라 놓는다.
   *
   * 닫힌 채로 나온다. 펼칠 때 만들므로 열지 않으면 그리지도 않는다.
   * 통과 조건이 아닌 활동을 늘 펼쳐 두면, 학생은 그것도 해야 하는 줄 안다.
   */
  function foldout(title, build) {
    var body = el("div", { class: "foldout__body" });
    var wrap = el("details", { class: "foldout" }, [
      el("summary", { class: "foldout__sum", text: title }),
      body
    ]);
    var built = false;
    wrap.addEventListener("toggle", function () {
      if (!wrap.open || built) return;
      built = true;
      var made = build(body);
      if (made) body.appendChild(made);
    });
    return wrap;
  }

  /* ------------------------------ 입력 ------------------------------ */

  /**
   * 서술형·단답형 입력 한 칸.
   * spec : { label, min, placeholder, help, multiline, rows, mono }
   * 돌려주는 것 : { root, input, setError, refresh }
   */
  function field(spec, value, onInput) {
    var s = spec || {};
    var id = nextId("in");
    var cntId = id + "-cnt";
    var errId = id + "-err";

    var input = s.multiline
      ? el("textarea", {
          class: "input input--area" + (s.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            rows: s.rows || 3,
            placeholder: s.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (PC.LIMITS && PC.LIMITS.textMax) || 1000
          }
        })
      : el("input", {
          class: "input" + (s.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            type: "text",
            placeholder: s.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (PC.LIMITS && PC.LIMITS.textMax) || 1000
          }
        });
    input.value = value || "";

    function countText() {
      var len = PC.schema.contentLength(input.value);
      return s.min ? "공백 제외 " + len + "자 / 최소 " + s.min + "자" : "공백 제외 " + len + "자";
    }

    var counter = el("p", { class: "field__count", id: cntId, text: countText() });
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

    function refresh() {
      counter.textContent = countText();
      var enough = !s.min || PC.schema.contentLength(input.value) >= s.min;
      counter.className = "field__count" + (enough ? " field__count--ok" : "");
    }

    input.addEventListener("input", function () {
      refresh();
      if (onInput) onInput(input.value);
    });

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", cntId + " " + errId);

        error.textContent = "";
        error.hidden = true;
        input.removeAttribute("aria-invalid");
        input.setAttribute("aria-describedby", cntId);
      }
    }

    var rootNode = el("div", { class: "field" }, [
      el("label", { class: "field__label", attrs: { for: id }, text: s.label || "" }),
      s.help ? el("p", { class: "field__help", text: s.help }) : null,
      input,
      el("div", { class: "field__foot" }, [counter, error])
    ]);

    return { root: rootNode, input: input, setError: setError, refresh: refresh };
  }

  /**
   * 보기 고르기 (라디오). 색이 아니라 «글자» 로 고른 것을 알린다.
   * spec : { name, legend, choices:[문자열], numbered }
   */
  function choiceGroup(spec, selected, onPick) {
    var s = spec || {};
    var name = s.name || nextId("q");
    var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

    var items = (s.choices || []).map(function (label, i) {
      var id = name + "-" + i;
      var input = el("input", {
        class: "choice__input",
        id: id,
        attrs: { type: "radio", name: name, value: String(i) }
      });
      if (String(selected) === String(i)) input.checked = true;
      input.addEventListener("change", function () {
        if (onPick) onPick(i);

      return el("div", { class: "choice" }, [

        el("label", { class: "choice__label", attrs: { for: id } }, [
          s.numbered === false
            ? null
            : el("span", { class: "choice__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
          el("span", { class: "choice__text", text: label })
        ])

    });

    return el("fieldset", { class: "choices" }, [
      s.legend ? el("legend", { class: "choices__legend", text: s.legend }) : null

  }

  function button(label, opts) {
    var o = opts || {};
    var attrs = {
      type: "button",
      disabled: o.disabled ? true : null,

    Object.keys(o.attrs || {}).forEach(function (k) {
      attrs[k] = o.attrs[k];
    });

    return el("button", {
      class: o.class && o.class.indexOf("btn") === 0 ? o.class : "btn " + (o.class || "btn--primary"),
      text: label,
      attrs: attrs,
      on: o.on || (o.click ? { click: o.click } : null)
    });
  }

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,
   * 초점을 상자 안에 잡아 준다. file:// 에서도 그대로 동작한다.
   *
   * spec = {
   *   title, lines[], okLabel, cancelLabel,
   *   onOk, onCancel,
   *   dismiss : "ok" | "cancel"   — Esc 로 닫았을 때 어느 쪽으로 볼지
   * }
   *
   * ★ Esc 로 닫으면 «지우지 않는 쪽» 이 되게 부르는 곳에서 dismiss 를 정한다.
   *   실수로 눌러 기록이 사라지는 일은 되돌릴 수 없다.
   */
  function askDialog(spec) {

    /* 표처럼 넓은 것을 담을 때는 창도 넓힌다 */

      settled = true;
      if (dialog.open && dialog.close) dialog.close();
      /* 닫는 애니메이션이 끝난 뒤 치운다 */
      setTimeout(function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
      }, 0);
      if (which === "ok" && s.onOk) s.onOk();
      if (which === "cancel" && s.onCancel) s.onCancel();
    }

    var okBtn = button(s.okLabel || "확인", {
      click: function () {
        done("ok");
      }
    });

    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", text: s.title || "" }),
        el(
          "p",
          { class: "modal__text" },
          (s.lines || []).map(function (line, i) {
            /* 줄바꿈을 innerHTML 없이 만든다 (명세 18장 — 글은 textContent 로만) */
            return el("span", { class: "modal__line", text: line, id: i === 0 ? null : undefined });
          })
        ),
        /* 표처럼 «글이 아닌 것» 을 보일 때 쓴다. 부르는 곳이 만든 마디를 그대로 넣는다. */
        s.content || null,
        el("div", { class: "modal__actions" }, [
          /* 알리기만 하는 창은 [확인] 하나뿐이다 (single) */
          s.single
            ? null
            : button(s.cancelLabel || "취소", {
                class: "btn btn--ghost",
                click: function () {
                  done("cancel");
                }
              }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */
    okBtn.focus();

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 화면 낭독기에 조용히 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  S.ui = {
    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();

    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 6장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "sensor1-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();

    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 15장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 15장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 15장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();

    <script data-from="student/s40-board.js">
/**
 * 회로 그림과 조작 (명세 9장 · 18장)
 *
 * 부품 그림은 «자체 SVG» 로 그린다. 사진을 베끼지 않는다(명세 18장).
 * 그리는 좌표는 shared/circuit.js 가 갖고 있고, 여기서는 그 좌표대로 그리기만 한다.
 * 판정도 하지 않는다 — 눌린 단자를 바깥에 알려 줄 뿐이다.
 *
 * 세 가지 방식으로 모두 조작할 수 있어야 한다 (명세 9장)
 *   마우스·터치 : 단자를 차례로 누른다
 *   키보드      : Tab 으로 단자 사이를 옮기고 Enter·Space 로 고른다
 *   단자 목록   : 두 개의 목록에서 골라 [연결] 을 누른다 (가장 확실한 길)
 *
 * ★ 조도(3단계)와 토양수분(4단계)이 이 파일을 그대로 나눠 쓴다.
 *   달라지는 것은 goal 하나뿐이고, 어떤 부품을 그릴지는 circuit.SCENES 가 정한다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  /**
   * 케이블 색.
   *
   * 빨강 = 전원(5V), 파랑 = 접지(GND), 주황 = 신호.
   * 색은 «읽기 편하려고» 있는 것이고 정오 판정에 쓰지 않는다(명세 9장).
   * 그래서 목록에는 색 이름과 «어느 쪽 선인가» 를 글자로 함께 적는다(명세 18장).
   */
  var WIRE_COLORS = {
    red: "#d63b2f",
    blue: "#1d4ed8",
    orange: "#ea580c",
    gray: "#9aa3ae"
  };

  var COLOR_WORD = { red: "빨강", blue: "파랑", orange: "주황", gray: "회색" };

  /** 화면이 다시 그려져도 알림 한 줄은 남는다 (goal+mode 마다 하나) */
  var lastSaid = {};
  var SIDE_WORD = { red: "전원(5V) 쪽", blue: "접지(GND) 쪽", orange: "신호 쪽", gray: "쓰이지 않음" };

  /* ------------------------------------------------------------------ */
  /* 그림 폭 맞추기                                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 폭을 픽셀로 직접 적는 까닭 : CSS 의 min-width 와 함께 쓰면
   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   * 좁은 칸에서는 바닥값을 두어 단자가 손가락보다 작아지지 않게 한다(명세 18장 «44px»).
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    /* ★ 폭은 «CSS 가» 정한다. 여기서 재지 않는다.
       그리는 순간의 칸 폭은 아직 정해지지 않은 값일 수 있어서
       (화면에 붙기 전이거나 옆 칸이 자리를 잡기 전) 그 값으로 굳히면
       1000px 짜리 칸에서도 그림이 720px 으로만 그려지고 단자가 작아진다.
       실제로 그런 일이 있었다.
         결선  .board__svg        width:100% · min-width:720px
         찾기  .board__svg--find  width:100% · min-width:320px · max-width:560px
       또 «폭을 재서 폭을 정하는» 일은 스크롤바와 서로를 밀어 어긋나기도 한다.
       확대·축소 단추를 누른 «그때» 만 픽셀로 적는다 — 그때는 폭이 정해져 있다. */
    var find = (svgNode.getAttribute("class") || "").indexOf("board__svg--find") !== -1;
    if (find || Number(zoom) === 1) {
      svgNode.style.width = "";
      return;
    }
    var available = host.clientWidth || 720;
    svgNode.style.width = Math.round(Math.max(available, 720) * zoom) + "px";
  }

  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 부품 몸통 그리기                                                     */
  /* ------------------------------------------------------------------ */

  function txt(x, y, value, cls, anchor) {
    return UI.svg(
      "text",
      { x: x, y: y, class: cls || "fig__minitext", "text-anchor": anchor || "middle" },
      [document.createTextNode(String(value))]
    );
  }

  /**
   * 아두이노 우노 — 실물처럼 «헤더 두 줄» 을 다 그린다.
   *
   * ★ 이 차시가 쓰는 단자는 여덟 개뿐이지만, 구멍과 이름은 «전부» 그린다.
   *   실물과 같은 그림이라야 학생이 책상 위의 보드에서 같은 자리를 찾는다.
   *   누를 수 있는 것은 여전히 여덟 개다 — 서른 개를 다 누르게 하면
   *   좁은 화면에서 손가락으로 고를 수 없다(명세 18장 «44px»).
   *
   *   구멍의 자리는 circuit.js 의 LAYOUT.unoHeader 가 갖고 있고, 단자도 같은
   *   자리를 읽는다. 그래서 그림과 누르는 자리가 «따로» 움직이는 일이 없다.
   */
  function drawUno(g) {
    var u = C.UNO;
    var H = C.UNO_HEADER;

    g.appendChild(
      UI.svg("rect", { x: u.x, y: u.y, width: u.w, height: u.h, rx: 10, class: "uno__body" })
    );
    /* USB 잭 · 전원 잭 — 왼쪽 옆구리 */
    g.appendChild(UI.svg("rect", { x: u.x - 12, y: u.y + 42, width: 28, height: 38, rx: 3, class: "uno__usb" }));
    g.appendChild(UI.svg("rect", { x: u.x - 10, y: u.y + 160, width: 24, height: 34, rx: 5, class: "uno__jack" }));

    /** 헤더 한 줄 — 검은 띠, 구멍, 이름 */
    function header(row, labelBelow) {
      var first = C.headerX(row, 0);
      var last = C.headerX(row, row.names.length - 1);
      g.appendChild(
        UI.svg("rect", {
          x: first - 15,
          y: row.y - 15,
          width: last - first + 30,
          height: 30,
          rx: 3,
          class: "uno__header"
        })
      );
      row.names.forEach(function (name, i) {
        var x = C.headerX(row, i);
        g.appendChild(UI.svg("circle", { cx: x, cy: row.y, r: 7, class: "uno__hole" }));
        g.appendChild(txt(x, row.y + (labelBelow ? 30 : -22), name, "uno__pinname"));
      });
      return { first: first, last: last };
    }

    /* 위쪽 — 디지털. 이름은 띠 «아래» (실물 인쇄와 같다) */
    var top = header(H.top, true);
    g.appendChild(txt((top.first + top.last) / 2, H.top.y - 26, "DIGITAL (PWM ~)", "uno__group"));

    /* 아래쪽 — 전원과 아날로그. 이름은 띠 «위» */
    var bot = header(H.bottom, false);
    var split = C.headerX(H.bottom, H.bottom.gapAt - 1);
    var splitTo = C.headerX(H.bottom, H.bottom.gapAt);
    g.appendChild(txt((bot.first + split) / 2, H.bottom.y + 32, "POWER", "uno__group"));
    g.appendChild(txt((splitTo + bot.last) / 2, H.bottom.y + 32, "ANALOG IN", "uno__group"));

    /* 이름 — 두 헤더 사이 빈자리에 */
    g.appendChild(txt(u.x + 46, u.y + 122, "ARDUINO UNO", "uno__brand", "start"));
    g.appendChild(txt(u.x + 46, u.y + 146, "오픈 소스 하드웨어", "uno__brandsub", "start"));
  }

  /** 브레드보드 — 가운데 홈, 전원 레일, 열 번호 */
  function drawBreadboard(g) {
    var b = C.BB;
    var P = C.PITCH;
    /* ★ 구멍의 첫 자리는 circuit.js 가 갖고 있다.
       여기에 60 같은 숫자를 손으로 적어 두면 브레드보드를 옮길 때
       그림과 단자가 «따로» 움직인다. 실제로 그런 어긋남이 있었다. */
    var X0 = b.x0;
    var Y0 = b.y0;
    g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 선 두 줄 */
    g.appendChild(
      UI.svg("line", { x1: b.x + 12, y1: Y0, x2: b.x + b.w - 12, y2: Y0, class: "bb__railline bb__railline--plus" })
    );
    g.appendChild(
      UI.svg("line", {
        x1: b.x + 12,
        y1: Y0 + P,
        x2: b.x + b.w - 12,
        y2: Y0 + P,
        class: "bb__railline bb__railline--minus"
      })
    );
    g.appendChild(txt(b.x + 8, Y0 + 4, "＋", "bb__railmark", "end"));
    g.appendChild(txt(b.x + 8, Y0 + 4 + P, "−", "bb__railmark", "end"));

    /* 가운데 홈 — A~E 와 F~J 가 여기서 «끊긴다» */
    var gapY = Y0 + P * 8;
    g.appendChild(
      UI.svg("rect", { x: b.x + 8, y: gapY - 6, width: b.w - 16, height: 18, rx: 3, class: "bb__gap" })
    );
    g.appendChild(txt(b.x + b.w / 2, gapY + 7, "가운데 홈 — 위·아래가 끊겨 있다", "bb__gaptext"));

    /* 줄 이름표 */
    ["A", "B", "C", "D", "E"].forEach(function (row, i) {
      g.appendChild(txt(b.x - 6, Y0 + P * (3 + i) + 4, row, "bb__rowlabel", "end"));
    });
    ["F", "G", "H", "I", "J"].forEach(function (row, i) {
      g.appendChild(txt(b.x - 6, Y0 + P * (9 + i) + 4, row, "bb__rowlabel", "end"));
    });

    /* 열 번호 */
    for (var c = 1; c <= 12; c += 1) {
      g.appendChild(txt(X0 + (c - 1) * P, Y0 + P * 2 - 4, String(c), "bb__colno"));
    }
  }

  /** 조도센서 모듈 — 작은 기판 위의 CdS 소자 */
  function drawCds(g) {
    var m = C.CDS;
    g.appendChild(UI.svg("rect", { x: m.x, y: m.y, width: m.w, height: m.h, rx: 6, class: "mod__body" }));
    g.appendChild(txt(m.x + m.w / 2, m.y + 18, "조도센서 모듈", "mod__name"));
    /* CdS 소자 — 원판에 구불구불한 무늬 */
    var cx = m.x + m.w / 2;
    var cy = m.y + 62;
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: 24, class: "cds__face" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: 24, class: "cds__ring" }));
    var d = "";
    for (var i = 0; i < 6; i += 1) {
      var y = cy - 16 + i * 6.4;
      d += (i === 0 ? "M" : "L") + (cx - 17) + " " + y + "L" + (cx + 17) + " " + y;
    }
    g.appendChild(UI.svg("path", { d: d, class: "cds__zig" }));
    /* ★ 이름은 소자 «바로 아래» 에 둔다.
       기판 맨 아래(m.y + m.h - 6)에 두었더니 그 자리가 단자 자리와 겹쳐
       누르는 동그라미가 글자를 덮었다. 단자는 기판 가장자리에 있다. */
    g.appendChild(txt(cx, cy + 40, "CdS 광전도체", "mod__note"));

    /* 실물 모듈처럼 «기판 → 다리 → 단자» 로 잇는다.
       기판 가장자리에 금색 띠를 두고, 거기서 단자까지 선을 내린다.
       선이 있어야 «이 단자가 이 기판의 것» 이라는 것이 한눈에 보인다. */
    C.CDS.pins.forEach(function (pin) {
      g.appendChild(
        UI.svg("rect", { x: pin.x - 13, y: m.y + m.h - 8, width: 26, height: 14, rx: 3, class: "mod__pad" })
      );
      g.appendChild(
        UI.svg("line", { x1: pin.x, y1: m.y + m.h + 4, x2: pin.x, y2: pin.y, class: "mod__lead" })
      );
    });
  }

  /** LED — 반원 몸통과 긴 다리·짧은 다리 */
  function drawLed(g, lit) {
    var l = C.LED;
    var cx = l.x + 50;
    var cy = l.y + 44;
    g.appendChild(
      UI.svg("path", {
        d: "M" + (cx - 20) + " " + (cy + 16) + " L" + (cx - 20) + " " + cy + " A20 20 0 0 1 " + (cx + 20) + " " + cy + " L" + (cx + 20) + " " + (cy + 16) + " Z",
        class: "fig__led" + (lit ? " fig__led--on" : "")
      })
    );
    /* ★ 다리는 «단자가 있는 자리까지» 그린다.
       앞판은 다리를 곧게 내리고(x = cx±10) 단자는 그보다 바깥(455 · 505)에
       두어, 누르는 동그라미가 다리에서 떨어진 허공에 떠 있었다.
       실물 LED 처럼 다리를 바깥으로 벌려 «다리 끝 = 단자» 가 되게 한다.
       긴 다리(양극)가 더 길다 — 꺾이는 자리를 아래에 둔다. */
    var pinA = C.terminal("led", "A");
    var pinK = C.terminal("led", "K");
    /* 긴 다리(양극)는 «더 아래» 에서 꺾인다 — 길이 차이가 눈에 보이게 */
    g.appendChild(
      UI.svg("polyline", {
        points:
          (cx - 10) + "," + (cy + 16) + " " +
          (cx - 10) + "," + (pinA.y - 16) + " " +
          pinA.x + "," + pinA.y,
        class: "led__leg"
      })
    );
    g.appendChild(
      UI.svg("polyline", {
        points:
          (cx + 10) + "," + (cy + 16) + " " +
          (cx + 10) + "," + (pinK.y - 34) + " " +
          pinK.x + "," + pinK.y,
        class: "led__leg"
      })
    );
    /* 이름표는 단자 이름표(A · K)보다 «한 줄 아래» 에, 좌우로 벌려 놓는다.
       단자 동그라미와도, 서로도 겹치지 않는 자리다. */
    g.appendChild(txt(pinA.x - 15, pinA.y + 48, "＋ 긴 다리", "figtxt figtxt--pin"));
    g.appendChild(txt(pinK.x + 17, pinK.y + 48, "− 짧은 다리", "figtxt figtxt--pin"));
    if (lit) {
      /* 켜진 것을 «빛 무리» 로도 알린다. 색만으로 알리지 않는다(명세 18장) */
      g.appendChild(UI.svg("circle", { cx: cx, cy: cy + 2, r: 30, class: "led__glow" }));
      g.appendChild(txt(cx, l.y + 14, "LED 켜짐", "mod__state"));
    } else {
      g.appendChild(txt(cx, l.y + 14, "LED 꺼짐", "mod__state"));
    }
  }

  /** 220Ω 저항 — 몸통과 색띠 */

  /**
   * 탐침 — 두 갈래 판. submerged 면 «위험» 으로 표시한다(명세 11.1).
   */
  function drawProbe(g, opts) {
    var p = C.PROBE;
    var o = opts || {};
    /* 흙 */
    g.appendChild(UI.svg("rect", { x: p.x - 10, y: p.y + 46, width: p.w + 20, height: 70, rx: 6, class: "soil__dirt" }));
    /* 물기 — 수분에 따라 진해진다 */
    var wet = Math.max(0, Math.min(1, Number(o.moisture || 0) / 100));
    g.appendChild(
      UI.svg("rect", {
        x: p.x - 10,
        y: p.y + 46,
        width: p.w + 20,
        height: 70,
        rx: 6,
        class: "soil__water",
        opacity: (0.12 + wet * 0.55).toFixed(2)
      })
    );

      g.appendChild(UI.svg("rect", { x: x, y: p.y + 12, width: 12, height: 92, rx: 3, class: "probe__blade" }));
    });
    g.appendChild(txt(p.x + p.w / 2, p.y + 126, "⚠ 탐침만 흙에 넣는다", "mod__warn"));

    if (o.submerged) {
      g.appendChild(
        UI.svg("rect", { x: p.x - 14, y: p.y - 6, width: p.w + 28, height: 132, rx: 8, class: "danger__ring" })
      );
      /* ★ 안내는 탐침 «아래» 에 둔다. 위에 두면 단자 이름표(T1 · T2)와 겹친다 —
         단자가 탐침 «머리» 에 있고 이름표는 그 위에 붙기 때문이다. */
      g.appendChild(txt(p.x + p.w / 2, p.y + 148, "⛔ 전자회로가 물에 잠겼다", "mod__warn"));
    }

  var DRAW = {
    uno: drawUno,
    bb: drawBreadboard,
    cds: drawCds,
    led: drawLed,
    res: drawResistor,
    soil: drawSoil,
    probe: drawProbe
  };

  /* ------------------------------------------------------------------ */
  /* 회로 화면 하나 만들기                                                 */
  /* ------------------------------------------------------------------ */

  /**
   *   opts.goal       'light' · 'soil'
   *   opts.mode       'find'(단자 찾기) · 'wire'(결선)
   *   opts.getState   () => { connections, powerOn, ... }
   *   opts.getEnv     () => { ledOn, moisture, submerged }   — 그림에 얹을 상태
   *   opts.onPick     (component, pin) => void               — find 모드
   *   opts.onConnect  (connection) => void
   *   opts.onRemove   (index) => void
   *   opts.onMessage  (text) => void
   */
  function create(opts) {
    var o = opts || {};
    var goal = o.goal || "light";
    var mode = o.mode || "wire";
    var scene = C.SCENES[goal] || C.SCENES.light;
    var sayKey = goal + ":" + mode;

    /**
     * 이 화면이 그릴 부품.
     *
     * ★ «단자 찾기» 에서는 답이 있는 부품만 낸다(scene.findParts).
     *   그러면 눌러야 할 단자가 묻히지 않고, 그림도 크게 그릴 수 있다.
     */
    var shown = mode === "find" && scene.findParts ? scene.findParts : scene.parts;

    /**
     * 보이는 부품을 «꼭 감싸는» 네모를 구한다.
     *
     * 부품 좌표는 결선 화면(우노 + 브레드보드까지)에 맞춰 적어 두었다.
     * 찾기 모드에서는 부품 두세 개만 내므로 그 좌표대로 그리면 왼쪽 절반이 빈다.
     * 그래서 보이는 것만 감싸 viewBox 를 잡는다 — 좌표를 두 벌로 적지 않아도 된다.
     */
    /**
     * 「단자 찾기」 전용 자리로 옮기는 거리.
     *
     * 결선 화면은 «넓고 낮아야» 한다 — 브레드보드가 우노 옆에 있다.
     * 찾기 화면은 «좁고 높아야» 한다 — 틀이 좁을수록 그림이 크게 그려지고
     * 누르는 단자가 44px 을 넘는다(명세 18장).
     * 한 배치로 둘 다 채울 수 없으므로, 찾기 화면에서만 부품을 옮겨 그린다.
     * 옮기는 것은 «그림» 뿐이다 — 회로 판정은 좌표를 쓰지 않는다.
     */
    function shift(compId) {
      if (mode !== "find" || !scene.findLayout) return { dx: 0, dy: 0 };
      var to = scene.findLayout[compId];
      var comp = C.COMPONENTS[compId];
      if (!to || !comp) return { dx: 0, dy: 0 };
      return { dx: to.x - comp.x, dy: to.y - comp.y };
    }

    function frameOf(ids, tight) {
      /* 가로·세로 여백을 따로 둔다.
         «찾기» 화면은 세로로 길다. 위아래에 30 씩 빈자리를 두면 틀이 그만큼
         길어지고, 높이에 뚜껑이 씌워져 있으므로 그림 전체가 작아진다.
         그러면 누르는 단자가 44px 아래로 내려간다(명세 18장).
         가로 여백은 그대로 둔다 — «＋ 긴 다리» 같은 이름표가 옆으로 나가기 때문이다. */
      var padX = 30;
      var padY = tight ? 12 : 30;
      /* 단자 아래에는 이름표가 «두 줄» 까지 온다 (A · ＋ 긴 다리) */
      var below = tight ? 62 : 34;
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      ids.forEach(function (id) {
        var comp = C.COMPONENTS[id];
        if (!comp) return;
        var s2 = shift(id);
        minX = Math.min(minX, comp.x + s2.dx);
        minY = Math.min(minY, comp.y + s2.dy);
        maxX = Math.max(maxX, comp.x + comp.w + s2.dx);
        maxY = Math.max(maxY, comp.y + comp.h + s2.dy);
        /* 단자와 이름표가 몸통 밖으로 나가므로 함께 센다 */
        comp.pins.forEach(function (pin) {
          minX = Math.min(minX, pin.x + s2.dx - 26);
          minY = Math.min(minY, pin.y + s2.dy - (tight ? 44 : 26));
          maxX = Math.max(maxX, pin.x + s2.dx + 26);
          maxY = Math.max(maxY, pin.y + s2.dy + below);
        });
      });

      if (minX === Infinity) return { x: 0, y: 0, w: 740, h: 420 };
      return {
        x: minX - padX,
        y: minY - padY,
        w: maxX - minX + padX * 2,
        h: maxY - minY + padY * 2
      };
    }

    var zoom = 1;
    var picked = null; /* 한쪽만 고른 상태 { component, pin } */

    var canvas = UI.el("div", { class: "board__canvas", attrs: { "data-zoom": "1" } });
    var status = UI.el("p", { class: "board__status", attrs: { role: "status", "aria-live": "polite" } });
    var wireList = UI.el("ul", { class: "wirelist" });

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }
    function env() {
      return (o.getEnv && o.getEnv()) || {};
    }

    /**
     * 알림 한 줄.
     *
     * ★ 케이블을 지우면 화면이 통째로 다시 그려지고 이 판도 새로 만들어진다.
     *   그러면 방금 적은 알림이 사라져 «지워졌는지» 알 수 없다.
     *   그래서 마지막 말을 남겨 두고, 새로 만들어질 때 다시 부어 준다.
     *   (3·4단계 시리얼 모니터도 같은 까닭으로 같은 방법을 쓴다.)
     */
    function say(message) {
      lastSaid[sayKey] = message || "";
      status.textContent = message || "";
      if (o.onMessage) o.onMessage(message || "");
      if (message && UI.announce) UI.announce(message);
      /* 케이블을 잇거나 지우면 화면이 그 사이에 다시 그려져, 방금 적은 이 판이
         이미 문서에서 빠졌을 수 있다. 다음 그림틀에 «지금 화면의» 판에 다시 적는다. */
      if (root.requestAnimationFrame) {
        root.requestAnimationFrame(function () {
          var live = document.querySelector(".board__status");
          if (live && live !== status) live.textContent = lastSaid[sayKey];
        });
      }
    }

    /* ---------------------------- 단자 누르기 ---------------------------- */

    function pinPressed(componentId, pinId) {
      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      if (!picked) {
        picked = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 를 골랐습니다. 이제 이을 곳을 누르세요.");
        draw();
        return;
      }

      if (picked.component === componentId && picked.pin === pinId) {
        picked = null;
        say("고르기를 취소했습니다.");
        draw();
        return;
      }

      var conn = C.makeConnection(picked, { component: componentId, pin: pinId }, null);
      picked = null;
      if (!conn) {
        say("이을 수 없는 짝입니다.");
        draw();
        return;
      }
      conn.color = C.suggestColor(
        { component: conn.fromComponent, pin: conn.fromPin },
        { component: conn.toComponent, pin: conn.toPin }
      );

      if (C.hasConnection(state().connections, conn)) {
        say("이미 이어져 있는 케이블입니다.");
        draw();
        return;
      }
      /* ★ 알림을 «먼저» 적는다.
         o.onConnect 는 화면을 통째로 다시 그린다. 그 뒤에 적으면 이미 문서에서
         빠진 판에 적는 셈이 되어, 학생에게는 앞서 하던 말이 그대로 남아 보인다. */
      say(C.labelOfConnection(conn) + " 를 이었습니다.");
      if (o.onConnect) o.onConnect(conn);
    }

    /* ---------------------------- 그리기 ---------------------------- */

    function drawPins(g) {
      var st = state();
      var net = C.solve(st.connections || []);
      var used = {};
      (st.connections || []).forEach(function (c) {
        used[c.fromComponent + ":" + c.fromPin] = true;
        used[c.toComponent + ":" + c.toPin] = true;
      });

      shown.forEach(function (compId) {
        var s2 = shift(compId);
        var host =
          s2.dx || s2.dy ? UI.svg("g", { transform: "translate(" + s2.dx + "," + s2.dy + ")" }) : g;
        if (host !== g) g.appendChild(host);
        C.COMPONENTS[compId].pins.forEach(function (pin) {
          var key = compId + ":" + pin.id;
          var isPicked = picked && picked.component === compId && picked.pin === pin.id;

          var cls = "pin";
          if (pin.kind === "power") cls += " pin--hot";
          else if (pin.kind === "ground") cls += " pin--gnd";
          else if (pin.kind === "signal" || pin.kind === "analog") cls += " pin--sig";
          else if (pin.kind === "rail") cls += " pin--rail";
          else if (pin.kind === "hole") cls += " pin--tie";
          if (isPicked) cls += " pin--selected";
          if (used[key]) cls += " pin--wired";

          /* 손가락으로 누를 수 있는 큰 판 — 눈에 보이는 점보다 크다(명세 18장 «44px»)
             «찾기» 화면은 그림이 작게 그려지므로 여기서 조금 더 키운다.
             17 은 단자 사이 간격(조도 35 · 토양 40)보다 지름이 작아 서로 겹치지
             않는 가장 큰 값이다. */
          var hit = UI.svg("circle", {
            cx: pin.x,
            cy: pin.y,
            /* 찾기 화면은 그림이 작게 그려지므로 조금 더 키운다.
               «단자 사이 간격보다 지름이 작은» 가장 큰 값이다 —
               조도 모듈은 35 (→ 17), 토양 모듈은 40 (→ 19) 이다. */
            r: mode === "find" ? (goal === "soil" ? 19 : 17) : 15,
            class: "pin__hit",
            tabindex: "0",
            role: "button",
            "aria-label":
              C.describe(compId, pin.id) + (pin.note ? " — " + pin.note : "") + (used[key] ? " (이어져 있음)" : "")
          });
          hit.addEventListener("click", function () {
            pinPressed(compId, pin.id);
          });
          hit.addEventListener("keydown", function (evt) {
            if (evt.key === "Enter" || evt.key === " ") {
              evt.preventDefault();
              pinPressed(compId, pin.id);
            }
          });

          var group = UI.svg("g", { class: cls }, [
            UI.svg("circle", { cx: pin.x, cy: pin.y, r: pin.kind === "hole" ? 4.5 : 7, class: "pin__dot" }),
            hit
          ]);

          /* 구멍에는 이름표를 붙이지 않는다 — 120개가 겹쳐 읽을 수 없다.
             («찾기» 모드에는 구멍이 아예 없으므로 모든 단자에 이름이 붙는다) */
          /* 우노는 drawUno 가 이름을 «전부» 적었다. 여기서 또 적으면 겹친다. */
          if (pin.kind !== "hole" && pin.kind !== "rail" && compId !== "uno") {
            /* «찾기» 화면은 누르는 동그라미를 키웠으므로 이름표도 그만큼 내린다.
               22 로 두면 커진 동그라미가 글자의 윗부분을 덮는다. */
            var labelGap = mode === "find" ? 28 : 22;
            /* ★ 이름표 색.
               우노와 브레드보드의 단자는 «검은 헤더 위» 에 있으므로 흰 글자가 맞다.
               부품(모듈 · LED · 저항)의 단자는 기판 «밖 흰 자리» 에 놓이므로
               흰 글자면 아예 보이지 않는다. 실제로 VCC · AO · GND 가 그랬다. */
            var onBoard = compId === "uno" || compId === "bb";
            group.appendChild(
              UI.svg(
                "text",
                {
                  x: pin.x,
                  y: pin.y + (pin.side === "top" ? -labelGap : labelGap),
                  class: "pin__label" + (onBoard ? "" : " pin__label--part"),
                  "text-anchor": "middle"
                },
                [document.createTextNode(pin.short || pin.label)]
              )
            );
          }

          host.appendChild(group);
        });
      });
      return net;
    }

    /**
     * 케이블 그리기.
     *
     * ★ 이어 놓은 케이블을 «한 번 더 누르면» 지워진다.
     *   잘못 이었을 때 목록에서 그 줄을 찾아 [지우기] 를 누르는 것보다
     *   그 선을 바로 누르는 쪽이 빠르고, 학생이 먼저 시도하는 몸짓이기도 하다.
     *   가는 선은 누르기 어려우므로 «보이지 않는 굵은 선» 을 위에 겹쳐 둔다.
     *   키보드로도 닿게 tabindex 를 준다(명세 18장).
     */
    function drawWires(g) {
      var st = state();
      (st.connections || []).forEach(function (conn, index) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;
        /* 곧은 선 대신 살짝 휘어 겹친 선을 갈라 보이게 한다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 4 + 12);
        var d = "M" + a.x + " " + a.y + " Q" + mx + " " + my + " " + b.x + " " + b.y;
        var label = C.labelOfConnection(conn);

        var group = UI.svg("g", { class: "wire__g" });
        group.appendChild(
          UI.svg("path", { d: d, class: "wire", stroke: WIRE_COLORS[conn.color] || WIRE_COLORS.orange })
        );

        if (mode === "wire" && o.onRemove) {
          /* 지우겠다는 표시 — 선 가운데의 ✕. 평소에는 숨어 있다. */
          var cx = (a.x + 2 * mx + b.x) / 4;
          var cy = (a.y + 2 * my + b.y) / 4;
          var mark = UI.svg("g", { class: "wire__x" });
          mark.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: 11, class: "wire__xbg" }));
          mark.appendChild(txt(cx, cy + 5, "✕", "wire__xmark"));
          group.appendChild(mark);

          var hit = UI.svg("path", {
            d: d,
            class: "wire__hit",
            tabindex: "0",
            role: "button",
            "aria-label": label + " 케이블 — 누르면 지웁니다"
          });
          hit.addEventListener("click", function (evt) {
            evt.stopPropagation();
            say(label + " 케이블을 지웠습니다.");
            o.onRemove(index);
          });
          hit.addEventListener("keydown", function (evt) {
            if (evt.key === "Enter" || evt.key === " ") {
              evt.preventDefault();
              say(label + " 케이블을 지웠습니다.");
              o.onRemove(index);
            }
          });
          group.appendChild(hit);
        }

        g.appendChild(group);
      });
    }

    function draw() {
      UI.clear(canvas);
      var e = env();

      var box = frameOf(shown, mode === "find");
      var svgNode = UI.svg("svg", {
        class: "board__svg" + (mode === "find" ? " board__svg--find" : ""),
        viewBox: box.x + " " + box.y + " " + box.w + " " + box.h,
        role: "img",
        "aria-label":
          mode === "find"
            ? scene.label + " 부품 그림. 단자를 눌러 고르세요."
            : scene.label + " 회로 그림. " + C.describeCurrent(goal, state().connections)
      });

      var bodies = UI.svg("g", {});
      shown.forEach(function (compId) {
        var fn = DRAW[compId];
        if (!fn) return;
        var s2 = shift(compId);
        var host =
          s2.dx || s2.dy
            ? UI.svg("g", { transform: "translate(" + s2.dx + "," + s2.dy + ")" })
            : bodies;
        if (compId === "led") fn(host, e.ledOn === true);
        else if (compId === "probe") fn(host, { moisture: e.moisture, submerged: e.submerged });
        else fn(host);
        if (host !== bodies) bodies.appendChild(host);
      });
      svgNode.appendChild(bodies);

      var wires = UI.svg("g", {});
      drawWires(wires);
      svgNode.appendChild(wires);

      var pins = UI.svg("g", {});
      drawPins(pins);
      svgNode.appendChild(pins);

      canvas.appendChild(svgNode);
      canvas.setAttribute("data-zoom", String(zoom));
      fitSvg(canvas, zoom);
      drawWireList();
    }

    /* ---------------------------- 케이블 목록 ---------------------------- */

    function drawWireList() {
      UI.clear(wireList);
      var st = state();
      var list = st.connections || [];
      if (list.length === 0) {
        wireList.appendChild(UI.el("li", { class: "wirelist__empty", text: "아직 케이블이 없습니다." }));
        return;
      }
      list.forEach(function (conn, i) {
        var color = conn.color || "orange";
        wireList.appendChild(
          UI.el("li", { class: "wirelist__item" }, [
            UI.el("span", {
              class: "wirelist__dot wirelist__dot--" + color,
              attrs: { "aria-hidden": "true" }
            }),
            UI.el("span", { class: "wirelist__text", text: C.labelOfConnection(conn) }),
            UI.el("span", {
              class: "wirelist__side",
              text: COLOR_WORD[color] + " · " + SIDE_WORD[color]
            }),
            mode === "wire"
              ? UI.button("지우기", {
                  class: "btn btn--quiet btn--small",
                  attrs: { "aria-label": C.labelOfConnection(conn) + " 케이블 지우기" },
                  click: function () {
                    if (o.onRemove) o.onRemove(i);
                  }
                })
              : null
          ])
        );
      });
    }

    /* ---------------------------- 정답 결선표 ---------------------------- */

    /**
     * [정답 확인] — 「이렇게 이으면 된다」를 표 하나로 보여 준다.
     *
     * 표에 없는 길도 통과한다는 것을 «함께» 적는다. 그러지 않으면 학생이
     * 이 표를 유일한 정답으로 여겨, 저항을 뒤에 둔 자기 회로를 틀렸다고 생각한다.
     * 판정은 이 표가 아니라 전기적 마디로 한다(circuit.js 5장).
     */
    function showAnswer() {
      var rows = C.answerWires(goal);
      var table = UI.el("table", { class: "answer" });
      var head = UI.el("tr", {}, [
        UI.el("th", { class: "answer__no", text: "" }),
        UI.el("th", { text: "잇는 곳" }),
        UI.el("th", { text: "케이블 색" })
      ]);
      table.appendChild(UI.el("thead", {}, [head]));

      var body = UI.el("tbody", {});
      rows.forEach(function (row) {
        body.appendChild(
          UI.el("tr", {}, [
            UI.el("td", { class: "answer__no", text: String(row.no) }),
            UI.el("td", { class: "answer__wire", text: row.label }),
            UI.el("td", { class: "answer__color" }, [
              UI.el("span", {
                class: "answer__dot answer__dot--" + row.color,
                attrs: { "aria-hidden": "true" }
              }),
              UI.el("span", { text: row.colorWord })
            ])
          ])
        );
      });
      table.appendChild(body);

      var notes = UI.el("ul", { class: "answer__notes" });
      C.answerNotes(goal).forEach(function (line) {
        notes.appendChild(UI.el("li", { text: line }));
      });

      UI.askDialog({
        title: scene.label + " 정답 결선",
        lines: ["아래처럼 이으면 됩니다. 다만 «이 한 가지만» 정답인 것은 아닙니다."],
        content: UI.el("div", { class: "answer__box" }, [table, notes]),
        single: true,
        wide: true,
        okLabel: "닫기",
        dismiss: "ok"
      });
    }

    /* ---------------------------- 도구 줄 ---------------------------- */

    function buildTools() {
      var items = [];

      if (mode === "wire") {
        items.push(
          UI.button("되돌리기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              var list = state().connections || [];
              if (list.length === 0) {
                say("되돌릴 케이블이 없습니다.");
                return;
              }
              if (o.onRemove) o.onRemove(list.length - 1);
            }
          })
        );
        items.push(
          UI.button("전체 초기화", {
            class: "btn btn--ghost btn--small",
            click: function () {
              if (o.onClear) o.onClear();
            }
          })
        );
        items.push(
          UI.button("정답 확인", {
            class: "btn btn--ghost btn--small",
            click: showAnswer
          })
        );
        items.push(
          UI.button("고르기 취소", {
            class: "btn btn--quiet btn--small",
            click: function () {
              picked = null;
              say("고르기를 취소했습니다.");
              draw();
            }
          })
        );
      }

      items.push(
        UI.button("−", {
          class: "btn btn--icon btn--small",
          attrs: { "aria-label": "그림 축소" },
          click: function () {
            zoom = Math.max(0.6, Math.round((zoom - 0.2) * 10) / 10);
            draw();
          }
        })
      );
      items.push(
        UI.button("＋", {
          class: "btn btn--icon btn--small",
          attrs: { "aria-label": "그림 확대" },
          click: function () {
            zoom = Math.min(2.2, Math.round((zoom + 0.2) * 10) / 10);
            draw();
          }
        })
      );

      return UI.el("div", { class: "board__tools" }, [UI.el("div", { class: "board__toolgroup" }, items)]);
    }

    /* ---------------------------- 조립 ---------------------------- */

    var rootNode = UI.el("div", { class: "board" }, [
      /* 찾기 모드에는 도구 줄이 필요 없다 — 케이블을 잇는 것이 아니다 */
      mode === "wire" ? buildTools() : null,
      canvas,
      status,
      mode !== "wire" ? null : UI.el("div", { class: "wirelegend" }, [
        UI.el("span", { class: "wirelegend__item" }, [
          UI.el("span", { class: "wirelegend__dot wirelegend__dot--red", attrs: { "aria-hidden": "true" } }),
          UI.el("span", { text: "빨강 = 전원(5V)" })
        ]),
        UI.el("span", { class: "wirelegend__item" }, [
          UI.el("span", { class: "wirelegend__dot wirelegend__dot--blue", attrs: { "aria-hidden": "true" } }),
          UI.el("span", { text: "파랑 = 접지(GND)" })
        ]),
        UI.el("span", { class: "wirelegend__item" }, [
          UI.el("span", { class: "wirelegend__dot wirelegend__dot--orange", attrs: { "aria-hidden": "true" } }),
          UI.el("span", { text: "주황 = 신호" })
        ]),
        UI.el("span", { class: "wirelegend__note", text: "색은 읽기 편하려고 쓰는 것이며 채점에 쓰지 않습니다." })
      ]),
      /* «지우는 길» 을 글로도 알린다 — 그림만으로는 눌러 볼 생각을 하지 못한다 */
      mode !== "wire"
        ? null
        : UI.el("p", {
            class: "board__hint",
            text: "잘못 이었으면 그 케이블을 한 번 더 누르세요. 눌린 케이블은 지워집니다."
          }),
      mode === "wire" ? UI.el("h4", { class: "subhead", text: "이어 놓은 케이블" }) : null,
      mode === "wire" ? wireList : null
    ]);

    draw();
    /* 다시 그려지기 전에 하던 말을 되돌려 놓는다 */
    if (lastSaid[sayKey]) status.textContent = lastSaid[sayKey];

    return {
      root: rootNode,
      refresh: draw,
      say: say,
      clearPick: function () {
        picked = null;
        draw();
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_WORD: SIDE_WORD
  };
})();
    </script>
    <script data-from="student/s45-figures.js">
/**
 * 부품 그림 (명세 8장 · 18장 «부품 사진을 복제하지 말고 자체 SVG 를 제작한다»)
 *
 * 사진을 베끼지 않는다. 참고 자료를 보고 «무엇을 알아야 하는가» 만 남겨 다시 그렸다.
 * 그림마다 번호 딱지와 설명 목록을 함께 낸다 — 색과 모양만으로 뜻을 전하지 않기 위해서다.
 *
 * 여기 있는 그림은 «움직이지 않는» 그림이다.
 * 슬라이더로 값이 바뀌는 그림은 s55-sim.js 가 만든다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var PINS = PC.PINS || { cds: "A0", led: "D2", soil: "A1" };
  var ADC_MAX = PC.ADC_MAX === undefined ? 1023 : PC.ADC_MAX;

  function t(x, y, value, cls, anchor) {
    return UI.svg(
      "text",
      { x: x, y: y, class: cls || "fig__minitext", "text-anchor": anchor || "middle" },
      [document.createTextNode(String(value))]
    );
  }

  /**
   * 동그라미 숫자(①②③)를 «맨 숫자»(1 2 3)로 바꾼다.
   *
   * ★ 왜 바꾸는가
   *   번호는 «파란 동그라미 안의 흰 숫자» 하나로 보여야 한다.
   *   그런데 ① 이라는 글자는 그 자체가 동그라미를 그린다. 파란 동그라미 안에
   *   넣으면 동그라미가 두 개로 겹쳐 보인다.
   *
   *   자료(legend 의 no)에는 ①②③ 을 그대로 둔다 — 사람이 읽고 고치기 쉽다.
   *   화면에 «그릴 때만» 숫자로 바꾼다.
   *
   *   ※ 처럼 숫자가 아닌 표시는 그대로 지나간다.
   */
  var CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮";

  function plainNo(value) {
    var text = String(value === null || value === undefined ? "" : value);

    /* ★ «한 글자» 일 때만 바꾼다.
       빈 글이나 여러 글자를 그냥 indexOf 로 찾으면 안 된다 —
       "".indexOf 는 0 을 돌려주므로 빈 값이 «1» 로 바뀌어 버린다. */
    if (text.length !== 1) return text;

    var at = CIRCLED.indexOf(text);
    return at === -1 ? text : String(at + 1);
  }

  /** 번호 딱지 — 파란 동그라미 안에 «흰 숫자만» */
  function badge(no, x, y) {
    return UI.svg("g", { class: "fig__no" }, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg" }),
      t(x, y + 4, plainNo(no), "fig__badgeno")
    ]);
  }

  /** 가리키는 선 */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", { class: "fig__leader" }, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderline" }),
      UI.svg("circle", { cx: x2, cy: y2, r: 3, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 장 = SVG + 번호 설명 목록.
   *   spec = { caption, viewBox, draw(g), legend: [{ no, name, note }] }
   */
  function figure(spec) {
    var s = spec || {};
    var g = UI.svg("g", {});
    if (s.draw) s.draw(g);

    var svgNode = UI.svg(
      "svg",
      {
        class: "fig__svg",
        viewBox: s.viewBox || "0 0 520 300",
        role: "img",
        "aria-label":
          (s.caption || s.alt || "") +
          " " +
          (s.legend || [])
            .map(function (l) {
              return l.no + " " + l.name + ". " + (l.note || "");
            })
            .join(" ")
      },
      [g]
    );

    return UI.el("figure", { class: "fig" }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      s.caption ? UI.el("figcaption", { class: "fig__cap", text: s.caption }) : null,

  /**

   *
   * ★ 색만으로 뜻을 전하지 않는다(명세 18장) — ○ / ✕ 를 «도형으로» 그려 얹는다.
   *   글꼴에 없는 글자를 쓰면 기기마다 다르게 보이므로 원과 선으로 직접 그린다.
   */
  function drop(g, x, y, allowed) {
    /* 물방울 — 위가 뾰족하고 아래가 둥글다 */
    g.appendChild(
      UI.svg("path", {
        d:
          "M" + x + " " + (y - 26) +
          " C" + (x + 16) + " " + (y - 6) + ", " + (x + 20) + " " + (y + 6) + ", " + x + " " + (y + 18) +
          " C" + (x - 20) + " " + (y + 6) + ", " + (x - 16) + " " + (y - 6) + ", " + x + " " + (y - 26) + " Z",
        class: "wdrop"
      })
    );
    /* 빛나는 자리 — 물처럼 보이게 */
    g.appendChild(UI.svg("ellipse", { cx: x - 5, cy: y - 4, rx: 4, ry: 6, class: "wdrop__shine" }));

    if (allowed) {
      g.appendChild(UI.svg("circle", { cx: x, cy: y + 2, r: 9, class: "wmark wmark--ok" }));
    } else {
      g.appendChild(UI.svg("line", { x1: x - 7, y1: y - 5, x2: x + 7, y2: y + 9, class: "wmark wmark--no" }));
      g.appendChild(UI.svg("line", { x1: x + 7, y1: y - 5, x2: x - 7, y2: y + 9, class: "wmark wmark--no" }));
    }
  }

   *   한눈에 보이게 하려는 것이다.
   *
   * ★ 색만으로 뜻을 전하지 않는다(명세 18장).

  /**
   * 비교기 모듈의 네 단자 (명세 8.2 · 4.2)
   *
   * ★ 이 그림의 요점은 «AO 와 DO 는 하는 일이 다르다» 하나다.
   *   그래서 네 단자를 «한 줄로 나란히» 두고, 각 단자에서 아래로 곧게 선을 내려
   *   «어디로 가는가» 를 적는다. 선이 꼬이지 않게 자리를 미리 벌려 두었다.
   *
   * ★ 글자는 «어디에 놓이는가» 로 이름을 가른다
   *     기판 위(초록)  → figboard   (밝은 글자)
   *     종이 위(흰색)  → figtxt     (진한 글자)
   *   앞판은 둘 다 .mod__note · .fig__chiptext 였다.
   *   한 이름을 두 바탕에 쓰면 한쪽은 반드시 묻힌다.
   */
  function soilModule() {
    return figure({
      /* 제목을 화면에 내지 않는다. 카드 제목이 이미 같은 말을 하고 있다.
         낭독기에는 alt 로 알려 준다. */
      alt: "비교기 모듈의 네 단자 그림. AO 는 연속값, DO 는 0 또는 1 이다.",
      viewBox: "0 0 520 340",
      legend: [
        { no: "①", name: "탐침 입력 2핀", note: "흙에 꽂은 탐침 두 선이 여기로 들어온다" },
        { no: "②", name: "가변저항", note: "DO 의 기준을 정하는 나사. AO 값에는 영향이 적다" },
        { no: "③", name: "비교기 칩", note: "탐침 값과 기준을 견주어 DO 를 0 또는 1 로 만든다" },
        { no: "④", name: "VCC · GND", note: "전기를 받고 돌려보내는 단자 → 5V · GND" },
        { no: "⑤", name: "DO", note: "기준을 넘었는지만 0/1 로 알린다 — 이 차시에서는 쓰지 않는다" },
        { no: "⑥", name: "AO", note: "수분량이 연속값으로 나온다 → 우노 " + PINS.soil }
      ],
      draw: function (g) {
        var bx = 118;
        var by = 66;
        var bw = 286;
        var bh = 128;

        /* ── 탐침 입력 2핀 (기판 위쪽) ── */
        [bx + 54, bx + 104].forEach(function (x, i) {
          g.appendChild(UI.svg("line", { x1: x, y1: 40, x2: x, y2: by, class: "mod__wire" }));
          g.appendChild(UI.svg("rect", { x: x - 12, y: 27, width: 24, height: 15, rx: 3, class: "mod__pad" }));
          g.appendChild(t(x, 39, "P" + (i + 1), "figpad"));
        });
        g.appendChild(t(bx + 79, 17, "탐침 입력", "figtxt"));
        g.appendChild(badge("①", bx + 158, 34));

        /* ── 기판 ── */
        g.appendChild(UI.svg("rect", { x: bx, y: by, width: bw, height: bh, rx: 8, class: "mod__body" }));
        /* 나사 구멍 — «기판» 이라는 것을 알리는 작은 단서 */
        [
          [bx + 13, by + 15],
          [bx + bw - 13, by + 15]
        ].forEach(function (p) {
          g.appendChild(UI.svg("circle", { cx: p[0], cy: p[1], r: 5, class: "mod__screw" }));
        });
        g.appendChild(t(bx + bw / 2, by + 21, "토양수분 비교기 모듈", "figboard figboard--title"));

        /* ── 가변저항 (파란 사각 + 십자 홈) ── */
        var tx = bx + 28;
        var ty = by + 40;
        g.appendChild(UI.svg("rect", { x: tx, y: ty, width: 44, height: 44, rx: 4, class: "mod__trim" }));
        g.appendChild(UI.svg("circle", { cx: tx + 22, cy: ty + 22, r: 14, class: "mod__trimdial" }));
        g.appendChild(UI.svg("line", { x1: tx + 22, y1: ty + 10, x2: tx + 22, y2: ty + 34, class: "mod__trimline" }));
        g.appendChild(t(tx + 22, by + bh - 9, "가변저항", "figboard"));
        g.appendChild(badge("②", tx + 22, ty - 16));

        /* ── 비교기 칩 (검은 몸통 + 다리 여덟) ── */
        var qx = bx + 116;
        var qy = by + 44;
        g.appendChild(UI.svg("rect", { x: qx, y: qy, width: 62, height: 36, rx: 3, class: "mod__chip" }));
        for (var i = 0; i < 4; i += 1) {
          var lx = qx + 10 + i * 14;
          g.appendChild(UI.svg("line", { x1: lx, y1: qy, x2: lx, y2: qy - 6, class: "mod__chipleg" }));
          g.appendChild(UI.svg("line", { x1: lx, y1: qy + 36, x2: lx, y2: qy + 42, class: "mod__chipleg" }));
        }
        g.appendChild(t(qx + 31, qy + 23, "LM393", "figchip"));
/* ★ 칩 «오른쪽» 에 둔다.
           앞판은 (qx+31, qy-22) = 칩 바로 위였는데, 기판 제목
           «토양수분 비교기 모듈» 이 그 자리에 있어 글자를 가렸다. */
        g.appendChild(leader(qx + 78, qy + 18, qx + 64, qy + 18));
        g.appendChild(badge("③", qx + 90, qy + 18));

        /* ── 표시등 두 개 ── */
        [bx + 226, bx + 256].forEach(function (x, k) {
          g.appendChild(UI.svg("rect", { x: x - 8, y: by + 46, width: 16, height: 10, rx: 2, class: "mod__lamp" }));
          g.appendChild(t(x, by + 74, k === 0 ? "전원" : "DO", "figboard figboard--dim"));
        });

        /* ── 네 단자 : 한 줄로 나란히, 아래로 곧게 ── */
        var pins = [
          { label: "VCC", to: "5V", no: null, kind: "power" },
          { label: "GND", to: "GND", no: "④", kind: "power" },
          { label: "DO", to: "쓰지 않음", no: "⑤", kind: "unused" },
          { label: "AO", to: PINS.soil, no: null, kind: "signal" }
        ];
        var step = 64;
        var startX = bx + 47;
        var aoX = startX + step * 3;

        /* ── AO 칸의 옅은 테두리는 «단자보다 먼저» 그린다 ──
           ★ 앞판이 AO 를 통째로 감춘 까닭이 여기였다.
             이 사각형은 색이 채워져 있다. 단자를 그린 «뒤» 에 그리면
             금색 단자·«AO» 글자·아래로 내린 선·«A1» 까지 모두 덮어
             빈 상자만 남는다. 강조하려던 것이 도리어 사라진다. */
        g.appendChild(
          UI.svg("rect", {
            x: aoX - 32,
            y: by + bh - 10,
            width: 64,
            height: 78,
            rx: 8,
            class: "aohl"
          })
        );

        pins.forEach(function (p, k) {
          var x = startX + k * step;

          /* 금색 단자 */
          g.appendChild(UI.svg("rect", { x: x - 18, y: by + bh - 5, width: 36, height: 18, rx: 3, class: "mod__pad" }));
          g.appendChild(t(x, by + bh + 9, p.label, "figpad"));

          /* 아래로 곧게 내린 선 */
          g.appendChild(UI.svg("line", { x1: x, y1: by + bh + 14, x2: x, y2: by + bh + 42, class: "mod__wire" }));

          /* «어디로 가는가» — 종이 위이므로 진한 글자 */
          var cls =
            p.kind === "signal"
              ? "figtxt figtxt--go"
              : p.kind === "unused"
              ? "figtxt figtxt--off"
              : "figtxt";
          g.appendChild(t(x, by + bh + 58, p.to, cls));

          /* ★ ④(VCC·GND)는 «두 단자 가운데 아래» 에 하나만 둔다 — 아래에서 따로 그린다 */
          if (p.no && p.kind !== "power") g.appendChild(badge(p.no, x, by + bh + 84));
        });

        /* ── VCC·GND 는 하는 일이 한 쌍이라 한 번호로 묶는다 ──
           띠를 그리고 그 «가운데 아래» 에 ④ 를 둔다. */
        var midX = startX + step / 2;
        g.appendChild(
          UI.svg("line", {
            x1: startX,
            y1: by + bh + 68,
            x2: startX + step,
            y2: by + bh + 68,
            class: "mod__group"
          })
        );
        g.appendChild(badge("④", midX, by + bh + 88));

        /* ── AO 가 이 차시의 알맹이임을 «가리켜» 보인다 ──
           앞판은 «← 이 차시는 여기를 쓴다» 였는데, 화살표가 왼쪽을 가리켜
           무엇을 뜻하는지 알 수 없었다. 그래서
             ⓐ AO 칸 전체에 옅은 테두리를 두르고 (위에서 «먼저» 그렸다)
             ⓑ 글에서 AO 쪽으로 «위를 가리키는» 화살표를 그린다. */
        /* 위를 가리키는 화살표 */
        g.appendChild(
          UI.svg("line", { x1: aoX, y1: by + bh + 100, x2: aoX, y2: by + bh + 74, class: "aoarrow" })
        );
        g.appendChild(
          UI.svg("path", {
            d:
              "M" + (aoX - 6) + " " + (by + bh + 80) +
              " L" + aoX + " " + (by + bh + 70) +
              " L" + (aoX + 6) + " " + (by + bh + 80) + " Z",
            class: "aohead"
          })
        );
        g.appendChild(t(aoX, by + bh + 116, "이 차시는 여기를 쓴다", "figtxt figtxt--go"));
        /* ⑥ 은 A1 글자 오른쪽에 — 테두리·화살표와 겹치지 않는 자리 */
        g.appendChild(badge("⑥", aoX + 48, by + bh + 54));
      }
    });
  }

  /**
   * 토양수분 활용 — 스마트팜과 자동 급수 (명세 8.2 «활용 사례 카드»)
   *
   * ★ 앞판이 알아볼 수 없었던 까닭
   *   온실을 «옅은 파란 아치» 하나로만 그리고 그 안에 동그라미 세 개를 두었다.
   *   무엇이 온실인지, 어디에 센서가 있는지, 물이 어디서 나오는지 알 수 없었다.
   *
   * ★ 그래서 «일이 일어나는 순서» 를 그림에 담았다
   *       센서가 흙의 수분을 잰다 → 제어기가 기준과 견준다 → 마르면 펌프가 물을 준다
   *   화살표 세 개로 그 흐름을 잇고, 번호를 그 순서대로 붙였다.
   */
  function soilUse() {
    return figure({
      caption: "흙의 상태를 재어 «스스로 물을 주는» 장치 — 재기 · 판단 · 급수",
      viewBox: "0 0 580 320",
      legend: [
        { no: "①", name: "토양수분센서", note: "화분·밭 흙에 꽂아 수분을 «잰다»" },
        {
          no: "②",
          name: "제어기(아두이노)",
          note:
            "화면의 860 은 저항값(Ω)이 아니라 analogRead(" +
            PINS.soil +
            ") 이 돌려주는 «아날로그값 0~" +
            ADC_MAX +
            "» 이다. 흙이 마르면 저항이 커지고 → AO 전압이 올라가 → 이 값이 커진다"
        },
        { no: "③", name: "펌프와 관수관", note: "기준보다 마르면 «물을 준다»" },
        { no: "④", name: "스마트팜", note: "여러 곳의 값을 모아 온실 전체를 자동으로 돌린다" }
      ],
      draw: function (g) {
        /* ================= 온실 (뒤쪽 배경) ================= */
        var hx = 30;
        var hy = 66;
        var hw = 300;
        var hh = 176;

        /* 아치 지붕 + 벽 */
        g.appendChild(
          UI.svg("path", {
            d:
              "M" + hx + " " + (hy + hh) +
              " L" + hx + " " + (hy + 54) +
              " Q" + (hx + hw / 2) + " " + (hy - 34) + " " + (hx + hw) + " " + (hy + 54) +
              " L" + (hx + hw) + " " + (hy + hh) + " Z",
            class: "farm__house"
          })
        );
        /* 뼈대 — «온실» 로 보이게 하는 알맹이 */
        [0.25, 0.5, 0.75].forEach(function (t) {
          var x = hx + hw * t;
          var top = hy + 54 - Math.sin(t * Math.PI) * 78;
          g.appendChild(UI.svg("line", { x1: x, y1: top, x2: x, y2: hy + hh, class: "farm__rib" }));
        });
        g.appendChild(
          UI.svg("line", { x1: hx, y1: hy + 54, x2: hx + hw, y2: hy + 54, class: "farm__rib" })
        );
        g.appendChild(t(hx + hw / 2, hy + 16, "온실 (스마트팜)", "figtxt"));
        g.appendChild(badge("④", hx + hw - 22, hy + 34));

        /* ================= 관수관과 물뿌리개 (지붕 아래) ================= */
        var pipeY = hy + 76;
        g.appendChild(UI.svg("line", { x1: hx + 20, y1: pipeY, x2: hx + hw - 20, y2: pipeY, class: "farm__pipe" }));
        [0.2, 0.44, 0.68, 0.9].forEach(function (t2) {
          var x = hx + 20 + (hw - 40) * t2;
          g.appendChild(UI.svg("line", { x1: x, y1: pipeY, x2: x, y2: pipeY + 12, class: "farm__nozzle" }));
          /* 물방울 셋 — 물이 «내려오고 있다» */
          [0, 1, 2].forEach(function (k) {
            g.appendChild(
              UI.svg("circle", { cx: x, cy: pipeY + 22 + k * 13, r: 3, class: "soil__drop" })
            );
          });
        });
        g.appendChild(badge("③", hx + 12, pipeY));

        /* ================= 흙 두둑과 작물 ================= */
        var bedY = hy + hh - 30;
        g.appendChild(
          UI.svg("rect", { x: hx + 12, y: bedY, width: hw - 24, height: 30, rx: 5, class: "soil__dirt" })
        );
        g.appendChild(
          UI.svg("rect", {
            x: hx + 12, y: bedY, width: hw - 24, height: 30, rx: 5,
            class: "soil__water", opacity: "0.28"
          })
        );

        [0.16, 0.4, 0.64, 0.88].forEach(function (t3) {
          var x = hx + 20 + (hw - 40) * t3;
          /* 줄기와 잎 두 장 — «작물» 로 보이게 */
          g.appendChild(UI.svg("line", { x1: x, y1: bedY, x2: x, y2: bedY - 30, class: "farm__stem" }));
          g.appendChild(
            UI.svg("ellipse", { cx: x - 9, cy: bedY - 24, rx: 10, ry: 6, class: "use__leaf" })
          );
          g.appendChild(
            UI.svg("ellipse", { cx: x + 9, cy: bedY - 32, rx: 10, ry: 6, class: "use__leaf" })
          );
        });

        /* ================= ① 센서 — 흙에 꽂혀 있다 ================= */
        var sx = hx + 60;

  /* ------------------------------------------------------------------ */
  /* 형성평가 2번의 «기본 회로» 그림                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 토양수분 기본 회로 — 형성평가 2번이 쓴다.
   *
   * ★ 글 목록으로 보이던 것을 그림으로 바꿨다(선생님 요청).
   *   실물 배선 사진처럼 «우노 — 모듈 — 탐침» 을 나란히 두고 케이블을 잇는다.
   *
   * ★ 답을 흘리지 않는다
   *   이 문항의 답은 «AO ↔ A1» 이다. 그래서 전원선(빨강)과 접지선(검정)만 잇고,
   *   값을 읽는 선은 «점선과 ?» 로 남긴다. 어느 단자에도 닿지 않게 그린다 —

   */
  function quizSoilWiring() {
    return figure({
      caption: "기본 회로 — 전원과 접지, 탐침은 이미 이어 놓았습니다",
      viewBox: "0 0 560 300",
      legend: [
        { no: "①", name: "우노 5V ↔ 모듈 VCC", note: "빨강 — 모듈에 전기를 준다" },

      ],
      draw: function (g) {
        /* ================= 우노 (왼쪽) ================= */
        var ux = 16;
        var uy = 40;
        var uw = 190;
        var uh = 150;
        g.appendChild(UI.svg("rect", { x: ux, y: uy, width: uw, height: uh, rx: 8, class: "uno__body" }));
        g.appendChild(UI.svg("rect", { x: ux - 10, y: uy + 16, width: 24, height: 30, rx: 3, class: "uno__usb" }));

        g.appendChild(UI.svg("rect", { x: ux + 24, y: uy + uh - 32, width: uw - 44, height: 14, rx: 2, class: "uno__header" }));
        g.appendChild(t(ux + uw / 2, uy + 62, "ARDUINO UNO", "figboard figboard--title"));
        g.appendChild(t(ux + 66, uy + uh - 8, "POWER", "figboard figboard--dim"));
        g.appendChild(t(ux + 148, uy + uh - 8, "ANALOG IN", "figboard figboard--dim"));

        /* 아래 헤더의 구멍 — 쓰는 것만 이름을 적는다 */
        var headerY = uy + uh - 25;
        var upins = [
          { x: ux + 44, name: "5V" },
          { x: ux + 68, name: "GND" },

        });

        /* ================= 모듈 (가운데) ================= */
        var mx = 250;

        g.appendChild(UI.svg("line", { x1: mx + 84, y1: my + 31, x2: mx + 84, y2: my + 49, class: "mod__trimline" }));
        g.appendChild(UI.svg("rect", { x: mx + 12, y: my + 28, width: 34, height: 24, rx: 2, class: "mod__chip" }));
        g.appendChild(UI.svg("circle", { cx: mx + 20, cy: my + 64, r: 4.5, class: "fc28__led fc28__led--on" }));
        g.appendChild(UI.svg("circle", { cx: mx + 38, cy: my + 64, r: 4.5, class: "fc28__led" }));
        g.appendChild(t(mx + 84, my + 70, "FC-28", "figchip"));

        /* 네 단자 — 이름을 기판 안에 적는다 */
        var mpins = [
          { x: mx + 18, name: "VCC" },
          { x: mx + 46, name: "GND" },
          { x: mx + 72, name: "DO" },
          { x: mx + 98, name: "AO" }
        ];
        mpins.forEach(function (p) {
          g.appendChild(UI.svg("rect", { x: p.x - 11, y: my + mh - 5, width: 22, height: 13, rx: 2, class: "mod__pad" }));
          g.appendChild(t(p.x, my + mh - 9, p.name, "figboard figboard--pin"));
        });

        /* 탐침 입력 두 단자 — 위쪽 */
        [mx + 34, mx + 62].forEach(function (x) {
          g.appendChild(UI.svg("rect", { x: x - 8, y: my - 10, width: 16, height: 11, rx: 2, class: "mod__pad" }));
        });

        /* ================= 이어 놓은 케이블 두 줄 ================= */
        function cable(fromX, toX, dropY, cls) {
          var d =
            "M" + fromX + " " + (headerY + 6) +
            " L" + fromX + " " + dropY +
            " L" + toX + " " + dropY +

        }
        cable(upins[0].x, mpins[0].x, 252, "red");
        cable(upins[1].x, mpins[1].x, 234, "black");

        /* ================= 값을 읽는 선 — 점선과 ? ================= */
        /* ★ 어느 단자에도 «닿지 않게» 둔다. 닿으면 답을 알려 주는 셈이다. */
        var qFrom = { x: mx + 84, y: my + mh + 26 };
        var qTo = { x: ux + 136, y: headerY + 34 };
        g.appendChild(
          UI.svg("path", {

        /* ================= 탐침 (오른쪽) ================= */
        var px = 430;
        g.appendChild(UI.svg("rect", { x: px, y: 44, width: 76, height: 34, rx: 4, class: "probe__head" }));
        g.appendChild(t(px + 38, 66, "YL-69", "figchip"));
        [[mx + 34, px + 18], [mx + 62, px + 58]].forEach(function (pair) {
          var attrs = { x1: pair[0], y1: my - 10, x2: pair[1], y2: 60 };
          g.appendChild(UI.svg("line", attrs.x1 ? Object.assign({}, attrs, { class: "cable__case" }) : attrs));
          g.appendChild(UI.svg("line", Object.assign({}, attrs, { class: "cable cable--gray" })));
        });
        [px + 16, px + 46].forEach(function (x) {
          g.appendChild(
            UI.svg("path", {
              d: "M" + x + " 78 L" + (x + 14) + " 78 L" + (x + 14) + " 160 L" + (x + 7) + " 176 L" + x + " 160 Z",
              class: "probe__blade"
            })

        });
        g.appendChild(UI.svg("rect", { x: px - 14, y: 150, width: 104, height: 60, rx: 6, class: "soil__dirt" }));
        g.appendChild(t(px + 38, 226, "⚠ 탐침만 흙에 넣는다", "mod__warn"));
      }
    });
  }

  S.figures = {
    quizSoilWiring: quizSoilWiring,
    figure: figure,

    leader: leader,
    cdsInside: cdsInside,
    cdsModule: cdsModule,
    lightUse: lightUse,
    soilProbe: soilProbe,
    soilModule: soilModule,
    soilUse: soilUse,
    adcScale: adcScale,
    serialWindow: serialWindow,
    threeStep: threeStep,
    /** 그 카드에 붙일 그림을 만든다. 없으면 null. */
    forCard: function (id) {
      return BY_CARD[id] ? BY_CARD[id]() : null;
    },
    has: function (id) {
      return !!BY_CARD[id];
    }
  };
})();

    <script data-from="student/s50-editor.js">

 * 코딩 화면 부품 (명세 10.2 · 11.2 · 14장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
