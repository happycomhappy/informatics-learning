<html lang="ko">
  <head>

    <meta name="color-scheme" content="light" />

    <meta name="description" content="피지컬 컴퓨팅의 원리와 아두이노 탐색 · 제출 현황 분석 (교사용)" />
    <title>제출 현황 분석 | 피지컬 컴퓨팅의 원리와 아두이노 탐색</title>

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}

.alert__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.alert__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.alert--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}
.alert--info .alert__word {
  color: var(--color-primary-dark);
}

.alert--ok {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}
.alert--ok .alert__word {
  color: var(--color-true-dark);
}

.alert--warn {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}
.alert--warn .alert__word {
  color: var(--color-false-dark);
}

.alert--danger {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}
.alert--danger .alert__word {
  color: var(--color-error);
}

/* 조건 목록 (명세 6.2) */
.condlist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cond {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cond--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cond__mark {
  font-weight: 800;
  color: var(--color-text-sub);
}

.cond--ok .cond__mark {
  color: var(--color-true-dark);
}

.cond__body {
  flex: 1;
}

.cond__label {
  font-weight: 700;
}

.cond__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cond__state {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.cond--ok .cond__state {
  color: var(--color-true-dark);
}

/* ------------------------------ 코드 ------------------------------ */

.codeblock {
  margin: 0;
}

.codeblock__cap,
.codeview__cap {
  font-size: 13px;
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.codeblock__pre {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  border-radius: var(--radius);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  tab-size: 2;
}

.codeview {
  margin: 0;
}

.codeview__lines {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3) 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
}

.codeline {
  display: flex;
  gap: var(--space-3);
  padding: 0 var(--space-4);
  white-space: pre;
  position: relative;
}

.codeline__no {
  color: var(--tok-comment);
  min-width: 2ch;
  text-align: right;
  user-select: none;
}

.codeline__text {
  color: var(--color-console-text);
}

.codeline--active {
  background: rgba(37, 99, 235, 0.28);
}

.codeline--error {
  background: rgba(220, 38, 38, 0.26);
}

.codeline__run {
  position: absolute;
  left: 2px;
  color: var(--tok-number);
  font-weight: 800;
}

.tok-keyword {
  color: var(--tok-keyword);
}
.tok-builtin {
  color: var(--tok-builtin);
}
.tok-string {
  color: var(--tok-string);
}
.tok-number {
  color: var(--tok-number);
}
.tok-const {
  color: var(--tok-const);
}
.tok-comment {
  color: var(--tok-comment);
  font-style: italic;
}
.tok-punct {
  color: var(--tok-punct);
}

/* ------------------------------ 물어보는 상자 ------------------------------ */

/* <dialog> 를 쓰므로 뒷배경 어둡게 하기·바깥 누름 막기·초점 잡기를 브라우저가 해 준다.
   모양은 lesson3_7_1 의 .modal 과 같게 맞추었다. */
.modal {
  border: none;
  padding: 0;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: min(440px, calc(100vw - 32px));
  background: var(--color-surface);
  color: var(--color-text);
}

.modal::backdrop {
  background: rgba(15, 23, 42, 0.45);
}

.modal__body {
  padding: var(--space-5);
}

.modal__title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: var(--space-2);
}

.modal__text {
  color: var(--color-text-sub);
  font-size: 15px;
  line-height: 1.7;
}

/* 줄바꿈을 innerHTML 없이 만든다 — 한 줄씩 span 을 블록으로 둔다 */
.modal__line {
  display: block;
}

/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 10장)
 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 10장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다. */
    autosaveKeyPrefix: "physical1-draft-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 */
    loopLimit: 12,
    stepLimit: 20000,
    playSpeeds: [1, 4, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;
    return /^https?:\/\/.+/i.test(url);
  }

  /** 설정 파일에 미리 적어 둔 주소 (없으면 빈 문자열) */
  function fixedUrl() {
    return looksLikeUrl(APP_CONFIG.apiUrl) ? String(APP_CONFIG.apiUrl).trim() : "";
  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

  /** 학생 화면에 «제출 주소» 칸을 보여야 하는가? */
  function needsUrlInput() {
    return !isDemo() && !fixedUrl();
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.CONFIG = APP_CONFIG;
  PC.config = {
    looksLikeUrl: looksLikeUrl,
    fixedUrl: fixedUrl,
    isDemo: isDemo,
    needsUrlInput: needsUrlInput
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { APP_CONFIG: APP_CONFIG, isDemo: isDemo, fixedUrl: fixedUrl };
  }
})();

    <script data-from="shared/circuit.js">
/**
 * 회로 결선 엔진 (명세 6장)
 *
 * 여기에는 «그림 그리는 코드가 없다». 단자 위치와 전기적 연결 규칙, 판정만 있다.
 * 그래서 브라우저 없이 테스트로 바로 확인할 수 있다(명세 15장).
 *
 * 전기적 «마디(node)» 로 생각한다
 *   · 우노의 GND 세 개는 보드 안에서 이미 이어져 있다  → 모두 같은 마디 "uno:GND"
 *   · 브레드보드의 + 레일은 가로로 길게 이어져 있다      → 레일 전체가 마디 하나
 *   · 브레드보드 같은 열의 다섯 구멍은 이어져 있다        → 열 하나가 마디 하나
 *     (가운데 홈을 사이에 두고 A~E 와 F~J 는 «끊겨» 있다)
 *
 * 학생이 꽂은 케이블은 두 마디를 «합친다». 합치고 나서
 *   5V 가 있는 마디 = 5V,  GND 가 있는 마디 = 0V,  어느 쪽도 아니면 «떠 있음».
 * 5V 와 GND 가 같은 마디가 되면 단락이다.
 */
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* 1. 부품과 단자                                                       */
  /* ------------------------------------------------------------------ */

  /** 브레드보드 구멍 사이 간격 */
  var PITCH = 24;

  /**
   * 우노 헤더의 핀 간격은 더 넓게 잡는다.
   *
   * 까닭 : 핀 이름은 «모두 같은 크기» 로 적어야 한다(글씨만 작아지면 왜 작은지 알 수 없다).
   *   IOREF·RESET 처럼 다섯 글자짜리 이름이 10px 로 27px 쯤 되므로
   *   간격이 24 면 옆 이름과 닿는다. 30 으로 벌려 모두 같은 크기로 적을 수 있게 한다.
   */
  var HEADER_PITCH = 30;

  /** 우노 보드 — 실제 배치 순서 그대로 (명세 6.1 «실제 명칭을 표시») */
  function buildUno() {
    var pins = [];
    var topLeft = ["AREF", "GND0", "D13", "D12", "D11", "D10", "D9", "D8"];
    var topRight = ["D7", "D6", "D5", "D4", "D3", "D2", "D1", "D0"];
    var power = ["IOREF", "RESET", "3V3", "5V", "GND1", "GND2", "VIN"];
    var analog = ["A0", "A1", "A2", "A3", "A4", "A5"];

    function kindOf(id) {
      if (id === "5V" || id === "3V3" || id === "VIN" || id === "IOREF") return "power";
      if (id.indexOf("GND") === 0) return "ground";
      if (/^D\d+$/.test(id)) return "digital";
      if (/^A\d$/.test(id)) return "analog";
      return "other";
    }

    /**
     * PWM 을 쓸 수 있는 디지털 핀.
     * 이름표에 «~» 를 붙이지 않는다 — 그러면 D10·D11 만 네 글자가 되어
     * 글씨를 줄여야 하고, 학생 눈에는 «왜 이 둘만 작지?» 로 보인다.
     * 무리 이름 «DIGITAL (PWM ~)» 이 이미 알려 주므로 이름표는 D10, D11 로 둔다.
     */
    var PWM = { D3: 1, D5: 1, D6: 1, D9: 1, D10: 1, D11: 1 };

    /** 화면에 적는 이름 — GND 세 개는 모두 그냥 «GND» 로 보인다(보드 안에서 이어져 있다) */
    function labelOf(id) {
      return id.indexOf("GND") === 0 ? "GND" : id;
    }

    function push(id, x, y, side) {
      pins.push({
        id: id,
        label: labelOf(id),

        y: y,
        side: side

    var y1 = 58;
    topLeft.forEach(function (id, i) {
      push(id, 52 + i * HEADER_PITCH, y1, "top");
    });
    topRight.forEach(function (id, i) {
      push(id, 52 + (topLeft.length + i) * HEADER_PITCH + 16, y1, "top");
    });

    var y2 = 242;
    power.forEach(function (id, i) {
      push(id, 88 + i * HEADER_PITCH, y2, "bottom");
    });
    analog.forEach(function (id, i) {
      push(id, 88 + (power.length + i) * HEADER_PITCH + 34, y2, "bottom");
    });

    return {
      id: "uno",
      name: "아두이노 우노",
      box: { x: 24, y: 24, w: 520, h: 252 },
      usbBox: { x: 12, y: 74, w: 36, h: 48 },
      jackBox: { x: 12, y: 190, w: 34, h: 42 },
      /* 이름표 줄 — 위 핀은 아래쪽에, 아래 핀은 위쪽에 적는다 */
      labelY: { top: 88, bottom: 224 },
      /* 머리띠와 무리 이름 자리 */
      headerTop: { x: 40, y: 44, w: 476, h: 28 },
      headerBottom: { x: 76, y: 228, w: 424, h: 28 },
      groupY: { top: 38, bottom: 268 },
      /* 보드 위의 큰 부품 (설명 그림에서 쓴다) */
      chip: { x: 190, y: 150, w: 200, h: 46 },
      pins: pins
    };
  }

  /**
   * 브레드보드 — 전원 레일 2쌍 + 10열 × (A~E / F~J)
   *
   * ★ 우노 «오른쪽» 에 놓는다.
   *   아래에 놓으면 두 부품이 한 화면에 들어오지 않아, 케이블을 이을 때
   *   위아래로 스크롤하며 눌러야 했다. 나란히 두면 두 단자가 함께 보인다.
   */
  function buildBreadboard() {
    var pins = [];
    var COLS = 10;
    var x0 = 612;

    function colX(c) {
      return x0 + (c - 1) * PITCH;
    }

    /* 전원 레일 : 레일마다 구멍 10개. 어디에 꽂아도 같은 마디다. */
    var rails = [
      { id: "TP", label: "+", y: 42, polarity: "plus", where: "위쪽" },
      { id: "TN", label: "−", y: 66, polarity: "minus", where: "위쪽" },
      { id: "BN", label: "−", y: 364, polarity: "minus", where: "아래쪽" },
      { id: "BP", label: "+", y: 388, polarity: "plus", where: "아래쪽" }
    ];

    rails.forEach(function (rail) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: rail.id + "-" + c,
          label: rail.where + " " + rail.label + " 레일",

          kind: "rail",

          label: r + c,
          kind: "tie",
          half: "U",
          col: c,

          half: "L",

          x: colX(c),

      id: "bb",

      rowLabelX: 596,

      rowsLower: lower,
      pins: pins

  /**
   * 단자 하나가 속한 마디 이름.
   * 케이블을 하나도 꽂지 않아도 부품 안에서 이미 이어져 있는 것들을 나타낸다.
   */
  function nodeOf(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    if (!pin) return null;
    if (componentId === "uno") {
      if (pin.kind === "ground") return "uno:GND";
      return "uno:" + pin.id;
    }
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;
    return "bb:col:" + pin.col + ":" + pin.half;
  }

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);

    var railMatch = node.match(/^bb:rail:(\w+)$/);
    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {
        if (r.id === railMatch[1]) found = r;
      });
      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;
    }

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
    if (colMatch) {
      return "브레드보드 " + colMatch[1] + "번 열(" + (colMatch[2] === "U" ? "A~E" : "F~J") + ")";
    }
    return node;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 연결 자료 (명세 6.2 — 좌표가 아니라 연결 그래프로 저장)              */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 색을 골라 준다 — 신호 노랑, 5V 빨강, GND 검정(명세 6.1).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || polarities.indexOf("plus") !== -1) return "red";
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.2 «전원 인가를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 보드 단자 명칭 찾기 (명세 6.3)                           */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 클릭한다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리라 어느 곳을 눌러도 맞다.
   */
  var FIND_TASKS = [
    {
      id: "f-5v",
      prompt: "부품에 전기를 보내 주는 «5V» 핀을 찾아 누르세요.",
      accept: ["5V"],
      why: "5V 는 부품에 전기를 «보내는» 자리다."
    },
    {
      id: "f-gnd",
      prompt: "전기가 돌아오는 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",
      accept: ["GND0", "GND1", "GND2"],
      why: "GND 는 전기가 «없는» 핀이 아니라 회로의 기준 전위이자 귀환 경로다."
    },
    {
      id: "f-digital",
      prompt: "켜짐·꺼짐만 다루는 «디지털 핀 D13» 을 찾아 누르세요.",
      accept: ["D13"],
      why: "D0~D13 은 HIGH 와 LOW 두 가지만 다룬다. D13 에는 보드 안에 LED 가 붙어 있다."
    },
    {
      id: "f-analog",
      prompt: "0~1023 의 단계 값을 읽는 «아날로그 핀 A0» 을 찾아 누르세요.",
      accept: ["A0"],
      why: "A0~A5 는 서서히 변하는 값을 0~1023 의 수로 읽는다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.2) */
  function findHint(pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      pin.label +
      " 은(는) " +
      got +
      " 입니다. 이 단자는 전원·접지·신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, pinId) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };
    if (task.accept.indexOf(pinId) !== -1) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }
    var pin = terminal("uno", pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(pin) : "보드 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — 전원 레일 결선 (명세 6.3)                               */
  /* ------------------------------------------------------------------ */

  /**
   * 정답 회로 (명세 12장)
   *   UNO 5V  → 브레드보드 + 레일
   *   UNO GND → 브레드보드 − 레일
   *
   * 「어느 + 레일이든 좋다」 는 뜻이므로 좌표가 아니라 «마디» 로 적는다(명세 6.2).
   */
  var REQUIRED = [
    {
      id: "r-vcc",
      label: "우노 5V 를 브레드보드 + 레일에 연결",
      fromNode: "uno:5V",
      toNodes: ["bb:rail:TP", "bb:rail:BP"],
      role: "전원",
      hints: [
        "우노에서 «전기를 보내 주는» 단자는 어느 것인가요? 전원·접지·신호 중 무엇인지 먼저 생각해 보세요.",
        "브레드보드에서 빨간 줄이 그려진 «+ 레일» 을 찾아보세요. 가로로 길게 이어져 있습니다.",
        "우노의 5V 핀과 + 레일의 아무 구멍이나 이으면 됩니다."
      ]
    },
    {
      id: "r-gnd",
      label: "우노 GND 를 브레드보드 − 레일에 연결",
      fromNode: "uno:GND",
      toNodes: ["bb:rail:TN", "bb:rail:BN"],
      role: "접지",
      hints: [
        "전기가 «돌아가는 길» 은 어느 단자인가요? GND 는 전기가 없는 핀이 아닙니다.",
        "브레드보드에서 파란 줄이 그려진 «− 레일» 을 찾아보세요.",
        "우노의 GND 핀(세 곳 중 아무 곳)과 − 레일의 아무 구멍을 이으면 됩니다."
      ]
    }
  ];

  /**
   * 회로 점검 (명세 6.2 «충족 조건 목록과 미충족 항목만»)
   * 돌려주는 것 : { conditions, missing, ok, shorted, powered }
   */
  function checkCircuit(connections) {
    var net = solve(connections);

    var conditions = REQUIRED.map(function (req) {
      var ok = req.toNodes.some(function (t) {
        return net.connected(req.fromNode, t);
      });
      return { id: req.id, label: req.label, role: req.role, ok: ok };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 화면에서 레일 전체를 물들이는 데 쓴다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0 && !net.shorted,
      shorted: net.shorted,
      powered: powered
    };
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다) */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결 (명세 6.2)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 뒤 차시에서 LED·저항 부품이 늘어도
   * 이 배열에 한 줄 더하면 되고, 판정 코드는 그대로다.
   * 아래 LED 규칙 둘은 LED 가 놓이는 차시부터 실제로 걸린다(1차시에는 LED 가 없다).
   */
  var DANGER_RULES = [
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우고, 5V 는 + 레일에 GND 는 − 레일에 따로 연결하세요."
    },
    {
      code: "reverse-rail",
      title: "전원·접지 역결선",
      test: function (ctx) {
        var bad = false;
        ctx.connections.forEach(function (c) {
          var a = terminal(c.fromComponent, c.fromPin);
          var b = terminal(c.toComponent, c.toPin);
          if (!a || !b) return;

          var ends = [
            { pin: a, comp: c.fromComponent },
            { pin: b, comp: c.toComponent }
          ];
          var unoEnd = ends.filter(function (e) {
            return e.comp === "uno";
          })[0];
          var railEnd = ends.filter(function (e) {
            return e.pin.kind === "rail";
          })[0];
          if (!unoEnd || !railEnd) return;

          if (unoEnd.pin.id === "5V" && railEnd.pin.polarity === "minus") bad = true;
          if (unoEnd.pin.kind === "ground" && railEnd.pin.polarity === "plus") bad = true;
        });
        return bad;
      },
      detail:
        "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다. " +
        "이 상태로 부품을 꽂으면 부품이 상할 수 있습니다.",
      fix: "빨간 줄(+) 에는 5V 를, 파란 줄(−) 에는 GND 를 연결하세요."
    },
    {
      code: "led-no-resistor",
      title: "LED 무저항 연결",
      test: function (ctx) {
        return ctx.leds.some(function (led) {
          return led && led.hasResistor === false;
        });
      },
      detail: "LED 에 저항 없이 전원이 이어졌습니다. 전류가 너무 커서 LED 가 곧 타 버립니다.",
      fix: "LED 와 전원 사이에 220Ω 저항을 넣으세요."
    },
    {
      code: "led-reversed",
      title: "LED 역극성",
      test: function (ctx) {
        return ctx.leds.some(function (led) {
          return led && led.reversed === true;
        });
      },
      detail:
        "LED 의 긴 다리(+, 애노드)와 짧은 다리(−, 캐소드)가 뒤바뀌었습니다. 불이 켜지지 않습니다.",
      fix: "긴 다리를 전원(+) 쪽으로, 짧은 다리를 GND 쪽으로 돌려 꽂으세요."
    }
  ];

  /**
   * 위험 연결을 모두 찾는다.
   * parts 는 뒤 차시에서 LED 같은 부품 상태를 넘겨받는 자리다. 1차시에는 비어 있다.
   */
  function dangers(connections, parts) {
    var ctx = {
      connections: connections || [],
      net: solve(connections),
      leds: (parts && parts.leds) || []
    };
    return DANGER_RULES.filter(function (rule) {
      return rule.test(ctx);
    }).map(function (rule) {
      return { code: rule.code, title: rule.title, detail: rule.detail, fix: rule.fix };
    });
  }

  /** 전원을 켜도 되는가 — 위험이 하나라도 있으면 막는다(명세 6.2) */
  function canPowerOn(connections, parts) {
    var found = dangers(connections, parts);
    var check = checkCircuit(connections);
    if (found.length > 0) return { ok: false, reason: "danger", dangers: found, check: check };
    if (!check.ok) return { ok: false, reason: "incomplete", dangers: [], check: check };
    return { ok: true, reason: "", dangers: [], check: check };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 멀티미터 (명세 6.3)                                               */
  /* ------------------------------------------------------------------ */

  /**
   * 탐침 두 개를 대어 전압을 읽는다.
   * 돌려주는 것 : { ok, volts, text, note }
   */
  function measure(connections, a, b, powerOn) {
    if (!a || !b) return { ok: false, volts: null, text: "—", note: "탐침 두 곳을 고르세요." };

    var net = solve(connections);
    if (net.shorted) {
      return {
        ok: false,
        volts: null,
        text: "차단",
        note: "단락이 감지되어 전원이 차단된 상태입니다."
      };
    }
    if (!powerOn) {
      return {
        ok: false,
        volts: null,
        text: "0.00 V",
        note: "전원이 꺼져 있습니다. [전원 켜기] 를 먼저 누르세요."
      };
    }

    var va = net.potentialAt(a.component, a.pin);
    var vb = net.potentialAt(b.component, b.pin);
    if (va === null || vb === null) {
      return {
        ok: false,
        volts: null,
        text: "—",
        note: "한쪽 탐침이 «떠 있는» 자리에 있습니다. 전원이 이어진 곳끼리 재어 보세요."
      };
    }

    var volts = Math.abs(va - vb);
    var sameNode = net.connected(nodeOf(a.component, a.pin), nodeOf(b.component, b.pin));
    var note;
    if (sameNode) note = "두 곳이 같은 마디로 이어져 있습니다. 전위가 같으므로 0V 입니다.";
    else if (volts === 5) note = "+ 레일과 − 레일 사이입니다. 5V 가 걸려 있습니다.";
    else note = "두 곳의 전위가 같습니다.";

    return { ok: true, volts: volts, text: volts.toFixed(2) + " V", note: note };
  }

  /**
   * 멀티미터로 «반드시 확인해야 할» 두 가지 (명세 6.3)
   *   ① +/− 레일 사이 5V   ② 같은 전위끼리 0V
   */
  var PROBE_TASKS = [
    {
      id: "p-5v",
      prompt: "+ 레일의 아무 구멍과 − 레일의 아무 구멍에 탐침을 대어 보세요.",
      expect: 5,
      why: "레일 사이에는 5V 가 걸린다. 이것이 부품에 전기를 보내는 힘이다."
    },
    {
      id: "p-0v",
      prompt: "같은 + 레일 안에서 «서로 다른 두 구멍» 에 탐침을 대어 보세요.",
      expect: 0,
      why: "같은 레일은 하나의 마디다. 전위가 같으므로 0V 다."
    }
  ];

  /** 지금 측정이 과제 조건을 채웠는가 */
  function checkProbe(taskIndex, result, a, b) {
    var task = PROBE_TASKS[taskIndex];
    if (!task || !result || !result.ok) return false;
    if (result.volts !== task.expect) return false;
    /* 0V 과제는 «서로 다른 두 구멍» 이어야 한다 (같은 구멍을 두 번 짚으면 의미가 없다) */
    if (task.expect === 0 && a && b && a.component === b.component && a.pin === b.pin) return false;
    return true;
  }

  /* ------------------------------------------------------------------ */

      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 1차시에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 8장 마지막 문단 · 명세 5장 4단계 통과 조건)          */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      ["then", "otherwise", "args"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** 문자열 인수 하나를 그대로 꺼낸다 (없으면 null) */
  function firstStringArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "string" ? a.value : null;
  }
  function firstNumberArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "number" ? a.value : null;
  }

  /**
   * 검사 항목 — 화면에는 이 목록이 «통과/미통과» 로 보인다.
   * 정답 코드를 통째로 보여 주지 않고 «무엇이 빠졌는지» 만 알려 준다.
   */
  var TESTS = [
    {
      id: "t-setup",
      label: "setup() 함수가 있다",
      run: function (ast) {
        return ast.functions.setup
          ? { ok: true }
          : { ok: false, message: "void setup() { } 함수가 없습니다. 준비하는 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-loop",
      label: "loop() 함수가 있다",
      run: function (ast) {
        return ast.functions.loop
          ? { ok: true }
          : { ok: false, message: "void loop() { } 함수가 없습니다. 되풀이할 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-begin",
      label: "setup() 에서 Serial.begin(9600) 으로 통신을 시작한다",
      run: function (ast) {
        var found = callsIn(ast, "setup").filter(function (c) {
          return callName(c) === "Serial.begin";
        });
        if (found.length === 0) {
          return { ok: false, message: "setup() 안에 Serial.begin(...) 이 없습니다. 통신 속도를 정해 주어야 합니다." };
        }
        var speed = firstNumberArg(found[0]);
        if (speed !== 9600) {
          return { ok: false, message: "Serial.begin 의 속도가 9600 이 아닙니다. 지금 값 : " + (speed === null ? "숫자가 아님" : speed) };
        }
        return { ok: true };
      }
    },
    {
      id: "t-start",
      label: 'setup() 에서 "START" 를 한 번 출력한다',
      run: function (ast) {
        var prints = callsIn(ast, "setup").filter(function (c) {
          return callName(c) === "Serial.println" || callName(c) === "Serial.print";
        });
        var hit = prints.filter(function (c) {
          return firstStringArg(c) === "START";
        });
        if (hit.length === 0) {
          return { ok: false, message: 'setup() 안에서 "START" 를 출력하지 않았습니다.' };
        }
        if (hit.length > 1) {
          return { ok: false, message: '"START" 를 여러 번 출력합니다. setup() 은 한 번만 실행되므로 한 줄이면 됩니다.' };
        }
        return { ok: true };
      }
    },
    {
      id: "t-run",
      label: 'loop() 에서 "RUN" 을 출력한다',
      run: function (ast) {
        var hit = callsIn(ast, "loop").filter(function (c) {
          return (
            (callName(c) === "Serial.println" || callName(c) === "Serial.print") &&
            firstStringArg(c) === "RUN"
          );
        });
        return hit.length > 0
          ? { ok: true }
          : { ok: false, message: 'loop() 안에서 "RUN" 을 출력하지 않았습니다.' };
      }
    },
    {
      id: "t-delay",
      label: "loop() 에서 delay() 로 잠시 기다린다",
      run: function (ast) {
        var hit = callsIn(ast, "loop").filter(function (c) {
          return callName(c) === "delay";
        });
        if (hit.length === 0) {
          return { ok: false, message: "loop() 안에 delay(...) 가 없습니다. 기다리지 않으면 출력이 너무 빨라 읽을 수 없습니다." };
        }
        var ms = firstNumberArg(hit[0]);
        if (ms === null || ms <= 0) {
          return { ok: false, message: "delay 에는 기다릴 시간을 밀리초 단위의 «양수» 로 적습니다. 예) delay(1000)" };
        }
        return { ok: true };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite"];

  /** 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2) */
  function pinsUsed(ast) {
    var uses = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  function validate(source) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    var results = TESTS.map(function (t) {
      var r = t.run(ast);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다(탐구 단계에서 쓴다)
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *
   * 돌려주는 것 : { ok, trace, console, pins, elapsed, stopped, error }
   *   trace 의 한 칸 = { t, line, kind, text, phase, iteration }
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: {},
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      pinModes: {},
      pinValues: {},
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration
      });
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    /**
     * 아날로그 입력을 읽는다.
     * 핀은 analogRead(A0) 처럼 «이름» 으로도, analogRead(0) 처럼 «번호» 로도 올 수 있다.
     * 둘 다 sensors 의 A0 칸을 보게 맞춘다.
     */
    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          var line = {
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          };
          state.out.push(line);
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] = node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, "D" + args[0] + " → " + state.pinModes[args[0]]);
          return 0;

        case "digitalWrite": {
          var value = args[1] ? 1 : 0;
          state.pinValues[args[0]] = value;
          record("pin-write", node.line, "D" + args[0] + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, "D" + args[0] + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          state.t += ms;
          record("delay", node.line, String(ms));
          return 0;
        }

        case "millis":
          return state.t;

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        state.vars[g.name] = g.init ? evaluate(g.init) : 0;
      });

      state.phase = "setup";
      record("phase", ast.functions.setup ? ast.functions.setup.line : 0, "setup() 시작");
      if (ast.functions.setup) execBlock(ast.functions.setup.body);
      record("phase-end", 0, "setup() 끝 — 여기까지는 «한 번만» 실행됩니다.");

      state.phase = "loop";
      if (ast.functions.loop) {
        for (var i = 0; i < loopLimit; i += 1) {
          state.iteration = i + 1;
          record("phase", ast.functions.loop.line, "loop() " + (i + 1) + "번째");
          execBlock(ast.functions.loop.body);
        }
        stopped = "loop-limit";
      }
    } catch (err) {
      if (err && err.name === "StopRun") {
        stopped = err.reason === "steps" ? "step-limit" : "runtime";
        if (err.reason !== "steps") error = { line: 0, message: err.reason, code: "runtime" };
      } else {
        stopped = "runtime";
        error = { line: 0, message: "실행 중 문제가 생겼습니다.", code: "runtime" };
      }
    }

    return {
      ok: error === null,
      trace: state.trace,
      console: state.out,
      pins: { modes: state.pinModes, values: state.pinValues },
      serial: state.serial,
      elapsed: state.t,
      stopped: stopped,
      error: error
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 실행 결과 읽기 — 형성평가 4번과 관찰 기록에 쓴다                     */
  /* ------------------------------------------------------------------ */

  /** ms 밀리초 «안에» 나온 출력만 (명세 9장 4번 «3초가 지났을 때») */
  function outputsWithin(result, ms) {
    return (result.console || []).filter(function (line) {
      return line.t < ms;
    });
  }

  /** 어떤 글이 몇 번 나왔는가 */
  function countText(result, text, ms) {
    var list = ms === undefined ? result.console || [] : outputsWithin(result, ms);
    return list.filter(function (line) {
      return line.text === text;
    }).length;
  }

  /** 시리얼 모니터에 보이는 그대로의 글 */
  function consoleText(result) {
    var out = "";
    (result.console || []).forEach(function (line) {
      out += line.text + (line.newline ? "\n" : "");
    });
    return out;
  }

  /* ------------------------------------------------------------------ */

  PC.arduino = {
    REFERENCE_CODE: REFERENCE_CODE,
    CODE_MODES: CODE_MODES,
    ASSEMBLE_LINES: ASSEMBLE_LINES,
    BLANK_TEMPLATE: BLANK_TEMPLATE,
    TESTS: TESTS,
    KNOWN_CALLS: KNOWN_CALLS,
    CONSTANTS: CONSTANTS,
    tokenize: tokenize,
    parse: parse,
    tryParse: tryParse,
    validate: validate,
    pinsUsed: pinsUsed,
    callsIn: callsIn,
    callName: callName,
    run: run,
    outputsWithin: outputsWithin,
    countText: countText,

          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        var e = s.experiment || {};
        var minRuns = PC.EXPERIMENT_MIN || 2;
        var conditions = e.conditions || [];
        var recorded = conditions.filter(function (c) {
          return contentLength(c.observation) >= (LIMITS.observationMin || 10);
        });
        if (recorded.length < minRuns) {
          reasons.push(
            "조건을 바꾸어 " + minRuns + "번 이상 실험하고 관찰을 적어 주세요. (지금 " + recorded.length + "번)"
          );
        }
        var designs = e.designs || {};
        var cases = (PC.lesson && PC.lesson.DESIGN_CASES) || [];
        var incomplete = cases.filter(function (item) {
          var d = designs[item.id] || {};
          return (
            contentLength(d.input) < (LIMITS.designMin || 2) ||
            contentLength(d.process) < (LIMITS.designMin || 2) ||
            contentLength(d.output) < (LIMITS.designMin || 2)
          );
        });
        if (incomplete.length > 0) {
          reasons.push(
            "생활 사례 " + incomplete.length + "개의 입력·처리·출력이 아직 비어 있습니다."
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.2) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 3단계 — 회로 (명세 10장) */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: Number(circuit.attempts) || 0,
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: Number(circuit.findAttempts) || 0,
        hintsUsed: Number(circuit.hintsUsed) || 0,
        powerOn: circuit.powerOn === true,
        probeDone: circuit.probeDone === true
      },

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험과 설계 (명세 10장) */
      experiment: {
        conditions: (experiment.conditions || []).map(function (c) {
          return {
            label: clip(c.label, 60),
            delay: Number(c.delay) || 0,
            runsIn3s: Number(c.runsIn3s) || 0,
            elapsed: Number(c.elapsed) || 0
          };
        }),
        observations: (experiment.conditions || []).map(function (c) {
          return clip(c.observation, LIMITS.textMax);
        }),
        designs: experiment.designs
          ? Object.keys(experiment.designs).map(function (id) {
              var d = experiment.designs[id] || {};
              return {
                caseId: id,
                input: clip(d.input, 200),
                process: clip(d.process, 200),
                output: clip(d.output, 200)
              };
            })
          : []
      },

      /* 6단계 — 형성평가 (명세 10장) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: Number(assessment.attempts) || 0
      }
    };
  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)
   * 학번과 이름과 차시가 같으면 같은 제출로 본다.
   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    function num(v) {
      var n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        probeDone: circuit.probeDone === true
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        mode: text(code.mode),
        syntaxErrors: Array.isArray(code.syntaxErrors) ? code.syntaxErrors : [],
        pinMismatch: Array.isArray(code.pinMismatch) ? code.pinMismatch : []
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        designs: Array.isArray(experiment.designs) ? experiment.designs : []
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();

    <script data-from="teacher/t00-core.js">
/**
 * 교사용 코어 — 이름 공간과 화면 부품
 *
 * 교사용은 학생용 파일을 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.
 * 그래서 학생용 빌드에 교사용 코드가 섞일 일도, 그 반대도 없다.
 *
 * ★ 학생이 쓴 글은 언제나 textContent 로만 넣는다.
 *   innerHTML 을 쓰지 않으므로 <script> 를 적어 낸 답안도 «글자» 로만 보인다.
 *
 * ★ 받은 자료를 브라우저에 «영구 저장하지 않는다»(명세 13장).
 *   localStorage 를 쓰지 않고 메모리에만 둔다. 창을 닫으면 사라진다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);

  }

  function fmtTime(iso, withSeconds) {

    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var base =
      d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) +
      " " + two(d.getHours()) + ":" + two(d.getMinutes());
    return withSeconds ? base + ":" + two(d.getSeconds()) : base;
  }

  /** 표 안에서 긴 글을 짧게 (전체 내용은 학생별 보기에서 본다) */
  function shorten(text, max) {
    var s = String(text || "");
    var limit = max || 18;
    return s.length > limit ? s.slice(0, limit) + "…" : s;
  }

  /** 백분율 — 나눌 것이 없으면 0 */
  function percent(part, whole) {
    if (!whole) return 0;
    return Math.round((part / whole) * 100);
  }

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  /* ------------------------------ 표 부품 ------------------------------ */

  /** 숫자 하나를 크게 보여 주는 칸 */
  /**
   * 숫자 한 칸.
   * 모양은 lesson3_7_1 교사용의 t-stat 과 같게 맞추었다 — 가운데 정렬, 큰 숫자, 작은 단위.
   * 단위는 `unit` 으로 따로 받아 숫자보다 작게 적는다.
   */
  function statCard(label, value, note, unit) {
    return el("div", { class: "t-stat" }, [
      el("p", { class: "t-stat__label", text: label }),
      el("p", { class: "t-stat__value" }, [
        el("span", { text: String(value) }),
        unit ? el("small", { text: " " + unit }) : null
      ]),
      note ? el("p", { class: "t-stat__note", text: note }) : null
    ]);
  }

  /** 숫자 칸들을 담는 격자 */
  function statRow(cards) {
    return el("div", { class: "t-stats" }, cards);
  }

  /**
   * 제목이 붙은 상자. lesson3_7_1 교사용의 panel() 과 같은 짜임새다.
   * { root, body } 를 돌려주므로 부르는 곳에서 body 에 내용을 붙인다.
   */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: ("panel " + (s.className || "")).trim() }, [head, body]);
    return { root: root, body: body };
  }

  /** 단추 한 줄 */
  function btnRow(children) {
    return el("div", { class: "btnrow" }, children);
  }

  /**
   * 가로 막대 하나. 숫자를 «글자로도» 함께 적는다(색만으로 알리지 않기 — 명세 13장).
   */
  function bar(label, value, whole, opts) {
    var o = opts || {};
    var pct = percent(value, whole);
    return el("div", { class: "bar" + (o.strong ? " bar--strong" : "") }, [
      el("p", { class: "bar__label" }, [
        el("span", { class: "bar__name", text: label }),
        el("span", { class: "bar__num", text: value + "명 (" + pct + "%)" })
      ]),
      el("div", { class: "bar__track" }, [
        el("div", { class: "bar__fill", attrs: { style: "width:" + pct + "%" } })
      ])
    ]);
  }

  /** 접었다 펼 수 있는 긴 글 */
  function longText(text) {
    var value = String(text || "");
    var body = el("p", { class: "longtext__body", text: value || "(작성하지 않음)" });
    if (value.length <= 120) return el("div", { class: "longtext" }, [body]);

    body.classList.add("longtext__body--clamp");
    var btn = el("button", {
      class: "btn btn--small btn--ghost",
      text: "펼치기",
      attrs: { type: "button", "aria-expanded": "false" },
      on: {
        click: function () {
          var clamped = body.classList.toggle("longtext__body--clamp");
          btn.textContent = clamped ? "펼치기" : "접기";
          btn.setAttribute("aria-expanded", clamped ? "false" : "true");
        }
      }
    });
    return el("div", { class: "longtext" }, [body, btn]);
  }

  /** 코드 상자 (읽기 전용) */
  function codeBox(source) {
    return el("pre", { class: "codeblock__pre" }, [el("code", { text: String(source || "(작성하지 않음)") })]);
  }

  /** 비어 있을 때의 안내 */
  function empty(message) {
    return el("p", { class: "t-empty", text: message });
  }

  T.core = {
    $: $,
    $$: $$,
    el: el,
    clear: clear,
    fmtTime: fmtTime,
    shorten: shorten,
    percent: percent,
    toast: toast,
    announce: announce,
    statCard: statCard,
    statRow: statRow,
    panel: panel,
    btnRow: btnRow,
    bar: bar,
    longText: longText,
    codeBox: codeBox,
    empty: empty
  };
})();
