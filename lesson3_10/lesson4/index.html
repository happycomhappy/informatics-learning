    <script data-from="teacher/t60-csv.js">
/**
 * CSV 내려받기 (명세 11장 «CSV 내려받기»)
 *
 * 엑셀이 한글을 깨뜨리지 않도록 맨 앞에 BOM 을 붙인다.
 * 쉼표·따옴표·줄바꿈이 든 칸은 따옴표로 감싸고 안쪽 따옴표는 두 번 적는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /**
   * 칸 하나를 CSV 로 적는다.
   *
   * ★★ 수식 주입을 막는다 (명세 9장 «=, +, -, @ 로 시작하는 값을 이스케이프»).
   *
   *   학생이 이름이나 관찰 칸에 «=1+1» 이라고 적으면 엑셀은 그것을 «수식» 으로 읽는다.
   *   =HYPERLINK(...) 나 =WEBSERVICE(...) 처럼 밖으로 자료를 보내는 수식도 있다.
   *   그래서 그 넷으로 시작하는 값 앞에 홑따옴표를 붙여 «글» 임을 못 박는다.
   *   엑셀은 앞의 홑따옴표를 «글로 보라» 는 표시로 읽고 화면에는 내보이지 않는다.
   *
   *   ★ 붙이는 자리가 «따옴표로 감싸기 전» 이어야 한다. 감싼 뒤에 붙이면 따옴표 밖으로 나간다.
   */
  function cell(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function toRows(list) {
    var questions = PC.quiz.QUESTIONS;

    var header = ["학번", "학년", "반", "번호", "이름", "제출시각", "점수", "총점", "이수"]
      .concat(questions.map(function (q) {
        return q.no + "번";
      }))
      .concat([
        "회로완성",
        /* 이 차시의 알맹이 — «미완성» 만으로는 역결선과 Trig·Echo 맞바꿈을 갈라낼 수 없다(명세 10장) */
        "전원결선",
        "신호결선",
        "코드Trig",
        "코드Echo",
        "회로시도",
        "힌트",
        "위험연결",
        "코드통과",
        "코드시도",
        "코드방식",
        "측정횟수",
        "측정성공",
        "관찰작성",
        "확장활동"
      ]);

    var rows = (list || []).map(function (r) {
      var answers = {};
      (r.assessment.answers || []).forEach(function (a) {
        if (a) answers[a.id] = a.value;
      });

      var perQuestion = questions.map(function (q, i) {
        var ok = r.assessment.isCorrect[i] === true ? "O" : "X";
        var value = answers[q.id];
        var shown =
          value === null || value === undefined || value === ""
            ? "무응답"
            : q.type === "choice"
              ? "제" + (Number(value) + 1) + "번"
              : String(value).replace(/\s+/g, " ");
        return ok + " " + shown;
      });

      /* 관찰은 { id, predict, observation } 꼴이다 */
      var observationCount = (r.experiment.observations || []).filter(function (o) {
        return String((o && o.observation) || "").trim().length > 0;
      }).length;

      /* ★ 두 칸으로 갈라 적는다 — 전원 쪽 잘못과 신호 쪽 잘못은 지도가 다르다 */
      var w = r.circuit.wiring || null;
      var power = !w
        ? ""
        : w.shortCircuit
          ? "5V-GND 단락"
          : w.powerReversed
            ? "VCC·GND 역결선"
            : w.vccOk && w.gndOk
              ? "정상"
              : (w.vccOk ? "" : "VCC X ") + (w.gndOk ? "" : "GND X");
      var signal = !w
        ? ""
        : w.signalSwapped
          ? "Trig·Echo 맞바꿈"
          : w.signalOnPower
            ? "신호선 5V 직결"
            : w.trigOk && w.echoOk
              ? "정상"
              : (w.trigOk ? "" : "Trig→" + ((w.trigWired || []).join("/") || "없음") + " ") +
                (w.echoOk ? "" : "Echo→" + ((w.echoWired || []).join("/") || "없음"));

      /* 측정 몇 번 하고 몇 번 성공했나 — 조건 바꾸기는 세지 않는다 */
      var runs = (r.experiment.conditions || []).filter(function (c) {
        return c && c.ran && c.kind !== "condition";
      });
      var okRuns = runs.filter(function (c) {
        return c.ok;
      });

      return [
        r.studentId,
        r.grade,
        r.classNumber,
        r.studentNumber,
        r.studentName,
        T.core.fmtTime(r.serverUpdatedAt || r.submittedAt, true),
        r.assessment.score,
        r.assessment.total,
        r.assessment.pass ? "이수" : "미이수"
      ]
        .concat(perQuestion)
        .concat([
          r.circuit.completed ? "완성" : "미완성",
          power,
          signal,
          r.code.trigPin === null || r.code.trigPin === undefined ? "" : "D" + r.code.trigPin,
          r.code.echoPin === null || r.code.echoPin === undefined ? "" : "D" + r.code.echoPin,
          r.circuit.attempts,
          r.circuit.hintsUsed,
          (r.circuit.dangerEvents || r.circuit.errors || []).length,
          r.code.testsPassed + "/" + r.code.testsTotal,
          r.code.attempts,
          (T.views && T.views.MODE_NAME ? T.views.MODE_NAME[r.code.mode] : "") || r.code.mode || "",
          runs.length,
          okRuns.length,
          observationCount,
          r.experiment.extension && r.experiment.extension.tried ? "함" : ""
        ]);
    });

    return [header].concat(rows);
  }

  function toText(list) {
    return toRows(list)
      .map(function (row) {
        return row.map(cell).join(",");
      })
      .join("\r\n");
  }

  /** 파일 이름 : physical_3_제출현황_2026-08-18.csv */
  function fileName(now, label) {
    var d = now ? new Date(now) : new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var stamp = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
    return PC.LESSON_ID + "_" + (label || "제출현황") + "_" + stamp + ".csv";
  }

  function download(list, label) {
    if (typeof document === "undefined") return false;
    try {
      var blob = new Blob(["﻿" + toText(list)], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName(null, label);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  T.csv = { cell: cell, toRows: toRows, toText: toText, fileName: fileName, download: download };

  if (typeof module !== "undefined" && module.exports) module.exports = T.csv;
})();

    <script data-from="teacher/t90-main.js">
/* ------------------------------------------------------------------
 * 교사용 화면 조립 (명세 9장)
 *
 * ★★ 3차시와 달라진 점 — 장이 «넷» 에서 «여덟» 로 늘었다.
 *
 *   3차시까지는 회로·코드·실험 자료를 3·4장 안에 «접어» 두었다.
 *   명세 9장이 이 차시에 요구한 것은 «일곱 탭» 이다. 접어 두면 그 요구를 못 지킨다.
 *   그래서 접기를 펼쳐 저마다 한 장으로 세웠다.
 *
 *   1장 결과 불러오기   주소에서 읽기 · JSON 파일 열기 · 끌어다 놓기 · 30초 자동 새로고침
 *   2장 대시보드        참여 수 · 제출률 · 평균 · 이수/미이수 · 점수 분포 · 상위 3명 · 전체 명단
 *   3장 형성평가        문항별 정답률 · 선택지 분포 · 5번 원문 · 오답 TOP2
 *   4장 회로 수행        완성 여부 · 시도 횟수 · 빈번한 오결선 · 위험 연결
 *   5장 코드 수행        최종 코드 · 통과 테스트 수 · 핀/입출력/문법 오류
 *   6장 실험 기록        거리·재질·각도·오차와 학생 관찰
 *   7장 학생별 보기      정오표 · 연결 목록 · 코드 · 실험 기록 (찾기·거르기·정렬)
 *   8장 정답 · 지도      회로 정답 · 기준 코드 · 평가 해설 · 오개념과 지도 포인트
 *
 * 위에서 아래로 한 번 훑으면 수업 정리가 끝나는 순서다.
 * 1장에서 자료를 불러오기 전에는 2장부터 잠긴다 — 빈 화면을 넘겨 봐도 얻을 것이 없다.
 *
 * ★ 학생 답안은 «메모리에만» 둔다. 교사 열쇠도 저장하지 않는다(명세 9장 · 11장).
 *   localStorage 에 남기는 것은 «주소» 하나뿐이다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  /** 명세 9장의 일곱 탭 + 맨 앞의 «불러오기» */
  var PAGES = [
    { no: 1, label: "결과 불러오기" },
    { no: 2, label: "대시보드" },
    { no: 3, label: "형성평가" },
    { no: 4, label: "회로 수행" },
    { no: 5, label: "코드 수행" },
    { no: 6, label: "실험 기록" },
    { no: 7, label: "학생별 보기" },
    { no: 8, label: "정답 · 지도" }
  ];

  /** 형성평가 장 — 여기서만 «틀린 문제를 다 봐야» 다음으로 넘어간다 */
  var QUIZ_PAGE = 3;

  var refs = {};
  var pages = [];

  var currentPage = 1;

  /** 3장에서 틀린 문제를 끝까지 확인했는가 (다음 장 열기 조건) */
  var allWrongSeen = false;

  /* 주소만 기억해 둔다. 학생 답안은 저장하지 않는다 — 창을 닫으면 사라진다. */
  var ENDPOINT_KEY = "physical4-teacher-endpoint";

  function loadEndpoint() {
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || "";
    } catch (e) {
      return "";
    }
  }

  function saveEndpoint(url) {
    try {
      if (url) window.localStorage.setItem(ENDPOINT_KEY, String(url).trim());
    } catch (e) {
      /* 저장이 막혀 있어도 불러오기 자체는 된다 */
    }
  }

  /* ---------------------------------------------------------------- */
  /* 30초 자동 새로고침 (명세 9장 마지막 줄)                             */
  /*                                                                  */
  /* ★ «사용자가 켠 경우에만» 돈다. 켜지 않으면 아무 일도 하지 않는다.     */
  /* ★ 교사 열쇠는 메모리(입력 칸)에만 있다. 저장하지 않으므로            */
  /*   창을 닫으면 자동 새로고침도 함께 사라진다.                        */
  /* ---------------------------------------------------------------- */

  var autoTimer = null;

  function autoSeconds() {
    return (PC.CONFIG && PC.CONFIG.teacherRefreshSeconds) || 30;
  }

  function stopAuto() {
    if (autoTimer) window.clearInterval(autoTimer);
    autoTimer = null;
  }

  function startAuto() {
    stopAuto();
    autoTimer = window.setInterval(function () {
      /* 주소나 열쇠가 비어 있으면 조용히 쉰다 — 실패 알림을 30초마다 띄우지 않는다 */
      var url = refs.endpoint ? refs.endpoint.value : "";
      var key = refs.teacherKey ? refs.teacherKey.value : "";
      if (!url || !key) return;
      T.data.fetchFromServer(url, key).then(function (result) {
        if (!result || result.ok === false) return;
        setStatus("ok", "자동 새로고침 — " + T.data.count() + "명 (" + K.fmtTime(new Date().toISOString(), true) + ")");
        drawPage(currentPage);
        updatePager();
      });
    }, autoSeconds() * 1000);
  }

  /**
   * 자료가 들어왔는가.
   * «불러왔다» 는 깃발을 따로 두지 않는다 — 깃발과 실제 자료가 어긋날 수 있다.
   */
  function hasData() {
    return T.data.count() > 0;
  }

  function rows() {
    return T.data.all();
  }

  /* ---------------------------------------------------------------- */
  /* 머리말 · 출력 날짜                                                 */
  /* ---------------------------------------------------------------- */

  function buildHeader(host) {
    host.appendChild(
      el("header", { class: "t-header" }, [
        el("p", { class: "t-header__eyebrow", text: "교사용 · " + PC.LESSON_UNIT }),
        el("h1", { class: "t-header__title", text: "형성평가 결과 분석" }),
        el("p", {
          class: "t-header__sub",
          text: "학생들이 제출한 답안을 읽어 상위 3명과 가장 많이 틀린 문제를 정리해 보여 줍니다."
        })
      ])
    );

    /* 인쇄물 맨 위에만 한 번 찍히는 날짜 */
    refs.printDate = el("p", { class: "t-printdate" });
    host.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener("beforeprint", stampPrintDate);
  }

  /** 인쇄물 맨 위 날짜 (예 : 2026년 8월 18일 (화) 출력) */
  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();
    var day = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];
    refs.printDate.textContent =
      now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + day + ") 출력";
  }

  /* ---------------------------------------------------------------- */
  /* 장 이동 (위 단추 · 아래 단추)                                       */
  /* ---------------------------------------------------------------- */

  function buildStepper(host) {
    refs.stepper = el("ol", { class: "t-steps", attrs: { "aria-label": "장 이동" } });

    PAGES.forEach(function (p) {
      var btn = el("button", {
        class: "t-steps__btn",
        attrs: { type: "button", "data-page": String(p.no), "aria-label": p.no + "장 " + p.label + " 보기" },
        on: {
          click: function () {
            goToPage(p.no);
          }
        }
      }, [
        el("span", { class: "t-steps__no", text: String(p.no) }),
        el("span", { class: "t-steps__label", text: p.label })
      ]);
      refs.stepper.appendChild(el("li", { class: "t-steps__item" }, [btn]));
    });

    host.appendChild(el("nav", { class: "t-steps-wrap" }, [refs.stepper]));
  }

  function buildPager(host) {
    refs.btnPrev = el("button", {
      class: "btn btn--ghost",
      text: "← 이전",
      attrs: { type: "button" },
      on: {
        click: function () {
          goToPage(currentPage - 1);
        }
      }
    });

    refs.btnNext = el("button", {
      class: "btn btn--primary",
      text: "다음 →",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (currentPage === PAGES.length) finishReview();
          else goToPage(currentPage + 1);
        }
      }
    });

    refs.pageHint = el("p", { class: "t-pager__hint", attrs: { "aria-live": "polite" } });

    host.appendChild(el("footer", { class: "t-pager" }, [refs.btnPrev, refs.pageHint, refs.btnNext]));
  }

  /**
   * 아래 이동 단추의 상태를 정한다.
   *  · 1장에서는 자료를 불러와야 다음으로 넘어간다.
   *  · 형성평가 장에서는 틀린 문제를 모두 확인해야 넘어간다.
   *  · 마지막 장에서는 「마침」 이 된다.
   */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = "다음 →";
      refs.btnNext.classList.remove("btn--finish");
      refs.btnNext.setAttribute("aria-label", "다음 장 보기");

      if (currentPage === 1) {
        refs.btnNext.disabled = !hasData();
        refs.btnNext.title = hasData() ? "" : "먼저 제출 자료를 불러와 주세요.";
        return;
      }
      if (currentPage === QUIZ_PAGE) {
        var total = T.wrong.topWrong(rows()).length;
        refs.btnNext.disabled = !allWrongSeen;
        refs.btnNext.title = allWrongSeen ? "" : "틀린 문제 " + total + "개를 모두 확인하면 넘어갈 수 있어요.";
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = "";
      return;
    }

    refs.btnNext.textContent = "마침";
    refs.btnNext.classList.add("btn--finish");
    refs.btnNext.disabled = false;
    refs.btnNext.title = "";
    refs.btnNext.setAttribute("aria-label", "분석 마치기");
  }

  function finishReview() {
    refs.pageHint.textContent = "분석을 마쳤어요 🎉 위 단추나 「← 이전」 으로 다시 볼 수 있어요.";
    refs.btnNext.disabled = true;
    K.toast("형성평가 결과 분석을 마쳤어요.");
    K.announce("형성평가 결과 분석을 마쳤습니다.");
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    if (next > 1 && !hasData()) {
      setStatus("error", "먼저 제출 자료를 불러와 주세요.");
      return;
    }
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;

    pages.forEach(function (page, i) {
      if (page) page.classList.toggle("is-active", i + 1 === no);
    });

    K.$$(".t-steps__btn", refs.stepper).forEach(function (btn) {
      var n = Number(btn.getAttribute("data-page"));
      btn.classList.toggle("is-current", n === no);
      btn.classList.toggle("is-locked", n > 1 && !hasData());
      btn.setAttribute("aria-current", n === no ? "page" : "false");
    });

    /* 그 장을 열 때 내용을 만든다 — 미리 다 그려 두면 자료가 바뀔 때 어긋난다 */
    drawPage(no);

    updatePager();
    refs.pageHint.textContent = no + " / " + PAGES.length + "장 · " + PAGES[no - 1].label;

    window.scrollTo({ top: 0, behavior: "auto" });
    var page = pages[no - 1];
    if (page) page.focus({ preventScroll: true });
    K.announce(no + "장 " + PAGES[no - 1].label);
  }

  /**
   * 자료를 불러온 뒤 나머지 장을 열어 준다.
   * 처음 불러왔을 때만 2장으로 넘긴다 — 4장에서 다시 불러왔다면 그 자리에 머문다.
   */
  function unlockPages(firstTime) {
    showPage(firstTime ? 2 : currentPage);
  }

  /* ---------------------------------------------------------------- */
  /* 1장 — 결과 불러오기                                                */
  /* ---------------------------------------------------------------- */

  function setStatus(kind, message) {
    if (!refs.status) return;
    refs.status.className = "t-status" + (kind ? " is-" + kind : "");

  }

  function note(message) {
    if (!refs.serverNote) return;
    K.clear(refs.serverNote);

  }

  function afterLoad(result, serverHint) {
    var message =
      "새로 " + result.added + "건, 갱신 " + result.updated + "건" +
      (result.skipped ? ", 다른 차시 " + result.skipped + "건 제외" : "") +
      (result.kept ? ", 오래된 제출 " + result.kept + "건 무시" : "");
    setStatus("ok", message + " — 모두 " + T.data.count() + "건");
    K.toast(message);

    /* 한 건도 안 왔다면 서버가 알려 준 «무엇을 켜야 하는지» 를 그대로 보여 준다 */
    if (!hasData() && serverHint) note(serverHint);

    if (hasData()) unlockPages(currentPage === 1);
    else drawPage(1);
  }

  function buildSource(host) {
    var box = K.panel({
      title: "📥 제출 결과 불러오기",
      hint: "공유 드라이브 폴더에 저장된 학생 답안(JSON)을 읽어 옵니다.",
      className: "t-source"
    });

    refs.endpoint = el("input", {
      class: "t-source__input",
      attrs: {
        type: "url",
        placeholder: "https://script.google.com/macros/s/.../exec",
        "aria-label": "결과를 읽어올 Apps Script 주소",
        spellcheck: "false",
        autocomplete: "off"
      }
    });
    refs.endpoint.value = loadEndpoint();

    /* 교사 열쇠 —
       이 차시의 서버는 열쇠가 맞을 때만 목록을 준다(스크립트 속성 TEACHER_KEY).
       그래서 주소 칸과 같은 줄에 하나를 더 둔다. */
    refs.teacherKey = el("input", {
      class: "t-source__input",
      attrs: { type: "password", placeholder: "교사 열쇠", "aria-label": "교사 열쇠", autocomplete: "off" }
    });

    var btnServer = el("button", {
      class: "btn btn--primary",
      text: "제출 결과 불러오기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에서 읽고 있어요…");
          note("");
          T.data.fetchFromServer(refs.endpoint.value, refs.teacherKey.value).then(function (result) {
            if (!result.ok) {
              setStatus("error", result.message);
              return;
            }
            saveEndpoint(refs.endpoint.value);
            afterLoad(result.count, result.hint);
          });
        }
      }
    });

    refs.fileInput = el("input", {
      class: "sr-only",
      id: "t-file",
      attrs: { type: "file", accept: ".json,application/json", multiple: true, "aria-label": "제출 JSON 파일 열기" }
    });
    refs.fileInput.addEventListener("change", function () {
      if (refs.fileInput.files && refs.fileInput.files.length) {
        T.data.readFiles(refs.fileInput.files).then(function (r) {
          afterLoad(r);
        });
      }
    });

    var btnFile = el("button", {
      class: "btn btn--ghost",
      text: "JSON 파일 열기",
      attrs: { type: "button" },
      on: {
        click: function () {
          refs.fileInput.click();
        }
      }
    });

    /* 무엇이 빠졌는지 짚어 주는 단추 — 폴더·열쇠·Drive API 를 서버에 물어본다 */
    var btnPing = el("button", {
      class: "btn btn--ghost",
      text: "연결 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에 물어보고 있어요…");
          T.data.pingServer(refs.endpoint.value, refs.teacherKey.value).then(function (r) {
            if (r.ok === false && !r.driveAccess) {
              setStatus("error", r.message || "확인하지 못했습니다.");
              return;
            }

            var lines = [];
            lines.push("폴더 설정 " + (r.folderConfigured ? "✔" : "✘ FOLDER_ID 를 넣어야 합니다"));
            lines.push("교사 열쇠 " + (r.teacherKeyConfigured ? "✔" : "✘ TEACHER_KEY 를 넣어야 합니다"));
            lines.push("폴더 훑는 길 : " + (r.driveAccess || "알 수 없음"));
            if (r.folderName) lines.push("폴더 «" + r.folderName + "» 에 제출 " + r.fileCount + "개");
            if (r.reason) lines.push("(" + r.reason + ")");

            var good = r.ok !== false && r.folderConfigured && r.teacherKeyConfigured;
            setStatus(good ? "ok" : "error", lines.join(" · "));

            /* 공유 드라이브인데 Drive API 를 켜지 않은 것이 가장 흔한 고장이다 */
            note(
              r.driveApiEnabled === false
                ? "공유 드라이브를 쓰신다면 Apps Script 편집기 왼쪽 «서비스 +» 에서 Drive API 를 추가한 뒤 " +
                    "새 버전으로 다시 배포해 주세요. 켜지 않으면 목록이 비어 오고, 재제출이 덮어써지지 않습니다."
                : ""
            );
          });
        }
      }
    });

    box.body.appendChild(
      el("div", { class: "t-source__row" }, [
        refs.endpoint,
        refs.teacherKey,
        btnServer,
        btnPing,
        btnFile,
        refs.fileInput
      ])
    );

    refs.status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });
    /* 자동 새로고침 — 켜지 않으면 돌지 않는다 */
    var autoBox = el("input", {
      class: "check__input",
      id: "t-auto",
      attrs: { type: "checkbox" }
    });
    autoBox.addEventListener("change", function () {
      if (autoBox.checked) {
        startAuto();
        setStatus("ok", autoSeconds() + "초마다 자동으로 다시 읽습니다. 창을 닫으면 멈춥니다.");
      } else {
        stopAuto();
        setStatus("", "자동 새로고침을 껐습니다.");
      }
    });
    box.body.appendChild(
      el("div", { class: "check no-print" }, [
        autoBox,
        el("label", {
          class: "check__label",
          attrs: { for: "t-auto" },
          text: autoSeconds() + "초마다 자동으로 다시 읽기 (교사 열쇠는 저장하지 않습니다)"
        })
      ])
    );

    setStatus("", "주소와 교사 열쇠를 넣은 뒤 「제출 결과 불러오기」 를 눌러 주세요.");
    box.body.appendChild(refs.status);

    refs.serverNote = el("div");
    box.body.appendChild(refs.serverNote);

    /* 끌어다 놓기 */
    var drop = el("div", {
      class: "t-drop",
      text: "또는 드라이브에서 내려받은 JSON 파일들을 이곳에 끌어다 놓으세요."
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var files = Array.prototype.filter.call((e.dataTransfer && e.dataTransfer.files) || [], function (f) {
        return /\.json$/i.test(f.name);
      });
      if (files.length) {
        T.data.readFiles(files).then(function (r) {
          afterLoad(r);
        });
      } else {
        setStatus("error", "JSON 파일만 열 수 있어요.");
      }
    });
    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", {
        text: "주소에서 바로 읽으려면 apps/teacher-list/Code.gs 를 웹앱으로 배포하고, 스크립트 속성의 TEACHER_KEY 를 위 칸에 넣어야 해요. ★ 학생이 제출하는 주소(apps/student-submit)와는 «다른» 주소입니다. 안 되면 [연결 확인] 을 눌러 보세요."
      })
    );
    hints.appendChild(
      el("li", {
        text: "배포가 어렵다면 드라이브 폴더에서 학번_이름.json 파일을 내려받아 「JSON 파일 열기」 로 한꺼번에 선택해도 됩니다."
      })
    );
    box.body.appendChild(hints);

    host.appendChild(box.root);

    /* 자료가 없을 때의 빈 안내 */
    refs.empty = K.panel({});
    refs.empty.body.appendChild(el("p", { class: "t-empty", text: "아직 불러온 제출이 없어요." }));
    refs.empty.body.appendChild(
      el("p", {
        class: "panel__hint",
        text: "위에서 「제출 결과 불러오기」 를 누르거나, 드라이브에서 내려받은 JSON 파일을 열어 주세요."
      })
    );
    host.appendChild(refs.empty.root);
  }

  /**
   * 찾기·거르기·정렬 줄 (명세 9장 «학번, 이름, 점수, 이수 여부로 검색·정렬·필터»)
   *
   * 계산은 t20-filter.js 가 한다. 여기서는 칸을 만들어 그 값을 넘길 뿐이다.
   * 고른 것을 «장을 옮겨도» 잃지 않도록 모듈 변수에 둔다.
   */
  var filterState = T.filter ? T.filter.emptyFilter() : null;

  function buildFilterBar(onChange) {
    if (!T.filter) return null;
    var opts = T.filter.optionsOf(rows());

    function select(label, value, choices, key) {
      var sel = el("select", { class: "input input--select", attrs: { "aria-label": label } });
      choices.forEach(function (c) {
        var o = el("option", { text: c.label, attrs: { value: String(c.value) } });
        if (String(c.value) === String(value)) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () {
        filterState[key] = sel.value === "0" || sel.value === "" ? (key === "grade" || key === "classNumber" ? 0 : sel.value) : sel.value;
        if (key === "grade" || key === "classNumber") filterState[key] = Number(sel.value) || 0;
        onChange();
      });
      return el("label", { class: "t-filter__field" }, [
        el("span", { class: "t-filter__label", text: label }),
        sel
      ]);
    }

    var search = el("input", {
      class: "input",
      attrs: { type: "search", placeholder: "학번 또는 이름", "aria-label": "학번·이름으로 찾기" }
    });
    search.value = filterState.keyword;
    search.addEventListener("input", function () {
      filterState.keyword = search.value;
      onChange();
    });

    return el("div", { class: "t-filter no-print" }, [
      el("label", { class: "t-filter__field" }, [
        el("span", { class: "t-filter__label", text: "찾기" }),
        search
      ]),
      select("학년", filterState.grade, [{ label: "전체", value: 0 }].concat(
        opts.grades.map(function (g) {
          return { label: g + "학년", value: g };
        })
      ), "grade"),
      select("반", filterState.classNumber, [{ label: "전체", value: 0 }].concat(
        opts.classes.map(function (c) {
          return { label: c + "반", value: c };
        })
      ), "classNumber"),
      select("이수", filterState.pass, [
        { label: "전체", value: "all" },
        { label: "이수", value: "pass" },
        { label: "미이수", value: "fail" }
      ], "pass"),
      select("회로", filterState.circuit, [
        { label: "전체", value: "all" },
        { label: "완성", value: "done" },
        { label: "미완성", value: "not" }
      ], "circuit"),
      select("코드", filterState.code, [
        { label: "전체", value: "all" },
        { label: "전부 통과", value: "done" },
        { label: "남음", value: "not" }
      ], "code"),
      select("정렬", filterState.sortBy, [
        { label: "학번", value: "studentId" },
        { label: "이름", value: "name" },
        { label: "점수", value: "score" },
        { label: "제출 시각", value: "time" }
      ], "sortBy"),
      select("차례", filterState.sortDir, [
        { label: "오름차순", value: "asc" },
        { label: "내림차순", value: "desc" }
      ], "sortDir")
    ]);
  }

  /** 거른 뒤의 목록 */
  function filtered() {
    return T.filter ? T.filter.apply(rows(), filterState) : rows();
  }

  function drawPage(no) {
    var page = pages[no - 1];
    if (!page) return;

    /* 1장은 처음 한 번만 만들고, 그 뒤에는 «빈 안내» 만 켜고 끈다 */
    if (no === 1) {
      if (refs.empty) refs.empty.root.hidden = hasData();
      return;
    }

    K.clear(page);
    var all = rows();

    /* ── 2장 대시보드 (명세 9장 1번) ───────────────────────────── */
    if (no === 2) {
      var summary = K.panel({ title: "📊 전체 요약", hint: "참여 수 · 제출률 · 평균 · 이수/미이수 · 점수 분포" });
      summary.body.appendChild(T.views.summary(all, {}));
      page.appendChild(summary.root);

      var podium = K.panel({ title: "🏆 상위 3명", hint: "점수 → 회로 오류 적은 순 → 코드 통과 수 → 제출 시각" });
      podium.body.appendChild(T.views.podium(all));
      page.appendChild(podium.root);

      /* 명단 올리기와 전체 정오표 — 예상 인원을 넣으면 제출률이 나온다 */
      page.appendChild(
        T.list.render(all, function () {
          drawPage(2);
        })
      );
      return;
    }

    /* ── 3장 형성평가 (명세 9장 2번) ───────────────────────────── */
    if (no === QUIZ_PAGE) {
      var quizBox = K.panel({
        title: "📝 형성평가 — 문항별 정답률과 선택지 분포",
        hint: "5번은 학생이 적은 원문을 그대로 보여 줍니다."
      });
      quizBox.body.appendChild(T.views.quiz(all));
      page.appendChild(quizBox.root);

      var wrongBox = K.panel({
        title: "📌 가장 많이 틀린 문제 (오답 TOP" + T.wrong.WRONG_LIMIT + ")",
        hint: "버튼을 누를 때마다 한 문제씩 해설과 함께 보여 줍니다. 모두 확인하면 다음 장이 열립니다."
      });
      wrongBox.body.appendChild(
        T.wrong.render(all, function (seen, total) {
          allWrongSeen = total === 0 || seen >= total;
          updatePager();
        })
      );
      page.appendChild(wrongBox.root);
      return;
    }

    /* ── 4장 회로 수행 (명세 9장 3번) ──────────────────────────── */
    if (no === 4) {
      var circuitBox = K.panel({
        title: "🔌 회로 수행",
        hint: "완성 여부 · 시도 횟수 · 네 단자 판정 · 위험 연결이 난 학생"
      });
      circuitBox.body.appendChild(T.views.circuit(all));
      page.appendChild(circuitBox.root);
      return;
    }

    /* ── 5장 코드 수행 (명세 9장 4번) ──────────────────────────── */
    if (no === 5) {
      var codeBox = K.panel({
        title: "⌨ 코드 수행",
        hint: "최종 코드 · 통과 검사 수 · 핀/입출력/문법 오류"
      });
      codeBox.body.appendChild(T.views.code(all));
      page.appendChild(codeBox.root);
      return;
    }

    /* ── 6장 실험 기록 (명세 9장 5번) ──────────────────────────── */
    if (no === 6) {
      var expBox = K.panel({
        title: "🧪 실험 기록",
        hint: "거리 · 재질 · 각도 · 오차와 학생이 적은 관찰"
      });
      expBox.body.appendChild(T.views.experiment(all));
      page.appendChild(expBox.root);
      return;
    }

    /* ── 7장 학생별 보기 (명세 9장 6번) ────────────────────────── */
    if (no === 7) {
      var detailBox = K.panel({
        title: "👤 학생별 보기",
        hint: "왼쪽에서 학생을 고르면 정오표 · 연결 목록 · 코드 · 측정 기록이 함께 나옵니다."
      });
      var bar = buildFilterBar(function () {
        drawPage(7);
      });
      if (bar) detailBox.body.appendChild(bar);

      var list = filtered();
      detailBox.body.appendChild(
        el("p", { class: "panel__hint", text: "보이는 학생 " + list.length + " / " + all.length + "명" })
      );
      if (list.length === 0) {
        detailBox.body.appendChild(K.empty("거르기 조건에 맞는 학생이 없습니다."));
      } else if (T.detail) {
        detailBox.body.appendChild(T.detail.render(list));
      } else {
        detailBox.body.appendChild(K.empty("학생별 보기 부품을 불러오지 못했습니다."));
      }
      page.appendChild(detailBox.root);
      return;
    }

    /* ── 8장 정답 · 지도 (명세 9장 7번 · 10장) ─────────────────── */
    if (no === 8) {
      var guideBox = K.panel({
        title: "🔑 정답 · 지도",
        hint: "회로 정답 · 기준 코드 · 평가 정답과 해설 · 오개념과 지도 포인트"
      });
      guideBox.body.appendChild(T.guide.render());
      page.appendChild(guideBox.root);
    }
  }

  /* ---------------------------------------------------------------- */
  /* 시작                                                             */
  /* ---------------------------------------------------------------- */

  function start() {
    var host = K.$("#t-main");
    if (!host) return;

    K.clear(host);
    buildHeader(host);
    buildStepper(host);

    PAGES.forEach(function (p) {
      var page = el("section", {
        class: "t-page",
        attrs: { "data-page": String(p.no), "aria-label": p.no + "장 " + p.label, tabindex: "-1" }
      });
      pages.push(page);
      host.appendChild(page);
    });

    buildSource(pages[0]);
    buildPager(host);
    showPage(1);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  T.main = {
    PAGES: PAGES,
    rows: rows,
    startAuto: startAuto,
    stopAuto: stopAuto,
    filterState: function () {
      return filterState;
    },
    goToPage: goToPage,
    stampPrintDate: stampPrintDate,
    refresh: function () {
      drawPage(currentPage);
    }
  };
})();
    </script>
  </body>
</html>
