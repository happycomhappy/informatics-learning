      { blank: "b3", indent: 1, step: 3, hint: "trigPin 을 다시 LOW 로 내려 펄스를 끝내는 줄" },
      { text: "" },
      { blank: "b4", indent: 1, step: 4, hint: "echoPin 이 HIGH 인 «시간» 을 읽어 duration 에 담는 줄" },
      { blank: "b5", indent: 1, step: 5, hint: "duration 으로 거리를 구해 distance 에 담는 줄 — 왕복이므로 나눌 것이 있다" },
      { text: "  Serial.println(distance);" },
      { text: "  delay(" + LOOP_DELAY_MS + ");" },
      { text: "}" }
    ]
  };

  /**
   * 확장 활동(주차 경고 장치)의 빈칸 판.
   * 거리를 재는 부분은 그대로 주고, «판단하는 곳» 만 비운다.
   */
  var WARNING_TEMPLATE = {
    lines: [
      { text: "const int trigPin = " + TRIG_PIN + ";" },
      { text: "const int echoPin = " + ECHO_PIN + ";" },
      { blank: "w1", indent: 0, step: 1, hint: "경고 LED 를 이을 핀에 이름을 붙이는 줄 (예: 9번 핀)" },
      { text: "" },
      { text: "void setup() {" },
      { text: "  Serial.begin(9600);" },
      { text: "  pinMode(trigPin, OUTPUT);" },
      { text: "  pinMode(echoPin, INPUT);" },
      { blank: "w2", indent: 1, step: 2, hint: "LED 핀을 «내보내는» 핀으로 정하는 줄" },
      { text: "}" },
      { text: "" },
      { text: "void loop() {" },
      { text: "  digitalWrite(trigPin, LOW);" },
      { text: "  delayMicroseconds(" + TRIG_SETTLE_US + ");" },
      { text: "  digitalWrite(trigPin, HIGH);" },
      { text: "  delayMicroseconds(" + TRIG_PULSE_US + ");" },
      { text: "  digitalWrite(trigPin, LOW);" },
      { text: "" },
      { text: "  long duration = pulseIn(echoPin, HIGH);" },
      { text: "  float distance = duration * " + SOUND_SPEED + " / 2.0;" },
      { text: "  Serial.println(distance);" },
      { text: "" },
      { blank: "w3", indent: 1, step: 3, hint: "거리가 기준보다 «가까운가» 를 묻는 줄 — 여는 중괄호까지 적는다" },
      { blank: "w4", indent: 2, step: 4, hint: "가까울 때 LED 를 켜는 줄" },
      { text: "  } else {" },
      { blank: "w5", indent: 2, step: 5, hint: "멀 때 LED 를 끄는 줄" },
      { text: "  }" },
      { text: "  delay(" + LOOP_DELAY_MS + ");" },
      { text: "}" }
    ]
  };

  /* ------------------------------------------------------------------ */
  /* 1. 토큰 나누기                                                       */
  /* ------------------------------------------------------------------ */

  /* for·배열은 3차시에서 들어온 것이고, 이 차시에도 그대로 쓸 수 있게 남겨 둔다. */
  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "for", "return", "unsigned"];
  var TYPES = ["int", "long", "float", "double", "bool", "boolean", "char", "unsigned"];
  var CONSTANTS = {
    HIGH: 1,
    LOW: 0,
    OUTPUT: "OUTPUT",
    INPUT: "INPUT",
    INPUT_PULLUP: "INPUT_PULLUP",
    true: 1,
    false: 0
  };

  /* 아날로그 핀 이름도 «상수» 다. analogRead(A0) 처럼 적으므로
     이것을 빠뜨리면 «A0 라는 변수를 만들지 않았다» 는 엉뚱한 오류가 난다. */
  ["A0", "A1", "A2", "A3", "A4", "A5"].forEach(function (name) {
    CONSTANTS[name] = name;
  });

  /* 긴 연산자를 먼저 시도해야 «>=» 가 «>» 와 «=» 로 쪼개지지 않는다 */
  var OPERATORS = ["==", "!=", "<=", ">=", "&&", "||", "++", "--", "+=", "-=", "+", "-", "*", "/", "%", "<", ">", "=", "!"];

  function ParseError(message, line, code) {
    this.name = "ParseError";
    this.message = message;
    this.line = line || 0;
    this.code = code || "syntax";
  }

  function tokenize(source) {
    var tokens = [];
    var text = String(source || "");
    var i = 0;
    var line = 1;

    function peek(offset) {
      return text.charAt(i + (offset || 0));
    }

    while (i < text.length) {
      var ch = text.charAt(i);

      /* 줄바꿈과 공백 */
      if (ch === "\n") {
        line += 1;
        i += 1;
        continue;
      }
      if (/\s/.test(ch)) {
        i += 1;
        continue;
      }

      /* 주석 */
      if (ch === "/" && peek(1) === "/") {
        while (i < text.length && text.charAt(i) !== "\n") i += 1;
        continue;
      }
      if (ch === "/" && peek(1) === "*") {
        i += 2;
        while (i < text.length && !(text.charAt(i) === "*" && peek(1) === "/")) {
          if (text.charAt(i) === "\n") line += 1;
          i += 1;
        }
        if (i >= text.length) throw new ParseError("주석 /* 를 닫지 않았습니다. */ 를 적어 주세요.", line, "comment");
        i += 2;
        continue;
      }

      /* 문자열 */
      if (ch === '"') {
        var startLine = line;
        var value = "";
        i += 1;
        while (i < text.length && text.charAt(i) !== '"') {
          if (text.charAt(i) === "\n") {
            throw new ParseError("문자열을 같은 줄에서 닫아 주세요. 따옴표(\") 짝이 맞지 않습니다.", startLine, "string");
          }
          if (text.charAt(i) === "\\") {
            var esc = peek(1);
            value += esc === "n" ? "\n" : esc === "t" ? "\t" : esc;
            i += 2;
            continue;
          }
          value += text.charAt(i);
          i += 1;
        }
        if (i >= text.length) {
          throw new ParseError("문자열을 닫는 따옴표(\") 가 없습니다.", startLine, "string");
        }
        i += 1;
        tokens.push({ type: "string", value: value, line: startLine });
        continue;
      }

      /* 숫자 */
      if (/[0-9]/.test(ch)) {
        var num = "";
        while (i < text.length && /[0-9.]/.test(text.charAt(i))) {
          num += text.charAt(i);
          i += 1;
        }
        tokens.push({ type: "number", value: parseFloat(num), line: line });
        continue;
      }

      /* 이름 (변수·함수·상수) */
      if (/[A-Za-z_]/.test(ch)) {
        var name = "";
        while (i < text.length && /[A-Za-z0-9_]/.test(text.charAt(i))) {
          name += text.charAt(i);
          i += 1;
        }
        tokens.push({
          type: KEYWORDS.indexOf(name) !== -1 ? "keyword" : "name",
          value: name,
          line: line
        });
        continue;
      }

      /* 괄호와 구두점 — 대괄호 [ ] 는 배열을 읽을 때 쓴다 */
      if ("(){}[],;.".indexOf(ch) !== -1) {
        tokens.push({ type: "punct", value: ch, line: line });
        i += 1;
        continue;
      }

      /* 연산자 */
      var matched = null;
      for (var k = 0; k < OPERATORS.length; k += 1) {
        if (text.substr(i, OPERATORS[k].length) === OPERATORS[k]) {
          matched = OPERATORS[k];
          break;
        }
      }
      if (matched) {
        tokens.push({ type: "op", value: matched, line: line });
        i += matched.length;
        continue;
      }

      throw new ParseError("여기서는 쓸 수 없는 기호 «" + ch + "» 입니다.", line, "char");
    }

    tokens.push({ type: "eof", value: "", line: line });
    return tokens;
  }

  /* ------------------------------------------------------------------ */
  /* 2. 구문 나무 만들기                                                   */
  /* ------------------------------------------------------------------ */

  function parse(source) {
    var tokens = tokenize(source);
    var pos = 0;

    function peek(offset) {
      return tokens[pos + (offset || 0)] || tokens[tokens.length - 1];
    }
    function at(type, value) {
      var t = peek();
      return t.type === type && (value === undefined || t.value === value);
    }
    function next() {
      var t = peek();
      pos += 1;
      return t;
    }
    function expect(type, value, what) {
      if (!at(type, value)) {
        var t = peek();
        var got = t.type === "eof" ? "코드가 끝났습니다" : "«" + t.value + "»";

        /**
         * ★ 세미콜론은 «앞 줄» 을 가리킨다.
         *
         *   delay(400) 처럼 세미콜론을 빠뜨리면 파서는 다음 줄의 «}» 에서야 알아챈다.
         *   그런데 학생이 고쳐야 할 줄은 «}» 가 아니라 delay 가 적힌 줄이다.
         *   찾은 자리를 그대로 알리면 멀쩡한 줄을 들여다보며 헤매게 된다.
         */
        var line = t.line;
        if (value === ";" && pos > 0 && tokens[pos - 1] && tokens[pos - 1].line < t.line) {
          line = tokens[pos - 1].line;
        }

        throw new ParseError(
          (what || "«" + value + "»") + " 가 있어야 하는 자리에 " + got + " 이(가) 있습니다.",
          line,
          value === ";" ? "semicolon" : value === "}" || value === "{" ? "brace" : "syntax"
        );
      }
      return next();
    }

    /* ----- 식(expression) : 우선순위가 낮은 것부터 ----- */

    function parseExpression() {
      return parseOr();
    }
    function parseOr() {
      var left = parseAnd();
      while (at("op", "||")) {
        var line = next().line;
        left = { kind: "binary", op: "||", left: left, right: parseAnd(), line: line };
      }
      return left;
    }
    function parseAnd() {
      var left = parseEquality();
      while (at("op", "&&")) {
        var line = next().line;
        left = { kind: "binary", op: "&&", left: left, right: parseEquality(), line: line };
      }
      return left;
    }
    function parseEquality() {
      var left = parseComparison();
      while (at("op", "==") || at("op", "!=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseComparison(), line: t.line };
      }
      return left;
    }
    function parseComparison() {
      var left = parseAdditive();
      while (at("op", "<") || at("op", ">") || at("op", "<=") || at("op", ">=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseAdditive(), line: t.line };
      }
      return left;
    }
    function parseAdditive() {
      var left = parseMultiplicative();
      while (at("op", "+") || at("op", "-")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseMultiplicative(), line: t.line };
      }
      return left;
    }
    function parseMultiplicative() {
      var left = parseUnary();
      while (at("op", "*") || at("op", "/") || at("op", "%")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseUnary(), line: t.line };
      }
      return left;
    }
    function parseUnary() {
      if (at("op", "!") || at("op", "-")) {
        var t = next();
        return { kind: "unary", op: t.value, arg: parseUnary(), line: t.line };
      }
      return parsePrimary();
    }

    function parseArguments() {
      var args = [];
      expect("punct", "(", "여는 괄호 «(»");
      if (!at("punct", ")")) {
        args.push(parseExpression());
        while (at("punct", ",")) {
          next();
          args.push(parseExpression());
        }
      }
      expect("punct", ")", "닫는 괄호 «)»");
      return args;
    }

    function parsePrimary() {
      var t = peek();

      if (t.type === "number") {
        next();
        return { kind: "number", value: t.value, line: t.line };
      }
      if (t.type === "string") {
        next();
        return { kind: "string", value: t.value, line: t.line };
      }
      if (at("punct", "(")) {
        next();
        var inner = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        return inner;
      }
      if (t.type === "name" || (t.type === "keyword" && t.value === "true") || (t.type === "keyword" && t.value === "false")) {
        next();
        var name = t.value;

        /* Serial.println(...) 처럼 «점» 으로 이어지는 호출 */
        if (at("punct", ".")) {
          next();
          var member = expect("name", undefined, "함수 이름").value;
          var args = parseArguments();
          return { kind: "call", target: name, name: member, args: args, line: t.line };
        }
        if (at("punct", "(")) {
          var callArgs = parseArguments();
          return { kind: "call", target: "", name: name, args: callArgs, line: t.line };
        }
        /* 배열 읽기 :  notes[i]  ·  notes[0]  (명세 8장 기준 프로그램) */
        if (at("punct", "[")) {
          next();
          var indexExpr = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          return { kind: "index", name: name, index: indexExpr, line: t.line };
        }
        if (Object.prototype.hasOwnProperty.call(CONSTANTS, name)) {
          return { kind: "constant", name: name, value: CONSTANTS[name], line: t.line };
        }
        return { kind: "variable", name: name, line: t.line };
      }

      throw new ParseError(
        t.type === "eof" ? "코드가 갑자기 끝났습니다. 빠진 부분이 있는지 살펴보세요." : "여기에 «" + t.value + "» 이(가) 올 수 없습니다.",
        t.line,
        "syntax"
      );
    }

    /* ----- 문장(statement) ----- */

    function parseBlock() {
      var open = expect("punct", "{", "여는 중괄호 «{»");
      var body = [];
      while (!at("punct", "}")) {
        if (at("eof")) {
          throw new ParseError(
            "중괄호 «{» 를 닫지 않았습니다. " + open.line + "번 줄에서 열린 괄호에 짝이 되는 «}» 를 적어 주세요.",
            open.line,
            "brace"
          );
        }
        body.push(parseStatement());
      }
      expect("punct", "}", "닫는 중괄호 «}»");
      return body;
    }

    function parseStatement() {
      var t = peek();

      /* if / else */
      if (t.type === "keyword" && t.value === "if") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        var cond = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        var thenBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        var elseBody = null;
        if (peek().type === "keyword" && peek().value === "else") {
          next();
          if (peek().type === "keyword" && peek().value === "if") elseBody = [parseStatement()];
          else elseBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        }
        return { kind: "if", cond: cond, then: thenBody, otherwise: elseBody, line: t.line };
      }

      /* 되풀이 :  for (int i=0; i<8; i++) { ... }   (명세 4장 · 8장) */
      if (t.type === "keyword" && t.value === "for") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        /* ① 처음에 한 번 : int i = 0;  (세미콜론까지 parseStatement 가 먹는다) */
        var init = at("punct", ";") ? null : parseStatement();
        if (init === null) next();
        /* ② 언제까지 : i < 8 */
        var cond = at("punct", ";") ? null : parseExpression();
        expect("punct", ";", "세미콜론 «;»");
        /* ③ 한 바퀴마다 : i++  (여기에는 세미콜론이 없다) */
        var stepStmt = null;
        if (!at("punct", ")")) {
          var vTok = expect("name", undefined, "변수 이름");
          var sOp = next();
          if (["=", "+=", "-=", "++", "--"].indexOf(sOp.value) === -1) {
            throw new ParseError(
              "for 의 셋째 자리에는 i++ 처럼 «값을 바꾸는 식» 을 적습니다.",
              sOp.line,
              "syntax"
            );
          }
          var stepValue;
          if (sOp.value === "++" || sOp.value === "--") {
            stepValue = {
              kind: "binary",
              op: sOp.value === "++" ? "+" : "-",
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: { kind: "number", value: 1, line: vTok.line },
              line: vTok.line
            };
          } else if (sOp.value === "+=" || sOp.value === "-=") {
            stepValue = {
              kind: "binary",
              op: sOp.value.charAt(0),
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: parseExpression(),
              line: vTok.line
            };
          } else {
            stepValue = parseExpression();
          }
          stepStmt = { kind: "assign", name: vTok.value, value: stepValue, line: vTok.line };
        }
        expect("punct", ")", "닫는 괄호 «)»");
        var forBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        return { kind: "for", init: init, cond: cond, step: stepStmt, body: forBody, line: t.line };
      }

      /* 변수 선언 :  int x = 5;  /  const int PIN = 13;  /  int notes[] = {…}; */
      if (t.type === "keyword" && (t.value === "const" || TYPES.indexOf(t.value) !== -1)) {
        var isConst = false;
        if (t.value === "const") {
          next();
          isConst = true;
        }
        if (peek().type === "keyword" && peek().value === "unsigned") next();
        var typeTok = peek();
        if (typeTok.type !== "keyword" || TYPES.indexOf(typeTok.value) === -1) {
          throw new ParseError("자료형(int, long, float, bool …) 이 있어야 합니다.", typeTok.line, "syntax");
        }
        next();
        var nameTok = expect("name", undefined, "변수 이름");

        /* ★ 배열 선언 :  int notes[] = {523, 587, …};  또는 int notes[8] = {…}; */
        if (at("punct", "[")) {
          next();
          var sized = null;
          if (!at("punct", "]")) sized = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          var items = [];
          if (at("op", "=")) {
            next();
            expect("punct", "{", "여는 중괄호 «{»");
            if (!at("punct", "}")) {
              items.push(parseExpression());
              while (at("punct", ",")) {
                next();
                /* {1, 2, 3, } 처럼 쉼표 뒤에 바로 닫는 것도 봐준다 */
                if (at("punct", "}")) break;
                items.push(parseExpression());
              }
            }
            expect("punct", "}", "닫는 중괄호 «}»");
          }
          expect("punct", ";", "세미콜론 «;»");
          return {
            kind: "declare-array",
            name: nameTok.value,
            varType: typeTok.value,
            isConst: isConst,
            size: sized,
            items: items,
            line: t.line
          };
        }

        var init2 = null;
        if (at("op", "=")) {
          next();
          init2 = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return {
          kind: "declare",
          name: nameTok.value,
          varType: typeTok.value,
          isConst: isConst,
          init: init2,
          line: t.line
        };
      }

      /* 함수 정의가 함수 안에 들어온 경우 — 흔한 실수라 따로 알려 준다 */
      if (t.type === "keyword" && t.value === "void") {
        throw new ParseError(
          "함수 안에 또 다른 함수를 만들 수 없습니다. 앞의 «}» 를 빠뜨리지 않았는지 보세요.",
          t.line,
          "brace"
        );
      }

      /* 대입 :  x = 5;   x += 1;   x++; */
      if (t.type === "name" && peek(1).type === "op" && ["=", "+=", "-=", "++", "--"].indexOf(peek(1).value) !== -1) {
        next();
        var opTok = next();
        var value = null;
        if (opTok.value === "++" || opTok.value === "--") {
          value = {
            kind: "binary",
            op: opTok.value === "++" ? "+" : "-",
            left: { kind: "variable", name: t.value, line: t.line },
            right: { kind: "number", value: 1, line: t.line },
            line: t.line
          };
        } else if (opTok.value === "+=" || opTok.value === "-=") {
          value = {
            kind: "binary",
            op: opTok.value.charAt(0),
            left: { kind: "variable", name: t.value, line: t.line },
            right: parseExpression(),
            line: t.line
          };
        } else {
          value = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return { kind: "assign", name: t.value, value: value, line: t.line };
      }

      /* 그 밖에는 «식 하나로 이루어진 문장» — 대개 함수 호출이다 */
      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 이 수업에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 6.4 «검사 항목» · 명세 5장 4단계 통과 조건)           */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond", "index", "step"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      /* body : for·if 안쪽 · items : 배열 선언의 값들 */
      ["then", "otherwise", "args", "body", "items"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** setup() 과 loop() 를 통틀어 그 이름의 호출을 모두 모은다 (적힌 차례대로) */
  function allCalls(ast, fnName) {
    return callsIn(ast, "setup")
      .concat(callsIn(ast, "loop"))
      .filter(function (c) {
        return callName(c) === fnName;
      });
  }

  /**
   * loop() 몸통의 명령을 «적힌 차례대로» 늘어놓는다.
   * if·for 안에 든 것도 함께 센다 — 순서만 지켜 준다.
   */
  function statementCalls(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "express" && stmt.expr && stmt.expr.kind === "call") out.push(stmt.expr);
      else if (stmt.kind === "if") {
        out = out.concat(statementCalls(stmt.then));
        if (stmt.otherwise) out = out.concat(statementCalls(stmt.otherwise));
      } else if (stmt.kind === "for") {
        out = out.concat(statementCalls(stmt.body));
      }
    });
    return out;
  }

  /** 전역에서 «숫자로» 초기화한 이름들 — 핀 번호를 되찾는 데 쓴다 */
  function globalNumbers(ast) {
    var known = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    return known;
  }

  /** 전역에서 «숫자 배열» 로 선언한 이름들 */
  function arraysIn(ast) {
    var out = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare-array") out[g.name] = g.items || [];
    });
    return out;
  }

  /** 인수 하나를 핀 번호로 푼다. 알 수 없으면 null. */
  function resolvePin(node, known) {
    if (!node) return null;
    if (node.kind === "number") return node.value;
    if (node.kind === "constant" && /^A\d$/.test(node.name)) return node.name;
    if (node.kind === "variable" && known[node.name] !== undefined) return known[node.name];
    return null;
  }

  /** HIGH 를 적었는가 (HIGH 상수든 1 이든) */
  function isHighArg(node) {
    if (!node) return false;
    if (node.kind === "constant") return node.name === "HIGH";
    if (node.kind === "number") return node.value === 1;
    return false;
  }

  /**
   * ★★ 코드가 «Trig 와 Echo 로 무엇을 쓰는지» 를 뽑아낸다.
   *
   *   이 차시는 신호선이 «둘» 이라, 핀 번호만 모아서는 어느 쪽이 어긋났는지 알 수 없다.
   *   그래서 구실(role)까지 갈라 뽑는다. 회로 대조(circuit.pinMismatch)와
   *   시뮬레이터(run 의 world) 가 모두 이 값을 본다.
   *
   *   Echo : pulseIn(…) 의 첫 인수 — «시간을 읽는» 핀이 곧 Echo 다.
   *   Trig : digitalWrite 로 HIGH 와 LOW 를 «모두» 써 본 핀 — 펄스를 만드는 핀이다.
   *
   *   ★ 이름(trigPin·echoPin)에 기대지 않는다. 학생이 다른 이름을 붙여도 뜻이 통해야 한다.
   *     찾지 못했을 때에만 «맨 위 선언의 이름» 을 마지막 수단으로 본다.
   *
   * 돌려주는 것 : { trigPin, echoPin, trigMode, echoMode, trigName, echoName, pins }
   */
  function codePins(ast) {
    var known = globalNumbers(ast);
    var info = {
      trigPin: null,
      echoPin: null,
      trigMode: undefined,
      echoMode: undefined,
      trigName: "",
      echoName: "",
      pins: pinsUsed(ast)
    };

    /* ① Echo — pulseIn 의 첫 인수 */
    allCalls(ast, "pulseIn").forEach(function (c) {
      if (info.echoPin !== null) return;
      var a = (c.args || [])[0];
      var pin = resolvePin(a, known);
      if (pin === null) return;
      info.echoPin = pin;
      if (a.kind === "variable") info.echoName = a.name;
    });

    /* ② Trig — digitalWrite 로 HIGH 와 LOW 를 모두 써 본 핀 */
    var seen = [];
    var high = {};
    var low = {};
    var nameOf = {};
    allCalls(ast, "digitalWrite").forEach(function (c) {
      var a = (c.args || [])[0];
      var pin = resolvePin(a, known);
      if (pin === null) return;
      var key = String(pin);
      if (seen.indexOf(key) === -1) seen.push(key);
      if (a.kind === "variable") nameOf[key] = a.name;
      if (isHighArg((c.args || [])[1])) high[key] = pin;
      else low[key] = pin;
    });

    for (var i = 0; i < seen.length; i += 1) {
      if (high[seen[i]] !== undefined && low[seen[i]] !== undefined) {
        info.trigPin = high[seen[i]];
        info.trigName = nameOf[seen[i]] || "";
        break;
      }
    }
    /* HIGH 만이라도 써 본 핀 */
    if (info.trigPin === null) {
      for (var j = 0; j < seen.length; j += 1) {
        if (high[seen[j]] !== undefined) {
          info.trigPin = high[seen[j]];
          info.trigName = nameOf[seen[j]] || "";
          break;
        }
      }
    }
    /* 마지막 수단 — 맨 위 선언의 이름 */
    if (info.trigPin === null && known.trigPin !== undefined) info.trigPin = known.trigPin;
    if (info.echoPin === null && known.echoPin !== undefined) info.echoPin = known.echoPin;

    /* ③ pinMode — 그 핀을 어떤 모드로 정했는가 */
    allCalls(ast, "pinMode").forEach(function (c) {
      var pin = resolvePin((c.args || [])[0], known);
      var m = (c.args || [])[1];
      var mode = m && m.kind === "constant" ? m.name : null;
      if (pin === null || !mode) return;
      if (info.trigPin !== null && String(pin) === String(info.trigPin)) info.trigMode = mode;
      if (info.echoPin !== null && String(pin) === String(info.echoPin)) info.echoMode = mode;
    });

    return info;
  }

  /** 이 코드가 «세상» 을 어떻게 보고 있는가 — 시뮬레이터에 넘길 값 */
  function worldFromCode(ast, extra) {
    var info = codePins(ast);
    var w = extra || {};
    return {
      trigPin: w.trigPin === undefined ? TRIG_PIN : w.trigPin,
      echoPin: w.echoPin === undefined ? ECHO_PIN : w.echoPin,
      powered: w.powered === undefined ? true : w.powered,
      distance: w.distance === undefined ? (PC.DIST_DEFAULT === undefined ? 20 : PC.DIST_DEFAULT) : w.distance,
      angle: w.angle || PC.DEFAULT_ANGLE || "front",
      material: w.material || PC.DEFAULT_MATERIAL || "board",
      seed: w.seed === undefined ? 1 : w.seed,
      code: info
    };
  }

  /**
   * 상수만으로 이루어진 식을 계산해 본다 (변수는 vars 에서 찾는다).
   * 거리 공식을 «돌려 보아» 확인하는 데 쓴다. 알 수 없으면 null.
   */
  function evalConst(node, vars) {
    if (!node) return null;
    switch (node.kind) {
      case "number":
        return node.value;
      case "constant":
        return typeof node.value === "number" ? node.value : null;
      case "variable":
        return Object.prototype.hasOwnProperty.call(vars || {}, node.name) ? vars[node.name] : null;
      case "unary": {
        var v = evalConst(node.arg, vars);
        if (v === null) return null;
        return node.op === "!" ? (v ? 0 : 1) : -v;
      }
      case "binary": {
        var a = evalConst(node.left, vars);
        var b = evalConst(node.right, vars);
        if (a === null || b === null) return null;
        switch (node.op) {
          case "+":
            return a + b;
          case "-":
            return a - b;
          case "*":
            return a * b;
          case "/":
            return b === 0 ? null : a / b;
          case "%":
            return b === 0 ? null : a % b;
          default:
            return null;
        }
      }
      default:
        return null;
    }
  }

  /** 나무 안에 그 이름의 변수가 쓰였는가 */
  function usesVariable(node, name) {
    var found = false;
    (function walk(n) {
      if (!n || typeof n !== "object" || found) return;
      if (n.kind === "variable" && n.name === name) {
        found = true;
        return;
      }
      Object.keys(n).forEach(function (k) {
        var v = n[k];
        if (Array.isArray(v)) v.forEach(walk);
        else if (v && typeof v === "object") walk(v);
      });
    })(node);
    return found;
  }

  /** loop()·setup() 의 모든 문장을 한 줄로 늘어놓는다 (안쪽 블록까지) */
  function flatStatements(ast) {
    var out = [];
    ["setup", "loop"].forEach(function (fnName) {
      var fn = ast && ast.functions ? ast.functions[fnName] : null;
      if (!fn) return;
      (function walk(list) {
        (list || []).forEach(function (stmt) {
          if (!stmt) return;
          out.push(stmt);
          if (Array.isArray(stmt.body)) walk(stmt.body);
          if (Array.isArray(stmt.then)) walk(stmt.then);
          if (Array.isArray(stmt.otherwise)) walk(stmt.otherwise);
        });
      })(fn.body);
    });
    return out;
  }

  /**
   * «pulseIn 의 값을 담은 변수» 와 «그것으로 거리를 구한 문장» 을 찾는다.
   * 돌려주는 것 : { durationName, distanceName, formula, stmt }  (없으면 null 칸)
   */
  function findFormula(ast) {
    var out = { durationName: "", distanceName: "", formula: null, stmt: null };
    var stmts = flatStatements(ast);

    stmts.forEach(function (stmt) {
      if (out.durationName) return;
      var init = stmt.kind === "declare" ? stmt.init : stmt.kind === "assign" ? stmt.value : null;
      if (!init) return;
      var hasPulse = false;
      walkCalls([init], function (c) {
        if (callName(c) === "pulseIn") hasPulse = true;
      });
      if (hasPulse) out.durationName = stmt.name;
    });

    if (!out.durationName) return out;

    stmts.forEach(function (stmt) {
      if (out.formula) return;
      if (stmt.kind !== "declare" && stmt.kind !== "assign") return;
      if (stmt.name === out.durationName) return;
      var value = stmt.kind === "declare" ? stmt.init : stmt.value;
      if (!value || !usesVariable(value, out.durationName)) return;
      out.distanceName = stmt.name;
      out.formula = value;
      out.stmt = stmt;
    });

    return out;
  }

  /**
   * 검사 항목 — 화면에는 이 목록이 «통과/미통과» 로 보인다.
   * 정답 코드를 통째로 보여 주지 않고 «무엇이 빠졌는지» 만 알려 준다.
   *
   * 열 항목 (명세 6.4 «검사 항목» 을 학습 차례로 늘어놓은 것)
   *   ① 핀 선언  ② setup/loop  ③ Serial.begin(9600)  ④ pinMode OUTPUT·INPUT
   *   ⑤ LOW→HIGH→LOW 차례  ⑥ ★ 돌려 보아 10μs 펄스  ⑦ pulseIn
   *   ⑧ ★ 돌려 보아 거리 공식(2 로 나누기)  ⑨ Serial.println  ⑩ 회로 핀 대조
   *
   * ★ ⑥·⑧ 만 «실제로 돌려» 본다.
   *   펄스의 길이와 거리 공식은 글자를 세어서는 알 수 없다.
   *   delayMicroseconds 대신 delay 를 쓰면 «10ms 펄스» 가 되는 것도,
   *   2 로 나누지 않으면 «값이 정확히 두 배» 가 되는 것도 돌려 보아야 드러난다.
   */
  var TESTS = [
    {
      id: "t-pins",
      label: "trigPin 과 echoPin 을 핀 번호로 선언했다",
      run: function (ast) {
        var known = globalNumbers(ast);
        var names = Object.keys(known);
        if (names.length < 2) {
          return {
            ok: false,
            message:
              "핀 번호에 이름을 붙이지 않았습니다. 맨 위에 const int trigPin = " + TRIG_PIN +
              "; 와 const int echoPin = " + ECHO_PIN + "; 처럼 두 줄을 적어 주세요."
          };
        }
        var info = codePins(ast);
        if (info.trigPin === null) {
          return { ok: false, message: "Trig 로 쓸 핀을 찾지 못했습니다. 핀 번호를 «숫자» 로 적어 주세요." };
        }
        if (info.echoPin === null) {
          return { ok: false, message: "Echo 로 쓸 핀을 찾지 못했습니다. 핀 번호를 «숫자» 로 적어 주세요." };
        }
        if (String(info.trigPin) === String(info.echoPin)) {
          return {
            ok: false,
            message:
              "Trig 와 Echo 가 같은 핀(" + info.trigPin + ")입니다. 보내는 핀과 받는 핀은 달라야 합니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-setup",
      label: "setup() 과 loop() 함수가 모두 있다",
      run: function (ast) {
        if (!ast.functions.setup) {
          return { ok: false, message: "void setup() { } 가 없습니다. 처음 한 번만 할 일을 여기에 적습니다." };
        }
        if (!ast.functions.loop) {
          return {
            ok: false,
            message:
              "void loop() { } 가 없습니다. 거리는 «되풀이해서» 재야 하므로 측정하는 코드는 loop() 안에 적습니다."
          };
        }
        if ((ast.functions.loop.body || []).length === 0) {
          return {
            ok: false,
            message: "loop() 가 비어 있습니다. 거리를 재는 코드는 되풀이되어야 하므로 loop() 안에 적습니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-serial",
      label: "Serial.begin(9600) 으로 시리얼 모니터를 열었다",
      run: function (ast) {
        var opens = allCalls(ast, "Serial.begin");
        if (opens.length === 0) {
          return {
            ok: false,
            message:
              "Serial.begin(9600); 이 없습니다. 이 줄이 없으면 시리얼 모니터에 아무것도 보이지 않습니다."
          };
        }
        var speed = (opens[0].args || [])[0];
        var value = speed && speed.kind === "number" ? speed.value : null;
        if (value !== 9600) {
          return {
            ok: false,
            message:
              "Serial.begin 의 값이 " + (value === null ? "숫자가 아닙니다" : value + " 입니다") +
              ". 이 수업에서는 9600 으로 맞춥니다 — 시리얼 모니터의 속도와 같아야 글자가 깨지지 않습니다."
          };
        }
        var inSetup = callsIn(ast, "setup").some(function (c) {
          return callName(c) === "Serial.begin";
        });
        if (!inSetup) {
          return {
            ok: false,
            message: "Serial.begin 은 «한 번만» 하면 되므로 setup() 안에 적습니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-mode",
      label: "pinMode 로 Trig 는 OUTPUT, Echo 는 INPUT 으로 정했다",
      run: function (ast) {
        var info = codePins(ast);
        var modes = allCalls(ast, "pinMode");
        if (modes.length === 0) {
          return {
            ok: false,
            message:
              "pinMode 가 없습니다. 핀마다 «내보낼 것인가 받을 것인가» 를 먼저 정해야 합니다."
          };
        }
        if (info.trigMode === undefined) {
          return {
            ok: false,
            message: "Trig 핀의 pinMode 를 정하지 않았습니다. Trig 는 신호를 «보내는» 핀입니다."
          };
        }
        if (info.trigMode !== "OUTPUT") {
          return {
            ok: false,
            message:
              "Trig 를 " + info.trigMode + " 로 정했습니다. Trig 는 아두이노가 «내보내는» 핀이므로 OUTPUT 입니다."
          };
        }
        if (info.echoMode === undefined) {
          return {
            ok: false,
            message: "Echo 핀의 pinMode 를 정하지 않았습니다. Echo 는 센서가 알려 주는 값을 «받는» 핀입니다."
          };
        }
        if (info.echoMode !== "INPUT" && info.echoMode !== "INPUT_PULLUP") {
          return {
            ok: false,
            message:
              "Echo 를 " + info.echoMode + " 로 정했습니다. Echo 는 센서가 보내 주는 신호를 «받는» 핀이므로 INPUT 입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-order",
      label: "Trig 를 LOW → HIGH → LOW 차례로 바꾼다",
      run: function (ast) {
        var info = codePins(ast);
        if (info.trigPin === null) return { ok: false, message: "먼저 Trig 핀을 정해 주세요." };
        var known = globalNumbers(ast);

        /* Trig 핀에 쓴 값만 «적힌 차례대로» 모은다 */
        var seq = [];
        ["setup", "loop"].forEach(function (fnName) {
          var fn = ast.functions[fnName];
          if (!fn) return;
          statementCalls(fn.body).forEach(function (c) {
            if (callName(c) !== "digitalWrite") return;
            var pin = resolvePin((c.args || [])[0], known);
            if (pin === null || String(pin) !== String(info.trigPin)) return;
            seq.push({ high: isHighArg((c.args || [])[1]), line: c.line });
          });
        });

        if (seq.length === 0) {
          return {
            ok: false,
            message: "digitalWrite 로 Trig 를 움직이지 않았습니다. 펄스는 HIGH·LOW 를 바꾸어 만듭니다."
          };
        }
        var highAt = -1;
        for (var i = 0; i < seq.length; i += 1) {
          if (seq[i].high) {
            highAt = i;
            break;
          }
        }
        if (highAt === -1) {
          return { ok: false, message: "Trig 를 HIGH 로 올린 적이 없습니다. 펄스를 시작하는 줄이 빠졌습니다." };
        }
        var lowAfter = seq.slice(highAt + 1).some(function (s) {
          return !s.high;
        });
        if (!lowAfter) {
          return {
            ok: false,
            message:
              "HIGH 로 올린 뒤 다시 LOW 로 내리지 않았습니다. 내리지 않으면 «펄스» 가 아니라 " +
              "계속 HIGH 인 상태가 되어 센서가 한 번만 반응합니다."
          };
        }
        if (highAt === 0) {
          return {
            ok: false,
            message:
              "HIGH 앞에 LOW 가 없습니다. 재기 전에 digitalWrite(trigPin, LOW); 로 " +
              "핀을 «가라앉혀» 두어야 펄스의 시작이 또렷해집니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pulse",
      label: "★ 돌려 보니 Trig 펄스가 " + TRIG_PULSE_US + "μs 이상이다",
      run: function (ast, ctx) {
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var info = codePins(ast);
        var result = run(source, {
          loopLimit: 1,
          world: worldFromCode(ast, {
            trigPin: info.trigPin === null ? TRIG_PIN : info.trigPin,
            echoPin: info.echoPin === null ? ECHO_PIN : info.echoPin
          })
        });
        if (result.error) return { ok: false, message: result.error.message };

        var mine = (result.sensor.pulses || []).filter(function (p) {
          return String(p.pin) === String(info.trigPin);
        });
        if (mine.length === 0) {
          return {
            ok: false,
            message: "돌려 보니 Trig 에 펄스가 한 번도 만들어지지 않았습니다. HIGH 뒤에 LOW 가 와야 «한 번» 으로 셉니다."
          };
        }
        var us = mine[0].us;
        if (us >= 1000) {
          return {
            ok: false,
            message:
              "펄스가 " + us + "μs (= " + us / 1000 + "ms) 입니다. delay() 는 «밀리초», " +
              "delayMicroseconds() 는 «마이크로초» 입니다. 1ms = 1000μs 이므로 " +
              TRIG_PULSE_US + "μs 를 만들려면 delayMicroseconds(" + TRIG_PULSE_US + ") 를 씁니다."
          };
        }
        if (us < TRIG_PULSE_US) {
          return {
            ok: false,
            message:
              "펄스가 " + us + "μs 뿐입니다. HC-SR04 는 " + TRIG_PULSE_US +
              "μs 이상 HIGH 가 유지되어야 «쏘라» 는 명령으로 알아챕니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pulsein",
      label: "pulseIn(echoPin, HIGH) 으로 왕복 시간을 읽는다",
      run: function (ast) {
        var reads = allCalls(ast, "pulseIn");
        if (reads.length === 0) {
          return {
            ok: false,
            message:
              "pulseIn(...) 이 없습니다. Echo 가 HIGH 인 «시간» 을 재는 함수가 pulseIn 입니다. " +
              "digitalRead 는 지금 HIGH 인지 아닌지만 알려 주므로 시간을 잴 수 없습니다."
          };
        }
        var args = reads[0].args || [];
        if (args.length < 2) {
          return {
            ok: false,
            message: "pulseIn 에는 «어느 핀» 과 «어떤 상태를 잴지» 두 값이 필요합니다. 예) pulseIn(echoPin, HIGH);"
          };
        }
        if (!isHighArg(args[1])) {
          return {
            ok: false,
            message:
              "pulseIn 의 두 번째 값이 HIGH 가 아닙니다. Echo 는 초음파가 돌아오는 «동안» HIGH 로 " +
              "있으므로 그 HIGH 의 길이를 재야 합니다."
          };
        }
        var found = findFormula(ast);
        if (!found.durationName) {
          return {
            ok: false,
            message: "pulseIn 의 결과를 변수에 담지 않았습니다. long duration = pulseIn(echoPin, HIGH); 처럼 적습니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-formula",
      label: "★ 돌려 보니 거리 공식이 맞다 (왕복이라 2 로 나눈다)",
      run: function (ast) {
        var found = findFormula(ast);
        if (!found.durationName) return { ok: false, message: "먼저 pulseIn 의 결과를 변수에 담아 주세요." };
        if (!found.formula) {
          return {
            ok: false,
            message:
              found.durationName + " 로 거리를 구하는 줄이 없습니다. " +
              "float distance = " + found.durationName + " * " + SOUND_SPEED + " / 2.0; 처럼 적습니다."
          };
        }

        /* ★ 돌려 본다 — duration 이 1000μs 일 때 17cm 가 나와야 한다(명세 6.6 4번). */
        var vars = {};
        vars[found.durationName] = 1000;
        var got = evalConst(found.formula, vars);

        if (got === null) {
          return {
            ok: false,
            message: "거리 식에 계산할 수 없는 것이 섞여 있습니다. " + found.durationName + " 와 숫자만으로 적어 주세요."
          };
        }
        var want = (1000 * SOUND_SPEED) / 2; /* 17 */
        if (Math.abs(got - want) < 0.05) return { ok: true };

        if (Math.abs(got - want * 2) < 0.1) {
          return {
            ok: false,
            message:
              "2 로 나누지 않았습니다. 지금 식은 " + Math.round(got * 100) / 100 + "cm 를 내놓지만 " +
              "실제 거리는 " + want + "cm 입니다. pulseIn 이 잰 시간은 초음파가 «갔다가 돌아온» 시간이므로 " +
              "그대로 쓰면 값이 꼭 두 배가 됩니다."
          };
        }
        if (Math.abs(got - want / 2) < 0.1) {
          return {
            ok: false,
            message: "너무 많이 나누었습니다. 2 로 «한 번만» 나눕니다. 지금 식은 " + Math.round(got * 100) / 100 + "cm 입니다."
          };
        }
        return {
          ok: false,
          message:
            found.durationName + " 가 1000 일 때 " + want + "cm 가 나와야 하는데 지금 식은 " +
            Math.round(got * 100) / 100 + "cm 를 내놓습니다. 음속은 " + SOUND_SPEED +
            " cm/μs 이고, 잰 시간은 왕복이라 2 로 나눕니다."
        };
      }
    },
    {
      id: "t-print",
      label: "Serial.println() 으로 거리를 출력한다",
      run: function (ast) {
        var prints = allCalls(ast, "Serial.println").concat(allCalls(ast, "Serial.print"));
        if (prints.length === 0) {
          return {
            ok: false,
            message: "Serial.println(...) 이 없습니다. 잰 값을 시리얼 모니터로 내보내야 눈으로 볼 수 있습니다."
          };
        }
        var found = findFormula(ast);
        if (!found.distanceName) return { ok: true };

        var showsDistance = prints.some(function (c) {
          return (c.args || []).some(function (a) {
            return usesVariable(a, found.distanceName);
          });
        });
        if (!showsDistance) {
          var showsDuration = prints.some(function (c) {
            return (c.args || []).some(function (a) {
              return usesVariable(a, found.durationName);
            });
          });
          return {
            ok: false,
            message: showsDuration
              ? "시간(" + found.durationName + ")을 출력하고 있습니다. 화면에 보여야 하는 것은 «거리» 인 " +
                found.distanceName + " 입니다."
              : found.distanceName + " 을(를) 출력하지 않았습니다. Serial.println(" + found.distanceName + "); 을 적어 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pin-match",
      label: "코드의 Trig·Echo 핀이 회로에 이은 핀과 같다",
      run: function (ast, ctx) {
        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0) {
          return { ok: false, message: "3단계에서 회로를 먼저 이어 주세요. 이을 핀이 없으면 맞대어 볼 수 없습니다." };
        }
        var problems = PC.circuit ? PC.circuit.pinMismatch(codePins(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis",
    /* 이 차시에서 늘어난 둘 (명세 4장) */
    "delayMicroseconds",
    "pulseIn"
  ];

  var PIN_CALLS = [
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "pulseIn"
  ];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (경고와 교사 화면에 쓴다)
   *
   * ★ trigPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   */
  function pinsUsed(ast) {
    var uses = [];
    var known = globalNumbers(ast);
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 6.4)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = {
      connections: (ctx && ctx.connections) || [],
      source: source,
      world: (ctx && ctx.world) || null
    };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode =
          mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    /* loop() 끝에 쉬는 시간이 없으면 시리얼 모니터가 글자로 뒤덮인다 */
    if (ast.functions.loop && allCalls(ast, "delay").length === 0) {
      warnings.push({
        line: ast.functions.loop.line,
        message:
          "loop() 안에 delay() 가 없습니다. 잘못은 아니지만 1초에 수천 번 재게 되어 " +
          "시리얼 모니터를 읽을 수 없습니다. 끝에 delay(" + LOOP_DELAY_MS + "); 을 두면 편합니다."
      });
    }

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 확장 활동 검사 (5단계 «주차 경고 장치» — 명세 6.5 마지막 줄)             */
  /*                                                                    */
  /* ★ 4단계의 TESTS 를 그대로 쓸 수 «없다».                              */
  /*   그쪽은 마지막 항목에서 «회로에 이은 핀» 과 맞대어 보는데,             */
  /*   경고용 LED 는 이번 차시의 «필수» 회로에 없다(명세 6.5 마지막 줄).      */
  /*   그래서 여기서는 «짜임새가 맞는가» 와 «실제로 켜지고 꺼지는가» 만 본다. */
  /* ------------------------------------------------------------------ */

    /**
     * 학생이 적은 «기준 거리» 를 꺼낸다. 못 찾으면 null.
     *
     * ★ 화면이 돌려 볼 거리를 이 값의 «양쪽» 으로 짜기 위해 필요하다.
     *   기준을 30 으로 적은 학생에게 20 을 기준으로 짠 길을 보여 주면
     *   LED 가 내내 켜져 있어 «꺼지는 것» 을 볼 수 없다.
     *
     * ★ 이름으로 적은 것(const int limit = 25;)도 찾아낸다 —
     *   globalNumbers 가 전역 숫자 선언을 모아 두기 때문이다.
     */
    function warnThresholdOf(ast) {
      var found = findFormula(ast);
      var name = found.distanceName;
      var known = globalNumbers(ast);
      var out = null;
      flatStatements(ast).forEach(function (stmt) {
        if (out !== null || stmt.kind !== "if") return;
        var cond = stmt.cond;
        if (!cond || cond.kind !== "binary") return;
        if (["<", "<=", ">", ">="].indexOf(cond.op) === -1) return;
        if (name && !usesVariable(cond, name)) return;
        /* 거리가 아닌 «쪽» 이 기준값이다 */
        [cond.left, cond.right].forEach(function (side) {
          if (out !== null || !side) return;
          if (side.kind === "number") out = Number(side.value);
          else if (side.kind === "ident" && known[side.name] !== undefined) out = Number(known[side.name]);
        });
      });
      return out === null || !isFinite(out) ? null : out;
    }

  /** 경고 LED 로 쓰는 핀 — Trig·Echo 가 아닌 나머지 하나 */
  function warnPinOf(ast) {
    var known = globalNumbers(ast);
    var info = codePins(ast);
    var found = null;
    Object.keys(known).forEach(function (name) {
      if (found !== null) return;
      var v = known[name];
      if (typeof v !== "number") return;
      if (String(v) === String(info.trigPin) || String(v) === String(info.echoPin)) return;
      if (v < 0 || v > 13) return;
      found = { name: name, pin: v };
    });
    return found;
  }

  var WARN_TESTS = [
    {
      id: "w-pin",
      label: "경고 LED 를 이을 핀에 이름을 붙였다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) {
          return {
            ok: false,
            message:
              "LED 를 이을 핀을 정하지 않았습니다. Trig·Echo 가 아닌 다른 디지털 핀을 하나 골라 " +
              "const int ledPin = 9; 처럼 이름을 붙여 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "w-mode",
      label: "그 핀을 pinMode(…, OUTPUT) 으로 정했다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };
        var known = globalNumbers(ast);
        var mode = null;
        allCalls(ast, "pinMode").forEach(function (c) {
          var pin = resolvePin((c.args || [])[0], known);
          if (pin === null || String(pin) !== String(w.pin)) return;
          var m = (c.args || [])[1];
          if (m && m.kind === "constant") mode = m.name;
        });
        if (mode === null) {
          return { ok: false, message: "pinMode(" + w.name + ", OUTPUT); 을 setup() 에 적어 주세요." };
        }
        if (mode !== "OUTPUT") {
          return { ok: false, message: "LED 는 아두이노가 «켜는» 것이므로 " + mode + " 이 아니라 OUTPUT 입니다." };
        }
        return { ok: true };
      }
    },
    {
      id: "w-measure",
      label: "거리를 재는 부분이 그대로 남아 있다",
      run: function (ast) {
        if (allCalls(ast, "pulseIn").length === 0) {
          return { ok: false, message: "pulseIn 이 없어졌습니다. 거리를 재지 못하면 경고할 기준도 없습니다." };
        }
        var found = findFormula(ast);
        if (!found.formula) {
          return { ok: false, message: "거리를 구하는 줄이 없습니다. 4단계에서 만든 두 줄을 그대로 두세요." };
        }
        var vars = {};
        vars[found.durationName] = 1000;
        var got = evalConst(found.formula, vars);
        var want = (1000 * SOUND_SPEED) / 2;
        if (got === null || Math.abs(got - want) > 0.05) {
          return { ok: false, message: "거리 식이 4단계에서 통과한 식과 다릅니다. 왕복이므로 2 로 나눕니다." };
        }
        return { ok: true };
      }
    },
    {
      id: "w-if",
      label: "if 문으로 거리를 기준값과 견준다",
      run: function (ast) {
        var found = findFormula(ast);
        var name = found.distanceName;
        var hit = null;
        flatStatements(ast).forEach(function (stmt) {
          if (hit || stmt.kind !== "if") return;
          if (name && !usesVariable(stmt.cond, name)) return;
          hit = stmt;
        });
        if (!hit) {
          return {
            ok: false,
            message:
              "if 문이 없습니다. if (" + (name || "distance") + " < " + WARN_DISTANCE +
              ") { … } 처럼 «가까운가» 를 물어야 합니다."
          };
        }
        var cond = hit.cond;
        var okShape = cond && cond.kind === "binary" && ["<", "<=", ">", ">="].indexOf(cond.op) !== -1;
        if (!okShape) {
          return { ok: false, message: "거리를 «크다/작다» 로 견주어야 합니다. 예) " + (name || "distance") + " < " + WARN_DISTANCE };
        }
        return { ok: true };
      }
    },
    {
      id: "w-onoff",
      label: "가까우면 켜고 멀면 끈다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };
        var known = globalNumbers(ast);
        var onCount = 0;
        var offCount = 0;
        allCalls(ast, "digitalWrite").forEach(function (c) {
          var pin = resolvePin((c.args || [])[0], known);
          if (pin === null || String(pin) !== String(w.pin)) return;
          if (isHighArg((c.args || [])[1])) onCount += 1;
          else offCount += 1;
        });
        if (onCount === 0) {
          return { ok: false, message: "LED 를 켜는 줄이 없습니다. digitalWrite(" + w.name + ", HIGH); 를 적어 주세요." };
        }
        if (offCount === 0) {
          return {
            ok: false,
            message:
              "LED 를 끄는 줄이 없습니다. 켜기만 하면 한 번 가까워진 뒤로는 영원히 켜져 있습니다. " +
              "else 쪽에 digitalWrite(" + w.name + ", LOW); 를 적어 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "w-run",
      label: "★ 돌려 보니 가까울 때 켜지고 멀 때 꺼진다",
      run: function (ast, ctx) {
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };

        function ledAt(distance) {
          var r = run(source, { loopLimit: 1, world: worldFromCode(ast, { distance: distance }) });
          if (r.error) return { err: r.error.message };
          return { on: r.pins.values[w.pin] === 1 };
        }

        var near = ledAt(Math.max(DIST_MIN, WARN_DISTANCE - 10));
        if (near.err) return { ok: false, message: near.err };
        var far = ledAt(WARN_DISTANCE + 10);
        if (far.err) return { ok: false, message: far.err };

        if (!near.on && far.on) {
          return {
            ok: false,
            message:
              "거꾸로 되어 있습니다 — 멀 때 켜지고 가까울 때 꺼집니다. " +
              "부딪히기 전에 알려야 하니 «작다(<)» 로 견주어야 합니다."
          };
        }
        if (!near.on) {
          return {
            ok: false,
            message:
              (WARN_DISTANCE - 10) + "cm 앞에 물체를 두고 돌려 보았는데 LED 가 켜지지 않았습니다. " +
              "기준값과 부호를 다시 보세요."
          };
        }
        if (far.on) {
          return {
            ok: false,
            message:
              (WARN_DISTANCE + 10) + "cm 앞에서도 LED 가 켜져 있습니다. 멀어졌을 때 끄는 줄(else)이 " +
              "제대로 동작하는지 보세요."
          };
        }
        return { ok: true };
      }
    }
  ];

  /**
   * 확장 활동 코드를 살펴본다. validate() 와 돌려주는 모양이 같다.
   *   { ok, parsed, error, tests: [{id,label,ok,message}], passed }
   */
  function validateWarning(source) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        tests: WARN_TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0
      };
    }
    var ast = parsed.ast;
    var results = WARN_TESTS.map(function (t) {
      var r = t.run(ast, { source: source });
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;
    return {
      ok: passed === results.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 물체와 반사 — 되돌아오는 신호의 세기 (명세 6.5 네 번째 줄)            */
  /* ------------------------------------------------------------------ */

  /**
   * 되돌아온 신호의 세기(0~1).
   *
   *   각도 손실 × 재질 손실 × 거리에 따른 감쇠
   *
   * 이 값이 ECHO_FAIL_LEVEL 아래로 내려가면 «측정 실패» 다.
   * 실제 물리량이 아니라 «약해지는 정도를 견주기 위한 눈금» 이다(constants.js 참고).
   */
  function echoLevel(distanceCm, angleId, materialId) {
    var a = PC.angleOf ? PC.angleOf(angleId) : { loss: 0 };
    var m = PC.materialOf ? PC.materialOf(materialId) : { loss: 0 };
    var far = Math.max(0, 1 - 0.45 * (Number(distanceCm) / DIST_MAX));
    return (1 - (a.loss || 0)) * (1 - (m.loss || 0)) * far;
  }

  /** 글자를 숫자로 (씨앗을 만들 때 쓴다) */
  function hashText(text) {
    var h = 0;
    var s = String(text || "");
    for (var i = 0; i < s.length; i += 1) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h;
  }

  /**
   * 씨앗 하나로 늘 같은 값을 내놓는 난수 (명세 6.5 «재현 가능한 seed 기반»).
   *
   * ★ Math.random() 을 쓰지 않는 까닭
   *   같은 조건으로 다시 재면 같은 값이 나와야 학생이 «무엇 때문에 달라졌는지» 를 말할 수 있다.
   *   무작위면 조건을 바꾸지 않아도 값이 흔들려 관찰이 성립하지 않는다.
   */
  function seededUnit(seed) {
    var t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /** 이 조건에서 생기는 오차(cm). 늘 같은 씨앗이면 늘 같은 값이다. */
  function noiseFor(distanceCm, angleId, materialId, trial, seed) {
    var a = PC.angleOf ? PC.angleOf(angleId) : { jitter: 0 };
    var m = PC.materialOf ? PC.materialOf(materialId) : { jitter: 0 };
    var jitter = (a.jitter || 0) + (m.jitter || 0);
    if (jitter === 0) return 0;
    var key =
      Math.round(Number(distanceCm) * 10) * 7919 +
      (trial | 0) * 104729 +
      (Number(seed) || 0) * 15485863 +
      hashText(angleId) * 31 +
      hashText(materialId) * 17;
    var r = seededUnit(key) * 2 - 1;
    var scale = 0.5 + 0.5 * Math.min(1, Number(distanceCm) / 100);
    return Math.round(jitter * r * scale * 100) / 100;
  }

  /* ------------------------------------------------------------------ */
  /* 5. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.world     : 센서가 놓인 «상황» — 아래 표
   *
   *   world.trigPin  회로에서 Trig 가 달린 핀 번호
   *   world.echoPin  회로에서 Echo 가 달린 핀 번호
   *   world.powered  센서에 전원이 들어왔는가
   *   world.distance 물체까지의 실제 거리(cm)
   *   world.angle    'front' | 'tilt'
   *   world.material 'board' | 'cloth' | 'rough'
   *   world.seed     오차를 만드는 씨앗 (같으면 같은 값이 나온다)
   *
   * 돌려주는 것 : { ok, trace, console, pins, sensor, elapsed, stopped, error }
   *   sensor.pulses   [{ pin, t, us }]      — Trig 에 만들어진 펄스
   *   sensor.measures [{ t, duration, ok, reason, text, … }] — pulseIn 이 읽은 것
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: { modes: {}, values: {} },
        sensor: { pulses: [], measures: [], reads: 0, ok: false },
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var world = o.world || {};
    var wTrig = world.trigPin === undefined ? TRIG_PIN : world.trigPin;
    var wEcho = world.echoPin === undefined ? ECHO_PIN : world.echoPin;
    var wPowered = world.powered === false ? false : true;
    /**
     * ★★ world.distance 는 숫자 하나이거나 «바퀴마다의 배열» 이다.
     *
     *   배열을 주면 loop() 한 바퀴마다 다음 값을 쓴다 — 물체가 다가오다
     *   멀어지는 것을 한 번의 실행으로 보여 줄 수 있다(확장 활동이 이것을 쓴다).
     *   배열이 바퀴 수보다 짧으면 마지막 값을 그대로 이어 쓴다.
     *
     * ★ 숫자 하나를 주던 곳은 그대로 돌아간다 — 배열이 아닐 때는 예전과 같다.
     */
    var wDistanceList = Array.isArray(world.distance)
      ? world.distance.map(Number).filter(function (v) {
          return isFinite(v);
        })
      : null;
    var wDistanceOne =
      world.distance === undefined || wDistanceList
        ? PC.DIST_DEFAULT === undefined
          ? 20
          : PC.DIST_DEFAULT
        : Number(world.distance);

    /** 지금 바퀴에서 물체가 놓인 거리(cm) */
    function distanceNow() {
      if (!wDistanceList || wDistanceList.length === 0) return wDistanceOne;
      var i = Math.max(0, (state.iteration || 1) - 1);
      return wDistanceList[Math.min(i, wDistanceList.length - 1)];
    }
    var wAngle = world.angle || PC.DEFAULT_ANGLE || "front";
    var wMaterial = world.material || PC.DEFAULT_MATERIAL || "board";
    var wSeed = world.seed === undefined ? 1 : world.seed;

    function pinLabel(n) {
      return /^A\d$/.test(String(n)) ? String(n) : "D" + n;
    }

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      /** 배열은 변수와 따로 담는다 — notes[i] 처럼 대괄호로만 읽는다 */
      arrays: {},
      pinModes: {},
      pinValues: {},
      /** HIGH 로 올라간 시각(ms). LOW 로 내려올 때 펄스 길이를 잰다. */
      highSince: {},
      pulses: [],
      measures: [],
      trial: 0,
      lastMeasureT: 0,
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration
      });
    }

    /**
     * 시간을 흘려보낸다.
     *
     * 3차시에서는 여기서 «소리가 멎을 시각» 을 지나며 더해야 했지만
     * 이 차시에는 스스로 끝나는 것이 없다 — 펄스도 pulseIn 도 «명령으로» 끝난다.
     * 그래서 그냥 더한다. state.t 의 단위는 ms 이고 소수점을 허용한다(μs 를 담기 위해).
     */
    function advanceTime(ms) {
      state.t += Math.max(0, Number(ms) || 0);
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    /* ---------------------------------------------------------------- */
    /* ★★ 한 번의 «재기» — 이 차시의 알맹이                              */
    /* ---------------------------------------------------------------- */

    /**
     * pulseIn 이 불릴 때 실제로 일어나는 일을 흉내 낸다.
     *
     * 관문을 «차례대로» 지난다. 앞의 관문에서 걸리면 뒤는 보지 않는다 —
     * 원인이 여러 개로 보이면 학생이 어디를 고쳐야 할지 알 수 없다.
     *
     *   ① 전원      센서가 켜져 있는가
     *   ② Trig      펄스가 «제 핀» 으로, «OUTPUT» 으로, «10μs 이상» 나갔는가
     *   ③ Echo      «제 핀» 에서, «INPUT» 으로, «HIGH» 를 재고 있는가
     *   ④ 물체      측정 범위 안인가, 되돌아온 신호가 셀 만한가
     */
    function measure(readPin, wantHigh, line) {
      state.trial += 1;
      /* ★ 거리는 «이 바퀴» 의 것이다. 배열을 주면 바퀴마다 달라진다. */
      var dNow = distanceNow();
      var rec = {
        t: state.t,
        trial: state.trial,
        line: line,
        iteration: state.iteration,
        /** 물체가 실제로 놓인 거리(cm) — 학생이 화면에서 정한 값 */
        target: dNow,
        angle: wAngle,
        material: wMaterial,
        /** 실제로 만들어진 Trig 펄스의 길이(μs) */
        pulseUs: 0,
        /** pulseIn 이 돌려준 값(μs). 실패면 0 이다(실물과 같다). */
        duration: 0,
        /** 되돌아온 신호의 세기(0~1) */
        level: 0,
        /** 오차(cm) — 되돌아온 신호가 흔들린 만큼 */
        noise: 0,
        ok: false,
        reason: "",
        text: ""
      };

      function done(reason, text) {
        rec.reason = reason;
        rec.text = text;
        state.measures.push(rec);
        state.lastMeasureT = state.t;
        return rec;
      }

      /* ① 전원 */
      if (!wPowered) {
        return done(
          "no-power",
          "센서에 전원이 들어오지 않았습니다 — 회로의 VCC(5V) 와 GND 를 먼저 확인하세요."
        );
      }

      /* ② Trig — 펄스 발사 */
      var since = state.lastMeasureT;
      var fresh = state.pulses.filter(function (p) {
        return p.t >= since;
      });
      var mine = fresh.filter(function (p) {
        return String(p.pin) === String(wTrig);
      });

      if (mine.length === 0) {
        if (fresh.length > 0) {
          return done(
            "trig-pin",
            "펄스 발사 실패 — " + pinLabel(fresh[0].pin) + " 로 펄스를 보냈지만 센서 Trig 는 " +
              pinLabel(wTrig) + " 에 달려 있습니다."
          );
        }
        return done(
          "trig-missing",
          "펄스 발사 실패 — Trig 에 HIGH 펄스를 보내지 않았습니다. 재기 전에 " +
            pinLabel(wTrig) + " 를 HIGH 로 올렸다가 LOW 로 내려야 합니다."
        );
      }

      var pulse = mine[mine.length - 1];
      rec.pulseUs = pulse.us;

      if (state.pinModes[wTrig] !== "OUTPUT") {
        return done(
          "trig-mode",
          "펄스 발사 실패 — " + pinLabel(wTrig) + " 을 pinMode(…, OUTPUT) 으로 정하지 않아 " +
            "digitalWrite 가 실제로 전압을 내보내지 못합니다."
        );
      }
      if (pulse.us < TRIG_PULSE_US) {
        return done(
          "trig-short",
          "펄스 발사 실패 — 펄스가 " + pulse.us + "μs 뿐입니다. HC-SR04 는 " + TRIG_PULSE_US +
            "μs 이상이어야 «쏘라» 는 명령으로 알아챕니다."
        );
      }

      /* ③ Echo — 시간 읽기 */
      if (String(readPin) !== String(wEcho)) {
        return done(
          "echo-pin",
          "반사 시간 읽기 실패 — " + pinLabel(readPin) + " 에서 읽었지만 센서 Echo 는 " +
            pinLabel(wEcho) + " 에 달려 있습니다."
        );
      }
      var em = state.pinModes[wEcho];
      if (em !== "INPUT" && em !== "INPUT_PULLUP") {
        return done(
          "echo-mode",
          "반사 시간 읽기 실패 — " + pinLabel(wEcho) + " 을 pinMode(…, INPUT) 으로 정하지 않았습니다."
        );
      }
      if (!wantHigh) {
        return done(
          "echo-level",
          "반사 시간 읽기 실패 — Echo 는 초음파가 돌아오는 «동안» HIGH 로 있습니다. " +
            "pulseIn 의 두 번째 값을 HIGH 로 두세요."
        );
      }

      /* ④ 물체 */
      if (dNow < DIST_MIN) {
        return done(
          "too-close",
          "측정 실패 — 물체가 " + dNow + "cm 로 너무 가깝습니다. " + DIST_MIN +
            "cm 보다 가까우면 되돌아온 소리가 보낸 소리와 겹쳐 셀 수 없습니다."
        );
      }
      if (dNow > DIST_MAX) {
        return done(
          "too-far",
          "측정 실패 — 물체가 " + dNow + "cm 로 너무 멉니다. " + DIST_MAX +
            "cm 를 넘으면 되돌아오는 소리가 너무 약해집니다."
        );
      }

      var level = echoLevel(dNow, wAngle, wMaterial);
      rec.level = Math.round(level * 100) / 100;
      if (level < ECHO_FAIL_LEVEL) {
        var a = PC.angleOf ? PC.angleOf(wAngle) : { label: wAngle };
        var m = PC.materialOf ? PC.materialOf(wMaterial) : { label: wMaterial };
        return done(
          "weak",
          "측정 실패 — 되돌아온 신호가 너무 약합니다(" + Math.round(level * 100) + "%). " +
            m.label + " · " + a.label + " 조합에서는 소리가 흩어지거나 흡수됩니다. " +
            "pulseIn 은 기다리다 포기하고 0 을 돌려줍니다."
        );
      }

      /* ⑤ 성공 — 여기서만 시간이 만들어진다 */
      var noise = noiseFor(dNow, wAngle, wMaterial, state.trial, wSeed);
      rec.noise = noise;
      var seen = Math.max(DIST_MIN, dNow + noise);
      rec.duration = Math.round((2 * seen) / SOUND_SPEED);
      rec.ok = true;
      return done(
        "ok",
        "왕복 시간 " + rec.duration + "μs — " + dNow + "cm 에 놓인 물체까지 갔다가 돌아온 시간입니다."
      );
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "index": {
          var arr = state.arrays[node.name];
          if (!arr) {
            throw new StopRun("배열 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
          }
          var at = Math.floor(Number(evaluate(node.index)));
          if (!(at >= 0 && at < arr.length)) {
            throw new StopRun(
              node.name + " 에는 값이 " + arr.length + "개뿐인데 " + at + "번째를 읽으려 했습니다. " +

    reportedFor: reportedFor,

   * 다섯 문항을 모두 풀지 않았으면 «해설 없이» 돌려준다(명세 9.1).

  /* ================================================================== */
  /* 6. 5번 문항 도우미 — 정답을 알려 주지 않는 «문법만» 안내               */
  /* ================================================================== */

   * 채점 전에 줄 수 있는 도움은 «문법» 까지다. 무엇을 적어야 하는지는 말하지 않는다.

    var open = (text.match(/\(/g) || []).length;
    var close = (text.match(/\)/g) || []).length;
    if (open !== close) {
      notes.push({ level: "warn", message: "괄호 ( ) 의 짝이 맞지 않습니다. 여는 괄호 " + open + "개, 닫는 괄호 " + close + "개." });

      notes.push({ level: "warn", message: '큰따옴표(") 의 짝이 맞지 않습니다.' });

  var PC = root.PC || (root.PC = {});

    SALT: SALT,
    SEALED: SEALED,
    /* 암호 도구 — seal 도구와 테스트가 같은 함수를 쓴다 */
    sha256: sha256,

    unlock: unlock,
    toBase64: toBase64,
    fromBase64: fromBase64,

    canonicalCode: canonicalCode,
    canonicalAnswer: canonicalAnswer,

            "[조건을 바꾸어 보고 알게 된 것] 을 " +
              (LIMITS.observationMin || 10) +
              "자 이상 적어 주세요."
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );

      }

      default:

    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건을 충족한 경우만 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 7장)                                           */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.3) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /** 회로 판정 결과를 제출용으로 — 교사 화면이 이것 하나로 «무엇이 어떻게 틀렸나» 를 읽는다 */
  function cleanWiring(w) {

    return {
      vccOk: w.vccOk === true,
      gndOk: w.gndOk === true,
      trigOk: w.trigOk === true,
      echoOk: w.echoOk === true,
      /* 실제로 이어진 신호 핀 이름 — 「코드 D8, 회로 D6」 같은 진단의 바탕 */
      trigWired: Array.isArray(w.trigWired) ? w.trigWired.slice(0, 4).map(text) : [],
      echoWired: Array.isArray(w.echoWired) ? w.echoWired.slice(0, 4).map(text) : [],
      powerReversed: w.powerReversed === true,
      signalSwapped: w.signalSwapped === true,
      signalOnPower: w.signalOnPower === true,
      shortCircuit: w.shortCircuit === true,
      legsShorted: Array.isArray(w.legsShorted) ? w.legsShorted.length : 0
    };
  }

  /**

   *
   * 명세 7장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.

  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var code = s.code || {};
    var experiment = s.experiment || {};

      schemaVersion: SCHEMA_VERSION,

      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,

      /* ── 3단계 — 회로 (명세 7장) ─────────────────────────────────── */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: num(circuit.attempts),
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {

        dangerEvents: (circuit.dangerEvents || []).slice(0, 50).map(function (e) {

        wiring: cleanWiring(circuit.wiring)

      code: {

        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        /** ★ 명세 7장 — 문법 오류와 핀 불일치를 한 배열에 모은다 */

        echoMode: text(code.echoMode)

      experiment: {

         * 명세 7장의 conditions 하나로 «거리 재기» 와 «조건 바꾸기» 를 함께 담는다.
         * kind 로 갈라 놓으므로 교사 화면이 둘을 따로 볼 수 있다.
         */
        conditions: measures
          .filter(function (item) {
            return runs[item.id];
          })
          .map(function (item) {
            var r = runs[item.id] || {};

              id: item.id,
              label: clip(item.label, 60),

              distance: num(item.distance),

              /* 시뮬레이터가 돌려준 왕복 시간과 학생 코드가 계산한 거리 */
              duration: num(r.duration),
              measured: round2(r.measured),
              error: round2(r.error),

          .concat(

              .filter(function (item) {

              })
              .map(function (item) {
                var r = trials[item.id] || {};
                return {
                  kind: "condition",
                  id: item.id,
                  label: clip(item.label, 60),
                  distance: num(r.distance) || num(item.distance),
                  angle: text(item.angle),
                  material: text(item.material),
                  ran: r.ran === true,
                  duration: num(r.duration),
                  measured: round2(r.measured),
                  error: round2(r.error),
                  ok: r.ok === true,
                  reason: text(r.reason)

          ),

          .filter(function (item) {
            return runs[item.id];
          })
          .map(function (item) {

            return {

              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax)

         * ★ 이번 차시의 «필수» 회로에 LED 를 넣지 않으므로 통과 조건이 아니다.
         */
        extension: {
          tried: experiment.extensionTried === true,
          /* 학생이 적은 «조건» 과 «필요한 부품» */
          condition: clip(experiment.extensionCondition, LIMITS.textMax),
          parts: clip(experiment.extensionParts, LIMITS.textMax),
          threshold: num(experiment.extensionThreshold),
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          testsPassed: num(experiment.extensionPassed),
          testsTotal: num(experiment.extensionTotal)
        }
      },

      /* ── 6단계 — 형성평가 (명세 7장) ─────────────────────────────── */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: num(assessment.attempts) || 1

  }

  /**

   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
