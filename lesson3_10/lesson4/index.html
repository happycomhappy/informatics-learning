<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="초음파 센서로 거리 측정하기 · 제출 현황 분석 (교사용)" />
    <title>제출 현황 분석 | 초음파 센서로 거리 측정하기</title>

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  /* 어두운 코드 칸 옆에 적는 «줄 설명» 의 글자색.
     ★ 주석색(--tok-comment) 보다 밝게 둔다 — 주석이 아니라
       읽혀야 하는 설명이기 때문이다. #1e293b 바탕에서 대비 7:1 을 넘는다. */
  --code-note: #b8c5d6;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 13장). 몸통의 ＋ 표시와 단자 이름표 글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  /* ── 초음파 센서 HC-SR04 (이 차시) ───────────────────────────
     ★ 상태를 «색으로만» 알리지 않는다(명세 11장). 아래 색들은 늘
       측정됨/실패 글자와 μs·cm 숫자와 «함께» 쓴다.

     실물은 «푸른 기판 + 은색 원통 두 개 + 가운데 수정 진동자» 다. */
  --sonic-pcb: #1e5aa8;
  --sonic-pcb-edge: #14407a;
  --sonic-horn: #c8cdd4;      /* 원통 겉면 (알루미늄) */
  --sonic-horn-edge: #7a828c;
  --sonic-mesh: #8d949d;      /* 원통 안쪽 그물 */
  --sonic-horn-text: #1f2937; /* 원통에 적힌 T · R */
  --sonic-crystal: #2f343b;   /* 수정 진동자 */
  --sonic-crystal-edge: #14171b;
  --sonic-pad: #d8b26a;       /* 다리 끝의 금도금 자리 */
  --sonic-pad-edge: #a8853f;

  /* 초음파가 나가고 돌아오는 길 — 나가는 쪽과 돌아오는 쪽을 갈라 둔다 */
  --wave-out: #2563eb;
  --wave-back: #0f766e;
  --wave-weak: #b9c3cf;
  --wave-glow: rgba(37, 99, 235, 0.28);

  /* 물체의 재질 — 색만으로 알리지 않고 이름표를 늘 함께 적는다 */
  --target-board: #7c6142;    /* 단단한 판 (나무빛) */
  --target-board-edge: #4f3d29;
  --target-cloth: #b5739c;    /* 천 */
  --target-cloth-edge: #8a4d73;
  --target-rough: #8a8f97;    /* 울퉁불퉁 */
  --target-rough-edge: #5b6069;

  /* 시간표 — 펄스 · 기다림 · 실패 · 쉼 */
  --timeline-pulse: #f59e0b;
  --timeline-read: #2563eb;
  --timeline-fail: #dc2626;
  --timeline-wait: #cbd5e1;

  /* 신호선 네 갈래 (케이블 색) — 판정에는 쓰지 않는다(명세 6.3) */
  --lane-power: #d63b2f;
  --lane-ground: #1d4ed8;
  /* ★★ Trig 색은 «두 곳» 에 있다 — 같이 고친다.
       여기(센서 다리 색) · s40-board.js 의 WIRE_COLORS.yellow (케이블 색)
     주황(#ea580c) → 분홍(#db2777) → 노랑 순으로 두 번 바뀌었다.
     앞의 둘은 전원의 빨강과 닮아서 넷을 한자리에 놓고 보면
     갈라보기 어려웠다(지적 2026-08-22). */
  --lane-trig: #e3a008;
  --lane-echo: #15803d;

  /* ── 확장 활동(주차 경고 장치)의 LED ────────────────────────────
     ★ 이 차시의 «필수» 회로에는 LED 가 없다(명세 6.5). 설명 그림에만 쓴다.
     ★ --color-false(#d97706) 를 빌려 쓰지 않는다 — 그 이름은 «틀림» 을
       뜻하므로, LED 에 쓰면 다음에 고치는 사람이 뜻을 잘못 읽는다. */
  --led-on: #d97706;
  --led-on-edge: #8a5f06;
  --led-soft: #fdf1d5;
  --led-uno: #17202b;

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;
  /* 본문(16)과 h2(24) 사이 — 카드 제목·큰 숫자에 쓴다.
     ★ 두 이름 모두 «부르는 곳이 있는데 정해져 있지 않아» 조용히 무시되던 것이다.
       var(--없는이름) 은 오류를 내지 않으므로 눈으로는 찾기 어렵다. */
  --fs-h3: 19px;
  --fs-lead: 18px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);

/* ★★ min-width: 0 이 없으면 긴 이름(pulseIn(echoPin, HIGH)) 의 min-content 가

 *   설명(.cond__detail)을 .cond__body 가 아니라 .cond 에 붙여서 설명이

/* ------------------------------ 코드 ------------------------------ */

.codeblock {

/* ★★ 줄마다의 설명을 «옆» 에 둔다 (codeview--annotated).
 *
 * 코드는 고정폭 가나리글, 설명은 읽는 글이다 — 둘의 구실이 다리므로
 * 글자체·크기·가로쓰기를 갈라 둔다.
 *
 * ★ minmax(0, …) 가 반드시 필요하다. 그러지 않으면 긴 설명이 칸을
 *   밀어내 .codeview__lines 에 가로 스크롤이 생긴다.
 *
 * ★ .codeline 은 white-space: pre 다(들여쓰기를 살리려고).

 * ---------------------------------------------------------------- */
.codeview--annotated .codeline {
  display: grid;
  /* ★★ 코드 칸의 폭 — 가장 긴 줄이 들어갈 만큼 넓어야 한다.

   *   .codeline 은 white-space: pre 라 줄바꿈이 되지 않는다. 그래서 칸보다
   *   긴 줄은 칸을 뚫고 나가 «설명 위에 겹쳐» 그려진다. 34ch 로 두었을 때
   *   기준 프로그램의 17·18번 줄(41·42자)이 그렇게 겹쳤다(지적 2026-08-22).
   *
   * ★ max-content 로는 안 된다. .codeline 하나하나가 «저마다 다른 격자» 라
   *   줄마다 칸 폭이 달라지고, 설명 왼끝이 줄마다 들쭉날쭉해진다.
   *   (모든 줄이 한 격자를 쓰게 하려면 display: contents 를 써야 하는데,
   *    그러면 .codeline--active 의 배경과 ▶ 표시 자리가 함께 사라진다.)
   *
   * ★ 그래서 «가장 긴 줄에 맞춘 고정 폭» 이다. 손으로 적은 숫자이므로
   *   `dist.test.js` 의 「★★ 코드 칸이 가장 긴 줄보다 넓다」 가 기준 프로그램의
   *   실제 글자 수와 맞대어 본다 — 프로그램이 길어지면 검사가 먼저 알려 준다.
   *
   * ★ 설명 칸만 minmax(0, 1fr) 로 둔다. max-content 로 두면 긴 설명이
   *   칸을 밀어내 .codeview__lines 에 가로 스크롤이 생긴다.
   */
  grid-template-columns: 2ch 44ch minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
  padding-top: 2px;
  padding-bottom: 2px;
}

.codeline__note {

  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.65;

 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 10장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다. */
    autosaveKeyPrefix: "physical4-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 */
    loopLimit: 12,
    stepLimit: 20000,
    playSpeeds: [1, 4, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;
    return /^https?:\/\/.+/i.test(url);
  }

  /** 설정 파일에 미리 적어 둔 주소 (없으면 빈 문자열) */
  function fixedUrl() {
    return looksLikeUrl(APP_CONFIG.apiUrl) ? String(APP_CONFIG.apiUrl).trim() : "";
  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

  /** 학생 화면에 «제출 주소» 칸을 보여야 하는가? */
  function needsUrlInput() {
    return !isDemo() && !fixedUrl();
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.CONFIG = APP_CONFIG;
  PC.config = {
    looksLikeUrl: looksLikeUrl,
    fixedUrl: fixedUrl,
    isDemo: isDemo,
    needsUrlInput: needsUrlInput
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { APP_CONFIG: APP_CONFIG, isDemo: isDemo, fixedUrl: fixedUrl };
  }
})();

  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.3 «전원 켜기를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 6.3)                              */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리 모두 맞기 때문이다.
   *
   * ★ 넷 가운데 둘을 «센서 쪽» 으로 둔 까닭
   *   이 차시에서 가장 잘 헷갈리는 것이 «Trig 가 보내고 Echo 가 받는다» 다(명세 10장 오개념 1).
   *   우노 핀만 찾게 하면 그 구실을 짚을 자리가 없다.
   */
  var FIND_TASKS = [
    {
      id: "f-5v",
      prompt: "센서에 전기를 줄 «5V» 핀을 찾아 누르세요.",
      accept: [{ component: "uno", pin: "5V" }],
      why:
        "HC-SR04 는 5V 로 움직인다. 3V3 에 꽂으면 초음파를 낼 힘이 모자라 " +
        "가까운 거리도 놓칠 수 있다."
    },
    {
      id: "f-gnd",
      prompt: "전류가 돌아올 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",
      accept: [
        { component: "uno", pin: "GND0" },
        { component: "uno", pin: "GND1" },
        { component: "uno", pin: "GND2" }
      ],
      why: "GND 는 전기가 «없는» 핀이 아니라 전류가 돌아오는 길이자 전압을 재는 기준이다."
    },
    {
      id: "f-trig",
      prompt: "센서에서 «초음파를 쏘라» 는 명령을 받는 단자를 찾아 누르세요.",
      accept: [{ component: "sonic", pin: "TRIG" }],
      why:
        "Trig 다. 아두이노가 이 단자에 10μs 동안 HIGH 를 보내면 센서가 초음파를 내보낸다. " +
        "아두이노 쪽에서 보면 «내보내는» 핀이므로 pinMode 는 OUTPUT 이다."
    },
    {
      id: "f-echo",
      prompt: "되돌아온 초음파의 «시간» 을 알려 주는 단자를 찾아 누르세요.",
      accept: [{ component: "sonic", pin: "ECHO" }],
      why:
        "Echo 다. 초음파가 갔다가 돌아오는 동안 이 단자가 HIGH 로 있는다. " +
        "아두이노는 그 «길이» 를 읽으므로 pinMode 는 INPUT 이다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    supply: "센서 전원 단자",
    trigger: "센서 Trig 단자",
    echo: "센서 Echo 단자",
    sink: "센서 접지 단자",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.3 여덟 번째 줄) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·보내는 신호·받는 신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — 네 단자 결선 판정 (명세 6.3)                             */
  /* ------------------------------------------------------------------ */

  /** 전원 계열 마디 — 신호 단자를 여기에 물리면 위험이다 */
  var POWER_NODES = ["uno:5V", "uno:3V3", "uno:VIN"];

  /**
   * 센서 단자 하나가 «닿아 있는 우노 핀 이름» 을 모두 모은다.
   *
   * ★ 이름으로 모으는 까닭 : GND0·GND1·GND2 는 보드 안에서 이미 한 마디이므로
   *   셋을 따로 세면 «GND 세 개에 이었다» 는 엉뚱한 말이 된다. 이름은 모두 "GND" 다.
   */
  function unoNamesAt(net, sensorPin) {
    var node = net.find("sonic:" + sensorPin);
    var out = [];
    UNO.pins.forEach(function (p) {
      if (net.find(nodeOf("uno", p.id)) !== node) return;
      if (out.indexOf(p.label) === -1) out.push(p.label);
    });
    return out;
  }

  /**
   * 회로를 전기적으로 읽어 낸다.
   *
   * ★ 단자마다 «따로» 본다.
   *   Trig 만 빠뜨린 학생에게 «전원도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
   */
  function analyze(connections) {
    var net = solve(connections);

    /* ① 단자마다 닿은 우노 핀 이름 */
    var at = {};
    SENSOR_PINS.forEach(function (id) {
      at[id] = unoNamesAt(net, id);
    });

    function reaches(sensorPin, unoName) {
      return at[sensorPin].indexOf(unoName) !== -1;
    }

    /* ② 네 줄이 저마다 이어졌는가 */
    var vccOk = reaches("VCC", PINS.vcc);
    var gndOk = reaches("GND", PINS.gnd);
    var trigOk = reaches("TRIG", PINS.trig);
    var echoOk = reaches("ECHO", PINS.echo);

    /* ③ 대표 오류 — 원인이 «하나» 인 것들 */
    /* VCC↔GND 역결선 : VCC 를 GND 에, GND 를 5V 에 꽂았다 (명세 6.3 여섯 번째 줄) */
    var powerReversed = reaches("VCC", PINS.gnd) && reaches("GND", "5V");
    /* 한쪽만 거꾸로 꽂은 경우도 위험이다 */
    var vccOnGround = reaches("VCC", PINS.gnd);
    var gndOnPower = reaches("GND", "5V") || reaches("GND", "3V3") || reaches("GND", "VIN");

    /* Trig↔Echo 맞바꿈 : 명세 13장 «Trig/Echo 교환» 자동 테스트 */
    var signalSwapped = reaches("TRIG", PINS.echo) && reaches("ECHO", PINS.trig);

    /* 신호 단자를 전원에 물렸다 — 센서가 상할 수 있다 */
    var signalOnPower = false;
    var signalOnPowerPin = "";
    ["TRIG", "ECHO"].forEach(function (id) {
      POWER_NODES.forEach(function (p) {
        var name = p.slice(4);
        if (reaches(id, name)) {
          signalOnPower = true;
          signalOnPowerPin = signalOnPowerPin || id;
        }
      });
    });

    /* 센서 단자 둘 이상이 같은 마디에 있다 — 브레드보드 같은 열에 두 다리를 꽂은 경우 */
    var legsShorted = [];
    for (var i = 0; i < SENSOR_PINS.length; i += 1) {
      for (var j = i + 1; j < SENSOR_PINS.length; j += 1) {
        if (net.find("sonic:" + SENSOR_PINS[i]) === net.find("sonic:" + SENSOR_PINS[j])) {
          legsShorted.push([SENSOR_PINS[i], SENSOR_PINS[j]]);
        }
      }
    }

    /* ④ 신호선이 «엉뚱한 디지털 핀» 에 갔는가 — 판정 메시지에 그대로 쓴다 */
    function digitalNamesAt(id) {
      return at[id].filter(function (n) {
        return /^D\d+$/.test(n) || /^A\d$/.test(n);
      });
    }
    var trigWired = digitalNamesAt("TRIG");
    var echoWired = digitalNamesAt("ECHO");

    /* ⑤ 센서에 전원이 «제대로» 들어오는가 — 시뮬레이션의 첫 관문이다 */
    var powered = vccOk && gndOk && !net.shorted && !powerReversed;

    return {
      pins: PINS,
      at: at,
      vccOk: vccOk,
      gndOk: gndOk,
      trigOk: trigOk,
      echoOk: echoOk,
      /* 실제로 케이블이 닿은 신호 핀 이름 (없으면 빈 배열) */
      trigWired: trigWired,
      echoWired: echoWired,
      /* 진단 */
      powerReversed: powerReversed,
      vccOnGround: vccOnGround,
      gndOnPower: gndOnPower,
      signalSwapped: signalSwapped,
      signalOnPower: signalOnPower,
      signalOnPowerPin: signalOnPowerPin,
      legsShorted: legsShorted,
      shortCircuit: net.shorted,
      powered: powered,
      /** 네 줄이 모두 제자리인가 */
      allWired: vccOk && gndOk && trigOk && echoOk
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "power"  : 5V 에서 센서 VCC 로 가는 쪽
   *   "ground" : 센서 GND 에서 우노 GND 로 가는 쪽
   *   "trig"   : Trig 신호선
   *   "echo"   : Echo 신호선
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 여러 쪽에 걸쳐 있는 경우
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.3 세 번째 줄).
   *     그래서 checkCircuit·analyze 어디에서도 이 함수를 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    var lanes = [
      { side: "power", node: "sonic:VCC" },
      { side: "ground", node: "sonic:GND" },
      { side: "trig", node: "sonic:TRIG" },
      { side: "echo", node: "sonic:ECHO" }
    ];

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";
      var root = net.find(node);

      var hit = lanes.filter(function (lane) {
        return net.find(lane.node) === root;
      });
      /* 두 갈래에 함께 걸쳐 있으면(잘못 이은 것) 색으로 우기지 않는다 */
      return hit.length === 1 ? hit[0].side : "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 6.3 «선택 선 삭제·전체 초기화» 와 짝을 이룬다)
   * 양쪽 끝이 모두 «센서 네 단자와 상관없는» 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    var live = {};
    SENSOR_PINS.forEach(function (id) {
      live[net.find("sonic:" + id)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 6.3 «충족 항목과 미충족 항목을 텍스트로»)
   *
   * ★ 항목마다 «서로 겹치지 않는» 한 가지만 본다.
   */
  var REQUIRED = [

        "우노 POWER 무리에서 5V 라고 적힌 핀을 찾으세요. 3V3 이 아닙니다.",

      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 단자는 일을 할 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 단자를 찾아보세요. 네 단자를 모두 써야 합니다.",
        "쓰지 않는 케이블은 지우고, 센서의 네 단자를 모두 제자리에 이으세요."
      ]
    }
  ];

  /** 화면에 적는 점검 항목 이름 */
  function labelOf(req) {
    return req.label;
  }

  /**
   * 회로 점검 (명세 6.3)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, floating, stray }
   *
   * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
   *   5V 와 GND 가 단락되어 있으면 어느 단자가 옳은지 전기적으로 말할 수 없다.
   *   그때 ✗ 를 찍으면 «그것도 틀렸다» 는 거짓말이 된다.
   *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
   *
   * ★★ 원인이 «하나» 인 것은 ✗ 도 하나다 (3차시에서 배운 규칙을 그대로 지킨다).
   *   · VCC·GND 를 맞바꿔 꽂았다     → c-vcc 만 ✗, c-gnd 는 «—»
   *   · Trig·Echo 를 맞바꿔 꽂았다   → c-trig 만 ✗, c-echo 는 «—»
   *   둘 다 빨개지면 학생은 «두 군데를 고쳐야 하는 줄» 안다.
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var floating = floatingLeads(connections);
    var stray = strayWires(connections);

    var tangled = net.shorted || a.legsShorted.length > 0;

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var powerWhy = "VCC·GND 를 제자리로 맞바꾸면 함께 판정합니다";
    var signalWhy = "Trig·Echo 를 제자리로 맞바꾸면 함께 판정합니다";

    var results = {
      "c-vcc": { ok: a.vccOk, blocked: tangled, why: tangledWhy },
      "c-gnd": {
        ok: a.gndOk,
        blocked: tangled || a.powerReversed,
        why: tangled ? tangledWhy : powerWhy
      },
      "c-trig": { ok: a.trigOk, blocked: tangled, why: tangledWhy },
      "c-echo": {
        ok: a.echoOk,
        blocked: tangled || a.signalSwapped,
        why: tangled ? tangledWhy : signalWhy
      },
      "c-safe": {
        ok: !a.powerReversed && !a.vccOnGround && !a.gndOnPower && !net.shorted && !a.signalOnPower,
        blocked: false,
        why: ""
      },
      "c-tidy": { ok: floating.length === 0 && stray.length === 0, blocked: false, why: "" }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: labelOf(req),
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 브레드보드로 나누어 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted,
      analysis: a,
      floating: floating,
      dangling: floating,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 네 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 6.3 «정답선을 그리지 않고»).
   *   펼치면 네 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   */
  var GOAL = [
    { id: "g1", sensorPin: "VCC", unoPin: PINS.vcc },
    { id: "g2", sensorPin: "GND", unoPin: PINS.gnd },
    { id: "g3", sensorPin: "TRIG", unoPin: PINS.trig },
    { id: "g4", sensorPin: "ECHO", unoPin: PINS.echo }
  ];

  /**
   * 목표 네 줄이 저마다 이어졌는가.
   * 브레드보드를 몇 번 거쳐 가도, 구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   *
   * 돌려주는 것 : { lines, allDone, passed, equivalent }
   */
  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      var names = unoNamesAt(net, g.sensorPin);
      return {
        id: g.id,
        label: "센서 " + (terminal("sonic", g.sensorPin) || {}).label + " ↔ 우노 " + g.unoPin,
        ok: names.indexOf(g.unoPin) !== -1
      };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 네 줄과 다르다 = «다르게 이었지만 맞다» (실제로는 일어나지 않는다) */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);

    if (a.shortCircuit) return "5V 와 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    if (a.legsShorted.length > 0) {
      var pair = a.legsShorted[0];
      return (
        "센서의 " + (terminal("sonic", pair[0]) || {}).label + " 와 " +
        (terminal("sonic", pair[1]) || {}).label + " 가 같은 마디에 있습니다. 두 단자가 붙어 버렸습니다."
      );
    }
    if (a.powerReversed) return "VCC 와 GND 가 서로 맞바뀌었습니다. 전원을 거꾸로 넣은 것입니다.";
    if (a.signalOnPower) {
      return "센서 " + (terminal("sonic", a.signalOnPowerPin) || {}).label + " 가 전원 핀에 물려 있습니다.";
    }
    /* ★ 맞바뀐 것은 «남은 단자» 가 아니다. 두 줄을 서로 옮기면 끝나므로 그렇게 말해 준다. */
    if (a.signalSwapped) {
      return (
        "Trig 와 Echo 가 서로 맞바뀌었습니다 — Trig→" + PINS.echo + " · Echo→" + PINS.trig +
        " 로 이어져 있습니다. 두 케이블을 맞바꾸면 됩니다."
      );
    }
    if (a.powerReversed === false && a.vccOnGround) {
      return "센서 VCC 가 " + PINS.gnd + " 에 물려 있습니다. VCC 는 " + PINS.vcc + " 로 가야 합니다.";
    }

    var done = [];
    var todo = [];
    GOAL.forEach(function (g) {
      var label = (terminal("sonic", g.sensorPin) || {}).label;
      var okNow =
        (g.sensorPin === "VCC" && a.vccOk) ||
        (g.sensorPin === "GND" && a.gndOk) ||
        (g.sensorPin === "TRIG" && a.trigOk) ||
        (g.sensorPin === "ECHO" && a.echoOk);
      if (okNow) done.push(label + "→" + g.unoPin);
      else todo.push(label);
    });

    if (done.length === 0) return "아직 제자리에 이어진 단자가 없습니다.";
    if (todo.length === 0) return "네 단자가 모두 제자리입니다 — " + done.join(" · ") + ".";
    return "이어진 것 : " + done.join(" · ") + ". 아직 남은 단자 : " + todo.join(" · ") + ".";
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다 — 명세 6.3 «단계적 힌트») */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결과 대표 오류 (명세 6.3 여섯 번째 줄 · 13장)                 */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 부품이 늘어도 이 배열에 한 줄 더하면 되고
   * 판정 코드는 그대로다.
   *
   * ★ 오류를 «뭉뚱그리지 않는다».
   *   역결선은 «센서 손상», Trig/Echo 맞바꿈은 «펄스는 나가지만 시간을 못 읽음»,
   *   GND 누락은 «센서가 켜지지 않음» 으로 서로 다르다.
   */
  var DANGER_RULES = [
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      effect: "전원 차단",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      code: "power-reversed",
      title: "VCC·GND 역결선",
      effect: "센서 손상 위험 — 전원 차단",
      test: function (ctx) {
        /* ★ 5V–GND 단락일 때는 짚지 않는다 — 그때는 모든 마디가 하나로 붙어
           «역결선처럼 보이는» 것이고, 진짜 고칠 곳은 단락 케이블 하나다. */
        return ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서 VCC 를 GND 에, GND 를 5V 에 꽂았습니다. 전원을 거꾸로 넣은 것입니다. " +
        "실제 부품이라면 센서 안의 부품이 곧 뜨거워지고 상할 수 있습니다. " +
        "그래서 명세대로 «전원을 끈 상태에서 VCC·GND 를 먼저 확인» 합니다.",
      fix: "센서를 돌려 꽂아 VCC 를 " + PINS.vcc + " 로, GND 를 " + PINS.gnd + " 로 이으세요."
    },
    {
      code: "vcc-on-ground",
      title: "VCC 를 GND 에 연결",
      effect: "센서가 켜지지 않는다",
      test: function (ctx) {
        return ctx.analysis.vccOnGround && !ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서의 VCC 가 GND 에 물려 있습니다. VCC 는 «전기를 받는» 단자인데 " +
        "기준 자리(0V)에 이어 놓았으니 센서에는 전압 차가 생기지 않습니다.",
      fix: "그 케이블을 지우고 VCC 를 우노 " + PINS.vcc + " 로 이으세요."
    },
    {
      code: "gnd-on-power",
      title: "GND 를 전원에 연결",
      effect: "센서 손상 위험",
      test: function (ctx) {
        return ctx.analysis.gndOnPower && !ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서의 GND 가 5V 계열 핀에 물려 있습니다. 접지 단자에 전압이 걸리면 " +
        "센서 안의 전류가 뜻하지 않은 길로 흐릅니다.",
      fix: "그 케이블을 지우고 GND 를 우노 " + PINS.gnd + " 로 이으세요."
    },
    {
      code: "signal-on-power",
      title: "신호 단자를 전원(5V)에 연결",
      effect: "센서 손상 위험 — 측정 불가",
      test: function (ctx) {
        return ctx.analysis.signalOnPower && !ctx.net.shorted;
      },
      detail:
        "Trig 또는 Echo 가 5V·3V3·VIN 같은 전원 핀에 물려 있습니다. 신호 단자는 " +
        "HIGH·LOW 가 «바뀌어야» 뜻이 있는 자리인데, 전원 핀은 늘 같은 값이라 " +
        "펄스도 만들 수 없고 시간도 읽을 수 없습니다.",
      fix:
        "전원 핀으로 가는 신호 케이블을 지우고 Trig 는 " + PINS.trig + ", Echo 는 " +
        PINS.echo + " 로 이으세요."
    },
    {
      code: "signal-swapped",
      title: "Trig·Echo 맞바꿈",
      effect: "펄스는 나가지만 시간을 못 읽는다",
      test: function (ctx) {
        return ctx.analysis.signalSwapped && !ctx.net.shorted;
      },
      detail:
        "Trig 와 Echo 가 서로 바뀌었습니다. 코드는 " + PINS.trig + " 로 펄스를 내보내지만 " +
        "그 핀에는 Echo 가 달려 있어 센서가 «쏴라» 는 명령을 받지 못합니다. " +
        "그러면 " + PINS.echo + " 에서 읽을 시간도 생기지 않습니다.",
      fix: "두 케이블을 맞바꾸어 Trig → " + PINS.trig + ", Echo → " + PINS.echo + " 로 두세요."
    },
    {
      code: "sensor-legs-shorted",
      title: "센서 단자 두 개가 같은 마디",
      effect: "측정 불가",
      test: function (ctx) {
        return ctx.analysis.legsShorted.length > 0 && !ctx.net.shorted;
      },
      detail:
        "센서의 단자 두 개가 같은 마디에 있습니다. 브레드보드의 «같은 열» 에 두 다리를 꽂으면 " +
        "이렇게 됩니다. 두 단자가 붙어 버려 서로 다른 값을 가질 수 없습니다.",
      fix: "브레드보드는 가운데 홈을 사이에 두고 열이 나뉩니다. 네 단자를 «서로 다른 열» 에 꽂으세요."
    },
    {
      code: "reverse-rail",
      title: "전원·접지 레일 역결선",
      effect: "부품 손상 위험",
      test: function (ctx) {
        var bad = false;
        ctx.connections.forEach(function (c) {
          var a = terminal(c.fromComponent, c.fromPin);
          var b = terminal(c.toComponent, c.toPin);
          if (!a || !b) return;

          var ends = [
            { pin: a, comp: c.fromComponent },
            { pin: b, comp: c.toComponent }
          ];
          var unoEnd = ends.filter(function (e) {
            return e.comp === "uno";
          })[0];
          var railEnd = ends.filter(function (e) {
            return e.pin.kind === "rail";
          })[0];
          if (!unoEnd || !railEnd) return;

          if (unoEnd.pin.id === "5V" && railEnd.pin.polarity === "minus") bad = true;
          if (unoEnd.pin.kind === "ground" && railEnd.pin.polarity === "plus") bad = true;
        });
        return bad;
      },
      detail: "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다.",
      fix: "빨간 줄(+) 에는 5V 를, 파란 줄(−) 에는 GND 를 연결하세요."
    }
  ];

  /**
   * 위험·오류 연결을 모두 찾는다.
   * 「전원을 막는 것」과 「측정이 안 될 뿐인 것」을 함께 돌려주되 effect 로 구분한다.
   */
  function dangers(connections) {
    var ctx = {
      connections: connections || [],
      net: solve(connections),
      analysis: analyze(connections)
    };
    return DANGER_RULES.filter(function (rule) {
      return rule.test(ctx);
    }).map(function (rule) {
      return {
        code: rule.code,
        title: rule.title,
        effect: rule.effect,
        detail: rule.detail,
        fix: rule.fix
      };
    });
  }

  /** 전원을 켜도 되는가 — 위험이 하나라도 있으면 막는다(명세 6.3 여섯 번째 줄) */
  function canPowerOn(connections) {
    var found = dangers(connections);
    var check = checkCircuit(connections);
    if (found.length > 0) return { ok: false, reason: "danger", dangers: found, check: check };
    if (!check.ok) return { ok: false, reason: "incomplete", dangers: [], check: check };
    return { ok: true, reason: "", dangers: [], check: check };
  }

  /**
   * 지금 회로에서 센서가 «무엇까지 할 수 있는가» (명세 6.5 다섯 번째 줄)
   *
   * ★★ 이 차시의 알맹이다 — 「펄스 발사 실패」와 「반사 시간 읽기 실패」를 «갈라» 알린다.
   *   두 오류의 원인이 다르므로 화면에 나오는 말도 달라야 한다.
   *
   *   code : 학생 코드가 정한 핀과 pinMode  { trigPin, echoPin, trigMode, echoMode }
   *          (arduino.js 가 뽑아 준다. 없으면 회로만으로 판정한다)
   *
   * 돌려주는 것 : { powered, canPulse, canRead, reason, text }
   */
  function sensorState(connections, code) {
    var a = analyze(connections);
    var c = code || {};

    if (a.shortCircuit) {
      return { powered: false, canPulse: false, canRead: false, reason: "short", text: "단락 — 전원이 차단되었습니다." };
    }
    if (a.powerReversed) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "reversed",
        text: "VCC·GND 가 거꾸로 꽂혀 있습니다. 센서에 전원을 넣을 수 없습니다."
      };
    }
    if (!a.vccOk && !a.gndOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-power",
        text: "센서에 전원이 들어오지 않았습니다. VCC 와 GND 를 먼저 이으세요."
      };
    }
    if (!a.vccOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-vcc",
        text: "VCC 가 " + PINS.vcc + " 에 이어지지 않아 센서가 켜지지 않습니다."
      };
    }
    if (!a.gndOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-gnd",
