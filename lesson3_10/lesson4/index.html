          id: r + c,
          label: r + c,
          kind: "tie",
          half: "U",
          col: c,
          x: colX(c),
          y: 100 + i * PITCH
        });
      }
    });

    lower.forEach(function (r, i) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: r + c,
          label: r + c,
          kind: "tie",
          half: "L",
          col: c,
          x: colX(c),
          y: 246 + i * PITCH
        });
      }
    });

    return {
      id: "bb",
      name: "브레드보드",
      box: { x: 580, y: 24, w: 300, h: 380 },
      cols: COLS,
      rails: rails,
      gap: { y: 210, h: 22 },
      /* 열 번호를 적는 줄 */
      colNoY: 92,
      /* 행 문자(A~J)를 적는 x.
         실물 브레드보드처럼 구멍 왼쪽에 적는다. 오른쪽에도 적으면
         설명 그림의 지시선(오른쪽에서 들어온다)과 겹치므로 왼쪽만 쓴다. */
      rowLabelX: 596,
      rowsUpper: upper,
      rowsLower: lower,
      pins: pins
    };
  }

  /**
   * HC-SR04 초음파 센서 — 이 차시의 주인공 (명세 4장 · 6.3)
   *
   * 실물은 작은 기판에 «눈 두 개» 처럼 원통이 나란히 붙어 있다.
   *   T (Transmitter) : 초음파를 «내보내는» 쪽 — Trig 가 명령한다
   *   R (Receiver)    : 되돌아온 초음파를 «받는» 쪽 — Echo 가 시간을 알린다
   * 가운데 네모난 것은 수정 진동자(clock)다.
   *
   * ★ 네 단자는 실물과 «같은 차례» 로 적는다 — VCC · Trig · Echo · GND.
   *   순서를 바꾸면 화면에서 익힌 자리와 교실의 부품이 어긋난다.
   *
   * ★★ 자리를 이렇게 잡은 까닭
   *   · 위쪽  : 우노 보드의 아래 끝이 y=276 이다. 이름(296)·상태(312) 를 그 아래 «기판 위» 에 둔다.
   *   · 아래쪽: 단자 이름표가 pin.y + 18 = 424 에 그려진다. 그림 틀(viewBox)의
   *             아래 끝이 438 이므로 여기까지가 한계다.
   */
  function buildSonic() {
    /* 네 단자를 기판 가운데(x=204) 를 기준으로 46 간격으로 놓는다 */
    var pinY = 406;
    var centerX = 204;
    var gap = 46;
    var xs = [centerX - gap * 1.5, centerX - gap * 0.5, centerX + gap * 0.5, centerX + gap * 1.5];

    return {
      id: "sonic",
      name: "초음파 센서 (HC-SR04)",
      kind: "device",
      /** 기판 — 실물처럼 «푸른 기판» 이다 */
      pcb: { x: 96, y: 320, w: 216, h: 68 },
      /** 원통 두 개 — 왼쪽이 내보내는 쪽(T), 오른쪽이 받는 쪽(R) */
      horns: [
        { id: "T", cx: 138, cy: 354, r: 24, label: "T", full: "내보내는 쪽 (Transmitter)" },
        { id: "R", cx: 270, cy: 354, r: 24, label: "R", full: "받는 쪽 (Receiver)" }
      ],
      /** 가운데 수정 진동자 */
      crystal: { x: 188, y: 342, w: 32, h: 24 },
      /** 이름과 «측정됨/실패» 를 적는 자리 — 단자 이름표(424)와 부딪히지 않게 위에 둔다 */
      nameY: 296,
      stateY: 312,
      box: { x: 84, y: 284, w: 244, h: 154 },
      /** 네 다리 — 기판 아래(388) 에서 단자(406) 까지 곧게 내려온다 */
      legs: {
        VCC: { from: { x: xs[0], y: 388 }, to: { x: xs[0], y: pinY } },
        TRIG: { from: { x: xs[1], y: 388 }, to: { x: xs[1], y: pinY } },
        ECHO: { from: { x: xs[2], y: 388 }, to: { x: xs[2], y: pinY } },
        GND: { from: { x: xs[3], y: 388 }, to: { x: xs[3], y: pinY } }
      },
      pins: [
        {
          id: "VCC",
          label: "VCC",
          short: "V",
          kind: "supply",
          role: "power",
          x: xs[0],
          y: pinY,
          goal: PINS.vcc,
          note: "전원 — 우노 5V 로 간다. 센서가 일할 힘을 받는 곳이다."
        },
        {
          id: "TRIG",
          label: "Trig",
          short: "T",
          kind: "trigger",
          role: "output",
          x: xs[1],
          y: pinY,
          goal: PINS.trig,
          note:
            "Trig — 우노 " + TRIG_PIN_NAME + " 로 간다. 아두이노가 «지금 쏴라» 고 " +
            "10μs 동안 HIGH 를 보내는 «입력받는» 단자다(아두이노 쪽에서는 OUTPUT)."
        },
        {
          id: "ECHO",
          label: "Echo",
          short: "E",
          kind: "echo",
          role: "input",
          x: xs[2],
          y: pinY,
          goal: PINS.echo,
          note:
            "Echo — 우노 " + ECHO_PIN_NAME + " 로 간다. 초음파가 돌아온 «시간만큼» HIGH 를 " +
            "유지해 알려 주는 단자다(아두이노 쪽에서는 INPUT)."
        },
        {
          id: "GND",
          label: "GND",
          short: "G",
          kind: "sink",
          role: "ground",
          x: xs[3],
          y: pinY,
          goal: PINS.gnd,
          note: "접지 — 우노 GND 로 간다. 전류가 돌아오는 길이자 전압의 기준이다."
        }
      ]
    };
  }

  var UNO = buildUno();
  var BB = buildBreadboard();
  var SONIC = buildSonic();

  /** 화면에 그릴 부품 전부. 판정은 이 목록을 훑는다. */
  var COMPONENTS = [UNO, BB, SONIC];
  var BY_ID = { uno: UNO, bb: BB, sonic: SONIC };

  /** 케이블이 아니라 «부품» 인 것 */
  var PARTS = [SONIC];

  /** 센서 단자 네 개의 이름 — 여러 곳에서 같은 차례로 훑는다 */
  var SENSOR_PINS = ["VCC", "TRIG", "ECHO", "GND"];

  /** 센서 단자가 가야 할 우노 핀 (명세 4장) */
  var GOAL_PIN = { VCC: PINS.vcc, GND: PINS.gnd, TRIG: PINS.trig, ECHO: PINS.echo };

  /** 「Trig 단자」 처럼 사람이 읽는 단자 이름 */
  function pinTitle(pinId) {
    var pin = terminal("sonic", pinId);
    return pin ? pin.label + " 단자" : String(pinId);
  }

  /** 부품·단자 이름으로 단자를 찾는다. 없으면 null. */
  function terminal(componentId, pinId) {
    var comp = BY_ID[componentId];
    if (!comp) return null;
    for (var i = 0; i < comp.pins.length; i += 1) {
      if (comp.pins[i].id === pinId) return comp.pins[i];
    }
    return null;
  }

  /** 「우노 5V」 처럼 사람이 읽는 이름 */
  function describe(componentId, pinId) {
    var comp = BY_ID[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return String(componentId) + " " + String(pinId);
    if (comp.id === "uno") return "우노 " + pin.label;
    if (comp.id === "sonic") return "센서 " + pin.label;
    if (pin.kind === "rail") return "브레드보드 " + pin.label + " " + pin.short;
    return "브레드보드 " + pin.label + " 구멍";
  }

  /* ------------------------------------------------------------------ */
  /* 2. 하드웨어가 이미 이어 놓은 «마디»                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 단자 하나가 속한 마디 이름.
   * 케이블을 하나도 꽂지 않아도 부품 안에서 이미 이어져 있는 것들을 나타낸다.
   */
  function nodeOf(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    if (!pin) return null;
    if (componentId === "uno") {
      if (pin.kind === "ground") return "uno:GND";
      return "uno:" + pin.id;
    }
    /* 센서의 네 단자는 저마다 따로인 마디다. 기판이 이 넷을 이어 주지 «않는다». */
    if (componentId === "sonic") return "sonic:" + pin.id;
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;
    return "bb:col:" + pin.col + ":" + pin.half;
  }

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);
    if (node.indexOf("sonic:") === 0) return "센서 " + (terminal("sonic", node.slice(6)) || {}).label;

    var railMatch = node.match(/^bb:rail:(\w+)$/);
    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {
        if (r.id === railMatch[1]) found = r;
      });
      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;
    }

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
    if (colMatch) {
      return "브레드보드 " + colMatch[1] + "번 열(" + (colMatch[2] === "U" ? "A~E" : "F~J") + ")";
    }
    return node;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 연결 자료 (명세 6.3 — 좌표가 아니라 연결 그래프로 저장)              */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 색을 골라 준다 — 5V 빨강, GND 검정/파랑, 신호 노랑(명세 6.3 세 번째 줄).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || kinds.indexOf("sink") !== -1) return "black";
    if (polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || kinds.indexOf("supply") !== -1) return "red";
    if (polarities.indexOf("plus") !== -1) return "red";
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.3 «전원 켜기를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 6.3)                              */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리 모두 맞기 때문이다.
   *
   * ★ 넷 가운데 둘을 «센서 쪽» 으로 둔 까닭
   *   이 차시에서 가장 잘 헷갈리는 것이 «Trig 가 보내고 Echo 가 받는다» 다(명세 10장 오개념 1).
   *   우노 핀만 찾게 하면 그 구실을 짚을 자리가 없다.
   */
  var FIND_TASKS = [
    {
      id: "f-5v",
      prompt: "센서에 전기를 줄 «5V» 핀을 찾아 누르세요.",
      accept: [{ component: "uno", pin: "5V" }],
      why:
        "HC-SR04 는 5V 로 움직인다. 3V3 에 꽂으면 초음파를 낼 힘이 모자라 " +
        "가까운 거리도 놓칠 수 있다."
    },
    {
      id: "f-gnd",
      prompt: "전류가 돌아올 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",
      accept: [
        { component: "uno", pin: "GND0" },
        { component: "uno", pin: "GND1" },
        { component: "uno", pin: "GND2" }
      ],
      why: "GND 는 전기가 «없는» 핀이 아니라 전류가 돌아오는 길이자 전압을 재는 기준이다."
    },
    {
      id: "f-trig",
      prompt: "센서에서 «초음파를 쏘라» 는 명령을 받는 단자를 찾아 누르세요.",
      accept: [{ component: "sonic", pin: "TRIG" }],
      why:
        "Trig 다. 아두이노가 이 단자에 10μs 동안 HIGH 를 보내면 센서가 초음파를 내보낸다. " +
        "아두이노 쪽에서 보면 «내보내는» 핀이므로 pinMode 는 OUTPUT 이다."
    },
    {
      id: "f-echo",
      prompt: "되돌아온 초음파의 «시간» 을 알려 주는 단자를 찾아 누르세요.",
      accept: [{ component: "sonic", pin: "ECHO" }],
      why:
        "Echo 다. 초음파가 갔다가 돌아오는 동안 이 단자가 HIGH 로 있는다. " +
        "아두이노는 그 «길이» 를 읽으므로 pinMode 는 INPUT 이다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    supply: "센서 전원 단자",
    trigger: "센서 Trig 단자",
    echo: "센서 Echo 단자",
    sink: "센서 접지 단자",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.3 여덟 번째 줄) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·보내는 신호·받는 신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — 네 단자 결선 판정 (명세 6.3)                             */
  /* ------------------------------------------------------------------ */

  /** 전원 계열 마디 — 신호 단자를 여기에 물리면 위험이다 */
  var POWER_NODES = ["uno:5V", "uno:3V3", "uno:VIN"];

  /**
   * 센서 단자 하나가 «닿아 있는 우노 핀 이름» 을 모두 모은다.
   *
   * ★ 이름으로 모으는 까닭 : GND0·GND1·GND2 는 보드 안에서 이미 한 마디이므로
   *   셋을 따로 세면 «GND 세 개에 이었다» 는 엉뚱한 말이 된다. 이름은 모두 "GND" 다.
   */
  function unoNamesAt(net, sensorPin) {
    var node = net.find("sonic:" + sensorPin);
    var out = [];
    UNO.pins.forEach(function (p) {
      if (net.find(nodeOf("uno", p.id)) !== node) return;
      if (out.indexOf(p.label) === -1) out.push(p.label);
    });
    return out;
  }

  /**
   * 회로를 전기적으로 읽어 낸다.
   *
   * ★ 단자마다 «따로» 본다.
   *   Trig 만 빠뜨린 학생에게 «전원도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
   */
  function analyze(connections) {
    var net = solve(connections);

    /* ① 단자마다 닿은 우노 핀 이름 */
    var at = {};
    SENSOR_PINS.forEach(function (id) {
      at[id] = unoNamesAt(net, id);
    });

    function reaches(sensorPin, unoName) {
      return at[sensorPin].indexOf(unoName) !== -1;
    }

    /* ② 네 줄이 저마다 이어졌는가 */
    var vccOk = reaches("VCC", PINS.vcc);
    var gndOk = reaches("GND", PINS.gnd);
    var trigOk = reaches("TRIG", PINS.trig);
    var echoOk = reaches("ECHO", PINS.echo);

    /* ③ 대표 오류 — 원인이 «하나» 인 것들 */
    /* VCC↔GND 역결선 : VCC 를 GND 에, GND 를 5V 에 꽂았다 (명세 6.3 여섯 번째 줄) */
    var powerReversed = reaches("VCC", PINS.gnd) && reaches("GND", "5V");
    /* 한쪽만 거꾸로 꽂은 경우도 위험이다 */
    var vccOnGround = reaches("VCC", PINS.gnd);
    var gndOnPower = reaches("GND", "5V") || reaches("GND", "3V3") || reaches("GND", "VIN");

    /* Trig↔Echo 맞바꿈 : 명세 13장 «Trig/Echo 교환» 자동 테스트 */
    var signalSwapped = reaches("TRIG", PINS.echo) && reaches("ECHO", PINS.trig);

    /* 신호 단자를 전원에 물렸다 — 센서가 상할 수 있다 */
    var signalOnPower = false;
    var signalOnPowerPin = "";
    ["TRIG", "ECHO"].forEach(function (id) {
      POWER_NODES.forEach(function (p) {
        var name = p.slice(4);
        if (reaches(id, name)) {
          signalOnPower = true;
          signalOnPowerPin = signalOnPowerPin || id;
        }
      });
    });

    /* 센서 단자 둘 이상이 같은 마디에 있다 — 브레드보드 같은 열에 두 다리를 꽂은 경우 */
    var legsShorted = [];
    for (var i = 0; i < SENSOR_PINS.length; i += 1) {
      for (var j = i + 1; j < SENSOR_PINS.length; j += 1) {
        if (net.find("sonic:" + SENSOR_PINS[i]) === net.find("sonic:" + SENSOR_PINS[j])) {
          legsShorted.push([SENSOR_PINS[i], SENSOR_PINS[j]]);
        }
      }
    }

    /* ④ 신호선이 «엉뚱한 디지털 핀» 에 갔는가 — 판정 메시지에 그대로 쓴다 */
    function digitalNamesAt(id) {
      return at[id].filter(function (n) {
        return /^D\d+$/.test(n) || /^A\d$/.test(n);
      });
    }
    var trigWired = digitalNamesAt("TRIG");
    var echoWired = digitalNamesAt("ECHO");

    /* ⑤ 센서에 전원이 «제대로» 들어오는가 — 시뮬레이션의 첫 관문이다 */
    var powered = vccOk && gndOk && !net.shorted && !powerReversed;

    return {
      pins: PINS,
      at: at,
      vccOk: vccOk,
      gndOk: gndOk,
      trigOk: trigOk,
      echoOk: echoOk,
      /* 실제로 케이블이 닿은 신호 핀 이름 (없으면 빈 배열) */
      trigWired: trigWired,
      echoWired: echoWired,
      /* 진단 */
      powerReversed: powerReversed,
      vccOnGround: vccOnGround,
      gndOnPower: gndOnPower,
      signalSwapped: signalSwapped,
      signalOnPower: signalOnPower,
      signalOnPowerPin: signalOnPowerPin,
      legsShorted: legsShorted,
      shortCircuit: net.shorted,
      powered: powered,
      /** 네 줄이 모두 제자리인가 */
      allWired: vccOk && gndOk && trigOk && echoOk
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "power"  : 5V 에서 센서 VCC 로 가는 쪽
   *   "ground" : 센서 GND 에서 우노 GND 로 가는 쪽
   *   "trig"   : Trig 신호선
   *   "echo"   : Echo 신호선
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 여러 쪽에 걸쳐 있는 경우
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.3 세 번째 줄).
   *     그래서 checkCircuit·analyze 어디에서도 이 함수를 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    var lanes = [
      { side: "power", node: "sonic:VCC" },
      { side: "ground", node: "sonic:GND" },
      { side: "trig", node: "sonic:TRIG" },
      { side: "echo", node: "sonic:ECHO" }
    ];

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";
      var root = net.find(node);

      var hit = lanes.filter(function (lane) {
        return net.find(lane.node) === root;
      });
      /* 두 갈래에 함께 걸쳐 있으면(잘못 이은 것) 색으로 우기지 않는다 */
      return hit.length === 1 ? hit[0].side : "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 6.3 «선택 선 삭제·전체 초기화» 와 짝을 이룬다)
   * 양쪽 끝이 모두 «센서 네 단자와 상관없는» 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    var live = {};
    SENSOR_PINS.forEach(function (id) {
      live[net.find("sonic:" + id)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 6.3 «충족 항목과 미충족 항목을 텍스트로»)
   *
   * ★ 항목마다 «서로 겹치지 않는» 한 가지만 본다.
   */
  var REQUIRED = [
    {
      id: "c-vcc",
      label: "센서 VCC 가 우노 " + PINS.vcc + " 와 이어진다",
      role: "전원",
      hints: [
        "센서도 일하려면 전기가 필요합니다. 우노에서 «늘 5V 를 내주는» 핀은 어디일까요?",
        "우노 POWER 무리에서 5V 라고 적힌 핀을 찾으세요. 3V3 이 아닙니다.",
        "우노 " + PINS.vcc + " 와 센서 VCC 를 케이블 한 줄로 이으세요. 브레드보드를 거쳐도 됩니다."
      ]
    },
    {
      id: "c-gnd",
      label: "센서 GND 가 우노 " + PINS.gnd + " 와 이어진다",
      role: "접지",
      hints: [
        "전류가 센서를 지난 뒤에는 어디로 돌아가야 할까요?",
        "우노에는 GND 가 세 곳 있습니다. 보드 안에서 이미 이어져 있으니 아무 곳이나 됩니다.",
        "센서 GND 와 우노 GND 를 이으세요. 이 길이 없으면 센서가 아예 켜지지 않습니다."
      ]
    },
    {
      id: "c-trig",
      label: "센서 Trig 가 우노 " + PINS.trig + " 와 이어진다",
      role: "펄스 보내기",
      hints: [
        "Trig 는 신호를 «보내는» 출력 단자입니다. Arduino 의 몇 번 디지털 핀을 사용하기로 했나요?",
        "이 수업에서 정한 Trig 핀은 " + PINS.trig + " 입니다. DIGITAL 무리에서 찾으세요.",
        "우노 " + PINS.trig + " 와 센서 Trig 를 이으세요. 코드의 trigPin 도 같은 번호여야 합니다."
      ]
    },
    {
      id: "c-echo",
      label: "센서 Echo 가 우노 " + PINS.echo + " 와 이어진다",
      role: "시간 읽기",
      hints: [
        "Echo 는 돌아온 시간을 «알려 주는» 단자입니다. 그러면 아두이노 쪽에서는 보내는 핀일까요, 받는 핀일까요?",
        "이 수업에서 정한 Echo 핀은 " + PINS.echo + " 입니다.",
        "우노 " + PINS.echo + " 와 센서 Echo 를 이으세요. 코드의 echoPin 도 같은 번호여야 합니다."
      ]
    },
    {
      id: "c-safe",
      label: "VCC·GND 를 거꾸로 잇거나 5V 를 GND 에 바로 잇지 않았다",
      role: "안전",
      hints: [
        "전원과 접지를 거꾸로 꽂으면 센서 안으로 전류가 반대로 흐릅니다. 무슨 일이 생길까요?",
        "케이블 목록에서 VCC 가 GND 로, 또는 GND 가 5V 로 가는 줄이 있는지 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우고 VCC→5V, GND→GND 로 다시 이으세요."
      ]
    },
    {
      id: "c-tidy",
      label: "떠 있는 단자나 쓸모없는 케이블이 없다",
      role: "정리",
      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 단자는 일을 할 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 단자를 찾아보세요. 네 단자를 모두 써야 합니다.",
        "쓰지 않는 케이블은 지우고, 센서의 네 단자를 모두 제자리에 이으세요."
      ]
    }
  ];

  /** 화면에 적는 점검 항목 이름 */
  function labelOf(req) {
    return req.label;
  }

  /**
   * 회로 점검 (명세 6.3)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, floating, stray }
   *
   * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
   *   5V 와 GND 가 단락되어 있으면 어느 단자가 옳은지 전기적으로 말할 수 없다.
   *   그때 ✗ 를 찍으면 «그것도 틀렸다» 는 거짓말이 된다.
   *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
   *
   * ★★ 원인이 «하나» 인 것은 ✗ 도 하나다 (3차시에서 배운 규칙을 그대로 지킨다).
   *   · VCC·GND 를 맞바꿔 꽂았다     → c-vcc 만 ✗, c-gnd 는 «—»
   *   · Trig·Echo 를 맞바꿔 꽂았다   → c-trig 만 ✗, c-echo 는 «—»
   *   둘 다 빨개지면 학생은 «두 군데를 고쳐야 하는 줄» 안다.
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var floating = floatingLeads(connections);
    var stray = strayWires(connections);

    var tangled = net.shorted || a.legsShorted.length > 0;

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var powerWhy = "VCC·GND 를 제자리로 맞바꾸면 함께 판정합니다";
    var signalWhy = "Trig·Echo 를 제자리로 맞바꾸면 함께 판정합니다";

    var results = {
      "c-vcc": { ok: a.vccOk, blocked: tangled, why: tangledWhy },
      "c-gnd": {
        ok: a.gndOk,
        blocked: tangled || a.powerReversed,
        why: tangled ? tangledWhy : powerWhy
      },
      "c-trig": { ok: a.trigOk, blocked: tangled, why: tangledWhy },
      "c-echo": {
        ok: a.echoOk,
        blocked: tangled || a.signalSwapped,
        why: tangled ? tangledWhy : signalWhy
      },
      "c-safe": {
        ok: !a.powerReversed && !a.vccOnGround && !a.gndOnPower && !net.shorted && !a.signalOnPower,
        blocked: false,
        why: ""
      },
      "c-tidy": { ok: floating.length === 0 && stray.length === 0, blocked: false, why: "" }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: labelOf(req),
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 브레드보드로 나누어 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted,
      analysis: a,
      floating: floating,
      dangling: floating,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 네 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 6.3 «정답선을 그리지 않고»).
   *   펼치면 네 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   */
  var GOAL = [
    { id: "g1", sensorPin: "VCC", unoPin: PINS.vcc },
    { id: "g2", sensorPin: "GND", unoPin: PINS.gnd },
    { id: "g3", sensorPin: "TRIG", unoPin: PINS.trig },
    { id: "g4", sensorPin: "ECHO", unoPin: PINS.echo }
  ];

  /**
   * 목표 네 줄이 저마다 이어졌는가.
   * 브레드보드를 몇 번 거쳐 가도, 구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   *
   * 돌려주는 것 : { lines, allDone, passed, equivalent }
   */
  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      var names = unoNamesAt(net, g.sensorPin);
      return {
        id: g.id,
        label: "센서 " + (terminal("sonic", g.sensorPin) || {}).label + " ↔ 우노 " + g.unoPin,
        ok: names.indexOf(g.unoPin) !== -1
      };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 네 줄과 다르다 = «다르게 이었지만 맞다» (실제로는 일어나지 않는다) */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);

    if (a.shortCircuit) return "5V 와 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    if (a.legsShorted.length > 0) {
      var pair = a.legsShorted[0];
      return (
        "센서의 " + (terminal("sonic", pair[0]) || {}).label + " 와 " +
        (terminal("sonic", pair[1]) || {}).label + " 가 같은 마디에 있습니다. 두 단자가 붙어 버렸습니다."
      );
    }
    if (a.powerReversed) return "VCC 와 GND 가 서로 맞바뀌었습니다. 전원을 거꾸로 넣은 것입니다.";
    if (a.signalOnPower) {
      return "센서 " + (terminal("sonic", a.signalOnPowerPin) || {}).label + " 가 전원 핀에 물려 있습니다.";
    }
    /* ★ 맞바뀐 것은 «남은 단자» 가 아니다. 두 줄을 서로 옮기면 끝나므로 그렇게 말해 준다. */
    if (a.signalSwapped) {
      return (
        "Trig 와 Echo 가 서로 맞바뀌었습니다 — Trig→" + PINS.echo + " · Echo→" + PINS.trig +
        " 로 이어져 있습니다. 두 케이블을 맞바꾸면 됩니다."
      );
    }
    if (a.powerReversed === false && a.vccOnGround) {
      return "센서 VCC 가 " + PINS.gnd + " 에 물려 있습니다. VCC 는 " + PINS.vcc + " 로 가야 합니다.";
    }

    var done = [];
    var todo = [];
    GOAL.forEach(function (g) {
      var label = (terminal("sonic", g.sensorPin) || {}).label;
      var okNow =
        (g.sensorPin === "VCC" && a.vccOk) ||
        (g.sensorPin === "GND" && a.gndOk) ||
        (g.sensorPin === "TRIG" && a.trigOk) ||
        (g.sensorPin === "ECHO" && a.echoOk);
      if (okNow) done.push(label + "→" + g.unoPin);
      else todo.push(label);
    });

    if (done.length === 0) return "아직 제자리에 이어진 단자가 없습니다.";
    if (todo.length === 0) return "네 단자가 모두 제자리입니다 — " + done.join(" · ") + ".";
    return "이어진 것 : " + done.join(" · ") + ". 아직 남은 단자 : " + todo.join(" · ") + ".";
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다 — 명세 6.3 «단계적 힌트») */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결과 대표 오류 (명세 6.3 여섯 번째 줄 · 13장)                 */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 부품이 늘어도 이 배열에 한 줄 더하면 되고
   * 판정 코드는 그대로다.
   *
   * ★ 오류를 «뭉뚱그리지 않는다».
   *   역결선은 «센서 손상», Trig/Echo 맞바꿈은 «펄스는 나가지만 시간을 못 읽음»,
   *   GND 누락은 «센서가 켜지지 않음» 으로 서로 다르다.
   */
  var DANGER_RULES = [
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      effect: "전원 차단",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      code: "power-reversed",
      title: "VCC·GND 역결선",
      effect: "센서 손상 위험 — 전원 차단",
      test: function (ctx) {
        /* ★ 5V–GND 단락일 때는 짚지 않는다 — 그때는 모든 마디가 하나로 붙어
           «역결선처럼 보이는» 것이고, 진짜 고칠 곳은 단락 케이블 하나다. */
        return ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서 VCC 를 GND 에, GND 를 5V 에 꽂았습니다. 전원을 거꾸로 넣은 것입니다. " +
        "실제 부품이라면 센서 안의 부품이 곧 뜨거워지고 상할 수 있습니다. " +
        "그래서 명세대로 «전원을 끈 상태에서 VCC·GND 를 먼저 확인» 합니다.",
      fix: "센서를 돌려 꽂아 VCC 를 " + PINS.vcc + " 로, GND 를 " + PINS.gnd + " 로 이으세요."
    },
    {
      code: "vcc-on-ground",
      title: "VCC 를 GND 에 연결",
      effect: "센서가 켜지지 않는다",
      test: function (ctx) {
        return ctx.analysis.vccOnGround && !ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서의 VCC 가 GND 에 물려 있습니다. VCC 는 «전기를 받는» 단자인데 " +
        "기준 자리(0V)에 이어 놓았으니 센서에는 전압 차가 생기지 않습니다.",
      fix: "그 케이블을 지우고 VCC 를 우노 " + PINS.vcc + " 로 이으세요."
    },
    {
      code: "gnd-on-power",
      title: "GND 를 전원에 연결",
      effect: "센서 손상 위험",
      test: function (ctx) {
        return ctx.analysis.gndOnPower && !ctx.analysis.powerReversed && !ctx.net.shorted;
      },
      detail:
        "센서의 GND 가 5V 계열 핀에 물려 있습니다. 접지 단자에 전압이 걸리면 " +
        "센서 안의 전류가 뜻하지 않은 길로 흐릅니다.",
      fix: "그 케이블을 지우고 GND 를 우노 " + PINS.gnd + " 로 이으세요."
    },
    {
      code: "signal-on-power",
      title: "신호 단자를 전원(5V)에 연결",
      effect: "센서 손상 위험 — 측정 불가",
      test: function (ctx) {
        return ctx.analysis.signalOnPower && !ctx.net.shorted;
      },
      detail:
        "Trig 또는 Echo 가 5V·3V3·VIN 같은 전원 핀에 물려 있습니다. 신호 단자는 " +
        "HIGH·LOW 가 «바뀌어야» 뜻이 있는 자리인데, 전원 핀은 늘 같은 값이라 " +
        "펄스도 만들 수 없고 시간도 읽을 수 없습니다.",
      fix:
        "전원 핀으로 가는 신호 케이블을 지우고 Trig 는 " + PINS.trig + ", Echo 는 " +
        PINS.echo + " 로 이으세요."
    },
    {
      code: "signal-swapped",
      title: "Trig·Echo 맞바꿈",
      effect: "펄스는 나가지만 시간을 못 읽는다",
      test: function (ctx) {
        return ctx.analysis.signalSwapped && !ctx.net.shorted;
      },
      detail:
        "Trig 와 Echo 가 서로 바뀌었습니다. 코드는 " + PINS.trig + " 로 펄스를 내보내지만 " +
        "그 핀에는 Echo 가 달려 있어 센서가 «쏴라» 는 명령을 받지 못합니다. " +
        "그러면 " + PINS.echo + " 에서 읽을 시간도 생기지 않습니다.",
      fix: "두 케이블을 맞바꾸어 Trig → " + PINS.trig + ", Echo → " + PINS.echo + " 로 두세요."
    },
    {
      code: "sensor-legs-shorted",
      title: "센서 단자 두 개가 같은 마디",
      effect: "측정 불가",
      test: function (ctx) {
        return ctx.analysis.legsShorted.length > 0 && !ctx.net.shorted;
      },
      detail:
        "센서의 단자 두 개가 같은 마디에 있습니다. 브레드보드의 «같은 열» 에 두 다리를 꽂으면 " +
        "이렇게 됩니다. 두 단자가 붙어 버려 서로 다른 값을 가질 수 없습니다.",
      fix: "브레드보드는 가운데 홈을 사이에 두고 열이 나뉩니다. 네 단자를 «서로 다른 열» 에 꽂으세요."
    },
    {
      code: "reverse-rail",
      title: "전원·접지 레일 역결선",
      effect: "부품 손상 위험",
      test: function (ctx) {
        var bad = false;
        ctx.connections.forEach(function (c) {
          var a = terminal(c.fromComponent, c.fromPin);
          var b = terminal(c.toComponent, c.toPin);
          if (!a || !b) return;

          var ends = [
            { pin: a, comp: c.fromComponent },
            { pin: b, comp: c.toComponent }
          ];
          var unoEnd = ends.filter(function (e) {
            return e.comp === "uno";
          })[0];
          var railEnd = ends.filter(function (e) {
            return e.pin.kind === "rail";
          })[0];
          if (!unoEnd || !railEnd) return;

          if (unoEnd.pin.id === "5V" && railEnd.pin.polarity === "minus") bad = true;
          if (unoEnd.pin.kind === "ground" && railEnd.pin.polarity === "plus") bad = true;
        });
        return bad;
      },
      detail: "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다.",
      fix: "빨간 줄(+) 에는 5V 를, 파란 줄(−) 에는 GND 를 연결하세요."
    }
  ];

  /**
   * 위험·오류 연결을 모두 찾는다.
   * 「전원을 막는 것」과 「측정이 안 될 뿐인 것」을 함께 돌려주되 effect 로 구분한다.
   */
  function dangers(connections) {
    var ctx = {
      connections: connections || [],
      net: solve(connections),
      analysis: analyze(connections)
    };
    return DANGER_RULES.filter(function (rule) {
      return rule.test(ctx);
    }).map(function (rule) {
      return {
        code: rule.code,
        title: rule.title,
        effect: rule.effect,
        detail: rule.detail,
        fix: rule.fix
      };
    });
  }

  /** 전원을 켜도 되는가 — 위험이 하나라도 있으면 막는다(명세 6.3 여섯 번째 줄) */
  function canPowerOn(connections) {
    var found = dangers(connections);
    var check = checkCircuit(connections);
    if (found.length > 0) return { ok: false, reason: "danger", dangers: found, check: check };
    if (!check.ok) return { ok: false, reason: "incomplete", dangers: [], check: check };
    return { ok: true, reason: "", dangers: [], check: check };
  }

  /**
   * 지금 회로에서 센서가 «무엇까지 할 수 있는가» (명세 6.5 다섯 번째 줄)
   *
   * ★★ 이 차시의 알맹이다 — 「펄스 발사 실패」와 「반사 시간 읽기 실패」를 «갈라» 알린다.
   *   두 오류의 원인이 다르므로 화면에 나오는 말도 달라야 한다.
   *
   *   code : 학생 코드가 정한 핀과 pinMode  { trigPin, echoPin, trigMode, echoMode }
   *          (arduino.js 가 뽑아 준다. 없으면 회로만으로 판정한다)
   *
   * 돌려주는 것 : { powered, canPulse, canRead, reason, text }
   */
  function sensorState(connections, code) {
    var a = analyze(connections);
    var c = code || {};

    if (a.shortCircuit) {
      return { powered: false, canPulse: false, canRead: false, reason: "short", text: "단락 — 전원이 차단되었습니다." };
    }
    if (a.powerReversed) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "reversed",
        text: "VCC·GND 가 거꾸로 꽂혀 있습니다. 센서에 전원을 넣을 수 없습니다."
      };
    }
    if (!a.vccOk && !a.gndOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-power",
        text: "센서에 전원이 들어오지 않았습니다. VCC 와 GND 를 먼저 이으세요."
      };
    }
    if (!a.vccOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-vcc",
        text: "VCC 가 " + PINS.vcc + " 에 이어지지 않아 센서가 켜지지 않습니다."
      };
    }
    if (!a.gndOk) {
      return {
        powered: false,
        canPulse: false,
        canRead: false,
        reason: "no-gnd",
        text: "GND 가 이어지지 않아 전류가 돌아갈 길이 없습니다. 센서가 켜지지 않습니다."
      };
    }

    /* 전원은 들어왔다. 이제 신호 두 줄을 «따로» 본다. */
    var trigWired = a.trigOk;
    var echoWired = a.echoOk;

    /* 코드가 정한 핀이 회로와 같은가 — 다르면 그 줄만 실패한다 */
    var codeTrigOk = c.trigPin === undefined || c.trigPin === null ? true : pinName(c.trigPin) === PINS.trig;
    var codeEchoOk = c.echoPin === undefined || c.echoPin === null ? true : pinName(c.echoPin) === PINS.echo;
    var modeTrigOk = c.trigMode === undefined ? true : c.trigMode === "OUTPUT";
    var modeEchoOk = c.echoMode === undefined ? true : c.echoMode === "INPUT" || c.echoMode === "INPUT_PULLUP";

    var canPulse = trigWired && codeTrigOk && modeTrigOk;
    var canRead = echoWired && codeEchoOk && modeEchoOk;

    if (!canPulse) {
      return {
        powered: true,
        canPulse: false,
        canRead: canRead,
        reason: !trigWired ? "trig-wire" : !codeTrigOk ? "trig-code" : "trig-mode",
        text:
          "펄스 발사 실패 — " +
          (!trigWired
            ? "Trig 가 " + PINS.trig + " 에 이어지지 않았습니다."
            : !codeTrigOk
            ? "코드의 trigPin(" + pinName(c.trigPin) + ") 이 회로의 Trig(" + PINS.trig + ") 와 다릅니다."
            : "Trig 핀을 pinMode(…, OUTPUT) 으로 정하지 않았습니다.")
      };
    }
    if (!canRead) {
      return {
        powered: true,
        canPulse: true,
        canRead: false,
        reason: !echoWired ? "echo-wire" : !codeEchoOk ? "echo-code" : "echo-mode",
        text:
          "반사 시간 읽기 실패 — " +
          (!echoWired
            ? "Echo 가 " + PINS.echo + " 에 이어지지 않았습니다."
            : !codeEchoOk
            ? "코드의 echoPin(" + pinName(c.echoPin) + ") 이 회로의 Echo(" + PINS.echo + ") 와 다릅니다."
            : "Echo 핀을 pinMode(…, INPUT) 으로 정하지 않았습니다.")
      };
    }

    return {
      powered: true,
      canPulse: true,
      canRead: true,
      reason: "ready",
      text: "센서가 준비되었습니다 — " + PINS.trig + " 로 펄스를 보내고 " + PINS.echo + " 에서 시간을 읽습니다."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 코드 핀과 회로 핀 대조 (명세 6.3 마지막 줄)                          */
  /* ------------------------------------------------------------------ */

  /** 코드가 적은 핀 값을 보드 단자 이름으로 (6 → "D6", "A0" → "A0") */
  function pinName(value) {
    var s = String(value);
    if (/^A\d$/i.test(s)) return s.toUpperCase();
    if (/^\d+$/.test(s)) return "D" + s;
    return s;
  }

  /**
   * 코드가 쓰는 핀 번호와 실제로 결선된 핀이 다른지 본다.
   *
   *   codeInfo : { trigPin, echoPin, pins:[{pin,line,call}] }  — arduino.js 가 뽑아 준다
   *
   * ★★ 이 차시의 요구 (명세 6.3 마지막 줄)
   *   「코드 Trig D8, 회로 Trig D6 불일치」 처럼 **구실까지 함께** 적는다.
   *   3차시는 핀이 하나였으므로 「코드 D8, 회로 D11」 로 충분했지만,
   *   여기는 신호선이 둘이라 «어느 쪽이 어긋났는지» 를 밝혀야 학생이 고칠 곳을 안다.
   */
  function pinMismatch(codeInfo, connections) {
    var info = codeInfo || {};
    /* 옛 부름(배열 하나만 넘기던 방식)도 그대로 받는다 */
    if (Array.isArray(codeInfo)) info = { pins: codeInfo };

    var a = analyze(connections);
    var problems = [];

    var roles = [
      { key: "trigPin", role: "Trig", goal: PINS.trig, wired: a.trigWired, ok: a.trigOk },
      { key: "echoPin", role: "Echo", goal: PINS.echo, wired: a.echoWired, ok: a.echoOk }
    ];

    roles.forEach(function (r) {
      var codeValue = info[r.key];
      if (codeValue === undefined || codeValue === null) {
        problems.push({
          kind: "missing",
          role: r.role,
          codePin: "",
          circuitPin: r.goal,
          line: 0,
          message: "코드에서 " + r.role + " 로 쓸 핀 번호를 찾지 못했습니다. 맨 위에 숫자로 적어 주세요."
        });
        return;
      }
      var codeName = pinName(codeValue);

      /* 회로가 그 구실로 이어진 핀 이름 (없으면 빈 문자열) */
      var circuitName = r.wired.length > 0 ? r.wired.join(", ") : "";

      if (!r.ok) {
        problems.push({
          kind: "not-wired",
          role: r.role,
          codePin: codeName,
          circuitPin: circuitName,
          line: 0,
          message: circuitName
            ? "코드 " + r.role + " " + codeName + ", 회로 " + r.role + " " + circuitName + " 불일치 — 둘을 " + r.goal + " 로 맞추세요."
            : "회로에서 센서 " + r.role + " 가 아직 " + r.goal + " 에 이어지지 않았습니다."
        });
        return;
      }

      if (codeName !== r.goal) {
        problems.push({
          kind: "mismatch",
          role: r.role,
          codePin: codeName,
          circuitPin: r.goal,
          line: 0,
          message: "코드 " + r.role + " " + codeName + ", 회로 " + r.role + " " + r.goal + " 불일치"
        });
      }
    });

    /* 코드가 같은 핀을 Trig 와 Echo 로 함께 쓰는 경우 */
    if (
      info.trigPin !== undefined && info.trigPin !== null &&
      info.echoPin !== undefined && info.echoPin !== null &&
      pinName(info.trigPin) === pinName(info.echoPin)
    ) {
      problems.push({
        kind: "same-pin",
        role: "Trig·Echo",
        codePin: pinName(info.trigPin),
        circuitPin: "",
        line: 0,
        message:
          "trigPin 과 echoPin 이 같은 핀(" + pinName(info.trigPin) + ") 입니다. " +
          "보내는 핀과 받는 핀은 달라야 합니다."
      });
    }

    return problems;
  }

  /* ------------------------------------------------------------------ */

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.circuit = {
    PITCH: PITCH,
    HEADER_PITCH: HEADER_PITCH,
    UNO: UNO,
    BB: BB,
    SONIC: SONIC,
    COMPONENTS: COMPONENTS,
    PARTS: PARTS,
    SENSOR_PINS: SENSOR_PINS,
    GOAL_PIN: GOAL_PIN,
    PINS: PINS,
    TRIG_PIN_NAME: TRIG_PIN_NAME,
    ECHO_PIN_NAME: ECHO_PIN_NAME,
    REQUIRED: REQUIRED,
    GOAL: GOAL,
    FIND_TASKS: FIND_TASKS,
    DANGER_RULES: DANGER_RULES,
    KIND_WORD: KIND_WORD,
    pinTitle: pinTitle,
    labelOf: labelOf,
    terminal: terminal,
    describe: describe,
    nodeOf: nodeOf,
    nodeLabel: nodeLabel,
    unoNamesAt: unoNamesAt,
    makeConnection: makeConnection,
    suggestColor: suggestColor,
    connectionKey: connectionKey,
    sameConnection: sameConnection,
    hasConnection: hasConnection,
    solve: solve,
    analyze: analyze,
    floatingLeads: floatingLeads,
    danglingLeads: floatingLeads,
    strayWires: strayWires,
    isWired: isWired,
    wireSides: wireSides,
    sensorState: sensorState,
    checkFind: checkFind,
    checkCircuit: checkCircuit,
    hintFor: hintFor,
    goalStatus: goalStatus,
    describeCurrent: describeCurrent,
    dangers: dangers,
    canPowerOn: canPowerOn,
    pinName: pinName,
    pinMismatch: pinMismatch
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.circuit;
})();

/**
 * 아두이노 코드 해석기와 시뮬레이터 (명세 6.4 · 6.5)
 *
 * ★ 브라우저에서 학생 코드를 «실행하지 않는다». eval 도 new Function 도 쓰지 않는다.
 *   허용한 Arduino 구문만 직접 읽어 내(파싱) 상태 모델 위에서 흉내 낸다(명세 6.4).
 *
 * 다루는 범위

         *   delay(400) 처럼 세미콜론을 빠뜨리면 파서는 다음 줄의 «}» 에서야 알아챈다.
         *   그런데 학생이 고쳐야 할 줄은 «}» 가 아니라 delay 가 적힌 줄이다.
         *   찾은 자리를 그대로 알리면 멀쩡한 줄을 들여다보며 헤매게 된다.
         */
        var line = t.line;
        if (value === ";" && pos > 0 && tokens[pos - 1] && tokens[pos - 1].line < t.line) {
          line = tokens[pos - 1].line;
        }

        throw new ParseError(
          (what || "«" + value + "»") + " 가 있어야 하는 자리에 " + got + " 이(가) 있습니다.",
          line,
          value === ";" ? "semicolon" : value === "}" || value === "{" ? "brace" : "syntax"
        );
      }
      return next();
    }

    /* ----- 식(expression) : 우선순위가 낮은 것부터 ----- */

    function parseExpression() {
      return parseOr();
    }
    function parseOr() {
      var left = parseAnd();
      while (at("op", "||")) {
        var line = next().line;
        left = { kind: "binary", op: "||", left: left, right: parseAnd(), line: line };
      }
      return left;
    }
    function parseAnd() {
      var left = parseEquality();
      while (at("op", "&&")) {
        var line = next().line;
        left = { kind: "binary", op: "&&", left: left, right: parseEquality(), line: line };
      }
      return left;
    }
    function parseEquality() {
      var left = parseComparison();
      while (at("op", "==") || at("op", "!=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseComparison(), line: t.line };
      }
      return left;
    }
    function parseComparison() {
      var left = parseAdditive();
      while (at("op", "<") || at("op", ">") || at("op", "<=") || at("op", ">=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseAdditive(), line: t.line };
      }
      return left;
    }
    function parseAdditive() {
      var left = parseMultiplicative();
      while (at("op", "+") || at("op", "-")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseMultiplicative(), line: t.line };
      }
      return left;
    }
    function parseMultiplicative() {
      var left = parseUnary();
      while (at("op", "*") || at("op", "/") || at("op", "%")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseUnary(), line: t.line };
      }
      return left;
    }
    function parseUnary() {
      if (at("op", "!") || at("op", "-")) {
        var t = next();
        return { kind: "unary", op: t.value, arg: parseUnary(), line: t.line };
      }
      return parsePrimary();
    }

    function parseArguments() {
      var args = [];
      expect("punct", "(", "여는 괄호 «(»");
      if (!at("punct", ")")) {
        args.push(parseExpression());
        while (at("punct", ",")) {
          next();
          args.push(parseExpression());
        }
      }
      expect("punct", ")", "닫는 괄호 «)»");
      return args;
    }

    function parsePrimary() {
      var t = peek();

      if (t.type === "number") {
        next();
        return { kind: "number", value: t.value, line: t.line };
      }
      if (t.type === "string") {
        next();
        return { kind: "string", value: t.value, line: t.line };
      }
      if (at("punct", "(")) {
        next();
        var inner = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        return inner;
      }
      if (t.type === "name" || (t.type === "keyword" && t.value === "true") || (t.type === "keyword" && t.value === "false")) {
        next();
        var name = t.value;

        /* Serial.println(...) 처럼 «점» 으로 이어지는 호출 */
        if (at("punct", ".")) {
          next();
          var member = expect("name", undefined, "함수 이름").value;
          var args = parseArguments();
          return { kind: "call", target: name, name: member, args: args, line: t.line };
        }
        if (at("punct", "(")) {
          var callArgs = parseArguments();
          return { kind: "call", target: "", name: name, args: callArgs, line: t.line };
        }
        /* 배열 읽기 :  notes[i]  ·  notes[0]  (명세 8장 기준 프로그램) */
        if (at("punct", "[")) {
          next();
          var indexExpr = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          return { kind: "index", name: name, index: indexExpr, line: t.line };
        }
        if (Object.prototype.hasOwnProperty.call(CONSTANTS, name)) {
          return { kind: "constant", name: name, value: CONSTANTS[name], line: t.line };
        }
        return { kind: "variable", name: name, line: t.line };
      }

      throw new ParseError(
        t.type === "eof" ? "코드가 갑자기 끝났습니다. 빠진 부분이 있는지 살펴보세요." : "여기에 «" + t.value + "» 이(가) 올 수 없습니다.",
        t.line,
        "syntax"
      );
    }

    /* ----- 문장(statement) ----- */

    function parseBlock() {
      var open = expect("punct", "{", "여는 중괄호 «{»");
      var body = [];
      while (!at("punct", "}")) {
        if (at("eof")) {
          throw new ParseError(
            "중괄호 «{» 를 닫지 않았습니다. " + open.line + "번 줄에서 열린 괄호에 짝이 되는 «}» 를 적어 주세요.",
            open.line,
            "brace"
          );
        }
        body.push(parseStatement());
      }
      expect("punct", "}", "닫는 중괄호 «}»");
      return body;
    }

    function parseStatement() {
      var t = peek();

      /* if / else */
      if (t.type === "keyword" && t.value === "if") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        var cond = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        var thenBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        var elseBody = null;
        if (peek().type === "keyword" && peek().value === "else") {
          next();
          if (peek().type === "keyword" && peek().value === "if") elseBody = [parseStatement()];
          else elseBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        }
        return { kind: "if", cond: cond, then: thenBody, otherwise: elseBody, line: t.line };
      }

      /* 되풀이 :  for (int i=0; i<8; i++) { ... }   (명세 4장 · 8장) */
      if (t.type === "keyword" && t.value === "for") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        /* ① 처음에 한 번 : int i = 0;  (세미콜론까지 parseStatement 가 먹는다) */
        var init = at("punct", ";") ? null : parseStatement();
        if (init === null) next();
        /* ② 언제까지 : i < 8 */
        var cond = at("punct", ";") ? null : parseExpression();
        expect("punct", ";", "세미콜론 «;»");
        /* ③ 한 바퀴마다 : i++  (여기에는 세미콜론이 없다) */
        var stepStmt = null;
        if (!at("punct", ")")) {
          var vTok = expect("name", undefined, "변수 이름");
          var sOp = next();
          if (["=", "+=", "-=", "++", "--"].indexOf(sOp.value) === -1) {
            throw new ParseError(
              "for 의 셋째 자리에는 i++ 처럼 «값을 바꾸는 식» 을 적습니다.",
              sOp.line,
              "syntax"
            );
          }
          var stepValue;
          if (sOp.value === "++" || sOp.value === "--") {
            stepValue = {
              kind: "binary",
              op: sOp.value === "++" ? "+" : "-",
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: { kind: "number", value: 1, line: vTok.line },
              line: vTok.line
            };
          } else if (sOp.value === "+=" || sOp.value === "-=") {
            stepValue = {
              kind: "binary",
              op: sOp.value.charAt(0),
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: parseExpression(),
              line: vTok.line
            };
          } else {
            stepValue = parseExpression();
          }
          stepStmt = { kind: "assign", name: vTok.value, value: stepValue, line: vTok.line };
        }
        expect("punct", ")", "닫는 괄호 «)»");
        var forBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        return { kind: "for", init: init, cond: cond, step: stepStmt, body: forBody, line: t.line };
      }

      /* 변수 선언 :  int x = 5;  /  const int PIN = 13;  /  int notes[] = {…}; */
      if (t.type === "keyword" && (t.value === "const" || TYPES.indexOf(t.value) !== -1)) {
        var isConst = false;
        if (t.value === "const") {
          next();
          isConst = true;
        }
        if (peek().type === "keyword" && peek().value === "unsigned") next();
        var typeTok = peek();
        if (typeTok.type !== "keyword" || TYPES.indexOf(typeTok.value) === -1) {
          throw new ParseError("자료형(int, long, float, bool …) 이 있어야 합니다.", typeTok.line, "syntax");
        }
        next();
        var nameTok = expect("name", undefined, "변수 이름");

        /* ★ 배열 선언 :  int notes[] = {523, 587, …};  또는 int notes[8] = {…}; */
        if (at("punct", "[")) {
          next();
          var sized = null;
          if (!at("punct", "]")) sized = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          var items = [];
          if (at("op", "=")) {
            next();
            expect("punct", "{", "여는 중괄호 «{»");
            if (!at("punct", "}")) {
              items.push(parseExpression());
              while (at("punct", ",")) {
                next();
                /* {1, 2, 3, } 처럼 쉼표 뒤에 바로 닫는 것도 봐준다 */
                if (at("punct", "}")) break;
                items.push(parseExpression());
              }
            }
            expect("punct", "}", "닫는 중괄호 «}»");
          }
          expect("punct", ";", "세미콜론 «;»");
          return {
            kind: "declare-array",
            name: nameTok.value,
            varType: typeTok.value,
            isConst: isConst,
            size: sized,
            items: items,
            line: t.line
          };
        }

        var init2 = null;
        if (at("op", "=")) {
          next();
          init2 = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return {
          kind: "declare",
          name: nameTok.value,
          varType: typeTok.value,
          isConst: isConst,
          init: init2,
          line: t.line
        };
      }

      /* 함수 정의가 함수 안에 들어온 경우 — 흔한 실수라 따로 알려 준다 */
      if (t.type === "keyword" && t.value === "void") {
        throw new ParseError(
          "함수 안에 또 다른 함수를 만들 수 없습니다. 앞의 «}» 를 빠뜨리지 않았는지 보세요.",
          t.line,
          "brace"
        );
      }

      /* 대입 :  x = 5;   x += 1;   x++; */
      if (t.type === "name" && peek(1).type === "op" && ["=", "+=", "-=", "++", "--"].indexOf(peek(1).value) !== -1) {
        next();
        var opTok = next();
        var value = null;
        if (opTok.value === "++" || opTok.value === "--") {
          value = {
            kind: "binary",
            op: opTok.value === "++" ? "+" : "-",
            left: { kind: "variable", name: t.value, line: t.line },
            right: { kind: "number", value: 1, line: t.line },
            line: t.line
          };
        } else if (opTok.value === "+=" || opTok.value === "-=") {
          value = {
            kind: "binary",
            op: opTok.value.charAt(0),
            left: { kind: "variable", name: t.value, line: t.line },
            right: parseExpression(),
            line: t.line
          };
        } else {
          value = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return { kind: "assign", name: t.value, value: value, line: t.line };
      }

      /* 그 밖에는 «식 하나로 이루어진 문장» — 대개 함수 호출이다 */
      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 이 수업에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 6.4 «검사 항목» · 명세 5장 4단계 통과 조건)           */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond", "index", "step"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      /* body : for·if 안쪽 · items : 배열 선언의 값들 */
      ["then", "otherwise", "args", "body", "items"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** setup() 과 loop() 를 통틀어 그 이름의 호출을 모두 모은다 (적힌 차례대로) */
  function allCalls(ast, fnName) {
    return callsIn(ast, "setup")
      .concat(callsIn(ast, "loop"))
      .filter(function (c) {
        return callName(c) === fnName;
      });
  }

  /**
   * loop() 몸통의 명령을 «적힌 차례대로» 늘어놓는다.
   * if·for 안에 든 것도 함께 센다 — 순서만 지켜 준다.
   */
  function statementCalls(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "express" && stmt.expr && stmt.expr.kind === "call") out.push(stmt.expr);
      else if (stmt.kind === "if") {
        out = out.concat(statementCalls(stmt.then));
        if (stmt.otherwise) out = out.concat(statementCalls(stmt.otherwise));
      } else if (stmt.kind === "for") {
        out = out.concat(statementCalls(stmt.body));
      }
    });
    return out;
  }

  /** 전역에서 «숫자로» 초기화한 이름들 — 핀 번호를 되찾는 데 쓴다 */
  function globalNumbers(ast) {
    var known = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    return known;
  }

  /** 전역에서 «숫자 배열» 로 선언한 이름들 */
  function arraysIn(ast) {
    var out = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare-array") out[g.name] = g.items || [];
    });
    return out;
  }

  /** 인수 하나를 핀 번호로 푼다. 알 수 없으면 null. */
  function resolvePin(node, known) {
    if (!node) return null;
    if (node.kind === "number") return node.value;
    if (node.kind === "constant" && /^A\d$/.test(node.name)) return node.name;
    if (node.kind === "variable" && known[node.name] !== undefined) return known[node.name];
    return null;
  }

  /** HIGH 를 적었는가 (HIGH 상수든 1 이든) */
  function isHighArg(node) {
    if (!node) return false;
    if (node.kind === "constant") return node.name === "HIGH";
    if (node.kind === "number") return node.value === 1;
    return false;
  }

  /**
   * ★★ 코드가 «Trig 와 Echo 로 무엇을 쓰는지» 를 뽑아낸다.
   *
   *   이 차시는 신호선이 «둘» 이라, 핀 번호만 모아서는 어느 쪽이 어긋났는지 알 수 없다.
   *   그래서 구실(role)까지 갈라 뽑는다. 회로 대조(circuit.pinMismatch)와
   *   시뮬레이터(run 의 world) 가 모두 이 값을 본다.
   *
   *   Echo : pulseIn(…) 의 첫 인수 — «시간을 읽는» 핀이 곧 Echo 다.
   *   Trig : digitalWrite 로 HIGH 와 LOW 를 «모두» 써 본 핀 — 펄스를 만드는 핀이다.
   *
   *   ★ 이름(trigPin·echoPin)에 기대지 않는다. 학생이 다른 이름을 붙여도 뜻이 통해야 한다.
   *     찾지 못했을 때에만 «맨 위 선언의 이름» 을 마지막 수단으로 본다.
   *
   * 돌려주는 것 : { trigPin, echoPin, trigMode, echoMode, trigName, echoName, pins }
   */
  function codePins(ast) {
    var known = globalNumbers(ast);
    var info = {
      trigPin: null,
      echoPin: null,
      trigMode: undefined,
      echoMode: undefined,
      trigName: "",
      echoName: "",
      pins: pinsUsed(ast)
    };

    /* ① Echo — pulseIn 의 첫 인수 */
    allCalls(ast, "pulseIn").forEach(function (c) {
      if (info.echoPin !== null) return;
      var a = (c.args || [])[0];
      var pin = resolvePin(a, known);
      if (pin === null) return;
      info.echoPin = pin;
      if (a.kind === "variable") info.echoName = a.name;
    });

    /* ② Trig — digitalWrite 로 HIGH 와 LOW 를 모두 써 본 핀 */
    var seen = [];
    var high = {};
    var low = {};
    var nameOf = {};
    allCalls(ast, "digitalWrite").forEach(function (c) {
      var a = (c.args || [])[0];
      var pin = resolvePin(a, known);
      if (pin === null) return;
      var key = String(pin);
      if (seen.indexOf(key) === -1) seen.push(key);
      if (a.kind === "variable") nameOf[key] = a.name;
      if (isHighArg((c.args || [])[1])) high[key] = pin;
      else low[key] = pin;
    });

    for (var i = 0; i < seen.length; i += 1) {
      if (high[seen[i]] !== undefined && low[seen[i]] !== undefined) {
        info.trigPin = high[seen[i]];
        info.trigName = nameOf[seen[i]] || "";
        break;
      }
    }
    /* HIGH 만이라도 써 본 핀 */
    if (info.trigPin === null) {
      for (var j = 0; j < seen.length; j += 1) {
        if (high[seen[j]] !== undefined) {
          info.trigPin = high[seen[j]];
          info.trigName = nameOf[seen[j]] || "";
          break;
        }
      }
    }
    /* 마지막 수단 — 맨 위 선언의 이름 */
    if (info.trigPin === null && known.trigPin !== undefined) info.trigPin = known.trigPin;
    if (info.echoPin === null && known.echoPin !== undefined) info.echoPin = known.echoPin;

    /* ③ pinMode — 그 핀을 어떤 모드로 정했는가 */
    allCalls(ast, "pinMode").forEach(function (c) {
      var pin = resolvePin((c.args || [])[0], known);
      var m = (c.args || [])[1];
      var mode = m && m.kind === "constant" ? m.name : null;
      if (pin === null || !mode) return;
      if (info.trigPin !== null && String(pin) === String(info.trigPin)) info.trigMode = mode;
      if (info.echoPin !== null && String(pin) === String(info.echoPin)) info.echoMode = mode;
    });

    return info;
  }

  /** 이 코드가 «세상» 을 어떻게 보고 있는가 — 시뮬레이터에 넘길 값 */
  function worldFromCode(ast, extra) {
    var info = codePins(ast);
    var w = extra || {};
    return {
      trigPin: w.trigPin === undefined ? TRIG_PIN : w.trigPin,
      echoPin: w.echoPin === undefined ? ECHO_PIN : w.echoPin,
      powered: w.powered === undefined ? true : w.powered,
      distance: w.distance === undefined ? (PC.DIST_DEFAULT === undefined ? 20 : PC.DIST_DEFAULT) : w.distance,
      angle: w.angle || PC.DEFAULT_ANGLE || "front",
      material: w.material || PC.DEFAULT_MATERIAL || "board",
      seed: w.seed === undefined ? 1 : w.seed,
      code: info
    };
  }

  /**
   * 상수만으로 이루어진 식을 계산해 본다 (변수는 vars 에서 찾는다).
   * 거리 공식을 «돌려 보아» 확인하는 데 쓴다. 알 수 없으면 null.
   */
  function evalConst(node, vars) {
    if (!node) return null;
    switch (node.kind) {
      case "number":
        return node.value;
      case "constant":
        return typeof node.value === "number" ? node.value : null;
      case "variable":
        return Object.prototype.hasOwnProperty.call(vars || {}, node.name) ? vars[node.name] : null;
      case "unary": {
        var v = evalConst(node.arg, vars);
        if (v === null) return null;
        return node.op === "!" ? (v ? 0 : 1) : -v;
      }
      case "binary": {
        var a = evalConst(node.left, vars);
        var b = evalConst(node.right, vars);
        if (a === null || b === null) return null;
        switch (node.op) {
          case "+":
            return a + b;
          case "-":
            return a - b;
          case "*":
            return a * b;
          case "/":
            return b === 0 ? null : a / b;
          case "%":
            return b === 0 ? null : a % b;
          default:
            return null;
        }
      }
      default:
        return null;
    }
  }

  /** 나무 안에 그 이름의 변수가 쓰였는가 */
  function usesVariable(node, name) {
    var found = false;
    (function walk(n) {
      if (!n || typeof n !== "object" || found) return;
      if (n.kind === "variable" && n.name === name) {
        found = true;
        return;
      }
      Object.keys(n).forEach(function (k) {
        var v = n[k];
        if (Array.isArray(v)) v.forEach(walk);
        else if (v && typeof v === "object") walk(v);
      });
    })(node);
    return found;
  }

  /** loop()·setup() 의 모든 문장을 한 줄로 늘어놓는다 (안쪽 블록까지) */
  function flatStatements(ast) {
    var out = [];
    ["setup", "loop"].forEach(function (fnName) {
      var fn = ast && ast.functions ? ast.functions[fnName] : null;
      if (!fn) return;
      (function walk(list) {
        (list || []).forEach(function (stmt) {
          if (!stmt) return;
          out.push(stmt);
          if (Array.isArray(stmt.body)) walk(stmt.body);
          if (Array.isArray(stmt.then)) walk(stmt.then);
          if (Array.isArray(stmt.otherwise)) walk(stmt.otherwise);
        });
      })(fn.body);
    });
    return out;
  }

  /**
   * «pulseIn 의 값을 담은 변수» 와 «그것으로 거리를 구한 문장» 을 찾는다.
   * 돌려주는 것 : { durationName, distanceName, formula, stmt }  (없으면 null 칸)
   */
  function findFormula(ast) {
    var out = { durationName: "", distanceName: "", formula: null, stmt: null };
    var stmts = flatStatements(ast);

    stmts.forEach(function (stmt) {
      if (out.durationName) return;
      var init = stmt.kind === "declare" ? stmt.init : stmt.kind === "assign" ? stmt.value : null;
      if (!init) return;
      var hasPulse = false;
      walkCalls([init], function (c) {
        if (callName(c) === "pulseIn") hasPulse = true;
      });
      if (hasPulse) out.durationName = stmt.name;
    });

    if (!out.durationName) return out;

    stmts.forEach(function (stmt) {
      if (out.formula) return;
      if (stmt.kind !== "declare" && stmt.kind !== "assign") return;
      if (stmt.name === out.durationName) return;
      var value = stmt.kind === "declare" ? stmt.init : stmt.value;
      if (!value || !usesVariable(value, out.durationName)) return;
      out.distanceName = stmt.name;
      out.formula = value;
      out.stmt = stmt;
    });

    return out;
  }

  /**
   * 검사 항목 — 화면에는 이 목록이 «통과/미통과» 로 보인다.
   * 정답 코드를 통째로 보여 주지 않고 «무엇이 빠졌는지» 만 알려 준다.
   *
   * 열 항목 (명세 6.4 «검사 항목» 을 학습 차례로 늘어놓은 것)

   *   ⑤ LOW→HIGH→LOW 차례  ⑥ ★ 돌려 보아 10μs 펄스  ⑦ pulseIn
   *   ⑧ ★ 돌려 보아 거리 공식(2 로 나누기)  ⑨ Serial.println  ⑩ 회로 핀 대조
   *
   * ★ ⑥·⑧ 만 «실제로 돌려» 본다.

   *   delayMicroseconds 대신 delay 를 쓰면 «10ms 펄스» 가 되는 것도,
   *   2 로 나누지 않으면 «값이 정확히 두 배» 가 되는 것도 돌려 보아야 드러난다.

  var TESTS = [
    {
      id: "t-pins",
      label: "trigPin 과 echoPin 을 핀 번호로 선언했다",

        }
        var info = codePins(ast);
        if (info.trigPin === null) {
          return { ok: false, message: "Trig 로 쓸 핀을 찾지 못했습니다. 핀 번호를 «숫자» 로 적어 주세요." };
        }
        if (info.echoPin === null) {
          return { ok: false, message: "Echo 로 쓸 핀을 찾지 못했습니다. 핀 번호를 «숫자» 로 적어 주세요." };
        }
        if (String(info.trigPin) === String(info.echoPin)) {
          return {
            ok: false,
            message:
              "Trig 와 Echo 가 같은 핀(" + info.trigPin + ")입니다. 보내는 핀과 받는 핀은 달라야 합니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-setup",
      label: "setup() 과 loop() 함수가 모두 있다",
      run: function (ast) {
        if (!ast.functions.setup) {
          return { ok: false, message: "void setup() { } 가 없습니다. 처음 한 번만 할 일을 여기에 적습니다." };
        }
        if (!ast.functions.loop) {
          return {
            ok: false,
            message:
              "void loop() { } 가 없습니다. 거리는 «되풀이해서» 재야 하므로 측정하는 코드는 loop() 안에 적습니다."
          };
        }
        if ((ast.functions.loop.body || []).length === 0) {
          return {
            ok: false,
            message: "loop() 가 비어 있습니다. 거리를 재는 코드는 되풀이되어야 하므로 loop() 안에 적습니다."

        return { ok: true };
      }
    },
    {
      id: "t-serial",
      label: "Serial.begin(9600) 으로 시리얼 모니터를 열었다",
      run: function (ast) {
        var opens = allCalls(ast, "Serial.begin");
        if (opens.length === 0) {
          return {
            ok: false,
            message:
              "Serial.begin(9600); 이 없습니다. 이 줄이 없으면 시리얼 모니터에 아무것도 보이지 않습니다."
          };
        }
        var speed = (opens[0].args || [])[0];
        var value = speed && speed.kind === "number" ? speed.value : null;
        if (value !== 9600) {
          return {
            ok: false,
            message:
              "Serial.begin 의 값이 " + (value === null ? "숫자가 아닙니다" : value + " 입니다") +
              ". 이 수업에서는 9600 으로 맞춥니다 — 시리얼 모니터의 속도와 같아야 글자가 깨지지 않습니다."
          };
        }
        var inSetup = callsIn(ast, "setup").some(function (c) {
          return callName(c) === "Serial.begin";
        });
        if (!inSetup) {
          return {
            ok: false,
            message: "Serial.begin 은 «한 번만» 하면 되므로 setup() 안에 적습니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-mode",
      label: "pinMode 로 Trig 는 OUTPUT, Echo 는 INPUT 으로 정했다",
      run: function (ast) {
        var info = codePins(ast);
        var modes = allCalls(ast, "pinMode");
        if (modes.length === 0) {
          return {
            ok: false,
            message:
              "pinMode 가 없습니다. 핀마다 «내보낼 것인가 받을 것인가» 를 먼저 정해야 합니다."
          };
        }
        if (info.trigMode === undefined) {
          return {
            ok: false,
            message: "Trig 핀의 pinMode 를 정하지 않았습니다. Trig 는 신호를 «보내는» 핀입니다."
          };
        }
        if (info.trigMode !== "OUTPUT") {
          return {
            ok: false,
            message:
              "Trig 를 " + info.trigMode + " 로 정했습니다. Trig 는 아두이노가 «내보내는» 핀이므로 OUTPUT 입니다."
          };
        }
        if (info.echoMode === undefined) {
          return {
            ok: false,
            message: "Echo 핀의 pinMode 를 정하지 않았습니다. Echo 는 센서가 알려 주는 값을 «받는» 핀입니다."
          };
        }
        if (info.echoMode !== "INPUT" && info.echoMode !== "INPUT_PULLUP") {
          return {
            ok: false,
            message:
              "Echo 를 " + info.echoMode + " 로 정했습니다. Echo 는 센서가 보내 주는 신호를 «받는» 핀이므로 INPUT 입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-order",
      label: "Trig 를 LOW → HIGH → LOW 차례로 바꾼다",
      run: function (ast) {
        var info = codePins(ast);
        if (info.trigPin === null) return { ok: false, message: "먼저 Trig 핀을 정해 주세요." };
        var known = globalNumbers(ast);

        /* Trig 핀에 쓴 값만 «적힌 차례대로» 모은다 */
        var seq = [];
        ["setup", "loop"].forEach(function (fnName) {
          var fn = ast.functions[fnName];
          if (!fn) return;
          statementCalls(fn.body).forEach(function (c) {
            if (callName(c) !== "digitalWrite") return;
            var pin = resolvePin((c.args || [])[0], known);
            if (pin === null || String(pin) !== String(info.trigPin)) return;
            seq.push({ high: isHighArg((c.args || [])[1]), line: c.line });
          });
        });

        if (seq.length === 0) {
          return {
            ok: false,
            message: "digitalWrite 로 Trig 를 움직이지 않았습니다. 펄스는 HIGH·LOW 를 바꾸어 만듭니다."
          };
        }
        var highAt = -1;
        for (var i = 0; i < seq.length; i += 1) {
          if (seq[i].high) {
            highAt = i;
            break;
          }
        }
        if (highAt === -1) {
          return { ok: false, message: "Trig 를 HIGH 로 올린 적이 없습니다. 펄스를 시작하는 줄이 빠졌습니다." };
        }
        var lowAfter = seq.slice(highAt + 1).some(function (s) {
          return !s.high;
        });
        if (!lowAfter) {
          return {
            ok: false,
            message:
              "HIGH 로 올린 뒤 다시 LOW 로 내리지 않았습니다. 내리지 않으면 «펄스» 가 아니라 " +
              "계속 HIGH 인 상태가 되어 센서가 한 번만 반응합니다."
          };
        }
        if (highAt === 0) {
          return {
            ok: false,
            message:
              "HIGH 앞에 LOW 가 없습니다. 재기 전에 digitalWrite(trigPin, LOW); 로 " +
              "핀을 «가라앉혀» 두어야 펄스의 시작이 또렷해집니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pulse",
      label: "★ 돌려 보니 Trig 펄스가 " + TRIG_PULSE_US + "μs 이상이다",
      run: function (ast, ctx) {
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var info = codePins(ast);
        var result = run(source, {
          loopLimit: 1,
          world: worldFromCode(ast, {
            trigPin: info.trigPin === null ? TRIG_PIN : info.trigPin,
            echoPin: info.echoPin === null ? ECHO_PIN : info.echoPin
          })
        });
        if (result.error) return { ok: false, message: result.error.message };

        var mine = (result.sensor.pulses || []).filter(function (p) {

        });
        if (mine.length === 0) {
          return {
            ok: false,
            message: "돌려 보니 Trig 에 펄스가 한 번도 만들어지지 않았습니다. HIGH 뒤에 LOW 가 와야 «한 번» 으로 셉니다."

        var us = mine[0].us;

          };

        if (us < TRIG_PULSE_US) {

          };
        }
        return { ok: true };
      }
    },

    {

        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0) {
