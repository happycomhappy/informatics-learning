    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverCreatedAt = list[found].serverCreatedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverCreatedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverCreatedAt: record.serverCreatedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      /* 명세 7장 — 서버는 created 로 알린다. updated 는 그 반대다. */
      created: found < 0,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverCreatedAt, serverUpdatedAt, created, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverCreatedAt: data.serverCreatedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverCreatedAt || "",
            /* ★ 명세 7장의 성공 응답은 created 다.
               옛 판이 보내던 updated 도 그대로 받아 준다(둘 다 없으면 «새로 만든 것» 으로 본다). */
            updated: data.created === false || data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();

    <script data-from="student/s40-board.js">
/**
 * 회로 그림과 조작 (명세 6.1 · 13장)
 *
 * 부품 그림은 «자체 SVG» 로 그린다. 사진을 베끼지 않는다(명세 13장).
 * 그리는 좌표는 shared/circuit.js 가 갖고 있고, 여기서는 그 좌표대로 그리기만 한다.
 *
 * 세 가지 방식으로 모두 조작할 수 있어야 한다 (명세 13장)
 *   마우스 · 터치 : 단자를 차례로 누른다
 *   키보드        : 화살표로 단자 사이를 옮기고 Enter 로 고른다.
 *                  더 빠른 길로 «목록에서 골라 잇기» 도 함께 둔다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  /**
   * 케이블 색.
   *
   * ★ 검정은 청록 보드와 검은 헤더 위에서 잘 보이지 않았다(선생님 지적).
   *   명세 6.1 이 GND 를 «검정/파랑» 으로 허용한다.
   *
   * ★★ Trig 신호선의 색은 두 번 바뀌었다.
   *     주황(#ea580c) → 분홍(#db2777) → 노랑(#e3a008, 2026-08-22)
   *   주황은 전원의 빨강과 너무 닮아서, 넷을 한자리에 놓고 보면
   *   «빨강인지 주황인지» 갈라보기 어려웠다. 분홍도 선생님 눈에는 빨강 쪽이었다.
   *   노랑은 빨강·파랑·초록 셋 모두와 확실히 갈라진다.
   *
   * ★ 노랑은 넷 가운데 밝은 바탕에서 가장 옅다. 그래도 뜻이 사라지지는 않는다 —
   *   케이블 목록과 범례가 «노랑» 이라는 낱말을 늘 함께 적기 때문이다(명세 13장).
   *   색을 판정에 쓰지 않는다는 것이 이 차시의 규칙이다.
   *
   * ★ 색을 고칠 때는 tokens.css 의 --lane-trig 도 함께 고친다.
   *   여기는 «케이블» 색이고 그쪽은 «센서 다리» 색이라 두 곳이다.
   */
  var WIRE_COLORS = {
    red: "#d63b2f",
    black: "#22262c",
    /* 실제로 쓰는 두 가지 */
    yellow: "#e3a008",
    blue: "#1d4ed8",
    /* 이 차시에서 늘어난 넷째 갈래 — Echo 신호선 */
    green: "#15803d",
    /* 회로에 쓰이지 않는 케이블 — 흐리게 두어 «이건 빠져 있다» 가 보이게 */
    gray: "#9aa3ae"
  };

  /**
   * 케이블 색을 말로 — 색만으로 뜻을 전하지 않기 위해(명세 13장).
   *
   * ★★ SIDE_COLOR 가 쓰는 색은 «빠짐없이» 여기 있어야 한다.
   *   green 이 빠져 있어서 Echo 줄의 낱말 칸이 «빈 칸» 으로 나왔다(2026-08-22).
   *   색약인 학생에게는 그 줄이 아무 뜻도 없는 줄이 된다.
   *   `dist.test.js` 의 「★★ 케이블 색마다 «낱말» 이 있다」 가 이것을 지킨다.
   */
  var COLOR_WORD = {
    red: "빨강",
    black: "검정",
    yellow: "노랑",
    blue: "파랑",
    green: "초록",
    gray: "회색"
  };

  /**
   * ★ 케이블 색은 «회로의 어느 갈래인가» 로 정한다.
   *
   *   5V   → 센서 VCC    빨강   (전원)
   *   센서 GND → GND     파랑   (접지)
   *   Trig 신호선         노랑   (내보내는 신호)
   *   Echo 신호선         초록   (받는 신호)
   *
   *   ★ 3차시는 갈래가 둘이었지만 이 차시는 «넷» 이다(명세 4장).
   *     두 끝만 보고 색을 정하면 가운데 케이블(브레드보드를 거치는 사이)이
   *     어느 갈래인지 알 수 없으므로, circuit.wireSides() 가 회로 전체를 보고 정한다.
   *
   *   ★★ 색은 판정에 쓰지 않는다(명세 6.3 세 번째 줄).
   *     넷을 색만으로 가리면 색약인 학생이 읽을 수 없으므로
   *     케이블 목록에 «전원/접지/Trig/Echo» 글자를 반드시 함께 적는다(명세 11장).
   */
  var SIDE_COLOR = { power: "red", ground: "blue", trig: "yellow", echo: "green", "": "gray" };
  var SIDE_WORD = {
    power: "전원 (5V → VCC)",
    ground: "접지 (GND → GND)",
    trig: "Trig 신호선",
    echo: "Echo 신호선",
    "": "쓰이지 않음"
  };

  /**
   * 그림 폭을 정한다 — 이 계산은 «한 곳» 에만 둔다.
   *
   * 폭을 픽셀로 직접 적는 까닭 : CSS 의 min-width 와 함께 쓰면
   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   *
   * 좁은 칸에서는 바닥값을 두어 단자가 손가락보다 작아지지 않게 한다(명세 6.1).
   * 그래도 [−] 로 줄이면 전체를 한눈에 볼 수 있다.
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    var available = host.clientWidth || 320;
    var base = available < 560 ? Math.max(available, 640) : available;
    svgNode.style.width = Math.round(base * zoom) + "px";
  }

  /**
   * 창 크기가 바뀌면 폭을 다시 맞춘다.
   *
   * 픽셀로 적어 둔 폭은 창이 바뀌어도 그대로 남는다.
   * 그러면 화면을 돌리거나 창을 줄였을 때 단자가 손가락보다 작아진 채로 있다.
   * 그림마다 듣는 이를 붙이면 화면을 다시 그릴 때 쌓이므로, «한 번만» 붙이고
   * 그때그때 화면에 놓인 그림을 찾아 고친다.
   */
  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /**
   * 회로 화면 하나를 만든다.
   *
   *   opts.mode        'find'(단자 찾기) · 'wire'(결선)
   *   opts.showBoard   우노를 보일 것인가 (기본 true)
   *   opts.showBread   브레드보드를 보일 것인가
   *   opts.getState    () => 회로 상태 { connections, powerOn, ... }
   *   opts.onPick      (component, pin) => void        — 단자를 하나 눌렀을 때 (find 모드)
   *   opts.onConnect   (connection) => void            — 케이블이 하나 생겼을 때
   *   opts.onMessage   (text) => void                  — 안내 문구를 바깥에 알릴 때

  function create(opts) {
    var o = opts || {};
    var mode = o.mode || "wire";
    var showBoard = o.showBoard !== false;
    var showBread = o.showBread === true;
    /* 이 차시에는 초음파 센서가 있다. 3A(찾기)와 3B(결선) 모두 부품을 보여 준다. */
    var showParts = o.showParts !== false;

    var zoom = 1;
    var pending = null; /* 첫 번째로 고른 단자 */

    /**
     * ★ 끌어서 잇기 (명세 6.3 두 번째 줄 — 클릭-클릭 · 드래그 · 키보드 셋 다)
     *
     *   dragFrom : 끌기를 시작한 단자. 끌고 있는 동안만 값이 있다.
     *   rubber   : 손가락(또는 마우스)을 따라가는 «고무줄» 선.
     *
     *   ★★ 포인터 이벤트 하나로 마우스와 손가락을 함께 받는다.
     *     HTML5 draggable + dragstart 는 손가락에서 동작하지 않는다 —
     *     교실 태블릿에서 못 쓰므로 쓰지 않는다(코드 조립도 같은 까닭으로 그렇게 했다).
     *
     *   ★ 끌기와 클릭-클릭이 서로 방해하지 않아야 한다.
     *     끌다가 «거의 움직이지 않고» 손을 떼면 그것은 끌기가 아니라 «누른 것» 이다.
     *     그래서 8px 을 넘게 움직인 뒤에만 끌기로 보고, 아니면 click 에 넘긴다.
     */
    var dragFrom = null;
    var dragMoved = false;
    var rubber = null;
    var focusKey = showBoard ? "uno/" + C.PINS.trig : showBread ? "bb/TP-1" : "sonic/TRIG";

    var svgHost = UI.el("div", { class: "board__canvas" });
    var statusLine = UI.el("p", {
      class: "board__status",
      attrs: { role: "status", "aria-live": "polite" },
      text: ""
    });

    /* ------------------------------------------------------------------ */
    /* 그리기                                                              */
    /* ------------------------------------------------------------------ */

    function keyOf(componentId, pinId) {
      return componentId + "/" + pinId;
    }

    function splitKey(key) {
      var i = String(key).indexOf("/");
      return { component: key.slice(0, i), pin: key.slice(i + 1) };
    }

    /** 지금 이 단자가 선택 상태인가 */
    function isPending(componentId, pinId) {
      return pending && pending.component === componentId && pending.pin === pinId;
    }

    /** 화면 낭독기가 읽을 단자 설명 */
    function terminalLabel(componentId, pin, net, powerOn) {
      var parts = [C.describe(componentId, pin.id)];
      parts.push(C.KIND_WORD[pin.kind] || "단자");
      if (powerOn && net) {
        var v = net.potentialAt(componentId, pin.id);
        if (v === 5) parts.push("5V 전원");
        else if (v === 0) parts.push("0V 접지");
      }
      if (isPending(componentId, pin.id)) parts.push("선택됨");
      return parts.join(", ");
    }

    function drawUno(state, net, powerOn) {
      var g = UI.svg("g", { class: "uno" });
      var box = C.UNO.box;

      g.appendChild(
        UI.svg("rect", {
          x: box.x, y: box.y, width: box.w, height: box.h,
          rx: 12, class: "uno__body"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.usbBox.x, y: C.UNO.usbBox.y,
          width: C.UNO.usbBox.w, height: C.UNO.usbBox.h,
          rx: 3, class: "uno__usb"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.jackBox.x, y: C.UNO.jackBox.y,
          width: C.UNO.jackBox.w, height: C.UNO.jackBox.h,
          rx: 4, class: "uno__jack"
        })
      );

      /* 헤더 띠 */
      [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
        g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
      });

      /* 보드 이름 — 두 머리띠 사이의 빈 자리에 */
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 162, class: "uno__brandsub" }, [txt("오픈 소스 하드웨어")]));

      /* 무리 이름 — 핀 이름표와 겹치지 않도록 머리띠 «바깥쪽» 에 둔다 */
      g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
      g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
      g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

      C.UNO.pins.forEach(function (pin) {
        g.appendChild(drawPin("uno", pin, state, net, powerOn));
      });
      return g;
    }

    function drawBreadboard(state, net, powerOn) {
      var g = UI.svg("g", { class: "bb" });
      var box = C.BB.box;

      g.appendChild(
        UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" })
      );

      /* 전원 레일 줄무늬 — 어느 레일에 전기가 왔는지 색과 «글자» 로 함께 보인다 */
      C.BB.rails.forEach(function (rail) {
        var live = powerOn && net ? net.potentialOf("bb:rail:" + rail.id) : null;
        var cls = "bb__railline bb__railline--" + rail.polarity + (live !== null ? " bb__railline--live" : "");
        g.appendChild(
          UI.svg("line", { x1: box.x + 10, y1: rail.y, x2: box.x + box.w - 10, y2: rail.y, class: cls })
        );
        g.appendChild(
          UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)])
        );
        /* 전압 표시는 판 «바깥» 오른쪽에 적는다.
           판 안에 적으면 마지막 구멍과 겹치고 글자가 판 밖으로 잘린다. */
        if (live !== null) {
          g.appendChild(
            UI.svg("text", { x: box.x + box.w + 8, y: rail.y + 5, class: "bb__raillive" }, [
              txt(live === 5 ? "5V" : "0V")
            ])
          );
        }
      });

      /* 가운데 홈 */
      g.appendChild(
        UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
      );
      g.appendChild(
        UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 17, class: "bb__gaptext" }, [
          txt("여기서 전극이 끊긴다 — 위 A~E 와 아래 F~J 는 다른 전극")
        ])
      );

      /* 열 번호 — 자리는 A 줄 구멍의 x 를 그대로 쓴다 */
      for (var c = 1; c <= C.BB.cols; c += 1) {
        var aPin = C.terminal("bb", "A" + c);
        if (aPin) {
          g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
        }
      }


      /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
         구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
         이 글자는 눈으로 볼 때만 필요하다. */
      C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
        var pin = C.terminal("bb", row + "1");
        if (!pin) return;
        g.appendChild(
          UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
        );
      });
      C.BB.pins.forEach(function (pin) {
        g.appendChild(drawPin("bb", pin, state, net, powerOn));
      });
      return g;
    }

    /* ------------------------------------------------------------------ */
    /* 부품 — HC-SR04 초음파 센서 (명세 6.3 · 11장)                          */
    /*                                                                    */
    /* ★ 사진을 베끼지 않고 자체 SVG 로 그린다(명세 11장 다섯 번째 줄).       */
    /* ★ 실물처럼 «원통 두 개 + 가운데 수정 진동자» 로 그린다.               */
    /*   T 와 R 글자를 원통 위에 적어 «내보내는 쪽» 과 «받는 쪽» 을 가른다.    */
    /* ★ 상태를 «색으로만» 알리지 않는다. 기판 위에 글로도 적는다(명세 11장). */
    /* ------------------------------------------------------------------ */

    /**
     * 지금 센서가 무엇을 할 수 있는가 — 회로만 보고 판정한다.
     * 코드까지 함께 보는 판정은 5단계가 sensorState(conns, code) 로 따로 한다.
     */
    function sensorLine(st, powerOn) {
      if (!powerOn) return "전원 꺼짐";
      var a = C.analyze(st.connections || []);
      if (!a.powered) return "△ 전원 없음";
      if (!a.trigOk && !a.echoOk) return "△ 신호선 없음";
      if (!a.trigOk) return "△ Trig 없음";
      if (!a.echoOk) return "△ Echo 없음";
      return "● 측정 준비됨";
    }

    function drawSonic(st, net, powerOn) {
      var P = C.SONIC;
      var a = C.analyze(st.connections || []);
      var ready = powerOn && a.powered && a.trigOk && a.echoOk;

      var g = UI.svg("g", { class: "part part--sonic" + (ready ? " part--ready" : "") });

      g.appendChild(
        UI.svg("rect", {
          x: P.box.x, y: P.box.y, width: P.box.w, height: P.box.h,
          rx: 10, class: "part__tray"
        })
      );

      var cx = P.pcb.x + P.pcb.w / 2;

      /* 이름과 상태는 기판 «위» 에 적는다.
         아래에 두면 다리 끝의 단자 이름표(pin.y + 18)와 부딪힌다. */
      g.appendChild(
        UI.svg("text", { x: cx, y: P.nameY, class: "part__name" }, [txt("초음파 센서 (HC-SR04)")])
      );
      g.appendChild(
        UI.svg("text", { x: cx, y: P.stateY, class: "part__state" }, [txt(sensorLine(st, powerOn))])
      );

      /* 다리 넷 — 기판 아래에서 단자까지 곧게 내려온다 */
      C.SENSOR_PINS.forEach(function (id) {
        var leg = P.legs[id];
        g.appendChild(
          UI.svg("line", {
            x1: leg.from.x, y1: leg.from.y, x2: leg.to.x, y2: leg.to.y,
            class: "part__lead part__lead--" + id.toLowerCase()
          })
        );
      });

      /* 기판 */
      g.appendChild(
        UI.svg("rect", {
          x: P.pcb.x, y: P.pcb.y, width: P.pcb.w, height: P.pcb.h, rx: 4, class: "sonic__pcb"
        })
      );

      /* 원통 두 개 — 왼쪽 T(내보내기), 오른쪽 R(받기) */
      P.horns.forEach(function (h) {
        g.appendChild(UI.svg("circle", { cx: h.cx, cy: h.cy, r: h.r, class: "sonic__horn" }));
        g.appendChild(UI.svg("circle", { cx: h.cx, cy: h.cy, r: h.r - 5, class: "sonic__mesh" }));
        g.appendChild(
          UI.svg("text", { x: h.cx, y: h.cy + 5, class: "sonic__hornlabel" }, [txt(h.label)])
        );
        /* 측정 준비가 되었으면 내보내는 쪽에 «나가는 물결» 을 그린다 */
        if (ready && h.id === "T") {
          [7, 13].forEach(function (extra) {
            g.appendChild(
              UI.svg("circle", { cx: h.cx, cy: h.cy, r: h.r + extra, class: "sonic__wave" })
            );
          });
        }
      });

      /* 가운데 수정 진동자 */
      var q = P.crystal;
      g.appendChild(
        UI.svg("rect", { x: q.x, y: q.y, width: q.w, height: q.h, rx: 3, class: "sonic__crystal" })
      );

      return g;
    }

    function drawParts(st, net, powerOn) {
      var g = UI.svg("g", { class: "parts" });
      g.appendChild(drawSonic(st, net, powerOn));
      C.PARTS.forEach(function (part) {
        part.pins.forEach(function (pin) {
          g.appendChild(drawPin(part.id, pin, st, net, powerOn));
        });
      });
      return g;
    }

    /** 단자 하나 — 눌리는 자리는 보이는 원보다 넉넉하게 잡는다(터치용) */
    function drawPin(componentId, pin, state, net, powerOn) {
      var key = keyOf(componentId, pin.id);
      var selected = isPending(componentId, pin.id);
      var volts = powerOn && net ? net.potentialAt(componentId, pin.id) : null;

      var classes = ["pin", "pin--" + pin.kind];
      if (selected) classes.push("pin--selected");
      if (volts === 5) classes.push("pin--hot");
      if (volts === 0) classes.push("pin--gnd");

      var g = UI.svg("g", {
        class: classes.join(" "),
        role: "button",
        tabindex: focusKey === key ? "0" : "-1",
        "data-key": key,
        "aria-label": terminalLabel(componentId, pin, net, powerOn)
      });

      /* 넓은 투명 판 — 손가락으로 눌러도 빗나가지 않게 */
      g.appendChild(
        UI.svg("rect", {
          x: pin.x - C.PITCH / 2, y: pin.y - C.PITCH / 2,
          width: C.PITCH, height: C.PITCH,
          class: "pin__hit"
        })
      );
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "pin__dot" }));

      /* 부품 다리 이름표 — 센서의 «네» 단자를 글자로 알린다(명세 6.3).
         ★ 실물에 적힌 것과 같은 글자(VCC · Trig · Echo · GND)를 쓴다.
         이름을 적지 않으면 어느 다리가 무엇인지 그림만으로 알 수 없다. */
      if (componentId === "sonic") {
        g.appendChild(
          UI.svg("text", { x: pin.x, y: pin.y + 18, class: "pin__label pin__label--part" }, [
            txt(pin.label)
          ])
        );
      }

      /* 이름표 — 모든 사용 가능 단자에 실제 명칭을 적는다(명세 6.1).
         위 핀은 아래쪽에, 아래 핀은 위쪽에 적어 무리 이름과 겹치지 않게 한다. */
      if (componentId === "uno") {
        g.appendChild(
          UI.svg(
            "text",
            {
              x: pin.x,
              y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
              /* 이름표는 «모두 같은 크기» 다.
                 긴 이름을 줄이면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
                 대신 circuit.js 가 헤더 간격을 30 으로 벌려 두었다. */
              class: "pin__label"
            },
            [txt(pin.label)]
          )
        );
      }

      g.addEventListener("click", function () {
        pick(componentId, pin.id);
      });
      /* ★ 끌어서 잇기 — 마우스와 손가락을 함께 받는다 (명세 6.3) */
      g.addEventListener("pointerdown", function (evt) {
        dragStart(evt, componentId, pin);
      });
      g.addEventListener("pointermove", dragMove);
      g.addEventListener("pointerup", dragEnd);
      /* 끌다가 창 밖으로 나가거나 전화가 와도 고무줄이 남지 않게 */
      g.addEventListener("pointercancel", function () {
        dragFrom = null;
        dragMoved = false;
        clearRubber();
      });
      g.addEventListener("keydown", function (evt) {
        onPinKey(evt, componentId, pin);
      });
      g.addEventListener("focus", function () {
        focusKey = key;
        say(terminalLabel(componentId, pin, net, powerOn));
      });

      return g;
    }

    /** 꽂힌 케이블 */
    function drawWires(state) {
      var g = UI.svg("g", { class: "wires" });
      /* 색은 그릴 때 «회로 전체를 보고» 정한다 — 두 끝만으로는 알 수 없다 */
      var sides = C.wireSides(state.connections || []);

      (state.connections || []).forEach(function (conn, i) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;

        /* 살짝 휘어지게 그려 여러 줄이 겹쳐도 구분된다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
        var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;

        var side = sides[i] || "";
        g.appendChild(
          UI.svg("path", {
            d: d,
            class: "wire wire--" + (side || "none"),
            stroke: WIRE_COLORS[SIDE_COLOR[side]] || WIRE_COLORS.gray,
            "data-index": String(i)
          })
        );
      });
      return g;
    }

    function txt(value) {
      return document.createTextNode(String(value));
    }

    /* ------------------------------------------------------------------ */
    /* 조작                                                                */
    /* ------------------------------------------------------------------ */

    function say(message) {
      statusLine.textContent = message;
      if (o.onMessage) o.onMessage(message);
    }

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }

    /** 단자 하나를 눌렀다 */
    /** 화면 좌표 → 그림(viewBox) 좌표. 확대·축소를 해도 맞는다. */
    function toSvgPoint(evt) {
      var svgNode = svgHost.querySelector("svg");
      if (!svgNode) return null;
      var box = svgNode.getBoundingClientRect();
      if (!box.width || !box.height) return null;
      var vb = (svgNode.getAttribute("viewBox") || "0 0 1 1").split(/[\s,]+/).map(Number);
      return {
        x: vb[0] + ((evt.clientX - box.left) / box.width) * vb[2],
        y: vb[1] + ((evt.clientY - box.top) / box.height) * vb[3]
      };
    }

    /**
     * 놓은 자리에서 «가장 가까운» 단자를 찾는다.
     *
     * ★★ DOM 을 짚어 찾지 «않는다»(elementsFromPoint).
     *   그 함수는 «보이는 화면» 안의 자리만 본다. 회로 그림은 세로로 길어서
     *   아래쪽 센서 단자는 화면 밖에 있을 때가 많고, 그러면 아무것도 못 찾는다.
     *   게다가 단자는 16px 남짓이라 손가락이 조금만 빗나가도 놓친다.
     *
     *   그래서 그림 좌표에서 «가까운 단자» 를 고른다.
     *   · 스크롤과 상관없다
     *   · 조금 빗나가도 붙는다 (SNAP 안쪽이면 그 단자로 본다)
     *   · 보이지 않는 부품(3A 에서 감춘 브레드보드)은 세지 않는다
     */
    var SNAP = C.PITCH; /* 구멍 한 칸 — 이보다 멀면 «놓은 자리에 단자가 없다» */

    function pinNear(at) {
      if (!at) return null;
      var best = null;
      var bestDist = Infinity;
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        if (comp.id === "sonic" && !showParts) return;
        comp.pins.forEach(function (pin) {
          var dx = pin.x - at.x;
          var dy = pin.y - at.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestDist) {
            bestDist = d;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return bestDist <= SNAP ? best : null;
    }

    function clearRubber() {
      if (rubber && rubber.parentNode) rubber.parentNode.removeChild(rubber);
      rubber = null;
    }

    function dragStart(evt, componentId, pin) {
      if (mode !== "wire") return;
      dragFrom = { component: componentId, pin: pin.id, x: pin.x, y: pin.y };
      dragMoved = false;
      if (evt.target && evt.target.setPointerCapture) {
        try {
          evt.target.setPointerCapture(evt.pointerId);
        } catch (err) {
          /* 못 잡아도 pointermove 는 온다 */
        }
      }
    }

    function dragMove(evt) {
      if (!dragFrom) return;
      var at = toSvgPoint(evt);
      if (!at) return;
      if (!dragMoved) {
        var far = Math.abs(at.x - dragFrom.x) + Math.abs(at.y - dragFrom.y);
        if (far < 8) return; /* 아직 «누른 것» 일 수 있다 */
        dragMoved = true;
        say(C.describe(dragFrom.component, dragFrom.pin) + " 에서 끌기 시작. 이을 단자 위에 놓으세요.");
      }
      evt.preventDefault();

      var svgNode = svgHost.querySelector("svg");
      if (!svgNode) return;
      if (!rubber) {
        rubber = UI.svg("line", { class: "wire wire--rubber" });
        svgNode.appendChild(rubber);
      }
      rubber.setAttribute("x1", dragFrom.x);
      rubber.setAttribute("y1", dragFrom.y);
      rubber.setAttribute("x2", at.x);
      rubber.setAttribute("y2", at.y);
    }

    function dragEnd(evt) {
      if (!dragFrom) return;
      var from = dragFrom;
      var moved = dragMoved;
      dragFrom = null;
      dragMoved = false;
      clearRubber();

      if (!moved) return; /* 끌지 않았다 — click 이 알아서 처리한다 */

      var target = pinNear(toSvgPoint(evt));
      if (!target || (target.component === from.component && target.pin === from.pin)) {
        say("놓은 자리에 단자가 없습니다. 단자 위에 놓아 주세요.");
        render();
        return;
      }
      /* 끌기는 «두 끝을 한 번에» 정한다. 클릭-클릭으로 골라 둔 것은 지운다. */
      pending = null;
      join({ component: from.component, pin: from.pin }, target);
    }

    /**
     * 두 단자를 잇는다 — 클릭-클릭과 끌기가 «같은 길» 을 쓴다.
     * 두 곳에 따로 적어 두면 한쪽만 고치는 일이 생긴다.
     */
    function join(from, to) {
      var conn = C.makeConnection(from, to);
      if (!conn) {
        say("이을 수 없는 자리입니다.");
        render();
        return;
      }
      if (C.hasConnection(state().connections, conn)) {
        say("이미 이어져 있는 곳입니다.");
        render();
        return;
      }
      if (o.onConnect) o.onConnect(conn);
      say(
        C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 을(를) " +
          (COLOR_WORD[conn.color] || "") +
          " 케이블로 이었습니다."
      );
      render();
    }

    function pick(componentId, pinId) {
      focusKey = keyOf(componentId, pinId);

      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      /* wire 모드 */
      if (!pending) {
        pending = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 을(를) 골랐습니다. 이을 곳을 하나 더 누르세요.");
        render();
        return;
      }

      if (pending.component === componentId && pending.pin === pinId) {
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }

      var first = pending;
      pending = null;
      join(first, { component: componentId, pin: pinId });
    }

    /** 화살표로 옮겨 다니기 — 지금 위치에서 그 방향으로 가장 가까운 단자 */
    function nearestPin(fromComponent, fromPin, dx, dy) {
      var here = C.terminal(fromComponent, fromPin);
      if (!here) return null;

      var best = null;
      var bestScore = Infinity;

      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;

        comp.pins.forEach(function (pin) {
          if (comp.id === fromComponent && pin.id === fromPin) return;
          var vx = pin.x - here.x;
          var vy = pin.y - here.y;
          /* 가려는 방향으로 나아간 거리 */
          var along = vx * dx + vy * dy;
          if (along <= 0) return;
          /* 옆으로 벗어난 거리 — 많이 벗어날수록 나쁜 후보 */
          var across = Math.abs(vx * dy - vy * dx);
          var score = along + across * 3;
          if (score < bestScore) {
            bestScore = score;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return best;
    }

    function onPinKey(evt, componentId, pin) {
      var dirs = {
        ArrowRight: [1, 0],
        ArrowLeft: [-1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };

      if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
        evt.preventDefault();
        pick(componentId, pin.id);
        return;
      }
      if (evt.key === "Escape" && pending) {
        evt.preventDefault();
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }
      if (!dirs[evt.key]) return;

      evt.preventDefault();
      var target = nearestPin(componentId, pin.id, dirs[evt.key][0], dirs[evt.key][1]);
      if (!target) return;
      focusKey = keyOf(target.component, target.pin);
      render();
      var node = svgHost.querySelector('[data-key="' + cssEscape(focusKey) + '"]');
      if (node) node.focus();
    }

    /** 속성 선택자에 넣어도 안전하게 */
    function cssEscape(value) {
      return String(value).replace(/["\\]/g, "\\$&");
    }

    /* ------------------------------------------------------------------ */
    /* 키보드·화면낭독기용 «목록으로 잇기» (명세 6.1)                        */
    /* ------------------------------------------------------------------ */

    function terminalOptions() {
      var list = [];
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        comp.pins.forEach(function (pin) {
          list.push({ value: keyOf(comp.id, pin.id), label: C.describe(comp.id, pin.id) });
        });
      });
      return list;
    }

    function buildPicker() {
      if (mode === "find") return null;

      var options = terminalOptions();
      function makeSelect(labelText) {
        var id = UI.nextId("sel");
        var select = UI.el("select", { class: "input input--select", id: id });
        options.forEach(function (opt) {
          select.appendChild(UI.el("option", { text: opt.label, attrs: { value: opt.value } }));
        });
        return {
          root: UI.el("div", { class: "field field--inline" }, [
            UI.el("label", { class: "field__label", attrs: { for: id }, text: labelText }),
            select
          ]),
          select: select
        };
      }

      var from = makeSelect("여기에서");
      var to = makeSelect("여기까지");
      /* 두 칸이 같은 곳을 가리키면 쓸모가 없으므로 두 번째는 다른 곳으로 미리 옮겨 둔다 */
      if (options.length > 1) to.select.selectedIndex = Math.min(options.length - 1, 1);

      var go = UI.button("이 둘을 잇기", {
        class: "btn btn--ghost",
        click: function () {
          var a = splitKey(from.select.value);
          var b = splitKey(to.select.value);
          pending = a;
          pick(b.component, b.pin);
        }
      });

      return UI.el("details", { class: "board__picker" }, [
        UI.el("summary", { class: "board__pickersum", text: "목록에서 골라 잇기" }),
        UI.el("p", {
          class: "board__pickerhelp",
          text: "그림을 누르기 어려울 때 씁니다. 그림 위에서는 화살표 키로 옮기고 Enter 로 고를 수도 있습니다."
        }),
        UI.el("div", { class: "board__pickerrow" }, [from.root, to.root, go])
      ]);
    }

    /* ------------------------------------------------------------------ */
    /* 도구 막대                                                           */
    /* ------------------------------------------------------------------ */

    function buildTools() {
      if (mode !== "wire") {
        return UI.el("div", { class: "board__tools" }, [zoomGroup()]);
      }

      var connections = state().connections || [];
      var undo = UI.button("한 단계 되돌리기", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onUndo) o.onUndo();
        }
      });
      var reset = UI.button("전체 초기화", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onReset) o.onReset();
        }
      });

      return UI.el("div", { class: "board__tools" }, [
        UI.el("div", { class: "board__toolgroup" }, [undo, reset]),
        zoomGroup()
      ]);
    }

    function zoomGroup() {
      function setZoom(next) {
        /* 하한을 넉넉히 둔다. 좁은 화면에서는 바닥값(640) 에 곱하므로
           0.5 로는 화면 폭에 몇 픽셀 모자라 «전체 보기» 가 되지 않는다. */
        zoom = Math.max(0.4, Math.min(2.4, next));
        applyZoom();
      }
      return UI.el("div", { class: "board__toolgroup", attrs: { role: "group", "aria-label": "확대·축소" } }, [
        UI.button("−", {
          class: "btn btn--ghost btn--icon",
          title: "축소",
          click: function () {
            setZoom(zoom - 0.2);
          }
        }),
        UI.button("기본", {
          class: "btn btn--ghost btn--small",
          click: function () {
            setZoom(1);
          }
        }),
        UI.button("+", {
          class: "btn btn--ghost btn--icon",
          title: "확대",
          click: function () {
            setZoom(zoom + 0.2);
          }
        })
      ]);
    }

    /** 지금 확대 배수로 폭을 맞춘다. 배수를 그림에 적어 두어 창이 바뀔 때도 쓴다. */
    function applyZoom() {
      svgHost.setAttribute("data-zoom", String(zoom));
      fitSvg(svgHost, zoom);
    }

    /* ------------------------------------------------------------------ */
    /* 조립                                                                */
    /* ------------------------------------------------------------------ */

    var toolHost = UI.el("div");
    var pickerHost = UI.el("div");

    function render() {
      var st = state();
      var net = C.solve(st.connections);
      var powerOn = st.powerOn === true;

      /* 우노는 왼쪽, 브레드보드는 오른쪽에 나란히 놓인다(circuit.js 좌표).
         단자 찾기(3A)에서는 브레드보드가 없으므로 보드만 담는 좁은 틀을 쓴다. */
      /* 보이는 부품에 따라 틀을 고른다. 아래쪽 100px 은 센서 자리다. */
      /* ★ 아래쪽 여백 : 센서 단자 이름표(VCC·Trig·Echo·GND)가 pin.y + 18 에 그려진다.
         가장 아래 단자가 y=406 이므로 틀이 424 에서 끊기면 그 글자가 잘린다.
         (틀 높이 = 시작 18 + 높이 → 아래 끝. 420 이면 아래 끝이 438 이다) */
      var viewBox = showBread
        ? "0 18 920 420"
        : showParts
        ? "0 18 560 420"
        : "0 18 560 268";

      var svgNode = UI.svg("svg", {
        viewBox: viewBox,
        class: "board__svg",
        role: "img",
        "aria-label":
          (showBread ? "왼쪽에 아두이노 우노, 오른쪽에 브레드보드" : "아두이노 우노 보드") +
          (showParts ? ", 아래쪽에 초음파 센서 HC-SR04" : "")
      });

      if (showBoard) svgNode.appendChild(drawUno(st, net, powerOn));
      if (showBread) svgNode.appendChild(drawBreadboard(st, net, powerOn));
      if (showParts) svgNode.appendChild(drawParts(st, net, powerOn));
      svgNode.appendChild(drawWires(st));

      UI.clear(svgHost).appendChild(svgNode);
      applyZoom();

      UI.clear(toolHost).appendChild(buildTools());
      var picker = buildPicker();
      UI.clear(pickerHost);
      if (picker) pickerHost.appendChild(picker);
    }

    var rootNode = UI.el("div", { class: "board" }, [toolHost, svgHost, statusLine, pickerHost]);

    render();

    return {
      root: rootNode,
      render: render,
      setMode: function (next) {
        mode = next;
        pending = null;
        render();
      },
      cancelPending: function () {
        pending = null;
        render();
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_COLOR: SIDE_COLOR,
    SIDE_WORD: SIDE_WORD
  };
})();
    </script>
    <script data-from="student/s45-figures.js">
/**
 * 설명 그림 (명세 13장)
 *
 * 2단계 «원리 이해» 의 카드가 글만 있어서 장치 그림을 함께 넣는다.
 *
 * ★ 실제 사진을 «복제하지 않는다».
 *   명세 13장 — 「실제 부품 사진을 참고하되 저작권이 불명확한 이미지는
 *   복제하지 말고 자체 SVG로 그린다」.
 *   그래서 실물 사진을 보고 같은 배치로 «직접» 그렸다.
 *   덧붙여, 그림 파일을 심지 않으므로 단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 *
 * 보드와 브레드보드의 좌표는 shared/circuit.js 에서 가져온다.
 * 3단계 시뮬레이터와 «같은 그림» 이어야 학생이 헷갈리지 않기 때문이다.
 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,
 * 화면 낭독기에는 그 목록이 그림의 대체 설명이 된다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  function txt(value) {
    return document.createTextNode(String(value));
  }

  /** 번호 배지 — 그림 위에 얹는 동그란 번호 */
  /**
   * 화살촉 하나. marker 를 쓰지 않고 직접 그린다.
   *
   * ★ marker 는 <defs> 에 id 를 두어야 하는데, 설명 그림이 한 페이지에
   *   여럿 개 들어오므로 id 가 겹친다. 겹치면 바로 앞에 그려진 것을
   *   모두 가리키게 되어 색이 어긋나간다. 삼각형 하나면 그럴 일이 없다.
   *
   * (x, y) 는 «뿠족한 끝» 이다 — 가리키는 자리를 그대로 적으면 된다.
   */
  function arrowHead(x, y, dir, cls) {
    var d = dir === "left" ? -1 : 1;
    return UI.svg("polygon", {
      points: [x, y, x - d * 12, y - 6.5, x - d * 12, y + 6.5].join(" "),
      class: cls || "figarrow"
    });
  }

  function badge(no, x, y) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 11, class: "fig__badgebg" }),
      UI.svg("text", { x: x, y: y + 4, class: "fig__badgeno" }, [txt(String(no))])
    ]);
  }

  /**
   * O · X 배지 — «이렇게 꽂는다 / 이렇게 꽂으면 안 된다» 를 나타낸다.
   * 색만으로 알리지 않는다. 동그라미 안의 O·X 글자가 뜻을 지고,
   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.
   */
  function badgeMark(mark, x, y, kind) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg fig__badgebg--" + kind }),
      UI.svg("text", { x: x, y: y + 5, class: "fig__badgeno" }, [txt(mark)])
    ]);
  }

  /**
   * 배지에서 가리키는 곳까지 잇는 선.
   *
   * ★ 두 겹으로 그린다.
   *   아래 : 굵은 «흰» 선 — 청록 보드와 검은 헤더 위에서 선이 묻히지 않게 한다
   *   위   : 가는 «진한 주황» 선 — 흰 종이 위에서도 보이고, 보드 색과 확실히 다르다
   *
   * 한 겹으로는 어느 한쪽 바탕에서 반드시 묻힌다(파란 점선이 청록 보드에서 안 보였다).
   */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", {}, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderhalo" }),
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leader" }),
      /* 가리키는 끝에 점을 찍어 «어디를» 가리키는지 분명히 한다 */
      UI.svg("circle", { cx: x2, cy: y2, r: 3.5, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 덩어리를 만든다.
   *   opts : { viewBox, caption, items:[{text}], build(g) }
   *
   * items 의 차례가 곧 배지 번호다. build 안에서 badge(n, x, y) 로 같은 번호를 얹는다.
   */
  function figure(opts) {
    var o = opts || {};
    var items = o.items || [];

    /* 배지에 쓸 표시. 따로 주지 않으면 1, 2, 3 … 을 쓴다.
       그림의 배지와 아래 설명 목록은 반드시 «같은 표시» 여야 한다.
       그림에는 O 인데 목록에는 다른 글자가 있으면 짝을 지을 수 없다. */
    var marks = o.marks || items.map(function (_, i) {
      /* 배지에 그리는 것과 «똑같은» 숫자를 목록에도 쓴다 */
      return String(i + 1);
    });

    /* 그림의 «대체 설명» — 낭독기는 이 글을 읽는다 */
    var alt =
      o.caption +
      ". 표시된 곳 : " +
      items
        .map(function (item, i) {
          return marks[i] + " " + item.text;
        })
        .join(", ");

    var svgNode = UI.svg("svg", {
      viewBox: o.viewBox,
      class: "fig__svg",
      role: "img",
      "aria-label": alt
    });
    if (o.build) o.build(svgNode);

    var legend = UI.el("ol", { class: "fig__legend" }, items.map(function (item, i) {
      var kind = (o.markKinds || [])[i];
      return UI.el("li", { class: "fig__item" }, [
        UI.el("span", {
          class: "fig__no" + (kind ? " fig__no--" + kind : ""),
          attrs: { "aria-hidden": "true" },
          text: marks[i]
        }),
        UI.el("span", { class: "fig__text", text: item.text })
      ]);
    }));

    /* 브레드보드처럼 «세로로 긴» 그림은 그대로 두면 화면을 다 차지한다.
       narrow 를 주면 폭을 묶어 카드 안에 들어오는 크기로 줄인다. */
    return UI.el("figure", { class: "fig" + (o.narrow ? " fig--narrow" : "") }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      UI.el("figcaption", { class: "fig__cap", text: o.caption }),
      legend
    ]);
  }

  /* ================================================================== */
  /* 1. 아두이노 우노 보드                                                */
  /* ================================================================== */

  /** 3단계 시뮬레이터와 같은 좌표로 보드를 그린다(누를 수는 없는 «설명용») */
  function drawUnoBody(g) {
    var box = C.UNO.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12, class: "uno__body" }));
    [C.UNO.usbBox, C.UNO.jackBox].forEach(function (b) {
      g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: "uno__usb" }));
    });
    [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
      g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
    });

    /* 보드 위의 큰 부품들 — 실물을 보고 자리만 맞추어 단순하게 */
    var chip = C.UNO.chip;
    g.appendChild(UI.svg("rect", { x: chip.x, y: chip.y, width: chip.w, height: chip.h, rx: 3, class: "fig__chip" }));
    g.appendChild(
      UI.svg("text", { x: chip.x + chip.w / 2, y: chip.y + 28, class: "fig__chiptext" }, [txt("ATmega328P")])
    );

  function unoFigure() {
    return figure({
      viewBox: "-56 -34 676 358",

      items: [
        { text: "USB 단자 — 컴퓨터와 잇는다. 프로그램을 보내고 전기도 받는다." },
        { text: "디지털 핀 D0~D13 — 위 줄에 있다(가리킨 곳은 D13). 켜짐(HIGH)·꺼짐(LOW) 두 가지만 다룬다." },
        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },
        { text: "5V — 부품에 전기를 보내 주는 «+» 자리." },
        { text: "GND — 전기가 돌아오는 길이자 0V 기준점. 세 곳이 보드 안에서 이어져 있다." },
        { text: "ATmega328P — 프로그램이 담겨 «처리» 를 맡는 칩." }
      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;
        var chip = C.UNO.chip;
        var d13 = C.terminal("uno", "D13");
        var vcc = C.terminal("uno", "5V");
        var gnd = C.terminal("uno", "GND2");
        var a0 = C.terminal("uno", "A0");

        /* ① USB — 보드 왼쪽 밖에서 가로로 */
        g.appendChild(leader(-27, usb.y + usb.h / 2, usb.x - 2, usb.y + usb.h / 2));
        g.appendChild(badge(1, -40, usb.y + usb.h / 2));

              무리 이름은 x 300 으로 비켜 두었으므로 이 선과 겹치지 않는다. */
        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));
        g.appendChild(badge(2, d13.x, -20));

        /* ③ 아날로그 핀 — «A0 구멍» 을 바로 아래에서.
              A0~A5 가운데를 가리키면 A2·A3 사이를 짚어 어느 핀인지 알 수 없다. */
        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        /* ④ 5V — 그 구멍을 바로 아래에서 */
        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));
        g.appendChild(badge(4, vcc.x, 315));

        /* ⑤ GND — 세 곳 중 아래 줄의 GND 구멍을 바로 아래에서 */
        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }
    });
  }

  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

  function breadboardFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "브레드보드 — 어느 구멍끼리 이어지는가(같은 전극)",
      items: [
        { text: "+ 레일(빨간 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극이라 5V 를 한 곳에만 넣으면 된다." },
        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },
        { text: "가운데 홈 — 여기서 전극이 끊긴다. 위와 아래가 서로 붙지 않게 일부러 끊어 놓은 것이다." },
        { text: "같은 4번 열이지만 F~J (주황 점선) 는 «다른 전극» 이다. 이으려면 점퍼선으로 A4–F4 를 직접 이어 준다." }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* 4번 열을 위(A~E)·아래(F~J)로 나누어 감싼다.
           같은 열이어도 홈을 넘으면 «다른 전극» 이라는 것이 이 그림의 요점이다. */
        wrapColumn(g, "A4", "E4", "fig__hilite");
        wrapColumn(g, "F4", "J4", "fig__hilite--other");

        /* 가리키는 자리는 실제 구멍 좌표에서 가져온다 */
        var railTP = C.terminal("bb", "TP-10");
        var railTN = C.terminal("bb", "TN-10");
        var c4top = C.terminal("bb", "C4");
        var h4 = C.terminal("bb", "H4");
        var gapMid = C.BB.gap.y + C.BB.gap.h / 2;
        var right = 904;

        g.appendChild(leader(right, railTP.y, railTP.x + 14, railTP.y));
        g.appendChild(badge(1, right + 14, railTP.y));

        g.appendChild(leader(right, railTN.y, railTN.x + 14, railTN.y));
        g.appendChild(badge(2, right + 14, railTN.y));

        g.appendChild(leader(right, c4top.y, c4top.x + 11, c4top.y));
        g.appendChild(badge(3, right + 14, c4top.y));

        g.appendChild(leader(right, gapMid, 800, gapMid));
        g.appendChild(badge(4, right + 14, gapMid));

        g.appendChild(leader(right, h4.y, h4.x + 11, h4.y));
        g.appendChild(badge(5, right + 14, h4.y));
      }
    });
  }

  /* ================================================================== */
  /* 2-B. 브레드보드 — 꽂는 자리에 따라 어떻게 달라지는가 (O / X)           */
  /*                                                                    */
  /* 왼쪽 그림(전극 지도)이 «어느 구멍이 이어지는가» 를 알려 준다면        */
  /* 이 그림은 «그래서 꽂을 때 무엇을 조심하는가» 를 알려 준다.            */
  /* 두 장을 나란히 두어야 지도와 쓰임새가 한눈에 이어진다.                */
  /* ================================================================== */

  function breadboardUseFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "꽂는 자리에 따라 이렇게 달라진다",
      marks: ["O", "X"],
      markKinds: ["ok", "no"],
      items: [
        {
          text:
            "올바름 — 부품의 두 다리를 «서로 다른 열»(2번·3번)에 꽂았다. " +
            "두 다리가 다른 전극이라 전류가 부품을 지나간다."
        },
        {
          text:
            "잘못됨 — 두 다리를 «같은 열»(9번)에 꽂았다. 한 전극에 둘 다 물려 " +
            "다리끼리 바로 붙는다. 전류가 부품을 지나가지 않아 켜지지 않는다."
        }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* ── ① 다리를 다른 열에 (2번·3번) ───────────────────────── */
        wrapColumn(g, "A2", "E2", "fig__hilite");
        wrapColumn(g, "A3", "E3", "fig__hilite--other");
        legRing(g, "A2");
        legRing(g, "A3");

        /* ── ② 다리를 같은 열에 (9번) — 붙어 버린 것을 굵은 선으로 ── */
        wrapColumn(g, "A9", "E9", "fig__hilite--bad");
        legRing(g, "C9");
        legRing(g, "E9");
        var c9 = C.terminal("bb", "C9");
        var e9 = C.terminal("bb", "E9");
        g.appendChild(
          UI.svg("line", { x1: c9.x, y1: c9.y, x2: e9.x, y2: e9.y, class: "fig__shortline" })
        );

        /* ── 배지 : 오른쪽에서 각 자리를 가리킨다 ───────────────────── */
        var right = 904;
        var a3 = C.terminal("bb", "A3");

        g.appendChild(leader(right, a3.y, a3.x + 11, a3.y));
        g.appendChild(badgeMark("O", right + 14, a3.y, "ok"));

        g.appendChild(leader(right, c9.y, c9.x + 11, c9.y));
        g.appendChild(badgeMark("X", right + 14, c9.y, "no"));
      }
    });
  }

    return UI.el("div", { class: "figpair" }, [breadboardFigure(), breadboardUseFigure()]);

  /*                                                                    */
  /* ★ 실제 부품 사진을 베끼지 않고 자체 SVG 로 그린다(명세 11장 다섯째 줄). */
  /* ★ 그림만으로 뜻을 전하지 않는다 — 배지마다 아래 목록에 글로 적는다.     */
  /* ================================================================== */

  var PINS = PC.PINS || { vcc: "5V", gnd: "GND", trig: "D6", echo: "D5" };
  var SPEED = PC.SOUND_SPEED === undefined ? 0.034 : PC.SOUND_SPEED;
  var SAMPLE_D = PC.SAMPLE_DISTANCE === undefined ? 20 : PC.SAMPLE_DISTANCE;
  var SAMPLE_US = PC.SAMPLE_DURATION === undefined ? 1176 : PC.SAMPLE_DURATION;
  var PULSE_US = PC.TRIG_PULSE_US === undefined ? 10 : PC.TRIG_PULSE_US;
  var D_MIN = PC.DIST_MIN === undefined ? 2 : PC.DIST_MIN;
  var D_MAX = PC.DIST_MAX === undefined ? 400 : PC.DIST_MAX;

  /**
   * 센서 몸통 하나 — 여러 그림이 함께 쓴다.
   *   기판 + 원통 두 개(T·R) + 가운데 수정 진동자 + 네 다리
   *
   * 실물을 보고 그린 것이다. 원통이 «두 개» 라는 것과 그 위에 T·R 이 적혀 있다는 것이
   * 이 부품을 알아보는 열쇠다.
   */
  function bigSensor(g, x, y, opts) {
    var o = opts || {};
    var w = o.w || 200;
    var h = o.h || 78;
    var r = o.r || 30;
    var cyc = y + h / 2;

    g.appendChild(UI.svg("rect", { x: x, y: y, width: w, height: h, rx: 5, class: "figson__pcb" }));

    var lx = x + r + 8;
    var rx = x + w - r - 8;
    [
      { cx: lx, label: "T" },
      { cx: rx, label: "R" }
    ].forEach(function (horn) {
      g.appendChild(UI.svg("circle", { cx: horn.cx, cy: cyc, r: r, class: "figson__horn" }));
      g.appendChild(UI.svg("circle", { cx: horn.cx, cy: cyc, r: r - 6, class: "figson__mesh" }));
      g.appendChild(
        UI.svg("text", { x: horn.cx, y: cyc + 6, class: "figson__hornlabel" }, [txt(horn.label)])
      );
    });

    /* 가운데 수정 진동자 */
    g.appendChild(
      UI.svg("rect", {
        x: x + w / 2 - 18, y: cyc - 13, width: 36, height: 26, rx: 3, class: "figson__crystal"
      })
    );

    /* 네 다리 — 실물과 같은 차례 (VCC · Trig · Echo · GND)
       ★ 간격을 밖에서 정할 수 있게 해 두었다.
         이름이 «Trig»·«Echo» 처럼 네 글자라 좀은 간격에서는 서로 닿는다.
         닿으면 어느 이름이 어느 다리의 것인지 알 수 없다. */
    var names = ["VCC", "Trig", "Echo", "GND"];
    var gap = o.gap || 34;
    var startX = x + w / 2 - (gap * (names.length - 1)) / 2;
    var pins = [];
    names.forEach(function (name, i) {
      var px = startX + gap * i;
      g.appendChild(
        UI.svg("line", { x1: px, y1: y + h, x2: px, y2: y + h + 22, class: "figson__leg" })
      );
      g.appendChild(UI.svg("circle", { cx: px, cy: y + h + 22, r: 5, class: "figson__pad" }));
      if (o.labels !== false) {
        /* ★ 이름을 놓는 높이를 밖에서 정할 수 있게 해 둔다.
           배지·지시선·「→ D6」 이 함게 들어오는 그림에서는
           칸을 나누지 않으면 지시선이 글자를 뚫고 지나간다. */
        g.appendChild(
          UI.svg("text", {
            x: px, y: y + h + (o.nameDy || 40), class: "figson__legname"
          }, [txt(name)])
        );
      }
      pins.push({ name: name, x: px, y: y + h + 22 });
    });

    return { left: lx, right: rx, cy: cyc, pins: pins };
  }

  /**
   * ① 초음파란 — 사람이 들을 수 있는 범위와 견준다
   *
   * ★★ 배지 넷이 저마다 «그림에 그려진 것» 을 가리킨다.
   *   앞 판에서는 ④ 가 «박쥐와 돌고래» 를 설명하면서 아무것도 없는 빈 곳을
   *   비스듬히 가리켰고, 배지 동그라미가 아래 설명 글줄과 겹쳤다.
   *   그려 놓지 않은 것에는 배지를 달 수 없다 — 그 말은 아래 목록으로 옮겼다.
   *
   * ★ 글이 서로 닿지 않도록 «칸(lane)» 을 나누어 둔다. 같은 높이에 오는 글은
   *   가로로 멀찍이 떨어뜨리고, 가로로 가까운 글은 높이를 다르게 둔다.
   *
   *     y  30  낮은 소리 · 높은 소리      (양 끝)
   *     y  62  배지 ① ② ③               (띠 세 칸의 가운데)
   *     y 104  띠 (40 높이)
   *     y 170  20Hz · 20,000Hz           (눈금 숫자)  ·  배지 ④
   *     y 212  HC-SR04 40kHz
   *     y 246  한 줄 맺음말
   */
  function ultrasoundFigure() {
    var BAND_TOP = 104;
    var BAND_H = 40;
    var BAND_BOTTOM = BAND_TOP + BAND_H;
    var LEAD_GAP = 8;

    var X0 = 46;
    var X1 = 474;
    var EDGE_20 = 150;         /* 20Hz 자리 */
    var EDGE_20K = 340;        /* 20,000Hz 자리 */
    var SR04_X = 430;          /* 40kHz — 초음파 띠 안쪽이다 */

    var bands = [
      { from: X0, to: EDGE_20, cls: "low", label: "초저주파" },
      { from: EDGE_20, to: EDGE_20K, cls: "hear", label: "사람이 듣는 범위" },
      { from: EDGE_20K, to: X1, cls: "ultra", label: "초음파" }
    ];
    var mid = function (b) { return (b.from + b.to) / 2; };

    return figure({
      viewBox: "0 0 520 262",
      caption: "소리의 높이 — 어디까지가 사람이 들을 수 있는 소리일까",
      items: [
        { text: "20Hz 아래는 «초저주파» 다. 사람은 소리로 듣지 못하고 떨림으로 느낀다." },
        { text: "20Hz ~ 20,000Hz 가 사람이 들을 수 있는 범위다. 사람 목소리와 악기가 여기에 있다." },
        {
          text:
            "20,000Hz 위가 «초음파» 다. 사람 귀로는 들을 수 없다 — " +
            "박쥐와 돌고래가 길을 찾는 데 쓰는 것이 바로 이것이다."
        },
        {
          text:
            "HC-SR04 는 40,000Hz(40kHz) 를 쓴다. 초음파 쪽 한가운데이므로 " +
            "우리 귀에는 아무 소리도 들리지 않는다."
        }
      ],
      build: function (g) {
        /* ── 양 끝이 무엇인지 — 배지 칸보다 «위» 에 둔다 ─────────────
           배지와 같은 높이에 두면 ③ 과 「높은 소리」 가 닿는다. */
        g.appendChild(UI.svg("text", { x: X0, y: 30, class: "fig__minitext" }, [txt("낮은 소리")]));
        g.appendChild(UI.svg("text", { x: X1, y: 30, class: "fig__minitext" }, [txt("높은 소리")]));

        /* ── 가로축과 띠 세 칸 ──────────────────────────────────────
           자리는 «칸» 으로 나눈다. 로그 축을 흉내 낸 것이 아니라 읽기 쉽게 나눈 것이다. */
        g.appendChild(
          UI.svg("line", {
            x1: X0, y1: BAND_BOTTOM, x2: X1, y2: BAND_BOTTOM, class: "figrange__axis"
          })
        );
        bands.forEach(function (b) {
          g.appendChild(
            UI.svg("rect", {
              x: b.from, y: BAND_TOP, width: b.to - b.from, height: BAND_H,
              class: "figrange__band figrange__band--" + b.cls
            })
          );
          g.appendChild(
            UI.svg("text", { x: mid(b), y: BAND_TOP + 26, class: "figrange__label" }, [txt(b.label)])
          );
        });

        /* ── 눈금 둘 — 경계가 되는 숫자. 숫자는 띠 «아래» 에 적는다 ──
           위에 적으면 배지 칸과 다투게 된다. */
        [
          { x: EDGE_20, text: "20Hz" },
          { x: EDGE_20K, text: "20,000Hz" }
        ].forEach(function (t) {
          g.appendChild(
            UI.svg("line", {
              x1: t.x, y1: BAND_TOP - 6, x2: t.x, y2: BAND_BOTTOM + 6, class: "figrange__tick"
            })
          );
          g.appendChild(
            UI.svg("text", { x: t.x, y: 170, class: "fig__minitext" }, [txt(t.text)])
          );
        });

        /* ── HC-SR04 가 서는 자리 ────────────────────────────────── */
        g.appendChild(
          UI.svg("line", {
            x1: SR04_X, y1: BAND_BOTTOM + 6, x2: SR04_X, y2: 190, class: "figrange__tick"
          })
        );
        g.appendChild(
          UI.svg("text", { x: SR04_X, y: 212, class: "fig__minitext" }, [txt("HC-SR04 40kHz")])
        );

        /* ── 배지 넷 ────────────────────────────────────────────────
           ①②③ 은 띠 세 칸을 위에서, ④ 는 HC-SR04 눈금을 옆에서 가리킨다. */
        bands.forEach(function (b, i) {
          var cx = mid(b);
          g.appendChild(leader(cx, 73, cx, BAND_TOP - LEAD_GAP));
          g.appendChild(badge(i + 1, cx, 62));
        });
        g.appendChild(leader(463, 170, SR04_X + LEAD_GAP, 170));
        g.appendChild(badge(4, 474, 170));

        /* ── 맺음말 — 이 차시가 성립하는 까닭이다 ───────────────────
           빠르기가 «정해져 있어야» 시간으로 거리를 얻을 수 있다. */
        g.appendChild(
          UI.svg("text", { x: 260, y: 246, class: "fig__minitext" }, [
            txt("소리이므로 빠르기가 정해져 있다 — 1초에 약 340m")
          ])
        );
      }
    });
  }

  /**
   * ② 발사 → 반사 → 수신 — 「한번 동작에」 지나가는 길
   *
   * ★★ 여기서는 T·R 을 «위아래로» 그린다. 실물은 나란히 붙어 있다.
   *   실물대로 나란히 그리면 나가는 길과 돌아오는 길이 같은 자리에서 시작해
   *   겹쳐 버린다 — 「어디서 나가 어디로 들어오는가」 가 이 그림의 전부인데
   *   그것이 안 보이면 그릴 까닭이 없다. 실물 배치는 ⑤ 「네 단자」 가 보여 준다.
   *
   * ★ 배지 넷은 저마다 «가리킬 것» 이 그림 안에 있어야 한다.
   *   ① Trig 신호선 · ② T 원통 · ③ 물체 · ④ Echo 신호선
   *   앞 판에서는 ④ 가 설명 «글자» 를 가리키고 있었다. 글자는 부품이 아니다.
   *
   * ★ 지시선은 가리키는 것에서 LEAD_GAP 앞에서 멈춘다.
   *   닿아 버리면 어느 것을 가리키는지 되레 흐려진다. 넷 모두 같은 간격이다.
   */
  function reflectFigure() {
    var TRIG_Y = 100;              /* 아두이노 → 센서 : «쏴라» 는 명령 */
    var ECHO_Y = 160;              /* 센서 → 아두이노 : 걸린 «시간» */
    var HORN_X = 214;
    var HORN_R = 24;
    var WALL_X = 452;
    var WALL_W = 18;
    /* ★★ 배지·지시선과 신호선 이름을 «다른 x» 에 둔다.
       둘을 같은 자리에 세우면 지시선이 「Trig」 글자를 뚫고 지나간다 —
       지시선은 «부품» 을 가리키는 것이므로 글자와 닿으면 읽는 사람이
       글자를 가리킨 줄 알게 된다. */
    var BADGE_X = 56;              /* 배지와 지시선 — 신호선 엇모리
                                      ★ 44 에 두면 Echo 화살촉(34~46) 에 1.5px 로 닿는다.
                                        닿으면 가리키는 것이 아니라 «이어진 것» 으로 보인다. */
    var NAME_X = 84;               /* Trig · Echo 이름 — 신호선 오른쪽 끝 */
    var SIDE_X = 34;               /* 「아두이노 족」 — 둔 신호선 사이 왜쪽 가 */
    var LEAD_GAP = 8;

    return figure({
      viewBox: "0 0 560 252",
      caption: "한번 동작에 초음파가 지나가는 길",
      items: [
        { text: "Trig 단자로 «지금 쏴라» 는 명령이 들어온다 — 아두이노가 보내는 것이다." },
        { text: "T(Transmitter) 원통이 초음파를 내보낸다. 여기서부터 «나가는 길» 이다." },
        { text: "물체에 부딪혀 되돌아오고, R(Receiver) 원통이 그것을 받는다." },
        { text: "받은 순간 Echo 단자가 아두이노에게 알린다 — 그때까지 Echo 는 HIGH 였다." }
      ],
      build: function (g) {
        /* ── 센서 몸통 : 기판 하나에 원통 둘 ───────────────────────── */
        g.appendChild(
          UI.svg("rect", { x: 104, y: 68, width: 92, height: 116, rx: 5, class: "figson__pcb" })
        );
        [
          { cy: TRIG_Y, label: "T" },
          { cy: ECHO_Y, label: "R" }
        ].forEach(function (horn) {
          g.appendChild(
            UI.svg("circle", { cx: HORN_X, cy: horn.cy, r: HORN_R, class: "figson__horn" })
          );
          g.appendChild(
            UI.svg("circle", { cx: HORN_X, cy: horn.cy, r: HORN_R - 6, class: "figson__mesh" })
          );
          g.appendChild(
            UI.svg("text", { x: HORN_X, y: horn.cy + 6, class: "figson__hornlabel" }, [txt(horn.label)])
          );
        });
        g.appendChild(
          UI.svg("text", { x: 150, y: 206, class: "fig__minitext" }, [txt("HC-SR04")])
        );

        /* ── 아두이노와 주고받는 두 신호 ────────────────────────────
           화살표 «방향» 이 이 그림의 절반이다.
           Trig 는 들어오고(명령), Echo 는 나간다(알림). */
        g.appendChild(
          UI.svg("line", {
            x1: 34, y1: TRIG_Y, x2: 92, y2: TRIG_Y, class: "figson__signal figson__signal--in"
          })
        );
        g.appendChild(arrowHead(98, TRIG_Y, "right", "figarrow figarrow--in"));
        g.appendChild(
          UI.svg("text", { x: NAME_X, y: TRIG_Y - 11, class: "figson__signame" }, [txt("Trig")])
        );

        g.appendChild(
          UI.svg("line", {
            x1: 98, y1: ECHO_Y, x2: 40, y2: ECHO_Y, class: "figson__signal figson__signal--out"
          })
        );
        g.appendChild(arrowHead(34, ECHO_Y, "left", "figarrow figarrow--out"));
        g.appendChild(
          UI.svg("text", { x: NAME_X, y: ECHO_Y - 11, class: "figson__signame" }, [txt("Echo")])
        );
        g.appendChild(
          UI.svg("text", { x: SIDE_X, y: 134, class: "figson__side" }, [txt("아두이노 쪽")])
        );

        /* ── 물체 ──────────────────────────────────────────────── */
        g.appendChild(
          UI.svg("rect", {
            x: WALL_X, y: 48, width: WALL_W, height: 160, rx: 3, class: "figobj__wall"
          })
        );
        g.appendChild(
          UI.svg("text", { x: WALL_X + WALL_W / 2, y: 228, class: "fig__minitext" }, [txt("물체")])
        );

        /* ── 나가는 길 (위) ────────────────────────────────────── */
        var goFrom = HORN_X + HORN_R + 4;
        g.appendChild(
          UI.svg("path", {
            d: "M " + goFrom + " " + TRIG_Y + " L 432 " + TRIG_Y, class: "figpath figpath--go"
          })
        );
        g.appendChild(arrowHead(444, TRIG_Y, "right", "figarrow figarrow--go"));
        [278, 336, 394].forEach(function (cx) {
          g.appendChild(
            UI.svg("path", {
              d: "M " + cx + " " + (TRIG_Y - 13) + " Q " + (cx + 13) + " " + TRIG_Y +
                 " " + cx + " " + (TRIG_Y + 13),
              class: "figpath__arc"
            })
          );
        });
        g.appendChild(
          UI.svg("text", { x: 344, y: TRIG_Y - 26, class: "fig__minitext" }, [txt("나간다 (발사)")])
        );

        /* ── 부딪혀 돌아서는 자리 — 물체 면에 붙여 그린다 ─────────── */
        g.appendChild(
          UI.svg("path", {
            d: "M 448 " + TRIG_Y + " Q 464 130 448 " + ECHO_Y, class: "figpath figpath--turn"
          })
        );

        /* ── 돌아오는 길 (아래) ────────────────────────────────── */
        g.appendChild(
          UI.svg("path", {
            d: "M 444 " + ECHO_Y + " L " + (goFrom + 12) + " " + ECHO_Y,
            class: "figpath figpath--back"
          })
        );
        g.appendChild(arrowHead(goFrom, ECHO_Y, "left", "figarrow figarrow--back"));
        [394, 336, 278].forEach(function (cx) {
          g.appendChild(
            UI.svg("path", {
              d: "M " + cx + " " + (ECHO_Y - 13) + " Q " + (cx - 13) + " " + ECHO_Y +
                 " " + cx + " " + (ECHO_Y + 13),
              class: "figpath__arc figpath__arc--back"
            })
          );
        });
        g.appendChild(
          UI.svg("text", { x: 344, y: ECHO_Y + 34, class: "fig__minitext" }, [
            txt("부딪혀 돌아온다 (반사 → 수신)")
          ])
        );

        /* ── 배지 넷 — 저마다 «부품» 을 가리킨다 ──────────────────── */
        g.appendChild(leader(BADGE_X, 70, BADGE_X, TRIG_Y - LEAD_GAP));
        g.appendChild(badge(1, BADGE_X, 58));

        g.appendChild(leader(HORN_X, 46, HORN_X, TRIG_Y - HORN_R - LEAD_GAP));
        g.appendChild(badge(2, HORN_X, 34));

        g.appendChild(leader(501, 130, WALL_X + WALL_W + LEAD_GAP, 130));
        g.appendChild(badge(3, 512, 130));

        g.appendChild(leader(BADGE_X, 190, BADGE_X, ECHO_Y + LEAD_GAP));
        g.appendChild(badge(4, BADGE_X, 202));

        /* ── 아래 두 줄 ────────────────────────────────────────── */
        g.appendChild(
          UI.svg("text", { x: 250, y: 228, class: "fig__minitext" }, [
            txt("Echo 가 HIGH 인 시간 = 나갔다가 돌아온 시간")
          ])
        );
      }
    });
  }

  /**
   * ③ 편도와 왕복 — 수직선으로 «두 번 지나간다» 를 보인다.
   *
   * ★ 이 그림이 명세 6.2 두 번째 줄이 요구한 것이다.
   *   글로 «두 번 지난다» 고만 적으면 학생이 넘겨 읽는다.
   *   같은 길이를 두 번 그려 놓고 «잰 것은 이 둘의 합» 이라고 짚어야 남는다.
   *
   * ★★ 배지 ③·④ 가 가리킬 것을 새로 그렸다.
   *   ③ 「이 둘을 합한 왕복」 → 두 토막을 함께 묶는 «꺾쇠»
   *   ④ 「2 로 나누면 편도」   → 맨 위의 «편도» 수직선
   *   앞 판에서는 둘 다 토막의 «끝 모서리» 를 비스듬히 찍고 있어서
   *   무엇을 가리키는지 알 수 없었고, 지시선이 토막에 닿아 있었다.
   *
   * ★ 지시선 넷 모두 가리키는 것에서 LEAD_GAP 만큼 앞에서 멈춘다.
   */
  function roundTripFigure() {
    var X0 = 70;
    var X1 = 430;
    var Y = 92;                    /* 편도 수직선 */
    var Y2 = 168;                  /* 두 토막 */
    var LEG_H = 24;
    var LEAD_GAP = 8;
    var HALF = (X1 - X0) / 2;
    var BRACE_Y = Y2 + LEG_H / 2 + 18;

    return figure({
      viewBox: "0 0 520 264",
      caption: "우리가 잰 시간은 «두 번» 지나간 시간이다",
      items: [
        { text: "센서에서 물체까지 — 이것이 우리가 알고 싶은 «편도» 거리다." },
        { text: "물체에서 센서까지 — 돌아오는 길이다. 편도와 «같은» 거리다." },
        { text: "센서가 잰 것은 이 둘을 합한 «왕복» 이다 — 편도의 두 배." },
        { text: "그래서 왕복으로 구한 길이를 2 로 나누면 편도가 된다." }
      ],
      build: function (g) {
        /* ── 센서와 물체 ────────────────────────────────────────── */
        g.appendChild(
          UI.svg("rect", { x: X0 - 34, y: Y - 24, width: 34, height: 48, rx: 4, class: "figson__pcb" })
        );
        g.appendChild(
          UI.svg("text", { x: X0 - 17, y: Y + 5, class: "figson__hornlabel" }, [txt("S")])
        );
        g.appendChild(
          UI.svg("text", { x: X0 - 17, y: Y + 42, class: "fig__minitext" }, [txt("센서")])
        );
        g.appendChild(
          UI.svg("rect", { x: X1, y: Y - 34, width: 16, height: 68, rx: 3, class: "figobj__wall" })
        );
        g.appendChild(
          UI.svg("text", { x: X1 + 8, y: Y + 52, class: "fig__minitext" }, [txt("물체")])
        );

        /* ── 편도 한 번 — 배지 ④ 가 가리키는 것이다 ────────────────
           이름표는 가운데에, 배지는 왼쪽에 둔다. 같은 x 에 두면 지시선이 글자를 뚫는다. */
        g.appendChild(UI.svg("line", { x1: X0, y1: Y, x2: X1, y2: Y, class: "figtrip__line" }));
        g.appendChild(
          UI.svg("text", { x: (X0 + X1) / 2, y: Y - 12, class: "figtrip__cap" }, [
            txt("편도 " + SAMPLE_D + "cm")
          ])
        );

        /* ── 아래에 «두 번» 을 나란히 그린다 ─────────────────────── */
        [
          { from: X0, to: X0 + HALF, cls: "go", label: "① 나가는 길 " + SAMPLE_D + "cm" },
          { from: X0 + HALF, to: X1, cls: "back", label: "② 돌아오는 길 " + SAMPLE_D + "cm" }
        ].forEach(function (leg) {
          g.appendChild(
            UI.svg("rect", {
              x: leg.from, y: Y2 - LEG_H / 2, width: leg.to - leg.from, height: LEG_H,
              class: "figtrip__leg figtrip__leg--" + leg.cls
            })
          );
          g.appendChild(
            UI.svg("text", { x: (leg.from + leg.to) / 2, y: Y2 + 5, class: "figtrip__legtext" }, [
              txt(leg.label)
            ])
          );
        });

        /* ── 두 토막을 함께 묶는 꺾쇠 — 배지 ③ 이 가리키는 것이다 ── */
        g.appendChild(
          UI.svg("path", {
            d: "M " + X0 + " " + (BRACE_Y - 8) +
               " L " + X0 + " " + BRACE_Y +
               " L " + X1 + " " + BRACE_Y +
               " L " + X1 + " " + (BRACE_Y - 8),
            class: "figform__brace"
          })
        );
        g.appendChild(
          UI.svg("text", { x: (X0 + X1) / 2, y: BRACE_Y + 22, class: "figtrip__cap" }, [
            txt("센서가 잰 것 = 왕복 " + SAMPLE_D * 2 + "cm = " + SAMPLE_US + "μs")
          ])
        );

        /* ── 배지 넷 ──────────────────────────────────────────────── */
        [X0 + HALF / 2, X1 - HALF / 2].forEach(function (cx, i) {
          g.appendChild(leader(cx, Y2 - LEG_H / 2 - 19, cx, Y2 - LEG_H / 2 - LEAD_GAP));
          g.appendChild(badge(i + 1, cx, Y2 - LEG_H / 2 - 30));
        });
        g.appendChild(leader(451, BRACE_Y, X1 + LEAD_GAP, BRACE_Y));
        g.appendChild(badge(3, 462, BRACE_Y));
        g.appendChild(leader(120, Y - 29, 120, Y - LEAD_GAP));
        g.appendChild(badge(4, 120, Y - 40));

        g.appendChild(
          UI.svg("text", { x: (X0 + X1) / 2, y: 252, class: "fig__minitext" }, [
            txt("알고 싶은 것은 편도 — 그래서 2 로 나눈다")
          ])
        );
      }
    });
  }

  /**
   * ④ 거리 공식 — 왜 2 로 나누는가
   *
   * ★★ 앞 판에서 어긋난 것이 셋이다.
   *   ① 「거리 =」 가 첫 상자와 «맞붙어» 「거리 =duration」 처럼 읽혔다.
   *      상자는 x−w/2 에서 시작하는데 글은 눈으로 고른 x 에 두어서 겹친 것이다.
   *   ② 배지 ③ 이 상자 «사이의 빈 곳» 을 가리켰다. 「여기까지가 왕복 전체 길이」
   *      라고 설명하는데 그 «여기까지» 가 그림에 없었다.
   *   ③ 배지가 상자에서 2px 떨어져 거의 닿아 있었다.
   *
   * ★ 고친 방식 — 자리를 «이어서» 잰다.
   *   상자를 왼쪽부터 차례로 쌓으며 x 를 계산하고(GAP 만큼 띄운다),
   *   「거리 =」 는 첫 상자 왼끝에서 EQ_GAP 만큼 물러선 자리에 둔다.
   *   숫자를 손으로 적지 않으므로 상자 크기를 고쳐도 겹치지 않는다.
   *
   * ★ 배지 ③ 은 상자 １·２ 를 함께 묶는 «꺾쇠» 를 가리킨다.
   *   그 꺾쇠가 곧 「소리가 지나간 전체 길이(왕복)」 이고, 그래서 다음이 ÷ 2 다.
   */
  function formulaFigure() {
    var BOX_TOP = 96;
    var BOX_H = 44;
    var BOX_BOTTOM = BOX_TOP + BOX_H;
    var LEAD_GAP = 8;
    var GAP = 22;              /* 상자 사이 */
    var EQ_GAP = 18;           /* 「거리 =」 와 첫 상자 사이 */

    /* 상자를 왼쪽부터 이어서 쌓는다 — x 를 손으로 적지 않는다 */
    var LEFT = 92;
    var specs = [
      { text: "duration", w: 126 },
      { text: "× " + SPEED, w: 104 },
      { text: "÷ 2", w: 76 }
    ];
    var cursor = LEFT;
    var boxes = specs.map(function (s) {
      var b = { text: s.text, x: cursor, w: s.w, cx: cursor + s.w / 2 };
      cursor += s.w + GAP;
      return b;
    });
    var BRACE_RIGHT = boxes[1].x + boxes[1].w;   /* 상자 １·２ 를 함께 묶는다 */
    var BRACE_Y = BOX_BOTTOM + 18;

    return figure({
      viewBox: "0 0 520 264",
      caption: "시간에서 거리를 얻는 식",
      items: [
        { text: "duration — pulseIn 이 돌려준 «왕복 시간». 단위는 마이크로초(μs) 다." },
        {
          text:
            "× " + SPEED + " — 소리의 빠르기. 1마이크로초에 " + SPEED +
            "cm 간다(340m/s 를 cm/μs 로 바꾼 값)."
        },
        { text: "여기까지가 «소리가 지나간 전체 길이» 다. 아직 왕복이다." },
        { text: "÷ 2 — 왕복이므로 반으로 나누어 편도, 곧 물체까지의 거리를 얻는다." }
      ],
      build: function (g) {
        /* ── 「거리 =」 — 첫 상자에서 EQ_GAP 만큼 물러선 자리 ─────────
           text-anchor 가 end 라 «오른끝» 이 이 x 다. 그래서 상자와 겹칠 수 없다. */
        g.appendChild(
          UI.svg("text", {
            x: LEFT - EQ_GAP, y: BOX_TOP + 29, class: "figform__eq figform__eq--right"
          }, [txt("거리 =")])
        );

        /* ── 상자 셋 ────────────────────────────────────────────── */
        boxes.forEach(function (b) {
          g.appendChild(
            UI.svg("rect", {
              x: b.x, y: BOX_TOP, width: b.w, height: BOX_H, rx: 6, class: "figform__box"
            })
          );
          g.appendChild(
            UI.svg("text", { x: b.cx, y: BOX_TOP + 29, class: "figform__text" }, [txt(b.text)])
          );
        });

        /* ── 상자 １·２ 를 묶는 꺾쇠 — 배지 ③ 이 가리킬 «것» 이다 ──── */
        g.appendChild(
          UI.svg("path", {
            d: "M " + LEFT + " " + (BRACE_Y - 8) +
               " L " + LEFT + " " + BRACE_Y +
               " L " + BRACE_RIGHT + " " + BRACE_Y +
               " L " + BRACE_RIGHT + " " + (BRACE_Y - 8),
            class: "figform__brace"
          })
        );
        g.appendChild(
          UI.svg("text", {
            x: (LEFT + BRACE_RIGHT) / 2, y: BRACE_Y + 22, class: "figform__bracelabel"
          }, [txt("여기까지가 «왕복» 전체 길이")])
        );

        /* ── 배지 넷 ────────────────────────────────────────────────
           ① ② ④ 는 상자를 위에서, ③ 은 꺾쇠를 왼쪽에서 가리킨다.
           ③ 을 아래에 두면 지시선이 꺾쇠 이름표를 뚫고 지나간다. */
        [0, 1].forEach(function (i) {
          var cx = boxes[i].cx;
          g.appendChild(leader(cx, 65, cx, BOX_TOP - LEAD_GAP));
          g.appendChild(badge(i + 1, cx, 54));
        });
        g.appendChild(leader(boxes[2].cx, 65, boxes[2].cx, BOX_TOP - LEAD_GAP));
        g.appendChild(badge(4, boxes[2].cx, 54));

        g.appendChild(leader(69, BRACE_Y, LEFT - LEAD_GAP, BRACE_Y));
        g.appendChild(badge(3, 58, BRACE_Y));

        /* ── 실제 숫자를 한 번 넣어 본다 ────────────────────────── */
        g.appendChild(
          UI.svg("text", { x: 260, y: 214, class: "figform__sample" }, [
            txt(
              SAMPLE_US + " × " + SPEED + " ÷ 2 = " +
              Math.round(SAMPLE_US * SPEED * 100) / 100 + " ÷ 2 ≈ " + SAMPLE_D + " cm"
            )
          ])
        );

        g.appendChild(
          UI.svg("text", { x: 260, y: 244, class: "fig__minitext" }, [
            txt("★ ÷ 2 를 빠뜨리면 값이 꼭 두 배로 나온다")
          ])
        );
      }
    });
  }

  /**
   * ⑤ 센서의 네 단자 — 어느 다리가 어디로 가는가
   *
   * ★★ 한 다리마다 «넷» 이 세로로 줄지어 선다 —
   *   ⓐ 다리 끝(패드) · ⓑ 배지 · ⓒ 이름(VCC…) · ⓓ 이을 곳(5V…).
   *   높이를 눈으로 골라 적으면 두 곳이 겹친다(실제로 그랬다) —
   *     · 지시선이 「→ D6」 글자를 뚫고 지나갔다
   *     · 배지 넷이 맨 아래 주석을 덮었다
   *   그래서 높이를 «패드에서 이어서» 잰다. 아래 숫자 하나만 고치면
   *   나머지가 따라 내려가므로 다시 겹치지 않는다.
   *
   * ★ 배지를 이름 «위» 에 둔 까닭 — 배지가 가리켜야 하는 것은 «다리» 다.
   *   배지를 맨 아래에 두면 지시선이 이름과 이을 곳을 지나서 올라가야 한다.
   *
   * ★★ 「→ 5V」 를 「5V」 로 바꾸었다(지적 2026-08-22).
   *   이을 곳이 이름 «아래» 에 오는데 화살표는 «오른쪽» 을 가리켜서,
   *   가리키는 방향과 놓인 자리가 어긋났다. 화살표를 없애고 대신
   *   줄 왼쪽에 «이 줄이 무엇인가» 를 적는다 — 그림이 스스로 설명한다.
   */
  function sensorPinsFigure() {
    var BODY_Y = 60;
    var BODY_H = 84;
    var LEAD_GAP = 8;
    var PAD_R = 5;

    /* 패드 아래로 이어지는 네 칸. 모두 «패드 중심에서» 잰다. */
    var D_LEAD_TIP = PAD_R + LEAD_GAP;   /* 13 — 지시선이 멈추는 자리 */
    var D_LEAD_TAIL = 27;                /* 지시선 시작 */
    var D_BADGE = 38;                    /* 배지 가운데 (반지름 11) */
    var D_NAME = 70;                     /* VCC · Trig · Echo · GND */
    var D_GOAL = 94;                     /* 5V · D6 · D5 · GND */

    /* bigSensor 는 이름을 y + h + nameDy 에 그린다. 패드는 y + h + 22 다. */
    var PIN_DY = 22;
    var ROW_LABEL_X = 124;               /* 줄 이름표 — 오른끝이 여기다 */

    return figure({
      viewBox: "0 0 520 300",
      caption: "HC-SR04 의 네 단자와 갈 곳",
      items: [
        { text: "VCC — 우노 " + PINS.vcc + " 로. 센서가 일할 힘을 받는다. 3V3 에 꽂으면 힘이 모자라다." },
        {
          text:
            "Trig — 우노 " + PINS.trig + " 로. 아두이노가 «쏴라» 고 " + PULSE_US +
            "μs 동안 HIGH 를 보낸다(pinMode OUTPUT)."
        },
        {
          text:
            "Echo — 우노 " + PINS.echo +
            " 로. 초음파가 돌아오는 동안 HIGH 로 있어 시간을 알린다(pinMode INPUT)."
        },
        { text: "GND — 우노 " + PINS.gnd + " 로. 전류가 돌아오는 길이자 전압의 기준이다." }
      ],
      build: function (g) {
        g.appendChild(
          UI.svg("text", { x: 260, y: 46, class: "fig__minitext" }, [
            txt("왼쪽 T 가 내보내고, 오른쪽 R 이 받는다")
          ])
        );

        var s = bigSensor(g, 140, BODY_Y, {
          w: 240, h: BODY_H, r: 32, gap: 44, nameDy: PIN_DY + D_NAME
        });

        var goals = [PINS.vcc, PINS.trig, PINS.echo, PINS.gnd];
        var pinY = s.pins[0].y;

        /* 줄 왼쪽에 «이 줄이 무엇인가» 를 적는다 — 화살표 없이 뜻이 선다 */
        g.appendChild(
          UI.svg("text", { x: ROW_LABEL_X, y: pinY + D_NAME, class: "figson__rowlabel" }, [
            txt("다리 이름")
          ])
        );
        g.appendChild(
          UI.svg("text", { x: ROW_LABEL_X, y: pinY + D_GOAL, class: "figson__rowlabel" }, [
            txt("우노에 이을 곳")
          ])
        );

        s.pins.forEach(function (pin, i) {
          /* 지시선은 «다리 끝» 을 가리킨다 */
          g.appendChild(leader(pin.x, pin.y + D_LEAD_TAIL, pin.x, pin.y + D_LEAD_TIP));
          g.appendChild(badge(i + 1, pin.x, pin.y + D_BADGE));
          g.appendChild(
            UI.svg("text", { x: pin.x, y: pin.y + D_GOAL, class: "figson__goal" }, [txt(goals[i])])
          );
        });

        g.appendChild(
          UI.svg("text", { x: 260, y: 290, class: "fig__minitext" }, [
            txt("★ pinMode 는 «아두이노 쪽에서 본 것» 이다 — Trig 는 OUTPUT, Echo 는 INPUT")
          ])
        );
      }
    });
  }

  /**
   * 측정 범위 그림 — 너무 가깝거나 멀면 왜 안 되는가 (명세 4장 여섯 번째 줄)
   * 2단계 카드에 붙이지 않고 5단계에서 쓴다.
   */
  function rangeFigure() {
    return figure({
      viewBox: "0 0 520 190",
      caption: "잴 수 있는 거리는 " + D_MIN + " ~ " + D_MAX + "cm",
      items: [
        { text: D_MIN + "cm 보다 가까우면 되돌아온 소리가 «보낸 소리와 겹쳐» 셀 수 없다." },
        { text: "이 안이 잘 되는 자리다. 실습에서 쓰는 " + (PC.MEASURE_TARGETS || [10, 20, 30]).join("·") + "cm 가 여기에 있다." },
        { text: D_MAX + "cm 를 넘으면 소리가 퍼져서 센서에 닿는 양이 너무 적어진다." },
        { text: "★ 이 «안» 이라도 각도·재질에 따라 실패할 수 있다 — 범위는 가장 좋은 조건에서의 값이다." }
      ],
      build: function (g) {
        var y = 84;
        var x0 = 46;
        var x1 = 474;

        var bands = [
          { from: x0, to: 110, cls: "low", label: "너무 가깝다" },
          { from: 110, to: 400, cls: "hear", label: "잘 되는 자리" },
          { from: 400, to: x1, cls: "ultra", label: "너무 멀다" }

        bands.forEach(function (b) {
