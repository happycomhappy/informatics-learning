           .cond(flex 컨테이너) 의 «네 번째 항목» 이 된다. 그러면 설명이
           가로폭을 차지하면서 라벨 칸을 0 으로 눌러, 「pulseIn(echoPin, HIGH)」
           같은 긴 이름이 «한 글자씩 세로로» 적힌다(지적 2026-08-22). */
        list.appendChild(UI.conditionRow(t.label, t.ok, !t.ok ? t.message : ""));
      });
      testPanel.appendChild(list);

      UI.clear(warnPanel);
      (result.warnings || []).forEach(function (w) {
        warnPanel.appendChild(UI.alert("info", (w.line ? w.line + "번 줄 — " : "") + w.message));
      });

      /* 상태에 남긴다 — 제출 자료가 이 값을 쓴다 (명세 7장) */
      var info = result.ast ? A.codePins(result.ast) : {};
      var errs = [];
      if (!result.parsed && result.error) {
        errs.push({ kind: "syntax", line: result.error.line, message: result.error.message });
      }
      result.tests.forEach(function (t) {
        if (!t.ok && t.message) errs.push({ kind: t.id, line: 0, message: t.message });
      });

      app.patch(function (s) {
        s.code.source = currentSource;
        s.code.testsPassed = passed;
        s.code.testsTotal = total;
        s.code.errors = errs.slice(0, 30);
        s.code.trigPin = info.trigPin === undefined ? null : info.trigPin;
        s.code.echoPin = info.echoPin === undefined ? null : info.echoPin;
        s.code.trigMode = info.trigMode || "";
        s.code.echoMode = info.echoMode || "";

        var last = s.code.history[s.code.history.length - 1];
        if (!last || last.passed !== passed || last.mode !== currentMode) {
          s.code.history.push({
            at: new Date().toISOString(),
            mode: currentMode,
            passed: passed,
            total: total
          });
          if (s.code.history.length > 30) s.code.history = s.code.history.slice(-30);
        }

        /* ★ 방식마다 «다 통과한 적이 있는가» 를 따로 남긴다. 한 번 참이면 그대로 둔다. */
        if (passed === total) {
          if (currentMode === "assemble") s.code.assembleDone = true;
          if (currentMode === "blank") s.code.blanksDone = true;
        }
      });

      paintModeDone();
      app.rerenderNav();
      return result;
    }

    function setSource(next) {
      currentSource = next;
      refreshTests();
    }

    /* ---------------- 방식별 입력 ---------------- */

    function buildMode() {
      UI.clear(modeHost);

      if (currentMode === "assemble") {
        /* ★ (source, order) 차례다 — s50-editor.js 의 tell() 머리말 참고 */
        var asm = ED.assembler(code.assembleOrder, function (source, order) {
          app.patch(function (s) {
            s.code.assembleOrder = order;
          });
          setSource(source);
        });
        modeHost.appendChild(
          el("p", {
            class: "para",
            text:
              "열여덟 줄이 섞여 있습니다. ⠿ 를 끌어 옮기거나 ▲▼ 단추로 바른 차례로 놓으세요. " +
              "★ 같은 글이 두 번 나오는 줄이 있습니다 — 프로그램이 같으면 어느 것을 어디에 두어도 됩니다."
          })
        );
        modeHost.appendChild(asm.root);
        setSource(asm.getSource());
        return;
      }

      if (currentMode === "blank") {
        /* ★ ED.blanks 의 onChange 는 (source, values) 차례로 부른다.
           순서를 뒤집어 받으면 «적은 값» 자리에 코드 글이 들어가고,
           코드 자리에 객체가 들어가 검사가 통째로 실패한다. */
        var bl = ED.blanks(code.blanks, function (source, values) {
          app.patch(function (s) {
            s.code.blanks = values;
          });
          setSource(source);
        });
        modeHost.appendChild(
          el("p", {
            class: "para",
            text:
              "다섯 칸만 직접 적습니다 — Trig 펄스 세 줄과 시간·거리 두 줄입니다. " +
              "나머지는 그대로 두세요."
          })
        );
        modeHost.appendChild(bl.root);
        setSource(bl.getSource());
        return;
      }

      var ed = ED.editor(currentSource || A.REFERENCE_CODE, function (value) {
        setSource(value);
      });
      modeHost.appendChild(
        el("p", { class: "para", text: "처음부터 끝까지 직접 고쳐 씁니다. 줄 번호와 색이 함께 나옵니다." })
      );
      modeHost.appendChild(ed.root);
      setSource(ed.getValue());
    }

    /* ---------------- 실행 단추 ---------------- */

    runRow.appendChild(
      UI.button("내 코드 실행", {
        click: function () {
          var result = A.validate(currentSource, ctx());
          if (!result.parsed) {
            UI.toast("먼저 문법 오류를 고쳐 주세요.");
            return;
          }
          runner.run(currentSource, {});
          app.patch(function (s) {
            s.code.ran = true;
            s.code.attempts += 1;
          });
          app.rerenderNav();
        }
      })
    );
    runRow.appendChild(
      UI.button("멈춤", {
        class: "btn btn--ghost",
        click: function () {
          runner.stop();
        }
      })
    );
    runRow.appendChild(
      UI.button("예시 코드 넣기", {
        class: "btn btn--ghost",
        title: "③ 전체 편집에서만 쓸 수 있습니다.",
        disabled: currentMode !== "edit",
        click: function () {
          app.update(function (s) {
            s.code.source = A.REFERENCE_CODE;
          });
        }
      })
    );

    var makeCard = UI.card(
      {
        title: "코드 만들기",
        desc: "①→②→③ 차례로 열립니다. 아무 때나 앞 방식으로 돌아갈 수 있습니다."
      },
      [modeTabs, modeHost, testPanel, warnPanel, runRow, runner.viewHost, runner.panelHost]
    );

    box.appendChild(makeCard);
    paintModeDone();
    buildMode();

    /* 3단계 회로가 아직이면 마지막 검사가 늘 실패한다 — 그 까닭을 미리 알린다 */
    if (state.circuit.connections.length === 0) {
      box.appendChild(
        UI.alert("warn", "3단계에서 회로를 먼저 이어야 «핀 대조» 검사를 통과할 수 있습니다.")
      );
    }

    return box;
  }

  /* ================================================================== */
  /* 5단계 — 실행·탐구                                                   */
  /* ================================================================== */

  function renderExperiment(state, app) {
    var box = el("div");
    var exp = state.experiment;
    var source = state.code.source || A.REFERENCE_CODE;

    function worldFor(distance, angle, material, seed) {
      return {
        trigPin: PC.TRIG_PIN,
        echoPin: PC.ECHO_PIN,
        powered: C.analyze(state.circuit.connections).powered,
        distance: distance,
        angle: angle || exp.angle,
        material: material || exp.material,
        seed: seed === undefined ? 1 : seed
      };
    }

    /** 한 번 재고 그 결과를 상태에 담는다 */
    function measureOnce(distance, angle, material, seed) {
      var result = A.run(source, { loopLimit: 1, world: worldFor(distance, angle, material, seed) });
      var rec = A.lastMeasure(result);
      var reported = rec ? A.reportedFor(result, rec) : null;
      var measured =
        rec && rec.ok ? (reported === null ? A.idealDistance(rec.duration) : reported) : 0;
      return {
        result: result,
        rec: rec,
        duration: rec ? rec.duration : 0,
        measured: Math.round(measured * 100) / 100,
        error: rec && rec.ok ? Math.round((measured - distance) * 100) / 100 : 0,
        ok: !!(rec && rec.ok),
        reason: rec ? rec.reason : "no-read"
      };
    }

    /* ---------------- ① 센서 상태 확인 ---------------- */

    box.appendChild(sectionTitle("①", "지금 센서는 무엇을 할 수 있나"));

    var codeInfo = { trigPin: state.code.trigPin, echoPin: state.code.echoPin, trigMode: state.code.trigMode, echoMode: state.code.echoMode };
    var sensor = C.sensorState(state.circuit.connections, codeInfo);

    box.appendChild(
      UI.card({ title: "센서 상태", desc: "회로와 코드를 함께 보고 판정합니다." }, [
        el("div", { class: "sensorstate" }, [
          el("div", { class: "sensorstate__row" }, [
            el("span", { class: "sensorstate__key", text: "전원" }),
            badge(sensor.powered ? "true" : "false", sensor.powered ? "들어옴" : "없음")
          ]),
          el("div", { class: "sensorstate__row" }, [
            el("span", { class: "sensorstate__key", text: "펄스 발사 (Trig)" }),
            badge(sensor.canPulse ? "true" : "false", sensor.canPulse ? "가능" : "불가")
          ]),
          el("div", { class: "sensorstate__row" }, [
            el("span", { class: "sensorstate__key", text: "시간 읽기 (Echo)" }),
            badge(sensor.canRead ? "true" : "false", sensor.canRead ? "가능" : "불가")
          ])
        ]),
        UI.alert(sensor.reason === "ready" ? "ok" : "warn", sensor.text)
      ])
    );

    /* ---------------- ② 물체와 거리 그림 ----------------
     * ★★ 2026-08-22 — 「10·20·30cm 를 재 봅시다」 블럭을 걷어 냈다(지적).
     *   세 거리를 따로 재던 자리를 없애고, 조건을 바꾸어 재는 ③ 하나로 모았다.
     *   그림(makeScene)만 남겨 ③ 의 조건 단추 «옆» 으로 옮겼다 —
     *   무엇을 어떻게 놓고 재는지는 조건을 고르는 자리에서 보여야 한다.
     *
     * ★ 단계 통과 조건도 함께 바꾸었다(schema.js 의 case "experiment").
     *   세 거리 재기가 없어졌으므로 그것을 요구하면 5단계를 지날 길이 없다.
     * ---------------------------------------------------------------- */

    var scene = makeScene({
      distance: exp.distance,
      angle: exp.angle,
      material: exp.material
    });


    /* ---------------- ② 조건 바꾸기 — 이 단계의 통과 조건이다 ----------------
     * ★ 2026-08-22 까지는 «접어 둔 자리» 였다. ② 세 거리 재기를 걷어 내면서
     *   이 블럭이 5단계의 실험 자리가 되었다 — 그래서 통과 조건도 여기로 옮겼다.
     * ---------------------------------------------------------------- */

    box.appendChild(sectionTitle("②", "조건을 바꾸면 어떻게 될까"));

    var condCard = UI.card(
      {
        title: "각도와 재질을 바꾸어 보기",
        desc:
          "★ 한 번에 «하나만» 바꿉니다. 두 가지를 함께 바꾸면 무엇 때문에 달라졌는지 알 수 없습니다. " +
          "이 활동은 다음 단계로 가는 조건이 아닙니다."
      },
      []
    );
    var condBody = condCard.querySelector(".card__body");

    /* 지금 조건 고르기 */
    function pickerRow(label, list, currentId, onPick) {
      return el("div", { class: "pickrow" }, [
        el("span", { class: "pickrow__label", text: label })
      ].concat(
        list.map(function (item) {
          var on = item.id === currentId;
          return UI.button(item.label, {
            class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
            attrs: { "aria-pressed": on ? "true" : "false", title: item.full || "" },
            click: function () {
              if (on) return;
              onPick(item.id);
            }
          });
        })
      ));
    }

    /**
     * ★★ 그림을 조건 단추 «옆» 에 붙인다(지적 2026-08-22).
     *
     *   그림은 본래 ② 「10·20·30cm 를 재 봅시다」 안에 있었다. 그 블럭을 걷어 내면서
     *   여기로 옮겼다 — 무엇을 어떻게 놓고 재는지는 «조건을 고르는 자리» 에서
     *   보여야 뜻이 선다. 각도·재질을 고르면 그림도 곧바로 함께 바뀐다
     *   (pickerRow 가 app.update 를 부르므로 화면이 다시 그려진다).
     *
     * ★ 900px 아래에서는 .split 이 한 칸으로 접힌다 — 그림이 위, 단추가 아래다.
     */
    var condSplit = split("split--wide-left");
    condSplit.left.appendChild(scene.root);
    condSplit.right.appendChild(
      pickerRow("물체의 각도", PC.ANGLES, exp.angle, function (id) {
        app.update(function (s) {
          s.experiment.angle = id;
        });
      })
    );
    condSplit.right.appendChild(
      pickerRow("물체의 재질", PC.MATERIALS, exp.material, function (id) {
        app.update(function (s) {
          s.experiment.material = id;
        });
      })
    );
    condBody.appendChild(condSplit.root);

    var nowAngle = PC.angleOf(exp.angle);
    var nowMaterial = PC.materialOf(exp.material);
    condBody.appendChild(
      el("div", { class: "condnote" }, [
        el("p", { class: "para", text: "각도 — " + nowAngle.note }),
        el("p", { class: "para", text: "재질 — " + nowMaterial.note }),
        el("p", { class: "para" }, [
          el("b", { text: "되돌아오는 신호 : " }),
          el("span", {
            text:
              Math.round(A.echoLevel(exp.distance, exp.angle, exp.material) * 100) + "% " +
              "(" + exp.distance + "cm 에서)"
          })
        ])
      ])
    );

    /* 미리 짜 둔 다섯 조합 — 하나씩 눌러 견준다 */
    var trialTable = el("tbody");
    L.CONDITIONS.forEach(function (item) {
      var t = exp.trials[item.id] || {};
      trialTable.appendChild(
        el("tr", { class: t.ran ? "is-done" : "" }, [
          el("th", { attrs: { scope: "row" }, text: item.label }),
          el("td", { text: t.ran ? (t.ok ? t.duration + " μs" : "실패") : "—" }),
          el("td", { text: t.ran && t.ok ? t.measured + " cm" : "—" }),
          el("td", { text: t.ran && t.ok ? (t.error > 0 ? "+" : "") + t.error + " cm" : "—" }),
          el("td", {}, [
            UI.button(t.ran ? "다시" : "재기", {
              class: "btn btn--ghost btn--small",
              click: function () {
                var out = measureOnce(item.distance, item.angle, item.material, 7);
                app.update(function (s) {
                  s.experiment.trials[item.id] = {
                    ran: true,
                    distance: item.distance,
                    duration: out.duration,
                    measured: out.measured,
                    error: out.error,
                    ok: out.ok,
                    reason: out.reason
                  };
                  s.experiment.angle = item.angle;
                  s.experiment.material = item.material;
                });
                UI.toast(out.ok ? "왕복 " + out.duration + "μs" : "측정 실패 — " + out.reason);
              }
            })
          ])
        ])
      );
    });

    condBody.appendChild(
      el("table", { class: "exptable" }, [
        el("thead", {}, [
          el("tr", {}, [
            el("th", { text: "조건" }),
            el("th", { text: "왕복 시간" }),
            el("th", { text: "계산 거리" }),
            el("th", { text: "오차" }),
            el("th", { text: "" })
          ])
        ]),
        trialTable
      ])
    );

    condBody.appendChild(
      el(
        "ul",
        { class: "keypoints" },
        L.CONDITIONS.map(function (item) {
          return el("li", { class: "keypoints__item" }, [
            el("span", { text: item.label + " — " + item.expect + " (" + item.why + ")" })
          ]);
        })
      )
    );

    condBody.appendChild(
      UI.field(
        {
          label: "조건을 바꾸어 보고 알게 된 것",
          multiline: true,
          rows: 3,
          placeholder: "예) 천으로 바꾸니 값이 흔들리고, 비스듬하게까지 하면 아예 실패했다."
        },
        exp.conditionNote || "",
        function (value) {
          app.patch(function (s) {
            s.experiment.conditionNote = value;
          });
        }
      ).root
    );

    condBody.appendChild(
      /**
       * ★★ 2026-08-22 에 다시 짰다(지적).
       *
       *   전에는 «글 두 줄 → 알림 → 단추 둘» 이 위아래로 흩어져 있었고,
       *   무엇보다 결과가 **토스트**로 나와 3초 뒤 사라졌다 —
       *   눌러 보고 무엇이 나왔는지 다시 볼 수 없었다.
       *
       *   이제 두 경우를 «나란한 두 칸» 으로 갈라, 각 칸 안에
       *   [까닭 → 재 보기 단추 → 결과] 를 세로로 쌓는다. 결과는 그 자리에 남는다.
       *
       * ★ 두 칸은 900px 아래에서 한 칸으로 접힌다(.split).
       */
      UI.foldout("측정 범위를 벗어나면 — 너무 가깝거나 너무 멀 때", function () {
        var note = L.RANGE_NOTE;

        /** 한 경우를 한 칸으로 — 까닭과 단추와 결과가 «붙어» 있게 */
        function caseBox(spec) {
          var out = el("div", { class: "rangecase__out", text: "아직 재지 않았습니다." });
          return el("div", { class: "rangecase" }, [
            el("p", { class: "rangecase__head" }, [
              el("span", { class: "rangecase__tag", text: spec.tag }),
              el("span", { text: spec.title })
            ]),
            el("p", { class: "rangecase__why", text: spec.why }),
            UI.button(spec.cm + "cm 로 재 보기", {
              class: "btn btn--ghost btn--small",
              click: function () {
                var r = measureOnce(spec.cm, "front", "board", 3);
                out.textContent = r.rec ? r.rec.text : "재지 못했습니다.";
                out.className =
                  "rangecase__out rangecase__out--" + (r.ok ? "ok" : "fail");
              }
            }),
            out
          ]);
        }

        var pair = split();
        pair.left.appendChild(
          caseBox({
            tag: "너무 가까움",
            title: D_MIN + "cm 보다 가까울 때",
            why: note.tooClose,
            cm: 1
          })
        );
        pair.right.appendChild(
          caseBox({
            tag: "너무 멂",
            title: D_MAX + "cm 를 넘을 때",
            why: note.tooFar,
            cm: D_MAX + 100
          })
        );

        return el("div", { class: "stack" }, [
          S.figures.range(),
          pair.root,
          UI.alert("info", note.conclusion)
        ]);
      })
    );

    box.appendChild(condCard);

    /* ---------------- ④ 확장 활동 — 주차 경고 장치 ---------------- */

    box.appendChild(sectionTitle("③", "주차 경고 장치를 구상해 보기"));

    var ext = L.EXTENSION;
    var extReady = String(exp.extensionCondition || "").trim().length > 0;

    var extBox = el("details", { class: "extbox" + (extReady ? " extbox--ready" : "") });
    if (extReady) extBox.open = true;

    var extToggle = el("span", { class: "extbox__toggle", text: extReady ? "접기 ▴" : "펼치기 ▾" });
    /* ★ 제목과 한 줄 안내를 «한 상자» 에 묶는다(지적 2026-08-22).
       셋을 나란히 두면 제목이 두 줄로 접히고 안내가 「접기」 와 맞붙는다. */
    extBox.appendChild(
      el("summary", { class: "extbox__sum" }, [
        el("span", { class: "extbox__head" }, [
          el("span", { class: "extbox__title", text: ext.title }),
          el("span", {
            class: "extbox__hint",
            text: extReady ? "조건을 적었습니다 — 이어서 부품과 코드를 만들어 보세요." : ext.goal
          })
        ]),
        extToggle
      ])
    );
    extBox.addEventListener("toggle", function () {
      /* ★ 글자는 JS 가 바꾼다. CSS content 로 바꾸면 화살표까지 사라지고 낭독기도 못 읽는다. */
      extToggle.textContent = extBox.open ? "접기 ▴" : "펼치기 ▾";
    });

    var extBody = el("div", { class: "extbox__body stack" });
    extBox.appendChild(extBody);

    extBody.appendChild(el("p", { class: "para", text: ext.intro }));
    extBody.appendChild(
      el(
        "ol",
        { class: "steplist" },
        ext.steps.map(function (s) {
          return el("li", { class: "steplist__item" }, [
            el("span", { class: "steplist__marker", attrs: { "aria-hidden": "true" }, text: s.marker }),
            el("div", {}, [
              el("p", { class: "steplist__label", text: s.label }),
              el("p", { class: "steplist__text", text: s.text })
            ])
          ]);
        })
      )
    );

    /**
     * ① 조건 · ② 부품 — 명세가 요구한 «구상» 이 이 두 칸이다.
     *
     * ★★ 적기 «전» 에 그림을 하나씩 붙인다(지적 2026-08-22).
     *   전에는 글만 죽 이어져 있어서 «무엇을 적으라는 것인지» 알기 어려웠다.
     *     ① 조건 앞  → 거리 축의 두 칸과 켜진/꺼진 LED (if / else 를 눈으로)
     *     ② 부품 앞  → 더할 한 줄 (핀 → 저항 → LED → GND)
     *   힌트 목록은 «접지 않는다». 부품을 적으라면서 무엇이 있는지 감춰 두면
     *   학생은 접기를 찾아 열어야 한다.
     */
    extBody.appendChild(el("h4", { class: "subhead", text: "① 조건을 정한다" }));
    extBody.appendChild(S.figures.warnLogic());
    extBody.appendChild(
      UI.field(
        {
          label: "① 조건을 한 문장으로",
          multiline: true,
          rows: 2,
          placeholder: ext.conditionPlaceholder
        },
        exp.extensionCondition || "",
        function (value) {
          app.patch(function (s) {
            s.experiment.extensionCondition = value;
            s.experiment.extensionTried = true;
          });
        }
      ).root
    );

    extBody.appendChild(el("h4", { class: "subhead", text: "② 무엇을 더할지 정한다" }));
    extBody.appendChild(S.figures.parkingParts());
    extBody.appendChild(
      el(
        "ul",
        { class: "keypoints" },
        ext.partsHint.map(function (t) {
          return el("li", { class: "keypoints__item" }, [
            el("span", { text: t })
          ]);
        })
      )
    );
    extBody.appendChild(
      UI.field(
        { label: "② 더 필요한 부품", multiline: true, rows: 2, placeholder: ext.partsPlaceholder },
        exp.extensionParts || "",
        function (value) {
          app.patch(function (s) {
            s.experiment.extensionParts = value;
            s.experiment.extensionTried = true;
          });
        }
      ).root
    );

    /* ③ 코드로 만들기 — 더 하고 싶은 학생 몫 */
    var extTest = el("div", { class: "testpanel" });
    /**
     * ★★ 돌려 볼 거리를 «고른다» (지적 2026-08-22).
     *
     *   전에는 5단계에서 고른 거리(exp.distance, 기준값 20cm) 하나로만 돌았다.
     *   그러면 **기준보다 가까운 경우를 볼 수 없어** LED 가 켜지는 것을
     *   끝내 확인하지 못한다 — 이 활동의 알맹이가 바로 그것이다.
     *
     *   그래서 기준의 «양쪽» 을 미리 짜 둔다.
     *     가까움 : WARN_DISTANCE − 10  (기준 20cm 이면 10cm) → 켜져야 한다
     *     멂     : WARN_DISTANCE + 10  (기준 20cm 이면 30cm) → 꺼져야 한다
     *   `w-run` 검사가 재는 두 거리와 «같은 값» 이다 — 화면과 검사가 어긋나지 않게.
     */
    /** 지금 코드에서 «LED 핀» 과 «기준 거리» 를 읽어 온다. 없으면 null. */
    function extAst() {
      var p = A.tryParse(extSource);
      return p && p.ast ? p.ast : null;
    }
    function extLedPin() {
      var ast = extAst();
      if (!ast) return null;
      var w = A.warnPinOf(ast);
      return w ? w.pin : null;
    }
    function extThreshold() {
      var ast = extAst();
      var t = ast ? A.warnThresholdOf(ast) : null;
      return t === null || !isFinite(t) ? A.WARN_DISTANCE : t;
    }

    /**
     * ★★ 물체가 «다가오다 멀어지는 길» 을 만든다 (지적 2026-08-22).
     *
     *   전에는 거리 하나로만 돌았다. 그러면 LED 가 내내 켜져 있거나 내내 꺼져
     *   있어서, 정작 이 활동의 알맹이인 «켜지고 꺼지는 것» 을 볼 수 없었다.
     *
     *   열 바퀴 가운데 **일곱 바퀴는 기준보다 가깝고(if 쪽), 세 바퀴는 멀다(else 쪽)**.
     *   차례를 «멂 → 가까움 → 멂» 으로 두어 두 번의 바뀜을 모두 보게 한다.
     *
     * ★ 기준은 «학생이 적은 값» 을 쓴다. 20 으로 붙박아 두면 기준을 30 으로
     *   적은 학생에게는 열 바퀴가 모두 «가까움» 이 되어 꺼지는 것을 못 본다.
     *
     * ★ 배수로 만든다 — 기준이 무엇이든 같은 모양(멂 셋·가까움 일곱)이 된다.
     *   양 끝은 측정 범위 안으로 눌러 둔다.
     */
    function approachPath(threshold) {
      var t = Math.max(D_MIN + 1, Number(threshold) || A.WARN_DISTANCE);
      var far = function (k) {
        return Math.min(D_MAX, Math.max(t + 2, Math.round(t * k)));
      };
      var near = function (k) {
        return Math.max(D_MIN, Math.min(t - 1, Math.round(t * k)));
      };
      return [
        far(1.5), far(1.3),                                  /* 멂 — LED 꺼짐 */
        near(0.9), near(0.75), near(0.6), near(0.5),
        near(0.4), near(0.45), near(0.65),                   /* 가까움 — LED 켜짐 */
        far(1.2)                                             /* 다시 멂 — 꺼짐 */
      ];
    }

    var extRunner = makeRunner({
      getWorld: function () {
        var w = worldFor(0, "front", "board", 1);
        w.distance = approachPath(extThreshold());
        return w;
      },
      /**
       * 모니터 머리에 달리는 «등».
       * ★ 재생을 따라 살아서 바뀐다 — makeRunner 가 pin-write 를 보고 고친다.
       */
      lamp: {
        label: "LED",
        pinOf: extLedPin
      }
    });

    /**
     * ★ 이 단추는 refreshExt() 가 «먼저» 손을 대므로 미리 만들어 둔다.
     *   여섯 항목을 다 통과하기 전에는 잠겨 있다 — 확인하고 나서 들어 보는 차례다.
     */
    var extRunBtn = UI.button("확장 코드 실행", {
      disabled: true,
      click: function () {
        extRunner.run(extSource, {});
      }
    });
    var extSource = exp.extensionSource || "";

    /**
     * 어떤 길을 돌리는지 «미리» 적어 준다.
     *
     * ★ 단추로 거리를 고르던 자리였다. 이제는 한 번의 실행이 열 바퀴를 돌며
     *   물체가 다가오다 멀어지므로, 고를 것이 없고 «무엇을 돌리는지» 만 알면 된다.
     *
     * ★ 기준은 학생이 적은 값을 읽어 온다 — 코드를 고치면 이 글도 따라 바뀐다.
     */
    var extPathRow = el("div", { class: "btnrow btnrow--dist" });
    function paintExtPath() {
      var t = extThreshold();
      var path = approachPath(t);
      var nearCount = path.filter(function (cm) {
        return cm < t;
      }).length;
      UI.clear(extPathRow);
      extPathRow.appendChild(el("span", { class: "btnrow__label", text: "돌려 볼 길" }));
      extPathRow.appendChild(
        el("span", { class: "pathline" }, [
          el("span", { class: "pathline__text", text: path.join(" → ") + " cm" })
        ])
      );
      extPathRow.appendChild(
        el("span", {
          class: "btnrow__note",
          text:
            "물체가 다가오다 다시 멀어집니다. 열 바퀴 가운데 " + nearCount +
            "바퀴가 기준 " + t + "cm 보다 «가까움» 이라 LED 가 켜지고, " +
            (path.length - nearCount) + "바퀴는 «멂» 이라 꺼집니다 — " +
            "오른쪽 위 등이 함께 바뀌는 것을 보세요."
        })
      );
    }
    paintExtPath();

    function refreshExt() {
      var v = A.validateWarning(extSource);
      UI.clear(extTest);
      extTest.appendChild(
        el("p", { class: "testpanel__head" }, [
          el("span", { text: "확장 코드 확인 " }),
          el("b", { text: v.passed + " / " + v.tests.length }),
          el("span", { text: v.ok ? " — 모두 통과했습니다. 이제 돌려 보세요." : " — 아래 항목을 채워 보세요." })
        ])
      );
      if (!v.parsed && v.error) {
        extTest.appendChild(
          UI.alert("warn", (v.error.line ? v.error.line + "번 줄 — " : "") + v.error.message)
        );
      }
      var list = el("ul", { class: "condlist" });
      v.tests.forEach(function (t) {
        /* ★ 설명은 세 번째 인자로 — .cond 에 직접 붙이면 라벨 칸이 눌린다.
           까닭은 위 refreshTests() 의 같은 자리에 적어 두었다. */
        list.appendChild(UI.conditionRow(t.label, t.ok, !t.ok ? t.message : ""));
      });
      extTest.appendChild(list);

      extRunBtn.disabled = !v.ok;
      extRunBtn.title = v.ok ? "" : "여섯 항목을 모두 통과하면 열립니다.";

      /**
       * ★ 「해 보았다(extensionTried)」 를 여기서 켜지 «않는다».
       *
       *   refreshExt() 는 5단계를 그릴 때마다 한 번씩 돈다(빈칸 판이 만들어지므로).
       *   여기서 켜면 확장 활동을 «열지도 않은» 학생까지 «해 보았다» 로 제출된다.
       *   교사 화면의 「주차 경고 구상까지 N명」 이 거짓이 되는 것이다.
       *
       *   켜는 자리는 학생이 실제로 «적은» 곳 셋이다 — 조건 칸 · 부품 칸 · 빈칸.
       */
      app.patch(function (s) {
        s.experiment.extensionSource = extSource;
        s.experiment.extensionPassed = v.passed;
        s.experiment.extensionTotal = v.tests.length;
      });
    }

    var extBlanks = ED.blanks(
      exp.extensionBlanks,
      /* ★ (source, values) 차례다 — blanks() 머리말 참고 */
      function (source, values) {
        app.patch(function (s) {
          s.experiment.extensionBlanks = values;
          /* 빈칸에 «한 글자라도» 적었으면 해 본 것이다 */
          s.experiment.extensionTried = true;
        });
        extSource = source;
        refreshExt();
      },
      A.WARNING_TEMPLATE
    );
    extSource = extBlanks.getSource();

    /**
     * ★★ 빈칸을 채우기 «전» 에 읽는 안내(지적 2026-08-22).
     *
     *   빈칸마다 힌트가 한 줄씩 붙어 있지만 그것만으로는 무엇을 적어야 하는지
     *   알 수 없었다. 그래서 세 가지를 «빈칸 위» 에 먼저 둔다 —
     *     ① 이미 있는 이름(distance 를 그대로 쓸 수 있다)
     *     ② 다섯 자리가 «어떤 꼴» 인가 — 답이 아니라 틀이다
     *     ③ 왜 그렇게 적는가
     *
     * ★ 답을 그대로 적어 주지 않는다. 핀 번호와 기준 거리는 학생이 정한다 —
     *   그것이 이 활동의 알맹이(«구상») 이기 때문이다.
     */
    function codeGuide() {
      var gd = ext.codeGuide;
      return el("div", { class: "guide" }, [
        el("p", { class: "para", text: gd.intro }),
        el("p", { class: "guide__head", text: gd.knownTitle }),
        el(
          "ul",
          { class: "keypoints" },
          gd.known.map(function (t) {
            return el("li", { class: "keypoints__item" }, [
                el("span", { text: t })
            ]);
          })
        ),
        el("p", { class: "guide__head", text: gd.rowsTitle }),
        el(
          "ol",
          { class: "guide__list" },
          gd.rows.map(function (r) {
            return el("li", { class: "guide__row" }, [
              el("span", { class: "guide__no", attrs: { "aria-hidden": "true" }, text: r.no }),
              el("div", { class: "guide__body" }, [
                el("p", { class: "guide__what", text: r.what }),
                el("code", { class: "guide__shape", text: r.shape }),
                el("p", { class: "guide__why", text: r.why })
              ])
            ]);
          })
        )
      ]);
    }

    extBody.appendChild(el("h4", { class: "subhead", text: "③ 코드로 만들어 본다" }));
    extBody.appendChild(
      /* ★ 도드라진 꼴로 둔다 — 접힌 채로도 «여기서 만든다» 가 눈에 들어와야 한다 */
      UI.foldout("✎ 빈칸 다섯 자리를 채워 프로그램 만들기", function () {
        return el("div", { class: "stack" }, [
          codeGuide(),
          extBlanks.root,
          extTest,
          /* ★ 어떤 길을 돌리는지 실행 단추 «바로 위» 에 적는다 —
             무엇을 돌리는지 알고 나서 누르는 차례다. */
          extPathRow,
          el("div", { class: "btnrow" }, [
            extRunBtn,
            UI.button("멈춤", {
              class: "btn btn--ghost",
              click: function () {
                extRunner.stop();
              }
            })
          ]),
          extRunner.panelHost,
          UI.alert("info", ext.hint),
          el("p", { class: "para", text: ext.check })
        ]);
      }, { strong: true })
    );

    extBody.appendChild(UI.alert("info", ext.note));
    box.appendChild(extBox);
    refreshExt();

    var pass = PC.schema.checkStep("experiment", state);
    if (!pass.ok) {
      box.appendChild(
        UI.alert("info", "다음 단계로 가려면 : " + pass.reasons.join(" / "))
      );
    } else {
      box.appendChild(
        UI.alert("ok", "조건을 바꾸어 재고 알게 된 것을 적었습니다. 아래 [다음] 으로 형성평가로 갑니다.")
      );
    }

    return box;
  }

  /* ================================================================== */
  /* 6단계 — 형성평가·제출                                                */
  /* ================================================================== */

  function renderAssess(state, app) {
    var box = el("div");
    var Q = PC.quiz;
    var answers = state.assessment.answers;
    var total = Q.QUESTIONS.length;

    /* 답안을 냈는가 — 냈으면 답을 고칠 수 없고, 그때 비로소 채점이 열린다 */
    var sealed = state.assessment.sealed === true;

    function isAnswered(q) {
      var v = answers[q.id];
      if (q.type === "choice") return typeof v === "number" && v >= 0;
      return String(v === undefined || v === null ? "" : v).trim().length > 0;
    }

    var cons = makeConsole({
      title: "채점·제출 기록",
      emptyText: "학번과 이름을 넣고 문항에 답하면 여기에 기록이 쌓입니다."
    });

    /* ---------------- 응시자 정보 ---------------- */

    var idInput = el("input", {
      class: "student-field__input",
      id: "assess-sid",
      attrs: {
        type: "text",
        inputmode: "numeric",
        maxlength: "5",
        placeholder: "예) 10312",
        autocomplete: "off"
      }
    });
    idInput.value = state.student.studentId || "";

    var nameInput = el("input", {
      class: "student-field__input",
      id: "assess-name",
      attrs: { type: "text", maxlength: "20", placeholder: "예) 홍길동", autocomplete: "off" }
    });
    nameInput.value = state.student.name || "";

    var studentNote = el("p", { class: "student-card__note", attrs: { role: "status" } });

    var studentCard = el("div", { class: "student-card" }, [
      el("div", { class: "student-card__head" }, [
        el("h4", { class: "student-card__title", text: "응시자 정보" }),
        el("span", { class: "student-card__badge", text: "제출 전 필수" })
      ]),
      el("div", { class: "student-card__fields" }, [
        el("div", { class: "student-field" }, [
          el("label", {
            class: "student-field__label",
            attrs: { for: "assess-sid" },
            text: "학번 (5자리)"
          }),
          idInput
        ]),
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-name" }, text: "이름" }),
          nameInput
        ])
      ]),
      studentNote,
      el("p", {
        class: "student-card__privacy",
        text: "1학년 3반 12번이면 10312 입니다. 학번과 이름은 제출한 답을 알아보는 데에만 씁니다."
      })
    ]);

    var gate = el("div", { class: "quiz-gate" }, [
      el("span", { class: "quiz-gate__icon", attrs: { "aria-hidden": "true" }, text: "🔒" }),
      el("span", { text: "학번과 이름을 넣으면 문항이 열립니다." })
    ]);

    var quizBody = el("div", { class: "quiz__body" });
    var actionRow = el("div", { class: "btnrow btnrow--one" });
    var actionNote = el("p", { class: "quiz__note" });
    var messageHost = el("div");

    var current = 0;
    for (var qi = 0; qi < total; qi += 1) {
      if (!isAnswered(Q.QUESTIONS[qi])) {
        current = qi;
        break;
      }
    }

    function ready() {
      return PC.schema.validateStudent(state.student).ok;
    }

    var prevBtn = UI.button("← 이전", {
      class: "btn btn--ghost",
      click: function () {
        if (current > 0) {
          current -= 1;
          drawQuestion();
        }
      }
    });

    var nextBtn = UI.button("다음 →", {
      class: "btn btn--ghost",
      click: function () {
        if (current < total - 1) {
          current += 1;
          drawQuestion();
        }
      }
    });

    /**
     * ★ 채점은 «답안을 낸 뒤에만» 열린다 (명세 6.6 세 번째 줄).
     *
     * 정답과 해설을 먼저 본 뒤에 답을 고쳐 내면 형성평가가 아무 뜻이 없어진다.
     * 잠기는 길은 두 가지 — 서버로 제출하거나, JSON 파일로 받아 내는 것.
     */
    var gradeBtn = UI.button("채점하기", {
      click: function () {
        if (state.assessment.sealed !== true) return;
        app.update(function (s) {
          s.assessment.graded = true;
          s.assessment.attempts += 1;
        });
      }
    });

    var retryBtn = UI.button(sealed ? "내 답 다시 보기" : "답 고치기", {
      class: "btn btn--ghost",
      click: function () {
        app.update(function (s) {
          s.assessment.graded = false;
        });
      }
    });

    var endpointField = null;
    if (PC.config.needsUrlInput()) {
      endpointField = UI.field(
        {
          label: "제출 주소",
          help: "선생님이 알려 주신 주소를 붙여 넣으세요. 한 번 넣으면 이 기기에 기억됩니다.",
          placeholder: "https://script.google.com/.../exec"
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
    }

    var busy = false;

    var onceNote = UI.alert("warn", "답안은 «한 번만» 제출할 수 있습니다.", [
      el("p", {
        class: "alert__fix",
        text:
          "제출한 뒤에는 답을 고칠 수 없습니다. 다섯 문항을 모두 다시 살펴본 뒤에 누르세요. " +
          "제출하면 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다."
      })
    ]);

    var confirmHost = el("div");

    function closeConfirm() {
      UI.clear(confirmHost);
      refreshActions();
    }

    function askConfirm(spec) {
      UI.clear(confirmHost);
      submitBtn.disabled = true;
      downloadBtn.disabled = true;

      var okBtn = UI.button(spec.okLabel, {
        click: function () {
          UI.clear(confirmHost);
          spec.onOk();
        }
      });

      confirmHost.appendChild(
        UI.alert("warn", spec.message, [
          el("p", { class: "alert__fix", text: spec.detail }),
          el("div", { class: "btnrow" }, [
            okBtn,
            UI.button("아니요, 더 확인하겠습니다", { class: "btn btn--ghost", click: closeConfirm })
          ])
        ])
      );
      okBtn.focus();
    }

    function guard() {
      var check = PC.schema.validateStudent(state.student);
      if (!check.ok) {
        refreshGate();
        cons.error("학번과 이름을 먼저 바르게 넣어 주세요.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "학번과 이름을 먼저 바르게 넣어 주세요."));
        return false;
      }
      if (!Q.gradeAll(state.assessment.answers).allAnswered) {
        cons.error("답하지 않은 문항이 있습니다.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "다섯 문항에 모두 답해야 제출할 수 있습니다."));
        return false;
      }
      return true;
    }

    function doSend() {
      busy = true;
      UI.clear(messageHost);
      refreshActions();
      submitBtn.textContent = "제출 중…";

      var payload = PC.schema.buildPayload(state);
      S.store.saveStudent(state.student);
      cons.write("제출을 시작합니다 — " + S.api.fileNameFor(payload));

      S.api.submit(payload, endpointField ? endpointField.input.value : "").then(function (result) {
        busy = false;

        if (result.ok) {
          cons.ok(
            (result.updated ? "이전 제출을 덮어썼습니다 — " : "저장을 마쳤습니다 — ") +
              (result.fileName || S.api.fileNameFor(payload))
          );
          cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
          app.update(function (s) {
            s.submissionId = result.submissionId || "";
            s.submitted = {
              at: result.serverUpdatedAt || new Date().toISOString(),
              demo: result.demo === true,
              via: "server"
            };
            s.assessment.sealed = true;
          });
          UI.toast("제출했습니다. 이제 채점할 수 있습니다.");
          return;
        }

        S.store.queuePending(payload);
        cons.error("제출 실패 — " + result.message);
        cons.hint("[파일로 내기] 로 파일을 받아 선생님께 내도 됩니다.");
        UI.clear(messageHost).appendChild(
          UI.alert("warn", result.message, [
            el("p", {
              class: "alert__fix",
              text:
                "아래 [파일로 내기] 로 파일을 받아 선생님께 내도 됩니다. " +
                "아직 제출되지 않았으니 답은 그대로 남아 있습니다."
            }),
            el("div", { class: "btnrow" }, [downloadBtn])
          ])
        );
        refreshActions();
      });
    }

    function doDownload() {
      var payload = PC.schema.buildPayload(state);
      if (!S.api.download(payload)) {
        cons.error("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        UI.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        refreshActions();
        return;
      }

      cons.write("파일로 냈습니다 — " + S.api.fileNameFor(payload));
      UI.toast("파일을 내려받았습니다. 선생님께 내 주세요.");

      if (state.assessment.sealed !== true) {
        cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
        S.store.saveStudent(state.student);
        app.update(function (s) {
          s.assessment.sealed = true;
        });
        return;
      }
      refreshActions();
    }

    var submitBtn = UI.button("답안 제출하기", {
      click: function () {
        if (busy) return;
        if (state.submitted) {
          UI.clear(messageHost).appendChild(
            UI.alert("info", "이미 제출을 마쳤습니다. 답안은 한 번만 제출할 수 있습니다.")
          );
          return;
        }
        if (!guard()) return;

        askConfirm({
          message: "정말 제출할까요? 답안은 한 번만 제출할 수 있습니다.",
          detail: "제출한 뒤에는 답을 고칠 수 없습니다. 대신 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다.",
          okLabel: "예, 제출합니다",
          onOk: doSend
        });
      }
    });

    var downloadBtn = UI.button("파일로 내기", {
      class: "btn btn--ghost",
      click: function () {
        if (busy) return;
        if (!guard()) return;
        if (state.assessment.sealed === true) {
          doDownload();
          return;
        }
        askConfirm({
          message: "이 파일이 곧 제출물입니다. 내려받으면 답을 고칠 수 없습니다.",
          detail: "받은 파일을 선생님께 내야 합니다. 내려받으면 [채점하기] 가 열립니다.",
          okLabel: "예, 내려받습니다",
          onOk: doDownload
        });
      }
    });

    function refreshGate() {
      var check = PC.schema.validateStudent(state.student);
      var ok = check.ok;

      studentCard.className = "student-card" + (ok ? " is-ready" : "");
      idInput.className =
        "student-field__input" + (state.student.studentId && check.errors.studentId ? " is-invalid" : "");
      nameInput.className =
        "student-field__input" + (state.student.name && check.errors.name ? " is-invalid" : "");

      studentNote.className = "student-card__note" + (ok ? " is-ok" : "");
      studentNote.textContent = ok
        ? "확인되었습니다 — " + state.student.studentId + " " + state.student.name
        : check.errors.studentId || check.errors.name || "학번과 이름을 넣어 주세요.";

      gate.hidden = ok;
      quizBody.className = "quiz__body" + (ok ? "" : " is-gated");

      refreshActions();
    }

    function refreshActions() {
      var now = Q.gradeAll(state.assessment.answers);
      var ok = ready();
      var locked = state.assessment.sealed === true;
      var sentToServer = !!state.submitted;
      var canHandIn = ok && now.allAnswered;

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;

      gradeBtn.disabled = !locked;
      gradeBtn.title = locked ? "" : "답안을 제출한 뒤에 채점 결과를 볼 수 있습니다.";

      submitBtn.disabled = busy || sentToServer || !canHandIn;
      submitBtn.title = sentToServer
        ? "답안은 한 번만 제출할 수 있습니다."
        : canHandIn
        ? ""
        : "학번·이름을 넣고 다섯 문항에 모두 답해야 제출할 수 있습니다.";
      if (!busy) submitBtn.textContent = sentToServer ? "제출 완료" : "답안 제출하기";

      downloadBtn.disabled = busy || !canHandIn;
      downloadBtn.title = canHandIn
        ? ""
        : "학번·이름을 넣고 다섯 문항에 모두 답해야 파일로 낼 수 있습니다.";

      onceNote.hidden = locked;

      var lines = [];
      if (!ok) lines.push("학번과 이름을 넣어야 제출할 수 있습니다.");
      if (!now.allAnswered) {
        lines.push(
          "답한 문항 " + now.answeredCount + " / " + total + " — 모두 답하면 [답안 제출하기] 가 열립니다."
        );
      }
      if (locked) {
        lines.push("답안을 냈으므로 답을 고칠 수 없습니다. [채점하기] 로 점수와 해설을 볼 수 있습니다.");
      } else if (canHandIn) {
        lines.push(
          "다섯 문항에 모두 답했습니다. 제출은 «한 번만» 할 수 있고, 제출한 뒤에 [채점하기] 가 열립니다."
        );
      }
      actionNote.textContent = lines.join(" ");
    }

    function pick(q, index) {
      if (state.assessment.sealed === true) return;
      app.patch(function (s) {
        s.assessment.answers[q.id] = index;
      });
      cons.write(q.no + "번 — " + (CIRCLED[index] || index + 1) + " 선택");
      app.rerenderNav();
      drawQuestion();
    }

    function drawQuestion() {
      UI.clear(quizBody);
      var q = Q.QUESTIONS[current];

      var dots = el("div", { class: "quiz__dots" });
      Q.QUESTIONS.forEach(function (item, i) {
        var done = isAnswered(item);
        dots.appendChild(
          el("button", {
            class:
              "quiz__dot" + (done ? " is-answered" : "") + (i === current ? " is-current" : ""),
            attrs: {
              type: "button",
              "aria-label": item.no + "번 문항으로 이동" + (done ? " (답함)" : " (아직 답하지 않음)"),
              "aria-current": i === current ? "true" : null
            },
            on: {
              click: function () {
                current = i;
                drawQuestion();
              }
            }
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "quiz__meta" }, [
          el("span", { class: "quiz__counter", text: "문항 " + (current + 1) + " / " + total }),
          dots
        ])
      );

      var kind = q.type === "choice" ? "객관식" : "완성형";
      quizBody.appendChild(
        el(
          "div",
          { class: "quiz__tags" },
          [badge("primary", q.tag), kind === q.tag ? null : badge("", kind), badge("", q.points + "점")].filter(
            Boolean
          )
        )
      );

      quizBody.appendChild(
        el("p", { class: "quiz__question" }, [
          el("span", { class: "quiz__no", text: q.no + "." }),
          el("span", { text: q.stem })
        ])
      );

      if (q.code) quizBody.appendChild(ED.codeView(q.code, {}).root);

      var locked = state.assessment.sealed === true;

      if (q.type === "choice") {
        var options = el("div", { class: "options" });
        q.choices.forEach(function (choice, i) {
          var picked = answers[q.id] === i;
          var radio = el("input", {
            attrs: { type: "radio", name: "quiz-" + q.id, value: String(i) }
          });
          radio.checked = picked;
          radio.disabled = locked;
          radio.addEventListener("change", function () {
            pick(q, i);
          });
          options.appendChild(
            el(
              "label",
              {
                class:
                  "option" + (picked ? " is-selected" : "") + (locked ? " option--locked" : "")
              },
              [
                radio,
                el("span", {
                  class: "option__num",
                  attrs: { "aria-hidden": "true" },
                  text: CIRCLED[i] || String(i + 1)
                }),
                el("span", { class: "option__text", text: choice })
              ]
            )
          );
        });
        quizBody.appendChild(options);
      } else {
        quizBody.appendChild(UI.codeBlock(q.template, "빈칸 세 줄을 채우세요."));

        var lint = el("div", { class: "lint" });
        function drawLint(value) {
          UI.clear(lint);
          Q.lintCodeAnswer(value).forEach(function (note) {
            lint.appendChild(UI.alert(note.level === "warn" ? "warn" : "info", note.message));
          });
        }

        var codeField = UI.field(
          {
            label: "빠진 세 줄",
            help: q.help,
            multiline: true,
            rows: 4,
            mono: true,
            placeholder: q.placeholder
          },
          answers[q.id] || "",
          function (value) {
            app.patch(function (s) {
              s.assessment.answers[q.id] = value;
            });
            drawLint(value);
            app.rerenderNav();
            refreshActions();
            var marks = quizBody.querySelectorAll(".quiz__dot");
            if (marks[current]) {
              marks[current].className =
                "quiz__dot is-current" + (String(value || "").trim() ? " is-answered" : "");
            }
          }
        );
        codeField.input.readOnly = locked;
        quizBody.appendChild(codeField.root);
        quizBody.appendChild(lint);
        drawLint(answers[q.id] || "");
      }

      quizBody.appendChild(
        el("p", {
          class: "quiz__note",
          text: locked
            ? "답안을 냈으므로 고칠 수 없습니다. 점을 눌러 내가 낸 답을 확인할 수 있어요."
            : q.type === "choice"
            ? "고른 답은 곧바로 저장됩니다. 점을 눌러 다른 문항으로 건너갈 수 있어요."
            : "세미콜론(;) 과 대소문자, 그리고 «세 줄의 순서» 까지 그대로 지켜야 맞습니다."
        })
      );

      refreshActions();
    }

    function drawResult() {
      UI.clear(quizBody);
      quizBody.className = "quiz__body";

      var revealed = Q.reveal(state.assessment.answers);
      if (!revealed.allowed) {
        quizBody.appendChild(UI.alert("info", revealed.reason));
        return;
      }

      var g = revealed.graded;
      var okCount = 0;
      revealed.items.forEach(function (item) {
        if (item.correct) okCount += 1;
      });

      var marks = el("div", { class: "score-dots" });
      revealed.items.forEach(function (item) {
        marks.appendChild(
          el("span", {
            class: "score-dot" + (item.correct ? " is-correct" : ""),
            attrs: { "aria-label": item.no + "번 " + (item.correct ? "맞음" : "틀림") },
            text: item.correct ? "○" : "✕"
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "score-card" }, [
          el("p", { class: "score-card__title", text: "형성평가 결과" }),
          el("p", { class: "score-card__student" }, [
            el("strong", { text: state.student.studentId || "학번 미입력" }),
            el("span", { text: " " + (state.student.name || "") })
          ]),
          el("p", { class: "score-card__value" }, [
            el("span", { text: String(g.score) }),
            el("small", { text: " / " + g.total + "점" })
          ]),
          marks,
          el("p", { class: "score-card__count", text: "맞힌 문항 " + okCount + " / " + total }),
          el("p", { class: "score-card__level" }, [
            el("span", { text: "판정 : " }),
            el("strong", { text: g.pass ? "이수" : "미이수" }),
            el("span", { text: g.pass ? "" : " (" + PC.ASSESS.passScore + "점 이상 필요)" })
          ]),
          el("p", {
            class: "score-card__comment",
            text: g.pass
              ? "잘했어요. 아래 해설로 한 번 더 확인해 보세요."
              : "괜찮아요. 해설을 읽고 무엇이 어긋났는지 확인해 보세요."
          })
        ])
      );

      quizBody.appendChild(el("h4", { class: "subhead", text: "문항별 해설" }));
      revealed.items.forEach(function (item) {
        quizBody.appendChild(
          el("div", { class: "review" + (item.correct ? " review--ok" : "") }, [
            el("p", { class: "review__head" }, [
              el("span", {
                class: "review__mark",
                attrs: { "aria-hidden": "true" },
                text: item.correct ? "✔" : "✘"
              }),
              el("span", { class: "review__no", text: item.no + "번" }),
              el("span", { class: "review__state", text: item.correct ? "맞음" : "틀림" })
            ]),
            el("p", { class: "review__stem", text: item.stem }),
            el("p", { class: "review__answer", text: "정답 : " + item.answerText }),
            el("p", { class: "review__why", text: item.explanation })
          ])
        );
      });
    }

    /* ---------------- ① 형성평가 ---------------- */

    box.appendChild(sectionTitle("①", "형성평가"));

    var top = split("split--wide-left");

    var quizPanel = panel({
      title: "5문항 · 총 " + PC.ASSESS.total + "점",
      hint: PC.ASSESS.passScore + "점 이상이면 이수입니다."
    });

    quizPanel.body.appendChild(studentCard);
    quizPanel.body.appendChild(gate);
    quizPanel.body.appendChild(quizBody);
    quizPanel.body.appendChild(onceNote);
    quizPanel.body.appendChild(actionRow);
    quizPanel.body.appendChild(actionNote);
    quizPanel.body.appendChild(confirmHost);
    if (PC.config.isDemo()) {
      quizPanel.body.appendChild(
        UI.alert("info", "지금은 데모 모드입니다. 제출은 이 기기 안에만 저장되며 선생님께 가지 않습니다.")
      );
    }
    if (endpointField) quizPanel.body.appendChild(endpointField.root);
    if (state.submitted) {
      quizPanel.body.appendChild(
        UI.alert("ok", "제출을 마쳤습니다. (" + S.formatTime(state.submitted.at) + ")", [
          el("p", {
            class: "alert__fix",
            text:
              "답안은 한 번만 제출할 수 있어 이제 고칠 수 없습니다. 고쳐야 할 일이 있으면 선생님께 말씀드리세요."
          })
        ])
      );
    } else if (sealed) {
      quizPanel.body.appendChild(
        UI.alert("ok", "파일로 냈습니다.", [
          el("p", {
            class: "alert__fix",
            text:
              "내려받은 " + S.api.fileNameFor(PC.schema.buildPayload(state)) +
              " 을 선생님께 내 주세요. 답안은 이제 고칠 수 없습니다."
          })
        ])
      );
    }
    quizPanel.body.appendChild(messageHost);
    quizPanel.body.appendChild(el("p", { class: "privacy", text: PC.MESSAGES.privacy }));

    top.left.appendChild(quizPanel.root);

    var consPanel = panel({
      title: "② 채점·제출 진행 상황",
      hint: "무엇이 저장되었는지 여기서 확인합니다."
    });
    consPanel.body.appendChild(cons.root);
    top.right.appendChild(consPanel.root);

    box.appendChild(top.root);

    if (state.assessment.graded) {
      actionRow.appendChild(retryBtn);
      actionRow.appendChild(submitBtn);
      drawResult();
    } else {
      actionRow.appendChild(prevBtn);
      actionRow.appendChild(nextBtn);
      actionRow.appendChild(gradeBtn);
      actionRow.appendChild(submitBtn);
      drawQuestion();
    }

    function onInfo() {
      app.patch(function (s) {
        s.student.studentId = idInput.value.trim();
        s.student.name = nameInput.value.trim();
      });
      refreshGate();
      app.rerenderNav();
    }
    idInput.addEventListener("input", onInfo);
    nameInput.addEventListener("input", onInfo);
    refreshGate();

    /* 다시 그린 뒤에도 그동안의 일이 보이도록 상태에서 되살린다 */
    var seeded = Q.gradeAll(state.assessment.answers);
    cons.muted(
      "응시자 : " + (ready() ? state.student.studentId + " " + state.student.name : "아직 넣지 않음")
    );
    cons.muted("답한 문항 " + seeded.answeredCount + " / " + total);
    if (state.assessment.graded) {
      var shown = Q.reveal(state.assessment.answers);
      if (shown.allowed) {
        var line =
          "채점 결과 " + shown.graded.score + " / " + shown.graded.total + "점 — " +
          (shown.graded.pass ? "이수" : "미이수");
        if (shown.graded.pass) cons.ok(line);
        else cons.hint(line);
      }
    }
    if (state.submitted) {
      cons.ok(
        "제출 완료 — " +
          S.formatTime(state.submitted.at) +
          " · " +
          S.api.fileNameFor(PC.schema.buildPayload(state)) +
          (state.submitted.demo ? " (데모)" : "")
      );
    } else if (sealed) {
      cons.ok("파일로 냈습니다 — " + S.api.fileNameFor(PC.schema.buildPayload(state)));
    }
    if (sealed) cons.muted("답안이 잠겼습니다. 답을 고칠 수 없습니다.");
    else cons.muted("답안은 한 번만 제출할 수 있습니다.");

    /* ---------------- ③ 학습 정리 ---------------- */

    box.appendChild(sectionTitle("③", "학습 정리"));

    /* ★ 판 셋을 «세로 쓰기» 상자 에 넣는다.
       .panel 은 스스로 여백을 가지지 않는다 — 부모의 gap 이 사이를 벌린다.
       본래는 맨몸 <div> 에 그대로 붙여서 테두리 셋이 맞붙어
       한 덩어리로 보여다 — 1페이지의 「학습 순서」 와 같은 까닭이다. */
    var wrapStack = el("div", { class: "stack" });
    box.appendChild(wrapStack);

    var wrap = panel({ title: "오늘 배운 내용 요약", hint: "다음 차시로 이어지는 여섯 줄입니다." });
    wrap.body.appendChild(
      el(
        "div",
        { class: "summary-list" },
        L.WRAP_UP.map(function (text, i) {
          return el("div", { class: "summary-item" }, [
            el("span", {
              class: "summary-item__num",
              attrs: { "aria-hidden": "true" },
              text: String(i + 1)
            }),
            el("span", { class: "summary-item__text", text: text })
          ]);
        })
      )
    );
    wrapStack.appendChild(wrap.root);

    var syntax = panel({
      title: "핵심 함수 카드",
      hint: "오늘 쓴 함수입니다. 펄스를 만들고, 시간을 읽고, 값을 내보냅니다."
    });
    syntax.body.appendChild(functionCards());
    wrapStack.appendChild(syntax.root);

    /* 내가 쓴 것 되돌아보기 */
    var mine = panel({ title: "내가 쓴 정리 되돌아보기", hint: "3·4·5단계에서 직접 한 것입니다." });

    var myCode = String(state.code.source || "").trim();
    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 만든 스케치" }));
    mine.body.appendChild(
      el("div", {
        class: "my-answer my-answer--code" + (myCode ? "" : " is-empty"),
        text: myCode || "4단계에서 만든 코드가 여기에 나타납니다."
      })
    );

    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 이은 회로" }));
    var connText = (state.circuit.connections || [])
      .map(function (conn) {
        return (
          C.describe(conn.fromComponent, conn.fromPin) + " → " + C.describe(conn.toComponent, conn.toPin)
        );
      })
      .join("\n");
    mine.body.appendChild(
      el("div", { class: "my-answer" + (connText ? "" : " is-empty") }, [
        el("span", { text: connText || "3단계에서 이은 케이블이 여기에 나타납니다." })
      ])
    );

    var expText = [];
    L.MEASURES.forEach(function (item) {
      var r = (state.experiment.runs || {})[item.id];
      if (!r || !r.ran) return;
      var line = item.label + " (예상 " + item.expectUs + "μs)";
      if (r.ok) line += "\n  왕복 " + r.duration + "μs · 계산 " + r.measured + "cm · 오차 " + r.error + "cm";
      else line += "\n  측정 실패 (" + r.reason + ")";
      if (String(r.predict || "").trim()) line += "\n  예상 : " + r.predict;
      if (String(r.observation || "").trim()) line += "\n  관찰 : " + r.observation;
      expText.push(line);
    });
    if (String(state.experiment.conditionNote || "").trim()) {
      expText.push("조건 바꾸기 : " + state.experiment.conditionNote);
    }

    mine.body.appendChild(el("h4", { class: "subhead", text: "측정 기록" }));
    mine.body.appendChild(
      el("div", { class: "my-answer" + (expText.length ? "" : " is-empty") }, [
        el("span", {
          text: expText.length ? expText.join("\n\n") : "5단계에서 적은 측정 기록이 여기에 나타납니다."
        })
      ])
    );

    if (String(state.experiment.extensionCondition || "").trim()) {
      mine.body.appendChild(el("h4", { class: "subhead", text: "주차 경고 장치 구상" }));
      mine.body.appendChild(
        el("div", { class: "my-answer" }, [
          el("span", {
            text:
              "조건 : " + state.experiment.extensionCondition +
              (String(state.experiment.extensionParts || "").trim()
                ? "\n부품 : " + state.experiment.extensionParts
                : "")
          })
        ])
      );
    }

    wrapStack.appendChild(mine.root);

    return box;
  }

  S.screens = {
    intro: renderIntro,
    concept: renderConcept,
    circuit: renderCircuit,
    code: renderCode,
    experiment: renderExperiment,
    assess: renderAssess
  };
})();
    </script>
    <script data-from="student/s90-app.js">
/**
 * 학생용 앱 (명세 5장)
 *
 * 하는 일
 *   · 여섯 단계 스테퍼를 그리고 «통과 조건» 에 따라 다음 단계를 연다
 *   · 화면을 다시 그린다
 *   · 바뀔 때마다 localStorage 에 저장한다 (새로고침해도 이어서 할 수 있게)
 *
 * 이전 단계로는 «언제나» 갈 수 있다. 다음 단계는 조건을 채워야 열린다(명세 5장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;

  var state = S.emptyState();

  var screenRoot = null;
  var navArea = null;
  var bannerArea = null;

  /* ------------------------------------------------------------------ */
  /* 상태 고치기                                                          */
  /* ------------------------------------------------------------------ */

  function save() {
    S.store.saveDraft(state);
  }

  /** 상태를 고치고 저장만 한다 — 글을 쓰는 중에 화면이 튀지 않게 */
  function patch(mutator) {
    mutator(state);
    save();
  }

  /** 상태를 고치고 화면을 다시 그린다 */
  function update(mutator) {
    mutator(state);
    save();
    render();
  }

  function goTo(index) {
    var steps = PC.STEPS;
    var target = Math.max(0, Math.min(steps.length - 1, index));
    if (!PC.schema.canGoTo(target, state)) {
      UI.toast(PC.MESSAGES.lockedStep);
      return;
    }
    update(function (s) {
      s.step = target;
    });
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
    UI.announce(steps[target].label + " 단계로 이동했습니다.");
  }

  var app = {
    update: update,
    patch: patch,
    goTo: goTo,
    /* 화면이 «지금» 상태를 볼 때 쓴다 — patch 로 고친 뒤 다시 그리지 않고
       표시만 손볼 때가 있다(4단계의 «마침» 딱지). */
    getState: function () {
      return state;
    },
    rerender: render,
    rerenderNav: function () {
      drawProgress();
      drawNav();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 진행 표시 (명세 5장 스테퍼)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 상단 진행 표시 — 단계 원과 잇는 선, 그리고 진행률 (lesson3_7_1 과 같은 모양).
   *
   * 원 안의 숫자는 «몇 번째 단계» 이고, 마친 단계는 ✔ 로 바뀐다.
   * 색만으로 알리지 않도록 잠김·열림·마침을 낭독기용 글자로도 적는다.
   */
  function drawProgress() {
    var list = UI.$("#stepper-list");
    if (!list) return;

    var steps = PC.STEPS;
    var furthest = PC.schema.furthestStep(state);

    UI.clear(list);
    steps.forEach(function (step, i) {
      var done = i < furthest;
      var current = i === state.step;
      var open = i <= furthest;

      var state1 = done ? "is-done" : "";
      var state2 = current ? "is-current" : "";
      var state3 = open ? "" : "is-locked";

      var node = el("button", {
        class: "stepper__node",
        text: done ? "✔" : String(i + 1),
        attrs: {
          type: "button",
          disabled: open ? null : true,
          "aria-current": current ? "step" : null,
          "aria-label":
            i + 1 + "단계 " + step.label + " — " + (done ? "마침" : current ? "지금 단계" : open ? "열림" : "잠김")
        },
        on: {
          click: function () {
            goTo(i);
          }
        }
      });

      list.appendChild(
        el("li", { class: ["stepper__item", state1, state2, state3].filter(Boolean).join(" ") }, [
          node,
          el("span", { class: "stepper__label", attrs: { "aria-hidden": "true" }, text: step.short })
        ])
      );
    });

    /* 「3 / 6」 과 진행률 막대 */
    var current = UI.$("#progress-current");
    var total = UI.$("#progress-total");
    if (current) current.textContent = String(state.step + 1);
    if (total) total.textContent = String(steps.length);

    var percent = Math.round(((state.step + 1) / steps.length) * 100);
    var fill = UI.$("#progressbar-fill");
    var bar = UI.$("#progressbar");
    if (fill) fill.style.width = percent + "%";
    if (bar) {
      bar.setAttribute("aria-valuenow", String(percent));
      bar.setAttribute("aria-valuetext", state.step + 1 + " / " + steps.length + " 단계 · " + steps[state.step].label);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 아래쪽 이동 단추                                                     */
  /* ------------------------------------------------------------------ */

  function drawNav() {
    if (!navArea) return;
    var steps = PC.STEPS;
    var here = steps[state.step];
    var gate = PC.schema.checkStep(here.key, state);
    var last = state.step === steps.length - 1;

    var reasons = el("div", { class: "nav__reasons" });
    if (!gate.ok && !last) {
      reasons.appendChild(
        el("p", { class: "nav__reasonhead", text: "다음 단계를 열려면" })
      );
      var ul = el("ul", { class: "nav__reasonlist" });
      gate.reasons.forEach(function (r) {
        ul.appendChild(el("li", { text: r }));
      });
      reasons.appendChild(ul);
    }

    var buttons = el("div", { class: "nav__btns" }, [
      UI.button("← 이전", {
        class: "btn btn--ghost",
        disabled: state.step === 0,
        click: function () {
          goTo(state.step - 1);
        }
      }),
      last
        ? null
        : UI.button("다음 →", {
            disabled: !gate.ok,
            click: function () {
              goTo(state.step + 1);
            }
          })
    ]);

    UI.clear(navArea);
    navArea.appendChild(el("div", { class: "nav" }, [reasons, buttons]));
  }

  /* ------------------------------------------------------------------ */
  /* 알림 띠                                                              */
  /* ------------------------------------------------------------------ */

  function drawBanner() {
    if (!bannerArea) return;
    UI.clear(bannerArea);

    var pending = S.store.loadPending();
    if (pending.length > 0) {
      bannerArea.appendChild(
        UI.alert("warn", "아직 보내지 못한 제출이 " + pending.length + "건 있습니다. 6단계에서 [다시 제출] 을 눌러 주세요.")
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 화면 그리기                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 글이 많은 화면은 읽기 좋은 너비로 좁히고, 회로·코드 화면은 넓게 쓴다.
   * (회로 그림과 코드 편집기는 넓을수록 편하다)
   */
  var WIDE_STEPS = { circuit: true, code: true };

  function render() {
    drawProgress();
    drawBanner();

    var step = PC.STEPS[state.step];
    var draw = S.screens[step.key];

    screenRoot.className = "screen " + (WIDE_STEPS[step.key] ? "screen--wide" : "screen--narrow");
    UI.clear(screenRoot);
    if (draw) screenRoot.appendChild(draw(state, app));

    drawNav();
  }

  /* ------------------------------------------------------------------ */
  /* 시작할 때 묻기 — 이어서 할까, 처음부터 할까                             */
  /* ------------------------------------------------------------------ */

  /**
   * 남아 있는 기록이 «물어볼 만한가».
   * 1단계에서 아무것도 하지 않고 새로 고친 것까지 묻는 것은 번거롭다.
   */
  function worthAsking(draft) {
    if (!draft) return false;
    if (draft.step > 0) return true;
    if (draft.submitted) return true;
    if (draft.student.studentId || draft.student.name) return true;
    return S.hasContent(draft);
  }

  /** 「처음부터 시작」 — 이 기기의 학습 기록을 지우고 1단계부터 다시 */
  function startOver() {
    var left = S.store.resetLearning();
    state = S.emptyState();
    render();
    UI.toast(
      left > 0
        ? "처음부터 시작합니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다."
        : "처음부터 시작합니다. 이전 기록을 지웠습니다."
    );
    UI.announce("이전 기록을 지웠습니다. 1단계부터 다시 시작합니다.");
  }

  function askResume(draft) {
    if (!worthAsking(draft)) return;
    if (!UI.askDialog) return; /* 아주 옛 브라우저 — 그냥 이어서 한다 */

    var stepNo = Math.min(PC.STEPS.length, Math.max(1, (draft.step || 0) + 1));

    UI.askDialog({
      title: "이어서 학습하시겠어요?",
      lines: [
        "이전에 " + stepNo + "단계까지 진행한 기록이 남아 있어요.",
        "처음부터 다시 시작하면 이전 기록은 지워집니다."
      ],
      okLabel: "이어서 학습하기",
      cancelLabel: "처음부터 시작",
      /* ★ Esc 로 닫으면 «이어서» 다. 실수로 기록이 사라지면 되돌릴 수 없다. */
      dismiss: "ok",
      onOk: function () {
        UI.announce(stepNo + "단계부터 이어서 학습합니다.");
      },
      onCancel: startOver
    });
  }

  /* ------------------------------------------------------------------ */
  /* 시작                                                                 */
  /* ------------------------------------------------------------------ */

  function start() {
    screenRoot = UI.$("#screen-root");
    navArea = UI.$("#nav-area");
    bannerArea = UI.$("#banner-area");
    if (!screenRoot) return;

    var draft = S.store.loadDraft();
    if (draft) state = draft;

    var saved = S.store.loadStudent();
    if (saved && !state.student.studentId) {
      state.student.studentId = saved.studentId;
      state.student.name = saved.name;
    }

    render();

    /* 남아 있는 기록이 있으면 «이어서 할지 처음부터 할지» 먼저 묻는다.
       공용 컴퓨터에서 앞 학생의 기록 위에 이어서 쓰는 일을 막는 것이 까닭이다. */
    askResume(draft);

    /* 작성 중에 실수로 창을 닫는 것을 막는다 */
    window.addEventListener("beforeunload", function (evt) {
      if (!S.hasContent(state) || state.submitted) return;
      evt.preventDefault();
      evt.returnValue = PC.MESSAGES.leaveWarn;
      return PC.MESSAGES.leaveWarn;
    });

    /* 이 기기의 흔적 지우기 — 공용 태블릿용 */
    var reset = UI.$("#reset-device");
    if (reset) {
      reset.addEventListener("click", function () {
        if (!window.confirm("이 기기에 저장된 내 학습 기록을 모두 지웁니다. 계속할까요?")) return;
        var left = S.store.clearAll();
        state = S.emptyState();
        render();
        UI.toast(left > 0 ? "지웠습니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다." : "지웠습니다.");
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  S.app = {
    getState: function () {
      return state;
    },
    _setState: function (next) {
      state = next;
    },
    render: render
  };
})();
    </script>
  </body>
</html>
