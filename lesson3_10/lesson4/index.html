  font-weight: 800;
}

/* 안전 수칙 — 실물 실습을 다루는 차시라 시작 화면에 둔다 */
.safety-card {
  margin-top: var(--space-5);
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  background: var(--color-false-soft);
  border: 1px solid var(--color-false);
  border-left-width: 5px;
  text-align: left;
}

.safety-card__title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 17px;
  font-weight: 800;
  color: var(--color-false-dark);
  margin-bottom: var(--space-2);
}

.safety-card__desc {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  margin-bottom: var(--space-3);
}

.safety {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.safety__item {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-text);
}

.safety__mark {
  font-weight: 800;
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--color-false);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.hero__time {
  margin-top: var(--space-5);
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.hero__cta {
  margin-top: var(--space-4);
}

.hero__ctanote {
  margin-top: var(--space-2);
  font-size: 13px;
  color: var(--color-text-sub);
}

.hero__feedback {
  margin-top: var(--space-5);
  text-align: left;
}

/* ================================================================== */
/* 2단계 — 원리 이해                                                   */
/* ================================================================== */

.iocards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-3);
}

.iocard {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  border-top: 4px solid var(--color-primary);
  background: var(--color-surface);
}

.iocard--input {
  border-top-color: var(--color-true);
}
.iocard--process {
  border-top-color: var(--color-primary);
}
.iocard--output {
  border-top-color: var(--color-false);
}

.iocard__role {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 800;
  color: var(--color-primary);
  font-size: var(--fs-small);
}

.iocard__icon {
  font-size: 18px;
}

.iocard__title {
  font-size: 15px;
  font-weight: 800;
  margin-top: var(--space-1);
}

.iocard__device {
  font-weight: 700;
  color: var(--color-true-dark);
  font-size: var(--fs-small);
  margin-top: var(--space-1);
}

.iocard__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-2);
}

.flowline {
  text-align: center;
  font-weight: 800;
  color: var(--color-primary);
  letter-spacing: 0.08em;
}

.explore {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.explore__item {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.explore__sum {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  font-weight: 800;
  color: var(--color-text);
}

.explore__mark {
  color: var(--color-primary);
  font-weight: 800;
}

.explore__lead {
  font-weight: 500;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.explore__body {
  padding: 0 var(--space-3) var(--space-3) var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  font-size: 15px;
}

.flow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--space-3);
}

.flow__step {
  position: relative;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
}

.flow__step--loop {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.flow__no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
}

.flow__label {
  font-weight: 800;
  margin-top: var(--space-1);
}

.flow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.flow__repeat {
  display: inline-block;
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-true-dark);
}

.quizitem {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.feedback:empty {
  display: none;
}

/* ------------------------ 작은 진행 표시 (한 단계 안에서) ------------------------ */

/* 3단계처럼 «한 단계 안에 여러 할 일» 이 있는 화면에서
   지금 어디까지 왔는지 한 줄로 보여 준다. 색만으로 알리지 않도록
   마친 것은 ✔, 지금 할 것은 테두리를 굵게 하고 낭독기용 글자도 붙인다. */
.tasks {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.tasks__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-text-sub);
}

.tasks__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.tasks__item.is-now {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-weight: 800;
  padding: calc(var(--space-2) - 1px) calc(var(--space-3) - 1px);
}

.tasks__no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  font-size: 12px;
  font-weight: 800;
  flex: 0 0 auto;
}

.tasks__item.is-done .tasks__no {
  background: var(--color-true);
  color: #fff;
}

.tasks__item.is-now .tasks__no {
  background: var(--color-primary);
  color: #fff;
}

/* 조건 한 줄 안에 붙는 «힌트 보기» 단추 */
.cond .btn {
  flex: 0 0 auto;
  align-self: center;
}

/* ------------------------ 설명 그림 (자체 SVG) ------------------------ */

.fig {
  margin: 0;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.fig__canvas {
  overflow-x: auto;
  background: var(--color-surface);
  border-radius: var(--radius);
  padding: var(--space-2);
}

.fig__svg {
  display: block;
  width: 100%;
  min-width: 460px;
  height: auto;
}

/* 그림 두 장을 «나란히» — 전극 지도와 꽂는 법을 함께 본다.
   좁은 화면에서는 저절로 위아래로 쌓인다. */
.figpair {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-3);
  align-items: start;
}

/* 나란히 놓일 때는 폭 제한을 칸에 맞긴다 */
.figpair .fig--narrow .fig__canvas {
  max-width: none;
}

/* 세로로 긴 그림 — 폭을 묶어 카드 안에 들어오게 한다 */
.fig--narrow .fig__canvas {
  max-width: 380px;
  margin: 0 auto;
}

.fig--narrow .fig__svg {
  min-width: 0;
}

.fig__cap {
  margin-top: var(--space-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.fig__legend {
  list-style: none;
  padding: 0;
  margin-top: var(--space-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.fig__item {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  font-size: var(--fs-small);
}

.fig__no {
  flex: 0 0 auto;
  color: var(--color-primary);
  font-weight: 800;
}

/* 설명 목록의 O · X 표시 — 그림의 배지와 같은 색으로 짝을 맞춘다 */
.fig__no--ok {
  color: var(--color-true-dark);
}

.fig__no--no {
  color: var(--color-error);
}

/* 번호 배지와 지시선 */
.fig__badgebg {
  fill: var(--color-primary);
  stroke: #ffffff;
  stroke-width: 2;
}

.fig__badgeno {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 지시선은 두 겹이다 (s45-figures.js leader 참고)
 * 청록 보드·검은 헤더·흰 종이 «세 바탕» 위에서 모두 보여야 하므로
 * 굵은 흰 선을 깔고 그 위에 진한 주황 선을 얹는다. 보드 색과 확실히 다른 색이다. */
/* O · X 배지 — 글자가 뜻을 지고 색이 거든다 */
.fig__badgebg--ok {
  fill: var(--color-true);
}

.fig__badgebg--no {
  fill: var(--color-error);
}

/* 그 구멍에 부품 다리가 꽂혀 있다 */
.fig__legring {
  fill: none;
  stroke: #b45309;
  stroke-width: 3;
}

/* 같은 전극에 두 다리가 물려 «바로 붙어 버린» 것 */
.fig__shortline {
  stroke: var(--color-error);
  stroke-width: 5;
  stroke-linecap: round;
}

.fig__leaderhalo {
  stroke: #ffffff;
  stroke-width: 6;
  stroke-linecap: round;
}

.fig__leader {
  stroke: #b45309;
  stroke-width: 2.5;
  stroke-linecap: round;
}

/* 가리키는 끝점 — «어디를» 가리키는지 분명히 한다 */
/* ══════════════════════════════════════════════════════════════════
   회로 그림 · 브레드보드 · IDE 설명 그림의 바탕
   ★ 이 묶음을 지우면 SVG 의 글자가 «가운데 정렬» 과 색을 잃는다.
     text-anchor 와 fill 을 CSS 가 지고 있어서, 좌표만 보고는 알 수 없다.
   ══════════════════════════════════════════════════════════════════ */

.ide__title {
  fill: #0f766e;
}

.ide__titletext {
  fill: #ffffff;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__winbtn {
  fill: #a7f3d0;
}

.ide__menu {
  fill: #f1f5f9;
}

.ide__menutext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__toolbar {
  fill: #0f766e;
}

.ide__tool {
  fill: #0d9488;
  stroke: #99f6e4;
  stroke-width: 1.5;
}

.ide__toolicon {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__select {
  fill: #ffffff;
  stroke: #99f6e4;
}

.ide__selecttext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__side {
  fill: #f8fafc;
}

.ide__sideicon {
  fill: #94a3b8;
  font-size: 12px;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__tab {
  fill: #e2e8f0;
}

.ide__tabtext {
  fill: var(--color-text);
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__code {
  fill: #ffffff;
}

.ide__lineno {
  fill: #94a3b8;
  font-size: 11px;
  text-anchor: end;
  font-family: var(--font-mono);
}

.ide__codetext {
  fill: #1e293b;
  font-size: 11px;
  font-family: var(--font-mono);
  white-space: pre;
}

.ide__status {
  fill: #f1f5f9;
}

.ide__statustext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.circuitpair > .card {
  margin-bottom: 0;
}

.board {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.board__tools {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  justify-content: space-between;
}

.board__toolgroup {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

.board__canvas {
  overflow: auto;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-2);
  max-height: 70vh;
}

.board__svg {
  display: block;
  /* 폭은 s40-board.js 의 applyZoom 이 픽셀로 정한다.
     여기서 min-width 를 주면 확대·축소 단추를 이겨 버린다. */
  height: auto;
}

.board__status {
  min-height: 1.6em;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius);
  padding: var(--space-2) var(--space-3);
}

.board__status:empty {
  display: none;
}

.board__picker {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.board__pickersum {
  min-height: var(--touch-min);
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  font-weight: 700;
  color: var(--color-primary-dark);
  cursor: pointer;
}

.board__pickerhelp {
  padding: 0 var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.board__pickerrow {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
  padding: var(--space-3);
}

.uno__usb,
.uno__jack {
  fill: #b8bec7;
  stroke: #8b939e;
}

.uno__header {
  fill: #17202b;
}

.uno__brand {
  fill: #ffffff;
  font-size: 17px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.uno__brandsub {
  fill: #cfe6e2;
  font-size: 11px;
  font-family: var(--font-sans);
}

.uno__group {
  fill: #ffffff;
  font-size: 10px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.bb__body {
  fill: var(--bb-body);
  stroke: var(--bb-line);
  stroke-width: 2;
}

.bb__railline {
  stroke-width: 2;
}

.bb__railline--plus {
  stroke: var(--rail-plus);
}

.bb__railline--minus {
  stroke: var(--rail-minus);
}

.bb__railline--live {
  stroke-width: 5;
}

.bb__railmark {
  font-size: 12px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-text);
  text-anchor: middle;
}

.bb__raillive {
  font-size: 11px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-true-dark);
  text-anchor: start;
}

.bb__gap {
  fill: #dfe2e7;
}

.bb__gaptext {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.bb__rowlabel {
  font-size: 10px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.bb__colno {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.pin__hit {
  fill: transparent;
  /* ★ 단자 «위에서만» 손가락 굴리기를 잠근다 (명세 6.3 — 끌어서 잇기).
     그림 전체에 두면 손가락으로 화면을 아래로 넘길 수 없다.
     코드 조립의 손잡이와 같은 까닭이다. */
  touch-action: none;
  cursor: crosshair;
}

.pin__dot {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.pin--rail .pin__dot,
.pin--tie .pin__dot {
  fill: #7b838f;
  stroke: #ffffff;
}

/* ── 설명 그림의 공통 글자·부품 ────────────────────────────────
 * ★ 여기를 지우면 그림의 글자가 «가운데 정렬» 을 잃고 오른쪽으로 밀려 잘린다.
 *   text-anchor 를 CSS 가 지고 있으므로, SVG 좌표만 보고 지우면 안 된다.
 * ---------------------------------------------------------------- */
.fig__mini {
  fill: #ffffff;
  stroke: var(--color-border);
  stroke-width: 1.5;
}

.fig__minitext {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legname {
  font-size: 15px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legnote {
  font-size: 11px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__leaderdot {
  fill: #b45309;
  stroke: #ffffff;
  stroke-width: 1.5;
}

.fig__hole {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.fig__chip {
  fill: #22262c;
  stroke: #4b5563;
}

.fig__chiptext {
  fill: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-mono);
}

.fig__led {
  fill: #86efac;
  stroke: #16a34a;
}

.fig__part {
  fill: #9ca3af;
  stroke: #6b7280;
}

.fig__reset {
  fill: #c2410c;
  stroke: #7c2d12;
}

.fig__resetin {
  fill: #7c2d12;
}

/* ── 케이블 색 범례와 «어느 쪽» 딱지 ─────────────────────────────
 * 색은 회로의 어느 쪽인지로 정해진다. 색을 «읽는 법» 을 옆에 적어 두고,
 * 목록에는 «D11 쪽 / GND 쪽» 을 글자로도 붙인다(명세 6.1 — 색으로 판정하지 않는다).
 * ---------------------------------------------------------------- */
.wirelegend {
  list-style: none;
  margin: var(--space-3) 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
}

.wirelegend__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelegend__dot {
  flex: none;
  width: 22px;
  height: 4px;
  border-radius: 2px;
}

.wirelegend__dot--yellow {
  background: #e3a008;
}

.wirelegend__dot--blue {
  background: #1d4ed8;
}

.wirelegend__dot--gray {
  background: #9aa3ae;
}

.wirelist__side {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

.wirelist__side--source {
  background: #ffedd5;
  color: #9a3412;
}

.wirelist__side--ground {
  background: #dbeafe;
  color: #1e40af;
}

.wirelist__dot--gray {
  background: #9aa3ae;
}

/* 쓰이지 않는 케이블은 흐리게 — «이건 빠져 있다» 가 보이게 */
.wire--none {
  opacity: 0.55;
  stroke-dasharray: 7 5;
}

/* ── 4단계 A : 프로그램과 함수 설명을 나란히 ──────────────────────
 * 코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않게 한다.
 * 좁은 화면에서는 코드가 위, 설명이 아래로 접힌다.
 * ---------------------------------------------------------------- */
.readpair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.readpair__code,
.readpair__fns {
  min-width: 0;
}

.readpair__fns .subhead {
  margin-top: 0;
}

.readpair__fns .fncards {
  margin-top: var(--space-3);
}

@media (max-width: 900px) {
  .readpair {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ── 3단계 : «지금 이어진 것» 과 «이렇게 이으면 됩니다» ───────────
 * 앞의 것은 늘 보인다 — 앱이 회로를 무엇으로 보고 있는지 되비추는 줄이다.
 * 뒤의 것은 접혀 있다 — 펼쳐야 목표가 보인다(명세 18.2).
 * ---------------------------------------------------------------- */
.nowpath {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-3);
  margin-bottom: var(--space-3);
  background: var(--color-muted-bg);
  border-radius: var(--radius);
}

.nowpath__tag {
  flex: none;
  padding: 1px 8px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.nowpath__text {
  flex: 1 1 240px;
  font-size: var(--fs-small);
}

.goallist {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
  counter-reset: goal;
}

.goallist__item {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.goallist__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.goallist__mark {
  flex: none;
  width: 18px;
  font-weight: 800;
  color: var(--color-text-sub);
  text-align: center;
}

.goallist__item.is-done .goallist__mark {
  color: var(--color-true);
}

.goallist__text {
  flex: 1 1 auto;
  font-size: var(--fs-small);
}

.goallist__state {
  flex: none;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.goallist__item.is-done .goallist__state {
  color: var(--color-true-dark);
}

/* ── 함수 설명 상자 (2단계 «오늘 쓸 함수 세 가지») ────────────────
 * 수업 자료의 크림색 상자를 그대로 옮겼다.
 * 함수마다 «한 줄 정의 → 실제로 적는 꼴 → 언제 쓰는가 → 짚어 줄 것» 차례다.
 * ---------------------------------------------------------------- */
.fncards {
  display: grid;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.fncard {
  padding: var(--space-4) var(--space-5, 20px);
  background: var(--fn-box-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-lg);
}

.fncard__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0 0 var(--space-3);
}

.fncard__name {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text);
}

.fncard__summary {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 실제로 적는 꼴 — 학생이 그대로 베껴 쓸 수 있어야 한다 */
.fnforms {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.fnforms__item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--fn-code-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-sm);
}

.fnforms__label {
  flex: none;
  min-width: 34px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.fnforms__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-text);
  word-break: break-all;
}

.fnforms__comment {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__means {
  margin: 0 0 var(--space-1);
}

.fncard__when {
  margin: 0 0 var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__tag {
  display: inline-block;
  padding: 1px 8px;
  margin-right: var(--space-1);
  background: var(--color-muted-bg);
  border-radius: 999px;
  font-weight: 700;
}

.fncard__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 카드마다 붙는 «핵심 정리» */
.keypoints {
  list-style: none;
  margin: var(--space-4) 0 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.keypoints__item {
  position: relative;
  padding-left: 22px;
  font-size: var(--fs-small);
}

.keypoints__item::before {
  content: "▸";
  position: absolute;
  left: 4px;
  color: var(--color-primary);
  font-weight: 700;
}

/* ── 실행 화면 : Trig 표시등 · 상태 칸 · 펄스 시간표 ────────────
 * HIGH·LOW 를 색으로만 알리지 않는다(명세 11장).
 * 표시등에는 ▮/○ 와 «HIGH (5V)»·«LOW (0V)» 글자가,
 * 시간표 칸에도 «펄스 10μs» 처럼 글자가 함께 들어간다.
 * ---------------------------------------------------------------- */
.runpanel {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-muted-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

/* ── 회로 그림의 부품 (틀·다리·이름표) ────────────────────────
 * 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).
 * 극성은 색이 아니라 «몸통의 ＋ 표시 · 이름표 글자» 가 알린다.
 * ★ 다리 «길이» 는 쓰지 않는다 — 실물은 두 다리가 같은 길이인 것이 많다.
 * ---------------------------------------------------------------- */
.part__tray {
  fill: var(--part-tray);
  stroke: var(--bb-line);
  stroke-width: 1;
}

.part__lead {
  stroke: var(--part-lead);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.part__name {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.part__note {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* 켜짐·꺼짐은 «글자» 가 뜻을 진다. 색이 안 보여도 읽을 수 있어야 한다. */
.part__state {
  font-size: 11px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* ── 그림 속 글씨는 «한 벌» 로 맞춘다 ─────────────────────────────
 * 이름표만 길이에 따라 작아지면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
 * 그래서 이름표·무리 이름·열 번호를 모두 10px 로 두고,
 * 대신 circuit.js 가 헤더 간격을 30 으로 벌려 긴 이름도 닿지 않게 했다.
 * 레일의 + − 만 기호라서 한 단계 크게(12px) 둔다.
 * ---------------------------------------------------------------- */
.pin__label {
  font-size: 10px;
  font-weight: 800;
  fill: #ffffff;
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* ★★ 부품의 단자 이름은 «어두운 글자» 다.
 *
 * 우노 보드는 검정이므로 기본값이 흰색이지만, 센서는 밝은 바탕 위에 놓인다 —
 * VCC·Trig·Echo·GND 가 흰색이면 **아무것도 보이지 않는다.**
 *
 * ★ 이 규칙은 반드시 `.pin__label` «다음» 에 와야 하고,
 *   분류자 하나가 아니라 둘을 겹친 것이어야 한다.
 *   앞에 두면 무게가 같아(0,1,0) 뒤엣것이 이기므로 소리 없이 다시 흰색이 된다.
 *   실제로 그 일이 나서 3페이지 센서의 네 이름이 보이지 않았다(2026-08-22).
 *   `dist.test.js` 의 「★★ 부품 단자 이름이 흰색이 아니다」 가 이것을 지킨다.
 * ---------------------------------------------------------------- */
.pin__label.pin__label--part {
  fill: var(--color-text);
  font-size: 11px;
}

.pin:hover .pin__dot {
  fill: var(--color-primary);
  r: 8;
}

.pin--selected .pin__dot {
  fill: var(--color-false);
  stroke: #ffffff;
  stroke-width: 3;
  r: 9;
}

.pin--hot .pin__dot {
  fill: var(--rail-plus);
}

.pin--gnd .pin__dot {
  fill: var(--rail-minus);
}

.pin:focus {
  outline: none;
}

.pin:focus-visible .pin__dot {
  stroke: var(--color-primary);
  stroke-width: 4;
  r: 9;
}

.wire {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  opacity: 0.9;
}

/* ★ 끌고 있는 동안 손가락을 따라가는 «고무줄» 선 (명세 6.3).
   점선이라 «아직 이어진 것이 아니다» 가 한눈에 보인다. */
.wire--rubber {
  stroke: var(--color-primary);
  stroke-width: 3;
  stroke-dasharray: 8 6;
  opacity: 0.85;
  pointer-events: none;
}

/* 케이블 목록 */
.wirelist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.wirelist__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelist__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 15px;
}

.wirelist__text {
  flex: 1;
}

.wirelist__dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex: 0 0 auto;
  border: 1px solid var(--color-border-strong);
}

.wirelist__dot--black {
  background: #22262c;
}
.wirelist__dot--yellow {
  background: #e3a008;
}
/* 이 차시가 쓰는 넷 — 빨강(전원) · 파랑(접지) · 노랑(Trig) · 초록(Echo)
   ★ Trig 는 주황 → 분홍 → 노랑 순으로 두 번 바뀌었다. 앞의 둘은 전원의
     빨강과 닮아서 어느 것이 전원인지 갈라보기 어려웠다(지적 2026-08-22).
   ★ 노랑 점은 .wirelist__dot--yellow 가 위에 이미 정해 두었다. */
.wirelist__dot--blue {
  background: #1d4ed8;
}

/* ── 물체 거리 고르기 (4단계) ─────────────────────────────────
 * ★ 고른 것은 색만으로 알리지 않는다 — aria-pressed 와 함께
 *   오른쪽 한 줄에 «지금 몇 cm 인가» 를 글로 적는다(명세 13장).
 * ---------------------------------------------------------------- */
.btnrow--dist {
  flex-wrap: wrap;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  background: var(--color-muted-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.btnrow__note {
  flex: 1 1 100%;
  min-width: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.hintout:empty {
  display: none;
}

/* ================================================================== */
/* 4단계 — 텍스트 코딩                                                 */
/* ================================================================== */

/* ------------------------ 4단계 A : 프로그램 읽기 ------------------------ */

.subhead {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

/* 스케치의 뼈대 두 함수 */
.skel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.skel__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.skel__name {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  color: var(--color-primary-dark);
}

.skel__when {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
}

.skel__what {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 한 줄씩 읽어 보기 */
.walk {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.walk__item {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.walk__no {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
}

.walk__body {
  flex: 1 1 auto;
  min-width: 0;
}

.walk__code {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-primary-dark);
  background: var(--color-code-bg);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  white-space: pre-wrap;
}

.walk__code--empty {
  color: var(--color-text-sub);
  font-style: italic;
}

.walk__text {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
}

/* 실행 순서 */
.orderlist {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  font-size: 15px;
}

/* 글쓰기 약속 */
.rules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.rules__item {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  font-size: var(--fs-small);
}

.rules__mark {
  flex: 0 0 auto;
  min-width: 3.4em;
  text-align: center;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
}

/* ── 두 방식을 «모두» 마쳐야 한다는 표시 (4단계) ────────────────
 *
 * 탭만 있으면 «하나 하면 끝» 으로 보인다. [다음] 이 안 열리는 까닭을
 * 아래에서 찾게 하지 말고 여기서 알린다.
 */
.modedone {
  margin-bottom: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.modedone__label {
  margin: 0 0 6px;
  font-weight: 700;
}

.modedone__list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.modedone__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border: 2px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-small);
}

/* 마친 것 — 색만으로 알리지 않게 ✓ 와 «마침» 글자를 함께 준다(명세 13장) */
.modedone__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.modedone__mark {
  font-weight: 800;
}

.modedone__name {
  font-weight: 700;
}

.modedone__state {
  color: var(--color-text-sub);
}

.modedone__item.is-done .modedone__state {
  color: var(--color-true-dark);
  font-weight: 700;
}

.modedone__note {
  margin: 6px 0 0;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

/* 마친 방식은 탭에도 표시한다 */
.modetab--done {
  border-color: var(--color-true);
  color: var(--color-true-dark);
}

.modetabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.modetab {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-sub);
  cursor: pointer;
}

.modetab--on {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.codework {
  margin-top: var(--space-3);
}

.assemble {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.assemble__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.assemble__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

/* ── 끌어 옮기는 손잡이 ────────────────────────────────────────
 * ★ 끄는 곳을 손잡이로 «한정» 한다. 줄 아무 데나 잡히면
 *   손가락으로 화면을 세로로 넘길 수 없다.
 * ★ touch-action: none 은 «여기에만» 둔다 — 손가락으로 끌 때
 *   화면이 함께 밀리지 않게 하는 것이고, 나머지 자리는 그대로 넘어간다.
 * ---------------------------------------------------------------- */
.assemble__grip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 손가락으로 잡기 좋은 크기 (명세 13장 «큰 터치 영역») */
  min-width: 32px;
  min-height: 36px;
  color: var(--tok-comment);
  font-size: 18px;
  line-height: 1;
  cursor: grab;
  touch-action: none;
  user-select: none;
  border-radius: var(--radius-sm, 6px);
}

.assemble__grip:hover {
  color: var(--color-console-text);
  background: rgba(255, 255, 255, 0.08);
}

.assemble__grip:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/*
 * 끌고 있는 줄 — 자리에서 «떼어 내» 손가락을 따라간다(JS 가 position: fixed 를 준다).
 * 색만으로 알리지 않게 «들린 그림자» 와 살짝 기울임을 함께 준다.
 */
.assemble__item--dragging {
  cursor: grabbing;
  border-color: var(--color-primary);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.45);
  transform: rotate(-0.6deg);
  opacity: 0.96;
}

/*
 * ★★ 놓일 자리.
 *   끌고 있는 줄과 «같은 높이» 의 점선 칸이 목록 안에서 움직인다.
 *   「3번째 자리」 라고 적어 두므로, 어디에 놓이는지 색이 아니라 «글자» 로도 안다.
 *   이 규칙을 지우면 끌어 옮기기가 다시 «어디로 가는지 모르는» 조작이 된다.
 */
.assemble__slot {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
  font-weight: 800;
}

.assemble__item--dragging .assemble__grip {
  cursor: grabbing;
  color: var(--color-primary);
}

/* 끌고 있는 동안에는 나머지 줄이 자리를 내주는 것이 보이게 */
.assemble--dragging .assemble__item:not(.assemble__item--dragging) {
  transition: transform 0.12s ease;
}

@media (prefers-reduced-motion: reduce) {
  .assemble--dragging .assemble__item:not(.assemble__item--dragging) {
    transition: none;
  }
}

.assemble__no {
  color: var(--tok-comment);
  font-family: var(--font-mono);
  min-width: 2ch;
}

.assemble__code {
  flex: 1;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  overflow-x: auto;
  color: var(--color-console-text);
}

.assemble__btns {
  display: flex;
  gap: var(--space-1);
}

.blanks {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: var(--color-console-bg);
  padding: var(--space-3);
  border-radius: var(--radius);
  /* 긴 코드 줄(int notes[] = {523, …};)은 «이 상자 안에서» 옆으로 밀린다 */
  overflow-x: auto;
}

/*
 * 한 빈칸 = «이름표 + 입력칸» 두 줄.
 * 이름표를 위에 두어야 긴 힌트가 접히며 다 보인다(placeholder 는 접히지 않는다).
 */
.blanks__row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 2px 0;
}

.blanks__hint {
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: var(--tok-comment);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.45;
  cursor: pointer;
}

.blanks__hinttext {
  min-width: 0;
}

.blanks__fixed {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  color: var(--color-console-text);
  padding: var(--space-1) 0;
}

/*
 * ★ 힌트가 길다 — 「speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄」.
 *   폭을 420px 로 묶어 두었더니 뒷글자가 잘려 무엇을 적으라는지 알 수 없었다.
 *   글씨를 한 급 줄이고 남은 폭을 «다 쓰게» 한다. min-width: 0 이 있어야
 *   flex 칸이 글자 길이만큼 부풀지 않고 줄어든다.
 */
.blanks__input {
  /* ★ 여백을 여기에 두지 «않는다» — width:100% 와 겹쳐 상자 밖으로 밀려난다.
     들여쓰기는 줄(.blanks__row)의 padding-left 가 맡는다. */
  align-self: stretch;
  max-width: 560px;
  font-size: 13px;
  padding: var(--space-1) var(--space-2);
}

.blanks__input::placeholder {
  color: var(--color-text-sub);
  opacity: 1;
}

.editor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.editor__body {
  display: flex;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  overflow: hidden;
}

.editor__gutter {
  display: flex;
  flex-direction: column;
  padding: var(--space-3) var(--space-2);
  background: #16233a;
  color: var(--tok-comment);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  text-align: right;
  min-width: 3ch;
  overflow: hidden;
  user-select: none;
}

.editor__area {
  flex: 1;
  min-height: 260px;
  padding: var(--space-3);
  border: 0;
  background: transparent;
  color: var(--color-console-text);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  resize: vertical;
  tab-size: 2;
}

.editor__area:focus {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.editor__help {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* 가상 시리얼 모니터 */
.monitor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.monitor__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.monitor__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
}

.monitor__clock {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-true-dark);
}

.monitor__out {
  min-height: 120px;
  max-height: 260px;
  overflow-y: auto;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.monitor__line {
  display: flex;
  gap: var(--space-3);
  color: var(--color-console-text);
}

.monitor__t {
  color: var(--tok-comment);
  min-width: 7ch;
}

.monitor__text {
  flex: 1;
  color: var(--tok-number);
  font-weight: 700;
}

.monitor__where {
  color: var(--tok-comment);
  font-size: 13px;
}

.monitor__note {
  color: var(--tok-comment);
  font-style: italic;
  padding: var(--space-1) 0;
}

/* ================================================================== */
/* 5단계 — 실행·탐구                                                   */
/* ================================================================== */

/* ------------------ 5단계 : 입력·출력 장치 알아보기 ------------------ */

/* 장치 표 — 좁은 화면에서는 표만 좌우로 밀린다(본문은 밀리지 않는다) */
.devwrap {
  overflow-x: auto;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.devtable {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-small);
}

.devtable th,
.devtable td {
  padding: var(--space-2) var(--space-3);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
  vertical-align: top;
}

.devtable th {
  background: var(--color-primary-soft);
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.devtable tr:last-child td {
  border-bottom: 0;
}

.devtable td:first-child {
  white-space: nowrap;
}

.devtable__icon {
  display: inline-block;
  min-width: 1.4em;
  margin-right: var(--space-1);
  color: var(--color-primary);
}

/* 어느 핀에 꽂을지 고르는 법 */
.pinrules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.pinrules__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.pinrules__q {
  font-weight: 800;
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
}

.pinrules__a {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text);
}

.expform {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
}

.expresult {
  padding: var(--space-3);
  background: var(--color-true-soft);
  border-radius: var(--radius);
}

.expresult__head {
  font-weight: 800;
  color: var(--color-true-dark);
}

.expresult__list {
  margin-top: var(--space-2);
  font-size: 15px;
}

.record {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.record__data {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-true-dark);
}

.design {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.design__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
}

.design__goal {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ================================================================== */
/* 6단계 — 형성평가·제출                                               */
/*                                                                    */
/* 짜임새와 이름을 lesson3_7_1 의 6단계와 «같게» 맞추었다.              */
/*   ① 형성평가(왼쪽) + ② 채점·제출 진행 상황(오른쪽) → ③ 학습 정리     */
/* ================================================================== */

/* ------------------ 좌우 두 쪽 · 판 · 구역 제목 ------------------ */

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
}

@media (max-width: 900px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title:first-child {
  margin-top: 0;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.badge--true {
  border-color: var(--color-true);
  color: var(--color-true-dark);
  background: var(--color-true-soft);
}

.badge--false {
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.badge--primary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
}

/* ---------------------- 진행 상황 콘솔 ---------------------- */

.console {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.console__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.console__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.console__body {
  min-height: 132px;
  max-height: 320px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.75;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.console__line {
  display: flex;
  gap: 8px;
}

.console__prompt {
  flex: 0 0 auto;
  color: #38bdf8;
  user-select: none;
}

.console__text {
  flex: 1 1 auto;
}

.console__line--error .console__text {
  color: var(--color-error-on-dark);
}

.console__line--hint .console__text {
  color: var(--color-hint-on-dark);
}

.console__line--ok .console__text {
  color: #86efac;
}

.console__line--muted .console__text {
  color: #94a3b8;
}

.console__empty {
  color: #64748b;
}

/* ---------------------- 응시자 정보 ---------------------- */

.student-card {
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.student-card.is-ready {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.student-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.student-card__title {
  font-size: 15px;
  font-weight: 800;
}

.student-card__badge {
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.student-card__fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .student-card__fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.student-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.student-field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.student-field__input {
  width: 100%;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text);
}

.student-field__input:hover {
  border-color: var(--color-primary);
}

.student-field__input:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.student-field__input.is-invalid {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.student-card__note {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-false-dark);
  min-height: 1.4em;
}

.student-card__note.is-ok {
  color: var(--color-true-dark);
}

.student-card__privacy {
  margin-top: 4px;
  font-size: 12px;
  color: var(--color-text-sub);
}

/* 학번·이름을 넣기 전에는 문항을 잠근다 */
.quiz-gate {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  border: 1px solid var(--color-false);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-false-dark);
}

.quiz-gate__icon {
  font-size: 18px;
}

.quiz-gate[hidden] {
  display: none;
}

.quiz__body.is-gated {
  opacity: 0.45;
  filter: grayscale(0.35);
  pointer-events: none;
  user-select: none;
}

/* -------------------- 문항 (한 번에 하나) -------------------- */

.quiz__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  font-weight: 700;
}

.quiz__counter {
  flex: 0 0 auto;
  font-weight: 800;
  white-space: nowrap;
}

.quiz__dots {
  display: flex;
  gap: 6px;
}

.quiz__dot {
  position: relative;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: transparent;
  padding: 0;
  cursor: pointer;
}

/* 점은 10px 이지만 누르는 자리는 44px 을 확보한다 */
.quiz__dot::after {
  content: "";
  position: absolute;
  inset: -17px;
}

.quiz__dot.is-answered {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.quiz__dot.is-current {
  transform: scale(1.35);
  border-color: var(--color-primary);
}

.quiz__dot:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 4px;
}

.quiz__tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.quiz__question {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.6;
}

.quiz__no {
  color: var(--color-primary-dark);
  margin-right: 6px;
}

.quiz__note {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.option {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  text-align: left;
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.option:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.option.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.option:focus-within {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* 답안을 낸 뒤 — 읽기만 된다. 누를 수 있어 보이면 안 된다. */
.option--locked {
  cursor: default;
}

.option--locked:hover {
  border-color: var(--color-border-strong);
  background: var(--color-surface);
}

.option--locked.is-selected:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.option__num {
  flex: 0 0 auto;
  font-weight: 800;
  color: var(--color-primary-dark);
}

.option__text {
  flex: 1 1 auto;
}

/* ------------------------ 채점 결과 ------------------------ */

.score-card {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow);
}

.score-card__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.score-card__student {
  margin-top: 4px;
  font-size: 15px;
  color: var(--color-text-sub);
}

.score-card__student strong {
  color: var(--color-text);
}

.score-card__value {
  margin-top: var(--space-2);
  font-size: 46px;
  font-weight: 900;
  line-height: 1.1;
  color: var(--color-primary-dark);
}

.score-card__value small {
  font-size: 20px;
  color: var(--color-text-sub);
  font-weight: 700;
}

.score-dots {
  display: flex;
  justify-content: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.score-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.score-dot.is-correct {
  background: var(--color-true);
  border-color: var(--color-true);
  color: #fff;
}

.score-card__count {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.score-card__level {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.score-card__level strong {
  font-size: 17px;
  color: var(--color-primary-dark);
}

.score-card__comment {
  margin-top: var(--space-4);
  font-size: 16px;
  font-weight: 700;
}

.lint:empty {
  display: none;
}

.review {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-false);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.review--ok {
  border-left-color: var(--color-true);
}

.review__head {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  font-weight: 800;
}

.review__mark {
  color: var(--color-false-dark);
}

.review--ok .review__mark {
  color: var(--color-true-dark);
}

.review__state {
  margin-left: auto;
  font-size: 13px;
}

.review__stem {
  font-size: 15px;
  color: var(--color-text-sub);
}

.review__answer {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: pre-wrap;
}

.review__why {
  font-size: 15px;
}

/* ------------------------ 학습 정리 ------------------------ */

.summary-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.summary-item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.summary-item__num {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
}

.summary-item__text {
  flex: 1 1 auto;
  line-height: 1.7;
}

/* 핵심 문법 카드 */
.syntaxcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-3);
}

.syntaxcard {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.syntaxcard__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-primary-soft);
  border-bottom: 1px solid var(--color-border);
}

.syntaxcard__title {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.syntaxcard__code {
  margin: 0;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre;
  overflow-x: auto;
  background: var(--color-muted-bg);
}

.syntaxcard__note {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 내가 쓴 것 되돌아보기 */
.my-answer {
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px dashed var(--color-border-strong);
  background: var(--color-muted-bg);
  white-space: pre-wrap;
  min-height: 56px;
  font-size: var(--fs-small);
  line-height: 1.7;
}

.my-answer.is-empty {
  color: var(--color-text-sub);
}

.my-answer--code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.privacy {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* ================================================================== */
/* 작은 화면                                                           */
/* ================================================================== */
@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

@media (max-width: 767px) {
  .app-progress__inner,
  .nav {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }

  .hero .goal-card,
  .hero .safety-card {
    margin-top: var(--space-4);
    padding: var(--space-4);
  }

  .hero .agenda,
  .hero .hero__time {
    margin-top: var(--space-4);
  }

  .hero .agenda__list {
    grid-template-columns: minmax(0, 1fr);
  }

  .hero .hero__cta .btn {
    width: 100%;
  }

  .nav__btns {
    width: 100%;
  }

  .nav__btns .btn {
    flex: 1;
  }

  /* 모바일에서 단자를 크게 하는 일은 applyZoom 이 맡는다 (명세 6.1).
     단자 사이 간격이 24 단위로 고정이라, 누르는 자리만 넓히면 옆 단자와 겹쳐
     엉뚱한 곳이 눌린다. 그래서 «그림 전체» 를 크게 그린다.
     손가락으로 겨누기 쉽게 구멍만 조금 키운다. */
  .pin__dot {
    r: 7.5;
  }
}

/* ── 고르는 줄 (각도·재질 같은 것) ───────────────────────────── */
.modepick {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

/* ── 표 (5단계 비교표 · 음표표) ─────────────────────────────── */
/*
 * ★ 이 규칙이 없던 적이 있다. 5단계 비교표가 «테두리 없는 맨 표» 로 그려져
 *   칸이 어디서 갈리는지 보이지 않았다. 표를 새로 쓸 때 이 이름을 쓴다.
 */
.exptable {
  width: 100%;
  margin: var(--space-2) 0;
  border-collapse: collapse;
  font-size: var(--fs-small);
  display: block;
  overflow-x: auto;
}

.exptable__cap {
  caption-side: top;
  text-align: left;
  padding-bottom: 6px;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.exptable th,
.exptable td {
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

.exptable thead th {
  background: var(--color-muted-bg);
  font-weight: 700;
}

.exptable tbody th {
  background: var(--color-bg);
  font-weight: 700;
}

.exptable tr.is-empty td {
  color: var(--color-text-sub);
}

/* tone 과 delay 를 «다른 색» 으로 — 둘을 갈라 읽게 한다 */
.exptable .is-tone {
  color: var(--color-primary-dark);
  font-weight: 700;
}

.exptable .is-delay {
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 확장 활동의 빈칸 검사 — «확인하고 나서» 실행한다 */
.extcheck {
  padding: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.extcheck__sum {
  margin: 0 0 var(--space-1);
  font-weight: 700;
}

.extcheck__sum.is-ok {
  color: var(--color-true-dark);
}

/* ── 확장 활동 (5단계) ────────────────────────────────────────
 *
 * ★★ 접어 두되 «눈에 띄게» 둔다.
 *   여느 접기와 똑같이 생기면, 알림음을 고른 학생이 그다음 무엇을 해야 하는지
 *   보이지 않는다. 색·테두리·큰 제목을 주고, 고른 것이 있으면 펼친 채 시작한다.
 */
.extbox {
  margin: var(--space-3) 0;
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg, 12px);
  background: var(--color-surface);
  overflow: hidden;
}

/* 고를 것을 고른 뒤 — 여기가 다음에 할 일이라는 표시 */
.extbox--ready {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px var(--wave-glow);
}

/* ★★ 제목 · 한 줄 안내 · 접기 표시를 «갈라» 놓는다 (지적 2026-08-22).
 *
 * 셋을 한 줄에 나란히 두었더니 제목이 두 줄로 접히고, 안내 글이 「접기」 와
 * 맞붙고, 화살표(▴)만 아래로 떨어졌다 — 무엇이 제목인지 알 수 없었다.
 *
 * 격자로 «제목/안내» 와 «접기» 두 칸을 만들고, 왼쪽 칸 안에서 제목과 안내를
 * 세로로 쌓는다. 접기 표시는 오른쪽 위에 붙여 둔다.
 * ---------------------------------------------------------------- */
.extbox__sum {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: var(--space-2) var(--space-3);
  padding: var(--space-4);
  background: var(--color-muted-bg);
  cursor: pointer;
  list-style: none;
}

.extbox__head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.extbox--ready .extbox__sum {
  background: var(--color-primary-soft);
}

.extbox__sum::-webkit-details-marker {
  display: none;
}

.extbox__sum:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: -3px;
}

.extbox__icon {
  font-size: 26px;
  line-height: 1;
}

.extbox__label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
}

.extbox__title {
  font-size: var(--fs-h3);
  font-weight: 800;
  line-height: 1.45;
  color: var(--color-text);
}

/* 한 줄 안내 — 제목과 «구실이 다르다» 는 것이 한눈에 보이게 작고 옅게 */
.extbox__hint {
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.6;
  color: var(--color-text-sub);
}

.extbox--ready .extbox__hint {
  color: var(--color-primary-dark);
}

/* 접기 표시 — 오른쪽 위. 글자가 있어야 낭독기가 읽는다 */
.extbox__toggle {
  flex: none;
  align-self: start;
  white-space: nowrap;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-primary-dark);
}

.extbox__note {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.extbox--ready .extbox__note {
  color: var(--color-primary-dark);
  font-weight: 700;
}

/* 「펼치기 ▾」 — 열면 「접기 ▴」 로 바뀐다 */
.extbox__more {
  flex: 0 0 auto;
  padding: 4px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: var(--fs-small);
  font-weight: 700;
  white-space: nowrap;
}

/* ★ 글자는 JS 가 바꾼다.
 *   CSS 의 content 로 바꾸려면 원래 글자를 font-size:0 으로 숨겨야 하는데,
 *   그러면 같은 상자 안의 화살표까지 함께 사라진다. 낭독기에도 안 읽힌다. */
.extbox[open] .extbox__more {
  background: var(--color-muted-bg);
}

.extbox__body {
  padding: var(--space-3);
  border-top: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.extbox__h {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-h3, 18px);
}

.extbox__lead {
  margin: 0;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

/* 빈칸 앞의 «몇 번째 차례» 딱지 — 위 차례 목록의 번호와 같다 */
/* 몇 번째 차례의 빈칸인가 — 위 «만드는 차례» 의 번호와 같다 */
.blanks__step {
  flex: 0 0 auto;
  color: var(--color-hint-on-dark);
  font-weight: 800;
}

/* ── 흔히 어긋나는 두 가지 + 바른 꼴 ──────────────────────────── */
/*
 * ★ 셋을 «나란히» 놓는다. 바른 꼴만 보이면 왜 그래야 하는지 알 수 없다.
 *   ✗ 두 개가 저마다 «다른 증상» 을 내는 것이 이 표의 알맹이다.
 */
.pitfalls {
  display: grid;
  gap: var(--space-2);
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.pitfall {
  padding: var(--space-2);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.pitfall--bad {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.pitfall--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.pitfall__mark {
  margin: 0 0 6px;
  font-weight: 800;
}

.pitfall--bad .pitfall__mark {
  color: var(--color-error);
}

.pitfall--ok .pitfall__mark {
  color: var(--color-true-dark);
}

.pitfall__code {
  margin: 0 0 6px;
  padding: 8px;
  background: var(--color-code-bg);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  white-space: pre-wrap;
  overflow-x: auto;
}

.pitfall__symptom {
  margin: 0 0 4px;
  font-weight: 700;
}

.pitfall__why {
  margin: 0;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

/* ── 시간 배분 — 「400ms 가 어떻게 쓰이는가」 ────────────────────
 * ★ 코드에는 250 과 400 만 적혀 있고, 정작 배워야 할 150 은 «적혀 있지 않다».
 *   그 뺄셈을 눈으로 보여 주는 자리다(2단계 «두 가지 방법» ① 블록).
 * ---------------------------------------------------------------- */
.timing {
  margin: var(--space-3) 0 var(--space-2);
  padding: var(--space-3);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.timing__title {
  margin: 0 0 var(--space-2);
  font-weight: 800;
  font-size: var(--fs-small);
}

.timing__spans {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

/* 「0 ~ 250ms」 칸은 폭을 맞춰 두 줄이 세로로 나란히 읽히게 한다 */
.timing__span {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--fs-small);
}

.timing__at {
  flex: 0 0 auto;
  min-width: 104px;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.timing__what {
  font-weight: 700;
}

.timing__why {
  flex-basis: 100%;
  padding-left: 112px;
  color: var(--color-text-sub);
}

/* 뺄셈 한 줄 — 여기가 이 상자의 알맹이다 */
.timing__sum {
  margin: var(--space-2) 0 0;
  padding-top: var(--space-2);
  border-top: 1px dashed var(--color-border-strong);
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.timing__role {
  margin: var(--space-1) 0 0;
  font-size: var(--fs-small);
  line-height: 1.6;
}

@media (max-width: 560px) {
  .timing__why {
    padding-left: 0;
  }
}

/* ══════════════════════════════════════════════════════════════════
   이 차시에서 늘어난 부품 — 초음파 센서 · 거리 · 시간표 (명세 6.2 · 6.5)

   ★ 상태를 «색으로만» 알리지 않는다(명세 11장).
     아래 모든 규칙은 «글자로 적은 상태» 와 짝을 이루어 쓴다 —
     예) 시간표 칸 안의 「펄스 10μs」, 물체 옆의 「천 · 비스듬함」.
   ══════════════════════════════════════════════════════════════════ */

/* ── 회로 그림의 센서 ─────────────────────────────────────────── */

.sonic__pcb {
  fill: var(--sonic-pcb);
  stroke: var(--sonic-pcb-edge);
  stroke-width: 2;
}

.sonic__horn {
  fill: var(--sonic-horn);
  stroke: var(--sonic-horn-edge);
  stroke-width: 2;
}

.sonic__mesh {
  fill: var(--sonic-mesh);
  stroke: none;
}

.sonic__hornlabel {
  font-size: 13px;
  font-weight: 800;
  fill: var(--sonic-horn-text);
  text-anchor: middle;
  pointer-events: none;
}

.sonic__crystal {
  fill: var(--sonic-crystal);
  stroke: var(--sonic-crystal-edge);
  stroke-width: 1.5;
}

/* 측정 준비가 되었을 때 내보내는 쪽에 퍼지는 물결 */
.sonic__wave {
  fill: none;
  stroke: var(--wave-out);
  stroke-width: 2;
  opacity: 0.45;
  pointer-events: none;
}

/* 네 다리 — 갈래마다 색을 달리 두되 이름표를 늘 함께 적는다 */
.part__lead--vcc {
  stroke: var(--lane-power);
}
.part__lead--trig {
  stroke: var(--lane-trig);
}
.part__lead--echo {
  stroke: var(--lane-echo);
}
.part__lead--gnd {
  stroke: var(--lane-ground);
}

/* ── 케이블 색 딱지 — 갈래가 넷이라 글자를 반드시 함께 둔다 ─────── */

.wirelegend__dot--red {
  background: var(--lane-power);
}
.wirelegend__dot--green {
  background: var(--lane-echo);
}
.wirelist__dot--red {
  background: var(--lane-power);
}
.wirelist__dot--green {
  background: var(--lane-echo);
}

.wirelegend__word {
  min-width: 3.2em;
  font-weight: 700;
  font-size: var(--fs-small);
}

.wirelist__side--power,
.wirelist__side--ground,
.wirelist__side--trig,
.wirelist__side--echo {
  font-weight: 700;
}

/* ── 설명 그림의 센서 ─────────────────────────────────────────── */

.figson__pcb {
  fill: var(--sonic-pcb);
  stroke: var(--sonic-pcb-edge);
  stroke-width: 2;
}

.figson__horn {
  fill: var(--sonic-horn);
  stroke: var(--sonic-horn-edge);
  stroke-width: 2;
}

.figson__mesh {
  fill: var(--sonic-mesh);
}

.figson__hornlabel {
  font-size: 15px;
  font-weight: 800;
  fill: var(--sonic-horn-text);
  text-anchor: middle;
}

.figson__crystal {
  fill: var(--sonic-crystal);
  stroke: var(--sonic-crystal-edge);
  stroke-width: 1.5;
}

.figson__leg {
  stroke: var(--part-lead);
  stroke-width: 3;
  stroke-linecap: round;
}

.figson__pad {
  fill: var(--sonic-pad);
  stroke: var(--sonic-pad-edge);
  stroke-width: 1.4;
}

/* 네 다리의 이름 — VCC · Trig · Echo · GND
   ★ 15px 로 두었더니 «Trig» 과 «Echo» 가 서로 닿았다.
     그림의 주인공은 «센서» 이지 «이름» 이 아니다 — 읽힐 만하면 된다. */
.figson__legname {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 줄 왜쪽에 «이 줄이 무엇인가» 를 적는다.
   ★ 오른끝 맞춤이다 — 그래서 말이 길어지면 왜쪽으로 자란다.
     가운데 맞춤이면 오른끝이 움직여 센서 이름과 닿는지 알 수 없다. */
.figson__rowlabel {
  font-size: 11px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: end;
  font-family: var(--font-sans);
}

/* 다리가 이어질 우노 핸 이름 */
.figson__goal {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-primary-dark);
  text-anchor: middle;
}

/* ── 물체와 초음파의 길 ──────────────────────────────────────── */

.figobj__wall {
  fill: var(--target-board);
  stroke: var(--target-board-edge);
  stroke-width: 2;
}

.figpath {
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
}

.figpath--go {
  stroke: var(--wave-out);
}

.figpath--back {
  stroke: var(--wave-back);
  stroke-dasharray: 7 5;
}

.figpath__arc {
  fill: none;
  stroke: var(--wave-out);
  stroke-width: 1.8;
  opacity: 0.65;
}

/* 돌아오는 파동은 나간 파동과 «다른 색» 이어야 한다.
   같은 색이면 위아래 두 길이 한 덩어리로 보인다. */
.figpath__arc--back {
  stroke: var(--wave-back);
}

/* 물체 면에서 돌아서는 자리 — «나간 것이 그대로 돌아온다» 를 잉는다 */
.figpath--turn {
  stroke: var(--wave-back);
  stroke-dasharray: 4 4;
  stroke-width: 2;
}

/* 아두이노와 주고받는 두 신호선 */
.figson__signal {
  stroke-width: 2.6;
  stroke-linecap: round;
}

.figson__signal--in {
  stroke: var(--wave-out);
}

.figson__signal--out {
  stroke: var(--wave-back);
}

.figson__signame {
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  fill: var(--color-text);
  font-family: var(--font-sans);
}

.figson__side {
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  fill: var(--color-text-sub);
  font-family: var(--font-sans);
}

/* «실물과 다르게 그렸다» 는 말. 작지만 반드시 있어야 한다 */
.figson__note {
  font-size: 12px;
  font-weight: 700;
  text-anchor: middle;
  fill: var(--color-text-sub);
  font-family: var(--font-sans);
}

/* 화살촉 — 선과 같은 색으로 칠해야 한 덧어리로 보인다 */
.figarrow {
  fill: var(--wave-out);
}

.figarrow--out,
.figarrow--back {
  fill: var(--wave-back);
}

/* ── 접어 두는 덧자료 ─────────────────────────────────────────
 * ★★ 여기에는 규칙이 «하나도 없었다». 그래서 여는 줄이 맨 글자로 나와
 *   눌러 볼 수 있다는 것이 보이지 않았다 — 2단계 원리 카드와 같은 흠이다.
 * ---------------------------------------------------------------- */

.foldout {
  margin: var(--space-2) 0;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.foldout[open] {
  border-color: var(--color-primary);
}

.foldout__sum {
  padding: var(--space-3);
  min-height: 44px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text);
  background: var(--color-muted-bg);
  cursor: pointer;
}

.foldout__sum:hover {
  background: var(--color-primary-soft);
}

.foldout__sum:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: -3px;
}

.foldout__body {
  padding: var(--space-4);
  border-top: 1px solid var(--color-border);
}

.foldout__body:empty {
  display: none;
}

/* ★ 「해 보면 좋은 것」 하나를 도드라지게 — 접힌 채로도 눈에 들어와야 한다.
   테두리를 굵게 두고 여는 줄을 파랗게 채운다. */
.foldout--strong {
  border-width: 2px;
  border-color: var(--color-primary);
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(15, 23, 42, 0.08));
}

.foldout--strong .foldout__sum {
  font-size: var(--fs-lead);
  font-weight: 800;
  color: #fff;
  background: var(--color-primary);
}

.foldout--strong .foldout__sum:hover {
  background: var(--color-primary-dark);
}

/* 돌려 볼 길 — 「30 → 26 → 18 …」 */
.pathline {
  min-width: 0;
  overflow-x: auto;
}

.pathline__text {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

/* ── 시리얼 모니터 머리의 «등» (확장 활동) ─────────────────────
 * 숫자만 죽 찍히면 LED 가 켜졌는지 눈으로 알 수 없다.
 * ★ 색만으로 알리지 않는다 — ▮/○ 와 «LED 켜짐/꺼짐» 글자를 함께 둔다.
 * ---------------------------------------------------------------- */

.monlamp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  margin-right: var(--space-3);
  padding: 2px var(--space-2);
  border-radius: 999px;
  background: var(--color-muted-bg);
  border: 1px solid var(--color-border-strong);
}

.monlamp--on {
  background: var(--led-soft);
  border-color: var(--led-on);
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
}

.monlamp__dot {
  font-size: 13px;
  line-height: 1;
  color: var(--color-text-sub);
}

.monlamp--on .monlamp__dot {
  color: var(--led-on-edge);
}

.monlamp__text {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.monlamp--on .monlamp__text {
  color: var(--led-on-edge);
}

/* ── 측정 범위를 벗어나면 — 두 경우를 나란히 ──────────────────
 * ★ 까닭 · 재 보기 단추 · 결과를 한 칸 안에 세로로 쌓는다.
 *   전에는 결과가 토스트로 나와 3초 뒤 사라졌다 — 다시 볼 수 없었다.
 * ---------------------------------------------------------------- */

.rangecase {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  align-items: flex-start;
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  height: 100%;
  box-sizing: border-box;
}

.rangecase__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: 0;
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text);
}

/* 「너무 가까움」 같은 딱지 — 색만으로 알리지 않으므로 글자가 뜻을 진다 */
.rangecase__tag {
  flex: none;
  padding: 2px var(--space-2);
  font-size: 12px;
  font-weight: 800;
  color: var(--color-false-dark);
  background: var(--color-false-soft);
  border: 1px solid var(--color-false);
  border-radius: var(--radius-sm);
}

.rangecase__why {
  margin: 0;
  font-size: var(--fs-small);
  line-height: 1.7;
  color: var(--color-text-sub);
}

/* 재 본 결과 — 그 자리에 남는다 */
.rangecase__out {
  align-self: stretch;
  padding: var(--space-2) var(--space-3);
  font-size: var(--fs-small);
  line-height: 1.6;
  color: var(--color-text-sub);
  background: var(--color-muted-bg);
  border-left: 4px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
}

.rangecase__out--ok {
  color: var(--color-true-dark);
  background: var(--color-true-soft);
  border-left-color: var(--color-true);
}

.rangecase__out--fail {
  color: var(--color-false-dark);
  background: var(--color-false-soft);
  border-left-color: var(--color-false);
}

/* ── 빈칸을 채우기 «전» 에 읽는 안내 ──────────────────────────
 * 「무엇을 · 어떤 꼴로 · 왜」 셋을 한 줄에 세로로 쌓는다.
 * ★ 꼴(guide__shape)은 가로쓰기 글씨다 — 답이 아니라 «틀» 이므로
 *   코드 칸처럼 어둡게 두지 않고 옅은 바탕에 둔다.
 * ---------------------------------------------------------------- */

.guide {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-muted-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.guide__head {
  margin: 0;
  font-size: 14px;
  font-weight: 800;
  color: var(--color-text);
}

.guide__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.guide__row {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.guide__no {
  flex: none;
  font-weight: 800;
  color: var(--color-primary);
}

.guide__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.guide__what {
  margin: 0;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text);
}

.guide__shape {
  display: block;
  width: fit-content;
  max-width: 100%;
  padding: 2px var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius-sm);
  overflow-wrap: anywhere;
}

.guide__why {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ── 확장 활동 : 주차 경고 장치 그림 ──────────────────────────
 * 이 차시의 «필수» 회로에는 LED 가 없다(명세 6.5). 그래서 이 그림은
 * 회로 시뮬레이터가 아니라 «무엇을 더할까» 를 보여 주는 설명 그림이다.
 * ---------------------------------------------------------------- */

.figpk__wire {
  stroke: var(--color-text-sub);
  stroke-width: 3;
  stroke-linecap: round;
}

.figpk__board {
  fill: var(--led-uno);
  stroke: var(--color-text);
  stroke-width: 1.5;
}

.figpk__boardtext {
  font-size: 15px;
  font-weight: 800;
  fill: #ffffff;
  text-anchor: middle;
  font-family: var(--font-mono);
}

.figpk__res {
  fill: #f5e7cd;
  stroke: #a9863f;
  stroke-width: 1.5;
}

.figpk__zig {
  fill: none;
  stroke: var(--led-on-edge);
  stroke-width: 2;
  stroke-linejoin: round;
}

/* LED — 다이오드 기호. 화살표 방향이 «흐르는 쪽» 이다 */
.figpk__led {
  fill: var(--led-soft);
  stroke: var(--led-on);
  stroke-width: 2;
}

.figpk__ledbar {
  stroke: var(--led-on);
  stroke-width: 3;
  stroke-linecap: round;
}

.figpk__ray {
  stroke: var(--led-on);
  stroke-width: 2;
  stroke-linecap: round;
}

.figpk__partname {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figpk__sign {
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figpk__note {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* ── 「가까우면 켠다」 — 거리 축의 두 칸 ───────────────────────── */

.figpk__band {
  stroke: var(--color-border-strong);
  stroke-width: 1;
}

.figpk__band--near {
  fill: var(--led-soft);
}

.figpk__band--far {
  fill: var(--color-muted-bg);
}

.figpk__bandtext {
  font-size: 14px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figpk__edge {
  stroke: var(--color-primary);
  stroke-width: 2.4;
  stroke-dasharray: 6 4;
}

.figpk__edgetext {
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-primary-dark);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 켜진 등과 꺼진 등 — 색만으로 알리지 않는다. 안에 ▮ / ○ 를 함께 그린다 */
.figpk__lamp {
  fill: var(--color-muted-bg);
  stroke: var(--color-border-strong);
  stroke-width: 2;
}

.figpk__lamp--on {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
}

.figpk__lamptext {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figpk__lamp--on + .figpk__lamptext,
.figpk__lamptext {
  fill: var(--color-text);
}

.figpk__state {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* ── 소리의 높이 · 측정 범위 띠 ───────────────────────────────── */

.figrange__axis {
  stroke: var(--color-border-strong);
  stroke-width: 2;
}

.figrange__band {
  stroke: var(--color-border-strong);
  stroke-width: 1;
  opacity: 0.9;
}

.figrange__band--low {
  fill: #e5e7eb;
}

.figrange__band--hear {
  fill: var(--color-primary-soft);
}

.figrange__band--ultra {
  fill: #fde8c8;
}

.figrange__label {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
}

.figrange__tick {
  stroke: var(--color-text);
  stroke-width: 1.4;
}

/* ── 편도와 왕복 ─────────────────────────────────────────────── */

.figtrip__line {
  stroke: var(--color-text);
  stroke-width: 2;
}

.figtrip__cap {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
}

.figtrip__leg {
  stroke: var(--color-border-strong);
  stroke-width: 1;
}

.figtrip__leg--go {
  fill: var(--color-primary-soft);
}

.figtrip__leg--back {
  fill: #d7f0ec;
}

.figtrip__legtext {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
}

/* ── 거리 공식 토막 ──────────────────────────────────────────── */

.figform__box {
  fill: var(--color-surface);
  stroke: var(--color-primary);
  stroke-width: 2;
}

.figform__text {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  fill: var(--color-primary-dark);
  text-anchor: middle;
}

.figform__eq {
  font-size: 15px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
}

/* 「거리 =」 — 오른쪽 끝이 기준이다.
   ★ 가운데 맞춤(text-anchor: middle) 이면 글자 수가 바닐 때마다 오른끝이
     움직여 상자와 겹치는지 알 수 없다. end 로 맞추면 상자와의
     간겁이 늘 EQ_GAP 이다. */
.figform__eq--right {
  text-anchor: end;
}

/* 상자 둘을 함게 묶는 견새 — 배지 ③ 가 가리키는 «것» 이다 */
.figform__brace {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 1.8;
  stroke-linecap: round;
}

.figform__bracelabel {
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-primary-dark);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.figform__sample {
  font-family: var(--font-mono);
  font-size: 14px;
  fill: var(--color-text-sub);
  text-anchor: middle;
}

/* ══════════════════════════════════════════════════════════════════
   5단계 — 물체를 놓는 자리 (명세 6.5 첫 줄)

   ★ 물체는 슬라이더로도, «끌기» 로도, 화살표 키로도 옮길 수 있다(명세 11장).
   ══════════════════════════════════════════════════════════════════ */

.scene {
  margin: var(--space-3) 0;
  padding: var(--space-2);
  background: var(--color-muted-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
}

.scene__svg {
  display: block;
  width: 100%;
  min-width: 420px;
  height: auto;
}

.scene__ruler {
  stroke: var(--color-border-strong);
  stroke-width: 1.4;
  stroke-dasharray: 3 4;
}

.scene__span {
  stroke: var(--color-primary);
  stroke-width: 3;
}

.scene__spantext {
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-primary-dark);
  text-anchor: middle;
}

/* 물체 — 끌 수 있으므로 손잡이처럼 보이게 한다 */
.scene__wall {
  fill: var(--target-board);

/**

 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.

(function () {

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.

    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────

    autosaveKeyPrefix: "physical4-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)

    loopLimit: 12,

    teacherRefreshSeconds: 30

  function fixedUrl() {

  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

          id: rail.id + "-" + c,
          label: rail.where + " " + rail.label + " 레일",

          rail: rail.id,
          polarity: rail.polarity,
          x: colX(c),
          y: rail.y
        });
      }
    });

    /* 가운데 열 : A~E(위) 와 F~J(아래) */
    var upper = ["A", "B", "C", "D", "E"];
    var lower = ["F", "G", "H", "I", "J"];

    upper.forEach(function (r, i) {
      for (var c = 1; c <= COLS; c += 1) {
