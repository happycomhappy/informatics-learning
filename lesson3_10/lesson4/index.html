  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverCreatedAt: text(r.serverCreatedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        dangerEvents: Array.isArray(circuit.dangerEvents) ? circuit.dangerEvents : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        wiring: cleanWiring(circuit.wiring)
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        errors: Array.isArray(code.errors) ? code.errors : [],
        history: Array.isArray(code.history) ? code.history : [],
        mode: text(code.mode),
        trigPin: code.trigPin === null || code.trigPin === undefined ? null : num(code.trigPin),
        echoPin: code.echoPin === null || code.echoPin === undefined ? null : num(code.echoPin),
        trigMode: text(code.trigMode),
        echoMode: text(code.echoMode)
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        extension: experiment.extension || { tried: false, condition: "", parts: "", source: "" }
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 (명세 9장) */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    round2: round2,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    cleanWiring: cleanWiring,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();

    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {

        finish(
          new Error(
            "서버가 제때 답하지 않았습니다. 주소가 /exec 로 끝나는지, " +
              "Code.gs 를 고친 뒤 «새 배포» 로 다시 올렸는지 확인해 주세요."
          )
        );
      }, TIMEOUT_MS);

      root[name] = function (data) {
        finish(null, data);
      };

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name;
      script.onerror = function () {
        finish(
          new Error(
            "서버에 닿지 못했습니다. 주소가 맞는지, 배포에서 실행을 «나» · 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
          )
        );
      };
      document.head.appendChild(script);
    });
  }

  /**
   * 서버에 한 번 물어본다.
   *   base  : /exec 주소
   *   query : "action=list&key=…"
   *
   * fetch 를 먼저 해 보고, 막히면 JSONP 로 다시 간다.
   * 둘 다 실패하면 «왜 안 되는지» 를 담아 거절한다.
   */
  function askServer(base, query) {
    var url = base + (base.indexOf("?") === -1 ? "?" : "&") + query;
    var f = getFetch();

    var viaFetch = !f
      ? Promise.reject(new Error("이 브라우저에서는 불러올 수 없습니다."))
      : withTimeout(
          f(url, { method: "GET", redirect: "follow" }).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          }),
          TIMEOUT_MS,
          "서버가 제때 답하지 않았습니다."
        ).then(function (body) {
          try {
            return JSON.parse(body);
          } catch (e) {
            /* 로그인 화면 HTML 이 돌아온 경우다 — 배포 설정이 잘못되었다 */
            throw new Error(
              "서버가 JSON 을 주지 않았습니다. 배포에서 실행을 «나», 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
            );
          }
        });

    return viaFetch.catch(function (firstErr) {
      /* file:// 에서 열었거나 CORS 에 막힌 것이다 — <script> 로 다시 가 본다 */
      return jsonp(url).catch(function (secondErr) {
        throw new Error(secondErr && secondErr.message ? secondErr.message : firstErr.message);
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 담기                                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 제출 하나를 넣는다. 같은 학생의 제출이 이미 있으면 «늦게 낸 것» 만 남긴다.
   * 돌려주는 것 : 'added' | 'updated' | 'kept' | 'skipped'
   */
  function put(raw) {
    if (!PC.schema.isThisLesson(raw)) return "skipped";

    var next = PC.schema.normalizeSubmission(raw);
    if (!next.studentId && !next.studentName) return "skipped";

    var key = PC.schema.dedupeKey(next);
    for (var i = 0; i < submissions.length; i += 1) {
      if (PC.schema.dedupeKey(submissions[i]) !== key) continue;

      var oldAt = submissions[i].serverUpdatedAt || submissions[i].submittedAt || "";
      var newAt = next.serverUpdatedAt || next.submittedAt || "";
      if (newAt >= oldAt) {
        submissions[i] = next;
        return "updated";
      }
      return "kept";
    }
    submissions.push(next);
    return "added";
  }

  /** JSON 글 한 덩어리를 담는다. 배열이어도, 하나여도, {items:[...]} 여도 받는다. */
  function putText(text) {
    var result = { added: 0, updated: 0, kept: 0, skipped: 0, error: "" };
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      result.error = "JSON 형식이 아닙니다.";
      return result;
    }

    var list = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [data];
    list.forEach(function (item) {
      var how = put(item);
      result[how] += 1;
    });
    return result;
  }

  /** 파일 여러 개를 읽어 담는다 (명세 11장 «업로드한 JSON 여러 개») */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return Promise.resolve({ added: 0, updated: 0, kept: 0, skipped: 0, failed: [] });

    return Promise.all(
      files.map(function (file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({ name: file.name, text: String(reader.result || "") });
          };
          reader.onerror = function () {
            resolve({ name: file.name, text: null });
          };
          reader.readAsText(file, "utf-8");
        });
      })
    ).then(function (results) {
      var total = { added: 0, updated: 0, kept: 0, skipped: 0, failed: [] };
      results.forEach(function (r) {
        if (r.text === null) {
          total.failed.push(r.name + " (읽지 못함)");
          return;
        }
        var one = putText(r.text);
        if (one.error) {
          total.failed.push(r.name + " (" + one.error + ")");
          return;
        }
        total.added += one.added;
        total.updated += one.updated;
        total.kept += one.kept;
        total.skipped += one.skipped;
      });
      return total;
    });
  }

  /**
   * 서버(Apps Script)에서 제출 목록을 받아 온다.
   * 교사 열쇠는 화면에서 받아 그때그때 쓰고 저장하지 않는다.
   */
  function fetchFromServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query =
      "action=list&lessonId=" +
      encodeURIComponent(PC.LESSON_ID) +
      (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query)
      .then(function (data) {
        if (data && data.ok === false) {
          /* 서버가 «무엇이 잘못되었는지» 를 함께 보내면 그대로 붙여 준다.
             그러지 않으면 폴더 ID·권한·Drive API 중 무엇을 고쳐야 할지 알 수 없다. */
          var why = [data.message || "서버가 목록을 주지 않았습니다."];
          if (data.reason) why.push("(" + data.reason + ")");
          if (data.hint) why.push(data.hint);
          return { ok: false, message: why.join(" ") };
        }

        var list = Array.isArray(data) ? data : (data && data.items) || [];
        var count = { added: 0, updated: 0, kept: 0, skipped: 0 };
        list.forEach(function (item) {
          count[put(item)] += 1;
        });
        return {
          ok: true,
          count: count,
          total: list.length,
          /* 한 건도 없을 때 무엇을 켜야 하는지 알려 주려고 서버 안내를 그대로 들고 온다 */
          hint: (data && data.hint) || "",
          skipped: (data && data.skipped) || 0,
          truncated: data && data.truncated === true
        };
      })
      .catch(function (err) {
        return { ok: false, message: err && err.message ? err.message : "불러오지 못했습니다." };
      });
  }

  /**
   * 연결 확인 — 주소·열쇠·폴더·Drive API 가 준비되었는지 서버에 물어본다.
   * 목록을 불러오다 막혔을 때 «무엇이 빠졌는지» 를 먼저 짚어 보는 길이다.
   */
  function pingServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query = "action=ping" + (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query).catch(function (err) {
      return { ok: false, message: err && err.message ? err.message : "확인하지 못했습니다." };
    });
  }

  function all() {
    return submissions.slice();
  }

  function clearAll() {
    submissions = [];
  }

  function count() {
    return submissions.length;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 11장 1번)                                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 전체 요약.
   *   expected 는 «수업에 참여한 학생 수». 선생님이 넣으면 제출률을 낼 수 있다.
   */
  function summary(list, expected) {
    var rows = list || [];
    var total = rows.length;
    var scores = rows.map(function (r) {
      return r.assessment.score;
    });
    var passed = rows.filter(function (r) {
      return r.assessment.pass;
    }).length;

    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);

    /* 점수 분포 — 0,2,4,6,8,10 여섯 칸 */
    var buckets = [0, 2, 4, 6, 8, 10].map(function (v) {
      return {
        score: v,
        count: scores.filter(function (s) {
          return s === v;
        }).length
      };
    });

    var maxScore = (PC.ASSESS && PC.ASSESS.total) || 10;

    return {
      total: total,
      expected: Number(expected) || 0,
      submitRate: expected ? T.core.percent(total, Number(expected)) : 0,
      average: total ? Math.round((sum / total) * 10) / 10 : 0,
      /* 교사 화면 2장의 숫자 칸에 그대로 쓴다 */
      maxScore: maxScore,
      highest: total ? Math.max.apply(null, scores) : 0,
      lowest: total ? Math.min.apply(null, scores) : 0,
      perfect: scores.filter(function (v) {
        return v >= maxScore;
      }).length,
      passed: passed,
      failed: total - passed,
      passRate: T.core.percent(passed, total),
      buckets: buckets,
      circuitDone: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      codeDone: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length
    };
  }

  /**
   * 문항별 분석 (명세 11장 2번)
   *   정답률 · 선택지 분포 · 오답 TOP2 · 주관식 원문
   */
  function questionStats(list) {
    var rows = list || [];
    return PC.quiz.QUESTIONS.map(function (q, index) {
      var answered = [];
      var correct = 0;

      rows.forEach(function (r) {
        var found = null;
        (r.assessment.answers || []).forEach(function (a) {
          if (a && a.id === q.id) found = a;
        });
        var isRight = r.assessment.isCorrect[index] === true;
        if (isRight) correct += 1;
        answered.push({
          studentId: r.studentId,
          studentName: r.studentName,
          value: found ? found.value : null,
          correct: isRight
        });
      });

      var stat = {
        id: q.id,
        no: q.no,
        type: q.type,
        stem: q.stem,
        tag: q.tag,
        total: rows.length,
        correct: correct,
        rate: T.core.percent(correct, rows.length),
        distribution: [],
        worstChoices: [],
        texts: []
      };

      if (q.type === "choice") {
        stat.distribution = q.choices.map(function (label, i) {
          return {
            index: i,
            label: label,
            count: answered.filter(function (a) {
              return a.value === i;
            }).length
          };
        });

        /* 오답 TOP2 — 많이 고른 «틀린» 보기 둘 */
        var answerIndex = PC.quiz.recoverChoiceIndex(q);
        stat.answerIndex = answerIndex;
        stat.worstChoices = stat.distribution
          .filter(function (d) {
            return d.index !== answerIndex && d.count > 0;
          })
          .sort(function (a, b) {
            return b.count - a.count;
          })
          .slice(0, 2);
      } else {
        stat.texts = answered.map(function (a) {
          return {
            studentId: a.studentId,
            studentName: a.studentName,
            text: String(a.value || ""),
            correct: a.correct
          };
        });
      }

      return stat;
    });
  }

  /** 회로 수행 분석 (명세 11장 3번) */
  function circuitStats(list) {
    var rows = list || [];
    var errorCount = {};
    var dangerStudents = 0;

    rows.forEach(function (r) {
      var seen = {};
      (r.circuit.errors || []).forEach(function (e) {
        var code = e && e.code ? e.code : "unknown";
        errorCount[code] = (errorCount[code] || 0) + 1;
        seen[code] = true;
      });
      if (Object.keys(seen).length > 0) dangerStudents += 1;
    });

    /* 규칙 이름을 사람 말로 바꾼다 */
    var titleOf = {};
    PC.circuit.DANGER_RULES.forEach(function (rule) {
      titleOf[rule.code] = rule.title;
    });

    var frequent = Object.keys(errorCount)
      .map(function (code) {
        return { code: code, title: titleOf[code] || code, count: errorCount[code] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });

    var attempts = rows.map(function (r) {
      return r.circuit.attempts;
    });

    return {
      total: rows.length,
      completed: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      hintUsers: rows.filter(function (r) {
        return r.circuit.hintsUsed > 0;
      }).length,
      dangerStudents: dangerStudents,
      frequent: frequent
    };
  }

  /** 코드 수행 분석 (명세 9장 4번) */
  function codeStats(list) {
    var rows = list || [];
    return {
      total: rows.length,
      allPassed: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length,
      /* 명세 7장 — 문법 오류와 핀 불일치가 code.errors 한 배열에 함께 들어 있다.
         kind 로 갈라 세어야 «문법이 막힌 학생» 과 «핀이 어긋난 학생» 을 나눌 수 있다. */
      withSyntaxError: rows.filter(function (r) {
        return (r.code.errors || []).some(function (e) {
          return e && e.kind === "syntax";
        });
      }).length,
      withPinMismatch: rows.filter(function (r) {
        return (r.code.errors || []).some(function (e) {
          return e && e.kind === "t-pin-match";
        });
      }).length,
      modes: ["assemble", "blank", "edit"].map(function (mode) {
        return {
          mode: mode,
          count: rows.filter(function (r) {
            return r.code.mode === mode;
          }).length
        };
      })
    };
  }

  /**
   * 상위 3명 (명세 11장 마지막 줄)
   *   점수 → 회로 오류 적음 → 코드 테스트 통과 → 제출 시각(빠른 순)
   */
  function topThree(list) {
    return (list || [])
      .slice()
      .sort(function (a, b) {
        if (b.assessment.score !== a.assessment.score) return b.assessment.score - a.assessment.score;

        var aErr = (a.circuit.errors || []).length;
        var bErr = (b.circuit.errors || []).length;
        if (aErr !== bErr) return aErr - bErr;

        if (b.code.testsPassed !== a.code.testsPassed) return b.code.testsPassed - a.code.testsPassed;

        var at = a.serverUpdatedAt || a.submittedAt || "";
        var bt = b.serverUpdatedAt || b.submittedAt || "";
        return at < bt ? -1 : at > bt ? 1 : 0;
      })
      .slice(0, 3);
  }

  T.data = {
    pingServer: pingServer,
    put: put,
    putText: putText,
    readFiles: readFiles,
    fetchFromServer: fetchFromServer,
    all: all,
    clearAll: clearAll,
    count: count,
    summary: summary,
    questionStats: questionStats,
    circuitStats: circuitStats,
    codeStats: codeStats,
    topThree: topThree,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.data;
})();

/* ------------------------------------------------------------------
 * 학생 명단 파일 읽기 (교사용)

 *                  + DOMParser 로 sharedStrings.xml / sheet XML 파싱.
 *   .csv/.tsv/.txt 글자로 바로 읽는다.
 *
 * ★ 외부 라이브러리를 쓰지 않는다. lesson3_7_1 의 교사용과 같은 방법이다.
 *   고전 스크립트라서 file:// 에서도 열린다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ["학번", "학번호", "번호", "id", "studentid", "student_id", "학생번호"];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ["이름", "성명", "학생이름", "학생명", "name", "studentname", "student_name"];

  function norm(value) {
    return String(value === null || value === undefined ? "" : value)
      .trim()
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function has(list, value) {
    return list.indexOf(value) !== -1;

  /* ---------------------------------------------------------------- */
  /* ZIP (xlsx) 풀기                                                   */
  /* ---------------------------------------------------------------- */

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다 (주석이 붙어 있을 수 있다) */
  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;

  function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") {

      );

    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function (buf) {
      return new Uint8Array(buf);
    });

  /** xlsx(zip) 안에서 필요한 파일만 { 경로: 글 } 로 돌려준다 */
  function readZipEntries(buffer, wanted) {

    var eocd = findEocd(view);

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);

  /* ---------------------------------------------------------------- */

  /* ---------------------------------------------------------------- */

  function sheetToRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, "application/xml");
    var rows = [];

    Array.prototype.forEach.call(doc.getElementsByTagName("row"), function (rowEl) {
      var cells = [];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"), function (c) {
        var ref = c.getAttribute("r") || "";
        var type = c.getAttribute("t");
        var text = "";

        if (type === "s") {
          var v = c.getElementsByTagName("v")[0];
          var idx = v ? Number(v.textContent) : -1;
          text = shared[idx] === undefined ? "" : shared[idx];
        } else if (type === "inlineStr") {
          text = Array.prototype.map
            .call(c.getElementsByTagName("t"), function (t) {
              return t.textContent;
            })
            .join("");
        } else {
          var v2 = c.getElementsByTagName("v")[0];
          text = v2 ? v2.textContent : "";
        }

        cells[ref ? colIndex(ref) : cells.length] = String(text === null || text === undefined ? "" : text).trim();
      });
      rows.push(cells);
    });

    return rows;
  }

  function readXlsx(file) {
    return file
      .arrayBuffer()
      .then(function (buffer) {
        return readZipEntries(buffer, function (name) {
          return (
            name === "xl/sharedStrings.xml" ||
            name === "xl/workbook.xml" ||
            /^xl\/worksheets\/sheet\d+\.xml$/.test(name)
          );
        });
      })
      .then(function (entries) {
        /* 공유 문자열 */
        var shared = [];
        if (entries["xl/sharedStrings.xml"]) {
          var doc = new DOMParser().parseFromString(entries["xl/sharedStrings.xml"], "application/xml");
          Array.prototype.forEach.call(doc.getElementsByTagName("si"), function (si) {
            shared.push(
              Array.prototype.map
                .call(si.getElementsByTagName("t"), function (t) {
                  return t.textContent;
                })
                .join("")
            );
          });
        }

        /* 첫 번째 시트를 쓴다 */
        var sheetName = Object.keys(entries)
          .filter(function (n) {
            return /^xl\/worksheets\/sheet\d+\.xml$/.test(n);
          })
          .sort()[0];
        if (!sheetName) throw new Error("엑셀에서 시트를 찾지 못했어요.");

        return sheetToRows(entries[sheetName], shared);
      });
  }

  /* ---------------------------------------------------------------- */
  /* csv / tsv → 2차원 배열                                            */
  /* ---------------------------------------------------------------- */

  function splitDelimited(text) {
    var clean = String(text || "").replace(/^﻿/, "");
    var delimiter = clean.indexOf("\t") !== -1 && clean.indexOf(",") === -1 ? "\t" : ",";
    var rows = [];
    var row = [];
    var cell = "";
    var quoted = false;

    for (var i = 0; i < clean.length; i += 1) {
      var ch = clean[i];
      if (quoted) {
        if (ch === '"') {
          if (clean[i + 1] === '"') {
            cell += '"';
            i += 1;
          } else {
            quoted = false;
          }
        } else {
          cell += ch;
        }
        continue;
      }
      if (ch === '"') {
        quoted = true;
      } else if (ch === delimiter) {
        row.push(cell.trim());
        cell = "";
      } else if (ch === "\n") {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") {
        cell += ch;
      }
    }
    row.push(cell.trim());
    if (
      row.some(function (c) {
        return c !== "";
      })
    ) {
      rows.push(row);
    }
    return rows;
  }

  /* ---------------------------------------------------------------- */
  /* 행 배열 → 학생 명단                                                */
  /* ---------------------------------------------------------------- */

  function pickColumns(rows) {
    /* 앞쪽 다섯 줄 안에서 머리글을 찾는다 */
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && has(ID_HEADERS, v)) idCol = c;
        if (nameCol < 0 && has(NAME_HEADERS, v)) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    /* 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다 */
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /** 행 배열에서 { students, warnings, columns } 를 만든다 (파일 없이도 검사할 수 있게 따로 둔다) */
  function fromRows(rows) {
    var picked = pickColumns(rows || []);
    var students = [];
    var warnings = [];
    var seen = {};

    (rows || []).forEach(function (cells, r) {
      if (r <= picked.headerRow) return;

      var list = cells || [];
      var id = String(list[picked.idCol] === undefined ? "" : list[picked.idCol]).trim();
      var name = String(list[picked.nameCol] === undefined ? "" : list[picked.nameCol]).trim();
      if (!id && !name) return;

      /* 머리글을 못 찾았는데 첫 줄이 「학번/이름」 같은 글자면 건너뛴다 */
      if (picked.headerRow < 0 && r === 0 && (has(ID_HEADERS, norm(id)) || has(NAME_HEADERS, norm(name)))) {
        return;
      }
      if (!id) {
        warnings.push(r + 1 + "행: 학번이 비어 있어 건너뛰었어요. (" + (name || "이름 없음") + ")");
        return;
      }
      if (seen[id]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 썼어요.");
        return;
      }
      seen[id] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }

    return { students: students, warnings: warnings, columns: picked };
  }

  /** 명단 파일을 읽어 { students, warnings, columns } 를 돌려준다 */
  function parseFile(file) {
    var name = String((file && file.name) || "").toLowerCase();

    if (name.slice(-4) === ".xls") {
      return Promise.reject(
        new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.")
      );
    }

    var readRows = name.slice(-5) === ".xlsx" ? readXlsx(file) : file.text().then(splitDelimited);
    return readRows.then(fromRows);
  }

  /** 학번 비교용 표준형 — 앞의 0 과 공백·기호를 없앤다 */
  function normalizeId(value) {
    var raw = String(value === null || value === undefined ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  T.roster = {
    parseFile: parseFile,
    normalizeId: normalizeId,
    /* 아래 둘은 검사에서 쓴다 (파일 없이 판단만 확인한다) */
    fromRows: fromRows,
    splitDelimited: splitDelimited
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.roster;
})();

    <script data-from="teacher/t20-filter.js">
/**
 * 거르기·찾기·정렬 (명세 11장 «학번, 이름, 점수, 이수 여부로 검색·정렬·필터»)
 *
 * 화면 그리는 코드가 없다. 목록을 받아 목록을 돌려줄 뿐이라 테스트가 쉽다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 거르기 기준의 처음 값 */
  function emptyFilter() {
    return {
      keyword: "",
      grade: 0,
      classNumber: 0,
      pass: "all", /* all | pass | fail */
      circuit: "all", /* all | done | not */
      code: "all", /* all | done | not */
      sortBy: "studentId", /* studentId | name | score | time */
      sortDir: "asc" /* asc | desc */
    };
  }

  function norm(text) {
    return String(text || "").trim().toLowerCase().replace(/\s+/g, "");
  }

  /** 학번이나 이름에 찾는 말이 들어 있는가 */
  function matchKeyword(row, keyword) {
    var k = norm(keyword);
    if (!k) return true;
    return norm(row.studentId).indexOf(k) !== -1 || norm(row.studentName).indexOf(k) !== -1;
  }

  function apply(list, filter) {
    var f = Object.assign(emptyFilter(), filter || {});

    var rows = (list || []).filter(function (row) {
      if (!matchKeyword(row, f.keyword)) return false;
      if (f.grade && row.grade !== Number(f.grade)) return false;
      if (f.classNumber && row.classNumber !== Number(f.classNumber)) return false;

      if (f.pass === "pass" && !row.assessment.pass) return false;
      if (f.pass === "fail" && row.assessment.pass) return false;

      if (f.circuit === "done" && !row.circuit.completed) return false;
      if (f.circuit === "not" && row.circuit.completed) return false;

      var codeDone = row.code.testsTotal > 0 && row.code.testsPassed === row.code.testsTotal;
      if (f.code === "done" && !codeDone) return false;
      if (f.code === "not" && codeDone) return false;

      return true;
    });

    var dir = f.sortDir === "desc" ? -1 : 1;
    rows.sort(function (a, b) {
      var av;
      var bv;
      switch (f.sortBy) {
        case "name":
          av = a.studentName;
          bv = b.studentName;
          break;
        case "score":
          av = a.assessment.score;
          bv = b.assessment.score;
          break;
        case "time":
          av = a.serverUpdatedAt || a.submittedAt || "";
          bv = b.serverUpdatedAt || b.submittedAt || "";
          break;
        default:
          av = a.studentId;
          bv = b.studentId;
          break;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      /* 같으면 학번으로 한 번 더 — 순서가 들쭉날쭉하지 않게 */
      return a.studentId < b.studentId ? -1 : a.studentId > b.studentId ? 1 : 0;
    });

    return rows;
  }

  /** 목록에 실제로 있는 학년·반만 골라 준다 (거르기 칸을 채우는 데 쓴다) */
  function optionsOf(list) {
    var grades = {};
    var classes = {};
    (list || []).forEach(function (row) {
      if (row.grade) grades[row.grade] = true;
      if (row.classNumber) classes[row.classNumber] = true;
    });
    function nums(map) {
      return Object.keys(map)
        .map(Number)
        .sort(function (a, b) {
          return a - b;
        });
    }
    return { grades: nums(grades), classes: nums(classes) };
  }

  T.filter = {
    emptyFilter: emptyFilter,
    apply: apply,
    optionsOf: optionsOf,
    matchKeyword: matchKeyword
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.filter;
})();

    <script data-from="teacher/t30-views.js">
/**
 * 교사용 화면 조각 (명세 11장)
 *
 *   summary   전체 요약        (2장)
 *   podium    상위 3명 시상대   (2장)
 *   quiz      문항별 정답률     (3장)
 *   circuit   회로 수행        (4장)
 *   code      코드 수행        (4장)
 *   experiment 실험 기록       (4장)
 *
 * 하나하나 render(rows) 하나씩이고, rows 는 제출 목록이다.
 * 화면을 «장(page)» 으로 묶는 일은 t90-main.js 가 한다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  function section(title, children) {
    return el("section", { class: "t-block" }, [
      el("h3", { class: "t-block__title", text: title })
    ].concat(children || []));
  }

  /* ================================================================== */
  /* 전체 요약 (명세 11장 1번) — 2장                                      */
  /* ================================================================== */

  function renderSummary(rows, options) {
    var box = el("div");
    var o = options || {};
    var s = T.data.summary(rows, o.expected);

    if (rows.length === 0) {
      box.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box;
    }

    box.appendChild(
      K.statRow([
        K.statCard("제출 학생", s.total, "", "명"),
        K.statCard("평균 점수", s.average, "", "/ " + s.maxScore + "점"),
        K.statCard("최고 점수", s.highest, "", "점"),
        K.statCard("최저 점수", s.lowest, "", "점"),
        K.statCard("만점자", s.perfect, "", "명"),
        /* 이 차시는 6점 이상이 이수다 — 선생님이 가장 먼저 보는 숫자여서 함께 둔다 */
        K.statCard("이수", s.passed, "미이수 " + s.failed + "명 · " + s.passRate + "%", "명")
      ])
    );

    box.appendChild(
      el("p", {
        class: "panel__hint",
        text:
          "형성평가는 5문항 · 총 " + s.maxScore + "점이고 " + PC.ASSESS.passScore +
          "점 이상이면 이수입니다. 회로와 코드 수행은 4장의 표에서 볼 수 있습니다."
      })
    );

    return box;
  }

  /* ================================================================== */
  /* 상위 3명 시상대 (명세 11장 1번)                                       */
  /*                                                                    */
  /* 모양을 lesson3_7_1 교사용과 같게 맞추었다 — 메달·등수 딱지·칭찬 한 줄.   */
  /* ================================================================== */

  var MEDALS = ["🥇", "🥈", "🥉"];
  var RANK_TITLE = ["1등", "2등", "3등"];

  /** 무엇을 잘했는지 골라 칭찬한다. 점수만 말하면 남는 것이 없다. */
  function praiseFor(rank, row) {
    var score = row.assessment.score;
    var errors = (row.circuit.errors || []).length;
    var passed = row.code.testsPassed;
    var total = row.code.testsTotal || 6;

    if (score >= 10 && errors === 0) {
      return "형성평가 만점에 회로도 한 번의 위험한 연결 없이 마쳤어요. 오늘 배운 것을 모두 이해했습니다.";
    }
    if (errors === 0 && passed >= total) {
      return "회로와 코드를 모두 깔끔하게 마쳤어요. 다음 차시의 센서 활용도 잘할 수 있겠습니다.";
    }
    if (score >= 8) {
      return "핵심 개념을 잘 잡았어요. 틀린 문항의 해설만 한 번 더 읽으면 완벽합니다.";
    }
    if (rank === 1) {
      return "이번 시간 가장 높은 점수예요. 끝까지 해낸 것이 무엇보다 좋습니다.";
    }
    return "끝까지 해냈어요. 오늘 만든 회로와 코드가 다음 차시의 밑거름이 됩니다.";
  }

  function renderPodium(rows) {
    var box = el("div");
    var top = T.data.topThree(rows);

    box.appendChild(
      el("p", {
        class: "panel__hint",
        text: "점수 → 회로 오류가 적은 순 → 코드 검사 통과 → 제출이 빠른 순으로 뽑습니다."
      })
    );

    if (!top.length) {
      box.appendChild(el("p", { class: "t-empty", text: "표시할 학생이 없어요." }));
      return box;
    }

    box.appendChild(
      el("div", { class: "t-podium" }, top.map(function (r, i) {
        return el("article", { class: "t-card t-card--" + (i + 1) }, [
          el("div", {}, [
            el("span", { class: "t-card__medal", attrs: { "aria-hidden": "true" }, text: MEDALS[i] || "🎖" }),
            el("span", { class: "t-card__rank", text: RANK_TITLE[i] || i + 1 + "등" })
          ]),
          el("h3", { class: "t-card__name", text: r.studentName || "(이름 없음)" }),
          el("p", { class: "t-card__meta", text: "학번 " + (r.studentId || "-") }),
          el("p", { class: "t-card__score" }, [
            el("span", { text: String(r.assessment.score) }),

          ]),
          el("p", { class: "t-card__meta", text:
            "회로 오류 " + (r.circuit.errors || []).length + "회 · 코드 " +
            r.code.testsPassed + "/" + r.code.testsTotal + " · " +

    return box;
  }

  /* ================================================================== */
  /* 문항별 정답률 (명세 11장 2번) — 3장                                  */
  /* ================================================================== */

  function renderQuiz(rows) {

    /* 문항별 정답률 한눈에 */

      section(
        "문항별 정답률",
        stats.map(function (q) {
          return K.bar(q.no + "번 (" + q.tag + ")", q.correct, q.total, { strong: q.rate >= 70 });
        })
      )

    stats.forEach(function (q) {
      var parts = [
        el("p", { class: "t-stem", text: q.stem }),
        el("p", { class: "t-rate" }, [
          el("span", { class: "t-rate__num", text: q.rate + "%" }),
          el("span", { text: " 정답 (" + q.correct + " / " + q.total + "명)" })
        ])
      ];

      if (q.type === "choice") {
        var question = PC.quiz.byId(q.id);
        parts.push(
          el("ul", { class: "dist" }, q.distribution.map(function (d) {
            var isAnswer = d.index === q.answerIndex;
            return el("li", { class: "dist__item" + (isAnswer ? " dist__item--answer" : "") }, [
              el("span", { class: "dist__mark", attrs: { "aria-hidden": "true" }, text: isAnswer ? "정답" : "　" }),
              el("span", { class: "dist__no", text: "제" + (d.index + 1) + "번" }),
              el("span", { class: "dist__label", text: question.choices[d.index] }),
              el("span", { class: "dist__count", text: d.count + "명 (" + K.percent(d.count, q.total) + "%)" })
            ]);
          }))
        );

        if (q.worstChoices.length > 0) {
          parts.push(
            el("p", { class: "t-worst" }, [
              el("b", { text: "오답 TOP2 : " }),
              el("span", {
                text: q.worstChoices
                  .map(function (w) {
                    return "제" + (w.index + 1) + "번 (" + w.count + "명)";
                  })
                  .join(" · ")
              })
            ])
          );
        }
      } else {
        /* 주관식 원문 (명세 11장 2번) */
        parts.push(
          el("div", { class: "answers" }, q.texts.map(function (t) {
            return el("div", { class: "answers__row" + (t.correct ? " answers__row--ok" : "") }, [
              el("p", { class: "answers__who" }, [
                el("span", { attrs: { "aria-hidden": "true" }, text: t.correct ? "✔ " : "✘ " }),
                el("span", { text: t.studentId + " " + t.studentName }),

    return box;
  }

  /* ================================================================== */
  /* 3. 회로 수행 (명세 11장 3번)                                         */
  /* ================================================================== */

  function renderCircuit(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.circuitStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("회로 완성", s.completed + " / " + s.total + "명", K.percent(s.completed, s.total) + "%"),
        K.statCard("평균 시도", s.avgAttempts + "회", "케이블을 이은 횟수"),
        K.statCard("힌트 사용", s.hintUsers + "명"),
        K.statCard("위험 연결 발생", s.dangerStudents + "명", s.dangerStudents ? "아래 목록을 확인하세요" : "없음")
      ])
    );

    box.appendChild(
      section(
        "빈번한 오결선",
        s.frequent.length === 0
          ? [K.empty("위험한 연결을 만든 학생이 없습니다.")]
          : s.frequent.map(function (f) {
              return K.bar(f.title, f.count, s.total);
            })
      )
    );

    /* 학생별 회로 수행 */
    box.appendChild(
      section("학생별 회로", [
        el("div", { class: "t-tablewrap" }, [
          el("table", { class: "t-table" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { text: "학번" }),
                el("th", { text: "이름" }),
                el("th", { text: "완성" }),
                el("th", { text: "네 단자 판정" }),
                el("th", { text: "시도" }),
                el("th", { text: "힌트" }),
                el("th", { text: "위험 연결" }),
                el("th", { text: "연결 목록" })
              ])
            ]),
            el("tbody", {}, rows.map(function (r) {
              var errors = (r.circuit.errors || []).map(function (e) {
                return e.title || e.code;
              });
              var uniqueErrors = errors.filter(function (v, i) {
                return errors.indexOf(v) === i;
              });
              return el("tr", {}, [
                el("td", { text: r.studentId }),
                el("td", { text: r.studentName }),
                el("td", { class: r.circuit.completed ? "cell--ok" : "cell--no", text: r.circuit.completed ? "✔ 완성" : "✘ 미완성" }),
                el("td", { text: wiringText(r.circuit.wiring) }),
                el("td", { text: String(r.circuit.attempts) }),
                el("td", { text: String(r.circuit.hintsUsed) }),
                el("td", { text: uniqueErrors.length ? uniqueErrors.join(", ") : "—" }),
                el("td", { text: (r.circuit.connections || [])
                  .map(function (c) {
                    return PC.circuit.describe(c.fromComponent, c.fromPin) + "→" + PC.circuit.describe(c.toComponent, c.toPin);
                  })
                  .join(" / ") || "—" })
              ]);
            }))
          ])
        ])
      ])
    );

    return box;
  }

  /**
   * 제출에 담긴 «네 단자 판정» 을 한 줄로 (명세 9장 3번)
   *
   * ★ 여기가 이 차시 교사 화면의 알맹이다.
   *   «미완성» 한 마디로는 VCC·GND 를 거꾸로 꽂은 학생과 Trig·Echo 를 맞바꾼 학생을
   *   갈라낼 수 없다. 지도가 달라져야 하므로 화면에 나오는 말도 달라야 한다(명세 10장).
   */
  function wiringText(w) {
    if (!w) return "—";
    var parts = [];
    if (w.shortCircuit) parts.push("5V–GND 단락");
    if (w.powerReversed) parts.push("VCC·GND 역결선");
    if (w.signalSwapped) parts.push("Trig·Echo 맞바꿈");
    if (w.signalOnPower) parts.push("신호선 전원 직결");
    if (w.legsShorted) parts.push("단자 " + w.legsShorted + "쌍 붙음");
    parts.push("VCC " + (w.vccOk ? "O" : "X"));
    parts.push("GND " + (w.gndOk ? "O" : "X"));
    parts.push("Trig " + (w.trigOk ? "O" : "X"));
    parts.push("Echo " + (w.echoOk ? "O" : "X"));
    /* 신호선이 «엉뚱한 핀» 에 갔으면 그 핀 이름을 그대로 적는다 */
    if (!w.trigOk && (w.trigWired || []).length > 0) parts.push("Trig→" + w.trigWired.join("/"));
    if (!w.echoOk && (w.echoWired || []).length > 0) parts.push("Echo→" + w.echoWired.join("/"));
    return parts.join(" · ");
  }

  /**
   * 실험 한 줄을 한 마디로 — «거리 재기» 인가 «조건 바꾸기» 인가
   *
   * 명세 7장의 conditions 하나에 둘이 함께 담기므로 kind 로 갈라 읽는다.
   */
  function conditionText(c) {
    if (!c) return "—";
    var angle = PC.angleOf ? PC.angleOf(c.angle).label : c.angle;
    var material = PC.materialOf ? PC.materialOf(c.material).label : c.material;
    if (c.kind === "condition") return material + " · " + angle + " (" + c.distance + "cm)";
    return c.distance + "cm · " + material + " · " + angle;
  }

  /** 측정 결과를 한 마디로 */
  function resultText(c) {
    if (!c || !c.ran) return "—";
    if (!c.ok) return "측정 실패 (" + (c.reason || "?") + ")";
    return (
      "왕복 " + c.duration + "μs · 계산 " + c.measured + "cm · 오차 " +
      (c.error > 0 ? "+" : "") + c.error + "cm"
    );
  }

  /* ================================================================== */
  /* 4. 코드 수행 (명세 11장 4번)                                         */
  /* ================================================================== */

  var MODE_NAME = { assemble: "코드 조립", blank: "빈칸 채우기", edit: "전체 편집" };


  function renderCode(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.codeStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("검사 전부 통과", s.allPassed + " / " + s.total + "명", K.percent(s.allPassed, s.total) + "%"),
        K.statCard("문법 오류 남음", s.withSyntaxError + "명"),
        K.statCard("핀 불일치", s.withPinMismatch + "명")
      ])
    );

    box.appendChild(
      section(
        "마지막으로 쓴 방식",
        s.modes.map(function (m) {
          return K.bar(MODE_NAME[m.mode] || m.mode, m.count, s.total);
        })
      )
    );

    rows.forEach(function (r) {
      var problems = [];
      /* 명세 7장 — 문법 오류와 핀 불일치가 code.errors 한 배열에 함께 들어 있다 */
      (r.code.errors || []).forEach(function (e) {
        var head = e.kind === "syntax" ? "문법" : e.kind === "t-pin-match" ? "핀" : "검사";
        problems.push(
          el("p", {
            class: "t-problem",
            text: head + " " + (e.line ? e.line + "번 줄 — " : "") + e.message
          })
        );
      });
      /* 코드가 정한 핀과 모드 — 「Trig D8 / Echo D5 · OUTPUT / INPUT」 */
      if (r.code.trigPin !== null || r.code.echoPin !== null) {
        problems.push(
          el("p", {
            class: "t-meta",
            text:
              "코드가 정한 핀 — Trig " + (r.code.trigPin === null ? "?" : "D" + r.code.trigPin) +
              "(" + (r.code.trigMode || "?") + ") · Echo " +
              (r.code.echoPin === null ? "?" : "D" + r.code.echoPin) +
              "(" + (r.code.echoMode || "?") + ")"
          })
        );
      }

      box.appendChild(
        section(
          r.studentId + " " + r.studentName,
          [
            el("p", { class: "t-meta", text:
              "검사 " + r.code.testsPassed + " / " + r.code.testsTotal +
              " · 실행 " + r.code.attempts + "회 · 방식 " + (MODE_NAME[r.code.mode] || "—")
            }),
            K.codeBox(r.code.source)
          ].concat(problems)
        )
      );
    });

    return box;
  }

  /* ================================================================== */
  /* 5. 실험 기록 (명세 11장 5번)                                         */
  /* ================================================================== */

  function renderExperiment(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var EXP = (PC.lesson && PC.lesson.MEASURES) || [];
    var COND = (PC.lesson && PC.lesson.CONDITIONS) || [];

    /* 어느 거리까지 재었는가 — 10 → 20 → 30cm 차례대로 한다 */
    var ranCount = {};
    var extensionTried = 0;
    var failCount = 0;
    var runTotal = 0;
    rows.forEach(function (r) {
      (r.experiment.conditions || []).forEach(function (c) {
        if (!c.ran) return;
        ranCount[c.id] = (ranCount[c.id] || 0) + 1;
        if (c.kind !== "condition") {
          runTotal += 1;
          if (!c.ok) failCount += 1;
        }
      });
      if (r.experiment.extension && r.experiment.extension.tried) extensionTried += 1;
    });

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("측정 성공률", runTotal ? K.percent(runTotal - failCount, runTotal) + "%" : "—",
          runTotal ? runTotal - failCount + " / " + runTotal + "회" : "기록 없음"),
        K.statCard("주차 경고 구상까지", extensionTried + "명", K.percent(extensionTried, rows.length) + "%")
      ])
    );

    box.appendChild(
      section(
        "거리별 측정 인원 (통과 조건)",
        EXP.length === 0
          ? [K.empty("측정 자료가 없습니다.")]
          : EXP.map(function (item) {
              return K.bar(item.label, ranCount[item.id] || 0, rows.length);
            })
      )
    );

    box.appendChild(
      section(
        "조건 바꾸기 시도 인원 (통과 조건이 아님)",
        COND.length === 0
          ? [K.empty("조건 자료가 없습니다.")]
          : COND.map(function (item) {
              return K.bar(item.label, ranCount[item.id] || 0, rows.length);
            })
      )
    );

    rows.forEach(function (r) {
      var conditions = r.experiment.conditions || [];
      var observations = r.experiment.observations || [];
      var byId = {};
      observations.forEach(function (o) {
        byId[o.id] = o;
      });

      var parts = [];

      if (conditions.length === 0) {
        parts.push(K.empty("실험 기록이 없습니다."));
      } else {
        parts.push(
          el("div", { class: "t-tablewrap" }, [
            el("table", { class: "t-table" }, [
              el("thead", {}, [
                el("tr", {}, [
                  el("th", { text: "무엇" }),
                  el("th", { text: "조건" }),
                  el("th", { text: "결과" }),
                  el("th", { text: "재기 전 예상" }),
                  el("th", { text: "재고 나서 관찰" })
                ])
              ]),
              el("tbody", {}, conditions.map(function (c) {
                var note = byId[c.id] || {};
                return el("tr", {}, [
                  el("td", { text: c.label || c.id }),
                  el("td", { text: conditionText(c) }),
                  el("td", { class: c.ran && !c.ok ? "cell--no" : "", text: resultText(c) }),
                  el("td", {}, [K.longText(note.predict || "")]),
                  el("td", {}, [K.longText(note.observation || "")])
                ]);
              }))
            ])
          ])
        );
      }

      /* 확장 활동 — 주차 경고 장치 «구상» 이 알맹이다(명세 6.5 마지막 줄).
         코드까지 만든 학생은 그 코드도 함께 보여 준다. */
      var ext = r.experiment.extension || {};
      if (ext.tried) {
        parts.push(el("p", { class: "t-meta", text: "확장 활동 — 주차 경고 장치 구상" }));
        if (String(ext.condition || "").trim()) {
          parts.push(el("p", { class: "t-problem", text: "조건 : " + ext.condition }));
        }
        if (String(ext.parts || "").trim()) {
          parts.push(el("p", { class: "t-problem", text: "필요한 부품 : " + ext.parts }));
        }
        if (ext.testsTotal) {
          parts.push(
            el("p", {
              class: "t-meta",
              text: "확장 코드 확인 " + ext.testsPassed + " / " + ext.testsTotal
            })
          );
        }
        if (String(ext.source || "").trim()) parts.push(K.codeBox(ext.source));
      }

      box.appendChild(section(r.studentId + " " + r.studentName, parts));
    });

    return box;
  }

  T.views = {
    section: section,
    summary: renderSummary,
    podium: renderPodium,
    praiseFor: praiseFor,
    quiz: renderQuiz,
    circuit: renderCircuit,
    code: renderCode,
    experiment: renderExperiment,
    wiringText: wiringText,
    conditionText: conditionText,
    resultText: resultText,
    MODE_NAME: MODE_NAME
  };
})();
    </script>
    <script data-from="teacher/t35-wrong.js">
/* ------------------------------------------------------------------
 * 3장 — 가장 많이 틀린 문제 (단추를 누를 때마다 한 문제씩)
 *
 * 짜임새를 lesson3_7_1 의 교사용 3장과 «같게» 맞추었다.
 *   · 틀린 학생이 많은 순서로 최대 두 문제
 *   · 오답률 막대 + 보기별 고른 사람 수 + 정답 + 해설 + 「이렇게 복습해 보세요」
 *   · 두 문제를 모두 확인해야 다음 장으로 넘어갈 수 있다
 *
 * 한 문제씩 여는 까닭 — 다섯 문항을 한꺼번에 늘어놓으면 «무엇부터 짚어 줄지» 가 흐려진다.
 * 수업에서 실제로 다룰 수 있는 것은 한두 문항이다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 topWrong 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** 한 수업에서 짚어 줄 만한 문항 수 */
  var WRONG_LIMIT = 2;

  /**
   * 틀린 학생이 많은 순서로 문항을 고른다.
   * 아무도 틀리지 않은 문항은 넣지 않는다 — 짚어 줄 것이 없다.
   */
  function topWrong(rows) {
    var stats = T.data.questionStats(rows);
    return stats
      .map(function (stat) {
        var wrong = stat.total - stat.correct;
        return {
          stat: stat,
          wrong: wrong,
          wrongRate: K.percent(wrong, stat.total)
        };
      })
      .filter(function (item) {
        return item.wrong > 0;
      })
      .sort(function (a, b) {
        if (b.wrong !== a.wrong) return b.wrong - a.wrong;
        return a.stat.no - b.stat.no; /* 같으면 문항 번호 순 */
      })
      .slice(0, WRONG_LIMIT);
  }

  /** 오답 카드 한 장 */
  function wrongCard(item, order) {
    var stat = item.stat;
    var q = null;
    PC.quiz.QUESTIONS.forEach(function (one) {
      if (one.id === stat.id) q = one;
    });
    var note = null;
    (PC.TEACHER_NOTES.ANSWERS || []).forEach(function (a) {
      if (a.id === stat.id) note = a;
    });

    var card = el("div", { class: "t-wrong__card" });

    card.appendChild(el("span", { class: "t-wrong__rank", text: "오답 " + order + "위" }));
    card.appendChild(el("h3", { class: "t-wrong__title", text: "문항 " + stat.no + " · " + stat.tag }));
    card.appendChild(el("p", { class: "t-wrong__prompt", text: stat.stem }));

    /* 문항에 코드가 붙어 있으면 그대로 보여 준다 (4번 문항) */
    if (q && q.code) card.appendChild(K.codeBox(q.code));
    if (q && q.template) card.appendChild(K.codeBox(q.template));

    /* 오답률 막대 */
    card.appendChild(
      el("div", { class: "t-bar" }, [
        el("div", { class: "t-bar__fill", attrs: { style: "width:" + item.wrongRate + "%" } }),
        el("span", {
          class: "t-bar__label",
          text: stat.total + "명 중 " + item.wrong + "명이 틀렸어요 (" + item.wrongRate + "%)"
        })
      ])
    );

    /* 객관식 — 보기별로 몇 명이 골랐는가 */
    if (stat.type === "choice" && stat.distribution.length) {
      var answerIndex = typeof stat.answerIndex === "number" ? stat.answerIndex : -1;
      var maxWrong = 0;
      stat.distribution.forEach(function (d) {
        if (d.index !== answerIndex && d.count > maxWrong) maxWrong = d.count;
      });

      card.appendChild(
        el("div", { class: "t-options" }, stat.distribution.map(function (d) {
          var isAnswer = d.index === answerIndex;
          var isTopWrong = !isAnswer && d.count > 0 && d.count === maxWrong;
          return el("div", {
            class: "t-option" + (isAnswer ? " is-answer" : "") + (isTopWrong ? " is-top-wrong" : "")
          }, [
            el("span", { class: "t-option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[d.index] || String(d.index + 1) }),
            el("span", { class: "t-option__text", text: d.label + (isAnswer ? "  ← 정답" : "") }),
            el("span", { class: "t-option__count", text: d.count + "명" })
          ]);
        }))
      );
    }

    /* 완성형 — 학생들이 실제로 쓴 답을 몇 개 보여 준다 */
    if (stat.type === "code" && stat.texts.length) {
      var wrongTexts = stat.texts.filter(function (t) {
        return !t.correct;
      });
      card.appendChild(
        el("div", { class: "t-options" }, wrongTexts.slice(0, 5).map(function (t) {
          return el("div", { class: "t-option" }, [
            el("span", { class: "t-option__text" }, [K.codeBox(String(t.text || "(무응답)"))]),
            el("span", { class: "t-option__count", text: t.studentId || "" })
          ]);
        }))
      );
      if (wrongTexts.length > 5) {
        card.appendChild(
          el("p", { class: "panel__hint", text: "틀린 답 " + wrongTexts.length + "개 중 앞 5개만 보여 줍니다. 나머지는 6장 학생별 보기에서 확인하세요." })
        );
      }
    }

    /* 정답과 해설 */
    if (note) {
      card.appendChild(
        el("div", { class: "t-explain" }, [
          el("p", { class: "t-explain__label", text: "정답" }),
          el("p", {
            class: "t-answerline",
            text:
              stat.type === "choice" && note.answerIndex >= 0
                ? (CIRCLED[note.answerIndex] || "") + " " + note.answerText
                : note.answerText
          }),
          el("p", { class: "t-explain__label", text: "해설" }),
          el("p", { text: note.explanation })
        ])
      );
    }

    /* 이 문항과 이어지는 오개념 지도 — 있으면 복습 방법으로 붙인다 */
    var tip = teachTipFor(stat);
    if (tip) {
      card.appendChild(
        el("p", { class: "t-teach" }, [
          el("strong", { text: "💡 이렇게 복습해 보세요" }),
          el("span", { text: tip })
        ])
      );
    }

    return card;
  }

  /**
   * 문항에 맞는 «복습 방법» 을 오개념 자료에서 고른다.
   * 문항마다 손으로 짝지어 두지 않고 딱지(tag)로 잇는다 — 문항이 바뀌어도 따라온다.
   */
  var TAG_TO_MISCONCEPTION = {
    "개념": "m-loop",
    "입력·출력": "m-analog",
    "프로그램 구조": "m-loop",
    "프로그래밍": "m-loop",
    "완성형": "m-loop"
  };

  function teachTipFor(stat) {
    var wanted = TAG_TO_MISCONCEPTION[stat.tag];
    var found = null;
    (PC.TEACHER_NOTES.MISCONCEPTIONS || []).forEach(function (m) {
      if (m.id === wanted) found = m;
    });
    return found ? found.teach : "";
  }

  /**
   * 3장 본문을 만든다.
   *
   * @param rows    제출 목록
   * @param onSeen  문제를 하나 열 때마다 부른다. (본 개수, 전체 개수) — 다음 장 열기 판단에 쓴다
   */
  function render(rows, onSeen) {
    var box = el("div");
    var list = topWrong(rows);
    var index = -1;
    var seenAll = false;

    var progress = el("p", { class: "t-wrong__progress", attrs: { "aria-live": "polite" } });
    var body = el("div");

    function toStart() {
      index = -1;
      K.clear(body);
      btn.textContent = "가장 많이 틀린 문제 보기";
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
      K.announce("처음으로 돌아갔습니다.");
    }

    var btn = el("button", {
      class: "btn btn--primary",
      text: "가장 많이 틀린 문제 보기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!list.length) return;
          index += 1;

          /* 마지막까지 본 뒤 한 번 더 누르면 처음으로 돌아간다 */
          if (index >= list.length) {
            toStart();
            return;
          }

          /* 카드를 쌓지 않고 갈아 끼운다 — 한 번에 한 문제만 짚어 준다 */
          K.clear(body).appendChild(wrongCard(list[index], index + 1));

          var last = index === list.length - 1;
          btn.textContent = last ? "처음부터 다시 보기" : "다음 문제 보기";
          progress.textContent = index + 1 + " / " + list.length + " 문제 보는 중";
          K.announce("가장 많이 틀린 " + (index + 1) + "번째 문제, " + list[index].stat.no + "번 문항입니다.");

          if (last && !seenAll) {
            seenAll = true;
            K.toast("틀린 문제를 모두 확인했어요. 아래 「다음 →」 을 누르면 넘어갑니다.");
            if (onSeen) onSeen(list.length, list.length);
          }
        }
      }
    });

    if (!list.length) {
      btn.disabled = true;
      btn.title = "모든 학생이 다섯 문항을 맞혔어요.";
      progress.textContent = "🎉 틀린 문항이 없어요. 모두 잘 이해했습니다.";
      if (onSeen) onSeen(0, 0);
    } else {
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
    }

    box.appendChild(el("div", { class: "t-wrong__controls" }, [btn, progress]));
    box.appendChild(body);
    return box;
  }

  T.wrong = { render: render, topWrong: topWrong, WRONG_LIMIT: WRONG_LIMIT };
})();
    </script>
    <script data-from="teacher/t40-detail.js">
/**
 * 탭 6 — 학생별 보기 (명세 11장 6번)
 *
 * 왼쪽에서 학생을 고르면 오른쪽에 그 학생의 모든 것이 나온다.
 *   정오표 · 회로 연결 목록 · 코드 · 실험 기록 · 제출 이력
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;
  var selectedId = "";

  function keyOf(row) {
    return row.studentId + "|" + row.studentName;
  }

  function render(rows) {
    var box = el("div", { class: "detail" });
    if (rows.length === 0) {
      box.appendChild(K.empty("불러온 제출이 없습니다."));
      return box;
    }

    /* 고른 학생이 거르기에서 빠졌으면 첫 번째로 되돌린다 */
    var current = null;
    rows.forEach(function (r) {
      if (keyOf(r) === selectedId) current = r;
    });
    if (!current) {
      current = rows[0];
      selectedId = keyOf(current);
    }

    /* ----- 왼쪽 : 학생 목록 ----- */
    var list = el("ul", { class: "detail__list", attrs: { "aria-label": "학생 목록" } });
    rows.forEach(function (r) {
      var on = keyOf(r) === selectedId;
      list.appendChild(
        el("li", {}, [
          el("button", {
            class: "detail__pick" + (on ? " detail__pick--on" : ""),
            attrs: { type: "button", "aria-current": on ? "true" : null },
            on: {
              click: function () {
                selectedId = keyOf(r);
                T.main.refresh();
              }
            }
          }, [
            el("span", { class: "detail__who", text: r.studentId + " " + r.studentName }),
            el("span", {
              class: "detail__score" + (r.assessment.pass ? " detail__score--pass" : ""),
              text: r.assessment.score + "점"
            })
          ])
        ])
      );
    });

    /* ----- 오른쪽 : 고른 학생 ----- */
    var pane = el("div", { class: "detail__pane" });
    pane.appendChild(
      el("div", { class: "detail__head" }, [
        el("h3", { class: "detail__name", text: current.studentId + " " + current.studentName }),
        el("p", { class: "t-meta", text:
          PC.schema.describeStudentId(current.studentId) +
          " · 제출 " + K.fmtTime(current.serverUpdatedAt || current.submittedAt, true)
        })
      ])
    );

    /* 정오표 */
    var marks = el("div", { class: "t-tablewrap" }, [
      el("table", { class: "t-table" }, [
        el("thead", {}, [
          el("tr", {}, [
            el("th", { text: "문항" }),
            el("th", { text: "학생 답" }),
            el("th", { text: "정오" })
          ])
        ]),
        el("tbody", {}, PC.quiz.QUESTIONS.map(function (q, i) {
          var found = null;
          (current.assessment.answers || []).forEach(function (a) {
            if (a && a.id === q.id) found = a;
          });
          var correct = current.assessment.isCorrect[i] === true;
          var shown = "(답하지 않음)";
          if (found && found.value !== null && found.value !== undefined && found.value !== "") {
            shown = q.type === "choice" ? "제" + (Number(found.value) + 1) + "번" : String(found.value);
          }
          return el("tr", {}, [
            el("td", { text: q.no + "번 (" + q.tag + ")" }),
            el("td", {}, [q.type === "choice" ? el("span", { text: shown }) : K.codeBox(shown)]),
            el("td", { class: correct ? "cell--ok" : "cell--no", text: correct ? "✔ 맞음" : "✘ 틀림" })
          ]);
        }))
      ])
    ]);

    pane.appendChild(
      T.views.section("정오표 — " + current.assessment.score + " / " + current.assessment.total + "점 · " +
        (current.assessment.pass ? "이수" : "미이수"), [marks])
    );

    /* 회로 연결 목록 */
    var conns = current.circuit.connections || [];
    pane.appendChild(
      T.views.section("회로 연결", [
        el("p", { class: "t-meta", text:
          (current.circuit.completed ? "✔ 완성" : "✘ 미완성") +
          " · 시도 " + current.circuit.attempts + "회 · 힌트 " + current.circuit.hintsUsed + "회 · 전원 " +
          (current.circuit.powerOn ? "켬" : "안 켬")
        }),
        conns.length === 0
          ? K.empty("이은 케이블이 없습니다.")
          : el("ul", { class: "connlist" }, conns.map(function (c) {
              return el("li", {
                text:
                  PC.circuit.describe(c.fromComponent, c.fromPin) +
                  "  →  " +
                  PC.circuit.describe(c.toComponent, c.toPin)
              });
            })),
        (current.circuit.errors || []).length === 0
          ? null
          : el("div", {}, [
              el("p", { class: "t-problem", text: "위험 연결 기록 " + current.circuit.errors.length + "회" }),
              el("ul", { class: "connlist" }, current.circuit.errors.map(function (e) {
                return el("li", { text: (e.title || e.code) + " · " + K.fmtTime(e.at, true) });
              }))
            ])
      ])
    );

    /* 코드와 수정 이력 */
    pane.appendChild(
      T.views.section("코드", [
        el("p", { class: "t-meta", text:
          "검사 " + current.code.testsPassed + " / " + current.code.testsTotal +
          " · 실행 " + current.code.attempts + "회 · 방식 " + (T.views.MODE_NAME[current.code.mode] || "—")
        }),
        K.codeBox(current.code.source),
        /* 명세 7장 — 문법 오류와 핀 불일치가 code.errors 한 배열에 함께 들어 있다 */
        (current.code.errors || []).length === 0
          ? null
          : el("div", {}, current.code.errors.map(function (e) {
              var head = e.kind === "syntax" ? "문법" : e.kind === "t-pin-match" ? "핀" : "검사";
              return el("p", { class: "t-problem", text: head + " " + e.message });
            }))
      ])
    );

    /* 측정 기록 — 예상 · 결과 · 관찰 (명세 9장 6번) */
    var conditions = current.experiment.conditions || [];
    var notes = {};
    (current.experiment.observations || []).forEach(function (o) {
      if (o && o.id) notes[o.id] = o;
    });
    pane.appendChild(
      T.views.section("측정 기록", [
        conditions.length === 0
          ? K.empty("측정 기록이 없습니다.")
          : el("ul", { class: "connlist" }, conditions.map(function (c) {
              var note = notes[c.id] || {};
              return el("li", {}, [
                el("b", { text: (c.label || c.id) + " (" + T.views.conditionText(c) + ") — " }),
                el("span", { text: T.views.resultText(c) }),
                el("br", {}),
                el("span", { text: "관찰 : " + (note.observation || "(관찰을 적지 않음)") })
              ]);
            }))
      ])
    );

    /* 확장 활동 — 주차 경고 장치 구상 (명세 6.5 마지막 줄) */
    var ext = current.experiment.extension || {};
    if (ext.tried) {
      var extParts = [];
      if (String(ext.condition || "").trim()) {
        extParts.push(el("p", { class: "t-problem", text: "조건 : " + ext.condition }));
      }
      if (String(ext.parts || "").trim()) {
        extParts.push(el("p", { class: "t-problem", text: "필요한 부품 : " + ext.parts }));
      }
      if (String(ext.source || "").trim()) extParts.push(K.codeBox(ext.source));
      if (extParts.length === 0) extParts.push(K.empty("아직 적은 것이 없습니다."));
      pane.appendChild(T.views.section("주차 경고 장치 구상", extParts));
    }

    box.appendChild(el("div", { class: "detail__side" }, [list]));
    box.appendChild(pane);
    return box;
  }

  T.detail = {
    render: render,
    select: function (id) {
      selectedId = id;
    },
    selected: function () {
      return selectedId;
    }
  };
})();
    </script>
    <script data-from="teacher/t45-list.js">
/* ------------------------------------------------------------------
 * 5장 — 전체 명단 · 정오표
 *
 * 짜임새를 lesson3_7_1 의 교사용 4장과 «같게» 맞추었다.
 *   · 📎 학생 명단 올리기 (.xlsx / .csv) → 제출하지 않은 학생까지 표에 나온다
 *   · 📋 전체 명단 · 정오표 — 점수 + 문항별 O / X / -
 *   · 🖨 인쇄 · CSV 내려받기
 *
 * 명단을 올려야 «누가 안 냈는지» 를 알 수 있다. 낸 사람만 세면 빠진 학생이 보이지 않는다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 buildRows·marksOf·csvRows 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  /* 정오 표시 — 색만으로 알리지 않는다. 글자가 뜻을 진다. */
  var MARK = { correct: "O", wrong: "X", none: "-" };
  var MARK_CLASS = { correct: "is-o", wrong: "is-x", none: "is-none" };
  var MARK_LABEL = { correct: "정답", wrong: "오답", none: "무응답" };

  /** 올린 명단 — { students, warnings } 또는 null */
  var roster = null;

  function setRoster(next) {
    roster = next;
  }

  function getRoster() {
    return roster;
  }

  /**
   * 표에 넣을 줄을 만든다.
   * 명단이 있으면 «명단 순서» 대로 놓고, 명단에 없는 제출은 뒤에 붙인다.
   */
  function buildRows(list) {
    var rows = [];
    var byId = {};
    var norm = T.roster ? T.roster.normalizeId : function (v) {
      return String(v || "");
    };

    (list || []).forEach(function (r) {
      byId[norm(r.studentId)] = r;
    });

    if (roster) {
      var used = {};
      roster.students.forEach(function (s) {
        var key = norm(s.id);
        var found = byId[key] || null;
        if (found) used[key] = true;
        rows.push({
          studentId: s.id,
          name: s.name || (found ? found.studentName : ""),
          data: found,
          submitted: !!found,
          inRoster: true
        });
      });
      /* 명단에 없는 학번으로 낸 학생도 빠뜨리지 않는다 */
      (list || []).forEach(function (r) {
        if (used[norm(r.studentId)]) return;
        rows.push({
          studentId: r.studentId,
          name: r.studentName,
          data: r,
          submitted: true,
          inRoster: false
        });
      });
      return rows;
    }

    (list || []).forEach(function (r) {
      rows.push({
        studentId: r.studentId,
        name: r.studentName,
        data: r,
        submitted: true,
        inRoster: true
      });
    });
    return rows;
  }

  /** 한 학생의 문항별 정오를 { q1: "correct", … } 로 */
  function marksOf(row) {
    var out = {};
    if (!row.submitted || !row.data) return out;
    PC.quiz.QUESTIONS.forEach(function (q, i) {
      var flag = row.data.assessment.isCorrect[i];
      var answer = null;
      (row.data.assessment.answers || []).forEach(function (a) {
        if (a && a.id === q.id) answer = a;
      });
      var empty = !answer || answer.value === null || answer.value === undefined || answer.value === "";
      out[q.id] = flag === true ? "correct" : empty ? "none" : "wrong";
    });
    return out;
  }

  /* ---------------------------------------------------------------- */
  /* 명단 올리기                                                        */
  /* ---------------------------------------------------------------- */

  /** 읽어만 두고 아직 반영하지 않은 명단 */
  var pending = null;

  function buildRosterUpload(onChange) {
    var box = K.panel({
      title: "📎 학생 명단 올리기",
      hint: "엑셀(.xlsx) 또는 CSV 파일을 올리면 제출하지 않은 학생까지 함께 표시돼요.",
      className: "t-roster-src no-print"
    });

    var status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });

    function say(kind, message) {
      status.className = "t-status" + (kind ? " is-" + kind : "");
      status.textContent = message;
    }

    var fileInput = el("input", {
      class: "sr-only",
      id: "t-roster-file",
      attrs: {
        type: "file",
        accept: ".xlsx,.csv,.tsv,.txt",
        "aria-label": "학생 명단 파일 고르기"
      }
    });

    var applyBtn = el("button", {
      class: "btn btn--primary",
      text: "\u2705 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!pending) {
            say("error", "먼저 학생 명단 파일을 올려 주세요.");
            return;
          }
          setRoster(pending);
          pending = null;
          if (onChange) onChange();
          K.announce("전체 정오표를 표시했습니다.");
        }
      }
    });

    var clearBtn = el("button", {
      class: "btn btn--ghost",
      text: "명단 지우기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setRoster(null);
          pending = null;
          fileInput.value = "";
          if (onChange) onChange();
        }
      }
    });

    function load(file) {
      if (!file) return;
      say("loading", "명단을 읽고 있어요…");
      T.roster.parseFile(file).then(
        function (result) {
          pending = result;
          var message = "명단 " + result.students.length + "명을 읽었어요. [\u2705 확인] 을 누르면 정오표를 만듭니다.";
          if (result.warnings.length) message += " (건너뛴 줄 " + result.warnings.length + "개)";
          say("", message);
          applyBtn.disabled = false;
          clearBtn.disabled = false;
        },
        function (err) {
          pending = null;
          applyBtn.disabled = true;
          say("error", err && err.message ? err.message : "명단을 읽지 못했어요.");
        }
      );
    }

    fileInput.addEventListener("change", function () {
      load(fileInput.files && fileInput.files[0]);
    });

    var pick = el("button", {
      class: "btn btn--ghost",
      text: "명단 파일 선택",
      attrs: { type: "button" },
      on: {
        click: function () {
          fileInput.click();
        }
      }
    });

    /* 처음 상태 — 이미 반영된 명단이 있으면 그 사실을 알려 준다 */
    if (roster) {
      say("ok", "명단 " + roster.students.length + "명과 제출 답안을 맞춰 전체 정오표를 만들었어요.");
    } else {
      say("", "명단을 올리면 미제출 학생까지 확인할 수 있어요.");
    }
    applyBtn.disabled = !pending;
    clearBtn.disabled = !roster && !pending;

    var drop = el("div", {
      class: "t-drop",
      text: "또는 명단 파일을 이곳에 끌어다 놓으세요. (.xlsx · .csv)"
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var file = (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) || null;
      load(file);
    });

    box.body.appendChild(el("div", { class: "t-source__row" }, [pick, applyBtn, clearBtn, fileInput]));
    box.body.appendChild(status);
    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", { text: "첫 줄에 「학번」·「이름」 머리글이 있으면 자동으로 찾아요. 머리글이 없으면 첫 번째 열을 학번, 두 번째 열을 이름으로 읽습니다." })
    );
    hints.appendChild(
      el("li", { text: "엑셀이 열리지 않으면 「다른 이름으로 저장 \u2192 CSV UTF-8」 로 저장해 올려 주세요." })
    );
    box.body.appendChild(hints);

    if (roster && roster.warnings.length) {
      var warn = el("div", { class: "t-warn" });
      warn.appendChild(el("p", { text: "건너뛴 줄이 있어요." }));
      var ul = el("ul", { class: "t-hint-list" });
      roster.warnings.slice(0, 5).forEach(function (line) {
        ul.appendChild(el("li", { text: line }));
      });
      warn.appendChild(ul);
      box.body.appendChild(warn);
    }

    return box.root;
  }

  /* ---------------------------------------------------------------- */
  /* 전체 명단 · 정오표                                                  */
  /* ---------------------------------------------------------------- */

  function buildTable(list) {
    var box = K.panel({
      title: "📋 전체 명단 · 정오표",
      hint: "제출한 학생은 점수와 문항별 정오(O · X)를, 제출하지 않은 학생은 「미제출」 로 표시해요."
    });

    var rows = buildRows(list);

    if (!rows.length) {
      box.body.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box.root;
    }

    var inRoster = roster
      ? rows.filter(function (r) {
          return r.inRoster;
        })
      : rows;
    var submitted = inRoster.filter(function (r) {
      return r.submitted;
    }).length;
    var missing = inRoster.length - submitted;
    var extra = roster ? rows.length - inRoster.length : 0;

    var cards = [
      K.statCard(roster ? "명단 인원" : "제출 학생", roster ? roster.students.length : rows.length, "", "명"),
      K.statCard("제출", submitted, "", "명"),
      K.statCard("미제출", missing, "", "명")
    ];
    if (extra) cards.push(K.statCard("명단 밖 제출", extra, "", "명"));
    box.body.appendChild(K.statRow(cards));

    if (!roster) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint no-print",
          text: "학생 명단을 올리면 명단 순서대로, 명단에 있는 학생이 빠짐없이 표시돼요."
        })
      );
    }
    if (extra) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint",
          text: "명단에 없는 학번으로 낸 학생이 " + extra + "명 있어요. 표 아래쪽에 함께 두었습니다."
        })
      );
    }

    /* 표 */
    var head = el("tr", {}, [
      el("th", { attrs: { scope: "col" }, text: "학번" }),
      el("th", { attrs: { scope: "col" }, text: "이름" }),
      el("th", { attrs: { scope: "col" }, text: "점수" })
    ].concat(
      PC.quiz.QUESTIONS.map(function (q) {
        return el("th", { attrs: { scope: "col" }, text: q.no + "번" });
      })
    ).concat([
      el("th", { attrs: { scope: "col" }, text: "회로" }),
      el("th", { attrs: { scope: "col" }, text: "코드" })
    ]));

      if (!row.submitted) {
        return el("tr", { class: "is-missing" }, [
          el("td", { text: row.studentId || "-" }),
          el("td", { text: row.name || "-" }),
          el("td", {
            class: "t-missing",
            text: "미제출",
            attrs: { colspan: String(3 + PC.quiz.QUESTIONS.length) }
          })
        ]);
      }

      var marks = marksOf(row);
      var d = row.data;
      return el("tr", {}, [
        el("td", { text: row.studentId || "-" }),
        el("td", { text: row.name || "-" }),
        el("td", { class: "t-score", text: d.assessment.score + "점" })
      ].concat(
        PC.quiz.QUESTIONS.map(function (q) {
          var mark = marks[q.id] || "none";
          return el("td", {
            class: "t-mark " + (MARK_CLASS[mark] || "is-none"),
            text: MARK[mark] || "-",
            attrs: { "aria-label": q.no + "번 " + (MARK_LABEL[mark] || "무응답") }
          });
        })
      ).concat([
        el("td", {
          class: "t-mark " + (d.circuit.completed ? "is-o" : "is-x"),
          text: d.circuit.completed ? "O" : "X",
          attrs: { "aria-label": d.circuit.completed ? "회로 완성" : "회로 미완성" }
        }),
        el("td", {
          class: "t-mark " + (d.code.testsPassed >= d.code.testsTotal && d.code.testsTotal > 0 ? "is-o" : "is-x"),
          text: d.code.testsPassed + "/" + d.code.testsTotal
        })
      ]));
    });

    box.body.appendChild(
      el("div", { class: "t-table-wrap" }, [
        el("table", { class: "t-list-table" }, [
          el("thead", {}, [head]),
          el("tbody", {}, body)
        ])
      ])
    );
    box.body.appendChild(
      el("p", { class: "panel__hint", text: "O 정답 · X 오답 · - 무응답 · 코드 칸은 통과한 검사 수입니다." })
    );

    /* 인쇄 · 내려받기 */
    box.body.appendChild(
      K.btnRow([
        el("button", {
          class: "btn btn--primary",
          text: "🖨 이 표 인쇄하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              if (T.main && T.main.stampPrintDate) T.main.stampPrintDate();
              window.print();
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost",
          text: "CSV 로 내려받기",
          attrs: { type: "button" },
          on: {
            click: function () {
              downloadCsv(rows);
            }
          }
        })
      ])
    );
    box.body.appendChild(
      el("p", {
        class: "panel__hint no-print",
        text: "출력 날짜는 첫 장 위쪽에 한 번만 찍혀요. 인쇄 창에서 「머리글/바닥글」 을 끄면 브라우저가 장마다 넣는 날짜·주소가 사라집니다."
      })
    );

    return box.root;
  }

  /** 정오표를 CSV 로 (엑셀이 한글을 깨뜨리지 않게 BOM 을 붙인다 — t60-csv 와 같은 방식) */
  function csvRows(rows) {
    var header = ["학번", "이름", "점수", "이수"];
    PC.quiz.QUESTIONS.forEach(function (q) {
      header.push(q.no + "번");
    });
    header.push("회로완성", "코드통과", "제출여부");

    var out = [header];
    (rows || []).forEach(function (row) {
      if (!row.submitted) {
        var blank = [row.studentId, row.name, "", ""];
        PC.quiz.QUESTIONS.forEach(function () {
          blank.push("");
        });
        blank.push("", "", "미제출");
        out.push(blank);
        return;
      }
      var marks = marksOf(row);
      var d = row.data;
      var line = [row.studentId, row.name, d.assessment.score, d.assessment.pass ? "이수" : "미이수"];
      PC.quiz.QUESTIONS.forEach(function (q) {
        line.push(MARK[marks[q.id] || "none"] || "-");
      });
      line.push(d.circuit.completed ? "완성" : "미완성", d.code.testsPassed + "/" + d.code.testsTotal, "제출");
      out.push(line);
    });
    return out;
  }

  function downloadCsv(rows) {
    var ok = T.csv.download(csvRows(rows), "정오표");
    K.toast(ok ? "CSV 파일로 저장했어요." : "이 브라우저에서는 내려받기를 쓸 수 없습니다.");
  }

  /** 5장 본문 전체 */
  function render(list, onChange) {
    var box = el("div", { class: "stack" });
    box.appendChild(buildRosterUpload(onChange));
    box.appendChild(buildTable(list));
    return box;
  }

  T.list = {
    render: render,
    buildRows: buildRows,
    marksOf: marksOf,
    csvRows: csvRows,
    setRoster: setRoster,
    getRoster: getRoster
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.list;
})();

    <script data-from="teacher/t50-guide.js">
