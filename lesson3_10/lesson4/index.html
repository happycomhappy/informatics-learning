            })
          );
          g.appendChild(
            UI.svg("text", { x: (b.from + b.to) / 2, y: y + 5, class: "figrange__label" }, [txt(b.label)])
          );
        });

        [
          { x: 110, text: D_MIN + "cm" },
          { x: 400, text: D_MAX + "cm" }
        ].forEach(function (t) {
          g.appendChild(UI.svg("line", { x1: t.x, y1: y - 24, x2: t.x, y2: y + 24, class: "figrange__tick" }));
          g.appendChild(UI.svg("text", { x: t.x, y: y - 32, class: "fig__minitext" }, [txt(t.text)]));
        });

        g.appendChild(leader(78, y + 26, 78, y + 20));
        g.appendChild(badge(1, 78, y + 40));
        g.appendChild(leader(255, y + 26, 255, y + 20));
        g.appendChild(badge(2, 255, y + 40));
        g.appendChild(leader(437, y + 26, 437, y + 20));
        g.appendChild(badge(3, 437, y + 40));
        g.appendChild(leader(180, 158, 190, 146));
        g.appendChild(badge(4, 168, 166));
      }
    });
  }

  /** 카드 id → 그림. 없는 카드는 글만 둔다. */
  /**
   * 확장 활동 ① — 무엇을 «더하는가»
   *
   * ★ 센서 회로를 다시 그리지 않는다. 학생이 3단계에서 이미 이었고,
   *   여기서 알아야 하는 것은 «무엇을 새로 더하는가» 하나다.
   *   전체를 다시 그리면 «회로를 처음부터 다시 만들어야 하나» 로 읽힌다.
   *

    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  /* ★ pulseIn·delayMicroseconds 가 이 차시에서 늘었다(명세 4장).
     빠뜨리면 이 차시의 «주인공» 두 줄만 색이 없어 눈에 덜 들어온다. */
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "delayMicroseconds", "pulseIn", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    /* ★★ «opts.notes» 를 넘기면 줄마다 설명을 «옆에» 적는다.
     *
     * 본래는 「줄마다 무슨 뜻일까」 를 접어 둔 다른 목록으로 보여 줬다.
     * 그러면 학생이 코드와 설명을 번갈아 보면서 «지금 몇 째 줄이지» 를
     * 세어야 하는다. 옆에 적으면 줄과 설명이 한 눈에 짝짓는다(지적 2026-08-22).
     *
     * ★ notes 는 [{ no, text }] 다. «줄 번호» 로 짝짓는다 — 차례로 짝짓지 않는다.
     *   무단으로 짝지으면 notes 하나가 빠질 때 아랫 설명이 모두 한 줄씩 밀려
     *   엉뚱한 줄을 가리킨다.
     *
     * ★ 빈 줄에도 설명이 있다(「빈 줄이다 …」). 그것까지 적으면 그림이 어수선해지므로
     *   여기서는 «코드가 있는 줄» 만 적는다.
     */
    var noteOf = {};
    (o.notes || []).forEach(function (n) {
      if (n && n.no && String(n.text || "").trim()) noteOf[n.no] = n.text;
    });
    var annotated = Object.keys(noteOf).length > 0;

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var kids = [no, lineNode(line)];
      if (noteOf[i + 1] && String(line).trim()) {
        kids.push(UI.el("span", { class: "codeline__note", text: noteOf[i + 1] }));
      }
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, kids);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" + (annotated ? " codeview--annotated" : "") }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 (① 코드 조립)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 흩어진 줄을 «위·아래» 로 옮겨 바른 차례로 만든다.
   * 끌어 놓기(drag) 대신 단추를 쓴다 — 키보드와 터치에서 모두 확실하게 동작한다(명세 13장).
   */
  function assembler(order, onChange) {
    var lines = A.ASSEMBLE_LINES;
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */
    var current = (order && order.length === lines.length ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });

    /** 지금 차례를 코드 글로 — 들여쓰기는 정답 줄에 적힌 대로 넣어 준다 */
    function sourceOf() {
      return current
        .map(function (id) {
          var line = byId[id];
          return "  ".repeat(line.indent) + line.text;
        })
        .join("\n");
    }

    /**
     * ★★ 알리는 차례는 «(만들어진 코드, 곁들이는 값)» 이다.
     *
     *   assembler 는 (source, order), blanks 는 (source, values) —
     *   둘의 «첫 자리» 가 늘 코드다. 이 파일 안에서 차례가 서로 달랐던 적이 있고,
     *   부르는 곳에서 뒤집어 받아 «적은 값» 자리에 코드 글이 들어간 일이 났다.
     *   그때는 검사가 통째로 실패하는데 까닭이 보이지 않아 한참 헤맸다.
     *   그래서 둘을 같은 차례로 맞추었다. 고칠 때도 이 차례를 지킨다.
     */
    function tell() {
      if (onChange) onChange(sourceOf(), current.slice());
    }

    /* ------------------------------------------------------------------ */
    /* 차례 바꾸기 — ▲▼ 단추 (키보드·낭독기가 쓰는 길)                       */
    /* ------------------------------------------------------------------ */

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      tell();
      UI.announce((index + 1) + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;
      if (btn) btn.focus();
    }

    /* ------------------------------------------------------------------ */
    /* 차례 바꾸기 — 끌어 옮기기 (마우스·손가락이 쓰는 길)                    */
    /*                                                                    */
    /* ★ 포인터 이벤트 하나로 «마우스와 터치» 를 함께 받는다.                */
    /*   HTML5 draggable 은 손가락으로는 동작하지 않아 교실 태블릿에서 못 쓴다. */
    /*                                                                    */
    /* ★ 끄는 곳을 «손잡이(⠿)» 로 한정한다.                                */
    /*   줄 아무 데나 잡히게 하면 손가락으로 화면을 세로로 넘길 수 없다.      */
    /*                                                                    */
    /* ★ ▲▼ 단추를 «그대로 둔다».                                          */
    /*   끌어 옮기기는 키보드로 할 수 없다. 두 길이 모두 있어야 한다(명세 13장). */
    /* ------------------------------------------------------------------ */

    var drag = null;

    function itemsNow() {
      return Array.prototype.slice.call(listHost.querySelectorAll(".assemble__item"));
    }

    /** 지금 화면에 놓인 차례를 그대로 읽어 current 로 삼는다 */
    function readOrderFromDom() {
      current = itemsNow().map(function (el) {
        return el.getAttribute("data-id");
      });
    }

    /**
     * ★★ 끌고 있는 동안 «어디에 놓이는가» 를 보여 준다.
     *
     *   전에는 줄을 곧바로 insertBefore 로 옮겼다. 그런데 끌고 있는 줄이
     *   손가락을 따라오지 않으니, 화면이 조금씩 바뀌어도 «내가 어디로 가는지»
     *   를 알 수 없었다. 실제로 「옮겨지는 자리를 판단할 수 없다」는 말을 들었다.
     *
     *   그래서 둘로 갈랐다.
     *     ① 끌고 있는 줄  — 자리에서 떼어 내(position: fixed) 손가락을 따라간다
     *     ② 놓일 자리     — 같은 높이의 «점선 칸» 이 목록 안에서 움직이며
     *                      「3번째 자리」 처럼 몇 번째가 될지 적는다
     *
     *   놓는 순간 ①을 ②가 있던 자리에 끼워 넣는다.
     */
    function dragMove(ev) {
      if (!drag) return;
      /* 손가락으로 끌 때 화면이 함께 밀리지 않게 한다 */
      if (ev.cancelable) ev.preventDefault();

      /* ① 끌고 있는 줄은 손가락을 따라간다 */
      drag.item.style.top = ev.clientY - drag.grabY + "px";

      /* ② 놓일 자리를 옮긴다 — 가운데를 지난 줄 «앞» 으로 */
      var y = ev.clientY;
      var others = itemsNow().filter(function (el) {
        return el !== drag.item;
      });
      var before = null;
      for (var i = 0; i < others.length; i += 1) {
        var r = others[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) {
          before = others[i];
          break;
        }
      }
      if (before) listHost.insertBefore(drag.slot, before);
      else listHost.appendChild(drag.slot);

      /* 몇 번째가 되는지 칸 안에 적는다 — 이것이 «어디로 가는가» 의 답이다 */
      var flow = Array.prototype.slice.call(listHost.children).filter(function (el) {
        return el !== drag.item;
      });
      drag.slot.textContent = flow.indexOf(drag.slot) + 1 + "번째 자리";
    }

    function dragEnd() {
      if (!drag) return;
      var item = drag.item;
      var slot = drag.slot;
      var fromIndex = drag.from;

      try {
        item.releasePointerCapture(drag.pointerId);
      } catch (err) {
        /* 이미 놓인 포인터면 그냥 넘어간다 */
      }

      /* 점선 칸이 있던 «그 자리» 에 줄을 끼워 넣는다 */
      listHost.insertBefore(item, slot);
      listHost.removeChild(slot);

      item.removeAttribute("style");
      item.classList.remove("assemble__item--dragging");
      listHost.classList.remove("assemble--dragging");
      root.removeEventListener("pointermove", dragMove);
      root.removeEventListener("pointerup", dragEnd);
      root.removeEventListener("pointercancel", dragEnd);
      drag = null;

      readOrderFromDom();
      var toIndex = itemsNow().indexOf(item);
      draw();
      tell();

      if (toIndex !== fromIndex) {
        UI.announce(fromIndex + 1 + "번째 줄을 " + (toIndex + 1) + "번째로 옮겼습니다.");
      }
      /* 놓은 뒤에도 그 줄에 초점을 두어, 이어서 ▲▼ 로 다듬을 수 있게 한다 */
      var landed = listHost.querySelectorAll(".assemble__item")[toIndex];
      var handle = landed ? landed.querySelector(".assemble__grip") : null;
      if (handle) handle.focus();
    }

    function dragStart(ev, item, index) {
      /* 왼쪽 단추(또는 손가락)만 받는다 */
      if (ev.button !== undefined && ev.button !== 0) return;
      if (ev.cancelable) ev.preventDefault();

      var rect = item.getBoundingClientRect();

      /* 놓일 자리 — 끌고 있는 줄과 «같은 높이» 라야 목록이 출렁이지 않는다 */
      var slot = UI.el("li", {
        class: "assemble__slot",
        attrs: { "aria-hidden": "true" },
        text: index + 1 + "번째 자리"
      });
      slot.style.height = rect.height + "px";
      listHost.insertBefore(slot, item);

      /* 끌고 있는 줄 — 자리에서 떼어 내 손가락을 따라가게 한다 */
      item.style.position = "fixed";
      item.style.left = rect.left + "px";
      item.style.top = rect.top + "px";
      item.style.width = rect.width + "px";
      item.style.margin = "0";
      item.style.zIndex = "60";

      drag = {
        item: item,
        slot: slot,
        from: index,
        pointerId: ev.pointerId,
        grabY: ev.clientY - rect.top
      };
      item.classList.add("assemble__item--dragging");
      listHost.classList.add("assemble--dragging");
      try {
        item.setPointerCapture(ev.pointerId);
      } catch (err) {
        /* 포인터 잡기를 못 해도 문서에 붙인 듣는 이로 따라간다 */
      }
      root.addEventListener("pointermove", dragMove, { passive: false });
      root.addEventListener("pointerup", dragEnd);
      root.addEventListener("pointercancel", dragEnd);
    }

    /* ------------------------------------------------------------------ */

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];

        /* 손잡이 — 끌어 옮기는 자리. 낭독기에는 «무엇을 옮기는지» 를 알린다. */
        var grip = UI.el("span", {
          class: "assemble__grip",
          text: "⠿",
          attrs: {
            role: "button",
            tabindex: "-1",
            "aria-label": line.text + " — 끌어서 차례 옮기기",
            title: "끌어서 옮기기"
          }
        });

        var item = UI.el("li", { class: "assemble__item", attrs: { "data-id": id } }, [
          grip,
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);

        grip.addEventListener("pointerdown", function (ev) {
          dragStart(ev, item, index);
        });

        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        listHost.appendChild(item);
      });
    }

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", {
          class: "assemble__help",
          text: "⠿ 를 끌어 옮기거나, ▲ ▼ 단추로 줄의 차례를 바로잡으세요."
        }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      /**
       * ★★ «다 맞았는가» 를 줄 번호로 세지 «않는다».
       *
       *   이 차시의 조립 줄에는 같은 글이 두 번 나온다 —
       *   `digitalWrite(trigPin, LOW);` (펄스 앞과 뒤) 와 `}` (setup 과 loop).
       *   줄 번호로 세면 그 둘을 맞바꿔 놓았을 때 «프로그램은 똑같은데» 틀렸다고 하게 된다.
       *
       *   그래서 «만들어진 코드» 를 기준 코드와 맞대어 본다. 빈 줄과 줄 끝 공백만 봐준다.
       */
      isSolved: function () {
        function norm(text) {
          return String(text || "")
            .split("\n")
            .map(function (line) {
              return line.replace(/\s+$/, "");
            })
            .filter(function (line) {
              return line.trim().length > 0;
            })
            .join("\n");
        }
        return norm(sourceOf()) === norm(A.REFERENCE_CODE);
      }
    };
  }


  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 빈칸 채우기 판.
   *
   * ★ template 을 받는다 — 4단계는 A.BLANK_TEMPLATE, 5단계 확장 활동은
   *   A.WARNING_TEMPLATE(주차 경고 장치) 을 준다. 안 주면 4단계 판을 쓴다.
   *
   * ★ line.step 이 있으면 «몇 번째 차례의 빈칸인가» 를 딱지로 붙인다.
   *   차례 목록과 빈칸이 떨어져 있어도 어느 줄을 말하는지 알 수 있다.
   *
   * ★★ 알리는 차례는 assembler 와 «같다» — (만들어진 코드, 적은 값).
   *   첫 자리가 늘 코드다. assembler().tell() 의 머리말도 함께 본다.
   */
  function blanks(values, onChange, template) {
    var tpl = template || A.BLANK_TEMPLATE;
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    tpl.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: {
            type: "text",
            /* ★ 힌트는 «위» 에 따로 적는다 — placeholder 는 줄바꿈이 안 되어
               좁은 화면에서 뒷글자가 잘린다. 여기에는 짧은 안내만 둔다. */
            placeholder: "여기에 코드를 적으세요",
            spellcheck: "false",
            autocapitalize: "off"
          }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        /**
         * ★ 힌트를 «보이는 이름표» 로 둔다.
         *
         *   placeholder 로 두었더니 「speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄」
         *   의 뒷글자가 잘렸다. placeholder 는 한 줄로만 그려져 줄바꿈이 안 되기 때문이다.
         *   글씨를 줄이면 넓은 화면에서는 들어가지만 좁은 화면에서는 여전히 잘린다.
         *   이름표로 올리면 «어느 폭에서든» 줄이 접히며 다 보인다.
         */
        var row = UI.el("div", { class: "blanks__row" }, [
          UI.el("label", { class: "blanks__hint", attrs: { for: id } }, [
            line.step
              ? UI.el("span", { class: "blanks__step", attrs: { "aria-hidden": "true" }, text: line.step })
              : null,
            UI.el("span", { class: "blanks__hinttext", text: line.hint })
          ]),
          input
        ]);
        /* 들여쓰기를 코드와 맞춘다 — 빈칸이 «그 자리» 에 있는 것처럼 보이게 */
        if (line.indent) row.style.paddingLeft = line.indent * 2 + "ch";
        host.appendChild(row);
        return;
      }

      host.appendChild(
        UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
          UI.el("code", { class: "blanks__fixed" }, [lineNode(line.text)])
        ])
      );
    });

    function sourceOf() {
      return tpl.lines
        .map(function (line) {
          if (!line.blank) return line.text;
          var typed = String(current[line.blank] || "").trim();
          return "  ".repeat(line.indent || 0) + typed;
        })
        .join("\n");
    }

    return {
      root: host,
      getSource: sourceOf,
      getValues: function () {
        return current;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — 파형·소리·«누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(400) 이면 0.4초를 기다린다. 그래야 음과 음 사이가 실제 보드처럼 갈라지고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다.
     *
     *     1배속   delay 값 그대로 (delay(400) → 0.4초)
     *     0.5배속 두 배 천천히 — 음이 갈라지는 사이를 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

  var D_MIN = PC.DIST_MIN === undefined ? 2 : PC.DIST_MIN;
  var D_MAX = PC.DIST_MAX === undefined ? 400 : PC.DIST_MAX;

  /**
   * 4단계에서 loop() 를 몇 바퀴 돌려 보는가.

   */
  var RUN_LOOPS = 10;

  /** ①②③ 이 붙은 구역 제목 */

  }

  /**
   * 물체가 놓인 모습 — 센서와 물체, 그리고 그 사이의 거리.
   *
   * ★ 5단계에서 물체를 «끌어» 옮길 수 있다(명세 6.5 첫 줄).
   *   슬라이더와 끌기가 «같은 값» 을 본다. 어느 쪽으로 바꾸어도 같게 움직인다.
   */
  function makeScene(opts) {
    var o = opts || {};
    var W = 600;
    var H = 200;
    var X0 = 96; /* 센서의 앞면 */
    var X1 = 540; /* 가장 먼 자리 */
    var Y = 96;

    var svgNode = UI.svg("svg", {
      viewBox: "0 0 " + W + " " + H,
      class: "scene__svg",
      role: "img",
      "aria-label": "센서 앞에 놓인 물체와 그 거리"
    });

    /** 거리(cm) → 화면의 x. 가까운 쪽을 넓게 보이도록 제곱근으로 펼친다. */
    function xOf(cm) {
      var t = Math.sqrt(Math.max(0, (Number(cm) - D_MIN) / (D_MAX - D_MIN)));
      return X0 + t * (X1 - X0);
    }

    /** 화면의 x → 거리(cm). 끌기에서 쓴다. */
    function cmOf(x) {
      var t = Math.min(1, Math.max(0, (x - X0) / (X1 - X0)));
      return Math.round(D_MIN + t * t * (D_MAX - D_MIN));
    }

    var ruler = UI.svg("line", { x1: X0, y1: Y + 46, x2: X1, y2: Y + 46, class: "scene__ruler" });
    var span = UI.svg("line", { x1: X0, y1: Y + 46, x2: X0, y2: Y + 46, class: "scene__span" });
    var spanText = UI.svg("text", { x: X0, y: Y + 68, class: "scene__spantext" }, []);
    var wall = UI.svg("rect", { x: X0, y: Y - 40, width: 18, height: 80, rx: 3, class: "scene__wall" });
    var wallText = UI.svg("text", { x: X0, y: Y - 52, class: "scene__walltext" }, []);
    var beam = UI.svg("path", { d: "", class: "scene__beam" });
    var stateText = UI.svg("text", { x: W / 2, y: 24, class: "scene__state" }, []);

    /* 센서 — 왼쪽에 고정 */
    var sensor = UI.svg("g", { class: "scene__sensor" }, [
      UI.svg("rect", { x: 24, y: Y - 34, width: 66, height: 68, rx: 5, class: "figson__pcb" }),
      UI.svg("circle", { cx: 44, cy: Y, r: 15, class: "figson__horn" }),
      UI.svg("circle", { cx: 70, cy: Y, r: 15, class: "figson__horn" }),
      UI.svg("text", { x: 44, y: Y + 5, class: "figson__hornlabel" }, [document.createTextNode("T")]),
      UI.svg("text", { x: 70, y: Y + 5, class: "figson__hornlabel" }, [document.createTextNode("R")]),
      UI.svg("text", { x: 57, y: Y + 54, class: "fig__minitext" }, [document.createTextNode("센서")])
    ]);

    svgNode.appendChild(sensor);
    svgNode.appendChild(beam);
    svgNode.appendChild(ruler);
    svgNode.appendChild(span);
    svgNode.appendChild(spanText);
    svgNode.appendChild(wall);
    svgNode.appendChild(wallText);

    var current = o.distance || PC.DIST_DEFAULT || 20;
    var angleId = o.angle || PC.DEFAULT_ANGLE || "front";

    var note = "";

    function paint() {
      var x = xOf(current);
      var ang = PC.angleOf(angleId);
      var mat = PC.materialOf(materialId);

      wall.setAttribute("x", x);
      /* 비스듬한 물체는 기울여 그린다 — 각도를 «색» 이 아니라 모양으로 알린다 */

      wall.setAttribute("class", "scene__wall scene__wall--" + materialId);
      UI.clear(wallText).appendChild(document.createTextNode(mat.label + " · " + ang.label));
      wallText.setAttribute("x", x + 9);

      span.setAttribute("x2", x);
      spanText.setAttribute("x", (X0 + x) / 2);
      UI.clear(spanText).appendChild(document.createTextNode(current + " cm"));

      var level = A.echoLevel(current, angleId, materialId);
      var strong = level >= (PC.ECHO_FAIL_LEVEL === undefined ? 0.18 : PC.ECHO_FAIL_LEVEL);
      beam.setAttribute(
        "d",
        "M 88 " + (Y - 10) + " L " + x + " " + (Y - 10) + " M " + x + " " + (Y + 10) + " L 88 " + (Y + 10)
      );
      beam.setAttribute("class", "scene__beam" + (strong ? "" : " scene__beam--weak"));

      UI.clear(stateText).appendChild(
        document.createTextNode(
          note ||
            "되돌아오는 신호 " + Math.round(level * 100) + "% — " +

        )
      );
      stateText.setAttribute("class", "scene__state" + (strong ? "" : " scene__state--bad"));
    }

    /* 끌어 옮기기 — 마우스와 손가락을 함께 받는다(포인터 이벤트 하나로) */
    if (o.onDrag) {
      var dragging = false;
      function toCm(evt) {
        var box = svgNode.getBoundingClientRect();
        if (!box.width) return current;
        return cmOf(((evt.clientX - box.left) / box.width) * W);
      }
      function move(evt) {
        if (!dragging) return;
        evt.preventDefault();

        evt.preventDefault();
        current = next;
        paint();
        o.onDrag(next);
      });

      get: function () {
        return current;

  }

  /**

   *   지식이 아니라 «이야기를 제대로 읽었는가» 이므로 첫 화면에 두어도 된다.

  function renderIntro(state, app) {
    var hero = L.HERO;

        ]),

    /* 학습 순서 */
    box.appendChild(

    /* ---------------- 문제 상황 (명세 6.1 첫 줄) ---------------- */

    box.appendChild(
      UI.card({ eyebrow: "문제 상황", title: story.title }, [
        el("p", { class: "para", text: story.story }),
        el("p", { class: "para para--ask", text: story.ask }),
        el(
          "ol",
          { class: "steplist" },
          story.steps.map(function (s) {
            return el("li", { class: "steplist__item" }, [
              el("span", {
                class: "steplist__marker",
                attrs: { "aria-hidden": "true" },
                text: s.marker
              }),
              el("span", { class: "steplist__text", text: s.text })
            ]);
          })
        ),
        UI.alert("info", story.conclusion)
      ])
    );

    /* ---------------- 확인 질문 (통과 조건) ---------------- */

    var checkOut = el("div", { class: "feedback" });
    var checkCard = UI.card(
      {
        eyebrow: "확인 질문",
        title: quiz.question,
        desc: "위 이야기를 떠올리며 골라 보세요. 틀려도 바로 다시 고를 수 있습니다."
      },
      [
        UI.choiceGroup(
          { name: "intro-check", choices: quiz.choices },
          state.intro.checkChoice,
          function (index) {
            var right = index === quiz.answerIndex;
            app.update(function (s) {
              s.intro.checkChoice = index;
              s.intro.checkAnswered = right;
            });
            UI.toast(right ? "맞았습니다." : "다시 한 번 생각해 보세요.");
          }
        ),
        checkOut
      ]
    );
    if (state.intro.checkChoice !== null && state.intro.checkChoice !== undefined) {
      checkOut.appendChild(
        UI.alert(state.intro.checkAnswered ? "ok" : "warn", state.intro.checkAnswered ? quiz.right : quiz.wrong)
      );
    }
    box.appendChild(checkCard);

    /* ---------------- 안전 수칙 ---------------- */

    var safetyId = UI.nextId("safety");
    var safetyBox = el("input", { class: "check__input", id: safetyId, attrs: { type: "checkbox" } });
    safetyBox.checked = state.intro.safetyRead === true;
    safetyBox.addEventListener("change", function () {
      app.update(function (s) {
        s.intro.safetyRead = safetyBox.checked;
      });
    });

    box.appendChild(
      el("section", { class: "safety-card", attrs: { "aria-labelledby": "safety-title" } }, [
        el("h2", { class: "safety-card__title", id: "safety-title" }, [
          el("span", { attrs: { "aria-hidden": "true" }, text: "⚠" }),
          el("span", { text: "안전 수칙" })
        ]),
        el("p", { class: "safety-card__desc", text: story.safetyLead }),
        el(
          "ul",
          { class: "safety" },
          PC.SAFETY.map(function (line) {
            return el("li", { class: "safety__item" }, [
              el("span", { class: "safety__mark", attrs: { "aria-hidden": "true" }, text: "!" }),
              el("span", { text: line })
            ]);
          })
        ),
        el("div", { class: "check" }, [
          safetyBox,
          el("label", {
            class: "check__label",
            attrs: { for: safetyId },
            text: "안전 수칙을 읽고 지키겠습니다."
          })
        ])
      ])
    );

    box.appendChild(el("p", { class: "hero__time", text: hero.time }));

    var ready = PC.schema.checkStep("intro", state).ok;
    box.appendChild(
      el("div", { class: "hero__cta" }, [
        UI.button("학습 시작", {
          class: "btn btn--primary btn--lg",
          disabled: !ready,
          attrs: { "aria-label": "학습 시작. 2단계 원리 이해 화면으로 이동합니다." },
          click: function () {
            app.goTo(1);
          }
        })
      ])
    );
    if (!ready) {
      box.appendChild(
        el("p", {
          class: "hero__ctanote",
          text: "확인 질문에 바르게 답하고 안전 수칙을 확인하면 학습을 시작할 수 있어요."
        })
      );
    }

    box.appendChild(el("div", { class: "hero__feedback" }, [UI.alert("info", hero.tip)]));

    return box;
  }

  /* ================================================================== */
  /* 2단계 — 원리 이해                                                   */
  /* ================================================================== */

  /**
   * 함수 설명 상자 — «적는 꼴» 을 그대로 보여 준다.
   *
   * 2단계 «원리 이해» 와 4단계 «예시 읽기» 가 같은 것을 쓴다.
   * 4단계에서는 예시 코드 옆에 나란히 놓아 코드를 읽으며 함수 뜻을 바로 볼 수 있게 한다.
   */
  function functionCards() {
    var card = null;
    L.CONCEPT_CARDS.forEach(function (c) {
      if (c.id === "functions") card = c;
    });
    if (!card) return el("div");

    return el(
      "div",
      { class: "fncards" },
      (card.functions || []).map(function (f) {
        return el("div", { class: "fncard" }, [
          el("div", { class: "fncard__head" }, [el("code", { class: "fncard__name", text: f.name })]),
          el(
            "div",
            { class: "fncard__forms" },
            (f.forms || []).map(function (form) {
              return el("pre", { class: "fncard__form" }, [el("code", { text: form })]);
            })
          ),
          el("p", { class: "fncard__what", text: f.what })
        ]);
      })
    );
  }

  /**
   * 거리 슬라이더 — 예상 왕복 시간을 함께 보인다 (명세 6.2 세 번째 줄).
   *
   * ★ 슬라이더를 움직이면 «시간이 함께 바뀌는 것» 이 보여야 한다.
   *   숫자만 바뀌면 정비례가 눈에 들어오지 않으므로 막대도 함께 늘어난다.
   */
  function distanceLab(state, app) {
    var lab = L.DISTANCE_LAB;
    var value = state.concept.labDistance || PC.DIST_DEFAULT || 20;

    var slider = el("input", {
      class: "slider",
      id: "distlab-range",
      attrs: {
        type: "range",
        min: String(D_MIN),
        max: String(D_MAX),
        step: "1",
        "aria-describedby": "distlab-out"
      }
    });
    slider.value = String(value);

    var out = el("p", { class: "distlab__out", id: "distlab-out", attrs: { role: "status" } });
    var bar = el("span", { class: "distlab__fill" });
    var barBox = el("div", { class: "distlab__bar" }, [bar]);
    var calc = el("p", { class: "distlab__calc" });

    function paint(cm) {
      var us = Math.round(PC.durationOf(cm));
      out.textContent = cm + "cm → 예상 왕복 시간 약 " + us + "μs (" + Math.round(us / 100) / 10 + "ms)";
      bar.setAttribute("style", "width:" + ((us / PC.durationOf(D_MAX)) * 100).toFixed(2) + "%");
      calc.textContent = "2 × " + cm + " ÷ " + SPEED + " ≈ " + us;
    }
    paint(value);

    slider.addEventListener("input", function () {
      var cm = Number(slider.value);
      paint(cm);
      app.patch(function (s) {
        s.concept.labDistance = cm;
      });
    });

    var presets = el(
      "div",
      { class: "btnrow" },
      [el("span", { class: "btnrow__label", text: "눌러 보기" })].concat(
        lab.presets.map(function (p) {
          return UI.button(p.label, {
            class: "btn btn--ghost btn--small",
            click: function () {
              slider.value = String(p.cm);
              paint(p.cm);
              app.patch(function (s) {
                s.concept.labDistance = p.cm;
              });
            }
          });
        })
      )
    );

    /* 20cm 이 1176μs 가 되는 «과정» — 명세 6.2 마지막 줄 */
    var walk = lab.walkthrough;
    var walkBox = el("div", { class: "calcsteps" }, [
      el("p", { class: "calcsteps__head", text: walk.distance + "cm 일 때 — 단위와 함께 따라가 봅시다" }),
      el(
        "ol",
        { class: "calcsteps__list" },
        walk.steps.map(function (s) {
          return el("li", { class: "calcsteps__item" }, [
            el("span", { class: "calcsteps__what", text: s.text }),
            el("code", { class: "calcsteps__value", text: s.value })
          ]);
        })
      ),
      el("p", { class: "calcsteps__foot", text: walk.conclusion })
    ]);

    return UI.card({ eyebrow: "직접 바꾸어 보기", title: lab.title, desc: lab.intro }, [
      el("p", { class: "formula", text: lab.formula }),
      el("div", { class: "field" }, [
        el("label", { class: "field__label", attrs: { for: "distlab-range" }, text: "물체까지의 거리 (cm)" }),
        slider
      ]),
      out,
      barBox,
      el("p", { class: "distlab__calclabel", text: "지금 계산 :" }),
      calc,
      presets,
      walkBox,
      UI.foldout(lab.ask, function () {
        return UI.alert("ok", lab.answer);
      })
    ]);
  }

  /** 편도·왕복 — 그림과 표를 나란히 (명세 6.2 두 번째 줄) */
  function roundTripBox() {
    var rt = L.ROUND_TRIP;
    var rows = rt.legs.concat([rt.total, rt.want]);

    return UI.card({ eyebrow: "가장 헷갈리는 곳", title: rt.title, desc: rt.intro }, [
      S.figures.roundTrip(),
      el("table", { class: "exptable" }, [
        el("thead", {}, [
          el("tr", {}, [
            el("th", { text: "구간" }),
            el("th", { text: "거리" }),
            el("th", { text: "시간" })
          ])
        ]),
        el(
          "tbody",
          {},
          rows.map(function (r, i) {
            return el("tr", { class: i >= rt.legs.length ? "is-total" : "" }, [
              el("th", { attrs: { scope: "row" }, text: r.label }),
              el("td", { text: r.cm + " cm" }),
              el("td", { text: r.us + " μs" })
            ]);
          })
        )
      ]),
      UI.alert("ok", rt.conclusion)
    ]);
  }

  function renderConcept(state, app) {
    var box = el("div");

    /* ---------------- ① 탐색 카드 ---------------- */

    box.appendChild(sectionTitle("①", "원리 카드 — 하나씩 열어 봅시다"));

    L.CONCEPT_CARDS.forEach(function (card) {
      var opened = state.concept.opened[card.id] === true;

      var body = el("div", { class: "conceptcard__body" });
      var fold = el("details", { class: "conceptcard" }, [
        el("summary", { class: "conceptcard__sum" }, [
          el("span", { class: "conceptcard__title", text: card.title }),
          el("span", { class: "conceptcard__lead", text: card.lead })
        ]),
        body
      ]);
      if (opened) fold.open = true;

      var built = false;
      function build() {
        if (built) return;
        built = true;
        card.body.forEach(function (line) {
          body.appendChild(el("p", { class: "para", text: line }));
        });
        /* ★ 카드는 «어느 그림을 쓸지» 를 figure 로 스스로 적는다.
           id 로 찾으면 카드 이름을 고칠 때마다 그림이 조용히 사라진다. */
        var fig = S.figures.forCard(card.figure || card.id);
        if (fig) body.appendChild(fig);
        if (card.id === "functions") body.appendChild(functionCards());
        if ((card.keyPoints || []).length > 0) {
          body.appendChild(
            el("ul", { class: "keypoints" }, card.keyPoints.map(function (k) {
              return el("li", { class: "keypoints__item" }, [
                el("span", { class: "keypoints__mark", attrs: { "aria-hidden": "true" }, text: "★" }),
                el("span", { text: k })
              ]);
            }))
          );
        }
      }
      if (opened) build();

      fold.addEventListener("toggle", function () {
        if (!fold.open) return;
        build();
        if (state.concept.opened[card.id] !== true) {
          app.patch(function (s) {
            s.concept.opened[card.id] = true;
          });
        }
      });

      box.appendChild(fold);
    });

    /* ---------------- ② 편도와 왕복 ---------------- */

    box.appendChild(sectionTitle("②", "편도와 왕복"));
    box.appendChild(roundTripBox());

    /* ---------------- ③ 거리 슬라이더 ---------------- */

    box.appendChild(sectionTitle("③", "거리와 시간의 관계"));
    box.appendChild(distanceLab(state, app));

    /* ---------------- ④ 스케치의 흐름 ---------------- */

    box.appendChild(sectionTitle("④", "프로그램은 어떤 차례로 돌아가나"));
    box.appendChild(
      UI.card({ title: "setup() 은 한 번, loop() 는 되풀이" }, [
        el(
          "ol",
          { class: "flowlist" },
          L.SKETCH_FLOW.map(function (f) {
            return el("li", { class: "flowlist__item flowlist__item--" + f.phase }, [
              el("span", { class: "flowlist__label", text: f.label }),
              el("span", { class: "flowlist__note", text: f.note })
            ]);
          })
        ),
        UI.alert(
          "info",
          "★ 거리를 재는 코드는 loop() 안에 적습니다. setup() 에 적으면 딱 한 번만 재고 끝납니다."
        )
      ])
    );

    /* ---------------- ⑤ 개념 확인 ---------------- */

    box.appendChild(sectionTitle("⑤", "개념 확인 — 세 문항을 모두 맞히면 다음으로"));

    var done = 0;
    L.CONCEPT_CHECK.forEach(function (q) {
      if (state.concept.checks[q.id] === true) done += 1;
    });

    var checkCard = UI.card(
      { title: "개념 확인 " + done + " / " + L.CONCEPT_CHECK.length },
      []
    );
    var checkBody = checkCard.querySelector(".card__body");

    L.CONCEPT_CHECK.forEach(function (q, qi) {
      var picked = state.concept.checkChoices[q.id];
      var okNow = state.concept.checks[q.id] === true;
      var feedback = el("div", { class: "feedback" });

      checkBody.appendChild(
        el("div", { class: "checkq" + (okNow ? " checkq--ok" : "") }, [
          el("p", { class: "checkq__head" }, [
            el("span", { class: "checkq__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[qi] }),
            el("span", { class: "checkq__text", text: q.question }),
            okNow ? badge("true", "맞음") : null
          ]),
          UI.choiceGroup({ name: "cc-" + q.id, choices: q.choices }, picked, function (index) {
            var right = index === q.answerIndex;
            app.update(function (s) {
              s.concept.checkChoices[q.id] = index;
              if (right) s.concept.checks[q.id] = true;
              else delete s.concept.checks[q.id];
            });
            UI.toast(right ? "맞았습니다." : "다시 생각해 보세요.");
          }),
          feedback
        ])
      );

      if (picked !== undefined && !okNow) {
        var reviewCard = null;
        L.CONCEPT_CARDS.forEach(function (c) {
          if (c.id === q.review) reviewCard = c;
        });
        feedback.appendChild(
          UI.alert("warn", q.hint, [
            reviewCard
              ? el("p", { class: "alert__fix", text: "«" + reviewCard.title + "» 카드를 다시 열어 보세요." })
              : null
          ])
        );
      } else if (okNow) {
        feedback.appendChild(UI.alert("ok", "맞았습니다."));
      }
    });

    box.appendChild(checkCard);

    var pass = PC.schema.checkStep("concept", state);
    if (pass.ok) {
      box.appendChild(UI.alert("ok", "세 문항을 모두 맞혔습니다. 아래 [다음] 으로 회로를 이어 봅시다."));
    }

    return box;
  }

  /* ================================================================== */
  /* 3단계 — 회로 결선                                                   */
  /* ================================================================== */

  /**
   * 「지금 할 일」 한 줄 — 상태를 보고 다음 행동 «하나만» 고른다.
   *
   * ★ 여러 줄을 한꺼번에 늘어놓지 않는다. 회로가 엉켰을 때 고칠 것이 대여섯 개로 보이면
   *   학생은 어디부터 손대야 할지 알 수 없다. 판정도 그렇게 하도록 circuit.js 가
   *   «아직 판정할 수 없는» 항목을 blocked 로 돌려준다.
   */
  function nowDoing(state, check, dangers) {
    var c = state.circuit;

    if (dangers.length > 0) {
      return { at: 0, text: dangers[0].title + " — 아래 경고를 읽고 그 케이블부터 고치세요." };
    }

    var missing = {};
    check.missing.forEach(function (m) {
      missing[m.id] = true;
    });

    if (missing["c-vcc"]) {
      return { at: 1, text: "센서 «VCC» 를 우노 «" + PINS.vcc + "» 로 이으세요. 전원이 먼저입니다." };
    }
    if (missing["c-gnd"]) {
      return { at: 1, text: "센서 «GND» 를 우노 «" + PINS.gnd + "» 로 이으세요. 전류가 돌아올 길입니다." };
    }
    if (missing["c-trig"]) {
      return { at: 2, text: "센서 «Trig» 를 우노 «" + PINS.trig + "» 로 이으세요. 펄스를 보내는 길입니다." };
    }
    if (missing["c-echo"]) {
      return { at: 2, text: "센서 «Echo» 를 우노 «" + PINS.echo + "» 로 이으세요. 시간을 읽는 길입니다." };
    }
    if (missing["c-safe"]) {
      return { at: 1, text: "위험한 연결이 있습니다. 아래 경고를 읽고 그 케이블을 고치세요." };
    }
    if (missing["c-tidy"]) {
      return { at: 2, text: "쓰지 않는 케이블이나 떠 있는 단자가 있습니다. 아래 목록에서 정리하세요." };
    }
    if (!c.powerOn) {
      return { at: 3, text: "점검을 모두 통과했습니다. 아래 [전원 켜기] 를 눌러 전기를 넣으세요." };
    }
    return { at: 4, text: "3단계를 마쳤습니다. 아래 [다음] 으로 넘어가세요." };
  }

  /** 회로가 바뀌면 «전원·점검» 은 처음부터 다시 확인한다 */
  function resetPower(s) {
    s.circuit.powerOn = false;
    s.circuit.checked = false;
    if (!C.checkCircuit(s.circuit.connections).ok) s.circuit.checkPassed = false;
  }

  /**
   * 케이블 색이 무엇을 뜻하는지 그림 바로 아래에 적는다.
   * ★ 갈래가 넷이라 색만으로는 읽을 수 없다 — 반드시 글자를 함께 적는다(명세 11장).
   */
  function wireLegend() {
    var items = [
      { side: "power", text: "전원 — 우노 " + PINS.vcc + " 에서 센서 VCC 까지" },
      { side: "ground", text: "접지 — 센서 GND 에서 우노 " + PINS.gnd + " 까지" },
      { side: "trig", text: "Trig — 우노 " + PINS.trig + " 에서 센서 Trig 까지 (펄스가 나가는 길)" },
      { side: "echo", text: "Echo — 센서 Echo 에서 우노 " + PINS.echo + " 까지 (시간이 돌아오는 길)" },
      { side: "", text: "이 회로에 쓰이지 않는 케이블" }
    ];
    return el(
      "ul",
      { class: "wirelegend" },
      items.map(function (item) {
        var color = S.board.SIDE_COLOR[item.side] || "gray";
        return el("li", { class: "wirelegend__item" }, [
          el("span", {
            class: "wirelegend__dot wirelegend__dot--" + color,
            attrs: { "aria-hidden": "true" }
          }),
          el("span", { class: "wirelegend__word", text: S.board.COLOR_WORD[color] }),
          el("span", { text: item.text })
        ]);
      })
    );
  }

  /** 「이렇게 이으면 됩니다」 아래에 늘 붙는 한 줄 */
  var WIRING_NOTE =
    "브레드보드를 거쳐 가도 됩니다. 같은 마디(같은 열)라면 어느 구멍에 꽂아도 같은 연결로 봅니다. " +
    "★ 저항은 넣지 않습니다 — 필요한 것이 센서 모듈 안에 이미 들어 있습니다.";

  function renderCircuit(state, app) {
    var box = el("div");
    var circuit = state.circuit;

    /* ================================================================ */
    /* 3-A 단자 찾기 (명세 6.3)                                           */
    /* ================================================================ */

    if (!circuit.findDone) {
      var task = C.FIND_TASKS[circuit.findIndex] || C.FIND_TASKS[0];
      var findFeedback = el("div", { class: "feedback" });

      var findBoard = S.board.create({
        mode: "find",
        showBoard: true,
        showBread: false,
        showParts: true,
        getState: function () {
          return state.circuit;
        },
        onPick: function (component, pin) {
          var here = C.FIND_TASKS[state.circuit.findIndex];
          var result = C.checkFind(state.circuit.findIndex, component, pin);
          UI.clear(findFeedback);
          if (result.ok) {
            app.update(function (s) {
              if (here) s.circuit.findPicks[here.id] = component + "/" + pin;
              s.circuit.findIndex += 1;
              if (result.done) s.circuit.findDone = true;
            });
            UI.toast(result.message);
            return;
          }
          app.patch(function (s) {
            s.circuit.findAttempts += 1;
          });
          findFeedback.appendChild(UI.alert("warn", result.message));
        }
      });

      var names = {
        "f-5v": "우노 " + PINS.vcc,
        "f-gnd": "우노 GND",
        "f-trig": "센서 Trig",
        "f-echo": "센서 Echo"
      };

      box.appendChild(
        UI.card(
          {
            eyebrow: "3단계 · A 단자 찾기",
            title: "먼저 어느 단자가 무엇인지 찾습니다.",
            desc: "네 곳을 차례로 찾으면 케이블 연결로 넘어갑니다."
          },
          [
            taskStrip(
              C.FIND_TASKS.map(function (t, i) {
                return {
                  text: names[t.id] || t.id,
                  done: i < circuit.findIndex,
                  now: i === circuit.findIndex
                };
              })
            ),
            UI.alert("info", task.prompt),
            el("p", {
              class: "para",
              text:
                "그림에서 그 단자를 누르세요. 화살표 키로 옮기고 Enter 로 고를 수도 있습니다. " +
                "센서의 네 다리에는 실물과 같은 글자(VCC · Trig · Echo · GND)가 적혀 있습니다."
            }),
            findFeedback,
            findBoard.root
          ]
        )
      );
      return box;
    }

    /* ================================================================ */
    /* 3-B 케이블 연결 · 3-C 점검과 전원 켜기                              */
    /* ================================================================ */

    var check = C.checkCircuit(circuit.connections);
    var dangers = C.dangers(circuit.connections);
    var powerState = C.canPowerOn(circuit.connections);
    var now = nowDoing(state, check, dangers);

    var boardWire = S.board.create({
      mode: "wire",
      showBoard: true,
      showBread: true,
      showParts: true,
      getState: function () {
        return state.circuit;
      },
      onConnect: function (conn) {
        app.update(function (s) {
          s.circuit.connections.push(conn);
          s.circuit.attempts += 1;
          resetPower(s);
          /* 위험 연결이 생겼으면 «언제» 생겼는지 남긴다 (명세 7장 dangerEvents) */
          C.dangers(s.circuit.connections).forEach(function (d) {
            var rec = { code: d.code, title: d.title, at: new Date().toISOString() };
            s.circuit.errors.push(rec);
            s.circuit.dangerEvents.push(rec);
          });
        });
      },
      onUndo: function () {
        app.update(function (s) {
          s.circuit.connections.pop();
          resetPower(s);
        });
      },
      onReset: function () {
        app.update(function (s) {
          s.circuit.connections = [];
          resetPower(s);
        });
      }
    });

    /* ---------------- 점검 항목 + 힌트 ---------------- */

    var hintOut = el("div", { class: "hintout" });
    var conditionList = el("ul", { class: "condlist" });

    check.conditions.forEach(function (cond) {
      var row = cond.blocked
        ? el("li", { class: "condlist__item condlist__item--wait" }, [
            el("span", { class: "condlist__mark", attrs: { "aria-hidden": "true" }, text: "—" }),
            el("span", { class: "condlist__text", text: cond.label }),
            el("span", { class: "condlist__note", text: cond.blockedWhy })
          ])
        : UI.conditionRow(cond.label, cond.ok);

      if (!cond.ok && !cond.blocked) {
        row.appendChild(
          UI.button("힌트 보기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              var level = Math.min(Number(state.circuit.hintLevels[cond.id]) || 0, 2);
              var message = C.hintFor(cond.id, level);
              app.patch(function (s) {
                s.circuit.hintsUsed += 1;
                s.circuit.hintLevels[cond.id] = level + 1;
              });
              UI.clear(hintOut).appendChild(
                UI.alert("info", message, [
                  el("p", {
                    class: "alert__fix",
                    text: level >= 2 ? "마지막 힌트입니다." : "아직 모르겠으면 [힌트 보기] 를 한 번 더 누르세요."
                  })
                ])
              );
            }
          })
        );
      }
      conditionList.appendChild(row);
    });

    /* ---------------- 전원 단추 ---------------- */

    var powerRow = el("div", { class: "btnrow" });
    if (!circuit.powerOn) {
      powerRow.appendChild(
        UI.button("전원 켜기", {
          disabled: !powerState.ok,
          title: powerState.ok ? "" : "점검 항목을 모두 채워야 전원을 켤 수 있습니다.",
          click: function () {
            app.update(function (s) {
              s.circuit.checkPassed = true;
              s.circuit.powerOn = true;
              /* 회로 판정 결과를 제출 자료에 담아 둔다 */
              s.circuit.wiring = PC.schema.cleanWiring(C.analyze(s.circuit.connections));
            });
            UI.toast("전원을 켰습니다. 아직 코드가 없으므로 센서는 재지 않습니다.");
          }
        })
      );
      powerRow.appendChild(
        UI.button("회로 점검", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.checked = true;
            });
            var left = C.checkCircuit(state.circuit.connections).missing;
            UI.toast(
              left.length === 0
                ? "모든 항목을 채웠습니다. [전원 켜기] 를 누르세요."
                : "아직 " + left.length + "가지가 남았습니다. 위 목록을 보세요."
            );
          }
        })
      );
      if (!powerState.ok) {
        powerRow.appendChild(
          el("p", {
            class: "btnrow__note",
            text:
              powerState.reason === "danger"
                ? "위험한 연결이 있어 전원을 넣을 수 없습니다."
                : "위 항목을 모두 채우면 켤 수 있습니다."
          })
        );
      }
    } else {
      powerRow.appendChild(
        UI.button("전원 끄기", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.powerOn = false;
            });
          }
        })
      );
      powerRow.appendChild(
        el("p", {
          class: "btnrow__note",
          text:
            "전원이 켜졌습니다. 센서는 아직 아무것도 재지 않습니다 — " +
            "«언제 쏠지» 를 알려 주는 코드가 없기 때문입니다. 4단계에서 펄스를 만들면 재기 시작합니다."
        })
      );
    }

    /* ---------------- 지금 이어진 것 · 목표 ---------------- */

    var nowLine = el("div", { class: "nowpath" }, [
      el("span", { class: "nowpath__tag", text: "지금 이어진 것" }),
      el("span", { class: "nowpath__text", text: C.describeCurrent(circuit.connections) })
    ]);

    var goal = C.goalStatus(circuit.connections);
    var goalBox = UI.foldout("이렇게 이으면 됩니다 — 막히면 펼쳐 보세요", function () {
      var list = el(
        "ol",
        { class: "goallist" },
        goal.lines.map(function (line) {
          return el("li", { class: "goallist__item" + (line.ok ? " is-done" : "") }, [
            el("span", {
              class: "goallist__mark",
              attrs: { "aria-hidden": "true" },
              text: line.ok ? "✔" : "○"
            }),
            el("span", { class: "sr-only", text: line.ok ? "이어짐 : " : "아직 : " }),
            el("span", { class: "goallist__text", text: line.label }),
            el("span", { class: "goallist__state", text: line.ok ? "이어짐" : "아직" })
          ]);
        })
      );

      return el("div", {}, [
        el("p", {
          class: "para",
          text: "케이블 네 줄이면 됩니다. 브레드보드를 거쳐 가도 되고, 같은 마디면 어느 구멍에 꽂아도 같습니다."
        }),
        list,
        UI.alert("info", WIRING_NOTE)
      ]);
    });

    var checkBody = [
      nowLine,
      taskStrip([
        {
          text: "전원 두 줄 (VCC · GND)",
          done: !check.missing.some(function (m) {
            return m.id === "c-vcc" || m.id === "c-gnd" || m.id === "c-safe";
          }),
          now: now.at === 1
        },
        {
          text: "신호 두 줄 (Trig · Echo)",
          done: !check.missing.some(function (m) {
            return m.id === "c-trig" || m.id === "c-echo" || m.id === "c-tidy";
          }),
          now: now.at === 2
        },
        { text: "전원 켜기", done: circuit.powerOn, now: now.at === 3 }
      ]),
      UI.alert(now.at === 0 ? "danger" : now.at === 4 ? "ok" : "info", now.text),
      conditionList,
      hintOut,
      goalBox
    ];

    /* 위험 연결 — 무엇이 어떻게 되는지(effect)까지 함께 적는다.
       «오답» 이라고만 하면 역결선과 Trig/Echo 맞바꿈이 같은 것으로 보인다(명세 10장). */
    dangers.forEach(function (d) {
      checkBody.push(
        UI.alert("danger", d.title + " — " + d.detail, [
          el("p", { class: "alert__fix", text: "시뮬레이션 : " + d.effect }),
          el("p", { class: "alert__fix", text: "고치는 법 : " + d.fix })
        ])
      );
    });

    if (check.floating.length > 0) {
      checkBody.push(
        UI.alert(
          "warn",
          "아직 아무 데도 닿지 않은 단자가 있습니다 : " +
            check.floating
              .map(function (d) {
                return d.label;
              })
              .join(", ")
        )
      );
    }
    if (check.stray.length > 0) {
      checkBody.push(
        UI.alert("warn", "이 회로에 쓰이지 않는 케이블이 " + check.stray.length + "개 있습니다. 지워 주세요.")
      );
    }

    checkBody.push(powerRow);

    box.appendChild(
      UI.card(
        {
          eyebrow: "3단계 · B 케이블 연결 · C 점검",
          title: "회로 점검",
          desc:
            "VCC→" + PINS.vcc + " · GND→" + PINS.gnd + " · Trig→" + PINS.trig +
            " · Echo→" + PINS.echo + " 네 줄을 이으면 됩니다."
        },
        checkBody
      )
    );

    /* ---------------- 회로 그림 + 케이블 목록 ---------------- */

    var wireList = el("ul", { class: "wirelist" });
    if (circuit.connections.length === 0) {
      wireList.appendChild(el("li", { class: "wirelist__empty", text: "아직 이은 케이블이 없습니다." }));
    }
    var wireSides = C.wireSides(circuit.connections);
    circuit.connections.forEach(function (conn, index) {
      var side = wireSides[index] || "";
      var colorName = S.board.SIDE_COLOR[side] || "gray";
      wireList.appendChild(
        el("li", { class: "wirelist__item" }, [
          el("span", {
            class: "wirelist__dot wirelist__dot--" + colorName,
            attrs: { "aria-hidden": "true" }
          }),
          /* ★ 색만으로 알리지 않는다 — 갈래를 글자로도 적는다(명세 6.3 · 11장) */
          el("span", {
            class: "wirelist__side wirelist__side--" + (side || "none"),
            text: S.board.SIDE_WORD[side]
          }),
          el("span", {
            class: "wirelist__text",
            text:
              (S.board.COLOR_WORD[colorName] || "") +
              " · " +
              C.describe(conn.fromComponent, conn.fromPin) +
              " → " +
              C.describe(conn.toComponent, conn.toPin)
          }),
          UI.button("지우기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              app.update(function (s) {
                s.circuit.connections.splice(index, 1);
                resetPower(s);
              });
            }
          })
        ])
      );
    });

    box.appendChild(
      UI.card(
        {
          title: "회로 그림",
          desc: circuit.powerOn
            ? "전원이 켜져 있습니다. 케이블을 고치면 전원이 꺼지고 점검을 다시 합니다."
            : "단자를 하나 누르고, 이을 곳을 하나 더 누르면 케이블이 생깁니다. 아래쪽에 초음파 센서가 있습니다."
        },
        [boardWire.root, wireLegend(), wireList]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */

  /**
   * 실행 결과를 보여 주는 부품 — 예시와 학생 코드가 같은 것을 쓴다.
   *
   * ★★ 2026-08-22 에 «시리얼 모니터만» 남기도록 줄였다.
   *   본래는 넷을 함께 보여 줬다 —
   *     ① Trig 핀의 지금 값(HIGH/LOW)과 만들어진 펄스의 길이
   *     ② 측정 결과 카드 (놓은 거리 · 왕복 시간 · 계산한 거리 · 오차)
   *     ③ 한 번 재는 일의 시간표 (펄스 · 기다림 · 쉼)
   *     ④ 시리얼 모니터
   *   화면이 너무 많은 것을 한꺼번에 말해서, 학생이 «어디를 보아야 하는지»
   *   알 수 없었다. 4단계에서 확인해야 하는 것은 «시리얼 모니터에 무엇이
   *   찍히는가» 하나다 — 거리를 재고 견주는 일은 5단계가 맡는다.
   *
   * ★ 그래서 아래 넷이 «없다». 되살리려는 손을 미리 막아 둔다.
   *     setTrig · statRow · measureCard · pulseLine
   *   측정 결과와 오차는 5단계(makeScene)가 그대로 가지고 있다.
   *
   * ★ 남긴 것 — 시리얼 모니터 · 시계 · 재생 속도 단추 · 낭독기 알림.
   *   재생 속도 단추는 «내용» 이 아니라 조작 장치다. 없으면 실행 자체를 못 한다.
   */
  function makeRunner(opts) {
    var o = opts || {};
    var viewHost = el("div");
    var panelHost = el("div");
    var player = null;

    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });

    /**
     * 모니터 머리에 붙는 «등».
     *
     * ★ o.lampOf(result) 를 준 곳만 붙는다. 확장 활동에서만 쓴다 —
     *   4단계는 LED 가 없으므로 붙일 것이 없다.
     * ★ 켜짐·꺼짐을 색으로만 알리지 않는다. ▮/○ 와 «켜짐/꺼짐» 글자를 함께 둔다.
     */
    /**
     * 모니터 머리에 붙는 «등».
     *
     * ★★ 재생을 따라 «살아서» 바뀐다(2026-08-22).
     *   물체가 다가오다 멀어지는 길을 돌리면 LED 가 켜졌다 꺼진다 —
     *   마지막 값만 보여 주면 그 «켜지고 꺼지는 것» 을 볼 수 없다.
     *
     * ★ 흉내가 아니다. 시뮬레이터가 남긴 pin-write 를 그대로 따라간다.
     * ★ 색만으로 알리지 않는다 — ▮/○ 와 «켜짐/꺼짐» 글자를 함께 둔다.
     */
    var lampDot = el("span", { class: "monlamp__dot", attrs: { "aria-hidden": "true" }, text: "○" });
    var lampText = el("span", { class: "monlamp__text", text: "" });
    var lampBox = el("span", { class: "monlamp" }, [lampDot, lampText]);

    function setLamp(on) {
      lampDot.textContent = on ? "▮" : "○";
      lampText.textContent = (o.lamp && o.lamp.label ? o.lamp.label : "LED") + " " + (on ? "켜짐" : "꺼짐");
      lampBox.className = "monlamp" + (on ? " monlamp--on" : "");
    }

    /** 지금 보고 있는 핀 — 코드가 바뀌면 달라지므로 실행할 때마다 다시 묻는다 */
    var lampPin = null;

    function lampNode() {
      if (!o.lamp) return null;
      lampPin = o.lamp.pinOf ? o.lamp.pinOf() : null;
      if (lampPin === null || lampPin === undefined) return null;
      setLamp(false);
      return lampBox;
    }

    /** pin-write 한 줄을 보고 등을 고친다. 우리 핀이 아니면 아무 일도 하지 않는다. */
    function lampFollow(entry) {
      if (lampPin === null || entry.kind !== "pin-write") return;
      var head = String(entry.text || "").split("=")[0].trim();
      if (head !== "D" + lampPin) return;
      setLamp(/=\s*HIGH\s*$/.test(String(entry.text)));
    }

    /**
     * 실행해 보여 준다.
     *   ro.instant  : 애니메이션 없이 «끝난 모습» 을 바로 보여 준다.
     *   ro.loops    : loop() 를 몇 바퀴 돌 것인가
     *   ro.onCycle(): 한 번의 «재기» 가 끝나는 것을 본 순간 한 번 부른다.
     */
    function run(source, ro) {
      ro = ro || {};
      var world = o.getWorld ? o.getWorld() : {};
      /* ★ 열 바퀴를 돈다(2026-08-22). 세 바퀴로는 «되풀이된다» 는 것이
         시리얼 모니터에 잘 드러나지 않았다. CONFIG.loopLimit(12) 안쪽이다. */
      var result = A.run(source, { loopLimit: ro.loops || RUN_LOOPS, world: world });
      var view = ED.codeView(source, { caption: "실행 중인 줄이 ▶ 로 표시됩니다." });
      UI.clear(viewHost).appendChild(view.root);

      if (!result.ok && result.error) {
        UI.clear(panelHost).appendChild(
          UI.alert("warn", (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message)
        );
        return result;
      }

      var cycleTold = false;
      var speedNow = ro.instant ? 0 : 1;

      if (player) player.stop();

      player = ED.player(view, {
        onStep: function (entry) {
          /* 등이 있으면 재생을 따라 함께 바뀐다 */
          lampFollow(entry);
          /* ★ 한 번의 «재기» 가 끝나는 것을 본 순간이 이 단계의 통과 조건이다.
             화면에 적을 것은 없어도 이 알림은 반드시 있어야 한다. */
          if (entry.kind === "pulse-in" && !cycleTold) {
            cycleTold = true;
            live.textContent = "한 번의 재기가 끝나는 것을 관찰했습니다.";
            if (ro.onCycle) ro.onCycle();
          }
        }
      });
      player.setTrace(result.trace);

      function speedButton(label, factor) {
        return UI.button(label, {
          class: "btn btn--ghost btn--small",
          click: function () {
            speedNow = factor;
            player.setSpeed(factor);
            player.reset();
            player.play();
          }
        });
      }

      UI.clear(panelHost).appendChild(
        el("div", { class: "runpanel" }, [
          el("div", { class: "monitor" }, [
            el("div", { class: "monitor__head" }, [
              el("span", { text: "시리얼 모니터 (9600)" }),
              /* ★ o.lamp 를 준 곳만 «등» 이 붙는다(확장 활동).
                 숫자만 죽 찍히면 LED 가 켜졌는지 눈으로 알 수 없다 —
                 결과를 «불» 로도 보여 준다(지적 2026-08-22). */
              lampNode(),
              player.clock
            ]),
            player.monitor
          ]),
          el("div", { class: "btnrow" }, [
            el("span", { class: "btnrow__label", text: "재생 속도" }),
            speedButton("1배속", 1),
            speedButton("4배속", 4),
            UI.button("즉시", {
              class: "btn btn--ghost btn--small",
              click: function () {
                speedNow = 0;
                player.setSpeed(0);
                player.reset();
                player.play();
              }
            }),
            UI.button("멈춤", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.stop();
              }
            })
          ]),
          /* ★ 「pulseIn 은 기다립니다」 설명도 이 판의 블럭이라 걷어 냈다(2026-08-22).
             같은 말이 ① 읽기의 «프로그램 옆» 17번 줄 설명에 그대로 있다 —
             거기가 그 말이 있어야 할 자리다. 여기서는 시리얼 모니터만 본다. */
          live
        ])
      );

      player.setSpeed(speedNow);
      player.play();
      return result;
    }

    return {
      viewHost: viewHost,
      panelHost: panelHost,
      run: run,
      stop: function () {
        if (player) player.stop();
      }
    };
  }

  function renderCode(state, app) {
    var box = el("div");
    var code = state.code;
    var walk = L.CODE_WALKTHROUGH;

    /** 코드 검사에 넘길 «지금 상황» */
    function ctx() {
      return { connections: state.circuit.connections };
    }

    /** 시뮬레이터에 넘길 «세상» — 회로가 정한 핀과 5단계에서 정한 물체 */
    /**
     * 시뮬레이터에 넘길 «세상».
     *
     * ★★ powered 를 true 로 둔다(2026-08-22).
     *   3단계 통과 조건이 「회로 점검 여섯 항목 + 전원 켜기」 이므로,
     *   4단계에 온 학생은 «이미 제대로 이은 회로» 를 가지고 있다.
     *   그런데 회로 상태에서 다시 계산하면, 4단계를 열어 놓고 3단계로 돌아가
     *   케이블을 하나 뽑아 보기만 해도 4단계의 모든 출력이 0 이 된다 —
     *   프로그램은 멀쩡한데 «코드가 잘못된 줄» 알게 된다.
     *
     * ★ 코드 쪽 잘못은 그대로 잡힌다. measure() 는 코드가 «어느 핀에»
     *   썼는지를 world.trigPin·echoPin 과 맞대어 보므로, D8 로 적으면
     *   여기서도 실패한다. 회로 쪽 판정만 3단계에 맡긴 것이다.
     *
     * ★ 거리는 단추로 고른다(DEMO_DISTANCES). 4단계에는 물체를 끌어
     *   옮기는 장치가 없으므로 슬라이더 대신 단추다.
     */
    function world() {
      return {
        trigPin: PC.TRIG_PIN,
        echoPin: PC.ECHO_PIN,
        powered: true,
        distance: demoDistance(),
        angle: PC.DEFAULT_ANGLE,
        material: PC.DEFAULT_MATERIAL,
        seed: 1
      };
    }

    /** 지금 고른 물체 거리(cm) — 상태에 남으므로 새로고침 뒤에도 그대로다 */
    function demoDistance() {
      var list = PC.DEMO_DISTANCES || [10];
      var v = state.code.demoDistance;
      return list.indexOf(v) === -1 ? (PC.DEMO_DISTANCE_DEFAULT || list[0]) : v;
    }

    /**
     * 물체 거리를 고르는 단추 줄.
     *
     * ★ 고르면 «곧바로 다시 돌린다». 고른 뒤 실행을 또 눌러야 하면
     *   학생은 «골라도 아무 일이 없다» 고 여긴다.
     *
     * ★ 0cm 는 일부러 넣었다 — DIST_MIN(2cm) 보다 가까우면 측정이 실패하고
     *   pulseIn 이 0 을 돌려준다. 시리얼 모니터에 0 이 찍히는 것이
     *   «고장이 아니라 당연한 일» 임을 여기서 본다.
     */
    /**
     * ★★ 고른 뒤에 «그 줄이 다시 그려져야» 한다.
     *
     *   app.patch 는 화면을 다시 그리지 «않는다» — 글을 적는 중에 다시 그리면
     *   초점과 커서가 날아가기 때문이다. 그래서 고른 표시(aria-pressed)와
     *   아래 안내 글이 저절로 바뀌지 않는다. 여기 모아 둔 다시-그리기를 부른다.
     *
     * ★ 단추 줄은 ② 돌려 보기 «한 곳» 에만 있다(2026-08-22 에 ③ 작성 쪽은 지웠다).
     *   그래도 목록으로 두는 까닭은, 줄이 늘어날 때 한쪽만 고쳐지는 일을
     *   막기 위해서다 — 실제로 두 곳이던 동안 그 흠이 있었다.
     */
    var distPainters = [];
    function repaintDistance() {
      distPainters.forEach(function (paint) {
        paint();
      });
    }

    function distanceRow(onPick) {
      var dMin = PC.DIST_MIN === undefined ? 2 : PC.DIST_MIN;
      var row = el("div", { class: "btnrow btnrow--dist" });

      function paint() {
        var now = demoDistance();
        UI.clear(row);
        row.appendChild(el("span", { class: "btnrow__label", text: "물체 거리" }));
        (PC.DEMO_DISTANCES || []).forEach(function (cm) {
          var on = cm === now;
          var tooClose = cm < dMin;
          row.appendChild(
            UI.button(cm + "cm" + (tooClose ? " (너무 가까움)" : ""), {
              class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
              attrs: {
                "aria-pressed": on ? "true" : "false",
                title: tooClose
                  ? "잴 수 있는 가장 가까운 거리보다 가깝습니다 — pulseIn 이 0 을 돌려줍니다."
                  : cm + "cm 에 물체를 놓고 재 봅니다."
              },
              click: function () {
                if (cm === demoDistance()) return;
                app.patch(function (st) {
                  st.code.demoDistance = cm;
                });
                state.code.demoDistance = cm;
                repaintDistance();
                if (onPick) onPick();
              }
            })
          );
        });
        /* 색만으로 알리지 않는다 — 고른 것을 글로도 적는다(명세 13장) */
        row.appendChild(
          el("span", {
            class: "btnrow__note",
            text:
              now < dMin
                ? "★ " + now + "cm 는 너무 가까워 측정이 실패합니다 — 시리얼 모니터에 0 이 찍힙니다."
                : "물체를 " + now + "cm 앞에 놓고 재는 셈입니다."
          })
        );
      }

      paint();
      distPainters.push(paint);
      return row;
    }

    /* ================================================================ */
    /* A 읽기                                                           */
    /* ================================================================ */

    box.appendChild(sectionTitle("①", "예시 프로그램 읽기"));

    var readCard = UI.card({ title: walk.title, desc: walk.intro }, []);
    var readBody = readCard.querySelector(".card__body");

    /* ★ 줄마다의 설명을 «프로그램 옆» 에 바로 달아 준다(지적 2026-08-22).
       전에는 아래에 「줄마다 무슨 뜻일까」 를 접어 둔 목록이 따로 있어서,
       학생이 위아래를 번갈아 보며 줄 번호를 세어야 했다. */
    readBody.appendChild(
      ED.codeView(walk.code, { caption: "오늘 만들 프로그램", notes: walk.lines }).root
    );

    /* 한 번 재는 일이 «세 토막» 이라는 것을 먼저 보인다 */
    readBody.appendChild(
      el(
        "ol",
        { class: "blocklist" },
        walk.blocks.map(function (b) {
          return el("li", { class: "blocklist__item" }, [
            el("span", { class: "blocklist__marker", attrs: { "aria-hidden": "true" }, text: b.marker }),
            el("div", {}, [
              el("p", { class: "blocklist__label" }, [
                el("b", { text: b.label }),
                el("span", { class: "blocklist__range", text: " (" + b.range + ")" })
              ]),
              el("p", { class: "blocklist__what", text: b.what })
            ])
          ]);
        })
      )
    );

    readBody.appendChild(
      el(
        "div",
        { class: "skel" },
        walk.skeleton.map(function (s) {
          return el("div", { class: "skel__item" }, [
            el("code", { class: "skel__name", text: s.name }),
            el("p", { class: "skel__when" }, [el("b", { text: "언제 : " }), el("span", { text: s.when })]),
            el("p", { class: "skel__what", text: s.what })
          ]);
        })
      )
    );

    readBody.appendChild(
      UI.foldout("어떤 순서로 돌아갈까", function () {
        return el(
          "ol",
          { class: "orderlist" },
          walk.order.map(function (t) {
            return el("li", { class: "orderlist__item", text: t });
          })
        );
      })
    );

    readBody.appendChild(
      UI.foldout("글쓰기 약속", function () {
        return el(
          "ul",
          { class: "ruleslist" },
          walk.rules.map(function (r) {
            return el("li", { class: "ruleslist__item" }, [
              el("code", { class: "ruleslist__mark", text: r.mark }),
              el("span", { text: r.text })
            ]);
          })
        );
      })
    );

    readBody.appendChild(functionCards());
    box.appendChild(readCard);

    /* ================================================================ */
    /* B 돌려 보기                                                       */
    /* ================================================================ */

    box.appendChild(sectionTitle("②", "예시를 그대로 돌려 보기"));

    var exampleRunner = makeRunner({ getWorld: world });
    var exampleCard = UI.card(
      {
        title: "한 번 재는 일을 눈으로 봅시다",
        desc:
          "아래 [예시 실행] 을 누르면 위 프로그램이 그대로 돌아갑니다. " +
          "펄스가 나가고, pulseIn 이 기다리고, 거리가 시리얼 모니터에 적히는 것을 끝까지 보세요."
      },
      [
        distanceRow(function () {
          /* 고른 거리로 곧바로 다시 돌린다 */
          exampleRunner.run(walk.code, { instant: true });
        }),
        el("div", { class: "btnrow" }, [
          UI.button("예시 실행", {
            click: function () {
              exampleRunner.run(walk.code, {
                onCycle: function () {
                  if (state.code.learned) return;
                  app.update(function (s) {
                    s.code.exampleRun = true;
                    s.code.learned = true;
                  });
                  UI.toast("한 번의 재기를 끝까지 보았습니다. 아래에 «직접 만들기» 가 열렸어요.");
                }
              });
            }
          }),
          UI.button("멈춤", {
            class: "btn btn--ghost",
            click: function () {
              exampleRunner.stop();
            }
          })
        ]),
        exampleRunner.viewHost,
        exampleRunner.panelHost,
        code.learned ? UI.alert("ok", walk.afterRun) : null
      ]
    );
    box.appendChild(exampleCard);

    if (!code.learned) {
      box.appendChild(
        UI.alert(
          "info",
          "예시를 한 번 실행해 «재기 한 번» 이 끝나는 것을 보면 아래에 직접 만드는 자리가 열립니다."
        )
      );
      return box;
    }

    /* ================================================================ */
    /* C 만들기 — 조립 → 빈칸 → 편집                                      */
    /* ================================================================ */

    box.appendChild(sectionTitle("③", "직접 만들기"));

    /* 검사 결과가 놓일 자리를 «먼저» 만들어 둔다.
       아래에서 입력을 만들 때 setSource → refreshTests 가 곧바로 돌기 때문이다. */
    var testPanel = el("div", { class: "testpanel" });
    var warnPanel = el("div");
    var modeTabs = el("div", { class: "modetabs" });
    var modeHost = el("div");
    var runner = makeRunner({ getWorld: world });
    var runRow = el("div", { class: "btnrow" });

    var currentSource = code.source || "";
    var currentMode = code.mode || "assemble";

    /**
     * ★ 방식 딱지는 화면을 다시 그리지 «않고» 그 자리에서 고친다.
     *   검사는 학생이 글을 적는 중에도 돌기 때문에, 다시 그리면 초점과 커서가 날아간다.
     */
    function paintModeDone() {
      var now = app.getState ? app.getState() : state;
      UI.clear(modeTabs);
      A.CODE_MODES.forEach(function (m) {
        var doneFlag =
          m.id === "assemble" ? now.code.assembleDone : m.id === "blank" ? now.code.blanksDone : null;
        var on = m.id === currentMode;
        var label = m.label + (doneFlag === true ? " ✔" : "");
        modeTabs.appendChild(
          UI.button(label, {
            class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
            attrs: { "aria-pressed": on ? "true" : "false", title: m.desc },
            click: function () {
              if (on) return;
              app.update(function (s) {
                s.code.mode = m.id;
              });
            }
          })
        );
      });
      modeTabs.appendChild(
        el("p", {
          class: "modetabs__note",
          text:
            now.code.assembleDone && now.code.blanksDone
              ? "① 과 ② 를 모두 마쳤습니다. ③ 전체 편집은 더 해 보고 싶은 사람의 자리입니다."
              : "★ ① 코드 조립과 ② 빈칸 채우기를 «둘 다» 마쳐야 다음 단계가 열립니다."
        })
      );
    }

    /** 검사를 돌려 화면과 상태를 함께 고친다 */
    function refreshTests() {
      var result = A.validate(currentSource, ctx());
      var total = result.tests.length;
      var passed = result.passed;

      UI.clear(testPanel);
      testPanel.appendChild(
        el("p", { class: "testpanel__head" }, [
          el("span", { text: "코드 검사 " }),
          el("b", { text: passed + " / " + total }),
          el("span", { text: passed === total ? " — 모두 통과했습니다." : " — 아래 항목을 채워 보세요." })
        ])
      );
      if (!result.parsed && result.error) {
        testPanel.appendChild(
          UI.alert(
            "warn",
            (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message
          )
        );
      }
      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        /* ★★ 설명은 conditionRow 의 «세 번째 인자» 로 넘긴다.
           row.appendChild(...) 로 붙이면 설명이 .cond__body 가 아니라
