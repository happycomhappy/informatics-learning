        var problems = PC.circuit ? PC.circuit.pinMismatch(codePins(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis",
    /* 이 차시에서 늘어난 둘 (명세 4장) */
    "delayMicroseconds",
    "pulseIn"
  ];

  var PIN_CALLS = [
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "pulseIn"
  ];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (경고와 교사 화면에 쓴다)
   *
   * ★ trigPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   */
  function pinsUsed(ast) {
    var uses = [];
    var known = globalNumbers(ast);
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 6.4)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = {
      connections: (ctx && ctx.connections) || [],
      source: source,
      world: (ctx && ctx.world) || null
    };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode =
          mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    /* loop() 끝에 쉬는 시간이 없으면 시리얼 모니터가 글자로 뒤덮인다 */
    if (ast.functions.loop && allCalls(ast, "delay").length === 0) {
      warnings.push({
        line: ast.functions.loop.line,
        message:
          "loop() 안에 delay() 가 없습니다. 잘못은 아니지만 1초에 수천 번 재게 되어 " +
          "시리얼 모니터를 읽을 수 없습니다. 끝에 delay(" + LOOP_DELAY_MS + "); 을 두면 편합니다."
      });
    }

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 확장 활동 검사 (5단계 «주차 경고 장치» — 명세 6.5 마지막 줄)             */
  /*                                                                    */
  /* ★ 4단계의 TESTS 를 그대로 쓸 수 «없다».                              */
  /*   그쪽은 마지막 항목에서 «회로에 이은 핀» 과 맞대어 보는데,             */
  /*   경고용 LED 는 이번 차시의 «필수» 회로에 없다(명세 6.5 마지막 줄).      */
  /*   그래서 여기서는 «짜임새가 맞는가» 와 «실제로 켜지고 꺼지는가» 만 본다. */
  /* ------------------------------------------------------------------ */

    /**
     * 학생이 적은 «기준 거리» 를 꺼낸다. 못 찾으면 null.
     *
     * ★ 화면이 돌려 볼 거리를 이 값의 «양쪽» 으로 짜기 위해 필요하다.
     *   기준을 30 으로 적은 학생에게 20 을 기준으로 짠 길을 보여 주면
     *   LED 가 내내 켜져 있어 «꺼지는 것» 을 볼 수 없다.
     *
     * ★ 이름으로 적은 것(const int limit = 25;)도 찾아낸다 —
     *   globalNumbers 가 전역 숫자 선언을 모아 두기 때문이다.
     */
    function warnThresholdOf(ast) {
      var found = findFormula(ast);
      var name = found.distanceName;
      var known = globalNumbers(ast);
      var out = null;
      flatStatements(ast).forEach(function (stmt) {
        if (out !== null || stmt.kind !== "if") return;
        var cond = stmt.cond;
        if (!cond || cond.kind !== "binary") return;
        if (["<", "<=", ">", ">="].indexOf(cond.op) === -1) return;
        if (name && !usesVariable(cond, name)) return;
        /* 거리가 아닌 «쪽» 이 기준값이다 */
        [cond.left, cond.right].forEach(function (side) {
          if (out !== null || !side) return;
          if (side.kind === "number") out = Number(side.value);
          else if (side.kind === "ident" && known[side.name] !== undefined) out = Number(known[side.name]);
        });
      });
      return out === null || !isFinite(out) ? null : out;
    }

  /** 경고 LED 로 쓰는 핀 — Trig·Echo 가 아닌 나머지 하나 */
  function warnPinOf(ast) {
    var known = globalNumbers(ast);
    var info = codePins(ast);
    var found = null;
    Object.keys(known).forEach(function (name) {
      if (found !== null) return;
      var v = known[name];
      if (typeof v !== "number") return;
      if (String(v) === String(info.trigPin) || String(v) === String(info.echoPin)) return;
      if (v < 0 || v > 13) return;
      found = { name: name, pin: v };
    });
    return found;
  }

  var WARN_TESTS = [
    {
      id: "w-pin",
      label: "경고 LED 를 이을 핀에 이름을 붙였다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) {
          return {
            ok: false,
            message:
              "LED 를 이을 핀을 정하지 않았습니다. Trig·Echo 가 아닌 다른 디지털 핀을 하나 골라 " +
              "const int ledPin = 9; 처럼 이름을 붙여 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "w-mode",
      label: "그 핀을 pinMode(…, OUTPUT) 으로 정했다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };
        var known = globalNumbers(ast);
        var mode = null;
        allCalls(ast, "pinMode").forEach(function (c) {
          var pin = resolvePin((c.args || [])[0], known);
          if (pin === null || String(pin) !== String(w.pin)) return;
          var m = (c.args || [])[1];
          if (m && m.kind === "constant") mode = m.name;
        });
        if (mode === null) {
          return { ok: false, message: "pinMode(" + w.name + ", OUTPUT); 을 setup() 에 적어 주세요." };
        }
        if (mode !== "OUTPUT") {
          return { ok: false, message: "LED 는 아두이노가 «켜는» 것이므로 " + mode + " 이 아니라 OUTPUT 입니다." };
        }
        return { ok: true };
      }
    },
    {
      id: "w-measure",
      label: "거리를 재는 부분이 그대로 남아 있다",
      run: function (ast) {
        if (allCalls(ast, "pulseIn").length === 0) {
          return { ok: false, message: "pulseIn 이 없어졌습니다. 거리를 재지 못하면 경고할 기준도 없습니다." };
        }
        var found = findFormula(ast);
        if (!found.formula) {
          return { ok: false, message: "거리를 구하는 줄이 없습니다. 4단계에서 만든 두 줄을 그대로 두세요." };
        }
        var vars = {};
        vars[found.durationName] = 1000;
        var got = evalConst(found.formula, vars);
        var want = (1000 * SOUND_SPEED) / 2;
        if (got === null || Math.abs(got - want) > 0.05) {
          return { ok: false, message: "거리 식이 4단계에서 통과한 식과 다릅니다. 왕복이므로 2 로 나눕니다." };
        }
        return { ok: true };
      }
    },
    {
      id: "w-if",
      label: "if 문으로 거리를 기준값과 견준다",
      run: function (ast) {
        var found = findFormula(ast);
        var name = found.distanceName;
        var hit = null;
        flatStatements(ast).forEach(function (stmt) {
          if (hit || stmt.kind !== "if") return;
          if (name && !usesVariable(stmt.cond, name)) return;
          hit = stmt;
        });
        if (!hit) {
          return {
            ok: false,
            message:
              "if 문이 없습니다. if (" + (name || "distance") + " < " + WARN_DISTANCE +
              ") { … } 처럼 «가까운가» 를 물어야 합니다."
          };
        }
        var cond = hit.cond;
        var okShape = cond && cond.kind === "binary" && ["<", "<=", ">", ">="].indexOf(cond.op) !== -1;
        if (!okShape) {
          return { ok: false, message: "거리를 «크다/작다» 로 견주어야 합니다. 예) " + (name || "distance") + " < " + WARN_DISTANCE };
        }
        return { ok: true };
      }
    },
    {
      id: "w-onoff",
      label: "가까우면 켜고 멀면 끈다",
      run: function (ast) {
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };
        var known = globalNumbers(ast);
        var onCount = 0;
        var offCount = 0;
        allCalls(ast, "digitalWrite").forEach(function (c) {
          var pin = resolvePin((c.args || [])[0], known);
          if (pin === null || String(pin) !== String(w.pin)) return;
          if (isHighArg((c.args || [])[1])) onCount += 1;
          else offCount += 1;
        });
        if (onCount === 0) {
          return { ok: false, message: "LED 를 켜는 줄이 없습니다. digitalWrite(" + w.name + ", HIGH); 를 적어 주세요." };
        }
        if (offCount === 0) {
          return {
            ok: false,
            message:
              "LED 를 끄는 줄이 없습니다. 켜기만 하면 한 번 가까워진 뒤로는 영원히 켜져 있습니다. " +
              "else 쪽에 digitalWrite(" + w.name + ", LOW); 를 적어 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "w-run",
      label: "★ 돌려 보니 가까울 때 켜지고 멀 때 꺼진다",
      run: function (ast, ctx) {
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var w = warnPinOf(ast);
        if (!w) return { ok: false, message: "먼저 LED 핀을 정해 주세요." };

        function ledAt(distance) {
          var r = run(source, { loopLimit: 1, world: worldFromCode(ast, { distance: distance }) });
          if (r.error) return { err: r.error.message };
          return { on: r.pins.values[w.pin] === 1 };
        }

        var near = ledAt(Math.max(DIST_MIN, WARN_DISTANCE - 10));
        if (near.err) return { ok: false, message: near.err };
        var far = ledAt(WARN_DISTANCE + 10);
        if (far.err) return { ok: false, message: far.err };

        if (!near.on && far.on) {
          return {
            ok: false,
            message:
              "거꾸로 되어 있습니다 — 멀 때 켜지고 가까울 때 꺼집니다. " +
              "부딪히기 전에 알려야 하니 «작다(<)» 로 견주어야 합니다."
          };
        }
        if (!near.on) {
          return {
            ok: false,
            message:
              (WARN_DISTANCE - 10) + "cm 앞에 물체를 두고 돌려 보았는데 LED 가 켜지지 않았습니다. " +
              "기준값과 부호를 다시 보세요."
          };
        }
        if (far.on) {
          return {
            ok: false,
            message:
              (WARN_DISTANCE + 10) + "cm 앞에서도 LED 가 켜져 있습니다. 멀어졌을 때 끄는 줄(else)이 " +
              "제대로 동작하는지 보세요."
          };
        }
        return { ok: true };
      }
    }
  ];

  /**
   * 확장 활동 코드를 살펴본다. validate() 와 돌려주는 모양이 같다.
   *   { ok, parsed, error, tests: [{id,label,ok,message}], passed }
   */
  function validateWarning(source) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        tests: WARN_TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0
      };
    }
    var ast = parsed.ast;
    var results = WARN_TESTS.map(function (t) {
      var r = t.run(ast, { source: source });
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;
    return {
      ok: passed === results.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 물체와 반사 — 되돌아오는 신호의 세기 (명세 6.5 네 번째 줄)            */
  /* ------------------------------------------------------------------ */

  /**
   * 되돌아온 신호의 세기(0~1).
   *
   *   각도 손실 × 재질 손실 × 거리에 따른 감쇠
   *
   * 이 값이 ECHO_FAIL_LEVEL 아래로 내려가면 «측정 실패» 다.
   * 실제 물리량이 아니라 «약해지는 정도를 견주기 위한 눈금» 이다(constants.js 참고).
   */
  function echoLevel(distanceCm, angleId, materialId) {
    var a = PC.angleOf ? PC.angleOf(angleId) : { loss: 0 };
    var m = PC.materialOf ? PC.materialOf(materialId) : { loss: 0 };
    var far = Math.max(0, 1 - 0.45 * (Number(distanceCm) / DIST_MAX));
    return (1 - (a.loss || 0)) * (1 - (m.loss || 0)) * far;
  }

  /** 글자를 숫자로 (씨앗을 만들 때 쓴다) */
  function hashText(text) {
    var h = 0;
    var s = String(text || "");
    for (var i = 0; i < s.length; i += 1) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h;
  }

  /**
   * 씨앗 하나로 늘 같은 값을 내놓는 난수 (명세 6.5 «재현 가능한 seed 기반»).
   *
   * ★ Math.random() 을 쓰지 않는 까닭
   *   같은 조건으로 다시 재면 같은 값이 나와야 학생이 «무엇 때문에 달라졌는지» 를 말할 수 있다.
   *   무작위면 조건을 바꾸지 않아도 값이 흔들려 관찰이 성립하지 않는다.
   */
  function seededUnit(seed) {
    var t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  /** 이 조건에서 생기는 오차(cm). 늘 같은 씨앗이면 늘 같은 값이다. */
  function noiseFor(distanceCm, angleId, materialId, trial, seed) {
    var a = PC.angleOf ? PC.angleOf(angleId) : { jitter: 0 };
    var m = PC.materialOf ? PC.materialOf(materialId) : { jitter: 0 };
    var jitter = (a.jitter || 0) + (m.jitter || 0);
    if (jitter === 0) return 0;
    var key =
      Math.round(Number(distanceCm) * 10) * 7919 +
      (trial | 0) * 104729 +
      (Number(seed) || 0) * 15485863 +
      hashText(angleId) * 31 +
      hashText(materialId) * 17;
    var r = seededUnit(key) * 2 - 1;
    var scale = 0.5 + 0.5 * Math.min(1, Number(distanceCm) / 100);
    return Math.round(jitter * r * scale * 100) / 100;
  }

  /* ------------------------------------------------------------------ */
  /* 5. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.world     : 센서가 놓인 «상황» — 아래 표
   *
   *   world.trigPin  회로에서 Trig 가 달린 핀 번호
   *   world.echoPin  회로에서 Echo 가 달린 핀 번호
   *   world.powered  센서에 전원이 들어왔는가
   *   world.distance 물체까지의 실제 거리(cm)
   *   world.angle    'front' | 'tilt'
   *   world.material 'board' | 'cloth' | 'rough'
   *   world.seed     오차를 만드는 씨앗 (같으면 같은 값이 나온다)
   *
   * 돌려주는 것 : { ok, trace, console, pins, sensor, elapsed, stopped, error }
   *   sensor.pulses   [{ pin, t, us }]      — Trig 에 만들어진 펄스
   *   sensor.measures [{ t, duration, ok, reason, text, … }] — pulseIn 이 읽은 것
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: { modes: {}, values: {} },
        sensor: { pulses: [], measures: [], reads: 0, ok: false },
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var world = o.world || {};
    var wTrig = world.trigPin === undefined ? TRIG_PIN : world.trigPin;
    var wEcho = world.echoPin === undefined ? ECHO_PIN : world.echoPin;
    var wPowered = world.powered === false ? false : true;
    /**
     * ★★ world.distance 는 숫자 하나이거나 «바퀴마다의 배열» 이다.
     *
     *   배열을 주면 loop() 한 바퀴마다 다음 값을 쓴다 — 물체가 다가오다
     *   멀어지는 것을 한 번의 실행으로 보여 줄 수 있다(확장 활동이 이것을 쓴다).
     *   배열이 바퀴 수보다 짧으면 마지막 값을 그대로 이어 쓴다.
     *
     * ★ 숫자 하나를 주던 곳은 그대로 돌아간다 — 배열이 아닐 때는 예전과 같다.
     */
    var wDistanceList = Array.isArray(world.distance)
      ? world.distance.map(Number).filter(function (v) {
          return isFinite(v);
        })
      : null;
    var wDistanceOne =
      world.distance === undefined || wDistanceList
        ? PC.DIST_DEFAULT === undefined
          ? 20
          : PC.DIST_DEFAULT
        : Number(world.distance);

    /** 지금 바퀴에서 물체가 놓인 거리(cm) */
    function distanceNow() {
      if (!wDistanceList || wDistanceList.length === 0) return wDistanceOne;
      var i = Math.max(0, (state.iteration || 1) - 1);
      return wDistanceList[Math.min(i, wDistanceList.length - 1)];
    }
    var wAngle = world.angle || PC.DEFAULT_ANGLE || "front";
    var wMaterial = world.material || PC.DEFAULT_MATERIAL || "board";
    var wSeed = world.seed === undefined ? 1 : world.seed;

    function pinLabel(n) {
      return /^A\d$/.test(String(n)) ? String(n) : "D" + n;
    }

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      /** 배열은 변수와 따로 담는다 — notes[i] 처럼 대괄호로만 읽는다 */
      arrays: {},
      pinModes: {},
      pinValues: {},
      /** HIGH 로 올라간 시각(ms). LOW 로 내려올 때 펄스 길이를 잰다. */
      highSince: {},
      pulses: [],
      measures: [],
      trial: 0,
      lastMeasureT: 0,
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration
      });
    }

    /**
     * 시간을 흘려보낸다.
     *
     * 3차시에서는 여기서 «소리가 멎을 시각» 을 지나며 더해야 했지만
     * 이 차시에는 스스로 끝나는 것이 없다 — 펄스도 pulseIn 도 «명령으로» 끝난다.
     * 그래서 그냥 더한다. state.t 의 단위는 ms 이고 소수점을 허용한다(μs 를 담기 위해).
     */
    function advanceTime(ms) {
      state.t += Math.max(0, Number(ms) || 0);
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    /* ---------------------------------------------------------------- */
    /* ★★ 한 번의 «재기» — 이 차시의 알맹이                              */
    /* ---------------------------------------------------------------- */

    /**
     * pulseIn 이 불릴 때 실제로 일어나는 일을 흉내 낸다.
     *
     * 관문을 «차례대로» 지난다. 앞의 관문에서 걸리면 뒤는 보지 않는다 —
     * 원인이 여러 개로 보이면 학생이 어디를 고쳐야 할지 알 수 없다.
     *
     *   ① 전원      센서가 켜져 있는가
     *   ② Trig      펄스가 «제 핀» 으로, «OUTPUT» 으로, «10μs 이상» 나갔는가
     *   ③ Echo      «제 핀» 에서, «INPUT» 으로, «HIGH» 를 재고 있는가
     *   ④ 물체      측정 범위 안인가, 되돌아온 신호가 셀 만한가
     */
    function measure(readPin, wantHigh, line) {
      state.trial += 1;
      /* ★ 거리는 «이 바퀴» 의 것이다. 배열을 주면 바퀴마다 달라진다. */
      var dNow = distanceNow();
      var rec = {
        t: state.t,
        trial: state.trial,
        line: line,
        iteration: state.iteration,
        /** 물체가 실제로 놓인 거리(cm) — 학생이 화면에서 정한 값 */
        target: dNow,
        angle: wAngle,
        material: wMaterial,
        /** 실제로 만들어진 Trig 펄스의 길이(μs) */
        pulseUs: 0,
        /** pulseIn 이 돌려준 값(μs). 실패면 0 이다(실물과 같다). */
        duration: 0,
        /** 되돌아온 신호의 세기(0~1) */
        level: 0,
        /** 오차(cm) — 되돌아온 신호가 흔들린 만큼 */
        noise: 0,
        ok: false,
        reason: "",
        text: ""
      };

      function done(reason, text) {
        rec.reason = reason;
        rec.text = text;
        state.measures.push(rec);
        state.lastMeasureT = state.t;
        return rec;
      }

      /* ① 전원 */
      if (!wPowered) {
        return done(
          "no-power",
          "센서에 전원이 들어오지 않았습니다 — 회로의 VCC(5V) 와 GND 를 먼저 확인하세요."
        );
      }

      /* ② Trig — 펄스 발사 */
      var since = state.lastMeasureT;
      var fresh = state.pulses.filter(function (p) {
        return p.t >= since;
      });
      var mine = fresh.filter(function (p) {
        return String(p.pin) === String(wTrig);
      });

      if (mine.length === 0) {
        if (fresh.length > 0) {
          return done(
            "trig-pin",
            "펄스 발사 실패 — " + pinLabel(fresh[0].pin) + " 로 펄스를 보냈지만 센서 Trig 는 " +
              pinLabel(wTrig) + " 에 달려 있습니다."
          );
        }
        return done(
          "trig-missing",
          "펄스 발사 실패 — Trig 에 HIGH 펄스를 보내지 않았습니다. 재기 전에 " +
            pinLabel(wTrig) + " 를 HIGH 로 올렸다가 LOW 로 내려야 합니다."
        );
      }

      var pulse = mine[mine.length - 1];
      rec.pulseUs = pulse.us;

      if (state.pinModes[wTrig] !== "OUTPUT") {
        return done(
          "trig-mode",
          "펄스 발사 실패 — " + pinLabel(wTrig) + " 을 pinMode(…, OUTPUT) 으로 정하지 않아 " +
            "digitalWrite 가 실제로 전압을 내보내지 못합니다."
        );
      }
      if (pulse.us < TRIG_PULSE_US) {
        return done(
          "trig-short",
          "펄스 발사 실패 — 펄스가 " + pulse.us + "μs 뿐입니다. HC-SR04 는 " + TRIG_PULSE_US +
            "μs 이상이어야 «쏘라» 는 명령으로 알아챕니다."
        );
      }

      /* ③ Echo — 시간 읽기 */
      if (String(readPin) !== String(wEcho)) {
        return done(
          "echo-pin",
          "반사 시간 읽기 실패 — " + pinLabel(readPin) + " 에서 읽었지만 센서 Echo 는 " +
            pinLabel(wEcho) + " 에 달려 있습니다."
        );
      }
      var em = state.pinModes[wEcho];
      if (em !== "INPUT" && em !== "INPUT_PULLUP") {
        return done(
          "echo-mode",
          "반사 시간 읽기 실패 — " + pinLabel(wEcho) + " 을 pinMode(…, INPUT) 으로 정하지 않았습니다."
        );
      }
      if (!wantHigh) {
        return done(
          "echo-level",
          "반사 시간 읽기 실패 — Echo 는 초음파가 돌아오는 «동안» HIGH 로 있습니다. " +
            "pulseIn 의 두 번째 값을 HIGH 로 두세요."
        );
      }

      /* ④ 물체 */
      if (dNow < DIST_MIN) {
        return done(
          "too-close",
          "측정 실패 — 물체가 " + dNow + "cm 로 너무 가깝습니다. " + DIST_MIN +
            "cm 보다 가까우면 되돌아온 소리가 보낸 소리와 겹쳐 셀 수 없습니다."
        );
      }
      if (dNow > DIST_MAX) {
        return done(
          "too-far",
          "측정 실패 — 물체가 " + dNow + "cm 로 너무 멉니다. " + DIST_MAX +
            "cm 를 넘으면 되돌아오는 소리가 너무 약해집니다."
        );
      }

      var level = echoLevel(dNow, wAngle, wMaterial);
      rec.level = Math.round(level * 100) / 100;
      if (level < ECHO_FAIL_LEVEL) {
        var a = PC.angleOf ? PC.angleOf(wAngle) : { label: wAngle };
        var m = PC.materialOf ? PC.materialOf(wMaterial) : { label: wMaterial };
        return done(
          "weak",
          "측정 실패 — 되돌아온 신호가 너무 약합니다(" + Math.round(level * 100) + "%). " +
            m.label + " · " + a.label + " 조합에서는 소리가 흩어지거나 흡수됩니다. " +
            "pulseIn 은 기다리다 포기하고 0 을 돌려줍니다."
        );
      }

      /* ⑤ 성공 — 여기서만 시간이 만들어진다 */
      var noise = noiseFor(dNow, wAngle, wMaterial, state.trial, wSeed);
      rec.noise = noise;
      var seen = Math.max(DIST_MIN, dNow + noise);
      rec.duration = Math.round((2 * seen) / SOUND_SPEED);
      rec.ok = true;
      return done(
        "ok",
        "왕복 시간 " + rec.duration + "μs — " + dNow + "cm 에 놓인 물체까지 갔다가 돌아온 시간입니다."
      );
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "index": {
          var arr = state.arrays[node.name];
          if (!arr) {
            throw new StopRun("배열 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
          }
          var at = Math.floor(Number(evaluate(node.index)));
          if (!(at >= 0 && at < arr.length)) {
            throw new StopRun(
              node.name + " 에는 값이 " + arr.length + "개뿐인데 " + at + "번째를 읽으려 했습니다. " +
                "칸 번호는 0 부터 " + (arr.length - 1) + " 까지입니다. (" + node.line + "번 줄)"
            );
          }
          return arr[at];
        }
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          state.out.push({
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          });
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] =
            node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, pinLabel(args[0]) + " → " + state.pinModes[args[0]]);
          return 0;

        /**
         * ★ 펄스는 «HIGH 로 올렸다가 LOW 로 내릴 때» 한 번으로 센다.
         *   그 사이에 흐른 시간이 곧 펄스의 길이다. delayMicroseconds 로 10μs 를 두면
         *   10μs 펄스가 되고, 실수로 delay 로 두면 10000μs 펄스가 된다.
         *   두 경우가 서로 다른 값으로 남아야 검사가 그것을 짚어 줄 수 있다.
         */
        case "digitalWrite": {
          var wpin = args[0];
          var value = args[1] ? 1 : 0;
          var before = state.pinValues[wpin];
          state.pinValues[wpin] = value;

          if (value === 1 && before !== 1) {
            state.highSince[wpin] = state.t;
          } else if (value === 0 && before === 1 && state.highSince[wpin] !== undefined && state.highSince[wpin] !== null) {
            var us = Math.round((state.t - state.highSince[wpin]) * 1000);
            state.pulses.push({ pin: wpin, t: state.highSince[wpin], us: us, line: node.line });
            state.highSince[wpin] = null;
            record("pulse-out", node.line, pinLabel(wpin) + " 펄스 " + us + "μs");
          }
          record("pin-write", node.line, pinLabel(wpin) + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, pinLabel(args[0]) + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        /**
         * ★★ pulseIn(핀, HIGH) — 이 차시의 주인공.
         *
         *   돌려주는 것은 «거리» 가 아니라 그 핀이 HIGH 였던 «시간(μs)» 이다.
         *   그리고 그 시간만큼 실제로 «기다린다» — 재는 동안 프로그램은 멈춘다.
         *   실패하면 실물처럼 0 을 돌려주고, 포기하기까지 기다린 시간만 흐른다.
         */
        case "pulseIn": {
          var readPin = args[0];
          var wantHigh = node.args.length >= 2 ? (args[1] ? true : false) : true;
          var rec = measure(readPin, wantHigh, node.line);
          advanceTime((rec.duration > 0 ? rec.duration : PULSE_TIMEOUT_US) / 1000);
          record(
            "pulse-in",
            node.line,
            pinLabel(readPin) + " → " + (rec.duration > 0 ? rec.duration + "μs" : "0 (" + rec.reason + ")")
          );
          return rec.duration;
        }

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          advanceTime(ms);
          record("delay", node.line, String(ms));
          return 0;
        }

        /** μs 단위로 기다린다 — 10μs 펄스를 만드는 데 쓴다 (명세 4장) */
        case "delayMicroseconds": {
          var dus = Math.max(0, Number(args[0]) || 0);
          advanceTime(dus / 1000);
          record("delay-us", node.line, String(dus));
          return 0;
        }

        case "millis":
          return Math.floor(state.t);

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "declare-array":
          state.arrays[stmt.name] = (stmt.items || []).map(function (item) {
            return evaluate(item);
          });
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        case "for": {
          if (stmt.init) execStatement(stmt.init);
          while (stmt.cond === null || evaluate(stmt.cond)) {
            state.steps += 1;
            if (state.steps > stepLimit) throw new StopRun("steps");
            execBlock(stmt.body);
            if (stmt.step) execStatement(stmt.step);
          }
          return;
        }
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        if (g.kind === "declare-array") {
          state.arrays[g.name] = (g.items || []).map(function (item) {
            return evaluate(item);
          });
          return;
        }
        state.vars[g.name] = g.init ? evaluate(g.init) : 0;
      });

      state.phase = "setup";
      record("phase", ast.functions.setup ? ast.functions.setup.line : 0, "setup() 시작");
      if (ast.functions.setup) execBlock(ast.functions.setup.body);
      record("phase-end", 0, "setup() 끝 — 여기까지는 «한 번만» 실행됩니다.");

      state.phase = "loop";
      if (ast.functions.loop) {
        for (var i = 0; i < loopLimit; i += 1) {
          state.iteration = i + 1;
          record("phase", ast.functions.loop.line, "loop() " + (i + 1) + "번째");
          execBlock(ast.functions.loop.body);
        }
        stopped = "loop-limit";
      }
    } catch (err) {
      if (err && err.name === "StopRun") {
        stopped = err.reason === "steps" ? "step-limit" : "runtime";
        if (err.reason !== "steps") error = { line: 0, message: err.reason, code: "runtime" };
      } else {
        stopped = "runtime";
        error = { line: 0, message: "실행 중 문제가 생겼습니다.", code: "runtime" };
      }
    }

    var okReads = state.measures.filter(function (m) {
      return m.ok;
    });

    return {
      ok: error === null,
      trace: state.trace,
      console: state.out,
      pins: { modes: state.pinModes, values: state.pinValues },
      serial: state.serial,
      sensor: {
        trigPin: wTrig,
        echoPin: wEcho,
        powered: wPowered,
        distance: wDistanceList || wDistanceOne,
        angle: wAngle,
        material: wMaterial,
        seed: wSeed,
        pulses: state.pulses,
        measures: state.measures,
        reads: state.measures.length,
        okReads: okReads.length,
        ok: okReads.length > 0
      },
      elapsed: state.t,
      stopped: stopped,
      error: error
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 실행 결과 읽기 — 5단계 관찰 기록과 형성평가에 쓴다                   */
  /* ------------------------------------------------------------------ */

   *   지키는 것 : 대소문자 · 괄호 · 세미콜론 · 두 줄의 순서
   *   봐주는 것 : 줄바꿈, 들여쓰기, 낱말 사이 공백, 문자열 안의 작은 공백 차이

   *     'pinMode( 13 , OUTPUT );  Serial.print( "안녕 하세요" );'
   *       → 'pinMode(13,OUTPUT);\nSerial.print("안녕하세요");'
   */
  function canonicalCode(source) {
    var text = String(source === null || source === undefined ? "" : source);
    var out = "";
    var i = 0;
    var inString = false;

    while (i < text.length) {
      var ch = text.charAt(i);

      if (!inString) {
        /* 주석은 통째로 버린다 */
        if (ch === "/" && text.charAt(i + 1) === "/") {
          while (i < text.length && text.charAt(i) !== "\n") i += 1;
          continue;
        }
        if (ch === "/" && text.charAt(i + 1) === "*") {
          i += 2;
          while (i < text.length && !(text.charAt(i) === "*" && text.charAt(i + 1) === "/")) i += 1;
          i += 2;
          continue;
        }
        if (/\s/.test(ch)) {
          i += 1;
          continue;
        }
        if (ch === '"') {
          inString = true;
          out += ch;
          i += 1;
          continue;
        }
        out += ch;
        i += 1;
        continue;
      }

      /* 문자열 안 : 공백만 걷어 내고 나머지는 그대로 (명세 12장) */
      if (ch === '"') {
        inString = false;
        out += ch;
        i += 1;
        continue;
      }
      if (/\s/.test(ch)) {
        i += 1;
        continue;
      }
      out += ch;
      i += 1;
    }

    /* 문장마다 줄을 바꾼다 — 순서는 지키고 줄바꿈 차이는 없앤다.
     *
     * ★ 세미콜론이 «있었는지» 를 지켜야 한다(명세 12장).
     *   그냥 ";" 로 자르고 모든 조각에 ";" 를 다시 붙이면
     *   마지막 줄에 세미콜론을 빠뜨린 답까지 정답으로 봐주게 된다.
     *   그래서 마지막 조각은 세미콜론이 붙어 있던 것만 «문장» 으로 센다. */
    var pieces = out.split(";");
    var trailing = pieces.pop(); /* 마지막 ";" «뒤» 에 남은 글 — 세미콜론이 없던 부분이다 */

    var statements = pieces
      .map(function (part) {
        return part.trim();
      })
      .filter(function (part) {
        return part.length > 0;
      })
      .map(function (part) {
        return part + ";";
      });

    if (String(trailing).trim().length > 0) statements.push(String(trailing).trim());
    return statements.join("\n");

  /** 객관식 답을 다듬는다 — 고르지 않았으면 빈 문자열 */
  function canonicalChoice(value) {
    if (value === null || value === undefined || value === "") return "";
    var n = Number(value);
    return isNaN(n) ? "" : String(n);

  /** 문항 하나의 답을 «비교용 모양» 으로 */
  function canonicalAnswer(question, value) {
    if (!question) return "";
    return question.type === "code" ? canonicalCode(value) : canonicalChoice(value);
  }

  /** 소금을 섞어 해시한다 — 같은 답이라도 문항이 다르면 값이 다르다 */
  function fingerprint(questionId, canonical) {
    return sha256(SALT + "|" + questionId + "|" + canonical);
  }

  /** 문항 하나 채점 */
  function isCorrect(question, value) {
    if (!question) return false;
    var canon = canonicalAnswer(question, value);
    if (!canon) return false;
    var expected = SEALED.answers[question.id];
    if (!expected) return false;
    var got = fingerprint(question.id, canon);
    return (Array.isArray(expected) ? expected : [expected]).indexOf(got) !== -1;
  }

  /** 답을 하나라도 적었는가 */
  function isAnswered(question, value) {
    return canonicalAnswer(question, value) !== "";
  }

  /**
   * 다섯 문항을 한꺼번에 채점한다 (명세 9.1)
   * answers 는 { q1: 2, q2: 1, ..., q5: "..." } 모양이다.
   */
  function gradeAll(answers) {
    var a = answers || {};
    var results = QUESTIONS.map(function (q) {
      var value = a[q.id];
      var ok = isCorrect(q, value);
      return {
        id: q.id,
        no: q.no,
        answered: isAnswered(q, value),
        correct: ok,
        points: ok ? q.points : 0
      };
    });

    var score = results.reduce(function (sum, r) {
      return sum + r.points;
    }, 0);
    var answeredCount = results.filter(function (r) {
      return r.answered;
    }).length;

    return {
      results: results,
      isCorrect: results.map(function (r) {
        return r.correct;
      }),
      answeredCount: answeredCount,
      allAnswered: answeredCount === QUESTIONS.length,
      score: score,
      total: QUESTIONS.reduce(function (s, q) {
        return s + q.points;
      }, 0),
      pass: score >= ((PCroot.ASSESS && PCroot.ASSESS.passScore) || 6)

  /* ================================================================== */
  /* 5. 해설 열기 — 다섯 문항을 모두 푼 뒤에만 (명세 9.1)                   */
  /* ================================================================== */

  /**
   * 객관식 정답 번호를 되찾는다.
   * 보기가 다섯 개뿐이므로 하나씩 해시를 맞춰 보면 어느 것이 정답인지 알 수 있다.
   * 이 되찾기는 «해설을 풀 열쇠» 를 만들기 위한 것이다.
   */
  function recoverChoiceIndex(question) {
    for (var i = 0; i < question.choices.length; i += 1) {
      if (isCorrect(question, i)) return i;
    }
    return -1;
  }

  /** 해설을 잠근 열쇠 — 객관식 네 문항의 정답에서 만들어진다 */
  function revealKey() {
    var parts = QUESTIONS.filter(function (q) {
      return q.type === "choice";
    }).map(function (q) {
      return recoverChoiceIndex(q);
    });
    if (parts.indexOf(-1) !== -1) return "";
    return sha256(SALT + "|reveal|" + parts.join(","));
  }

  /**
   * 채점 결과와 해설을 함께 돌려준다.
   * 다섯 문항을 모두 풀지 않았으면 «해설 없이» 돌려준다(명세 9.1).
   */
  function reveal(answers) {
    var graded = gradeAll(answers);
    if (!graded.allAnswered) {
      return {
        allowed: false,
        reason: "다섯 문항에 모두 답해야 정답과 해설이 열립니다.",
        graded: graded,
        items: []
      };
    }

    var key = revealKey();
    var items = QUESTIONS.map(function (q, i) {
      var answerText = "";
      if (q.type === "choice") {
        var idx = recoverChoiceIndex(q);
        answerText = idx >= 0 ? "제" + (idx + 1) + "번 — " + q.choices[idx] : "";
      } else {
        answerText = key ? unlock(SEALED.model[q.id] || "", key) : "";
      }
      return {
        id: q.id,
        no: q.no,
        stem: q.stem,
        correct: graded.isCorrect[i],
        yourAnswer: answers ? answers[q.id] : "",
        answerText: answerText,
        answerIndex: q.type === "choice" ? recoverChoiceIndex(q) : -1,
        explanation: key ? unlock(SEALED.explanations[q.id] || "", key) : ""
      };
    });

    return { allowed: true, reason: "", graded: graded, items: items };
  }

  /* ================================================================== */
  /* 6. 5번 문항 도우미 — 정답을 알려 주지 않는 «문법만» 안내               */
  /* ================================================================== */

  /**
   * 채점 전에 줄 수 있는 도움은 «문법» 까지다. 무엇을 적어야 하는지는 말하지 않는다.
   * 돌려주는 것 : [{ level:'warn'|'info', message }]
   */
  function lintCodeAnswer(value) {
    var text = String(value || "").trim();
    var notes = [];
    if (!text) return notes;

    var statements = canonicalCode(text).split("\n").filter(Boolean);

    /* 세미콜론 — 다듬은 결과가 원문의 «줄 수» 보다 적으면 빠뜨린 것이다 */
    var rawLines = text.split("\n").filter(function (l) {
      return l.trim().length > 0;
    });
    if (statements.length < rawLines.length) {
      notes.push({ level: "warn", message: "줄 끝의 세미콜론(;) 을 빠뜨린 줄이 있는지 살펴보세요." });
    }

    /* 괄호 짝 */
    var open = (text.match(/\(/g) || []).length;
    var close = (text.match(/\)/g) || []).length;
    if (open !== close) {
      notes.push({ level: "warn", message: "괄호 ( ) 의 짝이 맞지 않습니다. 여는 괄호 " + open + "개, 닫는 괄호 " + close + "개." });
    }

    /* 따옴표 짝 */
    if ((text.match(/"/g) || []).length % 2 !== 0) {
      notes.push({ level: "warn", message: '큰따옴표(") 의 짝이 맞지 않습니다.' });
    }

    /* ★ 몇 줄을 적는 문제인지는 문항 자료(q5.lines)에서 읽는다.
       숫자를 여기에 손으로 적어 두면 문항을 고칠 때 함께 어긋난다. */
    var want = 3;
    QUESTIONS.forEach(function (q) {
      if (q.type === "code" && q.lines) want = q.lines;
    });
    if (statements.length > 0 && statements.length !== want) {
      notes.push({
        level: "info",
        message:
          want + "줄로 적는 문제입니다. 지금은 " + statements.length + "개의 문장이 적혀 있습니다."
      });
    }

    return notes;
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.quiz = {
    QUESTIONS: QUESTIONS,
    SALT: SALT,
    SEALED: SEALED,
    /* 암호 도구 — seal 도구와 테스트가 같은 함수를 쓴다 */

    canonicalCode: canonicalCode,
    canonicalAnswer: canonicalAnswer,
    fingerprint: fingerprint,
    isCorrect: isCorrect,
    isAnswered: isAnswered,
    gradeAll: gradeAll,
    reveal: reveal,
    revealKey: revealKey,
    recoverChoiceIndex: recoverChoiceIndex,
    lintCodeAnswer: lintCodeAnswer,
    byId: function (id) {
      var found = null;
      QUESTIONS.forEach(function (q) {
        if (q.id === id) found = q;
      });
      return found;
    }
  };

 * 제출 자료의 «모양» 과 검사 규칙 (명세 5장 · 7장 · 13장)
 *
 * 학생용은 이 파일로 보낼 자료를 만들고, 교사용은 이 파일로 받은 자료를 읽는다.
 * 항목 이름이 한 곳에만 적혀 있으므로 두 앱의 필드가 어긋날 수 없다.
 *
 * 여기에는 화면 그리는 코드가 없다. 순수한 계산만 있어서 테스트로 바로 확인할 수 있다.
 *
 * ★ 명세 7장의 항목 이름을 «그대로» 쓴다.
 *     circuit    : connections · attempts · errors · dangerEvents · completed
 *     code       : source · testsPassed · testsTotal · attempts · errors · history
 *     experiment : conditions · observations
 *     assessment : answers · isCorrect · score · total · pass · attempts
 *   그 위에 이 차시에만 필요한 칸을 «덧붙인다». 명세의 칸을 지우거나 이름을 바꾸지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});

  var LIMITS = PC.LIMITS || {};
  var SCHEMA_VERSION = PC.SCHEMA_VERSION || 1;
  var LESSON_ID = PC.LESSON_ID || "physical_4";

  /* ------------------------------------------------------------------ */
  /* 작은 도구                                                            */
  /* ------------------------------------------------------------------ */

  function text(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  /** 너무 긴 입력은 잘라 낸다(통신량과 저장 파일 크기 보호) */
  function clip(value, max) {
    var s = text(value);
    var limit = max || LIMITS.textMax || 1000;
    return s.length > limit ? s.slice(0, limit) : s;
  }

  /** 공백을 뺀 «내용 글자 수». 스페이스만 눌러 글자 수를 채우지 못하게 한다. */
  function contentLength(value) {
    return text(value).replace(/\s+/g, "").length;
  }

  function num(v) {
    var n = Number(v);
    return isNaN(n) ? 0 : n;
  }

  /** 소수점 두 자리까지만 — 통신량을 줄이고 표가 흔들리지 않게 한다 */
  function round2(v) {
    return Math.round(num(v) * 100) / 100;
  }

  function isRange(n, min, max) {
    return typeof n === "number" && !isNaN(n) && n >= min && n <= max;
  }

  /* ------------------------------------------------------------------ */
  /* 학생 정보                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 학번을 학년·반·번호로 가른다.  "10312" → { grade:1, classNumber:3, studentNumber:12 }
   * 다섯 자리가 아니거나 범위를 벗어나면 null. (명세 5장 «학번은 5자리 숫자»)
   */
  function parseStudentId(value) {
    var s = text(value);
    var digits = LIMITS.studentIdDigits || 5;
    if (!new RegExp("^\\d{" + digits + "}$").test(s)) return null;

    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, 3), 10);
    var studentNumber = parseInt(s.slice(3, 5), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};
    var digits = LIMITS.studentIdDigits || 5;

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== digits) {
      errors.studentId = "학번은 " + digits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro": {
        /* 명세 5장 1단계 통과 조건 : «확인 질문 완료».
           안전 수칙 확인도 함께 본다(명세 6.1 세 번째 줄). */
        var intro = s.intro || {};
        if (intro.checkAnswered !== true) {
          reasons.push("확인 질문에 답해 주세요 — 센서는 물체를 «보는» 걸까요, 시간을 «재는» 걸까요?");
        }
        if (intro.safetyRead !== true) reasons.push("안전 수칙을 읽고 확인해 주세요.");
        break;
      }

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3;
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        var c = s.circuit || {};
        if (c.findDone !== true) reasons.push("부품과 단자 찾기(3A)를 마쳐 주세요.");
        if (c.checkPassed !== true) reasons.push("[회로 점검] 의 여섯 항목을 모두 채워 주세요.");
        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 번의 «재기» 가 끝나는 것을 관찰해 주세요.");
          break;
        }
        /**
         * ★ 조립과 빈칸을 «둘 다» 마쳐야 한다 (3차시에서 정한 규칙을 그대로 지킨다).
         *
         *   방식을 하나 고르고 끝내면, 고르지 않은 쪽의 학습이 통째로 빠진다.
         *   조립은 «차례» 를 익히는 것이고 빈칸은 «줄을 직접 적는» 것이라
         *   배우는 것이 서로 다르다. 전체 편집은 그대로 «해 보고 싶은 사람» 의 자리다.
         */
        var totalTests = (PC.arduino && PC.arduino.TESTS ? PC.arduino.TESTS.length : 10);
        if (code.assembleDone !== true) {
          reasons.push("[① 코드 조립] 을 완성해 주세요 — " + totalTests + "항목을 모두 통과해야 합니다.");
        }
        if (code.blanksDone !== true) {
          reasons.push("[② 빈칸 채우기] 를 완성해 주세요 — " + totalTests + "항목을 모두 통과해야 합니다.");
        }

        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " + (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★★ 2026-08-22 에 바뀐 자리다.
         *
         *   본래는 명세 5장의 «세 실험(10·20·30cm)과 관찰 기록 완료» 였다.
         *   그 블럭을 화면에서 걷어 내라는 지시를 받아 지웠으므로(5단계 ②),
         *   그것을 그대로 요구하면 5단계를 지날 «길이 없다».
         *
         *   그래서 남은 실험 자리인 «조건 바꾸기» 로 옮겼다. 배우는 것은 같다 —
         *   조건을 바꾸어 재고, 무엇이 달라졌는지 적는 것이다.
         *
         *   ① 미리 짜 둔 조합 가운데 «둘 이상» 을 재 본다.
         *      하나만 재면 견줄 것이 없다. 기준과 바꾼 것, 적어도 둘이다.
         *   ② 알게 된 것을 적는다(관찰 최소 길이는 그대로 쓴다).
         *
         *   ★ 주차 경고 장치 구상은 여전히 통과 조건이 «아니다» —
         *     명세 6.5 가 「구상하게 하되 강제하지 않는다」 고 했다.
         */
        var e = s.experiment || {};
        var trials = e.trials || {};
        var combos = (PC.lesson && PC.lesson.CONDITIONS) || [];
        var MIN_TRIALS = 2;

        var ranCount = 0;
        combos.forEach(function (item) {
          var t = trials[item.id] || {};
          if (t.ran === true) ranCount += 1;
        });

        if (ranCount < MIN_TRIALS) {
          reasons.push(
            "조건을 바꾸어 " + MIN_TRIALS + "가지 이상 재 보세요. (지금 " + ranCount + "가지) " +
              "기준과 바꾼 것을 함께 재야 견줄 수 있습니다."
          );
        }
        if (contentLength(e.conditionNote) < (LIMITS.observationMin || 10)) {
          reasons.push(
            "[조건을 바꾸어 보고 알게 된 것] 을 " +
              (LIMITS.observationMin || 10) +
              "자 이상 적어 주세요."
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건을 충족한 경우만 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 7장)                                           */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.3) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /** 회로 판정 결과를 제출용으로 — 교사 화면이 이것 하나로 «무엇이 어떻게 틀렸나» 를 읽는다 */
  function cleanWiring(w) {
    if (!w) return null;
    return {
      vccOk: w.vccOk === true,
      gndOk: w.gndOk === true,
      trigOk: w.trigOk === true,
      echoOk: w.echoOk === true,
      /* 실제로 이어진 신호 핀 이름 — 「코드 D8, 회로 D6」 같은 진단의 바탕 */
      trigWired: Array.isArray(w.trigWired) ? w.trigWired.slice(0, 4).map(text) : [],
      echoWired: Array.isArray(w.echoWired) ? w.echoWired.slice(0, 4).map(text) : [],
      powerReversed: w.powerReversed === true,
      signalSwapped: w.signalSwapped === true,
      signalOnPower: w.signalOnPower === true,
      shortCircuit: w.shortCircuit === true,
      legsShorted: Array.isArray(w.legsShorted) ? w.legsShorted.length : 0
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 7장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, total: 10, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    var measures = (PC.lesson && PC.lesson.MEASURES) || [];
    var conditionSet = (PC.lesson && PC.lesson.CONDITIONS) || [];
    var runs = experiment.runs || {};
    var trials = experiment.trials || {};

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* ── 3단계 — 회로 (명세 7장) ─────────────────────────────────── */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: num(circuit.attempts),
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        /** ★ 명세 7장이 콕 집어 요구한 칸 — 위험 연결이 «언제 몇 번» 났는가 */
        dangerEvents: (circuit.dangerEvents || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 이 차시에만 있는 칸 — 네 단자가 어디에 닿았는가 */
        wiring: cleanWiring(circuit.wiring)
      },

      /* ── 4단계 — 코드 (명세 7장) ─────────────────────────────────── */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        /** ★ 명세 7장 — 문법 오류와 핀 불일치를 한 배열에 모은다 */
        errors: (code.errors || []).slice(0, 30).map(function (e) {
          return {
            kind: text(e.kind) || "syntax",
            line: num(e.line),
            message: clip(e.message, 200)
          };
        }),
        /** ★ 명세 7장 — 통과 항목 수가 «어떻게 늘어갔는가» */
        history: (code.history || []).slice(-30).map(function (h) {
          return { at: text(h.at), mode: text(h.mode), passed: num(h.passed), total: num(h.total) };
        }),
        mode: text(code.mode),
        /* 마지막으로 코드가 정한 핀 — 교사 화면의 «핀 오류» 칸이 읽는다 */
        trigPin: code.trigPin === null || code.trigPin === undefined ? null : num(code.trigPin),
        echoPin: code.echoPin === null || code.echoPin === undefined ? null : num(code.echoPin),
        trigMode: text(code.trigMode),
        echoMode: text(code.echoMode)
      },

      /* ── 5단계 — 실험 (명세 7장 · 6.5) ───────────────────────────── */
      experiment: {
        /**
         * 명세 7장의 conditions 하나로 «거리 재기» 와 «조건 바꾸기» 를 함께 담는다.
         * kind 로 갈라 놓으므로 교사 화면이 둘을 따로 볼 수 있다.
         */
        conditions: measures
          .filter(function (item) {
            return runs[item.id];
          })
          .map(function (item) {
            var r = runs[item.id] || {};
            return {
              kind: "distance",
              id: item.id,
              label: clip(item.label, 60),
              /* 실제로 놓은 거리(cm) */
              distance: num(item.distance),
              angle: text(r.angle) || (PC.DEFAULT_ANGLE || "front"),
              material: text(r.material) || (PC.DEFAULT_MATERIAL || "board"),
              ran: r.ran === true,
              /* 시뮬레이터가 돌려준 왕복 시간과 학생 코드가 계산한 거리 */
              duration: num(r.duration),
              measured: round2(r.measured),
              error: round2(r.error),
              ok: r.ok === true,
              reason: text(r.reason)
            };
          })
          .concat(
            conditionSet
              .filter(function (item) {
                return trials[item.id];
              })
              .map(function (item) {
                var r = trials[item.id] || {};
                return {
                  kind: "condition",
                  id: item.id,
                  label: clip(item.label, 60),
                  distance: num(r.distance) || num(item.distance),
                  angle: text(item.angle),
                  material: text(item.material),
                  ran: r.ran === true,
                  duration: num(r.duration),
                  measured: round2(r.measured),
                  error: round2(r.error),
                  ok: r.ok === true,
                  reason: text(r.reason)
                };
              })
          ),

        observations: measures
          .filter(function (item) {
            return runs[item.id];
          })
          .map(function (item) {
            var r = runs[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax)
            };
          })
          .concat(
            text(experiment.conditionNote)
              ? [{ id: "conditions", predict: "", observation: clip(experiment.conditionNote, LIMITS.textMax) }]
              : []
          ),

        /**
         * 확장 활동 — 주차 경고 장치 구상 (명세 6.5 마지막 줄).

          parts: clip(experiment.extensionParts, LIMITS.textMax),
          threshold: num(experiment.extensionThreshold),
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          testsPassed: num(experiment.extensionPassed),
          testsTotal: num(experiment.extensionTotal)

      /* ── 6단계 — 형성평가 (명세 7장) ─────────────────────────────── */
      assessment: {

          var v = answers[q.id];

            no: q.no,

  /**

   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverCreatedAt: text(r.serverCreatedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        dangerEvents: Array.isArray(circuit.dangerEvents) ? circuit.dangerEvents : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        wiring: cleanWiring(circuit.wiring)
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        errors: Array.isArray(code.errors) ? code.errors : [],
        history: Array.isArray(code.history) ? code.history : [],
        mode: text(code.mode),
        trigPin: code.trigPin === null || code.trigPin === undefined ? null : num(code.trigPin),
        echoPin: code.echoPin === null || code.echoPin === undefined ? null : num(code.echoPin),
        trigMode: text(code.trigMode),
        echoMode: text(code.echoMode)
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        extension: experiment.extension || { tried: false, condition: "", parts: "", source: "" }
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 (명세 9장) */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    round2: round2,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    cleanWiring: cleanWiring,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();
    </script>

(function () {

      circuit: {

        assembleOrder: [],
        blanks: {},

        assembleDone: false,

       *            ★ 이 셋이 통과 조건이다.

      experiment: {

        extensionTried: false,

         참이 되면 답을 고칠 수 없고, 그때 비로소 [채점하기] 가 열린다.

      assessment: { answers: {}, attempts: 0, graded: false, sealed: false },

  function bool(value) {

    return isNaN(n) ? 0 : n;
  }

  function str(value) {

  function plainObject(value) {

  function normalizeState(raw) {
    var base = emptyState();
    var r = plainObject(raw);
    var steps = PC.STEPS || [];
    var dMin = PC.DIST_MIN === undefined ? 2 : PC.DIST_MIN;
    var dMax = PC.DIST_MAX === undefined ? 400 : PC.DIST_MAX;

    base.step = num(r.step);
    if (base.step < 0 || base.step >= steps.length) base.step = 0;

    base.student.studentId = str(student.studentId);
    base.student.name = str(student.name);

    base.intro.safetyRead = bool(intro.safetyRead);
    base.intro.checkAnswered = bool(intro.checkAnswered);

    base.concept.opened = plainObject(concept.opened);

    base.concept.checks = plainObject(concept.checks);

    var circuit = plainObject(r.circuit);
    base.circuit.findIndex = num(circuit.findIndex);
    base.circuit.findDone = bool(circuit.findDone);
    base.circuit.findAttempts = num(circuit.findAttempts);
    base.circuit.connections = array(circuit.connections)
      .map(function (c) {
        var conn = plainObject(c);
        return PC.circuit.makeConnection(
          { component: str(conn.fromComponent), pin: str(conn.fromPin) },
          { component: str(conn.toComponent), pin: str(conn.toPin) },
          str(conn.color) || null

      .filter(Boolean);
    base.circuit.attempts = num(circuit.attempts);
    base.circuit.errors = array(circuit.errors);
    base.circuit.dangerEvents = array(circuit.dangerEvents);
    base.circuit.hintsUsed = num(circuit.hintsUsed);
    base.circuit.hintLevels = plainObject(circuit.hintLevels);
    base.circuit.findPicks = plainObject(circuit.findPicks);
    base.circuit.checkPassed = bool(circuit.checkPassed);
    base.circuit.checked = bool(circuit.checked);
    base.circuit.powerOn = bool(circuit.powerOn);
    base.circuit.wiring = circuit.wiring || null;

    var code = plainObject(r.code);
    base.code.exampleRun = bool(code.exampleRun);
    /**
     * ★ 미리 정한 셋 가운데 하나여야 한다 — 저장된 값이 엉뚱하면 처음 값으로 되돌린다.

     * ★★ «있는가» 를 먼저 본다. 0 은 고를 수 있는 값이면서 num(undefined) 의

    base.code.demoDistance =

    base.code.blanksDone = bool(code.blanksDone);
    base.code.blanks = plainObject(code.blanks);

    base.code.trigPin = code.trigPin === null || code.trigPin === undefined ? null : num(code.trigPin);
    base.code.echoPin = code.echoPin === null || code.echoPin === undefined ? null : num(code.echoPin);
    base.code.trigMode = str(code.trigMode);
    base.code.echoMode = str(code.echoMode);

    var experiment = plainObject(r.experiment);
    base.experiment.distance = clamp(experiment.distance, dMin, dMax, base.experiment.distance);
    base.experiment.angle = PC.angleOf ? PC.angleOf(str(experiment.angle)).id : base.experiment.angle;
    base.experiment.material = PC.materialOf
      ? PC.materialOf(str(experiment.material)).id
      : base.experiment.material;

    var runs = plainObject(experiment.runs);
    base.experiment.runs = {};
    Object.keys(runs).forEach(function (id) {
      var item = plainObject(runs[id]);
      base.experiment.runs[id] = {

        ran: bool(item.ran),
        duration: num(item.duration),
        measured: num(item.measured),
        error: num(item.error),
        ok: bool(item.ok),
        reason: str(item.reason),
        angle: str(item.angle) || base.experiment.angle,

    var trials = plainObject(experiment.trials);
    base.experiment.trials = {};
    Object.keys(trials).forEach(function (id) {
      var item = plainObject(trials[id]);
      base.experiment.trials[id] = {
        ran: bool(item.ran),
        distance: num(item.distance),
        duration: num(item.duration),
        measured: num(item.measured),
        error: num(item.error),
        ok: bool(item.ok),

    base.experiment.lastRun = experiment.lastRun || null;
    base.experiment.extensionTried = bool(experiment.extensionTried);

    var assessment = plainObject(r.assessment);
    base.assessment.answers = plainObject(assessment.answers);
    base.assessment.attempts = num(assessment.attempts);

    if (base.submitted) base.assessment.sealed = true;

    if (!base.assessment.sealed) base.assessment.graded = false;

    /* ★ 전원은 «켰다» 는 기록만으로 유지하지 않는다.
       전원을 켠 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 켜져 있어서는 안 된다.
       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다.

    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    if (state.circuit.connections.length > 0) return true;
    if (state.code.source) return true;
    if (Object.keys(state.experiment.runs || {}).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.intro.safetyRead || state.intro.checkAnswered) return true;
    if (Object.keys(state.concept.checks).length > 0) return true;
    return false;
  }

  /** 시각을 「2026-08-18 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())

/**

 *

 *   · 정답/오답·위험은 색이 아니라 «아이콘 + 글자» 로도 알린다
 *   · 터치 영역은 최소 44px

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /* 화면이 없는 곳(테스트)에서는 이 파일이 하는 일이 없다 */
  if (typeof document === "undefined") return;

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return (prefix || "f") + "-" + uid;
  }

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  /**
   * 요소 하나를 만든다.
   *   el("p", { class: "note", text: "안녕" })

        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      node.setAttribute(k, String(v));
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });

    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));

    if (head.length) parts.push(el("div", { class: "card__head" }, head));
    parts.push(el("div", { class: "card__body" }, children || []));

  }

  /** 코드 상자 — 들여쓰기와 줄바꿈을 그대로 지킨다 */

    /* ★ o.strong 을 주면 도드라진 꼴이 된다 — 접힌 채로도 눈에 들어와야 하는 것에 쓴다 */

  /**

      : el("input", {
          class: "input" + (s.mono ? " input--mono" : ""),

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,

        el(
          "p",
          { class: "modal__text" },

          })
        ),
        el("div", { class: "modal__actions" }, [
          button(s.cancelLabel || "취소", {
            class: "btn btn--ghost",
            click: function () {
              done("cancel");
            }
          }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });

      if (box.parentNode) box.parentNode.removeChild(box);

  }

    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();

    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical4-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];

  function removePending(payload) {

    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));

    loadStudent: loadStudent,

    clearDraft: clearDraft,

    removePending: removePending,

    _readJson: readJson,
