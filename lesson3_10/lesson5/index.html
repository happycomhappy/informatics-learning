    <script data-from="student/s90-app.js">
/**
 * 학생용 앱 (명세 5장)
 *
 * 하는 일
 *   · 여섯 단계 스테퍼를 그리고 «통과 조건» 에 따라 다음 단계를 연다
 *   · 화면을 다시 그린다
 *   · 바뀔 때마다 localStorage 에 저장한다 (새로고침해도 이어서 할 수 있게)
 *
 * 이전 단계로는 «언제나» 갈 수 있다. 다음 단계는 조건을 채워야 열린다(명세 5장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;

  var state = S.emptyState();

  var screenRoot = null;
  var navArea = null;
  var bannerArea = null;

  /* ------------------------------------------------------------------ */
  /* 상태 고치기                                                          */
  /* ------------------------------------------------------------------ */

  function save() {
    S.store.saveDraft(state);
  }

  /** 상태를 고치고 저장만 한다 — 글을 쓰는 중에 화면이 튀지 않게 */
  function patch(mutator) {
    mutator(state);
    save();
  }

  /** 상태를 고치고 화면을 다시 그린다 */
  function update(mutator) {
    mutator(state);
    save();
    render();
  }

  function goTo(index) {
    var steps = PC.STEPS;
    var target = Math.max(0, Math.min(steps.length - 1, index));
    if (!PC.schema.canGoTo(target, state)) {
      UI.toast(PC.MESSAGES.lockedStep);
      return;
    }
    update(function (s) {
      s.step = target;
    });
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
    UI.announce(steps[target].label + " 단계로 이동했습니다.");
  }

  var app = {
    update: update,
    patch: patch,
    goTo: goTo,
    rerender: render,
    rerenderNav: function () {
      drawProgress();
      drawNav();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 진행 표시 (명세 5장 스테퍼)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 상단 진행 표시 — 단계 원과 잇는 선, 그리고 진행률 (lesson3_7_1 과 같은 모양).
   *
   * 원 안의 숫자는 «몇 번째 단계» 이고, 마친 단계는 ✔ 로 바뀐다.
   * 색만으로 알리지 않도록 잠김·열림·마침을 낭독기용 글자로도 적는다.
   */
  function drawProgress() {
    var list = UI.$("#stepper-list");
    if (!list) return;

    var steps = PC.STEPS;
    var furthest = PC.schema.furthestStep(state);

    UI.clear(list);
    steps.forEach(function (step, i) {
      var done = i < furthest;
      var current = i === state.step;
      var open = i <= furthest;

      var state1 = done ? "is-done" : "";
      var state2 = current ? "is-current" : "";
      var state3 = open ? "" : "is-locked";

      var node = el("button", {
        class: "stepper__node",
        text: done ? "✔" : String(i + 1),
        attrs: {
          type: "button",
          disabled: open ? null : true,
          "aria-current": current ? "step" : null,
          "aria-label":
            i + 1 + "단계 " + step.label + " — " + (done ? "마침" : current ? "지금 단계" : open ? "열림" : "잠김")
        },
        on: {
          click: function () {
            goTo(i);
          }
        }
      });

      list.appendChild(
        el("li", { class: ["stepper__item", state1, state2, state3].filter(Boolean).join(" ") }, [
          node,
          el("span", { class: "stepper__label", attrs: { "aria-hidden": "true" }, text: step.short })
        ])
      );
    });

    /* 「3 / 6」 과 진행률 막대 */
    var current = UI.$("#progress-current");
    var total = UI.$("#progress-total");
    if (current) current.textContent = String(state.step + 1);
    if (total) total.textContent = String(steps.length);

    var percent = Math.round(((state.step + 1) / steps.length) * 100);
    var fill = UI.$("#progressbar-fill");
    var bar = UI.$("#progressbar");
    if (fill) fill.style.width = percent + "%";
    if (bar) {
      bar.setAttribute("aria-valuenow", String(percent));
      bar.setAttribute("aria-valuetext", state.step + 1 + " / " + steps.length + " 단계 · " + steps[state.step].label);
    }
  }

  /* ------------------------------------------------------------------ */
  /* 아래쪽 이동 단추                                                     */
  /* ------------------------------------------------------------------ */

  function drawNav() {
    if (!navArea) return;
    var steps = PC.STEPS;
    var here = steps[state.step];
    var gate = PC.schema.checkStep(here.key, state);
    var last = state.step === steps.length - 1;

    var reasons = el("div", { class: "nav__reasons" });
    if (!gate.ok && !last) {
      reasons.appendChild(
        el("p", { class: "nav__reasonhead", text: "다음 단계를 열려면" })
      );
      var ul = el("ul", { class: "nav__reasonlist" });
      gate.reasons.forEach(function (r) {
        ul.appendChild(el("li", { text: r }));
      });
      reasons.appendChild(ul);
    }

    var buttons = el("div", { class: "nav__btns" }, [
      UI.button("← 이전", {
        class: "btn btn--ghost",
        disabled: state.step === 0,
        click: function () {
          goTo(state.step - 1);
        }
      }),
      last
        ? null
        : UI.button("다음 →", {
            disabled: !gate.ok,
            click: function () {
              goTo(state.step + 1);
            }
          })
    ]);

    UI.clear(navArea);
    navArea.appendChild(el("div", { class: "nav" }, [reasons, buttons]));
  }

  /* ------------------------------------------------------------------ */
  /* 알림 띠                                                              */
  /* ------------------------------------------------------------------ */

  function drawBanner() {
    if (!bannerArea) return;
    UI.clear(bannerArea);

    var pending = S.store.loadPending();
    if (pending.length > 0) {
      bannerArea.appendChild(
        UI.alert("warn", "아직 보내지 못한 제출이 " + pending.length + "건 있습니다. 6단계에서 [다시 제출] 을 눌러 주세요.")
      );
    }
  }

  /* ------------------------------------------------------------------ */
  /* 화면 그리기                                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 글이 많은 화면은 읽기 좋은 너비로 좁히고, 회로·코드 화면은 넓게 쓴다.
   * (회로 그림과 코드 편집기는 넓을수록 편하다)
   */
  var WIDE_STEPS = { circuit: true, code: true };

  function render() {
    drawProgress();
    drawBanner();

    var step = PC.STEPS[state.step];
    var draw = S.screens[step.key];

    screenRoot.className = "screen " + (WIDE_STEPS[step.key] ? "screen--wide" : "screen--narrow");
    UI.clear(screenRoot);
    if (draw) screenRoot.appendChild(draw(state, app));

    drawNav();
  }

  /* ------------------------------------------------------------------ */
  /* 시작할 때 묻기 — 이어서 할까, 처음부터 할까                             */
  /* ------------------------------------------------------------------ */

  /**
   * 남아 있는 기록이 «물어볼 만한가».
   * 1단계에서 아무것도 하지 않고 새로 고친 것까지 묻는 것은 번거롭다.
   */
  function worthAsking(draft) {
    if (!draft) return false;
    if (draft.step > 0) return true;
    if (draft.submitted) return true;
    if (draft.student.studentId || draft.student.name) return true;
    return S.hasContent(draft);
  }

  /** 「처음부터 시작」 — 이 기기의 학습 기록을 지우고 1단계부터 다시 */
  function startOver() {
    var left = S.store.resetLearning();
    state = S.emptyState();
    render();
    UI.toast(
      left > 0
        ? "처음부터 시작합니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다."
        : "처음부터 시작합니다. 이전 기록을 지웠습니다."
    );
    UI.announce("이전 기록을 지웠습니다. 1단계부터 다시 시작합니다.");
  }

  function askResume(draft) {
    if (!worthAsking(draft)) return;
    if (!UI.askDialog) return; /* 아주 옛 브라우저 — 그냥 이어서 한다 */

    var stepNo = Math.min(PC.STEPS.length, Math.max(1, (draft.step || 0) + 1));

    UI.askDialog({
      title: "이어서 학습하시겠어요?",
      lines: [
        "이전에 " + stepNo + "단계까지 진행한 기록이 남아 있어요.",
        "처음부터 다시 시작하면 이전 기록은 지워집니다."
      ],
      okLabel: "이어서 학습하기",
      cancelLabel: "처음부터 시작",
      /* ★ Esc 로 닫으면 «이어서» 다. 실수로 기록이 사라지면 되돌릴 수 없다. */
      dismiss: "ok",
      onOk: function () {
        UI.announce(stepNo + "단계부터 이어서 학습합니다.");
      },
      onCancel: startOver
    });
  }

  /* ------------------------------------------------------------------ */
  /* 시작                                                                 */
  /* ------------------------------------------------------------------ */

  function start() {
    screenRoot = UI.$("#screen-root");
    navArea = UI.$("#nav-area");
    bannerArea = UI.$("#banner-area");
    if (!screenRoot) return;

    var draft = S.store.loadDraft();
    if (draft) state = draft;

    var saved = S.store.loadStudent();
    if (saved && !state.student.studentId) {
      state.student.studentId = saved.studentId;
      state.student.name = saved.name;
    }

    render();

    /* 남아 있는 기록이 있으면 «이어서 할지 처음부터 할지» 먼저 묻는다.
       공용 컴퓨터에서 앞 학생의 기록 위에 이어서 쓰는 일을 막는 것이 까닭이다. */
    askResume(draft);

    /* 작성 중에 실수로 창을 닫는 것을 막는다 */
    window.addEventListener("beforeunload", function (evt) {
      if (!S.hasContent(state) || state.submitted) return;
      evt.preventDefault();
      evt.returnValue = PC.MESSAGES.leaveWarn;
      return PC.MESSAGES.leaveWarn;
    });

    /* 이 기기의 흔적 지우기 — 공용 태블릿용 */
    var reset = UI.$("#reset-device");
    if (reset) {
      reset.addEventListener("click", function () {
        if (!window.confirm("이 기기에 저장된 내 학습 기록을 모두 지웁니다. 계속할까요?")) return;
        var left = S.store.clearAll();
        state = S.emptyState();
        render();
        UI.toast(left > 0 ? "지웠습니다. 보내지 못한 제출 " + left + "건은 남겨 두었습니다." : "지웠습니다.");
      });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  S.app = {
    getState: function () {
      return state;
    },
    _setState: function (next) {
      state = next;
    },
    render: render
  };
})();
    </script>
  </body>
</html>
