       다시 그릴 때마다 처음부터 재생되면 눈이 어지럽고, 결과 칸이 비어 보이지도 않는다. */
    if (code.exampleRun) demo.run(W.code, { instant: true, sensor: demoSensor(), onChange: showAfterChange });

    /* ★ 읽고 돌려 보기 전에는 «작성 화면» 을 만들지 않는다(명세 17.4 C).
       흐리게 비활성으로 미리 보여 주지도 않는다 — 아예 DOM 에 만들지 않는다. */
    if (!code.learned) {
      box.appendChild(
        UI.alert(
          "info",
          "위 예시를 읽고 [예시 프로그램 실행] 으로 «갈림길이 옮겨 가는 순간» 을 관찰하면, " +
            "아래에 직접 만드는 칸이 열립니다."
        )
      );
      return box;
    }

    /* ================================================================ */
    /* C. 직접 만들기 (명세 17.4 C)                                      */
    /* ================================================================ */

    /* 검사 결과가 들어갈 자리.
       ★ 아래 «방식별 입력» 이 만들어지자마자 refreshTests 를 부르므로
         이 그릇은 그보다 «먼저» 만들어져 있어야 한다. */
    var testPanel = el("div");

    function setSource(next) {
      app.patch(function (s) {
        s.code.source = next;
      });
      refreshTests(next);
    }

    /* ---- 방식 고르기 ---- */
    var tabs = el("div", { class: "modetabs", attrs: { role: "tablist", "aria-label": "코딩 방식" } });
    A.CODE_MODES.forEach(function (m) {
      var active = code.mode === m.id;
      tabs.appendChild(
        el("button", {
          class: "modetab" + (active ? " modetab--on" : ""),
          text: m.label,
          attrs: { type: "button", role: "tab", "aria-selected": active ? "true" : "false" },
          on: {
            click: function () {
              app.update(function (s) {
                s.code.mode = m.id;
              });
            }
          }
        })
      );
    });

    var modeDesc = "";
    A.CODE_MODES.forEach(function (m) {
      if (m.id === code.mode) modeDesc = m.desc;
    });

    /* ---- 방식별 입력 ---- */
    var work = el("div", { class: "codework" });

    if (code.mode === "assemble") {
      var asm = ED.assembler(code.assembleOrder, function (order, source) {
        app.patch(function (s) {
          s.code.assembleOrder = order;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(asm.root);
      if (!code.source) setSource(asm.getSource());
    } else if (code.mode === "blank") {
      var bl = ED.blanks(code.blanks, function (source, values) {
        app.patch(function (s) {
          s.code.blanks = values;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(bl.root);
      setSource(bl.getSource());
    } else {
      var starter =
        "const int ledPin = " + PC.LED_PIN + ";\n" +
        "const int motionPin = " + PC.MOTION_PIN + ";\n\n" +
        "void setup() {\n  \n}\n\nvoid loop() {\n  \n}";
      var ed = ED.editor(code.source || starter, function (value) {
        setSource(value);
      });
      work.appendChild(ed.root);
      work.appendChild(
        el("div", { class: "btnrow" }, [
          UI.button("빈 스케치 넣기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              ed.setValue(starter);
            }
          })
        ])
      );
      if (!code.source) setSource(ed.getValue());
    }

    box.appendChild(
      UI.card({ eyebrow: "4단계 · C 직접 만들기", title: "이제 같은 프로그램을 만들어 봅시다.", desc: modeDesc }, [
        tabs,
        work
      ])
    );

    /* ---- 코드 검사 여덟 항목 (명세 17.4) ---- */

    function refreshTests(source) {
      /* 8번 항목이 «회로» 를 함께 본다. 그래서 결선 목록을 넘긴다. */
      var result = A.validate(source, { connections: state.circuit.connections });
      var mismatch = result.ast ? C.pinMismatch(A.pinsUsed(result.ast), state.circuit.connections) : [];

      app.patch(function (s) {
        s.code.testsPassed = result.passed;
        s.code.testsTotal = result.tests.length;
        s.code.syntaxErrors = result.error
          ? [(result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message]
          : [];
        s.code.pinMismatch = mismatch;

        /* 수정 이력 — 통과 수가 «바뀔 때만» 한 칸 쌓는다.
           글자를 한 자 칠 때마다 쌓으면 제출 자료가 쓸모없이 커진다. */
        var last = s.code.history.length > 0 ? s.code.history[s.code.history.length - 1] : null;
        if (!last || last.passed !== result.passed || last.mode !== s.code.mode) {
          s.code.history.push({
            at: new Date().toISOString(),
            mode: s.code.mode,
            passed: result.passed,
            total: result.tests.length
          });
          if (s.code.history.length > 40) s.code.history.shift();
        }
      });

      UI.clear(testPanel);

      if (result.error) {
        testPanel.appendChild(UI.alert("warn", result.error.line + "번 줄 — " + result.error.message));
      }

      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        list.appendChild(UI.conditionRow(t.label, t.ok, t.ok ? "" : t.message));
      });
      testPanel.appendChild(list);

      result.warnings.forEach(function (w) {
        testPanel.appendChild(UI.alert("info", w.line + "번 줄 — " + w.message));
      });

      /* 통과 개수가 바뀌었으므로 아래쪽 [다음] 단추도 다시 판단해야 한다 */
      app.rerenderNav();
      return result;
    }

    box.appendChild(
      UI.card(
        {
          title: "코드 검사",
          desc: A.TESTS.length + "개 항목을 모두 통과해야 다음 단계가 열립니다. 중괄호·세미콜론은 줄 번호로 알려 줍니다."
        },
        [testPanel]
      )
    );

    /* ---- 내 코드 실행 ---- */
    var mine = makeRunner({ runMs: DEMO_RUN_MS, sensor: demoSensor() });
    box.appendChild(
      UI.card({ title: "내 코드 실행하기", desc: "예시와 같은 결과가 나오는지 견주어 보세요." }, [
        el("div", { class: "btnrow" }, [
          UI.button("내 코드 실행", {
            click: function () {
              mine.run(state.code.source, { sensor: demoSensor() });
              app.patch(function (s) {
                s.code.ran = true;
                s.code.attempts += 1;
              });
              app.rerenderNav();
            }
          })
        ]),
        mine.viewHost,
        mine.panelHost
      ])
    );

    refreshTests(code.source);

    return box;
  }

  /* ================================================================== */
  /* 5단계 — 실행·탐구                                                   */
  /* ================================================================== */

  /**
   * ★ 방금 [실행] 을 누른 실험.
   *
   *   실행하면 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
   *   그런데 다시 그리면서 결과를 «즉시» 로 채우면, 학생이 보는 것은
   *   «이미 끝난 모습» 뿐이라 아무 일도 일어나지 않은 것처럼 보인다.
   *
   *   그래서 어느 실험을 방금 눌렀는지 기억해 두고, 다시 그린 뒤 그 하나만
   *   «애니메이션으로» 재생한다. 나머지는 즉시로 채운다.
   */
  var justRanExperiment = "";

  /**
   * 자유 탐색 위젯의 시계.
   *
   * ★ 화면을 다시 그리면 «옛 시계» 를 반드시 멈춰야 한다.
   *   멈추지 않으면 사라진 화면을 가리키는 타이머가 쌓여, 누를 때마다 느려진다.
   */
  var zoneTimer = null;

  function stopZoneTimer() {
    if (zoneTimer) {
      clearInterval(zoneTimer);
      zoneTimer = null;
    }
  }

  /**
   * ★ 자유 탐색 — 부채꼴 감지 영역과 사람 아이콘 (명세 6.5 첫 줄)
   *
   *   · 사람을 «드래그·클릭·화살표 키» 로 영역 안팎으로 옮긴다
   *   · [움직임 / 정지] 를 전환한다
   *   · 상태 패널이 여덟 가지를 «한 흐름으로 동시에» 보인다
   *     PIR 안정화 · 사람 위치 · 움직임 · DO · if 조건 · D8 · LED · 시리얼 출력
   *
   *   여기는 «기록하지 않는» 자리다. 마음껏 해 보는 곳이고,
   *   기록은 아래 필수 실험 세 개에서 한다.
   *
   * ★ 이 위젯은 학생이 만든 «그 코드» 를 돌린다.
   *   조건을 반전해 적은 학생은 여기서 «움직이면 꺼진다» 를 보게 된다.
   *   앱이 결과를 꾸며 주지 않는 것이 중요하다.
   */
  function zoneWidget(state) {
    var SENSOR = PC.SENSOR;
    var W = 660;
    var H = 300;
    var ORIGIN = { x: 74, y: 150 };
    var HALF = SENSOR.fovDeg / 2;
    var REACH = 560;

    /* 사람의 자리 — 처음에는 «영역 밖» 에 둔다 */
    var person = { x: 520, y: 44 };
    var moving = false;
    var dragging = false;
    var powerOn = false;
    var t0 = 0;
    var events = [];
    var lastKey = "";
    var codeWarned = false;

    var svgHost = el("div", { class: "zone__canvas" });
    var panel = el("div", { class: "zone__panel" });
    var note = el("p", { class: "zone__note", attrs: { role: "status", "aria-live": "polite" }, text: "" });

    /** 지금 사람이 감지 영역 «안» 인가 */
    function inZone() {
      var dx = person.x - ORIGIN.x;
      var dy = person.y - ORIGIN.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > REACH) return false;
      var deg = (Math.atan2(dy, dx) * 180) / Math.PI;
      return dx > 0 && Math.abs(deg) <= HALF;
    }

    function effMoving() {
      return moving || dragging;
    }

    /** 조건이 바뀌면 발자취에 한 칸 남긴다 — 모델은 이 발자취로 판정한다 */
    function noteChange() {
      var key = (inZone() ? "1" : "0") + (effMoving() ? "1" : "0");
      if (key === lastKey) return;
      lastKey = key;
      events.push({ at: powerOn ? now() : 0, inZone: inZone(), moving: effMoving() });
    }

    function now() {
      return powerOn ? Date.now() - t0 : 0;
    }

    function model() {
      return A.pirModel({
        pin: PC.MOTION_PIN,
        warmupMs: SENSOR.warmupMs,
        holdMs: SENSOR.holdMs,
        events: events.length > 0 ? events : [{ at: 0, inZone: inZone(), moving: effMoving() }]
      });
    }

    /** 학생 코드를 그 순간의 DO 값으로 한 번 돌려 본다 */
    function evalCode(level) {
      var src = String(state.code.source || A.REFERENCE_CODE);
      var inputs = {};
      inputs[PC.MOTION_PIN] = level;
      var result = A.run(src, { loopLimit: 2, ledPin: PC.LED_PIN, inputs: inputs });
      if (!result.ok) {
        return { ok: false, ledOn: false, serial: "", error: result.error };
      }
      var lines = result.console || [];
      return {
        ok: true,
        ledOn: result.led.on === true,
        serial: lines.length > 0 ? lines[lines.length - 1].text : ""
      };
    }

    /* ---------------- 그리기 ---------------- */

    function drawSvg() {
      var svgNode = UI.svg("svg", {
        viewBox: "0 0 " + W + " " + H,
        class: "zone__svg",
        role: "img",
        "aria-label":
          "감지 영역 그림. 사람은 지금 " + (inZone() ? "감지 영역 안" : "감지 영역 밖") + "에 있고 " +
          (effMoving() ? "움직이고 있습니다." : "멈춰 있습니다.")
      });

      /* 부채꼴 감지 영역 */
      function px(deg) {
        return ORIGIN.x + REACH * Math.cos((deg * Math.PI) / 180);
      }
      function py(deg) {
        return ORIGIN.y + REACH * Math.sin((deg * Math.PI) / 180);
      }
      svgNode.appendChild(
        UI.svg("path", {
          d:
            "M " + ORIGIN.x + " " + ORIGIN.y +
            " L " + px(-HALF) + " " + py(-HALF) +
            " A " + REACH + " " + REACH + " 0 0 1 " + px(HALF) + " " + py(HALF) + " Z",
          class: "zone__field"
        })
      );
      svgNode.appendChild(
        UI.svg("text", { x: 300, y: 26, class: "zone__fieldname" }, [
          document.createTextNode("감지 영역 (약 " + SENSOR.fovDeg + "° · " + SENSOR.rangeM + "m)")
        ])
      );
      svgNode.appendChild(
        UI.svg("text", { x: 560, y: 286, class: "zone__fieldname" }, [
          document.createTextNode("← 이 밖은 감지되지 않는다")
        ])
      );

      /* 센서 */
      if (S.figures) S.figures.smallPir(svgNode, 30, 118, { high: false });

      /* 사람 — 누르는 자리를 넉넉하게 잡는다(터치 44px 이상) */
      var g = UI.svg("g", {
        class: "zone__person" + (effMoving() ? " zone__person--moving" : ""),
        tabindex: "0",
        role: "application",
        "aria-label":
          "사람 아이콘. 화살표 키로 옮길 수 있습니다. 지금 " +
          (inZone() ? "감지 영역 안" : "감지 영역 밖") + "."
      });
      g.appendChild(
        UI.svg("rect", {
          x: person.x - 26, y: person.y - 46, width: 52, height: 92, class: "zone__hit"
        })
      );
      if (S.figures) {
        S.figures.personIcon(g, person.x, person.y, {
          moving: effMoving(),
          label: inZone() ? "영역 안" : "영역 밖"
        });
      }
      svgNode.appendChild(g);

      /* 조작 — 클릭·드래그·키보드 셋 다 (명세 11장) */
      function pointAt(evt) {
        var rect = svgNode.getBoundingClientRect();
        var sx = ((evt.clientX - rect.left) / rect.width) * W;
        var sy = ((evt.clientY - rect.top) / rect.height) * H;
        person.x = Math.max(30, Math.min(W - 30, sx));
        person.y = Math.max(46, Math.min(H - 46, sy));
        noteChange();
        redraw();
      }

      svgNode.addEventListener("pointerdown", function (evt) {
        dragging = true;
        if (svgNode.setPointerCapture && evt.pointerId !== undefined) {
          try {
            svgNode.setPointerCapture(evt.pointerId);
          } catch (e) {
            /* 잡지 못해도 그냥 옮기기만 한다 */
          }
        }
        pointAt(evt);
      });
      svgNode.addEventListener("pointermove", function (evt) {
        if (!dragging) return;
        pointAt(evt);
      });
      svgNode.addEventListener("pointerup", function () {
        dragging = false;
        noteChange();
        redraw();
      });
      svgNode.addEventListener("pointercancel", function () {
        dragging = false;
        noteChange();
      });

      g.addEventListener("keydown", function (evt) {
        var step = 24;
        var moved = true;
        if (evt.key === "ArrowLeft") person.x -= step;
        else if (evt.key === "ArrowRight") person.x += step;
        else if (evt.key === "ArrowUp") person.y -= step;
        else if (evt.key === "ArrowDown") person.y += step;
        else if (evt.key === " " || evt.key === "Enter") {
          moving = !moving;
          moved = false;
        } else return;
        evt.preventDefault();
        person.x = Math.max(30, Math.min(W - 30, person.x));
        person.y = Math.max(46, Math.min(H - 46, person.y));
        noteChange();
        redraw();
        UI.announce(
          (moved ? "사람을 옮겼습니다. " : "") +
            (inZone() ? "감지 영역 안" : "감지 영역 밖") + ", " +
            (effMoving() ? "움직이는 중" : "멈춰 있음")
        );
      });

      UI.clear(svgHost).appendChild(svgNode);
    }

    /* ---------------- 상태 패널 ---------------- */

    function row(label, value, kind) {
      return el("div", { class: "zrow" + (kind ? " zrow--" + kind : "") }, [
        el("span", { class: "zrow__label", text: label }),
        el("span", { class: "zrow__value", text: value })
      ]);
    }

    function drawPanel() {
      var t = now();
      var st = model().stateAt(t);
      var settled = powerOn && st.settled;
      var level = powerOn && settled ? st.level : 0;
      var out = evalCode(level);

      if (!out.ok && !codeWarned) {
        codeWarned = true;
        note.textContent =
          "지금 코드에 문법 오류가 있어 LED 를 판정할 수 없습니다. 4단계에서 먼저 고쳐 주세요.";
      }

      var rows = [
        row("PIR 안정화", !powerOn ? "전원 꺼짐" : settled ? "완료" : "안정화 중 — " + (st.warmupLeft / 1000).toFixed(1) + "초 남음", "sensor"),
        row("사람 위치", inZone() ? "감지 영역 «안»" : "감지 영역 «밖»", "sensor"),
        row("움직임", effMoving() ? "움직이는 중" : "멈춰 있음", "sensor"),
        row(
          "DO (" + PC.MOTION_PIN_NAME + ")",
          !powerOn ? "—" : settled ? st.text : "안정화 중—판정 대기",
          "sensor"
        ),
        row(
          "if 조건",
          !powerOn || !settled ? "판정 대기" : level ? "True (motion == HIGH)" : "False",
          "cond"
        ),
        row(PC.LED_PIN_NAME, !powerOn ? "—" : out.ledOn ? "HIGH" : "LOW", "out"),
        row("LED", !powerOn ? "전원 꺼짐" : out.ledOn ? "● 켜짐" : "○ 꺼짐", "out"),
        row("시리얼 출력", !powerOn ? "—" : out.serial || "—", "out")
      ];

      UI.clear(panel).appendChild(el("div", { class: "zrows" }, rows));
    }

    function redraw() {
      drawSvg();
      drawPanel();
    }

    /* ---------------- 단추 ---------------- */

    var buttons = el("div", { class: "btnrow" });

    function drawButtons() {
      UI.clear(buttons);
      buttons.appendChild(
        UI.button(powerOn ? "전원 끄기" : "전원 켜기 (안정화 시작)", {
          class: powerOn ? "btn btn--ghost" : "btn btn--primary",
          click: function () {
            powerOn = !powerOn;
            if (powerOn) {
              t0 = Date.now();
              events = [{ at: 0, inZone: inZone(), moving: effMoving() }];
              lastKey = (inZone() ? "1" : "0") + (effMoving() ? "1" : "0");
              note.textContent =
                "전원을 켰습니다. " + (PC.SENSOR.warmupMs / 1000) +
                "초 동안은 «안정화 중—판정 대기» 입니다. 그 뒤부터 판정합니다.";
            } else {
              note.textContent = "전원을 껐습니다. 다시 켜면 안정화부터 시작합니다.";
            }
            drawButtons();
            redraw();
          }
        })
      );
      buttons.appendChild(
        UI.button(moving ? "정지시키기" : "움직이게 하기", {
          class: "btn btn--ghost",
          pressed: moving,
          click: function () {
            moving = !moving;
            noteChange();
            drawButtons();
            redraw();
            UI.announce(moving ? "사람이 움직입니다." : "사람이 멈췄습니다.");
          }
        })
      );
      buttons.appendChild(
        UI.button("영역 안으로 옮기기", {
          class: "btn btn--ghost",
          click: function () {
            person.x = 330;
            person.y = 158;
            noteChange();
            redraw();
          }
        })
      );
      buttons.appendChild(
        UI.button("영역 밖으로 옮기기", {
          class: "btn btn--ghost",
          click: function () {
            person.x = 520;
            person.y = 44;
            noteChange();
            redraw();
          }
        })
      );
    }

    drawButtons();
    redraw();

    /* 0.25초마다 다시 판정한다 — 안정화 남은 시간과 유지 시간 카운트다운이 흘러가야 한다 */
    stopZoneTimer();
    zoneTimer = setInterval(function () {
      if (!svgHost.parentNode) {
        stopZoneTimer();
        return;
      }
      if (powerOn) drawPanel();
    }, 250);

    return el("div", { class: "zone" }, [
      buttons,
      el("p", {
        class: "para",
        text:
          "사람을 «끌어서» 옮기거나 그림의 아무 곳을 누르면 그 자리로 옮겨집니다. " +
          "사람 아이콘에 초점을 두고 화살표 키로 옮길 수도 있습니다(스페이스 = 움직임 전환)."
      }),
      svgHost,
      panel,
      note
    ]);
  }

  /**
   * 5단계 — 실행·탐구 (명세 6.5)
   *
   *   ① 자유 탐색 — 사람을 옮기고 움직임을 전환하며 상태 패널을 본다 (기록하지 않는다)
   *   ② 필수 실험 셋 — 영역 안 움직임 · 영역 안 정지 · 영역 밖 움직임
   *   ③ 확장 탐구 — «마지막 감지 후 일정 시간 유지» 규칙을 말·의사코드로 (선택)
   *
   * ★ 실험마다 «예상 → 실행 → 관찰» 차례를 지킨다.
   *   예상을 적기 전에는 [실행] 이 열리지 않는다. 먼저 돌려 보고 나서 «예상» 을
   *   적으면 그것은 예상이 아니라 베끼기다.
   */
  function renderExperiment(state, app) {
    var box = el("div");
    var minChars = PC.LIMITS.observationMin;
    var predictMin = PC.LIMITS.predictMin || 4;

    /* 화면을 다시 그리므로 옛 시계를 반드시 멈춘다 */
    stopZoneTimer();

    /** 실험 하나의 기록 (없으면 빈 칸으로) */
    function runOf(id) {
      return state.experiment.runs[id] || { predict: "", ran: false, observation: "", surprise: "" };
    }

    /** 그 실험을 «끝냈는가» — 실행 + 세 칸을 모두 채웠는가 */
    function isDone(item) {
      var r = runOf(item.id);
      return (
        r.ran === true &&
        PC.schema.contentLength(r.predict) >= predictMin &&
        PC.schema.contentLength(r.observation) >= minChars &&
        PC.schema.contentLength(r.surprise) >= 2
      );
    }

    /**
     * 이 실험을 «마쳤다» 고 보는 조건 넷 — isDone() 과 «같은 것» 을 본다.
     *
     * ★ 갈라 두지 않는다. isDone 은 참·거짓만 돌려주므로 그것만으로는
     *   학생이 «무엇이 모자란지» 를 알 수 없다. 같은 조건을 한 줄씩 적어
     *   화면에 그대로 보여 준다.
     */
    function stepsOf(item) {
      var r = runOf(item.id);
      var len = PC.schema.contentLength;
      return [
        {
          label: "① 예상을 적는다 (공백 빼고 " + predictMin + "자 이상)",
          ok: len(r.predict) >= predictMin,
          detail: "적어야 [실행하기] 가 열립니다."
        },
        {
          label: "② [실행하기] 를 누른다",
          ok: r.ran === true,
          detail: "여러분이 4단계에서 만든 코드를 그대로 돌립니다."
        },
        {
          label: "③ 관찰을 적는다 (공백 빼고 " + minChars + "자 이상)",
          ok: len(r.observation) >= minChars,
          detail: "실행한 뒤에 칸이 생깁니다."
        },
        {
          label: "④ 예상과 다른 점을 적는다 (2자 이상)",
          ok: len(r.surprise) >= 2,
          detail: "다른 점이 없으면 «없음» 이라고 적어도 됩니다."
        }
      ];
    }

    /**
     * 「이 실험을 마치려면」 목록 — 지금 어디까지 했는지 한눈에 보인다.
     *
     * ★ 글을 쓰는 중에는 화면을 다시 그리지 않으므로(커서가 튄다)
     *   refresh() 로 이 목록만 «직접» 고친다. syncGate 와 같은 방식이다.
     */
    /**
     * 화면에 놓인 «마치려면» 목록을 모두 모아 둔다.
     *
     * ★ 같은 실험의 목록이 두 곳에 나온다 — 그 실험 카드 «안» 과,
     *   다음 실험의 «잠긴 카드» 안. 하나만 고치면 두 곳이 서로 다른 말을 한다
     *   (실제로 실험1은 ✔✔✔✔ 인데 실험2 쪽은 ✔✔○○ 였다).
     */
    var stepLists = [];

    function refreshAllSteps() {
      stepLists.forEach(function (s) {
        s.refresh();
      });
    }

    function stepList(item, title) {
      var listHost = el("ul", { class: "condlist" });
      var summary = el("p", { class: "steplist__sum" });

      function refresh() {
        var steps = stepsOf(item);
        var left = steps.filter(function (s) {
          return !s.ok;
        });
        UI.clear(listHost);
        steps.forEach(function (s) {
          listHost.appendChild(UI.conditionRow(s.label, s.ok, s.detail));
        });
        summary.textContent =
          left.length === 0
            ? "네 가지를 모두 마쳤습니다. 다음 실험이 열렸습니다."
            : "남은 것 " + left.length + "가지 : " + left.map(function (s) {
                return s.label.replace(/^[①②③④]\s*/, "");
              }).join(" · ");
      }
      refresh();

      var api = {
        root: el("div", { class: "steplist" }, [
          el("h4", { class: "subhead", text: title }),
          listHost,
          summary
        ]),
        refresh: refresh
      };
      stepLists.push(api);
      return api;
    }

    /**
     * 글을 쓰다가 그 실험이 «막 끝났으면» 화면을 다시 그려 다음 실험을 연다.
     *
     * ★ 평소에는 다시 그리지 않는다(글 쓰는 중에 커서가 튄다).
     *   네 번째 조건이 «막 채워진 그 한 번» 만 다시 그린다. 그러지 않으면
     *   목록은 「다 마쳤습니다」 라고 하는데 아래 카드는 잠긴 채로 남는다.
     */
    var doneBefore = {};
    L.EXPERIMENTS.forEach(function (it) {
      doneBefore[it.id] = isDone(it);
    });

    function afterEdit(item) {
      refreshAllSteps();
      var now = isDone(item);
      if (now && !doneBefore[item.id]) {
        doneBefore[item.id] = true;
        app.update(function () {});
        return;
      }
      doneBefore[item.id] = now;
    }

    /** 그 실험의 센서 모델 */
    function sensorFor(item) {
      return A.pirModel({
        pin: PC.MOTION_PIN,
        warmupMs: PC.SENSOR.warmupMs,
        holdMs: PC.SENSOR.holdMs,
        events: item.events
      });
    }

    /** 학생이 만든 코드 (없으면 기준 코드) */
    function sourceOf() {
      return String(state.code.source || A.REFERENCE_CODE);
    }

    /** 1단계에서 그 상황을 무엇이라 예측했는가 */
    function firstGuess(item) {
      if (!item.predictId || !L.PREDICT) return "";
      var v = state.intro.predicts[item.predictId];
      if (v === undefined || v === null || v === "") return "";
      return L.PREDICT.choices[Number(v)] || "";
    }

    var doneCount = L.EXPERIMENTS.filter(isDone).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "5단계 · 실행과 탐구",
          title: "센서가 «언제» 감지하고 «언제» 못 하는지 확인합니다.",
          desc:
            "필수 실험 " + L.EXPERIMENTS.length + "개를 차례로 마치면 다음 단계가 열립니다. " +
            "(지금 " + doneCount + " / " + L.EXPERIMENTS.length + ")"
        },
        [
          taskStrip(
            L.EXPERIMENTS.map(function (item, i) {
              var prev = i === 0 ? null : L.EXPERIMENTS[i - 1];
              return {
                text: item.short,
                done: isDone(item),
                now: !isDone(item) && (i === 0 || isDone(prev))
              };
            })
          ),
          UI.alert(
            "info",
            "이 화면의 안정화 " + PC.SENSOR.warmupMs / 1000 + "초 · 출력 유지 " +
              PC.SENSOR.holdMs / 1000 + "초는 «수업용으로 줄인 값» 입니다. " +
              "실제 모듈은 안정화 30~60초, 유지 시간은 나사로 조절합니다."
          )
        ]
      )
    );

    /* ================================================================ */
    /* ① 자유 탐색 (기록하지 않는다)                                      */
    /* ================================================================ */

    box.appendChild(
      UI.card(
        {
          eyebrow: "자유 탐색",
          title: "사람을 옮겨 보며 여덟 가지를 한꺼번에 살펴봅시다.",
          desc:
            "여기는 기록하지 않는 자리입니다. 마음껏 옮기고 멈춰 보세요. " +
            "아래 필수 실험에서 같은 것을 «기록하며» 확인합니다."
        },
        [zoneWidget(state)]
      )
    );

    /* ================================================================ */
    /* ② 필수 실험 셋                                                    */
    /* ================================================================ */

    L.EXPERIMENTS.forEach(function (item, index) {
      var r = runOf(item.id);
      var prev = index === 0 ? null : L.EXPERIMENTS[index - 1];
      var open = index === 0 || isDone(prev);

      if (!open) {
        /* ★ «끝내면 열립니다» 만으로는 무엇을 해야 하는지 알 수 없다.
           앞 실험에서 «무엇이 남았는지» 를 그대로 보여 준다. */
        box.appendChild(
          UI.card(
            {
              eyebrow: "실험 " + (index + 1),
              title: item.label,
              desc: "앞의 «" + prev.short + "» 실험을 마치면 열립니다."
            },
            [
              UI.alert(
                "info",
                "«" + prev.short + "» 실험(실험 " + index + ")에서 아래 네 가지를 모두 채우면 이 실험이 열립니다."
              ),
              stepList(prev, "«" + prev.short + "» 실험에 남은 것").root
            ]
          )
        );
        return;
      }

      var body = [];
      var runner = makeRunner({ sensor: sensorFor(item), runMs: item.runMs });
      /* ★ «어떻게 해야 다 하는 것인가» 를 늘 보이게 둔다.
         글을 쓰는 중에는 다시 그리지 않으므로 afterEdit() 이 이 목록만 고친다. */
      var steps = stepList(item, "이 실험을 마치려면");

      body.push(el("p", { class: "para", text: item.situation }));
      body.push(UI.alert("info", item.ask));
      body.push(steps.root);

      /* ── ① 예상 ── */
      var guess = firstGuess(item);
      if (guess) {
        body.push(
          el("p", { class: "predict__before" }, [
            el("span", { class: "predict__tag", text: "1단계에서 여러분의 예측" }),
            document.createTextNode(" «" + guess + "»")
          ])
        );
      }

      var predictField = UI.field(
        {
          label: "① 실행하기 «전» 예상 — DO 와 LED 는 어떻게 될까요?",
          help: "왜 그렇게 생각했는지도 함께 적으면 좋습니다. " + predictMin + "자 이상.",
          min: predictMin,
          multiline: true,
          rows: 2,
          placeholder: "예) 움직이니까 DO 가 HIGH 가 되고 LED 가 켜질 것 같다."
        },
        r.predict,
        function (value) {
          app.patch(function (s) {
            if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = { predict: "", ran: false };
            s.experiment.runs[item.id].predict = value;
          });
          runBtn.disabled = PC.schema.contentLength(value) < predictMin;
          afterEdit(item);
        }
      );
      body.push(predictField.root);

      /* ── ② 실행 ── */
      var runBtn = UI.button(r.ran ? "다시 실행" : "실행하기", {
        disabled: PC.schema.contentLength(r.predict) < predictMin,
        click: function () {
          /* ★ 값을 먼저 재어 상태에 담고, 그다음 다시 그린다.
             다시 그린 화면이 «방금 누른 실험» 하나만 애니메이션으로 재생한다. */
          var sensor = sensorFor(item);
          var result = A.run(sourceOf(), {
            loopLimit: 60,
            ledPin: PC.LED_PIN,
            inputFn: sensor.inputFn
          });
          var endState = sensor.stateAt(item.runMs);
          var phases = A.ledPhases(result);
          var everOn = phases.some(function (ph) {
            return ph.on;
          }) || result.led.on === true;
          var lines = result.console || [];
          var lastLine = lines.length > 0 ? lines[lines.length - 1].text : "";

          /* DO 를 «한 줄 요약» 으로 적는다. 실험 ②는 HIGH 였다가 LOW 가 되는 것이 핵심이다. */
          var doSummary = endState.level
            ? "HIGH"
            : everOn
            ? "HIGH → (유지 시간 뒤) LOW"
            : "LOW";

          justRanExperiment = item.id;
          app.update(function (s) {
            var box2 = s.experiment.runs[item.id] || { predict: "", observation: "", surprise: "" };
            box2.ran = true;
            box2.inZone = endState.inZone;
            box2.moving = endState.moving;
            box2.settled = endState.settled;
            box2.doLevel = doSummary;
            box2.ledOn = result.led.on === true;
            box2.ledEverOn = everOn;
            box2.serial = lastLine;
            s.experiment.runs[item.id] = box2;
            s.experiment.lastRun = item.id;
          });
        }
      });

      body.push(
        el("div", { class: "btnrow" }, [
          runBtn,
          el("p", {
            class: "btnrow__note",
            text:
              PC.schema.contentLength(r.predict) < predictMin
                ? "예상을 먼저 적으면 [실행] 이 열립니다."
                : "여러분이 4단계에서 만든 코드를 그대로 돌립니다."
          })
        ])
      );
      body.push(runner.viewHost);
      body.push(runner.panelHost);

      /* ── ③ 결과와 관찰 ── */
      if (r.ran) {
        body.push(
          el("div", { class: "resulttable" }, [
            el("h3", { class: "subhead", text: "실제 결과" }),
            el("dl", { class: "kv" }, [
              el("dt", { text: "사람 위치" }),
              el("dd", { text: r.inZone ? "감지 영역 «안»" : "감지 영역 «밖»" }),
              el("dt", { text: "움직임" }),
              el("dd", { text: r.moving ? "움직이는 중" : "멈춰 있음" }),
              el("dt", { text: "DO (" + PC.MOTION_PIN_NAME + ")" }),
              el("dd", { text: r.doLevel || "—" }),
              el("dt", { text: "LED" }),
              el("dd", {
                text:
                  (r.ledOn ? "● 마지막에 켜짐" : "○ 마지막에 꺼짐") +
                  (r.ledEverOn && !r.ledOn ? " (켜졌다가 꺼짐)" : "")
              }),
              el("dt", { text: "시리얼 출력" }),
              el("dd", { text: r.serial || "—" })
            ])
          ])
        );

        var obsField = UI.field(
          {
            label: "② 실행 뒤 관찰 — 무엇이 어떻게 되었나요?",
            help: "공백 제외 " + minChars + "자 이상 적어 주세요.",
            min: minChars,
            multiline: true,
            rows: 3,
            placeholder: "예) 안정화가 끝난 뒤 움직이자 DO 가 HIGH 가 되고 LED 가 켜졌다. 시리얼에는 …"
          },
          r.observation,
          function (value) {
            app.patch(function (s) {
              s.experiment.runs[item.id].observation = value;
            });
            app.rerenderNav();
            afterEdit(item);
          }
        );
        body.push(obsField.root);

        var surField = UI.field(
          {
            label: "③ 예상과 다른 점 — 없으면 «없음» 이라고 적어도 됩니다.",
            min: 2,
            multiline: true,
            rows: 2,
            placeholder: "예) 멈춘 뒤 곧바로 꺼질 줄 알았는데 몇 초 더 켜져 있었다."
          },
          r.surprise,
          function (value) {
            app.patch(function (s) {
              s.experiment.runs[item.id].surprise = value;
            });
            app.rerenderNav();
            afterEdit(item);
          }
        );
        body.push(surField.root);

        body.push(el("p", { class: "para para--quiet", text: item.note }));
      }

      box.appendChild(
        UI.card(
          {
            eyebrow: "실험 " + (index + 1) + (isDone(item) ? " · 마침" : ""),
            title: item.label,
            desc: "예상 → 실행 → 관찰 차례로 진행합니다."
          },
          body
        )
      );

      /* 실행 결과를 화면에 채운다.
         ★ 방금 누른 하나만 애니메이션으로, 나머지는 «즉시» 로. */
      if (r.ran) {
        var animate = justRanExperiment === item.id;
        runner.run(sourceOf(), { sensor: sensorFor(item), runMs: item.runMs, instant: !animate });
        if (animate) justRanExperiment = "";
      }
    });

    /* ================================================================ */
    /* ③ 확장 탐구 — «마지막 감지 후 일정 시간 유지» (선택)                 */
    /* ================================================================ */

    /* ★ 접기 상자가 아니라 «펼쳐진 카드» 다.
       통과 조건으로 올렸으므로 접혀 있으면 안 된다 — 접힌 것은 «해도 되고 말아도 되는 것» 처럼 보인다. */
    var X = L.EXTENSION;

    /* 머리띠를 «먼저» 만든다 — 글을 쓰는 동안 syncGate 가 이 두 칸을 직접 고친다 */
    var extBadge = el("span", { class: "ext__badge" });
    var extMust = el("p", { class: "ext__must" });
    var extCard = el("section", { class: "ext" });

    function syncExtHead(value) {
      var done = PC.schema.contentLength(value) >= X.minLength;
      extCard.className = "ext" + (done ? " ext--done" : "");
      extBadge.textContent = done ? "✔ 마침" : "마지막 활동 — 꼭 해야 합니다";
      extMust.textContent = done
        ? "다 적었습니다. 아래 [다음] 으로 넘어가세요."
        : "이것까지 적어야 [다음] 이 열립니다. (공백 제외 " + X.minLength + "자 이상)";
    }

    var extBody = (function () {
        var field = UI.field(
          {
            label: "규칙을 말이나 의사코드로 적어 보세요.",
            help: "코드로 적지 않아도 됩니다. 공백 제외 " + X.minLength + "자 이상.",
            min: X.minLength,
            multiline: true,
            rows: 5,
            placeholder: X.placeholder
          },
          state.experiment.keepOnText,
          function (value) {
            app.patch(function (s) {
              s.experiment.keepOnText = value;
            });
            syncGate(value);
            /* 통과 조건이므로 머리띠와 [다음] 단추가 «지금» 살아나야 한다 */
            syncExtHead(value);
            app.rerenderNav();
          }
        );

        /* ------------------------------------------------------------ */
        /* 의사코드를 적은 «뒤» 에 열리는 완성 코드 — 두 칸만 비어 있다     */
        /*                                                              */
        /* ★ 먼저 적게 하고 나서 보여 준다. 코드를 먼저 내밀면 학생은      */
        /*   그것을 옮겨 적는다. 규칙을 스스로 세우는 것이 목적이다.        */
        /*                                                              */
        /* ★ 여기서는 app.update() 를 부르지 않는다.                     */
        /*   글을 쓰는 중에 화면을 다시 그리면 커서가 튄다. 열고 닫는 것도   */
        /*   ✔ 표시도 이 자리에서 «직접» 고친다 (CLAUDE.md 의 규칙).       */
        /* ------------------------------------------------------------ */

        var R = L.EXTENSION_REVEAL;
        var typed = state.experiment.keepOnBlanks || {};

        function nonSpace(value) {
          return String(value || "").replace(/\s/g, "").length;
        }

        var revealBox = el("div", { class: "reveal" });
        revealBox.appendChild(el("h4", { class: "subhead", text: R.title }));
        revealBox.appendChild(el("p", { class: "para", text: R.intro }));

        var codeBox = el("div", { class: "reveal__code" });
        R.lines.forEach(function (line) {
          if (!line.blank) {
            codeBox.appendChild(
              el("div", { class: "reveal__row" }, [
                el("code", { class: "reveal__fixed", text: line.text || " " })
              ])
            );
            return;
          }

          var spec = R.blanks[line.blank];
          var inputId = UI.nextId("keep");
          var mark = el("span", { class: "reveal__mark", attrs: { "aria-hidden": "true" }, text: "" });
          var why = el("p", { class: "reveal__why" });

          var input = el("input", {
            class: "input input--mono reveal__input",
            id: inputId,
            attrs: {
              type: "text",
              /* ★ 힌트는 빈칸 «안» 에 적는다 */
              placeholder: spec.hint,
              spellcheck: "false",
              autocapitalize: "off",
              autocomplete: "off",
              "aria-label": spec.hint
            }
          });
          input.value = typed[line.blank] || "";
          /* ★ 폭을 힌트 길이에서 «계산» 한다. 고정폭으로 두면 한글 힌트가 잘린다.
             넘치는 만큼은 .reveal__code 가 좌우로 밀린다. */
          input.style.width = L.revealWidth(line.blank) + "ch";
          input.title = spec.hint;

          /**
           * ★ [답 보기] — 막힌 학생이 답을 확인하는 자리.
           *
           *   «빈칸을 누르면 답이 뜨게» 하지 않는다. 적으려고 누른 순간 답이 떠서
           *   빈칸이 아무 뜻도 없어진다. 3단계 [정답 확인] 과 같은 방식으로
           *   빈칸에 «붙은 단추» 로 둔다.
           *
           *   ★ 답을 본 것은 «맞힌 것» 과 다르게 적는다. 칸에 정답이 들어가 있어도
           *     ✔ 가 아니라 「답 봄」 이라고 적어야 학생이 스스로를 속이지 않는다.
           */
          var sawAnswer = false;

          var peek = UI.button("답 보기", {
            class: "btn btn--ghost btn--small reveal__peek",
            title: "막히면 눌러 보세요",
            click: function () {
              sawAnswer = true;
              input.value = spec.answer;
              app.patch(function (s) {
                if (!s.experiment.keepOnBlanks) s.experiment.keepOnBlanks = {};
                s.experiment.keepOnBlanks[line.blank] = input.value;
              });
              refresh();
              input.focus();
            }
          });

          function refresh() {
            var ok = L.revealFilled(line.blank, input.value);
            var empty = !String(input.value).trim();
            input.classList.toggle("is-ok", ok && !sawAnswer);
            input.classList.toggle("is-seen", ok && sawAnswer);
            input.classList.toggle("is-off", !ok && !empty);
            mark.textContent = ok ? (sawAnswer ? "답 봄" : "✔") : empty ? "" : "…";
            mark.className = "reveal__mark" + (ok ? (sawAnswer ? " is-seen" : " is-ok") : "");
            peek.disabled = ok;
            peek.textContent = ok ? (sawAnswer ? "답을 봤습니다" : "맞혔습니다") : "답 보기";
            /* 맞히거나 답을 본 «뒤» 에 왜 그런지 알려 준다 — 먼저 보여 주면 답을 적어 준 셈이다 */
            why.textContent = ok ? spec.why : "";
          }

          input.addEventListener("input", function () {
            /* 스스로 고쳐 적으면 «답 봄» 표시를 거둔다 */
            if (input.value !== spec.answer) sawAnswer = false;
            app.patch(function (s) {
              if (!s.experiment.keepOnBlanks) s.experiment.keepOnBlanks = {};
              s.experiment.keepOnBlanks[line.blank] = input.value;
            });
            refresh();
          });
          refresh();

          codeBox.appendChild(
            el("div", { class: "reveal__row reveal__row--blank" }, [
              el("code", { class: "reveal__fixed", text: "  ".repeat(line.indent || 0) + (line.before || "") }),
              input,
              el("code", { class: "reveal__fixed", text: line.after || "" }),
              mark,
              peek
            ])
          );
          codeBox.appendChild(why);
        });

        revealBox.appendChild(codeBox);
        revealBox.appendChild(UI.alert("info", R.note));

        /* 아직 적지 않았으면 «무엇을 해야 열리는지» 를 대신 보여 준다 */
        var lockNote = el("p", {
          class: "reveal__lock",
          text: "위에 규칙을 " + X.minLength + "자 이상 적으면 «" + R.title + "» 가 열립니다."
        });

        function syncGate(value) {
          var open = nonSpace(value) >= X.minLength;
          revealBox.hidden = !open;
          lockNote.hidden = open;
        }
        syncGate(state.experiment.keepOnText);

        return el("div", {}, [
          /* ★ 기준 프로그램에 타이머가 «이미 있는 것처럼» 오해시키지 않는다 */
          UI.alert("warn", X.warn),
          el("p", { class: "para", text: X.intro }),
          el("p", { class: "para", text: X.goal }),
          el("ol", { class: "orderlist" }, X.steps.map(function (line) {
            return el("li", { text: line });
          })),
          UI.alert("info", X.hint),
          field.root,
          lockNote,
          revealBox
        ]);
    })();

    extCard.appendChild(
      el("div", { class: "ext__head" }, [
        extBadge,
        el("h3", { class: "ext__title", text: X.title }),
        extMust
      ])
    );
    extCard.appendChild(el("div", { class: "ext__body" }, [extBody]));
    syncExtHead(state.experiment.keepOnText);
    box.appendChild(extCard);

    return box;
  }

  /* ================================================================== */
  /* 6단계 — 형성평가·제출                                                */
  /*                                                                    */
  /* 짜임새를 lesson3_7_1 의 6단계와 «같게» 맞추었다.                      */
  /*   ① 형성평가            — 응시자 정보 → 문항 하나씩 → 채점·제출        */
  /*   ② 채점·제출 진행 상황  — 오른쪽 검은 창에 한 줄씩 기록               */
  /*   ③ 학습 정리            — 요약 · 핵심 문법 카드 · 내가 쓴 것 되돌아보기 */
  /*                                                                    */
  /* 문항을 «한 번에 하나» 만 보여 준다. 다섯 개를 한꺼번에 늘어놓으면        */
  /* 화면이 길어져 어디를 보아야 할지 알기 어렵다.                          */
  /* ================================================================== */

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** ①②③ 이 붙은 구역 제목 */
  function sectionTitle(tag, text) {
    return el("h3", { class: "section-title" }, [
      el("span", { class: "section-title__tag", attrs: { "aria-hidden": "true" }, text: tag }),
      el("span", { text: text })
    ]);
  }

  /** 제목이 붙은 판 하나 */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body stack" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: "panel" }, [head, body]);
    return { root: root, body: body };
  }

  /** 왼쪽·오른쪽 두 쪽 — 900px 아래에서는 위아래로 쌓인다 */
  function split(className) {
    var left = el("div", { class: "stack" });
    var right = el("div", { class: "stack" });
    return {
      root: el("div", { class: "split" + (className ? " " + className : "") }, [left, right]),
      left: left,
      right: right
    };
  }

  /** 작은 알림표 */
  function badge(kind, text) {
    var map = { true: "badge--true", false: "badge--false", primary: "badge--primary" };
    return el("span", { class: ("badge " + (map[kind] || "")).trim(), text: text });
  }

  /** 진행 상황을 한 줄씩 쌓는 검은 창 */
  function makeConsole(spec) {
    var s = spec || {};
    var body = el("div", {
      class: "console__body",
      attrs: { role: "log", "aria-live": "polite", "aria-label": s.ariaLabel || "채점·제출 진행 상황", tabindex: "0" }
    });
    var root = el("div", { class: "console" }, [
      el("div", { class: "console__head" }, [
        el("span", { class: "console__dot", attrs: { "aria-hidden": "true" } }),
        el("span", { text: s.title || "진행 기록" })
      ]),
      body
    ]);

    function showEmpty() {
      UI.clear(body).appendChild(el("p", { class: "console__empty", text: s.emptyText || "여기에 기록이 쌓입니다." }));
    }

    function line(text, modifier) {
      if (body.querySelector(".console__empty")) UI.clear(body);
      body.appendChild(
        el("div", { class: ("console__line " + (modifier || "")).trim() }, [
          el("span", { class: "console__prompt", attrs: { "aria-hidden": "true" }, text: ">" }),
          el("span", { class: "console__text", text: text })
        ])
      );
      body.scrollTop = body.scrollHeight;
    }

    showEmpty();

    return {
      root: root,
      write: function (t) { line(t); },
      ok: function (t) { line(t, "console__line--ok"); },
      hint: function (t) { line(t, "console__line--hint"); },
      error: function (t) { line(t, "console__line--error"); },
      muted: function (t) { line(t, "console__line--muted"); }
    };
  }

  function renderAssess(state, app) {
    var box = el("div");
    var Q = PC.quiz;
    var answers = state.assessment.answers;
    var total = Q.QUESTIONS.length;

    /* 답안을 냈는가 — 냈으면 답을 고칠 수 없고, 그때 비로소 채점이 열린다 */
    var sealed = state.assessment.sealed === true;

    /** 이 문항에 답을 했는가 */
    function isAnswered(q) {
      var v = answers[q.id];
      if (q.type === "choice") return typeof v === "number" && v >= 0;
      return String(v === undefined || v === null ? "" : v).trim().length > 0;
    }

    /* ---------------- ② 진행 상황 창 (오른쪽) ---------------- */

    var cons = makeConsole({
      title: "채점·제출 기록",
      emptyText: "학번과 이름을 넣고 문항에 답하면 여기에 기록이 쌓입니다."
    });

    /* ---------------- 응시자 정보 ---------------- */

    var idInput = el("input", {
      class: "student-field__input",
      id: "assess-sid",
      attrs: { type: "text", inputmode: "numeric", maxlength: "5", placeholder: "예) 10312", autocomplete: "off" }
    });
    idInput.value = state.student.studentId || "";

    var nameInput = el("input", {
      class: "student-field__input",
      id: "assess-name",
      attrs: { type: "text", maxlength: "20", placeholder: "예) 홍길동", autocomplete: "off" }
    });
    nameInput.value = state.student.name || "";

    var studentNote = el("p", { class: "student-card__note", attrs: { role: "status" } });

    var studentCard = el("div", { class: "student-card" }, [
      el("div", { class: "student-card__head" }, [
        el("h4", { class: "student-card__title", text: "응시자 정보" }),
        el("span", { class: "student-card__badge", text: "제출 전 필수" })
      ]),
      el("div", { class: "student-card__fields" }, [
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-sid" }, text: "학번 (5자리)" }),
          idInput
        ]),
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-name" }, text: "이름" }),
          nameInput
        ])
      ]),
      studentNote,
      el("p", { class: "student-card__privacy", text: "1학년 3반 12번이면 10312 입니다. 학번과 이름은 제출한 답을 알아보는 데에만 씁니다." })
    ]);

    var gate = el("div", { class: "quiz-gate" }, [
      el("span", { class: "quiz-gate__icon", attrs: { "aria-hidden": "true" }, text: "🔒" }),
      el("span", { text: "학번과 이름을 넣으면 문항이 열립니다." })
    ]);

    /* ---------------- 화면이 들어갈 자리 ---------------- */

    var quizBody = el("div", { class: "quiz__body" });
    /* 단추 넷을 «한 줄» 에 놓는다.
       이동 단추의 글자를 「← 이전」·「다음 →」 로 줄여 자리를 만들었다.
       바로 위에 「문항 N / 5」 가 있어 무엇을 옮기는 것인지 알 수 있다.
       (이 이름은 교사용 아래쪽 이동 단추와도 같다) */
    var actionRow = el("div", { class: "btnrow btnrow--one" });
    var actionNote = el("p", { class: "quiz__note" });
    var messageHost = el("div");

    /* 지금 보고 있는 문항 — 아직 답하지 않은 첫 문항에서 시작한다 */
    var current = 0;
    for (var qi = 0; qi < total; qi++) {
      if (!isAnswered(Q.QUESTIONS[qi])) {
        current = qi;
        break;
      }
    }

    function ready() {
      return PC.schema.validateStudent(state.student).ok;
    }

    /* ---------------- 단추들 ---------------- */

    var prevBtn = UI.button("← 이전", {
      class: "btn btn--ghost",
      click: function () {
        if (current > 0) {
          current -= 1;
          drawQuestion();
        }
      }
    });

    var nextBtn = UI.button("다음 →", {
      class: "btn btn--ghost",
      click: function () {
        if (current < total - 1) {
          current += 1;
          drawQuestion();
        }
      }
    });

    /**
     * ★ 채점은 «답안을 낸 뒤에만» 열린다.
     *
     * 정답과 해설을 먼저 본 뒤에 답을 고쳐 내면 형성평가가 아무 뜻이 없어진다.
     * 그래서 답안을 잠근(`assessment.sealed`) 다음에 비로소 이 단추가 열린다.
     * 잠기는 길은 두 가지 — 서버로 제출하거나, JSON 파일로 받아 내는 것.
     */
    var gradeBtn = UI.button("채점하기", {
      click: function () {
        if (state.assessment.sealed !== true) return; /* 두 겹으로 막는다 */
        app.update(function (s) {
          s.assessment.graded = true;
          s.assessment.attempts += 1;
        });
      }
    });

    /* 답안을 낸 뒤에는 «고치기» 가 아니라 «다시 보기» 다 */
    var retryBtn = UI.button(sealed ? "내 답 다시 보기" : "답 고치기", {
      class: "btn btn--ghost",
      click: function () {
        app.update(function (s) {
          s.assessment.graded = false;
        });
      }
    });

    /* 제출 주소 칸 — 설정에 주소가 없을 때만 (명세 10장) */
    var endpointField = null;
    if (PC.config.needsUrlInput()) {
      endpointField = UI.field(
        {
          label: "제출 주소",
          help: "선생님이 알려 주신 주소를 붙여 넣으세요. 한 번 넣으면 이 기기에 기억됩니다.",
          placeholder: "https://script.google.com/.../exec"
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
    }

    /* -------------- 제출 — «한 번만» 이므로 한 번 더 물어본다 -------------- */

    var busy = false;

    /* 제출 전에 눈에 띄게 알린다. 잠긴 뒤에는 감춘다. */
    var onceNote = UI.alert("warn", "답안은 «한 번만» 제출할 수 있습니다.", [
      el("p", {
        class: "alert__fix",
        text:
          "제출한 뒤에는 답을 고칠 수 없습니다. 다섯 문항을 모두 다시 살펴본 뒤에 누르세요. " +
          "제출하면 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다."
      })
    ]);

    /* 되묻는 상자가 놓이는 자리 — 단추 바로 아래에 나타난다 */
    var confirmHost = el("div");

    function closeConfirm() {
      UI.clear(confirmHost);
      refreshActions();
    }

    /**
     * 되돌릴 수 없는 일을 하기 전에 한 번 더 묻는다.
     * 브라우저 confirm() 을 쓰지 않는다 — 화면 읽기 도구와 잘 맞지 않고 모양도 다르다.
     */
    function askConfirm(spec) {
      UI.clear(confirmHost);
      submitBtn.disabled = true;
      downloadBtn.disabled = true;

      var okBtn = UI.button(spec.okLabel, {
        click: function () {
          UI.clear(confirmHost);
          spec.onOk();
        }
      });

      confirmHost.appendChild(
        UI.alert("warn", spec.message, [
          el("p", { class: "alert__fix", text: spec.detail }),
          el("div", { class: "btnrow" }, [
            okBtn,
            UI.button("아니요, 더 확인하겠습니다", { class: "btn btn--ghost", click: closeConfirm })
          ])
        ])
      );
      okBtn.focus();
    }

    /** 낼 수 있는 상태인가 — 서버 제출과 파일 제출이 같은 조건을 쓴다 */
    function guard() {
      var check = PC.schema.validateStudent(state.student);
      if (!check.ok) {
        refreshGate();
        cons.error("학번과 이름을 먼저 바르게 넣어 주세요.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "학번과 이름을 먼저 바르게 넣어 주세요."));
        return false;
      }
      if (!Q.gradeAll(state.assessment.answers).allAnswered) {
        cons.error("답하지 않은 문항이 있습니다.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "다섯 문항에 모두 답해야 제출할 수 있습니다."));
        return false;
      }
      return true;
    }

    function doSend() {
      busy = true;
      UI.clear(messageHost);
      refreshActions();
      submitBtn.textContent = "제출 중…";

      var payload = PC.schema.buildPayload(state);
      S.store.saveStudent(state.student);
      cons.write("제출을 시작합니다 — " + S.api.fileNameFor(payload));

      S.api.submit(payload, endpointField ? endpointField.input.value : "").then(function (result) {
        busy = false;

        if (result.ok) {
          cons.ok(
            (result.updated ? "이전 제출을 덮어썼습니다 — " : "저장을 마쳤습니다 — ") +
              (result.fileName || S.api.fileNameFor(payload))
          );
          cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
          app.update(function (s) {
            s.submissionId = result.submissionId || "";
            s.submitted = {
              at: result.serverUpdatedAt || new Date().toISOString(),
              demo: result.demo === true,
              via: "server"
            };
            /* ★ 여기서 답안이 잠긴다 */
            s.assessment.sealed = true;
          });
          UI.toast("제출했습니다. 이제 채점할 수 있습니다.");
          return;
        }

        /* 실패했을 때는 «잠그지 않는다». 고쳐서 다시 낼 수 있어야 한다.
           답안도 버리지 않는다 — 임시 저장에 남기고 «파일로 내는 길» 을 그 자리에서 준다.
           단추를 늘 내보이지 않는 까닭 : 평소에는 서버로 내는 길 하나만 보이는 것이 헷갈리지 않다. */
        S.store.queuePending(payload);
        cons.error("제출 실패 — " + result.message);
        cons.hint("[파일로 내기] 로 파일을 받아 선생님께 내도 됩니다.");
        UI.clear(messageHost).appendChild(
          UI.alert("warn", result.message, [
            el("p", {
              class: "alert__fix",
              text: "아래 [파일로 내기] 로 파일을 받아 선생님께 내도 됩니다. 아직 제출되지 않았으니 답은 그대로 남아 있습니다."
            }),
            el("div", { class: "btnrow" }, [downloadBtn])
          ])
        );
        refreshActions();
      });
    }

    function doDownload() {
      var payload = PC.schema.buildPayload(state);
      if (!S.api.download(payload)) {
        cons.error("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        UI.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        refreshActions();
        return;
      }

      cons.write("파일로 냈습니다 — " + S.api.fileNameFor(payload));
      UI.toast("파일을 내려받았습니다. 선생님께 내 주세요.");

      if (state.assessment.sealed !== true) {
        cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
        S.store.saveStudent(state.student);
        app.update(function (s) {
          /* ★ 파일로 내는 것도 제출이다. 여기서도 답안이 잠긴다. */
          s.assessment.sealed = true;
        });
        return;
      }
      refreshActions();
    }

    var submitBtn = UI.button("답안 제출하기", {
      click: function () {
        if (busy) return;

        if (state.submitted) {
          UI.clear(messageHost).appendChild(
            UI.alert("info", "이미 제출을 마쳤습니다. 답안은 한 번만 제출할 수 있습니다.")
          );
          return;
        }
        if (!guard()) return;

        askConfirm({
          message: "정말 제출할까요? 답안은 한 번만 제출할 수 있습니다.",
          detail: "제출한 뒤에는 답을 고칠 수 없습니다. 대신 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다.",
          okLabel: "예, 제출합니다",
          onOk: doSend
        });
      }
    });

    /**
     * 파일로 내는 길 (명세 10장).
     *
     * ★ 단추 줄에는 놓지 않는다. 서버 제출이 실패했을 때 그 알림 상자 안에 나타난다.
     *   평소에는 «답안 제출하기» 하나만 보이는 것이 학생에게 헷갈리지 않고,
     *   주소가 없는 학생도 제출을 눌러 보면 이 길을 만나므로 막다른 길이 되지 않는다.
     *
     * 누르는 자리를 44px 로 지키려고 btn--small 을 쓰지 않는다 (명세 접근성).
     */
    var downloadBtn = UI.button("파일로 내기", {
      class: "btn btn--ghost",
      click: function () {
        if (busy) return;
        if (!guard()) return;

        /* 이미 잠긴 뒤라면 그냥 한 번 더 받는 것이므로 되묻지 않는다 */
        if (state.assessment.sealed === true) {
          doDownload();
          return;
        }

        askConfirm({
          message: "이 파일이 곧 제출물입니다. 내려받으면 답을 고칠 수 없습니다.",
          detail: "받은 파일을 선생님께 내야 합니다. 내려받으면 [채점하기] 가 열립니다.",
          okLabel: "예, 내려받습니다",
          onOk: doDownload
        });
      }
    });

    /* ---------------- 잠금·단추 상태 새로 고치기 ---------------- */

    function refreshGate() {
      var check = PC.schema.validateStudent(state.student);
      var ok = check.ok;

      studentCard.className = "student-card" + (ok ? " is-ready" : "");
      idInput.className = "student-field__input" + (state.student.studentId && check.errors.studentId ? " is-invalid" : "");
      nameInput.className = "student-field__input" + (state.student.name && check.errors.name ? " is-invalid" : "");

      studentNote.className = "student-card__note" + (ok ? " is-ok" : "");
      studentNote.textContent = ok
        ? "확인되었습니다 — " + state.student.studentId + " " + state.student.name
        : check.errors.studentId || check.errors.name || "학번과 이름을 넣어 주세요.";

      gate.hidden = ok;
      quizBody.className = "quiz__body" + (ok ? "" : " is-gated");

      refreshActions();
    }

    function refreshActions() {
      var now = Q.gradeAll(state.assessment.answers);
      var ok = ready();
      var locked = state.assessment.sealed === true; /* 답안을 냈다 */
      var sentToServer = !!state.submitted;
      var canHandIn = ok && now.allAnswered;

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;

      /* ★ 채점은 답안을 낸 뒤에만 열린다 */
      gradeBtn.disabled = !locked;
      gradeBtn.title = locked ? "" : "답안을 제출한 뒤에 채점 결과를 볼 수 있습니다.";

      submitBtn.disabled = busy || sentToServer || !canHandIn;
      submitBtn.title = sentToServer
        ? "답안은 한 번만 제출할 수 있습니다."
        : canHandIn
          ? ""
          : "학번·이름을 넣고 다섯 문항에 모두 답해야 제출할 수 있습니다.";
      if (!busy) submitBtn.textContent = sentToServer ? "제출 완료" : "답안 제출하기";

      downloadBtn.disabled = busy || !canHandIn;
      downloadBtn.title = canHandIn ? "" : "학번·이름을 넣고 다섯 문항에 모두 답해야 파일로 낼 수 있습니다.";

      /* 제출 전 경고는 아직 내지 않았을 때만 */
      onceNote.hidden = locked;

      var lines = [];
      if (!ok) lines.push("학번과 이름을 넣어야 제출할 수 있습니다.");
      if (!now.allAnswered) {
        lines.push("답한 문항 " + now.answeredCount + " / " + total + " — 모두 답하면 [답안 제출하기] 가 열립니다.");
      }
      if (locked) {
        lines.push("답안을 냈으므로 답을 고칠 수 없습니다. [채점하기] 로 점수와 해설을 볼 수 있습니다.");
      } else if (canHandIn) {
        lines.push("다섯 문항에 모두 답했습니다. 제출은 «한 번만» 할 수 있고, 제출한 뒤에 [채점하기] 가 열립니다.");
      }
      actionNote.textContent = lines.join(" ");
    }

    /* ---------------- 문항 하나 그리기 ---------------- */

    function pick(q, index) {
      if (state.assessment.sealed === true) return; /* 낸 뒤에는 고칠 수 없다 */
      app.patch(function (s) {
        s.assessment.answers[q.id] = index;
      });
      cons.write(q.no + "번 — " + (CIRCLED[index] || index + 1) + " 선택");
      app.rerenderNav();
      drawQuestion();
    }

    function drawQuestion() {
      UI.clear(quizBody);
      var q = Q.QUESTIONS[current];

      /* 문항 번호와 진행 점 */
      var dots = el("div", { class: "quiz__dots" });
      Q.QUESTIONS.forEach(function (item, i) {
        var done = isAnswered(item);
        dots.appendChild(
          el("button", {
            class: "quiz__dot" + (done ? " is-answered" : "") + (i === current ? " is-current" : ""),
            attrs: {
              type: "button",
              "aria-label": item.no + "번 문항으로 이동" + (done ? " (답함)" : " (아직 답하지 않음)"),
              "aria-current": i === current ? "true" : null
            },
            on: {
              click: function () {
                current = i;
                drawQuestion();
              }
            }
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "quiz__meta" }, [
          el("span", { class: "quiz__counter", text: "문항 " + (current + 1) + " / " + total }),
          dots
        ])
      );

      /* 무엇을 묻는 문항인지 알려 주는 딱지.
         5번은 tag 가 이미 «완성형» 이라 형식 딱지와 겹친다 — 겹치면 하나만 붙인다. */
      var kind = q.type === "choice" ? "객관식" : "완성형";
      quizBody.appendChild(
        el("div", { class: "quiz__tags" }, [
          badge("primary", q.tag),
          kind === q.tag ? null : badge("", kind),
          badge("", q.points + "점")
        ].filter(Boolean))
      );

      quizBody.appendChild(
        el("p", { class: "quiz__question" }, [
          el("span", { class: "quiz__no", text: q.no + "." }),
          el("span", { text: q.stem })
        ])
      );

      if (q.code) quizBody.appendChild(ED.codeView(q.code, {}).root);

      /* 답안을 낸 뒤에는 «읽기만» 된다. 정답을 본 뒤 고쳐 내는 일을 막는다. */
      var locked = state.assessment.sealed === true;

      if (q.type === "choice") {
        var options = el("div", { class: "options" });
        q.choices.forEach(function (choice, i) {
          var picked = answers[q.id] === i;
          var radio = el("input", { attrs: { type: "radio", name: "quiz-" + q.id, value: String(i) } });
          radio.checked = picked;
          radio.disabled = locked;
          radio.addEventListener("change", function () {
            pick(q, i);
          });
          options.appendChild(
            el("label", { class: "option" + (picked ? " is-selected" : "") + (locked ? " option--locked" : "") }, [
              radio,
              el("span", { class: "option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
              el("span", { class: "option__text", text: choice })
            ])
          );
        });
        quizBody.appendChild(options);
      } else {
        quizBody.appendChild(UI.codeBlock(q.template, "빈칸 두 줄을 채우세요."));

        var lint = el("div", { class: "lint" });
        function drawLint(value) {
          UI.clear(lint);
          Q.lintCodeAnswer(value).forEach(function (note) {
            lint.appendChild(UI.alert(note.level === "warn" ? "warn" : "info", note.message));
          });
        }

        var codeField = UI.field(
          { label: "빠진 두 줄", help: q.help, multiline: true, rows: 3, mono: true, placeholder: q.placeholder },
          answers[q.id] || "",
          function (value) {
            app.patch(function (s) {
              s.assessment.answers[q.id] = value;
            });
            drawLint(value);
            app.rerenderNav();
            refreshActions();
            /* 점을 채우려면 다시 그려야 하지만, 글을 쓰는 중에 다시 그리면
               글자를 넣던 자리를 잃는다. 점만 손으로 고친다. */
            var marks = quizBody.querySelectorAll(".quiz__dot");
            if (marks[current]) {
              marks[current].className =
                "quiz__dot is-current" + (String(value || "").trim() ? " is-answered" : "");
            }
          }
        );
        codeField.input.readOnly = locked;
        quizBody.appendChild(codeField.root);
        quizBody.appendChild(lint);
        drawLint(answers[q.id] || "");
      }

      quizBody.appendChild(
        el("p", {
          class: "quiz__note",
          text: locked
            ? "답안을 냈으므로 고칠 수 없습니다. 점을 눌러 내가 낸 답을 확인할 수 있어요."
            : q.type === "choice"
              ? "고른 답은 곧바로 저장됩니다. 점을 눌러 다른 문항으로 건너갈 수 있어요."
              : "세미콜론(;) 과 대소문자까지 그대로 지켜야 맞습니다."
        })
      );

      refreshActions();
    }

    /* ---------------- 채점 결과 그리기 ---------------- */

    function drawResult() {
      UI.clear(quizBody);
      quizBody.className = "quiz__body";

      var revealed = Q.reveal(state.assessment.answers);
      if (!revealed.allowed) {
        quizBody.appendChild(UI.alert("info", revealed.reason));
        return;
      }

      var g = revealed.graded;
      var okCount = 0;
      revealed.items.forEach(function (item) {
        if (item.correct) okCount += 1;
      });

      var marks = el("div", { class: "score-dots" });
      revealed.items.forEach(function (item) {
        marks.appendChild(
          el("span", {
            class: "score-dot" + (item.correct ? " is-correct" : ""),
            attrs: { "aria-label": item.no + "번 " + (item.correct ? "맞음" : "틀림") },
            text: item.correct ? "○" : "✕"
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "score-card" }, [
          el("p", { class: "score-card__title", text: "형성평가 결과" }),
          el("p", { class: "score-card__student" }, [
            el("strong", { text: state.student.studentId || "학번 미입력" }),
            el("span", { text: " " + (state.student.name || "") })
          ]),
          el("p", { class: "score-card__value" }, [
            el("span", { text: String(g.score) }),
            el("small", { text: " / " + g.total + "점" })
          ]),
          marks,
          el("p", { class: "score-card__count", text: "맞힌 문항 " + okCount + " / " + total }),
          el("p", { class: "score-card__level" }, [
            el("span", { text: "판정 : " }),
            el("strong", { text: g.pass ? "이수" : "미이수" }),
            el("span", { text: g.pass ? "" : " (6점 이상 필요)" })
          ]),
          el("p", {
            class: "score-card__comment",
            text: g.pass
              ? "잘했어요. 아래 해설로 한 번 더 확인해 보세요."
              : "괜찮아요. 해설을 읽고 [답 고치기] 로 다시 풀 수 있습니다."
          })
        ])
      );

      quizBody.appendChild(el("h4", { class: "subhead", text: "문항별 해설" }));
      revealed.items.forEach(function (item) {
        quizBody.appendChild(
          el("div", { class: "review" + (item.correct ? " review--ok" : "") }, [
            el("p", { class: "review__head" }, [
              el("span", { class: "review__mark", attrs: { "aria-hidden": "true" }, text: item.correct ? "✔" : "✘" }),
              el("span", { class: "review__no", text: item.no + "번" }),
              el("span", { class: "review__state", text: item.correct ? "맞음" : "틀림" })
            ]),
            el("p", { class: "review__stem", text: item.stem }),
            el("p", { class: "review__answer", text: "정답 : " + item.answerText }),
            el("p", { class: "review__why", text: item.explanation })
          ])
        );
      });
    }

    /* ---------------- ① 형성평가 ---------------- */

    box.appendChild(sectionTitle("①", "형성평가"));

    var top = split("split--wide-left");

    var quizPanel = panel({
      title: "5문항 · 총 10점",
      hint: "6점 이상이면 이수입니다."
    });

    quizPanel.body.appendChild(studentCard);
    quizPanel.body.appendChild(gate);
    quizPanel.body.appendChild(quizBody);
    /* 제출은 한 번뿐이라는 것을 단추 «바로 위» 에서 알린다 */
    quizPanel.body.appendChild(onceNote);
    quizPanel.body.appendChild(actionRow);
    quizPanel.body.appendChild(actionNote);
    quizPanel.body.appendChild(confirmHost);
    if (PC.config.isDemo()) {
      quizPanel.body.appendChild(
        UI.alert("info", "지금은 데모 모드입니다. 제출은 이 기기 안에만 저장되며 선생님께 가지 않습니다.")
      );
    }
    if (endpointField) quizPanel.body.appendChild(endpointField.root);
    if (state.submitted) {
      quizPanel.body.appendChild(
        UI.alert("ok", "제출을 마쳤습니다. (" + S.formatTime(state.submitted.at) + ")", [
          el("p", {
            class: "alert__fix",
            text: "답안은 한 번만 제출할 수 있어 이제 고칠 수 없습니다. 고쳐야 할 일이 있으면 선생님께 말씀드리세요."
          })
        ])
      );
    } else if (sealed) {
      quizPanel.body.appendChild(
        UI.alert("ok", "파일로 냈습니다.", [
          el("p", {
            class: "alert__fix",
            text: "내려받은 " + S.api.fileNameFor(PC.schema.buildPayload(state)) + " 을 선생님께 내 주세요. 답안은 이제 고칠 수 없습니다."
          })
        ])
      );
    }
    quizPanel.body.appendChild(messageHost);
    quizPanel.body.appendChild(el("p", { class: "privacy", text: PC.MESSAGES.privacy }));

    top.left.appendChild(quizPanel.root);

    var consPanel = panel({ title: "② 채점·제출 진행 상황", hint: "무엇이 저장되었는지 여기서 확인합니다." });
    consPanel.body.appendChild(cons.root);
    top.right.appendChild(consPanel.root);

    box.appendChild(top.root);

    /* 어떤 단추를 놓을지 — 채점 전과 채점 뒤가 다르다.
       [채점하기] 와 [답안 제출하기] 를 나란히 둔다. 학생이 다음에 누를 것이 그 둘뿐이다.
       파일로 내는 단추는 여기 두지 않는다 — 제출이 실패했을 때 알림 상자 안에 나타난다. */
    if (state.assessment.graded) {
      actionRow.appendChild(retryBtn);
      actionRow.appendChild(submitBtn);
      drawResult();
    } else {
      actionRow.appendChild(prevBtn);
      actionRow.appendChild(nextBtn);
      actionRow.appendChild(gradeBtn);
      actionRow.appendChild(submitBtn);
      drawQuestion();
    }

    /* 학번·이름 칸 — 고칠 때마다 잠금과 단추를 다시 판단한다 */
    function onInfo() {
      app.patch(function (s) {
        s.student.studentId = idInput.value.trim();
        s.student.name = nameInput.value.trim();
      });
      refreshGate();
      app.rerenderNav();
    }
    idInput.addEventListener("input", onInfo);
    nameInput.addEventListener("input", onInfo);
    refreshGate();

    /* 다시 그린 뒤에도 그동안의 일이 보이도록 상태에서 되살린다 */
    var seeded = Q.gradeAll(state.assessment.answers);
    cons.muted(
      "응시자 : " +
        (ready() ? state.student.studentId + " " + state.student.name : "아직 넣지 않음")
    );
    cons.muted("답한 문항 " + seeded.answeredCount + " / " + total);
    if (state.assessment.graded) {
      var shown = Q.reveal(state.assessment.answers);
      if (shown.allowed) {
        var line = "채점 결과 " + shown.graded.score + " / " + shown.graded.total + "점 — " + (shown.graded.pass ? "이수" : "미이수");
        if (shown.graded.pass) cons.ok(line);
        else cons.hint(line);
      }
    }
    if (state.submitted) {
      /* 제출 직후에 적은 줄은 화면을 다시 그리면서 사라진다.
         그래서 «어디에 무엇으로 저장되었는지» 를 상태에서 다시 만들어 남긴다. */
      cons.ok(
        "제출 완료 — " +
          S.formatTime(state.submitted.at) +
          " · " +
          S.api.fileNameFor(PC.schema.buildPayload(state)) +
          (state.submitted.demo ? " (데모)" : "")
      );
    } else if (sealed) {
      cons.ok("파일로 냈습니다 — " + S.api.fileNameFor(PC.schema.buildPayload(state)));
    }
    if (sealed) cons.muted("답안이 잠겼습니다. 답을 고칠 수 없습니다.");
    else cons.muted("답안은 한 번만 제출할 수 있습니다.");

    /* ---------------- ③ 학습 정리 ---------------- */

    box.appendChild(sectionTitle("③", "학습 정리"));

    var wrap = panel({ title: "오늘 배운 내용 요약", hint: "다음 차시로 이어지는 " + L.WRAP_UP.length + "줄입니다." });
    wrap.body.appendChild(
      el("div", { class: "summary-list" }, L.WRAP_UP.map(function (text, i) {
        return el("div", { class: "summary-item" }, [
          el("span", { class: "summary-item__num", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
          el("span", { class: "summary-item__text", text: text })
        ]);
      }))
    );
    box.appendChild(wrap.root);

    var syntax = panel({
      title: "이 차시에 새로 나온 것",
      hint: "읽기(digitalRead) · 담기(int motion = …) · 갈라지기(if–else) 셋입니다."
    });
    var news = (L.CODE_WALKTHROUGH && L.CODE_WALKTHROUGH.news) || [];
    syntax.body.appendChild(
      el("div", { class: "syntaxcards" }, news.map(function (f) {
        return el("div", { class: "syntaxcard" }, [
          /* 머리에는 이름만 둔다. «언제 쓰는가» 는 2단계 카드에 그대로 있다. */
          el("div", { class: "syntaxcard__head" }, [
            el("code", { class: "syntaxcard__title", text: f.name })
          ]),
          el("p", { class: "syntaxcard__note", text: f.what }),
          el("p", { class: "syntaxcard__note", text: f.why })
        ]);
      }))
    );
    box.appendChild(syntax.root);

    /* 내가 쓴 것 되돌아보기 — 4·5단계에서 직접 적은 것을 그대로 보여 준다 */
    var mine = panel({ title: "내가 쓴 정리 되돌아보기", hint: "4·5단계에서 직접 적은 것입니다." });

    var myCode = String(state.code.source || "").trim();
    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 만든 스케치" }));
    mine.body.appendChild(
      el("div", {
        class: "my-answer my-answer--code" + (myCode ? "" : " is-empty"),
        text: myCode || "4단계에서 만든 코드가 여기에 나타납니다."
      })
    );

    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 이은 회로" }));
    var connText = (state.circuit.connections || [])
      .map(function (conn) {
        return (
          C.describe(conn.fromComponent, conn.fromPin) + " → " + C.describe(conn.toComponent, conn.toPin)
        );
      })
      .join("\n");
    mine.body.appendChild(
      el("div", { class: "my-answer" + (connText ? "" : " is-empty") }, [
        el("span", { text: connText || "3단계에서 이은 케이블이 여기에 나타납니다." })
      ])
    );

    /* 실험 기록 — 예상 · 관찰 · 예상과 다른 점을 그대로 되짚는다 */
    var expText = [];
    L.EXPERIMENTS.forEach(function (item) {
      var r = (state.experiment.runs || {})[item.id];
      if (!r || !r.ran) return;
      var line = item.label;
      if (r.doLevel) line += "\n  실제 DO : " + r.doLevel;
      if (r.serial) line += "\n  시리얼 : " + r.serial;
      if (String(r.predict || "").trim()) line += "\n  예상 : " + r.predict;
      if (String(r.observation || "").trim()) line += "\n  관찰 : " + r.observation;
      if (String(r.surprise || "").trim()) line += "\n  다른 점 : " + r.surprise;
      expText.push(line);
    });

    /* 확장 탐구도 «내가 쓴 것» 이므로 함께 되짚는다 */
    if (String(state.experiment.keepOnText || "").trim()) {
      expText.push("확장 — 마지막 감지 후 유지 규칙\n  " + state.experiment.keepOnText);
    }

    mine.body.appendChild(el("h4", { class: "subhead", text: "감지 실험 기록" }));
    mine.body.appendChild(
      el("div", { class: "my-answer" + (expText.length ? "" : " is-empty") }, [
        el("span", {
          text: expText.length ? expText.join("\n\n") : "5단계에서 적은 관찰 기록이 여기에 나타납니다."
        })
      ])
    );

    box.appendChild(mine.root);

    return box;
  }

  S.screens = {
    intro: renderIntro,
    concept: renderConcept,
    circuit: renderCircuit,
    code: renderCode,
    experiment: renderExperiment,
    assess: renderAssess
  };
})();
