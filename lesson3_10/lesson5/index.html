        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = { connections: (ctx && ctx.connections) || [], source: source };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *   opts.ledPin    : 어느 핀이 LED 인가 (기본 11)
   *
   * 돌려주는 것 : { ok, trace, console, pins, led, elapsed, stopped, error }
   *   trace 의 한 칸 = { t, line, kind, text, phase, iteration, ledOn }
   *
   * ★ led.timeline 은 «불이 바뀐 순간» 만 담는다(명세 19장 ledOn).
   *   5단계에서 켜짐·꺼짐 시간을 재고, 4단계에서 LED 그림을 물들이는 데 쓴다.
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: {},
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var ledPin = o.ledPin === undefined ? (PC.LED_PIN === undefined ? 11 : PC.LED_PIN) : o.ledPin;

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      pinModes: {},
      pinValues: {},
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0,
      /* 명세 19장 — LED 가 지금 켜져 있는가 */
      ledOn: false,
      ledTimeline: [],
      /* digitalRead 로 «읽은» 값의 발자취 — 이 차시에 새로 생겼다 */
      reads: []
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration,
        ledOn: state.ledOn
      });
    }

    /** LED 핀의 값이 바뀌었을 때만 timeline 에 한 칸 남긴다 */
    function noteLed(pin, value, line) {
      if (String(pin) !== String(ledPin)) return;
      var on = value ? true : false;
      if (state.ledTimeline.length > 0 && state.ledOn === on) return;
      state.ledOn = on;
      state.ledTimeline.push({ t: state.t, on: on, line: line });
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    /**
     * 아날로그 입력을 읽는다.
     * 핀은 analogRead(A0) 처럼 «이름» 으로도, analogRead(0) 처럼 «번호» 로도 올 수 있다.
     * 둘 다 sensors 의 A0 칸을 보게 맞춘다.
     */
    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    /**
     * 디지털 입력을 읽는다.
     *
     * 세 곳을 차례로 본다.
     *   ① inputFn(pin, t)  — 시간에 따라 달라지는 값 (PIR 모델. 5단계 실험)
     *   ② inputs[pin]      — 늘 같은 값 (코드 검사)
     *   ③ 스스로 적은 값    — digitalWrite 로 내보낸 뒤 되읽는 경우
     *
     * ★ 읽은 값을 reads 에 남긴다. 5단계 상태 패널이 «DO 가 언제 HIGH 였는가» 를
     *   이 발자취로 그린다. 남기지 않으면 시리얼 출력에서 되짚어야 해서
     *   조건이 참이었는지 거짓이었는지 흐려진다.
     */
    function readDigital(pin) {
      var value = null;
      if (typeof o.inputFn === "function") {
        var got = o.inputFn(pin, state.t);
        if (got !== null && got !== undefined) value = Number(got) ? 1 : 0;
      }
      if (value === null && o.inputs && o.inputs[pin] !== undefined) {
        value = Number(o.inputs[pin]) ? 1 : 0;
      }
      if (value === null && state.pinValues[pin] !== undefined) {
        value = state.pinValues[pin] ? 1 : 0;
      }
      if (value === null) value = 0;

      state.reads.push({ t: state.t, pin: pin, value: value });
      return value;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          var line = {
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          };
          state.out.push(line);
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] = node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, "D" + args[0] + " → " + state.pinModes[args[0]]);
          return 0;

        case "digitalWrite": {
          var value = args[1] ? 1 : 0;
          state.pinValues[args[0]] = value;
          noteLed(args[0], value, node.line);
          record("pin-write", node.line, "D" + args[0] + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, "D" + args[0] + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          state.t += ms;
          record("delay", node.line, String(ms));
          return 0;
        }

        case "millis":
          return state.t;

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        state.vars[g.name] = g.init ? evaluate(g.init) : 0;
      });

      state.phase = "setup";
      record("phase", ast.functions.setup ? ast.functions.setup.line : 0, "setup() 시작");
      if (ast.functions.setup) execBlock(ast.functions.setup.body);
      record("phase-end", 0, "setup() 끝 — 여기까지는 «한 번만» 실행됩니다.");

      state.phase = "loop";
      if (ast.functions.loop) {
        for (var i = 0; i < loopLimit; i += 1) {
          state.iteration = i + 1;
          record("phase", ast.functions.loop.line, "loop() " + (i + 1) + "번째");
          execBlock(ast.functions.loop.body);
        }
        stopped = "loop-limit";
      }
    } catch (err) {
      if (err && err.name === "StopRun") {
        stopped = err.reason === "steps" ? "step-limit" : "runtime";
        if (err.reason !== "steps") error = { line: 0, message: err.reason, code: "runtime" };
      } else {
        stopped = "runtime";
        error = { line: 0, message: "실행 중 문제가 생겼습니다.", code: "runtime" };
      }
    }

    return {
      ok: error === null,
      trace: state.trace,
      console: state.out,
      pins: { modes: state.pinModes, values: state.pinValues },
      serial: state.serial,
      reads: state.reads,
      led: {
        pin: ledPin,
        mode: state.pinModes[ledPin] || "",
        on: state.ledOn,
        timeline: state.ledTimeline,
        blinks: state.ledTimeline.filter(function (m) {
          return m.on;
        }).length
      },
      elapsed: state.t,
      stopped: stopped,
      error: error
    };
  }

  /**
   * 켜짐·꺼짐이 몇 ms 씩 이어졌는가 (명세 17.5 실험 A·B·C 의 «관찰»)
   * 마지막 구간은 실행이 끊긴 자리라 세지 않는다.
   */
  function ledPhases(result) {
    var marks = (result && result.led && result.led.timeline) || [];
    var out = [];
    for (var i = 0; i + 1 < marks.length; i += 1) {
      out.push({ on: marks[i].on, ms: marks[i + 1].t - marks[i].t });
    }
    return out;
  }

  /* ------------------------------------------------------------------ */
  /* 4-2. ★ PIR 센서 동작 모델 (명세 6.2 · 6.5)                            */
  /* ------------------------------------------------------------------ */

  /**
   * 시간에 따라 «DO 가 무엇인가» 를 돌려주는 모델.
   *
   * 세 가지를 함께 다룬다.
   *   ① 안정화(warmup)  전원을 켠 뒤 주변 적외선을 기준으로 잡는 동안은 «판정 대기» 다.
   *                     이때 값을 HIGH/LOW 로 확정해 보여 주지 않는다(명세 6.2).
   *   ② 감지            안정화가 끝난 뒤 «감지 영역 안에서 움직임» 이 있으면 HIGH.
   *   ③ 출력 유지(hold) 움직임이 사라져도 곧바로 LOW 가 되지 않는다.
   *                     모듈의 출력 유지 시간만큼 HIGH 로 남았다가 LOW 가 된다(명세 6.5).
   *
   * opts = {
   *   pin      : 센서가 이어진 핀 번호 (기본 7)
   *   warmupMs : 안정화 시간
   *   holdMs   : 출력 유지 시간
   *   events   : [{ at, inZone, moving }]  — 시간 순서. 조건이 «바뀌는 순간» 만 적는다.
   * }
   *
   * 돌려주는 것
   *   inputFn(pin, t)  → run() 에 그대로 넘긴다
   *   stateAt(t)       → 화면의 상태 패널이 읽는다
   *
   * ★ 정지한 사람을 «처음부터 즉시 LOW» 로 단순화하지 않는다(명세 6.5).
   *   그렇게 만들면 «사람이 멈추면 곧 꺼진다» 는 그릇된 인상을 준다.
   *   실제 모듈은 마지막 움직임에서 유지 시간이 지난 뒤에 LOW 가 된다.
   */
  function pirModel(opts) {
    var o = opts || {};
    var pin = o.pin === undefined ? MOTION_PIN : o.pin;
    var warmupMs = o.warmupMs === undefined ? 6000 : o.warmupMs;
    var holdMs = o.holdMs === undefined ? 3000 : o.holdMs;

    /* 조건이 바뀌는 순간들을 «구간» 으로 펼친다 */
    var marks = (o.events || [])
      .map(function (e) {
        return {
          at: Math.max(0, Number(e.at) || 0),
          inZone: e.inZone === true,
          moving: e.moving === true
        };
      })
      .sort(function (a, b) {
        return a.at - b.at;
      });

    if (marks.length === 0 || marks[0].at > 0) {
      marks.unshift({ at: 0, inZone: false, moving: false });
    }

    var segments = marks.map(function (m, i) {
      return {
        from: m.at,
        to: i + 1 < marks.length ? marks[i + 1].at : Infinity,
        inZone: m.inZone,
        moving: m.moving
      };
    });

    /** t 시각에 놓인 구간 */
    function segmentAt(t) {
      var found = segments[0];
      segments.forEach(function (sg) {
        if (sg.from <= t) found = sg;
      });
      return found;
    }

    /**
     * t 까지 «가장 마지막으로 움직임이 있었던» 시각.
     * 안정화가 끝나기 전의 움직임은 세지 않는다 — 그때는 기준을 잡는 중이다.
     */
    function lastMotionAt(t) {
      var last = null;
      segments.forEach(function (sg) {
        if (!(sg.inZone && sg.moving)) return;
        var from = Math.max(sg.from, warmupMs);
        if (from > t) return;
        last = Math.min(t, sg.to === Infinity ? t : sg.to);
      });
      return last;
    }

    /**
     * t 시각의 센서 상태.
     *   phase : "warmup" | "motion" | "hold" | "idle"
     *   level : 0 · 1     (warmup 에서는 0 이지만 «판정 대기» 라고 알린다)
     */
    function stateAt(t) {
      var sg = segmentAt(t);
      var base = {
        t: t,
        inZone: sg.inZone,
        moving: sg.moving,
        warmupLeft: Math.max(0, warmupMs - t),
        holdLeft: 0
      };

      if (t < warmupMs) {
        base.phase = "warmup";
        base.level = 0;
        base.settled = false;
        base.text = "안정화 중—판정 대기";
        return base;
      }
      base.settled = true;

      var last = lastMotionAt(t);
      if (last === null) {
        base.phase = "idle";
        base.level = 0;
        base.text = "LOW (미감지)";
        return base;
      }

      var since = t - last;
      if (since <= 0) {
        base.phase = "motion";
        base.level = 1;
        base.text = "HIGH (움직임 감지)";
        return base;
      }
      if (since <= holdMs) {
        base.phase = "hold";
        base.level = 1;
        base.holdLeft = holdMs - since;
        base.text = "HIGH (출력 유지 중 · " + Math.ceil((holdMs - since) / 1000) + "초 남음)";
        return base;
      }
      base.phase = "idle";
      base.level = 0;
      base.text = "LOW (미감지)";
      return base;
    }

    /** run() 에 넘길 입력 함수 — 이 핀이 아니면 null 을 돌려 다른 규칙에 맡긴다 */
    function inputFn(askPin, t) {
      if (String(askPin) !== String(pin)) return null;
      return stateAt(t).level;
    }

    return {
      pin: pin,
      warmupMs: warmupMs,
      holdMs: holdMs,
      segments: segments,
      stateAt: stateAt,
      inputFn: inputFn
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4-3. 실행 결과를 사람 말로                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 켜짐·꺼짐이 몇 ms 씩 이어졌는가 (5단계 관찰 기록에 쓴다)
   * 마지막 구간은 실행이 끊긴 자리라 세지 않는다.
   */
  function ledPhases(result) {
    var marks = (result && result.led && result.led.timeline) || [];
    var out = [];
    for (var i = 0; i + 1 < marks.length; i += 1) {
      out.push({ on: marks[i].on, ms: marks[i + 1].t - marks[i].t });
    }
    return out;
  }

  /**
   * 「DO HIGH → LED 켜짐 → Motion detected」 처럼 한 줄로.
   *
   * 색이나 그림에만 기대지 않고 «글로도» 결과를 남긴다(명세 11장).
   * 제출 자료의 실험 기록에 이 글이 그대로 담긴다.
   */
  function describeMotionRun(result, sensorState) {
    if (!result) return "";
    var lines = (result.console || []).map(function (l) {

    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, 3), 10);
    var studentNumber = parseInt(s.slice(3, 5), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};
    var digits = LIMITS.studentIdDigits || 5;

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== digits) {
      errors.studentId = "학번은 " + digits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro": {
        /**
         * 시작 화면의 통과 조건은 셋이다 (명세 6.1).
         *   ① 세 상황의 조명 상태를 «예측» 한다   — 채점하지 않는다. 적기만 한다.
         *   ② 확인 질문 «PIR 은 무엇을 아는가» 를 맞힌다
         *   ③ 안전 수칙을 읽고 확인한다
         *
         * ★ 예측을 «채점하지 않는» 것이 중요하다. 아직 배우지 않았으므로
         *   틀려도 좋고, 5단계에서 자기 예측과 견주어 보는 것이 목적이다.
         */
        var intro = s.intro || {};
        var predicts = intro.predicts || {};
        var items = (PC.lesson && PC.lesson.PREDICT ? PC.lesson.PREDICT.items : []) || [];
        var unpicked = items.filter(function (item) {
          return predicts[item.id] === undefined || predicts[item.id] === null || predicts[item.id] === "";
        });

        if (unpicked.length > 0) {
          reasons.push(
            "세 상황의 조명 상태를 먼저 예측해 주세요. (지금 " +
              (items.length - unpicked.length) + "/" + items.length + ")"
          );
        }
        if (intro.checkPassed !== true) {
          reasons.push("확인 질문에 옳게 답해 주세요. (PIR 센서는 사람의 무엇을 알아낼까요?)");
        }
        if (intro.safetyRead !== true) {
          reasons.push("안전 수칙을 읽고 확인해 주세요.");
        }
        break;
      }

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3;
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        /* 명세 5장 3단계 — «5개 경로 정확, 위험 연결 없음» */
        var c = s.circuit || {};
        if (c.findDone !== true) reasons.push("부품과 단자 찾기(3A)를 마쳐 주세요.");
        if (c.checkPassed !== true) reasons.push("[회로 점검] 의 모든 항목을 채워 주세요. (다섯 경로 + 안전·정리)");
        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 읽기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 센서값이 바뀌어 갈림길이 옮겨 가는 것을 확인해 주세요.");
          break;
        }
        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " +
              (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★ 세 실험을 «모두» 실행하고 «세 칸을 모두» 채워야 통과한다 (명세 5장 5단계).
         *
         *   ① 예상 ② 관찰 ③ 예상과 다른 점
         *
         * ★ 확장 탐구(자동 소등 규칙)도 «통과 조건» 이다.
         *   처음에는 선택 활동으로 접어 두었으나, 이 규칙을 스스로 세워 보는 것이
         *   이 차시의 마무리라고 보아 필수로 올렸다.
         *   기준은 «글을 적었는가» 다 — 코드로 옮기는 것은 요구하지 않는다(명세 6.5).
         *
         * ★ 아직 실행하지 않은 실험의 «빈칸» 까지 나무라지 않는다.
         *   할 일이 겹쳐 보이면 무엇부터 해야 할지 알 수 없다.
         */
        var e = s.experiment || {};
        var runs = e.runs || {};
        var items = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

        var notRun = [];
        var notWritten = [];

        items.forEach(function (item) {
          var r = runs[item.id] || {};
          if (r.ran !== true) {
            notRun.push(item.short || item.label);
            return;
          }
          var blanks = [];
          if (contentLength(r.predict) < (LIMITS.predictMin || 4)) blanks.push("예상");
          if (contentLength(r.observation) < (LIMITS.observationMin || 10)) blanks.push("관찰");
          if (contentLength(r.surprise) < 2) blanks.push("예상과 다른 점");
          if (blanks.length > 0) notWritten.push((item.short || item.label) + "(" + blanks.join("·") + ")");
        });

        if (notRun.length > 0) {
          reasons.push("아직 실행하지 않은 실험이 있습니다 : " + notRun.join(", "));
        }
        if (notWritten.length > 0) {
          reasons.push(
            "아직 비어 있는 칸이 있습니다 : " + notWritten.join(", ") +
              " (관찰은 " + (LIMITS.observationMin || 10) + "자 이상)"
          );
        }

        /* ★ 확장 탐구 — 자동 소등 규칙을 «말이나 의사코드로» 적어야 한다.
           코드로 옮기는 것은 요구하지 않는다(명세 6.5). 글이면 충분하다. */
        var keepMin = ((PC.lesson && PC.lesson.EXTENSION) || {}).minLength || 20;
        if (contentLength(e.keepOnText) < keepMin) {
          reasons.push(
            "확장 탐구 — 자동 소등 규칙을 공백 제외 " + keepMin + "자 이상 적어 주세요."
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.2) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;
    var lesson = PC.lesson || {};

    var intro = s.intro || {};
    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};
    var runs = experiment.runs || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, total: 10, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];
    var expItems = lesson.EXPERIMENTS || [];

    return {
      /* 누구의, 어느 차시 제출인가 (명세 7장) */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 1단계 — 세 상황의 «예측». 채점하지 않지만 교사가 오개념을 보는 자료가 된다. */
      intro: {
        predicts: (lesson.PREDICT ? lesson.PREDICT.items : []).map(function (item) {
          var v = intro.predicts ? intro.predicts[item.id] : undefined;
          return {
            id: item.id,
            label: clip(item.label, 80),
            value: v === undefined || v === "" || v === null ? null : Number(v)
          };
        }),
        checkPassed: intro.checkPassed === true,
        checkAttempts: Number(intro.checkAttempts) || 0,
        safetyRead: intro.safetyRead === true
      },

      /* 2단계 — 개념 확인 */
      concept: {
        checks: (lesson.CONCEPT_CHECK || []).map(function (item) {
          var picks = (s.concept && s.concept.checkChoices) || {};
          var done = (s.concept && s.concept.checks) || {};
          return {
            id: item.id,
            value: picks[item.id] === undefined ? null : Number(picks[item.id]),
            correct: done[item.id] === true
          };
        })
      },

      /* 3단계 — 회로 (명세 7장 circuit) */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: Number(circuit.attempts) || 0,
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return clip(e, 200);
        }),
        /* 위험 연결이 실제로 일어난 기록 — 명세 7장 dangerEvents */
        dangerEvents: (circuit.dangerEvents || []).slice(0, 50).map(function (d) {
          return { code: text(d && d.code), title: clip(d && d.title, 60) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: Number(circuit.findAttempts) || 0,
        hintsUsed: Number(circuit.hintsUsed) || 0,
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 앱이 이 회로를 «무엇으로 보았는가» — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              ledDirection: text(circuit.path.ledDirection),
              hasResistor: circuit.path.hasResistor === true,
              resistanceOhm: Number(circuit.path.resistanceOhm) || 0,
              shortCircuit: circuit.path.shortCircuit === true,
              /* PIR 세 줄 */
              pirVcc: circuit.path.pirVcc === true,
              pirGnd: circuit.path.pirGnd === true,
              pirOut: circuit.path.pirOut === true,
              pinsSwapped: circuit.path.pinsSwapped === true
            }
          : null
      },

      /* 4단계 — 코드 (명세 7장 code) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        /* 명세 7장 errors — 문법 오류와 핀 불일치를 한 자리에 모은다 */
        errors: (code.syntaxErrors || [])
          .concat(
            (code.pinMismatch || []).map(function (p) {
              return p && p.message ? p.message : p;
            })
          )
          .slice(0, 30)
          .map(function (e) {
            return clip(typeof e === "string" ? e : e && e.message, 200);
          }),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return clip(typeof e === "string" ? e : e && e.message, 200);
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return {
            kind: text(p && p.kind),
            codePin: text(p && p.codePin),
            circuitPin: text(p && p.circuitPin),
            message: clip(p && p.message, 200)
          };
        }),
        /* 명세 7장 history — 검사를 누른 때마다 남는 «수정 이력» */
        history: (code.history || []).slice(-20).map(function (h) {
          return {
            at: text(h && h.at),
            mode: text(h && h.mode),
            passed: Number(h && h.passed) || 0,
            total: Number(h && h.total) || 0
          };
        })
      },

      /* 5단계 — 실험 (명세 7장 experiment) */
      experiment: {
        /* 무엇을 시켰고 실제로 무엇이 나왔는가 */
        conditions: expItems
          .filter(function (item) {
            return (runs[item.id] || {}).ran === true;
          })
          .map(function (item) {
            var r = runs[item.id] || {};
            return {
              id: item.id,
              label: clip(item.short || item.label, 60),
              inZone: r.inZone === true,
              moving: r.moving === true,
              settled: r.settled === true,
              doLevel: text(r.doLevel),
              ledOn: r.ledOn === true,
              serial: clip(r.serial, 80),
              ran: true
            };
          }),
        /* 학생이 적은 것 */
        observations: expItems
          .filter(function (item) {
            var r = runs[item.id] || {};
            return r.ran === true || contentLength(r.predict) > 0;
          })
          .map(function (item) {
            var r = runs[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax),
              surprise: clip(r.surprise, LIMITS.textMax)
            };
          }),
        /* 확장 탐구 — 자동 소등 규칙 (통과 조건이 아니다) */
        keepOn: {
          text: clip(experiment.keepOnText, LIMITS.textMax),
          tried: contentLength(experiment.keepOnText) > 0
        },
      },

      /* 6단계 — 형성평가 (명세 7장 assessment) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: Number(assessment.attempts) || 0
      }
    };
  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)
   * 학번과 이름과 차시가 같으면 같은 제출로 본다.
   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var intro = r.intro || {};
    var concept = r.concept || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    function num(v) {
      var n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    function arr(v) {
      return Array.isArray(v) ? v : [];
    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverSubmittedAt: text(r.serverSubmittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),
      fileName: text(r.fileName),

      intro: {
        predicts: arr(intro.predicts).map(function (p) {
          return {
            id: text(p && p.id),
            label: text(p && p.label),
            value: p && p.value === null || p && p.value === undefined ? null : num(p.value)
          };
        }),
        checkPassed: intro.checkPassed === true,
        checkAttempts: num(intro.checkAttempts),
        safetyRead: intro.safetyRead === true
      },

      concept: {
        checks: arr(concept.checks).map(function (c) {
          return {
            id: text(c && c.id),
            value: c && (c.value === null || c.value === undefined) ? null : num(c.value),
            correct: c && c.correct === true
          };
        })
      },

      circuit: {
        connections: arr(circuit.connections).map(cleanConnection),
        attempts: num(circuit.attempts),
        errors: arr(circuit.errors),
        dangerEvents: arr(circuit.dangerEvents).map(function (d) {

    <script data-from="teacher/t00-core.js">
/**
 * 교사용 코어 — 이름 공간과 화면 부품
 *
 * 교사용은 학생용 파일을 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.

 *
 * ★ 학생이 쓴 글은 언제나 textContent 로만 넣는다.

 *
 * ★ 받은 자료를 브라우저에 «영구 저장하지 않는다»(명세 13장).
 *   localStorage 를 쓰지 않고 메모리에만 둔다. 창을 닫으면 사라진다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);

  }

  function fmtTime(iso, withSeconds) {
    if (!iso) return "";

    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var base =
      d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) +
      " " + two(d.getHours()) + ":" + two(d.getMinutes());
    return withSeconds ? base + ":" + two(d.getSeconds()) : base;
  }

  function shorten(text, max) {
    var s = String(text || "");
    var limit = max || 18;
    return s.length > limit ? s.slice(0, limit) + "…" : s;
  }

  /** 백분율 — 나눌 것이 없으면 0 */
  function percent(part, whole) {
    if (!whole) return 0;

  }

    var region = $("#toast-region");

      if (box.parentNode) box.parentNode.removeChild(box);

  }

  function announce(message) {
    var live = $("#sr-live");

  /** 숫자 하나를 크게 보여 주는 칸 */
  /**
   * 숫자 한 칸.

  function statCard(label, value, note, unit) {

  function panel(spec) {
    var s = spec || {};

      s.title || s.hint

            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,

        el("span", { class: "bar__name", text: label }),
        el("span", { class: "bar__num", text: value + "명 (" + pct + "%)" })
      ]),
      el("div", { class: "bar__track" }, [
        el("div", { class: "bar__fill", attrs: { style: "width:" + pct + "%" } })
      ])

  }

  /** 접었다 펼 수 있는 긴 글 */
  function longText(text) {
    var value = String(text || "");
    var body = el("p", { class: "longtext__body", text: value || "(작성하지 않음)" });

      class: "btn btn--small btn--ghost",
      text: "펼치기",
      attrs: { type: "button", "aria-expanded": "false" },
      on: {
        click: function () {
          var clamped = body.classList.toggle("longtext__body--clamp");
          btn.textContent = clamped ? "펼치기" : "접기";
          btn.setAttribute("aria-expanded", clamped ? "false" : "true");
        }
      }

  }

  /** 코드 상자 (읽기 전용) */
  function codeBox(source) {

    $$: $$,

    clear: clear,
    fmtTime: fmtTime,
    shorten: shorten,
    percent: percent,
    toast: toast,
    announce: announce,
    statCard: statCard,
    statRow: statRow,
    panel: panel,
    btnRow: btnRow,
    bar: bar,
    longText: longText,
    codeBox: codeBox,
    empty: empty
  };
})();

  /*   예전에는 그대로 «서버에 물어보고 있어요…» 에서 멈춰 있었다.          */
  /* ------------------------------------------------------------------ */

  /** 아무리 늦어도 이만큼 지나면 «못 했다» 고 알린다 (그냥 멈춰 있으면 안 된다) */
  var TIMEOUT_MS = 12000;

  var jsonpSeq = 0;

  /** 약속이 늦어지면 스스로 끊는다 */
  function withTimeout(promise, ms, message) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error(message));
      }, ms);

      promise.then(
        function (value) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(value);
        },
        function (err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(err);
        }
      );
    });
  }

  /**
   * JSONP — <script> 태그로 읽어 온다.
   * 서버가 callback 이름으로 감싼 자바스크립트를 돌려주므로 CORS 검사를 받지 않는다.
   */
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      if (typeof document === "undefined") {
        reject(new Error("이 환경에서는 JSONP 를 쓸 수 없습니다."));
        return;
      }

      jsonpSeq += 1;
      var name = "__pcTeacherCb" + jsonpSeq;
      var script = document.createElement("script");
      var done = false;

      function finish(err, data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          delete root[name];
        } catch (e) {
          root[name] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err);
        else resolve(data);
      }

      var timer = setTimeout(function () {
        finish(
          new Error(
            "서버가 제때 답하지 않았습니다. 주소가 /exec 로 끝나는지, " +
              "Code.gs 를 고친 뒤 «새 배포» 로 다시 올렸는지 확인해 주세요."
          )
        );
      }, TIMEOUT_MS);

      root[name] = function (data) {
        finish(null, data);
      };

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name;
      script.onerror = function () {
        finish(
          new Error(
            "서버에 닿지 못했습니다. 주소가 맞는지, 배포에서 실행을 «나» · 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
          )
        );
      };
      document.head.appendChild(script);
    });
  }

  /**
   * 서버에 한 번 물어본다.
   *   base  : /exec 주소
   *   query : "action=list&key=…"
   *
   * fetch 를 먼저 해 보고, 막히면 JSONP 로 다시 간다.
   * 둘 다 실패하면 «왜 안 되는지» 를 담아 거절한다.
   */
  function askServer(base, query) {
    var url = base + (base.indexOf("?") === -1 ? "?" : "&") + query;
    var f = getFetch();

    var viaFetch = !f
      ? Promise.reject(new Error("이 브라우저에서는 불러올 수 없습니다."))
      : withTimeout(
          f(url, { method: "GET", redirect: "follow" }).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          }),
          TIMEOUT_MS,
          "서버가 제때 답하지 않았습니다."
        ).then(function (body) {
          try {
            return JSON.parse(body);
          } catch (e) {
            /* 로그인 화면 HTML 이 돌아온 경우다 — 배포 설정이 잘못되었다 */
            throw new Error(
              "서버가 JSON 을 주지 않았습니다. 배포에서 실행을 «나», 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
            );
          }
        });

    return viaFetch.catch(function (firstErr) {
      /* file:// 에서 열었거나 CORS 에 막힌 것이다 — <script> 로 다시 가 본다 */
      return jsonp(url).catch(function (secondErr) {
        throw new Error(secondErr && secondErr.message ? secondErr.message : firstErr.message);
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* 담기                                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 제출 하나를 넣는다. 같은 학생의 제출이 이미 있으면 «늦게 낸 것» 만 남긴다.
   * 돌려주는 것 : 'added' | 'updated' | 'kept' | 'skipped'
   */
  function put(raw) {
    if (!PC.schema.isThisLesson(raw)) return "skipped";

    var next = PC.schema.normalizeSubmission(raw);
    if (!next.studentId && !next.studentName) return "skipped";

    var key = PC.schema.dedupeKey(next);
    for (var i = 0; i < submissions.length; i += 1) {
      if (PC.schema.dedupeKey(submissions[i]) !== key) continue;

      var oldAt = submissions[i].serverUpdatedAt || submissions[i].submittedAt || "";
      var newAt = next.serverUpdatedAt || next.submittedAt || "";
      if (newAt >= oldAt) {
        submissions[i] = next;
        return "updated";
      }
      return "kept";
    }
    submissions.push(next);
    return "added";
  }

  /** JSON 글 한 덩어리를 담는다. 배열이어도, 하나여도, {items:[...]} 여도 받는다. */
  function putText(text) {
    var result = { added: 0, updated: 0, kept: 0, skipped: 0, error: "" };
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      result.error = "JSON 형식이 아닙니다.";
      return result;
    }

    var list = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [data];
    list.forEach(function (item) {
      var how = put(item);
      result[how] += 1;
    });
    return result;
  }

  /** 파일 여러 개를 읽어 담는다 (명세 11장 «업로드한 JSON 여러 개») */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return Promise.resolve({ added: 0, updated: 0, kept: 0, skipped: 0, failed: [] });

    return Promise.all(
      files.map(function (file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({ name: file.name, text: String(reader.result || "") });
          };
          reader.onerror = function () {
            resolve({ name: file.name, text: null });
          };
          reader.readAsText(file, "utf-8");
        });
      })
    ).then(function (results) {
      var total = { added: 0, updated: 0, kept: 0, skipped: 0, failed: [] };
      results.forEach(function (r) {
        if (r.text === null) {
          total.failed.push(r.name + " (읽지 못함)");
          return;
        }
        var one = putText(r.text);
        if (one.error) {
          total.failed.push(r.name + " (" + one.error + ")");
          return;
        }
        total.added += one.added;
        total.updated += one.updated;
        total.kept += one.kept;
        total.skipped += one.skipped;
      });
      return total;
    });
  }

  /**
   * 서버(Apps Script)에서 제출 목록을 받아 온다.
   * 교사 열쇠는 화면에서 받아 그때그때 쓰고 저장하지 않는다.
   */
  function fetchFromServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query =
      "action=list&lessonId=" +
      encodeURIComponent(PC.LESSON_ID) +
      (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query)
      .then(function (data) {
        if (data && data.ok === false) {
          /* 서버가 «무엇이 잘못되었는지» 를 함께 보내면 그대로 붙여 준다.
             그러지 않으면 폴더 ID·권한·Drive API 중 무엇을 고쳐야 할지 알 수 없다. */
          var why = [data.message || "서버가 목록을 주지 않았습니다."];
          if (data.reason) why.push("(" + data.reason + ")");
          if (data.hint) why.push(data.hint);
          return { ok: false, message: why.join(" ") };
        }

        var list = Array.isArray(data) ? data : (data && data.items) || [];
        var count = { added: 0, updated: 0, kept: 0, skipped: 0 };
        list.forEach(function (item) {
          count[put(item)] += 1;
        });
        return {
          ok: true,
          count: count,
          total: list.length,
          /* 한 건도 없을 때 무엇을 켜야 하는지 알려 주려고 서버 안내를 그대로 들고 온다 */
          hint: (data && data.hint) || "",
          skipped: (data && data.skipped) || 0,
          truncated: data && data.truncated === true
        };
      })
      .catch(function (err) {
        return { ok: false, message: err && err.message ? err.message : "불러오지 못했습니다." };
      });
  }

  /**
   * 연결 확인 — 주소·열쇠·폴더·Drive API 가 준비되었는지 서버에 물어본다.
   * 목록을 불러오다 막혔을 때 «무엇이 빠졌는지» 를 먼저 짚어 보는 길이다.
   */
  function pingServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query = "action=ping" + (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query).catch(function (err) {
      return { ok: false, message: err && err.message ? err.message : "확인하지 못했습니다." };
    });
  }

  function all() {
    return submissions.slice();
  }

  function clearAll() {
    submissions = [];
  }

  function count() {
    return submissions.length;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 11장 1번)                                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 전체 요약.
   *   expected 는 «수업에 참여한 학생 수». 선생님이 넣으면 제출률을 낼 수 있다.
   */
  function summary(list, expected) {
    var rows = list || [];
    var total = rows.length;
    var scores = rows.map(function (r) {
      return r.assessment.score;
    });
    var passed = rows.filter(function (r) {
      return r.assessment.pass;
    }).length;

    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);

    /* 점수 분포 — 0,2,4,6,8,10 여섯 칸 */
    var buckets = [0, 2, 4, 6, 8, 10].map(function (v) {
      return {
        score: v,
        count: scores.filter(function (s) {
          return s === v;
        }).length
      };
    });

    var maxScore = (PC.ASSESS && PC.ASSESS.total) || 10;

    return {
      total: total,
      expected: Number(expected) || 0,
      submitRate: expected ? T.core.percent(total, Number(expected)) : 0,
      average: total ? Math.round((sum / total) * 10) / 10 : 0,
      /* 교사 화면 2장의 숫자 칸에 그대로 쓴다 */
      maxScore: maxScore,
      highest: total ? Math.max.apply(null, scores) : 0,
      lowest: total ? Math.min.apply(null, scores) : 0,
      perfect: scores.filter(function (v) {
        return v >= maxScore;
      }).length,
      passed: passed,
      failed: total - passed,
      passRate: T.core.percent(passed, total),
      buckets: buckets,
      circuitDone: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      codeDone: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length
    };
  }

  /**
   * 문항별 분석 (명세 11장 2번)
   *   정답률 · 선택지 분포 · 오답 TOP2 · 주관식 원문
   */
  function questionStats(list) {
    var rows = list || [];
    return PC.quiz.QUESTIONS.map(function (q, index) {
      var answered = [];
      var correct = 0;

      rows.forEach(function (r) {
        var found = null;
        (r.assessment.answers || []).forEach(function (a) {
          if (a && a.id === q.id) found = a;
        });
        var isRight = r.assessment.isCorrect[index] === true;
        if (isRight) correct += 1;
        answered.push({
          studentId: r.studentId,
          studentName: r.studentName,
          value: found ? found.value : null,
          correct: isRight
        });
      });

      var stat = {
        id: q.id,
        no: q.no,
        type: q.type,
        stem: q.stem,
        tag: q.tag,
        total: rows.length,
        correct: correct,
        rate: T.core.percent(correct, rows.length),
        distribution: [],
        worstChoices: [],
        texts: []
      };

      if (q.type === "choice") {
        stat.distribution = q.choices.map(function (label, i) {
          return {
            index: i,
            label: label,
            count: answered.filter(function (a) {
              return a.value === i;
            }).length
          };
        });

        /* 오답 TOP2 — 많이 고른 «틀린» 보기 둘 */
        var answerIndex = PC.quiz.recoverChoiceIndex(q);
        stat.answerIndex = answerIndex;
        stat.worstChoices = stat.distribution
          .filter(function (d) {
            return d.index !== answerIndex && d.count > 0;
          })
          .sort(function (a, b) {
            return b.count - a.count;
          })
          .slice(0, 2);
      } else {
        stat.texts = answered.map(function (a) {
          return {
            studentId: a.studentId,
            studentName: a.studentName,
            text: String(a.value || ""),
            correct: a.correct
          };
        });
      }

      return stat;
    });
  }

  /** 회로 수행 분석 (명세 11장 3번) */
  function circuitStats(list) {
    var rows = list || [];
    var errorCount = {};
    var dangerStudents = 0;

    /**
     * ★ «몇 번 났는가» 가 아니라 «몇 명에게 났는가» 를 센다.
     *   케이블을 이을 때마다 같은 위험이 다시 기록되므로 횟수를 세면
     *   한 학생이 열 번 만든 오류가 «열 명» 처럼 보인다.
     */
    rows.forEach(function (r) {
      var seen = {};
      (r.circuit.dangerEvents || []).forEach(function (e) {
        var code = e && e.code ? e.code : "unknown";
        seen[code] = true;
      });
      Object.keys(seen).forEach(function (code) {
        errorCount[code] = (errorCount[code] || 0) + 1;
      });
      if (Object.keys(seen).length > 0) dangerStudents += 1;
    });

    /* PIR 세 줄 가운데 어느 줄을 놓쳤는가 — 이 차시에서 가장 자주 보는 숫자다 */
    var pirMissing = { vcc: 0, gnd: 0, out: 0, swapped: 0 };
    rows.forEach(function (r) {
      var path = r.circuit.path;
      if (!path) return;
      if (!path.pirVcc) pirMissing.vcc += 1;
      if (!path.pirGnd) pirMissing.gnd += 1;
      if (!path.pirOut) pirMissing.out += 1;
      if (path.pinsSwapped) pirMissing.swapped += 1;
    });

    /* 규칙 이름을 사람 말로 바꾼다 */
    var titleOf = {};
    PC.circuit.DANGER_RULES.forEach(function (rule) {
      titleOf[rule.code] = rule.title;
    });

    var frequent = Object.keys(errorCount)
      .map(function (code) {
        return { code: code, title: titleOf[code] || code, count: errorCount[code] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });

    var attempts = rows.map(function (r) {
      return r.circuit.attempts;
    });

    return {
      total: rows.length,
      completed: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      hintUsers: rows.filter(function (r) {
        return r.circuit.hintsUsed > 0;
      }).length,
      dangerStudents: dangerStudents,
      frequent: frequent,
      pirMissing: pirMissing
    };
  }

  /** 코드 수행 분석 (명세 11장 4번) */
  function codeStats(list) {
    var rows = list || [];
    return {
      total: rows.length,
      allPassed: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length,
      withSyntaxError: rows.filter(function (r) {
        return (r.code.syntaxErrors || []).length > 0;
      }).length,
      withPinMismatch: rows.filter(function (r) {
        return (r.code.pinMismatch || []).length > 0;
      }).length,
      /* ★ 역할이 뒤바뀐 학생 — 핀 번호만 다른 것과 «다른» 실수다 */
      withSwapped: rows.filter(function (r) {
        return (r.code.pinMismatch || []).some(function (m) {
          return m && m.kind === "swapped";
        });
      }).length,
      modes: ["assemble", "blank", "edit"].map(function (mode) {
        return {
          mode: mode,
          count: rows.filter(function (r) {
            return r.code.mode === mode;
          }).length
        };
      })
    };
  }

  /**
   * 상위 3명 (명세 11장 마지막 줄)
   *   점수 → 회로 오류 적음 → 코드 테스트 통과 → 제출 시각(빠른 순)
   */
  function topThree(list) {
    return (list || [])
      .slice()
      .sort(function (a, b) {
        if (b.assessment.score !== a.assessment.score) return b.assessment.score - a.assessment.score;

        var aErr = (a.circuit.dangerEvents || a.circuit.errors || []).length;
        var bErr = (b.circuit.dangerEvents || b.circuit.errors || []).length;
        if (aErr !== bErr) return aErr - bErr;

        if (b.code.testsPassed !== a.code.testsPassed) return b.code.testsPassed - a.code.testsPassed;

        var at = a.serverUpdatedAt || a.submittedAt || "";
        var bt = b.serverUpdatedAt || b.submittedAt || "";
        return at < bt ? -1 : at > bt ? 1 : 0;
      })
      .slice(0, 3);
  }

  T.data = {
    pingServer: pingServer,
    put: put,
    putText: putText,
    readFiles: readFiles,
    fetchFromServer: fetchFromServer,
    all: all,
    clearAll: clearAll,
    count: count,
    summary: summary,
    questionStats: questionStats,
    circuitStats: circuitStats,
    codeStats: codeStats,
    topThree: topThree,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.data;
})();
    </script>
    <script data-from="teacher/t15-roster.js">
/* ------------------------------------------------------------------
 * 학생 명단 파일 읽기 (교사용)
 *
 * 명단을 올리면 «제출하지 않은 학생» 까지 표에 나온다.
 * 이것이 5장(전체 명단·정오표)의 핵심이다 — 낸 사람만 보이면 누가 빠졌는지 알 수 없다.
 *
 *   .xlsx          브라우저 내장 기능만으로 읽는다.
 *                  ZIP(중앙 디렉터리) 직접 해석 + DecompressionStream('deflate-raw')
 *                  + DOMParser 로 sharedStrings.xml / sheet XML 파싱.
 *   .csv/.tsv/.txt 글자로 바로 읽는다.
 *
 * ★ 외부 라이브러리를 쓰지 않는다. lesson3_7_1 의 교사용과 같은 방법이다.
 *   고전 스크립트라서 file:// 에서도 열린다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 학번으로 볼 만한 열 이름 */
  var ID_HEADERS = ["학번", "학번호", "번호", "id", "studentid", "student_id", "학생번호"];
  /** 이름으로 볼 만한 열 이름 */
  var NAME_HEADERS = ["이름", "성명", "학생이름", "학생명", "name", "studentname", "student_name"];

  function norm(value) {
    return String(value === null || value === undefined ? "" : value)
      .trim()
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function has(list, value) {
    return list.indexOf(value) !== -1;
  }

  /* ---------------------------------------------------------------- */
  /* ZIP (xlsx) 풀기                                                   */
  /* ---------------------------------------------------------------- */

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다 (주석이 붙어 있을 수 있다) */
  function findEocd(view) {
    var max = Math.min(view.byteLength, 66000);
    for (var i = view.byteLength - 22; i >= view.byteLength - max && i >= 0; i -= 1) {

  function inflateRaw(bytes) {

      return Promise.reject(
        new Error("이 브라우저에서는 엑셀 파일을 직접 읽을 수 없어요. CSV 로 저장해 올려 주세요.")

    });

  /** xlsx(zip) 안에서 필요한 파일만 { 경로: 글 } 로 돌려준다 */
  function readZipEntries(buffer, wanted) {
    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);
    if (eocd < 0) return Promise.reject(new Error("엑셀 파일 형식을 읽지 못했어요."));

    var count = view.getUint16(eocd + 10, true);
    var offset = view.getUint32(eocd + 16, true);
    var decoder = new TextDecoder("utf-8");

    var jobs = [];

    for (var i = 0; i < count; i += 1) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;

      var method = view.getUint16(offset + 10, true);
      var compressedSize = view.getUint32(offset + 20, true);
      var nameLen = view.getUint16(offset + 28, true);
      var extraLen = view.getUint16(offset + 30, true);
      var commentLen = view.getUint16(offset + 32, true);
      var localOffset = view.getUint32(offset + 42, true);
      var name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLen));

      if (wanted(name)) {
        var lNameLen = view.getUint16(localOffset + 26, true);
        var lExtraLen = view.getUint16(localOffset + 28, true);
        var start = localOffset + 30 + lNameLen + lExtraLen;
        var raw = bytes.subarray(start, start + compressedSize);

        jobs.push(
          (function (entryName, entryRaw, entryMethod) {

              return Promise.resolve();
            }
            return inflateRaw(entryRaw).then(function (data) {
              out[entryName] = decoder.decode(data);

  /* ---------------------------------------------------------------- */
  /* xlsx → 2차원 배열                                                 */
  /* ---------------------------------------------------------------- */

  /** "C7" 같은 자리 이름에서 열 번호를 뽑는다 (A=0) */
  function colIndex(ref) {
    var letters = String(ref).replace(/[0-9]/g, "");
    var n = 0;
    for (var i = 0; i < letters.length; i += 1) n = n * 26 + (letters.charCodeAt(i) - 64);
    return Math.max(0, n - 1);
  }

  function sheetToRows(xml, shared) {
    var doc = new DOMParser().parseFromString(xml, "application/xml");
    var rows = [];

    Array.prototype.forEach.call(doc.getElementsByTagName("row"), function (rowEl) {
      var cells = [];
      Array.prototype.forEach.call(rowEl.getElementsByTagName("c"), function (c) {
        var ref = c.getAttribute("r") || "";
        var type = c.getAttribute("t");
        var text = "";

        if (type === "s") {
          var v = c.getElementsByTagName("v")[0];
          var idx = v ? Number(v.textContent) : -1;
          text = shared[idx] === undefined ? "" : shared[idx];
        } else if (type === "inlineStr") {
          text = Array.prototype.map
            .call(c.getElementsByTagName("t"), function (t) {
              return t.textContent;
            })
            .join("");

          var v2 = c.getElementsByTagName("v")[0];
          text = v2 ? v2.textContent : "";

          var doc = new DOMParser().parseFromString(entries["xl/sharedStrings.xml"], "application/xml");

              Array.prototype.map
                .call(si.getElementsByTagName("t"), function (t) {

        }
        continue;
      }

        quoted = true;
      } else if (ch === delimiter) {
        row.push(cell.trim());
        cell = "";
      } else if (ch === "\n") {
        row.push(cell.trim());
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") {
        cell += ch;
      }
    }
    row.push(cell.trim());
    if (
      row.some(function (c) {
        return c !== "";
      })
    ) {
      rows.push(row);
    }
    return rows;
  }

  /* ---------------------------------------------------------------- */
  /* 행 배열 → 학생 명단                                                */
  /* ---------------------------------------------------------------- */

  function pickColumns(rows) {
    /* 앞쪽 다섯 줄 안에서 머리글을 찾는다 */
    for (var r = 0; r < Math.min(rows.length, 5); r += 1) {
      var cells = rows[r] || [];
      var idCol = -1;
      var nameCol = -1;
      cells.forEach(function (cell, c) {
        var v = norm(cell);
        if (idCol < 0 && has(ID_HEADERS, v)) idCol = c;
        if (nameCol < 0 && has(NAME_HEADERS, v)) nameCol = c;
      });
      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    /* 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다 */
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /** 행 배열에서 { students, warnings, columns } 를 만든다 (파일 없이도 검사할 수 있게 따로 둔다) */
  function fromRows(rows) {
    var picked = pickColumns(rows || []);
    var students = [];
    var warnings = [];
    var seen = {};

    (rows || []).forEach(function (cells, r) {
      if (r <= picked.headerRow) return;

      var list = cells || [];
      var id = String(list[picked.idCol] === undefined ? "" : list[picked.idCol]).trim();
      var name = String(list[picked.nameCol] === undefined ? "" : list[picked.nameCol]).trim();
      if (!id && !name) return;

      /* 머리글을 못 찾았는데 첫 줄이 「학번/이름」 같은 글자면 건너뛴다 */
      if (picked.headerRow < 0 && r === 0 && (has(ID_HEADERS, norm(id)) || has(NAME_HEADERS, norm(name)))) {
        return;
      }
      if (!id) {
        warnings.push(r + 1 + "행: 학번이 비어 있어 건너뛰었어요. (" + (name || "이름 없음") + ")");
        return;
      }
      if (seen[id]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 썼어요.");
        return;
      }
      seen[id] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }

    return { students: students, warnings: warnings, columns: picked };
  }

  /** 명단 파일을 읽어 { students, warnings, columns } 를 돌려준다 */
  function parseFile(file) {
    var name = String((file && file.name) || "").toLowerCase();

    if (name.slice(-4) === ".xls") {
      return Promise.reject(
        new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.")
      );
    }

    var readRows = name.slice(-5) === ".xlsx" ? readXlsx(file) : file.text().then(splitDelimited);
    return readRows.then(fromRows);
  }

  /** 학번 비교용 표준형 — 앞의 0 과 공백·기호를 없앤다 */
  function normalizeId(value) {
    var raw = String(value === null || value === undefined ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  T.roster = {
    parseFile: parseFile,
    normalizeId: normalizeId,
    /* 아래 둘은 검사에서 쓴다 (파일 없이 판단만 확인한다) */
    fromRows: fromRows,
    splitDelimited: splitDelimited
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.roster;
})();

/**
 * 거르기·찾기·정렬 (명세 11장 «학번, 이름, 점수, 이수 여부로 검색·정렬·필터»)
 *
 * 화면 그리는 코드가 없다. 목록을 받아 목록을 돌려줄 뿐이라 테스트가 쉽다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 거르기 기준의 처음 값 */
  function emptyFilter() {
    return {
      keyword: "",
      grade: 0,
      classNumber: 0,
      pass: "all", /* all | pass | fail */
      circuit: "all", /* all | done | not */
      code: "all", /* all | done | not */
      sortBy: "studentId", /* studentId | name | score | time */
      sortDir: "asc" /* asc | desc */
    };
  }

  function norm(text) {
    return String(text || "").trim().toLowerCase().replace(/\s+/g, "");
  }

  /** 학번이나 이름에 찾는 말이 들어 있는가 */
  function matchKeyword(row, keyword) {
    var k = norm(keyword);
    if (!k) return true;
    return norm(row.studentId).indexOf(k) !== -1 || norm(row.studentName).indexOf(k) !== -1;
  }

  function apply(list, filter) {
    var f = Object.assign(emptyFilter(), filter || {});

    var rows = (list || []).filter(function (row) {
      if (!matchKeyword(row, f.keyword)) return false;
      if (f.grade && row.grade !== Number(f.grade)) return false;
      if (f.classNumber && row.classNumber !== Number(f.classNumber)) return false;

      if (f.pass === "pass" && !row.assessment.pass) return false;
      if (f.pass === "fail" && row.assessment.pass) return false;

      if (f.circuit === "done" && !row.circuit.completed) return false;
      if (f.circuit === "not" && row.circuit.completed) return false;

      var codeDone = row.code.testsTotal > 0 && row.code.testsPassed === row.code.testsTotal;
      if (f.code === "done" && !codeDone) return false;
      if (f.code === "not" && codeDone) return false;

      return true;
    });

    var dir = f.sortDir === "desc" ? -1 : 1;
    rows.sort(function (a, b) {
      var av;
      var bv;
      switch (f.sortBy) {
        case "name":
          av = a.studentName;
          bv = b.studentName;
          break;
        case "score":
          av = a.assessment.score;
          bv = b.assessment.score;
          break;
        case "time":
          av = a.serverUpdatedAt || a.submittedAt || "";
          bv = b.serverUpdatedAt || b.submittedAt || "";
          break;
        default:
          av = a.studentId;
          bv = b.studentId;
          break;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      /* 같으면 학번으로 한 번 더 — 순서가 들쭉날쭉하지 않게 */
      return a.studentId < b.studentId ? -1 : a.studentId > b.studentId ? 1 : 0;
    });

    return rows;
  }

  /** 목록에 실제로 있는 학년·반만 골라 준다 (거르기 칸을 채우는 데 쓴다) */
  function optionsOf(list) {
    var grades = {};
    var classes = {};
    (list || []).forEach(function (row) {
      if (row.grade) grades[row.grade] = true;
      if (row.classNumber) classes[row.classNumber] = true;
    });
    function nums(map) {
      return Object.keys(map)
        .map(Number)
        .sort(function (a, b) {
          return a - b;
        });
    }
    return { grades: nums(grades), classes: nums(classes) };
  }

  T.filter = {
    emptyFilter: emptyFilter,
    apply: apply,
    optionsOf: optionsOf,
    matchKeyword: matchKeyword
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.filter;
})();

(function () {
