    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 13장). 다리 길이·평평한 면·글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  --res-body: #d9c39a;
  --res-body-edge: #b79f74;
  --led-off: #b9c3cf;
  --led-on: #ffd24d;
  --led-on-edge: #e0a800;
  --led-glow: rgba(255, 210, 77, 0.45);

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}

.alert__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.alert__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.alert--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}
.alert--info .alert__word {
  color: var(--color-primary-dark);
}

.alert--ok {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}
.alert--ok .alert__word {
  color: var(--color-true-dark);
}

.alert--warn {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}
.alert--warn .alert__word {
  color: var(--color-false-dark);
}

.alert--danger {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}
.alert--danger .alert__word {
  color: var(--color-error);
}

/* 조건 목록 (명세 6.2) */
.condlist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cond {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cond--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cond__mark {
  font-weight: 800;
  color: var(--color-text-sub);
}

.cond--ok .cond__mark {
  color: var(--color-true-dark);
}

.cond__body {
  flex: 1;
}

.cond__label {
  font-weight: 700;
}

.cond__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cond__state {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.cond--ok .cond__state {
  color: var(--color-true-dark);
}

/* ------------------------------ 코드 ------------------------------ */

.codeblock {
  margin: 0;
}

.codeblock__cap,
.codeview__cap {
  font-size: 13px;
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.codeblock__pre {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  border-radius: var(--radius);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  tab-size: 2;
}

.codeview {
  margin: 0;
}

.codeview__lines {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3) 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
}

.codeline {
  display: flex;
  gap: var(--space-3);
  padding: 0 var(--space-4);
  white-space: pre;
  position: relative;
}

.codeline__no {
  color: var(--tok-comment);
  min-width: 2ch;
  text-align: right;
  user-select: none;
}

.codeline__text {
  color: var(--color-console-text);
}

.codeline--active {
  background: rgba(37, 99, 235, 0.28);
}

.codeline--error {
  background: rgba(220, 38, 38, 0.26);
}

.codeline__run {
  position: absolute;
  left: 2px;
  color: var(--tok-number);
  font-weight: 800;
}

.tok-keyword {
  color: var(--tok-keyword);
}
.tok-builtin {
  color: var(--tok-builtin);
}
.tok-string {
  color: var(--tok-string);
}
.tok-number {
  color: var(--tok-number);
}

/* 지시선은 두 겹이다 (s45-figures.js leader 참고)
 * 청록 보드·검은 헤더·흰 종이 «세 바탕» 위에서 모두 보여야 하므로
 * 굵은 흰 선을 깔고 그 위에 진한 주황 선을 얹는다. 보드 색과 확실히 다른 색이다. */
/* O · X 배지 — 글자가 뜻을 지고 색이 거든다 */
.fig__badgebg--ok {
  fill: var(--color-true);
}

.fig__badgebg--no {
  fill: var(--color-error);
}

/* 그 구멍에 부품 다리가 꽂혀 있다 */
.fig__legring {
  fill: none;
  stroke: #b45309;
  stroke-width: 3;
}

/* 같은 전극에 두 다리가 물려 «바로 붙어 버린» 것 */
.fig__shortline {
  stroke: var(--color-error);
  stroke-width: 5;
  stroke-linecap: round;
}

.fig__leaderhalo {
  stroke: #ffffff;
  stroke-width: 6;
  stroke-linecap: round;
}

.fig__leader {
  stroke: #b45309;
  stroke-width: 2.5;
  stroke-linecap: round;
}

/* 가리키는 끝점 — «어디를» 가리키는지 분명히 한다 */
/* ── 이 차시의 그림 : LED 와 저항 ─────────────────────────────
 * 사진을 복제하지 않고 자체 SVG 로 그린다(명세 13장).
 * 색은 보기 편하라고 있는 것이고, 뜻은 배지 번호와 아래 설명 목록이 진다.
 * ---------------------------------------------------------------- */
.figled__body {
  fill: var(--led-off);
  stroke: #8b95a2;
  stroke-width: 2;
}

.figled__body--on {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
}

.figled__flange {
  fill: #aab3bf;
  stroke: #8b95a2;
  stroke-width: 1;
}

.figled__leg {
  stroke: var(--part-lead);
  stroke-width: 5;
  stroke-linecap: round;
}

.figled__cup {
  fill: #9aa6b4;
  stroke: #6f7d8c;
  stroke-width: 1.5;
}

.figled__chip {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
  stroke-width: 1.5;
}

.figled__wire {
  fill: none;
  stroke: #c8a13a;
  stroke-width: 2;
}

.figled__lamp {
  fill: var(--led-off);
  stroke: #8b95a2;
  stroke-width: 2;
}

.figled__lamp--on {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
}

.figled__halo {
  fill: var(--led-glow);
  pointer-events: none;
}

.figres__body {
  fill: var(--res-body);
  stroke: var(--res-body-edge);
  stroke-width: 2;
}

.figres__lead {
  stroke: var(--part-lead);
  stroke-width: 5;
  stroke-linecap: round;
}

/* 회로 기호 — 삼각형이 «가리키는» 쪽으로만 전류가 흐른다 */
.fig__ledsym {
  fill: #b9c3cf;
  stroke: #6f7d8c;
  stroke-width: 1.5;
}

.fig__ledsym--on {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
}

.fig__ledsym--burn {
  fill: #e8b4ad;
  stroke: var(--color-false);
}

.fig__ledbar {
  stroke: #6f7d8c;
  stroke-width: 3;
  stroke-linecap: round;
}

.fig__mini {
  fill: #ffffff;
  stroke: var(--color-border);
  stroke-width: 1.5;
}

.fig__minitext {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legname {
  font-size: 15px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legnote {
  font-size: 11px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__leaderdot {
  fill: #b45309;
  stroke: #ffffff;
  stroke-width: 1.5;
}

/* 보드 위의 부품 (실물을 보고 자리만 맞춘 단순한 모양) */
.fig__hole {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.fig__chip {
  fill: #22262c;
  stroke: #4b5563;
}

.fig__chiptext {
  fill: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-mono);
}

.fig__reset {
  fill: #c2410c;
  stroke: #7c2d12;
}

.fig__resetin {
  fill: #7c2d12;
}

.fig__part {
  fill: #9ca3af;
  stroke: #6b7280;
}

.fig__led {
  fill: #86efac;
  stroke: #16a34a;
}

/* 같은 전극(이어진 구멍 묶음)을 보여 주는 덧칠.
   위쪽 A~E 와 아래쪽 F~J 가 «서로 다른 전극» 이라는 것을 색으로도 나눈다. */
.fig__hilite {
  fill: rgba(37, 99, 235, 0.16);
  stroke: var(--color-primary);
  stroke-width: 2;
}

.fig__hilite--bad {
  fill: rgba(220, 38, 38, 0.14);
  stroke: var(--color-error);
  stroke-width: 2;
}

.fig__hilite--other {
  fill: rgba(180, 83, 9, 0.16);
  stroke: #b45309;
  stroke-width: 2;
  stroke-dasharray: 5 4;
}

/* 아두이노 IDE 창 모형 */
.ide__win {
  fill: var(--color-surface);
  stroke: var(--color-border-strong);
  stroke-width: 1.5;
}

.ide__title {
  fill: #0f766e;
}

.ide__titletext {
  fill: #ffffff;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__winbtn {
  fill: #a7f3d0;
}

.ide__winbtn--close {
  fill: #fca5a5;
}

.ide__menu {
  fill: #f1f5f9;
}

.ide__menutext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__toolbar {
  fill: #0f766e;
}

.ide__tool {
  fill: #0d9488;
  stroke: #99f6e4;
  stroke-width: 1.5;
}

.ide__toolicon {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__select {
  fill: #ffffff;
  stroke: #99f6e4;
}

.ide__selecttext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__side {
  fill: #f8fafc;
}

.ide__sideicon {
  fill: #94a3b8;
  font-size: 12px;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__tab {
  fill: #e2e8f0;
}

.ide__tabtext {
  fill: var(--color-text);
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__code {
  fill: #ffffff;
}

.ide__lineno {
  fill: #94a3b8;
  font-size: 11px;
  text-anchor: end;
  font-family: var(--font-mono);
}

.ide__codetext {
  fill: #1e293b;
  font-size: 11px;
  font-family: var(--font-mono);
  white-space: pre;
}

.ide__codetext--comment {
  fill: #64748b;
  font-style: italic;
}

.ide__status {
  fill: #f1f5f9;
}

.ide__statustext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

/* ================================================================== */
/* 3단계 — 회로 결선                                                   */
/* ================================================================== */

/* 회로 그림과 멀티미터를 «나란히».
   아래위로 두면 두 곳을 짚은 뒤 측정값을 보려고 스크롤을 내려야 한다.
   좁은 화면에서는 저절로 위아래로 쌓인다. */
.circuitpair {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.circuitpair > .card {
  margin-bottom: 0;
}

@media (min-width: 900px) {
  .circuitpair {
    /* 그림에 넉넉히 주고, 계기는 글이 접히지 않을 만큼만 */
    grid-template-columns: minmax(0, 2.6fr) minmax(280px, 1fr);
  }

  /* 그림을 위아래로 훑는 동안에도 측정값이 눈에 남아 있게 */
  .circuitpair > .card:last-child {
    position: sticky;
    top: calc(var(--space-6) + 46px);
  }
}


.board {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.board__tools {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  justify-content: space-between;
}

.board__toolgroup {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

.board__canvas {
  overflow: auto;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-2);
  max-height: 70vh;
}

.board__svg {
  display: block;
  /* 폭은 s40-board.js 의 applyZoom 이 픽셀로 정한다.
     여기서 min-width 를 주면 확대·축소 단추를 이겨 버린다. */
  height: auto;
}

.board__status {
  min-height: 1.6em;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius);
  padding: var(--space-2) var(--space-3);
}

.board__status:empty {
  display: none;
}

.board__picker {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.board__pickersum {
  min-height: var(--touch-min);
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  font-weight: 700;
  color: var(--color-primary-dark);
  cursor: pointer;
}

.board__pickerhelp {
  padding: 0 var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.board__pickerrow {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
  padding: var(--space-3);
}

/* 보드 그림 */
.uno__body {
  fill: var(--board-teal);
  stroke: var(--board-teal-dark);
  stroke-width: 2;
}

.uno__usb,
.uno__jack {
  fill: #b8bec7;
  stroke: #8b939e;
}

.uno__header {
  fill: #17202b;
}

.uno__brand {
  fill: #ffffff;
  font-size: 17px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.uno__brandsub {
  fill: #cfe6e2;
  font-size: 11px;
  font-family: var(--font-sans);
}

.uno__group {
  fill: #ffffff;
  font-size: 10px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.bb__body {
  fill: var(--bb-body);
  stroke: var(--bb-line);
  stroke-width: 2;
}

.bb__railline {
  stroke-width: 2;
}

.bb__railline--plus {
  stroke: var(--rail-plus);
}

.bb__railline--minus {
  stroke: var(--rail-minus);
}

.bb__railline--live {
  stroke-width: 5;
}

.bb__railmark {
  font-size: 12px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-text);
  text-anchor: middle;
}

.bb__raillive {
  font-size: 11px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-true-dark);
  text-anchor: start;
}

.bb__gap {
  fill: #dfe2e7;
}

.bb__gaptext {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 행 문자 A~J — 열 번호와 같은 크기로 (그림 속 글씨는 한 벌) */
.bb__rowlabel {
  font-size: 10px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.bb__colno {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 단자 */
.pin {
  cursor: pointer;
}

.pin__hit {
  fill: transparent;
}

.pin__dot {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.pin--rail .pin__dot,
.pin--tie .pin__dot {
  fill: #7b838f;
  stroke: #ffffff;
}

/* 부품 다리 — 보드 구멍과 달리 «금속선» 이라 밝게 둔다 */
.pin--anode .pin__dot,
.pin--cathode .pin__dot,
.pin--lead .pin__dot {
  fill: #4a5460;
  stroke: #ffffff;
  stroke-width: 2;
}

/* ── 케이블 색 범례와 «어느 쪽» 딱지 ─────────────────────────────
 * 색은 회로의 어느 쪽인지로 정해진다. 색을 «읽는 법» 을 옆에 적어 두고,
 * 목록에는 «D11 쪽 / GND 쪽» 을 글자로도 붙인다(명세 6.1 — 색으로 판정하지 않는다).
 * ---------------------------------------------------------------- */
.wirelegend {
  list-style: none;
  margin: var(--space-3) 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
}

.wirelegend__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelegend__dot {
  flex: none;
  width: 22px;
  height: 4px;
  border-radius: 2px;
}

.wirelegend__dot--orange {
  background: #ea580c;
}

.wirelegend__dot--blue {
  background: #1d4ed8;
}

.wirelegend__dot--gray {
  background: #9aa3ae;
}

.wirelist__side {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

.wirelist__side--source {
  background: #ffedd5;
  color: #9a3412;
}

.wirelist__side--ground {
  background: #dbeafe;
  color: #1e40af;
}

.wirelist__dot--gray {
  background: #9aa3ae;
}

/* 쓰이지 않는 케이블은 흐리게 — «이건 빠져 있다» 가 보이게 */
.wire--none {
  opacity: 0.55;
  stroke-dasharray: 7 5;
}

/* ── 4단계 A : 프로그램과 함수 설명을 나란히 ──────────────────────
 * 코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않게 한다.
 * 좁은 화면에서는 코드가 위, 설명이 아래로 접힌다.
 * ---------------------------------------------------------------- */
.readpair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.readpair__code,
.readpair__fns {
  min-width: 0;
}

.readpair__fns .subhead {
  margin-top: 0;
}

.readpair__fns .fncards {
  margin-top: var(--space-3);
}

@media (max-width: 900px) {
  .readpair {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ── 3단계 : «지금 이어진 것» 과 «이렇게 이으면 됩니다» ───────────
 * 앞의 것은 늘 보인다 — 앱이 회로를 무엇으로 보고 있는지 되비추는 줄이다.
 * 뒤의 것은 접혀 있다 — 펼쳐야 목표가 보인다(명세 18.2).
 * ---------------------------------------------------------------- */
.nowpath {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-3);
  margin-bottom: var(--space-3);
  background: var(--color-muted-bg);
  border-radius: var(--radius);
}

.nowpath__tag {
  flex: none;
  padding: 1px 8px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.nowpath__text {
  flex: 1 1 240px;
  font-size: var(--fs-small);
}

.goallist {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
  counter-reset: goal;
}

.goallist__item {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.goallist__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.goallist__mark {
  flex: none;
  width: 18px;
  font-weight: 800;
  color: var(--color-text-sub);
  text-align: center;
}

.goallist__item.is-done .goallist__mark {
  color: var(--color-true);
}

.goallist__text {
  flex: 1 1 auto;
  font-size: var(--fs-small);
}

.goallist__state {
  flex: none;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.goallist__item.is-done .goallist__state {
  color: var(--color-true-dark);
}

/* ── 함수 설명 상자 (2단계 «오늘 쓸 함수 세 가지») ────────────────
 * 수업 자료의 크림색 상자를 그대로 옮겼다.
 * 함수마다 «한 줄 정의 → 실제로 적는 꼴 → 언제 쓰는가 → 짚어 줄 것» 차례다.
 * ---------------------------------------------------------------- */
.fncards {
  display: grid;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.fncard {
  padding: var(--space-4) var(--space-5, 20px);
  background: var(--fn-box-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-lg);
}

.fncard__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0 0 var(--space-3);
}

.fncard__name {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text);
}

.fncard__summary {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 실제로 적는 꼴 — 학생이 그대로 베껴 쓸 수 있어야 한다 */
.fnforms {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.fnforms__item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--fn-code-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-sm);
}

.fnforms__label {
  flex: none;
  min-width: 34px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.fnforms__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-text);
  word-break: break-all;
}

.fnforms__comment {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__means {
  margin: 0 0 var(--space-1);
}

.fncard__when {
  margin: 0 0 var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__tag {
  display: inline-block;
  padding: 1px 8px;
  margin-right: var(--space-1);
  background: var(--color-muted-bg);
  border-radius: 999px;
  font-weight: 700;
}

.fncard__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 카드마다 붙는 «핵심 정리» */
.keypoints {
  list-style: none;
  margin: var(--space-4) 0 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.keypoints__item {
  position: relative;
  padding-left: 22px;
  font-size: var(--fs-small);
}

.keypoints__item::before {
  content: "▸";
  position: absolute;
  left: 4px;
  color: var(--color-primary);
  font-weight: 700;
}

/* ── 핀을 적는 두 가지 방법 ───────────────────────────────────────
 * 하나만 보여 주면 «반드시 그렇게 써야 하는 줄» 안다.
 * 둘을 나란히 놓아 무엇이 규칙이고 무엇이 골라 쓰는 것인지 가른다.
 * ---------------------------------------------------------------- */
.twoways {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.twoway {
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.twoway__label {
  margin: 0 0 var(--space-1);
  font-weight: 800;
}

.twoway__lead {
  display: inline-block;
  margin-bottom: var(--space-3);
  padding: 2px 8px;
  background: var(--color-code-bg);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.twoway__points {
  list-style: none;
  margin: var(--space-3) 0 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

/* 좋은 점·아쉬운 점을 색으로만 가르지 않는다 — ＋ · － 기호가 뜻을 진다 */
.twoway__point {
  display: flex;
  gap: var(--space-2);
  font-size: var(--fs-small);
}

.twoway__mark {
  flex: none;
  width: 18px;
  font-weight: 800;
  text-align: center;
}

.twoway__point--good .twoway__mark {
  color: var(--color-true);
}

.twoway__point--bad .twoway__mark {
  color: var(--color-false-dark);
}

/* ── 실행 화면 : LED 등 · 상태 칸 · 켜짐/꺼짐 시간표 ────────────
 * 켜짐·꺼짐을 색으로만 알리지 않는다(명세 13장).
 * 등에는 ●/○ 와 «켜짐»·«꺼짐» 글자가, 시간표 칸에도 글자가 함께 들어간다.
 * ---------------------------------------------------------------- */
.runpanel {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface-alt, #f1f4f9);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.runpanel__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}

.lamp-box {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #ffffff;
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  min-width: 116px;
}

/* 켜지고 꺼지는 «순간» 이 보이도록 부드럽게 바뀐다.
   깜빡임 자체는 재생이 가상 시간을 그대로 따라가서 생긴다 —
   delay(1000) 이면 1배속에서 실제로 1초 동안 켜져 있다. */
.lamp-box {
  transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}

.lamp-box--on {
  border-color: var(--led-on-edge);
  background: #fffaeb;
  box-shadow: 0 0 0 4px var(--led-glow);
}

.lamp {
  font-size: 26px;
  line-height: 1;
  color: #b9c3cf;
  transition: color 0.12s ease, text-shadow 0.12s ease;
}

.lamp-box--on .lamp {
  color: var(--led-on-edge);
  text-shadow: 0 0 10px var(--led-on);
}

/* 움직임을 줄여 달라고 한 기기에서는 부드러운 전환을 끈다 */
@media (prefers-reduced-motion: reduce) {
  .lamp-box,
  .lamp {
    transition: none;
  }
}

.lamp__text {
  font-weight: 800;
}

.runstats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--space-2) var(--space-4);
  flex: 1 1 320px;
}

.runstat {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  padding-bottom: 2px;
  border-bottom: 1px dashed var(--color-border);
}

.runstat__label {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.runstat__value {
  font-family: var(--font-mono);
  font-weight: 700;
}

.runpanel__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.ledline__cap {
  margin: 0 0 var(--space-1);
  font-weight: 700;
}

.ledline {
  display: flex;
  width: 100%;
  height: 30px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.ledline__seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
}

.ledline__seg--on {
  background: var(--led-on);
  color: #6b4e00;
}

.ledline__seg--off {
  background: #dde3ea;
  color: var(--color-text-sub);
}

/* ── LED 와 220Ω 저항 ─────────────────────────────────────────
 * 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).
 * 극성은 색이 아니라 «다리 길이 · 평평한 면 · 글자» 가 알린다.
 * ---------------------------------------------------------------- */
.part__tray {
  fill: var(--part-tray);
  stroke: var(--bb-line);
  stroke-width: 1;
}

.part__lead {
  stroke: var(--part-lead);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.res__body {
  fill: var(--res-body);
  stroke: var(--res-body-edge);
  stroke-width: 1.5;
}

.res__band {
  stroke: none;
}

.led__body {
  fill: var(--led-off);
  stroke: #8b95a2;
  stroke-width: 1.5;
}

.part--lit .led__body {
  fill: var(--led-on);
  stroke: var(--led-on-edge);
}

.led__glow {
  fill: var(--led-glow);
  pointer-events: none;
}

.part__name {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.part__note,
.led__flatmark {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.led__flatmark {
  text-anchor: start;
}

/* 켜짐·꺼짐은 «글자» 가 뜻을 진다. 색이 안 보여도 읽을 수 있어야 한다. */
.part__state {
  font-size: 11px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.part--lit .part__state {
  fill: var(--led-on-edge);
}

.pin__label--part {
  fill: var(--color-text);
  font-size: 11px;
}

/* ── 그림 속 글씨는 «한 벌» 로 맞춘다 ─────────────────────────────
 * 이름표만 길이에 따라 작아지면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
 * 그래서 이름표·무리 이름·열 번호를 모두 10px 로 두고,
 * 대신 circuit.js 가 헤더 간격을 30 으로 벌려 긴 이름도 닿지 않게 했다.
 * 레일의 + − 만 기호라서 한 단계 크게(12px) 둔다.
 * ---------------------------------------------------------------- */
.pin__label {
  font-size: 10px;
  font-weight: 800;
  fill: #ffffff;
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.pin:hover .pin__dot {
  fill: var(--color-primary);
  r: 8;
}

.pin--selected .pin__dot {
  fill: var(--color-false);
  stroke: #ffffff;
  stroke-width: 3;
  r: 9;
}


.pin--hot .pin__dot {
  fill: var(--rail-plus);
}

.pin--gnd .pin__dot {
  fill: var(--rail-minus);
}

.pin:focus {
  outline: none;
}

.pin:focus-visible .pin__dot {
  stroke: var(--color-primary);
  stroke-width: 4;
  r: 9;
}

.wire {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  opacity: 0.9;
}

/* 케이블 목록 */
.wirelist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.wirelist__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelist__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 15px;
}

.wirelist__text {
  flex: 1;
}

.wirelist__dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex: 0 0 auto;
  border: 1px solid var(--color-border-strong);
}

.wirelist__dot--red {
  background: var(--rail-plus);
}
.wirelist__dot--black {
  background: #22262c;
}
.wirelist__dot--yellow {
  background: #e3a008;
}
/* 실제로 쓰는 두 가지 — 주황(D11 쪽) · 파랑(GND 쪽) */
.wirelist__dot--orange {
  background: #ea580c;
}
.wirelist__dot--blue {
  background: #1d4ed8;
}

.hintout:empty {
  display: none;
}

/* 멀티미터 */
.subhead {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

/* 스케치의 뼈대 두 함수 */
.skel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.skel__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.skel__name {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  color: var(--color-primary-dark);
}

.skel__when {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
}

.skel__what {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 한 줄씩 읽어 보기 */
.walk {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.walk__item {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.walk__no {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
}

.walk__body {
  flex: 1 1 auto;
  min-width: 0;
}

.walk__code {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-primary-dark);
  background: var(--color-code-bg);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  white-space: pre-wrap;
}

.walk__code--empty {
  color: var(--color-text-sub);
  font-style: italic;
}

.walk__text {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
}

/* 실행 순서 */
.orderlist {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  font-size: 15px;
}

/* 글쓰기 약속 */
.rules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.rules__item {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  font-size: var(--fs-small);
}

.rules__mark {
  flex: 0 0 auto;
  min-width: 3.4em;
  text-align: center;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
}

.modetabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.modetab {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-sub);
  cursor: pointer;
}

.modetab--on {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.codework {
  margin-top: var(--space-3);
}

.assemble {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.assemble__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.assemble__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

.assemble__no {
  color: var(--tok-comment);
  font-family: var(--font-mono);
  min-width: 2ch;
}

.assemble__code {
  flex: 1;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  overflow-x: auto;
  color: var(--color-console-text);
}

.assemble__btns {
  display: flex;
  gap: var(--space-1);
}

.blanks {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: var(--color-console-bg);
  padding: var(--space-3);
  border-radius: var(--radius);
}

.blanks__row {
  display: flex;
}

.blanks__fixed {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  color: var(--color-console-text);
  padding: var(--space-1) 0;
}

.blanks__input {
  margin-left: 2ch;
  max-width: 420px;
}

.editor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.editor__body {
  display: flex;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  overflow: hidden;
}

.editor__gutter {
  display: flex;
  flex-direction: column;
  padding: var(--space-3) var(--space-2);
  background: #16233a;
  color: var(--tok-comment);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  text-align: right;
  min-width: 3ch;
  overflow: hidden;
  user-select: none;
}

.editor__area {
  flex: 1;
  min-height: 260px;
  padding: var(--space-3);
  border: 0;
  background: transparent;
  color: var(--color-console-text);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  resize: vertical;
  tab-size: 2;
}

.editor__area:focus {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.editor__help {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* 가상 시리얼 모니터 */
.monitor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.monitor__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.monitor__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
}

.monitor__clock {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-true-dark);
}

.monitor__out {
  min-height: 120px;
  max-height: 260px;
  overflow-y: auto;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.monitor__line {
  display: flex;
  gap: var(--space-3);
  color: var(--color-console-text);
}

.monitor__t {
  color: var(--tok-comment);
  min-width: 7ch;
}

.monitor__text {
  flex: 1;
  color: var(--tok-number);
  font-weight: 700;
}

.monitor__where {
  color: var(--tok-comment);
  font-size: 13px;
}

.monitor__note {
  color: var(--tok-comment);
  font-style: italic;
  padding: var(--space-1) 0;
}

/* ================================================================== */
/* 5단계 — 실행·탐구                                                   */
/* ================================================================== */

/* ------------------ 5단계 : 입력·출력 장치 알아보기 ------------------ */

/* 장치 표 — 좁은 화면에서는 표만 좌우로 밀린다(본문은 밀리지 않는다) */
.devwrap {
  overflow-x: auto;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.devtable {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-small);
}

.devtable th,
.devtable td {
  padding: var(--space-2) var(--space-3);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
  vertical-align: top;
}

.devtable th {
  background: var(--color-primary-soft);
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.devtable tr:last-child td {
  border-bottom: 0;
}

.devtable td:first-child {
  white-space: nowrap;
}

.devtable__icon {
  display: inline-block;
  min-width: 1.4em;
  margin-right: var(--space-1);
  color: var(--color-primary);
}

/* 어느 핀에 꽂을지 고르는 법 */
.pinrules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.pinrules__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.pinrules__q {
  font-weight: 800;
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
}

.pinrules__a {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text);
}

.expform {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
}

.expresult {
  padding: var(--space-3);
  background: var(--color-true-soft);
  border-radius: var(--radius);
}

.expresult__head {
  font-weight: 800;
  color: var(--color-true-dark);
}

.expresult__list {
  margin-top: var(--space-2);
  font-size: 15px;
}

.record {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.record__data {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-true-dark);
}

.design {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.design__title {
  font-size: 15px;
  font-weight: 800;

.design__goal {

/* ================================================================== */
/* 6단계 — 형성평가·제출                                               */
/*                                                                    */
/* 짜임새와 이름을 lesson3_7_1 의 6단계와 «같게» 맞추었다.              */
/*   ① 형성평가(왼쪽) + ② 채점·제출 진행 상황(오른쪽) → ③ 학습 정리     */
/* ================================================================== */

/* ------------------ 좌우 두 쪽 · 판 · 구역 제목 ------------------ */

.stack {

    grid-template-columns: minmax(0, 1fr);
  }
}

.panel {

  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);

.panel__title {

  font-weight: 700;

  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.section-title {

  align-items: center;
  gap: var(--space-2);

  font-weight: 800;
}

.section-title:first-child {
  margin-top: 0;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.badge--true {
  border-color: var(--color-true);
  color: var(--color-true-dark);
  background: var(--color-true-soft);
}

.badge--false {
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.badge--primary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
}

/* ---------------------- 진행 상황 콘솔 ---------------------- */

.console {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.console__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.console__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.console__body {
  min-height: 132px;
  max-height: 320px;

}

.console__line {

}

.console__prompt {
  flex: 0 0 auto;

}

.console__text {

}

.console__line--error .console__text {

}

.console__line--hint .console__text {
  color: var(--color-hint-on-dark);
}

.console__line--ok .console__text {
  color: #86efac;
}

.console__line--muted .console__text {
  color: #94a3b8;
}

.console__empty {
  color: #64748b;
}

/* ---------------------- 응시자 정보 ---------------------- */

.student-card {
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.student-card.is-ready {

}

.student-card__head {
  display: flex;
  align-items: center;

  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.student-card__title {
  font-size: 15px;
  font-weight: 800;
}

.student-card__badge {
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.student-card__fields {
  display: grid;

@media (max-width: 767px) {

.student-field {

}

}

.student-card__note {

}

.student-card__note.is-ok {

}

}

/* 학번·이름을 넣기 전에는 문항을 잠근다 */
.quiz-gate {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);

}

.quiz-gate[hidden] {

}

.quiz__body.is-gated {

  filter: grayscale(0.35);
  pointer-events: none;
  user-select: none;
}

/* -------------------- 문항 (한 번에 하나) -------------------- */

.quiz__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  font-weight: 700;
}

.quiz__counter {
  flex: 0 0 auto;
  font-weight: 800;
  white-space: nowrap;
}

.quiz__dots {
  display: flex;
  gap: 6px;
}

.quiz__dot {
  position: relative;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: transparent;
  padding: 0;
  cursor: pointer;
}

/* 점은 10px 이지만 누르는 자리는 44px 을 확보한다 */
.quiz__dot::after {
  content: "";
  position: absolute;
  inset: -17px;
}

.quiz__dot.is-answered {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.quiz__dot.is-current {
  transform: scale(1.35);
  border-color: var(--color-primary);
}

.quiz__dot:focus-visible {
  outline: 3px solid var(--color-primary);

}

.quiz__tags {

  flex-wrap: wrap;

}

.quiz__question {
  font-size: 17px;
  font-weight: 700;

}

.quiz__no {

  margin-right: 6px;
}

.quiz__note {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.option {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  text-align: left;
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.option:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.option.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.option:focus-within {
  outline: 3px solid var(--color-primary);

}

/* 답안을 낸 뒤 — 읽기만 된다. 누를 수 있어 보이면 안 된다. */
.option--locked {

}

.option--locked:hover {
  border-color: var(--color-border-strong);
  background: var(--color-surface);
}

.option--locked.is-selected:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.option__num {
  flex: 0 0 auto;
  font-weight: 800;
  color: var(--color-primary-dark);
}

.option__text {
  flex: 1 1 auto;
}

/* ------------------------ 채점 결과 ------------------------ */

.score-card {

.score-card__title {

}

.score-card__student {

  font-size: 15px;
  color: var(--color-text-sub);
}

}

.score-card__value {

}

.score-card__value small {

}

.score-dots {

  justify-content: center;
  gap: var(--space-2);

}

.score-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;

  border: 2px solid var(--color-border-strong);

.score-dot.is-correct {

.syntaxcard__note {

  font-size: var(--fs-small);

.my-answer {
