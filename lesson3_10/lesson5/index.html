    base.submissionId = str(r.submissionId);

    /* 이미 제출을 마친 자료라면 답안은 잠긴 것이다.
       저장 자료에서 sealed 만 지워 답을 고치는 길을 막는다. */
    if (base.submitted) base.assessment.sealed = true;

    /* 잠기지 않았으면 채점 결과도 열려 있을 수 없다 */
    if (!base.assessment.sealed) base.assessment.graded = false;

    /* ★ 전원은 «켰다» 는 기록만으로 유지하지 않는다.
       전원을 켠 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 켜져 있어서는 안 된다.
       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다.
       (저장 자료를 손으로 고쳐 단계를 건너뛰지 못하게) */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    if (state.circuit.connections.length > 0) return true;
    if (state.code.source) return true;
    if (Object.keys(state.experiment.runs || {}).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.experiment.keepOnText) return true;
    if (Object.keys(state.intro.predicts || {}).length > 0) return true;
    if (state.intro.safetyRead || Object.keys(state.concept.checks).length > 0) return true;
    return false;
  }

  /** 시각을 「2026-08-18 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  S.emptyState = emptyState;
  S.normalizeState = normalizeState;
  S.hasContent = hasContent;
  S.formatTime = formatTime;

  if (typeof module !== "undefined" && module.exports) module.exports = S;
})();

    <script data-from="student/s10-ui.js">
/**
 * 화면 부품 (명세 13장)
 *
 * 여기서 만드는 요소는 모두 «텍스트로» 넣는다(textContent).
 * innerHTML 에 사람이 쓴 글을 넣지 않는다 — 스크립트가 섞여 들어갈 수 없게 하기 위해서다.
 *
 * 접근성 약속 (명세 13장)
 *   · 모든 입력에는 <label for> 을 붙인다
 *   · 정답/오답·위험은 색이 아니라 «아이콘 + 글자» 로도 알린다
 *   · 터치 영역은 최소 44px
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /* 화면이 없는 곳(테스트)에서는 이 파일이 하는 일이 없다 */
  if (typeof document === "undefined") return;

  var uid = 0;
  function nextId(prefix) {
    uid += 1;
    return (prefix || "f") + "-" + uid;
  }

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  /**
   * 요소 하나를 만든다.
   *   el("p", { class: "note", text: "안녕" })
   *   el("button", { class: "btn btn--primary", text: "다음", on: { click: fn }, attrs: { type: "button" } })
   */
  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  /** SVG 요소 — HTML 과 이름 공간이 달라 따로 만든다 */
  function svg(tag, attrs, children) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      node.setAttribute(k, String(v));
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /* ------------------------------ 카드 ------------------------------ */

  function card(opts, children) {
    var o = opts || {};
    var head = [];
    if (o.eyebrow) head.push(el("p", { class: "card__eyebrow", text: o.eyebrow }));
    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));

    var parts = [];
    if (head.length) parts.push(el("div", { class: "card__head" }, head));
    parts.push(el("div", { class: "card__body" }, children || []));
    return el("section", { class: "card" + (o.tone ? " card--" + o.tone : "") }, parts);
  }

  /** 코드 상자 — 들여쓰기와 줄바꿈을 그대로 지킨다 */
  function codeBlock(code, caption) {
    var pre = el("pre", { class: "codeblock__pre", attrs: { tabindex: "0" } }, [
      el("code", { text: code })
    ]);
    return el("figure", { class: "codeblock" }, [
      caption ? el("figcaption", { class: "codeblock__cap", text: caption }) : null,
      pre
    ]);
  }

  /* ------------------------------ 알림 ------------------------------ */

  /**
   * 알림 상자. 색만으로 뜻을 전하지 않도록 «아이콘 + 말머리» 를 함께 넣는다(명세 13장).
   *   tone : info · ok · warn · danger
   */
  var TONE_MARK = {
    info: { icon: "ℹ", word: "안내" },
    ok: { icon: "✔", word: "확인" },
    warn: { icon: "⚠", word: "주의" },
    danger: { icon: "⛔", word: "위험" }
  };

  function alert(tone, message, children) {
    var mark = TONE_MARK[tone] || TONE_MARK.info;
    return el("div", { class: "alert alert--" + tone, attrs: { role: tone === "danger" ? "alert" : null } }, [
      el("span", { class: "alert__icon", attrs: { "aria-hidden": "true" }, text: mark.icon }),
      el("div", { class: "alert__body" }, [
        el("p", { class: "alert__text" }, [
          el("b", { class: "alert__word", text: mark.word + " " }),
          document.createTextNode(String(message || ""))
        ])
      ].concat(children || []))
    ]);
  }

  /** 조건 목록 한 줄 — 「✔ 통과」 또는 「○ 아직」 (명세 6.2 · 13장) */
  function conditionRow(label, ok, detail) {
    return el("li", { class: "cond" + (ok ? " cond--ok" : "") }, [
      el("span", { class: "cond__mark", attrs: { "aria-hidden": "true" }, text: ok ? "✔" : "○" }),
      el("div", { class: "cond__body" }, [
        el("p", { class: "cond__label" }, [
          el("span", { class: "sr-only", text: ok ? "충족함: " : "아직 못 함: " }),
          document.createTextNode(String(label))
        ]),
        detail ? el("p", { class: "cond__detail", text: detail }) : null
      ]),
      el("span", { class: "cond__state", text: ok ? "통과" : "아직" })
    ]);
  }

  /**
   * 접어 두는 덧자료 — «마쳐야 하는 것» 과 «더 보고 싶은 것» 을 갈라 놓는다.
   *
   * 닫힌 채로 나온다. 펼칠 때 만들므로 열지 않으면 그리지도 않는다.
   * 통과 조건이 아닌 활동을 늘 펼쳐 두면, 학생은 그것도 해야 하는 줄 안다.
   */
  function foldout(title, build) {
    var body = el("div", { class: "foldout__body" });
    var wrap = el("details", { class: "foldout" }, [
      el("summary", { class: "foldout__sum", text: title }),
      body
    ]);
    var built = false;
    wrap.addEventListener("toggle", function () {
      if (!wrap.open || built) return;
      built = true;
      var made = build(body);
      if (made) body.appendChild(made);
    });
    return wrap;
  }

  /* ------------------------------ 입력 ------------------------------ */

  /**
   * 서술형·단답형 입력 한 칸.
   * spec : { label, min, placeholder, help, multiline, rows, mono }
   * 돌려주는 것 : { root, input, setError, refresh }
   */
  function field(spec, value, onInput) {
    var s = spec || {};
    var id = nextId("in");
    var cntId = id + "-cnt";
    var errId = id + "-err";

    var input = s.multiline
      ? el("textarea", {
          class: "input input--area" + (s.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            rows: s.rows || 3,
            placeholder: s.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (PC.LIMITS && PC.LIMITS.textMax) || 1000
          }
        })
      : el("input", {
          class: "input" + (s.mono ? " input--mono" : ""),
          id: id,
          attrs: {
            type: "text",
            placeholder: s.placeholder || "",
            "aria-describedby": cntId,
            maxlength: (PC.LIMITS && PC.LIMITS.textMax) || 1000
          }
        });
    input.value = value || "";

    function countText() {
      var len = PC.schema.contentLength(input.value);
      return s.min ? "공백 제외 " + len + "자 / 최소 " + s.min + "자" : "공백 제외 " + len + "자";
    }

    var counter = el("p", { class: "field__count", id: cntId, text: countText() });
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

    function refresh() {
      counter.textContent = countText();
      var enough = !s.min || PC.schema.contentLength(input.value) >= s.min;
      counter.className = "field__count" + (enough ? " field__count--ok" : "");
    }

    input.addEventListener("input", function () {
      refresh();
      if (onInput) onInput(input.value);
    });

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;
        error.hidden = false;
        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", cntId + " " + errId);
      } else {
        error.textContent = "";
        error.hidden = true;
        input.removeAttribute("aria-invalid");
        input.setAttribute("aria-describedby", cntId);
      }
    }

    var rootNode = el("div", { class: "field" }, [
      el("label", { class: "field__label", attrs: { for: id }, text: s.label || "" }),
      s.help ? el("p", { class: "field__help", text: s.help }) : null,
      input,
      el("div", { class: "field__foot" }, [counter, error])
    ]);

    return { root: rootNode, input: input, setError: setError, refresh: refresh };
  }

  /**
   * 보기 고르기 (라디오). 색이 아니라 «글자» 로 고른 것을 알린다.
   * spec : { name, legend, choices:[문자열], numbered }
   */
  function choiceGroup(spec, selected, onPick) {
    var s = spec || {};
    var name = s.name || nextId("q");
    var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

    var items = (s.choices || []).map(function (label, i) {
      var id = name + "-" + i;
      var input = el("input", {
        class: "choice__input",
        id: id,
        attrs: { type: "radio", name: name, value: String(i) }
      });
      if (String(selected) === String(i)) input.checked = true;
      input.addEventListener("change", function () {
        if (onPick) onPick(i);
      });

      return el("div", { class: "choice" }, [
        input,
        el("label", { class: "choice__label", attrs: { for: id } }, [
          s.numbered === false
            ? null
            : el("span", { class: "choice__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
          el("span", { class: "choice__text", text: label })
        ])
      ]);
    });

    /* legendClass: "sr" 이면 물음을 화면에서 감춘다(낭독기는 읽는다).
       카드 제목에 물음이 이미 적혀 있을 때 두 번 읽히지 않게 하려는 것이다. */
    var legendClass = "choices__legend" + (s.legendClass === "sr" ? " choices__legend--sr" : "");

    return el("fieldset", { class: "choices" }, [
      s.legend ? el("legend", { class: legendClass, text: s.legend }) : null
    ].concat(items));
  }

  function button(label, opts) {
    var o = opts || {};
    var attrs = {
      type: "button",
      disabled: o.disabled ? true : null,
      "aria-pressed": o.pressed === undefined ? null : o.pressed ? "true" : "false",
      title: o.title || null
    };
    /* 부르는 곳에서 aria-label 같은 것을 더 붙일 수 있게 */
    Object.keys(o.attrs || {}).forEach(function (k) {
      attrs[k] = o.attrs[k];
    });

    return el("button", {
      class: o.class && o.class.indexOf("btn") === 0 ? o.class : "btn " + (o.class || "btn--primary"),
      text: label,
      attrs: attrs,
      on: o.on || (o.click ? { click: o.click } : null)
    });
  }

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,
   * 초점을 상자 안에 잡아 준다. file:// 에서도 그대로 동작한다.
   *
   * spec = {
   *   title, lines[], okLabel, cancelLabel,
   *   onOk, onCancel,
   *   dismiss : "ok" | "cancel"   — Esc 로 닫았을 때 어느 쪽으로 볼지
   * }
   *
   * ★ Esc 로 닫으면 «지우지 않는 쪽» 이 되게 부르는 곳에서 dismiss 를 정한다.
   *   실수로 눌러 기록이 사라지는 일은 되돌릴 수 없다.
   */
  function askDialog(spec) {
    var s = spec || {};
    var dialog = el("dialog", { class: "modal" });
    var settled = false;

    function done(which) {
      if (settled) return;
      settled = true;
      if (dialog.open && dialog.close) dialog.close();
      /* 닫는 애니메이션이 끝난 뒤 치운다 */
      setTimeout(function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
      }, 0);
      if (which === "ok" && s.onOk) s.onOk();
      if (which === "cancel" && s.onCancel) s.onCancel();
    }

    var okBtn = button(s.okLabel || "확인", {
      click: function () {
        done("ok");
      }
    });

    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", text: s.title || "" }),
        el(
          "p",
          { class: "modal__text" },
          (s.lines || []).map(function (line, i) {
            /* 줄바꿈을 innerHTML 없이 만든다 (명세 15장 — 글은 textContent 로만) */
            return el("span", { class: "modal__line", text: line, id: i === 0 ? null : undefined });
          })
        ),
        el("div", { class: "modal__actions" }, [
          button(s.cancelLabel || "취소", {
            class: "btn btn--ghost",
            click: function () {
              done("cancel");
            }
          }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */
    okBtn.focus();

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 화면 낭독기에 조용히 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  S.ui = {
    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();

    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical5-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();

    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            /* 서버는 처음 제출 시각을 serverCreatedAt(명세 7장) 으로 준다.
               앞 차시의 서버는 serverSubmittedAt 으로 주므로 둘 다 본다. */
            serverSubmittedAt: data.serverCreatedAt || data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverCreatedAt || data.serverSubmittedAt || "",
            /* created 는 «새로 만들었는가», updated 는 «덮어썼는가» 다 */
            updated: data.updated === true || data.created === false,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();

 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  /**

   *
   * ★ 두 갈래를 «주황» 과 «파랑» 으로 둔다.
   *   검정은 청록 보드와 검은 헤더 위에서 잘 보이지 않았다(선생님 지적).
   *   주황–파랑은 밝은 바탕에서 둘 다 또렷하고, 서로 «따뜻한 색 / 찬 색» 이라

   *   D8 → 저항 → LED 긴 다리    가 모두 «주황»  (신호가 나가는 길)

   *   양쪽 다 같은 색이 되어 «어디까지가 어느 쪽인지» 가 보이지 않는다.
   *
   *   색은 판정에 쓰지 않는다(명세 6.3). 그래서 옆에 «D8 쪽/GND 쪽» 글자를 함께 적는다.
   *
   *   ★ 이 차시에는 «센서 쪽(노랑)» 이 하나 더 있다.
   *     PIR 의 VCC·OUT 은 LED 전류의 길이 아니지만 «쓰이지 않는» 선도 아니다.
   *     회색(쓰이지 않음)과 한 색으로 묶으면 학생이 제 손으로 이은 선을

   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   *
   * ★ 바닥값을 «폭» 이 아니라 «구멍 간격» 으로 잡는다.
   *
   *   그림이 넓어질수록 같은 화면 폭에서 구멍이 작아진다. 바닥을 폭으로 두면

   *   (실제로 10열 → 16열로 넓혔을 때 22.9px 이던 구멍이 19.7px 로 줄었다)
   *
   *   그래서 «구멍이 적어도 MIN_PITCH 픽셀» 이 되는 폭을 구해 그보다 좁히지 않는다.
   *   넘치는 만큼은 그림 칸 «안» 에서 좌우로 밀어 본다(명세 11장 — 회로 영역만 허용).
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    var available = host.clientWidth || 320;

    var vb = String(svgNode.getAttribute("viewBox") || "0 0 920 600").split(/\s+/);
    var vbWidth = Number(vb[2]) || 920;
    /* 이 폭이어야 SVG 간격 PITCH 가 화면에서 MIN_PITCH 픽셀이 된다 */
    var needed = (vbWidth / C.PITCH) * MIN_PITCH;
    var base = Math.max(available, needed);

    svgNode.style.width = Math.round(base * zoom) + "px";
  }

  /**
   * 창 크기가 바뀌면 폭을 다시 맞춘다.
   *
   * 픽셀로 적어 둔 폭은 창이 바뀌어도 그대로 남는다.
   * 그러면 화면을 돌리거나 창을 줄였을 때 단자가 손가락보다 작아진 채로 있다.
   * 그림마다 듣는 이를 붙이면 화면을 다시 그릴 때 쌓이므로, «한 번만» 붙이고
   * 그때그때 화면에 놓인 그림을 찾아 고친다.
   */
  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /**
   * 회로 화면 하나를 만든다.
   *
   *   opts.mode        'find'(단자 찾기) · 'wire'(결선) · 'locked'(전원이 켜져 잠김)
   *   opts.showBoard   우노를 보일 것인가 (기본 true)
   *   opts.showBread   브레드보드를 보일 것인가
   *   opts.getState    () => 회로 상태 { connections, powerOn, ... }
   *   opts.onPick      (component, pin) => void        — 단자를 하나 눌렀을 때 (find 모드)
   *   opts.onConnect   (connection) => void            — 케이블이 하나 생겼을 때
   *   opts.onRemoveWire (index) => void                — 케이블 하나를 지울 때 (wire 모드)
   *
   * ★ 'locked' 는 «전원이 켜져 있어 회로를 고칠 수 없는» 상태다.
   *   전에는 멀티미터로 «재는» 자리(probe)였으나 그 활동을 걷어냈다.
   *   잠그는 구실은 그대로 남는다 — 전기가 흐르는 중에 케이블을 뽑으면 안 된다.
   *   opts.onMessage   (text) => void                  — 안내 문구를 바깥에 알릴 때
   */
  function create(opts) {
    var o = opts || {};
    var mode = o.mode || "wire";
    var showBoard = o.showBoard !== false;
    var showBread = o.showBread === true;
    /* 이 차시에는 LED·저항이 있다. 3A(찾기)와 3B(결선) 모두 부품을 보여 준다. */
    var showParts = o.showParts !== false;

    var zoom = 1;
    var pending = null; /* 첫 번째로 고른 단자 */
    var focusKey = showBoard ? "uno/" + C.LED_PIN_NAME : showBread ? "bb/TP-1" : "led/A";

    var svgHost = UI.el("div", { class: "board__canvas" });
    var statusLine = UI.el("p", {
      class: "board__status",
      attrs: { role: "status", "aria-live": "polite" },
      /**
       * ★ 방금 한 일을 알리는 문구는 «다시 그린 뒤에도» 남아야 한다.
       *
       *   케이블을 잇거나 지우면 app.update() 가 화면 전체를 다시 그린다.
       *   그러면 board 가 새로 만들어져 이 칸이 빈 채로 돌아온다 —
       *   정작 학생이 읽어야 할 「… 를 지웠습니다」 가 사라지는 것이다.
       *   그래서 모듈 한 곳(carry)에 담아 두고 새 board 가 이어받는다.
       *
       *   시각을 함께 담는 까닭 : 나중에 이 화면으로 «다시 들어왔을 때»
       *   지난번 문구가 되살아나면 안 된다. 다시 그리기는 순식간이므로
       *   3초를 넘긴 문구는 이어받지 않는다.
       */
      text: Date.now() - carry.at < 3000 ? carry.text : ""
    });

    /* ------------------------------------------------------------------ */
    /* 그리기                                                              */
    /* ------------------------------------------------------------------ */

    function keyOf(componentId, pinId) {
      return componentId + "/" + pinId;
    }

    function splitKey(key) {
      var i = String(key).indexOf("/");
      return { component: key.slice(0, i), pin: key.slice(i + 1) };
    }

    /** 지금 이 단자가 선택 상태인가 */
    function isPending(componentId, pinId) {
      return pending && pending.component === componentId && pending.pin === pinId;
    }


    function terminalLabel(componentId, pin, net, powerOn) {
      var parts = [C.describe(componentId, pin.id)];
      parts.push(C.KIND_WORD[pin.kind] || "단자");
      if (powerOn && net) {
        var v = net.potentialAt(componentId, pin.id);
        if (v === 5) parts.push("5V 전원");
        else if (v === 0) parts.push("0V 접지");
      }
      if (isPending(componentId, pin.id)) parts.push("선택됨");
      return parts.join(", ");
    }

    function drawUno(state, net, powerOn) {
      var g = UI.svg("g", { class: "uno" });
      var box = C.UNO.box;

      g.appendChild(
        UI.svg("rect", {
          x: box.x, y: box.y, width: box.w, height: box.h,
          rx: 12, class: "uno__body"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.usbBox.x, y: C.UNO.usbBox.y,
          width: C.UNO.usbBox.w, height: C.UNO.usbBox.h,
          rx: 3, class: "uno__usb"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.jackBox.x, y: C.UNO.jackBox.y,
          width: C.UNO.jackBox.w, height: C.UNO.jackBox.h,
          rx: 4, class: "uno__jack"
        })
      );

      /* 헤더 띠 */
      [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
        g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
      });

      /* 보드 이름 — 두 머리띠 사이의 빈 자리에 */
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 162, class: "uno__brandsub" }, [txt("오픈 소스 하드웨어")]));

      /* 무리 이름 — 핀 이름표와 겹치지 않도록 머리띠 «바깥쪽» 에 둔다 */
      g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
      g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
      g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

      C.UNO.pins.forEach(function (pin) {
        g.appendChild(drawPin("uno", pin, state, net, powerOn));
      });
      return g;
    }

    function drawBreadboard(state, net, powerOn) {
      var g = UI.svg("g", { class: "bb" });
      var box = C.BB.box;

      g.appendChild(
        UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" })
      );

      /* 전원 레일 줄무늬 — 어느 레일에 전기가 왔는지 색과 «글자» 로 함께 보인다 */
      C.BB.rails.forEach(function (rail) {
        var live = powerOn && net ? net.potentialOf("bb:rail:" + rail.id) : null;
        var cls = "bb__railline bb__railline--" + rail.polarity + (live !== null ? " bb__railline--live" : "");
        g.appendChild(
          UI.svg("line", { x1: box.x + 10, y1: rail.y, x2: box.x + box.w - 10, y2: rail.y, class: cls })
        );
        g.appendChild(
          UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)])
        );
        /* 전압 표시는 판 «바깥» 오른쪽에 적는다.
           판 안에 적으면 마지막 구멍과 겹치고 글자가 판 밖으로 잘린다. */
        if (live !== null) {
          g.appendChild(
            UI.svg("text", { x: box.x + box.w + 8, y: rail.y + 5, class: "bb__raillive" }, [
              txt(live === 5 ? "5V" : "0V")
            ])
          );
        }
      });

      /* 가운데 홈 */
      g.appendChild(
        UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
      );
      g.appendChild(
        UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 17, class: "bb__gaptext" }, [
          txt("여기서 전극이 끊긴다 — 위 A~E 와 아래 F~J 는 다른 전극")
        ])
      );

      /* 열 번호 — 자리는 A 줄 구멍의 x 를 그대로 쓴다 */
      for (var c = 1; c <= C.BB.cols; c += 1) {
        var aPin = C.terminal("bb", "A" + c);
        if (aPin) {
          g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
        }
      }


      /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
         구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
         이 글자는 눈으로 볼 때만 필요하다. */
      C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
        var pin = C.terminal("bb", row + "1");
        if (!pin) return;
        g.appendChild(
          UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
        );
      });
      C.BB.pins.forEach(function (pin) {
        g.appendChild(drawPin("bb", pin, state, net, powerOn));
      });
      return g;
    }

    /* ------------------------------------------------------------------ */
    /* 부품 — 220Ω 저항과 LED (명세 17.3 A · 13장)                          */
    /*                                                                    */
    /* ★ 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).                   */
    /* ★ 극성을 «색으로만» 알리지 않는다. 다리 길이·평평한 면·글자를 함께 쓴다. */
    /* ------------------------------------------------------------------ */

    var BAND_FILL = { red: "#c0392b", brown: "#7b4a2d", gold: "#c8a13a" };

    function drawResistor(st) {
      var R = C.RES;
      var g = UI.svg("g", { class: "part part--res" });
      var body = R.body;
      var midY = body.y + body.h / 2;

      g.appendChild(
        UI.svg("rect", {
          x: R.box.x, y: R.box.y, width: R.box.w, height: R.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 다리 — 몸통 양쪽으로 뻗은 금속선 */
      R.pins.forEach(function (pin) {
        g.appendChild(
          UI.svg("line", {
            x1: pin.x, y1: pin.y,
            x2: pin.x < body.x ? body.x : body.x + body.w,
            y2: midY,
            class: "part__lead"
          })
        );
      });

      g.appendChild(
        UI.svg("rect", { x: body.x, y: body.y, width: body.w, height: body.h, rx: 9, class: "res__body" })
      );

      /* 띠 — 눈으로 보는 표시일 뿐이다. 값은 아래 글자가 진다(명세 17.3 A). */
      R.bands.forEach(function (band) {
        g.appendChild(
          UI.svg("rect", {
            x: body.x + body.w * band.at - 3, y: body.y,
            width: 6, height: body.h,
            fill: BAND_FILL[band.color] || "#555",
            class: "res__band"
          })
        );
      });

      /* ★ 색각 이상 학생을 위해 «220Ω» 글자를 반드시 병기한다(명세 17.3 A) */
      g.appendChild(
        UI.svg("text", { x: body.x + body.w / 2, y: body.y - 10, class: "part__name" }, [
          txt(C.RESISTOR_OHM + "Ω 저항")
        ])
      );
      g.appendChild(
        UI.svg("text", { x: body.x + body.w / 2, y: body.y + body.h + 20, class: "part__note" }, [
          txt("방향 없음 — 어느 끝이든 좋다")
        ])
      );
      return g;
    }

    function drawLed(st, net, powerOn) {
      var LED = C.LED;
      var lit = powerOn && st.ledOn === true;
      var g = UI.svg("g", { class: "part part--led" + (lit ? " part--lit" : "") });
      var b = LED.body;

      g.appendChild(
        UI.svg("rect", {
          x: LED.box.x, y: LED.box.y, width: LED.box.w, height: LED.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 다리 — A 는 길게, K 는 짧게 그린다. 길이 자체가 극성을 알리는 표시다. */
      ["A", "K"].forEach(function (id) {
        var leg = LED.legs[id];
        g.appendChild(
          UI.svg("line", {
            x1: leg.from.x, y1: leg.from.y, x2: leg.to.x, y2: leg.to.y,
            class: "part__lead part__lead--" + id
          })
        );
      });

      /* 몸통 — 위는 둥글고 K 쪽 옆면이 «평평» 하다.
         d 는 «왼쪽 아래 → 왼쪽 위로 둥글게 → 오른쪽에서 수직으로 잘림» 순서다. */
      var flatX = b.cx + b.r - 7;
      g.appendChild(
        UI.svg("path", {
          d:
            "M " + (b.cx - b.r) + " " + (b.cy + 22) +
            " L " + (b.cx - b.r) + " " + b.cy +
            " A " + b.r + " " + b.r + " 0 0 1 " + flatX + " " + (b.cy - b.r + 3) +
            " L " + flatX + " " + (b.cy + 22) + " Z",
          class: "led__body"
        })
      );
      /* 켜졌을 때 퍼지는 빛 */
      if (lit) {
        g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r + 14, class: "led__glow" }));
      }

      g.appendChild(
        UI.svg("text", { x: b.cx, y: LED.box.y + 16, class: "part__name" }, [txt("LED")])
      );
      /* 평평한 면이 어디인지 «글자로도» 알린다 */
      g.appendChild(
        UI.svg("text", { x: flatX + 12, y: b.cy + 26, class: "led__flatmark" }, [txt("평평한 면")])
      );
      /* 켜짐·꺼짐을 색이 아니라 글자로도 (명세 13장) */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: LED.box.y + LED.box.h - 6, class: "part__state" }, [
          txt(powerOn ? (lit ? "● 켜짐" : "○ 꺼짐") : "전원 꺼짐")
        ])
      );
      return g;
    }

    /**
     * PIR 모듈 — 실물 사진처럼 «작은 초록 기판 + 아래로 뻗은 다리 셋».
     *
     * ★ 자리 잡기 (겹치지 않게 «줄» 을 나눈다)
     *
     *   y 438  이름(왼쪽)                    지금 상태(오른쪽)
     *   y 448  ┌──── 초록 기판 ────┐
     *   y 510  └──┬────┬────┬──────┘
     *   y 540     │    │    │        다리 끝
     *   y 558    VCC OUT(DO) GND     이름표  ← 다리 «바로 아래»
     *   y 584  ※ 실제 모듈의 인쇄를 읽으세요
     *
     *   전에는 경고문(y 544)과 이름표(y 552)가 같은 자리에 겹쳐 둘 다 읽을 수 없었다.
     *
     * ★ 핀 순서를 «암기시키지 않는다»(명세 6.3).
     *   다리마다 «인쇄 라벨» 을 글자로 적어 두고, 그림 안에
     *   «제조사마다 순서가 다르다» 를 늘 적는다.
     *
     * ★ 지금 감지 중인지도 «글자로» 알린다(명세 11장 — 색만으로 알리지 않는다).
     */
    function drawPir(st, net, powerOn) {
      var P = C.PIR;
      var sensing = powerOn && st.motionHigh === true;
      var g = UI.svg("g", { class: "part part--pir" + (sensing ? " part--sensing" : "") });
      var boardBottom = P.board.y + P.board.h;

      g.appendChild(
        UI.svg("rect", {
          x: P.box.x, y: P.box.y, width: P.box.w, height: P.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* ── 다리 셋 — 기판 «안» 에서 아래로 내려온다 ──
         기판보다 먼저 그려 기판이 다리 위를 덮게 한다(실물처럼). */
      P.pins.forEach(function (pin) {
        g.appendChild(
          UI.svg("line", {
            x1: pin.x, y1: boardBottom - 10, x2: pin.x, y2: pin.y,
            class: "part__lead pir__leg"
          })
        );
        /* 다리 끝의 뾰족한 부분 — 브레드보드에 꽂히는 자리 */
        g.appendChild(
          UI.svg("path", {
            d:
              "M " + (pin.x - 3) + " " + (pin.y - 6) +
              " L " + (pin.x + 3) + " " + (pin.y - 6) +
              " L " + pin.x + " " + (pin.y + 3) + " Z",
            class: "pir__tip"
          })
        );
      });

      /* ── 초록 기판 ── */
      g.appendChild(
        UI.svg("rect", {
          x: P.board.x, y: P.board.y, width: P.board.w, height: P.board.h,
          rx: 5, class: "pir__board"
        })
      );

      /* ── 흰 돔(프레넬 렌즈) ── */
      g.appendChild(UI.svg("circle", { cx: P.dome.cx, cy: P.dome.cy, r: P.dome.r, class: "pir__dome" }));
      [-13, -4.5, 4.5, 13].forEach(function (dx) {
        g.appendChild(
          UI.svg("line", {
            x1: P.dome.cx + dx, y1: P.dome.cy - P.dome.r + 5,
            x2: P.dome.cx + dx, y2: P.dome.cy + P.dome.r - 5,
            class: "pir__facet"
          })
        );
      });
      if (sensing) {
        g.appendChild(
          UI.svg("circle", { cx: P.dome.cx, cy: P.dome.cy, r: P.dome.r + 9, class: "pir__wave" })
        );
      }

      /* ── 감도·유지 시간 조절 나사 ── */
      P.pots.forEach(function (pot) {
        g.appendChild(UI.svg("circle", { cx: pot.cx, cy: pot.cy, r: pot.r, class: "pir__pot" }));
        g.appendChild(
          UI.svg("line", {
            x1: pot.cx - pot.r + 2, y1: pot.cy, x2: pot.cx + pot.r - 2, y2: pot.cy,
            class: "pir__potslot"
          })
        );
        g.appendChild(
          UI.svg("text", { x: pot.cx + pot.r + 5, y: pot.cy + 4, class: "pir__potname" }, [txt(pot.name)])
        );
      });

      /* ── 글 세 줄 — 서로 다른 «줄» 에 둔다 ── */
      g.appendChild(
        UI.svg("text", { x: P.box.x + 10, y: P.box.y + 14, class: "part__name pir__name" }, [
          txt("PIR 인체감지센서")
        ])
      );
      /* 지금 무엇을 내보내고 있는지 — 글자로 (명세 11장) */
      g.appendChild(
        UI.svg("text", { x: P.box.x + P.box.w - 10, y: P.box.y + 14, class: "pir__state" }, [
          txt(powerOn ? (sensing ? "● 감지 중 — DO HIGH" : "○ 미감지 — DO LOW") : "전원 꺼짐")
        ])
      );
      /* 핀 순서를 외우지 말라는 경고 — 늘 보인다(명세 6.3) */
      g.appendChild(
        UI.svg("text", { x: P.box.x + 10, y: P.box.y + P.box.h - 12, class: "pir__warn" }, [
          txt("※ 핀 순서는 모듈마다 다릅니다 — 인쇄된 글자를 읽으세요")
        ])
      );
      return g;
    }

    function drawParts(st, net, powerOn) {
      var g = UI.svg("g", { class: "parts" });
      g.appendChild(drawResistor(st));
      g.appendChild(drawLed(st, net, powerOn));
      g.appendChild(drawPir(st, net, powerOn));
      C.PARTS.forEach(function (part) {
        part.pins.forEach(function (pin) {
          g.appendChild(drawPin(part.id, pin, st, net, powerOn));
        });
      });
      return g;
    }

    /** 단자 하나 — 눌리는 자리는 보이는 원보다 넉넉하게 잡는다(터치용) */
    function drawPin(componentId, pin, state, net, powerOn) {
      var key = keyOf(componentId, pin.id);
      var selected = isPending(componentId, pin.id);
      var volts = powerOn && net ? net.potentialAt(componentId, pin.id) : null;

      var classes = ["pin", "pin--" + pin.kind];
      if (selected) classes.push("pin--selected");
      if (volts === 5) classes.push("pin--hot");
      if (volts === 0) classes.push("pin--gnd");

      var g = UI.svg("g", {
        class: classes.join(" "),
        role: "button",
        tabindex: focusKey === key ? "0" : "-1",
        "data-key": key,
        "aria-label": terminalLabel(componentId, pin, net, powerOn)
      });

      /* 넓은 투명 판 — 손가락으로 눌러도 빗나가지 않게 */
      g.appendChild(
        UI.svg("rect", {
          x: pin.x - C.PITCH / 2, y: pin.y - C.PITCH / 2,
          width: C.PITCH, height: C.PITCH,
          class: "pin__hit"
        })
      );
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "pin__dot" }));

      /* 부품 다리 이름표 — LED 의 A·K 와 저항의 두 끝을 «글자로» 알린다(명세 6.1).
         이름을 적지 않으면 어느 다리가 긴 다리인지 그림만으로 헷갈린다. */
      if (componentId === "led" || componentId === "res" || componentId === "pir") {
        g.appendChild(
          UI.svg("text", { x: pin.x, y: pin.y + 18, class: "pin__label pin__label--part" }, [
            txt(pin.short)
          ])
        );
      }

      /* 이름표 — 모든 사용 가능 단자에 실제 명칭을 적는다(명세 6.1).
         위 핀은 아래쪽에, 아래 핀은 위쪽에 적어 무리 이름과 겹치지 않게 한다. */
      if (componentId === "uno") {
        g.appendChild(
          UI.svg(
            "text",
            {
              x: pin.x,
              y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
              /* 이름표는 «모두 같은 크기» 다.
                 긴 이름을 줄이면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
                 대신 circuit.js 가 헤더 간격을 30 으로 벌려 두었다. */
              class: "pin__label"
            },
            [txt(pin.label)]
          )
        );
      }

      g.addEventListener("click", function () {
        pick(componentId, pin.id);
      });
      g.addEventListener("keydown", function (evt) {
        onPinKey(evt, componentId, pin);
      });
      g.addEventListener("focus", function () {
        focusKey = key;
        say(terminalLabel(componentId, pin, net, powerOn));
      });

      return g;
    }

    /** 꽂힌 케이블 */
    /**
     * 케이블 «가운데» 만 누를 수 있는 길을 만든다.
     *
     * ★ 왜 가운데만인가.
     *   케이블의 두 끝은 «단자 바로 위» 다. 케이블 전체를 누를 수 있게 하면
     *   이미 케이블이 꽂힌 단자에서 다른 선을 하나 더 뽑을 수 없다 —
     *   누를 때마다 «케이블 지우기» 가 먼저 잡아채기 때문이다.
     *   그래서 t 0.28~0.72 구간만 잘라 쓴다. 단자 둘레는 그대로 비워 둔다.
     *
     * 2차 베지에 곡선 위의 점 : B(t) = (1-t)²A + 2(1-t)t M + t²B
     */
    function midSegment(a, m, b) {
      /* 단자 둘레 이만큼은 반드시 비운다. 구멍 간격(24)의 절반보다 커야
         이미 케이블이 꽂힌 구멍을 다시 누를 수 있다. */
      var CLEAR = 16;
      var pts = [];
      for (var i = 0; i <= 24; i += 1) {
        var t = i / 24;
        var u = 1 - t;
        var x = u * u * a.x + 2 * u * t * m.x + t * t * b.x;
        var y = u * u * a.y + 2 * u * t * m.y + t * t * b.y;
        if (Math.sqrt((x - a.x) * (x - a.x) + (y - a.y) * (y - a.y)) < CLEAR) continue;
        if (Math.sqrt((x - b.x) * (x - b.x) + (y - b.y) * (y - b.y)) < CLEAR) continue;
        pts.push(Math.round(x * 10) / 10 + " " + Math.round(y * 10) / 10);
      }
      /* 아주 짧은 케이블은 비우고 나면 남는 곳이 없다.
         그런 줄은 아래의 «한가운데 점» 만으로 누른다. */
      return pts.length >= 2 ? "M " + pts.join(" L ") : "";
    }

    /** 그 케이블의 한가운데 점 (t = 0.5) — ✕ 표를 놓을 자리 */
    function curveMid(a, m, b) {
      return { x: (a.x + 2 * m.x + b.x) / 4, y: (a.y + 2 * m.y + b.y) / 4 };
    }

    function drawWires(state) {
      var g = UI.svg("g", { class: "wires" });
      /* 색은 그릴 때 «회로 전체를 보고» 정한다 — 두 끝만으로는 알 수 없다 */
      var sides = C.wireSides(state.connections || []);
      /* 지우기는 «케이블을 고치는 자리» 에서만 — 전원이 켜져 잠긴 동안에는 못 지운다 */
      var canRemove = mode === "wire" && !!o.onRemoveWire;

      (state.connections || []).forEach(function (conn, i) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;

        /* 살짝 휘어지게 그려 여러 줄이 겹쳐도 구분된다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
        var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;

        var side = sides[i] || "";
        var stroke = WIRE_COLORS[SIDE_COLOR[side]] || WIRE_COLORS.gray;
        var line = UI.svg("path", {
          d: d,
          class: "wire wire--" + (side || "none"),
          stroke: stroke,
          "data-index": String(i)
        });

        if (!canRemove) {
          g.appendChild(line);
          return;
        }

        var what =
          C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 를 이은 케이블";

        var hit = UI.svg("g", {
          class: "wirehit",
          role: "button",
          tabindex: "0",
          "data-index": String(i),
          "aria-label": what + " — 누르면 지웁니다"
        });
        /* 넓은 투명 길 — 손가락으로 눌러도 빗나가지 않게 */
        var mid = { x: mx, y: my };
        var lane = midSegment(a, mid, b);
        if (lane) hit.appendChild(UI.svg("path", { d: lane, class: "wirehit__area" }));
        hit.appendChild(line);

        /* ✕ 표 — 평소에는 숨어 있고, 갖다 대거나 초점이 가면 나타난다.
           «여기를 누르면 지워진다» 를 색이 아니라 «모양» 으로 알린다(명세 11장). */
        var c = curveMid(a, mid, b);
        /* 한가운데 점 — 어떤 케이블이든 «반드시» 누를 수 있는 자리.
           위의 긴 길이 비어 있는 짧은 케이블에서도 이것만은 남는다. */
        hit.appendChild(UI.svg("circle", { cx: c.x, cy: c.y, r: 11, class: "wirehit__spot" }));

        var mark = UI.svg("g", { class: "wirehit__x" });
        mark.appendChild(UI.svg("circle", { cx: c.x, cy: c.y, r: 10, class: "wirehit__xbg" }));
        mark.appendChild(UI.svg("text", { x: c.x, y: c.y + 4, class: "wirehit__xtext" }, [txt("✕")]));
        hit.appendChild(mark);

        hit.addEventListener("click", function (evt) {
          evt.stopPropagation();
          removeWire(i, what);
        });
        hit.addEventListener("keydown", function (evt) {
          if (evt.key !== "Enter" && evt.key !== " " && evt.key !== "Spacebar") return;
          evt.preventDefault();
          removeWire(i, what);
        });
        hit.addEventListener("focus", function () {
          say(what + " 입니다. Enter 를 누르면 이 케이블만 지웁니다.");
        });

        g.appendChild(hit);
      });
      return g;
    }

    /**
     * 케이블 하나를 지운다.
     *
     * ★ «되돌리기»(맨 끝 하나를 뺀다) 와 «초기화»(모두 지운다) 사이의 셋째 길이다.
     *   가운데 한 줄만 잘못 이었을 때 뒤의 것까지 지우지 않아도 된다.
     */
    function removeWire(index, what) {
      if (!o.onRemoveWire) return;
      pending = null;
      /* ★ 알리는 것이 «먼저» 다.
         onRemoveWire 는 app.update() 를 불러 board 를 새로 만든다.
         그 뒤에 say() 하면 이미 떨어져 나간 칸에 적는 꼴이라
         학생에게는 «한 박자 늦은» 지난 문구가 보인다. */
      say((what || "케이블") + " 을(를) 지웠습니다.");
      o.onRemoveWire(index);
    }

    function txt(value) {
      return document.createTextNode(String(value));
    }

    /* ------------------------------------------------------------------ */
    /* 조작                                                                */
    /* ------------------------------------------------------------------ */

    function say(message) {
      statusLine.textContent = message;
      carry = { text: message, at: Date.now() };
      if (o.onMessage) o.onMessage(message);
    }

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }

    /** 단자 하나를 눌렀다 */
    function pick(componentId, pinId) {
      focusKey = keyOf(componentId, pinId);

      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      /* 전원이 켜져 있으면 회로를 고칠 수 없다 — 왜 반응이 없는지 «말해 준다» */
      if (mode === "locked") {
        say("전원이 켜져 있어 회로를 고칠 수 없습니다. [전원 끄기] 를 먼저 누르세요.");
        return;
      }

      /* wire 모드 */
      if (!pending) {
        pending = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 을(를) 골랐습니다. 이을 곳을 하나 더 누르세요.");
        render();
        return;
      }

      if (pending.component === componentId && pending.pin === pinId) {
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }

      var conn = C.makeConnection(pending, { component: componentId, pin: pinId });
      pending = null;
      if (!conn) {
        say("이을 수 없는 자리입니다.");
        render();
        return;
      }
      /* ★ 이미 이어진 두 자리를 «다시» 고르면 그 케이블을 지운다.
         전에는 「이미 이어져 있는 곳입니다」 라고만 하고 아무 일도 하지 않았다.
         학생이 잘못 이은 선을 없애려면 아래 목록까지 내려가야 했다.
         케이블 선을 직접 누르는 길과 «같은 뜻» 이 되도록 여기서도 지운다. */
      var already = C.connectionIndex(state().connections, conn);
      if (already !== -1) {
        removeWire(
          already,
          C.describe(conn.fromComponent, conn.fromPin) +
            " 와(과) " +
            C.describe(conn.toComponent, conn.toPin) +
            " 를 이은 케이블"
        );
        render();
        return;
      }
      /* 알리는 것이 «먼저» — removeWire 의 주석과 같은 까닭이다 */
      say(
        C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 을(를) " +
          (COLOR_WORD[conn.color] || "") +
          " 케이블로 이었습니다. 잘못 이었으면 그 선을 한 번 누르세요."
      );
      if (o.onConnect) o.onConnect(conn);
      render();
    }

    /** 화살표로 옮겨 다니기 — 지금 위치에서 그 방향으로 가장 가까운 단자 */
    function nearestPin(fromComponent, fromPin, dx, dy) {
      var here = C.terminal(fromComponent, fromPin);
      if (!here) return null;

      var best = null;
      var bestScore = Infinity;

      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;

        comp.pins.forEach(function (pin) {
          if (comp.id === fromComponent && pin.id === fromPin) return;
          var vx = pin.x - here.x;
          var vy = pin.y - here.y;
          /* 가려는 방향으로 나아간 거리 */
          var along = vx * dx + vy * dy;
          if (along <= 0) return;
          /* 옆으로 벗어난 거리 — 많이 벗어날수록 나쁜 후보 */
          var across = Math.abs(vx * dy - vy * dx);
          var score = along + across * 3;
          if (score < bestScore) {
            bestScore = score;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return best;
    }

    function onPinKey(evt, componentId, pin) {
      var dirs = {
        ArrowRight: [1, 0],
        ArrowLeft: [-1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };

      if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
        evt.preventDefault();
        pick(componentId, pin.id);
        return;
      }
      if (evt.key === "Escape" && pending) {
        evt.preventDefault();
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }
      if (!dirs[evt.key]) return;

      evt.preventDefault();
      var target = nearestPin(componentId, pin.id, dirs[evt.key][0], dirs[evt.key][1]);
      if (!target) return;
      focusKey = keyOf(target.component, target.pin);
      render();
      var node = svgHost.querySelector('[data-key="' + cssEscape(focusKey) + '"]');
      if (node) node.focus();
    }

    /** 속성 선택자에 넣어도 안전하게 */
    function cssEscape(value) {
      return String(value).replace(/["\\]/g, "\\$&");
    }

    /* ------------------------------------------------------------------ */
    /* 키보드·화면낭독기용 «목록으로 잇기» (명세 6.1)                        */
    /* ------------------------------------------------------------------ */

    function terminalOptions() {
      var list = [];
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        comp.pins.forEach(function (pin) {
          list.push({ value: keyOf(comp.id, pin.id), label: C.describe(comp.id, pin.id) });
        });
      });
      return list;
    }

    function buildPicker() {
      if (mode === "find") return null;
      /* 잠긴 동안에는 이을 수 없으므로 «목록에서 골라 잇기» 도 내보내지 않는다 */
      if (mode === "locked") return null;

      var options = terminalOptions();
      function makeSelect(labelText) {
        var id = UI.nextId("sel");
        var select = UI.el("select", { class: "input input--select", id: id });
        options.forEach(function (opt) {
          select.appendChild(UI.el("option", { text: opt.label, attrs: { value: opt.value } }));
        });
        return {
          root: UI.el("div", { class: "field field--inline" }, [
            UI.el("label", { class: "field__label", attrs: { for: id }, text: labelText }),
            select
          ]),
          select: select
        };
      }

      var from = makeSelect("여기에서");
      var to = makeSelect("여기까지");
      /* 두 칸이 같은 곳을 가리키면 쓸모가 없으므로 두 번째는 다른 곳으로 미리 옮겨 둔다 */
      if (options.length > 1) to.select.selectedIndex = Math.min(options.length - 1, 1);

      var go = UI.button("이 둘을 잇기", {
        class: "btn btn--ghost",
        click: function () {
          var a = splitKey(from.select.value);
          var b = splitKey(to.select.value);
          pending = a;
          pick(b.component, b.pin);
        }
      });

      return UI.el("details", { class: "board__picker" }, [
        UI.el("summary", { class: "board__pickersum", text: "목록에서 골라 잇기" }),
        UI.el("p", {
          class: "board__pickerhelp",
          text: "그림을 누르기 어려울 때 씁니다. 그림 위에서는 화살표 키로 옮기고 Enter 로 고를 수도 있습니다."
        }),
        UI.el("div", { class: "board__pickerrow" }, [from.root, to.root, go])
      ]);
    }

    /* ------------------------------------------------------------------ */
    /* 도구 막대                                                           */
    /* ------------------------------------------------------------------ */

    function buildTools() {
      if (mode !== "wire") {
        return UI.el("div", { class: "board__tools" }, [zoomGroup()]);
      }

      var connections = state().connections || [];
      var undo = UI.button("한 단계 되돌리기", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onUndo) o.onUndo();
        }
      });
      var reset = UI.button("전체 초기화", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onReset) o.onReset();
        }
      });

      return UI.el("div", { class: "board__tools" }, [
        UI.el("div", { class: "board__toolgroup" }, [undo, reset]),
        zoomGroup()
      ]);
    }

    function zoomGroup() {
      function setZoom(next) {
        /* 하한을 넉넉히 둔다. 좁은 화면에서는 바닥값(640) 에 곱하므로
           0.5 로는 화면 폭에 몇 픽셀 모자라 «전체 보기» 가 되지 않는다. */
        zoom = Math.max(0.4, Math.min(2.4, next));
        applyZoom();
      }
      return UI.el("div", { class: "board__toolgroup", attrs: { role: "group", "aria-label": "확대·축소" } }, [
        UI.button("−", {
          class: "btn btn--ghost btn--icon",
          title: "축소",
          click: function () {
            setZoom(zoom - 0.2);
          }
        }),
        UI.button("기본", {
          class: "btn btn--ghost btn--small",
          click: function () {
            setZoom(1);
          }
        }),
        UI.button("+", {
          class: "btn btn--ghost btn--icon",
          title: "확대",
          click: function () {
            setZoom(zoom + 0.2);
          }
        })
      ]);
    }

    /** 지금 확대 배수로 폭을 맞춘다. 배수를 그림에 적어 두어 창이 바뀔 때도 쓴다. */
    function applyZoom() {
      svgHost.setAttribute("data-zoom", String(zoom));
      fitSvg(svgHost, zoom);
    }

    /* ------------------------------------------------------------------ */
    /* 조립                                                                */
    /* ------------------------------------------------------------------ */

    var toolHost = UI.el("div");
    var pickerHost = UI.el("div");

    function render() {
      var st = state();
      var net = C.solve(st.connections);
      var powerOn = st.powerOn === true;

      /* 우노는 왼쪽, 브레드보드는 오른쪽에 나란히 놓인다(circuit.js 좌표).
         단자 찾기(3A)에서는 브레드보드가 없으므로 보드만 담는 좁은 틀을 쓴다. */
      /* 보이는 부품에 따라 틀을 고른다. 아래쪽 100px 은 LED·저항 자리다. */
      /* 아래쪽 130px 은 저항·LED·PIR 자리다(circuit.js 의 좌표).
         PIR 이 오른쪽으로 x 820 까지 뻗으므로 브레드보드가 없어도 폭을 넉넉히 둔다. */
      /* ★ 브레드보드를 16열로 넓히면서 틀도 함께 넓혔다.
         판이 x 1024 까지 가고, 그 «바깥» 에 적는 5V/0V 글자가 1060 까지 간다. */
      var viewBox = showBread
        ? "0 18 1070 600"
        : showParts
        ? "0 18 850 600"
        : "0 18 560 268";

      var svgNode = UI.svg("svg", {
        viewBox: viewBox,
        class: "board__svg",
        role: "img",
        "aria-label":
          (showBread ? "왼쪽에 아두이노 우노, 오른쪽에 브레드보드" : "아두이노 우노 보드") +
          (showParts ? ", 아래쪽에 " + C.RESISTOR_OHM + "옴 저항과 LED, PIR 인체감지센서" : "")
      });

      if (showBoard) svgNode.appendChild(drawUno(st, net, powerOn));
      if (showBread) svgNode.appendChild(drawBreadboard(st, net, powerOn));
      if (showParts) svgNode.appendChild(drawParts(st, net, powerOn));
      svgNode.appendChild(drawWires(st));

      UI.clear(svgHost).appendChild(svgNode);
      applyZoom();

      UI.clear(toolHost).appendChild(buildTools());
      var picker = buildPicker();
      UI.clear(pickerHost);
      if (picker) pickerHost.appendChild(picker);
    }

    var rootNode = UI.el("div", { class: "board" }, [toolHost, svgHost, statusLine, pickerHost]);

    render();

    return {
      root: rootNode,
      render: render,
      setMode: function (next) {
        mode = next;
        pending = null;
        render();
      },
      cancelPending: function () {
        pending = null;
        render();
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_COLOR: SIDE_COLOR,
    SIDE_WORD: SIDE_WORD
  };
})();

    <script data-from="student/s45-figures.js">
/**
 * 설명 그림 (명세 13장)
 *
 * 2단계 «원리 이해» 의 카드가 글만 있어서 장치 그림을 함께 넣는다.
 *
 * ★ 실제 사진을 «복제하지 않는다».
 *   명세 13장 — 「실제 부품 사진을 참고하되 저작권이 불명확한 이미지는
 *   복제하지 말고 자체 SVG로 그린다」.
 *   그래서 실물 사진을 보고 같은 배치로 «직접» 그렸다.
 *   덧붙여, 그림 파일을 심지 않으므로 단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 *
 * 보드와 브레드보드의 좌표는 shared/circuit.js 에서 가져온다.
 * 3단계 시뮬레이터와 «같은 그림» 이어야 학생이 헷갈리지 않기 때문이다.
 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,
 * 화면 낭독기에는 그 목록이 그림의 대체 설명이 된다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  function txt(value) {
    return document.createTextNode(String(value));
  }

  /** 번호 배지 — 그림 위에 얹는 동그란 번호 */
  function badge(no, x, y) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 11, class: "fig__badgebg" }),
      UI.svg("text", { x: x, y: y + 4, class: "fig__badgeno" }, [txt(String(no))])
    ]);
  }

  /**
   * O · X 배지 — «이렇게 꽂는다 / 이렇게 꽂으면 안 된다» 를 나타낸다.
   * 색만으로 알리지 않는다. 동그라미 안의 O·X 글자가 뜻을 지고,
   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.
   */
  function badgeMark(mark, x, y, kind) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg fig__badgebg--" + kind }),
      UI.svg("text", { x: x, y: y + 5, class: "fig__badgeno" }, [txt(mark)])
    ]);
  }

  /**
   * 배지에서 가리키는 곳까지 잇는 선.
   *
   * ★ 두 겹으로 그린다.
   *   아래 : 굵은 «흰» 선 — 청록 보드와 검은 헤더 위에서 선이 묻히지 않게 한다
   *   위   : 가는 «진한 주황» 선 — 흰 종이 위에서도 보이고, 보드 색과 확실히 다르다
   *
   * 한 겹으로는 어느 한쪽 바탕에서 반드시 묻힌다(파란 점선이 청록 보드에서 안 보였다).
   */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", {}, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderhalo" }),
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leader" }),
      /* 가리키는 끝에 점을 찍어 «어디를» 가리키는지 분명히 한다 */
      UI.svg("circle", { cx: x2, cy: y2, r: 3.5, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 덩어리를 만든다.
   *   opts : { viewBox, caption, items:[{text}], build(g) }
   *
   * items 의 차례가 곧 배지 번호다. build 안에서 badge(n, x, y) 로 같은 번호를 얹는다.
   */
  function figure(opts) {
    var o = opts || {};
    var items = o.items || [];

    /* 배지에 쓸 표시. 따로 주지 않으면 1, 2, 3 … 을 쓴다.
       그림의 배지와 아래 설명 목록은 반드시 «같은 표시» 여야 한다.
       그림에는 O 인데 목록에는 다른 글자가 있으면 짝을 지을 수 없다. */
    var marks = o.marks || items.map(function (_, i) {
      /* 배지에 그리는 것과 «똑같은» 숫자를 목록에도 쓴다 */
      return String(i + 1);
    });

    /* 그림의 «대체 설명» — 낭독기는 이 글을 읽는다 */
    var alt =
      o.caption +
      ". 표시된 곳 : " +
      items
        .map(function (item, i) {
          return marks[i] + " " + item.text;
        })
        .join(", ");

    var svgNode = UI.svg("svg", {
      viewBox: o.viewBox,
      class: "fig__svg",
      role: "img",
      "aria-label": alt
    });
    if (o.build) o.build(svgNode);

    var legend = UI.el("ol", { class: "fig__legend" }, items.map(function (item, i) {
      var kind = (o.markKinds || [])[i];
      return UI.el("li", { class: "fig__item" }, [
        UI.el("span", {
          class: "fig__no" + (kind ? " fig__no--" + kind : ""),
          attrs: { "aria-hidden": "true" },
          text: marks[i]
        }),
        UI.el("span", { class: "fig__text", text: item.text })
      ]);
    }));

    /* 브레드보드처럼 «세로로 긴» 그림은 그대로 두면 화면을 다 차지한다.
       narrow 를 주면 폭을 묶어 카드 안에 들어오는 크기로 줄인다. */
    return UI.el("figure", { class: "fig" + (o.narrow ? " fig--narrow" : "") }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      UI.el("figcaption", { class: "fig__cap", text: o.caption }),
      legend
    ]);
  }

  /* ================================================================== */
  /* 1. 아두이노 우노 보드                                                */
  /* ================================================================== */

  /** 3단계 시뮬레이터와 같은 좌표로 보드를 그린다(누를 수는 없는 «설명용») */
  function drawUnoBody(g) {
    var box = C.UNO.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12, class: "uno__body" }));
    [C.UNO.usbBox, C.UNO.jackBox].forEach(function (b) {
      g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: "uno__usb" }));
    });
    [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
      g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
    });

    /* 보드 위의 큰 부품들 — 실물을 보고 자리만 맞추어 단순하게 */
    var chip = C.UNO.chip;
    g.appendChild(UI.svg("rect", { x: chip.x, y: chip.y, width: chip.w, height: chip.h, rx: 3, class: "fig__chip" }));
    g.appendChild(
      UI.svg("text", { x: chip.x + chip.w / 2, y: chip.y + 28, class: "fig__chiptext" }, [txt("ATmega328P")])
    );
    /* 리셋 버튼 — 헤더 띠(y 44~72) 를 피해 보드 빈자리에 둔다 */
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 9, class: "fig__reset" }));
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 4, class: "fig__resetin" }));
    g.appendChild(UI.svg("rect", { x: 110, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("rect", { x: 140, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("circle", { cx: 460, cy: 106, r: 5, class: "fig__led" }));
    g.appendChild(UI.svg("text", { x: 474, y: 110, class: "uno__brandsub" }, [txt("ON")]));

    g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));

    /* 무리 이름과 핀 이름표 */
    g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
    g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
    g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

    C.UNO.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "fig__hole" }));
      g.appendChild(
        UI.svg(
          "text",
          {
            x: pin.x,
            y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
            class: "pin__label"
          },
          [txt(pin.label)]
        )
      );
    });
  }

  function unoFigure() {
    return figure({
      viewBox: "-56 -34 676 358",
      caption: "아두이노 우노 보드 — 가장자리 구멍마다 이름이 있다",
      items: [
        { text: "USB 단자 — 컴퓨터와 잇는다. 프로그램을 보내고 전기도 받는다." },
        { text: "디지털 핀 D0~D13 — 위 줄에 있다(가리킨 곳은 D13). 켜짐(HIGH)·꺼짐(LOW) 두 가지만 다룬다." },
        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },
        { text: "5V — 부품에 전기를 보내 주는 «+» 자리." },
        { text: "GND — 전기가 돌아오는 길이자 0V 기준점. 세 곳이 보드 안에서 이어져 있다." },
        { text: "ATmega328P — 프로그램이 담겨 «처리» 를 맡는 칩." }
      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;
        var chip = C.UNO.chip;
        var d13 = C.terminal("uno", "D13");
        var vcc = C.terminal("uno", "5V");
        var gnd = C.terminal("uno", "GND2");
        var a0 = C.terminal("uno", "A0");

        /* ① USB — 보드 왼쪽 밖에서 가로로 */
        g.appendChild(leader(-27, usb.y + usb.h / 2, usb.x - 2, usb.y + usb.h / 2));
        g.appendChild(badge(1, -40, usb.y + usb.h / 2));

        /* ② 디지털 핀 — «D13 구멍» 을 바로 위에서 가리킨다.
              무리 이름은 x 300 으로 비켜 두었으므로 이 선과 겹치지 않는다. */
        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));
        g.appendChild(badge(2, d13.x, -20));

        /* ③ 아날로그 핀 — «A0 구멍» 을 바로 아래에서.
              A0~A5 가운데를 가리키면 A2·A3 사이를 짚어 어느 핀인지 알 수 없다. */
        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        /* ④ 5V — 그 구멍을 바로 아래에서 */
        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));
        g.appendChild(badge(4, vcc.x, 315));

        /* ⑤ GND — 세 곳 중 아래 줄의 GND 구멍을 바로 아래에서 */
        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }
    });
  }

  /* ================================================================== */
  /* 2. 브레드보드                                                        */
  /* ================================================================== */

  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

  function breadboardFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "브레드보드 — 어느 구멍끼리 이어지는가(같은 전극)",
      items: [
        { text: "+ 레일(빨간 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극이라 5V 를 한 곳에만 넣으면 된다." },
        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },
        { text: "가운데 홈 — 여기서 전극이 끊긴다. 위와 아래가 서로 붙지 않게 일부러 끊어 놓은 것이다." },
        { text: "같은 4번 열이지만 F~J (주황 점선) 는 «다른 전극» 이다. 이으려면 점퍼선으로 A4–F4 를 직접 이어 준다." }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* 4번 열을 위(A~E)·아래(F~J)로 나누어 감싼다.

        var right = 904;

        g.appendChild(leader(right, a3.y, a3.x + 11, a3.y));

        g.appendChild(badgeMark("X", right + 14, c9.y, "no"));
      }
    });
  }

  /* 실물 사진을 복제하지 않고 자체 SVG 로 그린다.                          */
  /* 색만으로 뜻을 전하지 않는다 — 배지 번호와 아래 설명 목록이 짝을 이룬다.  */

  /** LED 를 크게 그린다. 다리 길이가 다르고 K 쪽 옆면이 평평하다. */
  function bigLed(g, cx, baseY, opts) {
    var o = opts || {};
    var r = o.r || 40;
    var cy = baseY - 46;
    var flatX = cx + r - 11;
    var lit = o.lit === true;

    /* 몸통 — 위는 둥글고 오른쪽(K 쪽) 옆면이 잘려 «평평» 하다 */
    g.appendChild(
      UI.svg("path", {
        d:
          "M " + (cx - r) + " " + (baseY - 10) +
          " L " + (cx - r) + " " + cy +
          " A " + r + " " + r + " 0 0 1 " + flatX + " " + (cy - r + 5) +
          " L " + flatX + " " + (baseY - 10) + " Z",
        class: "figled__body" + (lit ? " figled__body--on" : "")
      })
    );
    /* 아래 테두리(플랜지) — 실물 LED 의 둥근 턱 */
    g.appendChild(
      UI.svg("rect", { x: cx - r - 4, y: baseY - 12, width: 2 * r + 8, height: 9, rx: 3, class: "figled__flange" })
    );

    /* 다리 — 왼쪽(A)이 «더 길다». 길이 자체가 극성을 알리는 표시다. */
    g.appendChild(
      UI.svg("line", { x1: cx - 16, y1: baseY - 3, x2: cx - 16, y2: baseY + 72, class: "figled__leg" })
    );
    g.appendChild(
      UI.svg("line", { x1: cx + 16, y1: baseY - 3, x2: cx + 16, y2: baseY + 44, class: "figled__leg" })
    );
    return { cx: cx, cy: cy, r: r, flatX: flatX, baseY: baseY };
  }
