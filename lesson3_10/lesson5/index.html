<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />

    <title>제출 현황 분석 | 인체감지센서로 자동 조명 만들기</title>

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 13장). 다리 길이·평평한 면·글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  --res-body: #d9c39a;
  --res-body-edge: #b79f74;
  --led-off: #b9c3cf;
  --led-on: #ffd24d;
  --led-on-edge: #e0a800;
  --led-glow: rgba(255, 210, 77, 0.45);

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}

.alert__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.alert__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.alert--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}
.alert--info .alert__word {
  color: var(--color-primary-dark);
}

.alert--ok {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}
.alert--ok .alert__word {
  color: var(--color-true-dark);
}

.alert--warn {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}
.alert--warn .alert__word {
  color: var(--color-false-dark);
}

.alert--danger {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}
.alert--danger .alert__word {
  color: var(--color-error);
}

/* 조건 목록 (명세 6.2) */
.condlist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cond {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cond--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cond__mark {
  font-weight: 800;
  color: var(--color-text-sub);
}

.cond--ok .cond__mark {
  color: var(--color-true-dark);
}

.cond__body {
  flex: 1;
}

.cond__label {
  font-weight: 700;
}

.cond__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cond__state {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.cond--ok .cond__state {
  color: var(--color-true-dark);
}

/* ------------------------------ 코드 ------------------------------ */

.codeblock {
  margin: 0;
}

.codeblock__cap,
.codeview__cap {
  font-size: 13px;
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.codeblock__pre {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  border-radius: var(--radius);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  tab-size: 2;
}

.codeview {
  margin: 0;
}

.codeview__lines {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3) 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
}

.codeline {
  display: flex;
  gap: var(--space-3);
  padding: 0 var(--space-4);
  white-space: pre;
  position: relative;
}

.codeline__no {
  color: var(--tok-comment);
  min-width: 2ch;
  text-align: right;
  user-select: none;
}

.codeline__text {
  color: var(--color-console-text);
}

.codeline--active {
  background: rgba(37, 99, 235, 0.28);
}

.codeline--error {
  background: rgba(220, 38, 38, 0.26);
}

.codeline__run {
  position: absolute;
  left: 2px;
  color: var(--tok-number);
  font-weight: 800;
}

.tok-keyword {
  color: var(--tok-keyword);
}
.tok-builtin {
  color: var(--tok-builtin);
}
.tok-string {
  color: var(--tok-string);
}
.tok-number {
  color: var(--tok-number);
}
.tok-const {
  color: var(--tok-const);
}
.tok-comment {
  color: var(--tok-comment);
  font-style: italic;
}

/**

/* ------------------------ 접어 두는 덧자료 ------------------------ */

/* 장을 늘리지 않으려고 3·4장 안에 접어 두는 자리.
   닫힌 채로 나오므로 화면 모양은 lesson3_7_1 의 교사용과 같다. */

/* ------------------------------ 인쇄 ------------------------------ */

  }

    box-shadow: none;
  }

    <style data-from="styles/lesson5.css">
/* ------------------------------------------------------------------
 * 이 차시(5차시)에만 있는 모양
 *
 * ★ tokens.css · common.css · student.css 는 앞 차시와 «같게» 두었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 한다.
 *   여기에는 «PIR 센서 때문에 새로 생긴 것» 만 담는다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 11장). 아래 색들은 늘 «글자·아이콘» 과 함께 쓴다.
 * ------------------------------------------------------------------ */

:root {
  /* PIR 모듈 — 초록 기판과 흰 돔 렌즈 */
  --pir-board: #1f6b4a;
  --pir-board-edge: #14532d;
  --pir-dome: #f8fafc;
  --pir-dome-edge: #cbd5e1;
  --pir-facet: #cbd5e1;
  --pir-live: #f59e0b;

  /* 감지 영역 부채꼴 */
  --zone-fill: rgba(37, 99, 235, 0.09);
  --zone-edge: rgba(37, 99, 235, 0.45);

  /**
   * 케이블 «센서 쪽» — 신호 노랑 (명세 6.3)
   *
   * ★ 앞서 #d97706(호박색)을 쓰다가 주황(#ea580c)과 거의 같아 보였다.
   *   범례에는 «노랑» 이라고 적혀 있는데 눈에는 주황으로 보이니 둘을 가릴 수 없었다.
   *   ★ s40-board.js 의 WIRE_COLORS.yellow 와 «같은 값» 이어야 한다.
   */
  --wire-sensor: #eab308;

  /* 적외선 물결 */
  --ir-flat: #94a3b8;
  --ir-change: #dc2626;
}

/* ══════════════════════════════════════════════════════════════════
 * 1. 케이블 «센서 쪽»
 * ══════════════════════════════════════════════════════════════════ */

.wirelegend__dot--yellow {
  background: var(--wire-sensor);
}

.wirelist__dot--yellow {
  background: var(--wire-sensor);
}

.wirelist__side--sensor {
  background: #fef3c7;
  color: #92400e;
}

/* ══════════════════════════════════════════════════════════════════
 * 2. PIR 모듈 그림 (3단계 시뮬레이터 · 설명 그림 공용)
 * ══════════════════════════════════════════════════════════════════ */

.pir__board {
  fill: var(--pir-board);
  stroke: var(--pir-board-edge);
  stroke-width: 1.5;
}

.pir__dome {
  fill: var(--pir-dome);
  stroke: var(--pir-dome-edge);
  stroke-width: 2;
}

.pir__facet {
  stroke: var(--pir-facet);
  stroke-width: 1;
}

/* 감지 중일 때 퍼지는 테두리 — 색만으로 알리지 않으므로 글자와 함께 쓴다 */
.pir__wave {
  fill: none;
  stroke: var(--pir-live);
  stroke-width: 2.5;
  stroke-dasharray: 6 6;
  opacity: 0.9;
}

.pir__pot {
  fill: #e2e8f0;
  stroke: #94a3b8;
  stroke-width: 1.2;
}

.pir__potslot {
  stroke: #475569;

}

.pir__potname {

.pir__name {

}

/* 지금 무엇을 내보내는가 — 오른쪽 위 */
.pir__state {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 800;

}

.part--sensing .pir__state {

}

/* 핀 순서 경고 — 왼쪽 아래 «따로 한 줄» 로 둔다(이름표와 겹치지 않게) */
.pir__warn {
  font-family: var(--font-sans);
  font-size: 11px;

.pin--signal .pin__dot {

}

/* ══════════════════════════════════════════════════════════════════
 * 2-1. ★ 부품 다리 이름표 — «흰 글씨» 를 고친다
 *
 *   student.css 의 .pin__label 은 fill: #ffffff 다. 우노의 «검은 헤더» 위에
 *   적는 이름표라 흰색이 맞다. 그런데 LED·저항·PIR 의 다리 이름표는
 *   .pin__label 과 .pin__label--part 를 «함께» 달고 있고,
 *   student.css 안에서 .pin__label 이 뒤에 오는 바람에 흰색이 이겼다.
 *   → 밝은 회색 받침 위에 흰 글씨라 «VCC» 가 아예 보이지 않았다.
 *
 *   여기(뒤에 읽히는 파일)에서 다시 어둡게 되돌리고, 흰 테두리를 둘러

 * ══════════════════════════════════════════════════════════════════ */

.pin__label--part {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  /* 글자 뒤에 흰 테두리를 깔아 어떤 바탕에서도 읽히게 한다 */

.pin--anode .pin__label--part {

}

/* ══════════════════════════════════════════════════════════════════

  font-size: 13px;
  font-weight: 800;
  fill: var(--color-false-dark);
  text-anchor: middle;
}

.figpulse {
  fill: none;
  stroke: var(--color-text);
  stroke-width: 2.5;
}

.figpulse--do {
  stroke: var(--color-true-dark);
}

.figicon {
  font-size: 22px;
  text-anchor: middle;
}

/* 회로 요약 그림의 상자 */
.figbox {
  fill: var(--color-surface);
  stroke: var(--color-border-strong);
  stroke-width: 1.5;
}

.figbox__text {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
}

.figbox--sensor {
  fill: #ecfdf5;
  stroke: var(--color-true);
}

.figbox--power {
  fill: #fef2f2;
  stroke: var(--color-error);
}

.figbox--in {
  fill: #fef3c7;
  stroke: var(--wire-sensor);
}

.figbox--out {
  fill: #ffedd5;
  stroke: #ea580c;
}

.figbox--code {
  fill: var(--color-primary-soft);
  stroke: var(--color-primary);
}

.figbox--part {
  fill: var(--color-muted-bg);
  stroke: var(--color-border-strong);
}

/* ══════════════════════════════════════════════════════════════════
 * 4. 1단계 — 문제 상황과 예측
 * ══════════════════════════════════════════════════════════════════ */

.storyfig {
  margin-bottom: var(--space-3);
}

.predict {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  background: var(--color-surface);
}

.predict__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-weight: 800;
}

.predict__icon {
  font-size: 22px;
}

.predict__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin: var(--space-1) 0 var(--space-3) 34px;
}

/* 5단계에서 1단계 예측을 되비출 때 */
.predict__before {
  margin-bottom: var(--space-2);
  font-size: 15px;
}

.predict__tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 800;
}

/* ══════════════════════════════════════════════════════════════════
 * 5. 2단계 — 상태 흐름과 오감지 원인
 * ══════════════════════════════════════════════════════════════════ */

.sflow {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.sflow__step {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  border-left-color: var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

/* 안정화 구간은 «판정 대기» 라 다른 색으로 둔다 — 글자에도 적혀 있다 */
.sflow__step--baseline {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}

.sflow__step--low {
  border-left-color: var(--color-text-sub);
}

.sflow__no {
  flex: none;
  font-size: 18px;
  font-weight: 800;
  color: var(--color-primary);
}

.sflow__body {
  flex: 1;
}

.sflow__label {
  font-weight: 800;
}

.sflow__state {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-true-dark);
  font-weight: 700;
}

.sflow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.causes {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cause {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cause__icon {
  flex: none;
  font-size: 24px;
  line-height: 1.2;
}

.cause__body {
  flex: 1;
}

.cause__name {
  font-weight: 800;
}

.cause__why {
  font-size: 15px;
  color: var(--color-text);
}

.cause__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cause__tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--color-true-soft);
  color: var(--color-true-dark);
  font-size: 12px;
  font-weight: 800;
}

/* ══════════════════════════════════════════════════════════════════
 * 6. 5단계 — 감지 영역 자유 탐색
 * ══════════════════════════════════════════════════════════════════ */

.zone {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.zone__canvas {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  overflow-x: auto;
  touch-action: none; /* 드래그가 화면 스크롤로 새지 않게 */
}

.zone__svg {
  display: block;
  width: 100%;
  min-width: 560px;
  height: auto;
}

.zone__field {
  fill: var(--zone-fill);
  stroke: var(--zone-edge);
  stroke-width: 1.5;
  stroke-dasharray: 8 6;
}

.zone__fieldname {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-primary-dark);
  text-anchor: middle;
}

/* 누르는 자리 — 손가락보다 크게(명세 11장 44×44px) */
.zone__hit {
  fill: transparent;
  cursor: grab;
}

.zone__person:focus-visible .zone__hit {
  fill: rgba(37, 99, 235, 0.12);
  stroke: var(--color-primary);
  stroke-width: 2;
}

.zone__person--moving .zone__hit {
  cursor: grabbing;
}

.zone__panel {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-3);
}

.zone__note {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
  min-height: 1.6em;
}

/* 상태 패널 — 여덟 줄을 «한 흐름으로» 보인다 */
.zrows {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-2);
}

.zrow {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--color-muted-bg);
  border-left: 4px solid var(--color-border-strong);
}

.zrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.zrow__value {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  color: var(--color-text);
  text-align: right;
}

/* 센서 → 조건 → 출력 세 무리를 «왼쪽 띠» 로 갈라 보인다 */
.zrow--sensor {
  border-left-color: var(--wire-sensor);
}

.zrow--cond {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.zrow--out {
  border-left-color: #ea580c;
}

/* ══════════════════════════════════════════════════════════════════
 * 7. 5단계 — 실험 결과표
 * ══════════════════════════════════════════════════════════════════ */

.resulttable {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3) var(--space-4);
  background: var(--color-true-soft);
}

.kv {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--space-2) var(--space-4);
  margin: 0;
}

.kv dt {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.kv dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-text);
  overflow-wrap: anywhere;
}

.para--quiet {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ══════════════════════════════════════════════════════════════════
 * 8. 실행 패널 — 센서·조건·출력을 갈라 보인다
 * ══════════════════════════════════════════════════════════════════ */

.runstat--sensor {
  border-left: 4px solid var(--wire-sensor);
  padding-left: var(--space-2);
}

.runstat--cond {
  border-left: 4px solid var(--color-primary);
  padding-left: var(--space-2);
}

.runstat--out {
  border-left: 4px solid #ea580c;
  padding-left: var(--space-2);
}

/* DO 시간표 — 색만으로 알리지 않으므로 칸 안에 HIGH/LOW/대기 를 적는다 */
.ledline__seg--do-high {
  background: var(--color-true);
  color: #fff;
}

.ledline__seg--do-low {
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

.ledline__seg--do-warm {
  background: repeating-linear-gradient(
    45deg,
    var(--color-false-soft),
    var(--color-false-soft) 6px,
    #fde68a 6px,
    #fde68a 12px
  );
  color: var(--color-false-dark);
}

/* ══════════════════════════════════════════════════════════════════
 * 9. 좁은 화면 (360px 세로에서도 가로 스크롤 없이 — 명세 11장)
 * ══════════════════════════════════════════════════════════════════ */

@media (max-width: 767px) {
  .zrows {
    grid-template-columns: 1fr;
  }

  .kv {
    grid-template-columns: 1fr;
    gap: var(--space-1) 0;
  }

  .kv dd {
    margin-bottom: var(--space-2);
  }

  .predict__note {
    margin-left: 0;
  }

  /* 감지 영역 그림만 내부에서 좌우로 밀 수 있게 둔다(본문은 밀리지 않는다) */
  .zone__svg {
    min-width: 520px;
  }
}

/* ══════════════════════════════════════════════════════════════════
 * 10. 교사용 — 이 차시에 새로 생긴 것
 *
 * ★ 명세 9장의 «일곱 탭» 을 쓰면서 «거르기 막대» 와 «예상 인원» 칸이 생겼다.
 *   앞 차시(4장 구성)에는 없던 것이라 여기에 둔다.
 * ══════════════════════════════════════════════════════════════════ */

.t-filter {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.t-filter__field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.t-filter__field--wide {
  flex: 1 1 220px;
}

.t-filter__field .input {
  min-height: var(--touch-min);
}

.t-filter__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.t-filter__count {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.t-inline {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* 실험 결과·정답표의 한 덩어리 */
.t-answer {
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  margin-bottom: var(--space-2);
  background: var(--color-surface);
}

.t-answer__head {
  font-weight: 800;
  color: var(--color-text);
}

.t-answer__line {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-true-dark);
  overflow-wrap: anywhere;
}

.t-answer__why {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

/* 표 안의 기계값(DO·시리얼)은 고정폭으로 — 눈으로 맞대어 보기 쉽게 */
.cell--mono {
  font-family: var(--font-mono);
  font-size: 13px;
  white-space: nowrap;
}

@media (max-width: 767px) {
  .t-filter__foot {
    margin-left: 0;
    width: 100%;
  }

  .t-filter__field {
    flex: 1 1 140px;
  }

  .cell--mono {
    white-space: normal;
  }
}

/* 자동 새로고침 줄 (명세 9장) — 기본은 꺼짐이다 */
.t-auto {
  flex-wrap: wrap;
  gap: var(--space-3);
}

.t-auto__note {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-primary-dark);
}


/* ══════════════════════════════════════════════════════════════════
 * 11. 붙어 버린 블록 떼어 놓기
 *
 * ★ 1단계 hero 안에 «카드» 를 넣은 것은 이 차시가 처음이다(문제 상황·예측·확인 질문).
 *   .card 는 common.css 에서 «아래 여백» 만 갖고 있어서, 위 블록(학습 순서)과
 *   그대로 맞붙어 버렸다. hero 안에서만 위 여백을 준다.
 *   (이웃한 세로 여백은 서로 겹쳐지므로 카드끼리는 여전히 24px 이다)
 * ══════════════════════════════════════════════════════════════════ */

.hero > .card {
  margin-top: var(--space-5);
}

/* [학습 시작] 아래의 «아직 못 한 일» — 가운데 정렬 글머리표는 읽기 어렵다.
   왼쪽으로 맞추고 안내 상자처럼 보이게 한다. */
.hero__gate {
  margin-top: var(--space-3);
  text-align: left;
}

/* ── 접어 둔 선택 활동 상자 ────────────────────────────────────────
 * <details> 를 그대로 두면 테두리도 여백도 없어 두 개가 나란히 놓일 때
 * 한 덩어리처럼 붙어 보인다. 5·6단계에 접기 상자가 둘씩 있어서 눈에 띈다.
 * ------------------------------------------------------------------ */

.foldout {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  margin-bottom: var(--space-4);
  overflow: hidden;
}

.foldout + .foldout {
  margin-top: var(--space-4);
}

.foldout__sum {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-3) var(--space-4);
  font-weight: 700;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  cursor: pointer;
  list-style: none;
}

/* 크롬·사파리의 기본 삼각형을 지우고 우리 것으로 바꾼다 */
.foldout__sum::-webkit-details-marker {
  display: none;
}

.foldout__sum::before {
  content: "＋";
  font-weight: 800;
  flex: none;
}

.foldout[open] > .foldout__sum::before {
  content: "－";
}

.foldout__sum:hover {
  background: #e0ecff;
}

.foldout__sum:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: -3px;
}

.foldout__body {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.foldout__body:empty {
  padding: 0;
}

/* ------------------------------------------------------------------ */
/* 케이블 한 줄만 지우기 (3단계)                                        */
/*                                                                     */
/* 그림 위의 케이블을 «한 번 누르면» 그 줄만 지워진다.                    */
/* 되돌리기(맨 끝 하나) · 초기화(모두) 사이의 셋째 길이다.               */
/* ------------------------------------------------------------------ */

/* 넓은 투명 길 — 손가락으로 눌러도 빗나가지 않게.
   ★ 케이블의 «가운데» 만 덮는다(s40-board.js midSegment).
      끝까지 덮으면 단자를 가려 그 자리에서 새 선을 뽑을 수 없다. */
.wirehit__area {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  stroke-linecap: round;
  cursor: pointer;
}

/* 한가운데 점 — 아주 짧은 케이블에도 «누를 자리» 를 남긴다 */
.wirehit__spot {
  fill: transparent;
  cursor: pointer;
}

/* 갖다 대거나 초점이 가면 그 줄만 도드라진다 */
.wirehit:hover .wire,
.wirehit:focus .wire {
  opacity: 1;
  stroke-width: 7;
}

.wirehit:focus {
  outline: none;
}

.wirehit:focus .wirehit__xbg {
  stroke-width: 3;
}

/* ✕ 표 — 평소에는 숨어 있다.
   색이 아니라 «모양» 으로 알린다(명세 11장 — 색만으로 알리지 않는다). */
.wirehit__x {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease-out;
}

.wirehit:hover .wirehit__x,
.wirehit:focus .wirehit__x {
  opacity: 1;
}

.wirehit__xbg {
  fill: #ffffff;
  stroke: var(--color-error);
  stroke-width: 2;
}

.wirehit__xtext {
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-error);
  text-anchor: middle;
  pointer-events: none;
}

/* ------------------------------------------------------------------ */
/* [정답 확인] 표 (3단계)                                               */
/*                                                                     */
/* 접어 둔 「이렇게 이으면 됩니다」 는 «어디까지 했는가» 를 보이고,        */
/* 이 표는 «무엇을 이어야 하는가» 를 두 칸으로 늘어놓는다.               */
/* ------------------------------------------------------------------ */

.answer {
  margin-top: var(--space-4);
}

.answer__table {
  width: 100%;
  border-collapse: collapse;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.answer__table th,
.answer__table td {
  padding: var(--space-3) var(--space-4);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
}

.answer__table tr:last-child th,
.answer__table tr:last-child td {
  border-bottom: 0;
}

.answer__table thead th {
  background: var(--color-bg);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* 번호 칸 — 좁게 두어 «한쪽 / 다른쪽» 두 칸이 넓게 쓰인다 */
.answer__no {
  width: 3rem;
  font-weight: 400;
  color: var(--color-text-sub);
}

/* 이미 이은 줄은 옅게 — «남은 것» 이 눈에 먼저 들어온다.
   ★ 색만으로 알리지 않으려고 왼쪽에 띠를 함께 둔다. */
.answer__table tr.is-done td,
.answer__table tr.is-done th {
  color: var(--color-text-sub);
}

.answer__table tr.is-done .answer__no {
  border-left: 3px solid var(--color-true);
}

.answer__note {
  margin: var(--space-3) 0 0;
  font-size: 0.9375rem;
  color: var(--color-text-sub);
  line-height: 1.6;
}

/* ------------------------------------------------------------------ */
/* 4단계 코드 조립 — 끌어 놓기 (4차시까지는 ▲▼ 단추만 있었다)            */
/*                                                                     */
/* ★ 놓일 자리를 «빈 칸» 으로 보여 준다.                                 */
/*   가는 선 하나만 그리면 어디에 끼어드는지 가늠하기 어렵다.            */
/*   실제로 그 줄이 들어갈 만큼 목록이 «벌어지는» 것이 가장 분명하다.     */
/* ------------------------------------------------------------------ */

.assemble__grip {
  color: var(--tok-comment);
  font-size: 1.1rem;
  line-height: 1;
  padding: 0 var(--space-1);
  cursor: grab;
  /* 손가락 끌기가 화면 넘기기로 새지 않게 — 손잡이에만 준다 */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.assemble__grip:active {
  cursor: grabbing;
}

.assemble__item {
  cursor: grab;
}

/* 단추 위에서는 «끄는 손» 이 아니라 «누르는 손» 이어야 한다 */
.assemble__btns .btn {
  cursor: pointer;
}

/* 끄는 동안에는 글자가 잡히지 않게 */
.assemble.is-dragging {
  user-select: none;
  -webkit-user-select: none;
}

/* 들어 올린 줄 — 떠 있는 것이 보여야 한다 */
.assemble__item.is-dragging {
  z-index: 40;
  cursor: grabbing;
  border-color: var(--color-primary);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
  opacity: 0.97;
}

/* ★ 놓일 자리 */
.assemble__slot {
  list-style: none;
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius);
  background: rgba(37, 99, 235, 0.1);
  box-sizing: border-box;
}


/* ------------------------------------------------------------------ */
/* 5단계 확장 탐구 — 의사코드를 적은 뒤 열리는 «완성 코드 두 칸»          */
/* ------------------------------------------------------------------ */

.reveal {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}

.reveal[hidden],
.reveal__lock[hidden] {
  display: none;
}

.reveal__lock {
  margin-top: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.reveal__code {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3);
  overflow-x: auto;
}

.reveal__row {
  display: flex;
  align-items: center;
  gap: 0;
  min-height: 1.7em;
  /* 빈칸이 넓어져도 줄이 접히지 않게 — 넘치면 .reveal__code 가 밀린다 */
  white-space: nowrap;
}

.reveal__fixed {
  /* 코드 글자도 줄어들면 안 된다 — 줄어들면 «lastSeen = » 이 잘린다 */
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  color: var(--color-console-text);
}

/* 빈칸 — 코드 줄 «안» 에 놓이므로 줄 높이를 넘지 않게.
   ★ width 는 여기서 정하지 «않는다». 힌트 길이를 보고 s60-screens.js 가 넣는다
      (한글 힌트는 고정폭으로 두면 잘린다). 넘치면 .reveal__code 가 좌우로 밀린다. */
.reveal__input {
  /* ★ 좁은 화면에서 flex 가 칸을 «찌그러뜨리지» 못하게 막는다.
     막지 않으면 390px 화면에서 폭이 167px 로 줄어 힌트가 다시 잘린다.
     넘치는 만큼은 .reveal__code 가 좌우로 밀어 보여 준다. */
  flex: 0 0 auto;
  margin: 2px var(--space-1);
  padding: 2px var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  background: #ffffff;
  border: 2px solid var(--color-primary);
  border-radius: 4px;
}

.reveal__input.is-ok {
  border-color: var(--color-true);
  background: rgba(5, 150, 105, 0.08);
}

.reveal__input.is-off {
  border-color: var(--color-false);
}

.reveal__mark {
  margin-left: var(--space-2);
  font-weight: 800;
  color: var(--color-text-sub);
}

.reveal__mark.is-ok {
  color: var(--color-true);
}

/* 맞힌 뒤에만 나오는 «왜» 한 줄 */
.reveal__why:empty {
  display: none;
}

.reveal__why {
  margin: var(--space-1) 0 var(--space-2) var(--space-4);
  font-size: var(--fs-small);
  color: var(--color-true);
}

/* ------------------------------------------------------------------ */
/* 5단계 «이 실험을 마치려면» 목록                                       */
/*                                                                     */
/* 「끝내면 열립니다」 만으로는 무엇을 해야 하는지 알 수 없다.            */
/* 네 가지를 한 줄씩 적고, 지금 어디까지 했는지 그대로 보여 준다.        */
/* ------------------------------------------------------------------ */

.steplist {
  margin: var(--space-4) 0;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.steplist .subhead {
  margin-top: 0;
}

.steplist__sum {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  line-height: 1.6;
}

/* ------------------------------------------------------------------ */
/* 5단계 확장 탐구 — 눈에 띄는 카드 (통과 조건)                          */
/*                                                                     */
/* 전에는 접기 상자였다. 접혀 있으면 «해도 되고 말아도 되는 것» 으로       */
/* 보인다. 통과 조건으로 올렸으므로 펼쳐 두고 테두리로 도드라지게 한다.    */
/* ------------------------------------------------------------------ */

.ext {
  margin: var(--space-6) 0 var(--space-4);
  border: 2px solid var(--color-primary-dark);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.ext__head {
  padding: var(--space-4);
  /* ★ 진한 쪽을 쓴다. 흰 글자를 얹으므로 밝은 파랑에서는 작은 글씨의
     대비가 4.5:1 에 못 미친다. */
  background: var(--color-primary-dark);
  color: #ffffff;
}

.ext__badge {
  display: inline-block;
  padding: 2px var(--space-3);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.22);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0.01em;
}

.ext__title {
  margin: var(--space-2) 0 0;
  font-size: 1.15rem;
  font-weight: 800;
  color: #ffffff;
}

.ext__must {
  margin: var(--space-1) 0 0;
  font-size: var(--fs-small);
  /* 파란 바탕 위이므로 흰색에 가깝게 — 회색 글자는 읽히지 않는다 */
  color: #ffffff;
}

.ext__body {
  padding: var(--space-4);
}

/* 다 적으면 초록으로 바뀐다 — «끝났다» 를 색과 «글자» 로 함께 알린다 */
.ext--done {
  border-color: var(--color-true-dark);
}

.ext--done .ext__head {
  /* 같은 까닭으로 진한 초록 */
  background: var(--color-true-dark);
}

/* 빈칸에 «붙은» [답 보기] 단추 — 막힌 학생이 답을 확인하는 자리 */
.reveal__peek {
  flex: 0 0 auto;
  margin-left: var(--space-2);
  white-space: nowrap;
}

.reveal__peek:disabled {
  opacity: 0.75;
}

/* 답을 «본» 칸 — 맞힌 칸(초록)과 다르게 적는다 */
.reveal__input.is-seen {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.reveal__mark.is-seen {
  color: var(--color-false-dark);
  font-size: var(--fs-small);
}

    <script data-from="shared/config.js">
/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 10장)
 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 10장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 (명세 5장) ─────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다.
         physical5-v1:draft · :endpoint · :pending · :student */
    autosaveKeyPrefix: "physical5-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 (0 = 기다리지 않고 끝난 모습만)
                    빨리 감기는 없다 — 이 차시는 «안정화 → 감지 → 유지» 를 보는 것이 목적이다 */
    loopLimit: 12,
    stepLimit: 20000,
    playSpeeds: [1, 0.5, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;
    return /^https?:\/\/.+/i.test(url);
  }

  /** 설정 파일에 미리 적어 둔 주소 (없으면 빈 문자열) */
  function fixedUrl() {
    return looksLikeUrl(APP_CONFIG.apiUrl) ? String(APP_CONFIG.apiUrl).trim() : "";
  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

  /** 학생 화면에 «제출 주소» 칸을 보여야 하는가? */
  function needsUrlInput() {
    return !isDemo() && !fixedUrl();
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.CONFIG = APP_CONFIG;
  PC.config = {
    looksLikeUrl: looksLikeUrl,
    fixedUrl: fixedUrl,
    isDemo: isDemo,
    needsUrlInput: needsUrlInput
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { APP_CONFIG: APP_CONFIG, isDemo: isDemo, fixedUrl: fixedUrl };
  }
})();

  /* 필수 실험 셋 : ① 영역 안 움직임 ② 영역 안 정지 ③ 영역 밖 움직임         */

  /**

  var EXPERIMENTS = [

      ask: "사람은 그대로 있는데 움직임만 멈추면 DO 는 어떻게 될까요?",
      predictId: "p-still",
      events: [
        { at: 0, inZone: false, moving: false },

        { at: SENSOR.warmupMs + 2500, inZone: true, moving: false }
      ],

        "★ 멈춘 «즉시» LOW 가 되지 않는다. 모듈의 출력 유지 시간이 지난 뒤에 내려간다. " +

  /** 상태 패널에 «한 흐름으로» 보일 항목 (명세 6.5 두 번째 줄) */
  var STATE_ROWS = [

  /**

   */
  var EXTENSION = {
    title: "확장 탐구 — «마지막 감지 후 일정 시간 켜 두기» 규칙 만들기",

      "LED 는 센서의 DO 를 그대로 따라갈 뿐입니다. 실제 센서등이 «한참 뒤에» 꺼지는 것은 " +

  var EXTENSION_REVEAL = {

  /**

    return [spec.answer].concat(spec.also || []).some(function (ok) {

  /** 두 칸을 채운 코드 글 — 채우지 않은 칸은 힌트를 남겨 둔다 */
  function revealSource(values) {

    return EXTENSION_REVEAL.lines
      .map(function (line) {

  /* 화면 6 — 학습 정리 (명세 5장 6단계)                                    */

  var WRAP_UP = [

  ];

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});

    <script data-from="shared/circuit.js">

 * 회로 결선 엔진 (명세 6.3 · 10장 · 13장)
 *

 *
 * 전기적 «마디(node)» 로 생각한다
 *   · 우노의 GND 세 개는 보드 안에서 이미 이어져 있다  → 모두 같은 마디 "uno:GND"
 *   · 브레드보드의 + 레일은 가로로 길게 이어져 있다      → 레일 전체가 마디 하나
 *   · 브레드보드 같은 열의 다섯 구멍은 이어져 있다        → 열 하나가 마디 하나
 *     (가운데 홈을 사이에 두고 A~E 와 F~J 는 «끊겨» 있다)
 *
 * ★ «소자(device)» — 케이블과 다르다

 *   두 마디 사이에 «걸쳐» 있을 뿐이다. 그래서 D8 → GND 로 가는 길을 찾을 때
 *   소자를 «건너는» 것으로 센다.
 *
 *   그 덕분에
 *     · 저항이 LED 앞이든 뒤든 직렬이면 모두 정답이다
 *     · 어느 구멍에 꽂아도 같은 마디면 같은 연결이다
 *     · 역극성·무저항·GND 누락·양다리 단락을 «서로 다른 원인» 으로 구분한다
 *
 * ★★ 이 차시(5차시)에서 새로 생긴 것 — «PIR 모듈»
 *   회로가 두 갈래다. 하나는 «센서를 살리는 3선», 하나는 «LED 를 켜는 2선» 이다.
 *

 *     GND → PIR GND        접지
 *     D7  → PIR DO(OUT)    센서의 디지털 출력을 우노가 «읽는다»

 *

    if (componentId === "led" || componentId === "res" || componentId === "pir") {
      return componentId + ":" + pin.id;
    }
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);
    if (node === "led:A") return "LED 긴 다리 A(+)";
    if (node === "led:K") return "LED 짧은 다리 K(−)";
    if (node === "pir:VCC") return "PIR VCC";
    if (node === "pir:DO") return "PIR OUT(DO)";
    if (node === "pir:GND") return "PIR GND";

    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {

      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
