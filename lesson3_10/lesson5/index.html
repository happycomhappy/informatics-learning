  /* ================================================================== */

  /** 카드 id → 그림. 없는 카드는 글만 둔다. */
  /* ================================================================== */
  /* 5. ★ 이 차시의 그림 — PIR 인체감지센서                                */
  /*                                                                    */
  /* 사진을 베끼지 않고 자체 SVG 로 그린다(명세 11장).                       */
  /* 색만으로 뜻을 전하지 않도록 그림 안에도 «글자» 를 함께 적는다.           */
  /*                                                                    */
  /* ★★ 자리 잡기의 규칙 — 이것을 어기면 글자가 겹치거나 틀 밖으로 나간다     */
  /*                                                                    */
  /*   fig__title · fig__note · fig__state 는 CSS 에서 «가운데 정렬» 이다.  */
  /*   그래서 x 에 «왼쪽 끝» 을 주면 글이 왼쪽으로 삐져나간다.               */
  /*                                                                    */
  /*     가운데 정렬 : x 에 «칸의 한가운데» 를 준다                          */
  /*     왼쪽 정렬   : --left 를 붙이고 x 에 «왼쪽 끝» 을 준다               */
  /*                                                                    */
  /*   배지는 반드시 badgeTitle · badgeNote 로 «글과 한 덩어리» 로 놓는다.    */
  /*   따로 놓으면 글 위에 얹혀 글자를 가린다(실제로 그런 적이 있다).         */
  /* ================================================================== */

  var SENSOR = PC.SENSOR || { warmupMs: 6000, holdMs: 3000 };

  function secText(ms) {
    return Math.round(ms / 100) / 10 + "초";
  }

  /** 배지 + 왼쪽 정렬 제목을 «한 덩어리» 로 놓는다 */
  function badgeTitle(g, no, x, y, text) {
    g.appendChild(badge(no, x, y));
    g.appendChild(
      UI.svg("text", { x: x + 18, y: y + 5, class: "fig__title fig__title--left" }, [txt(text)])
    );
  }

  /** 배지 + 왼쪽 정렬 설명을 «한 덩어리» 로 놓는다 */
  function badgeNote(g, no, x, y, text) {
    g.appendChild(badge(no, x, y));
    g.appendChild(
      UI.svg("text", { x: x + 18, y: y + 5, class: "fig__note fig__note--left" }, [txt(text)])

  /** 흰 바탕 칸 하나 */
  function panelRect(g, x, y, w, h) {
    g.appendChild(UI.svg("rect", { x: x, y: y, width: w, height: h, rx: 10, class: "fig__panel" }));
  }

  /** 칸 한가운데에 상태 한 줄 */
  function stateText(g, cx, y, text) {
    g.appendChild(UI.svg("text", { x: cx, y: y, class: "fig__state" }, [txt(text)]));
  }

  /** 사람 아이콘 — 머리와 몸통. moving 이면 팔다리를 벌린 꼴로 그린다. */
  function personIcon(g, x, y, opts) {
    var o = opts || {};
    var cls = "figp" + (o.moving ? " figp--moving" : "");
    var wrap = UI.svg("g", { class: cls });
    wrap.appendChild(UI.svg("circle", { cx: x, cy: y - 30, r: 11, class: "figp__head" }));
    wrap.appendChild(UI.svg("line", { x1: x, y1: y - 19, x2: x, y2: y + 6, class: "figp__body" }));
    if (o.moving) {
      /* 걷는 꼴 — 팔다리를 벌린다 */
      wrap.appendChild(UI.svg("line", { x1: x, y1: y - 12, x2: x - 14, y2: y - 2, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y - 12, x2: x + 15, y2: y - 6, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y + 6, x2: x - 13, y2: y + 26, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y + 6, x2: x + 14, y2: y + 26, class: "figp__limb" }));
    } else {
      /* 선 꼴 — 팔다리를 모은다 */
      wrap.appendChild(UI.svg("line", { x1: x, y1: y - 12, x2: x - 8, y2: y + 4, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y - 12, x2: x + 8, y2: y + 4, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y + 6, x2: x - 5, y2: y + 26, class: "figp__limb" }));
      wrap.appendChild(UI.svg("line", { x1: x, y1: y + 6, x2: x + 5, y2: y + 26, class: "figp__limb" }));
    }
    if (o.label) {
      wrap.appendChild(UI.svg("text", { x: x, y: y + 44, class: "fig__note" }, [txt(o.label)]));
    }
    g.appendChild(wrap);
    return wrap;
  }

  /** 적외선 물결 — 왼쪽에서 오른쪽으로 가는 곡선 세 줄 */
  function irWaves(g, x, y, len, cls) {
    for (var i = 0; i < 3; i += 1) {
      var dy = (i - 1) * 16;
      g.appendChild(
        UI.svg("path", {
          d:
            "M " + x + " " + (y + dy) +
            " q " + len / 4 + " -8 " + len / 2 + " 0" +
            " q " + len / 4 + " 8 " + len / 2 + " 0",
          class: "figir" + (cls ? " " + cls : "")
        })
      );
    }
  }

  /**
   * 작은 PIR 모듈 그림 (설명용 — 누를 수 없다)
   * 차지하는 자리 : x .. x+74,  y .. y+78 (다리 끝까지)
   */
  function smallPir(g, x, y, opts) {
    var o = opts || {};
    var wrap = UI.svg("g", { class: "figpir" + (o.high ? " figpir--high" : "") });
    wrap.appendChild(UI.svg("rect", { x: x, y: y, width: 74, height: 62, rx: 6, class: "pir__board" }));
    wrap.appendChild(UI.svg("circle", { cx: x + 37, cy: y + 28, r: 22, class: "pir__dome" }));
    [-12, -4, 4, 12].forEach(function (dx) {
      wrap.appendChild(
        UI.svg("line", {
          x1: x + 37 + dx, y1: y + 10, x2: x + 37 + dx, y2: y + 46, class: "pir__facet"
        })
      );
    });
    /* 세 다리 */
    [22, 37, 52].forEach(function (dx) {
      wrap.appendChild(
        UI.svg("line", { x1: x + dx, y1: y + 62, x2: x + dx, y2: y + 78, class: "part__lead" })
      );
    });
    g.appendChild(wrap);
    return wrap;
  }

  /** ① 적외선은 «양» 이 아니라 «변화» 다 */
  function pirInfraredFigure() {
    return figure({
      viewBox: "0 0 660 300",

      items: [
        { text: "분포가 그대로일 때 — 사람이 있어도 움직이지 않으면 여기에 든다. DO 는 LOW." },
        { text: "분포가 달라질 때 — 사람이 감지 구역을 가로지르면 DO 가 HIGH 가 된다." },
        { text: "온도가 있는 것은 모두 적외선을 내보낸다. 센서는 스스로 내보내지 않고 «받기만» 한다." },
        { text: "그래서 사람이 아닌 것이 감지되기도 하고, 사람이 있어도 감지되지 않기도 한다." }
      ],

        stateText(g, 169, 200, "DO LOW — 변화 없음");

        /* ── 오른쪽 : 분포가 달라질 때 ── */
        badgeTitle(g, 2, 352, 26, "분포가 달라질 때");
        panelRect(g, 336, 44, 310, 168);
        smallPir(g, 358, 84, { high: true });
        irWaves(g, 448, 116, 92, "figir--change");
        personIcon(g, 580, 128, { moving: true, label: "걷는 중" });
        stateText(g, 491, 200, "DO HIGH — 변화 있음");

        /* ── 아래 설명 두 줄 ── */

        badgeNote(g, 4, 26, 272, "그래서 사람이 아닌 것이 감지되기도, 사람이 있어도 감지되지 않기도 한다.");
      }
    });
  }

  /**
   * ② 프레넬 렌즈 — «사람이 여러 감지 구역을 옆으로 통과한다» 를 보이게
   *
   * ★ 이 그림이 노리는 것은 하나다.
   *   「사람이 센서 앞을 옆으로 지나가면 감지 구역을 하나씩 통과한다」
   *   그것을 «보이게» 하려고 다음 네 가지를 지켰다.
   *
   *   ① 센서를 «위에» 달았다 — 현관·복도의 실제 설치 모습이다.
   *      그래야 사람이 바닥을 «왼쪽에서 오른쪽으로» 걷는 것이 그대로 보인다.
   *   ② 구역을 «두 가지 색으로 번갈아» 칠했다. 같은 색이면 «여러 구역» 이 보이지 않는다.
   *      이웃한 구역이 A 와 B 에 번갈아 모이는 것이 실제 렌즈가 하는 일이다.
   *   ③ 사람을 «세 자리» 에 놓고 걷는 화살표를 얹었다. 둘만 놓으면 순간이동처럼 보인다.
   *   ④ 아래 신호 그림의 가로 자리를 «구역과 똑같이» 맞추었다.
   *      그래서 «구역을 지날 때마다 A·B 가 번갈아 뛴다» 가 눈으로 이어진다.
   */
  function pirFresnelFigure() {
    /* 감지 구역이 바닥에 닿는 자리 — 그림과 신호가 «같은 값» 을 본다 */
    var FLOOR_Y = 310;
    var APEX = { x: 150, y: 114 };
    var ZONES = [
      { from: 168, to: 212, on: "A" },
      { from: 232, to: 286, on: "B" },
      { from: 306, to: 368, on: "A" },
      { from: 388, to: 458, on: "B" },
      { from: 478, to: 556, on: "A" },
      { from: 576, to: 644, on: "B" }
    ];

    /** 그 구역의 한가운데 */
    function mid(z) {
      return (z.from + z.to) / 2;
    }

    return figure({
      viewBox: "0 0 660 450",
      caption: "사람이 센서 앞의 여러 감지 구역을 옆으로 통과한다",
      items: [
        { text: "흰 돔이 프레넬 렌즈다. 넓은 영역을 여러 구역으로 나눈다." },
        { text: "안쪽에는 감지 소자가 «둘»(A·B) 있다. 하나가 아니라 둘인 것이 핵심이다." },
        { text: "렌즈가 나눈 감지 구역. 이웃한 구역은 A 와 B 에 «번갈아» 모인다." },
        { text: "사람이 센서 앞을 «옆으로» 지나가면 구역을 하나씩 통과한다." },
        { text: "그때마다 A 와 B 가 번갈아 반응한다. 이 «신호 차이의 변화» 가 곧 움직임이다." }
      ],
      build: function (g) {
        /* ── ① 감지 구역 — 두 색으로 «번갈아» 칠한다 ── */
        ZONES.forEach(function (z) {
          g.appendChild(
            UI.svg("path", {
              d:
                "M " + APEX.x + " " + APEX.y +
                " L " + z.from + " " + FLOOR_Y +
                " L " + z.to + " " + FLOOR_Y + " Z",
              class: "figzone figzone--" + z.on.toLowerCase()
            })
          );
        });

        /* ── ② 천장에 달린 센서 ── */
        g.appendChild(UI.svg("rect", { x: 116, y: 42, width: 68, height: 12, rx: 3, class: "figmount" }));
        g.appendChild(UI.svg("circle", { cx: 150, cy: 84, r: 30, class: "pir__dome" }));
        [-18, -6, 6, 18].forEach(function (dx) {
          g.appendChild(
            UI.svg("line", { x1: 150 + dx, y1: 60, x2: 150 + dx, y2: 108, class: "pir__facet" })
          );
        });
        /* 안쪽 감지 소자 둘 */
        g.appendChild(UI.svg("rect", { x: 133, y: 76, width: 15, height: 17, rx: 3, class: "figcell" }));
        g.appendChild(UI.svg("rect", { x: 152, y: 76, width: 15, height: 17, rx: 3, class: "figcell" }));
        g.appendChild(UI.svg("text", { x: 140, y: 89, class: "figcell__name" }, [txt("A")]));
        g.appendChild(UI.svg("text", { x: 159, y: 89, class: "figcell__name" }, [txt("B")]));

        badgeTitle(g, 1, 26, 22, "프레넬 렌즈 (흰 돔)");
        badgeTitle(g, 2, 26, 152, "감지 소자 A·B");
        leader(66, 152, 142, 96);
        badgeTitle(g, 3, 330, 22, "렌즈가 나눈 감지 구역 — A·B 가 번갈아");

        /* ── ③ 바닥 ── */
        g.appendChild(UI.svg("line", { x1: 30, y1: FLOOR_Y, x2: 646, y2: FLOOR_Y, class: "figfloor" }));

        /* 구역마다 «어느 소자로 가는가» 를 글자로 (색만으로 알리지 않는다) */
        ZONES.forEach(function (z) {
          var cx = mid(z);
          g.appendChild(
            UI.svg("rect", {
              x: cx - 11, y: 319, width: 22, height: 18, rx: 5,
              class: "figchip figchip--" + z.on.toLowerCase()
            })
          );
          g.appendChild(UI.svg("text", { x: cx, y: 332, class: "figchip__text" }, [txt(z.on)]));
        });

        /* ── ④ 사람이 세 구역을 차례로 지나간다 ── */
        [0, 1, 2].forEach(function (i) {
          personIcon(g, mid(ZONES[i]), FLOOR_Y - 26, { moving: true });
        });

        /* 걷는 방향 — 사람들 머리 위로 지나가는 화살표 */
        var from = mid(ZONES[0]) - 18;
        var to = mid(ZONES[2]) + 18;
        g.appendChild(
          UI.svg("path", {
            d: "M " + from + " 232 Q " + (from + to) / 2 + " 210 " + to + " 232",
            class: "figarrow"
          })
        );
        g.appendChild(
          UI.svg("path", {
            d: "M " + (to - 12) + " 224 L " + to + " 232 L " + (to - 13) + " 240",
            class: "figarrow"
          })
        );
        badgeTitle(g, 4, 398, 222, "옆으로 지나간다");

        /* ── ⑤ 그때 A·B 가 번갈아 반응한다 ──
           가로 자리를 위 구역과 «똑같이» 맞춘다. 그래야 눈으로 이어진다. */
        badgeTitle(g, 5, 26, 362, "A 와 B 가 번갈아 반응한다");

        function wave(letter, baseY) {
          var d = "M 60 " + baseY;
          ZONES.forEach(function (z) {
            if (z.on !== letter) return;
            d += " L " + z.from + " " + baseY + " L " + z.from + " " + (baseY - 18) +
                 " L " + z.to + " " + (baseY - 18) + " L " + z.to + " " + baseY;
          });
          d += " L 646 " + baseY;
          g.appendChild(UI.svg("path", { d: d, class: "figgraph figgraph--" + letter.toLowerCase() }));
          g.appendChild(UI.svg("text", { x: 44, y: baseY + 4, class: "figrow__name" }, [txt(letter)]));

  /**

    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, [no, lineNode(line)]);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 (① 코드 조립)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 흩어진 줄을 바른 차례로 만든다.
   *
   * 옮기는 길이 둘이다. 둘 다 «같은 자리»(reorder) 로 모인다.
   *
   *   ① 끌어 놓기  — 줄을 집어 원하는 자리에 떨어뜨린다
   *   ② ▲ ▼ 단추   — 키보드와 보조기기에서 쓰는 길 (명세 13장)
   *
   * ★ HTML5 draggable 을 쓰지 않고 «포인터 이벤트» 로 만들었다.
   *   draggable 은 손가락(터치)에서 아예 동작하지 않는다. 교실 태블릿에서
   *   끌 수 없는 기능이 되어 버린다. pointerdown/move/up 은 마우스·손가락·펜이
   *   모두 같은 길로 들어온다.
   *
   * ★ 손가락으로는 «손잡이(⠿)» 에서만 끌기가 시작된다.
   *   줄 아무 데나 끌리게 하면 화면을 위아래로 넘길 수 없다.
   *   마우스는 그런 문제가 없으므로 줄 아무 데서나 끌 수 있다.
   */
  function assembler(order, onChange) {
    var lines = A.ASSEMBLE_LINES;
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */
    var current = (order && order.length === lines.length ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });

    /** 지금 차례를 코드 글로 — 들여쓰기는 정답 줄에 적힌 대로 넣어 준다 */
    function sourceOf() {
      return current
        .map(function (id) {
          var line = byId[id];
          return "  ".repeat(line.indent) + line.text;
        })
        .join("\n");
    }

    /**
     * 한 줄을 다른 자리로 옮긴다 — 끌어 놓기와 ▲▼ 단추가 «함께» 쓰는 한 곳.
     * 두 길이 저마다 배열을 만지면 한쪽만 고쳤을 때 서로 다르게 움직인다.
     */
    function reorder(from, to) {
      if (to < 0 || to >= current.length || from === to) return false;
      var id = current[from];
      current.splice(from, 1);
      current.splice(to, 0, id);
      draw();
      if (onChange) onChange(current.slice(), sourceOf());
      UI.announce(from + 1 + "번째 줄을 " + (to + 1) + "번째로 옮겼습니다.");
      return true;
    }

    function move(index, delta) {
      var next = index + delta;
      if (!reorder(index, next)) return;
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;
      if (btn) btn.focus();
    }

    /* ------------------------------------------------------------------ */
    /* 끌어 놓기                                                            */
    /* ------------------------------------------------------------------ */

    var drag = null;
    /** 이만큼 움직여야 «끄는 것» 으로 본다 — 그냥 누른 것과 가른다 */
    var THRESHOLD = 4;

    function items() {
      return [].slice.call(listHost.querySelectorAll(".assemble__item"));
    }

    /** 끌던 중에 Esc 를 누르면 되돌린다. 끄는 동안에만 달아 둔다(늘 달아 두면 쌓인다). */
    function onKey(evt) {
      if (evt.key === "Escape") endDrag(false);
    }

    /**
     * 줄을 «들어 올린다».
     *
     * 들어 올린 줄은 position:fixed 라 흐름에서 빠진다. 그 자리에 같은 높이의
     * «빈 칸(slot)» 을 넣어 목록이 덜컥 줄어들지 않게 한다.
     * 이 빈 칸이 곧 «여기에 놓입니다» 표시다 — 따로 선을 그리지 않는다.
     */
    function lift() {
      var d = drag;
      d.lifted = true;

      var slot = UI.el("li", { class: "assemble__slot", attrs: { "aria-hidden": "true" } });
      slot.style.height = d.rect.height + "px";
      listHost.insertBefore(slot, d.item);
      d.slot = slot;

      d.item.classList.add("is-dragging");
      d.item.style.position = "fixed";
      d.item.style.left = d.rect.left + "px";
      d.item.style.top = d.rect.top + "px";
      d.item.style.width = d.rect.width + "px";
      d.item.style.margin = "0";
      listHost.classList.add("is-dragging");

      window.addEventListener("keydown", onKey);
      UI.announce("줄을 들었습니다. 놓을 자리로 옮기세요. Esc 를 누르면 제자리로 돌아갑니다.");
    }

    /** 지금 포인터가 있는 곳을 보고 빈 칸을 그 자리로 옮긴다 */
    function follow(evt) {
      var d = drag;
      d.item.style.top = d.rect.top + (evt.clientY - d.startY) + "px";

      /* 놓일 자리 — «끌고 있는 줄» 은 빼고 본다 */
      var before = null;
      var others = items().filter(function (n) {
        return n !== d.item;
      });
      for (var i = 0; i < others.length; i += 1) {
        var r = others[i].getBoundingClientRect();
        if (evt.clientY < r.top + r.height / 2) {
          before = others[i];
          break;
        }
      }
      if (before) listHost.insertBefore(d.slot, before);
      else listHost.appendChild(d.slot);

      /* 목록이 길어 화면 밖으로 나가면 따라 내려간다 */
      var pad = 64;
      if (evt.clientY < pad) window.scrollBy(0, -14);
      else if (evt.clientY > window.innerHeight - pad) window.scrollBy(0, 14);
    }

    function endDrag(keep) {
      var d = drag;
      if (!d) return;
      drag = null;

      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onCancel);
      if (!d.lifted) return; /* 그냥 눌렀다 뗀 것 */

      window.removeEventListener("keydown", onKey);

      /* 빈 칸이 몇 번째인가 = 놓일 자리. «끌던 줄을 뺀» 목록에서 센다. */
      var target = -1;
      if (keep && d.slot) {
        target = [].slice.call(listHost.children).filter(function (n) {
          return n !== d.item;
        }).indexOf(d.slot);
      }

      if (d.slot && d.slot.parentNode) d.slot.parentNode.removeChild(d.slot);
      d.item.classList.remove("is-dragging");
      d.item.removeAttribute("style");
      listHost.classList.remove("is-dragging");

      if (target < 0 || target === d.index) {
        draw(); /* 제자리 — 끌면서 흐트러진 것만 되돌린다 */
        UI.announce(keep ? "제자리에 놓았습니다." : "옮기기를 취소했습니다.");
        return;
      }
      reorder(d.index, target);
    }

    /**
     * ★ 움직임과 놓기를 «window» 에서 듣는다.
     *
     *   처음에는 setPointerCapture 로 줄 자체에서 들었다. 그런데 캡처가
     *   막히거나 실패하는 자리가 있고(그러면 끌기가 «아예» 동작하지 않는다),
     *   들어 올린 줄은 position:fixed 라 손끝 아래를 벗어나기도 한다.
     *   window 에서 들으면 두 경우 모두 문제가 되지 않는다.
     */
    function onMove(evt) {
      if (!drag || drag.pointerId !== evt.pointerId) return;
      if (!drag.lifted) {
        if (
          Math.abs(evt.clientY - drag.startY) < THRESHOLD &&
          Math.abs(evt.clientX - drag.startX) < THRESHOLD
        ) {
          return;
        }
        lift();
      }
      if (evt.cancelable) evt.preventDefault();
      follow(evt);
    }

    function onUp(evt) {
      if (drag && drag.pointerId === evt.pointerId) endDrag(true);
    }

    function onCancel(evt) {
      if (drag && drag.pointerId === evt.pointerId) endDrag(false);
    }

    function armDrag(item, index) {
      item.addEventListener("pointerdown", function (evt) {
        if (drag) return;
        if (evt.button) return; /* 왼쪽 단추만 */
        if (!evt.target || !evt.target.closest) return;
        if (evt.target.closest(".assemble__btns")) return; /* ▲▼ 는 단추다 */
        /* 손가락은 손잡이에서만 — 아니면 화면을 넘길 수 없다 */
        if (evt.pointerType === "touch" && !evt.target.closest(".assemble__grip")) return;

        drag = {
          item: item,
          index: index,
          pointerId: evt.pointerId,
          startY: evt.clientY,
          startX: evt.clientX,
          rect: item.getBoundingClientRect(),
          lifted: false,
          slot: null
        };
        window.addEventListener("pointermove", onMove, { passive: false });
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onCancel);
      });
    }

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];
        var item = UI.el("li", { class: "assemble__item" }, [
          UI.el("span", {
            class: "assemble__grip",
            attrs: { "aria-hidden": "true", title: "끌어서 옮기기" },
            text: "⠿"
          }),
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);
        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        armDrag(item, index);
        listHost.appendChild(item);
      });
    }

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", {
          class: "assemble__help",
          text:
            "줄을 끌어서 원하는 자리에 놓으세요 — 놓일 자리가 점선으로 보입니다. " +
            "▲ ▼ 단추로도 옮길 수 있고, 손가락으로는 왼쪽 손잡이를 끕니다."
        }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isSolved: function () {
        return current.every(function (id, i) {
          return byId[id].order === i + 1;
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  function blanks(values, onChange) {
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    A.BLANK_TEMPLATE.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: { type: "text", placeholder: line.hint, spellcheck: "false", autocapitalize: "off" }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        host.appendChild(
          UI.el("div", { class: "blanks__row" }, [
            UI.el("label", { class: "sr-only", attrs: { for: id }, text: line.hint }),
            input
          ])
        );
        return;
      }

      host.appendChild(
        UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
          UI.el("code", { class: "blanks__fixed" }, [lineNode(line.text)])
        ])
      );
    });

    function sourceOf() {
      return A.BLANK_TEMPLATE.lines
        .map(function (line) {
          if (!line.blank) return line.text;
          var typed = String(current[line.blank] || "").trim();
          return "  ".repeat(line.indent || 0) + typed;
        })
        .join("\n");
    }

    return {
      root: host,
      getSource: sourceOf,
      getValues: function () {
        return current;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — LED 등과 «누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(1000) 이면 1초를 기다린다. 그래야 LED 가 실제 보드처럼 깜빡이고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다(명세 29장 4번).
     *
     *     1배속   delay 값 그대로 (delay(1000) → 1초)
     *     0.5배속 두 배 천천히 — 깜빡임을 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

          el("ul", { class: "keypoints" }, warn.items.map(function (t) {
            return el("li", { class: "keypoints__item", text: t });
          }))
        ])
      ])
    );

    /* ⑤ setup / loop 흐름 + 이 차시에 새로 나오는 세 가지 */
    box.appendChild(
      UI.card({ title: "setup() 은 한 번, loop() 는 계속 — 그 안에서 «읽고 갈라진다»" }, [
        el("div", { class: "flow" }, L.SKETCH_FLOW.map(function (step, i) {
          return el("div", { class: "flow__step flow__step--" + step.phase }, [
            el("span", { class: "flow__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
            el("p", { class: "flow__label", text: step.label }),
            el("p", { class: "flow__note", text: step.note }),
            step.phase === "loop" ? el("span", { class: "flow__repeat", text: "↻ 되풀이" }) : null
          ]);
        })),
        newThingCards(),
        ED
          ? ED.codeView(A.REFERENCE_CODE, { caption: "오늘 만들 기준 프로그램 — 4단계에서 한 줄씩 읽습니다" }).root
          : UI.codeBlock(A.REFERENCE_CODE, "오늘 만들 기준 프로그램")
      ])
    );

    /* ⑥ 개념 확인 — 오답에는 정답을 알려 주지 않고 «돌아갈 카드» 를 알려 준다 */
    var checkBox = el("div");
    L.CONCEPT_CHECK.forEach(function (q) {
      var picked = state.concept.checkChoices[q.id];
      var passed = state.concept.checks[q.id] === true;
      var feedback = el("div", { class: "feedback" });

      if (picked !== undefined) {
        if (passed) {
          feedback.appendChild(UI.alert("ok", "맞았습니다."));
        } else {
          var card = null;
          L.CONCEPT_CARDS.forEach(function (c) {
            if (c.id === q.review) card = c;
          });
          feedback.appendChild(
            UI.alert("warn", "다시 골라 보세요. " + q.hint, [
              card
                ? UI.button("«" + card.title + "» 카드 다시 보기", {
                    class: "btn btn--ghost btn--small",
                    click: function () {
                      /* 정답을 알려 주지 않고 «읽을 자리» 로 데려다 준다 */
                      var node = document.querySelector('[data-card="' + card.id + '"]');
                      if (!node) return;
                      node.open = true;
                      node.scrollIntoView({ block: "center" });
                      var sum = node.querySelector("summary");
                      if (sum) sum.focus();
                    }
                  })
                : null
            ])
          );
        }
      }

      checkBox.appendChild(
        el("div", { class: "quizitem" }, [
          UI.choiceGroup(
            { name: "cc-" + q.id, choices: q.choices, legend: q.question },
            picked,
            function (index) {
              app.update(function (s) {
                s.concept.checkChoices[q.id] = index;
                s.concept.checks[q.id] = index === q.answerIndex;
              });
            }
          ),
          feedback
        ])
      );
    });

    var done = L.CONCEPT_CHECK.filter(function (q) {
      return state.concept.checks[q.id] === true;
    }).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "개념 확인",
          title: "세 문항을 모두 맞히면 다음 단계가 열립니다.",
          desc: "지금 " + done + " / " + L.CONCEPT_CHECK.length + " 문항"
        },
        [checkBox]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 3단계 — 회로 결선                                                   */
  /* ================================================================== */

  /**
   * 3단계는 두 판으로 나뉜다 (명세 6.3).
   *   3-A 단자 찾기  — 부품에서 단자를 «이름으로» 찾아 누른다
   *   3-B 케이블 연결 · 점검 — 다섯 갈래를 잇고 위험 연결이 없는지 확인한다
   *
   * ★ 이 차시는 회로가 «두 갈래» 다.
   *   센서를 살리는 세 줄(5V·GND·DO)과 LED 를 켜는 두 줄이다.
   *   그래서 «지금 할 일» 도 센서 쪽을 먼저 짚는다 — 센서가 죽어 있으면
   *   LED 를 아무리 잘 이어도 프로그램이 아무것도 읽을 수 없다.
   *
   * 화면을 짤 때 지킨 것
   *   ① «지금 할 일» 을 맨 위에 한 줄로 적는다. 학생이 무엇을 하는 화면인지 바로 알게.
   *   ② 그 아래 «회로 점검» — 채운 조건과 못 채운 조건. 힌트 단추는 그 줄에 «붙여» 둔다.
   *      (조건 목록과 힌트 줄을 따로 두면 같은 문장이 두 번 나온다)
   *   ③ 그림은 그다음이다. 할 일을 읽고 그림으로 내려가는 순서다.
   */

  /** 작은 진행 표시 — ①②③④ 중 어디까지 왔는지 한 줄로 */
  function taskStrip(items) {
    return el("ol", { class: "tasks" }, items.map(function (item, i) {
      var state = item.done ? "is-done" : item.now ? "is-now" : "";
      return el("li", { class: ("tasks__item " + state).trim() }, [
        el("span", { class: "tasks__no", attrs: { "aria-hidden": "true" }, text: item.done ? "✔" : String(i + 1) }),
        el("span", { class: "tasks__text", text: item.text }),
        el("span", { class: "sr-only", text: item.done ? " 마침" : item.now ? " 지금 할 일" : " 아직" })
      ]);
    }));
  }

  /**
   * 「지금 할 일」 한 줄 — 상태를 보고 다음 행동 «하나만» 고른다.
   *
   * ★ 여러 줄을 한꺼번에 늘어놓지 않는다. 회로가 엉켰을 때 고칠 것이 대여섯 개로 보이면
   *   학생은 어디부터 손대야 할지 알 수 없다. 판정도 그렇게 하도록 circuit.js 가
   *   «아직 판정할 수 없는» 항목을 blocked 로 돌려준다.
   */
  function nowDoing(state, check, dangers) {
    var c = state.circuit;

    /* 위험 연결이 가장 먼저다 — 그것을 고치기 전에는 나머지를 볼 까닭이 없다 */
    if (dangers.length > 0) {
      return { at: 0, text: dangers[0].title + " — 아래 경고를 읽고 그 케이블부터 고치세요." };
    }

    var missing = {};
    check.missing.forEach(function (m) {
      missing[m.id] = true;
    });

    /* ── 센서 쪽 세 줄이 먼저다 ── */
    if (missing["c-pir-vcc"]) {
      return { at: 1, text: "PIR 의 «VCC» 를 우노의 «5V» 로 이으세요. 센서에 전기를 넣는 줄입니다." };
    }
    if (missing["c-pir-gnd"]) {
      return {
        at: 1,
        text: "PIR 의 «GND» 를 우노의 «GND» 로 이으세요. 센서와 우노가 같은 기준을 쓰게 하는 줄입니다."
      };
    }
    if (missing["c-pir-do"]) {
      return {
        at: 1,
        text:
          "PIR 의 «OUT(DO)» 을 우노의 «" + C.MOTION_PIN_NAME + "» 으로 이으세요. " +
          "센서가 내보내는 것을 우노가 읽는 줄입니다."
      };
    }
    /* ── LED 쪽 두 줄 ── */
    if (missing["c-anode"]) {
      return {
        at: 2,
        text: "우노의 «" + C.LED_PIN_NAME + "» 에서 (저항을 거쳐) LED 의 «긴 다리 A» 까지 이으세요."
      };
    }
    if (missing["c-resistor"]) {
      return { at: 2, text: C.RESISTOR_OHM + "Ω 저항이 경로에 없습니다. 저항을 한 줄로 끼워 넣으세요." };
    }
    if (missing["c-cathode"]) {
      return { at: 3, text: "LED 의 «짧은 다리 K» 를 우노의 «GND» 로 이으세요. 전류가 돌아올 길입니다." };
    }
    if (missing["c-noshort"]) {
      return { at: 3, text: "부품을 거치지 않고 곧바로 이어진 케이블이 있습니다. 아래 경고를 보세요." };
    }
    if (missing["c-tidy"]) {
      return { at: 3, text: "쓰지 않는 케이블이나 반쯤 꽂힌 다리가 있습니다. 아래 목록에서 정리하세요." };
    }
    if (!c.powerOn) {
      return { at: 4, text: "점검을 모두 통과했습니다. 아래 [전원 켜기] 를 눌러 전기를 넣으세요." };
    }
    return { at: 5, text: "3단계를 마쳤습니다. 아래 [다음] 으로 넘어가세요." };
  }

  /** 회로가 바뀌면 «전원·점검·측정» 은 처음부터 다시 확인한다 */
  function resetPower(s) {
    s.circuit.powerOn = false;
    s.circuit.checked = false;
    if (!C.checkCircuit(s.circuit.connections).ok) s.circuit.checkPassed = false;
  }

  /**
   * 케이블 색이 무엇을 뜻하는지 그림 바로 아래에 적는다.
   * 색을 «읽는 법» 을 모르면 색을 나눈 뜻이 없다.
   */
  function wireLegend() {
    function item(color, text) {
      return el("li", { class: "wirelegend__item" }, [
        el("span", {
          class: "wirelegend__dot wirelegend__dot--" + color,
          attrs: { "aria-hidden": "true" }
        }),
        el("span", { text: text })
      ]);
    }

    return el("ul", { class: "wirelegend" }, [
      item("yellow", "노랑 — 센서 쪽 (5V → VCC, " + PC.MOTION_PIN_NAME + " → OUT). LED 전류의 길은 아니다."),
      item("orange", "주황 — " + PC.LED_PIN_NAME + " 에서 LED 긴 다리까지 (신호가 나가는 길)"),
      item("blue", "파랑 — GND 로 돌아오는 쪽. 센서와 LED 가 «함께 쓰는» 기준이다."),
      item("gray", "회색 — 이 회로에 쓰이지 않는 케이블")
    ]);
  }

  /** 「이렇게 이으면 됩니다」 아래에 늘 붙는 한 줄 (명세 17.3 B) */
  var RESISTOR_NOTE =
    "저항을 LED «뒤» 에 두어도(LED 짧은 다리 K → 저항 → GND) 정답입니다. " +
    "한 줄로 이어져 있으면 저항이 어느 자리에 있든 같은 전류가 흐릅니다.";

  /** 3단계 화면에 «늘» 붙는 경고 (명세 6.3 — 제조사별 배열 차이) */
  function moduleWarn() {
    var warn = L.MODULE_WARN;
    return UI.alert("warn", warn.title, [
      el("ul", { class: "keypoints" }, warn.items.slice(0, 2).map(function (t) {
        return el("li", { class: "keypoints__item", text: t });
      }))
    ]);
  }

  function renderCircuit(state, app) {
    var box = el("div");
    var circuit = state.circuit;

    /* ================================================================ */
    /* 3-A 부품과 단자 찾기 (명세 17.3 A)                                 */
    /* ================================================================ */

    if (!circuit.findDone) {
      var task = C.FIND_TASKS[circuit.findIndex] || C.FIND_TASKS[0];
      var findFeedback = el("div", { class: "feedback" });

      var findBoard = S.board.create({
        mode: "find",
        showBoard: true,
        showBread: false,
        showParts: true,
        getState: function () {
          return state.circuit;
        },
        onPick: function (component, pin) {
          var here = C.FIND_TASKS[state.circuit.findIndex];
          var result = C.checkFind(state.circuit.findIndex, component, pin, state.circuit.findPicks);
          UI.clear(findFeedback);
          if (result.ok) {
            app.update(function (s) {
              /* 어느 단자를 눌렀는지 기억한다 — 저항의 «반대쪽 끝» 을 가려내는 데 쓴다 */
              if (here) s.circuit.findPicks[here.id] = component + "/" + pin;
              s.circuit.findIndex += 1;
              if (result.done) s.circuit.findDone = true;
            });
            UI.toast(result.message);
            return;
          }
          app.patch(function (s) {
            s.circuit.findAttempts += 1;
          });
          findFeedback.appendChild(UI.alert("warn", result.message));
        }
      });

      box.appendChild(
        UI.card(
          {
            eyebrow: "3단계 · A 부품과 단자 찾기",
            title: "먼저 부품에서 단자를 찾습니다.",
            desc:
              C.FIND_TASKS.length + "곳을 차례로 찾으면 케이블 연결로 넘어갑니다. " +
              "핀 이름을 외우는 것이 아니라 «인쇄된 글자를 읽는» 연습입니다."
          },
          [
            taskStrip(
              C.FIND_TASKS.map(function (t, i) {
                var NAMES = {
                  "f-motion": C.MOTION_PIN_NAME,
                  "f-led-pin": C.LED_PIN_NAME,
                  "f-pir-vcc": "PIR VCC",
                  "f-pir-do": "PIR OUT",
                  "f-pir-gnd": "PIR GND",
                  "f-led-a": "LED 긴 다리",
                  "f-led-k": "LED 짧은 다리",
                  "f-res": "저항"
                };
                return {
                  text: NAMES[t.id] || t.id,
                  done: i < circuit.findIndex,
                  now: i === circuit.findIndex
                };
              })
            ),
            UI.alert("info", task.prompt),
            el("p", {
              class: "para",
              text:
                "그림에서 그 단자를 누르세요. 화살표 키로 옮기고 Enter 로 고를 수도 있습니다. " +
                "PIR 은 다리에 적힌 인쇄(VCC·OUT·GND)를, LED 는 다리 길이를, " +
                "저항은 몸통에 적힌 " + C.RESISTOR_OHM + "Ω 글자를 보세요."
            }),
            moduleWarn(),
            findFeedback,
            findBoard.root
          ]
        )
      );
      return box;
    }

    /* ================================================================ */
    /* 3-B 케이블 연결 · 3-C 점검과 전원 인가 (명세 17.3 B·C)              */
    /* ================================================================ */

    var check = C.checkCircuit(circuit.connections);
    var dangers = C.dangers(circuit.connections);
    var powerState = C.canPowerOn(circuit.connections);
    var now = nowDoing(state, check, dangers);

    /* ---------------- 회로 그림 ---------------- */

    var boardWire = S.board.create({
      mode: circuit.powerOn ? "locked" : "wire",
      showBoard: true,
      showBread: true,
      showParts: true,
      getState: function () {
        return state.circuit;
      },
      onConnect: function (conn) {
        app.update(function (s) {
          s.circuit.connections.push(conn);
          s.circuit.attempts += 1;
          resetPower(s);
          /* 명세 7장 — errors 는 «사람이 읽는 글», dangerEvents 는 «무슨 위험이 났는가» */
          C.dangers(s.circuit.connections).forEach(function (d) {
            s.circuit.errors.push(d.title + " : " + d.fix);
            s.circuit.dangerEvents.push({ code: d.code, title: d.title, at: new Date().toISOString() });
          });
        });
      },
      /* 케이블 한 줄만 지우기 — 그림에서 그 선을 누르거나, 이미 이어진 두 자리를 다시 고르면 온다.
         아래 케이블 목록의 [지우기] 도 «같은 일» 을 한다. */
      onRemoveWire: function (index) {
        app.update(function (s) {
          s.circuit.connections.splice(index, 1);
          resetPower(s);
        });
      },
      onUndo: function () {
        app.update(function (s) {
          s.circuit.connections.pop();
          resetPower(s);
        });
      },
      onReset: function () {
        app.update(function (s) {
          s.circuit.connections = [];
          resetPower(s);
        });
      },
    });

    /* ---------------- ① 점검 항목 + 전원 (맨 위) ---------------- */

    var hintOut = el("div", { class: "hintout" });

    /**
     * 조건 한 줄에 «힌트 보기» 를 붙인다.
     * 힌트는 개념 질문 → 위치 안내 → 구체적 연결 안내 세 단계로 «올라간다»(명세 18.2).
     * 항목마다 따로 세므로, 다른 항목의 힌트를 봤다고 이 항목이 건너뛰지 않는다.
     */
    var conditionList = el("ul", { class: "condlist" });
    check.conditions.forEach(function (cond) {
      var row = cond.blocked
        ? el("li", { class: "condlist__item condlist__item--wait" }, [
            el("span", { class: "condlist__mark", attrs: { "aria-hidden": "true" }, text: "—" }),
            el("span", { class: "condlist__text", text: cond.label }),
            el("span", { class: "condlist__note", text: cond.blockedWhy })
          ])
        : UI.conditionRow(cond.label, cond.ok);

      if (!cond.ok && !cond.blocked) {
        row.appendChild(
          UI.button("힌트 보기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              var level = Math.min(Number(state.circuit.hintLevels[cond.id]) || 0, 2);
              var message = C.hintFor(cond.id, level);
              app.patch(function (s) {
                s.circuit.hintsUsed += 1;
                s.circuit.hintLevels[cond.id] = level + 1;
              });
              UI.clear(hintOut).appendChild(
                UI.alert("info", message, [
                  el("p", {
                    class: "alert__fix",
                    text:
                      level >= 2
                        ? "마지막 힌트입니다."
                        : "아직 모르겠으면 [힌트 보기] 를 한 번 더 누르세요."
                  })
                ])
              );
            }
          })
        );
      }
      conditionList.appendChild(row);
    });

    /* ------------------------------------------------------------------ */
    /* [정답 확인] — 여섯 줄을 «두 칸 표» 로                                 */
    /*                                                                    */
    /*   ★ 접어 둔 「이렇게 이으면 됩니다」 와 무엇이 다른가.                 */
    /*     그쪽은 «어디까지 했는가» 를 보여 준다(이어짐/아직).                */
    /*     이 표는 «무엇을 이어야 하는가» 만 두 칸으로 늘어놓는다.            */
    /*     막힌 학생이 찾는 것은 뒤쪽이다 — 그래서 단추로 꺼냈다.             */
    /*                                                                    */
    /*   ★ 두 곳이 같은 GOAL 을 읽는다. 표만 따로 적으면 언젠가 어긋난다.     */
    /*                                                                    */
    /*   ★ 펼친 것은 «도움을 쓴 것» 이므로 hintsUsed 에 한 번 센다.          */
    /*     선생님 화면의 「힌트 n회」 가 그대로 읽는다.                       */
    /* ------------------------------------------------------------------ */
    function answerTable() {
      var head = el("tr", {}, [
        el("th", { attrs: { scope: "col" }, text: "" }),
        el("th", { attrs: { scope: "col" }, text: "한쪽" }),
        el("th", { attrs: { scope: "col" }, text: "다른쪽" })
      ]);

      var NO = ["①", "②", "③", "④", "⑤", "⑥"];
      var rows = goal.lines.map(function (line, i) {
        return el("tr", { class: line.ok ? "is-done" : "" }, [
          el("th", { class: "answer__no", attrs: { scope: "row" }, text: NO[i] || String(i + 1) }),
          el("td", { text: line.fromText }),
          el("td", { text: line.toText })
        ]);
      });

      return el("div", { class: "answer" }, [
        el("table", { class: "answer__table" }, [
          el("thead", {}, [head]),
          el("tbody", {}, rows)
        ]),
        el("p", {
          class: "answer__note",
          text:
            "GND 는 우노에 세 곳 있고 아무 곳이나 됩니다. 브레드보드를 거쳐 이어도 같습니다 — " +
            "같은 마디면 어느 구멍에 꽂아도 한 자리입니다."
        }),
        UI.alert("info", RESISTOR_NOTE)
      ]);
    }

    var powerRow = el("div", { class: "btnrow" });
    if (!circuit.powerOn) {
      powerRow.appendChild(
        UI.button("전원 켜기", {
          disabled: !powerState.ok,
          title: powerState.ok ? "" : "점검 항목을 모두 채워야 전원을 켤 수 있습니다.",
          click: function () {
            app.update(function (s) {
              s.circuit.checkPassed = true;
              s.circuit.powerOn = true;
              /* 명세 18.1 의 «부품 경로 검사 결과» 를 제출 자료에 담아 둔다 */
              var a = C.analyze(s.circuit.connections);
              var pir = C.pirWiring(s.circuit.connections);
              s.circuit.path = {
                ledDirection: a.ledDirection,
                hasResistor: a.hasResistor,
                resistanceOhm: a.resistanceOhm,
                shortCircuit: a.shortCircuit,
                /* PIR 세 줄 — 교사 화면이 «어느 줄을 놓쳤는가» 로 읽는다 */
                pirVcc: pir.vccTo5V,
                pirGnd: pir.gndToGround,
                pirOut: pir.outToMotion,
                pinsSwapped: pir.swapped
              };
            });
            UI.toast("전원을 켰습니다. 아직 코드가 없으므로 LED 는 꺼져 있습니다.");
          }
        })
      );
      powerRow.appendChild(
        UI.button("회로 점검", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.checked = true;
            });
            var left = C.checkCircuit(state.circuit.connections).missing;
            UI.toast(
              left.length === 0
                ? "모든 항목을 채웠습니다. [전원 켜기] 를 누르세요."
                : "아직 " + left.length + "가지가 남았습니다. 위 목록을 보세요."
            );
          }
        })
      );
      powerRow.appendChild(
        UI.button(circuit.answerShown ? "정답 접기" : "정답 확인", {
          class: "btn btn--ghost",
          attrs: { "aria-expanded": circuit.answerShown ? "true" : "false" },
          click: function () {
            var opening = !state.circuit.answerShown;
            app.update(function (s) {
              s.circuit.answerShown = opening;
              /* ★ 펼친 것은 «도움을 쓴 것» 이므로 세지만, «처음 한 번» 만 센다.
                 접었다 펼 때마다 세면 표를 다시 본 학생이 힌트를 열 번 쓴 것처럼 보인다.
                 다른 힌트와 같은 자리(hintLevels)에 기억해 둔다. */
              if (opening && !s.circuit.hintLevels.answer) {
                s.circuit.hintsUsed += 1;
                s.circuit.hintLevels.answer = 1;
              }
            });
            UI.toast(
              opening
                ? "이어야 할 여섯 줄입니다. 표를 보고 하나씩 이어 보세요."
                : "정답 표를 접었습니다."
            );
          }
        })
      );

      if (!powerState.ok) {
        powerRow.appendChild(
          el("p", {
            class: "btnrow__note",
            text:
              powerState.reason === "danger"
                ? "위험한 연결이 있어 전원을 넣을 수 없습니다."
                : "위 " + C.REQUIRED.length + "개 항목을 모두 채우면 켤 수 있습니다."
          })
        );
      }
    } else {
      powerRow.appendChild(
        UI.button("전원 끄기", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.powerOn = false;
            });
          }
        })
      );
      powerRow.appendChild(
        el("p", {
          class: "btnrow__note",
          text:
            "전원이 켜졌습니다. " + C.LED_PIN_NAME + " 은 아직 LOW 입니다 — " +
            "센서값을 읽고 무엇을 할지 정하는 코드가 없기 때문입니다. 4단계에서 코드를 만들면 켜집니다."
        })
      );
    }

    /* ------------------------------------------------------------------ */
    /* «지금 이어진 것» 한 줄 — 늘 보인다                                    */
    /*                                                                    */
    /* 앱이 이 회로를 무엇으로 «보고 있는지» 를 그대로 되비춘다.               */
    /* 판정이 왜 그렇게 나왔는지 학생도 선생님도 바로 확인할 수 있다.          */
    /* 정답을 알려 주는 것이 아니므로 늘 내보여도 된다.                       */
    /* ------------------------------------------------------------------ */
    var nowLine = el("div", { class: "nowpath" }, [
      el("span", { class: "nowpath__tag", text: "지금 이어진 것" }),
      el("span", { class: "nowpath__text", text: C.describeCurrent(circuit.connections) })
    ]);

    /* ------------------------------------------------------------------ */
    /* «이렇게 이으면 됩니다» — 접어 둔다                                    */
    /*                                                                    */
    /* ★ 펼쳐야만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).      */
    /*   막힌 학생과, 앱이 무엇을 바라는지 확인하려는 선생님을 위한 자리다.     */
    /* ------------------------------------------------------------------ */
    var goal = C.goalStatus(circuit.connections);
    var goalBox = UI.foldout("이렇게 이으면 됩니다 — 막히면 펼쳐 보세요", function () {
      var list = el("ol", { class: "goallist" }, goal.lines.map(function (line) {
        return el("li", { class: "goallist__item" + (line.ok ? " is-done" : "") }, [
          el("span", {
            class: "goallist__mark",
            attrs: { "aria-hidden": "true" },
            text: line.ok ? "✔" : "○"
          }),
          el("span", { class: "sr-only", text: line.ok ? "이어짐 : " : "아직 : " }),
          el("span", { class: "goallist__text", text: line.label }),
          el("span", { class: "goallist__state", text: line.ok ? "이어짐" : "아직" })
        ]);
      }));

      var parts = [
        el("p", {
          class: "para",
          text:
            "다섯 갈래(센서 세 줄 · LED 두 줄)입니다. 브레드보드를 거쳐 가도 되고, " +
            "같은 마디면 어느 구멍에 꽂아도 같습니다."
        }),
        list,
        S.figures ? S.figures.wiringMap() : null,
        UI.alert("info", RESISTOR_NOTE)
      ];

      if (goal.equivalent) {
        parts.push(
          UI.alert(
            "ok",
            "여러분은 위와 «다르게» 이었지만 전기적으로 같은 회로입니다. 그대로 두어도 정답입니다."
          )
        );
      }
      return el("div", {}, parts);
    });

    var checkBody = [
      moduleWarn(),
      nowLine,
      taskStrip([
        {
          text: "센서 세 줄 (5V · GND · " + C.MOTION_PIN_NAME + ")",
          done: !check.missing.some(function (m) {
            return m.id === "c-pir-vcc" || m.id === "c-pir-gnd" || m.id === "c-pir-do";
          }),
          now: now.at === 1
        },
        {
          text: C.LED_PIN_NAME + " → 저항 → LED",
          done: !check.missing.some(function (m) {
            return m.id === "c-anode" || m.id === "c-resistor";
          }),
          now: now.at === 2
        },
        {
          text: "LED → GND · 정리",
          done: !check.missing.some(function (m) {
            return m.id === "c-cathode" || m.id === "c-tidy" || m.id === "c-noshort";
          }),
          now: now.at === 3
        },
        { text: "전원 켜기", done: circuit.powerOn, now: now.at === 4 }
      ]),
      UI.alert(now.at === 0 ? "danger" : now.at === 5 ? "ok" : "info", now.text),
      conditionList,
      hintOut,
      goalBox
    ];

    /* 위험 연결 — 무엇이 어떻게 되는지(effect)까지 함께 적는다.
       «오답» 이라고만 하면 역극성과 무저항이 같은 것으로 보인다(명세 12장). */
    dangers.forEach(function (d) {
      checkBody.push(
        UI.alert("danger", d.title + " — " + d.detail, [
          el("p", { class: "alert__fix", text: "시뮬레이션 : " + d.effect }),
          el("p", { class: "alert__fix", text: "고치는 법 : " + d.fix })
        ])
      );
    });

    /* 반쯤 꽂힌 다리와 쓸모없는 케이블을 «이름으로» 짚어 준다 */
    if (check.dangling.length > 0) {
      checkBody.push(
        UI.alert(
          "warn",
          "한쪽만 이어진 다리가 있습니다 : " +
            check.dangling
              .map(function (d) {
                return d.label;
              })
              .join(", ")
        )
      );
    }
    if (check.stray.length > 0) {
      checkBody.push(
        UI.alert("warn", "이 회로에 쓰이지 않는 케이블이 " + check.stray.length + "개 있습니다. 지워 주세요.")
      );
    }

    checkBody.push(powerRow);
    /* [정답 확인] 표는 단추 «바로 아래» 에 온다 — 누른 자리에서 보여야 한다.
       ★ 여기서 만든다. 단추를 만드는 자리(위쪽)에서 만들면 goal 이 아직 없어
          goal.lines 에서 터지고 화면이 통째로 비어 버린다. */
    if (circuit.answerShown) checkBody.push(answerTable());

    box.appendChild(
      UI.card(
        {
          eyebrow: "3단계 · B 케이블 연결 · C 점검",
          title: "회로 점검",
          desc:
            "5V→PIR VCC,  GND→PIR GND,  " + C.MOTION_PIN_NAME + "→PIR OUT(DO),  " +
            C.LED_PIN_NAME + "→" + C.RESISTOR_OHM + "Ω→LED 양극,  LED 음극→GND — 다섯 갈래입니다. " +
            "저항은 LED 앞에 두어도 뒤에 두어도 됩니다."
        },
        checkBody
      )
    );

    /* ---------------- ② 회로 그림 + 케이블 목록 ---------------- */

    var wireList = el("ul", { class: "wirelist" });
    if (circuit.connections.length === 0) {
      wireList.appendChild(el("li", { class: "wirelist__empty", text: "아직 이은 케이블이 없습니다." }));
    }
    /* 색은 «회로의 어느 쪽인가» 로 정해진다. 목록도 같은 값을 써야 그림과 어긋나지 않는다. */
    var wireSides = C.wireSides(circuit.connections);
    circuit.connections.forEach(function (conn, index) {
      var side = wireSides[index] || "";
      var colorName = S.board.SIDE_COLOR[side] || "gray";
      wireList.appendChild(
        el("li", { class: "wirelist__item" }, [
          el("span", { class: "wirelist__dot wirelist__dot--" + colorName, attrs: { "aria-hidden": "true" } }),
          /* ★ 색만으로 알리지 않는다 — «D8 쪽 / GND 쪽» 을 글자로도 적는다(명세 6.3) */
          el("span", { class: "wirelist__side wirelist__side--" + (side || "none"), text: S.board.SIDE_WORD[side] }),
          el("span", {
            class: "wirelist__text",
            text:
              (S.board.COLOR_WORD[colorName] || "") +
              " · " +
              C.describe(conn.fromComponent, conn.fromPin) +
              " → " +
              C.describe(conn.toComponent, conn.toPin)
          }),
          UI.button("지우기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              app.update(function (s) {
                s.circuit.connections.splice(index, 1);
                resetPower(s);
              });
            }
          })
        ])
      );
    });

    var boardCard = UI.card(
      {
        title: "회로 그림",
        desc: circuit.powerOn
          ? "전원이 켜져 있어 회로가 잠겼습니다. 케이블을 고치려면 [전원 끄기] 를 누르세요."
          : "단자를 하나 누르고, 이을 곳을 하나 더 누르면 케이블이 생깁니다. 잘못 이었으면 그 케이블 선을 한 번 누르세요 — 그 줄만 지워집니다. 아래쪽에 저항 · LED · PIR 모듈이 있습니다."
      },
      [boardWire.root, wireLegend(), wireList]
    );
    box.appendChild(boardCard);

    return box;
  }

  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */

  /**
   * 4단계는 «읽고 → 돌려 보고 → 만든다» 세 판으로 나뉜다.
   *
   *   A 읽기   예시 프로그램을 한 줄씩 읽는다 (함수 설명·뼈대·실행 순서)
   *   B 확인   그 예시를 그대로 실행해 setup 1회 / loop 반복을 눈으로 본다
   *   C 만들기 조립 → 빈칸 → 편집으로 직접 적는다
   *
   * ★ B 를 마치기 전에는 C 를 «보여 주지 않는다».
   *   스케치를 한 번도 본 적 없는 학생에게 곧바로 작성 화면을 내밀면
   *   무엇을 하는 것인지 알 수 없다.
   */

  /**
   * 실행 결과를 보여 주는 작은 부품 — 4단계 예시·학생 코드와 5단계 실험이 «같은 것» 을 쓴다.
   *
   * ★ 명세 6.5 가 요구한 여덟 가지를 «한 흐름으로 동시에» 보인다.
   *     PIR 안정화 · 사람 위치 · 움직임 · DO · if 조건 · D8 · LED · 시리얼 출력
   *
   * ★ 켜짐·꺼짐과 HIGH/LOW 를 색으로만 알리지 않는다(명세 11장).
   *   ●/○ 와 «켜짐»·«꺼짐», «HIGH»·«LOW» 글자를 함께 쓴다.
   *
   * opts
   *   sensor : arduino.pirModel(...) — 시간에 따라 DO 를 정한다. 없으면 늘 LOW.
   *   runMs  : 몇 ms 까지 돌려 볼 것인가. 바퀴 수를 여기서 정한다.
   */
  function makeRunner(opts) {
    var o = opts || {};
    var viewHost = el("div");
    var panelHost = el("div");
    var player = null;
    var sensor = o.sensor || null;

    /* 상태 등 — 다시 그리지 않고 «글자만» 바꾼다 */
    var lamp = el("span", { class: "lamp", attrs: { "aria-hidden": "true" }, text: "○" });
    var lampText = el("span", { class: "lamp__text", text: "꺼짐" });
    /* 등을 담는 상자를 «미리» 만들어 둔다.
       상자를 화면에 붙이기 전에 setLed 를 부를 때가 있어서, 그때 parentNode 를 찾으면 없다. */
    var lampBox = el("div", { class: "lamp-box" }, [lamp, lampText]);

    var warmText = el("span", { class: "runstat__value", text: "—" });
    var whereText = el("span", { class: "runstat__value", text: "—" });
    var moveText = el("span", { class: "runstat__value", text: "—" });
    var doText = el("span", { class: "runstat__value", text: "—" });
    var condText = el("span", { class: "runstat__value", text: "—" });
    var pinText = el("span", { class: "runstat__value", text: "LOW" });
    var lineText = el("span", { class: "runstat__value", text: "—" });
    var timeText = el("span", { class: "runstat__value", text: "0.000초" });
    var phaseText = el("span", { class: "runstat__value", text: "setup()" });
    var serialText = el("span", { class: "runstat__value", text: "—" });
    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });

    function setLed(on) {
      lamp.textContent = on ? "●" : "○";
      lampText.textContent = on ? "켜짐" : "꺼짐";
      pinText.textContent = on ? "HIGH" : "LOW";
      lampBox.className = "lamp-box" + (on ? " lamp-box--on" : "");
    }

    /**
     * 센서 쪽 네 줄을 그 시각의 상태로 채운다.
     *
     * ★ 안정화가 끝나기 전에는 DO 를 HIGH/LOW 로 «확정하지 않는다»(명세 6.2).
     *   «안정화 중—판정 대기» 라고 적는다. 이때 if 조건도 판정을 적지 않는다.
     */
    function setSensor(t) {
      if (!sensor) {
        warmText.textContent = "센서 없음";
        whereText.textContent = "—";
        moveText.textContent = "—";
        doText.textContent = "LOW";
        return null;
      }
      var st = sensor.stateAt(t);
      warmText.textContent = st.settled
        ? "완료"
        : "안정화 중 — " + (st.warmupLeft / 1000).toFixed(1) + "초 남음";
      whereText.textContent = st.inZone ? "감지 영역 «안»" : "감지 영역 «밖»";
      moveText.textContent = st.moving ? "움직이는 중" : "멈춰 있음";
      doText.textContent = st.settled ? st.text : "안정화 중—판정 대기";
      return st;
    }

    function statRow(label, valueNode, cls) {
      return el("div", { class: "runstat" + (cls ? " runstat--" + cls : "") }, [
        el("span", { class: "runstat__label", text: label }),
        valueNode
      ]);
    }

    /**
     * 몇 바퀴를 돌려 보여 줄 것인가.
     *
     * ★ delay 를 «실제 시간» 만큼 기다리므로 바퀴 수를 고정하면 안 된다.
     *   loop() 한 바퀴가 얼마나 걸리는지 재어 보고, runMs 만큼 흐르도록 바퀴 수를 정한다.
     *   그래야 «안정화 → 감지 → 유지 → 미감지» 가 끝까지 지나간다.
     */
    function loopsFor(source, runMs) {
      var probe = A.run(source, { loopLimit: 2, ledPin: PC.LED_PIN });
      var cycleMs = probe.elapsed / 2;
      var want = runMs || o.runMs || 6000;
      if (!cycleMs || cycleMs <= 0) return o.loopLimit || 8;
      return Math.max(2, Math.min(60, Math.ceil(want / cycleMs)));
    }

    /**
     * 실행해 보여 준다.
     *   ro.instant  : 애니메이션 없이 «끝난 모습» 을 바로 보여 준다.
     *                 화면을 다시 그릴 때마다 처음부터 재생되면 눈이 어지럽다.
     *   ro.onChange(): LED 가 «처음으로» 바뀌는 순간 한 번 부른다.
     *                 4단계에서 «갈림길이 옮겨 가는 것을 보았는가» 를 재는 데 쓴다.
     *   ro.sensor   : 이 실행에만 쓸 센서 모델(없으면 만들 때 준 것)
     */
    function run(source, ro) {
      ro = ro || {};
      if (ro.sensor) sensor = ro.sensor;

      var runMs = ro.runMs || o.runMs;
      var result = A.run(source, {
        loopLimit: loopsFor(source, runMs),
        ledPin: PC.LED_PIN,
        inputFn: sensor ? sensor.inputFn : null
      });
      var view = ED.codeView(source, { caption: "실행 중인 줄이 ▶ 로 표시됩니다." });
      UI.clear(viewHost).appendChild(view.root);

      if (!result.ok && result.error) {
        UI.clear(panelHost).appendChild(
          UI.alert("warn", (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message)
        );
        return result;
      }

      /* LED 가 처음으로 «바뀌는» 시각 — 갈림길이 옮겨 간 자리다 */
      var marks = result.led.timeline || [];
      var firstChangeT = marks.length >= 2 ? marks[1].t : null;
      var changeTold = false;

      if (player) player.stop();
      setLed(false);
      setSensor(0);

      player = ED.player(view, {
        onStep: function (entry) {
          if (entry.ledOn !== undefined) setLed(entry.ledOn === true);
          if (entry.line) lineText.textContent = entry.line + "번 줄";
          timeText.textContent = (entry.t / 1000).toFixed(3) + "초";
          phaseText.textContent =
            entry.phase === "setup" ? "setup() — 한 번만" : "loop() " + entry.iteration + "회째";

          var st = setSensor(entry.t);
          /* if 조건은 «판정할 수 있을 때» 만 적는다 */
          if (st && !st.settled) condText.textContent = "판정 대기";
          else condText.textContent = entry.ledOn ? "True (motion == HIGH)" : "False";

          if (entry.kind === "print" && entry.text) serialText.textContent = entry.text;

          if (firstChangeT !== null && !changeTold && entry.t >= firstChangeT) {
            changeTold = true;
            live.textContent = "센서값이 바뀌어 실행되는 줄이 옮겨 갔습니다.";
            if (ro.onChange) ro.onChange();
          }
        }
      });
      player.setTrace(result.trace);

      /* ── 시간표 두 줄 : DO 와 LED (명세 6.5 «한 흐름으로») ── */
      var total = result.elapsed || 1;

      function stripFor(kind) {
        var strip = el("div", { class: "ledline" });
        if (kind === "led") {
          for (var i = 0; i + 1 < marks.length; i += 1) {
            var w = ((marks[i + 1].t - marks[i].t) / total) * 100;
            strip.appendChild(
              el("span", {
                class: "ledline__seg ledline__seg--" + (marks[i].on ? "on" : "off"),
                attrs: {
                  style: "width:" + w.toFixed(2) + "%",
                  title: (marks[i].on ? "켜짐 " : "꺼짐 ") + (marks[i + 1].t - marks[i].t) + "ms"
                },
                text: w > 8 ? (marks[i].on ? "켜짐" : "꺼짐") : ""
              })
            );
          }
          return strip;
        }

        /* DO — 읽은 값의 발자취를 구간으로 묶는다 */
        var reads = result.reads || [];
        var segs = [];
        reads.forEach(function (r) {
          var st = sensor ? sensor.stateAt(r.t) : null;
          var label = st && !st.settled ? "warm" : r.value ? "high" : "low";
          var last = segs[segs.length - 1];
          if (last && last.label === label) last.to = r.t;
          else segs.push({ label: label, from: r.t, to: r.t });
        });
        segs.forEach(function (sg, i) {
          var to = i + 1 < segs.length ? segs[i + 1].from : total;
          var w = ((to - sg.from) / total) * 100;
          var word = sg.label === "warm" ? "대기" : sg.label === "high" ? "HIGH" : "LOW";
          strip.appendChild(
            el("span", {
              class: "ledline__seg ledline__seg--do-" + sg.label,
              attrs: { style: "width:" + w.toFixed(2) + "%", title: word + " " + Math.round(to - sg.from) + "ms" },
              text: w > 8 ? word : ""
            })
          );
        });
        return strip;
      }

      var speedRow = el("div", { class: "btnrow" }, [
        el("span", { class: "btnrow__label", text: "재생 속도" })
      ]);
      L.PLAY_SPEEDS.forEach(function (sp) {
        speedRow.appendChild(
          UI.button(sp.label, {
            class: "btn btn--ghost btn--small",
            title: sp.note,
            click: function () {
              player.setSpeed(sp.factor);
              player.reset();
              player.play();
            }
          })
        );
      });
      speedRow.appendChild(
        UI.button("멈춤", {
          class: "btn btn--ghost btn--small",
          click: function () {
            player.stop();
          }
        })
      );

      UI.clear(panelHost).appendChild(
        el("div", { class: "runpanel" }, [
          el("div", { class: "runpanel__head" }, [
            lampBox,
            el("div", { class: "runstats" }, [
              statRow("PIR 안정화", warmText, "sensor"),
              statRow("사람 위치", whereText, "sensor"),
              statRow("움직임", moveText, "sensor"),
              statRow("DO (" + PC.MOTION_PIN_NAME + ")", doText, "sensor"),
              statRow("if 조건", condText, "cond"),
              statRow(PC.LED_PIN_NAME + " 출력", pinText, "out"),
              statRow("시리얼 출력", serialText, "out"),
              statRow("실행 중인 줄", lineText),
              statRow("어느 함수", phaseText),
              statRow("누적 시간", timeText)
            ])
          ]),
          el("div", {}, [
            el("p", { class: "ledline__cap", text: "DO (" + PC.MOTION_PIN_NAME + ") 시간표" }),
            stripFor("do"),
            el("p", { class: "ledline__cap", text: "LED 시간표" }),
            marks.length > 1
              ? stripFor("led")
              : el("p", { class: "para", text: "LED 상태가 한 번도 바뀌지 않았습니다." })
          ]),
          /* 가상 시리얼 모니터 (명세 6.4) */
          el("div", { class: "monitor" }, [
            el("p", { class: "monitor__head" }, [
              el("span", { text: "시리얼 모니터 (9600 baud)" }),
              player.clock
            ]),
            player.monitor
          ]),
          speedRow,
          el("p", {
            class: "runpanel__note",
            text:
              "delay 줄에서는 그 시간만큼 «실제로» 기다린 뒤 다음 줄로 넘어갑니다 — " +
              "delay(500) 이면 0.5초입니다. 0.5배속은 두 배 천천히 보여 줄 뿐, 코드의 값은 그대로입니다."
          }),
          live
        ])
      );

      player.setSpeed(ro.instant ? 0 : 1);
      player.play();
      return result;
    }

    return {
      viewHost: viewHost,
      panelHost: panelHost,
      run: run,
      stop: function () {
        if (player) player.stop();
      }
    };
  }

  /**
   * 4단계 «돌려 보기» 에 쓰는 짧은 시나리오.
   *
   * ★ 수업 시간을 아끼려고 안정화·유지 시간을 «더» 줄였다.
   *   5단계에서는 constants.js 의 값(실제에 가까운 쪽)으로 돌린다.
   *   두 값이 다른 것을 감추지 않고 화면에 적는다.
   */
  function demoSensor() {
    return A.pirModel({
      pin: PC.MOTION_PIN,
      warmupMs: 1500,
      holdMs: 1500,
      events: [
        { at: 0, inZone: true, moving: false },
        { at: 2500, inZone: true, moving: true },
        { at: 4000, inZone: true, moving: false }
      ]
    });
  }
  var DEMO_RUN_MS = 7000;

  function renderCode(state, app) {
    var box = el("div");
    var code = state.code;
    var W = L.CODE_WALKTHROUGH;

    /* ================================================================ */
    /* A. 예시 읽기 (명세 17.4 A)                                        */
    /* ================================================================ */

    box.appendChild(
      UI.card({ eyebrow: "4단계 · A 먼저 읽기", title: W.title, desc: W.intro }, [
        /* ★ 프로그램과 함수 설명을 «나란히» 둔다.
           코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않아도 된다.
           좁은 화면에서는 코드가 위, 설명이 아래로 접힌다. */
        el("div", { class: "readpair" }, [
          el("div", { class: "readpair__code" }, [
            ED.codeView(W.code, { caption: "오늘 만들 프로그램" }).root
          ]),
          el("div", { class: "readpair__fns" }, [
            el("h3", { class: "subhead", text: "이 프로그램이 쓰는 함수" }),
            newThingCards()
          ])
        ]),

        /* 뼈대 — 스케치는 언제나 이 두 함수로 이루어진다 */
        el("h3", { class: "subhead", text: "스케치의 뼈대는 함수 두 개다" }),
        el("div", { class: "skel" }, W.skeleton.map(function (part) {
          return el("div", { class: "skel__item" }, [
            el("code", { class: "skel__name", text: part.name }),
            el("p", { class: "skel__when" }, [
              el("b", { text: "언제 : " }),
              el("span", { text: part.when })
            ]),
            el("p", { class: "skel__what", text: part.what })
          ]);
        })),

        /* 줄마다 무슨 뜻인가 — 줄 수는 코드와 정확히 같다(명세 17.4 A) */
        el("h3", { class: "subhead", text: "한 줄씩 읽어 보기" }),
        el("ol", { class: "walk" }, W.lines.map(function (line) {
          return el("li", { class: "walk__item" }, [
            el("span", { class: "walk__no", attrs: { "aria-hidden": "true" }, text: String(line.no) }),
            el("div", { class: "walk__body" }, [
              line.code
                ? el("code", { class: "walk__code", text: line.code })
                : el("code", { class: "walk__code walk__code--empty", text: "(빈 줄)" }),
              el("p", { class: "walk__text", text: line.text })
            ])
          ]);
        })),

        /* 실행 순서 */
        el("h3", { class: "subhead", text: "어떤 순서로 돌아가는가" }),
        el("ol", { class: "orderlist" }, W.order.map(function (line) {
          return el("li", { text: line });
        })),

        /* 글쓰기 약속 카드는 선생님 요청으로 뺐다(2026-08-19).
           세미콜론·중괄호는 아래 «코드 검사» 가 실제로 틀렸을 때 줄 번호와 함께 짚어 준다. */
      ])
    );

    /* ================================================================ */
    /* B. 돌려 보기 (명세 17.4 B)                                        */
    /*                                                                  */
    /* ★ 한 주기(HIGH → 1000ms → LOW → 1000ms)를 «끝까지 보아야» C 가 열린다. */
    /* ================================================================ */

    var demo = makeRunner({ runMs: DEMO_RUN_MS, sensor: demoSensor() });

    /* 한 주기를 본 순간 나타나는 자리. 화면 전체를 다시 그리면 재생이 끊기므로
       이 칸만 채운다. */
    var afterBox = el("div");

    function showAfterChange() {
      if (afterBox.childNodes.length > 0) return;
      afterBox.appendChild(UI.alert("ok", W.afterRun));
      if (!state.code.learned) {
        afterBox.appendChild(
          el("div", { class: "btnrow" }, [
            UI.button("이해했어요 · 직접 만들어 보기", {
              class: "btn btn--primary btn--lg",
              click: function () {
                app.update(function (s) {
                  s.code.learned = true;
                });
              }
            })
          ])
        );
      }
    }

    var demoBody = [
      el("div", { class: "btnrow" }, [
        UI.button(code.exampleRun ? "다시 실행" : "예시 프로그램 실행", {
          click: function () {
            app.patch(function (s) {
              s.code.exampleRun = true;
            });
            UI.clear(afterBox);
            demo.run(W.code, { sensor: demoSensor(), onChange: showAfterChange });
          }
        }),
        el("p", {
          class: "btnrow__note",
          text:
            "브라우저가 코드를 그대로 실행하지 않고, 허용된 문법만 읽어 흉내 냅니다. " +
            "여기서는 보기 편하도록 안정화 1.5초 · 유지 1.5초로 «더» 줄였습니다 " +
            "(5단계에서는 " + (PC.SENSOR.warmupMs / 1000) + "초 · " + (PC.SENSOR.holdMs / 1000) + "초)."
        })
      ]),
      demo.viewHost,
      demo.panelHost,
      afterBox
    ];

    box.appendChild(
      UI.card(
        {
          eyebrow: "4단계 · B 돌려 보기",
          title: "예시 프로그램을 실행해 봅시다.",
          desc:
            "화면 속 사람이 «안정화 → 움직임 → 정지» 를 차례로 겪습니다. " +
            "센서값이 바뀌어 실행되는 줄이 옮겨 가는 것을 «한 번» 보면 아래에 만드는 칸이 열립니다."
        },
        demoBody
      )
    );

    /* 이미 한 번 돌려 본 학생에게는 «즉시» 로 다시 채워 둔다.
