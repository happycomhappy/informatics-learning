  /**
   * 케이블 색을 골라 준다 — 신호 노랑, 5V 빨강, GND 검정(명세 6.1).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("cathode") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || polarities.indexOf("plus") !== -1) return "red";
    /* 센서의 디지털 출력은 «신호» 다 — 명세 6.3 «신호 노랑» */
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  /**
   * 같은 케이블이 목록의 몇 번째인가 — 없으면 -1.
   *
   * 「이미 이어진 자리를 한 번 더 고르면 그 케이블을 지운다」 를 하려면
   * «있는가» 만으로는 모자라고 «몇 번째인가» 를 알아야 한다.
   * 두 끝의 순서는 상관없다(connectionKey 가 정렬해 둔다).
   */
  function connectionIndex(list, conn) {
    var key = connectionKey(conn);
    var found = -1;
    (list || []).forEach(function (c, i) {
      if (found === -1 && connectionKey(c) === key) found = i;
    });
    return found;
  }

  function hasConnection(list, conn) {
    return connectionIndex(list, conn) !== -1;
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.2 «전원 인가를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 17.3 A)                           */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리, 저항은 두 끝이 모두 맞기 때문이다.
   *
   * distinctFrom 이 있으면 «그 과제에서 누른 것과 다른 단자» 여야 한다.
   * 저항의 두 끝을 차례로 찾게 하려는 것이다(명세 17.3 A «저항의 두 끝»).
   */
  var FIND_TASKS = [
    {
      id: "f-motion",
      prompt:
        "센서가 보내는 «감지/미감지» 신호를 우노가 읽을 디지털 핀 «" +
        MOTION_PIN_NAME +
        "» 을 찾아 누르세요.",
      accept: [{ component: "uno", pin: MOTION_PIN_NAME }],
      why:
        MOTION_PIN_NAME +
        " 은(는) 이 회로에서 «입력» 으로 쓴다. digitalRead(" +
        MOTION_PIN_NAME.slice(1) +
        ") 이 이 핀의 HIGH/LOW 를 읽는다."
    },
    {
      id: "f-led-pin",
      prompt: "LED 를 켜고 끌 신호를 «내보낼» 디지털 핀 «" + LED_PIN_NAME + "» 을 찾아 누르세요.",
      accept: [{ component: "uno", pin: LED_PIN_NAME }],
      why:
        LED_PIN_NAME +
        " 은(는) «출력» 으로 쓴다. HIGH 면 5V, LOW 면 0V 를 내보낸다. " +
        MOTION_PIN_NAME +
        " 과 역할이 다르므로 바꿔 꽂으면 안 된다."
    },
    {
      id: "f-pir-vcc",
      prompt: "PIR 모듈에서 «VCC» 라고 인쇄된 다리를 찾아 누르세요.",
      accept: [{ component: "pir", pin: "VCC" }],
      why: "VCC 는 모듈이 동작할 전원을 받는 다리다. 우노의 5V 로 간다."
    },
    {
      id: "f-pir-do",
      prompt: "PIR 모듈에서 «OUT»(모듈에 따라 DO) 이라고 인쇄된 다리를 찾아 누르세요.",
      accept: [{ component: "pir", pin: "DO" }],
      why:
        "OUT 은 센서가 «판정 결과» 를 내보내는 디지털 출력이다. 감지하면 HIGH, 아니면 LOW 다. " +
        "이 다리는 우노의 입력 핀(" + MOTION_PIN_NAME + ")으로 간다."
    },
    {
      id: "f-pir-gnd",
      prompt: "PIR 모듈에서 «GND» 라고 인쇄된 다리를 찾아 누르세요.",
      accept: [{ component: "pir", pin: "GND" }],
      why:
        "GND 는 센서와 우노가 «같은 기준» 을 쓰게 해 준다. 이 선이 없으면 " +
        "OUT 의 HIGH·LOW 를 우노가 옳게 읽을 수 없다."
    },
    {
      id: "f-led-a",
      prompt: "LED 의 «긴 다리(양극 A)» 를 찾아 누르세요. 몸통의 둥근 쪽입니다.",
      accept: [{ component: "led", pin: "A" }],
      why: "긴 다리가 양극(A)이다. 저항을 거쳐 " + LED_PIN_NAME + " 쪽으로 간다."
    },
    {
      id: "f-led-k",
      prompt: "LED 의 «짧은 다리(음극 K)» 를 찾아 누르세요. 몸통의 «평평한 면» 쪽입니다.",
      accept: [{ component: "led", pin: "K" }],
      why: "짧은 다리가 음극(K)이다. 몸통 옆면이 평평한 쪽이라 다리를 잘라도 알아볼 수 있다. GND 쪽으로 간다."
    },
    {
      id: "f-res",
      prompt: RESISTOR_OHM + "Ω 저항의 «한쪽 끝» 을 누르세요.",
      accept: [
        { component: "res", pin: "P1" },
        { component: "res", pin: "P2" }
      ],
      why:
        "저항은 방향이 없다. 어느 쪽 끝을 " + LED_PIN_NAME + " 에 붙여도 같다. " +
        "몸통에 적힌 " + RESISTOR_OHM + "Ω 글자로 값을 확인한다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    signal: "센서의 디지털 출력 단자",
    anode: "LED 양극(긴 다리)",
    cathode: "LED 음극(짧은 다리)",
    lead: "저항의 끝",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.2 · 18.2) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   *   history : { 과제id: 누른 단자 } — «반대쪽 끝» 을 가려내는 데 쓴다
   *
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId, history) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit && task.distinctFrom) {
      var before = (history || {})[task.distinctFrom];
      if (before && before === componentId + "/" + pinId) {
        return {
          ok: false,
          done: false,
          kind: "wrong",
          message: "방금 누른 끝과 «같은» 자리입니다. 저항의 반대쪽 끝을 눌러 주세요."
        };
      }
    }

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — LED 회로 결선과 경로 판정 (명세 17.3 B · 18.1)            */
  /* ------------------------------------------------------------------ */

  /**
   * «소자» 목록 — 케이블과 달리 마디를 합치지 않고 «걸쳐» 있다(명세 18.1).
   * LED 만 방향이 있다. 저항은 어느 쪽으로 지나도 같다.
   */
  var DEVICES = [
    { id: "res", kind: "resistor", ohm: RESISTOR_OHM, a: "res:P1", b: "res:P2", directional: false },
    { id: "led", kind: "led", ohm: 0, a: "led:A", b: "led:K", directional: true }
  ];

  var SOURCE_NODE = "uno:" + LED_PIN_NAME;
  var SINK_NODE = "uno:GND";

  /**
   * 두 마디 사이의 «소자를 건너는 길» 을 모두 찾는다.
   *   block : 이 소자는 건너지 않는다 (LED 를 뺀 채 전·후반을 따로 보려는 것)
   *
   * 소자가 둘뿐이라 길이 아주 짧다. 그래서 모두 훑어도 값이 싸다.
   * 돌려주는 것 : [[{ id, kind, dir, ohm }], ...]
   */
  function pathsBetween(net, fromNode, toNode, block) {
    var from = net.find(fromNode);
    var to = net.find(toNode);
    var found = [];
    if (from === to) return [[]]; /* 소자를 거치지 않고 이미 이어져 있다 */

    var used = {};
    var steps = [];

    function walk(node) {
      if (steps.length > DEVICES.length) return;
      DEVICES.forEach(function (d) {
        if (used[d.id] || d.id === block) return;
        var ra = net.find(d.a);
        var rb = net.find(d.b);
        /* 두 다리가 같은 마디면 «건널» 수 없다. 소자 양단이 단락된 것이다(명세 18.2). */
        if (ra === rb) return;

        var next = null;
        var dir = "";
        if (ra === node) {
          next = rb;
          dir = "forward";
        } else if (rb === node) {
          next = ra;
          dir = "reverse";
        }
        if (next === null) return;

        used[d.id] = true;
        steps.push({ id: d.id, kind: d.kind, dir: dir, ohm: d.ohm });
        if (next === to) found.push(steps.slice());
        else walk(next);
        steps.pop();
        used[d.id] = false;
      });
    }

    walk(from);
    return found;
  }

  function resistorsIn(steps) {
    return (steps || []).filter(function (s) {
      return s.kind === "resistor";
    });
  }

  function ohmsIn(steps) {
    return resistorsIn(steps).reduce(function (sum, s) {
      return sum + (s.ohm || 0);
    }, 0);
  }

  /**
   * 회로를 전기적으로 읽어 낸다 (명세 18.1 «부품 경로 검사 결과»).
   *
   * 돌려주는 것
   *   { sourcePin, sinkPin, hasResistor, resistanceOhm, ledDirection, shortCircuit, ... }
   *
   * ★ 앞뒤를 «따로» 본다.
   *   LED 를 뺀 채  D8 → LED 양극 과  LED 음극 → GND 를 나누어 보면
   *   GND 만 빠뜨린 학생에게 «양극이 틀렸다» 는 엉뚱한 말을 하지 않는다.
   */
  function analyze(connections) {
    var net = solve(connections);
    var src = net.find(SOURCE_NODE);
    var sink = net.find(SINK_NODE);

    /* D8 과 GND 가 소자 없이 곧바로 이어졌는가 */
    var directShort = src === sink;

    /* LED 두 다리가 같은 마디 — 양단 전압 0V (명세 18.2) */
    var ledLegsSameNode = net.find("led:A") === net.find("led:K");
    var resLegsSameNode = net.find("res:P1") === net.find("res:P2");

    /* 바른 방향 : D8 → (저항) → A ,  K → (저항) → GND */
    var toAnode = pathsBetween(net, SOURCE_NODE, "led:A", "led");
    var fromCathode = pathsBetween(net, "led:K", SINK_NODE, "led");

    /* 거꾸로 꽂았을 때 : D8 → K ,  A → GND */
    var toCathode = pathsBetween(net, SOURCE_NODE, "led:K", "led");
    var fromAnode = pathsBetween(net, "led:A", SINK_NODE, "led");

    function best(list) {
      /* 저항이 있는 길을 먼저 고른다 — 학생이 저항을 «어딘가에» 넣었다면 그것을 본다 */
      var withRes = list.filter(function (p) {
        return resistorsIn(p).length > 0;
      });
      if (withRes.length > 0) return withRes[0];
      return list.length > 0 ? list[0] : null;
    }

    /**
     * 방향은 «LED 가 어느 쪽을 보고 꽂혔는가» 다.
     * 회로가 아직 완성되지 않았어도 정해진다 — GND 를 빠뜨린 학생에게
     * «극성도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
     */
    var anodeSide = toAnode.length > 0; /* D8 → A */
    var cathodeSide = toCathode.length > 0; /* D8 → K */
    var anodeGnd = fromAnode.length > 0; /* A → GND */
    var cathodeGnd = fromCathode.length > 0; /* K → GND */

    var direction = "none";
    if (!ledLegsSameNode) {
      if (anodeSide && !cathodeSide) direction = "forward";
      else if (cathodeSide && !anodeSide) direction = "reverse";
      else if (cathodeGnd && !anodeGnd) direction = "forward";
      else if (anodeGnd && !cathodeGnd) direction = "reverse";
    }

    /* 한 바퀴가 «닫혔는가» — 방향과 따로 본다 */
    var connectedPath =
      !ledLegsSameNode &&
      ((direction === "forward" && anodeSide && cathodeGnd) ||
        (direction === "reverse" && cathodeSide && anodeGnd));

    /* 반쪽씩 따로 고른다. 그래야 한쪽만 이어진 회로에서도 저항을 셀 수 있다. */
    var head = direction === "reverse" ? best(toCathode) : best(toAnode);
    var tail = direction === "reverse" ? best(fromAnode) : best(fromCathode);

    var steps = (head || []).concat(tail || []);
    var resistors = resistorsIn(steps);

    /* 저항이 LED «앞» 에 있는지 «뒤» 에 있는지 — 둘 다 정답이지만 말로 옮길 때는 갈라야 한다 */
    var resistorSide = "none";
    if (resistorsIn(head || []).length > 0) resistorSide = "head";
    else if (resistorsIn(tail || []).length > 0) resistorSide = "tail";

    return {
      sourcePin: LED_PIN_NAME,
      sinkPin: "GND",
      /* 각 반쪽이 이어졌는가 — 점검 항목이 이 값을 그대로 쓴다 */
      anodeFromSource: anodeSide,
      cathodeToGround: cathodeGnd,
      cathodeFromSource: cathodeSide,
      anodeToGround: anodeGnd,
      /* 명세 18.1 의 «부품 경로 검사 결과» 항목들 */
      ledDirection: direction,
      hasResistor: resistors.length > 0,
      resistanceOhm: ohmsIn(steps),
      resistorCount: resistors.length,
      resistorSide: resistorSide,
      shortCircuit: directShort,
      /* 그 밖의 진단 */
      ledLegsSameNode: ledLegsSameNode,
      resLegsSameNode: resLegsSameNode,
      connected: connectedPath,
      open: !connectedPath && !directShort,
      /* 실제로 불이 켜질 조건 : 한 바퀴가 닫히고 + 바른 방향 + 저항 + 단락 아님 */
      wouldLight: connectedPath && direction === "forward" && resistors.length > 0 && !directShort
    };
  }

  /**
   * ★ PIR 세 줄이 옳게 꽂혔는가 (명세 6.3 «정답 그래프» 의 앞 세 줄)
   *
   *   5V → PIR VCC · GND → PIR GND · D7 → PIR DO
   *
   * LED 처럼 «전류의 길» 을 찾지 않는다. 모듈은 소자가 아니라 부품이므로
   * «두 자리가 같은 마디인가» 만 본다. 브레드보드를 몇 번 거쳐 가도 좋다.
   *
   * ★ 잘못 꽂은 꼴을 «서로 다른 원인» 으로 갈라 둔다.
   *   역결선(VCC↔GND)·출력을 전원에 직접·D7/D8 교차는 고칠 곳이 저마다 다르다.
   */
  function pirWiring(connections) {
    var net = solve(connections);

    var vcc = net.find("pir:VCC");
    var gnd = net.find("pir:GND");
    var out = net.find("pir:DO");

    var n5v = net.find("uno:5V");
    var nGnd = net.find("uno:GND");
    var nMotion = net.find("uno:" + MOTION_PIN_NAME);
    var nLedPin = net.find("uno:" + LED_PIN_NAME);

    /* LED 쪽 부품(LED·저항)의 다리가 D7 에 닿아 있는가 — D7/D8 교차를 가려낸다 */
    var ledSideOnMotion = ["led:A", "led:K", "res:P1", "res:P2"].some(function (node) {
      return net.find(node) === nMotion;
    });

    return {
      /* 옳게 꽂힌 세 줄 */
      vccTo5V: vcc === n5v,
      gndToGround: gnd === nGnd,
      outToMotion: out === nMotion,
      /* ① 전원·접지 역결선 */
      vccToGround: vcc === nGnd,
      gndTo5V: gnd === n5v,
      /* ② 출력 다리를 전원이나 접지에 곧바로 이었다 */
      outToPower: out === n5v || out === nGnd,
      /* ③ D7/D8 교차 — 회로는 이어지지만 «역할» 이 뒤바뀐다 */
      outToLedPin: out === nLedPin,
      ledSideOnMotion: ledSideOnMotion,
      swapped: out === nLedPin && ledSideOnMotion,
      /* 케이블이 하나도 닿지 않은 다리 */
      unwired: PIR.pins
        .filter(function (pin) {
          return !isWired(connections, "pir", pin.id);
        })
        .map(function (pin) {
          return pin.short;
        })
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "sensor" : PIR 의 VCC·OUT 에 닿는 쪽   (센서를 살리고 값을 보내는 길)
   *   "source" : D8 에서 LED 까지 가는 쪽    (신호가 나가는 길)
   *   "ground" : GND 로 돌아오는 쪽          (센서와 LED 가 함께 쓰는 기준)
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 양쪽이 붙어 버린 경우(단락)
   *
   *   ★ LED 를 «건너지 않고» 어느 끝에 닿는지로 가른다.
   *     그래서 저항이 LED 앞에 있든 뒤에 있든 저마다 옳은 쪽 색을 받는다.
   *     - 저항이 앞이면  D8–저항–LED긴다리 가 모두 source
   *     - 저항이 뒤면    LED짧은다리–저항–GND 가 모두 ground
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.1).
   *     그래서 이 함수는 checkCircuit·analyze 어디에서도 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";
      var root = net.find(node);

      /**
       * ★ 센서 쪽을 먼저 가른다.
       *
       *   PIR 의 VCC·OUT 은 «LED 전류의 길이 아니다». 그렇다고 «쓰이지 않는» 것도 아니다.
       *   둘을 한 색으로 묶으면 학생은 제 손으로 이은 센서 선을 «빠진 선» 으로 읽는다.
       *   그래서 센서 쪽에 이름과 색을 따로 준다.
       *
       *   GND 는 센서와 LED 가 «함께 쓰는» 마디다. 그래서 GND 에 닿은 선은
       *   센서 쪽이 아니라 «GND 쪽» 으로 적는다 — 그것이 사실이기 때문이다.
       */
      if (root === net.find("pir:VCC") || root === net.find("pir:DO")) return "sensor";

      var toSource = pathsBetween(net, node, SOURCE_NODE, "led").length > 0;
      var toGround = pathsBetween(net, node, SINK_NODE, "led").length > 0;

      if (toSource && !toGround) return "source";
      if (toGround && !toSource) return "ground";
      return "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * «반쯤 꽂힌» 부품의 다리 — 한쪽 다리는 이었는데 다른 쪽이 비어 있는 것.
   *
   * LED 의 A·K 는 여기서 세지 않는다. 그 둘은 극성 항목(c-anode·c-cathode)이 이미
   * 정확히 짚어 주므로, 같은 실수를 두 항목이 겹쳐 나무라면 무엇을 고쳐야 할지 흐려진다.
   */
  function danglingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      /* LED 의 A·K 와 PIR 의 세 다리는 «저마다 전용 항목» 이 이미 정확히 짚어 준다.
         같은 실수를 두 항목이 겹쳐 나무라면 무엇을 고쳐야 할지 흐려진다. */
      if (part.id === "led" || part.id === "pir") return;
      var wired = part.pins.filter(function (pin) {
        return isWired(connections, part.id, pin.id);
      });
      if (wired.length === 0 || wired.length === part.pins.length) return;
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 17.3 C «불필요한 케이블이 없는가»)
   * 양쪽 끝이 모두 «회로에 쓰이는 마디 밖» 인 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    /* 경로에 쓰이는 마디들 */
    var live = {};
    [
      SOURCE_NODE,
      SINK_NODE,
      "uno:5V",
      "uno:" + MOTION_PIN_NAME,
      "led:A",
      "led:K",
      "res:P1",
      "res:P2",
      "pir:VCC",
      "pir:DO",
      "pir:GND"
    ].forEach(function (n) {
      live[net.find(n)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 6.3 «회로 점검은 충족 항목과 미충족 항목을 텍스트로 제공한다»)
   *
   * 다섯 경로 + 안전·정리 두 가지 = 일곱 항목이다.
   * 항목마다 «서로 겹치지 않는» 한 가지만 본다. 하나를 빠뜨렸을 때 여러 줄이
   * 한꺼번에 빨개지면 어디부터 고쳐야 할지 알 수 없다.
   *
   * 힌트는 세 단계로 올라간다(명세 6.3 «단계적 힌트»).
   *   ① 생각할 물음  ② 어디를 볼지  ③ 무엇을 이을지
   * ★ 정답선을 «그려 주지는» 않는다.
   */
  var REQUIRED = [
    {
      id: "c-pir-vcc",
      label: "PIR 의 VCC 가 우노 5V 와 이어진다",
      role: "센서 전원",
      hints: [
        "센서도 전기를 먹는 부품입니다. 모듈이 동작하려면 무엇이 필요할까요?",
        "PIR 모듈에 인쇄된 «VCC» 글자를 찾으세요. 우노에서 5V 를 내주는 핀은 POWER 무리에 있습니다.",
        "PIR 의 VCC 를 우노의 5V 에 이으세요. 브레드보드의 + 레일을 거쳐도 됩니다."
      ]
    },
    {
      id: "c-pir-gnd",
      label: "PIR 의 GND 가 우노 GND 마디와 이어진다",
      role: "기준 맞추기",
      hints: [
        "센서가 «HIGH» 라고 보내는 신호는 무엇을 기준으로 한 5V 일까요?",
        "센서와 우노가 같은 기준(0V)을 써야 합니다. 우노에는 GND 가 세 곳 있습니다.",
        "PIR 의 GND 를 우노의 GND 핀(세 곳 중 아무 곳)에 이으세요."
      ]
    },
    {
      id: "c-pir-do",
      label: "PIR 의 OUT(DO) 이 우노 " + MOTION_PIN_NAME + " 과 이어진다",
      role: "센서 입력",
      hints: [
        "DO 는 센서의 디지털 출력입니다. Arduino 에서 입력으로 읽을 핀은 무엇인가요?",
        "센서가 «내보내는» 것을 우노가 «읽습니다». 읽는 쪽은 " +
          MOTION_PIN_NAME + " 이고, 내보내는 쪽은 " + LED_PIN_NAME + " 입니다.",
        "PIR 의 OUT(DO) 을 우노의 " + MOTION_PIN_NAME + " 에 이으세요."
      ]
    },
    {
      id: "c-resistor",
      label: LED_PIN_NAME + " → LED → GND 경로에 " + RESISTOR_OHM + "Ω 저항이 있다",
      role: "전류 제한",
      hints: [
        "LED 에 전류가 너무 많이 흐르면 어떻게 될까요? 그것을 막는 부품은 무엇인가요?",
        RESISTOR_OHM + "Ω 저항의 두 끝을 보세요. 한 끝은 " + LED_PIN_NAME + " 쪽, 다른 끝은 LED 쪽으로 갑니다.",
        LED_PIN_NAME + " 과 LED 긴 다리 사이에 저항을 «끼워» 이으세요. 저항을 LED 음극과 GND 사이에 두어도 됩니다."
      ]
    },
    {
      id: "c-anode",
      label: "LED 긴 다리 A(+)가 " + LED_PIN_NAME + " 쪽을 향한다",
      role: "극성",
      hints: [
        "LED 는 전류가 한쪽으로만 흐릅니다. 전류가 «들어가는» 다리는 긴 다리일까요, 짧은 다리일까요?",
        "LED 몸통에서 평평하지 «않은» 쪽 다리가 긴 다리 A 입니다.",
        LED_PIN_NAME + " 에서 (저항을 거쳐) LED 의 긴 다리 A 로 이어지게 하세요."
      ]
    },
    {
      id: "c-cathode",
      label: "LED 짧은 다리 K(−)가 GND 마디와 이어진다",
      role: "귀환 경로",
      hints: [
        "전류가 LED 를 지난 뒤에는 어디로 돌아가야 할까요?",
        "LED 몸통의 «평평한 면» 쪽 다리가 짧은 다리 K 입니다. 우노에는 GND 가 세 곳 있습니다.",
        "LED 짧은 다리 K 를 우노의 GND 핀(세 곳 중 아무 곳)에 이으세요."
      ]
    },
    {
      id: "c-noshort",
      label: "5V·" + LED_PIN_NAME + " 과 GND 가 곧바로 이어지지 않았다",
      role: "안전",
      hints: [
        "부품을 하나도 거치지 않고 전원(또는 출력 핀)과 GND 를 이으면 무슨 일이 생길까요?",
        "5V–GND 를 바로 잇는 케이블, " + LED_PIN_NAME + "–GND 를 바로 잇는 케이블이 있는지 케이블 목록에서 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우세요. 사이에는 반드시 부품이 있어야 합니다."
      ]
    },
    {
      id: "c-tidy",
      label: "떠 있는 단자나 쓸모없는 케이블이 없다",
      role: "정리",
      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 길로는 전류가 흐를 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 다리를 찾아보세요.",
        "쓰지 않는 케이블은 지우고, PIR 세 다리와 LED·저항의 네 다리를 모두 회로에 이으세요."
      ]
    }
  ];

  /**
   * 회로 점검 (명세 6.3)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, pir, floating, stray, powered }
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var pir = pirWiring(connections);
    var floating = floatingLeads(connections);
    var dangling = danglingLeads(connections);
    var stray = strayWires(connections);

    /**
     * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
     *   두 단자가 단락되어 있거나 LED 두 다리가 한 마디면, 극성이 옳은지 그른지를
     *   전기적으로 «말할 수 없다». 그때 ✗ 를 찍으면 «극성도 틀렸다» 는 거짓말이 된다.
     *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
     */
    var tangled = a.shortCircuit || net.shorted || a.ledLegsSameNode;
    var ledUnreachable = !a.anodeFromSource && !a.cathodeFromSource;

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var unreachableWhy = LED_PIN_NAME + " 과 LED 를 먼저 이으면 판정합니다";

    var results = {
      /* ── PIR 세 줄 ── */
      "c-pir-vcc": { ok: pir.vccTo5V, blocked: net.shorted, why: tangledWhy },
      "c-pir-gnd": { ok: pir.gndToGround, blocked: net.shorted, why: tangledWhy },
      "c-pir-do": { ok: pir.outToMotion, blocked: false, why: "" },
      /* ── LED 두 줄 ── */
      "c-resistor": {
        ok: a.hasResistor,
        blocked: tangled || ledUnreachable,
        why: tangled ? tangledWhy : unreachableWhy
      },
      "c-anode": {
        ok: a.anodeFromSource && !a.cathodeFromSource,
        /* D8 에서 LED 까지 닿지 않았으면 «어느 다리가 D8 쪽인지» 를 말할 수 없다.
           D7/D8 을 뒤바꿔 꽂은 학생이 여기에 걸린다 — 위험 상자가 진짜 원인을 짚는다. */
        blocked: tangled || ledUnreachable,
        why: tangled ? tangledWhy : unreachableWhy
      },
      "c-cathode": {
        ok: a.cathodeToGround && !a.anodeToGround,
        blocked: tangled,
        why: tangledWhy
      },
      /* ── 안전·정리 ── */
      "c-noshort": { ok: !a.shortCircuit && !net.shorted, blocked: false, why: "" },
      "c-tidy": {
        ok: dangling.length === 0 && stray.length === 0 && pir.unwired.length === 0,
        blocked: false,
        why: ""
      }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: req.label,
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 5V 레일을 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted || a.shortCircuit,
      analysis: a,
      pir: pir,
      floating: floating,
      dangling: dangling,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 세 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).
   *   펼치면 세 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   *
   *   done 은 «그 두 자리가 이어졌는가» 만 본다. 브레드보드를 몇 번 거쳐 가도,
   *   구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   */
  var GOAL = [
    { id: "g1", from: "uno:5V", to: "pir:VCC", alt: null,
      fromText: "우노 5V", toText: "PIR VCC" },
    { id: "g2", from: SINK_NODE, to: "pir:GND", alt: null,
      fromText: "우노 GND", toText: "PIR GND" },
    { id: "g3", from: "uno:" + MOTION_PIN_NAME, to: "pir:DO", alt: null,
      fromText: "우노 " + MOTION_PIN_NAME, toText: "PIR OUT(DO)" },
    { id: "g4", from: SOURCE_NODE, to: "res:P1", alt: "res:P2",
      fromText: "우노 " + LED_PIN_NAME, toText: RESISTOR_OHM + "Ω 저항 한쪽 다리" },
    { id: "g5", from: "res:P2", to: "led:A", alt: "res:P1",
      fromText: RESISTOR_OHM + "Ω 저항 다른쪽 다리", toText: "LED 긴 다리 A(+)" },
    { id: "g6", from: "led:K", to: SINK_NODE, alt: null,
      fromText: "LED 짧은 다리 K(−)", toText: "우노 GND" }
  ];

  /**
   * ★ 한 줄 글은 «두 칸에서 만들어 쓴다».
   *
   *   접어 둔 목록은 「우노 5V ↔ PIR VCC」 한 줄로 보이고,
   *   [정답 확인] 표는 「한쪽 | 다른쪽」 두 칸으로 보인다.
   *   두 곳에 따로 적으면 한쪽만 고쳤을 때 서로 다른 말을 하게 된다.
   */
  GOAL.forEach(function (g) {
    g.label = g.fromText + " ↔ " + g.toText;
  });

  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      var done = net.connected(net.find(g.from), net.find(g.to));
      if (!done && g.alt) {
        /* 저항을 뒤집어 꽂았어도 같은 회로다 */
        done =
          (g.id === "g4" && net.connected(net.find(g.from), net.find(g.alt))) ||
          (g.id === "g5" && net.connected(net.find(g.alt), net.find(g.to)));
      }
      /* 두 칸을 함께 넘긴다 — 접은 목록은 label 을, [정답 확인] 표는 두 칸을 쓴다 */
      return { id: g.id, label: g.label, fromText: g.fromText, toText: g.toText, ok: done };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 세 줄과 다르다 = «다르게 이었지만 맞다» */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);
    var pir = pirWiring(connections);

    /* ── ① 센서 쪽 세 줄 ── */
    var sensor = [];
    if (pir.vccTo5V) sensor.push("VCC↔5V");
    if (pir.gndToGround) sensor.push("GND↔GND");
    if (pir.outToMotion) sensor.push("OUT↔" + MOTION_PIN_NAME);
    var sensorText =
      sensor.length === 3
        ? "PIR 세 줄이 모두 이어졌습니다 (" + sensor.join(" · ") + ")."
        : sensor.length === 0
        ? "PIR 세 줄이 아직 이어지지 않았습니다."
        : "PIR 은 " + sensor.join(" · ") + " 까지 이어졌습니다.";

    /* ── ② LED 쪽 ── */
    /* 저항은 «실제로 있는 자리» 에 적는다. 앞뒤 어느 쪽이든 정답이지만
       그린 대로 되비추어야 학생이 자기 회로를 알아본다. */
    var resHead = a.hasResistor && a.resistorSide === "head" ? " → " + a.resistanceOhm + "Ω 저항" : "";
    var resTail = a.hasResistor && a.resistorSide === "tail" ? " → " + a.resistanceOhm + "Ω 저항" : "";

    var ledText;
    if (a.shortCircuit) {
      ledText = LED_PIN_NAME + " 과 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    } else if (a.ledLegsSameNode) {
      ledText = "LED 의 두 다리가 같은 마디에 있습니다. 양단 전압이 0V 라 전류가 LED 를 지나지 않습니다.";
    } else if (a.ledDirection === "none") {
      ledText = LED_PIN_NAME + " 에서 LED 로 가는 길이 아직 없습니다.";
    } else {
      var head = a.ledDirection === "forward" ? "LED 긴 다리 A(+)" : "LED 짧은 다리 K(−)";
      var tail = a.ledDirection === "forward" ? "LED 짧은 다리 K(−)" : "LED 긴 다리 A(+)";

      if (!a.connected) {
        ledText =
          LED_PIN_NAME + resHead + " → " + head + " 까지 이어졌습니다. " +
          tail + " 에서 GND 로 가는 길이 아직 없습니다.";
      } else {
        var path = LED_PIN_NAME + resHead + " → " + head + " → " + tail + resTail + " → GND. ";
        if (a.ledDirection === "reverse") ledText = path + "한 바퀴는 닫혔지만 LED 가 «거꾸로» 꽂혀 있습니다.";
        else if (!a.hasResistor) ledText = path + "한 바퀴는 닫혔지만 저항이 없습니다.";
        else ledText = path + "한 바퀴가 닫혔습니다.";
      }
    }

    return sensorText + " " + ledText;
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다 — 명세 18.2) */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결과 대표 오류 (명세 6.2 · 18.2)                            */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 부품이 늘어도 이 배열에 한 줄 더하면 되고
   * 판정 코드는 그대로다.
   *
   * ★ 오류를 «뭉뚱그리지 않는다»(명세 12장 마지막 줄 · 29장 6번).
   *   역극성은 «꺼짐», 무저항은 «과전류 위험», GND 누락은 «열린 회로» 로 서로 다르다.
   */
  var DANGER_RULES = [
    {
      code: "pir-reversed",
      title: "PIR 전원·접지 역결선",
      effect: "센서 손상 위험 — 전원 차단",
      /* 5V–GND 가 단락되어 있으면 세 마디가 하나로 뭉쳐 «역결선인지» 를 말할 수 없다.
         그때는 아래 short-5v-gnd 하나만 짚는다. 고칠 곳이 둘로 보이지 않게. */
      test: function (ctx) {
        if (ctx.net.shorted) return false;
        return ctx.pir.vccToGround || ctx.pir.gndTo5V;
      },
      detail:
        "PIR 의 VCC 를 GND 에, 또는 GND 를 5V 에 이었습니다. 모듈에 인쇄된 글자와 반대입니다. " +
        "이대로 전원을 넣으면 센서 안의 회로가 상할 수 있습니다.",
      fix: "PIR 모듈에 인쇄된 VCC·GND 글자를 다시 읽고, VCC 는 5V, GND 는 GND 에 이으세요."
    },
    {
      code: "pir-out-to-power",
      title: "PIR 출력(OUT)을 전원·접지에 직접 연결",
      effect: "센서 출력단 손상 위험 — 전원 차단",
      test: function (ctx) {
        if (ctx.net.shorted) return false;
        return ctx.pir.outToPower;
      },
      detail:
        "OUT(DO) 은 센서가 «내보내는» 다리입니다. 이것을 5V 나 GND 에 곧바로 이으면 " +
        "센서가 내보내는 값과 전원이 맞붙어 출력단이 상할 수 있습니다.",
      fix: "OUT(DO) 은 우노의 " + MOTION_PIN_NAME + " 처럼 «읽는» 핀에만 이으세요."
    },
    {
      code: "pins-swapped",
      title: "센서 입력과 LED 출력이 뒤바뀜",
      effect: "회로는 이어지지만 프로그램대로 동작하지 않는다",
      test: function (ctx) {
        return ctx.pir.swapped;
      },
      detail:
        "센서 입력과 LED 출력 역할이 뒤바뀌었습니다. PIR 의 OUT 이 " + LED_PIN_NAME +
        " 에, LED 쪽이 " + MOTION_PIN_NAME + " 에 이어져 있습니다. " +
        MOTION_PIN_NAME + " 은 «읽는» 핀이고 " + LED_PIN_NAME + " 은 «내보내는» 핀이므로 " +
        "서로 바꿔 꽂으면 센서값을 읽을 수도, LED 를 켤 수도 없습니다.",
      fix:
        "PIR 의 OUT 을 " + MOTION_PIN_NAME + " 으로, 저항·LED 쪽을 " + LED_PIN_NAME +
        " 으로 옮겨 이으세요."
    },
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      effect: "전원 차단",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      code: "short-pin-gnd",
      title: LED_PIN_NAME + "–GND 직접 연결",
      effect: "단락, 전원 차단",
      test: function (ctx) {
        return ctx.analysis.shortCircuit;
      },
      detail:
        LED_PIN_NAME +
        " 과 GND 가 부품을 하나도 거치지 않고 이어졌습니다. 출력 핀이 곧바로 접지로 흘러 " +
        "보드의 출력 회로가 상할 수 있습니다.",
      fix: LED_PIN_NAME + " 과 GND 를 바로 잇는 케이블을 지우고, 사이에 저항과 LED 를 넣으세요."
    },
    {
      code: "led-no-resistor",
      title: "LED 무저항 연결",
      effect: "과전류 위험 — 전원 차단",
      /**
       * ★ «D8 에서 LED 까지 실제로 닿았는데» 저항이 없을 때만 짚는다.
       *
       *   D7/D8 을 뒤바꿔 꽂은 학생은 D8 에서 LED 로 가는 길이 아예 없다.
       *   그때 «저항이 없다» 고까지 말하면 고칠 곳이 둘로 보인다.
       *   그 경우는 위의 pins-swapped 가 한 가지 원인으로 짚어 준다.
       */
      test: function (ctx) {
        var a = ctx.analysis;
        if (!a.anodeFromSource && !a.cathodeFromSource) return false;
        return !a.hasResistor;
      },
      detail:
        "LED 에 저항 없이 " + LED_PIN_NAME + " 이 이어졌습니다. 전류를 막는 것이 없어 " +
        "LED 에 견딜 수 있는 것보다 훨씬 큰 전류가 흐릅니다. LED 가 곧 타 버리고 보드도 상합니다.",
      fix: LED_PIN_NAME + " 과 LED 사이(또는 LED 와 GND 사이)에 " + RESISTOR_OHM + "Ω 저항을 직렬로 넣으세요."
    },
    {
      code: "led-reversed",
      title: "LED 역극성",
      effect: "전류가 흐르지 않아 꺼짐",
      test: function (ctx) {
        return ctx.analysis.ledDirection === "reverse";
      },
      detail:
        "LED 의 긴 다리 A(+)와 짧은 다리 K(−)가 뒤바뀌었습니다. LED 는 전류를 한 방향으로만 흘리므로 " +
        "이 상태에서는 전류가 «흐르지 않아» 불이 켜지지 않습니다. 타지는 않지만 동작하지도 않습니다.",
      fix: "LED 를 돌려 꽂아 긴 다리 A 를 " + LED_PIN_NAME + " 쪽으로, 짧은 다리 K 를 GND 쪽으로 두세요."
    },
    {
      code: "led-legs-shorted",
      title: "LED 두 다리가 같은 마디",
      effect: "양단 전압 0V — 꺼짐",
      test: function (ctx) {
        return ctx.analysis.ledLegsSameNode;
      },
      detail:
        "LED 의 두 다리가 같은 마디에 있습니다. 브레드보드의 «같은 열» 에 두 다리를 꽂으면 이렇게 됩니다. " +
        "양단 전압이 0V 라 전류가 LED 를 지나지 않고 옆으로 새어 갑니다.",
      fix: "브레드보드는 가운데 홈을 사이에 두고 열이 나뉩니다. 두 다리를 «서로 다른 열» 에 꽂으세요."
    },
    {
      code: "reverse-rail",
      title: "전원·접지 역결선",
      effect: "부품 손상 위험",
      test: function (ctx) {
        var bad = false;
        ctx.connections.forEach(function (c) {
          var a = terminal(c.fromComponent, c.fromPin);
          var b = terminal(c.toComponent, c.toPin);
          if (!a || !b) return;

          var ends = [
            { pin: a, comp: c.fromComponent },
            { pin: b, comp: c.toComponent }
          ];
          var unoEnd = ends.filter(function (e) {
            return e.comp === "uno";
          })[0];
          var railEnd = ends.filter(function (e) {
            return e.pin.kind === "rail";
          })[0];
          if (!unoEnd || !railEnd) return;

          if (unoEnd.pin.id === "5V" && railEnd.pin.polarity === "minus") bad = true;
          if (unoEnd.pin.kind === "ground" && railEnd.pin.polarity === "plus") bad = true;
        });
        return bad;
      },
      detail:
        "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다.",
      fix: "빨간 줄(+) 에는 5V 를, 파란 줄(−) 에는 GND 를 연결하세요."
    }
  ];

  /**
   * 위험·오류 연결을 모두 찾는다.
   * 「전원을 막는 것」과 「켜지지 않을 뿐인 것」을 함께 돌려주되 effect 로 구분한다.
   */
  function dangers(connections) {
    var ctx = {
      connections: connections || [],
      net: solve(connections),
      analysis: analyze(connections),
      pir: pirWiring(connections)
    };
    return DANGER_RULES.filter(function (rule) {
      return rule.test(ctx);
    }).map(function (rule) {
      return {
        code: rule.code,
        title: rule.title,
        effect: rule.effect,
        detail: rule.detail,
        fix: rule.fix
      };
    });
  }

  /** 전원을 켜도 되는가 — 위험이 하나라도 있으면 막는다(명세 6.2) */
  function canPowerOn(connections) {
    var found = dangers(connections);
    var check = checkCircuit(connections);
    if (found.length > 0) return { ok: false, reason: "danger", dangers: found, check: check };
    if (!check.ok) return { ok: false, reason: "incomplete", dangers: [], check: check };
    return { ok: true, reason: "", dangers: [], check: check };
  }

  /**
   * 지금 회로와 핀 상태에서 LED 가 켜지는가 (명세 6.3 · 18.2)
   *
   *   high : 코드가 D8 을 HIGH 로 두었는가
   *
   * 돌려주는 것 : { on, reason, text }
   * 색만으로 알리지 않으려고 «글» 도 함께 돌려준다(명세 13장).
   */
  function ledState(connections, high) {
    var a = analyze(connections);

    if (a.shortCircuit) return { on: false, reason: "short", text: "단락 — 전원이 차단되었습니다." };
    if (a.ledLegsSameNode) {
      return { on: false, reason: "legs-shorted", text: "LED 양단이 같은 마디라 전압이 0V 입니다." };
    }
    /* ★ 방향이 옳아도 «한 바퀴가 닫히지» 않았으면 전류는 흐르지 않는다.
       GND 를 빠뜨린 회로가 여기에 걸린다(명세 18.2 «GND 누락 → 열린 회로»). */
    if (!a.connected) {
      return { on: false, reason: "open", text: "회로가 끊겨 있습니다. 전류가 돌아올 길을 확인하세요." };
    }
    if (!a.hasResistor) {
      return { on: false, reason: "no-resistor", text: "저항이 없어 과전류 위험 — 전원이 차단되었습니다." };
    }
    if (a.ledDirection === "reverse") {
      return { on: false, reason: "reversed", text: "LED 가 거꾸로 꽂혀 전류가 흐르지 않습니다." };
    }
    if (!high) return { on: false, reason: "low", text: LED_PIN_NAME + " 이 LOW — 꺼짐" };
    return { on: true, reason: "on", text: LED_PIN_NAME + " 이 HIGH — 켜짐" };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 멀티미터 (명세 6.3)                                               */
  /* ------------------------------------------------------------------ */

  /**
   * 탐침 두 개를 대어 전압을 읽는다.
   * 돌려주는 것 : { ok, volts, text, note }
   */
  function measure(connections, a, b, powerOn) {
    if (!a || !b) return { ok: false, volts: null, text: "—", note: "탐침 두 곳을 고르세요." };

    var net = solve(connections);
    if (net.shorted) {
      return {
        ok: false,
        volts: null,
        text: "차단",
        note: "단락이 감지되어 전원이 차단된 상태입니다."
      };
    }
    if (!powerOn) {
      return {
        ok: false,
        volts: null,
        text: "0.00 V",
        note: "전원이 꺼져 있습니다. [전원 켜기] 를 먼저 누르세요."
      };
    }

    var va = net.potentialAt(a.component, a.pin);
    var vb = net.potentialAt(b.component, b.pin);
    if (va === null || vb === null) {
      return {
        ok: false,
        volts: null,
        text: "—",
        note: "한쪽 탐침이 «떠 있는» 자리에 있습니다. 전원이 이어진 곳끼리 재어 보세요."
      };
    }

    var volts = Math.abs(va - vb);
    var sameNode = net.connected(nodeOf(a.component, a.pin), nodeOf(b.component, b.pin));
    var note;
    if (sameNode) note = "두 곳이 같은 마디로 이어져 있습니다. 전위가 같으므로 0V 입니다.";
    else if (volts === 5) note = "+ 레일과 − 레일 사이입니다. 5V 가 걸려 있습니다.";
    else note = "두 곳의 전위가 같습니다.";

    return { ok: true, volts: volts, text: volts.toFixed(2) + " V", note: note };
  }

  /**
   * 멀티미터로 «반드시 확인해야 할» 두 가지 (명세 6.3)
   *   ① +/− 레일 사이 5V   ② 같은 전위끼리 0V
   */
  /**
   * 멀티미터로 살펴볼 자리 (이 차시는 «선택 활동» 이다 — 통과 조건이 아니다)
   * 전원을 켠 뒤 회로가 실제로 어떻게 되어 있는지 눈으로 확인하는 데 쓴다.
   */
  var PROBE_TASKS = [
    {
      id: "p-pin-gnd",
      prompt: "우노 " + LED_PIN_NAME + " 과 GND 에 탐침을 대어 보세요.",
      expect: 5,
      why: LED_PIN_NAME + " 이 HIGH 일 때 두 곳 사이에는 5V 가 걸린다. 이 힘이 LED 를 켠다."
    },
    {
      id: "p-same",
      prompt: "같은 마디로 이어진 «서로 다른 두 자리» 에 탐침을 대어 보세요.",
      expect: 0,
      why: "케이블로 이어진 두 곳은 하나의 마디다. 전위가 같으므로 0V 다."
    }
  ];

  /** 지금 측정이 과제 조건을 채웠는가 */
  function checkProbe(taskIndex, result, a, b) {
    var task = PROBE_TASKS[taskIndex];
    if (!task || !result || !result.ok) return false;
    if (result.volts !== task.expect) return false;
    /* 0V 과제는 «서로 다른 두 자리» 여야 한다 (같은 구멍을 두 번 짚으면 뜻이 없다) */
    if (task.expect === 0 && a && b && a.component === b.component && a.pin === b.pin) return false;
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* 9. 코드 핀과 회로 핀 대조 (명세 6.2 · 15장)                           */

    var text = String(source || "");
    var i = 0;
    var line = 1;

    function peek(offset) {
      return text.charAt(i + (offset || 0));
    }

    while (i < text.length) {
      var ch = text.charAt(i);

      /* 줄바꿈과 공백 */
      if (ch === "\n") {
        line += 1;
        i += 1;
        continue;
      }
      if (/\s/.test(ch)) {
        i += 1;
        continue;
      }

      /* 주석 */
      if (ch === "/" && peek(1) === "/") {
        while (i < text.length && text.charAt(i) !== "\n") i += 1;
        continue;
      }
      if (ch === "/" && peek(1) === "*") {
        i += 2;
        while (i < text.length && !(text.charAt(i) === "*" && peek(1) === "/")) {
          if (text.charAt(i) === "\n") line += 1;
          i += 1;
        }
        if (i >= text.length) throw new ParseError("주석 /* 를 닫지 않았습니다. */ 를 적어 주세요.", line, "comment");
        i += 2;
        continue;
      }

      /* 문자열 */
      if (ch === '"') {
        var startLine = line;
        var value = "";
        i += 1;
        while (i < text.length && text.charAt(i) !== '"') {
          if (text.charAt(i) === "\n") {
            throw new ParseError("문자열을 같은 줄에서 닫아 주세요. 따옴표(\") 짝이 맞지 않습니다.", startLine, "string");
          }
          if (text.charAt(i) === "\\") {
            var esc = peek(1);
            value += esc === "n" ? "\n" : esc === "t" ? "\t" : esc;
            i += 2;
            continue;
          }
          value += text.charAt(i);
          i += 1;
        }
        if (i >= text.length) {
          throw new ParseError("문자열을 닫는 따옴표(\") 가 없습니다.", startLine, "string");
        }
        i += 1;
        tokens.push({ type: "string", value: value, line: startLine });
        continue;
      }

      /* 숫자 */
      if (/[0-9]/.test(ch)) {
        var num = "";
        while (i < text.length && /[0-9.]/.test(text.charAt(i))) {
          num += text.charAt(i);
          i += 1;
        }
        tokens.push({ type: "number", value: parseFloat(num), line: line });
        continue;
      }

      /* 이름 (변수·함수·상수) */
      if (/[A-Za-z_]/.test(ch)) {
        var name = "";
        while (i < text.length && /[A-Za-z0-9_]/.test(text.charAt(i))) {
          name += text.charAt(i);
          i += 1;
        }
        tokens.push({
          type: KEYWORDS.indexOf(name) !== -1 ? "keyword" : "name",
          value: name,
          line: line
        });
        continue;
      }

      /* 괄호와 구두점 */
      if ("(){},;.".indexOf(ch) !== -1) {
        tokens.push({ type: "punct", value: ch, line: line });
        i += 1;
        continue;
      }

      /* 연산자 */
      var matched = null;
      for (var k = 0; k < OPERATORS.length; k += 1) {
        if (text.substr(i, OPERATORS[k].length) === OPERATORS[k]) {
          matched = OPERATORS[k];
          break;
        }
      }
      if (matched) {
        tokens.push({ type: "op", value: matched, line: line });
        i += matched.length;
        continue;
      }

      throw new ParseError("여기서는 쓸 수 없는 기호 «" + ch + "» 입니다.", line, "char");
    }

    tokens.push({ type: "eof", value: "", line: line });
    return tokens;
  }

  /* ------------------------------------------------------------------ */
  /* 2. 구문 나무 만들기                                                   */
  /* ------------------------------------------------------------------ */

  function parse(source) {
    var tokens = tokenize(source);
    var pos = 0;

    function peek(offset) {
      return tokens[pos + (offset || 0)] || tokens[tokens.length - 1];
    }
    function at(type, value) {
      var t = peek();
      return t.type === type && (value === undefined || t.value === value);
    }
    function next() {
      var t = peek();
      pos += 1;
      return t;
    }
    function expect(type, value, what) {
      if (!at(type, value)) {
        var t = peek();
        var got = t.type === "eof" ? "코드가 끝났습니다" : "«" + t.value + "»";
        throw new ParseError(
          (what || "«" + value + "»") + " 가 있어야 하는 자리에 " + got + " 이(가) 있습니다.",
          t.line,
          value === ";" ? "semicolon" : value === "}" || value === "{" ? "brace" : "syntax"
        );
      }
      return next();
    }

    /* ----- 식(expression) : 우선순위가 낮은 것부터 ----- */

    function parseExpression() {
      return parseOr();
    }
    function parseOr() {
      var left = parseAnd();
      while (at("op", "||")) {
        var line = next().line;
        left = { kind: "binary", op: "||", left: left, right: parseAnd(), line: line };
      }
      return left;
    }
    function parseAnd() {
      var left = parseEquality();
      while (at("op", "&&")) {
        var line = next().line;
        left = { kind: "binary", op: "&&", left: left, right: parseEquality(), line: line };
      }
      return left;
    }
    function parseEquality() {
      var left = parseComparison();
      while (at("op", "==") || at("op", "!=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseComparison(), line: t.line };
      }
      return left;
    }
    function parseComparison() {
      var left = parseAdditive();
      while (at("op", "<") || at("op", ">") || at("op", "<=") || at("op", ">=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseAdditive(), line: t.line };
      }
      return left;
    }
    function parseAdditive() {
      var left = parseMultiplicative();
      while (at("op", "+") || at("op", "-")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseMultiplicative(), line: t.line };
      }
      return left;
    }
    function parseMultiplicative() {
      var left = parseUnary();
      while (at("op", "*") || at("op", "/") || at("op", "%")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseUnary(), line: t.line };
      }
      return left;
    }
    function parseUnary() {
      if (at("op", "!") || at("op", "-")) {
        var t = next();
        return { kind: "unary", op: t.value, arg: parseUnary(), line: t.line };
      }
      return parsePrimary();
    }

    function parseArguments() {
      var args = [];
      expect("punct", "(", "여는 괄호 «(»");
      if (!at("punct", ")")) {
        args.push(parseExpression());
        while (at("punct", ",")) {
          next();
          args.push(parseExpression());
        }
      }
      expect("punct", ")", "닫는 괄호 «)»");
      return args;
    }

    function parsePrimary() {
      var t = peek();

      if (t.type === "number") {
        next();
        return { kind: "number", value: t.value, line: t.line };
      }
      if (t.type === "string") {
        next();
        return { kind: "string", value: t.value, line: t.line };
      }
      if (at("punct", "(")) {
        next();
        var inner = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        return inner;
      }
      if (t.type === "name" || (t.type === "keyword" && t.value === "true") || (t.type === "keyword" && t.value === "false")) {
        next();
        var name = t.value;

        /* Serial.println(...) 처럼 «점» 으로 이어지는 호출 */
        if (at("punct", ".")) {
          next();
          var member = expect("name", undefined, "함수 이름").value;
          var args = parseArguments();
          return { kind: "call", target: name, name: member, args: args, line: t.line };
        }
        if (at("punct", "(")) {
          var callArgs = parseArguments();
          return { kind: "call", target: "", name: name, args: callArgs, line: t.line };
        }
        if (Object.prototype.hasOwnProperty.call(CONSTANTS, name)) {
          return { kind: "constant", name: name, value: CONSTANTS[name], line: t.line };
        }
        return { kind: "variable", name: name, line: t.line };
      }

      throw new ParseError(
        t.type === "eof" ? "코드가 갑자기 끝났습니다. 빠진 부분이 있는지 살펴보세요." : "여기에 «" + t.value + "» 이(가) 올 수 없습니다.",
        t.line,
        "syntax"
      );
    }

    /* ----- 문장(statement) ----- */

    function parseBlock() {
      var open = expect("punct", "{", "여는 중괄호 «{»");
      var body = [];
      while (!at("punct", "}")) {
        if (at("eof")) {
          throw new ParseError(
            "중괄호 «{» 를 닫지 않았습니다. " + open.line + "번 줄에서 열린 괄호에 짝이 되는 «}» 를 적어 주세요.",
            open.line,
            "brace"
          );
        }
        body.push(parseStatement());
      }
      expect("punct", "}", "닫는 중괄호 «}»");
      return body;
    }

    function parseStatement() {
      var t = peek();

      /* if / else */
      if (t.type === "keyword" && t.value === "if") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        var cond = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        var thenBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        var elseBody = null;
        if (peek().type === "keyword" && peek().value === "else") {
          next();
          if (peek().type === "keyword" && peek().value === "if") elseBody = [parseStatement()];
          else elseBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        }
        return { kind: "if", cond: cond, then: thenBody, otherwise: elseBody, line: t.line };
      }

      /* 변수 선언 :  int x = 5;  /  const int PIN = 13; */
      if (t.type === "keyword" && (t.value === "const" || TYPES.indexOf(t.value) !== -1)) {
        var isConst = false;
        if (t.value === "const") {
          next();
          isConst = true;
        }
        if (peek().type === "keyword" && peek().value === "unsigned") next();
        var typeTok = peek();
        if (typeTok.type !== "keyword" || TYPES.indexOf(typeTok.value) === -1) {
          throw new ParseError("자료형(int, long, float, bool …) 이 있어야 합니다.", typeTok.line, "syntax");
        }
        next();
        var nameTok = expect("name", undefined, "변수 이름");
        var init = null;
        if (at("op", "=")) {
          next();
          init = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return {
          kind: "declare",
          name: nameTok.value,
          varType: typeTok.value,
          isConst: isConst,
          init: init,
          line: t.line
        };
      }

      /* 함수 정의가 함수 안에 들어온 경우 — 흔한 실수라 따로 알려 준다 */
      if (t.type === "keyword" && t.value === "void") {
        throw new ParseError(
          "함수 안에 또 다른 함수를 만들 수 없습니다. 앞의 «}» 를 빠뜨리지 않았는지 보세요.",
          t.line,
          "brace"
        );
      }

      /* 대입 :  x = 5;   x += 1;   x++; */
      if (t.type === "name" && peek(1).type === "op" && ["=", "+=", "-=", "++", "--"].indexOf(peek(1).value) !== -1) {
        next();
        var opTok = next();
        var value = null;
        if (opTok.value === "++" || opTok.value === "--") {
          value = {
            kind: "binary",
            op: opTok.value === "++" ? "+" : "-",
            left: { kind: "variable", name: t.value, line: t.line },
            right: { kind: "number", value: 1, line: t.line },
            line: t.line
          };
        } else if (opTok.value === "+=" || opTok.value === "-=") {
          value = {
            kind: "binary",
            op: opTok.value.charAt(0),
            left: { kind: "variable", name: t.value, line: t.line },
            right: parseExpression(),
            line: t.line
          };
        } else {
          value = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return { kind: "assign", name: t.value, value: value, line: t.line };
      }

      /* 그 밖에는 «식 하나로 이루어진 문장» — 대개 함수 호출이다 */
      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 1차시에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 8장 마지막 문단 · 명세 5장 4단계 통과 조건)          */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      ["then", "otherwise", "args"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** 문자열 인수 하나를 그대로 꺼낸다 (없으면 null) */
  function firstStringArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "string" ? a.value : null;
  }
  function firstNumberArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "number" ? a.value : null;
  }

  /**
   * loop() 몸통의 명령을 «적힌 차례대로» 늘어놓는다.
   * if 안에 든 것도 함께 센다 — 순서만 지켜 준다.
   */
  function statementCalls(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "express" && stmt.expr && stmt.expr.kind === "call") out.push(stmt.expr);
      else if (stmt.kind === "if") {
        out = out.concat(statementCalls(stmt.then));
        if (stmt.otherwise) out = out.concat(statementCalls(stmt.otherwise));
      }
    });
    return out;
  }

  /**
   * 코드가 «LED 핀으로 쓰는» 번호. digitalWrite 의 첫 인수를 본다.
   * ledPin 처럼 이름을 붙였으면 맨 위 선언에서 숫자를 찾아 푼다.
   * 알 수 없으면 이 차시의 기본 핀을 쓴다.
   */
  function codeLedPin(ast) {
    var known = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    var found = null;
    callsIn(ast, "loop").forEach(function (c) {
      if (found !== null || callName(c) !== "digitalWrite") return;
      var a = (c.args || [])[0];
      if (!a) return;
      if (a.kind === "number") found = a.value;
      else if (a.kind === "variable" && known[a.name] !== undefined) found = known[a.name];
    });
    return found === null ? (PC.LED_PIN === undefined ? 11 : PC.LED_PIN) : found;
  }

  /** digitalWrite(..., HIGH) 처럼 «어떤 값을 내보내는» 줄만 고른다 */
  function writesIn(ast, constantName) {
    return callsIn(ast, "loop").filter(function (c) {
      if (callName(c) !== "digitalWrite") return false;
      var v = (c.args || [])[1];
      return v && v.kind === "constant" && v.name === constantName;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 3-1. 이 차시의 AST 도우미 — «읽기» 와 «갈림길» 을 다룬다                */
  /* ------------------------------------------------------------------ */

  /** 맨 위에서 숫자로 정한 이름의 값. 없으면 null. */
  function declaredNumber(ast, name) {
    var found = null;
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.name === name && g.init && g.init.kind === "number") {
        found = g.init.value;
      }
    });
    return found;
  }

  /** loop() 안의 if 문을 모은다 (안쪽 if 까지 훑는다) */
  function ifNodes(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "if") {
        out.push(stmt);
        out = out.concat(ifNodes(stmt.then));
        if (stmt.otherwise) out = out.concat(ifNodes(stmt.otherwise));
      }
    });
    return out;
  }

  /** loop() 의 첫 if 문. 없으면 null. */
  function mainIf(ast) {
    var loop = ast && ast.functions && ast.functions.loop;
    if (!loop) return null;
    var list = ifNodes(loop.body);
    return list.length > 0 ? list[0] : null;
  }

  /** digitalRead 호출들 */
  function readCalls(ast) {
    return callsIn(ast, "loop").filter(function (c) {
      return callName(c) === "digitalRead";
    });
  }

  /** 이 덩어리 «안» 에서 digitalWrite(..., HIGH|LOW) 를 찾는다 */
  function writesInBlock(body, constantName) {
    return statementCalls(body).filter(function (c) {
      if (callName(c) !== "digitalWrite") return false;
      var v = (c.args || [])[1];
      return v && v.kind === "constant" && v.name === constantName;
    });
  }

  /** 이 덩어리 안의 Serial.print/println 문자열들 */
  function serialTextsIn(body) {
    var out = [];
    statementCalls(body).forEach(function (c) {
      var name = callName(c);
      if (name !== "Serial.print" && name !== "Serial.println") return;
      var arg = (c.args || [])[0];
      if (arg && arg.kind === "string") out.push(arg.value);
    });
    return out;
  }

  /**
   * if 의 조건이 «motion 이 HIGH 인가» 를 묻고 있는지 본다.
   *
   * 돌려주는 것 : "ok" · "inverted" · "wrong-var" · "not-compare" · "none"
   *
   * ★ «반전» 을 따로 알려 주는 것이 중요하다(명세 13장).
   *   motion == LOW 나 motion != HIGH 는 «문법은 맞고 뜻이 거꾸로» 인 실수다.
   *   그냥 «조건이 틀렸습니다» 라고 하면 어디가 거꾸로인지 알 수 없다.
   */
  function conditionKind(node, varName) {
    if (!node) return "none";
    if (node.kind !== "binary") return "not-compare";
    if (["==", "!="].indexOf(node.op) === -1) return "not-compare";

    var left = node.left;
    var right = node.right;
    var usesVar =
      (left && left.kind === "variable" && left.name === varName) ||
      (right && right.kind === "variable" && right.name === varName);
    if (!usesVar) return "wrong-var";

    var constName = "";
    [left, right].forEach(function (side) {
      if (side && side.kind === "constant") constName = side.name;
      if (side && side.kind === "number") {
        constName = side.value === 1 ? "HIGH" : side.value === 0 ? "LOW" : "";
      }
    });
    if (!constName) return "not-compare";

    var meansHigh = (node.op === "==" && constName === "HIGH") || (node.op === "!=" && constName === "LOW");
    var meansLow = (node.op === "==" && constName === "LOW") || (node.op === "!=" && constName === "HIGH");
    if (meansHigh) return "ok";
    if (meansLow) return "inverted";
    return "not-compare";
  }

  /**

  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite"];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2 · 17.4 8번)
   *
   * ★ ledPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   *   풀지 않으면 회로와 맞대어 볼 수 없어 8번 검사가 늘 실패한다.
   */
  function pinsUsed(ast) {
    var uses = [];

    /* 전역에서 숫자로 초기화한 이름만 모은다. 나중에 바뀌는 값은 알 수 없으므로 세지 않는다. */
    var known = {};
    (ast.globals || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;

        /**
         * ★ pinMode 의 두 번째 값(INPUT/OUTPUT)을 함께 담는다.
         *
         *   이 차시에는 «읽는 핀» 과 «내보내는 핀» 이 함께 있다.
         *   회로와 맞대어 볼 때 «어느 핀을 어느 역할로 쓰는지» 를 알아야
         *   「코드 motionPin D7, 회로 PIR DO D8 불일치」 처럼 이름을 붙여 말할 수 있다
         *   (circuit.js 의 codeRoles 가 이 값을 읽는다).
         */
        var mode = "";
        if (callName(call) === "pinMode") {
          var second = (call.args || [])[1];
          if (second && second.kind === "constant") mode = second.name;
        }

        function push(extra) {
          var use = { pin: extra.pin, line: call.line, call: callName(call), mode: mode };
          if (extra.viaName) use.viaName = extra.viaName;
          if (extra.fromVariable) use.fromVariable = true;
          uses.push(use);
        }

        if (arg.kind === "number") {
          push({ pin: arg.value });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          push({ pin: arg.name });

          if (known[arg.name] !== undefined) push({ pin: known[arg.name], viaName: arg.name });

      });
    });

  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)

  function validate(source, ctx) {

        ok: false,
