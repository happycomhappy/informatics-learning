            K.fmtTime(r.serverUpdatedAt || r.submittedAt)
          }),
          el("p", { class: "t-card__praise", text: (r.studentName || "학생") + " 님, " + praiseFor(i + 1, r) })
        ]);
      }))
    );

    return box;
  }

  /* ================================================================== */
  /* 3. 회로 수행 (명세 11장 3번)                                         */
  /* ================================================================== */

  function renderCircuit(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.circuitStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("회로 완성", s.completed + " / " + s.total + "명", K.percent(s.completed, s.total) + "%"),
        K.statCard("평균 시도", s.avgAttempts + "회", "케이블을 이은 횟수"),
        K.statCard("힌트 사용", s.hintUsers + "명"),
        K.statCard("위험 연결 발생", s.dangerStudents + "명", s.dangerStudents ? "아래 목록을 확인하세요" : "없음")
      ])
    );

    /* ★ 이 차시에서 가장 자주 보는 숫자 — PIR 세 줄 가운데 어느 줄을 놓쳤는가 */
    var pm = s.pirMissing || { vcc: 0, gnd: 0, out: 0, swapped: 0 };
    box.appendChild(
      section("PIR 세 줄 — 놓친 학생 수", [
        K.bar("5V → VCC 를 놓침", pm.vcc, s.total),
        K.bar("GND → GND 를 놓침", pm.gnd, s.total),
        K.bar(PC.MOTION_PIN_NAME + " → OUT(DO) 을 놓침", pm.out, s.total),
        K.bar(
          PC.MOTION_PIN_NAME + " / " + PC.LED_PIN_NAME + " 교차 (역할 뒤바뀜)",
          pm.swapped,
          s.total,
          { strong: pm.swapped > 0 }
        )
      ])
    );

    box.appendChild(
      section(
        "빈번한 오결선",
        s.frequent.length === 0
          ? [K.empty("위험한 연결을 만든 학생이 없습니다.")]
          : s.frequent.map(function (f) {
              return K.bar(f.title, f.count, s.total);
            })
      )
    );

    /* 학생별 회로 수행 */
    box.appendChild(
      section("학생별 회로", [
        el("div", { class: "t-tablewrap" }, [
          el("table", { class: "t-table" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { text: "학번" }),
                el("th", { text: "이름" }),
                el("th", { text: "완성" }),
                el("th", { text: "경로 판정" }),
                el("th", { text: "시도" }),
                el("th", { text: "힌트" }),
                el("th", { text: "위험 연결" }),
                el("th", { text: "연결 목록" })
              ])
            ]),
            el("tbody", {}, rows.map(function (r) {
              var errors = (r.circuit.dangerEvents || []).map(function (e) {
                return e.title || e.code;
              });
              var uniqueErrors = errors.filter(function (v, i) {
                return errors.indexOf(v) === i;
              });
              return el("tr", {}, [
                el("td", { text: r.studentId }),
                el("td", { text: r.studentName }),
                el("td", { class: r.circuit.completed ? "cell--ok" : "cell--no", text: r.circuit.completed ? "✔ 완성" : "✘ 미완성" }),
                el("td", { text: pathText(r.circuit.path) }),
                el("td", { text: String(r.circuit.attempts) }),
                el("td", { text: String(r.circuit.hintsUsed) }),
                el("td", { text: uniqueErrors.length ? uniqueErrors.join(", ") : "—" }),
                el("td", { text: (r.circuit.connections || [])
                  .map(function (c) {
                    return PC.circuit.describe(c.fromComponent, c.fromPin) + "→" + PC.circuit.describe(c.toComponent, c.toPin);
                  })
                  .join(" / ") || "—" })
              ]);
            }))
          ])
        ])
      ])
    );

    return box;
  }

  /**
   * 제출에 담긴 «부품 경로 검사 결과» 를 한 줄로 (명세 18.1)
   *
   * 여기가 이 차시 교사 화면의 알맹이다. «미완성» 한 마디로는
   * 극성을 틀린 학생과 저항을 빠뜨린 학생을 갈라낼 수 없다(명세 29장 6번).
   */
  function pathText(path) {
    if (!path) return "—";
    var parts = [];

    /* 센서 쪽 세 줄을 먼저 적는다. 이것이 막혀 있으면 LED 쪽은 볼 까닭이 없다. */
    var miss = [];
    if (!path.pirVcc) miss.push("VCC");
    if (!path.pirGnd) miss.push("GND");
    if (!path.pirOut) miss.push("OUT");
    if (path.pinsSwapped) parts.push("★ " + PC.MOTION_PIN_NAME + "/" + PC.LED_PIN_NAME + " 교차");
    else if (miss.length > 0) parts.push("PIR " + miss.join("·") + " 없음");
    else parts.push("PIR 3선 O");

    /* LED 쪽 */
    if (path.shortCircuit) parts.push("단락");
    if (path.ledDirection === "forward") parts.push("극성 O");
    else if (path.ledDirection === "reverse") parts.push("역극성");
    else parts.push("LED 경로 끊김");
    parts.push(path.hasResistor ? path.resistanceOhm + "Ω" : "저항 없음");
    return parts.join(" · ");
  }

  /* ================================================================== */
  /* 4. 코드 수행 (명세 11장 4번)                                         */
  /* ================================================================== */

  var MODE_NAME = { assemble: "코드 조립", blank: "빈칸 채우기", edit: "전체 편집" };

  function renderCode(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.codeStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("검사 전부 통과", s.allPassed + " / " + s.total + "명", K.percent(s.allPassed, s.total) + "%"),
        K.statCard("문법 오류 남음", s.withSyntaxError + "명"),
        K.statCard("핀 불일치", s.withPinMismatch + "명"),
        K.statCard(
          "입출력 역할 뒤바뀜",
          s.withSwapped + "명",
          s.withSwapped ? "센서 입력과 LED 출력이 교차" : "없음"
        )
      ])
    );

    box.appendChild(
      section(
        "마지막으로 쓴 방식",
        s.modes.map(function (m) {
          return K.bar(MODE_NAME[m.mode] || m.mode, m.count, s.total);
        })
      )
    );

    rows.forEach(function (r) {
      var problems = [];
      /* 제출 자료의 syntaxErrors 는 «사람이 읽는 글» 이다(줄 번호가 앞에 붙어 있다) */
      (r.code.syntaxErrors || []).forEach(function (e) {
        problems.push(
          el("p", { class: "t-problem", text: "문법 " + (typeof e === "string" ? e : e && e.message) })
        );
      });
      (r.code.pinMismatch || []).forEach(function (m) {
        var tag = m && m.kind === "swapped" ? "★ 역할 뒤바뀜 " : "핀 ";
        problems.push(el("p", { class: "t-problem", text: tag + (m && m.message) }));
      });

      /* 검사를 몇 번 눌렀고 통과 수가 어떻게 늘었는가 — 명세 7장 code.history */
      var hist = (r.code.history || []).slice(-8);
      var histText = hist
        .map(function (h) {
          return (MODE_NAME[h.mode] || h.mode || "?") + " " + h.passed + "/" + h.total;
        })
        .join(" → ");

      box.appendChild(
        section(
          r.studentId + " " + r.studentName,
          [
            el("p", { class: "t-meta", text:
              "검사 " + r.code.testsPassed + " / " + r.code.testsTotal +
              " · 실행 " + r.code.attempts + "회 · 방식 " + (MODE_NAME[r.code.mode] || "—")
            }),
            histText ? el("p", { class: "t-meta", text: "수정 이력 : " + histText }) : null,
            K.codeBox(r.code.source)
          ].concat(problems)
        )
      );
    });

    return box;
  }

  /* ================================================================== */
  /* 5. 실험 기록 (명세 11장 5번)                                         */
  /* ================================================================== */

  function renderExperiment(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var EXP = (PC.lesson && PC.lesson.EXPERIMENTS) || [];
    var ANSWER = (PC.TEACHER_NOTES && PC.TEACHER_NOTES.EXPERIMENT_ANSWER) || [];
    var answerById = {};
    ANSWER.forEach(function (a) {
      answerById[a.id] = a;
    });

    /* 어느 실험까지 갔는가 — 실험은 ①→②→③ 차례대로 한다 */
    var ranCount = {};
    var keepOnTried = 0;
    rows.forEach(function (r) {
      (r.experiment.conditions || []).forEach(function (c) {
        if (c.ran) ranCount[c.id] = (ranCount[c.id] || 0) + 1;
      });
      if (r.experiment.keepOn && r.experiment.keepOn.tried) keepOnTried += 1;
    });

    box.appendChild(
      section(
        "실험별 실행 인원",
        EXP.length === 0
          ? [K.empty("실험 자료가 없습니다.")]
          : EXP.map(function (item) {
              return K.bar(item.label, ranCount[item.id] || 0, rows.length);
            }).concat([
              K.bar("확장 탐구(자동 소등 규칙)까지 해 봄", keepOnTried, rows.length)
            ])
      )
    );

    /**
     * ★ 실험 ②의 «놀람» 이 이 차시의 핵심이다.
     *
     *   1단계에서 «켜진다» 라고 예측한 학생이 실제로는 꺼지는 것을 보고 고쳐 쓰는 것,
     *   그것이 이 차시가 노리는 배움이다. 그래서 «1단계 예측 → 실제» 를 따로 센다.
     */
    var stillGuess = { on: 0, off: 0, unsure: 0, none: 0 };
    rows.forEach(function (r) {
      var picked = null;
      (r.intro.predicts || []).forEach(function (pr) {
        if (pr.id === "p-still") picked = pr.value;
      });
      if (picked === 0) stillGuess.on += 1;
      else if (picked === 1) stillGuess.off += 1;
      else if (picked === 2) stillGuess.unsure += 1;
      else stillGuess.none += 1;
    });

    box.appendChild(
      section("1단계 예측 — «영역 안에서 가만히 서 있을 때»", [
        el("p", {
          class: "panel__hint",
          text:
            "정답은 «꺼진다»(감지되지 않을 수 있다) 쪽입니다. «켜진다» 를 고른 학생이 많을수록 " +
            "실험 ②의 결과를 함께 짚어 주는 것이 좋습니다."
        }),
        K.bar("켜진다 (오개념)", stillGuess.on, rows.length, { strong: stillGuess.on > 0 }),
        K.bar("꺼진다", stillGuess.off, rows.length),
        K.bar("잘 모르겠다", stillGuess.unsure, rows.length),
        K.bar("예측 기록 없음", stillGuess.none, rows.length)
      ])
    );

    /* 학생별 실험 기록 */
    rows.forEach(function (r) {
      var conditions = r.experiment.conditions || [];
      var observations = r.experiment.observations || [];
      var byId = {};
      observations.forEach(function (o) {
        byId[o.id] = o;
      });

      var parts = [];

      if (conditions.length === 0) {
        parts.push(K.empty("실험 기록이 없습니다."));
      } else {
        parts.push(
          el("div", { class: "t-tablewrap" }, [
            el("table", { class: "t-table" }, [
              el("thead", {}, [
                el("tr", {}, [
                  el("th", { text: "실험" }),
                  el("th", { text: "안정화" }),
                  el("th", { text: "사람 위치" }),
                  el("th", { text: "움직임" }),
                  el("th", { text: "DO" }),
                  el("th", { text: "LED" }),
                  el("th", { text: "시리얼" }),
                  el("th", { text: "실행 전 예상" }),
                  el("th", { text: "실행 뒤 관찰" }),
                  el("th", { text: "예상과 다른 점" })
                ])
              ]),
              el("tbody", {}, conditions.map(function (c) {
                var note = byId[c.id] || {};
                return el("tr", {}, [
                  el("td", { text: c.label || c.id }),
                  el("td", { text: c.settled ? "완료" : "판정 대기" }),
                  el("td", { text: c.inZone ? "영역 안" : "영역 밖" }),
                  el("td", { text: c.moving ? "움직임" : "정지" }),
                  el("td", { class: "cell--mono", text: c.doLevel || "—" }),
                  el("td", { text: c.ledOn ? "● 켜짐" : "○ 꺼짐" }),
                  el("td", { class: "cell--mono", text: c.serial || "—" }),
                  el("td", {}, [K.longText(note.predict || "")]),
                  el("td", {}, [K.longText(note.observation || "")]),
                  el("td", {}, [K.longText(note.surprise || "")])
                ]);
              }))
            ])
          ])
        );
      }

      /* 확장 탐구 — 자동 소등 규칙 (명세 9.5) */
      var keep = r.experiment.keepOn || {};
      if (String(keep.text || "").trim()) {
        parts.push(el("p", { class: "t-meta", text: "확장 탐구 — 마지막 감지 후 일정 시간 LED 유지 규칙" }));
        parts.push(K.longText(keep.text));
      }

      box.appendChild(section(r.studentId + " " + r.studentName, parts));
    });

    /* 실험 정답표 — 학생 기록과 맞대어 보는 자리 */
    box.appendChild(
      section(
        "실험 정답표 (교사용)",
        ANSWER.length === 0
          ? [K.empty("정답 자료가 없습니다.")]
          : ANSWER.map(function (a) {
              return el("div", { class: "t-answer" }, [
                el("p", { class: "t-answer__head", text: a.label }),
                el("p", { class: "t-answer__line", text:
                  "DO " + a.expectedDo + " · LED " + a.expectedLed + " · 시리얼 «" + a.expectedSerial + "»"
                }),
                el("p", { class: "t-answer__why", text: a.expected })
              ]);
            })
      )
    );

    return box;
  }

  T.views = {
    section: section,
    summary: renderSummary,
    podium: renderPodium,
    praiseFor: praiseFor,
    circuit: renderCircuit,
    pathText: pathText,
    code: renderCode,
    experiment: renderExperiment,
    MODE_NAME: MODE_NAME
  };
})();
    </script>
    <script data-from="teacher/t35-wrong.js">
/* ------------------------------------------------------------------
 * 3장 — 가장 많이 틀린 문제 (단추를 누를 때마다 한 문제씩)
 *
 * 짜임새를 lesson3_7_1 의 교사용 3장과 «같게» 맞추었다.
 *   · 틀린 학생이 많은 순서로 최대 두 문제
 *   · 오답률 막대 + 보기별 고른 사람 수 + 정답 + 해설 + 「이렇게 복습해 보세요」
 *   · 두 문제를 모두 확인해야 다음 장으로 넘어갈 수 있다
 *
 * 한 문제씩 여는 까닭 — 다섯 문항을 한꺼번에 늘어놓으면 «무엇부터 짚어 줄지» 가 흐려진다.
 * 수업에서 실제로 다룰 수 있는 것은 한두 문항이다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 topWrong 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** 한 수업에서 짚어 줄 만한 문항 수 */
  var WRONG_LIMIT = 2;

  /**
   * 틀린 학생이 많은 순서로 문항을 고른다.
   * 아무도 틀리지 않은 문항은 넣지 않는다 — 짚어 줄 것이 없다.
   */
  function topWrong(rows) {
    var stats = T.data.questionStats(rows);
    return stats
      .map(function (stat) {
        var wrong = stat.total - stat.correct;
        return {
          stat: stat,
          wrong: wrong,
          wrongRate: K.percent(wrong, stat.total)
        };
      })
      .filter(function (item) {
        return item.wrong > 0;
      })
      .sort(function (a, b) {
        if (b.wrong !== a.wrong) return b.wrong - a.wrong;
        return a.stat.no - b.stat.no; /* 같으면 문항 번호 순 */
      })
      .slice(0, WRONG_LIMIT);
  }

  /** 오답 카드 한 장 */
  function wrongCard(item, order) {
    var stat = item.stat;
    var q = null;
    PC.quiz.QUESTIONS.forEach(function (one) {
      if (one.id === stat.id) q = one;
    });
    var note = null;
    (PC.TEACHER_NOTES.ANSWERS || []).forEach(function (a) {
      if (a.id === stat.id) note = a;
    });

    var card = el("div", { class: "t-wrong__card" });

    card.appendChild(el("span", { class: "t-wrong__rank", text: "오답 " + order + "위" }));
    card.appendChild(el("h3", { class: "t-wrong__title", text: "문항 " + stat.no + " · " + stat.tag }));
    card.appendChild(el("p", { class: "t-wrong__prompt", text: stat.stem }));

    /* 문항에 코드가 붙어 있으면 그대로 보여 준다 (4번 문항) */
    if (q && q.code) card.appendChild(K.codeBox(q.code));
    if (q && q.template) card.appendChild(K.codeBox(q.template));

    /* 오답률 막대 */
    card.appendChild(
      el("div", { class: "t-bar" }, [
        el("div", { class: "t-bar__fill", attrs: { style: "width:" + item.wrongRate + "%" } }),
        el("span", {
          class: "t-bar__label",
          text: stat.total + "명 중 " + item.wrong + "명이 틀렸어요 (" + item.wrongRate + "%)"
        })
      ])
    );

    /* 객관식 — 보기별로 몇 명이 골랐는가 */
    if (stat.type === "choice" && stat.distribution.length) {
      var answerIndex = typeof stat.answerIndex === "number" ? stat.answerIndex : -1;
      var maxWrong = 0;
      stat.distribution.forEach(function (d) {
        if (d.index !== answerIndex && d.count > maxWrong) maxWrong = d.count;
      });

      card.appendChild(
        el("div", { class: "t-options" }, stat.distribution.map(function (d) {
          var isAnswer = d.index === answerIndex;
          var isTopWrong = !isAnswer && d.count > 0 && d.count === maxWrong;
          return el("div", {
            class: "t-option" + (isAnswer ? " is-answer" : "") + (isTopWrong ? " is-top-wrong" : "")
          }, [
            el("span", { class: "t-option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[d.index] || String(d.index + 1) }),
            el("span", { class: "t-option__text", text: d.label + (isAnswer ? "  ← 정답" : "") }),
            el("span", { class: "t-option__count", text: d.count + "명" })
          ]);
        }))
      );
    }

    /* 완성형 — 학생들이 실제로 쓴 답을 몇 개 보여 준다 */
    if (stat.type === "code" && stat.texts.length) {
      var wrongTexts = stat.texts.filter(function (t) {
        return !t.correct;
      });
      card.appendChild(
        el("div", { class: "t-options" }, wrongTexts.slice(0, 5).map(function (t) {
          return el("div", { class: "t-option" }, [
            el("span", { class: "t-option__text" }, [K.codeBox(String(t.text || "(무응답)"))]),
            el("span", { class: "t-option__count", text: t.studentId || "" })
          ]);
        }))
      );
      if (wrongTexts.length > 5) {
        card.appendChild(
          el("p", { class: "panel__hint", text: "틀린 답 " + wrongTexts.length + "개 중 앞 5개만 보여 줍니다. 나머지는 6장 학생별 보기에서 확인하세요." })
        );
      }
    }

    /* 정답과 해설 */
    if (note) {
      card.appendChild(
        el("div", { class: "t-explain" }, [
          el("p", { class: "t-explain__label", text: "정답" }),
          el("p", {
            class: "t-answerline",
            text:
              stat.type === "choice" && note.answerIndex >= 0
                ? (CIRCLED[note.answerIndex] || "") + " " + note.answerText
                : note.answerText
          }),
          el("p", { class: "t-explain__label", text: "해설" }),
          el("p", { text: note.explanation })
        ])
      );
    }

    /* 이 문항과 이어지는 오개념 지도 — 있으면 복습 방법으로 붙인다 */
    var tip = teachTipFor(stat);
    if (tip) {
      card.appendChild(
        el("p", { class: "t-teach" }, [
          el("strong", { text: "💡 이렇게 복습해 보세요" }),
          el("span", { text: tip })
        ])
      );
    }

    return card;
  }

  /**
   * 문항에 맞는 «복습 방법» 을 오개념 자료에서 고른다.
   * 문항마다 손으로 짝지어 두지 않고 딱지(tag)로 잇는다 — 문항이 바뀌어도 따라온다.
   */
  var TAG_TO_MISCONCEPTION = {
    "개념": "m-loop",
    "입력·출력": "m-analog",
    "프로그램 구조": "m-loop",
    "프로그래밍": "m-loop",
    "완성형": "m-loop"
  };

  function teachTipFor(stat) {
    var wanted = TAG_TO_MISCONCEPTION[stat.tag];
    var found = null;
    (PC.TEACHER_NOTES.MISCONCEPTIONS || []).forEach(function (m) {
      if (m.id === wanted) found = m;
    });
    return found ? found.teach : "";
  }

  /**
   * 3장 본문을 만든다.
   *
   * @param rows    제출 목록
   * @param onSeen  문제를 하나 열 때마다 부른다. (본 개수, 전체 개수) — 다음 장 열기 판단에 쓴다
   */
  function render(rows, onSeen) {
    var box = el("div");
    var list = topWrong(rows);
    var index = -1;
    var seenAll = false;

    var progress = el("p", { class: "t-wrong__progress", attrs: { "aria-live": "polite" } });
    var body = el("div");

    function toStart() {
      index = -1;
      K.clear(body);
      btn.textContent = "가장 많이 틀린 문제 보기";
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
      K.announce("처음으로 돌아갔습니다.");
    }

    var btn = el("button", {
      class: "btn btn--primary",
      text: "가장 많이 틀린 문제 보기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!list.length) return;
          index += 1;

          /* 마지막까지 본 뒤 한 번 더 누르면 처음으로 돌아간다 */
          if (index >= list.length) {
            toStart();
            return;
          }

          /* 카드를 쌓지 않고 갈아 끼운다 — 한 번에 한 문제만 짚어 준다 */
          K.clear(body).appendChild(wrongCard(list[index], index + 1));

          var last = index === list.length - 1;
          btn.textContent = last ? "처음부터 다시 보기" : "다음 문제 보기";
          progress.textContent = index + 1 + " / " + list.length + " 문제 보는 중";
          K.announce("가장 많이 틀린 " + (index + 1) + "번째 문제, " + list[index].stat.no + "번 문항입니다.");

          if (last && !seenAll) {
            seenAll = true;
            K.toast("틀린 문제를 모두 확인했어요. 아래 「다음 →」 을 누르면 넘어갑니다.");
            if (onSeen) onSeen(list.length, list.length);
          }
        }
      }
    });

    if (!list.length) {
      btn.disabled = true;
      btn.title = "모든 학생이 다섯 문항을 맞혔어요.";
      progress.textContent = "🎉 틀린 문항이 없어요. 모두 잘 이해했습니다.";
      if (onSeen) onSeen(0, 0);
    } else {
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
    }

    box.appendChild(el("div", { class: "t-wrong__controls" }, [btn, progress]));
    box.appendChild(body);
    return box;
  }

  T.wrong = { render: render, topWrong: topWrong, WRONG_LIMIT: WRONG_LIMIT };
})();

    <script data-from="teacher/t40-detail.js">
/**
 * 탭 6 — 학생별 보기 (명세 11장 6번)

 * 왼쪽에서 학생을 고르면 오른쪽에 그 학생의 모든 것이 나온다.

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;
  var selectedId = "";

  function keyOf(row) {
    return row.studentId + "|" + row.studentName;
  }

  function render(rows) {

    /* 고른 학생이 거르기에서 빠졌으면 첫 번째로 되돌린다 */
    var current = null;
    rows.forEach(function (r) {
      if (keyOf(r) === selectedId) current = r;
    });

      current = rows[0];

      );
    });

    /* ----- 오른쪽 : 고른 학생 ----- */
    var pane = el("div", { class: "detail__pane" });
    pane.appendChild(
      el("div", { class: "detail__head" }, [
        el("h3", { class: "detail__name", text: current.studentId + " " + current.studentName }),

    var marks = el("div", { class: "t-tablewrap" }, [
      el("table", { class: "t-table" }, [
        el("thead", {}, [
          el("tr", {}, [

        ]),
        el("tbody", {}, PC.quiz.QUESTIONS.map(function (q, i) {
          var found = null;
          (current.assessment.answers || []).forEach(function (a) {
            if (a && a.id === q.id) found = a;
          });
          var correct = current.assessment.isCorrect[i] === true;
          var shown = "(답하지 않음)";
          if (found && found.value !== null && found.value !== undefined && found.value !== "") {
            shown = q.type === "choice" ? "제" + (Number(found.value) + 1) + "번" : String(found.value);
          }
          return el("tr", {}, [

            el("td", { class: correct ? "cell--ok" : "cell--no", text: correct ? "✔ 맞음" : "✘ 틀림" })

    var predicts = current.intro && current.intro.predicts ? current.intro.predicts : [];
    if (predicts.length > 0) {
      var CHOICES = ((PC.lesson || {}).PREDICT || {}).choices || [];
      pane.appendChild(
        T.views.section("1단계 예측 (채점하지 않음)", [

          el("p", { class: "t-meta", text:

          (current.circuit.completed ? "✔ 완성" : "✘ 미완성") +
          " · 시도 " + current.circuit.attempts + "회 · 힌트 " + current.circuit.hintsUsed + "회 · 전원 " +
          (current.circuit.powerOn ? "켬" : "안 켬")
        }),
        conns.length === 0
          ? K.empty("이은 케이블이 없습니다.")
          : el("ul", { class: "connlist" }, conns.map(function (c) {

                text:

          : null,
        (current.circuit.dangerEvents || []).length === 0

              el("ul", { class: "connlist" }, current.circuit.dangerEvents.map(function (e) {
                return el("li", { text: (e.title || e.code) + (e.at ? " · " + K.fmtTime(e.at, true) : "") });
              }))
            ])
      ])
    );

    /* 코드와 수정 이력 */
    pane.appendChild(
      T.views.section("코드", [
        el("p", { class: "t-meta", text:
          "검사 " + current.code.testsPassed + " / " + current.code.testsTotal +
          " · 실행 " + current.code.attempts + "회 · 방식 " + (T.views.MODE_NAME[current.code.mode] || "—")
        }),
        K.codeBox(current.code.source),
        (current.code.syntaxErrors || []).length === 0
          ? null
          : el("div", {}, current.code.syntaxErrors.map(function (e) {
              return el("p", { class: "t-problem", text: "문법 " + (typeof e === "string" ? e : e && e.message) });
            })),
        (current.code.pinMismatch || []).length === 0
          ? null
          : el("div", {}, current.code.pinMismatch.map(function (m) {
              var tag = m && m.kind === "swapped" ? "★ 역할 뒤바뀜 " : "핀 ";
              return el("p", { class: "t-problem", text: tag + (m && m.message) });
            })),
        /* 수정 이력 (명세 9장 6번) — 어떤 순서로 통과 수가 늘었는가 */
        (current.code.history || []).length === 0
          ? null
          : el("div", {}, [
              el("p", { class: "t-meta", text: "수정 이력" }),
              el("ul", { class: "connlist" }, current.code.history.map(function (h) {
                return el("li", {

                    K.fmtTime(h.at, true) + " · " + (T.views.MODE_NAME[h.mode] || h.mode || "—") +
                    " · 통과 " + h.passed + " / " + h.total
                });
              }))
            ])

    var conditions = current.experiment.conditions || [];
    var notes = {};
    (current.experiment.observations || []).forEach(function (o) {
      if (o && o.id) notes[o.id] = o;
    });
    pane.appendChild(
      T.views.section("실험 기록", [

          ? K.empty("실험 기록이 없습니다.")
          : el("div", {}, conditions.map(function (c) {
              var note = notes[c.id] || {};

                  (c.moving ? "움직임" : "정지") + " · DO " + (c.doLevel || "—") + " · LED " +
                  (c.ledOn ? "켜짐" : "꺼짐") + " · 시리얼 «" + (c.serial || "—") + "»"
                }),
                el("p", { class: "t-answer__why", text: "예상 : " + (note.predict || "(적지 않음)") }),
                el("p", { class: "t-answer__why", text: "관찰 : " + (note.observation || "(적지 않음)") }),
                el("p", { class: "t-answer__why", text: "다른 점 : " + (note.surprise || "(적지 않음)") })
              ]);

    var keep = current.experiment.keepOn || {};
    if (String(keep.text || "").trim()) {

  T.detail = {

    select: function (id) {

    <script data-from="teacher/t45-list.js">
/* ------------------------------------------------------------------
 * 5장 — 전체 명단 · 정오표
 *
 * 짜임새를 lesson3_7_1 의 교사용 4장과 «같게» 맞추었다.
 *   · 📎 학생 명단 올리기 (.xlsx / .csv) → 제출하지 않은 학생까지 표에 나온다
 *   · 📋 전체 명단 · 정오표 — 점수 + 문항별 O / X / -
 *   · 🖨 인쇄 · CSV 내려받기
 *
 * 명단을 올려야 «누가 안 냈는지» 를 알 수 있다. 낸 사람만 세면 빠진 학생이 보이지 않는다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 buildRows·marksOf·csvRows 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  /* 정오 표시 — 색만으로 알리지 않는다. 글자가 뜻을 진다. */
  var MARK = { correct: "O", wrong: "X", none: "-" };
  var MARK_CLASS = { correct: "is-o", wrong: "is-x", none: "is-none" };
  var MARK_LABEL = { correct: "정답", wrong: "오답", none: "무응답" };

  /** 올린 명단 — { students, warnings } 또는 null */
  var roster = null;

  function setRoster(next) {
    roster = next;
  }

  function getRoster() {
    return roster;
  }

  /**
   * 표에 넣을 줄을 만든다.
   * 명단이 있으면 «명단 순서» 대로 놓고, 명단에 없는 제출은 뒤에 붙인다.
   */
  function buildRows(list) {
    var rows = [];
    var byId = {};
    var norm = T.roster ? T.roster.normalizeId : function (v) {
      return String(v || "");
    };

    (list || []).forEach(function (r) {
      byId[norm(r.studentId)] = r;
    });

    if (roster) {
      var used = {};
      roster.students.forEach(function (s) {
        var key = norm(s.id);
        var found = byId[key] || null;
        if (found) used[key] = true;
        rows.push({
          studentId: s.id,
          name: s.name || (found ? found.studentName : ""),
          data: found,
          submitted: !!found,
          inRoster: true
        });
      });
      /* 명단에 없는 학번으로 낸 학생도 빠뜨리지 않는다 */
      (list || []).forEach(function (r) {
        if (used[norm(r.studentId)]) return;
        rows.push({
          studentId: r.studentId,
          name: r.studentName,
          data: r,
          submitted: true,
          inRoster: false
        });
      });
      return rows;
    }

    (list || []).forEach(function (r) {
      rows.push({
        studentId: r.studentId,
        name: r.studentName,
        data: r,
        submitted: true,
        inRoster: true
      });
    });
    return rows;
  }

  /** 한 학생의 문항별 정오를 { q1: "correct", … } 로 */
  function marksOf(row) {
    var out = {};
    if (!row.submitted || !row.data) return out;
    PC.quiz.QUESTIONS.forEach(function (q, i) {
      var flag = row.data.assessment.isCorrect[i];
      var answer = null;
      (row.data.assessment.answers || []).forEach(function (a) {
        if (a && a.id === q.id) answer = a;
      });
      var empty = !answer || answer.value === null || answer.value === undefined || answer.value === "";
      out[q.id] = flag === true ? "correct" : empty ? "none" : "wrong";
    });
    return out;
  }

  /* ---------------------------------------------------------------- */
  /* 명단 올리기                                                        */
  /* ---------------------------------------------------------------- */

  /** 읽어만 두고 아직 반영하지 않은 명단 */
  var pending = null;

  function buildRosterUpload(onChange) {
    var box = K.panel({
      title: "📎 학생 명단 올리기",
      hint: "엑셀(.xlsx) 또는 CSV 파일을 올리면 제출하지 않은 학생까지 함께 표시돼요.",
      className: "t-roster-src no-print"
    });

    var status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });

    function say(kind, message) {
      status.className = "t-status" + (kind ? " is-" + kind : "");
      status.textContent = message;
    }

    var fileInput = el("input", {
      class: "sr-only",
      id: "t-roster-file",
      attrs: {
        type: "file",
        accept: ".xlsx,.csv,.tsv,.txt",
        "aria-label": "학생 명단 파일 고르기"
      }
    });

    var applyBtn = el("button", {
      class: "btn btn--primary",
      text: "\u2705 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!pending) {
            say("error", "먼저 학생 명단 파일을 올려 주세요.");
            return;
          }
          setRoster(pending);
          pending = null;
          if (onChange) onChange();
          K.announce("전체 정오표를 표시했습니다.");
        }
      }
    });

    var clearBtn = el("button", {
      class: "btn btn--ghost",
      text: "명단 지우기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setRoster(null);
          pending = null;
          fileInput.value = "";
          if (onChange) onChange();
        }
      }
    });

    function load(file) {
      if (!file) return;
      say("loading", "명단을 읽고 있어요…");
      T.roster.parseFile(file).then(
        function (result) {
          pending = result;
          var message = "명단 " + result.students.length + "명을 읽었어요. [\u2705 확인] 을 누르면 정오표를 만듭니다.";
          if (result.warnings.length) message += " (건너뛴 줄 " + result.warnings.length + "개)";
          say("", message);
          applyBtn.disabled = false;
          clearBtn.disabled = false;
        },
        function (err) {
          pending = null;
          applyBtn.disabled = true;
          say("error", err && err.message ? err.message : "명단을 읽지 못했어요.");
        }
      );
    }

    fileInput.addEventListener("change", function () {
      load(fileInput.files && fileInput.files[0]);
    });

    var pick = el("button", {
      class: "btn btn--ghost",
      text: "명단 파일 선택",
      attrs: { type: "button" },
      on: {
        click: function () {
          fileInput.click();
        }
      }
    });

    /* 처음 상태 — 이미 반영된 명단이 있으면 그 사실을 알려 준다 */
    if (roster) {
      say("ok", "명단 " + roster.students.length + "명과 제출 답안을 맞춰 전체 정오표를 만들었어요.");
    } else {
      say("", "명단을 올리면 미제출 학생까지 확인할 수 있어요.");
    }
    applyBtn.disabled = !pending;
    clearBtn.disabled = !roster && !pending;

    var drop = el("div", {
      class: "t-drop",
      text: "또는 명단 파일을 이곳에 끌어다 놓으세요. (.xlsx · .csv)"
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var file = (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) || null;
      load(file);
    });

    box.body.appendChild(el("div", { class: "t-source__row" }, [pick, applyBtn, clearBtn, fileInput]));
    box.body.appendChild(status);
    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", { text: "첫 줄에 「학번」·「이름」 머리글이 있으면 자동으로 찾아요. 머리글이 없으면 첫 번째 열을 학번, 두 번째 열을 이름으로 읽습니다." })
    );
    hints.appendChild(
      el("li", { text: "엑셀이 열리지 않으면 「다른 이름으로 저장 \u2192 CSV UTF-8」 로 저장해 올려 주세요." })
    );
    box.body.appendChild(hints);

    if (roster && roster.warnings.length) {
      var warn = el("div", { class: "t-warn" });
      warn.appendChild(el("p", { text: "건너뛴 줄이 있어요." }));
      var ul = el("ul", { class: "t-hint-list" });
      roster.warnings.slice(0, 5).forEach(function (line) {
        ul.appendChild(el("li", { text: line }));
      });
      warn.appendChild(ul);
      box.body.appendChild(warn);
    }

    return box.root;
  }

  /* ---------------------------------------------------------------- */
  /* 전체 명단 · 정오표                                                  */
  /* ---------------------------------------------------------------- */

  function buildTable(list) {
    var box = K.panel({
      title: "📋 전체 명단 · 정오표",
      hint: "제출한 학생은 점수와 문항별 정오(O · X)를, 제출하지 않은 학생은 「미제출」 로 표시해요."
    });

    var rows = buildRows(list);

    if (!rows.length) {
      box.body.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box.root;
    }

    var inRoster = roster
      ? rows.filter(function (r) {
          return r.inRoster;
        })
      : rows;
    var submitted = inRoster.filter(function (r) {
      return r.submitted;
    }).length;
    var missing = inRoster.length - submitted;
    var extra = roster ? rows.length - inRoster.length : 0;

    var cards = [
      K.statCard(roster ? "명단 인원" : "제출 학생", roster ? roster.students.length : rows.length, "", "명"),
      K.statCard("제출", submitted, "", "명"),
      K.statCard("미제출", missing, "", "명")
    ];
    if (extra) cards.push(K.statCard("명단 밖 제출", extra, "", "명"));
    box.body.appendChild(K.statRow(cards));

    if (!roster) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint no-print",
          text: "학생 명단을 올리면 명단 순서대로, 명단에 있는 학생이 빠짐없이 표시돼요."
        })
      );
    }
    if (extra) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint",
          text: "명단에 없는 학번으로 낸 학생이 " + extra + "명 있어요. 표 아래쪽에 함께 두었습니다."
        })
      );
    }

    /* 표 */
    var head = el("tr", {}, [
      el("th", { attrs: { scope: "col" }, text: "학번" }),
      el("th", { attrs: { scope: "col" }, text: "이름" }),
      el("th", { attrs: { scope: "col" }, text: "점수" })
    ].concat(
      PC.quiz.QUESTIONS.map(function (q) {
        return el("th", { attrs: { scope: "col" }, text: q.no + "번" });
      })
    ).concat([
      el("th", { attrs: { scope: "col" }, text: "회로" }),
      el("th", { attrs: { scope: "col" }, text: "코드" })
    ]));

    var body = rows.map(function (row) {
      if (!row.submitted) {
        return el("tr", { class: "is-missing" }, [
          el("td", { text: row.studentId || "-" }),
          el("td", { text: row.name || "-" }),
          el("td", {
            class: "t-missing",
            text: "미제출",
            attrs: { colspan: String(3 + PC.quiz.QUESTIONS.length) }
          })
        ]);
      }

      var marks = marksOf(row);
      var d = row.data;
      return el("tr", {}, [
        el("td", { text: row.studentId || "-" }),
        el("td", { text: row.name || "-" }),
        el("td", { class: "t-score", text: d.assessment.score + "점" })
      ].concat(
        PC.quiz.QUESTIONS.map(function (q) {
          var mark = marks[q.id] || "none";
          return el("td", {
            class: "t-mark " + (MARK_CLASS[mark] || "is-none"),
            text: MARK[mark] || "-",
            attrs: { "aria-label": q.no + "번 " + (MARK_LABEL[mark] || "무응답") }
          });
        })
      ).concat([
        el("td", {
          class: "t-mark " + (d.circuit.completed ? "is-o" : "is-x"),
          text: d.circuit.completed ? "O" : "X",
          attrs: { "aria-label": d.circuit.completed ? "회로 완성" : "회로 미완성" }
        }),
        el("td", {
          class: "t-mark " + (d.code.testsPassed >= d.code.testsTotal && d.code.testsTotal > 0 ? "is-o" : "is-x"),
          text: d.code.testsPassed + "/" + d.code.testsTotal
        })
      ]));
    });

    box.body.appendChild(
      el("div", { class: "t-table-wrap" }, [
        el("table", { class: "t-list-table" }, [
          el("thead", {}, [head]),
          el("tbody", {}, body)
        ])
      ])
    );
    box.body.appendChild(
      el("p", { class: "panel__hint", text: "O 정답 · X 오답 · - 무응답 · 코드 칸은 통과한 검사 수입니다." })
    );

    /* 인쇄 · 내려받기 */
    box.body.appendChild(
      K.btnRow([
        el("button", {
          class: "btn btn--primary",
          text: "🖨 이 표 인쇄하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              if (T.main && T.main.stampPrintDate) T.main.stampPrintDate();
              window.print();
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost",
          text: "CSV 로 내려받기",
          attrs: { type: "button" },
          on: {
            click: function () {
              downloadCsv(rows);
            }
          }
        })
      ])
    );
    box.body.appendChild(
      el("p", {
        class: "panel__hint no-print",
        text: "출력 날짜는 첫 장 위쪽에 한 번만 찍혀요. 인쇄 창에서 「머리글/바닥글」 을 끄면 브라우저가 장마다 넣는 날짜·주소가 사라집니다."
      })
    );

    return box.root;
  }

  /** 정오표를 CSV 로 (엑셀이 한글을 깨뜨리지 않게 BOM 을 붙인다 — t60-csv 와 같은 방식) */
  function csvRows(rows) {
    var header = ["학번", "이름", "점수", "이수"];
    PC.quiz.QUESTIONS.forEach(function (q) {
      header.push(q.no + "번");
    });
    header.push("회로완성", "코드통과", "제출여부");

    var out = [header];
    (rows || []).forEach(function (row) {
      if (!row.submitted) {
        var blank = [row.studentId, row.name, "", ""];
        PC.quiz.QUESTIONS.forEach(function () {
          blank.push("");
        });
        blank.push("", "", "미제출");
        out.push(blank);
        return;
      }
      var marks = marksOf(row);
      var d = row.data;
      var line = [row.studentId, row.name, d.assessment.score, d.assessment.pass ? "이수" : "미이수"];
      PC.quiz.QUESTIONS.forEach(function (q) {
        line.push(MARK[marks[q.id] || "none"] || "-");
      });
      line.push(d.circuit.completed ? "완성" : "미완성", d.code.testsPassed + "/" + d.code.testsTotal, "제출");
      out.push(line);
    });
    return out;
  }

  function downloadCsv(rows) {
    var ok = T.csv.download(csvRows(rows), "정오표");
    K.toast(ok ? "CSV 파일로 저장했어요." : "이 브라우저에서는 내려받기를 쓸 수 없습니다.");
  }

  /** 5장 본문 전체 */
  function render(list, onChange) {
    var box = el("div", { class: "stack" });
    box.appendChild(buildRosterUpload(onChange));
    box.appendChild(buildTable(list));
    return box;
  }

  T.list = {
    render: render,
    buildRows: buildRows,
    marksOf: marksOf,
    csvRows: csvRows,
    setRoster: setRoster,
    getRoster: getRoster
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.list;
})();

    <script data-from="teacher/t50-guide.js">
/**
 * 탭 7 — 정답·지도 (명세 9장 7번 · 10장)
 *
 * 회로 정답, 기준 코드, 문항 정답·해설, 대표 오개념과 지도 포인트.
 * 여기 나오는 내용은 shared/teacher-notes.js 에서 온다. 학생용은 그 파일을 읽지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  function render() {
    var box = el("div");
    var notes = PC.TEACHER_NOTES;

    if (!notes) {
      box.appendChild(K.empty("정답 자료를 불러오지 못했습니다."));
      return box;
    }

    box.appendChild(
      el("div", { class: "alert alert--warn" }, [
        el("span", { class: "alert__icon", attrs: { "aria-hidden": "true" }, text: "⚠" }),
        el("div", { class: "alert__body" }, [
          el("p", { text: "이 탭에는 정답이 그대로 적혀 있습니다. 화면을 학생에게 보이지 않도록 주의하세요." })
        ])
      ])
    );

    /* ---- 회로 정답 (명세 12장) ---- */
    var circuit = notes.CIRCUIT_ANSWER;
    box.appendChild(
      T.views.section("회로 정답", [
        el("p", { class: "t-answerline", text: circuit.summary }),
        el("ol", { class: "guide__steps" }, circuit.steps.map(function (s) {
          return el("li", { text: s });
        })),
        el("h4", { class: "guide__sub", text: "자주 나오는 오결선" }),
        el("ul", { class: "guide__errors" }, circuit.commonErrors.map(function (e) {
          return el("li", {}, [el("b", { text: e.pattern + " — " }), el("span", { text: e.why })]);
        }))
      ])
    );

    /* ---- 기준 코드 (명세 8장) ---- */
    box.appendChild(
      T.views.section("기준 코드", [
        K.codeBox(notes.REFERENCE_CODE),
        el("p", { class: "t-note", text: notes.REFERENCE_NOTE })
      ])
    );

    /* ---- 문항 정답·해설 (명세 9장) ---- */
    var items = PC.quiz.QUESTIONS.map(function (q) {
      var source = null;
      notes.ANSWERS.forEach(function (a) {
        if (a.id === q.id) source = a;
      });
      if (!source) return null;

      var answerLine =
        q.type === "choice"
          ? "제" + (source.answerIndex + 1) + "번 — " + source.answerText
          : source.answerText;

      return el("div", { class: "guide__q" }, [
        el("p", { class: "guide__qhead", text: q.no + "번 · " + q.tag + " · " + q.points + "점" }),
        el("p", { class: "t-stem", text: q.stem }),
        q.type === "choice"
          ? el("ol", { class: "guide__choices" }, q.choices.map(function (c, i) {
              return el("li", { class: i === source.answerIndex ? "guide__choice--answer" : "" }, [
                el("span", { text: c }),
                i === source.answerIndex ? el("span", { class: "guide__mark", text: " ← 정답" }) : null
              ]);
            }))
          : K.codeBox(answerLine),
        el("p", { class: "t-answerline", text: "정답 : " + answerLine.replace(/\n/g, "  ⏎  ") }),
        el("p", { class: "guide__why", text: source.explanation }),
        q.id === "q5"
          ? el("p", { class: "t-note", text:
              "채점 규칙(명세 6.6) — 줄 앞뒤 공백·빈 줄·들여쓰기·주석은 무시합니다. " +
              "int motion · digitalRead(motionPin) · if · motion == HIGH 의 대소문자와 " +
              "«두 줄의 순서» 는 지켜야 하고, 첫 줄의 세미콜론은 필수입니다. " +
              "둘째 줄의 여는 중괄호 { 는 있어도 없어도 정답으로 봅니다." })
          : null
      ]);
    }).filter(Boolean);

    box.appendChild(T.views.section("형성평가 정답과 해설", items));

    /* ---- 실험 정답표 (명세 10장) ---- */
    var expAnswer = notes.EXPERIMENT_ANSWER || [];
    box.appendChild(
      T.views.section("필수 실험 ①②③ 의 예상 결과", [
        el("div", { class: "t-tablewrap" }, [
          el("table", { class: "t-table" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { text: "실험" }),
                el("th", { text: "DO" }),
                el("th", { text: "LED" }),
                el("th", { text: "시리얼" }),
                el("th", { text: "이렇게 된다" })
              ])
            ]),
            el("tbody", {}, expAnswer.map(function (e) {
              return el("tr", {}, [
                el("td", { text: e.label }),
                el("td", { class: "cell--mono", text: e.expectedDo }),
                el("td", { text: e.expectedLed }),
                el("td", { class: "cell--mono", text: e.expectedSerial }),
                el("td", { text: e.expected })
              ]);
            }))
          ])
        ]),
        el("p", { class: "t-note", text:
          "학생의 «관찰» 이 이 칸과 꼭 같은 말일 필요는 없습니다. " +
          "실험 ②에서 «사람이 있는데도 꺼진다» 를 알아챘는지가 이 차시의 핵심입니다." })
      ])
    );

    /* ---- 확장 탐구 예시 답 (명세 10장 마지막 줄) ---- */
    var ext = notes.EXTENSION_ANSWER;
    if (ext) {
      box.appendChild(
        T.views.section("확장 탐구 예시 답 — " + ext.goal, [
          /* ★ 학생에게 «코드» 를 요구하지 않는다. 말이나 의사코드면 통과다. */
          el("p", { class: "t-note", text:
            "★ 학생에게 코드를 요구하지 않습니다. 아래 «말로 적기» 두 가지가 글에 있으면 통과로 봅니다." }),
          el("h4", { class: "guide__sub", text: "말로 적기" }),
          el("ol", { class: "guide__steps" }, (ext.plain || []).map(function (line) {
            return el("li", { text: line });
          })),
          el("h4", { class: "guide__sub", text: "의사코드" }),
          el("ul", { class: "guide__errors" }, (ext.pseudo || []).map(function (line) {
            return el("li", { text: line });
          })),
          el("h4", { class: "guide__sub", text: "코드로 옮기면 (참고용 · 다음 차시 내용)" }),
          K.codeBox(ext.code),
          el("p", { class: "t-note", text: ext.note })
        ])
      );
    }

    /* ---- 코드에서 자주 나오는 오류 (명세 10장) ---- */
    var codeErrors = notes.CODE_ERRORS || [];
    if (codeErrors.length > 0) {
      box.appendChild(
        T.views.section(
          "코드에서 자주 나오는 오류와 지도",
          codeErrors.map(function (e) {
            return el("div", { class: "guide__miscon" }, [
              el("h4", { class: "guide__sub", text: e.pattern }),
              el("p", {}, [el("b", { text: "무슨 일이 생기나 : " }), el("span", { text: e.why })]),
              el("p", { class: "guide__teach" }, [
                el("b", { text: "이렇게 지도합니다 : " }),
                el("span", { text: e.how })
              ])
            ]);
          })
        )
      );
    }

    /* ---- 대표 오개념 (명세 12장) ---- */
    box.appendChild(
      T.views.section(
        "대표 오개념과 지도 포인트",
        notes.MISCONCEPTIONS.map(function (m) {
          return el("div", { class: "guide__miscon" }, [
            el("h4", { class: "guide__sub", text: m.title }),
            el("p", {}, [el("b", { text: "학생 생각 : " }), el("span", { text: m.wrong })]),
            el("p", {}, [el("b", { text: "바른 개념 : " }), el("span", { text: m.right })]),
            el("p", { class: "guide__teach" }, [el("b", { text: "이렇게 지도합니다 : " }), el("span", { text: m.how })])
          ]);
        })
      )
    );

    /* ---- 수업 진행 도움말 ---- */
    box.appendChild(
      T.views.section("수업 진행 도움말", [
        el("ul", { class: "guide__tips" }, notes.TEACHING_TIPS.map(function (t) {
          return el("li", { text: t });
        }))
      ])
    );

    /* ---- 권장 시간 (명세 12장) ---- */
    box.appendChild(
      T.views.section("권장 시간", [
        el("div", { class: "t-tablewrap" }, [
          el("table", { class: "t-table" }, [
            el("thead", {}, [el("tr", {}, [el("th", { text: "활동" }), el("th", { text: "시간" })])]),
            el("tbody", {}, PC.STEPS.map(function (s) {
              return el("tr", {}, [el("td", { text: s.label }), el("td", { text: s.minutes + "분" })]);
            }))
          ])
        ])
      ])
    );

    return box;
  }

  T.guide = { render: render };
})();

    <script data-from="teacher/t60-csv.js">
/**
 * CSV 내려받기 (명세 9장)
 *
 * 엑셀이 한글을 깨뜨리지 않도록 맨 앞에 BOM 을 붙인다.
 * 쉼표·따옴표·줄바꿈이 든 칸은 따옴표로 감싸고 안쪽 따옴표는 두 번 적는다.
 *
 * ★★ «수식 주입» 을 막는다 (명세 9장 마지막에서 세 번째 줄)
 *
 *   학생이 이름이나 관찰 칸에 «=cmd|...» 처럼 적어 두면, 엑셀·구글 시트가 그것을
 *   «수식» 으로 읽어 실행하려 든다. 그래서 =, +, -, @ (그리고 탭·캐리지리턴)로
 *   시작하는 칸 앞에 작은따옴표를 붙여 «글자» 로 못 박는다.

 *   음수를 적는 칸은 이 앱에 없다.

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /** 수식으로 읽힐 수 있는 첫 글자 */
  var RISKY = /^[=+\-@\t\r]/;

  function cell(value) {

    /* ★ 수식 주입 막기 — 위험한 첫 글자 앞에 작은따옴표를 붙인다.
       숫자만 든 칸은 건드리지 않는다(점수·횟수가 글자로 바뀌면 합계를 낼 수 없다). */
    if (RISKY.test(s) && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;

    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function toRows(list) {
    var questions = PC.quiz.QUESTIONS;

    var header = ["학번", "학년", "반", "번호", "이름", "제출시각", "점수", "총점", "이수"]
      .concat(questions.map(function (q) {
        return q.no + "번";
      }))
      .concat([
        "회로완성",
        /* 이 차시의 알맹이 — «미완성» 만으로는 어느 줄을 놓쳤는지 알 수 없다 */
        "PIR_VCC",
        "PIR_GND",
        "PIR_OUT",
        "핀교차",
        "LED극성",
        "저항",
        "회로시도",
        "힌트",
        "위험연결",
        "코드통과",
        "코드시도",
        "코드방식",
        "입출력뒤바뀜",
        "실험횟수",
        "관찰작성",
        "확장탐구"
      ]);

    var rows = (list || []).map(function (r) {
      var answers = {};
      (r.assessment.answers || []).forEach(function (a) {
        if (a) answers[a.id] = a.value;
      });

      var perQuestion = questions.map(function (q, i) {
        var ok = r.assessment.isCorrect[i] === true ? "O" : "X";
        var value = answers[q.id];
        var shown =
          value === null || value === undefined || value === ""
            ? "무응답"
            : q.type === "choice"
              ? "제" + (Number(value) + 1) + "번"
              : String(value).replace(/\s+/g, " ");
        return ok + " " + shown;
      });

      /* 관찰은 이제 { id, predict, observation, surprise } 꼴이다 */
      var observationCount = (r.experiment.observations || []).filter(function (o) {
        return String((o && o.observation) || "").trim().length > 0;
      }).length;

      var path = r.circuit.path || {};
      var polarity =
        path.ledDirection === "forward"
          ? "정상"
          : path.ledDirection === "reverse"
            ? "역극성"
            : path.ledDirection
              ? "경로끊김"
              : "";
      var resistor = path.ledDirection ? (path.hasResistor ? path.resistanceOhm + "Ω" : "없음") : "";

      function mark(ok) {
        return path.ledDirection || path.pirVcc || path.pirGnd || path.pirOut ? (ok ? "O" : "X") : "";
      }

      var swappedCode = (r.code.pinMismatch || []).some(function (m) {
        return m && m.kind === "swapped";
      });

      return [
        r.studentId,
        r.grade,
        r.classNumber,
        r.studentNumber,
        r.studentName,
        T.core.fmtTime(r.serverUpdatedAt || r.submittedAt, true),
        r.assessment.score,
        r.assessment.total,
        r.assessment.pass ? "이수" : "미이수"
      ]
        .concat(perQuestion)
        .concat([
          r.circuit.completed ? "완성" : "미완성",
          mark(path.pirVcc),
          mark(path.pirGnd),
          mark(path.pirOut),
          path.pinsSwapped ? "교차" : "",
          polarity,
          resistor,
          r.circuit.attempts,
          r.circuit.hintsUsed,
          (r.circuit.dangerEvents || []).length,
          r.code.testsPassed + "/" + r.code.testsTotal,
          r.code.attempts,
          (T.views && T.views.MODE_NAME ? T.views.MODE_NAME[r.code.mode] : "") || r.code.mode || "",
          swappedCode ? "뒤바뀜" : "",
          (r.experiment.conditions || []).filter(function (c) {
            return c && c.ran;
          }).length,
          observationCount,
          r.experiment.keepOn && r.experiment.keepOn.tried ? "함" : ""

    });

    return [header].concat(rows);
  }

  function toText(list) {
    return toRows(list)
      .map(function (row) {
        return row.map(cell).join(",");
      })
      .join("\r\n");
  }

  /** 파일 이름 : physical_5_제출현황_2026-08-21.csv */
  function fileName(now, label) {
    var d = now ? new Date(now) : new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var stamp = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
    return PC.LESSON_ID + "_" + (label || "제출현황") + "_" + stamp + ".csv";
  }

  function download(list, label) {
    if (typeof document === "undefined") return false;
    try {
      var blob = new Blob(["﻿" + toText(list)], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName(null, label);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  T.csv = { cell: cell, toRows: toRows, toText: toText, fileName: fileName, download: download };

  if (typeof module !== "undefined" && module.exports) module.exports = T.csv;
})();

 *
 * ★ 장을 늘리지 않는다.

 *   3·4장 안에 접어 둔다(details). 닫힌 채로 나오므로 화면 모양은 그대로다.

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;

  /**

   *   2 대시보드        참여 수 · 제출률 · 평균 · 이수 · 점수 분포 · 상위 3명
   *   3 형성평가        가장 많이 틀린 문제 · 전체 명단·정오표

   */
  var PAGES = [
    { no: 1, label: "결과 불러오기" },
    { no: 2, label: "대시보드" },
    { no: 3, label: "형성평가" },
    { no: 4, label: "회로 수행" },
    { no: 5, label: "코드 수행" },

  function loadExpected() {
    try {

  function loadEndpoint() {
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || "";

  }

  /**
   * 자료가 들어왔는가.

  function rows() {

  /* ---------------------------------------------------------------- */

  /* ---------------------------------------------------------------- */

  function buildHeader(host) {
    host.appendChild(
      el("header", { class: "t-header" }, [
        el("p", { class: "t-header__eyebrow", text: "교사용 · " + PC.LESSON_UNIT }),
        el("h1", { class: "t-header__title", text: "형성평가 결과 분석" }),

          text: "학생들이 제출한 답안을 읽어 상위 3명과 가장 많이 틀린 문제를 정리해 보여 줍니다."

      ])
    );

    /* 인쇄물 맨 위에만 한 번 찍히는 날짜 */
    refs.printDate = el("p", { class: "t-printdate" });
    host.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener("beforeprint", stampPrintDate);

  /** 인쇄물 맨 위 날짜 (예 : 2026년 8월 18일 (화) 출력) */

    var day = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];

    refs.endpoint.value = loadEndpoint();

    /* 교사 열쇠 —
       이 차시의 서버는 열쇠가 맞을 때만 목록을 준다(스크립트 속성 TEACHER_KEY).
       그래서 주소 칸과 같은 줄에 하나를 더 둔다. */
    refs.teacherKey = el("input", {
      class: "t-source__input",
      attrs: { type: "password", placeholder: "교사 열쇠", "aria-label": "교사 열쇠", autocomplete: "off" }
    });

    var btnServer = el("button", {
      class: "btn btn--primary",
      text: "제출 결과 불러오기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에서 읽고 있어요…");
          note("");
          T.data.fetchFromServer(refs.endpoint.value, refs.teacherKey.value).then(function (result) {
            if (!result.ok) {
              setStatus("error", result.message);
              return;
            }
            saveEndpoint(refs.endpoint.value);
            afterLoad(result.count, result.hint);
          });
        }
      }
    });

    refs.fileInput = el("input", {
      class: "sr-only",
      id: "t-file",
      attrs: { type: "file", accept: ".json,application/json", multiple: true, "aria-label": "제출 JSON 파일 열기" }
    });
    refs.fileInput.addEventListener("change", function () {
      if (refs.fileInput.files && refs.fileInput.files.length) {
        T.data.readFiles(refs.fileInput.files).then(function (r) {
          afterLoad(r);
        });
      }
    });

    var btnFile = el("button", {
      class: "btn btn--ghost",
      text: "JSON 파일 열기",
      attrs: { type: "button" },
      on: {
        click: function () {
          refs.fileInput.click();
        }
      }
    });

    /* 무엇이 빠졌는지 짚어 주는 단추 — 폴더·열쇠·Drive API 를 서버에 물어본다 */
    var btnPing = el("button", {
      class: "btn btn--ghost",
      text: "연결 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에 물어보고 있어요…");
          T.data.pingServer(refs.endpoint.value, refs.teacherKey.value).then(function (r) {
            if (r.ok === false && !r.driveAccess) {
              setStatus("error", r.message || "확인하지 못했습니다.");
              return;
            }

            var lines = [];
            lines.push("폴더 설정 " + (r.folderConfigured ? "✔" : "✘ FOLDER_ID 를 넣어야 합니다"));
            lines.push("교사 열쇠 " + (r.teacherKeyConfigured ? "✔" : "✘ TEACHER_KEY 를 넣어야 합니다"));
            lines.push("폴더 훑는 길 : " + (r.driveAccess || "알 수 없음"));
            if (r.folderName) lines.push("폴더 «" + r.folderName + "» 에 제출 " + r.fileCount + "개");
            if (r.reason) lines.push("(" + r.reason + ")");

            var good = r.ok !== false && r.folderConfigured && r.teacherKeyConfigured;
            setStatus(good ? "ok" : "error", lines.join(" · "));

            /* 공유 드라이브인데 Drive API 를 켜지 않은 것이 가장 흔한 고장이다 */
            note(
              r.driveApiEnabled === false
                ? "공유 드라이브를 쓰신다면 Apps Script 편집기 왼쪽 «서비스 +» 에서 Drive API 를 추가한 뒤 " +
                    "새 버전으로 다시 배포해 주세요. 켜지 않으면 목록이 비어 오고, 재제출이 덮어써지지 않습니다."
                : ""
            );
          });
        }
      }
    });

    box.body.appendChild(
      el("div", { class: "t-source__row" }, [
        refs.endpoint,
        refs.teacherKey,
        btnServer,
        btnPing,
        btnFile,
        refs.fileInput
      ])
    );

    /* ------------------------------------------------------------ */
    /* 30초 자동 새로고침 (명세 9장 마지막 줄)                          */
    /*                                                              */
    /* ★ «사용자가 켠 경우만» 동작한다. 기본은 꺼짐이다.               */
    /*   수업 중에 학생 제출이 들어오는 것을 지켜보려고 켠다.           */
    /*                                                              */
    /* ★ 교사 열쇠는 «메모리에만» 둔다. 켤 때 값을 복사해 두지 않고,    */
    /*   그때그때 입력 칸에서 읽는다. 그래서 선생님이 칸을 지우면       */
    /*   자동 새로고침도 함께 멈춘다.                                 */
    /* ------------------------------------------------------------ */
    var refreshSeconds = (PC.CONFIG && PC.CONFIG.teacherRefreshSeconds) || 30;
    var autoId = K.el ? "t-auto-refresh" : "t-auto-refresh";
    refs.auto = el("input", { class: "check__input", id: autoId, attrs: { type: "checkbox" } });
    refs.autoNote = el("span", { class: "t-auto__note", attrs: { "aria-live": "polite" }, text: "" });

    function stopAuto() {
      if (refs.autoTimer) {
        window.clearInterval(refs.autoTimer);
        refs.autoTimer = null;
      }
      refs.autoNote.textContent = "";
    }

    function tickAuto() {
      var url = refs.endpoint.value;
      var key = refs.teacherKey.value;

      /* 주소나 열쇠가 비었으면 스스로 멈춘다 — 빈 값으로 서버를 두드리지 않는다 */
      if (!url || !key) {
        refs.auto.checked = false;
        stopAuto();
        setStatus("error", "주소와 교사 열쇠가 있어야 자동 새로고침이 됩니다. 껐습니다.");
        return;
      }

      T.data.fetchFromServer(url, key).then(function (result) {
        if (!result.ok) {
          /* 한 번 실패했다고 끄지는 않는다 — 잠깐 끊긴 것일 수 있다 */
          refs.autoNote.textContent = "마지막 새로고침 실패 : " + result.message;
          return;
        }
        var stamp = K.fmtTime(new Date().toISOString(), true);
        refs.autoNote.textContent =
          stamp + " 새로 " + result.count.added + "건 · 갱신 " + result.count.updated + "건";
        /* 지금 보고 있는 장을 그대로 다시 그린다 */
        drawPage(currentPage);
        updatePager();
      });
    }

    refs.auto.addEventListener("change", function () {
      stopAuto();
      if (!refs.auto.checked) return;
      refs.autoTimer = window.setInterval(tickAuto, refreshSeconds * 1000);
      refs.autoNote.textContent = refreshSeconds + "초마다 다시 읽습니다.";
      tickAuto();
    });

    box.body.appendChild(
      el("div", { class: "check t-auto" }, [
        refs.auto,
        el("label", {
          class: "check__label",
          attrs: { for: autoId },
          text: refreshSeconds + "초마다 자동으로 다시 읽기"
        }),
        refs.autoNote
      ])
    );

    refs.status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });
    setStatus("", "주소와 교사 열쇠를 넣은 뒤 「제출 결과 불러오기」 를 눌러 주세요.");
    box.body.appendChild(refs.status);

    refs.serverNote = el("div");
    box.body.appendChild(refs.serverNote);

    /* 끌어다 놓기 */
    var drop = el("div", {
      class: "t-drop",
      text: "또는 드라이브에서 내려받은 JSON 파일들을 이곳에 끌어다 놓으세요."
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var files = Array.prototype.filter.call((e.dataTransfer && e.dataTransfer.files) || [], function (f) {
        return /\.json$/i.test(f.name);
      });
      if (files.length) {
        T.data.readFiles(files).then(function (r) {
          afterLoad(r);
        });
      } else {
        setStatus("error", "JSON 파일만 열 수 있어요.");
      }
    });
    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", {
        text: "주소에서 바로 읽으려면 apps-script/Code.gs 를 웹앱으로 배포하고, 스크립트 속성의 TEACHER_KEY 를 위 칸에 넣어야 해요. 안 되면 [연결 확인] 을 눌러 보세요."
      })
    );
    hints.appendChild(
      el("li", {
        text: "배포가 어렵다면 드라이브 폴더에서 학번_이름.json 파일을 내려받아 「JSON 파일 열기」 로 한꺼번에 선택해도 됩니다."
      })
    );
    box.body.appendChild(hints);

    host.appendChild(box.root);

    /* 자료가 없을 때의 빈 안내 */
    refs.empty = K.panel({});
    refs.empty.body.appendChild(el("p", { class: "t-empty", text: "아직 불러온 제출이 없어요." }));
    refs.empty.body.appendChild(
      el("p", {
        class: "panel__hint",
        text: "위에서 「제출 결과 불러오기」 를 누르거나, 드라이브에서 내려받은 JSON 파일을 열어 주세요."
      })
    );
    host.appendChild(refs.empty.root);
  }

  /* ---------------------------------------------------------------- */
  /* 접어 두는 덧자료                                                   */
  /*                                                                  */
  /* 장을 늘리지 않고 이 차시에만 있는 자료를 담는 자리다.                  */
  /* 닫힌 채로 나오고 인쇄에서도 빠지므로 화면 모양은 lesson3_7_1 과 같다.   */
  /* ---------------------------------------------------------------- */

  function foldout(title, build) {
    var body = el("div", { class: "stack" });
    var wrap = el("details", { class: "t-fold no-print" }, [
      el("summary", { class: "t-fold__sum", text: title }),
      body
    ]);
    var built = false;
    /* 펼칠 때 만든다 — 열지 않으면 그리지 않아 장 넘기기가 빠르다 */
    wrap.addEventListener("toggle", function () {
      if (!wrap.open || built) return;
      built = true;
      build(body);
    });
    return wrap;
  }

  /* ---------------------------------------------------------------- */
  /* 각 장의 내용                                                       */
  /* ---------------------------------------------------------------- */

  function drawPage(no) {
    var page = pages[no - 1];
    if (!page) return;

    /* 1장은 처음 한 번만 만들고, 그 뒤에는 «빈 안내» 만 켜고 끈다 */
    if (no === 1) {
      if (refs.empty) refs.empty.root.hidden = hasData();
      return;
    }

    K.clear(page);

    /* ★ 4~7장은 «거른 뒤» 의 명단을 본다(명세 9장 «검색·정렬·필터»).
       거르기 막대는 장마다 한 벌씩 새로 만든다 — 상태는 T.filter 가 갖고 있다.

       ★ 3장(형성평가)에는 거르기 막대를 두지 «않는다».
         막대만 지우고 T.filter.apply 를 그대로 두면, 4~7장에서 걸어 둔 조건이
         3장에 «보이지 않게» 남아 명단이 조용히 줄어든다. 그래서 2·8장처럼 전체를 본다. */
    var all = rows();
    var shown = no === 2 || no === 3 || no === 8 ? all : T.filter.apply(all, filterState);

    if (no >= 4 && no <= 7) {
      page.appendChild(buildFilterBar(all, shown, no));
    }

    /* ── 2장 대시보드 ── */
    if (no === 2) {
      var expectedBox = K.panel({
        title: "🧮 예상 인원",
        hint: "반 인원을 넣으면 제출률을 함께 보여 줍니다. 학생 자료가 아니므로 이 기기에 기억됩니다."
      });
      var input = el("input", {
        class: "input input--number",
        attrs: { type: "number", min: "0", max: "60", inputmode: "numeric", "aria-label": "예상 인원(명)" }
      });
      input.value = expected ? String(expected) : "";
      input.addEventListener("input", function () {
        expected = Math.max(0, Math.min(200, Number(input.value) || 0));
        saveExpected(expected);
        drawPage(2);
      });
      expectedBox.body.appendChild(el("div", { class: "t-inline" }, [input, el("span", { text: "명" })]));
      page.appendChild(expectedBox.root);

      var summary = K.panel({ title: "📊 전체 요약" });
      summary.body.appendChild(T.views.summary(all, { expected: expected }));
      page.appendChild(summary.root);

      var podium = K.panel({ title: "🏆 상위 3명" });
      podium.body.appendChild(T.views.podium(all));
      page.appendChild(podium.root);
      return;
    }

    /* ── 3장 형성평가 ── */
    if (no === 3) {
      var wrongBox = K.panel({
        title: "📌 가장 많이 틀린 문제",
        hint: "버튼을 누를 때마다 한 문제씩 해설과 함께 보여 줍니다. (최대 " + T.wrong.WRONG_LIMIT + "문제)"
      });
      wrongBox.body.appendChild(T.wrong.render(shown, function () {}));
      page.appendChild(wrongBox.root);

      var listBox = K.panel({ title: "🧾 전체 명단 · 정오표", hint: "표 머리를 눌러 정렬할 수 있습니다." });
      listBox.body.appendChild(
        T.list.render(shown, function () {
          drawPage(3);
        })
      );
      page.appendChild(listBox.root);
      return;
    }

    /* ── 4장 회로 수행 ── */
    if (no === 4) {
      var circuitBox = K.panel({
        title: "🔌 회로 수행",
        hint: "다섯 갈래 가운데 어느 줄을 놓쳤는지, 위험 연결이 누구에게 났는지 봅니다."
      });
      circuitBox.body.appendChild(T.views.circuit(shown));
      page.appendChild(circuitBox.root);
      return;
    }

    /* ── 5장 코드 수행 ── */
    if (no === 5) {
      var codeBox = K.panel({
        title: "⌨ 코드 수행",
        hint: "검사 통과 수 · 문법 오류 · 핀 불일치 · 입출력 역할 뒤바뀜을 함께 봅니다."
      });
      codeBox.body.appendChild(T.views.code(shown));
      page.appendChild(codeBox.root);
      return;
    }

    /* ── 6장 실험 기록 ── */
    if (no === 6) {
      var expBox = K.panel({
        title: "🧪 실험 기록",
        hint: "안정화 · 사람 위치 · 움직임 · DO · LED · 시리얼과 학생이 적은 관찰을 함께 봅니다."
      });
      expBox.body.appendChild(T.views.experiment(shown));
      page.appendChild(expBox.root);
      return;
    }

    /* ── 7장 학생별 보기 ── */
    if (no === 7) {
      var detailBox = K.panel({
        title: "👤 학생별 보기",
        hint: "왼쪽에서 학생을 고르면 그 학생의 예측 · 정오표 · 회로 · 코드 · 실험을 한자리에서 봅니다."
      });
      detailBox.body.appendChild(T.detail.render(shown));
      page.appendChild(detailBox.root);
      return;
    }

    /* ── 8장 정답·지도 ── */
    if (no === 8) {
      var guideBox = K.panel({
        title: "🔑 정답 · 지도",
        hint: "이 장에는 정답이 그대로 적혀 있습니다. 학생에게 보이지 않도록 주의하세요."
      });
      guideBox.body.appendChild(T.guide.render());
      page.appendChild(guideBox.root);
    }
  }

  /* ---------------------------------------------------------------- */
  /* 검색 · 정렬 · 거르기 (명세 9장)                                     */
  /* ---------------------------------------------------------------- */

  var filterState = T.filter ? T.filter.emptyFilter() : {};

  /**
   * 거르기 막대.
   *
   * ★ 학생 자료를 저장하지 않는 것과 마찬가지로, 거르기 값도 기억하지 않는다.
   *   창을 닫으면 사라진다. 남기는 것은 «주소» 와 «예상 인원» 뿐이다.
   */
  function buildFilterBar(all, shown, pageNo) {
    var opts = T.filter.optionsOf(all);
    var bar = el("div", { class: "t-filter", attrs: { role: "search" } });

    var keyword = el("input", {
      class: "input",
      attrs: { type: "search", placeholder: "학번 또는 이름으로 찾기", "aria-label": "학번 또는 이름으로 찾기" }
    });
    keyword.value = filterState.keyword || "";
    keyword.addEventListener("input", function () {
      filterState.keyword = keyword.value;
      drawPage(pageNo);
    });

    function select(label, key, choices) {
      var sel = el("select", { class: "input", attrs: { "aria-label": label } });
      choices.forEach(function (c) {
        var opt = el("option", { attrs: { value: String(c.value) }, text: c.label });
        if (String(filterState[key]) === String(c.value)) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", function () {
        var v = sel.value;
        filterState[key] = key === "grade" || key === "classNumber" ? Number(v) : v;
        drawPage(pageNo);
      });
      return el("label", { class: "t-filter__field" }, [el("span", { text: label }), sel]);
    }

    bar.appendChild(el("label", { class: "t-filter__field t-filter__field--wide" }, [
      el("span", { text: "찾기" }),
      keyword
    ]));

    bar.appendChild(
      select("학년", "grade", [{ value: 0, label: "전체" }].concat(
        opts.grades.map(function (g) {
          return { value: g, label: g + "학년" };
        })
      ))
    );
    bar.appendChild(
      select("반", "classNumber", [{ value: 0, label: "전체" }].concat(
        opts.classes.map(function (c) {
          return { value: c, label: c + "반" };
        })
      ))
    );
    bar.appendChild(
      select("이수", "pass", [
        { value: "all", label: "전체" },
        { value: "pass", label: "이수" },
        { value: "fail", label: "미이수" }
      ])
    );
    bar.appendChild(
      select("회로", "circuit", [
        { value: "all", label: "전체" },
        { value: "done", label: "완성" },
        { value: "not", label: "미완성" }
      ])
    );
    bar.appendChild(
      select("코드", "code", [
        { value: "all", label: "전체" },
        { value: "done", label: "전부 통과" },
        { value: "not", label: "미통과" }
      ])
    );

    bar.appendChild(
      el("div", { class: "t-filter__foot" }, [
        el("span", { class: "t-filter__count", attrs: { "aria-live": "polite" },
          text: shown.length + " / " + all.length + "명" }),
        el("button", {
          class: "btn btn--ghost btn--small",
          text: "거르기 지우기",
          attrs: { type: "button" },
          on: {
            click: function () {
              filterState = T.filter.emptyFilter();
              drawPage(pageNo);
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost btn--small",
          text: "CSV 내려받기 (보이는 명단)",
          attrs: { type: "button" },
          on: {
            click: function () {
              T.csv.download(shown);
            }
          }
        })
      ])
    );

    return bar;
  }

  /* ---------------------------------------------------------------- */
  /* 시작                                                             */
  /* ---------------------------------------------------------------- */

  function start() {
    var host = K.$("#t-main");
    if (!host) return;

    expected = loadExpected();

    K.clear(host);
    buildHeader(host);
    buildStepper(host);

    PAGES.forEach(function (p) {
      var page = el("section", {
        class: "t-page",
        attrs: { "data-page": String(p.no), "aria-label": p.no + "장 " + p.label, tabindex: "-1" }
      });
      pages.push(page);
      host.appendChild(page);
    });

    buildSource(pages[0]);
    buildPager(host);
    showPage(1);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  T.main = {
    PAGES: PAGES,
    rows: rows,
    goToPage: goToPage,
    stampPrintDate: stampPrintDate,
    refresh: function () {
      drawPage(currentPage);
    }
  };
})();
    </script>
  </body>
</html>
