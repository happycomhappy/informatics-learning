}

.pir__facet {
  stroke: var(--pir-facet);
  stroke-width: 1;
}

/* 감지 중일 때 퍼지는 테두리 — 색만으로 알리지 않으므로 글자와 함께 쓴다 */
.pir__wave {
  fill: none;
  stroke: var(--pir-live);
  stroke-width: 2.5;
  stroke-dasharray: 6 6;
  opacity: 0.9;
}

.pir__pot {
  fill: #e2e8f0;
  stroke: #94a3b8;
  stroke-width: 1.2;
}

.pir__potslot {
  stroke: #475569;
  stroke-width: 2;
}

.pir__potname {
  font-family: var(--font-sans);
  font-size: 10px;
  fill: #e2e8f0;
}

.pir__name {
  text-anchor: start;
  fill: var(--color-text);
}

/* 지금 무엇을 내보내는가 — 오른쪽 위 */
.pir__state {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 800;
  text-anchor: end;
  fill: var(--color-text);
}

.part--sensing .pir__state {
  fill: var(--color-true-dark);
}

/* 핀 순서 경고 — 왼쪽 아래 «따로 한 줄» 로 둔다(이름표와 겹치지 않게) */
.pir__warn {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  text-anchor: start;
  fill: var(--color-false-dark);
}

/* 다리와 그 끝 — 브레드보드에 꽂히는 금속 */
.pir__leg {
  stroke-width: 3.5;
}

.pir__tip {
  fill: var(--part-lead);
}

/* 센서의 디지털 출력 단자 — 다른 단자와 «모양» 으로도 갈라 보이게 */
.pin--signal .pin__dot {
  fill: var(--wire-sensor);
  stroke: #7c2d12;
  stroke-width: 1.5;
}

/* ══════════════════════════════════════════════════════════════════
 * 2-1. ★ 부품 다리 이름표 — «흰 글씨» 를 고친다
 *
 *   student.css 의 .pin__label 은 fill: #ffffff 다. 우노의 «검은 헤더» 위에
 *   적는 이름표라 흰색이 맞다. 그런데 LED·저항·PIR 의 다리 이름표는
 *   .pin__label 과 .pin__label--part 를 «함께» 달고 있고,
 *   student.css 안에서 .pin__label 이 뒤에 오는 바람에 흰색이 이겼다.
 *   → 밝은 회색 받침 위에 흰 글씨라 «VCC» 가 아예 보이지 않았다.
 *
 *   여기(뒤에 읽히는 파일)에서 다시 어둡게 되돌리고, 흰 테두리를 둘러
 *   어떤 바탕 위에서도 읽히게 한다.
 * ══════════════════════════════════════════════════════════════════ */

.pin__label--part {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  /* 글자 뒤에 흰 테두리를 깔아 어떤 바탕에서도 읽히게 한다 */
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 3px;
  stroke-linejoin: round;
}

/* 역할을 색으로도 거들어 준다 — 글자가 이미 뜻을 지므로 색은 덤이다 */
.pin--power .pin__label--part {
  fill: var(--color-error);
}

.pin--signal .pin__label--part {
  fill: #a16207;
}

.pin--ground .pin__label--part,
.pin--cathode .pin__label--part {
  fill: var(--color-text);
}

.pin--anode .pin__label--part {
  fill: var(--color-error);
}

/* ══════════════════════════════════════════════════════════════════
 * 3. 설명 그림 조각 (s45-figures.js)
 * ══════════════════════════════════════════════════════════════════ */

.fig__panel {
  fill: var(--color-surface);
  stroke: var(--color-border);
  stroke-width: 1.2;
}

.fig__title {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
}

.fig__note {
  font-family: var(--font-sans);
  font-size: 12px;
  fill: var(--color-text-sub);
  text-anchor: middle;
}

/* ★ 왼쪽 정렬 — 배지 «옆» 에 붙는 글은 반드시 이것을 쓴다.
   가운데 정렬인 채로 왼쪽 끝 좌표를 주면 글이 틀 밖으로 삐져나가고
   옆 칸의 제목 위에 겹친다(실제로 그런 적이 있다). */
.fig__title--left,
.fig__note--left {
  text-anchor: start;
}

.fig__state {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
}

/* 사람 아이콘 */
.figp__head {
  fill: var(--color-text-sub);
}

.figp__body,
.figp__limb {
  stroke: var(--color-text-sub);
  stroke-width: 3;
  stroke-linecap: round;
}

.figp--moving .figp__head {
  fill: var(--color-primary);
}

.figp--moving .figp__body,
.figp--moving .figp__limb {
  stroke: var(--color-primary);
}

/* 적외선 물결 — 변화가 있을 때는 실선, 없을 때는 점선 */
.figir {
  fill: none;
  stroke: var(--ir-flat);
  stroke-width: 2;
}

.figir--flat {
  stroke-dasharray: 4 5;
}

.figir--change {
  stroke: var(--ir-change);
  stroke-width: 2.5;
}

/* 감지 구역 부채꼴 */
.figzone {
  fill: var(--zone-fill);
  stroke: var(--zone-edge);
  stroke-width: 1;
}

.figzone--wide {
  fill: rgba(37, 99, 235, 0.06);
}

/* ★ 이웃한 구역을 «번갈아» 다른 색으로 칠한다.
   같은 색이면 «여러 구역» 이 하나로 보여 «구역을 통과한다» 가 보이지 않는다.
   색만으로 알리지 않으려고 바닥에 A·B 글자 딱지를 함께 둔다. */
.figzone--a {
  fill: rgba(37, 99, 235, 0.13);
  stroke: rgba(37, 99, 235, 0.5);
}

.figzone--b {
  fill: rgba(5, 150, 105, 0.13);
  stroke: rgba(5, 150, 105, 0.5);
}

/* 천장에 다는 받침 */
.figmount {
  fill: var(--color-border-strong);
}

/* 사람이 걷는 바닥 */
.figfloor {
  stroke: var(--color-text-sub);
  stroke-width: 3;
  stroke-linecap: round;
}

/* 구역이 «어느 소자로» 가는지 알리는 글자 딱지 */
.figchip {
  stroke-width: 1.5;
}

.figchip--a {
  fill: #dbeafe;
  stroke: var(--color-primary);
}

.figchip--b {
  fill: #d1fae5;
  stroke: var(--color-true);
}

.figchip__text {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
}

/* 감지 소자 두 개 */
.figcell {
  fill: #1e293b;
  stroke: #0f172a;
  stroke-width: 1;
}

.figcell__name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  fill: #f8fafc;
  text-anchor: middle;
}

/* 화살표 · 그래프 · 축 */
.figarrow {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.figgraph {
  fill: none;
  stroke: var(--color-primary-dark);
  stroke-width: 2.5;
}

/* A·B 신호 — 위 구역과 «같은 색» 이라 눈으로 이어진다 */
.figgraph--a {
  stroke: var(--color-primary);
}

.figgraph--b {
  stroke: var(--color-true-dark);
}

.figaxis {
  stroke: var(--color-border-strong);
  stroke-width: 2;
}

.figmark {
  stroke: var(--color-text-sub);
  stroke-width: 1.5;
  stroke-dasharray: 4 4;
}

.figrow__name {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
}

/* 시간 띠 (안정화 · 출력 유지) */
.figband {
  fill: var(--color-false-soft);
  stroke: var(--color-false);
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
}

.figband__text {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-false-dark);
  text-anchor: middle;
}

.figpulse {
  fill: none;
  stroke: var(--color-text);
  stroke-width: 2.5;
}

.figpulse--do {
  stroke: var(--color-true-dark);
}

.figicon {
  font-size: 22px;
  text-anchor: middle;
}

/* 회로 요약 그림의 상자 */
.figbox {
  fill: var(--color-surface);
  stroke: var(--color-border-strong);
  stroke-width: 1.5;
}

.figbox__text {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
}

.figbox--sensor {
  fill: #ecfdf5;
  stroke: var(--color-true);
}

.figbox--power {
  fill: #fef2f2;
  stroke: var(--color-error);
}

.figbox--in {
  fill: #fef3c7;
  stroke: var(--wire-sensor);
}

.figbox--out {
  fill: #ffedd5;
  stroke: #ea580c;
}

.figbox--code {
  fill: var(--color-primary-soft);
  stroke: var(--color-primary);
}

.figbox--part {
  fill: var(--color-muted-bg);
  stroke: var(--color-border-strong);
}

/* ══════════════════════════════════════════════════════════════════
 * 4. 1단계 — 문제 상황과 예측
 * ══════════════════════════════════════════════════════════════════ */

.storyfig {
  margin-bottom: var(--space-3);
}

.predict {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  background: var(--color-surface);
}

.predict__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-weight: 800;
}

.predict__icon {
  font-size: 22px;
}

.predict__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin: var(--space-1) 0 var(--space-3) 34px;
}

/* 5단계에서 1단계 예측을 되비출 때 */
.predict__before {
  margin-bottom: var(--space-2);
  font-size: 15px;
}

.predict__tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 13px;
  font-weight: 800;
}

/* ══════════════════════════════════════════════════════════════════
 * 5. 2단계 — 상태 흐름과 오감지 원인
 * ══════════════════════════════════════════════════════════════════ */

.sflow {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.sflow__step {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  border-left-color: var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

/* 안정화 구간은 «판정 대기» 라 다른 색으로 둔다 — 글자에도 적혀 있다 */
.sflow__step--baseline {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}

.sflow__step--low {
  border-left-color: var(--color-text-sub);
}

.sflow__no {
  flex: none;
  font-size: 18px;
  font-weight: 800;
  color: var(--color-primary);
}

.sflow__body {
  flex: 1;
}

.sflow__label {
  font-weight: 800;
}

.sflow__state {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-true-dark);
  font-weight: 700;
}

.sflow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.causes {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cause {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cause__icon {
  flex: none;
  font-size: 24px;
  line-height: 1.2;
}

.cause__body {
  flex: 1;
}

.cause__name {
  font-weight: 800;
}

.cause__why {
  font-size: 15px;
  color: var(--color-text);
}

.cause__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cause__tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--color-true-soft);
  color: var(--color-true-dark);
  font-size: 12px;
  font-weight: 800;
}

/* ══════════════════════════════════════════════════════════════════
 * 6. 5단계 — 감지 영역 자유 탐색
 * ══════════════════════════════════════════════════════════════════ */

.zone {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.zone__canvas {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  overflow-x: auto;
  touch-action: none; /* 드래그가 화면 스크롤로 새지 않게 */
}

.zone__svg {
  display: block;
  width: 100%;
  min-width: 560px;
  height: auto;
}

.zone__field {
  fill: var(--zone-fill);
  stroke: var(--zone-edge);
  stroke-width: 1.5;
  stroke-dasharray: 8 6;
}

.zone__fieldname {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  fill: var(--color-primary-dark);
  text-anchor: middle;
}

/* 누르는 자리 — 손가락보다 크게(명세 11장 44×44px) */
.zone__hit {
  fill: transparent;
  cursor: grab;
}

.zone__person:focus-visible .zone__hit {
  fill: rgba(37, 99, 235, 0.12);
  stroke: var(--color-primary);
  stroke-width: 2;
}

.zone__person--moving .zone__hit {
  cursor: grabbing;
}

.zone__panel {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  padding: var(--space-3);
}

.zone__note {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
  min-height: 1.6em;
}

/* 상태 패널 — 여덟 줄을 «한 흐름으로» 보인다 */
.zrows {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-2);
}

.zrow {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--color-muted-bg);
  border-left: 4px solid var(--color-border-strong);
}

.zrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.zrow__value {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  color: var(--color-text);
  text-align: right;
}

/* 센서 → 조건 → 출력 세 무리를 «왼쪽 띠» 로 갈라 보인다 */
.zrow--sensor {
  border-left-color: var(--wire-sensor);
}

.zrow--cond {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.zrow--out {
  border-left-color: #ea580c;
}

/* ══════════════════════════════════════════════════════════════════
 * 7. 5단계 — 실험 결과표
 * ══════════════════════════════════════════════════════════════════ */

.resulttable {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-3) var(--space-4);
  background: var(--color-true-soft);
}

.kv {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--space-2) var(--space-4);
  margin: 0;
}

.kv dt {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-text-sub);
}

.kv dd {
  margin: 0;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-text);
  overflow-wrap: anywhere;
}

.para--quiet {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ══════════════════════════════════════════════════════════════════
 * 8. 실행 패널 — 센서·조건·출력을 갈라 보인다
 * ══════════════════════════════════════════════════════════════════ */

.runstat--sensor {
  border-left: 4px solid var(--wire-sensor);
  padding-left: var(--space-2);
}

.runstat--cond {
  border-left: 4px solid var(--color-primary);
  padding-left: var(--space-2);
}

.runstat--out {
  border-left: 4px solid #ea580c;
  padding-left: var(--space-2);
}

/* DO 시간표 — 색만으로 알리지 않으므로 칸 안에 HIGH/LOW/대기 를 적는다 */
.ledline__seg--do-high {
  background: var(--color-true);
  color: #fff;
}

.ledline__seg--do-low {
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

.ledline__seg--do-warm {
  background: repeating-linear-gradient(
    45deg,
    var(--color-false-soft),
    var(--color-false-soft) 6px,
    #fde68a 6px,
    #fde68a 12px
  );
  color: var(--color-false-dark);
}

/* ══════════════════════════════════════════════════════════════════
 * 9. 좁은 화면 (360px 세로에서도 가로 스크롤 없이 — 명세 11장)
 * ══════════════════════════════════════════════════════════════════ */

@media (max-width: 767px) {
  .zrows {
    grid-template-columns: 1fr;
  }

  .kv {
    grid-template-columns: 1fr;
    gap: var(--space-1) 0;
  }

  .kv dd {
    margin-bottom: var(--space-2);
  }

  .predict__note {
    margin-left: 0;
  }

  /* 감지 영역 그림만 내부에서 좌우로 밀 수 있게 둔다(본문은 밀리지 않는다) */
  .zone__svg {
    min-width: 520px;
  }
}

/* ══════════════════════════════════════════════════════════════════
 * 10. 교사용 — 이 차시에 새로 생긴 것
 *
 * ★ 명세 9장의 «일곱 탭» 을 쓰면서 «거르기 막대» 와 «예상 인원» 칸이 생겼다.
 *   앞 차시(4장 구성)에는 없던 것이라 여기에 둔다.
 * ══════════════════════════════════════════════════════════════════ */

.t-filter {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.t-filter__field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.t-filter__field--wide {
  flex: 1 1 220px;
}

.t-filter__field .input {
  min-height: var(--touch-min);
}

.t-filter__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-left: auto;
}

.t-filter__count {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.t-inline {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* 실험 결과·정답표의 한 덩어리 */
.t-answer {
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  margin-bottom: var(--space-2);
  background: var(--color-surface);
}

.t-answer__head {
  font-weight: 800;
  color: var(--color-text);
}

.t-answer__line {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-true-dark);
  overflow-wrap: anywhere;
}

.t-answer__why {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

/* 표 안의 기계값(DO·시리얼)은 고정폭으로 — 눈으로 맞대어 보기 쉽게 */
.cell--mono {
  font-family: var(--font-mono);
  font-size: 13px;
  white-space: nowrap;
}

@media (max-width: 767px) {
  .t-filter__foot {
    margin-left: 0;
    width: 100%;
  }

  .t-filter__field {
    flex: 1 1 140px;
  }

  .cell--mono {
    white-space: normal;
  }
}

/* 자동 새로고침 줄 (명세 9장) — 기본은 꺼짐이다 */
.t-auto {
  flex-wrap: wrap;
  gap: var(--space-3);
}

.t-auto__note {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-primary-dark);
}


/* ══════════════════════════════════════════════════════════════════
 * 11. 붙어 버린 블록 떼어 놓기
 *
 * ★ 1단계 hero 안에 «카드» 를 넣은 것은 이 차시가 처음이다(문제 상황·예측·확인 질문).
 *   .card 는 common.css 에서 «아래 여백» 만 갖고 있어서, 위 블록(학습 순서)과
 *   그대로 맞붙어 버렸다. hero 안에서만 위 여백을 준다.
 *   (이웃한 세로 여백은 서로 겹쳐지므로 카드끼리는 여전히 24px 이다)
 * ══════════════════════════════════════════════════════════════════ */

.hero > .card {
  margin-top: var(--space-5);
}

/* [학습 시작] 아래의 «아직 못 한 일» — 가운데 정렬 글머리표는 읽기 어렵다.
   왼쪽으로 맞추고 안내 상자처럼 보이게 한다. */
.hero__gate {
  margin-top: var(--space-3);
  text-align: left;
}

/* ── 접어 둔 선택 활동 상자 ────────────────────────────────────────
 * <details> 를 그대로 두면 테두리도 여백도 없어 두 개가 나란히 놓일 때
 * 한 덩어리처럼 붙어 보인다. 5·6단계에 접기 상자가 둘씩 있어서 눈에 띈다.
 * ------------------------------------------------------------------ */

.foldout {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  margin-bottom: var(--space-4);
  overflow: hidden;
}

.foldout + .foldout {
  margin-top: var(--space-4);
}

.foldout__sum {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: var(--space-3) var(--space-4);
  font-weight: 700;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  cursor: pointer;
  list-style: none;
}

/* 크롬·사파리의 기본 삼각형을 지우고 우리 것으로 바꾼다 */
.foldout__sum::-webkit-details-marker {
  display: none;
}

.foldout__sum::before {
  content: "＋";
  font-weight: 800;
  flex: none;
}

.foldout[open] > .foldout__sum::before {
  content: "－";
}

.foldout__sum:hover {
  background: #e0ecff;
}

.foldout__sum:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: -3px;
}

.foldout__body {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.foldout__body:empty {
  padding: 0;
}

/* ------------------------------------------------------------------ */
/* 케이블 한 줄만 지우기 (3단계)                                        */
/*                                                                     */
/* 그림 위의 케이블을 «한 번 누르면» 그 줄만 지워진다.                    */
/* 되돌리기(맨 끝 하나) · 초기화(모두) 사이의 셋째 길이다.               */
/* ------------------------------------------------------------------ */

/* 넓은 투명 길 — 손가락으로 눌러도 빗나가지 않게.
   ★ 케이블의 «가운데» 만 덮는다(s40-board.js midSegment).
      끝까지 덮으면 단자를 가려 그 자리에서 새 선을 뽑을 수 없다. */
.wirehit__area {
  fill: none;
  stroke: transparent;
  stroke-width: 18;
  stroke-linecap: round;
  cursor: pointer;
}

/* 한가운데 점 — 아주 짧은 케이블에도 «누를 자리» 를 남긴다 */
.wirehit__spot {
  fill: transparent;
  cursor: pointer;
}

/* 갖다 대거나 초점이 가면 그 줄만 도드라진다 */
.wirehit:hover .wire,
.wirehit:focus .wire {
  opacity: 1;
  stroke-width: 7;
}

.wirehit:focus {
  outline: none;
}

.wirehit:focus .wirehit__xbg {
  stroke-width: 3;
}

/* ✕ 표 — 평소에는 숨어 있다.
   색이 아니라 «모양» 으로 알린다(명세 11장 — 색만으로 알리지 않는다). */
.wirehit__x {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease-out;
}

.wirehit:hover .wirehit__x,
.wirehit:focus .wirehit__x {
  opacity: 1;
}

.wirehit__xbg {
  fill: #ffffff;
  stroke: var(--color-error);
  stroke-width: 2;
}

.wirehit__xtext {
  font-size: 13px;
  font-weight: 800;
  fill: var(--color-error);
  text-anchor: middle;
  pointer-events: none;
}

/* ------------------------------------------------------------------ */
/* [정답 확인] 표 (3단계)                                               */
/*                                                                     */
/* 접어 둔 「이렇게 이으면 됩니다」 는 «어디까지 했는가» 를 보이고,        */
/* 이 표는 «무엇을 이어야 하는가» 를 두 칸으로 늘어놓는다.               */
/* ------------------------------------------------------------------ */

.answer {
  margin-top: var(--space-4);
}

.answer__table {
  width: 100%;
  border-collapse: collapse;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.answer__table th,
.answer__table td {
  padding: var(--space-3) var(--space-4);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
}

.answer__table tr:last-child th,
.answer__table tr:last-child td {
  border-bottom: 0;
}

.answer__table thead th {
  background: var(--color-bg);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* 번호 칸 — 좁게 두어 «한쪽 / 다른쪽» 두 칸이 넓게 쓰인다 */
.answer__no {
  width: 3rem;
  font-weight: 400;
  color: var(--color-text-sub);
}

/* 이미 이은 줄은 옅게 — «남은 것» 이 눈에 먼저 들어온다.
   ★ 색만으로 알리지 않으려고 왼쪽에 띠를 함께 둔다. */
.answer__table tr.is-done td,
.answer__table tr.is-done th {
  color: var(--color-text-sub);
}

.answer__table tr.is-done .answer__no {
  border-left: 3px solid var(--color-true);
}

.answer__note {
  margin: var(--space-3) 0 0;
  font-size: 0.9375rem;
  color: var(--color-text-sub);
  line-height: 1.6;
}

/* ------------------------------------------------------------------ */
/* 4단계 코드 조립 — 끌어 놓기 (4차시까지는 ▲▼ 단추만 있었다)            */
/*                                                                     */
/* ★ 놓일 자리를 «빈 칸» 으로 보여 준다.                                 */
/*   가는 선 하나만 그리면 어디에 끼어드는지 가늠하기 어렵다.            */
/*   실제로 그 줄이 들어갈 만큼 목록이 «벌어지는» 것이 가장 분명하다.     */
/* ------------------------------------------------------------------ */

.assemble__grip {
  color: var(--tok-comment);
  font-size: 1.1rem;
  line-height: 1;
  padding: 0 var(--space-1);
  cursor: grab;
  /* 손가락 끌기가 화면 넘기기로 새지 않게 — 손잡이에만 준다 */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.assemble__grip:active {
  cursor: grabbing;
}

.assemble__item {
  cursor: grab;
}

/* 단추 위에서는 «끄는 손» 이 아니라 «누르는 손» 이어야 한다 */
.assemble__btns .btn {
  cursor: pointer;
}

/* 끄는 동안에는 글자가 잡히지 않게 */
.assemble.is-dragging {
  user-select: none;
  -webkit-user-select: none;
}

/* 들어 올린 줄 — 떠 있는 것이 보여야 한다 */
.assemble__item.is-dragging {
  z-index: 40;
  cursor: grabbing;
  border-color: var(--color-primary);
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
  opacity: 0.97;
}

/* ★ 놓일 자리 */
.assemble__slot {
  list-style: none;
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius);
  background: rgba(37, 99, 235, 0.1);
  box-sizing: border-box;
}


/* ------------------------------------------------------------------ */
/* 5단계 확장 탐구 — 의사코드를 적은 뒤 열리는 «완성 코드 두 칸»          */
/* ------------------------------------------------------------------ */

.reveal {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
}

.reveal[hidden],
.reveal__lock[hidden] {
  display: none;
}

.reveal__lock {
  margin-top: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.reveal__code {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3);
  overflow-x: auto;
}

.reveal__row {
  display: flex;
  align-items: center;
  gap: 0;
  min-height: 1.7em;
  /* 빈칸이 넓어져도 줄이 접히지 않게 — 넘치면 .reveal__code 가 밀린다 */
  white-space: nowrap;
}

.reveal__fixed {
  /* 코드 글자도 줄어들면 안 된다 — 줄어들면 «lastSeen = » 이 잘린다 */
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  color: var(--color-console-text);
}

/* 빈칸 — 코드 줄 «안» 에 놓이므로 줄 높이를 넘지 않게.
   ★ width 는 여기서 정하지 «않는다». 힌트 길이를 보고 s60-screens.js 가 넣는다
      (한글 힌트는 고정폭으로 두면 잘린다). 넘치면 .reveal__code 가 좌우로 밀린다. */
.reveal__input {
  /* ★ 좁은 화면에서 flex 가 칸을 «찌그러뜨리지» 못하게 막는다.
     막지 않으면 390px 화면에서 폭이 167px 로 줄어 힌트가 다시 잘린다.
     넘치는 만큼은 .reveal__code 가 좌우로 밀어 보여 준다. */
  flex: 0 0 auto;
  margin: 2px var(--space-1);
  padding: 2px var(--space-2);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  background: #ffffff;
  border: 2px solid var(--color-primary);
  border-radius: 4px;
}

.reveal__input.is-ok {
  border-color: var(--color-true);
  background: rgba(5, 150, 105, 0.08);
}

.reveal__input.is-off {
  border-color: var(--color-false);
}

.reveal__mark {
  margin-left: var(--space-2);
  font-weight: 800;
  color: var(--color-text-sub);
}

.reveal__mark.is-ok {
  color: var(--color-true);
}

/* 맞힌 뒤에만 나오는 «왜» 한 줄 */
.reveal__why:empty {
  display: none;
}

.reveal__why {
  margin: var(--space-1) 0 var(--space-2) var(--space-4);
  font-size: var(--fs-small);
  color: var(--color-true);
}

/* ------------------------------------------------------------------ */
/* 5단계 «이 실험을 마치려면» 목록                                       */
/*                                                                     */
/* 「끝내면 열립니다」 만으로는 무엇을 해야 하는지 알 수 없다.            */
/* 네 가지를 한 줄씩 적고, 지금 어디까지 했는지 그대로 보여 준다.        */
/* ------------------------------------------------------------------ */

.steplist {
  margin: var(--space-4) 0;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.steplist .subhead {
  margin-top: 0;
}

.steplist__sum {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  line-height: 1.6;
}

/* ------------------------------------------------------------------ */
/* 5단계 확장 탐구 — 눈에 띄는 카드 (통과 조건)                          */
/*                                                                     */
/* 전에는 접기 상자였다. 접혀 있으면 «해도 되고 말아도 되는 것» 으로       */
/* 보인다. 통과 조건으로 올렸으므로 펼쳐 두고 테두리로 도드라지게 한다.    */
/* ------------------------------------------------------------------ */

.ext {
  margin: var(--space-6) 0 var(--space-4);
  border: 2px solid var(--color-primary-dark);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.ext__head {
  padding: var(--space-4);
  /* ★ 진한 쪽을 쓴다. 흰 글자를 얹으므로 밝은 파랑에서는 작은 글씨의
     대비가 4.5:1 에 못 미친다. */
  background: var(--color-primary-dark);
  color: #ffffff;
}

.ext__badge {
  display: inline-block;
  padding: 2px var(--space-3);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.22);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0.01em;
}

.ext__title {
  margin: var(--space-2) 0 0;
  font-size: 1.15rem;
  font-weight: 800;
  color: #ffffff;
}

.ext__must {
  margin: var(--space-1) 0 0;
  font-size: var(--fs-small);
  /* 파란 바탕 위이므로 흰색에 가깝게 — 회색 글자는 읽히지 않는다 */
  color: #ffffff;
}

.ext__body {
  padding: var(--space-4);
}

/* 다 적으면 초록으로 바뀐다 — «끝났다» 를 색과 «글자» 로 함께 알린다 */
.ext--done {
  border-color: var(--color-true-dark);
}

.ext--done .ext__head {
  /* 같은 까닭으로 진한 초록 */
  background: var(--color-true-dark);
}

/* 빈칸에 «붙은» [답 보기] 단추 — 막힌 학생이 답을 확인하는 자리 */
.reveal__peek {
  flex: 0 0 auto;
  margin-left: var(--space-2);
  white-space: nowrap;
}

.reveal__peek:disabled {
  opacity: 0.75;
}

/* 답을 «본» 칸 — 맞힌 칸(초록)과 다르게 적는다 */
.reveal__input.is-seen {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.reveal__mark.is-seen {
  color: var(--color-false-dark);
  font-size: var(--fs-small);
}

    <script data-from="shared/config.js">
/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 10장)

  /**
   * 220Ω 저항 (명세 17.3 A)
   *
   * 방향이 없다. 어느 쪽을 D8 에 붙여도 같다.
   * 띠 색은 «시각 자료일 뿐» 이므로 220Ω 글자를 반드시 함께 적는다(명세 17.3 A).
   */
  function buildResistor() {
    return {
      id: "res",
      name: RESISTOR_OHM + "Ω 저항",
      kind: "device",
      ohm: RESISTOR_OHM,
      body: { x: 96, y: 452, w: 88, h: 26 },

        { at: 0.82, color: "gold", name: "금" }
      ],
      box: { x: 24, y: 430, w: 252, h: 118 },

        { id: "P2", label: "저항 오른쪽 끝", short: "②", kind: "lead", x: 224, y: 465 }
