    <script data-from="shared/schema.js">
/**
 * 제출 자료의 «모양» 과 검사 규칙 (명세 5장 · 10장 · 15장)
 *
 * 학생용은 이 파일로 보낼 자료를 만들고, 교사용은 이 파일로 받은 자료를 읽는다.
 * 항목 이름이 한 곳에만 적혀 있으므로 두 앱의 필드가 어긋날 수 없다.
 *
 * 여기에는 화면 그리는 코드가 없다. 순수한 계산만 있어서 테스트로 바로 확인할 수 있다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});

  var LIMITS = PC.LIMITS || {};
  var SCHEMA_VERSION = PC.SCHEMA_VERSION || 1;
  var LESSON_ID = PC.LESSON_ID || "physical_2";

  /* ------------------------------------------------------------------ */
  /* 작은 도구                                                            */
  /* ------------------------------------------------------------------ */

  function text(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  /** 너무 긴 입력은 잘라 낸다(통신량과 저장 파일 크기 보호) */
  function clip(value, max) {
    var s = text(value);
    var limit = max || LIMITS.textMax || 1000;
    return s.length > limit ? s.slice(0, limit) : s;
  }

  /** 공백을 뺀 «내용 글자 수». 스페이스만 눌러 글자 수를 채우지 못하게 한다. */
  function contentLength(value) {
    return text(value).replace(/\s+/g, "").length;
  }

  function isRange(n, min, max) {
    return typeof n === "number" && !isNaN(n) && n >= min && n <= max;
  }

  /* ------------------------------------------------------------------ */
  /* 학생 정보                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 학번을 학년·반·번호로 가른다 (2026-11-09 — 네 자리도 받는다).
   *
   *   "10312" → { grade:1, classNumber:3, studentNumber:12 }   학년1 · 반2 · 번호2
   *   "1312"  → { grade:1, classNumber:3, studentNumber:12 }   학년1 · 반1 · 번호2
   *
   * ★ 짧아지는 자리는 «반» 이다. 번호는 언제나 «뒤 두 자리» 다.
   *   그래야 1152 가 「1학년 1반 52번」 하나로만 읽힌다.
   *   (반 두 자리로 읽으면 「1학년 15반 2번」 도 되어 둘 중 어느 것인지 알 수 없다)
   *
   * 자릿수가 모자라거나 남거나, 범위를 벗어나면 null.
   */
  function parseStudentId(value) {
    var s = text(value);
    var min = LIMITS.studentIdDigitsMin || 4;
    var max = LIMITS.studentIdDigitsMax || 5;
    if (!new RegExp("^\\d{" + min + "," + max + "}$").test(s)) return null;

    /* 앞 한 자리가 학년, 뒤 두 자리가 번호, 그 사이가 모두 반 */
    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, s.length - 2), 10);
    var studentNumber = parseInt(s.slice(s.length - 2), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};
    var min = LIMITS.studentIdDigitsMin || 4;
    var max = LIMITS.studentIdDigitsMax || 5;

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length < min || id.length > max) {
      errors.studentId =
        "학번은 " + min + "자리 또는 " + max + "자리입니다. 예) 10312 또는 1312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId =
        "학번을 다시 확인해 주세요. 학년 1자리 · 반 · 번호 2자리 차례입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro":
        /* 시작 화면에서는 «묻지 않는다». 아직 배우지 않았으므로
           확인 질문 대신 안전 수칙 확인만으로 다음 단계를 연다. */
        if (!s.intro || s.intro.safetyRead !== true) {
          reasons.push("안전 수칙을 읽고 확인해 주세요.");
        }
        break;

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = (PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3);
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        /**
         * 2026-11-08 — 앱 안의 가상 결선을 없앴다. 앱은 실물 회로를 볼 수 없으므로
         * «맞다/틀리다» 를 따지지 않는다. 학생이 스스로 점검표 세 칸을 확인하면 연다.
         */
        var c = s.circuit || {};
        var marks = c.checks || {};
        var left = (PC.CIRCUIT_CHECKS || []).filter(function (item) {
          return marks[item.id] !== true;
        });
        if (left.length > 0) {
          reasons.push("스스로 점검표 " + left.length + "가지가 남았습니다. 실물 회로를 보며 확인해 주세요.");
        }
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 주기(켜짐 → 꺼짐)를 끝까지 관찰해 주세요.");
          break;
        }
        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " + (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★ 세 실험을 «모두» 실행하고 «세 칸을 모두» 채워야 통과한다.
         *
         *   명세 17.5 는 «최소 두 실험» 이지만, 선생님 요청으로 셋 다로 올렸다(2026-08-19).
         *   A·B·C 를 견주어 보는 것이 이 단계의 목적이라 하나라도 빠지면 견줄 것이 없다.
         *
         *   확장 활동(짧게 두 번 깜빡인 뒤 2초 쉬기)은 통과 조건이 «아니다» — 접어 둔 선택 활동이다.
         */
        var e = s.experiment || {};
        var runs = e.runs || {};
        var items = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

        var notRun = [];
        var notWritten = [];

        items.forEach(function (item) {
          var r = runs[item.id] || {};
          if (r.ran !== true) {
            notRun.push(item.label);
            return;
          }
          /* 실행한 실험만 «빈칸» 을 따진다 — 아직 못 한 실험까지 나무라면 할 일이 겹쳐 보인다 */
          var blanks = [];
          if (contentLength(r.predict) < 4) blanks.push("예상");
          if (contentLength(r.observation) < (LIMITS.observationMin || 10)) blanks.push("관찰");
          if (contentLength(r.surprise) < 2) blanks.push("예상과 다른 점");
          if (blanks.length > 0) notWritten.push(item.label + "(" + blanks.join("·") + ")");
        });

        if (notRun.length > 0) {
          reasons.push("아직 실행하지 않은 실험이 있습니다 : " + notRun.join(", "));
        }
        if (notWritten.length > 0) {
          reasons.push(
            "아직 비어 있는 칸이 있습니다 : " +
              notWritten.join(", ") +
              " (관찰은 " +
              (LIMITS.observationMin || 10) +
              "자 이상)"
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */

    }

  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 3단계 «스스로 점검표» 를 제출·수신 양쪽에서 같은 모양으로 다듬는다.
   *
   * 아는 열쇠(CIRCUIT_CHECKS[].id)만 담는다. 남는 열쇠를 그대로 들이면
   * 교사 화면의 «확인 3/3» 셈이 어긋난다.
   */

    var marks = c.checks || {};
    var items = PC.CIRCUIT_CHECKS || [];

    items.forEach(function (item) {
      var on = marks[item.id] === true;
      checks[item.id] = on;
      if (on) done += 1;

      checks: checks,
      checkedCount: done,
      checkTotal: items.length,

      confirmed: items.length > 0 && done === items.length

  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 3단계 — 회로 (2026-11-08)
         가상 결선이 없어졌으므로 보낼 것은 «스스로 점검표» 뿐이다.
         ★ 이것은 회로가 맞다는 증거가 아니라 학생이 확인했다는 기록이다.
            교사 화면도 그렇게 적어 보여 준다. */
      circuit: cleanCircuit(circuit),

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험 (명세 10장 · 17.5) */
      experiment: {
        conditions: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              label: clip(item.label, 60),
              onMs: Number(item.onMs) || 0,
              offMs: Number(item.offMs) || 0,
              ran: r.ran === true,
              blinks: Number(r.blinks) || 0,
              elapsed: Number(r.elapsed) || 0
            };
          }),
        observations: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax),
              surprise: clip(r.surprise, LIMITS.textMax)
            };
          }),
        /* 확장 활동 — 짧게 두 번 깜빡인 뒤 2초 쉬기 (명세 17.5) */
        extension: {
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          tried: experiment.extensionTried === true
        }
      },

      /* 6단계 — 형성평가 (명세 10장) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,

        attempts: Number(assessment.attempts) || 0

  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)

    function num(v) {
      var n = Number(v);

    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,

    <script data-from="student/s00-core.js">
/**
 * 학생용 코어 — 이름 공간과 상태 그릇
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.PC 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → constants → lesson → circuit → arduino → quiz → schema
 *   → s00-core → s10-ui → s20-store → s30-api → s45-figures → s50-editor → s60-screens → s90-app
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /** 빈 상태 — 처음 열었을 때의 출발점 */
  function emptyState() {
    return {
      version: 1,
      /* STEPS 의 자리 번호 (0 = 시작하기) */
      step: 0,
      student: { studentId: "", name: "" },

      /* 1단계 — 시작 화면. 넘어가는 조건은 «안전 수칙 확인» 하나다. */
      intro: { safetyRead: false },

      /* 2단계 */
      concept: { opened: {}, checkChoices: {}, checks: {} },

      /* 3단계 — 실물로 잇고 «스스로 점검표» 로 확인한다 (2026-11-08)
         가상 결선·전원 인가·멀티미터를 없앴으므로 기억할 것은 체크 세 칸뿐이다.
         checks 의 열쇠는 constants.js 의 CIRCUIT_CHECKS[].id 다. */
      circuit: { checks: {} },

      /* 4단계 — exampleRun·learned 는 «먼저 읽었는가» 를 기억한다.
         읽기 전에는 작성 칸을 내보내지 않는다. */
      code: {
        exampleRun: false,
        learned: false,
        mode: "assemble",
        assembleOrder: [],
        blanks: {},
        source: "",
        testsPassed: 0,
        testsTotal: 0,
        attempts: 0,
        ran: false,
        syntaxErrors: [],
        pinMismatch: []
      },

      /* 5단계 — 실험 A·B·C 를 저마다 «예상 → 실행 → 관찰» 로 기록한다 (명세 17.5)
         runs 의 한 칸 = { predict, ran, blinks, elapsed, observation, surprise } */
      experiment: { runs: {}, lastRun: null, extensionSource: "", extensionTried: false },

      /* 6단계
         sealed = «답안을 냈다». 서버로 보내거나 JSON 으로 받아 낸 그 순간 참이 된다.
         참이 되면 답을 고칠 수 없고, 그때 비로소 [채점하기] 가 열린다.
         정답과 해설을 먼저 보고 답을 고치는 일을 막는 것이다. */
      assessment: { answers: {}, attempts: 0, graded: false, sealed: false },

      submissionId: "",
      submitted: null
    };
  }

  function bool(value) {
    return value === true;
  }

  function num(value) {
    var n = Number(value);
    return isNaN(n) ? 0 : n;
  }

  function str(value) {
    return value === null || value === undefined ? "" : String(value);
  }

  function plainObject(value) {
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  }

  function array(value) {
    return Array.isArray(value) ? value : [];
  }

  /**
   * 저장해 둔 자료를 지금 형태에 맞춘다.
   * 예전에 저장한 자료에 빠진 칸이 있어도 화면이 깨지지 않게 한다.
   */
  function normalizeState(raw) {
    var base = emptyState();
    var r = plainObject(raw);
    var steps = PC.STEPS || [];

    base.step = num(r.step);
    if (base.step < 0 || base.step >= steps.length) base.step = 0;

    var student = plainObject(r.student);
    base.student.studentId = str(student.studentId);
    base.student.name = str(student.name);

    var intro = plainObject(r.intro);
    base.intro.safetyRead = bool(intro.safetyRead);

    var concept = plainObject(r.concept);
    base.concept.opened = plainObject(concept.opened);
    base.concept.checkChoices = plainObject(concept.checkChoices);
    base.concept.checks = plainObject(concept.checks);

    /* 3단계 — 아는 열쇠만 받는다. 저장 자료에 엉뚱한 열쇠가 있어도 세지 않게. */
    var circuit = plainObject(r.circuit);
    var savedChecks = plainObject(circuit.checks);
    base.circuit.checks = {};
    (PC.CIRCUIT_CHECKS || []).forEach(function (item) {
      if (savedChecks[item.id] === true) base.circuit.checks[item.id] = true;
    });

    var code = plainObject(r.code);
    base.code.exampleRun = bool(code.exampleRun);
    base.code.learned = bool(code.learned);
    base.code.mode = str(code.mode) || "assemble";
    base.code.assembleOrder = array(code.assembleOrder).map(str);
    base.code.blanks = plainObject(code.blanks);
    base.code.source = str(code.source);
    base.code.testsPassed = num(code.testsPassed);
    base.code.testsTotal = num(code.testsTotal);
    base.code.attempts = num(code.attempts);
    base.code.ran = bool(code.ran);
    base.code.syntaxErrors = array(code.syntaxErrors);
    base.code.pinMismatch = array(code.pinMismatch);

    var experiment = plainObject(r.experiment);
    var runs = plainObject(experiment.runs);
    base.experiment.runs = {};
    Object.keys(runs).forEach(function (id) {
      var item = plainObject(runs[id]);
      base.experiment.runs[id] = {
        predict: str(item.predict),
        ran: bool(item.ran),
        blinks: num(item.blinks),
        elapsed: num(item.elapsed),
        observation: str(item.observation),
        surprise: str(item.surprise)
      };
    });
    base.experiment.extensionSource = str(experiment.extensionSource);
    base.experiment.extensionTried = bool(experiment.extensionTried);
    base.experiment.lastRun = experiment.lastRun || null;

    var assessment = plainObject(r.assessment);
    base.assessment.answers = plainObject(assessment.answers);
    base.assessment.attempts = num(assessment.attempts);
    base.assessment.graded = bool(assessment.graded);
    base.assessment.sealed = bool(assessment.sealed);

    base.submissionId = str(r.submissionId);
    base.submitted = r.submitted || null;

    /* 이미 제출을 마친 자료라면 답안은 잠긴 것이다.
       저장 자료에서 sealed 만 지워 답을 고치는 길을 막는다. */
    if (base.submitted) base.assessment.sealed = true;

    /* 잠기지 않았으면 채점 결과도 열려 있을 수 없다 */
    if (!base.assessment.sealed) base.assessment.graded = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다.
       (저장 자료를 손으로 고쳐 단계를 건너뛰지 못하게) */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    if (Object.keys((state.circuit && state.circuit.checks) || {}).length > 0) return true;
    if (state.code.source) return true;
    if (Object.keys(state.experiment.runs || {}).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.intro.safetyRead || Object.keys(state.concept.checks).length > 0) return true;
    return false;
  }

  /** 시각을 「2026-08-18 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  S.emptyState = emptyState;
  S.normalizeState = normalizeState;
  S.hasContent = hasContent;
  S.formatTime = formatTime;

  if (typeof module !== "undefined" && module.exports) module.exports = S;
})();

    <script data-from="student/s10-ui.js">
/**
 * 화면 부품 (명세 13장)
 *
 * 여기서 만드는 요소는 모두 «텍스트로» 넣는다(textContent).
 * innerHTML 에 사람이 쓴 글을 넣지 않는다 — 스크립트가 섞여 들어갈 수 없게 하기 위해서다.
 *

 *   · 모든 입력에는 <label for> 을 붙인다
 *   · 정답/오답·위험은 색이 아니라 «아이콘 + 글자» 로도 알린다
 *   · 터치 영역은 최소 44px

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /* 화면이 없는 곳(테스트)에서는 이 파일이 하는 일이 없다 */

  function nextId(prefix) {

   * 요소 하나를 만든다.

    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });

    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  /** SVG 요소 — HTML 과 이름 공간이 달라 따로 만든다 */
  function svg(tag, attrs, children) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v === null || v === undefined) return;
      node.setAttribute(k, String(v));
    });
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);

  /* ------------------------------ 카드 ------------------------------ */

  function card(opts, children) {

    if (o.eyebrow) head.push(el("p", { class: "card__eyebrow", text: o.eyebrow }));
    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));

    if (head.length) parts.push(el("div", { class: "card__head" }, head));

          document.createTextNode(String(message || ""))
        ])
      ].concat(children || []))
    ]);
  }

  /** 조건 목록 한 줄 — 「✔ 통과」 또는 「○ 아직」 (명세 6.2 · 13장) */
  function conditionRow(label, ok, detail) {
    return el("li", { class: "cond" + (ok ? " cond--ok" : "") }, [
      el("span", { class: "cond__mark", attrs: { "aria-hidden": "true" }, text: ok ? "✔" : "○" }),
      el("div", { class: "cond__body" }, [
        el("p", { class: "cond__label" }, [
          el("span", { class: "sr-only", text: ok ? "충족함: " : "아직 못 함: " }),
          document.createTextNode(String(label))
        ]),
        detail ? el("p", { class: "cond__detail", text: detail }) : null
      ]),
      el("span", { class: "cond__state", text: ok ? "통과" : "아직" })
    ]);
  }

  /**
   * 접어 두는 덧자료 — «마쳐야 하는 것» 과 «더 보고 싶은 것» 을 갈라 놓는다.
   *
   * 닫힌 채로 나온다. 펼칠 때 만들므로 열지 않으면 그리지도 않는다.

  /* ------------------------------ 입력 ------------------------------ */

  /**
   * 서술형·단답형 입력 한 칸.
   * spec : { label, min, placeholder, help, multiline, rows, mono }

   */
  function field(spec, value, onInput) {
    var s = spec || {};
    var id = nextId("in");
    var cntId = id + "-cnt";
    var errId = id + "-err";

    var input = s.multiline
      ? el("textarea", {
          class: "input input--area" + (s.mono ? " input--mono" : ""),

      : el("input", {

            type: "text",

            "aria-describedby": cntId,
            maxlength: (PC.LIMITS && PC.LIMITS.textMax) || 1000
          }
        });
    input.value = value || "";

    function countText() {
      var len = PC.schema.contentLength(input.value);
      return s.min ? "공백 제외 " + len + "자 / 최소 " + s.min + "자" : "공백 제외 " + len + "자";
    }

    var counter = el("p", { class: "field__count", id: cntId, text: countText() });
    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

    function refresh() {
      counter.textContent = countText();
      var enough = !s.min || PC.schema.contentLength(input.value) >= s.min;
      counter.className = "field__count" + (enough ? " field__count--ok" : "");
    }

    input.addEventListener("input", function () {
      refresh();
      if (onInput) onInput(input.value);

    function setError(message) {
      if (message) {
        error.textContent = "⚠ " + message;

      }
    }

    var rootNode = el("div", { class: "field" }, [
      el("label", { class: "field__label", attrs: { for: id }, text: s.label || "" }),
      s.help ? el("p", { class: "field__help", text: s.help }) : null,
      input,
      el("div", { class: "field__foot" }, [counter, error])
    ]);

    return { root: rootNode, input: input, setError: setError, refresh: refresh };
  }

  /**
   * 보기 고르기 (라디오). 색이 아니라 «글자» 로 고른 것을 알린다.
   * spec : { name, legend, choices:[문자열], numbered }
   */
  function choiceGroup(spec, selected, onPick) {
    var s = spec || {};
    var name = s.name || nextId("q");
    var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

    var items = (s.choices || []).map(function (label, i) {
      var id = name + "-" + i;
      var input = el("input", {
        class: "choice__input",
        id: id,
        attrs: { type: "radio", name: name, value: String(i) }
      });
      if (String(selected) === String(i)) input.checked = true;
      input.addEventListener("change", function () {
        if (onPick) onPick(i);
      });

      return el("div", { class: "choice" }, [
        input,
        el("label", { class: "choice__label", attrs: { for: id } }, [
          s.numbered === false
            ? null
            : el("span", { class: "choice__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
          el("span", { class: "choice__text", text: label })
        ])
      ]);
    });

    return el("fieldset", { class: "choices" }, [
      s.legend ? el("legend", { class: "choices__legend", text: s.legend }) : null
    ].concat(items));
  }

  function button(label, opts) {
    var o = opts || {};
    var attrs = {
      type: "button",
      disabled: o.disabled ? true : null,
      "aria-pressed": o.pressed === undefined ? null : o.pressed ? "true" : "false",
      title: o.title || null
    };
    /* 부르는 곳에서 aria-label 같은 것을 더 붙일 수 있게 */
    Object.keys(o.attrs || {}).forEach(function (k) {
      attrs[k] = o.attrs[k];
    });

    return el("button", {
      class: o.class && o.class.indexOf("btn") === 0 ? o.class : "btn " + (o.class || "btn--primary"),
      text: label,
      attrs: attrs,
      on: o.on || (o.click ? { click: o.click } : null)
    });
  }

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,
   * 초점을 상자 안에 잡아 준다. file:// 에서도 그대로 동작한다.
   *
   * spec = {
   *   title, lines[], okLabel, cancelLabel,
   *   onOk, onCancel,
   *   dismiss : "ok" | "cancel"   — Esc 로 닫았을 때 어느 쪽으로 볼지
   * }
   *
   * ★ Esc 로 닫으면 «지우지 않는 쪽» 이 되게 부르는 곳에서 dismiss 를 정한다.
   *   실수로 눌러 기록이 사라지는 일은 되돌릴 수 없다.
   */
  function askDialog(spec) {
    var s = spec || {};
    var dialog = el("dialog", { class: "modal" });
    var settled = false;

    function done(which) {
      if (settled) return;
      settled = true;
      if (dialog.open && dialog.close) dialog.close();
      /* 닫는 애니메이션이 끝난 뒤 치운다 */
      setTimeout(function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
      }, 0);
      if (which === "ok" && s.onOk) s.onOk();
      if (which === "cancel" && s.onCancel) s.onCancel();
    }

    var okBtn = button(s.okLabel || "확인", {
      click: function () {
        done("ok");
      }
    });

    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", text: s.title || "" }),
        el(
          "p",
          { class: "modal__text" },
          (s.lines || []).map(function (line, i) {
            /* 줄바꿈을 innerHTML 없이 만든다 (명세 15장 — 글은 textContent 로만) */
            return el("span", { class: "modal__line", text: line, id: i === 0 ? null : undefined });
          })
        ),
        el("div", { class: "modal__actions" }, [
          button(s.cancelLabel || "취소", {
            class: "btn btn--ghost",
            click: function () {
              done("cancel");
            }
          }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */
    okBtn.focus();

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 화면 낭독기에 조용히 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  S.ui = {
    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();
    </script>
    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical2-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();
    </script>
    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();

    <script data-from="student/s45-figures.js">
/**
 * 설명 그림 (명세 13장)
 *
 * 2단계 «원리 이해» 의 카드가 글만 있어서 장치 그림을 함께 넣는다.
 *
 * ★ 실제 사진을 «복제하지 않는다».
 *   명세 13장 — 「실제 부품 사진을 참고하되 저작권이 불명확한 이미지는
 *   복제하지 말고 자체 SVG로 그린다」.
 *   그래서 실물 사진을 보고 같은 배치로 «직접» 그렸다.
 *   덧붙여, 그림 파일을 심지 않으므로 단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 *
 * 보드와 브레드보드의 좌표는 shared/circuit.js 에서 가져온다.
 * 3단계 시뮬레이터와 «같은 그림» 이어야 학생이 헷갈리지 않기 때문이다.
 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,
 * 화면 낭독기에는 그 목록이 그림의 대체 설명이 된다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  function txt(value) {
    return document.createTextNode(String(value));
  }

  /** 번호 배지 — 그림 위에 얹는 동그란 번호 */
  function badge(no, x, y) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 11, class: "fig__badgebg" }),
      UI.svg("text", { x: x, y: y + 4, class: "fig__badgeno" }, [txt(String(no))])
    ]);
  }

  /**
   * O · X 배지 — «이렇게 꽂는다 / 이렇게 꽂으면 안 된다» 를 나타낸다.
   * 색만으로 알리지 않는다. 동그라미 안의 O·X 글자가 뜻을 지고,
   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.
   */
  function badgeMark(mark, x, y, kind) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg fig__badgebg--" + kind }),
      UI.svg("text", { x: x, y: y + 5, class: "fig__badgeno" }, [txt(mark)])
    ]);
  }

  /**
   * 배지에서 가리키는 곳까지 잇는 선.
   *
   * ★ 두 겹으로 그린다.
   *   아래 : 굵은 «흰» 선 — 청록 보드와 검은 헤더 위에서 선이 묻히지 않게 한다
   *   위   : 가는 «진한 주황» 선 — 흰 종이 위에서도 보이고, 보드 색과 확실히 다르다
   *
   * 한 겹으로는 어느 한쪽 바탕에서 반드시 묻힌다(파란 점선이 청록 보드에서 안 보였다).
   */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", {}, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderhalo" }),
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leader" }),
      /* 가리키는 끝에 점을 찍어 «어디를» 가리키는지 분명히 한다 */
      UI.svg("circle", { cx: x2, cy: y2, r: 3.5, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 덩어리를 만든다.
   *   opts : { viewBox, caption, items:[{text}], build(g) }
   *
   * items 의 차례가 곧 배지 번호다. build 안에서 badge(n, x, y) 로 같은 번호를 얹는다.
   */
  function figure(opts) {
    var o = opts || {};
    var items = o.items || [];

    /* 배지에 쓸 표시. 따로 주지 않으면 1, 2, 3 … 을 쓴다.
       그림의 배지와 아래 설명 목록은 반드시 «같은 표시» 여야 한다.
       그림에는 O 인데 목록에는 다른 글자가 있으면 짝을 지을 수 없다. */
    var marks = o.marks || items.map(function (_, i) {
      /* 배지에 그리는 것과 «똑같은» 숫자를 목록에도 쓴다 */
      return String(i + 1);
    });

    /* 그림의 «대체 설명» — 낭독기는 이 글을 읽는다 */
    var alt =
      o.caption +
      ". 표시된 곳 : " +
      items
        .map(function (item, i) {
          return marks[i] + " " + item.text;
        })
        .join(", ");

    var svgNode = UI.svg("svg", {
      viewBox: o.viewBox,
      class: "fig__svg",
      role: "img",
      "aria-label": alt
    });
    if (o.build) o.build(svgNode);

    var legend = UI.el("ol", { class: "fig__legend" }, items.map(function (item, i) {
      var kind = (o.markKinds || [])[i];
      return UI.el("li", { class: "fig__item" }, [
        UI.el("span", {
          class: "fig__no" + (kind ? " fig__no--" + kind : ""),
          attrs: { "aria-hidden": "true" },
          text: marks[i]
        }),
        UI.el("span", { class: "fig__text", text: item.text })
      ]);
    }));

    /* 브레드보드처럼 «세로로 긴» 그림은 그대로 두면 화면을 다 차지한다.
       narrow 를 주면 폭을 묶어 카드 안에 들어오는 크기로 줄인다.
       variant 는 그 밖의 크기 갈래 — 지금은 "board"(3단계 회로 그림) 하나다. */
    return UI.el("figure", {
      class: "fig" + (o.narrow ? " fig--narrow" : "") + (o.variant ? " fig--" + o.variant : "")
    }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      UI.el("figcaption", { class: "fig__cap", text: o.caption }),
      legend
    ]);
  }

  /* ================================================================== */
  /* 1. 아두이노 우노 보드                                                */
  /* ================================================================== */

  /** 3단계 시뮬레이터와 같은 좌표로 보드를 그린다(누를 수는 없는 «설명용») */
  function drawUnoBody(g) {
    var box = C.UNO.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12, class: "uno__body" }));
    [C.UNO.usbBox, C.UNO.jackBox].forEach(function (b) {
      g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: "uno__usb" }));
    });
    [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
      g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
    });

    /* 보드 위의 큰 부품들 — 실물을 보고 자리만 맞추어 단순하게 */
    var chip = C.UNO.chip;
    g.appendChild(UI.svg("rect", { x: chip.x, y: chip.y, width: chip.w, height: chip.h, rx: 3, class: "fig__chip" }));
    g.appendChild(
      UI.svg("text", { x: chip.x + chip.w / 2, y: chip.y + 28, class: "fig__chiptext" }, [txt("ATmega328P")])
    );
    /* 리셋 버튼 — 헤더 띠(y 44~72) 를 피해 보드 빈자리에 둔다 */
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 9, class: "fig__reset" }));
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 4, class: "fig__resetin" }));
    g.appendChild(UI.svg("rect", { x: 110, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("rect", { x: 140, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("circle", { cx: 460, cy: 106, r: 5, class: "fig__led" }));
    g.appendChild(UI.svg("text", { x: 474, y: 110, class: "uno__brandsub" }, [txt("ON")]));

    g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));

    /* 무리 이름과 핀 이름표 */
    g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
    g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
    g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

    C.UNO.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "fig__hole" }));
      g.appendChild(
        UI.svg(
          "text",
          {
            x: pin.x,
            y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
            class: "pin__label"
          },
          [txt(pin.label)]
        )
      );
    });
  }

  function unoFigure() {
    return figure({
      viewBox: "-56 -34 676 358",
      caption: "아두이노 우노 보드 — 가장자리 구멍마다 이름이 있다",
      items: [
        { text: "USB 단자 — 컴퓨터와 잇는다. 프로그램을 보내고 전기도 받는다." },
        { text: "디지털 핀 D0~D13 — 위 줄에 있다(가리킨 곳은 D13). 켜짐(HIGH)·꺼짐(LOW) 두 가지만 다룬다." },
        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },
        { text: "5V — 부품에 전기를 보내 주는 «+» 자리." },
        { text: "GND — 전기가 돌아오는 길이자 0V 기준점. 세 곳이 보드 안에서 이어져 있다." },
        { text: "ATmega328P — 프로그램이 담겨 «처리» 를 맡는 칩." }
      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;
        var chip = C.UNO.chip;
        var d13 = C.terminal("uno", "D13");
        var vcc = C.terminal("uno", "5V");
        var gnd = C.terminal("uno", "GND2");
        var a0 = C.terminal("uno", "A0");

        /* ① USB — 보드 왼쪽 밖에서 가로로 */
        g.appendChild(leader(-27, usb.y + usb.h / 2, usb.x - 2, usb.y + usb.h / 2));
        g.appendChild(badge(1, -40, usb.y + usb.h / 2));

        /* ② 디지털 핀 — «D13 구멍» 을 바로 위에서 가리킨다.
              무리 이름은 x 300 으로 비켜 두었으므로 이 선과 겹치지 않는다. */
        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));
        g.appendChild(badge(2, d13.x, -20));

        /* ③ 아날로그 핀 — «A0 구멍» 을 바로 아래에서.
              A0~A5 가운데를 가리키면 A2·A3 사이를 짚어 어느 핀인지 알 수 없다. */
        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        /* ④ 5V — 그 구멍을 바로 아래에서 */
        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));

        /* ⑤ GND — 세 곳 중 아래 줄의 GND 구멍을 바로 아래에서 */
        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }
    });
  }

  /* ================================================================== */
  /* 2. 브레드보드                                                        */
  /* ================================================================== */

  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

  function breadboardFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "브레드보드 — 어느 구멍끼리 이어지는가(같은 전극)",
      items: [
        { text: "+ 레일(빨간 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극이라 5V 를 한 곳에만 넣으면 된다." },
        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },
        { text: "가운데 홈 — 여기서 전극이 끊긴다. 위와 아래가 서로 붙지 않게 일부러 끊어 놓은 것이다." },
        { text: "같은 4번 열이지만 F~J (주황 점선) 는 «다른 전극» 이다. 이으려면 점퍼선으로 A4–F4 를 직접 이어 준다." }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* 4번 열을 위(A~E)·아래(F~J)로 나누어 감싼다.
           같은 열이어도 홈을 넘으면 «다른 전극» 이라는 것이 이 그림의 요점이다. */
        wrapColumn(g, "A4", "E4", "fig__hilite");
        wrapColumn(g, "F4", "J4", "fig__hilite--other");

        /* 가리키는 자리는 실제 구멍 좌표에서 가져온다 */
        var railTP = C.terminal("bb", "TP-10");
        var railTN = C.terminal("bb", "TN-10");
        var c4top = C.terminal("bb", "C4");
        var h4 = C.terminal("bb", "H4");
        var gapMid = C.BB.gap.y + C.BB.gap.h / 2;
        var right = 904;

        g.appendChild(leader(right, railTP.y, railTP.x + 14, railTP.y));
        g.appendChild(badge(1, right + 14, railTP.y));

        g.appendChild(leader(right, railTN.y, railTN.x + 14, railTN.y));
        g.appendChild(badge(2, right + 14, railTN.y));

        g.appendChild(leader(right, c4top.y, c4top.x + 11, c4top.y));

  /** LED 를 크게 그린다. 다리 길이가 다르고 K 쪽 옆면이 평평하다. */
  function bigLed(g, cx, baseY, opts) {
    var o = opts || {};
    var r = o.r || 40;
    var cy = baseY - 46;
    var flatX = cx + r - 11;
    var lit = o.lit === true;

    /* 몸통 — 위는 둥글고 오른쪽(K 쪽) 옆면이 잘려 «평평» 하다 */
    g.appendChild(
      UI.svg("path", {
        d:
          "M " + (cx - r) + " " + (baseY - 10) +
          " L " + (cx - r) + " " + cy +
          " A " + r + " " + r + " 0 0 1 " + flatX + " " + (cy - r + 5) +
          " L " + flatX + " " + (baseY - 10) + " Z",
        class: "figled__body" + (lit ? " figled__body--on" : "")
      })
    );
    /* 아래 테두리(플랜지) — 실물 LED 의 둥근 턱 */
    g.appendChild(
      UI.svg("rect", { x: cx - r - 4, y: baseY - 12, width: 2 * r + 8, height: 9, rx: 3, class: "figled__flange" })
    );

    /* 다리 — 왼쪽(A)이 «더 길다». 길이 자체가 극성을 알리는 표시다. */
    g.appendChild(
      UI.svg("line", { x1: cx - 16, y1: baseY - 3, x2: cx - 16, y2: baseY + 72, class: "figled__leg" })
    );
    g.appendChild(
      UI.svg("line", { x1: cx + 16, y1: baseY - 3, x2: cx + 16, y2: baseY + 44, class: "figled__leg" })
    );
    return { cx: cx, cy: cy, r: r, flatX: flatX, baseY: baseY };
  }

              class: "fig__ledsym" + (withRes ? " fig__ledsym--on" : " fig__ledsym--burn")
            })

          );

  /** ⑤ 디지털 출력 HIGH · LOW */
  function digitalFigure() {
    var pin = PC.LED_PIN_NAME || "D7";
    return figure({
      viewBox: "0 0 520 260",
      caption: "디지털 출력 HIGH 와 LOW",
      items: [
        { text: "HIGH — " + pin + " 이 약 5V 를 내보낸다. GND 와 전위 차이가 생겨 전류가 흐르고 LED 가 켜진다" },
        { text: "LOW — " + pin + " 이 0V 를 내보낸다. GND 와 차이가 없어 전류가 흐르지 않고 LED 가 꺼진다" },
        { text: "중간 밝기는 없다. 디지털 출력은 두 가지뿐이다" },
        { text: "GND 가 이어지지 않으면 HIGH 를 내보내도 전류가 돌아올 길이 없어 켜지지 않는다" }
      ],
