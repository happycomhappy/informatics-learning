    return el("ul", { class: "wirelegend" }, [
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--orange", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "주황 — " + PC.LED_PIN_NAME + " 에서 LED 긴 다리까지 (신호가 나가는 길)" })
      ]),
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--blue", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "파랑 — LED 짧은 다리에서 GND 까지 (전류가 돌아오는 길)" })
      ]),
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--gray", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "회색 — 이 회로에 쓰이지 않는 케이블" })
      ])
    ]);
  }

  /** 「이렇게 이으면 됩니다」 아래에 늘 붙는 한 줄 (명세 17.3 B) */
  var RESISTOR_NOTE =
    "저항을 LED «뒤» 에 두어도(LED 짧은 다리 K → 저항 → GND) 정답입니다. " +
    "한 줄로 이어져 있으면 저항이 어느 자리에 있든 같은 전류가 흐릅니다.";

  function renderCircuit(state, app) {
    var box = el("div");
    var circuit = state.circuit;

    /* ================================================================ */
    /* 3-A 부품과 단자 찾기 (명세 17.3 A)                                 */
    /* ================================================================ */

    if (!circuit.findDone) {
      var task = C.FIND_TASKS[circuit.findIndex] || C.FIND_TASKS[0];
      var findFeedback = el("div", { class: "feedback" });

      var findBoard = S.board.create({
        mode: "find",
        showBoard: true,
        showBread: false,
        showParts: true,
        getState: function () {
          return state.circuit;
        },
        onPick: function (component, pin) {
          var here = C.FIND_TASKS[state.circuit.findIndex];
          var result = C.checkFind(state.circuit.findIndex, component, pin, state.circuit.findPicks);
          UI.clear(findFeedback);
          if (result.ok) {
            app.update(function (s) {
              /* 어느 단자를 눌렀는지 기억한다 — 저항의 «반대쪽 끝» 을 가려내는 데 쓴다 */
              if (here) s.circuit.findPicks[here.id] = component + "/" + pin;
              s.circuit.findIndex += 1;
              if (result.done) s.circuit.findDone = true;
            });
            UI.toast(result.message);
            return;
          }
          app.patch(function (s) {
            s.circuit.findAttempts += 1;
          });
          findFeedback.appendChild(UI.alert("warn", result.message));
        }
      });

      box.appendChild(
        UI.card(
          {
            eyebrow: "3단계 · A 부품과 단자 찾기",
            title: "먼저 부품에서 단자를 찾습니다.",
            desc: "여섯 곳을 차례로 찾으면 케이블 연결로 넘어갑니다."
          },
          [
            taskStrip(
              C.FIND_TASKS.map(function (t, i) {
                var name =
                  t.id === "f-d11"
                    ? C.LED_PIN_NAME
                    : t.id === "f-gnd"
                    ? "GND"
                    : t.id === "f-led-a"
                    ? "LED 긴 다리"
                    : t.id === "f-led-k"
                    ? "LED 짧은 다리"
                    : t.id === "f-res-1"
                    ? "저항 한쪽"
                    : "저항 반대쪽";
                return { text: name, done: i < circuit.findIndex, now: i === circuit.findIndex };
              })
            ),
            UI.alert("info", task.prompt),
            el("p", {
              class: "para",
              text:
                "그림에서 그 단자를 누르세요. 화살표 키로 옮기고 Enter 로 고를 수도 있습니다. " +
                "LED 는 다리 길이를, 저항은 몸통에 적힌 " + C.RESISTOR_OHM + "Ω 글자를 보세요."
            }),
            findFeedback,
            findBoard.root
          ]
        )
      );
      return box;
    }

    /* ================================================================ */
    /* 3-B 케이블 연결 · 3-C 점검과 전원 인가 (명세 17.3 B·C)              */
    /* ================================================================ */

    var check = C.checkCircuit(circuit.connections);
    var dangers = C.dangers(circuit.connections);
    var powerState = C.canPowerOn(circuit.connections);
    var now = nowDoing(state, check, dangers);

    /* ---------------- 회로 그림 ---------------- */

    var boardWire = S.board.create({
      mode: circuit.powerOn ? "probe" : "wire",
      showBoard: true,
      showBread: true,
      showParts: true,
      getState: function () {
        return state.circuit;
      },
      onConnect: function (conn) {
        app.update(function (s) {
          s.circuit.connections.push(conn);
          s.circuit.attempts += 1;
          resetPower(s);
          C.dangers(s.circuit.connections).forEach(function (d) {
            s.circuit.errors.push({ code: d.code, title: d.title, at: new Date().toISOString() });
          });
        });
      },
      onUndo: function () {
        app.update(function (s) {
          s.circuit.connections.pop();
          resetPower(s);
        });
      },
      onReset: function () {
        app.update(function (s) {
          s.circuit.connections = [];
          resetPower(s);
        });
      },
      onProbe: function (a, b) {
        var result = C.measure(state.circuit.connections, a, b, state.circuit.powerOn);
        app.patch(function (s) {
          s.circuit.lastMeasure = {
            text: result.text,
            note: result.note,
            from: C.describe(a.component, a.pin),
            to: C.describe(b.component, b.pin)
          };
        });
        drawMeasure();
      }
    });

    /* ---------------- 멀티미터 (선택 활동) ----------------
       이 차시의 통과 조건이 아니다. 회로가 왜 그렇게 되었는지
       더 알고 싶은 학생을 위해 «접어» 둔다. */

    var measureBox = el("div", { class: "meter" });

    function drawMeasure() {
      UI.clear(measureBox);
      var last = state.circuit.lastMeasure;
      if (!last) {
        measureBox.appendChild(
          el("p", { class: "meter__note", text: "그림에서 두 곳을 차례로 누르면 그 사이 전압을 잽니다." })
        );
        return;
      }
      measureBox.appendChild(
        el("div", { class: "meter__panel" }, [
          el("span", { class: "meter__label", text: "측정값" }),
          el("span", { class: "meter__value", text: last.text })
        ])
      );
      measureBox.appendChild(el("p", { class: "meter__where", text: last.from + "  ↔  " + last.to }));
      measureBox.appendChild(el("p", { class: "meter__note", text: last.note }));
    }

    /* ---------------- ① 점검 항목 + 전원 (맨 위) ---------------- */

    var hintOut = el("div", { class: "hintout" });

    /**
     * 조건 한 줄에 «힌트 보기» 를 붙인다.
     * 힌트는 개념 질문 → 위치 안내 → 구체적 연결 안내 세 단계로 «올라간다»(명세 18.2).
     * 항목마다 따로 세므로, 다른 항목의 힌트를 봤다고 이 항목이 건너뛰지 않는다.
     */
    var conditionList = el("ul", { class: "condlist" });
    check.conditions.forEach(function (cond) {
      var row = cond.blocked
        ? el("li", { class: "condlist__item condlist__item--wait" }, [
            el("span", { class: "condlist__mark", attrs: { "aria-hidden": "true" }, text: "—" }),
            el("span", { class: "condlist__text", text: cond.label }),
            el("span", { class: "condlist__note", text: cond.blockedWhy })
          ])
        : UI.conditionRow(cond.label, cond.ok);

      if (!cond.ok && !cond.blocked) {
        row.appendChild(
          UI.button("힌트 보기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              var level = Math.min(Number(state.circuit.hintLevels[cond.id]) || 0, 2);
              var message = C.hintFor(cond.id, level);
              app.patch(function (s) {
                s.circuit.hintsUsed += 1;
                s.circuit.hintLevels[cond.id] = level + 1;
              });
              UI.clear(hintOut).appendChild(
                UI.alert("info", message, [
                  el("p", {
                    class: "alert__fix",
                    text:
                      level >= 2
                        ? "마지막 힌트입니다."
                        : "아직 모르겠으면 [힌트 보기] 를 한 번 더 누르세요."
                  })
                ])
              );
            }
          })
        );
      }
      conditionList.appendChild(row);
    });

    var powerRow = el("div", { class: "btnrow" });
    if (!circuit.powerOn) {
      powerRow.appendChild(
        UI.button("전원 켜기", {
          disabled: !powerState.ok,
          title: powerState.ok ? "" : "점검 항목을 모두 채워야 전원을 켤 수 있습니다.",
          click: function () {
            app.update(function (s) {
              s.circuit.checkPassed = true;
              s.circuit.powerOn = true;
              /* 명세 18.1 의 «부품 경로 검사 결과» 를 제출 자료에 담아 둔다 */
              var a = C.analyze(s.circuit.connections);
              s.circuit.path = {
                ledDirection: a.ledDirection,
                hasResistor: a.hasResistor,
                resistanceOhm: a.resistanceOhm,
                shortCircuit: a.shortCircuit
              };
            });
            UI.toast("전원을 켰습니다. 아직 코드가 없으므로 LED 는 꺼져 있습니다.");
          }
        })
      );
      powerRow.appendChild(
        UI.button("회로 점검", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.checked = true;
            });
            var left = C.checkCircuit(state.circuit.connections).missing;
            UI.toast(
              left.length === 0
                ? "모든 항목을 채웠습니다. [전원 켜기] 를 누르세요."
                : "아직 " + left.length + "가지가 남았습니다. 위 목록을 보세요."
            );
          }
        })
      );
      if (!powerState.ok) {
        powerRow.appendChild(
          el("p", {
            class: "btnrow__note",
            text:
              powerState.reason === "danger"
                ? "위험한 연결이 있어 전원을 넣을 수 없습니다."
                : "위 다섯 항목을 모두 채우면 켤 수 있습니다."
          })
        );
      }
    } else {
      powerRow.appendChild(
        UI.button("전원 끄기", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.powerOn = false;
            });
          }
        })
      );
      powerRow.appendChild(
        el("p", {
          class: "btnrow__note",
          text:
            "전원이 켜졌습니다. " + C.LED_PIN_NAME + " 은 아직 LOW 입니다 — " +
            "무엇을 내보낼지 정하는 코드가 없기 때문입니다. 4단계에서 코드를 만들면 켜집니다."
        })
      );
    }

    /* ------------------------------------------------------------------ */
    /* «지금 이어진 것» 한 줄 — 늘 보인다                                    */
    /*                                                                    */
    /* 앱이 이 회로를 무엇으로 «보고 있는지» 를 그대로 되비춘다.               */
    /* 판정이 왜 그렇게 나왔는지 학생도 선생님도 바로 확인할 수 있다.          */
    /* 정답을 알려 주는 것이 아니므로 늘 내보여도 된다.                       */
    /* ------------------------------------------------------------------ */
    var nowLine = el("div", { class: "nowpath" }, [
      el("span", { class: "nowpath__tag", text: "지금 이어진 것" }),
      el("span", { class: "nowpath__text", text: C.describeCurrent(circuit.connections) })
    ]);

    /* ------------------------------------------------------------------ */
    /* «이렇게 이으면 됩니다» — 접어 둔다                                    */
    /*                                                                    */
    /* ★ 펼쳐야만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).      */
    /*   막힌 학생과, 앱이 무엇을 바라는지 확인하려는 선생님을 위한 자리다.     */
    /* ------------------------------------------------------------------ */
    var goal = C.goalStatus(circuit.connections);
    var goalBox = UI.foldout("이렇게 이으면 됩니다 — 막히면 펼쳐 보세요", function () {
      var list = el("ol", { class: "goallist" }, goal.lines.map(function (line) {
        return el("li", { class: "goallist__item" + (line.ok ? " is-done" : "") }, [
          el("span", {
            class: "goallist__mark",
            attrs: { "aria-hidden": "true" },
            text: line.ok ? "✔" : "○"
          }),
          el("span", { class: "sr-only", text: line.ok ? "이어짐 : " : "아직 : " }),
          el("span", { class: "goallist__text", text: line.label }),
          el("span", { class: "goallist__state", text: line.ok ? "이어짐" : "아직" })
        ]);
      }));

      var parts = [
        el("p", {
          class: "para",
          text:
            "케이블 세 줄이면 됩니다. 브레드보드를 거쳐 가도 되고, 같은 마디면 어느 구멍에 꽂아도 같습니다."
        }),
        list,
        UI.alert(
          "info",
          RESISTOR_NOTE
        )
      ];

      if (goal.equivalent) {
        parts.push(
          UI.alert(
            "ok",
            "여러분은 위와 «다르게» 이었지만 전기적으로 같은 회로입니다. 그대로 두어도 정답입니다."
          )
        );
      }
      return el("div", {}, parts);
    });

    var checkBody = [
      nowLine,
      taskStrip([
        {
          text: C.LED_PIN_NAME + " → 저항 → LED",
          done: !check.missing.some(function (m) {
            return m.id === "c-anode" || m.id === "c-resistor";
          }),
          now: now.at === 1
        },
        {
          text: "LED → GND",
          done: !check.missing.some(function (m) {
            return m.id === "c-cathode" || m.id === "c-tidy";
          }),
          now: now.at === 2
        },
        { text: "전원 켜기", done: circuit.powerOn, now: now.at === 3 }
      ]),
      UI.alert(now.at === 0 ? "danger" : now.at === 4 ? "ok" : "info", now.text),
      conditionList,
      hintOut,
      goalBox
    ];

    /* 위험 연결 — 무엇이 어떻게 되는지(effect)까지 함께 적는다.
       «오답» 이라고만 하면 역극성과 무저항이 같은 것으로 보인다(명세 12장). */
    dangers.forEach(function (d) {
      checkBody.push(
        UI.alert("danger", d.title + " — " + d.detail, [
          el("p", { class: "alert__fix", text: "시뮬레이션 : " + d.effect }),
          el("p", { class: "alert__fix", text: "고치는 법 : " + d.fix })
        ])
      );
    });

    /* 반쯤 꽂힌 다리와 쓸모없는 케이블을 «이름으로» 짚어 준다 */
    if (check.dangling.length > 0) {
      checkBody.push(
        UI.alert(
          "warn",
          "한쪽만 이어진 다리가 있습니다 : " +
            check.dangling
              .map(function (d) {
                return d.label;
              })
              .join(", ")
        )
      );
    }
    if (check.stray.length > 0) {
      checkBody.push(
        UI.alert("warn", "이 회로에 쓰이지 않는 케이블이 " + check.stray.length + "개 있습니다. 지워 주세요.")
      );
    }

    checkBody.push(powerRow);

    box.appendChild(
      UI.card(
        {
          eyebrow: "3단계 · B 케이블 연결 · C 점검",
          title: "회로 점검",
          desc:
            C.LED_PIN_NAME + " → " + C.RESISTOR_OHM + "Ω 저항 → LED 양극, LED 음극 → GND 로 잇습니다. " +
            "저항은 LED 앞에 두어도 뒤에 두어도 됩니다."
        },
        checkBody
      )
    );

    /* ---------------- ② 회로 그림 + 케이블 목록 ---------------- */

    var wireList = el("ul", { class: "wirelist" });
    if (circuit.connections.length === 0) {
      wireList.appendChild(el("li", { class: "wirelist__empty", text: "아직 이은 케이블이 없습니다." }));
    }
    /* 색은 «회로의 어느 쪽인가» 로 정해진다. 목록도 같은 값을 써야 그림과 어긋나지 않는다. */
    var wireSides = C.wireSides(circuit.connections);
    circuit.connections.forEach(function (conn, index) {
      var side = wireSides[index] || "";
      var colorName = S.board.SIDE_COLOR[side] || "gray";
      wireList.appendChild(
        el("li", { class: "wirelist__item" }, [
          el("span", { class: "wirelist__dot wirelist__dot--" + colorName, attrs: { "aria-hidden": "true" } }),
          /* ★ 색만으로 알리지 않는다 — «D11 쪽 / GND 쪽» 을 글자로도 적는다(명세 6.1) */
          el("span", { class: "wirelist__side wirelist__side--" + (side || "none"), text: S.board.SIDE_WORD[side] }),
          el("span", {
            class: "wirelist__text",
            text:
              (S.board.COLOR_WORD[colorName] || "") +
              " · " +
              C.describe(conn.fromComponent, conn.fromPin) +
              " → " +
              C.describe(conn.toComponent, conn.toPin)
          }),
          UI.button("지우기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              app.update(function (s) {
                s.circuit.connections.splice(index, 1);
                resetPower(s);
              });
            }
          })
        ])
      );
    });

    var boardCard = UI.card(
      {
        title: "회로 그림",
        desc: circuit.powerOn
          ? "두 곳을 차례로 누르면 그 사이 전압을 잽니다. 케이블을 고치려면 [전원 끄기] 를 누르세요."
          : "단자를 하나 누르고, 이을 곳을 하나 더 누르면 케이블이 생깁니다. 아래쪽에 저항과 LED 가 있습니다."
      },
      [boardWire.root, wireLegend(), wireList]
    );
    box.appendChild(boardCard);

    /* ---------------- ③ 멀티미터 — 접어 둔다(선택 활동) ---------------- */

    if (circuit.powerOn) {
      drawMeasure();
      box.appendChild(
        UI.foldout("회로를 더 살펴보기 — 멀티미터로 전압 재기", function () {
          return el("div", {}, [
            el("p", {
              class: "para",
              text:
                "여기는 마쳐야 하는 활동이 아닙니다. 궁금하면 두 곳을 짚어 전압을 재 보세요. " +
                "같은 마디로 이어진 두 곳은 0V, " + C.LED_PIN_NAME + " 과 GND 사이는 지금 0V 입니다 " +
                "(아직 LOW 이기 때문입니다)."
            }),
            measureBox
          ]);
        })
      );
    }

    return box;
  }

  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */

  /**
   * 4단계는 «읽고 → 돌려 보고 → 만든다» 세 판으로 나뉜다.
   *
   *   A 읽기   예시 프로그램을 한 줄씩 읽는다 (함수 설명·뼈대·실행 순서)
   *   B 확인   그 예시를 그대로 실행해 setup 1회 / loop 반복을 눈으로 본다
   *   C 만들기 조립 → 빈칸 → 편집으로 직접 적는다
   *
   * ★ B 를 마치기 전에는 C 를 «보여 주지 않는다».
   *   스케치를 한 번도 본 적 없는 학생에게 곧바로 작성 화면을 내밀면
   *   무엇을 하는 것인지 알 수 없다.
   */

  /**
   * 실행 결과를 보여 주는 작은 부품 — 예시와 학생 코드가 같은 것을 쓴다.
   *
   * 이 차시에는 시리얼 출력이 없다. 대신 명세 17.4 B 가 요구하는 네 가지를 함께 보인다.
   *   현재 실행 줄 · D11 상태 · LED 상태 · 누적 시간
   *
   * ★ 켜짐·꺼짐을 색으로만 알리지 않는다(명세 13장). ●/○ 와 «켜짐»·«꺼짐» 글자를 함께 쓴다.
   */
  function makeRunner(opts) {
    var o = opts || {};
    var viewHost = el("div");
    var panelHost = el("div");
    var player = null;

    /* 상태 등 — 다시 그리지 않고 «글자만» 바꾼다 */
    var lamp = el("span", { class: "lamp", attrs: { "aria-hidden": "true" }, text: "○" });
    var lampText = el("span", { class: "lamp__text", text: "꺼짐" });
    /* 등을 담는 상자를 «미리» 만들어 둔다.
       상자를 화면에 붙이기 전에 setLed 를 부를 때가 있어서, 그때 parentNode 를 찾으면 없다. */
    var lampBox = el("div", { class: "lamp-box" }, [lamp, lampText]);
    var pinText = el("span", { class: "runstat__value", text: "LOW" });
    var lineText = el("span", { class: "runstat__value", text: "—" });
    var timeText = el("span", { class: "runstat__value", text: "0.000초" });
    var phaseText = el("span", { class: "runstat__value", text: "setup()" });
    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });

    function setLed(on) {
      lamp.textContent = on ? "●" : "○";
      lampText.textContent = on ? "켜짐" : "꺼짐";
      pinText.textContent = on ? "HIGH" : "LOW";
      lampBox.className = "lamp-box" + (on ? " lamp-box--on" : "");
    }

    function statRow(label, valueNode) {
      return el("div", { class: "runstat" }, [
        el("span", { class: "runstat__label", text: label }),
        valueNode
      ]);
    }

    /**
     * 실행해 보여 준다.
     *   ro.instant   : 애니메이션 없이 «끝난 모습» 을 바로 보여 준다.
     *                  화면을 다시 그릴 때마다 처음부터 재생되면 눈이 어지럽다.
     *   ro.onCycle() : 켜짐 → 꺼짐 한 주기를 끝까지 «본» 순간 한 번 부른다(명세 17.4 B).
     */
    /**
     * 몇 바퀴를 돌려 보여 줄 것인가.
     *
     * ★ delay 를 «실제 시간» 만큼 기다리므로, 바퀴 수를 고정하면
     *   delay(1000) 짜리는 12초씩 걸리고 delay(100) 짜리는 눈 깜짝할 사이에 끝난다.
     *   그래서 재생이 6초 안팎이 되도록 바퀴 수를 맞춘다.
     *   (한 주기가 길면 적게, 짧으면 많이 — 어느 실험이든 볼 만큼은 되풀이된다)
     */
    function loopsFor(source) {
      var probe = A.run(source, { loopLimit: 2, ledPin: PC.LED_PIN });
      var cycleMs = probe.elapsed / 2;
      if (!cycleMs || cycleMs <= 0) return o.loopLimit || 4;
      return Math.max(2, Math.min(8, Math.round(6000 / cycleMs)));
    }

    function run(source, ro) {
      ro = ro || {};
      var result = A.run(source, { loopLimit: loopsFor(source), ledPin: PC.LED_PIN });
      var view = ED.codeView(source, { caption: "실행 중인 줄이 ▶ 로 표시됩니다." });
      UI.clear(viewHost).appendChild(view.root);

      if (!result.ok && result.error) {
        UI.clear(panelHost).appendChild(
          UI.alert("warn", (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message)
        );
        return result;
      }

      /* 한 주기가 끝나는 시각 — 켜짐·꺼짐이 각각 한 번씩 지나간 자리다 */
      var marks = result.led.timeline || [];
      var cycleEndT = marks.length >= 3 ? marks[2].t : null;
      var cycleTold = false;

      if (player) player.stop();
      setLed(false);

      player = ED.player(view, {
        onStep: function (entry) {
          if (entry.ledOn !== undefined) setLed(entry.ledOn === true);
          if (entry.line) lineText.textContent = entry.line + "번 줄";
          timeText.textContent = (entry.t / 1000).toFixed(3) + "초";
          phaseText.textContent =
            entry.phase === "setup" ? "setup() — 한 번만" : "loop() " + entry.iteration + "회째";

          if (cycleEndT !== null && !cycleTold && entry.t >= cycleEndT) {
            cycleTold = true;
            live.textContent = "켜짐과 꺼짐을 한 주기 관찰했습니다.";
            if (ro.onCycle) ro.onCycle();
          }
        }
      });
      player.setTrace(result.trace);

      /* 켜짐·꺼짐 시간표 — setup 은 한 번, loop 는 되풀이되는 모습을 눈으로(명세 17.4 B) */
      var timeline = el("div", { class: "ledline" });
      var total = result.elapsed || 1;
      for (var i = 0; i + 1 < marks.length; i += 1) {
        var width = ((marks[i + 1].t - marks[i].t) / total) * 100;
        timeline.appendChild(
          el("span", {
            class: "ledline__seg ledline__seg--" + (marks[i].on ? "on" : "off"),
            /* el() 은 style 을 따로 받지 않는다. attrs 로 넘겨야 실제로 붙는다. */
            attrs: {
              style: "width:" + width.toFixed(2) + "%",
              title: (marks[i].on ? "켜짐 " : "꺼짐 ") + (marks[i + 1].t - marks[i].t) + "ms"
            },
            /* 색만으로 알리지 않는다 — 칸 안에 «켜짐/꺼짐» 을 글자로도 적는다(명세 13장) */
            text: width > 6 ? (marks[i].on ? "켜짐" : "꺼짐") : ""
          })
        );
      }

      UI.clear(panelHost).appendChild(
        el("div", { class: "runpanel" }, [
          el("div", { class: "runpanel__head" }, [
            lampBox,
            el("div", { class: "runstats" }, [
              statRow(PC.LED_PIN_NAME + " 출력", pinText),
              statRow("실행 중인 줄", lineText),
              statRow("어느 함수", phaseText),
              statRow("누적 시간", timeText)
            ])
          ]),
          marks.length > 1
            ? el("div", {}, [
                el("p", { class: "ledline__cap", text: "켜짐 · 꺼짐 시간표 — " + A.describeBlink(result) }),
                timeline
              ])
            : el("p", { class: "para", text: "LED 상태가 한 번도 바뀌지 않았습니다." }),
          el("div", { class: "btnrow" }, [
            el("span", { class: "btnrow__label", text: "재생 속도" }),
            UI.button("1배속", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.setSpeed(1);
                player.reset();
                player.play();
              }
            }),
            /* 0.5배속 — 깜빡임을 «천천히» 보고 싶을 때.
               빨리 감기는 이 차시에 쓸모가 없다. delay 를 줄이면 깜빡임 자체가 안 보인다. */
            UI.button("0.5배속", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.setSpeed(0.5);
                player.reset();
                player.play();
              }
            }),
            UI.button("즉시", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.setSpeed(0);
                player.reset();
                player.play();
              }
            }),
            UI.button("멈춤", { class: "btn btn--ghost btn--small", click: function () { player.stop(); } })
          ]),
          /* 명세 17.5 마지막 줄 — 재생 배율과 실제 delay 값을 혼동하지 않게 */
          el("p", {
            class: "runpanel__note",
            text:
              "delay 줄에서는 그 시간만큼 «실제로» 기다린 뒤 다음 줄로 넘어갑니다 — " +
              "delay(1000) 이면 1초입니다. 실제 보드와 같은 빠르기예요. " +
              "0.5배속은 두 배 천천히 보여 줄 뿐, 코드의 delay 값은 그대로입니다."
          }),
          live
        ])
      );

      player.setSpeed(ro.instant ? 0 : 1);
      player.play();
      return result;
    }

    return { viewHost: viewHost, panelHost: panelHost, run: run };
  }

  function renderCode(state, app) {
    var box = el("div");
    var code = state.code;
    var W = L.CODE_WALKTHROUGH;

    /* ================================================================ */
    /* A. 예시 읽기 (명세 17.4 A)                                        */
    /* ================================================================ */

    box.appendChild(
      UI.card({ eyebrow: "4단계 · A 먼저 읽기", title: W.title, desc: W.intro }, [
        /* ★ 프로그램과 함수 설명을 «나란히» 둔다.
           코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않아도 된다.
           좁은 화면에서는 코드가 위, 설명이 아래로 접힌다. */
        el("div", { class: "readpair" }, [
          el("div", { class: "readpair__code" }, [
            ED.codeView(W.code, { caption: "오늘 만들 프로그램" }).root
          ]),
          el("div", { class: "readpair__fns" }, [
            el("h3", { class: "subhead", text: "이 프로그램이 쓰는 함수" }),
            functionCards()
          ])
        ]),

        /* 뼈대 — 스케치는 언제나 이 두 함수로 이루어진다 */
        el("h3", { class: "subhead", text: "스케치의 뼈대는 함수 두 개다" }),
        el("div", { class: "skel" }, W.skeleton.map(function (part) {
          return el("div", { class: "skel__item" }, [
            el("code", { class: "skel__name", text: part.name }),
            el("p", { class: "skel__when" }, [
              el("b", { text: "언제 : " }),
              el("span", { text: part.when })
            ]),
            el("p", { class: "skel__what", text: part.what })
          ]);
        })),

        /* 줄마다 무슨 뜻인가 — 줄 수는 코드와 정확히 같다(명세 17.4 A) */
        el("h3", { class: "subhead", text: "한 줄씩 읽어 보기" }),
        el("ol", { class: "walk" }, W.lines.map(function (line) {
          return el("li", { class: "walk__item" }, [
            el("span", { class: "walk__no", attrs: { "aria-hidden": "true" }, text: String(line.no) }),
            el("div", { class: "walk__body" }, [
              line.code
                ? el("code", { class: "walk__code", text: line.code })
                : el("code", { class: "walk__code walk__code--empty", text: "(빈 줄)" }),
              el("p", { class: "walk__text", text: line.text })
            ])
          ]);
        })),

        /* 실행 순서 */
        el("h3", { class: "subhead", text: "어떤 순서로 돌아가는가" }),
        el("ol", { class: "orderlist" }, W.order.map(function (line) {
          return el("li", { text: line });
        })),

        /* 글쓰기 약속 카드는 선생님 요청으로 뺐다(2026-08-19).
           세미콜론·중괄호는 아래 «코드 검사» 가 실제로 틀렸을 때 줄 번호와 함께 짚어 준다. */
      ])
    );

    /* ================================================================ */
    /* B. 돌려 보기 (명세 17.4 B)                                        */
    /*                                                                  */
    /* ★ 한 주기(HIGH → 1000ms → LOW → 1000ms)를 «끝까지 보아야» C 가 열린다. */
    /* ================================================================ */

    var demo = makeRunner({ loopLimit: 4 });

    /* 한 주기를 본 순간 나타나는 자리. 화면 전체를 다시 그리면 재생이 끊기므로
       이 칸만 채운다. */
    var afterBox = el("div");

    function showAfterCycle() {
      if (afterBox.childNodes.length > 0) return;
      afterBox.appendChild(UI.alert("ok", W.afterRun));
      if (!state.code.learned) {
        afterBox.appendChild(
          el("div", { class: "btnrow" }, [
            UI.button("이해했어요 · 직접 만들어 보기", {
              class: "btn btn--primary btn--lg",
              click: function () {
                app.update(function (s) {
                  s.code.learned = true;
                });
              }
            })
          ])
        );
      }
    }

    var demoBody = [
      el("div", { class: "btnrow" }, [
        UI.button(code.exampleRun ? "다시 실행" : "예시 프로그램 실행", {
          click: function () {
            app.patch(function (s) {
              s.code.exampleRun = true;
            });
            UI.clear(afterBox);
            demo.run(W.code, { onCycle: showAfterCycle });
          }
        }),
        el("p", {
          class: "btnrow__note",
          text: "브라우저가 코드를 그대로 실행하지 않고, 허용된 문법만 읽어 흉내 냅니다."
        })
      ]),
      demo.viewHost,
      demo.panelHost,
      afterBox
    ];

    box.appendChild(
      UI.card(
        {
          eyebrow: "4단계 · B 돌려 보기",
          title: "예시 프로그램을 실행해 봅시다.",
          desc:
            "실행 중인 줄이 움직이고 LED 가 켜졌다 꺼집니다. " +
            "켜짐 → 꺼짐 «한 주기» 를 끝까지 보면 아래에 만드는 칸이 열립니다."
        },
        demoBody
      )
    );

    /* 이미 한 번 돌려 본 학생에게는 «즉시» 로 다시 채워 둔다.
       다시 그릴 때마다 처음부터 재생되면 눈이 어지럽고, 결과 칸이 비어 보이지도 않는다. */
    if (code.exampleRun) demo.run(W.code, { instant: true, onCycle: showAfterCycle });

    /* ★ 읽고 돌려 보기 전에는 «작성 화면» 을 만들지 않는다(명세 17.4 C).
       흐리게 비활성으로 미리 보여 주지도 않는다 — 아예 DOM 에 만들지 않는다. */
    if (!code.learned) {
      box.appendChild(
        UI.alert(
          "info",
          "위 예시를 읽고 [예시 프로그램 실행] 으로 한 주기를 관찰하면, 아래에 직접 만드는 칸이 열립니다."
        )
      );
      return box;
    }

    /* ================================================================ */
    /* C. 직접 만들기 (명세 17.4 C)                                      */
    /* ================================================================ */

    /* 검사 결과가 들어갈 자리.
       ★ 아래 «방식별 입력» 이 만들어지자마자 refreshTests 를 부르므로
         이 그릇은 그보다 «먼저» 만들어져 있어야 한다. */
    var testPanel = el("div");

    function setSource(next) {
      app.patch(function (s) {
        s.code.source = next;
      });
      refreshTests(next);
    }

    /* ---- 방식 고르기 ---- */
    var tabs = el("div", { class: "modetabs", attrs: { role: "tablist", "aria-label": "코딩 방식" } });
    A.CODE_MODES.forEach(function (m) {
      var active = code.mode === m.id;
      tabs.appendChild(
        el("button", {
          class: "modetab" + (active ? " modetab--on" : ""),
          text: m.label,
          attrs: { type: "button", role: "tab", "aria-selected": active ? "true" : "false" },
          on: {
            click: function () {
              app.update(function (s) {
                s.code.mode = m.id;
              });
            }
          }
        })
      );
    });

    var modeDesc = "";
    A.CODE_MODES.forEach(function (m) {
      if (m.id === code.mode) modeDesc = m.desc;
    });

    /* ---- 방식별 입력 ---- */
    var work = el("div", { class: "codework" });

    if (code.mode === "assemble") {
      var asm = ED.assembler(code.assembleOrder, function (order, source) {
        app.patch(function (s) {
          s.code.assembleOrder = order;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(asm.root);
      if (!code.source) setSource(asm.getSource());
    } else if (code.mode === "blank") {
      var bl = ED.blanks(code.blanks, function (source, values) {
        app.patch(function (s) {
          s.code.blanks = values;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(bl.root);
      setSource(bl.getSource());
    } else {
      var starter = "const int ledPin = " + PC.LED_PIN + ";\n\nvoid setup() {\n  \n}\n\nvoid loop() {\n  \n}";
      var ed = ED.editor(code.source || starter, function (value) {
        setSource(value);
      });
      work.appendChild(ed.root);
      work.appendChild(
        el("div", { class: "btnrow" }, [
          UI.button("빈 스케치 넣기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              ed.setValue(starter);
            }
          })
        ])
      );
      if (!code.source) setSource(ed.getValue());
    }

    box.appendChild(
      UI.card({ eyebrow: "4단계 · C 직접 만들기", title: "이제 같은 프로그램을 만들어 봅시다.", desc: modeDesc }, [
        tabs,
        work
      ])
    );

    /* ---- 코드 검사 여덟 항목 (명세 17.4) ---- */

    function refreshTests(source) {
      /* 8번 항목이 «회로» 를 함께 본다. 그래서 결선 목록을 넘긴다. */
      var result = A.validate(source, { connections: state.circuit.connections });
      var mismatch = result.ast ? C.pinMismatch(A.pinsUsed(result.ast), state.circuit.connections) : [];

      app.patch(function (s) {
        s.code.testsPassed = result.passed;
        s.code.testsTotal = result.tests.length;
        s.code.syntaxErrors = result.error ? [result.error] : [];
        s.code.pinMismatch = mismatch;
      });

      UI.clear(testPanel);

      if (result.error) {
        testPanel.appendChild(UI.alert("warn", result.error.line + "번 줄 — " + result.error.message));
      }

      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        list.appendChild(UI.conditionRow(t.label, t.ok, t.ok ? "" : t.message));
      });
      testPanel.appendChild(list);

      result.warnings.forEach(function (w) {
        testPanel.appendChild(UI.alert("info", w.line + "번 줄 — " + w.message));
      });

      /* 통과 개수가 바뀌었으므로 아래쪽 [다음] 단추도 다시 판단해야 한다 */
      app.rerenderNav();
      return result;
    }

    box.appendChild(
      UI.card(
        { title: "코드 검사", desc: "여덟 항목을 모두 통과해야 다음 단계가 열립니다." },
        [testPanel]
      )
    );

    /* ---- 내 코드 실행 ---- */
    var mine = makeRunner({ loopLimit: 4 });
    box.appendChild(
      UI.card({ title: "내 코드 실행하기", desc: "예시와 같은 결과가 나오는지 견주어 보세요." }, [
        el("div", { class: "btnrow" }, [
          UI.button("내 코드 실행", {
            click: function () {
              mine.run(state.code.source);
              app.patch(function (s) {
                s.code.ran = true;
                s.code.attempts += 1;
              });
              app.rerenderNav();
            }
          })
        ]),
        mine.viewHost,
        mine.panelHost
      ])
    );

    refreshTests(code.source);

    return box;
  }

  /* ================================================================== */
  /* 5단계 — 실행·탐구                                                   */
  /* ================================================================== */

  /**
   * ★ 방금 [실행] 을 누른 실험.
   *
   *   실행하면 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
   *   그런데 다시 그리면서 결과를 «즉시» 로 채우면, 학생이 보는 것은
   *   «이미 끝난 모습» 뿐이라 아무 일도 일어나지 않은 것처럼 보인다.
   *
   *   그래서 어느 실험을 방금 눌렀는지 기억해 두고, 다시 그린 뒤 그 하나만
   *   «애니메이션으로» 재생한다. 나머지는 즉시로 채운다.
   */
  var justRanExperiment = "";

  /**
   * 5단계 — 실행·탐구 (명세 17.5)
   *
   * 세 실험을 «순서대로» 한다. 실험마다
   *   ① 실행 «전» 에 예상을 적고  ② 실행하고  ③ 관찰과 «예상과 다른 점» 을 적는다
   *
   * ★ 예상을 적기 전에는 [실행] 이 열리지 않는다.
   *   먼저 돌려 보고 나서 «예상» 을 적으면 그것은 예상이 아니라 베끼기다.
   *
   * 통과 조건은 «두 실험 이상 실행 + 관찰 기록» 이다(명세 17.5).
   */
  function renderExperiment(state, app) {
    var box = el("div");
    var minChars = PC.LIMITS.observationMin;

    /** 실험 하나의 기록 (없으면 빈 칸으로) */
    function runOf(id) {
      return state.experiment.runs[id] || { predict: "", ran: false, observation: "", surprise: "" };
    }

    /** 그 실험의 코드 — 학생이 만든 코드의 delay 값만 바꾼다 */
    function sourceFor(item) {
      var base = String(state.code.source || A.REFERENCE_CODE);
      var seen = 0;
      /* 첫 delay 는 «켜진 뒤», 두 번째는 «꺼진 뒤» 다. 차례대로 갈아 끼운다. */
      var next = base.replace(/delay\s*\(\s*\d+\s*\)/g, function () {
        seen += 1;
        return "delay(" + (seen === 1 ? item.onMs : item.offMs) + ")";
      });
      /* delay 가 하나뿐인 코드라면 그대로 둔다 — 학생 코드를 함부로 고치지 않는다 */
      return seen >= 2 ? next : base;
    }

    /** 그 실험을 «끝냈는가» — 실행 + 세 칸을 모두 채웠는가 */
    function isDone(item) {
      var r = runOf(item.id);
      return (
        r.ran === true &&
        PC.schema.contentLength(r.predict) >= 4 &&
        PC.schema.contentLength(r.observation) >= minChars &&
        PC.schema.contentLength(r.surprise) >= 2
      );
    }

    var doneCount = L.EXPERIMENTS.filter(isDone).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "5단계 · 실행과 탐구",
          title: "켜짐·꺼짐 시간을 바꾸면 어떻게 보일까?",
          desc:
            "세 가지 조건을 차례로 실험합니다. 실행하기 «전» 에 예상을 적고, 실행한 뒤 관찰을 적으세요. " +
            "★ 세 실험을 모두 실행하고 «빈칸을 다 채워야» 다음 단계가 열립니다. (지금 " +
            doneCount +
            " / " +
            L.EXPERIMENTS.length +
            ")"
        },
        [
          el("p", {
            class: "para",
            text:
              "쓰는 코드는 4단계에서 만든 여러분의 코드입니다. 두 delay 값만 실험 조건으로 바꿔 넣습니다."
          })
        ]
      )
    );

    /* ------------------------------------------------------------------ */
    /* 실험 A · B · C                                                      */
    /* ------------------------------------------------------------------ */

    L.EXPERIMENTS.forEach(function (item, index) {
      var rec = runOf(item.id);
      var runner = makeRunner({ loopLimit: 6 });
      var afterHost = el("div");

      /* 앞 실험을 아직 실행하지 않았으면 이 실험은 잠근다 — 순서대로 하기 위해서다 */
      var prev = index === 0 ? null : L.EXPERIMENTS[index - 1];
      var locked = prev ? !runOf(prev.id).ran : false;

      var body = [];

      if (locked) {
        body.push(UI.alert("info", "먼저 " + prev.label + " 을(를) 실행해 주세요. 실험은 차례대로 합니다."));
        box.appendChild(
          UI.card(
            {
              eyebrow: item.label,
              title: "켜짐 " + item.onMs + "ms · 꺼짐 " + item.offMs + "ms",
              desc: item.ask
            },
            body
          )
        );
        return;
      }

      /* ① 예상 — 실행 전에 적는다 */
      var predictField = UI.field(
        {
          label: "① 실행하기 전 예상 : " + item.ask,
          min: 4,
          multiline: true,
          rows: 2,
          placeholder: "예) 켜진 시간이 짧아서 …"
        },
        rec.predict,
        function (value) {
          app.patch(function (s) {
            if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
            s.experiment.runs[item.id].predict = value;
          });
          /* 예상을 적으면 [실행] 이 열려야 하므로 그 단추만 다시 판단한다.
             왜 잠겼는지 알려 주던 설명도 함께 지운다 — 열린 단추에 남아 있으면 헷갈린다. */
          var tooShort = PC.schema.contentLength(value) < 4;
          runBtn.disabled = tooShort;
          runBtn.title = tooShort ? "먼저 예상을 적어 주세요." : "";
        }
      );
      body.push(predictField.root);

      /* ② 실행 */
      var runBtn = UI.button(rec.ran ? "다시 실행" : "실행하기", {
        disabled: PC.schema.contentLength(rec.predict) < 4,
        title: PC.schema.contentLength(rec.predict) < 4 ? "먼저 예상을 적어 주세요." : "",
        click: function () {
          /* 결과 값만 먼저 재어 둔다 — 그림은 다시 그린 뒤에 «애니메이션으로» 재생한다 */
          var result = A.run(sourceFor(item), { loopLimit: 6, ledPin: PC.LED_PIN });

          app.patch(function (s) {
            if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
            s.experiment.runs[item.id].ran = true;
            s.experiment.runs[item.id].blinks = result.led.blinks;
            s.experiment.runs[item.id].elapsed = result.elapsed;
          });

          /* 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
             ★ 다시 그린 뒤 이 실험 하나만 애니메이션으로 재생한다. */
          justRanExperiment = item.id;
          app.update(function () {});
        }
      });

      body.push(
        el("div", { class: "btnrow" }, [
          runBtn,
          el("p", {
            class: "btnrow__note",
            text: "코드의 delay 값을 " + item.onMs + " / " + item.offMs + " 로 바꾸어 실행합니다."
          })
        ])
      );
      body.push(runner.viewHost);
      body.push(runner.panelHost);
      body.push(afterHost);

      /* ③ 관찰과 «예상과 다른 점» — 실행한 뒤에만 연다 */
      if (rec.ran) {
        body.push(
          UI.field(
            {
              label: "② 실행한 뒤 관찰 (" + minChars + "자 이상)",
              min: minChars,
              multiline: true,
              rows: 3,
              placeholder: "예) 불이 짧게 반짝하고 한참 꺼져 있었다."
            },
            rec.observation,
            function (value) {
              app.patch(function (s) {
                if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
                s.experiment.runs[item.id].observation = value;
              });
              /* 통과 조건이 바뀌므로 아래 [다음] 단추를 다시 판단한다 */
              app.rerenderNav();
            }
          ).root
        );

        body.push(
          UI.field(
            {
              label: "③ 예상과 다른 점 (없으면 «예상과 같았다» 라고 적으세요)",
              min: 2,
              multiline: true,
              rows: 2,
              placeholder: "예) 생각보다 훨씬 빨라 보였다."
            },
            rec.surprise,
            function (value) {
              app.patch(function (s) {
                if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
                s.experiment.runs[item.id].surprise = value;
              });
              /* 이 칸도 통과 조건이므로 [다음] 단추를 다시 판단한다 */
              app.rerenderNav();
            }
          ).root
        );
      }

      box.appendChild(
        UI.card(
          {
            eyebrow: item.label + (isDone(item) ? " · 끝남" : rec.ran ? " · 실행함 (빈칸을 채우세요)" : ""),
            title: "켜짐 " + item.onMs + "ms · 꺼짐 " + item.offMs + "ms",
            desc: item.note
          },
          body
        )
      );

      /**
       * 이미 실행한 실험은 결과를 채워 둔다 — 다시 그려도 빈 칸이 되지 않게.
       * 방금 [실행] 을 누른 하나만 «애니메이션» 으로 재생하고 나머지는 즉시로 둔다.
       */
      if (rec.ran) {
        var animate = justRanExperiment === item.id;
        if (animate) justRanExperiment = "";
        runner.run(sourceFor(item), { instant: !animate });
        if (animate) {
          UI.clear(afterHost);
          afterHost.appendChild(
            UI.alert("info", "실행 중입니다. LED 가 깜빡이는 것을 보고 아래에 관찰을 적어 주세요.")
          );
        }
      }
    });

    /* ------------------------------------------------------------------ */
    /* 세 실험 견주어 보기                                                  */
    /* ------------------------------------------------------------------ */

    var ranAny = L.EXPERIMENTS.filter(function (item) {
      return runOf(item.id).ran;
    });

    if (ranAny.length >= 2) {
      box.appendChild(
        UI.card({ title: "세 조건을 나란히 놓고 보기", desc: "같은 코드인데 두 숫자만 달라졌습니다." }, [
          el("table", { class: "exptable" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { attrs: { scope: "col" }, text: "실험" }),
                el("th", { attrs: { scope: "col" }, text: "켜짐" }),
                el("th", { attrs: { scope: "col" }, text: "꺼짐" }),
                el("th", { attrs: { scope: "col" }, text: "한 주기" }),
                el("th", { attrs: { scope: "col" }, text: "내가 적은 관찰" })
              ])
            ]),
            el(
              "tbody",
              {},
              L.EXPERIMENTS.map(function (item) {
                var r = runOf(item.id);
                return el("tr", { class: r.ran ? "" : "is-empty" }, [
                  el("th", { attrs: { scope: "row" }, text: item.label }),
                  el("td", { text: item.onMs + "ms" }),
                  el("td", { text: item.offMs + "ms" }),
                  el("td", { text: item.onMs + item.offMs + "ms" }),
                  el("td", { text: r.ran ? r.observation || "(아직 적지 않음)" : "(아직 실행하지 않음)" })
                ]);
              })
            )
          ])
        ])
      );
    }

    /* ------------------------------------------------------------------ */
    /* 확장 활동 — 짧게 두 번 깜빡인 뒤 2초 쉬기 (명세 17.5)                 */
    /*                                                                    */
    /* 통과 조건이 아니다. 빨리 끝낸 학생을 위한 자리이므로 «접어» 둔다.       */
    /* ------------------------------------------------------------------ */

    var X = L.EXTENSION;
    box.appendChild(
      UI.foldout(X.title + " (해 보고 싶은 사람만)", function () {
        var extRunner = makeRunner({ loopLimit: 3 });
        var starter =
          state.experiment.extensionSource ||
          "const int ledPin = " + PC.LED_PIN + ";\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() {\n  \n}";
        var extEditor = ED.editor(starter, function (value) {
          app.patch(function (s) {
            s.experiment.extensionSource = value;
          });
        });

        return el("div", {}, [
          el("p", { class: "para", text: X.intro }),
          el("p", { class: "para", text: X.goal }),
          el("ol", { class: "orderlist" }, X.steps.map(function (line) {
            return el("li", { text: line });
          })),
          UI.alert("info", X.hint),
          extEditor.root,
          el("div", { class: "btnrow" }, [
            UI.button("확장 코드 실행", {
              class: "btn btn--ghost",
              click: function () {
                extRunner.run(extEditor.getValue(), {});
                app.patch(function (s) {
                  s.experiment.extensionTried = true;
                  s.experiment.extensionSource = extEditor.getValue();
                });
              }
            }),
            el("p", { class: "btnrow__note", text: X.check })
          ]),
          extRunner.viewHost,
          extRunner.panelHost
        ]);
      })
    );

    return box;
  }

  /* ================================================================== */
  /* 6단계 — 형성평가·제출                                                */
  /*                                                                    */
  /* 짜임새를 lesson3_7_1 의 6단계와 «같게» 맞추었다.                      */
  /*   ① 형성평가            — 응시자 정보 → 문항 하나씩 → 채점·제출        */
  /*   ② 채점·제출 진행 상황  — 오른쪽 검은 창에 한 줄씩 기록               */
  /*   ③ 학습 정리            — 요약 · 핵심 문법 카드 · 내가 쓴 것 되돌아보기 */
  /*                                                                    */
  /* 문항을 «한 번에 하나» 만 보여 준다. 다섯 개를 한꺼번에 늘어놓으면        */
  /* 화면이 길어져 어디를 보아야 할지 알기 어렵다.                          */
  /* ================================================================== */

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** ①②③ 이 붙은 구역 제목 */
  function sectionTitle(tag, text) {
    return el("h3", { class: "section-title" }, [
      el("span", { class: "section-title__tag", attrs: { "aria-hidden": "true" }, text: tag }),
      el("span", { text: text })
    ]);
  }

  /** 제목이 붙은 판 하나 */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body stack" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: "panel" }, [head, body]);
    return { root: root, body: body };
  }

  /** 왼쪽·오른쪽 두 쪽 — 900px 아래에서는 위아래로 쌓인다 */
  function split(className) {
    var left = el("div", { class: "stack" });
    var right = el("div", { class: "stack" });
    return {
      root: el("div", { class: "split" + (className ? " " + className : "") }, [left, right]),
      left: left,
      right: right
    };
  }

  /** 작은 알림표 */
  function badge(kind, text) {
    var map = { true: "badge--true", false: "badge--false", primary: "badge--primary" };
    return el("span", { class: ("badge " + (map[kind] || "")).trim(), text: text });
  }

  /** 진행 상황을 한 줄씩 쌓는 검은 창 */
  function makeConsole(spec) {
    var s = spec || {};
    var body = el("div", {
      class: "console__body",
      attrs: { role: "log", "aria-live": "polite", "aria-label": s.ariaLabel || "채점·제출 진행 상황", tabindex: "0" }
    });
    var root = el("div", { class: "console" }, [
      el("div", { class: "console__head" }, [
        el("span", { class: "console__dot", attrs: { "aria-hidden": "true" } }),
        el("span", { text: s.title || "진행 기록" })
      ]),
      body
    ]);

    function showEmpty() {
      UI.clear(body).appendChild(el("p", { class: "console__empty", text: s.emptyText || "여기에 기록이 쌓입니다." }));
    }

    function line(text, modifier) {
      if (body.querySelector(".console__empty")) UI.clear(body);
      body.appendChild(
        el("div", { class: ("console__line " + (modifier || "")).trim() }, [
          el("span", { class: "console__prompt", attrs: { "aria-hidden": "true" }, text: ">" }),
          el("span", { class: "console__text", text: text })
        ])
      );
      body.scrollTop = body.scrollHeight;
    }

    showEmpty();

    return {
      root: root,
      write: function (t) { line(t); },
      ok: function (t) { line(t, "console__line--ok"); },
      hint: function (t) { line(t, "console__line--hint"); },
      error: function (t) { line(t, "console__line--error"); },
      muted: function (t) { line(t, "console__line--muted"); }
    };
  }

  function renderAssess(state, app) {
    var box = el("div");
    var Q = PC.quiz;
    var answers = state.assessment.answers;
    var total = Q.QUESTIONS.length;

    /* 답안을 냈는가 — 냈으면 답을 고칠 수 없고, 그때 비로소 채점이 열린다 */
    var sealed = state.assessment.sealed === true;

    /** 이 문항에 답을 했는가 */
    function isAnswered(q) {
      var v = answers[q.id];
      if (q.type === "choice") return typeof v === "number" && v >= 0;
      return String(v === undefined || v === null ? "" : v).trim().length > 0;
    }

    /* ---------------- ② 진행 상황 창 (오른쪽) ---------------- */

    var cons = makeConsole({
      title: "채점·제출 기록",
      emptyText: "학번과 이름을 넣고 문항에 답하면 여기에 기록이 쌓입니다."
    });

    /* ---------------- 응시자 정보 ---------------- */

    var idInput = el("input", {
      class: "student-field__input",
      id: "assess-sid",
      attrs: { type: "text", inputmode: "numeric", maxlength: "5", placeholder: "예) 10312", autocomplete: "off" }
    });
    idInput.value = state.student.studentId || "";

    var nameInput = el("input", {
      class: "student-field__input",
      id: "assess-name",
      attrs: { type: "text", maxlength: "20", placeholder: "예) 홍길동", autocomplete: "off" }
    });
    nameInput.value = state.student.name || "";

    var studentNote = el("p", { class: "student-card__note", attrs: { role: "status" } });

    var studentCard = el("div", { class: "student-card" }, [
      el("div", { class: "student-card__head" }, [
        el("h4", { class: "student-card__title", text: "응시자 정보" }),
        el("span", { class: "student-card__badge", text: "제출 전 필수" })
      ]),
      el("div", { class: "student-card__fields" }, [
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-sid" }, text: "학번 (5자리)" }),
          idInput
        ]),
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-name" }, text: "이름" }),
          nameInput
        ])
      ]),
      studentNote,
      el("p", { class: "student-card__privacy", text: "1학년 3반 12번이면 10312 입니다. 학번과 이름은 제출한 답을 알아보는 데에만 씁니다." })
    ]);

    var gate = el("div", { class: "quiz-gate" }, [
      el("span", { class: "quiz-gate__icon", attrs: { "aria-hidden": "true" }, text: "🔒" }),
      el("span", { text: "학번과 이름을 넣으면 문항이 열립니다." })
    ]);

    /* ---------------- 화면이 들어갈 자리 ---------------- */

    var quizBody = el("div", { class: "quiz__body" });
    /* 단추 넷을 «한 줄» 에 놓는다.
       이동 단추의 글자를 「← 이전」·「다음 →」 로 줄여 자리를 만들었다.
       바로 위에 「문항 N / 5」 가 있어 무엇을 옮기는 것인지 알 수 있다.
       (이 이름은 교사용 아래쪽 이동 단추와도 같다) */
    var actionRow = el("div", { class: "btnrow btnrow--one" });
    var actionNote = el("p", { class: "quiz__note" });
    var messageHost = el("div");

    /* 지금 보고 있는 문항 — 아직 답하지 않은 첫 문항에서 시작한다 */
    var current = 0;
    for (var qi = 0; qi < total; qi++) {
      if (!isAnswered(Q.QUESTIONS[qi])) {
        current = qi;
        break;
      }
    }

    function ready() {
      return PC.schema.validateStudent(state.student).ok;
    }

    /* ---------------- 단추들 ---------------- */

    var prevBtn = UI.button("← 이전", {
      class: "btn btn--ghost",
      click: function () {
        if (current > 0) {
          current -= 1;
          drawQuestion();
        }
      }
    });

    var nextBtn = UI.button("다음 →", {
      class: "btn btn--ghost",
      click: function () {
        if (current < total - 1) {
          current += 1;
          drawQuestion();
        }
      }
    });

    /**
     * ★ 채점은 «답안을 낸 뒤에만» 열린다.
     *
     * 정답과 해설을 먼저 본 뒤에 답을 고쳐 내면 형성평가가 아무 뜻이 없어진다.
     * 그래서 답안을 잠근(`assessment.sealed`) 다음에 비로소 이 단추가 열린다.
     * 잠기는 길은 두 가지 — 서버로 제출하거나, JSON 파일로 받아 내는 것.
     */
    var gradeBtn = UI.button("채점하기", {
      click: function () {
        if (state.assessment.sealed !== true) return; /* 두 겹으로 막는다 */
        app.update(function (s) {
          s.assessment.graded = true;
          s.assessment.attempts += 1;
        });
      }
    });

    /* 답안을 낸 뒤에는 «고치기» 가 아니라 «다시 보기» 다 */
    var retryBtn = UI.button(sealed ? "내 답 다시 보기" : "답 고치기", {
      class: "btn btn--ghost",
      click: function () {
        app.update(function (s) {
          s.assessment.graded = false;
        });
      }
    });

    /* 제출 주소 칸 — 설정에 주소가 없을 때만 (명세 10장) */
    var endpointField = null;
    if (PC.config.needsUrlInput()) {
      endpointField = UI.field(
        {
          label: "제출 주소",
          help: "선생님이 알려 주신 주소를 붙여 넣으세요. 한 번 넣으면 이 기기에 기억됩니다.",
          placeholder: "https://script.google.com/.../exec"
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
    }

    /* -------------- 제출 — «한 번만» 이므로 한 번 더 물어본다 -------------- */

    var busy = false;

    /* 제출 전에 눈에 띄게 알린다. 잠긴 뒤에는 감춘다. */
    var onceNote = UI.alert("warn", "답안은 «한 번만» 제출할 수 있습니다.", [
      el("p", {
        class: "alert__fix",
        text:
          "제출한 뒤에는 답을 고칠 수 없습니다. 다섯 문항을 모두 다시 살펴본 뒤에 누르세요. " +
          "제출하면 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다."
      })
    ]);

    /* 되묻는 상자가 놓이는 자리 — 단추 바로 아래에 나타난다 */
    var confirmHost = el("div");

    function closeConfirm() {
      UI.clear(confirmHost);
      refreshActions();
    }

    /**
     * 되돌릴 수 없는 일을 하기 전에 한 번 더 묻는다.
     * 브라우저 confirm() 을 쓰지 않는다 — 화면 읽기 도구와 잘 맞지 않고 모양도 다르다.
     */
    function askConfirm(spec) {
      UI.clear(confirmHost);
      submitBtn.disabled = true;
      downloadBtn.disabled = true;

      var okBtn = UI.button(spec.okLabel, {
        click: function () {
          UI.clear(confirmHost);
          spec.onOk();
        }
      });

      confirmHost.appendChild(
        UI.alert("warn", spec.message, [
          el("p", { class: "alert__fix", text: spec.detail }),
          el("div", { class: "btnrow" }, [
            okBtn,
            UI.button("아니요, 더 확인하겠습니다", { class: "btn btn--ghost", click: closeConfirm })
          ])
        ])
      );
      okBtn.focus();
    }

    /** 낼 수 있는 상태인가 — 서버 제출과 파일 제출이 같은 조건을 쓴다 */
    function guard() {
      var check = PC.schema.validateStudent(state.student);
      if (!check.ok) {
        refreshGate();
        cons.error("학번과 이름을 먼저 바르게 넣어 주세요.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "학번과 이름을 먼저 바르게 넣어 주세요."));
        return false;
      }
      if (!Q.gradeAll(state.assessment.answers).allAnswered) {
        cons.error("답하지 않은 문항이 있습니다.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "다섯 문항에 모두 답해야 제출할 수 있습니다."));
        return false;
      }
      return true;
    }

    function doSend() {
      busy = true;
      UI.clear(messageHost);
      refreshActions();
      submitBtn.textContent = "제출 중…";

      var payload = PC.schema.buildPayload(state);
      S.store.saveStudent(state.student);
      cons.write("제출을 시작합니다 — " + S.api.fileNameFor(payload));

      S.api.submit(payload, endpointField ? endpointField.input.value : "").then(function (result) {
        busy = false;

        if (result.ok) {
          cons.ok(
            (result.updated ? "이전 제출을 덮어썼습니다 — " : "저장을 마쳤습니다 — ") +
              (result.fileName || S.api.fileNameFor(payload))
          );
          cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
          app.update(function (s) {
            s.submissionId = result.submissionId || "";
            s.submitted = {
              at: result.serverUpdatedAt || new Date().toISOString(),
              demo: result.demo === true,
              via: "server"
            };
            /* ★ 여기서 답안이 잠긴다 */
            s.assessment.sealed = true;
          });
          UI.toast("제출했습니다. 이제 채점할 수 있습니다.");
          return;
        }

        /* 실패했을 때는 «잠그지 않는다». 고쳐서 다시 낼 수 있어야 한다.
           답안도 버리지 않는다 — 임시 저장에 남기고 «파일로 내는 길» 을 그 자리에서 준다.
           단추를 늘 내보이지 않는 까닭 : 평소에는 서버로 내는 길 하나만 보이는 것이 헷갈리지 않다. */
        S.store.queuePending(payload);
        cons.error("제출 실패 — " + result.message);
        cons.hint("[파일로 내기] 로 파일을 받아 선생님께 내도 됩니다.");
        UI.clear(messageHost).appendChild(
          UI.alert("warn", result.message, [
            el("p", {
              class: "alert__fix",
              text: "아래 [파일로 내기] 로 파일을 받아 선생님께 내도 됩니다. 아직 제출되지 않았으니 답은 그대로 남아 있습니다."
            }),
            el("div", { class: "btnrow" }, [downloadBtn])
          ])
        );
        refreshActions();
      });
    }

    function doDownload() {
      var payload = PC.schema.buildPayload(state);
      if (!S.api.download(payload)) {
        cons.error("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        UI.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        refreshActions();
        return;
      }

      cons.write("파일로 냈습니다 — " + S.api.fileNameFor(payload));
      UI.toast("파일을 내려받았습니다. 선생님께 내 주세요.");

      if (state.assessment.sealed !== true) {
        cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
        S.store.saveStudent(state.student);
        app.update(function (s) {
          /* ★ 파일로 내는 것도 제출이다. 여기서도 답안이 잠긴다. */
          s.assessment.sealed = true;
        });
        return;
      }
      refreshActions();
    }

    var submitBtn = UI.button("답안 제출하기", {
      click: function () {
        if (busy) return;

        if (state.submitted) {
          UI.clear(messageHost).appendChild(
            UI.alert("info", "이미 제출을 마쳤습니다. 답안은 한 번만 제출할 수 있습니다.")
          );
          return;
        }
        if (!guard()) return;

        askConfirm({
          message: "정말 제출할까요? 답안은 한 번만 제출할 수 있습니다.",
          detail: "제출한 뒤에는 답을 고칠 수 없습니다. 대신 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다.",
          okLabel: "예, 제출합니다",
          onOk: doSend
        });
      }
    });

    /**
     * 파일로 내는 길 (명세 10장).
     *
     * ★ 단추 줄에는 놓지 않는다. 서버 제출이 실패했을 때 그 알림 상자 안에 나타난다.
     *   평소에는 «답안 제출하기» 하나만 보이는 것이 학생에게 헷갈리지 않고,
     *   주소가 없는 학생도 제출을 눌러 보면 이 길을 만나므로 막다른 길이 되지 않는다.
     *
     * 누르는 자리를 44px 로 지키려고 btn--small 을 쓰지 않는다 (명세 접근성).
     */
    var downloadBtn = UI.button("파일로 내기", {
      class: "btn btn--ghost",
      click: function () {
        if (busy) return;
        if (!guard()) return;

        /* 이미 잠긴 뒤라면 그냥 한 번 더 받는 것이므로 되묻지 않는다 */
        if (state.assessment.sealed === true) {
          doDownload();
          return;
        }

        askConfirm({
          message: "이 파일이 곧 제출물입니다. 내려받으면 답을 고칠 수 없습니다.",
          detail: "받은 파일을 선생님께 내야 합니다. 내려받으면 [채점하기] 가 열립니다.",
          okLabel: "예, 내려받습니다",
          onOk: doDownload
        });
      }
    });

    /* ---------------- 잠금·단추 상태 새로 고치기 ---------------- */

    function refreshGate() {
      var check = PC.schema.validateStudent(state.student);
      var ok = check.ok;

      studentCard.className = "student-card" + (ok ? " is-ready" : "");
      idInput.className = "student-field__input" + (state.student.studentId && check.errors.studentId ? " is-invalid" : "");
      nameInput.className = "student-field__input" + (state.student.name && check.errors.name ? " is-invalid" : "");

      studentNote.className = "student-card__note" + (ok ? " is-ok" : "");
      studentNote.textContent = ok
        ? "확인되었습니다 — " + state.student.studentId + " " + state.student.name
        : check.errors.studentId || check.errors.name || "학번과 이름을 넣어 주세요.";

      gate.hidden = ok;
      quizBody.className = "quiz__body" + (ok ? "" : " is-gated");

      refreshActions();
    }

    function refreshActions() {
      var now = Q.gradeAll(state.assessment.answers);
      var ok = ready();
      var locked = state.assessment.sealed === true; /* 답안을 냈다 */
      var sentToServer = !!state.submitted;
      var canHandIn = ok && now.allAnswered;

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;

      /* ★ 채점은 답안을 낸 뒤에만 열린다 */
      gradeBtn.disabled = !locked;
      gradeBtn.title = locked ? "" : "답안을 제출한 뒤에 채점 결과를 볼 수 있습니다.";

      submitBtn.disabled = busy || sentToServer || !canHandIn;
      submitBtn.title = sentToServer
        ? "답안은 한 번만 제출할 수 있습니다."
        : canHandIn
          ? ""
          : "학번·이름을 넣고 다섯 문항에 모두 답해야 제출할 수 있습니다.";
      if (!busy) submitBtn.textContent = sentToServer ? "제출 완료" : "답안 제출하기";

      downloadBtn.disabled = busy || !canHandIn;
      downloadBtn.title = canHandIn ? "" : "학번·이름을 넣고 다섯 문항에 모두 답해야 파일로 낼 수 있습니다.";

      /* 제출 전 경고는 아직 내지 않았을 때만 */
      onceNote.hidden = locked;

      var lines = [];
      if (!ok) lines.push("학번과 이름을 넣어야 제출할 수 있습니다.");
      if (!now.allAnswered) {
        lines.push("답한 문항 " + now.answeredCount + " / " + total + " — 모두 답하면 [답안 제출하기] 가 열립니다.");
      }
      if (locked) {
        lines.push("답안을 냈으므로 답을 고칠 수 없습니다. [채점하기] 로 점수와 해설을 볼 수 있습니다.");
      } else if (canHandIn) {
        lines.push("다섯 문항에 모두 답했습니다. 제출은 «한 번만» 할 수 있고, 제출한 뒤에 [채점하기] 가 열립니다.");
      }
      actionNote.textContent = lines.join(" ");
    }

    /* ---------------- 문항 하나 그리기 ---------------- */

    function pick(q, index) {
      if (state.assessment.sealed === true) return; /* 낸 뒤에는 고칠 수 없다 */
      app.patch(function (s) {
        s.assessment.answers[q.id] = index;
      });
      cons.write(q.no + "번 — " + (CIRCLED[index] || index + 1) + " 선택");
      app.rerenderNav();
      drawQuestion();
    }

    function drawQuestion() {
      UI.clear(quizBody);
      var q = Q.QUESTIONS[current];

      /* 문항 번호와 진행 점 */
      var dots = el("div", { class: "quiz__dots" });
      Q.QUESTIONS.forEach(function (item, i) {
        var done = isAnswered(item);
        dots.appendChild(
          el("button", {
            class: "quiz__dot" + (done ? " is-answered" : "") + (i === current ? " is-current" : ""),
            attrs: {
              type: "button",
              "aria-label": item.no + "번 문항으로 이동" + (done ? " (답함)" : " (아직 답하지 않음)"),
              "aria-current": i === current ? "true" : null
            },
            on: {
              click: function () {
                current = i;
                drawQuestion();
              }
            }
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "quiz__meta" }, [
          el("span", { class: "quiz__counter", text: "문항 " + (current + 1) + " / " + total }),
          dots
        ])
      );

      /* 무엇을 묻는 문항인지 알려 주는 딱지.
         5번은 tag 가 이미 «완성형» 이라 형식 딱지와 겹친다 — 겹치면 하나만 붙인다. */
      var kind = q.type === "choice" ? "객관식" : "완성형";
      quizBody.appendChild(
        el("div", { class: "quiz__tags" }, [
          badge("primary", q.tag),
          kind === q.tag ? null : badge("", kind),
          badge("", q.points + "점")
        ].filter(Boolean))
      );

      quizBody.appendChild(
        el("p", { class: "quiz__question" }, [
          el("span", { class: "quiz__no", text: q.no + "." }),
          el("span", { text: q.stem })
        ])
      );

      if (q.code) quizBody.appendChild(ED.codeView(q.code, {}).root);

      /* 답안을 낸 뒤에는 «읽기만» 된다. 정답을 본 뒤 고쳐 내는 일을 막는다. */
      var locked = state.assessment.sealed === true;

      if (q.type === "choice") {
        var options = el("div", { class: "options" });
        q.choices.forEach(function (choice, i) {
          var picked = answers[q.id] === i;
          var radio = el("input", { attrs: { type: "radio", name: "quiz-" + q.id, value: String(i) } });
          radio.checked = picked;
          radio.disabled = locked;
          radio.addEventListener("change", function () {
            pick(q, i);
          });
          options.appendChild(
            el("label", { class: "option" + (picked ? " is-selected" : "") + (locked ? " option--locked" : "") }, [
              radio,
              el("span", { class: "option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
              el("span", { class: "option__text", text: choice })
            ])
          );
        });
        quizBody.appendChild(options);
      } else {
        quizBody.appendChild(UI.codeBlock(q.template, "빈칸 두 줄을 채우세요."));

        var lint = el("div", { class: "lint" });
        function drawLint(value) {
          UI.clear(lint);
          Q.lintCodeAnswer(value).forEach(function (note) {
            lint.appendChild(UI.alert(note.level === "warn" ? "warn" : "info", note.message));
          });
        }

        var codeField = UI.field(
          { label: "빠진 두 줄", help: q.help, multiline: true, rows: 3, mono: true, placeholder: q.placeholder },
          answers[q.id] || "",
          function (value) {
            app.patch(function (s) {
              s.assessment.answers[q.id] = value;
            });
            drawLint(value);
            app.rerenderNav();
            refreshActions();
            /* 점을 채우려면 다시 그려야 하지만, 글을 쓰는 중에 다시 그리면
               글자를 넣던 자리를 잃는다. 점만 손으로 고친다. */
            var marks = quizBody.querySelectorAll(".quiz__dot");
            if (marks[current]) {
              marks[current].className =
                "quiz__dot is-current" + (String(value || "").trim() ? " is-answered" : "");
            }
          }
        );
        codeField.input.readOnly = locked;
        quizBody.appendChild(codeField.root);
        quizBody.appendChild(lint);
        drawLint(answers[q.id] || "");
      }

      quizBody.appendChild(
        el("p", {
          class: "quiz__note",
          text: locked
            ? "답안을 냈으므로 고칠 수 없습니다. 점을 눌러 내가 낸 답을 확인할 수 있어요."
            : q.type === "choice"
              ? "고른 답은 곧바로 저장됩니다. 점을 눌러 다른 문항으로 건너갈 수 있어요."
              : "세미콜론(;) 과 대소문자까지 그대로 지켜야 맞습니다."
        })
      );

      refreshActions();
    }

    /* ---------------- 채점 결과 그리기 ---------------- */

    function drawResult() {
      UI.clear(quizBody);
      quizBody.className = "quiz__body";

      var revealed = Q.reveal(state.assessment.answers);
      if (!revealed.allowed) {
        quizBody.appendChild(UI.alert("info", revealed.reason));
        return;
      }

      var g = revealed.graded;
      var okCount = 0;
      revealed.items.forEach(function (item) {
        if (item.correct) okCount += 1;
      });

      var marks = el("div", { class: "score-dots" });
      revealed.items.forEach(function (item) {
        marks.appendChild(
          el("span", {
            class: "score-dot" + (item.correct ? " is-correct" : ""),
            attrs: { "aria-label": item.no + "번 " + (item.correct ? "맞음" : "틀림") },
            text: item.correct ? "○" : "✕"
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "score-card" }, [
          el("p", { class: "score-card__title", text: "형성평가 결과" }),
          el("p", { class: "score-card__student" }, [
            el("strong", { text: state.student.studentId || "학번 미입력" }),
            el("span", { text: " " + (state.student.name || "") })
          ]),
          el("p", { class: "score-card__value" }, [
            el("span", { text: String(g.score) }),
            el("small", { text: " / " + g.total + "점" })
          ]),
          marks,
          el("p", { class: "score-card__count", text: "맞힌 문항 " + okCount + " / " + total }),
          el("p", { class: "score-card__level" }, [
            el("span", { text: "판정 : " }),
            el("strong", { text: g.pass ? "이수" : "미이수" }),
            el("span", { text: g.pass ? "" : " (6점 이상 필요)" })
          ]),
          el("p", {
            class: "score-card__comment",
            text: g.pass
              ? "잘했어요. 아래 해설로 한 번 더 확인해 보세요."
              : "괜찮아요. 해설을 읽고 [답 고치기] 로 다시 풀 수 있습니다."
          })
        ])
      );

      quizBody.appendChild(el("h4", { class: "subhead", text: "문항별 해설" }));
      revealed.items.forEach(function (item) {
        quizBody.appendChild(
          el("div", { class: "review" + (item.correct ? " review--ok" : "") }, [
            el("p", { class: "review__head" }, [
              el("span", { class: "review__mark", attrs: { "aria-hidden": "true" }, text: item.correct ? "✔" : "✘" }),
              el("span", { class: "review__no", text: item.no + "번" }),
              el("span", { class: "review__state", text: item.correct ? "맞음" : "틀림" })
            ]),
            el("p", { class: "review__stem", text: item.stem }),
            el("p", { class: "review__answer", text: "정답 : " + item.answerText }),
            el("p", { class: "review__why", text: item.explanation })
          ])
        );
      });
    }

    /* ---------------- ① 형성평가 ---------------- */

    box.appendChild(sectionTitle("①", "형성평가"));

    var top = split("split--wide-left");

    var quizPanel = panel({
      title: "5문항 · 총 10점",
      hint: "6점 이상이면 이수입니다."
    });

    quizPanel.body.appendChild(studentCard);
    quizPanel.body.appendChild(gate);
    quizPanel.body.appendChild(quizBody);
    /* 제출은 한 번뿐이라는 것을 단추 «바로 위» 에서 알린다 */
    quizPanel.body.appendChild(onceNote);
    quizPanel.body.appendChild(actionRow);
    quizPanel.body.appendChild(actionNote);
    quizPanel.body.appendChild(confirmHost);
    if (PC.config.isDemo()) {
      quizPanel.body.appendChild(
        UI.alert("info", "지금은 데모 모드입니다. 제출은 이 기기 안에만 저장되며 선생님께 가지 않습니다.")
      );
    }
    if (endpointField) quizPanel.body.appendChild(endpointField.root);
    if (state.submitted) {
      quizPanel.body.appendChild(
        UI.alert("ok", "제출을 마쳤습니다. (" + S.formatTime(state.submitted.at) + ")", [
          el("p", {
            class: "alert__fix",
            text: "답안은 한 번만 제출할 수 있어 이제 고칠 수 없습니다. 고쳐야 할 일이 있으면 선생님께 말씀드리세요."
          })
        ])
      );
    } else if (sealed) {
      quizPanel.body.appendChild(
        UI.alert("ok", "파일로 냈습니다.", [
          el("p", {
            class: "alert__fix",
            text: "내려받은 " + S.api.fileNameFor(PC.schema.buildPayload(state)) + " 을 선생님께 내 주세요. 답안은 이제 고칠 수 없습니다."
          })
        ])
      );
    }
    quizPanel.body.appendChild(messageHost);
    quizPanel.body.appendChild(el("p", { class: "privacy", text: PC.MESSAGES.privacy }));

    top.left.appendChild(quizPanel.root);

    var consPanel = panel({ title: "② 채점·제출 진행 상황", hint: "무엇이 저장되었는지 여기서 확인합니다." });
    consPanel.body.appendChild(cons.root);
    top.right.appendChild(consPanel.root);

    box.appendChild(top.root);

    /* 어떤 단추를 놓을지 — 채점 전과 채점 뒤가 다르다.
       [채점하기] 와 [답안 제출하기] 를 나란히 둔다. 학생이 다음에 누를 것이 그 둘뿐이다.
       파일로 내는 단추는 여기 두지 않는다 — 제출이 실패했을 때 알림 상자 안에 나타난다. */
    if (state.assessment.graded) {
      actionRow.appendChild(retryBtn);
      actionRow.appendChild(submitBtn);
      drawResult();
    } else {
      actionRow.appendChild(prevBtn);
      actionRow.appendChild(nextBtn);
      actionRow.appendChild(gradeBtn);
      actionRow.appendChild(submitBtn);
      drawQuestion();
    }

    /* 학번·이름 칸 — 고칠 때마다 잠금과 단추를 다시 판단한다 */
    function onInfo() {
      app.patch(function (s) {
        s.student.studentId = idInput.value.trim();
        s.student.name = nameInput.value.trim();
      });
      refreshGate();
      app.rerenderNav();
    }
    idInput.addEventListener("input", onInfo);
    nameInput.addEventListener("input", onInfo);
    refreshGate();

    /* 다시 그린 뒤에도 그동안의 일이 보이도록 상태에서 되살린다 */
    var seeded = Q.gradeAll(state.assessment.answers);
    cons.muted(
      "응시자 : " +
        (ready() ? state.student.studentId + " " + state.student.name : "아직 넣지 않음")
    );
    cons.muted("답한 문항 " + seeded.answeredCount + " / " + total);
    if (state.assessment.graded) {
      var shown = Q.reveal(state.assessment.answers);
      if (shown.allowed) {
        var line = "채점 결과 " + shown.graded.score + " / " + shown.graded.total + "점 — " + (shown.graded.pass ? "이수" : "미이수");
        if (shown.graded.pass) cons.ok(line);
        else cons.hint(line);
      }
    }
    if (state.submitted) {
      /* 제출 직후에 적은 줄은 화면을 다시 그리면서 사라진다.
         그래서 «어디에 무엇으로 저장되었는지» 를 상태에서 다시 만들어 남긴다. */
      cons.ok(
        "제출 완료 — " +
          S.formatTime(state.submitted.at) +
          " · " +
          S.api.fileNameFor(PC.schema.buildPayload(state)) +
          (state.submitted.demo ? " (데모)" : "")
      );
    } else if (sealed) {
      cons.ok("파일로 냈습니다 — " + S.api.fileNameFor(PC.schema.buildPayload(state)));
    }
    if (sealed) cons.muted("답안이 잠겼습니다. 답을 고칠 수 없습니다.");
    else cons.muted("답안은 한 번만 제출할 수 있습니다.");

    /* ---------------- ③ 학습 정리 ---------------- */

    box.appendChild(sectionTitle("③", "학습 정리"));

    var wrap = panel({ title: "오늘 배운 내용 요약", hint: "다음 차시로 이어지는 다섯 줄입니다." });
    wrap.body.appendChild(
      el("div", { class: "summary-list" }, L.WRAP_UP.map(function (text, i) {
        return el("div", { class: "summary-item" }, [
          el("span", { class: "summary-item__num", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
          el("span", { class: "summary-item__text", text: text })
        ]);
      }))
    );
    box.appendChild(wrap.root);

    var syntax = panel({
      title: "핵심 함수 카드",
      hint: "오늘 쓴 세 함수입니다. pinMode 는 역할, digitalWrite 는 상태, delay 는 시간입니다."
    });
    var fnCard = null;
    L.CONCEPT_CARDS.forEach(function (c) {
      if (c.id === "functions") fnCard = c;
    });
    syntax.body.appendChild(
      el("div", { class: "syntaxcards" }, (fnCard ? fnCard.functions : []).map(function (f) {
        return el("div", { class: "syntaxcard" }, [
          /* 머리에는 함수 이름만 둔다(2026-08-19 선생님 요청).
             «언제 쓰는가» 는 2단계 함수 카드의 «언제» 딱지에 그대로 있다. */
          el("div", { class: "syntaxcard__head" }, [
            el("code", { class: "syntaxcard__title", text: f.name })
          ]),
          el("pre", { class: "syntaxcard__code" }, [el("code", { text: f.example })]),
          el("p", { class: "syntaxcard__note", text: f.note })
        ]);
      }))
    );
    box.appendChild(syntax.root);

    /* 내가 쓴 것 되돌아보기 — 4·5단계에서 직접 적은 것을 그대로 보여 준다 */
    var mine = panel({ title: "내가 쓴 정리 되돌아보기", hint: "4·5단계에서 직접 적은 것입니다." });

    var myCode = String(state.code.source || "").trim();
    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 만든 스케치" }));
    mine.body.appendChild(
      el("div", {
        class: "my-answer my-answer--code" + (myCode ? "" : " is-empty"),
        text: myCode || "4단계에서 만든 코드가 여기에 나타납니다."
      })
    );

    mine.body.appendChild(el("h4", { class: "subhead", text: "내가 이은 회로" }));
    var connText = (state.circuit.connections || [])
      .map(function (conn) {
        return (
          C.describe(conn.fromComponent, conn.fromPin) + " → " + C.describe(conn.toComponent, conn.toPin)
        );
      })
      .join("\n");
    mine.body.appendChild(
      el("div", { class: "my-answer" + (connText ? "" : " is-empty") }, [
        el("span", { text: connText || "3단계에서 이은 케이블이 여기에 나타납니다." })
      ])
    );

    /* 실험 기록 — 예상 · 관찰 · 예상과 다른 점을 그대로 되짚는다 */
    var expText = [];
    L.EXPERIMENTS.forEach(function (item) {
      var r = (state.experiment.runs || {})[item.id];
      if (!r || !r.ran) return;
      var line = item.label + " (켜짐 " + item.onMs + "ms · 꺼짐 " + item.offMs + "ms)";
      if (String(r.predict || "").trim()) line += "\n  예상 : " + r.predict;
      if (String(r.observation || "").trim()) line += "\n  관찰 : " + r.observation;
      if (String(r.surprise || "").trim()) line += "\n  다른 점 : " + r.surprise;
      expText.push(line);
    });

    mine.body.appendChild(el("h4", { class: "subhead", text: "켜짐·꺼짐 시간 실험 기록" }));
    mine.body.appendChild(
      el("div", { class: "my-answer" + (expText.length ? "" : " is-empty") }, [
        el("span", {
          text: expText.length ? expText.join("\n\n") : "5단계에서 적은 관찰 기록이 여기에 나타납니다."
        })
      ])
    );

    box.appendChild(mine.root);

    return box;
  }

  S.screens = {
    intro: renderIntro,
    concept: renderConcept,
    circuit: renderCircuit,
    code: renderCode,
    experiment: renderExperiment,
    assess: renderAssess
  };
})();
    </script>
    <script data-from="student/s90-app.js">
/**
 * 학생용 앱 (명세 5장)
 *
 * 하는 일
 *   · 여섯 단계 스테퍼를 그리고 «통과 조건» 에 따라 다음 단계를 연다
 *   · 화면을 다시 그린다
 *   · 바뀔 때마다 localStorage 에 저장한다 (새로고침해도 이어서 할 수 있게)
 *
 * 이전 단계로는 «언제나» 갈 수 있다. 다음 단계는 조건을 채워야 열린다(명세 5장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var el = UI.el;

  var state = S.emptyState();

  var screenRoot = null;
  var navArea = null;
  var bannerArea = null;

  /* ------------------------------------------------------------------ */
  /* 상태 고치기                                                          */
  /* ------------------------------------------------------------------ */

  function save() {
    S.store.saveDraft(state);
  }

  /** 상태를 고치고 저장만 한다 — 글을 쓰는 중에 화면이 튀지 않게 */
  function patch(mutator) {
    mutator(state);
    save();
  }

  /** 상태를 고치고 화면을 다시 그린다 */
  function update(mutator) {
    mutator(state);
    save();
    render();
  }

  function goTo(index) {
    var steps = PC.STEPS;
    var target = Math.max(0, Math.min(steps.length - 1, index));
    if (!PC.schema.canGoTo(target, state)) {
      UI.toast(PC.MESSAGES.lockedStep);
      return;
    }
    update(function (s) {
      s.step = target;
    });
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
    UI.announce(steps[target].label + " 단계로 이동했습니다.");
  }

  var app = {
    update: update,
    patch: patch,
    goTo: goTo,
    rerender: render,
    rerenderNav: function () {
      drawProgress();
      drawNav();
    }
  };

  /* ------------------------------------------------------------------ */
  /* 진행 표시 (명세 5장 스테퍼)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 상단 진행 표시 — 단계 원과 잇는 선, 그리고 진행률 (lesson3_7_1 과 같은 모양).
   *
   * 원 안의 숫자는 «몇 번째 단계» 이고, 마친 단계는 ✔ 로 바뀐다.
   * 색만으로 알리지 않도록 잠김·열림·마침을 낭독기용 글자로도 적는다.
   */
  function drawProgress() {
    var list = UI.$("#stepper-list");
    if (!list) return;

    var steps = PC.STEPS;
    var furthest = PC.schema.furthestStep(state);

    UI.clear(list);
    steps.forEach(function (step, i) {
      var done = i < furthest;
      var current = i === state.step;
      var open = i <= furthest;

      var state1 = done ? "is-done" : "";
      var state2 = current ? "is-current" : "";
      var state3 = open ? "" : "is-locked";

      var node = el("button", {
        class: "stepper__node",
        text: done ? "✔" : String(i + 1),
        attrs: {
          type: "button",
          disabled: open ? null : true,
          "aria-current": current ? "step" : null,
          "aria-label":
            i + 1 + "단계 " + step.label + " — " + (done ? "마침" : current ? "지금 단계" : open ? "열림" : "잠김")
        },
        on: {
          click: function () {
            goTo(i);
          }
        }
      });

      list.appendChild(
        el("li", { class: ["stepper__item", state1, state2, state3].filter(Boolean).join(" ") }, [
          node,
          el("span", { class: "stepper__label", attrs: { "aria-hidden": "true" }, text: step.short })
        ])
      );
    });

    /* 「3 / 6」 과 진행률 막대 */
    var current = UI.$("#progress-current");
    var total = UI.$("#progress-total");
    if (current) current.textContent = String(state.step + 1);
    if (total) total.textContent = String(steps.length);

    var percent = Math.round(((state.step + 1) / steps.length) * 100);
