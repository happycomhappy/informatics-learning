<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="디지털 출력으로 LED 불 켜기 · 제출 현황 분석 (교사용)" />
    <title>제출 현황 분석 | 디지털 출력으로 LED 불 켜기</title>

    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 13장). 다리 길이·평평한 면·글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  --res-body: #d9c39a;
  --res-body-edge: #b79f74;
  --led-off: #b9c3cf;
  --led-on: #ffd24d;
  --led-on-edge: #e0a800;
  --led-glow: rgba(255, 210, 77, 0.45);

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}

.alert__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.alert__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.alert--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}
.alert--info .alert__word {
  color: var(--color-primary-dark);
}

.alert--ok {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}
.alert--ok .alert__word {
  color: var(--color-true-dark);
}

.alert--warn {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}
.alert--warn .alert__word {
  color: var(--color-false-dark);
}

.alert--danger {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}
.alert--danger .alert__word {
  color: var(--color-error);
}

/* 조건 목록 (명세 6.2) */
.condlist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cond {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cond--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cond__mark {
  font-weight: 800;
  color: var(--color-text-sub);
}

.cond--ok .cond__mark {
  color: var(--color-true-dark);
}

.cond__body {
  flex: 1;
}

.cond__label {
  font-weight: 700;
}

.cond__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cond__state {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.cond--ok .cond__state {
  color: var(--color-true-dark);
}

/* ------------------------------ 코드 ------------------------------ */

.codeblock {
  margin: 0;
}

.codeblock__cap,
.codeview__cap {
  font-size: 13px;
  color: var(--color-text-sub);
  margin-bottom: var(--space-1);
}

.codeblock__pre {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--color-console-bg);
  color: var(--color-console-text);
  border-radius: var(--radius);
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  tab-size: 2;
}

.codeview {
  margin: 0;
}

.codeview__lines {
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3) 0;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.8;
}

.codeline {
  display: flex;
  gap: var(--space-3);
  padding: 0 var(--space-4);
  white-space: pre;
  position: relative;
}

.codeline__no {
  color: var(--tok-comment);
  min-width: 2ch;
  text-align: right;
  user-select: none;
}

.codeline__text {
  color: var(--color-console-text);
}

.codeline--active {
  background: rgba(37, 99, 235, 0.28);
}

.codeline--error {
  background: rgba(220, 38, 38, 0.26);
}

.codeline__run {
  position: absolute;
  left: 2px;
  color: var(--tok-number);
  font-weight: 800;
}

.tok-keyword {
  color: var(--tok-keyword);
}
.tok-builtin {
  color: var(--tok-builtin);
}
.tok-string {
  color: var(--tok-string);
}
.tok-number {
  color: var(--tok-number);
}
.tok-const {
  color: var(--tok-const);
}
.tok-comment {
  color: var(--tok-comment);
  font-style: italic;
}
.tok-punct {

/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 10장)
 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 10장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다. */
    autosaveKeyPrefix: "physical2-draft-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 */
    loopLimit: 12,
    stepLimit: 20000,
    playSpeeds: [1, 4, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;
    return /^https?:\/\/.+/i.test(url);
  }

  /** 설정 파일에 미리 적어 둔 주소 (없으면 빈 문자열) */
  function fixedUrl() {
    return looksLikeUrl(APP_CONFIG.apiUrl) ? String(APP_CONFIG.apiUrl).trim() : "";
  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

  /** 학생 화면에 «제출 주소» 칸을 보여야 하는가? */
  function needsUrlInput() {
    return !isDemo() && !fixedUrl();
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.CONFIG = APP_CONFIG;
  PC.config = {
    looksLikeUrl: looksLikeUrl,
    fixedUrl: fixedUrl,
    isDemo: isDemo,
    needsUrlInput: needsUrlInput
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { APP_CONFIG: APP_CONFIG, isDemo: isDemo, fixedUrl: fixedUrl };
  }
})();

     * 글씨를 줄여야 하고, 학생 눈에는 «왜 이 둘만 작지?» 로 보인다.
     * 무리 이름 «DIGITAL (PWM ~)» 이 이미 알려 주므로 이름표는 D10, D11 로 둔다.
     */
    var PWM = { D3: 1, D5: 1, D6: 1, D9: 1, D10: 1, D11: 1 };

    /** 화면에 적는 이름 — GND 세 개는 모두 그냥 «GND» 로 보인다(보드 안에서 이어져 있다) */
    function labelOf(id) {
      return id.indexOf("GND") === 0 ? "GND" : id;
    }

    function push(id, x, y, side) {
      pins.push({
        id: id,
        label: labelOf(id),
        kind: kindOf(id),
        pwm: PWM[id] === 1,
        x: x,
        y: y,
        side: side
      });
    }

    /* 위·아래 핀 줄. 이름표는 핀에서 떨어뜨려 «보드 안» 에 적는다.
       머리띠(header) 바로 옆에 적으면 무리 이름(DIGITAL·POWER)과 겹친다. */
    var y1 = 58;
    topLeft.forEach(function (id, i) {
      push(id, 52 + i * HEADER_PITCH, y1, "top");
    });
    topRight.forEach(function (id, i) {
      push(id, 52 + (topLeft.length + i) * HEADER_PITCH + 16, y1, "top");
    });

    var y2 = 242;
    power.forEach(function (id, i) {
      push(id, 88 + i * HEADER_PITCH, y2, "bottom");
    });
    analog.forEach(function (id, i) {
      push(id, 88 + (power.length + i) * HEADER_PITCH + 34, y2, "bottom");
    });

    return {
      id: "uno",
      name: "아두이노 우노",
      box: { x: 24, y: 24, w: 520, h: 252 },
      usbBox: { x: 12, y: 74, w: 36, h: 48 },
      jackBox: { x: 12, y: 190, w: 34, h: 42 },
      /* 이름표 줄 — 위 핀은 아래쪽에, 아래 핀은 위쪽에 적는다 */
      labelY: { top: 88, bottom: 224 },
      /* 머리띠와 무리 이름 자리 */
      headerTop: { x: 40, y: 44, w: 476, h: 28 },
      headerBottom: { x: 76, y: 228, w: 424, h: 28 },
      groupY: { top: 38, bottom: 268 },
      /* 보드 위의 큰 부품 (설명 그림에서 쓴다) */
      chip: { x: 190, y: 150, w: 200, h: 46 },

    };
  }

  /**
   * 브레드보드 — 전원 레일 2쌍 + 10열 × (A~E / F~J)
   *
   * ★ 우노 «오른쪽» 에 놓는다.
   *   아래에 놓으면 두 부품이 한 화면에 들어오지 않아, 케이블을 이을 때
   *   위아래로 스크롤하며 눌러야 했다. 나란히 두면 두 단자가 함께 보인다.
   */
  function buildBreadboard() {
    var pins = [];
    var COLS = 10;
    var x0 = 612;

    function colX(c) {
      return x0 + (c - 1) * PITCH;
    }

    /* 전원 레일 : 레일마다 구멍 10개. 어디에 꽂아도 같은 마디다. */
    var rails = [
      { id: "TP", label: "+", y: 42, polarity: "plus", where: "위쪽" },
      { id: "TN", label: "−", y: 66, polarity: "minus", where: "위쪽" },
      { id: "BN", label: "−", y: 364, polarity: "minus", where: "아래쪽" },
      { id: "BP", label: "+", y: 388, polarity: "plus", where: "아래쪽" }
    ];

    rails.forEach(function (rail) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: rail.id + "-" + c,
          label: rail.where + " " + rail.label + " 레일",
          short: rail.label + c,
          kind: "rail",
          rail: rail.id,
          polarity: rail.polarity,
          x: colX(c),
          y: rail.y
        });
      }
    });

    /* 가운데 열 : A~E(위) 와 F~J(아래) */
    var upper = ["A", "B", "C", "D", "E"];
    var lower = ["F", "G", "H", "I", "J"];

    upper.forEach(function (r, i) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: r + c,
          label: r + c,
          kind: "tie",
          half: "U",
          col: c,
          x: colX(c),
          y: 100 + i * PITCH
        });
      }
    });

    lower.forEach(function (r, i) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: r + c,
          label: r + c,
          kind: "tie",
          half: "L",
          col: c,
          x: colX(c),
          y: 246 + i * PITCH
        });
      }
    });

    return {
      id: "bb",
      name: "브레드보드",
      box: { x: 580, y: 24, w: 300, h: 380 },
      cols: COLS,
      rails: rails,
      gap: { y: 210, h: 22 },
      /* 열 번호를 적는 줄 */
      colNoY: 92,
      /* 행 문자(A~J)를 적는 x.
         실물 브레드보드처럼 구멍 왼쪽에 적는다. 오른쪽에도 적으면
         설명 그림의 지시선(오른쪽에서 들어온다)과 겹치므로 왼쪽만 쓴다. */
      rowLabelX: 596,
      rowsUpper: upper,
      rowsLower: lower,
      pins: pins
    };
  }

  /**
   * LED — 이 차시의 주인공 (명세 17.3 A)
   *
   * 다리가 둘뿐이지만 «바꾸어 꽂으면 안 되는» 부품이다.
   *   A (anode)   긴 다리, 양극. 전원(+) 쪽으로 간다.
   *   K (cathode) 짧은 다리, 음극. GND 쪽으로 간다. 몸통의 «평평한 면» 쪽이다.
   *
   * 극성을 색으로만 알리지 않는다(명세 13장). 다리 길이·평평한 면·글자를 함께 쓴다.
   */
  function buildLed() {
    return {
      id: "led",
      name: "LED",
      kind: "device",
      /* 몸통 — 위는 둥글고 K 쪽 옆면이 «평평» 하다 */
      body: { cx: 372, cy: 322, r: 26 },
      flatSide: "K",
      box: { x: 296, y: 288, w: 184, h: 118 },
      /**
       * 다리를 «길이가 다르게» 그린다. 색으로만 극성을 알리지 않기 위해서다(명세 13장).
       *   A 는 아래로 길게, K 는 짧게. 몸통의 평평한 면도 K 쪽에 그린다.
       */
      legs: {
        A: { from: { x: 356, y: 344 }, to: { x: 344, y: 386 } },

      pins: [

          id: "A",
          label: "긴 다리 A(+)",
          short: "A",
          kind: "anode",
          x: 344,
          y: 386,
          note: "양극 — 전원 쪽"
        },
        {
          id: "K",
          label: "짧은 다리 K(−)",
          short: "K",
          kind: "cathode",
          x: 400,
          y: 362,
          note: "음극 — GND 쪽"
        }
      ]
    };
  }

  /**
   * 220Ω 저항 (명세 17.3 A)
   *
   * 방향이 없다. 어느 쪽을 D11 에 붙여도 같다.
   * 띠 색은 «시각 자료일 뿐» 이므로 220Ω 글자를 반드시 함께 적는다(명세 17.3 A).
   */
  function buildResistor() {
    return {
      id: "res",
      name: RESISTOR_OHM + "Ω 저항",
      kind: "device",
      ohm: RESISTOR_OHM,
      body: { x: 96, y: 310, w: 88, h: 26 },
      /* 띠 넷 : 빨강·빨강·갈색·금 = 220Ω ±5% */
      bands: [
        { at: 0.18, color: "red", name: "빨강" },
        { at: 0.34, color: "red", name: "빨강" },
        { at: 0.5, color: "brown", name: "갈색" },
        { at: 0.82, color: "gold", name: "금" }
      ],
      box: { x: 24, y: 288, w: 252, h: 118 },
      pins: [
        { id: "P1", label: "저항 왼쪽 끝", short: "①", kind: "lead", x: 56, y: 323 },
        { id: "P2", label: "저항 오른쪽 끝", short: "②", kind: "lead", x: 224, y: 323 }
      ]
    };
  }

  var UNO = buildUno();
  var BB = buildBreadboard();
  var LED = buildLed();
  var RES = buildResistor();

  /** 화면에 그릴 부품 전부. 판정은 이 목록을 훑는다. */
  var COMPONENTS = [UNO, BB, RES, LED];
  var BY_ID = { uno: UNO, bb: BB, led: LED, res: RES };

  /** 케이블이 아니라 «소자» 인 부품 (명세 18.1) */
  var PARTS = [RES, LED];

  /** 부품·단자 이름으로 단자를 찾는다. 없으면 null. */
  function terminal(componentId, pinId) {
    var comp = BY_ID[componentId];
    if (!comp) return null;
    for (var i = 0; i < comp.pins.length; i += 1) {
      if (comp.pins[i].id === pinId) return comp.pins[i];
    }
    return null;
  }

  /** 「우노 5V」 처럼 사람이 읽는 이름 */
  function describe(componentId, pinId) {
    var comp = BY_ID[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return String(componentId) + " " + String(pinId);
    if (comp.id === "uno") return "우노 " + pin.label;
    if (comp.id === "led") return "LED " + pin.label;
    if (comp.id === "res") return comp.name + " " + pin.label.replace("저항 ", "");
    if (pin.kind === "rail") return "브레드보드 " + pin.label + " " + pin.short;
    return "브레드보드 " + pin.label + " 구멍";
  }

  /* ------------------------------------------------------------------ */
  /* 2. 하드웨어가 이미 이어 놓은 «마디»                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 단자 하나가 속한 마디 이름.
   * 케이블을 하나도 꽂지 않아도 부품 안에서 이미 이어져 있는 것들을 나타낸다.
   */
  function nodeOf(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    if (!pin) return null;
    if (componentId === "uno") {
      if (pin.kind === "ground") return "uno:GND";
      return "uno:" + pin.id;
    }
    /* LED 와 저항의 다리는 «저마다 따로인» 마디다.
       부품이 두 마디를 이어 주지 «않는다» — 걸쳐 있을 뿐이다(명세 18.1). */
    if (componentId === "led" || componentId === "res") return componentId + ":" + pin.id;
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;
    return "bb:col:" + pin.col + ":" + pin.half;
  }

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);
    if (node === "led:A") return "LED 긴 다리 A(+)";
    if (node === "led:K") return "LED 짧은 다리 K(−)";
    if (node.indexOf("res:") === 0) return RESISTOR_OHM + "Ω 저항 " + (node === "res:P1" ? "왼쪽" : "오른쪽") + " 끝";

    var railMatch = node.match(/^bb:rail:(\w+)$/);
    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {
        if (r.id === railMatch[1]) found = r;
      });
      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;
    }

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
    if (colMatch) {
      return "브레드보드 " + colMatch[1] + "번 열(" + (colMatch[2] === "U" ? "A~E" : "F~J") + ")";
    }
    return node;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 연결 자료 (명세 6.2 — 좌표가 아니라 연결 그래프로 저장)              */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 색을 골라 준다 — 신호 노랑, 5V 빨강, GND 검정(명세 6.1).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("cathode") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || polarities.indexOf("plus") !== -1) return "red";
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.2 «전원 인가를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 17.3 A)                           */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리, 저항은 두 끝이 모두 맞기 때문이다.

   */
  var FIND_TASKS = [
    {
      id: "f-d11",
      prompt: "LED 를 켜고 끌 신호를 내보낼 디지털 핀 «" + LED_PIN_NAME + "» 을 찾아 누르세요.",
      accept: [{ component: "uno", pin: LED_PIN_NAME }],

    },
    {
      id: "f-gnd",
      prompt: "전류가 돌아올 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",

        { component: "uno", pin: "GND1" },

    },
    {
      id: "f-led-a",
      prompt: "LED 의 «긴 다리(양극 A)» 를 찾아 누르세요. 몸통의 둥근 쪽입니다.",
      accept: [{ component: "led", pin: "A" }],
      why: "긴 다리가 양극(A)이다. 전원(+) 쪽, 곧 " + LED_PIN_NAME + " 쪽으로 간다."
    },
    {
      id: "f-led-k",
      prompt: "LED 의 «짧은 다리(음극 K)» 를 찾아 누르세요. 몸통의 «평평한 면» 쪽입니다.",
      accept: [{ component: "led", pin: "K" }],
      why: "짧은 다리가 음극(K)이다. 몸통 옆면이 평평한 쪽이라 다리를 잘라도 알아볼 수 있다. GND 쪽으로 간다."

      accept: [

        { component: "res", pin: "P1" },

      ],
      distinctFrom: "f-res-1",
      why:
        "저항은 두 끝 사이를 지나는 전류를 줄인다. 띠 색(빨강·빨강·갈색)은 눈으로 보는 표시일 뿐이므로 " +
        "몸통에 적힌 " + RESISTOR_OHM + "Ω 글자로 확인한다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    anode: "LED 양극(긴 다리)",
    cathode: "LED 음극(짧은 다리)",
    lead: "저항의 끝",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.2 · 18.2) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   *   history : { 과제id: 누른 단자 } — «반대쪽 끝» 을 가려내는 데 쓴다
   *
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId, history) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit && task.distinctFrom) {
      var before = (history || {})[task.distinctFrom];
      if (before && before === componentId + "/" + pinId) {
        return {
          ok: false,
          done: false,
          kind: "wrong",
          message: "방금 누른 끝과 «같은» 자리입니다. 저항의 반대쪽 끝을 눌러 주세요."
        };
      }
    }

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — LED 회로 결선과 경로 판정 (명세 17.3 B · 18.1)            */
  /* ------------------------------------------------------------------ */

  /**
   * «소자» 목록 — 케이블과 달리 마디를 합치지 않고 «걸쳐» 있다(명세 18.1).
   * LED 만 방향이 있다. 저항은 어느 쪽으로 지나도 같다.
   */
  var DEVICES = [
    { id: "res", kind: "resistor", ohm: RESISTOR_OHM, a: "res:P1", b: "res:P2", directional: false },
    { id: "led", kind: "led", ohm: 0, a: "led:A", b: "led:K", directional: true }
  ];

  var SOURCE_NODE = "uno:" + LED_PIN_NAME;
  var SINK_NODE = "uno:GND";

  /**
   * 두 마디 사이의 «소자를 건너는 길» 을 모두 찾는다.
   *   block : 이 소자는 건너지 않는다 (LED 를 뺀 채 전·후반을 따로 보려는 것)
   *
   * 소자가 둘뿐이라 길이 아주 짧다. 그래서 모두 훑어도 값이 싸다.
   * 돌려주는 것 : [[{ id, kind, dir, ohm }], ...]
   */
  function pathsBetween(net, fromNode, toNode, block) {
    var from = net.find(fromNode);
    var to = net.find(toNode);
    var found = [];
    if (from === to) return [[]]; /* 소자를 거치지 않고 이미 이어져 있다 */

    var used = {};
    var steps = [];

    function walk(node) {
      if (steps.length > DEVICES.length) return;
      DEVICES.forEach(function (d) {
        if (used[d.id] || d.id === block) return;
        var ra = net.find(d.a);
        var rb = net.find(d.b);
        /* 두 다리가 같은 마디면 «건널» 수 없다. 소자 양단이 단락된 것이다(명세 18.2). */
        if (ra === rb) return;

        var next = null;
        var dir = "";
        if (ra === node) {
          next = rb;
          dir = "forward";
        } else if (rb === node) {
          next = ra;
          dir = "reverse";
        }
        if (next === null) return;

        used[d.id] = true;
        steps.push({ id: d.id, kind: d.kind, dir: dir, ohm: d.ohm });
        if (next === to) found.push(steps.slice());
        else walk(next);
        steps.pop();
        used[d.id] = false;
      });
    }

    walk(from);
    return found;
  }

  function resistorsIn(steps) {
    return (steps || []).filter(function (s) {
      return s.kind === "resistor";
    });
  }

  function ohmsIn(steps) {
    return resistorsIn(steps).reduce(function (sum, s) {
      return sum + (s.ohm || 0);
    }, 0);
  }

  /**
   * 회로를 전기적으로 읽어 낸다 (명세 18.1 «부품 경로 검사 결과»).
   *
   * 돌려주는 것
   *   { sourcePin, sinkPin, hasResistor, resistanceOhm, ledDirection, shortCircuit, ... }
   *
   * ★ 앞뒤를 «따로» 본다.
   *   LED 를 뺀 채  D11 → LED 양극 과  LED 음극 → GND 를 나누어 보면
   *   GND 만 빠뜨린 학생에게 «양극이 틀렸다» 는 엉뚱한 말을 하지 않는다.
   */
  function analyze(connections) {
    var net = solve(connections);
    var src = net.find(SOURCE_NODE);
    var sink = net.find(SINK_NODE);

    /* D11 과 GND 가 소자 없이 곧바로 이어졌는가 (명세 18.2 마지막 줄) */
    var directShort = src === sink;

    /* LED 두 다리가 같은 마디 — 양단 전압 0V (명세 18.2) */
    var ledLegsSameNode = net.find("led:A") === net.find("led:K");
    var resLegsSameNode = net.find("res:P1") === net.find("res:P2");

    /* 바른 방향 : D11 → (저항) → A ,  K → (저항) → GND */
    var toAnode = pathsBetween(net, SOURCE_NODE, "led:A", "led");
    var fromCathode = pathsBetween(net, "led:K", SINK_NODE, "led");

    /* 거꾸로 꽂았을 때 : D11 → K ,  A → GND */
    var toCathode = pathsBetween(net, SOURCE_NODE, "led:K", "led");
    var fromAnode = pathsBetween(net, "led:A", SINK_NODE, "led");

    function best(list) {
      /* 저항이 있는 길을 먼저 고른다 — 학생이 저항을 «어딘가에» 넣었다면 그것을 본다 */
      var withRes = list.filter(function (p) {
        return resistorsIn(p).length > 0;
      });
      if (withRes.length > 0) return withRes[0];
      return list.length > 0 ? list[0] : null;
    }

    /**
     * 방향은 «LED 가 어느 쪽을 보고 꽂혔는가» 다.
     * 회로가 아직 완성되지 않았어도 정해진다 — GND 를 빠뜨린 학생에게
     * «극성도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
     */
    var anodeSide = toAnode.length > 0; /* D11 → A */
    var cathodeSide = toCathode.length > 0; /* D11 → K */
    var anodeGnd = fromAnode.length > 0; /* A → GND */
    var cathodeGnd = fromCathode.length > 0; /* K → GND */

    var direction = "none";
    if (!ledLegsSameNode) {
      if (anodeSide && !cathodeSide) direction = "forward";
      else if (cathodeSide && !anodeSide) direction = "reverse";
      else if (cathodeGnd && !anodeGnd) direction = "forward";
      else if (anodeGnd && !cathodeGnd) direction = "reverse";
    }

    /* 한 바퀴가 «닫혔는가» — 방향과 따로 본다 */
    var connectedPath =
      !ledLegsSameNode &&
      ((direction === "forward" && anodeSide && cathodeGnd) ||
        (direction === "reverse" && cathodeSide && anodeGnd));

    function best(list) {
      /* 저항이 있는 길을 먼저 고른다 — 학생이 저항을 «어딘가에» 넣었다면 그것을 본다 */
      var withRes = list.filter(function (p) {
        return resistorsIn(p).length > 0;
      });
      if (withRes.length > 0) return withRes[0];
      return list.length > 0 ? list[0] : null;
    }

    /* 반쪽씩 따로 고른다. 그래야 한쪽만 이어진 회로에서도 저항을 셀 수 있다. */
    var head = direction === "reverse" ? best(toCathode) : best(toAnode);
    var tail = direction === "reverse" ? best(fromAnode) : best(fromCathode);

    var steps = (head || []).concat(tail || []);
    var resistors = resistorsIn(steps);

    /* 저항이 LED «앞» 에 있는지 «뒤» 에 있는지 — 둘 다 정답이지만 말로 옮길 때는 갈라야 한다 */
    var resistorSide = "none";
    if (resistorsIn(head || []).length > 0) resistorSide = "head";
    else if (resistorsIn(tail || []).length > 0) resistorSide = "tail";

    return {
      sourcePin: LED_PIN_NAME,
      sinkPin: "GND",
      /* 각 반쪽이 이어졌는가 — 점검 항목이 이 값을 그대로 쓴다 */
      anodeFromSource: anodeSide,
      cathodeToGround: cathodeGnd,
      cathodeFromSource: cathodeSide,
      anodeToGround: anodeGnd,
      /* 명세 18.1 의 «부품 경로 검사 결과» 항목들 */
      ledDirection: direction,
      hasResistor: resistors.length > 0,
      resistanceOhm: ohmsIn(steps),
      resistorCount: resistors.length,
      resistorSide: resistorSide,
      shortCircuit: directShort,
      /* 그 밖의 진단 */
      ledLegsSameNode: ledLegsSameNode,
      resLegsSameNode: resLegsSameNode,
      connected: connectedPath,
      open: !connectedPath && !directShort,
      /* 실제로 불이 켜질 조건 : 한 바퀴가 닫히고 + 바른 방향 + 저항 + 단락 아님 */
      wouldLight: connectedPath && direction === "forward" && resistors.length > 0 && !directShort
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "source" : D11 에서 LED 까지 가는 쪽   (신호가 나가는 길)
   *   "ground" : LED 에서 GND 로 돌아오는 쪽 (전류가 돌아오는 길)
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 양쪽이 붙어 버린 경우(단락)
   *
   *   ★ LED 를 «건너지 않고» 어느 끝에 닿는지로 가른다.
   *     그래서 저항이 LED 앞에 있든 뒤에 있든 저마다 옳은 쪽 색을 받는다.
   *     - 저항이 앞이면  D11–저항–LED긴다리 가 모두 source
   *     - 저항이 뒤면    LED짧은다리–저항–GND 가 모두 ground
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.1).
   *     그래서 이 함수는 checkCircuit·analyze 어디에서도 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";

      var toSource = pathsBetween(net, node, SOURCE_NODE, "led").length > 0;
      var toGround = pathsBetween(net, node, SINK_NODE, "led").length > 0;

      if (toSource && !toGround) return "source";
      if (toGround && !toSource) return "ground";
      return "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * «반쯤 꽂힌» 부품의 다리 — 한쪽 다리는 이었는데 다른 쪽이 비어 있는 것.
   *
   * LED 의 A·K 는 여기서 세지 않는다. 그 둘은 극성 항목(c-anode·c-cathode)이 이미
   * 정확히 짚어 주므로, 같은 실수를 두 항목이 겹쳐 나무라면 무엇을 고쳐야 할지 흐려진다.
   */
  function danglingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      if (part.id === "led") return;
      var wired = part.pins.filter(function (pin) {
        return isWired(connections, part.id, pin.id);
      });
      if (wired.length === 0 || wired.length === part.pins.length) return;
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 17.3 C «불필요한 케이블이 없는가»)
   * 양쪽 끝이 모두 «D11–LED–저항–GND 경로 밖» 인 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    /* 경로에 쓰이는 마디들 */
    var live = {};
    [SOURCE_NODE, SINK_NODE, "led:A", "led:K", "res:P1", "res:P2"].forEach(function (n) {
      live[net.find(n)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 17.3 C)
   *
   * 저항이 LED 앞이든 뒤든 «직렬이면» 모두 인정한다(명세 17.3 B).
   * 전기적으로 직렬 저항은 어느 자리에 있어도 같은 전류를 흘리기 때문이다.
   */
  var REQUIRED = [
    {
      id: "c-resistor",
      label: LED_PIN_NAME + " → LED → GND 경로에 " + RESISTOR_OHM + "Ω 저항이 있다",
      role: "전류 제한",
      hints: [
        "LED 에 전류가 너무 많이 흐르면 어떻게 될까요? 그것을 막는 부품은 무엇인가요?",
        RESISTOR_OHM + "Ω 저항의 두 끝을 보세요. 한 끝은 " + LED_PIN_NAME + " 쪽, 다른 끝은 LED 쪽으로 갑니다.",
        LED_PIN_NAME + " 과 LED 긴 다리 사이에 저항을 «끼워» 이으세요. 저항을 LED 음극과 GND 사이에 두어도 됩니다."
      ]
    },
    {
      id: "c-anode",
      label: "LED 긴 다리 A(+)가 " + LED_PIN_NAME + " 쪽을 향한다",
      role: "극성",
      hints: [
        "LED 는 전류가 한쪽으로만 흐릅니다. 전류가 «들어가는» 다리는 긴 다리일까요, 짧은 다리일까요?",
        "LED 몸통에서 평평하지 «않은» 쪽 다리가 긴 다리 A 입니다.",
        LED_PIN_NAME + " 에서 (저항을 거쳐) LED 의 긴 다리 A 로 이어지게 하세요."
      ]
    },
    {
      id: "c-cathode",
      label: "LED 짧은 다리 K(−)가 GND 마디와 이어진다",
      role: "귀환 경로",
      hints: [
        "전류가 LED 를 지난 뒤에는 어디로 돌아가야 할까요?",
        "LED 몸통의 «평평한 면» 쪽 다리가 짧은 다리 K 입니다. 우노에는 GND 가 세 곳 있습니다.",
        "LED 짧은 다리 K 를 우노의 GND 핀(세 곳 중 아무 곳)에 이으세요."
      ]
    },
    {
      id: "c-noshort",
      label: LED_PIN_NAME + " 과 GND 가 곧바로 이어지지 않았다",
      role: "안전",
      hints: [
        "부품을 하나도 거치지 않고 출력 핀과 GND 를 이으면 무슨 일이 생길까요?",
        LED_PIN_NAME + " 과 GND 를 바로 잇는 케이블이 있는지 케이블 목록에서 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우세요. 사이에는 반드시 부품이 있어야 합니다."
      ]
    },
    {
      id: "c-tidy",
      label: "떠 있는 단자나 쓸모없는 케이블이 없다",
      role: "정리",
      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 길로는 전류가 흐를 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 다리를 찾아보세요.",
        "쓰지 않는 케이블은 지우고, LED 와 저항의 네 다리를 모두 회로에 이으세요."
      ]
    }
  ];

  /**
   * 회로 점검 (명세 6.2 «충족 조건 목록과 미충족 항목만» · 17.3 C)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, floating, stray, powered }
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var floating = floatingLeads(connections);
    var dangling = danglingLeads(connections);
    var stray = strayWires(connections);

    /**
     * 항목마다 «서로 겹치지 않는» 한 가지만 본다.
     * 하나를 빠뜨렸을 때 여러 줄이 한꺼번에 빨개지면 어디를 고쳐야 할지 알 수 없다.
     *
     * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
     *   두 단자가 단락되어 있거나 LED 두 다리가 한 마디면, 극성이 옳은지 그른지를
     *   전기적으로 말할 수 없다. 그때 ✗ 를 찍으면 «극성도 틀렸다» 는 거짓말이 된다.
     *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
     */
    var tangled = a.shortCircuit || net.shorted || a.ledLegsSameNode;
    var ledUnreachable = !a.anodeFromSource && !a.cathodeFromSource;

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var unreachableWhy = LED_PIN_NAME + " 과 LED 를 먼저 이으면 판정합니다";

    var results = {
      "c-resistor": {
        ok: a.hasResistor,
        blocked: tangled || ledUnreachable,
        why: tangled ? tangledWhy : unreachableWhy
      },
      "c-anode": {
        ok: a.anodeFromSource && !a.cathodeFromSource,
        blocked: tangled,
        why: tangledWhy
      },
      "c-cathode": {
        ok: a.cathodeToGround && !a.anodeToGround,
        blocked: tangled,
        why: tangledWhy
      },
      "c-noshort": { ok: !a.shortCircuit && !net.shorted, blocked: false, why: "" },
      "c-tidy": { ok: dangling.length === 0 && stray.length === 0, blocked: false, why: "" }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: req.label,
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 5V 를 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted || a.shortCircuit,
      analysis: a,
      floating: floating,
      dangling: dangling,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 세 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).
   *   펼치면 세 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   *
   *   done 은 «그 두 자리가 이어졌는가» 만 본다. 브레드보드를 몇 번 거쳐 가도,
   *   구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   */
  var GOAL = [
    { id: "g1", from: SOURCE_NODE, to: "res:P1", alt: "res:P2", label: "우노 " + LED_PIN_NAME + " ↔ " + RESISTOR_OHM + "Ω 저항의 한쪽 끝" },
    { id: "g2", from: "res:P2", to: "led:A", alt: "res:P1", label: RESISTOR_OHM + "Ω 저항의 반대쪽 끝 ↔ LED 긴 다리 A(+)" },
    { id: "g3", from: "led:K", to: SINK_NODE, alt: null, label: "LED 짧은 다리 K(−) ↔ 우노 GND" }
  ];

  /**
   * 목표 세 줄이 저마다 이어졌는가.
   *
   * 저항은 방향이 없으므로 «어느 끝이든» 맞다 — 그래서 alt 를 함께 본다.
   *
   * ★ 위 세 줄은 «한 가지» 정답일 뿐이다. 저항을 LED 뒤에 두어도 정답이므로(명세 17.3 B),
   *   그렇게 이은 학생에게 세 줄이 모두 «아직» 으로 보이면 «내가 틀렸나» 하게 된다.
   *   그래서 회로가 이미 통과했는데 줄이 안 맞으면 equivalent 로 알린다.
   *
   * 돌려주는 것 : { lines, allDone, passed, equivalent }
   */
  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      var done = net.connected(net.find(g.from), net.find(g.to));
      if (!done && g.alt) {
        /* 저항을 뒤집어 꽂았어도 같은 회로다 */
        done =
          (g.id === "g1" && net.connected(net.find(g.from), net.find(g.alt))) ||
          (g.id === "g2" && net.connected(net.find(g.alt), net.find(g.to)));
      }
      return { id: g.id, label: g.label, ok: done };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 세 줄과 다르다 = «다르게 이었지만 맞다» */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);
    /* 저항은 «실제로 있는 자리» 에 적는다. 앞뒤 어느 쪽이든 정답이지만
       그린 대로 되비추어야 학생이 자기 회로를 알아본다. */
    var resHead = a.hasResistor && a.resistorSide === "head" ? " → " + a.resistanceOhm + "Ω 저항" : "";
    var resTail = a.hasResistor && a.resistorSide === "tail" ? " → " + a.resistanceOhm + "Ω 저항" : "";

    if (a.shortCircuit) {
      return LED_PIN_NAME + " 과 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    }
    if (a.ledLegsSameNode) {
      return "LED 의 두 다리가 같은 마디에 있습니다. 양단 전압이 0V 라 전류가 LED 를 지나지 않습니다.";
    }
    if (a.ledDirection === "none") {
      return LED_PIN_NAME + " 에서 LED 로 가는 길이 아직 없습니다.";
    }

    var head = a.ledDirection === "forward" ? "LED 긴 다리 A(+)" : "LED 짧은 다리 K(−)";
    var tail = a.ledDirection === "forward" ? "LED 짧은 다리 K(−)" : "LED 긴 다리 A(+)";

    if (!a.connected) {
      return (
        LED_PIN_NAME + resHead + " → " + head + " 까지 이어졌습니다. " +
        tail + " 에서 GND 로 가는 길이 아직 없습니다."
      );
    }

    var path = LED_PIN_NAME + resHead + " → " + head + " → " + tail + resTail + " → GND. ";

    if (a.ledDirection === "reverse") return path + "한 바퀴는 닫혔지만 LED 가 «거꾸로» 꽂혀 있습니다.";
    if (!a.hasResistor) return path + "한 바퀴는 닫혔지만 저항이 없습니다.";
    return path + "한 바퀴가 닫혔습니다.";
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다 — 명세 18.2) */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결과 대표 오류 (명세 6.2 · 18.2)                            */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 부품이 늘어도 이 배열에 한 줄 더하면 되고
   * 판정 코드는 그대로다.
   *
   * ★ 오류를 «뭉뚱그리지 않는다»(명세 12장 마지막 줄 · 29장 6번).
   *   역극성은 «꺼짐», 무저항은 «과전류 위험», GND 누락은 «열린 회로» 로 서로 다르다.
   */
  var DANGER_RULES = [
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      effect: "전원 차단",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",
      fix: "5V 와 GND 를 잇는 케이블을 지우세요."
    },
    {
      code: "short-pin-gnd",
      title: LED_PIN_NAME + "–GND 직접 연결",
      effect: "단락, 전원 차단",
      test: function (ctx) {
        return ctx.analysis.shortCircuit;
      },
      detail:
        LED_PIN_NAME +
        " 과 GND 가 부품을 하나도 거치지 않고 이어졌습니다. 출력 핀이 곧바로 접지로 흘러 " +
        "보드의 출력 회로가 상할 수 있습니다.",
      fix: LED_PIN_NAME + " 과 GND 를 바로 잇는 케이블을 지우고, 사이에 저항과 LED 를 넣으세요."
    },
    {
      code: "led-no-resistor",
      title: "LED 무저항 연결",
      effect: "과전류 위험 — 전원 차단",
      test: function (ctx) {
        var a = ctx.analysis;
        return (a.ledDirection === "forward" || a.ledDirection === "reverse") && !a.hasResistor;
      },
      detail:
        "LED 에 저항 없이 " + LED_PIN_NAME + " 이 이어졌습니다. 전류를 막는 것이 없어 " +
        "LED 에 견딜 수 있는 것보다 훨씬 큰 전류가 흐릅니다. LED 가 곧 타 버리고 보드도 상합니다.",
      fix: LED_PIN_NAME + " 과 LED 사이(또는 LED 와 GND 사이)에 " + RESISTOR_OHM + "Ω 저항을 직렬로 넣으세요."
    },
    {
      code: "led-reversed",
      title: "LED 역극성",
      effect: "전류가 흐르지 않아 꺼짐",
      test: function (ctx) {
        return ctx.analysis.ledDirection === "reverse";
      },
      detail:
        "LED 의 긴 다리 A(+)와 짧은 다리 K(−)가 뒤바뀌었습니다. LED 는 전류를 한 방향으로만 흘리므로 " +
        "이 상태에서는 전류가 «흐르지 않아» 불이 켜지지 않습니다. 타지는 않지만 동작하지도 않습니다.",
      fix: "LED 를 돌려 꽂아 긴 다리 A 를 " + LED_PIN_NAME + " 쪽으로, 짧은 다리 K 를 GND 쪽으로 두세요."
    },
    {
      code: "led-legs-shorted",
      title: "LED 두 다리가 같은 마디",
      effect: "양단 전압 0V — 꺼짐",
      test: function (ctx) {
        return ctx.analysis.ledLegsSameNode;
      },
      detail:
        "LED 의 두 다리가 같은 마디에 있습니다. 브레드보드의 «같은 열» 에 두 다리를 꽂으면 이렇게 됩니다. " +
        "양단 전압이 0V 라 전류가 LED 를 지나지 않고 옆으로 새어 갑니다.",
      fix: "브레드보드는 가운데 홈을 사이에 두고 열이 나뉩니다. 두 다리를 «서로 다른 열» 에 꽂으세요."
    },
    {
      code: "reverse-rail",
      title: "전원·접지 역결선",
      effect: "부품 손상 위험",
      test: function (ctx) {
        var bad = false;
        ctx.connections.forEach(function (c) {
          var a = terminal(c.fromComponent, c.fromPin);
          var b = terminal(c.toComponent, c.toPin);
          if (!a || !b) return;

          var ends = [
            { pin: a, comp: c.fromComponent },
            { pin: b, comp: c.toComponent }
          ];
          var unoEnd = ends.filter(function (e) {
            return e.comp === "uno";
          })[0];
          var railEnd = ends.filter(function (e) {
            return e.pin.kind === "rail";
          })[0];
          if (!unoEnd || !railEnd) return;

          if (unoEnd.pin.id === "5V" && railEnd.pin.polarity === "minus") bad = true;
          if (unoEnd.pin.kind === "ground" && railEnd.pin.polarity === "plus") bad = true;
        });
        return bad;
      },
      detail:
        "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다.",
      fix: "빨간 줄(+) 에는 5V 를, 파란 줄(−) 에는 GND 를 연결하세요."
    }
  ];

  /**
   * 위험·오류 연결을 모두 찾는다.
   * 「전원을 막는 것」과 「켜지지 않을 뿐인 것」을 함께 돌려주되 effect 로 구분한다.
   */
  function dangers(connections) {
    var ctx = {
      connections: connections || [],
      net: solve(connections),
      analysis: analyze(connections)
    };
    return DANGER_RULES.filter(function (rule) {
      return rule.test(ctx);
    }).map(function (rule) {
      return {
        code: rule.code,
        title: rule.title,
        effect: rule.effect,
        detail: rule.detail,
        fix: rule.fix
      };
    });
  }

  /** 전원을 켜도 되는가 — 위험이 하나라도 있으면 막는다(명세 6.2) */
  function canPowerOn(connections) {
    var found = dangers(connections);
    var check = checkCircuit(connections);
    if (found.length > 0) return { ok: false, reason: "danger", dangers: found, check: check };
    if (!check.ok) return { ok: false, reason: "incomplete", dangers: [], check: check };
    return { ok: true, reason: "", dangers: [], check: check };
  }

  /**
   * 지금 회로와 핀 상태에서 LED 가 켜지는가 (명세 6.3 · 18.2)
   *
   *   high : 코드가 D11 을 HIGH 로 두었는가
   *
   * 돌려주는 것 : { on, reason, text }
   * 색만으로 알리지 않으려고 «글» 도 함께 돌려준다(명세 13장).
   */
  function ledState(connections, high) {
    var a = analyze(connections);

    if (a.shortCircuit) return { on: false, reason: "short", text: "단락 — 전원이 차단되었습니다." };
    if (a.ledLegsSameNode) {
      return { on: false, reason: "legs-shorted", text: "LED 양단이 같은 마디라 전압이 0V 입니다." };
    }
    /* ★ 방향이 옳아도 «한 바퀴가 닫히지» 않았으면 전류는 흐르지 않는다.
       GND 를 빠뜨린 회로가 여기에 걸린다(명세 18.2 «GND 누락 → 열린 회로»). */
    if (!a.connected) {
      return { on: false, reason: "open", text: "회로가 끊겨 있습니다. 전류가 돌아올 길을 확인하세요." };
    }
    if (!a.hasResistor) {
      return { on: false, reason: "no-resistor", text: "저항이 없어 과전류 위험 — 전원이 차단되었습니다." };
    }
    if (a.ledDirection === "reverse") {
      return { on: false, reason: "reversed", text: "LED 가 거꾸로 꽂혀 전류가 흐르지 않습니다." };
    }
    if (!high) return { on: false, reason: "low", text: LED_PIN_NAME + " 이 LOW — 꺼짐" };
    return { on: true, reason: "on", text: LED_PIN_NAME + " 이 HIGH — 켜짐" };
  }

  /* ------------------------------------------------------------------ */
  /* 8. 멀티미터 (명세 6.3)                                               */
  /* ------------------------------------------------------------------ */

  /**
   * 탐침 두 개를 대어 전압을 읽는다.
   * 돌려주는 것 : { ok, volts, text, note }
   */
  function measure(connections, a, b, powerOn) {
    if (!a || !b) return { ok: false, volts: null, text: "—", note: "탐침 두 곳을 고르세요." };

    var net = solve(connections);
    if (net.shorted) {
      return {
        ok: false,
        volts: null,
        text: "차단",
        note: "단락이 감지되어 전원이 차단된 상태입니다."
      };
    }
    if (!powerOn) {
      return {
        ok: false,
        volts: null,
        text: "0.00 V",
        note: "전원이 꺼져 있습니다. [전원 켜기] 를 먼저 누르세요."
      };
    }

    var va = net.potentialAt(a.component, a.pin);
    var vb = net.potentialAt(b.component, b.pin);
    if (va === null || vb === null) {
      return {
        ok: false,
        volts: null,
        text: "—",
        note: "한쪽 탐침이 «떠 있는» 자리에 있습니다. 전원이 이어진 곳끼리 재어 보세요."
      };
    }

    var volts = Math.abs(va - vb);
    var sameNode = net.connected(nodeOf(a.component, a.pin), nodeOf(b.component, b.pin));
    var note;
    if (sameNode) note = "두 곳이 같은 마디로 이어져 있습니다. 전위가 같으므로 0V 입니다.";
    else if (volts === 5) note = "+ 레일과 − 레일 사이입니다. 5V 가 걸려 있습니다.";
    else note = "두 곳의 전위가 같습니다.";

    return { ok: true, volts: volts, text: volts.toFixed(2) + " V", note: note };
  }

  /**
   * 멀티미터로 «반드시 확인해야 할» 두 가지 (명세 6.3)
   *   ① +/− 레일 사이 5V   ② 같은 전위끼리 0V
   */
  /**
   * 멀티미터로 살펴볼 자리 (이 차시는 «선택 활동» 이다 — 통과 조건이 아니다)
   * 전원을 켠 뒤 회로가 실제로 어떻게 되어 있는지 눈으로 확인하는 데 쓴다.
   */
  var PROBE_TASKS = [
    {
      id: "p-pin-gnd",
      prompt: "우노 " + LED_PIN_NAME + " 과 GND 에 탐침을 대어 보세요.",
      expect: 5,
      why: LED_PIN_NAME + " 이 HIGH 일 때 두 곳 사이에는 5V 가 걸린다. 이 힘이 LED 를 켠다."
    },
    {
      id: "p-same",
      prompt: "같은 마디로 이어진 «서로 다른 두 자리» 에 탐침을 대어 보세요.",
      expect: 0,
      why: "케이블로 이어진 두 곳은 하나의 마디다. 전위가 같으므로 0V 다."
    }
  ];

  /** 지금 측정이 과제 조건을 채웠는가 */
  function checkProbe(taskIndex, result, a, b) {
    var task = PROBE_TASKS[taskIndex];
    if (!task || !result || !result.ok) return false;
    if (result.volts !== task.expect) return false;
    /* 0V 과제는 «서로 다른 두 자리» 여야 한다 (같은 구멍을 두 번 짚으면 뜻이 없다) */
    if (task.expect === 0 && a && b && a.component === b.component && a.pin === b.pin) return false;
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* 9. 코드 핀과 회로 핀 대조 (명세 6.2 · 15장)                           */
  /* ------------------------------------------------------------------ */

  /** 코드가 적은 핀 값을 보드 단자 이름으로 (8 → "D8", "A0" → "A0") */
  function pinName(value) {
    var s = String(value);
    if (/^A\d$/i.test(s)) return s.toUpperCase();
    if (/^\d+$/.test(s)) return "D" + s;
    return s;
  }

  /**
   * 코드가 쓰는 핀 번호와 실제로 결선된 핀이 다른지 본다.

          isConst: isConst,
          init: init,
          line: t.line
        };
      }

      /* 함수 정의가 함수 안에 들어온 경우 — 흔한 실수라 따로 알려 준다 */
      if (t.type === "keyword" && t.value === "void") {
        throw new ParseError(
          "함수 안에 또 다른 함수를 만들 수 없습니다. 앞의 «}» 를 빠뜨리지 않았는지 보세요.",
          t.line,
          "brace"
        );
      }

      /* 대입 :  x = 5;   x += 1;   x++; */
      if (t.type === "name" && peek(1).type === "op" && ["=", "+=", "-=", "++", "--"].indexOf(peek(1).value) !== -1) {
        next();
        var opTok = next();
        var value = null;
        if (opTok.value === "++" || opTok.value === "--") {
          value = {
            kind: "binary",
            op: opTok.value === "++" ? "+" : "-",
            left: { kind: "variable", name: t.value, line: t.line },
            right: { kind: "number", value: 1, line: t.line },
            line: t.line
          };
        } else if (opTok.value === "+=" || opTok.value === "-=") {
          value = {
            kind: "binary",
            op: opTok.value.charAt(0),
            left: { kind: "variable", name: t.value, line: t.line },
            right: parseExpression(),
            line: t.line
          };
        } else {
          value = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return { kind: "assign", name: t.value, value: value, line: t.line };
      }

      /* 그 밖에는 «식 하나로 이루어진 문장» — 대개 함수 호출이다 */
      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 1차시에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 8장 마지막 문단 · 명세 5장 4단계 통과 조건)          */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      ["then", "otherwise", "args"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** 문자열 인수 하나를 그대로 꺼낸다 (없으면 null) */
  function firstStringArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "string" ? a.value : null;
  }
  function firstNumberArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "number" ? a.value : null;
  }

  /**
   * loop() 몸통의 명령을 «적힌 차례대로» 늘어놓는다.
   * if 안에 든 것도 함께 센다 — 순서만 지켜 준다.
   */
  function statementCalls(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "express" && stmt.expr && stmt.expr.kind === "call") out.push(stmt.expr);
      else if (stmt.kind === "if") {
        out = out.concat(statementCalls(stmt.then));
        if (stmt.otherwise) out = out.concat(statementCalls(stmt.otherwise));
      }
    });
    return out;
  }

  /**
   * 코드가 «LED 핀으로 쓰는» 번호. digitalWrite 의 첫 인수를 본다.
   * ledPin 처럼 이름을 붙였으면 맨 위 선언에서 숫자를 찾아 푼다.
   * 알 수 없으면 이 차시의 기본 핀을 쓴다.
   */
  function codeLedPin(ast) {
    var known = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    var found = null;
    callsIn(ast, "loop").forEach(function (c) {
      if (found !== null || callName(c) !== "digitalWrite") return;
      var a = (c.args || [])[0];
      if (!a) return;
      if (a.kind === "number") found = a.value;
      else if (a.kind === "variable" && known[a.name] !== undefined) found = known[a.name];
    });
    return found === null ? (PC.LED_PIN === undefined ? 11 : PC.LED_PIN) : found;
  }

  /** digitalWrite(..., HIGH) 처럼 «어떤 값을 내보내는» 줄만 고른다 */
  function writesIn(ast, constantName) {
    return callsIn(ast, "loop").filter(function (c) {
      if (callName(c) !== "digitalWrite") return false;
      var v = (c.args || [])[1];
      return v && v.kind === "constant" && v.name === constantName;
    });
  }

  /**
   * 검사 항목 — 화면에는 이 목록이 «통과/미통과» 로 보인다.
   * 정답 코드를 통째로 보여 주지 않고 «무엇이 빠졌는지» 만 알려 준다.
   *
   * 코드 검사 여덟 항목 (명세 17.4 «코드 검사 8항목»)
   *
   * 마지막 항목만 «회로» 를 함께 본다. 그래서 run(ast, ctx) 로 상황을 함께 넘긴다.
   *   ctx.connections : 3단계에서 학생이 이은 케이블 목록
   */
  var TESTS = [
    {
      id: "t-ledpin",
      label: "ledPin 변수를 선언했다",
      run: function (ast) {
        var found = (ast.globals || []).filter(function (g) {
          return g.kind === "declare" && g.name === "ledPin";
        });
        if (found.length === 0) {
          return {
            ok: false,
            message:
              "ledPin 을 만들지 않았습니다. 맨 위에 const int ledPin = ...; 처럼 핀 번호에 이름을 붙여 주세요."
          };
        }
        var value = found[0].init && found[0].init.kind === "number" ? found[0].init.value : null;
        if (value === null) {
          return { ok: false, message: "ledPin 에는 핀 «번호» 를 숫자로 적어 주세요. 예) const int ledPin = 11;" };
        }
        return { ok: true };
      }
    },
    {
      id: "t-setup",
      label: "setup() 함수가 있다",
      run: function (ast) {
        return ast.functions.setup
          ? { ok: true }
          : { ok: false, message: "void setup() { } 가 없습니다. 처음 한 번만 할 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-loop",
      label: "loop() 함수가 있다",
      run: function (ast) {
        return ast.functions.loop
          ? { ok: true }
          : { ok: false, message: "void loop() { } 가 없습니다. 되풀이할 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-pinmode",
      label: "setup() 에서 pinMode(ledPin, OUTPUT) 으로 출력을 정한다",
      run: function (ast) {
        var found = callsIn(ast, "setup").filter(function (c) {
          return callName(c) === "pinMode";
        });
        if (found.length === 0) {
          var elsewhere = callsIn(ast, "loop").filter(function (c) {
            return callName(c) === "pinMode";
          });
          return {
            ok: false,
            message: elsewhere.length
              ? "pinMode 가 loop() 안에 있습니다. 핀의 «역할» 을 정하는 일은 한 번이면 되므로 setup() 에 적습니다."
              : "setup() 안에 pinMode(...) 가 없습니다. 핀을 출력으로 쓸 것이라고 먼저 알려 주어야 합니다."
          };
        }
        var call = found[0];
        var first = (call.args || [])[0];
        var mode = (call.args || [])[1];
        if (!first || !(first.kind === "variable" && first.name === "ledPin") && first.kind !== "number") {
          return { ok: false, message: "pinMode 의 첫 번째 값에는 핀을 적습니다. ledPin 을 그대로 쓰면 됩니다." };
        }
        if (!mode || mode.kind !== "constant" || mode.name !== "OUTPUT") {
          return {
            ok: false,
            message: "pinMode 의 두 번째 값이 OUTPUT 이 아닙니다. LED 는 아두이노가 «내보내는» 쪽이므로 OUTPUT 입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-high",
      label: "loop() 에서 digitalWrite(ledPin, HIGH) 로 LED 를 켠다",
      run: function (ast) {
        return writesIn(ast, "HIGH").length > 0
          ? { ok: true }
          : {
              ok: false,
              message: "loop() 안에 digitalWrite(ledPin, HIGH); 가 없습니다. HIGH 는 높은 전압을 내보내라는 뜻입니다."
            };
      }
    },
    {
      id: "t-low",
      label: "loop() 에서 digitalWrite(ledPin, LOW) 로 LED 를 끈다",
      run: function (ast) {
        return writesIn(ast, "LOW").length > 0
          ? { ok: true }
          : {
              ok: false,
              message: "loop() 안에 digitalWrite(ledPin, LOW); 가 없습니다. LOW 를 내보내지 않으면 LED 가 계속 켜져 있습니다."
            };
      }
    },
    {
      id: "t-delay",
      label: "켜기와 끄기 «사이» 에 delay() 가 있다",
      run: function (ast, ctx) {
        var loop = ast.functions.loop;
        if (!loop) return { ok: false, message: "loop() 가 없습니다." };

        var seq = statementCalls(loop.body);
        var anyDelay = seq.some(function (c) {
          return callName(c) === "delay";
        });
        if (!anyDelay) {
          return {
            ok: false,
            message: "delay(...) 가 없습니다. 기다리지 않으면 켜고 끄는 일이 너무 빨라 눈에 보이지 않습니다."
          };
        }

        /**
         * ★ delay 가 «몇 개 있는가» 가 아니라 «LED 가 켜져 있는 시간이 0 이 아닌가» 를 본다.
         *
         *   digitalWrite(ledPin, HIGH);
         *   digitalWrite(ledPin, LOW);
         *   delay(1000);
         *
         *   이 코드에는 delay 가 있지만 켜진 시간이 0ms 라 불이 보이지 않는다.
         *   줄의 «차례» 만 세면 이것을 놓치므로, 실제로 돌려 보고 켜진 길이를 잰다.
         */
        /* HIGH 나 LOW 가 아예 없으면 그것은 앞의 두 항목이 짚어 준다.
           여기서까지 나무라면 한 가지 실수에 두 줄이 빨개져 무엇을 고칠지 흐려진다. */
        if (writesIn(ast, "HIGH").length === 0 || writesIn(ast, "LOW").length === 0) return { ok: true };

        var source = ctx && ctx.source;
        if (!source) return { ok: true };

        /* 회로가 D11 이 아니어도 «코드가 쓰는 핀» 으로 재야 한다.
           핀이 다른 것은 8번 항목이 따로 짚는다. */
        var phases = ledPhases(run(source, { loopLimit: 3, ledPin: codeLedPin(ast) }));
        var litLong = phases.filter(function (p) {
          return p.on && p.ms > 0;
        });
        var darkLong = phases.filter(function (p) {
          return !p.on && p.ms > 0;
        });

        if (litLong.length === 0) {
          return {
            ok: false,
            message:
              "LED 가 켜져 있는 시간이 0ms 입니다. 켠 «바로 뒤» 에 delay() 를 두어야 켜진 것이 눈에 보입니다."
          };
        }
        if (darkLong.length === 0) {
          return {
            ok: false,
            message: "LED 가 꺼져 있는 시간이 0ms 입니다. 끈 «바로 뒤» 에도 delay() 를 두어야 깜빡임이 보입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pin-match",
      label: "코드의 핀 번호가 회로에 이은 핀과 같다",
      run: function (ast, ctx) {
        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0) {
          return { ok: false, message: "3단계에서 회로를 먼저 이어 주세요. 이을 핀이 없으면 맞대어 볼 수 없습니다." };
        }
        var problems = PC.circuit ? PC.circuit.pinMismatch(pinsUsed(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite"];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2 · 17.4 8번)
   *
   * ★ ledPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   *   풀지 않으면 회로와 맞대어 볼 수 없어 8번 검사가 늘 실패한다.
   */
  function pinsUsed(ast) {
    var uses = [];

    /* 전역에서 숫자로 초기화한 이름만 모은다. 나중에 바뀌는 값은 알 수 없으므로 세지 않는다. */
    var known = {};
    (ast.globals || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = { connections: (ctx && ctx.connections) || [], source: source };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *   opts.ledPin    : 어느 핀이 LED 인가 (기본 11)
   *

    unlock: unlock,

    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */

  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */

    var errors = {};
    var s = student || {};
    var digits = LIMITS.studentIdDigits || 5;

    var id = text(s.studentId);

    } else if (!/^\d+$/.test(id)) {

    } else if (id.length !== digits) {

  function checkStep(stepKey, state) {

        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");

      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.

        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 주기(켜짐 → 꺼짐)를 끝까지 관찰해 주세요.");

        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);

  }

   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
