  /* ================================================================== */
  /* 6. 완성 회로 — 3단계의 «이렇게 잇는다» 한 장                          */
  /* ================================================================== */

  /**
   * 3단계에 쓰는 회로 그림.
   *
   * ★ 이 그림은 «움직이지 않는다». 앱 안에서 가상으로 잇고 전원을 켜 보던
   *   활동은 2026-11-08 에 없앴다(선생님 요청). 학생은 실물 아두이노로 직접 잇고,
   *   앱은 «무엇을 어디에 잇는지» 만 보여 준다.
   *
   * 좌표는 shared/circuit.js 가 가진 것을 그대로 쓴다. 눈대중으로 적지 않는다 —
   * 핀을 다른 곳으로 옮기면 이 그림도 저절로 따라가야 하기 때문이다.
   */

  /** 저항 띠 색 — 눈으로 보는 표시일 뿐이고, 값은 «220Ω» 글자가 진다(명세 17.3 A) */
  var BAND_FILL = { red: "#c0392b", brown: "#7b4a2d", gold: "#c8a13a" };

  /**
   * 케이블 색 — «회로의 어느 쪽인가» 로 정한다.
   *   주황 = 신호가 나가는 길 (D7 → 저항 → LED 긴 다리)
   *   파랑 = 전류가 돌아오는 길 (LED 짧은 다리 → GND)
   * 색만으로 알리지 않는다. 아래 설명 목록에 «주황/파랑» 을 글자로도 적는다.
   */
  var WIRE_FILL = { source: "#ea580c", ground: "#1d4ed8" };

  /** 220Ω 저항 — s40 의 시뮬레이터가 그리던 것과 같은 모양·좌표 */
  function drawResistorBody(g) {
    var R = C.RES;
    var body = R.body;
    var midY = body.y + body.h / 2;
    var gg = UI.svg("g", { class: "part part--res" });

    gg.appendChild(
      UI.svg("rect", { x: R.box.x, y: R.box.y, width: R.box.w, height: R.box.h, rx: 10, class: "part__tray" })
    );
    R.pins.forEach(function (pin) {
      gg.appendChild(
        UI.svg("line", {
          x1: pin.x,
          y1: pin.y,
          x2: pin.x < body.x ? body.x : body.x + body.w,
          y2: midY,
          class: "part__lead"
        })
      );
    });
    gg.appendChild(
      UI.svg("rect", { x: body.x, y: body.y, width: body.w, height: body.h, rx: 9, class: "res__body" })
    );
    R.bands.forEach(function (band) {
      gg.appendChild(
        UI.svg("rect", {
          x: body.x + body.w * band.at - 3,
          y: body.y,
          width: 6,
          height: body.h,
          fill: BAND_FILL[band.color] || "#555",
          class: "res__band"
        })
      );
    });
    gg.appendChild(
      UI.svg("text", { x: body.x + body.w / 2, y: body.y - 10, class: "part__name" }, [
        txt(C.RESISTOR_OHM + "Ω 저항")
      ])
    );
    gg.appendChild(
      UI.svg("text", { x: body.x + body.w / 2, y: body.y + body.h + 20, class: "part__note" }, [
        txt("방향 없음 — 어느 끝이든 좋다")
      ])
    );
    g.appendChild(gg);
  }

  /** LED — 다리 길이와 «평평한 면» 으로 극성을 알린다(색으로만 알리지 않는다) */
  function drawLedBody(g) {
    var L = C.LED;
    var b = L.body;
    var gg = UI.svg("g", { class: "part part--led" });

    gg.appendChild(
      UI.svg("rect", { x: L.box.x, y: L.box.y, width: L.box.w, height: L.box.h, rx: 10, class: "part__tray" })
    );
    ["A", "K"].forEach(function (id) {
      var leg = L.legs[id];
      gg.appendChild(
        UI.svg("line", {
          x1: leg.from.x,
          y1: leg.from.y,
          x2: leg.to.x,
          y2: leg.to.y,
          class: "part__lead part__lead--" + id
        })
      );
    });

    var flatX = b.cx + b.r - 7;
    gg.appendChild(
      UI.svg("path", {
        d:
          "M " + (b.cx - b.r) + " " + (b.cy + 22) +
          " L " + (b.cx - b.r) + " " + b.cy +
          " A " + b.r + " " + b.r + " 0 0 1 " + flatX + " " + (b.cy - b.r + 3) +
          " L " + flatX + " " + (b.cy + 22) + " Z",
        class: "led__body"
      })
    );
    gg.appendChild(UI.svg("text", { x: b.cx, y: L.box.y + 16, class: "part__name" }, [txt("LED")]));
    gg.appendChild(
      UI.svg("text", { x: flatX + 12, y: b.cy + 26, class: "led__flatmark" }, [txt("평평한 면")])
    );
    g.appendChild(gg);
  }

  /**
   * 케이블 한 줄. 살짝 휘어지게 그려 여러 줄이 겹쳐도 갈라 보인다
   * (시뮬레이터가 쓰던 것과 같은 곡선식이다).
   */
  function drawWire(g, from, to, side) {
    var a = C.terminal(from[0], from[1]);
    var b = C.terminal(to[0], to[1]);
    if (!a || !b) return;
    var mx = (a.x + b.x) / 2;
    var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
    g.appendChild(
      UI.svg("path", {
        d: "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y,
        class: "wire wire--" + side,
        stroke: WIRE_FILL[side]
      })
    );
  }

  function wiringFigure() {
    var pin = PC.LED_PIN_NAME || "D7";
    var ohm = PC.RESISTOR_OHM || 220;

    return figure({
      /**
       * ★ 틀(viewBox)은 «번호 배지까지» 넉넉히 담는다 (2026-11-08).
       *   배지는 반지름 11 짜리 동그라미라서, 가운데 좌표만 보고 틀을 잡으면
       *   ① 은 위가, ③④ 는 아래가 잘린다. 실제로 한 번 잘려 나왔다.
       *
       *   담아야 할 범위 — 가로 -25(②) ~ 544(우노 오른쪽) · 세로 -27(①) ~ 429(③)
       *   여기에 사방 여유를 두어 -30 -32 600 478 로 잡는다.
       *
       *   폭은 CSS 의 `.fig--board` 가 620px 로 묶는다. 묶지 않으면 넓은 화면에서
       *   가로 940px · 세로 710px 까지 커져 한 화면을 다 차지한다.
       */
      viewBox: "-30 -32 600 478",
      variant: "board",
      caption: pin + " → " + ohm + "Ω 저항 → LED 긴 다리, LED 짧은 다리 → GND",
      items: [
        {
          text:
            "우노의 " + pin + " — 여기서 신호가 나간다. HIGH 면 약 5V, LOW 면 0V 다. " +
            "여기서 뻗은 주황 케이블을 따라가 보자."
        },
        {
          text:
            ohm + "Ω 저항 — " + pin + " 과 LED 사이에 «한 줄로» 끼운다. " +
            "전류를 제한해 LED 를 지킨다. 방향은 없어서 어느 끝을 " + pin + " 쪽에 두어도 같다."
        },
        {
          text:
            "LED 긴 다리 A(+) — 저항을 거쳐 온 주황 케이블이 여기로 온다. " +
            "긴 다리가 전원 쪽이다."
        },
        {
          text:
            "LED 짧은 다리 K(−) — 파랑 케이블로 우노의 GND 로 간다. " +
            "전류가 돌아오는 길이다. 이 줄이 없으면 아무리 HIGH 를 내보내도 켜지지 않는다."
        }
      ],
      build: function (g) {
        drawUnoBody(g);
        drawResistorBody(g);
        drawLedBody(g);

        /* 케이블은 부품 위에 그린다 — 아래에 그리면 트레이에 가려 보이지 않는다 */
        drawWire(g, ["uno", pin], ["res", "P1"], "source");
        drawWire(g, ["res", "P2"], ["led", "A"], "source");
        drawWire(g, ["led", "K"], ["uno", "GND2"], "ground");

        var d7 = C.terminal("uno", pin);
        var ledA = C.terminal("led", "A");
        var ledK = C.terminal("led", "K");

        /* ① 신호가 나가는 핀 — 보드 위쪽 밖에서 수직으로 */
        g.appendChild(leader(d7.x, -4, d7.x, d7.y - 13));
        g.appendChild(badge(1, d7.x, -16));

        /* ② 저항 — 왼쪽 밖에서 가로로. 몸통 왼쪽 위 모서리를 짚는다 */
        g.appendChild(leader(-2, 300, C.RES.body.x + 6, C.RES.body.y + 4));
        g.appendChild(badge(2, -14, 298));

        /* ③ 긴 다리 A — 아래쪽에서 */
        g.appendChild(leader(ledA.x - 34, 414, ledA.x - 4, ledA.y + 6));
        g.appendChild(badge(3, ledA.x - 46, 418));

        /* ④ 짧은 다리 K — 오른쪽 아래에서 */
        g.appendChild(leader(ledK.x + 64, 402, ledK.x + 6, ledK.y + 6));
        g.appendChild(badge(4, ledK.x + 76, 404));
      }
    });
  }

  /* ================================================================== */

  /** 카드 id → 그림. 없는 카드는 글만 둔다. */
  var BY_CARD = {
    inside: ledInsideFigure,
    polarity: ledPolarityFigure,
    resistor: resistorFigure,
    digital: digitalFigure
  };

  S.figures = {
    figure: figure,
    uno: unoFigure,
    breadboard: breadboardFigure,
    breadboardUse: breadboardUseFigure,
    breadboardPair: breadboardPair,
    ide: ideFigure,
    ledInside: ledInsideFigure,
    ledPolarity: ledPolarityFigure,
    resistor: resistorFigure,
    digital: digitalFigure,
    /** 3단계 회로 그림 — 움직이지 않는 «이렇게 잇는다» 한 장 */
    wiring: wiringFigure,
    /** 그 카드에 붙일 그림을 만든다. 없으면 null. */
    forCard: function (id) {
      return BY_CARD[id] ? BY_CARD[id]() : null;
    },
    has: function (id) {
      return !!BY_CARD[id];
    }
  };
})();
    </script>
    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, [no, lineNode(line)]);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 (① 코드 조립)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 흩어진 줄을 바른 차례로 만든다.
   *
   * 옮기는 길이 **두 가지**다 (2026-11-08 선생님 요청으로 끌어 놓기를 더했다).
   *   ① 끌어 놓기 — 줄을 집어 원하는 자리에 놓는다 (마우스 · 손가락 · 펜)
   *   ② ▲ ▼ 단추  — 한 칸씩 옮긴다 (키보드 · 보조 기술)
   *
   * ★ 단추를 «없애지 않는다». 끌어 놓기만 두면 키보드만 쓰는 학생은 이 활동을
   *   아예 할 수 없다(명세 13장 — 세 가지 조작을 모두 받친다).
   *
   * ★ 끌어 놓기는 HTML5 draggable 이 아니라 **포인터 이벤트**로 만든다.
   *   draggable 은 손가락(터치)에서 동작하지 않아 교실 태블릿에서 쓸 수 없다.
   *   포인터 이벤트는 마우스·터치·펜을 한 길로 받는다.
   */
  function assembler(order, onChange) {
    var lines = A.ASSEMBLE_LINES;
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */
    var current = (order && order.length === lines.length ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });

    /**
     * 두 칸 배치에서 번호가 «세로로» 흐르게 한다 (2026-11-08 선생님 요청).
     *   왼쪽 칸 1 2 3 4 5 · 오른쪽 칸 6 7 8 9 10
     *
     * CSS 가 `grid-auto-flow: column` 으로 세로부터 채우므로, 한 칸에 몇 줄이
     * 들어가는지(= 줄 수의 절반)를 알려 주어야 한다.
     *
     * ★ 「5」 를 CSS 에 적어 두지 «않는다». 줄 수가 바뀌면 칸이 어긋난다.
     *   줄 목록에서 세어 낸 값을 CSS 변수로 건넨다.
     *   (좁은 화면에서는 한 칸으로 돌아가야 하므로 grid-template-rows 를 직접
     *    적지 않는다 — 직접 적으면 인라인 스타일이라 미디어 쿼리가 이기지 못한다.)
     */
    listHost.style.setProperty("--assemble-rows", String(Math.ceil(lines.length / 2)));

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      if (onChange) onChange(current.slice(), sourceOf());
      UI.announce((index + 1) + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;
      if (btn) btn.focus();
    }

    /** 지금 차례를 코드 글로 — 들여쓰기는 정답 줄에 적힌 대로 넣어 준다 */
    function sourceOf() {
      return current
        .map(function (id) {
          var line = byId[id];
          return "  ".repeat(line.indent) + line.text;
        })
        .join("\n");
    }

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];
        var item = UI.el("li", { class: "assemble__item", attrs: { "data-id": id } }, [
          /* 집는 자리 — 끌 수 있다는 것을 «보여 주는» 표시이기도 하다.
             키보드로는 ▲▼ 단추를 쓰므로 낭독기에서는 감춘다. */
          UI.el("span", {
            class: "assemble__grip",
            attrs: { "aria-hidden": "true", title: "끌어서 옮기기" },
            text: "⠿"
          }),
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);
        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        listHost.appendChild(item);
      });
    }

    /* ------------------------------------------------------------------ */
    /* 끌어 놓기 (2026-11-08)                                               */
    /*                                                                     */
    /* 끄는 동안에는 화면을 «다시 그리지 않는다». 다시 그리면 집고 있던 마디가   */
    /* 사라져 손가락을 놓칠 뿐 아니라 포인터 붙잡기(capture)도 끊긴다.         */
    /* 그래서 끄는 동안에는 DOM 의 마디만 옮기고, 놓는 순간에 그 차례를 읽어    */
    /* current 에 옮겨 적은 뒤 한 번만 다시 그린다.                          */
    /* ------------------------------------------------------------------ */

    var dragging = null; /* 지금 집고 있는 <li> */

    /** 지금 화면에 놓인 차례를 읽어 current 에 옮겨 적는다 */
    function syncFromDom() {
      var ids = [];
      var nodes = listHost.querySelectorAll(".assemble__item");
      for (var i = 0; i < nodes.length; i += 1) ids.push(nodes[i].getAttribute("data-id"));
      /* 줄 수가 어긋나면(있을 수 없지만) 손대지 않는다 — 잘못 적는 것보다 낫다 */
      if (ids.length !== current.length) return false;
      current = ids;
      return true;
    }

    /** 포인터가 있는 자리의 다른 줄을 찾는다 */
    function itemUnder(x, y) {
      var el = document.elementFromPoint(x, y);
      while (el && el !== listHost) {
        if (el.classList && el.classList.contains("assemble__item")) return el;
        el = el.parentNode;
      }
      return null;
    }

    function onDown(event) {
      /* 단추를 누른 것이면 끌기가 아니다 */
      if (event.target.closest && event.target.closest("button")) return;
      var item = event.target.closest ? event.target.closest(".assemble__item") : null;
      if (!item || dragging) return;
      /* 마우스는 왼쪽 단추만 */
      if (event.pointerType === "mouse" && event.button !== 0) return;

      /* ★ 손가락·펜은 «집는 자리(⠿)» 에서만 끌기가 시작된다.
         줄 아무 데서나 시작하게 두면 목록 위에서 화면을 쓸어 내릴 수 없다 —
         열 줄짜리 목록이 화면을 덮고 있어 학생이 아래로 내려가지 못한다. */
      if (event.pointerType !== "mouse" && !event.target.closest(".assemble__grip")) return;

      dragging = item;
      item.classList.add("is-dragging");
      listHost.classList.add("is-sorting");
      try {
        item.setPointerCapture(event.pointerId);
      } catch (err) {
        /* 붙잡지 못해도 move/up 은 들어온다 */
      }
      event.preventDefault();
    }

    function onMove(event) {
      if (!dragging) return;
      var over = itemUnder(event.clientX, event.clientY);
      if (!over || over === dragging) return;

      /* 가운데를 넘었으면 그 줄 «뒤» 로, 아니면 «앞» 으로 놓는다.
         번호가 세로로 흐르므로(왼쪽 1~5 · 오른쪽 6~10) 위아래로 가른다 —
         차례가 이웃한 두 줄은 한 칸 안에서 «위아래» 로 붙어 있기 때문이다. */
      var box = over.getBoundingClientRect();
      var after = event.clientY > box.top + box.height / 2;

      listHost.insertBefore(dragging, after ? over.nextSibling : over);
    }

    function onUp() {
      if (!dragging) return;
      dragging.classList.remove("is-dragging");
      listHost.classList.remove("is-sorting");
      dragging = null;

      if (!syncFromDom()) {
        draw();
        return;
      }
      draw();
      if (onChange) onChange(current.slice(), sourceOf());
      UI.announce("줄을 옮겼습니다. 지금 차례를 확인하세요.");
    }

    listHost.addEventListener("pointerdown", onDown);
    listHost.addEventListener("pointermove", onMove);
    listHost.addEventListener("pointerup", onUp);
    listHost.addEventListener("pointercancel", onUp);

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", {
          class: "assemble__help",
          text:
            "줄을 끌어다 놓거나 ▲ ▼ 단추로 차례를 바로잡으세요. " +
            "번호 차례는 «왼쪽 칸을 위에서 아래로, 그다음 오른쪽 칸» 입니다."
        }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isSolved: function () {
        return current.every(function (id, i) {
          return byId[id].order === i + 1;
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  function blanks(values, onChange) {
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    A.BLANK_TEMPLATE.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: { type: "text", placeholder: line.hint, spellcheck: "false", autocapitalize: "off" }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        host.appendChild(
          UI.el("div", { class: "blanks__row" }, [
            UI.el("label", { class: "sr-only", attrs: { for: id }, text: line.hint }),
            input
          ])
        );
        return;
      }

      host.appendChild(
        UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
          UI.el("code", { class: "blanks__fixed" }, [lineNode(line.text)])
        ])
      );
    });

    function sourceOf() {
      return A.BLANK_TEMPLATE.lines
        .map(function (line) {
          if (!line.blank) return line.text;
          var typed = String(current[line.blank] || "").trim();
          return "  ".repeat(line.indent || 0) + typed;
        })
        .join("\n");
    }

    return {
      root: host,
      getSource: sourceOf,
      getValues: function () {
        return current;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — LED 등과 «누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(1000) 이면 1초를 기다린다. 그래야 LED 가 실제 보드처럼 깜빡이고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다(명세 29장 4번).
     *
     *     1배속   delay 값 그대로 (delay(1000) → 1초)
     *     0.5배속 두 배 천천히 — 깜빡임을 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

  function functionCards() {

  function renderConcept(state, app) {

    var checkBox = el("div");

  /**

   *   모두 없앴다(선생님 요청). 없앤 것은 회로 그림 조작·단자 찾기·회로 점검·

  /**
