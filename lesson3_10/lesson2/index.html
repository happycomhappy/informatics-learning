      pins: [
        { id: "P1", label: "저항 왼쪽 끝", short: "①", kind: "lead", x: 56, y: 323 },
        { id: "P2", label: "저항 오른쪽 끝", short: "②", kind: "lead", x: 224, y: 323 }
      ]
    };
  }

  var UNO = buildUno();
  var BB = buildBreadboard();
  var LED = buildLed();
  var RES = buildResistor();

  /** 화면에 그릴 부품 전부. 판정은 이 목록을 훑는다. */
  var COMPONENTS = [UNO, BB, RES, LED];
  var BY_ID = { uno: UNO, bb: BB, led: LED, res: RES };

  /** 케이블이 아니라 «소자» 인 부품 (명세 18.1) */
  var PARTS = [RES, LED];

  /** 부품·단자 이름으로 단자를 찾는다. 없으면 null. */
  function terminal(componentId, pinId) {
    var comp = BY_ID[componentId];
    if (!comp) return null;
    for (var i = 0; i < comp.pins.length; i += 1) {
      if (comp.pins[i].id === pinId) return comp.pins[i];
    }
    return null;
  }

  /** 「우노 5V」 처럼 사람이 읽는 이름 */
  function describe(componentId, pinId) {
    var comp = BY_ID[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return String(componentId) + " " + String(pinId);
    if (comp.id === "uno") return "우노 " + pin.label;
    if (comp.id === "led") return "LED " + pin.label;
    if (comp.id === "res") return comp.name + " " + pin.label.replace("저항 ", "");
    if (pin.kind === "rail") return "브레드보드 " + pin.label + " " + pin.short;
    return "브레드보드 " + pin.label + " 구멍";
  }

  /* ------------------------------------------------------------------ */
  /* 2. 하드웨어가 이미 이어 놓은 «마디»                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 단자 하나가 속한 마디 이름.
   * 케이블을 하나도 꽂지 않아도 부품 안에서 이미 이어져 있는 것들을 나타낸다.
   */
  function nodeOf(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    if (!pin) return null;
    if (componentId === "uno") {
      if (pin.kind === "ground") return "uno:GND";
      return "uno:" + pin.id;
    }
    /* LED 와 저항의 다리는 «저마다 따로인» 마디다.
       부품이 두 마디를 이어 주지 «않는다» — 걸쳐 있을 뿐이다(명세 18.1). */
    if (componentId === "led" || componentId === "res") return componentId + ":" + pin.id;
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;
    return "bb:col:" + pin.col + ":" + pin.half;
  }

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);
    if (node === "led:A") return "LED 긴 다리 A(+)";
    if (node === "led:K") return "LED 짧은 다리 K(−)";
    if (node.indexOf("res:") === 0) return RESISTOR_OHM + "Ω 저항 " + (node === "res:P1" ? "왼쪽" : "오른쪽") + " 끝";

    var railMatch = node.match(/^bb:rail:(\w+)$/);
    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {
        if (r.id === railMatch[1]) found = r;
      });
      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;
    }

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
    if (colMatch) {
      return "브레드보드 " + colMatch[1] + "번 열(" + (colMatch[2] === "U" ? "A~E" : "F~J") + ")";
    }
    return node;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 연결 자료 (명세 6.2 — 좌표가 아니라 연결 그래프로 저장)              */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 색을 골라 준다 — 신호 노랑, 5V 빨강, GND 검정(명세 6.1).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("cathode") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || polarities.indexOf("plus") !== -1) return "red";
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.2 «전원 인가를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 17.3 A)                           */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리, 저항은 두 끝이 모두 맞기 때문이다.
   *
   * distinctFrom 이 있으면 «그 과제에서 누른 것과 다른 단자» 여야 한다.
   * 저항의 두 끝을 차례로 찾게 하려는 것이다(명세 17.3 A «저항의 두 끝»).
   */
  var FIND_TASKS = [
    {
      id: "f-d11",
      prompt: "LED 를 켜고 끌 신호를 내보낼 디지털 핀 «" + LED_PIN_NAME + "» 을 찾아 누르세요.",
      accept: [{ component: "uno", pin: LED_PIN_NAME }],
      why: LED_PIN_NAME + " 은(는) 디지털 출력 핀이다. HIGH 면 5V, LOW 면 0V 를 내보낸다."
    },
    {
      id: "f-gnd",
      prompt: "전류가 돌아올 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",
      accept: [
        { component: "uno", pin: "GND0" },
        { component: "uno", pin: "GND1" },
        { component: "uno", pin: "GND2" }
      ],
      why: "GND 는 전기가 «없는» 핀이 아니라 전류가 돌아오는 길이다. 이 길이 없으면 회로가 끊긴다."
    },
    {
      id: "f-led-a",
      prompt: "LED 의 «긴 다리(양극 A)» 를 찾아 누르세요. 몸통의 둥근 쪽입니다.",
      accept: [{ component: "led", pin: "A" }],
      why: "긴 다리가 양극(A)이다. 전원(+) 쪽, 곧 " + LED_PIN_NAME + " 쪽으로 간다."
    },
    {
      id: "f-led-k",
      prompt: "LED 의 «짧은 다리(음극 K)» 를 찾아 누르세요. 몸통의 «평평한 면» 쪽입니다.",
      accept: [{ component: "led", pin: "K" }],
      why: "짧은 다리가 음극(K)이다. 몸통 옆면이 평평한 쪽이라 다리를 잘라도 알아볼 수 있다. GND 쪽으로 간다."
    },
    {
      id: "f-res-1",
      prompt: RESISTOR_OHM + "Ω 저항의 «한쪽 끝» 을 누르세요.",
      accept: [
        { component: "res", pin: "P1" },
        { component: "res", pin: "P2" }
      ],
      why: "저항은 방향이 없다. 어느 쪽 끝을 " + LED_PIN_NAME + " 에 붙여도 같다."
    },
    {
      id: "f-res-2",
      prompt: "이번에는 같은 저항의 «반대쪽 끝» 을 누르세요.",
      accept: [
        { component: "res", pin: "P1" },
        { component: "res", pin: "P2" }
      ],
      distinctFrom: "f-res-1",
      why:
        "저항은 두 끝 사이를 지나는 전류를 줄인다. 띠 색(빨강·빨강·갈색)은 눈으로 보는 표시일 뿐이므로 " +
        "몸통에 적힌 " + RESISTOR_OHM + "Ω 글자로 확인한다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    anode: "LED 양극(긴 다리)",
    cathode: "LED 음극(짧은 다리)",
    lead: "저항의 끝",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.2 · 18.2) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   *   history : { 과제id: 누른 단자 } — «반대쪽 끝» 을 가려내는 데 쓴다
   *
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId, history) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit && task.distinctFrom) {
      var before = (history || {})[task.distinctFrom];
      if (before && before === componentId + "/" + pinId) {
        return {
          ok: false,
          done: false,
          kind: "wrong",
          message: "방금 누른 끝과 «같은» 자리입니다. 저항의 반대쪽 끝을 눌러 주세요."
        };
      }
    }

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — LED 회로 결선과 경로 판정 (명세 17.3 B · 18.1)            */
  /* ------------------------------------------------------------------ */

  /**
   * «소자» 목록 — 케이블과 달리 마디를 합치지 않고 «걸쳐» 있다(명세 18.1).
   * LED 만 방향이 있다. 저항은 어느 쪽으로 지나도 같다.
   */
  var DEVICES = [
    { id: "res", kind: "resistor", ohm: RESISTOR_OHM, a: "res:P1", b: "res:P2", directional: false },
    { id: "led", kind: "led", ohm: 0, a: "led:A", b: "led:K", directional: true }
  ];

  var SOURCE_NODE = "uno:" + LED_PIN_NAME;
  var SINK_NODE = "uno:GND";

  /**
   * 두 마디 사이의 «소자를 건너는 길» 을 모두 찾는다.
   *   block : 이 소자는 건너지 않는다 (LED 를 뺀 채 전·후반을 따로 보려는 것)
   *
   * 소자가 둘뿐이라 길이 아주 짧다. 그래서 모두 훑어도 값이 싸다.
   * 돌려주는 것 : [[{ id, kind, dir, ohm }], ...]
   */
  function pathsBetween(net, fromNode, toNode, block) {
    var from = net.find(fromNode);
    var to = net.find(toNode);
    var found = [];
    if (from === to) return [[]]; /* 소자를 거치지 않고 이미 이어져 있다 */

    var used = {};
    var steps = [];

    function walk(node) {
      if (steps.length > DEVICES.length) return;
      DEVICES.forEach(function (d) {
        if (used[d.id] || d.id === block) return;
        var ra = net.find(d.a);
        var rb = net.find(d.b);
        /* 두 다리가 같은 마디면 «건널» 수 없다. 소자 양단이 단락된 것이다(명세 18.2). */
        if (ra === rb) return;

        var next = null;
        var dir = "";
        if (ra === node) {
          next = rb;
          dir = "forward";
        } else if (rb === node) {
          next = ra;
          dir = "reverse";
        }
        if (next === null) return;

        used[d.id] = true;
        steps.push({ id: d.id, kind: d.kind, dir: dir, ohm: d.ohm });
        if (next === to) found.push(steps.slice());
        else walk(next);
        steps.pop();
        used[d.id] = false;
      });
    }

    walk(from);
    return found;
  }

  function resistorsIn(steps) {
    return (steps || []).filter(function (s) {
      return s.kind === "resistor";
    });
  }

  function ohmsIn(steps) {
    return resistorsIn(steps).reduce(function (sum, s) {
      return sum + (s.ohm || 0);
    }, 0);
  }

  /**
   * 회로를 전기적으로 읽어 낸다 (명세 18.1 «부품 경로 검사 결과»).
   *
   * 돌려주는 것
   *   { sourcePin, sinkPin, hasResistor, resistanceOhm, ledDirection, shortCircuit, ... }
   *
   * ★ 앞뒤를 «따로» 본다.
   *   LED 를 뺀 채  D11 → LED 양극 과  LED 음극 → GND 를 나누어 보면
   *   GND 만 빠뜨린 학생에게 «양극이 틀렸다» 는 엉뚱한 말을 하지 않는다.
   */
  function analyze(connections) {
    var net = solve(connections);
    var src = net.find(SOURCE_NODE);
    var sink = net.find(SINK_NODE);

    /* D11 과 GND 가 소자 없이 곧바로 이어졌는가 (명세 18.2 마지막 줄) */
    var directShort = src === sink;

    /* LED 두 다리가 같은 마디 — 양단 전압 0V (명세 18.2) */
    var ledLegsSameNode = net.find("led:A") === net.find("led:K");
    var resLegsSameNode = net.find("res:P1") === net.find("res:P2");

    /* 바른 방향 : D11 → (저항) → A ,  K → (저항) → GND */
    var toAnode = pathsBetween(net, SOURCE_NODE, "led:A", "led");
    var fromCathode = pathsBetween(net, "led:K", SINK_NODE, "led");

    /* 거꾸로 꽂았을 때 : D11 → K ,  A → GND */
    var toCathode = pathsBetween(net, SOURCE_NODE, "led:K", "led");
    var fromAnode = pathsBetween(net, "led:A", SINK_NODE, "led");

    function best(list) {
      /* 저항이 있는 길을 먼저 고른다 — 학생이 저항을 «어딘가에» 넣었다면 그것을 본다 */
      var withRes = list.filter(function (p) {
        return resistorsIn(p).length > 0;
      });
      if (withRes.length > 0) return withRes[0];
      return list.length > 0 ? list[0] : null;
    }

    /**
     * 방향은 «LED 가 어느 쪽을 보고 꽂혔는가» 다.
     * 회로가 아직 완성되지 않았어도 정해진다 — GND 를 빠뜨린 학생에게
     * «극성도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
     */
    var anodeSide = toAnode.length > 0; /* D11 → A */
    var cathodeSide = toCathode.length > 0; /* D11 → K */
    var anodeGnd = fromAnode.length > 0; /* A → GND */
    var cathodeGnd = fromCathode.length > 0; /* K → GND */

    var direction = "none";
    if (!ledLegsSameNode) {
      if (anodeSide && !cathodeSide) direction = "forward";
      else if (cathodeSide && !anodeSide) direction = "reverse";
      else if (cathodeGnd && !anodeGnd) direction = "forward";
      else if (anodeGnd && !cathodeGnd) direction = "reverse";
    }

    /* 한 바퀴가 «닫혔는가» — 방향과 따로 본다 */
    var connectedPath =
      !ledLegsSameNode &&
      ((direction === "forward" && anodeSide && cathodeGnd) ||
        (direction === "reverse" && cathodeSide && anodeGnd));

    function best(list) {
      /* 저항이 있는 길을 먼저 고른다 — 학생이 저항을 «어딘가에» 넣었다면 그것을 본다 */
      var withRes = list.filter(function (p) {
        return resistorsIn(p).length > 0;
      });
      if (withRes.length > 0) return withRes[0];
      return list.length > 0 ? list[0] : null;
    }

    /* 반쪽씩 따로 고른다. 그래야 한쪽만 이어진 회로에서도 저항을 셀 수 있다. */
    var head = direction === "reverse" ? best(toCathode) : best(toAnode);
    var tail = direction === "reverse" ? best(fromAnode) : best(fromCathode);

    var steps = (head || []).concat(tail || []);
    var resistors = resistorsIn(steps);

    /* 저항이 LED «앞» 에 있는지 «뒤» 에 있는지 — 둘 다 정답이지만 말로 옮길 때는 갈라야 한다 */
    var resistorSide = "none";
    if (resistorsIn(head || []).length > 0) resistorSide = "head";
    else if (resistorsIn(tail || []).length > 0) resistorSide = "tail";

    return {
      sourcePin: LED_PIN_NAME,
      sinkPin: "GND",
      /* 각 반쪽이 이어졌는가 — 점검 항목이 이 값을 그대로 쓴다 */
      anodeFromSource: anodeSide,
      cathodeToGround: cathodeGnd,
      cathodeFromSource: cathodeSide,
      anodeToGround: anodeGnd,
      /* 명세 18.1 의 «부품 경로 검사 결과» 항목들 */
      ledDirection: direction,
      hasResistor: resistors.length > 0,
      resistanceOhm: ohmsIn(steps),
      resistorCount: resistors.length,
      resistorSide: resistorSide,
      shortCircuit: directShort,
      /* 그 밖의 진단 */
      ledLegsSameNode: ledLegsSameNode,
      resLegsSameNode: resLegsSameNode,
      connected: connectedPath,
      open: !connectedPath && !directShort,
      /* 실제로 불이 켜질 조건 : 한 바퀴가 닫히고 + 바른 방향 + 저항 + 단락 아님 */
      wouldLight: connectedPath && direction === "forward" && resistors.length > 0 && !directShort
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "source" : D11 에서 LED 까지 가는 쪽   (신호가 나가는 길)
   *   "ground" : LED 에서 GND 로 돌아오는 쪽 (전류가 돌아오는 길)
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 양쪽이 붙어 버린 경우(단락)
   *
   *   ★ LED 를 «건너지 않고» 어느 끝에 닿는지로 가른다.
   *     그래서 저항이 LED 앞에 있든 뒤에 있든 저마다 옳은 쪽 색을 받는다.
   *     - 저항이 앞이면  D11–저항–LED긴다리 가 모두 source
   *     - 저항이 뒤면    LED짧은다리–저항–GND 가 모두 ground
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.1).
   *     그래서 이 함수는 checkCircuit·analyze 어디에서도 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";

      var toSource = pathsBetween(net, node, SOURCE_NODE, "led").length > 0;
      var toGround = pathsBetween(net, node, SINK_NODE, "led").length > 0;

      if (toSource && !toGround) return "source";
      if (toGround && !toSource) return "ground";
      return "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * «반쯤 꽂힌» 부품의 다리 — 한쪽 다리는 이었는데 다른 쪽이 비어 있는 것.
   *
   * LED 의 A·K 는 여기서 세지 않는다. 그 둘은 극성 항목(c-anode·c-cathode)이 이미
   * 정확히 짚어 주므로, 같은 실수를 두 항목이 겹쳐 나무라면 무엇을 고쳐야 할지 흐려진다.
   */
  function danglingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      if (part.id === "led") return;
      var wired = part.pins.filter(function (pin) {
        return isWired(connections, part.id, pin.id);
      });
      if (wired.length === 0 || wired.length === part.pins.length) return;
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 17.3 C «불필요한 케이블이 없는가»)
   * 양쪽 끝이 모두 «D11–LED–저항–GND 경로 밖» 인 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    /* 경로에 쓰이는 마디들 */
    var live = {};
    [SOURCE_NODE, SINK_NODE, "led:A", "led:K", "res:P1", "res:P2"].forEach(function (n) {
      live[net.find(n)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 17.3 C)
   *
   * 저항이 LED 앞이든 뒤든 «직렬이면» 모두 인정한다(명세 17.3 B).
   * 전기적으로 직렬 저항은 어느 자리에 있어도 같은 전류를 흘리기 때문이다.
   */
  var REQUIRED = [
    {
      id: "c-resistor",
      label: LED_PIN_NAME + " → LED → GND 경로에 " + RESISTOR_OHM + "Ω 저항이 있다",
      role: "전류 제한",
      hints: [
        "LED 에 전류가 너무 많이 흐르면 어떻게 될까요? 그것을 막는 부품은 무엇인가요?",
        RESISTOR_OHM + "Ω 저항의 두 끝을 보세요. 한 끝은 " + LED_PIN_NAME + " 쪽, 다른 끝은 LED 쪽으로 갑니다.",
        LED_PIN_NAME + " 과 LED 긴 다리 사이에 저항을 «끼워» 이으세요. 저항을 LED 음극과 GND 사이에 두어도 됩니다."
      ]
    },
    {
      id: "c-anode",
      label: "LED 긴 다리 A(+)가 " + LED_PIN_NAME + " 쪽을 향한다",
      role: "극성",
      hints: [
        "LED 는 전류가 한쪽으로만 흐릅니다. 전류가 «들어가는» 다리는 긴 다리일까요, 짧은 다리일까요?",
        "LED 몸통에서 평평하지 «않은» 쪽 다리가 긴 다리 A 입니다.",
        LED_PIN_NAME + " 에서 (저항을 거쳐) LED 의 긴 다리 A 로 이어지게 하세요."
      ]
    },
    {
      id: "c-cathode",
      label: "LED 짧은 다리 K(−)가 GND 마디와 이어진다",
      role: "귀환 경로",
      hints: [
        "전류가 LED 를 지난 뒤에는 어디로 돌아가야 할까요?",
        "LED 몸통의 «평평한 면» 쪽 다리가 짧은 다리 K 입니다. 우노에는 GND 가 세 곳 있습니다.",
        "LED 짧은 다리 K 를 우노의 GND 핀(세 곳 중 아무 곳)에 이으세요."
      ]
    },
    {
      id: "c-noshort",
      label: LED_PIN_NAME + " 과 GND 가 곧바로 이어지지 않았다",
      role: "안전",
      hints: [
        "부품을 하나도 거치지 않고 출력 핀과 GND 를 이으면 무슨 일이 생길까요?",
        LED_PIN_NAME + " 과 GND 를 바로 잇는 케이블이 있는지 케이블 목록에서 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우세요. 사이에는 반드시 부품이 있어야 합니다."
      ]
    },
    {
      id: "c-tidy",
      label: "떠 있는 단자나 쓸모없는 케이블이 없다",
      role: "정리",
      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 길로는 전류가 흐를 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 다리를 찾아보세요.",
        "쓰지 않는 케이블은 지우고, LED 와 저항의 네 다리를 모두 회로에 이으세요."
      ]
    }
  ];

  /**
   * 회로 점검 (명세 6.2 «충족 조건 목록과 미충족 항목만» · 17.3 C)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, floating, stray, powered }
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var floating = floatingLeads(connections);
    var dangling = danglingLeads(connections);
    var stray = strayWires(connections);

    /**
     * 항목마다 «서로 겹치지 않는» 한 가지만 본다.
     * 하나를 빠뜨렸을 때 여러 줄이 한꺼번에 빨개지면 어디를 고쳐야 할지 알 수 없다.
     *
     * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
     *   두 단자가 단락되어 있거나 LED 두 다리가 한 마디면, 극성이 옳은지 그른지를
     *   전기적으로 말할 수 없다. 그때 ✗ 를 찍으면 «극성도 틀렸다» 는 거짓말이 된다.
     *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
     */
    var tangled = a.shortCircuit || net.shorted || a.ledLegsSameNode;
    var ledUnreachable = !a.anodeFromSource && !a.cathodeFromSource;

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var unreachableWhy = LED_PIN_NAME + " 과 LED 를 먼저 이으면 판정합니다";

    var results = {
      "c-resistor": {
        ok: a.hasResistor,
        blocked: tangled || ledUnreachable,
        why: tangled ? tangledWhy : unreachableWhy
      },
      "c-anode": {
        ok: a.anodeFromSource && !a.cathodeFromSource,
        blocked: tangled,
        why: tangledWhy
      },
      "c-cathode": {
        ok: a.cathodeToGround && !a.anodeToGround,
        blocked: tangled,
        why: tangledWhy
      },
      "c-noshort": { ok: !a.shortCircuit && !net.shorted, blocked: false, why: "" },
      "c-tidy": { ok: dangling.length === 0 && stray.length === 0, blocked: false, why: "" }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: req.label,
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 5V 를 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted || a.shortCircuit,
      analysis: a,
      floating: floating,
      dangling: dangling,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 세 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).
   *   펼치면 세 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   *
   *   done 은 «그 두 자리가 이어졌는가» 만 본다. 브레드보드를 몇 번 거쳐 가도,
   *   구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   */
  var GOAL = [
    { id: "g1", from: SOURCE_NODE, to: "res:P1", alt: "res:P2", label: "우노 " + LED_PIN_NAME + " ↔ " + RESISTOR_OHM + "Ω 저항의 한쪽 끝" },
    { id: "g2", from: "res:P2", to: "led:A", alt: "res:P1", label: RESISTOR_OHM + "Ω 저항의 반대쪽 끝 ↔ LED 긴 다리 A(+)" },
    { id: "g3", from: "led:K", to: SINK_NODE, alt: null, label: "LED 짧은 다리 K(−) ↔ 우노 GND" }
  ];

  /**
   * 목표 세 줄이 저마다 이어졌는가.
   *
   * 저항은 방향이 없으므로 «어느 끝이든» 맞다 — 그래서 alt 를 함께 본다.
   *
   * ★ 위 세 줄은 «한 가지» 정답일 뿐이다. 저항을 LED 뒤에 두어도 정답이므로(명세 17.3 B),
   *   그렇게 이은 학생에게 세 줄이 모두 «아직» 으로 보이면 «내가 틀렸나» 하게 된다.
   *   그래서 회로가 이미 통과했는데 줄이 안 맞으면 equivalent 로 알린다.
   *
   * 돌려주는 것 : { lines, allDone, passed, equivalent }
   */
  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      var done = net.connected(net.find(g.from), net.find(g.to));
      if (!done && g.alt) {
        /* 저항을 뒤집어 꽂았어도 같은 회로다 */
        done =
          (g.id === "g1" && net.connected(net.find(g.from), net.find(g.alt))) ||
          (g.id === "g2" && net.connected(net.find(g.alt), net.find(g.to)));
      }
      return { id: g.id, label: g.label, ok: done };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 세 줄과 다르다 = «다르게 이었지만 맞다» */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);
    /* 저항은 «실제로 있는 자리» 에 적는다. 앞뒤 어느 쪽이든 정답이지만
       그린 대로 되비추어야 학생이 자기 회로를 알아본다. */
    var resHead = a.hasResistor && a.resistorSide === "head" ? " → " + a.resistanceOhm + "Ω 저항" : "";
    var resTail = a.hasResistor && a.resistorSide === "tail" ? " → " + a.resistanceOhm + "Ω 저항" : "";

    if (a.shortCircuit) {
      return LED_PIN_NAME + " 과 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    }
    if (a.ledLegsSameNode) {
      return "LED 의 두 다리가 같은 마디에 있습니다. 양단 전압이 0V 라 전류가 LED 를 지나지 않습니다.";
    }
    if (a.ledDirection === "none") {
      return LED_PIN_NAME + " 에서 LED 로 가는 길이 아직 없습니다.";
    }

    var head = a.ledDirection === "forward" ? "LED 긴 다리 A(+)" : "LED 짧은 다리 K(−)";
    var tail = a.ledDirection === "forward" ? "LED 짧은 다리 K(−)" : "LED 긴 다리 A(+)";

    if (!a.connected) {
      return (
        LED_PIN_NAME + resHead + " → " + head + " 까지 이어졌습니다. " +
        tail + " 에서 GND 로 가는 길이 아직 없습니다."
      );
    }

    var path = LED_PIN_NAME + resHead + " → " + head + " → " + tail + resTail + " → GND. ";

    if (a.ledDirection === "reverse") return path + "한 바퀴는 닫혔지만 LED 가 «거꾸로» 꽂혀 있습니다.";
    if (!a.hasResistor) return path + "한 바퀴는 닫혔지만 저항이 없습니다.";
    return path + "한 바퀴가 닫혔습니다.";
  }

  /** 아직 못 채운 조건의 다음 힌트 (level 은 0,1,2 로 올라간다 — 명세 18.2) */
  function hintFor(conditionId, level) {
    var req = null;
    REQUIRED.forEach(function (r) {
      if (r.id === conditionId) req = r;
    });
    if (!req) return "";
    var i = Math.max(0, Math.min(level || 0, req.hints.length - 1));
    return req.hints[i];
  }

  /* ------------------------------------------------------------------ */
  /* 7. 위험 연결과 대표 오류 (명세 6.2 · 18.2)                            */
  /* ------------------------------------------------------------------ */

  /**
   * 규칙을 배열로 둔 까닭 : 부품이 늘어도 이 배열에 한 줄 더하면 되고
   * 판정 코드는 그대로다.
   *
   * ★ 오류를 «뭉뚱그리지 않는다»(명세 12장 마지막 줄 · 29장 6번).
   *   역극성은 «꺼짐», 무저항은 «과전류 위험», GND 누락은 «열린 회로» 로 서로 다르다.
   */
  var DANGER_RULES = [
    {
      code: "short-5v-gnd",
      title: "5V–GND 단락",
      effect: "전원 차단",
      test: function (ctx) {
        return ctx.net.shorted;
      },
      detail:
        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",

      detail:
        "LED 의 긴 다리 A(+)와 짧은 다리 K(−)가 뒤바뀌었습니다. LED 는 전류를 한 방향으로만 흘리므로 " +

        "LED 의 두 다리가 같은 마디에 있습니다. 브레드보드의 «같은 열» 에 두 다리를 꽂으면 이렇게 됩니다. " +
        "양단 전압이 0V 라 전류가 LED 를 지나지 않고 옆으로 새어 갑니다.",
      fix: "브레드보드는 가운데 홈을 사이에 두고 열이 나뉩니다. 두 다리를 «서로 다른 열» 에 꽂으세요."

      effect: "부품 손상 위험",

      detail:
        "5V 를 − 레일에, 또는 GND 를 + 레일에 연결했습니다. 레일에 적힌 부호와 반대입니다.",

   *
   * 돌려주는 것 : { on, reason, text }
   * 색만으로 알리지 않으려고 «글» 도 함께 돌려준다(명세 13장).
   */

    var a = analyze(connections);

    if (a.shortCircuit) return { on: false, reason: "short", text: "단락 — 전원이 차단되었습니다." };
    if (a.ledLegsSameNode) {

    }

  /* 8. 멀티미터 (명세 6.3)                                               */
  /* ------------------------------------------------------------------ */

        ok: false,
        volts: null,
        text: "차단",

      return {
        ok: false,
        volts: null,
        text: "0.00 V",
        note: "전원이 꺼져 있습니다. [전원 켜기] 를 먼저 누르세요."

        ok: false,
        volts: null,
        text: "—",
        note: "한쪽 탐침이 «떠 있는» 자리에 있습니다. 전원이 이어진 곳끼리 재어 보세요."

    }

    var volts = Math.abs(va - vb);
    var sameNode = net.connected(nodeOf(a.component, a.pin), nodeOf(b.component, b.pin));

  }

  /* ------------------------------------------------------------------ */
  /* 9. 코드 핀과 회로 핀 대조 (명세 6.2 · 15장)                           */
  /* ------------------------------------------------------------------ */

  /** 코드가 적은 핀 값을 보드 단자 이름으로 (8 → "D8", "A0" → "A0") */

      var name = pinName(use.pin);
      if (used.indexOf(name) === -1) used.push(name);
      if (wired.indexOf(name) !== -1) return;

      problems.push({
        kind: "not-wired",
        codePin: name,
        circuitPin: wired.length === 1 ? wired[0] : "",
        line: use.line,
        message:
          wired.length === 1
            ? "코드 " + name + ", 회로 " + wired[0] + " 불일치 — 둘을 같은 핀으로 맞추세요."
            : "코드는 " + name + " 을(를) 쓰는데 회로에서 " + name + " 에 연결된 케이블이 없습니다." +

    });

    /* 반대로 «회로에는 있는데 코드가 안 쓰는» 핀 */
    wired.forEach(function (id) {
      if (used.indexOf(id) !== -1) return;
      problems.push({
        kind: "not-used",
        codePin: "",
        circuitPin: id,
        line: 0,
        message: "회로는 " + id + " 에 연결되어 있는데 코드에서 " + id + " 을(를) 쓰지 않습니다."

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.circuit = {
    PITCH: PITCH,
    HEADER_PITCH: HEADER_PITCH,
    UNO: UNO,
    BB: BB,
    LED: LED,
    RES: RES,
    COMPONENTS: COMPONENTS,
    PARTS: PARTS,
    DEVICES: DEVICES,
    SOURCE_NODE: SOURCE_NODE,
    SINK_NODE: SINK_NODE,
    LED_PIN_NAME: LED_PIN_NAME,
    RESISTOR_OHM: RESISTOR_OHM,
    REQUIRED: REQUIRED,
    GOAL: GOAL,
    FIND_TASKS: FIND_TASKS,
    PROBE_TASKS: PROBE_TASKS,
    DANGER_RULES: DANGER_RULES,
    KIND_WORD: KIND_WORD,
    terminal: terminal,
    describe: describe,
    nodeOf: nodeOf,
    nodeLabel: nodeLabel,
    makeConnection: makeConnection,
    suggestColor: suggestColor,
    connectionKey: connectionKey,
    sameConnection: sameConnection,
    hasConnection: hasConnection,
    solve: solve,
    analyze: analyze,
    pathsBetween: pathsBetween,
    floatingLeads: floatingLeads,
    danglingLeads: danglingLeads,
    strayWires: strayWires,
    isWired: isWired,
    wireSides: wireSides,
    ledState: ledState,
    checkFind: checkFind,
    checkCircuit: checkCircuit,
    hintFor: hintFor,
    goalStatus: goalStatus,
    describeCurrent: describeCurrent,
    dangers: dangers,
    canPowerOn: canPowerOn,
    measure: measure,

    pinMismatch: pinMismatch

        continue;

        return ast.functions.setup
          ? { ok: true }
          : { ok: false, message: "void setup() { } 가 없습니다. 처음 한 번만 할 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-loop",
      label: "loop() 함수가 있다",
      run: function (ast) {
        return ast.functions.loop
          ? { ok: true }
          : { ok: false, message: "void loop() { } 가 없습니다. 되풀이할 일을 여기에 적습니다." };
      }
    },
    {
      id: "t-pinmode",
      label: "setup() 에서 pinMode(ledPin, OUTPUT) 으로 출력을 정한다",
      run: function (ast) {
        var found = callsIn(ast, "setup").filter(function (c) {
          return callName(c) === "pinMode";
        });
        if (found.length === 0) {
          var elsewhere = callsIn(ast, "loop").filter(function (c) {
            return callName(c) === "pinMode";
          });
          return {
            ok: false,
            message: elsewhere.length
              ? "pinMode 가 loop() 안에 있습니다. 핀의 «역할» 을 정하는 일은 한 번이면 되므로 setup() 에 적습니다."
              : "setup() 안에 pinMode(...) 가 없습니다. 핀을 출력으로 쓸 것이라고 먼저 알려 주어야 합니다."
          };
        }
        var call = found[0];
        var first = (call.args || [])[0];
        var mode = (call.args || [])[1];
        if (!first || !(first.kind === "variable" && first.name === "ledPin") && first.kind !== "number") {
          return { ok: false, message: "pinMode 의 첫 번째 값에는 핀을 적습니다. ledPin 을 그대로 쓰면 됩니다." };
        }
        if (!mode || mode.kind !== "constant" || mode.name !== "OUTPUT") {
          return {
            ok: false,
            message: "pinMode 의 두 번째 값이 OUTPUT 이 아닙니다. LED 는 아두이노가 «내보내는» 쪽이므로 OUTPUT 입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-high",
      label: "loop() 에서 digitalWrite(ledPin, HIGH) 로 LED 를 켠다",
      run: function (ast) {
        return writesIn(ast, "HIGH").length > 0
          ? { ok: true }
          : {
              ok: false,
              message: "loop() 안에 digitalWrite(ledPin, HIGH); 가 없습니다. HIGH 는 높은 전압을 내보내라는 뜻입니다."
            };
      }
    },
    {
      id: "t-low",
      label: "loop() 에서 digitalWrite(ledPin, LOW) 로 LED 를 끈다",
      run: function (ast) {
        return writesIn(ast, "LOW").length > 0
          ? { ok: true }
          : {
              ok: false,
              message: "loop() 안에 digitalWrite(ledPin, LOW); 가 없습니다. LOW 를 내보내지 않으면 LED 가 계속 켜져 있습니다."
            };
      }
    },
    {
      id: "t-delay",
      label: "켜기와 끄기 «사이» 에 delay() 가 있다",
      run: function (ast, ctx) {
        var loop = ast.functions.loop;
        if (!loop) return { ok: false, message: "loop() 가 없습니다." };

        var seq = statementCalls(loop.body);
        var anyDelay = seq.some(function (c) {
          return callName(c) === "delay";
        });
        if (!anyDelay) {
          return {
            ok: false,
            message: "delay(...) 가 없습니다. 기다리지 않으면 켜고 끄는 일이 너무 빨라 눈에 보이지 않습니다."
          };
        }

        /**
         * ★ delay 가 «몇 개 있는가» 가 아니라 «LED 가 켜져 있는 시간이 0 이 아닌가» 를 본다.
         *
         *   digitalWrite(ledPin, HIGH);
         *   digitalWrite(ledPin, LOW);
         *   delay(1000);
         *
         *   이 코드에는 delay 가 있지만 켜진 시간이 0ms 라 불이 보이지 않는다.
         *   줄의 «차례» 만 세면 이것을 놓치므로, 실제로 돌려 보고 켜진 길이를 잰다.
         */
        /* HIGH 나 LOW 가 아예 없으면 그것은 앞의 두 항목이 짚어 준다.
           여기서까지 나무라면 한 가지 실수에 두 줄이 빨개져 무엇을 고칠지 흐려진다. */
        if (writesIn(ast, "HIGH").length === 0 || writesIn(ast, "LOW").length === 0) return { ok: true };

        var source = ctx && ctx.source;
        if (!source) return { ok: true };

        /* 회로가 D11 이 아니어도 «코드가 쓰는 핀» 으로 재야 한다.
           핀이 다른 것은 8번 항목이 따로 짚는다. */
        var phases = ledPhases(run(source, { loopLimit: 3, ledPin: codeLedPin(ast) }));
        var litLong = phases.filter(function (p) {
          return p.on && p.ms > 0;
        });
        var darkLong = phases.filter(function (p) {
          return !p.on && p.ms > 0;
        });

        if (litLong.length === 0) {
          return {
            ok: false,
            message:
              "LED 가 켜져 있는 시간이 0ms 입니다. 켠 «바로 뒤» 에 delay() 를 두어야 켜진 것이 눈에 보입니다."
          };
        }
        if (darkLong.length === 0) {
          return {
            ok: false,
            message: "LED 가 꺼져 있는 시간이 0ms 입니다. 끈 «바로 뒤» 에도 delay() 를 두어야 깜빡임이 보입니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pin-match",
      label: "코드의 핀 번호가 회로에 이은 핀과 같다",
      run: function (ast, ctx) {
        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0) {
          return { ok: false, message: "3단계에서 회로를 먼저 이어 주세요. 이을 핀이 없으면 맞대어 볼 수 없습니다." };
        }
        var problems = PC.circuit ? PC.circuit.pinMismatch(pinsUsed(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite"];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2 · 17.4 8번)
   *
   * ★ ledPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   *   풀지 않으면 회로와 맞대어 볼 수 없어 8번 검사가 늘 실패한다.
   */
  function pinsUsed(ast) {
    var uses = [];

    /* 전역에서 숫자로 초기화한 이름만 모은다. 나중에 바뀌는 값은 알 수 없으므로 세지 않는다. */
    var known = {};
    (ast.globals || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = { connections: (ctx && ctx.connections) || [], source: source };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *   opts.ledPin    : 어느 핀이 LED 인가 (기본 11)
   *
   * 돌려주는 것 : { ok, trace, console, pins, led, elapsed, stopped, error }
   *   trace 의 한 칸 = { t, line, kind, text, phase, iteration, ledOn }
   *
   * ★ led.timeline 은 «불이 바뀐 순간» 만 담는다(명세 19장 ledOn).
   *   5단계에서 켜짐·꺼짐 시간을 재고, 4단계에서 LED 그림을 물들이는 데 쓴다.
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: {},
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var ledPin = o.ledPin === undefined ? (PC.LED_PIN === undefined ? 11 : PC.LED_PIN) : o.ledPin;

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      pinModes: {},
      pinValues: {},
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0,
      /* 명세 19장 — LED 가 지금 켜져 있는가 */
      ledOn: false,
      ledTimeline: []
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration,
        ledOn: state.ledOn
      });
    }

    /** LED 핀의 값이 바뀌었을 때만 timeline 에 한 칸 남긴다 */
    function noteLed(pin, value, line) {
      if (String(pin) !== String(ledPin)) return;
      var on = value ? true : false;
      if (state.ledTimeline.length > 0 && state.ledOn === on) return;
      state.ledOn = on;
      state.ledTimeline.push({ t: state.t, on: on, line: line });
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    /**
     * 아날로그 입력을 읽는다.
     * 핀은 analogRead(A0) 처럼 «이름» 으로도, analogRead(0) 처럼 «번호» 로도 올 수 있다.
     * 둘 다 sensors 의 A0 칸을 보게 맞춘다.
     */
    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          var line = {
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          };
          state.out.push(line);
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] = node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, "D" + args[0] + " → " + state.pinModes[args[0]]);
          return 0;

        case "digitalWrite": {
          var value = args[1] ? 1 : 0;
          state.pinValues[args[0]] = value;
          noteLed(args[0], value, node.line);
          record("pin-write", node.line, "D" + args[0] + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, "D" + args[0] + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          state.t += ms;
          record("delay", node.line, String(ms));
          return 0;
        }

        case "millis":
          return state.t;

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        state.vars[g.name] = g.init ? evaluate(g.init) : 0;
      });

      state.phase = "setup";
      record("phase", ast.functions.setup ? ast.functions.setup.line : 0, "setup() 시작");
      if (ast.functions.setup) execBlock(ast.functions.setup.body);
      record("phase-end", 0, "setup() 끝 — 여기까지는 «한 번만» 실행됩니다.");

      state.phase = "loop";
      if (ast.functions.loop) {
        for (var i = 0; i < loopLimit; i += 1) {
          state.iteration = i + 1;
          record("phase", ast.functions.loop.line, "loop() " + (i + 1) + "번째");
          execBlock(ast.functions.loop.body);
        }
        stopped = "loop-limit";
      }
    } catch (err) {
      if (err && err.name === "StopRun") {
        stopped = err.reason === "steps" ? "step-limit" : "runtime";
        if (err.reason !== "steps") error = { line: 0, message: err.reason, code: "runtime" };
      } else {
        stopped = "runtime";
        error = { line: 0, message: "실행 중 문제가 생겼습니다.", code: "runtime" };
      }
    }

    return {
      ok: error === null,
      trace: state.trace,
      console: state.out,
      pins: { modes: state.pinModes, values: state.pinValues },
      serial: state.serial,
      led: {
        pin: ledPin,
        mode: state.pinModes[ledPin] || "",
        on: state.ledOn,
        timeline: state.ledTimeline,
        blinks: state.ledTimeline.filter(function (m) {
          return m.on;
        }).length
      },
      elapsed: state.t,
      stopped: stopped,
      error: error
    };

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== digits) {
      errors.studentId = "학번은 " + digits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro":
        /* 시작 화면에서는 «묻지 않는다». 아직 배우지 않았으므로
           확인 질문 대신 안전 수칙 확인만으로 다음 단계를 연다. */
        if (!s.intro || s.intro.safetyRead !== true) {
          reasons.push("안전 수칙을 읽고 확인해 주세요.");
        }
        break;

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = (PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3);
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        var c = s.circuit || {};
        if (c.findDone !== true) reasons.push("부품과 단자 찾기(3A)를 마쳐 주세요.");
        if (c.checkPassed !== true) reasons.push("[회로 점검] 의 다섯 항목을 모두 채워 주세요.");
        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 주기(켜짐 → 꺼짐)를 끝까지 관찰해 주세요.");
          break;
        }
        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " + (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★ 세 실험을 «모두» 실행하고 «세 칸을 모두» 채워야 통과한다.
         *
         *   명세 17.5 는 «최소 두 실험» 이지만, 선생님 요청으로 셋 다로 올렸다(2026-08-19).
         *   A·B·C 를 견주어 보는 것이 이 단계의 목적이라 하나라도 빠지면 견줄 것이 없다.
         *
         *   확장 활동(짧게 두 번 깜빡인 뒤 2초 쉬기)은 통과 조건이 «아니다» — 접어 둔 선택 활동이다.
         */
        var e = s.experiment || {};
        var runs = e.runs || {};
        var items = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

        var notRun = [];
        var notWritten = [];

        items.forEach(function (item) {
          var r = runs[item.id] || {};
          if (r.ran !== true) {
            notRun.push(item.label);
            return;
          }
          /* 실행한 실험만 «빈칸» 을 따진다 — 아직 못 한 실험까지 나무라면 할 일이 겹쳐 보인다 */
          var blanks = [];
          if (contentLength(r.predict) < 4) blanks.push("예상");
          if (contentLength(r.observation) < (LIMITS.observationMin || 10)) blanks.push("관찰");
          if (contentLength(r.surprise) < 2) blanks.push("예상과 다른 점");
          if (blanks.length > 0) notWritten.push(item.label + "(" + blanks.join("·") + ")");
        });

        if (notRun.length > 0) {
          reasons.push("아직 실행하지 않은 실험이 있습니다 : " + notRun.join(", "));
        }
        if (notWritten.length > 0) {
          reasons.push(
            "아직 비어 있는 칸이 있습니다 : " +
              notWritten.join(", ") +
              " (관찰은 " +
              (LIMITS.observationMin || 10) +
              "자 이상)"
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.2) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 3단계 — 회로 (명세 10장) */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: Number(circuit.attempts) || 0,
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: Number(circuit.findAttempts) || 0,
        hintsUsed: Number(circuit.hintsUsed) || 0,
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 명세 18.1 «부품 경로 검사 결과» 를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              ledDirection: text(circuit.path.ledDirection),
              hasResistor: circuit.path.hasResistor === true,
              resistanceOhm: Number(circuit.path.resistanceOhm) || 0,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험 (명세 10장 · 17.5) */
      experiment: {
        conditions: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              label: clip(item.label, 60),
              onMs: Number(item.onMs) || 0,
              offMs: Number(item.offMs) || 0,
              ran: r.ran === true,
              blinks: Number(r.blinks) || 0,
              elapsed: Number(r.elapsed) || 0
            };
          }),
        observations: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax),
              surprise: clip(r.surprise, LIMITS.textMax)
            };
          }),
        /* 확장 활동 — 짧게 두 번 깜빡인 뒤 2초 쉬기 (명세 17.5) */
        extension: {
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          tried: experiment.extensionTried === true
        }
      },

      /* 6단계 — 형성평가 (명세 10장) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: Number(assessment.attempts) || 0
      }
    };
  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)
   * 학번과 이름과 차시가 같으면 같은 제출로 본다.
   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    function num(v) {
      var n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 명세 18.1 «부품 경로 검사 결과» 를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              ledDirection: text(circuit.path.ledDirection),
              hasResistor: circuit.path.hasResistor === true,
              resistanceOhm: Number(circuit.path.resistanceOhm) || 0,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        mode: text(code.mode),
        syntaxErrors: Array.isArray(code.syntaxErrors) ? code.syntaxErrors : [],
        pinMismatch: Array.isArray(code.pinMismatch) ? code.pinMismatch : []
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        extension: experiment.extension || { source: "", tried: false }
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();
    </script>

    <!-- 학생용 화면 -->
    <script data-from="student/s00-core.js">
/**
 * 학생용 코어 — 이름 공간과 상태 그릇
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.PC 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → constants → lesson → circuit → arduino → quiz → schema
 *   → s00-core → s10-ui → s20-store → s30-api → s40-board → s50-editor → s60-screens → s90-app
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /** 빈 상태 — 처음 열었을 때의 출발점 */
  function emptyState() {
    return {
      version: 1,
      /* STEPS 의 자리 번호 (0 = 시작하기) */
      step: 0,
      student: { studentId: "", name: "" },

      /* 1단계 — 시작 화면. 넘어가는 조건은 «안전 수칙 확인» 하나다. */
      intro: { safetyRead: false },

      /* 2단계 */
      concept: { opened: {}, checkChoices: {}, checks: {} },

      /* 3단계 — A 부품·단자 찾기 → B 케이블 연결 → C 점검과 전원 인가 (명세 17.3) */
      circuit: {
        findIndex: 0,
        findDone: false,
        findAttempts: 0,
        findPicks: {},
        connections: [],
        attempts: 0,
        errors: [],
        hintsUsed: 0,
        hintLevels: {},
        checkPassed: false,
        checked: false,
        powerOn: false,
        /* 명세 18.1 «부품 경로 검사 결과» — 제출 자료에 그대로 담긴다 */
        path: null,
        probeIndex: 0,
        probeDone: false,
        lastMeasure: null
      },

      /* 4단계 — exampleRun·learned 는 «먼저 읽었는가» 를 기억한다.
         읽기 전에는 작성 칸을 내보내지 않는다. */
      code: {
        exampleRun: false,
        learned: false,
        mode: "assemble",
        assembleOrder: [],
        blanks: {},
        source: "",
        testsPassed: 0,
        testsTotal: 0,
        attempts: 0,
        ran: false,
        syntaxErrors: [],
        pinMismatch: []
      },

      /* 5단계 — 실험 A·B·C 를 저마다 «예상 → 실행 → 관찰» 로 기록한다 (명세 17.5)
         runs 의 한 칸 = { predict, ran, blinks, elapsed, observation, surprise } */
      experiment: { runs: {}, lastRun: null, extensionSource: "", extensionTried: false },

      /* 6단계
         sealed = «답안을 냈다». 서버로 보내거나 JSON 으로 받아 낸 그 순간 참이 된다.
         참이 되면 답을 고칠 수 없고, 그때 비로소 [채점하기] 가 열린다.
         정답과 해설을 먼저 보고 답을 고치는 일을 막는 것이다. */
      assessment: { answers: {}, attempts: 0, graded: false, sealed: false },

      submissionId: "",
      submitted: null
    };
  }

  function bool(value) {
    return value === true;
  }

  function num(value) {
    var n = Number(value);
    return isNaN(n) ? 0 : n;
  }

  function str(value) {
    return value === null || value === undefined ? "" : String(value);
  }

  function plainObject(value) {
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  }

  function array(value) {
    return Array.isArray(value) ? value : [];
  }

  /**
   * 저장해 둔 자료를 지금 형태에 맞춘다.
   * 예전에 저장한 자료에 빠진 칸이 있어도 화면이 깨지지 않게 한다.
   */
  function normalizeState(raw) {
    var base = emptyState();
    var r = plainObject(raw);
    var steps = PC.STEPS || [];

    base.step = num(r.step);
    if (base.step < 0 || base.step >= steps.length) base.step = 0;

    var student = plainObject(r.student);
    base.student.studentId = str(student.studentId);

    base.circuit.findIndex = num(circuit.findIndex);

    base.circuit.probeDone = bool(circuit.probeDone);

        ran: bool(item.ran),

    base.assessment.answers = plainObject(assessment.answers);
    base.assessment.attempts = num(assessment.attempts);
    base.assessment.graded = bool(assessment.graded);
    base.assessment.sealed = bool(assessment.sealed);

    base.submitted = r.submitted || null;

    /* 이미 제출을 마친 자료라면 답안은 잠긴 것이다.

    if (base.submitted) base.assessment.sealed = true;

       전원을 켠 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 켜져 있어서는 안 된다.
       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {

    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* ★ 전원은 «켰다» 는 기록만으로 유지하지 않는다.
       전원을 켠 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 켜져 있어서는 안 된다.
       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다.
       (저장 자료를 손으로 고쳐 단계를 건너뛰지 못하게) */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {
    if (!state) return false;
    if (state.circuit.connections.length > 0) return true;
    if (state.code.source) return true;
    if (Object.keys(state.experiment.runs || {}).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.intro.safetyRead || Object.keys(state.concept.checks).length > 0) return true;
    return false;
  }

  /** 시각을 「2026-08-18 10:20:31」 로 */
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  S.emptyState = emptyState;
  S.normalizeState = normalizeState;
  S.hasContent = hasContent;
  S.formatTime = formatTime;

    toast: toast,
    announce: announce
  };
})();

    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical2-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();
