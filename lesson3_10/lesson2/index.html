      },

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험 (명세 10장 · 17.5) */
      experiment: {
        conditions: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              label: clip(item.label, 60),
              onMs: Number(item.onMs) || 0,
              offMs: Number(item.offMs) || 0,
              ran: r.ran === true,
              blinks: Number(r.blinks) || 0,
              elapsed: Number(r.elapsed) || 0
            };
          }),
        observations: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {

              observation: clip(r.observation, LIMITS.textMax),

          return {
            id: q.id,

      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")

    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));

  function el(tag, opts, children) {

    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {

  /**

    <script data-from="teacher/t10-data.js">
/**
 * 자료 불러오기와 통계 (명세 11장)
 *
 * 두 가지 길로 받는다.
 *   ① 업로드   : 학생이 내려받은 JSON 파일 여러 개를 한꺼번에 고른다
 *   ② 서버 목록: Apps Script 웹앱 주소로 물어 본다 (Google Drive 에 쌓인 제출)
 *
 * ★ 받은 자료는 «메모리에만» 둔다. localStorage 에 넣지 않는다(명세 13장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /* 화면이 살아 있는 동안만 갖고 있는 제출 목록 */
  var submissions = [];

  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /* ------------------------------------------------------------------ */
  /* 서버에 물어보기                                                      */
  /*                                                                    */
  /* ★ 두 가지 길로 물어본다. 한 길이 막혀도 다른 길로 간다.               */
  /*                                                                    */
  /*   ① fetch  — 보통 이것으로 된다                                     */
  /*   ② JSONP  — <script> 로 읽어 온다. CORS 를 타지 않는다              */
  /*                                                                    */
  /*   교사용 HTML 은 파일 하나짜리라 선생님이 보통 file:// 로 연다.        */
  /*   그때 출처(origin)가 null 이라 fetch 가 CORS 에 막히는데,            */
  /*   예전에는 그대로 «서버에 물어보고 있어요…» 에서 멈춰 있었다.          */
  /* ------------------------------------------------------------------ */

  /** 아무리 늦어도 이만큼 지나면 «못 했다» 고 알린다 (그냥 멈춰 있으면 안 된다) */
  var TIMEOUT_MS = 12000;

  var jsonpSeq = 0;

  /** 약속이 늦어지면 스스로 끊는다 */
  function withTimeout(promise, ms, message) {

      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error(message));

      promise.then(
        function (value) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(value);
        },
        function (err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(err);

    });

   * 서버가 callback 이름으로 감싼 자바스크립트를 돌려주므로 CORS 검사를 받지 않는다.
   */

        reject(new Error("이 환경에서는 JSONP 를 쓸 수 없습니다."));
        return;
      }

      jsonpSeq += 1;
      var name = "__pcTeacherCb" + jsonpSeq;
      var script = document.createElement("script");
      var done = false;

      function finish(err, data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          delete root[name];
        } catch (e) {
          root[name] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err);
        else resolve(data);

        finish(
          new Error(
            "서버가 제때 답하지 않았습니다. 주소가 /exec 로 끝나는지, " +
              "Code.gs 를 고친 뒤 «새 배포» 로 다시 올렸는지 확인해 주세요."
          )

      }, TIMEOUT_MS);

      root[name] = function (data) {
        finish(null, data);
      };

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name;
      script.onerror = function () {
        finish(
          new Error(

            throw new Error(
              "서버가 JSON 을 주지 않았습니다. 배포에서 실행을 «나», 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."

  /* 담기                                                                */
  /* ------------------------------------------------------------------ */

   * 돌려주는 것 : 'added' | 'updated' | 'kept' | 'skipped'
   */
  function put(raw) {
    if (!PC.schema.isThisLesson(raw)) return "skipped";

    var next = PC.schema.normalizeSubmission(raw);
    if (!next.studentId && !next.studentName) return "skipped";

    var key = PC.schema.dedupeKey(next);
    for (var i = 0; i < submissions.length; i += 1) {
      if (PC.schema.dedupeKey(submissions[i]) !== key) continue;

      var oldAt = submissions[i].serverUpdatedAt || submissions[i].submittedAt || "";
      var newAt = next.serverUpdatedAt || next.submittedAt || "";
      if (newAt >= oldAt) {
        submissions[i] = next;

      }
      return "kept";

    return "added";

  /** JSON 글 한 덩어리를 담는다. 배열이어도, 하나여도, {items:[...]} 여도 받는다. */
  function putText(text) {

          reader.onload = function () {

          };
          reader.onerror = function () {
            resolve({ name: file.name, text: null });

      .then(function (data) {

    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

      return { ok: false, message: err && err.message ? err.message : "확인하지 못했습니다." };

  function all() {
    return submissions.slice();
  }

  function clearAll() {
    submissions = [];
  }

  function count() {
    return submissions.length;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 11장 1번)                                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 전체 요약.

   */
  function summary(list, expected) {
    var rows = list || [];
    var total = rows.length;
    var scores = rows.map(function (r) {
      return r.assessment.score;
    });
    var passed = rows.filter(function (r) {
      return r.assessment.pass;
    }).length;

    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);

    /* 점수 분포 — 0,2,4,6,8,10 여섯 칸 */
    var buckets = [0, 2, 4, 6, 8, 10].map(function (v) {
      return {
        score: v,
        count: scores.filter(function (s) {
          return s === v;

      };

      total: total,
      expected: Number(expected) || 0,
      submitRate: expected ? T.core.percent(total, Number(expected)) : 0,

      highest: total ? Math.max.apply(null, scores) : 0,
      lowest: total ? Math.min.apply(null, scores) : 0,

    var rows = list || [];
    return PC.quiz.QUESTIONS.map(function (q, index) {

      var correct = 0;

      rows.forEach(function (r) {

        id: q.id,
        no: q.no,
        type: q.type,
        stem: q.stem,

        var answerIndex = PC.quiz.recoverChoiceIndex(q);

        stat.worstChoices = stat.distribution
          .filter(function (d) {
            return d.index !== answerIndex && d.count > 0;
          })
          .sort(function (a, b) {
            return b.count - a.count;
          })
          .slice(0, 2);
      } else {
        stat.texts = answered.map(function (a) {
          return {
            studentId: a.studentId,
            studentName: a.studentName,
            text: String(a.value || ""),
            correct: a.correct
          };
        });
      }

      return stat;
    });
  }

  /** 회로 수행 분석 (명세 11장 3번) */
  function circuitStats(list) {
    var rows = list || [];
    var errorCount = {};
    var dangerStudents = 0;

    rows.forEach(function (r) {
      var seen = {};
      (r.circuit.errors || []).forEach(function (e) {
        var code = e && e.code ? e.code : "unknown";
        errorCount[code] = (errorCount[code] || 0) + 1;
        seen[code] = true;

      if (Object.keys(seen).length > 0) dangerStudents += 1;
    });

    /* 규칙 이름을 사람 말로 바꾼다 */
    var titleOf = {};
    PC.circuit.DANGER_RULES.forEach(function (rule) {
      titleOf[rule.code] = rule.title;
    });

    var frequent = Object.keys(errorCount)
      .map(function (code) {
        return { code: code, title: titleOf[code] || code, count: errorCount[code] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });

    var attempts = rows.map(function (r) {
      return r.circuit.attempts;
    });

    return {
      total: rows.length,
      completed: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      hintUsers: rows.filter(function (r) {
        return r.circuit.hintsUsed > 0;
      }).length,
      dangerStudents: dangerStudents,
      frequent: frequent
    };
  }

  /** 코드 수행 분석 (명세 11장 4번) */
  function codeStats(list) {
    var rows = list || [];
    return {
      total: rows.length,
      allPassed: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length,
      withSyntaxError: rows.filter(function (r) {
        return (r.code.syntaxErrors || []).length > 0;
      }).length,
      withPinMismatch: rows.filter(function (r) {
        return (r.code.pinMismatch || []).length > 0;
      }).length,
      modes: ["assemble", "blank", "edit"].map(function (mode) {
        return {
          mode: mode,
          count: rows.filter(function (r) {
            return r.code.mode === mode;
          }).length
        };
      })
    };
  }

  /**
   * 상위 3명 (명세 11장 마지막 줄)
   *   점수 → 회로 오류 적음 → 코드 테스트 통과 → 제출 시각(빠른 순)
   */
  function topThree(list) {
    return (list || [])
      .slice()
      .sort(function (a, b) {
        if (b.assessment.score !== a.assessment.score) return b.assessment.score - a.assessment.score;

        var aErr = (a.circuit.errors || []).length;
        var bErr = (b.circuit.errors || []).length;
        if (aErr !== bErr) return aErr - bErr;

        if (b.code.testsPassed !== a.code.testsPassed) return b.code.testsPassed - a.code.testsPassed;

        var at = a.serverUpdatedAt || a.submittedAt || "";
        var bt = b.serverUpdatedAt || b.submittedAt || "";
        return at < bt ? -1 : at > bt ? 1 : 0;
      })
      .slice(0, 3);
  }

  T.data = {
    pingServer: pingServer,
    put: put,
    putText: putText,
    readFiles: readFiles,
    fetchFromServer: fetchFromServer,
    all: all,
    clearAll: clearAll,
    count: count,
    summary: summary,
    questionStats: questionStats,
    circuitStats: circuitStats,
    codeStats: codeStats,
    topThree: topThree,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.data;
})();

    var view = new DataView(buffer);
    var bytes = new Uint8Array(buffer);
    var eocd = findEocd(view);

      if (seen[id]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 썼어요.");
        return;
      }
      seen[id] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }

    return { students: students, warnings: warnings, columns: picked };
  }

  /** 명단 파일을 읽어 { students, warnings, columns } 를 돌려준다 */
  function parseFile(file) {
    var name = String((file && file.name) || "").toLowerCase();

    if (name.slice(-4) === ".xls") {
      return Promise.reject(
        new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.")
      );
    }

    var readRows = name.slice(-5) === ".xlsx" ? readXlsx(file) : file.text().then(splitDelimited);
    return readRows.then(fromRows);
  }

  /** 학번 비교용 표준형 — 앞의 0 과 공백·기호를 없앤다 */
  function normalizeId(value) {
    var raw = String(value === null || value === undefined ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  T.roster = {
    parseFile: parseFile,
    normalizeId: normalizeId,
    /* 아래 둘은 검사에서 쓴다 (파일 없이 판단만 확인한다) */
    fromRows: fromRows,
    splitDelimited: splitDelimited
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.roster;
})();
    </script>
    <script data-from="teacher/t30-views.js">
/**
 * 교사용 화면 조각 (명세 11장)
 *
 *   summary   전체 요약        (2장)
 *   podium    상위 3명 시상대   (2장)
 *   quiz      문항별 정답률     (3장)
 *   circuit   회로 수행        (4장)
 *   code      코드 수행        (4장)
 *   experiment 실험 기록       (4장)
 *
 * 하나하나 render(rows) 하나씩이고, rows 는 제출 목록이다.
 * 화면을 «장(page)» 으로 묶는 일은 t90-main.js 가 한다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  function section(title, children) {
    return el("section", { class: "t-block" }, [
      el("h3", { class: "t-block__title", text: title })
    ].concat(children || []));
  }

  /* ================================================================== */
  /* 전체 요약 (명세 11장 1번) — 2장                                      */
  /* ================================================================== */

  function renderSummary(rows, options) {
    var box = el("div");
    var o = options || {};
    var s = T.data.summary(rows, o.expected);

    if (rows.length === 0) {
      box.appendChild(K.empty("아직 불러온 제출이 없습니다. 1장에서 자료를 먼저 불러오세요."));
      return box;
    }

    box.appendChild(
      K.statRow([
        K.statCard("제출 학생", s.total, "", "명"),
        K.statCard("평균 점수", s.average, "", "/ " + s.maxScore + "점"),
        K.statCard("최고 점수", s.highest, "", "점"),
        K.statCard("최저 점수", s.lowest, "", "점"),
        K.statCard("만점자", s.perfect, "", "명"),
        /* 이 차시는 6점 이상이 이수다 — 선생님이 가장 먼저 보는 숫자여서 함께 둔다 */
        K.statCard("이수", s.passed, "미이수 " + s.failed + "명 · " + s.passRate + "%", "명")
      ])
    );

    box.appendChild(
      el("p", {
        class: "panel__hint",
        text:
          "형성평가는 5문항 · 총 " + s.maxScore + "점이고 " + PC.ASSESS.passScore +
          "점 이상이면 이수입니다. 회로와 코드 수행은 4장의 표에서 볼 수 있습니다."
      })
    );

    return box;
  }

  /* ================================================================== */
  /* 상위 3명 시상대 (명세 11장 1번)                                       */
  /*                                                                    */
  /* 모양을 lesson3_7_1 교사용과 같게 맞추었다 — 메달·등수 딱지·칭찬 한 줄.   */
  /* ================================================================== */

  var MEDALS = ["🥇", "🥈", "🥉"];
  var RANK_TITLE = ["1등", "2등", "3등"];

  /** 무엇을 잘했는지 골라 칭찬한다. 점수만 말하면 남는 것이 없다. */
  function praiseFor(rank, row) {
    var score = row.assessment.score;
    var errors = (row.circuit.errors || []).length;
    var passed = row.code.testsPassed;
    var total = row.code.testsTotal || 6;

    if (score >= 10 && errors === 0) {
      return "형성평가 만점에 회로도 한 번의 위험한 연결 없이 마쳤어요. 오늘 배운 것을 모두 이해했습니다.";
    }
    if (errors === 0 && passed >= total) {
      return "회로와 코드를 모두 깔끔하게 마쳤어요. 다음 차시의 센서 연결도 잘할 수 있겠습니다.";
    }
    if (score >= 8) {
      return "핵심 개념을 잘 잡았어요. 틀린 문항의 해설만 한 번 더 읽으면 완벽합니다.";
    }
    if (rank === 1) {
      return "이번 시간 가장 높은 점수예요. 끝까지 해낸 것이 무엇보다 좋습니다.";
    }
    return "끝까지 해냈어요. 오늘 만든 회로와 코드가 다음 차시의 밑거름이 됩니다.";
  }

  function renderPodium(rows) {
    var box = el("div");
    var top = T.data.topThree(rows);

    box.appendChild(
      el("p", {
        class: "panel__hint",
        text: "점수 → 회로 오류가 적은 순 → 코드 검사 통과 → 제출이 빠른 순으로 뽑습니다."
      })
    );

    if (!top.length) {
      box.appendChild(el("p", { class: "t-empty", text: "표시할 학생이 없어요." }));
      return box;
    }

    box.appendChild(
      el("div", { class: "t-podium" }, top.map(function (r, i) {
        return el("article", { class: "t-card t-card--" + (i + 1) }, [
          el("div", {}, [
            el("span", { class: "t-card__medal", attrs: { "aria-hidden": "true" }, text: MEDALS[i] || "🎖" }),
            el("span", { class: "t-card__rank", text: RANK_TITLE[i] || i + 1 + "등" })
          ]),
          el("h3", { class: "t-card__name", text: r.studentName || "(이름 없음)" }),
          el("p", { class: "t-card__meta", text: "학번 " + (r.studentId || "-") }),
          el("p", { class: "t-card__score" }, [
            el("span", { text: String(r.assessment.score) }),
            el("small", { text: " 점 / " + (r.assessment.total || 10) + "점" })
          ]),
          el("p", { class: "t-card__meta", text:
            "회로 오류 " + (r.circuit.errors || []).length + "회 · 코드 " +
            r.code.testsPassed + "/" + r.code.testsTotal + " · " +
            K.fmtTime(r.serverUpdatedAt || r.submittedAt)
          }),
          el("p", { class: "t-card__praise", text: (r.studentName || "학생") + " 님, " + praiseFor(i + 1, r) })
        ]);
      }))
    );

    return box;
  }

  /* ================================================================== */
  /* 문항별 정답률 (명세 11장 2번) — 3장                                  */
  /* ================================================================== */

  function renderQuiz(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var stats = T.data.questionStats(rows);

    /* 문항별 정답률 한눈에 */
    box.appendChild(
      section(
        "문항별 정답률",
        stats.map(function (q) {
          return K.bar(q.no + "번 (" + q.tag + ")", q.correct, q.total, { strong: q.rate >= 70 });
        })
      )
    );

    stats.forEach(function (q) {
      var parts = [
        el("p", { class: "t-stem", text: q.stem }),
        el("p", { class: "t-rate" }, [
          el("span", { class: "t-rate__num", text: q.rate + "%" }),
          el("span", { text: " 정답 (" + q.correct + " / " + q.total + "명)" })
        ])
      ];

      if (q.type === "choice") {
        var question = PC.quiz.byId(q.id);
        parts.push(
          el("ul", { class: "dist" }, q.distribution.map(function (d) {
            var isAnswer = d.index === q.answerIndex;
            return el("li", { class: "dist__item" + (isAnswer ? " dist__item--answer" : "") }, [
              el("span", { class: "dist__mark", attrs: { "aria-hidden": "true" }, text: isAnswer ? "정답" : "　" }),
              el("span", { class: "dist__no", text: "제" + (d.index + 1) + "번" }),
              el("span", { class: "dist__label", text: question.choices[d.index] }),
              el("span", { class: "dist__count", text: d.count + "명 (" + K.percent(d.count, q.total) + "%)" })
            ]);
          }))
        );

        if (q.worstChoices.length > 0) {
          parts.push(
            el("p", { class: "t-worst" }, [
              el("b", { text: "오답 TOP2 : " }),
              el("span", {
                text: q.worstChoices
                  .map(function (w) {
                    return "제" + (w.index + 1) + "번 (" + w.count + "명)";
                  })
                  .join(" · ")
              })
            ])
          );
        }
      } else {
        /* 주관식 원문 (명세 11장 2번) */
        parts.push(
          el("div", { class: "answers" }, q.texts.map(function (t) {
            return el("div", { class: "answers__row" + (t.correct ? " answers__row--ok" : "") }, [
              el("p", { class: "answers__who" }, [
                el("span", { attrs: { "aria-hidden": "true" }, text: t.correct ? "✔ " : "✘ " }),
                el("span", { text: t.studentId + " " + t.studentName }),
                el("span", { class: "answers__state", text: t.correct ? "맞음" : "틀림" })
              ]),
              K.codeBox(t.text)
            ]);
          }))
        );
      }

      box.appendChild(section(q.no + "번 · " + q.tag, parts));
    });

    return box;
  }

  /* ================================================================== */
  /* 3. 회로 수행 (명세 11장 3번)                                         */
  /* ================================================================== */

  function renderCircuit(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.circuitStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("회로 완성", s.completed + " / " + s.total + "명", K.percent(s.completed, s.total) + "%"),
        K.statCard("평균 시도", s.avgAttempts + "회", "케이블을 이은 횟수"),
        K.statCard("힌트 사용", s.hintUsers + "명"),
        K.statCard("위험 연결 발생", s.dangerStudents + "명", s.dangerStudents ? "아래 목록을 확인하세요" : "없음")
      ])
    );

    box.appendChild(
      section(
        "빈번한 오결선",
        s.frequent.length === 0
          ? [K.empty("위험한 연결을 만든 학생이 없습니다.")]
          : s.frequent.map(function (f) {
              return K.bar(f.title, f.count, s.total);
            })
      )
    );

    /* 학생별 회로 수행 */
    box.appendChild(
      section("학생별 회로", [
        el("div", { class: "t-tablewrap" }, [
          el("table", { class: "t-table" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { text: "학번" }),
                el("th", { text: "이름" }),
                el("th", { text: "완성" }),
                el("th", { text: "경로 판정" }),
                el("th", { text: "시도" }),
                el("th", { text: "힌트" }),
                el("th", { text: "위험 연결" }),
                el("th", { text: "연결 목록" })
              ])
            ]),
            el("tbody", {}, rows.map(function (r) {
              var errors = (r.circuit.errors || []).map(function (e) {
                return e.title || e.code;
              });
              var uniqueErrors = errors.filter(function (v, i) {
                return errors.indexOf(v) === i;
              });
              return el("tr", {}, [
                el("td", { text: r.studentId }),
                el("td", { text: r.studentName }),
                el("td", { class: r.circuit.completed ? "cell--ok" : "cell--no", text: r.circuit.completed ? "✔ 완성" : "✘ 미완성" }),
                el("td", { text: pathText(r.circuit.path) }),
                el("td", { text: String(r.circuit.attempts) }),
                el("td", { text: String(r.circuit.hintsUsed) }),
                el("td", { text: uniqueErrors.length ? uniqueErrors.join(", ") : "—" }),
                el("td", { text: (r.circuit.connections || [])
                  .map(function (c) {
                    return PC.circuit.describe(c.fromComponent, c.fromPin) + "→" + PC.circuit.describe(c.toComponent, c.toPin);
                  })
                  .join(" / ") || "—" })
              ]);
            }))
          ])
        ])
      ])
    );

    return box;
  }

  /**
   * 제출에 담긴 «부품 경로 검사 결과» 를 한 줄로 (명세 18.1)
   *
   * 여기가 이 차시 교사 화면의 알맹이다. «미완성» 한 마디로는
   * 극성을 틀린 학생과 저항을 빠뜨린 학생을 갈라낼 수 없다(명세 29장 6번).
   */
  function pathText(path) {
    if (!path) return "—";
    var parts = [];
    if (path.shortCircuit) parts.push("단락");
    if (path.ledDirection === "forward") parts.push("극성 O");
    else if (path.ledDirection === "reverse") parts.push("역극성");
    else parts.push("경로 끊김");
    parts.push(path.hasResistor ? path.resistanceOhm + "Ω" : "저항 없음");
    return parts.join(" · ");
  }

  /* ================================================================== */
  /* 4. 코드 수행 (명세 11장 4번)                                         */
  /* ================================================================== */

  var MODE_NAME = { assemble: "코드 조립", blank: "빈칸 채우기", edit: "전체 편집" };

  function renderCode(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var s = T.data.codeStats(rows);

    box.appendChild(
      el("div", { class: "t-stats" }, [
        K.statCard("검사 전부 통과", s.allPassed + " / " + s.total + "명", K.percent(s.allPassed, s.total) + "%"),
        K.statCard("문법 오류 남음", s.withSyntaxError + "명"),
        K.statCard("핀 불일치", s.withPinMismatch + "명")
      ])
    );

    box.appendChild(
      section(
        "마지막으로 쓴 방식",
        s.modes.map(function (m) {
          return K.bar(MODE_NAME[m.mode] || m.mode, m.count, s.total);
        })
      )
    );

    rows.forEach(function (r) {
      var problems = [];
      (r.code.syntaxErrors || []).forEach(function (e) {
        problems.push(el("p", { class: "t-problem", text: "문법 " + (e.line ? e.line + "번 줄 — " : "") + e.message }));
      });
      (r.code.pinMismatch || []).forEach(function (p) {
        problems.push(el("p", { class: "t-problem", text: "핀 " + p.message }));
      });

      box.appendChild(
        section(
          r.studentId + " " + r.studentName,
          [
            el("p", { class: "t-meta", text:
              "검사 " + r.code.testsPassed + " / " + r.code.testsTotal +
              " · 실행 " + r.code.attempts + "회 · 방식 " + (MODE_NAME[r.code.mode] || "—")
            }),
            K.codeBox(r.code.source)
          ].concat(problems)
        )
      );
    });

    return box;
  }

  /* ================================================================== */
  /* 5. 실험 기록 (명세 11장 5번)                                         */
  /* ================================================================== */

  function renderExperiment(rows) {
    var box = el("div");
    if (rows.length === 0) return box.appendChild(K.empty("불러온 제출이 없습니다.")), box;

    var EXP = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

    /* 어느 실험까지 갔는가 — 실험은 A → B → C 차례대로 한다 */
    var ranCount = {};
    var extensionTried = 0;
    rows.forEach(function (r) {
      (r.experiment.conditions || []).forEach(function (c) {
        if (c.ran) ranCount[c.id] = (ranCount[c.id] || 0) + 1;
      });
      if (r.experiment.extension && r.experiment.extension.tried) extensionTried += 1;
    });

    box.appendChild(
      section(
        "실험별 실행 인원",
        EXP.length === 0
          ? [K.empty("실험 자료가 없습니다.")]
          : EXP.map(function (item) {
              return K.bar(
                item.label + " (켜짐 " + item.onMs + "ms · 꺼짐 " + item.offMs + "ms)",
                ranCount[item.id] || 0,
                rows.length
              );
            }).concat([K.bar("확장 활동까지 해 봄", extensionTried, rows.length)])
      )
    );

    rows.forEach(function (r) {
      var conditions = r.experiment.conditions || [];
      var observations = r.experiment.observations || [];
      var byId = {};
      observations.forEach(function (o) {
        byId[o.id] = o;
      });

      var parts = [];

      if (conditions.length === 0) {
        parts.push(K.empty("실험 기록이 없습니다."));
      } else {
        parts.push(
          el("div", { class: "t-tablewrap" }, [
            el("table", { class: "t-table" }, [
              el("thead", {}, [
                el("tr", {}, [
                  el("th", { text: "실험" }),
                  el("th", { text: "조건" }),
                  el("th", { text: "실행 전 예상" }),
                  el("th", { text: "실행 뒤 관찰" }),
                  el("th", { text: "예상과 다른 점" })
                ])
              ]),
              el("tbody", {}, conditions.map(function (c) {
                var note = byId[c.id] || {};
                return el("tr", {}, [
                  el("td", { text: c.label || c.id }),
                  el("td", { text: "켜짐 " + c.onMs + "ms · 꺼짐 " + c.offMs + "ms" }),
                  el("td", {}, [K.longText(note.predict || "")]),
                  el("td", {}, [K.longText(note.observation || "")]),
                  el("td", {}, [K.longText(note.surprise || "")])
                ]);
              }))
            ])
          ])
        );
      }

      /* 확장 활동을 해 본 학생의 코드도 함께 보여 준다 */
      var ext = r.experiment.extension || {};
      if (ext.tried && String(ext.source || "").trim()) {
        parts.push(el("p", { class: "t-meta", text: "확장 활동 — 짧게 두 번 깜빡인 뒤 2초 쉬기" }));
        parts.push(K.codeBox(ext.source));
      }

      box.appendChild(section(r.studentId + " " + r.studentName, parts));
    });

    return box;
  }

  T.views = {
    section: section,
    summary: renderSummary,
    podium: renderPodium,
    praiseFor: praiseFor,
    quiz: renderQuiz,
    circuit: renderCircuit,
    code: renderCode,
    experiment: renderExperiment,
    MODE_NAME: MODE_NAME
  };
})();
    </script>
    <script data-from="teacher/t35-wrong.js">
/* ------------------------------------------------------------------
 * 3장 — 가장 많이 틀린 문제 (단추를 누를 때마다 한 문제씩)
 *
 * 짜임새를 lesson3_7_1 의 교사용 3장과 «같게» 맞추었다.
 *   · 틀린 학생이 많은 순서로 최대 두 문제
 *   · 오답률 막대 + 보기별 고른 사람 수 + 정답 + 해설 + 「이렇게 복습해 보세요」
 *   · 두 문제를 모두 확인해야 다음 장으로 넘어갈 수 있다
 *
 * 한 문제씩 여는 까닭 — 다섯 문항을 한꺼번에 늘어놓으면 «무엇부터 짚어 줄지» 가 흐려진다.
 * 수업에서 실제로 다룰 수 있는 것은 한두 문항이다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 topWrong 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** 한 수업에서 짚어 줄 만한 문항 수 */
  var WRONG_LIMIT = 2;

  /**
   * 틀린 학생이 많은 순서로 문항을 고른다.
   * 아무도 틀리지 않은 문항은 넣지 않는다 — 짚어 줄 것이 없다.
   */
  function topWrong(rows) {
    var stats = T.data.questionStats(rows);
    return stats
      .map(function (stat) {
        var wrong = stat.total - stat.correct;
        return {
          stat: stat,
          wrong: wrong,
          wrongRate: K.percent(wrong, stat.total)
        };
      })
      .filter(function (item) {
        return item.wrong > 0;
      })
      .sort(function (a, b) {
        if (b.wrong !== a.wrong) return b.wrong - a.wrong;
        return a.stat.no - b.stat.no; /* 같으면 문항 번호 순 */
      })
      .slice(0, WRONG_LIMIT);
  }

  /** 오답 카드 한 장 */
  function wrongCard(item, order) {
    var stat = item.stat;
    var q = null;
    PC.quiz.QUESTIONS.forEach(function (one) {
      if (one.id === stat.id) q = one;
    });
    var note = null;
    (PC.TEACHER_NOTES.ANSWERS || []).forEach(function (a) {
      if (a.id === stat.id) note = a;
    });

    var card = el("div", { class: "t-wrong__card" });

    card.appendChild(el("span", { class: "t-wrong__rank", text: "오답 " + order + "위" }));
    card.appendChild(el("h3", { class: "t-wrong__title", text: "문항 " + stat.no + " · " + stat.tag }));
    card.appendChild(el("p", { class: "t-wrong__prompt", text: stat.stem }));

    /* 문항에 코드가 붙어 있으면 그대로 보여 준다 (4번 문항) */
    if (q && q.code) card.appendChild(K.codeBox(q.code));
    if (q && q.template) card.appendChild(K.codeBox(q.template));

    /* 오답률 막대 */
    card.appendChild(
      el("div", { class: "t-bar" }, [
        el("div", { class: "t-bar__fill", attrs: { style: "width:" + item.wrongRate + "%" } }),
        el("span", {
          class: "t-bar__label",
          text: stat.total + "명 중 " + item.wrong + "명이 틀렸어요 (" + item.wrongRate + "%)"
        })
      ])
    );

    /* 객관식 — 보기별로 몇 명이 골랐는가 */
    if (stat.type === "choice" && stat.distribution.length) {
      var answerIndex = typeof stat.answerIndex === "number" ? stat.answerIndex : -1;
      var maxWrong = 0;
      stat.distribution.forEach(function (d) {
        if (d.index !== answerIndex && d.count > maxWrong) maxWrong = d.count;
      });

      card.appendChild(
        el("div", { class: "t-options" }, stat.distribution.map(function (d) {
          var isAnswer = d.index === answerIndex;
          var isTopWrong = !isAnswer && d.count > 0 && d.count === maxWrong;
          return el("div", {
            class: "t-option" + (isAnswer ? " is-answer" : "") + (isTopWrong ? " is-top-wrong" : "")
          }, [
            el("span", { class: "t-option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[d.index] || String(d.index + 1) }),
            el("span", { class: "t-option__text", text: d.label + (isAnswer ? "  ← 정답" : "") }),
            el("span", { class: "t-option__count", text: d.count + "명" })
          ]);
        }))
      );
    }

    /* 완성형 — 학생들이 실제로 쓴 답을 몇 개 보여 준다 */
    if (stat.type === "code" && stat.texts.length) {
      var wrongTexts = stat.texts.filter(function (t) {
        return !t.correct;
      });
      card.appendChild(
        el("div", { class: "t-options" }, wrongTexts.slice(0, 5).map(function (t) {
          return el("div", { class: "t-option" }, [
            el("span", { class: "t-option__text" }, [K.codeBox(String(t.text || "(무응답)"))]),
            el("span", { class: "t-option__count", text: t.studentId || "" })
          ]);
        }))
      );
      if (wrongTexts.length > 5) {
        card.appendChild(
          el("p", { class: "panel__hint", text: "틀린 답 " + wrongTexts.length + "개 중 앞 5개만 보여 줍니다. 나머지는 6장 학생별 보기에서 확인하세요." })
        );
      }
    }

    /* 정답과 해설 */
    if (note) {
      card.appendChild(
        el("div", { class: "t-explain" }, [
          el("p", { class: "t-explain__label", text: "정답" }),
          el("p", {
            class: "t-answerline",
            text:
              stat.type === "choice" && note.answerIndex >= 0
                ? (CIRCLED[note.answerIndex] || "") + " " + note.answerText
                : note.answerText
          }),
          el("p", { class: "t-explain__label", text: "해설" }),
          el("p", { text: note.explanation })
        ])
      );
    }

    /* 이 문항과 이어지는 오개념 지도 — 있으면 복습 방법으로 붙인다 */
    var tip = teachTipFor(stat);
    if (tip) {
      card.appendChild(
        el("p", { class: "t-teach" }, [
          el("strong", { text: "💡 이렇게 복습해 보세요" }),
          el("span", { text: tip })
        ])
      );
    }

    return card;
  }

  /**
   * 문항에 맞는 «복습 방법» 을 오개념 자료에서 고른다.
   * 문항마다 손으로 짝지어 두지 않고 딱지(tag)로 잇는다 — 문항이 바뀌어도 따라온다.
   */
  var TAG_TO_MISCONCEPTION = {
    "개념": "m-loop",
    "입력·출력": "m-analog",
    "프로그램 구조": "m-loop",
    "프로그래밍": "m-loop",
    "완성형": "m-loop"
  };

  function teachTipFor(stat) {
    var wanted = TAG_TO_MISCONCEPTION[stat.tag];
    var found = null;
    (PC.TEACHER_NOTES.MISCONCEPTIONS || []).forEach(function (m) {
      if (m.id === wanted) found = m;
    });
    return found ? found.teach : "";
  }

  /**
   * 3장 본문을 만든다.
   *
   * @param rows    제출 목록
   * @param onSeen  문제를 하나 열 때마다 부른다. (본 개수, 전체 개수) — 다음 장 열기 판단에 쓴다
   */
  function render(rows, onSeen) {
    var box = el("div");
    var list = topWrong(rows);
    var index = -1;
    var seenAll = false;

    var progress = el("p", { class: "t-wrong__progress", attrs: { "aria-live": "polite" } });
    var body = el("div");

    function toStart() {
      index = -1;
      K.clear(body);
      btn.textContent = "가장 많이 틀린 문제 보기";
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
      K.announce("처음으로 돌아갔습니다.");
    }

    var btn = el("button", {
      class: "btn btn--primary",
      text: "가장 많이 틀린 문제 보기",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!list.length) return;
          index += 1;

          /* 마지막까지 본 뒤 한 번 더 누르면 처음으로 돌아간다 */
          if (index >= list.length) {
            toStart();
            return;
          }

          /* 카드를 쌓지 않고 갈아 끼운다 — 한 번에 한 문제만 짚어 준다 */
          K.clear(body).appendChild(wrongCard(list[index], index + 1));

          var last = index === list.length - 1;
          btn.textContent = last ? "처음부터 다시 보기" : "다음 문제 보기";
          progress.textContent = index + 1 + " / " + list.length + " 문제 보는 중";
          K.announce("가장 많이 틀린 " + (index + 1) + "번째 문제, " + list[index].stat.no + "번 문항입니다.");

          if (last && !seenAll) {
            seenAll = true;
            K.toast("틀린 문제를 모두 확인했어요. 아래 「다음 →」 을 누르면 넘어갑니다.");
            if (onSeen) onSeen(list.length, list.length);
          }
        }
      }
    });

    if (!list.length) {
      btn.disabled = true;
      btn.title = "모든 학생이 다섯 문항을 맞혔어요.";
      progress.textContent = "🎉 틀린 문항이 없어요. 모두 잘 이해했습니다.";
      if (onSeen) onSeen(0, 0);
    } else {
      progress.textContent = "틀린 학생이 많은 순서로 " + list.length + "문제를 준비했어요.";
    }

    box.appendChild(el("div", { class: "t-wrong__controls" }, [btn, progress]));
    box.appendChild(body);
    return box;
  }

  T.wrong = { render: render, topWrong: topWrong, WRONG_LIMIT: WRONG_LIMIT };
})();

    <script data-from="teacher/t45-list.js">
/* ------------------------------------------------------------------
 * 5장 — 전체 명단 · 정오표
 *
 * 짜임새를 lesson3_7_1 의 교사용 4장과 «같게» 맞추었다.
 *   · 📎 학생 명단 올리기 (.xlsx / .csv) → 제출하지 않은 학생까지 표에 나온다
 *   · 📋 전체 명단 · 정오표 — 점수 + 문항별 O / X / -
 *   · 🖨 인쇄 · CSV 내려받기
 *
 * 명단을 올려야 «누가 안 냈는지» 를 알 수 있다. 낸 사람만 세면 빠진 학생이 보이지 않는다.
 * ------------------------------------------------------------------ */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});
  /* 화면이 없는 곳(검사)에서도 buildRows·marksOf·csvRows 같은 «계산» 은 쓸 수 있어야 한다.
     그림을 그리는 함수만 document 를 쓰므로 여기서 되돌리지 않는다. */

  var K = T.core;
  var el = K.el;

  /* 정오 표시 — 색만으로 알리지 않는다. 글자가 뜻을 진다. */
  var MARK = { correct: "O", wrong: "X", none: "-" };
  var MARK_CLASS = { correct: "is-o", wrong: "is-x", none: "is-none" };
  var MARK_LABEL = { correct: "정답", wrong: "오답", none: "무응답" };

  /** 올린 명단 — { students, warnings } 또는 null */
  var roster = null;

  function setRoster(next) {
    roster = next;
  }

  function getRoster() {
    return roster;
  }

  /**
   * 표에 넣을 줄을 만든다.
   * 명단이 있으면 «명단 순서» 대로 놓고, 명단에 없는 제출은 뒤에 붙인다.
   */
  function buildRows(list) {
    var rows = [];
    var byId = {};
    var norm = T.roster ? T.roster.normalizeId : function (v) {
      return String(v || "");
    };

    (list || []).forEach(function (r) {
      byId[norm(r.studentId)] = r;
    });

    if (roster) {
      var used = {};
      roster.students.forEach(function (s) {
        var key = norm(s.id);
        var found = byId[key] || null;
        if (found) used[key] = true;
        rows.push({
          studentId: s.id,
          name: s.name || (found ? found.studentName : ""),
          data: found,
          submitted: !!found,
          inRoster: true
        });
      });
      /* 명단에 없는 학번으로 낸 학생도 빠뜨리지 않는다 */
      (list || []).forEach(function (r) {
        if (used[norm(r.studentId)]) return;
        rows.push({
          studentId: r.studentId,
          name: r.studentName,
          data: r,
          submitted: true,
          inRoster: false
        });
      });
      return rows;
    }

    (list || []).forEach(function (r) {
      rows.push({
        studentId: r.studentId,
        name: r.studentName,
        data: r,
        submitted: true,
        inRoster: true
      });
    });
    return rows;
  }

  /** 한 학생의 문항별 정오를 { q1: "correct", … } 로 */
  function marksOf(row) {
    var out = {};
    if (!row.submitted || !row.data) return out;
    PC.quiz.QUESTIONS.forEach(function (q, i) {
      var flag = row.data.assessment.isCorrect[i];
      var answer = null;
      (row.data.assessment.answers || []).forEach(function (a) {
        if (a && a.id === q.id) answer = a;
      });
      var empty = !answer || answer.value === null || answer.value === undefined || answer.value === "";
      out[q.id] = flag === true ? "correct" : empty ? "none" : "wrong";
    });
    return out;
  }

  /* ---------------------------------------------------------------- */
  /* 명단 올리기                                                        */
  /* ---------------------------------------------------------------- */

  /** 읽어만 두고 아직 반영하지 않은 명단 */
  var pending = null;

  function buildRosterUpload(onChange) {
    var box = K.panel({
      title: "📎 학생 명단 올리기",
      hint: "엑셀(.xlsx) 또는 CSV 파일을 올리면 제출하지 않은 학생까지 함께 표시돼요.",
      className: "t-roster-src no-print"
    });

    var status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });

    function say(kind, message) {
      status.className = "t-status" + (kind ? " is-" + kind : "");
      status.textContent = message;
    }

    var fileInput = el("input", {
      class: "sr-only",
      id: "t-roster-file",
      attrs: {
        type: "file",
        accept: ".xlsx,.csv,.tsv,.txt",
        "aria-label": "학생 명단 파일 고르기"
      }
    });

    var applyBtn = el("button", {
      class: "btn btn--primary",
      text: "\u2705 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (!pending) {
            say("error", "먼저 학생 명단 파일을 올려 주세요.");
            return;
          }
          setRoster(pending);
          pending = null;
          if (onChange) onChange();
          K.announce("전체 정오표를 표시했습니다.");
        }
      }
    });

    var clearBtn = el("button", {
      class: "btn btn--ghost",
      text: "명단 지우기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setRoster(null);
          pending = null;
          fileInput.value = "";
          if (onChange) onChange();
        }
      }
    });

    function load(file) {
      if (!file) return;
      say("loading", "명단을 읽고 있어요…");
      T.roster.parseFile(file).then(
        function (result) {
          pending = result;
          var message = "명단 " + result.students.length + "명을 읽었어요. [\u2705 확인] 을 누르면 정오표를 만듭니다.";
          if (result.warnings.length) message += " (건너뛴 줄 " + result.warnings.length + "개)";
          say("", message);
          applyBtn.disabled = false;
          clearBtn.disabled = false;
        },
        function (err) {
          pending = null;
          applyBtn.disabled = true;
          say("error", err && err.message ? err.message : "명단을 읽지 못했어요.");
        }
      );
    }

    fileInput.addEventListener("change", function () {
      load(fileInput.files && fileInput.files[0]);
    });

    var pick = el("button", {
      class: "btn btn--ghost",
      text: "명단 파일 선택",
      attrs: { type: "button" },
      on: {
        click: function () {
          fileInput.click();
        }
      }
    });

    /* 처음 상태 — 이미 반영된 명단이 있으면 그 사실을 알려 준다 */
    if (roster) {
      say("ok", "명단 " + roster.students.length + "명과 제출 답안을 맞춰 전체 정오표를 만들었어요.");
    } else {
      say("", "명단을 올리면 미제출 학생까지 확인할 수 있어요.");
    }
    applyBtn.disabled = !pending;
    clearBtn.disabled = !roster && !pending;

    var drop = el("div", {
      class: "t-drop",
      text: "또는 명단 파일을 이곳에 끌어다 놓으세요. (.xlsx · .csv)"
    });
    ["dragenter", "dragover"].forEach(function (evt) {

      });
    });

    });

    box.body.appendChild(el("div", { class: "t-source__row" }, [pick, applyBtn, clearBtn, fileInput]));

    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", { text: "첫 줄에 「학번」·「이름」 머리글이 있으면 자동으로 찾아요. 머리글이 없으면 첫 번째 열을 학번, 두 번째 열을 이름으로 읽습니다." })
    );
    hints.appendChild(
      el("li", { text: "엑셀이 열리지 않으면 「다른 이름으로 저장 \u2192 CSV UTF-8」 로 저장해 올려 주세요." })
    );
    box.body.appendChild(hints);

    if (roster && roster.warnings.length) {
      var warn = el("div", { class: "t-warn" });
      warn.appendChild(el("p", { text: "건너뛴 줄이 있어요." }));
      var ul = el("ul", { class: "t-hint-list" });

        ul.appendChild(el("li", { text: line }));
      });
      warn.appendChild(ul);
      box.body.appendChild(warn);
    }

    return box.root;
  }

  /* ---------------------------------------------------------------- */
  /* 전체 명단 · 정오표                                                  */
  /* ---------------------------------------------------------------- */

  function buildTable(list) {
    var box = K.panel({
      title: "📋 전체 명단 · 정오표",
      hint: "제출한 학생은 점수와 문항별 정오(O · X)를, 제출하지 않은 학생은 「미제출」 로 표시해요."

    if (!rows.length) {

          return r.inRoster;
        })
      : rows;
    var submitted = inRoster.filter(function (r) {
      return r.submitted;
    }).length;
    var missing = inRoster.length - submitted;
    var extra = roster ? rows.length - inRoster.length : 0;

    var cards = [
      K.statCard(roster ? "명단 인원" : "제출 학생", roster ? roster.students.length : rows.length, "", "명"),
      K.statCard("제출", submitted, "", "명"),
      K.statCard("미제출", missing, "", "명")
    ];
    if (extra) cards.push(K.statCard("명단 밖 제출", extra, "", "명"));
    box.body.appendChild(K.statRow(cards));

    if (!roster) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint no-print",
          text: "학생 명단을 올리면 명단 순서대로, 명단에 있는 학생이 빠짐없이 표시돼요."
        })
      );
    }
    if (extra) {
      box.body.appendChild(
        el("p", {
          class: "panel__hint",
          text: "명단에 없는 학번으로 낸 학생이 " + extra + "명 있어요. 표 아래쪽에 함께 두었습니다."
        })
      );
    }

    /* 표 */
    var head = el("tr", {}, [
      el("th", { attrs: { scope: "col" }, text: "학번" }),
      el("th", { attrs: { scope: "col" }, text: "이름" }),
      el("th", { attrs: { scope: "col" }, text: "점수" })
    ].concat(
      PC.quiz.QUESTIONS.map(function (q) {
        return el("th", { attrs: { scope: "col" }, text: q.no + "번" });
      })
    ).concat([
      el("th", { attrs: { scope: "col" }, text: "회로" }),
      el("th", { attrs: { scope: "col" }, text: "코드" })
    ]));

    var body = rows.map(function (row) {
      if (!row.submitted) {
        return el("tr", { class: "is-missing" }, [
          el("td", { text: row.studentId || "-" }),
          el("td", { text: row.name || "-" }),
          el("td", {
            class: "t-missing",
            text: "미제출",
            attrs: { colspan: String(3 + PC.quiz.QUESTIONS.length) }
          })
        ]);
      }

      var marks = marksOf(row);
      var d = row.data;
      return el("tr", {}, [
        el("td", { text: row.studentId || "-" }),
        el("td", { text: row.name || "-" }),
        el("td", { class: "t-score", text: d.assessment.score + "점" })
      ].concat(
        PC.quiz.QUESTIONS.map(function (q) {
          var mark = marks[q.id] || "none";
          return el("td", {
            class: "t-mark " + (MARK_CLASS[mark] || "is-none"),
            text: MARK[mark] || "-",
            attrs: { "aria-label": q.no + "번 " + (MARK_LABEL[mark] || "무응답") }
          });
        })
      ).concat([
        el("td", {
          class: "t-mark " + (d.circuit.completed ? "is-o" : "is-x"),
          text: d.circuit.completed ? "O" : "X",
          attrs: { "aria-label": d.circuit.completed ? "회로 완성" : "회로 미완성" }
        }),
        el("td", {
          class: "t-mark " + (d.code.testsPassed >= d.code.testsTotal && d.code.testsTotal > 0 ? "is-o" : "is-x"),
          text: d.code.testsPassed + "/" + d.code.testsTotal
        })
      ]));
    });

    box.body.appendChild(
      el("div", { class: "t-table-wrap" }, [
        el("table", { class: "t-list-table" }, [
          el("thead", {}, [head]),
          el("tbody", {}, body)
        ])
      ])
    );
    box.body.appendChild(
      el("p", { class: "panel__hint", text: "O 정답 · X 오답 · - 무응답 · 코드 칸은 통과한 검사 수입니다." })
    );

    /* 인쇄 · 내려받기 */
    box.body.appendChild(
      K.btnRow([
        el("button", {
          class: "btn btn--primary",
          text: "🖨 이 표 인쇄하기",
          attrs: { type: "button" },
          on: {
            click: function () {
              if (T.main && T.main.stampPrintDate) T.main.stampPrintDate();
              window.print();
            }
          }
        }),
        el("button", {
          class: "btn btn--ghost",
          text: "CSV 로 내려받기",
          attrs: { type: "button" },
          on: {
            click: function () {
              downloadCsv(rows);
            }
          }
        })
      ])
    );
    box.body.appendChild(
      el("p", {
        class: "panel__hint no-print",
        text: "출력 날짜는 첫 장 위쪽에 한 번만 찍혀요. 인쇄 창에서 「머리글/바닥글」 을 끄면 브라우저가 장마다 넣는 날짜·주소가 사라집니다."
      })
    );

    return box.root;
  }

  /** 정오표를 CSV 로 (엑셀이 한글을 깨뜨리지 않게 BOM 을 붙인다 — t60-csv 와 같은 방식) */
  function csvRows(rows) {
    var header = ["학번", "이름", "점수", "이수"];
    PC.quiz.QUESTIONS.forEach(function (q) {
      header.push(q.no + "번");
    });
    header.push("회로완성", "코드통과", "제출여부");

    var out = [header];
    (rows || []).forEach(function (row) {
      if (!row.submitted) {
        var blank = [row.studentId, row.name, "", ""];
        PC.quiz.QUESTIONS.forEach(function () {
          blank.push("");
        });
        blank.push("", "", "미제출");
        out.push(blank);
        return;
      }
      var marks = marksOf(row);
      var d = row.data;
      var line = [row.studentId, row.name, d.assessment.score, d.assessment.pass ? "이수" : "미이수"];
      PC.quiz.QUESTIONS.forEach(function (q) {
        line.push(MARK[marks[q.id] || "none"] || "-");
      });
      line.push(d.circuit.completed ? "완성" : "미완성", d.code.testsPassed + "/" + d.code.testsTotal, "제출");
      out.push(line);
    });
    return out;
  }

  function downloadCsv(rows) {
    var ok = T.csv.download(csvRows(rows), "정오표");
    K.toast(ok ? "CSV 파일로 저장했어요." : "이 브라우저에서는 내려받기를 쓸 수 없습니다.");
  }

  /** 5장 본문 전체 */
  function render(list, onChange) {
    var box = el("div", { class: "stack" });
    box.appendChild(buildRosterUpload(onChange));
    box.appendChild(buildTable(list));
    return box;
  }

  T.list = {
    render: render,
    buildRows: buildRows,
    marksOf: marksOf,
    csvRows: csvRows,
    setRoster: setRoster,
    getRoster: getRoster
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.list;
})();

    <script data-from="teacher/t60-csv.js">
/**
 * CSV 내려받기 (명세 11장 «CSV 내려받기»)
 *
 * 엑셀이 한글을 깨뜨리지 않도록 맨 앞에 BOM 을 붙인다.
 * 쉼표·따옴표·줄바꿈이 든 칸은 따옴표로 감싸고 안쪽 따옴표는 두 번 적는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function cell(value) {
    var s = value === null || value === undefined ? "" : String(value);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function toRows(list) {
    var questions = PC.quiz.QUESTIONS;

    var header = ["학번", "학년", "반", "번호", "이름", "제출시각", "점수", "총점", "이수"]
      .concat(questions.map(function (q) {
        return q.no + "번";
      }))
      .concat([
        "회로완성",
        /* 이 차시의 알맹이 — «미완성» 만으로는 극성과 저항을 갈라낼 수 없다(명세 29장 6번) */
        "LED극성",
        "저항",
        "회로시도",
        "힌트",
        "위험연결",
        "코드통과",
        "코드시도",
        "코드방식",
        "실험횟수",
        "관찰작성",
        "확장활동"
      ]);

    var rows = (list || []).map(function (r) {
      var answers = {};
      (r.assessment.answers || []).forEach(function (a) {
        if (a) answers[a.id] = a.value;
      });

      var perQuestion = questions.map(function (q, i) {
        var ok = r.assessment.isCorrect[i] === true ? "O" : "X";
        var value = answers[q.id];
        var shown =
          value === null || value === undefined || value === ""
            ? "무응답"
            : q.type === "choice"
              ? "제" + (Number(value) + 1) + "번"
              : String(value).replace(/\s+/g, " ");
        return ok + " " + shown;
      });

      /* 관찰은 이제 { id, predict, observation, surprise } 꼴이다 */
      var observationCount = (r.experiment.observations || []).filter(function (o) {
        return String((o && o.observation) || "").trim().length > 0;
      }).length;

      var path = r.circuit.path || {};
      var polarity =
        path.ledDirection === "forward"
          ? "정상"
          : path.ledDirection === "reverse"
            ? "역극성"
            : path.ledDirection
              ? "경로끊김"
              : "";
      var resistor = path.ledDirection ? (path.hasResistor ? path.resistanceOhm + "Ω" : "없음") : "";

      return [
        r.studentId,
        r.grade,
        r.classNumber,
        r.studentNumber,
        r.studentName,
        T.core.fmtTime(r.serverUpdatedAt || r.submittedAt, true),
        r.assessment.score,
        r.assessment.total,
        r.assessment.pass ? "이수" : "미이수"
      ]
        .concat(perQuestion)
        .concat([
          r.circuit.completed ? "완성" : "미완성",
          polarity,
          resistor,
          r.circuit.attempts,
          r.circuit.hintsUsed,
          (r.circuit.errors || []).length,
          r.code.testsPassed + "/" + r.code.testsTotal,
          r.code.attempts,
          (T.views && T.views.MODE_NAME ? T.views.MODE_NAME[r.code.mode] : "") || r.code.mode || "",
          (r.experiment.conditions || []).filter(function (c) {
            return c && c.ran;
          }).length,
          observationCount,
          r.experiment.extension && r.experiment.extension.tried ? "함" : ""
        ]);
    });

    return [header].concat(rows);
  }

  function toText(list) {
    return toRows(list)
      .map(function (row) {
        return row.map(cell).join(",");
      })
      .join("\r\n");
  }

  /** 파일 이름 : physical_2_제출현황_2026-08-18.csv */
  function fileName(now, label) {
    var d = now ? new Date(now) : new Date();
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var stamp = d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
    return PC.LESSON_ID + "_" + (label || "제출현황") + "_" + stamp + ".csv";
  }

  function download(list, label) {
    if (typeof document === "undefined") return false;
    try {
      var blob = new Blob(["﻿" + toText(list)], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileName(null, label);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  T.csv = { cell: cell, toRows: toRows, toText: toText, fileName: fileName, download: download };

  if (typeof module !== "undefined" && module.exports) module.exports = T.csv;
})();
    </script>
    <script data-from="teacher/t90-main.js">

(function () {
  "use strict";

  var T = PC.teacher || (PC.teacher = {});
  if (typeof document === "undefined") return;

  var K = T.core;
  var el = K.el;

  var PAGES = [
    { no: 1, label: "결과 불러오기" },
    { no: 2, label: "요약 · 상위 3명" },
    { no: 3, label: "가장 많이 틀린 문제" },
    { no: 4, label: "전체 명단 · 정오표" }
  ];

  var refs = {};
  var pages = [];

  var currentPage = 1;

  /** 3장에서 틀린 문제를 끝까지 확인했는가 (다음 장 열기 조건) */
  var allWrongSeen = false;

  /* 주소만 기억해 둔다. 학생 답안은 저장하지 않는다 — 창을 닫으면 사라진다. */
  var ENDPOINT_KEY = "physical2-teacher-endpoint";

  function loadEndpoint() {
    try {
      return window.localStorage.getItem(ENDPOINT_KEY) || "";
    } catch (e) {
      return "";
    }
  }

  function saveEndpoint(url) {
    try {
      if (url) window.localStorage.setItem(ENDPOINT_KEY, String(url).trim());
    } catch (e) {
      /* 저장이 막혀 있어도 불러오기 자체는 된다 */
    }
  }

  /**
   * 자료가 들어왔는가.
   * «불러왔다» 는 깃발을 따로 두지 않는다 — 깃발과 실제 자료가 어긋날 수 있다.
   */
  function hasData() {
    return T.data.count() > 0;
  }

  function rows() {
    return T.data.all();
  }

  /* ---------------------------------------------------------------- */
  /* 머리말 · 출력 날짜                                                 */
  /* ---------------------------------------------------------------- */

  function buildHeader(host) {
    host.appendChild(
      el("header", { class: "t-header" }, [
        el("p", { class: "t-header__eyebrow", text: "교사용 · " + PC.LESSON_UNIT }),
        el("h1", { class: "t-header__title", text: "형성평가 결과 분석" }),
        el("p", {
          class: "t-header__sub",
          text: "학생들이 제출한 답안을 읽어 상위 3명과 가장 많이 틀린 문제를 정리해 보여 줍니다."
        })
      ])
    );

    /* 인쇄물 맨 위에만 한 번 찍히는 날짜 */
    refs.printDate = el("p", { class: "t-printdate" });
    host.appendChild(refs.printDate);
    stampPrintDate();
    window.addEventListener("beforeprint", stampPrintDate);
  }

  /** 인쇄물 맨 위 날짜 (예 : 2026년 8월 18일 (화) 출력) */
  function stampPrintDate() {
    if (!refs.printDate) return;
    var now = new Date();
    var day = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];
    refs.printDate.textContent =
      now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + day + ") 출력";
  }

  /* ---------------------------------------------------------------- */
  /* 장 이동 (위 단추 · 아래 단추)                                       */
  /* ---------------------------------------------------------------- */

  function buildStepper(host) {
    refs.stepper = el("ol", { class: "t-steps", attrs: { "aria-label": "장 이동" } });

    PAGES.forEach(function (p) {
      var btn = el("button", {
        class: "t-steps__btn",
        attrs: { type: "button", "data-page": String(p.no), "aria-label": p.no + "장 " + p.label + " 보기" },
        on: {
          click: function () {
            goToPage(p.no);
          }
        }
      }, [
        el("span", { class: "t-steps__no", text: String(p.no) }),
        el("span", { class: "t-steps__label", text: p.label })
      ]);
      refs.stepper.appendChild(el("li", { class: "t-steps__item" }, [btn]));
    });

    host.appendChild(el("nav", { class: "t-steps-wrap" }, [refs.stepper]));
  }

  function buildPager(host) {
    refs.btnPrev = el("button", {
      class: "btn btn--ghost",
      text: "← 이전",
      attrs: { type: "button" },
      on: {
        click: function () {
          goToPage(currentPage - 1);
        }
      }
    });

    refs.btnNext = el("button", {
      class: "btn btn--primary",
      text: "다음 →",
      attrs: { type: "button" },
      on: {
        click: function () {
          if (currentPage === PAGES.length) finishReview();
          else goToPage(currentPage + 1);
        }
      }
    });

    refs.pageHint = el("p", { class: "t-pager__hint", attrs: { "aria-live": "polite" } });

    host.appendChild(el("footer", { class: "t-pager" }, [refs.btnPrev, refs.pageHint, refs.btnNext]));
  }

  /**
   * 아래 이동 단추의 상태를 정한다.
   *  · 1장에서는 자료를 불러와야 다음으로 넘어간다.
   *  · 3장에서는 틀린 문제를 모두 확인해야 넘어간다.
   *  · 마지막 장에서는 「마침」 이 된다.
   */
  function updatePager() {
    var last = currentPage === PAGES.length;
    refs.btnPrev.disabled = currentPage === 1;

    if (!last) {
      refs.btnNext.textContent = "다음 →";
      refs.btnNext.classList.remove("btn--finish");
      refs.btnNext.setAttribute("aria-label", "다음 장 보기");

      if (currentPage === 1) {
        refs.btnNext.disabled = !hasData();
        refs.btnNext.title = hasData() ? "" : "먼저 제출 자료를 불러와 주세요.";
        return;
      }
      if (currentPage === 3) {
        var total = T.wrong.topWrong(rows()).length;
        refs.btnNext.disabled = !allWrongSeen;
        refs.btnNext.title = allWrongSeen ? "" : "틀린 문제 " + total + "개를 모두 확인하면 넘어갈 수 있어요.";
        return;
      }
      refs.btnNext.disabled = false;
      refs.btnNext.title = "";
      return;
    }

    refs.btnNext.textContent = "마침";
    refs.btnNext.classList.add("btn--finish");
    refs.btnNext.disabled = false;
    refs.btnNext.title = "";
    refs.btnNext.setAttribute("aria-label", "분석 마치기");
  }

  function finishReview() {
    refs.pageHint.textContent = "분석을 마쳤어요 🎉 위 단추나 「← 이전」 으로 다시 볼 수 있어요.";
    refs.btnNext.disabled = true;
    K.toast("형성평가 결과 분석을 마쳤어요.");
    K.announce("형성평가 결과 분석을 마쳤습니다.");
  }

  function goToPage(no) {
    var next = Math.min(PAGES.length, Math.max(1, no));
    if (next === currentPage) return;
    if (next > 1 && !hasData()) {
      setStatus("error", "먼저 제출 자료를 불러와 주세요.");
      return;
    }
    showPage(next);
  }

  function showPage(no) {
    currentPage = no;

    pages.forEach(function (page, i) {
      if (page) page.classList.toggle("is-active", i + 1 === no);
    });

    K.$$(".t-steps__btn", refs.stepper).forEach(function (btn) {
      var n = Number(btn.getAttribute("data-page"));
      btn.classList.toggle("is-current", n === no);
      btn.classList.toggle("is-locked", n > 1 && !hasData());
      btn.setAttribute("aria-current", n === no ? "page" : "false");
    });

    /* 그 장을 열 때 내용을 만든다 — 미리 다 그려 두면 자료가 바뀔 때 어긋난다 */
    drawPage(no);

    updatePager();
    refs.pageHint.textContent = no + " / " + PAGES.length + "장 · " + PAGES[no - 1].label;

    window.scrollTo({ top: 0, behavior: "auto" });
    var page = pages[no - 1];
    if (page) page.focus({ preventScroll: true });
    K.announce(no + "장 " + PAGES[no - 1].label);
  }

  /**
   * 자료를 불러온 뒤 나머지 장을 열어 준다.
   * 처음 불러왔을 때만 2장으로 넘긴다 — 4장에서 다시 불러왔다면 그 자리에 머문다.
   */
  function unlockPages(firstTime) {
    showPage(firstTime ? 2 : currentPage);
  }

  /* ---------------------------------------------------------------- */
  /* 1장 — 결과 불러오기                                                */
  /* ---------------------------------------------------------------- */

  function setStatus(kind, message) {
    if (!refs.status) return;
    refs.status.className = "t-status" + (kind ? " is-" + kind : "");
    refs.status.textContent = message;
  }

  function note(message) {
    if (!refs.serverNote) return;
    K.clear(refs.serverNote);
    if (message) refs.serverNote.appendChild(el("div", { class: "t-warn", text: message }));
  }

  function afterLoad(result, serverHint) {
    var message =
      "새로 " + result.added + "건, 갱신 " + result.updated + "건" +
      (result.skipped ? ", 다른 차시 " + result.skipped + "건 제외" : "") +
      (result.kept ? ", 오래된 제출 " + result.kept + "건 무시" : "");
    setStatus("ok", message + " — 모두 " + T.data.count() + "건");
    K.toast(message);

    /* 한 건도 안 왔다면 서버가 알려 준 «무엇을 켜야 하는지» 를 그대로 보여 준다 */
    if (!hasData() && serverHint) note(serverHint);

    if (hasData()) unlockPages(currentPage === 1);
    else drawPage(1);
  }

  function buildSource(host) {
    var box = K.panel({
      title: "📥 제출 결과 불러오기",
      hint: "공유 드라이브 폴더에 저장된 학생 답안(JSON)을 읽어 옵니다.",
      className: "t-source"
    });

    refs.endpoint = el("input", {
      class: "t-source__input",
      attrs: {
        type: "url",
        placeholder: "https://script.google.com/macros/s/.../exec",
        "aria-label": "결과를 읽어올 Apps Script 주소",
        spellcheck: "false",
        autocomplete: "off"
      }
    });
    refs.endpoint.value = loadEndpoint();

    /* 교사 열쇠 —
       이 차시의 서버는 열쇠가 맞을 때만 목록을 준다(스크립트 속성 TEACHER_KEY).
       그래서 주소 칸과 같은 줄에 하나를 더 둔다. */
    refs.teacherKey = el("input", {
      class: "t-source__input",
      attrs: { type: "password", placeholder: "교사 열쇠", "aria-label": "교사 열쇠", autocomplete: "off" }
    });

    var btnServer = el("button", {
      class: "btn btn--primary",
      text: "제출 결과 불러오기",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에서 읽고 있어요…");
          note("");
          T.data.fetchFromServer(refs.endpoint.value, refs.teacherKey.value).then(function (result) {
            if (!result.ok) {
              setStatus("error", result.message);
              return;
            }
            saveEndpoint(refs.endpoint.value);
            afterLoad(result.count, result.hint);
          });
        }
      }
    });

    refs.fileInput = el("input", {
      class: "sr-only",
      id: "t-file",
      attrs: { type: "file", accept: ".json,application/json", multiple: true, "aria-label": "제출 JSON 파일 열기" }
    });
    refs.fileInput.addEventListener("change", function () {
      if (refs.fileInput.files && refs.fileInput.files.length) {
        T.data.readFiles(refs.fileInput.files).then(function (r) {
          afterLoad(r);
        });
      }
    });

    var btnFile = el("button", {
      class: "btn btn--ghost",
      text: "JSON 파일 열기",
      attrs: { type: "button" },
      on: {
        click: function () {
          refs.fileInput.click();
        }
      }
    });

    /* 무엇이 빠졌는지 짚어 주는 단추 — 폴더·열쇠·Drive API 를 서버에 물어본다 */
    var btnPing = el("button", {
      class: "btn btn--ghost",
      text: "연결 확인",
      attrs: { type: "button" },
      on: {
        click: function () {
          setStatus("loading", "서버에 물어보고 있어요…");
          T.data.pingServer(refs.endpoint.value, refs.teacherKey.value).then(function (r) {
            if (r.ok === false && !r.driveAccess) {
              setStatus("error", r.message || "확인하지 못했습니다.");
              return;
            }

            var lines = [];
            lines.push("폴더 설정 " + (r.folderConfigured ? "✔" : "✘ FOLDER_ID 를 넣어야 합니다"));
            lines.push("교사 열쇠 " + (r.teacherKeyConfigured ? "✔" : "✘ TEACHER_KEY 를 넣어야 합니다"));
            lines.push("폴더 훑는 길 : " + (r.driveAccess || "알 수 없음"));
            if (r.folderName) lines.push("폴더 «" + r.folderName + "» 에 제출 " + r.fileCount + "개");
            if (r.reason) lines.push("(" + r.reason + ")");

            var good = r.ok !== false && r.folderConfigured && r.teacherKeyConfigured;
            setStatus(good ? "ok" : "error", lines.join(" · "));

            /* 공유 드라이브인데 Drive API 를 켜지 않은 것이 가장 흔한 고장이다 */
            note(
              r.driveApiEnabled === false
                ? "공유 드라이브를 쓰신다면 Apps Script 편집기 왼쪽 «서비스 +» 에서 Drive API 를 추가한 뒤 " +
                    "새 버전으로 다시 배포해 주세요. 켜지 않으면 목록이 비어 오고, 재제출이 덮어써지지 않습니다."
                : ""
            );
          });
        }
      }
    });

    box.body.appendChild(
      el("div", { class: "t-source__row" }, [
        refs.endpoint,
        refs.teacherKey,
        btnServer,
        btnPing,
        btnFile,
        refs.fileInput
      ])
    );

    refs.status = el("p", { class: "t-status", attrs: { "aria-live": "polite" } });
    setStatus("", "주소와 교사 열쇠를 넣은 뒤 「제출 결과 불러오기」 를 눌러 주세요.");
    box.body.appendChild(refs.status);

    refs.serverNote = el("div");
    box.body.appendChild(refs.serverNote);

    /* 끌어다 놓기 */
    var drop = el("div", {
      class: "t-drop",
      text: "또는 드라이브에서 내려받은 JSON 파일들을 이곳에 끌어다 놓으세요."
    });
    ["dragenter", "dragover"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.remove("is-over");
      });
    });
    drop.addEventListener("drop", function (e) {
      var files = Array.prototype.filter.call((e.dataTransfer && e.dataTransfer.files) || [], function (f) {
        return /\.json$/i.test(f.name);
      });
      if (files.length) {
        T.data.readFiles(files).then(function (r) {
          afterLoad(r);
        });
      } else {
        setStatus("error", "JSON 파일만 열 수 있어요.");
      }
    });
    box.body.appendChild(drop);

    var hints = el("ul", { class: "t-hint-list" });
    hints.appendChild(
      el("li", {
        text: "주소에서 바로 읽으려면 apps-script/Code.gs 를 웹앱으로 배포하고, 스크립트 속성의 TEACHER_KEY 를 위 칸에 넣어야 해요. 안 되면 [연결 확인] 을 눌러 보세요."
      })
    );
    hints.appendChild(
      el("li", {
        text: "배포가 어렵다면 드라이브 폴더에서 학번_이름.json 파일을 내려받아 「JSON 파일 열기」 로 한꺼번에 선택해도 됩니다."
      })
    );
    box.body.appendChild(hints);

    host.appendChild(box.root);

    /* 자료가 없을 때의 빈 안내 */
    refs.empty = K.panel({});
    refs.empty.body.appendChild(el("p", { class: "t-empty", text: "아직 불러온 제출이 없어요." }));
    refs.empty.body.appendChild(
      el("p", {
        class: "panel__hint",
        text: "위에서 「제출 결과 불러오기」 를 누르거나, 드라이브에서 내려받은 JSON 파일을 열어 주세요."
      })
    );
    host.appendChild(refs.empty.root);
  }

  /* ---------------------------------------------------------------- */
  /* 접어 두는 덧자료                                                   */
  /*                                                                  */
  /* 장을 늘리지 않고 이 차시에만 있는 자료를 담는 자리다.                  */
  /* 닫힌 채로 나오고 인쇄에서도 빠지므로 화면 모양은 lesson3_7_1 과 같다.   */
  /* ---------------------------------------------------------------- */

  function foldout(title, build) {
    var body = el("div", { class: "stack" });
    var wrap = el("details", { class: "t-fold no-print" }, [
      el("summary", { class: "t-fold__sum", text: title }),
      body
    ]);
    var built = false;
    /* 펼칠 때 만든다 — 열지 않으면 그리지 않아 장 넘기기가 빠르다 */
    wrap.addEventListener("toggle", function () {
      if (!wrap.open || built) return;
      built = true;
      build(body);
    });
    return wrap;
  }

  /* ---------------------------------------------------------------- */
  /* 각 장의 내용                                                       */
  /* ---------------------------------------------------------------- */

  function drawPage(no) {
    var page = pages[no - 1];
    if (!page) return;

    /* 1장은 처음 한 번만 만들고, 그 뒤에는 «빈 안내» 만 켜고 끈다 */
    if (no === 1) {
      if (refs.empty) refs.empty.root.hidden = hasData();
      return;
    }

    K.clear(page);
    var all = rows();

    if (no === 2) {
      var summary = K.panel({ title: "📊 전체 요약" });
      summary.body.appendChild(T.views.summary(all, {}));
      page.appendChild(summary.root);

      var podium = K.panel({ title: "🏆 상위 3명" });
      podium.body.appendChild(T.views.podium(all));
      page.appendChild(podium.root);
      return;
    }

    if (no === 3) {
      var wrongBox = K.panel({
        title: "📌 가장 많이 틀린 문제",
        hint: "버튼을 누를 때마다 한 문제씩 해설과 함께 보여 줍니다. (최대 " + T.wrong.WRONG_LIMIT + "문제)"
      });
      wrongBox.body.appendChild(
        T.wrong.render(all, function (seen, total) {
          allWrongSeen = total === 0 || seen >= total;
          updatePager();
        })
      );

      /* 다섯 문항 전체의 정답·해설과 오개념 지도는 접어 둔다 */
      wrongBox.body.appendChild(
        foldout("정답 · 해설 전체 보기 (5문항 · 회로 정답 · 대표 오개념)", function (body) {
          body.appendChild(T.guide.render());
        })
      );
      page.appendChild(wrongBox.root);
      return;
    }

    if (no === 4) {
      page.appendChild(
        T.list.render(all, function () {
          drawPage(4);
        })
      );

      /* 회로·코드·실험 수행은 표 아래에 접어 둔다 */
      page.appendChild(
        foldout("활동 수행 자세히 보기 (회로 · 코드 · 실험)", function (body) {
          var circuitBox = K.panel({ title: "🔌 회로 수행" });
          circuitBox.body.appendChild(T.views.circuit(all));
          body.appendChild(circuitBox.root);

          var codeBox = K.panel({ title: "⌨ 코드 수행" });
          codeBox.body.appendChild(T.views.code(all));
          body.appendChild(codeBox.root);

          var expBox = K.panel({ title: "🧪 실험 기록 (예상 · 관찰 · 확장 활동)" });
          expBox.body.appendChild(T.views.experiment(all));
          body.appendChild(expBox.root);
        })
      );
    }
  }

  /* ---------------------------------------------------------------- */
  /* 시작                                                             */
  /* ---------------------------------------------------------------- */

  function start() {
    var host = K.$("#t-main");
    if (!host) return;

    K.clear(host);
    buildHeader(host);
    buildStepper(host);

    PAGES.forEach(function (p) {
      var page = el("section", {
        class: "t-page",
        attrs: { "data-page": String(p.no), "aria-label": p.no + "장 " + p.label, tabindex: "-1" }
      });
      pages.push(page);
      host.appendChild(page);
    });

    buildSource(pages[0]);
    buildPager(host);
    showPage(1);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }

  T.main = {
    PAGES: PAGES,
    rows: rows,
    goToPage: goToPage,
    stampPrintDate: stampPrintDate,
    refresh: function () {
      drawPage(currentPage);
    }
  };
})();
    </script>
  </body>
</html>
