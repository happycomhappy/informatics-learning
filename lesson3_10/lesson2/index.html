    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();
    </script>
    <script data-from="student/s40-board.js">
/**
 * 회로 그림과 조작 (명세 6.1 · 13장)
 *
 * 부품 그림은 «자체 SVG» 로 그린다. 사진을 베끼지 않는다(명세 13장).
 * 그리는 좌표는 shared/circuit.js 가 갖고 있고, 여기서는 그 좌표대로 그리기만 한다.
 *
 * 세 가지 방식으로 모두 조작할 수 있어야 한다 (명세 13장)
 *   마우스 · 터치 : 단자를 차례로 누른다
 *   키보드        : 화살표로 단자 사이를 옮기고 Enter 로 고른다.
 *                  더 빠른 길로 «목록에서 골라 잇기» 도 함께 둔다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  /**
   * 케이블 색.
   *
   * ★ 두 갈래를 «주황» 과 «파랑» 으로 둔다.
   *   검정은 청록 보드와 검은 헤더 위에서 잘 보이지 않았다(선생님 지적).
   *   주황–파랑은 밝은 바탕에서 둘 다 또렷하고, 서로 «따뜻한 색 / 찬 색» 이라
   *   적록색약에서도 갈라 보인다. 명세 6.1 이 GND 를 «검정/파랑» 으로 허용한다.
   */
  var WIRE_COLORS = {
    red: "#d63b2f",
    black: "#22262c",
    yellow: "#e3a008",
    /* 실제로 쓰는 두 가지 */
    orange: "#ea580c",
    blue: "#1d4ed8",
    /* 회로에 쓰이지 않는 케이블 — 흐리게 두어 «이건 빠져 있다» 가 보이게 */
    gray: "#9aa3ae"
  };

  /** 케이블 색을 말로 — 색만으로 뜻을 전하지 않기 위해(명세 13장) */
  var COLOR_WORD = {
    red: "빨강",
    black: "검정",
    yellow: "노랑",
    orange: "주황",
    blue: "파랑",
    gray: "회색"
  };

  /**
   * ★ 케이블 색은 «회로의 어느 쪽인가» 로 정한다.
   *
   *   D11 → 저항 → LED 긴 다리   가 모두 «주황»  (신호가 나가는 길)
   *   LED 짧은 다리 → GND        가 모두 «파랑»  (전류가 돌아오는 길)
   *
   *   두 끝만 보고 색을 정하면 가운데 케이블(저항–LED, 브레드보드 사이)이
   *   양쪽 다 같은 색이 되어 «어디까지가 어느 쪽인지» 가 보이지 않는다.
   *
   *   색은 판정에 쓰지 않는다(명세 6.1). 그래서 옆에 «D11 쪽/GND 쪽» 글자를 함께 적는다.
   */
  var SIDE_COLOR = { source: "orange", ground: "blue", "": "gray" };
  var SIDE_WORD = { source: "D11 쪽", ground: "GND 쪽", "": "쓰이지 않음" };

  /**
   * 그림 폭을 정한다 — 이 계산은 «한 곳» 에만 둔다.
   *
   * 폭을 픽셀로 직접 적는 까닭 : CSS 의 min-width 와 함께 쓰면
   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   *
   * 좁은 칸에서는 바닥값을 두어 단자가 손가락보다 작아지지 않게 한다(명세 6.1).
   * 그래도 [−] 로 줄이면 전체를 한눈에 볼 수 있다.
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    var available = host.clientWidth || 320;
    var base = available < 560 ? Math.max(available, 640) : available;
    svgNode.style.width = Math.round(base * zoom) + "px";
  }

  /**
   * 창 크기가 바뀌면 폭을 다시 맞춘다.
   *
   * 픽셀로 적어 둔 폭은 창이 바뀌어도 그대로 남는다.
   * 그러면 화면을 돌리거나 창을 줄였을 때 단자가 손가락보다 작아진 채로 있다.
   * 그림마다 듣는 이를 붙이면 화면을 다시 그릴 때 쌓이므로, «한 번만» 붙이고
   * 그때그때 화면에 놓인 그림을 찾아 고친다.
   */
  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /**
   * 회로 화면 하나를 만든다.
   *
   *   opts.mode        'find'(단자 찾기) · 'wire'(결선) · 'probe'(멀티미터)
   *   opts.showBoard   우노를 보일 것인가 (기본 true)
   *   opts.showBread   브레드보드를 보일 것인가
   *   opts.getState    () => 회로 상태 { connections, powerOn, ... }
   *   opts.onPick      (component, pin) => void        — 단자를 하나 눌렀을 때 (find 모드)
   *   opts.onConnect   (connection) => void            — 케이블이 하나 생겼을 때
   *   opts.onProbe     (a, b) => void                  — 탐침 두 곳이 정해졌을 때
   *   opts.onMessage   (text) => void                  — 안내 문구를 바깥에 알릴 때
   */
  function create(opts) {
    var o = opts || {};
    var mode = o.mode || "wire";
    var showBoard = o.showBoard !== false;
    var showBread = o.showBread === true;
    /* 이 차시에는 LED·저항이 있다. 3A(찾기)와 3B(결선) 모두 부품을 보여 준다. */
    var showParts = o.showParts !== false;

    var zoom = 1;
    var pending = null; /* 첫 번째로 고른 단자 */
    var probes = [null, null];
    var focusKey = showBoard ? "uno/" + C.LED_PIN_NAME : showBread ? "bb/TP-1" : "led/A";

    var svgHost = UI.el("div", { class: "board__canvas" });
    var statusLine = UI.el("p", {
      class: "board__status",
      attrs: { role: "status", "aria-live": "polite" },
      text: ""
    });

    /* ------------------------------------------------------------------ */
    /* 그리기                                                              */
    /* ------------------------------------------------------------------ */

    function keyOf(componentId, pinId) {
      return componentId + "/" + pinId;
    }

    function splitKey(key) {
      var i = String(key).indexOf("/");
      return { component: key.slice(0, i), pin: key.slice(i + 1) };
    }

    /** 지금 이 단자가 선택 상태인가 */
    function isPending(componentId, pinId) {
      return pending && pending.component === componentId && pending.pin === pinId;
    }

    function isProbe(componentId, pinId) {
      return probes.some(function (p) {
        return p && p.component === componentId && p.pin === pinId;
      });
    }

    /** 화면 낭독기가 읽을 단자 설명 */
    function terminalLabel(componentId, pin, net, powerOn) {
      var parts = [C.describe(componentId, pin.id)];
      parts.push(C.KIND_WORD[pin.kind] || "단자");
      if (powerOn && net) {
        var v = net.potentialAt(componentId, pin.id);
        if (v === 5) parts.push("5V 전원");
        else if (v === 0) parts.push("0V 접지");
      }
      if (isPending(componentId, pin.id)) parts.push("선택됨");
      return parts.join(", ");
    }

    function drawUno(state, net, powerOn) {
      var g = UI.svg("g", { class: "uno" });
      var box = C.UNO.box;

      g.appendChild(
        UI.svg("rect", {
          x: box.x, y: box.y, width: box.w, height: box.h,
          rx: 12, class: "uno__body"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.usbBox.x, y: C.UNO.usbBox.y,
          width: C.UNO.usbBox.w, height: C.UNO.usbBox.h,
          rx: 3, class: "uno__usb"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.jackBox.x, y: C.UNO.jackBox.y,
          width: C.UNO.jackBox.w, height: C.UNO.jackBox.h,
          rx: 4, class: "uno__jack"
        })
      );

      /* 헤더 띠 */
      [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
        g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
      });

      /* 보드 이름 — 두 머리띠 사이의 빈 자리에 */
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 162, class: "uno__brandsub" }, [txt("오픈 소스 하드웨어")]));

      /* 무리 이름 — 핀 이름표와 겹치지 않도록 머리띠 «바깥쪽» 에 둔다 */
      g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
      g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
      g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

      C.UNO.pins.forEach(function (pin) {
        g.appendChild(drawPin("uno", pin, state, net, powerOn));
      });
      return g;
    }

    function drawBreadboard(state, net, powerOn) {
      var g = UI.svg("g", { class: "bb" });
      var box = C.BB.box;

      g.appendChild(
        UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" })
      );

      /* 전원 레일 줄무늬 — 어느 레일에 전기가 왔는지 색과 «글자» 로 함께 보인다 */
      C.BB.rails.forEach(function (rail) {
        var live = powerOn && net ? net.potentialOf("bb:rail:" + rail.id) : null;
        var cls = "bb__railline bb__railline--" + rail.polarity + (live !== null ? " bb__railline--live" : "");
        g.appendChild(
          UI.svg("line", { x1: box.x + 10, y1: rail.y, x2: box.x + box.w - 10, y2: rail.y, class: cls })
        );
        g.appendChild(
          UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)])
        );
        /* 전압 표시는 판 «바깥» 오른쪽에 적는다.
           판 안에 적으면 마지막 구멍과 겹치고 글자가 판 밖으로 잘린다. */
        if (live !== null) {
          g.appendChild(
            UI.svg("text", { x: box.x + box.w + 8, y: rail.y + 5, class: "bb__raillive" }, [
              txt(live === 5 ? "5V" : "0V")
            ])
          );
        }
      });

      /* 가운데 홈 */
      g.appendChild(
        UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
      );
      g.appendChild(
        UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 17, class: "bb__gaptext" }, [
          txt("여기서 전극이 끊긴다 — 위 A~E 와 아래 F~J 는 다른 전극")
        ])
      );

      /* 열 번호 — 자리는 A 줄 구멍의 x 를 그대로 쓴다 */
      for (var c = 1; c <= C.BB.cols; c += 1) {
        var aPin = C.terminal("bb", "A" + c);
        if (aPin) {
          g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
        }
      }


      /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
         구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
         이 글자는 눈으로 볼 때만 필요하다. */
      C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
        var pin = C.terminal("bb", row + "1");
        if (!pin) return;
        g.appendChild(
          UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
        );
      });
      C.BB.pins.forEach(function (pin) {
        g.appendChild(drawPin("bb", pin, state, net, powerOn));
      });
      return g;
    }

    /* ------------------------------------------------------------------ */
    /* 부품 — 220Ω 저항과 LED (명세 17.3 A · 13장)                          */
    /*                                                                    */
    /* ★ 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).                   */
    /* ★ 극성을 «색으로만» 알리지 않는다. 다리 길이·평평한 면·글자를 함께 쓴다. */
    /* ------------------------------------------------------------------ */

    var BAND_FILL = { red: "#c0392b", brown: "#7b4a2d", gold: "#c8a13a" };

    function drawResistor(st) {
      var R = C.RES;
      var g = UI.svg("g", { class: "part part--res" });
      var body = R.body;
      var midY = body.y + body.h / 2;

      g.appendChild(
        UI.svg("rect", {
          x: R.box.x, y: R.box.y, width: R.box.w, height: R.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 다리 — 몸통 양쪽으로 뻗은 금속선 */
      R.pins.forEach(function (pin) {
        g.appendChild(
          UI.svg("line", {
            x1: pin.x, y1: pin.y,
            x2: pin.x < body.x ? body.x : body.x + body.w,
            y2: midY,
            class: "part__lead"
          })
        );
      });

      g.appendChild(
        UI.svg("rect", { x: body.x, y: body.y, width: body.w, height: body.h, rx: 9, class: "res__body" })
      );

      /* 띠 — 눈으로 보는 표시일 뿐이다. 값은 아래 글자가 진다(명세 17.3 A). */
      R.bands.forEach(function (band) {
        g.appendChild(
          UI.svg("rect", {
            x: body.x + body.w * band.at - 3, y: body.y,
            width: 6, height: body.h,
            fill: BAND_FILL[band.color] || "#555",
            class: "res__band"
          })
        );
      });

      /* ★ 색각 이상 학생을 위해 «220Ω» 글자를 반드시 병기한다(명세 17.3 A) */
      g.appendChild(
        UI.svg("text", { x: body.x + body.w / 2, y: body.y - 10, class: "part__name" }, [
          txt(C.RESISTOR_OHM + "Ω 저항")
        ])
      );
      g.appendChild(
        UI.svg("text", { x: body.x + body.w / 2, y: body.y + body.h + 20, class: "part__note" }, [
          txt("방향 없음 — 어느 끝이든 좋다")
        ])
      );
      return g;
    }

    function drawLed(st, net, powerOn) {
      var LED = C.LED;
      var lit = powerOn && st.ledOn === true;
      var g = UI.svg("g", { class: "part part--led" + (lit ? " part--lit" : "") });
      var b = LED.body;

      g.appendChild(
        UI.svg("rect", {
          x: LED.box.x, y: LED.box.y, width: LED.box.w, height: LED.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 다리 — A 는 길게, K 는 짧게 그린다. 길이 자체가 극성을 알리는 표시다. */
      ["A", "K"].forEach(function (id) {
        var leg = LED.legs[id];
        g.appendChild(
          UI.svg("line", {
            x1: leg.from.x, y1: leg.from.y, x2: leg.to.x, y2: leg.to.y,
            class: "part__lead part__lead--" + id
          })
        );
      });

      /* 몸통 — 위는 둥글고 K 쪽 옆면이 «평평» 하다.
         d 는 «왼쪽 아래 → 왼쪽 위로 둥글게 → 오른쪽에서 수직으로 잘림» 순서다. */
      var flatX = b.cx + b.r - 7;
      g.appendChild(
        UI.svg("path", {
          d:
            "M " + (b.cx - b.r) + " " + (b.cy + 22) +
            " L " + (b.cx - b.r) + " " + b.cy +
            " A " + b.r + " " + b.r + " 0 0 1 " + flatX + " " + (b.cy - b.r + 3) +
            " L " + flatX + " " + (b.cy + 22) + " Z",
          class: "led__body"
        })
      );
      /* 켜졌을 때 퍼지는 빛 */
      if (lit) {
        g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r + 14, class: "led__glow" }));
      }

      g.appendChild(
        UI.svg("text", { x: b.cx, y: LED.box.y + 16, class: "part__name" }, [txt("LED")])
      );
      /* 평평한 면이 어디인지 «글자로도» 알린다 */
      g.appendChild(
        UI.svg("text", { x: flatX + 12, y: b.cy + 26, class: "led__flatmark" }, [txt("평평한 면")])
      );
      /* 켜짐·꺼짐을 색이 아니라 글자로도 (명세 13장) */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: LED.box.y + LED.box.h - 6, class: "part__state" }, [
          txt(powerOn ? (lit ? "● 켜짐" : "○ 꺼짐") : "전원 꺼짐")
        ])
      );
      return g;
    }

    function drawParts(st, net, powerOn) {
      var g = UI.svg("g", { class: "parts" });
      g.appendChild(drawResistor(st));
      g.appendChild(drawLed(st, net, powerOn));
      C.PARTS.forEach(function (part) {
        part.pins.forEach(function (pin) {
          g.appendChild(drawPin(part.id, pin, st, net, powerOn));
        });
      });
      return g;
    }

    /** 단자 하나 — 눌리는 자리는 보이는 원보다 넉넉하게 잡는다(터치용) */
    function drawPin(componentId, pin, state, net, powerOn) {
      var key = keyOf(componentId, pin.id);
      var selected = isPending(componentId, pin.id);
      var probing = isProbe(componentId, pin.id);
      var volts = powerOn && net ? net.potentialAt(componentId, pin.id) : null;

      var classes = ["pin", "pin--" + pin.kind];
      if (selected) classes.push("pin--selected");
      if (probing) classes.push("pin--probe");
      if (volts === 5) classes.push("pin--hot");
      if (volts === 0) classes.push("pin--gnd");

      var g = UI.svg("g", {
        class: classes.join(" "),
        role: "button",
        tabindex: focusKey === key ? "0" : "-1",
        "data-key": key,
        "aria-label": terminalLabel(componentId, pin, net, powerOn)
      });

      /* 넓은 투명 판 — 손가락으로 눌러도 빗나가지 않게 */
      g.appendChild(
        UI.svg("rect", {
          x: pin.x - C.PITCH / 2, y: pin.y - C.PITCH / 2,
          width: C.PITCH, height: C.PITCH,
          class: "pin__hit"
        })
      );
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "pin__dot" }));

      /* 부품 다리 이름표 — LED 의 A·K 와 저항의 두 끝을 «글자로» 알린다(명세 6.1).
         이름을 적지 않으면 어느 다리가 긴 다리인지 그림만으로 헷갈린다. */
      if (componentId === "led" || componentId === "res") {
        g.appendChild(
          UI.svg("text", { x: pin.x, y: pin.y + 18, class: "pin__label pin__label--part" }, [
            txt(pin.short + (pin.note ? "" : ""))
          ])
        );
      }

      /* 이름표 — 모든 사용 가능 단자에 실제 명칭을 적는다(명세 6.1).
         위 핀은 아래쪽에, 아래 핀은 위쪽에 적어 무리 이름과 겹치지 않게 한다. */
      if (componentId === "uno") {
        g.appendChild(
          UI.svg(
            "text",
            {
              x: pin.x,
              y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
              /* 이름표는 «모두 같은 크기» 다.
                 긴 이름을 줄이면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
                 대신 circuit.js 가 헤더 간격을 30 으로 벌려 두었다. */
              class: "pin__label"
            },
            [txt(pin.label)]
          )
        );
      }

      g.addEventListener("click", function () {
        pick(componentId, pin.id);
      });
      g.addEventListener("keydown", function (evt) {
        onPinKey(evt, componentId, pin);
      });
      g.addEventListener("focus", function () {
        focusKey = key;
        say(terminalLabel(componentId, pin, net, powerOn));
      });

      return g;
    }

    /** 꽂힌 케이블 */
    function drawWires(state) {
      var g = UI.svg("g", { class: "wires" });
      /* 색은 그릴 때 «회로 전체를 보고» 정한다 — 두 끝만으로는 알 수 없다 */
      var sides = C.wireSides(state.connections || []);

      (state.connections || []).forEach(function (conn, i) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;

        /* 살짝 휘어지게 그려 여러 줄이 겹쳐도 구분된다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
        var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;

        var side = sides[i] || "";
        g.appendChild(
          UI.svg("path", {
            d: d,
            class: "wire wire--" + (side || "none"),
            stroke: WIRE_COLORS[SIDE_COLOR[side]] || WIRE_COLORS.gray,
            "data-index": String(i)
          })
        );
      });
      return g;
    }

    function txt(value) {
      return document.createTextNode(String(value));
    }

    /* ------------------------------------------------------------------ */
    /* 조작                                                                */
    /* ------------------------------------------------------------------ */

    function say(message) {
      statusLine.textContent = message;
      if (o.onMessage) o.onMessage(message);
    }

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }

    /** 단자 하나를 눌렀다 */
    function pick(componentId, pinId) {
      focusKey = keyOf(componentId, pinId);

      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      if (mode === "probe") {
        if (!probes[0] || probes[1]) {
          probes = [{ component: componentId, pin: pinId }, null];
          say("탐침 ①을 " + C.describe(componentId, pinId) + " 에 놓았습니다. 다른 곳도 짚어 보세요.");
        } else {
          probes[1] = { component: componentId, pin: pinId };
          say("탐침 ②를 " + C.describe(componentId, pinId) + " 에 놓았습니다.");
          if (o.onProbe) o.onProbe(probes[0], probes[1]);
        }
        render();
        return;
      }

      /* wire 모드 */
      if (!pending) {
        pending = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 을(를) 골랐습니다. 이을 곳을 하나 더 누르세요.");
        render();
        return;
      }

      if (pending.component === componentId && pending.pin === pinId) {
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }

      var conn = C.makeConnection(pending, { component: componentId, pin: pinId });
      pending = null;
      if (!conn) {
        say("이을 수 없는 자리입니다.");
        render();
        return;
      }
      if (C.hasConnection(state().connections, conn)) {
        say("이미 이어져 있는 곳입니다.");
        render();
        return;
      }
      if (o.onConnect) o.onConnect(conn);
      say(
        C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 을(를) " +
          (COLOR_WORD[conn.color] || "") +
          " 케이블로 이었습니다."
      );
      render();
    }

    /** 화살표로 옮겨 다니기 — 지금 위치에서 그 방향으로 가장 가까운 단자 */
    function nearestPin(fromComponent, fromPin, dx, dy) {
      var here = C.terminal(fromComponent, fromPin);
      if (!here) return null;

      var best = null;
      var bestScore = Infinity;

      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;

        comp.pins.forEach(function (pin) {
          if (comp.id === fromComponent && pin.id === fromPin) return;
          var vx = pin.x - here.x;
          var vy = pin.y - here.y;
          /* 가려는 방향으로 나아간 거리 */
          var along = vx * dx + vy * dy;
          if (along <= 0) return;
          /* 옆으로 벗어난 거리 — 많이 벗어날수록 나쁜 후보 */
          var across = Math.abs(vx * dy - vy * dx);
          var score = along + across * 3;
          if (score < bestScore) {
            bestScore = score;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return best;
    }

    function onPinKey(evt, componentId, pin) {
      var dirs = {
        ArrowRight: [1, 0],
        ArrowLeft: [-1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };

      if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
        evt.preventDefault();
        pick(componentId, pin.id);
        return;
      }
      if (evt.key === "Escape" && pending) {
        evt.preventDefault();
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }
      if (!dirs[evt.key]) return;

      evt.preventDefault();
      var target = nearestPin(componentId, pin.id, dirs[evt.key][0], dirs[evt.key][1]);
      if (!target) return;
      focusKey = keyOf(target.component, target.pin);
      render();
      var node = svgHost.querySelector('[data-key="' + cssEscape(focusKey) + '"]');
      if (node) node.focus();
    }

    /** 속성 선택자에 넣어도 안전하게 */
    function cssEscape(value) {
      return String(value).replace(/["\\]/g, "\\$&");
    }

    /* ------------------------------------------------------------------ */
    /* 키보드·화면낭독기용 «목록으로 잇기» (명세 6.1)                        */
    /* ------------------------------------------------------------------ */

    function terminalOptions() {
      var list = [];
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        comp.pins.forEach(function (pin) {
          list.push({ value: keyOf(comp.id, pin.id), label: C.describe(comp.id, pin.id) });
        });
      });
      return list;
    }

    function buildPicker() {
      if (mode === "find") return null;

      var options = terminalOptions();
      function makeSelect(labelText) {
        var id = UI.nextId("sel");
        var select = UI.el("select", { class: "input input--select", id: id });
        options.forEach(function (opt) {
          select.appendChild(UI.el("option", { text: opt.label, attrs: { value: opt.value } }));
        });
        return {
          root: UI.el("div", { class: "field field--inline" }, [
            UI.el("label", { class: "field__label", attrs: { for: id }, text: labelText }),
            select
          ]),
          select: select
        };
      }

      var from = makeSelect(mode === "probe" ? "탐침 ①" : "여기에서");
      var to = makeSelect(mode === "probe" ? "탐침 ②" : "여기까지");
      /* 두 칸이 같은 곳을 가리키면 쓸모가 없으므로 두 번째는 다른 곳으로 미리 옮겨 둔다 */
      if (options.length > 1) to.select.selectedIndex = Math.min(options.length - 1, 1);

      var go = UI.button(mode === "probe" ? "여기에 탐침 대기" : "이 둘을 잇기", {
        class: "btn btn--ghost",
        click: function () {
          var a = splitKey(from.select.value);
          var b = splitKey(to.select.value);
          if (mode === "probe") {
            probes = [a, b];
            render();
            if (o.onProbe) o.onProbe(a, b);
            return;
          }
          pending = a;
          pick(b.component, b.pin);
        }
      });

      return UI.el("details", { class: "board__picker" }, [
        UI.el("summary", { class: "board__pickersum", text: "목록에서 골라 " + (mode === "probe" ? "재기" : "잇기") }),
        UI.el("p", {
          class: "board__pickerhelp",
          text: "그림을 누르기 어려울 때 씁니다. 그림 위에서는 화살표 키로 옮기고 Enter 로 고를 수도 있습니다."
        }),
        UI.el("div", { class: "board__pickerrow" }, [from.root, to.root, go])
      ]);
    }

    /* ------------------------------------------------------------------ */
    /* 도구 막대                                                           */
    /* ------------------------------------------------------------------ */

    function buildTools() {
      if (mode !== "wire") {
        return UI.el("div", { class: "board__tools" }, [zoomGroup()]);
      }

      var connections = state().connections || [];
      var undo = UI.button("한 단계 되돌리기", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onUndo) o.onUndo();
        }
      });
      var reset = UI.button("전체 초기화", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onReset) o.onReset();
        }
      });

      return UI.el("div", { class: "board__tools" }, [
        UI.el("div", { class: "board__toolgroup" }, [undo, reset]),
        zoomGroup()
      ]);
    }

    function zoomGroup() {
      function setZoom(next) {
        /* 하한을 넉넉히 둔다. 좁은 화면에서는 바닥값(640) 에 곱하므로
           0.5 로는 화면 폭에 몇 픽셀 모자라 «전체 보기» 가 되지 않는다. */
        zoom = Math.max(0.4, Math.min(2.4, next));
        applyZoom();
      }
      return UI.el("div", { class: "board__toolgroup", attrs: { role: "group", "aria-label": "확대·축소" } }, [
        UI.button("−", {
          class: "btn btn--ghost btn--icon",
          title: "축소",
          click: function () {
            setZoom(zoom - 0.2);
          }
        }),
        UI.button("기본", {
          class: "btn btn--ghost btn--small",
          click: function () {
            setZoom(1);
          }
        }),
        UI.button("+", {
          class: "btn btn--ghost btn--icon",
          title: "확대",
          click: function () {
            setZoom(zoom + 0.2);
          }
        })
      ]);
    }

    /** 지금 확대 배수로 폭을 맞춘다. 배수를 그림에 적어 두어 창이 바뀔 때도 쓴다. */
    function applyZoom() {
      svgHost.setAttribute("data-zoom", String(zoom));
      fitSvg(svgHost, zoom);
    }

    /* ------------------------------------------------------------------ */
    /* 조립                                                                */
    /* ------------------------------------------------------------------ */

    var toolHost = UI.el("div");
    var pickerHost = UI.el("div");

    function render() {
      var st = state();
      var net = C.solve(st.connections);
      var powerOn = st.powerOn === true;

      /* 우노는 왼쪽, 브레드보드는 오른쪽에 나란히 놓인다(circuit.js 좌표).
         단자 찾기(3A)에서는 브레드보드가 없으므로 보드만 담는 좁은 틀을 쓴다. */
      /* 보이는 부품에 따라 틀을 고른다. 아래쪽 100px 은 LED·저항 자리다. */
      var viewBox = showBread
        ? "0 18 920 400"
        : showParts
        ? "0 18 560 400"
        : "0 18 560 268";

      var svgNode = UI.svg("svg", {
        viewBox: viewBox,
        class: "board__svg",
        role: "img",
        "aria-label":
          (showBread ? "왼쪽에 아두이노 우노, 오른쪽에 브레드보드" : "아두이노 우노 보드") +
          (showParts ? ", 아래쪽에 220옴 저항과 LED" : "")
      });

      if (showBoard) svgNode.appendChild(drawUno(st, net, powerOn));
      if (showBread) svgNode.appendChild(drawBreadboard(st, net, powerOn));
      if (showParts) svgNode.appendChild(drawParts(st, net, powerOn));
      svgNode.appendChild(drawWires(st));

      UI.clear(svgHost).appendChild(svgNode);
      applyZoom();

      UI.clear(toolHost).appendChild(buildTools());
      var picker = buildPicker();
      UI.clear(pickerHost);
      if (picker) pickerHost.appendChild(picker);
    }

    var rootNode = UI.el("div", { class: "board" }, [toolHost, svgHost, statusLine, pickerHost]);

    render();

    return {
      root: rootNode,
      render: render,
      setMode: function (next) {
        mode = next;
        pending = null;
        probes = [null, null];
        render();
      },
      clearProbes: function () {
        probes = [null, null];
        render();
      },
      cancelPending: function () {
        pending = null;
        render();
      },
      getProbes: function () {
        return probes;
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_COLOR: SIDE_COLOR,
    SIDE_WORD: SIDE_WORD
  };
})();
    </script>
    <script data-from="student/s45-figures.js">
/**
 * 설명 그림 (명세 13장)
 *
 * 2단계 «원리 이해» 의 카드가 글만 있어서 장치 그림을 함께 넣는다.
 *
 * ★ 실제 사진을 «복제하지 않는다».
 *   명세 13장 — 「실제 부품 사진을 참고하되 저작권이 불명확한 이미지는
 *   복제하지 말고 자체 SVG로 그린다」.
 *   그래서 실물 사진을 보고 같은 배치로 «직접» 그렸다.
 *   덧붙여, 그림 파일을 심지 않으므로 단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 *
 * 보드와 브레드보드의 좌표는 shared/circuit.js 에서 가져온다.
 * 3단계 시뮬레이터와 «같은 그림» 이어야 학생이 헷갈리지 않기 때문이다.
 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,
 * 화면 낭독기에는 그 목록이 그림의 대체 설명이 된다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  function txt(value) {
    return document.createTextNode(String(value));
  }

  /** 번호 배지 — 그림 위에 얹는 동그란 번호 */
  function badge(no, x, y) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 11, class: "fig__badgebg" }),
      UI.svg("text", { x: x, y: y + 4, class: "fig__badgeno" }, [txt(String(no))])
    ]);
  }

  /**
   * O · X 배지 — «이렇게 꽂는다 / 이렇게 꽂으면 안 된다» 를 나타낸다.
   * 색만으로 알리지 않는다. 동그라미 안의 O·X 글자가 뜻을 지고,
   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.
   */
  function badgeMark(mark, x, y, kind) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg fig__badgebg--" + kind }),
      UI.svg("text", { x: x, y: y + 5, class: "fig__badgeno" }, [txt(mark)])
    ]);
  }

  /**
   * 배지에서 가리키는 곳까지 잇는 선.
   *
   * ★ 두 겹으로 그린다.
   *   아래 : 굵은 «흰» 선 — 청록 보드와 검은 헤더 위에서 선이 묻히지 않게 한다
   *   위   : 가는 «진한 주황» 선 — 흰 종이 위에서도 보이고, 보드 색과 확실히 다르다
   *
   * 한 겹으로는 어느 한쪽 바탕에서 반드시 묻힌다(파란 점선이 청록 보드에서 안 보였다).
   */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", {}, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderhalo" }),
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leader" }),
      /* 가리키는 끝에 점을 찍어 «어디를» 가리키는지 분명히 한다 */
      UI.svg("circle", { cx: x2, cy: y2, r: 3.5, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 덩어리를 만든다.
   *   opts : { viewBox, caption, items:[{text}], build(g) }
   *
   * items 의 차례가 곧 배지 번호다. build 안에서 badge(n, x, y) 로 같은 번호를 얹는다.
   */
  function figure(opts) {
    var o = opts || {};
    var items = o.items || [];

    /* 배지에 쓸 표시. 따로 주지 않으면 1, 2, 3 … 을 쓴다.
       그림의 배지와 아래 설명 목록은 반드시 «같은 표시» 여야 한다.
       그림에는 O 인데 목록에는 다른 글자가 있으면 짝을 지을 수 없다. */
    var marks = o.marks || items.map(function (_, i) {
      /* 배지에 그리는 것과 «똑같은» 숫자를 목록에도 쓴다 */
      return String(i + 1);
    });

    /* 그림의 «대체 설명» — 낭독기는 이 글을 읽는다 */
    var alt =
      o.caption +
      ". 표시된 곳 : " +
      items
        .map(function (item, i) {
          return marks[i] + " " + item.text;
        })
        .join(", ");

    var svgNode = UI.svg("svg", {
      viewBox: o.viewBox,
      class: "fig__svg",
      role: "img",
      "aria-label": alt
    });
    if (o.build) o.build(svgNode);

    var legend = UI.el("ol", { class: "fig__legend" }, items.map(function (item, i) {
      var kind = (o.markKinds || [])[i];
      return UI.el("li", { class: "fig__item" }, [
        UI.el("span", {
          class: "fig__no" + (kind ? " fig__no--" + kind : ""),
          attrs: { "aria-hidden": "true" },
          text: marks[i]
        }),
        UI.el("span", { class: "fig__text", text: item.text })
      ]);
    }));

    /* 브레드보드처럼 «세로로 긴» 그림은 그대로 두면 화면을 다 차지한다.
       narrow 를 주면 폭을 묶어 카드 안에 들어오는 크기로 줄인다. */
    return UI.el("figure", { class: "fig" + (o.narrow ? " fig--narrow" : "") }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      UI.el("figcaption", { class: "fig__cap", text: o.caption }),
      legend
    ]);
  }

  /* ================================================================== */
  /* 1. 아두이노 우노 보드                                                */
  /* ================================================================== */

  /** 3단계 시뮬레이터와 같은 좌표로 보드를 그린다(누를 수는 없는 «설명용») */
  function drawUnoBody(g) {
    var box = C.UNO.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12, class: "uno__body" }));
    [C.UNO.usbBox, C.UNO.jackBox].forEach(function (b) {
      g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: "uno__usb" }));
    });
    [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
      g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
    });

    /* 보드 위의 큰 부품들 — 실물을 보고 자리만 맞추어 단순하게 */
    var chip = C.UNO.chip;
    g.appendChild(UI.svg("rect", { x: chip.x, y: chip.y, width: chip.w, height: chip.h, rx: 3, class: "fig__chip" }));
    g.appendChild(
      UI.svg("text", { x: chip.x + chip.w / 2, y: chip.y + 28, class: "fig__chiptext" }, [txt("ATmega328P")])
    );
    /* 리셋 버튼 — 헤더 띠(y 44~72) 를 피해 보드 빈자리에 둔다 */
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 9, class: "fig__reset" }));
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 4, class: "fig__resetin" }));
    g.appendChild(UI.svg("rect", { x: 110, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("rect", { x: 140, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("circle", { cx: 460, cy: 106, r: 5, class: "fig__led" }));
    g.appendChild(UI.svg("text", { x: 474, y: 110, class: "uno__brandsub" }, [txt("ON")]));

    g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));

    /* 무리 이름과 핀 이름표 */
    g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
    g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
    g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

    C.UNO.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "fig__hole" }));
      g.appendChild(
        UI.svg(
          "text",
          {
            x: pin.x,
            y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
            class: "pin__label"
          },
          [txt(pin.label)]
        )
      );
    });
  }

  function unoFigure() {
    return figure({
      viewBox: "-56 -34 676 358",
      caption: "아두이노 우노 보드 — 가장자리 구멍마다 이름이 있다",
      items: [
        { text: "USB 단자 — 컴퓨터와 잇는다. 프로그램을 보내고 전기도 받는다." },
        { text: "디지털 핀 D0~D13 — 위 줄에 있다(가리킨 곳은 D13). 켜짐(HIGH)·꺼짐(LOW) 두 가지만 다룬다." },
        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },
        { text: "5V — 부품에 전기를 보내 주는 «+» 자리." },
        { text: "GND — 전기가 돌아오는 길이자 0V 기준점. 세 곳이 보드 안에서 이어져 있다." },
        { text: "ATmega328P — 프로그램이 담겨 «처리» 를 맡는 칩." }
      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;
        var chip = C.UNO.chip;
        var d13 = C.terminal("uno", "D13");
        var vcc = C.terminal("uno", "5V");
        var gnd = C.terminal("uno", "GND2");
        var a0 = C.terminal("uno", "A0");

        /* ① USB — 보드 왼쪽 밖에서 가로로 */
        g.appendChild(leader(-27, usb.y + usb.h / 2, usb.x - 2, usb.y + usb.h / 2));
        g.appendChild(badge(1, -40, usb.y + usb.h / 2));

        /* ② 디지털 핀 — «D13 구멍» 을 바로 위에서 가리킨다.
              무리 이름은 x 300 으로 비켜 두었으므로 이 선과 겹치지 않는다. */
        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));
        g.appendChild(badge(2, d13.x, -20));

        /* ③ 아날로그 핀 — «A0 구멍» 을 바로 아래에서.
              A0~A5 가운데를 가리키면 A2·A3 사이를 짚어 어느 핀인지 알 수 없다. */
        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        /* ④ 5V — 그 구멍을 바로 아래에서 */
        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));
        g.appendChild(badge(4, vcc.x, 315));

        /* ⑤ GND — 세 곳 중 아래 줄의 GND 구멍을 바로 아래에서 */
        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }
    });
  }

  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

  function breadboardFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "브레드보드 — 어느 구멍끼리 이어지는가(같은 전극)",
      items: [
        { text: "+ 레일(빨간 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극이라 5V 를 한 곳에만 넣으면 된다." },
        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },
        { text: "가운데 홈 — 여기서 전극이 끊긴다. 위와 아래가 서로 붙지 않게 일부러 끊어 놓은 것이다." },

      ],
      build: function (g) {

        /* 4번 열을 위(A~E)·아래(F~J)로 나누어 감싼다.
           같은 열이어도 홈을 넘으면 «다른 전극» 이라는 것이 이 그림의 요점이다. */
        wrapColumn(g, "A4", "E4", "fig__hilite");
        wrapColumn(g, "F4", "J4", "fig__hilite--other");

        /* 가리키는 자리는 실제 구멍 좌표에서 가져온다 */

        g.appendChild(leader(right, railTN.y, railTN.x + 14, railTN.y));

        g.appendChild(leader(right, gapMid, 800, gapMid));

        g.appendChild(leader(right, h4.y, h4.x + 11, h4.y));
        g.appendChild(badge(5, right + 14, h4.y));
      }
    });

  /*                                                                    */
  /* 왼쪽 그림(전극 지도)이 «어느 구멍이 이어지는가» 를 알려 준다면        */
  /* 이 그림은 «그래서 꽂을 때 무엇을 조심하는가» 를 알려 준다.            */
  /* 두 장을 나란히 두어야 지도와 쓰임새가 한눈에 이어진다.                */

        /* ── ② 다리를 같은 열에 (9번) — 붙어 버린 것을 굵은 선으로 ── */
        wrapColumn(g, "A9", "E9", "fig__hilite--bad");

        var right = 904;

        g.appendChild(leader(right, a3.y, a3.x + 11, a3.y));

        g.appendChild(badgeMark("X", right + 14, c9.y, "no"));
      }
    });
  }

  /* ================================================================== */
  /* 이 차시의 그림 — LED 와 저항 (명세 13장 · 17.2)                       */
  /*                                                                    */
  /* 실물 사진을 복제하지 않고 자체 SVG 로 그린다.                          */
  /* 색만으로 뜻을 전하지 않는다 — 배지 번호와 아래 설명 목록이 짝을 이룬다.  */
  /* ================================================================== */

  /** LED 를 크게 그린다. 다리 길이가 다르고 K 쪽 옆면이 평평하다. */
  function bigLed(g, cx, baseY, opts) {
    var o = opts || {};
    var r = o.r || 40;
    var cy = baseY - 46;
    var flatX = cx + r - 11;
    var lit = o.lit === true;

    /* 몸통 — 위는 둥글고 오른쪽(K 쪽) 옆면이 잘려 «평평» 하다 */
    g.appendChild(
      UI.svg("path", {
        d:
          "M " + (cx - r) + " " + (baseY - 10) +
          " L " + (cx - r) + " " + cy +
          " A " + r + " " + r + " 0 0 1 " + flatX + " " + (cy - r + 5) +
          " L " + flatX + " " + (baseY - 10) + " Z",
        class: "figled__body" + (lit ? " figled__body--on" : "")
      })
    );
    /* 아래 테두리(플랜지) — 실물 LED 의 둥근 턱 */
    g.appendChild(
      UI.svg("rect", { x: cx - r - 4, y: baseY - 12, width: 2 * r + 8, height: 9, rx: 3, class: "figled__flange" })
    );

    /* 다리 — 왼쪽(A)이 «더 길다». 길이 자체가 극성을 알리는 표시다. */
    g.appendChild(
      UI.svg("line", { x1: cx - 16, y1: baseY - 3, x2: cx - 16, y2: baseY + 72, class: "figled__leg" })
    );
    g.appendChild(
      UI.svg("line", { x1: cx + 16, y1: baseY - 3, x2: cx + 16, y2: baseY + 44, class: "figled__leg" })
    );
    return { cx: cx, cy: cy, r: r, flatX: flatX, baseY: baseY };
  }

    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, [no, lineNode(line)]);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 (① 코드 조립)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 흩어진 줄을 «위·아래» 로 옮겨 바른 차례로 만든다.
   * 끌어 놓기(drag) 대신 단추를 쓴다 — 키보드와 터치에서 모두 확실하게 동작한다(명세 13장).
   */
  function assembler(order, onChange) {
    var lines = A.ASSEMBLE_LINES;
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */
    var current = (order && order.length === lines.length ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      if (onChange) onChange(current.slice(), sourceOf());
      UI.announce((index + 1) + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;
      if (btn) btn.focus();
    }

    /** 지금 차례를 코드 글로 — 들여쓰기는 정답 줄에 적힌 대로 넣어 준다 */
    function sourceOf() {
      return current
        .map(function (id) {
          var line = byId[id];
          return "  ".repeat(line.indent) + line.text;
        })
        .join("\n");
    }

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];
        var item = UI.el("li", { class: "assemble__item" }, [
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);
        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        listHost.appendChild(item);
      });
    }

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", { class: "assemble__help", text: "▲ ▼ 단추로 줄의 차례를 바로잡으세요." }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isSolved: function () {
        return current.every(function (id, i) {
          return byId[id].order === i + 1;
        });
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  function blanks(values, onChange) {
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    A.BLANK_TEMPLATE.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: { type: "text", placeholder: line.hint, spellcheck: "false", autocapitalize: "off" }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        host.appendChild(
          UI.el("div", { class: "blanks__row" }, [
            UI.el("label", { class: "sr-only", attrs: { for: id }, text: line.hint }),
            input
          ])
        );
        return;
      }

      host.appendChild(
        UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
          UI.el("code", { class: "blanks__fixed" }, [lineNode(line.text)])
        ])
      );
    });

    function sourceOf() {
      return A.BLANK_TEMPLATE.lines
        .map(function (line) {
          if (!line.blank) return line.text;
          var typed = String(current[line.blank] || "").trim();
          return "  ".repeat(line.indent || 0) + typed;
        })
        .join("\n");
    }

    return {
      root: host,
      getSource: sourceOf,
      getValues: function () {
        return current;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — LED 등과 «누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(1000) 이면 1초를 기다린다. 그래야 LED 가 실제 보드처럼 깜빡이고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다(명세 29장 4번).
     *
     *     1배속   delay 값 그대로 (delay(1000) → 1초)
     *     0.5배속 두 배 천천히 — 깜빡임을 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

    <script data-from="student/s60-screens.js">
/**

 *   1 시작하기 · 2 원리 이해 · 3 회로 결선 · 4 텍스트 코딩 · 5 실행·탐구 · 6 형성평가·제출

  /* ================================================================== */

   */
  function functionCards() {

          ]),

          ]),

  }

  /**
   * 2단계 — 원리 이해 (명세 17.2)
   *
   * 순서를 명세 17.2 그대로 지킨다.
   *   ① 신호등·상태 표시등에서 LED 의 역할 찾기
   *   ② LED 내부 구조와 발광 원리   ③ 긴 다리 A · 짧은 다리 K
   *   ④ 저항이 전류를 제한하는 이유  ⑤ 디지털 출력 HIGH·LOW
   *   ⑥ pinMode · digitalWrite · delay 함수 카드
   *   ⑦ 개념 확인 3문항 — «배운 뒤에» 묻는다
   */
  function renderConcept(state, app) {
    var box = el("div");
    var roleInfo = L.LED_ROLE;

    /* ① 우리 둘레의 LED — 문제 상황 (명세 17.2 첫 활동) */
    box.appendChild(
      UI.card({ eyebrow: "찾아보기", title: roleInfo.title, desc: roleInfo.story }, [
        el(
          "div",
          { class: "iocards" },
          roleInfo.cases.map(function (c) {
            return el("div", { class: "iocard iocard--role" }, [
              el("p", { class: "iocard__role" }, [
                el("span", { class: "iocard__icon", attrs: { "aria-hidden": "true" }, text: c.icon }),
                el("span", { text: c.name })
              ]),
              el("h3", { class: "iocard__title", text: c.role }),
              el("p", { class: "iocard__device", text: c.what }),
              el("p", { class: "iocard__detail", text: c.detail })
            ]);
          })
        ),
        el("p", { class: "flowline", attrs: { "aria-hidden": "true" }, text: "켜짐 · 꺼짐 → 신호" }),
        el("p", { class: "para", text: roleInfo.conclusion })
      ])
    );

    /* ②~⑥ 개념 카드 — 하나씩 열어 읽는다 */
    box.appendChild(
      UI.card({ title: "핵심 개념 탐구", desc: "다섯 장을 모두 열어 읽어 보세요." }, [
        el(
          "div",
          { class: "explore" },
          L.CONCEPT_CARDS.map(function (c) {
            var opened = state.concept.opened[c.id] === true;

            var body = c.body.map(function (line) {
              return el("p", { class: "para", text: line });
            });

            /* 그림은 자체 SVG 다 (명세 13장 — 저작권이 불명확한 사진을 쓰지 않는다) */
            body.push(S.figures ? S.figures.forCard(c.id) : null);

            /* 함수 카드 (명세 17.2 ⑥) — 4단계와 «같은 것» 을 쓴다 */
            if (c.functions) {
              body.push(functionCards());
            }

            if (c.keyPoints) {
              body.push(
                el("ul", { class: "keypoints" }, c.keyPoints.map(function (k) {
                  return el("li", { class: "keypoints__item", text: k });
                }))
              );
            }

            var details = el("details", { class: "explore__item", attrs: { "data-card": c.id } }, [
              el("summary", { class: "explore__sum" }, [
                el("span", { class: "explore__mark", attrs: { "aria-hidden": "true" }, text: opened ? "✔" : "＋" }),
                el("span", { class: "explore__title", text: c.title }),
                el("span", { class: "explore__lead", text: c.lead })
              ]),
              el("div", { class: "explore__body" }, body)
            ]);

            if (opened) details.open = true;
            details.addEventListener("toggle", function () {
              if (!details.open || state.concept.opened[c.id]) return;
              app.patch(function (s) {
                s.concept.opened[c.id] = true;
              });
            });
            return details;
          })
        )
      ])
    );

    /* setup / loop 흐름 그림 */
    box.appendChild(
      UI.card({ title: "setup() 은 한 번, loop() 는 계속" }, [
        el("div", { class: "flow" }, L.SKETCH_FLOW.map(function (step, i) {
          return el("div", { class: "flow__step flow__step--" + step.phase }, [
            el("span", { class: "flow__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
            el("p", { class: "flow__label", text: step.label }),
            el("p", { class: "flow__note", text: step.note }),
            step.phase === "loop" ? el("span", { class: "flow__repeat", text: "↻ 되풀이" }) : null
          ]);
        })),
        ED
          ? ED.codeView(A.REFERENCE_CODE, { caption: "오늘 만들 기준 프로그램 — 4단계에서 한 줄씩 읽습니다" }).root
          : UI.codeBlock(A.REFERENCE_CODE, "오늘 만들 기준 프로그램")
      ])
    );

    /**
     * 같은 일을 하는 두 가지 프로그램.
     *
     * ★ 하나만 보여 주면 학생은 «반드시 그렇게 써야 하는 줄» 안다.
     *   둘을 나란히 놓아야 무엇이 규칙이고 무엇이 골라 쓰는 것인지 갈린다.
     */
    var W2 = L.TWO_WAYS;
    box.appendChild(
      UI.card({ eyebrow: "핀을 적는 두 가지 방법", title: W2.title, desc: W2.intro }, [
        el(
          "div",
          { class: "twoways" },
          W2.ways.map(function (way) {
            /* 좋은 점(＋)과 아쉬운 점(－) 을 한 목록에 모은다.
               색이 아니라 ＋ · － 기호와 낭독용 글이 뜻을 진다(명세 13장). */
            function point(text, kind) {
              return el("li", { class: "twoway__point twoway__point--" + kind }, [
                el("span", {
                  class: "twoway__mark",
                  attrs: { "aria-hidden": "true" },
                  text: kind === "good" ? "＋" : "－"
                }),
                el("span", { class: "sr-only", text: kind === "good" ? "좋은 점 : " : "아쉬운 점 : " }),
                el("span", { text: text })
              ]);
            }

            var points = [];
            (way.good || []).forEach(function (t) {
              points.push(point(t, "good"));
            });
            (way.bad || []).forEach(function (t) {
              points.push(point(t, "bad"));
            });

            return el("div", { class: "twoway" }, [
              el("p", { class: "twoway__label", text: way.label }),
              el("code", { class: "twoway__lead", text: way.lead }),
              ED ? ED.codeView(way.code, {}).root : UI.codeBlock(way.code, way.label),
              el("ul", { class: "twoway__points" }, points)
            ]);
          })
        ),
        UI.alert("ok", W2.same),
        UI.alert("info", W2.choose)
      ])
    );

    /* ⑦ 개념 확인 — 오답에는 정답을 알려 주지 않고 «돌아갈 카드» 를 알려 준다(명세 17.2) */
    var checkBox = el("div");
    L.CONCEPT_CHECK.forEach(function (q) {
      var picked = state.concept.checkChoices[q.id];
      var passed = state.concept.checks[q.id] === true;
      var feedback = el("div", { class: "feedback" });

      if (picked !== undefined) {
        if (passed) {
          feedback.appendChild(UI.alert("ok", "맞았습니다."));
        } else {
          var card = null;
          L.CONCEPT_CARDS.forEach(function (c) {
            if (c.id === q.review) card = c;
          });
          feedback.appendChild(
            UI.alert("warn", "다시 골라 보세요. " + q.hint, [
              card
                ? UI.button("«" + card.title + "» 카드 다시 보기", {
                    class: "btn btn--ghost btn--small",
                    click: function () {
                      /* 정답을 알려 주지 않고 «읽을 자리» 로 데려다 준다 */
                      var node = document.querySelector('[data-card="' + card.id + '"]');
                      if (!node) return;
                      node.open = true;
                      node.scrollIntoView({ block: "center" });
                      var sum = node.querySelector("summary");
                      if (sum) sum.focus();
                    }
                  })
                : null
            ])
          );
        }
      }

      checkBox.appendChild(
        el("div", { class: "quizitem" }, [
          UI.choiceGroup(
            { name: "cc-" + q.id, choices: q.choices, legend: q.question },
            picked,
            function (index) {
              app.update(function (s) {
                s.concept.checkChoices[q.id] = index;
                s.concept.checks[q.id] = index === q.answerIndex;
              });
            }
          ),
          feedback
        ])
      );
    });

    var done = L.CONCEPT_CHECK.filter(function (q) {
      return state.concept.checks[q.id] === true;
    }).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "개념 확인",
          title: "세 문항을 모두 맞히면 다음 단계가 열립니다.",
          desc: "지금 " + done + " / " + L.CONCEPT_CHECK.length + " 문항"
        },
        [checkBox]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 3단계 — 회로 결선                                                   */
  /* ================================================================== */

  /**
   * 3단계는 두 판으로 나뉜다.
   *   3-A 단자 찾기  — 보드 위에서 이름을 찾아 누른다
   *   3-B 전원 결선  — 우노의 전원을 브레드보드로 보내고 전압을 재어 확인한다
   *
   * 화면을 짤 때 지킨 것
   *   ① «지금 할 일» 을 맨 위에 한 줄로 적는다. 학생이 무엇을 하는 화면인지 바로 알게.
   *   ② 그 아래 «회로 점검» — 채운 조건과 못 채운 조건. 힌트 단추는 그 줄에 «붙여» 둔다.
   *      (조건 목록과 힌트 줄을 따로 두면 같은 문장이 두 번 나온다)
   *   ③ 그림은 그다음이다. 할 일을 읽고 그림으로 내려가는 순서다.
   */

  /** 작은 진행 표시 — ①②③④ 중 어디까지 왔는지 한 줄로 */
  function taskStrip(items) {
    return el("ol", { class: "tasks" }, items.map(function (item, i) {
      var state = item.done ? "is-done" : item.now ? "is-now" : "";
      return el("li", { class: ("tasks__item " + state).trim() }, [
        el("span", { class: "tasks__no", attrs: { "aria-hidden": "true" }, text: item.done ? "✔" : String(i + 1) }),
        el("span", { class: "tasks__text", text: item.text }),
        el("span", { class: "sr-only", text: item.done ? " 마침" : item.now ? " 지금 할 일" : " 아직" })
      ]);
    }));
  }

  /**
   * 「지금 할 일」 한 줄 — 상태를 보고 다음 행동 «하나만» 고른다.
   *
   * ★ 여러 줄을 한꺼번에 늘어놓지 않는다. 회로가 엉켰을 때 고칠 것이 대여섯 개로 보이면
   *   학생은 어디부터 손대야 할지 알 수 없다. 판정도 그렇게 하도록 circuit.js 가
   *   «아직 판정할 수 없는» 항목을 blocked 로 돌려준다.
   */
  function nowDoing(state, check, dangers) {
    var c = state.circuit;

    /* 위험 연결이 가장 먼저다 — 그것을 고치기 전에는 나머지를 볼 까닭이 없다 */
    if (dangers.length > 0) {
      return { at: 0, text: dangers[0].title + " — 아래 경고를 읽고 그 케이블부터 고치세요." };
    }

    var missing = {};
    check.missing.forEach(function (m) {
      missing[m.id] = true;
    });

    if (missing["c-anode"]) {
      return {
        at: 1,
        text: "우노의 «" + C.LED_PIN_NAME + "» 에서 (저항을 거쳐) LED 의 «긴 다리 A» 까지 이으세요."
      };
    }
    if (missing["c-resistor"]) {
      return { at: 1, text: C.RESISTOR_OHM + "Ω 저항이 경로에 없습니다. 저항을 한 줄로 끼워 넣으세요." };
    }
    if (missing["c-cathode"]) {
      return { at: 2, text: "LED 의 «짧은 다리 K» 를 우노의 «GND» 로 이으세요. 전류가 돌아올 길입니다." };
    }
    if (missing["c-tidy"]) {
      return { at: 2, text: "쓰지 않는 케이블이나 반쯤 꽂힌 다리가 있습니다. 아래 목록에서 정리하세요." };
    }
    if (!c.powerOn) {
      return { at: 3, text: "점검을 모두 통과했습니다. 아래 [전원 켜기] 를 눌러 전기를 넣으세요." };
    }
    return { at: 4, text: "3단계를 마쳤습니다. 아래 [다음] 으로 넘어가세요." };
  }

  /** 회로가 바뀌면 «전원·점검·측정» 은 처음부터 다시 확인한다 */
  function resetPower(s) {
    s.circuit.powerOn = false;
    s.circuit.checked = false;
    s.circuit.probeIndex = 0;
    s.circuit.probeDone = false;
    s.circuit.lastMeasure = null;
    if (!C.checkCircuit(s.circuit.connections).ok) s.circuit.checkPassed = false;
  }

  /**
   * 케이블 색이 무엇을 뜻하는지 그림 바로 아래에 적는다.
   * 색을 «읽는 법» 을 모르면 색을 나눈 뜻이 없다.
   */
  function wireLegend() {
