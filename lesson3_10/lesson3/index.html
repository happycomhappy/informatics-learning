          return p.hz === 0 && p.ms > 0;
        });
        if (gaps.length === 0) {
          return {
            ok: false,
            message:
              "음과 음이 빈틈없이 이어져 있습니다. delay 를 tone 의 길이보다 조금 길게 두면 " +
              "그 차이만큼 조용한 사이가 생겨 음이 또렷이 갈라집니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-notone",
      label: "다 울린 뒤 noTone() 으로 멈춘다",
      run: function (ast) {
        var stops = allCalls(ast, "noTone");
        if (stops.length === 0) {
          return {
            ok: false,
            message:
              "noTone(...) 이 없습니다. 소리를 멈추는 함수는 noTone 입니다. 예) noTone(speakerPin);"
          };
        }
        var wrongPin = stops.filter(function (c) {
          return (c.args || []).length === 0;
        });
        if (wrongPin.length > 0) {
          return { ok: false, message: "noTone 에는 «어느 핀» 을 멈출지 적습니다. 예) noTone(speakerPin);" };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pin-match",
      label: "코드의 핀 번호가 회로에 이은 핀과 같다",
      run: function (ast, ctx) {
        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0) {
          return { ok: false, message: "3단계에서 회로를 먼저 이어 주세요. 이을 핀이 없으면 맞대어 볼 수 없습니다." };
        }
        var problems = PC.circuit ? PC.circuit.pinMismatch(pinsUsed(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis",
    /* 이 차시에서 늘어난 둘 (명세 4장) */
    "tone",
    "noTone"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "tone", "noTone"];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2 · 17.4 8번)
   *
   * ★ speakerPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   *   풀지 않으면 회로와 맞대어 볼 수 없어 8번 검사가 늘 실패한다.
   */
  function pinsUsed(ast) {
    var uses = [];

    /* 전역에서 숫자로 초기화한 이름만 모은다. 나중에 바뀌는 값은 알 수 없으므로 세지 않는다. */
    var known = {};
    (ast.globals || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  /* ------------------------------------------------------------------ */
  /* 확장 활동 검사 (5단계 «나만의 알림음»)                                 */
  /*                                                                    */
  /* ★ 4단계의 TESTS 를 그대로 쓸 수 «없다».                              */
  /*   그쪽은 정해진 여덟 음의 음계를 맞대어 보는 검사라 «notes[] 에 무엇이   */
  /*   적혀 있는가» 까지 따진다. 확장 활동은 학생이 «자기 알림음» 을 만드는   */
  /*   자리이므로, 무엇을 적었는지가 아니라 «짜임새가 맞는가» 만 본다.       */
  /*                                                                    */
  /* ★ 마지막 항목은 «실제로 돌려» 본다. delay 가 tone 보다 길어야 음이      */
  /*   갈라진다는 이 차시의 알맹이는, 눈으로 세는 것으로는 확인할 수 없다.    */
  /* ------------------------------------------------------------------ */

  var ALARM_TESTS = [
    {
      id: "x-pin",
      label: "speakerPin 에 핀 번호를 적었다",
      run: function (ast) {
        var found = (ast.globals || []).filter(function (g) {
          return g.kind === "declare" && g.name === "speakerPin";
        });
        if (found.length === 0) {
          return { ok: false, message: "맨 윗줄의 const int speakerPin = ...; 를 지우지 마세요." };
        }
        return { ok: true };
      }
    },
    {
      id: "x-array",
      label: "쓸 음의 주파수를 배열에 적었다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var names = Object.keys(arrays);
        if (names.length === 0) {
          return {
            ok: false,
            message: "주파수 배열이 없습니다. int alarm[] = {523, 659, 784}; 처럼 «중괄호 안에» 적어 주세요."
          };
        }
        var items = arrays[names[0]] || [];
        if (items.length === 0) {
          return { ok: false, message: "배열이 비어 있습니다. 쓸 음의 주파수를 하나 이상 적어 주세요." };
        }
        /* items 는 «해석된 나무» 다 — 숫자만 꺼내 견준다 */
        var bad = items
          .map(function (it) {
            return it && it.kind === "number" ? it.value : null;
          })
          .filter(function (v) {
            return v === null || !(v >= PC.FREQ_MIN && v <= PC.FREQ_MAX);
          });
        if (bad.length > 0) {
          return {
            ok: false,
            message:
              "«" + bad[0] + "» 은(는) 이 스피커가 낼 수 있는 " + PC.FREQ_MIN + " ~ " + PC.FREQ_MAX +
              "Hz 를 벗어납니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-for",
      label: "for 문의 횟수가 음의 개수와 같다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var name = Object.keys(arrays)[0] || "";
        var count = (arrays[name] || []).length;

        var loops = [];
        ["setup", "loop"].forEach(function (fnName) {
          var fn = ast.functions[fnName];
          if (!fn) return;
          (fn.body || []).forEach(function walk(stmt) {
            if (!stmt) return;
            if (stmt.kind === "for") loops.push(stmt);
            if (Array.isArray(stmt.body)) stmt.body.forEach(walk);
            if (Array.isArray(stmt.then)) stmt.then.forEach(walk);
            if (Array.isArray(stmt.otherwise)) stmt.otherwise.forEach(walk);
          });
        });
        if (loops.length === 0) {
          return {
            ok: false,
            message: "for 문이 없습니다. for (int i=0; i<" + (count || 3) + "; i++) { 처럼 적어 주세요."
          };
        }

        /* 되풀이 횟수를 읽어 «배열의 개수» 와 맞대어 본다 */
        var test = loops[0].cond;
        var limit =
          test && test.right && test.right.kind === "number" ? test.right.value : null;
        if (limit === null) return { ok: true };
        if (count && limit !== count) {
          return {
            ok: false,
            message:
              "배열에는 음이 " + count + "개인데 for 문은 " + limit + "번 돕니다. " +
              (limit > count
                ? "배열에 없는 자리를 읽으려 해서 도중에 멈춥니다."
                : "뒤의 음이 울리지 않습니다.") +
              " i<" + count + " 로 맞춰 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-tone",
      label: "for 문 안에서 배열의 음을 하나씩 낸다",
      run: function (ast) {
        var tones = allCalls(ast, "tone");
        if (tones.length === 0) {
          return { ok: false, message: "tone(...) 이 없습니다. 예) tone(speakerPin, alarm[i], 150);" };
        }
        var arrays = arraysIn(ast);
        var name = Object.keys(arrays)[0] || "";
        var reads = tones.filter(function (c) {
          var freq = (c.args || [])[1];
          return freq && freq.kind === "index" && (!name || freq.name === name);
        });
        if (reads.length === 0) {
          return {
            ok: false,
            message:
              "tone 의 두 번째 값이 늘 같습니다. " + (name || "alarm") +
              "[i] 처럼 «i 번째 음» 을 적어야 음이 바뀝니다."
          };
        }
        var noDuration = reads.filter(function (c) {
          return (c.args || []).length < 3;
        });
        if (noDuration.length === reads.length) {
          return {
            ok: false,
            message:
              "tone 의 세 번째 값(길이)을 적지 않았습니다. 이 수업에서는 길이를 적는 방법으로 만듭니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-notone",
      label: "for 문 안에서 noTone() 으로 한 음을 마무리한다",
      run: function (ast) {
        var stops = allCalls(ast, "noTone");
        if (stops.length === 0) {
          return { ok: false, message: "noTone(...) 이 없습니다. 예) noTone(speakerPin);" };
        }
        if ((stops[0].args || []).length === 0) {
          return { ok: false, message: "noTone 에는 «어느 핀» 을 멈출지 적습니다. 예) noTone(speakerPin);" };
        }
        return { ok: true };
      }
    },
    {
      id: "x-gap",
      label: "돌려 보니 음이 «갈라져» 들린다",
      run: function (ast, ctx) {
        /**
         * ★ 이 항목만 «실제로 돌려» 본다.
         *   delay 가 tone 의 길이보다 길어야 음이 갈라진다는 것은
         *   줄을 세어서는 알 수 없고 시간표를 보아야 안다.
         */
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var result = run(source, { loopLimit: 2, speakerPin: codeSpeakerPin(ast) });
        if (result.error) {
          return { ok: false, message: result.error.message };
        }
        var phases = tonePhases(result);
        var sounds = phases.filter(function (p) {
          return p.hz > 0;
        });
        if (sounds.length === 0) {
          return { ok: false, message: "돌려 보니 소리가 한 번도 나지 않았습니다." };
        }
        var gaps = phases.filter(function (p) {
          return p.hz === 0 && p.ms > 0;
        });
        if (sounds.length > 1 && gaps.length === 0) {
          return {
            ok: false,
            message:
              "음은 여러 개인데 «사이» 가 없어 하나로 이어 들립니다. " +
              "delay 를 tone 의 길이보다 «길게» 두세요."
          };
        }
        return { ok: true };
      }
    }
  ];

  /**
   * 확장 활동 코드를 살펴본다. validate() 와 돌려주는 모양이 같다.
   *   { ok, parsed, error, tests: [{id,label,ok,message}], passed }
   */
  function validateAlarm(source) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        tests: ALARM_TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0
      };
    }
    var ast = parsed.ast;
    var results = ALARM_TESTS.map(function (t) {
      var r = t.run(ast, { source: source });
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;
    return {
      ok: passed === results.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed
    };
  }

  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = { connections: (ctx && ctx.connections) || [], source: source };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *   opts.speakerPin : 어느 핀에 피에조가 달렸는가 (기본 8)
   *
   * 돌려주는 것 : { ok, trace, console, pins, led, elapsed, stopped, error }
   *   trace 의 한 칸 = { t, line, kind, text, phase, iteration, ledOn }
   *
   * ★ led.timeline 은 «불이 바뀐 순간» 만 담는다(명세 19장 ledOn).
   *   5단계에서 켜짐·꺼짐 시간을 재고, 4단계에서 LED 그림을 물들이는 데 쓴다.
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: {},
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var speakerPin =
      o.speakerPin === undefined ? (PC.SPEAKER_PIN === undefined ? 8 : PC.SPEAKER_PIN) : o.speakerPin;

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      /** 배열은 변수와 따로 담는다 — notes[i] 로만 읽는다 */
      arrays: {},
      pinModes: {},
      pinValues: {},
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0,
      /** 지금 스피커 핀에서 나가는 주파수(Hz). 0 이면 조용하다. */
      hz: 0,
      /** tone(핀, 주파수, 길이) 의 «길이» 가 끝나는 시각. null 이면 멈추라고 할 때까지 울린다. */
      toneStopAt: null,
      toneTimeline: []
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration,
        hz: state.hz
      });
    }

    /** 주파수가 «바뀐 순간» 만 timeline 에 한 칸 남긴다 */
    function setTone(hz, line) {
      var v = Math.max(0, Math.round(Number(hz) || 0));
      if (state.toneTimeline.length > 0 && state.hz === v) return;
      state.hz = v;
      state.toneTimeline.push({ t: state.t, hz: v, line: line || 0 });
    }

    /**
     * ★ 시간을 흘려보낸다 — 이 차시에서 가장 중요한 부분이다.
     *
     *   tone(핀, 주파수, 길이) 는 «기다리지 않는다». 소리를 시작해 놓고 바로 다음 줄로 간다.
     *   그래서 tone(…, 250); delay(400); 은
     *       0~250ms 소리 → 250~400ms 조용 → 다음 음
     *   이 된다. 이 «150ms 의 조용함» 이 음과 음을 가르는 것이고,
     *   delay 를 tone 의 길이보다 짧게 두면 음이 서로 뭉개진다.
     *
     *   시간을 한 번에 더하지 않고 «멈출 시각» 을 지나며 더하는 까닭이 이것이다.
     */
    function advanceTime(ms) {
      var end = state.t + Math.max(0, Number(ms) || 0);
      while (state.toneStopAt !== null && state.toneStopAt <= end) {
        state.t = state.toneStopAt;
        state.toneStopAt = null;
        setTone(0, 0);
      }
      state.t = end;
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    /**
     * 아날로그 입력을 읽는다.
     * 핀은 analogRead(A0) 처럼 «이름» 으로도, analogRead(0) 처럼 «번호» 로도 올 수 있다.
     * 둘 다 sensors 의 A0 칸을 보게 맞춘다.
     */
    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "index": {
          /* 배열 읽기 :  notes[i] */
          var arr = state.arrays[node.name];
          if (!arr) {
            throw new StopRun(
              "배열 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)"
            );
          }
          var at = Math.floor(Number(evaluate(node.index)));
          if (!(at >= 0 && at < arr.length)) {
            /* 실물 아두이노는 조용히 엉뚱한 값을 읽는다. 시뮬레이터는 그 자리에서 멈춰 알려 준다. */
            throw new StopRun(
              node.name + " 에는 값이 " + arr.length + "개뿐인데 " + at + "번째를 읽으려 했습니다. " +
              "칸 번호는 0 부터 " + (arr.length - 1) + " 까지입니다. (" + node.line + "번 줄)"
            );
          }
          return arr[at];
        }
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          var line = {
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          };
          state.out.push(line);
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] = node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, "D" + args[0] + " → " + state.pinModes[args[0]]);
          return 0;

        case "digitalWrite": {
          var value = args[1] ? 1 : 0;
          state.pinValues[args[0]] = value;
          record("pin-write", node.line, "D" + args[0] + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        /**
         * tone(핀, 주파수)          — 멈추라고 할 때까지 울린다
         * tone(핀, 주파수, 길이ms)  — 그 길이만큼 울리고 «저절로» 멈춘다
         *
         * ★ 어느 쪽이든 «기다리지 않는다». 바로 다음 줄로 간다(명세 12장 오개념).
         */
        case "tone": {
          var tonePin = args[0];
          var freq = Math.round(Number(args[1]) || 0);
          var dur = node.args && node.args.length >= 3 ? Math.max(0, Number(args[2]) || 0) : null;

          if (freq <= 0) {
            record("warn", node.line, "주파수가 0 이하라 소리가 나지 않습니다.");
            return 0;
          }
          if (String(tonePin) !== String(speakerPin)) {
            /* 다른 핀으로 소리를 내라고 한 것 — 스피커는 조용하다. 오류는 아니다. */
            record("tone-other", node.line, "D" + tonePin + " ← " + freq + "Hz (스피커 핀이 아님)");
            return 0;
          }

          setTone(freq, node.line);
          state.toneStopAt = dur === null ? null : state.t + dur;
          record(
            "tone",
            node.line,
            "D" + tonePin + " ← " + freq + "Hz" + (dur === null ? " (멈출 때까지)" : " · " + dur + "ms")
          );
          return 0;
        }

        case "noTone": {
          if (String(args[0]) === String(speakerPin)) {
            state.toneStopAt = null;
            setTone(0, node.line);
          }
          record("no-tone", node.line, "D" + args[0] + " 소리 멈춤");
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, "D" + args[0] + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          advanceTime(ms);
          record("delay", node.line, String(ms));
          return 0;
        }

        case "millis":
          return state.t;

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "declare-array":
          state.arrays[stmt.name] = (stmt.items || []).map(function (item) {
            return evaluate(item);
          });
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        case "for": {
          /**
           * ① 처음에 한 번 → ② 조건을 본다 → ③ 안쪽 → ④ 값을 바꾼다 → ② 로
           *
           * ★ 조건이 늘 참인 코드를 막는 것은 stepLimit 하나뿐이다.
           *   tick() 이 명령을 셀 때마다 올라가므로 여기서 따로 셀 필요가 없다.
           */
          if (stmt.init) execStatement(stmt.init);
          while (stmt.cond === null || evaluate(stmt.cond)) {
            state.steps += 1;
            if (state.steps > stepLimit) throw new StopRun("steps");
            execBlock(stmt.body);
            if (stmt.step) execStatement(stmt.step);
          }
          return;
        }
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        if (g.kind === "declare-array") {
          state.arrays[g.name] = (g.items || []).map(function (item) {
            return evaluate(item);
          });
          return;
        }
        state.vars[g.name] = g.init ? evaluate(g.init) : 0;
      });

      state.phase = "setup";
      record("phase", ast.functions.setup ? ast.functions.setup.line : 0, "setup() 시작");
      if (ast.functions.setup) execBlock(ast.functions.setup.body);
      record("phase-end", 0, "setup() 끝 — 여기까지는 «한 번만» 실행됩니다.");

      state.phase = "loop";
      if (ast.functions.loop) {
        for (var i = 0; i < loopLimit; i += 1) {
          state.iteration = i + 1;
          record("phase", ast.functions.loop.line, "loop() " + (i + 1) + "번째");
          execBlock(ast.functions.loop.body);
        }
        stopped = "loop-limit";
      }
    } catch (err) {
      if (err && err.name === "StopRun") {
        stopped = err.reason === "steps" ? "step-limit" : "runtime";
        if (err.reason !== "steps") error = { line: 0, message: err.reason, code: "runtime" };
      } else {
        stopped = "runtime";
        error = { line: 0, message: "실행 중 문제가 생겼습니다.", code: "runtime" };
      }
    }

    /**
     * ★ 마지막 음의 «길이» 를 남긴다.
     *   tone(…, 250) 뒤에 아무 delay 없이 프로그램이 끝나면 멈춘 자국이 없어
     *   그 음이 «영원히 울린 것» 처럼 보인다. 예약된 멈춤을 여기서 한 번 흘려보낸다.
     */
    if (state.toneStopAt !== null) {
      state.t = Math.max(state.t, state.toneStopAt);
      state.toneStopAt = null;

  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});

  var LIMITS = PC.LIMITS || {};
  var SCHEMA_VERSION = PC.SCHEMA_VERSION || 1;
  var LESSON_ID = PC.LESSON_ID || "physical_3";

  /* ------------------------------------------------------------------ */
  /* 작은 도구                                                            */
  /* ------------------------------------------------------------------ */

  function text(value) {
    if (value === null || value === undefined) return "";
    return String(value).trim();
  }

  /** 너무 긴 입력은 잘라 낸다(통신량과 저장 파일 크기 보호) */
  function clip(value, max) {
    var s = text(value);
    var limit = max || LIMITS.textMax || 1000;
    return s.length > limit ? s.slice(0, limit) : s;
  }

  /** 공백을 뺀 «내용 글자 수». 스페이스만 눌러 글자 수를 채우지 못하게 한다. */
  function contentLength(value) {
    return text(value).replace(/\s+/g, "").length;
  }

  function isRange(n, min, max) {
    return typeof n === "number" && !isNaN(n) && n >= min && n <= max;
  }

  /* ------------------------------------------------------------------ */
  /* 학생 정보                                                            */
  /* ------------------------------------------------------------------ */

  /**
   * 학번을 학년·반·번호로 가른다.  "10312" → { grade:1, classNumber:3, studentNumber:12 }
   * 다섯 자리가 아니거나 범위를 벗어나면 null.
   */
  function parseStudentId(value) {
    var s = text(value);
    var digits = LIMITS.studentIdDigits || 5;
    if (!new RegExp("^\\d{" + digits + "}$").test(s)) return null;

    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, 3), 10);
    var studentNumber = parseInt(s.slice(3, 5), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};
    var digits = LIMITS.studentIdDigits || 5;

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== digits) {
      errors.studentId = "학번은 " + digits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro":
        /* 시작 화면에서는 «묻지 않는다». 아직 배우지 않았으므로
           확인 질문 대신 안전 수칙 확인만으로 다음 단계를 연다. */
        if (!s.intro || s.intro.safetyRead !== true) {
          reasons.push("안전 수칙을 읽고 확인해 주세요.");
        }
        break;

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = (PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3);
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        var c = s.circuit || {};
        if (c.findDone !== true) reasons.push("부품과 단자 찾기(3A)를 마쳐 주세요.");
        if (c.checkPassed !== true) reasons.push("[회로 점검] 의 다섯 항목을 모두 채워 주세요.");
        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 주기(켜짐 → 꺼짐)를 끝까지 관찰해 주세요.");
          break;
        }
        /**
         * ★ 조립과 빈칸을 «둘 다» 마쳐야 한다 (선생님 요청 2026-08-20).
         *
         *   방식을 하나 고르고 끝내면, 고르지 않은 쪽의 학습이 통째로 빠진다.
         *   조립은 «차례» 를 익히는 것이고 빈칸은 «줄을 직접 적는» 것이라
         *   배우는 것이 서로 다르다. 전체 편집은 그대로 «해 보고 싶은 사람» 의 자리다.
         */
        if (code.assembleDone !== true) reasons.push("[① 코드 조립] 을 완성해 주세요 — 여덟 항목을 모두 통과해야 합니다.");
        if (code.blanksDone !== true) reasons.push("[② 빈칸 채우기] 를 완성해 주세요 — 여덟 항목을 모두 통과해야 합니다.");

        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " + (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★ 세 실험을 «모두» 실행하고 «세 칸을 모두» 채워야 통과한다.
         *
         *   명세 17.5 는 «최소 두 실험» 이지만, 선생님 요청으로 셋 다로 올렸다(2026-08-19).
         *   A·B·C 를 견주어 보는 것이 이 단계의 목적이라 하나라도 빠지면 견줄 것이 없다.
         *
         *   확장 활동(나만의 알림음 만들기)은 통과 조건이 «아니다» — 접어 둔 자리다.
         */
        var e = s.experiment || {};
        var runs = e.runs || {};
        var items = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

        var notRun = [];
        var notWritten = [];

        items.forEach(function (item) {
          var r = runs[item.id] || {};
          if (r.ran !== true) {
            notRun.push(item.label);
            return;
          }
          /* 실행한 실험만 «빈칸» 을 따진다 — 아직 못 한 실험까지 나무라면 할 일이 겹쳐 보인다 */
          var blanks = [];
          if (contentLength(r.predict) < 4) blanks.push("예상");
          if (contentLength(r.observation) < (LIMITS.observationMin || 10)) blanks.push("관찰");
          if (contentLength(r.surprise) < 2) blanks.push("예상과 다른 점");
          if (blanks.length > 0) notWritten.push(item.label + "(" + blanks.join("·") + ")");
        });

        if (notRun.length > 0) {
          reasons.push("아직 실행하지 않은 실험이 있습니다 : " + notRun.join(", "));
        }
        if (notWritten.length > 0) {
          reasons.push(
            "아직 비어 있는 칸이 있습니다 : " +
              notWritten.join(", ") +
              " (관찰은 " +
              (LIMITS.observationMin || 10) +
              "자 이상)"
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.2) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 3단계 — 회로 (명세 10장) */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: Number(circuit.attempts) || 0,
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: Number(circuit.findAttempts) || 0,
        hintsUsed: Number(circuit.hintsUsed) || 0,
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 피에조 종류 — 수동인지 모듈형인지에 따라 «뒤집힘» 의 뜻이 달라진다 */
        piezoMode: text(circuit.piezoMode),
        /* 회로 판정 결과를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              direction: text(circuit.path.direction),
              sigFromSource: circuit.path.sigFromSource === true,
              gndToGround: circuit.path.gndToGround === true,
              onPower: circuit.path.onPower === true,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험 (명세 10장 · 17.5) */
      experiment: {
        conditions: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              label: clip(item.label, 60),
              /* 무엇을 바꾼 실험인가 — 높이(freq) · 길이(toneMs) · 사이(stepMs) */
              change: text(item.change),
              factor: Number(item.factor) || 1,
              toneMs: Number(item.toneMs) || 0,
              stepMs: Number(item.stepMs) || 0,
              ran: r.ran === true,
              /* 실제로 울린 음의 수와 걸린 시간 */
              notes: Number(r.notes) || 0,
              elapsed: Number(r.elapsed) || 0
            };
          }),
        observations: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax),
              surprise: clip(r.surprise, LIMITS.textMax)
            };
          }),
        /* 확장 활동 — 나만의 알림음 만들기 (명세 7장 화면5) */
        extension: {
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          tried: experiment.extensionTried === true,
          /* 어떤 알림음을 골랐는가 — 성공음·경고음·호출음 */
          kind: text(experiment.extensionKind)
        }
      },

      /* 6단계 — 형성평가 (명세 10장) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: Number(assessment.attempts) || 0
      }
    };
  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)
   * 학번과 이름과 차시가 같으면 같은 제출로 본다.
   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    function num(v) {
      var n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 피에조 종류 — 수동인지 모듈형인지에 따라 «뒤집힘» 의 뜻이 달라진다 */
        piezoMode: text(circuit.piezoMode),
        /* 회로 판정 결과를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              direction: text(circuit.path.direction),
              sigFromSource: circuit.path.sigFromSource === true,
              gndToGround: circuit.path.gndToGround === true,
              onPower: circuit.path.onPower === true,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        mode: text(code.mode),
        syntaxErrors: Array.isArray(code.syntaxErrors) ? code.syntaxErrors : [],
        pinMismatch: Array.isArray(code.pinMismatch) ? code.pinMismatch : []
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        extension: experiment.extension || { source: "", tried: false }
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

    <script data-from="teacher/t00-core.js">
/**
 * 교사용 코어 — 이름 공간과 화면 부품
 *
 * 교사용은 학생용 파일을 하나도 읽지 않는다. 공통 부품(shared/)만 함께 쓴다.
 * 그래서 학생용 빌드에 교사용 코드가 섞일 일도, 그 반대도 없다.
 *
 * ★ 학생이 쓴 글은 언제나 textContent 로만 넣는다.
 *   innerHTML 을 쓰지 않으므로 <script> 를 적어 낸 답안도 «글자» 로만 보인다.
 *
 * ★ 받은 자료를 브라우저에 «영구 저장하지 않는다»(명세 13장).
 *   localStorage 를 쓰지 않고 메모리에만 둔다. 창을 닫으면 사라진다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  function $(sel, ctx) {
    return (ctx || document).querySelector(sel);
  }

  function $$(sel, ctx) {
    return Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  }

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.class) node.className = o.class;
    if (o.id) node.id = o.id;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === false || v === null || v === undefined) return;
        node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) {
        node.addEventListener(evt, o.on[evt]);
      });
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });

  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);

  }

  /** ISO 시각 → 「2026-08-18 10:20」 */

    if (isNaN(d.getTime())) return String(iso);
    function two(n) {
      return (n < 10 ? "0" : "") + n;
    }
    var base =
      d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) +
      " " + two(d.getHours()) + ":" + two(d.getMinutes());
    return withSeconds ? base + ":" + two(d.getSeconds()) : base;
  }

  /** 표 안에서 긴 글을 짧게 (전체 내용은 학생별 보기에서 본다) */
  function shorten(text, max) {
    var s = String(text || "");
    var limit = max || 18;
    return s.length > limit ? s.slice(0, limit) + "…" : s;
  }

  /** 백분율 — 나눌 것이 없으면 0 */
  function percent(part, whole) {
    if (!whole) return 0;
    return Math.round((part / whole) * 100);
  }

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  /* ------------------------------ 표 부품 ------------------------------ */

  /** 숫자 하나를 크게 보여 주는 칸 */
  /**
   * 숫자 한 칸.
   * 모양은 lesson3_7_1 교사용의 t-stat 과 같게 맞추었다 — 가운데 정렬, 큰 숫자, 작은 단위.
   * 단위는 `unit` 으로 따로 받아 숫자보다 작게 적는다.
   */
  function statCard(label, value, note, unit) {
    return el("div", { class: "t-stat" }, [
      el("p", { class: "t-stat__label", text: label }),
      el("p", { class: "t-stat__value" }, [
        el("span", { text: String(value) }),
        unit ? el("small", { text: " " + unit }) : null
      ]),
      note ? el("p", { class: "t-stat__note", text: note }) : null
    ]);
  }

  /** 숫자 칸들을 담는 격자 */
  function statRow(cards) {
    return el("div", { class: "t-stats" }, cards);
  }

  /**
   * 제목이 붙은 상자. lesson3_7_1 교사용의 panel() 과 같은 짜임새다.
   * { root, body } 를 돌려주므로 부르는 곳에서 body 에 내용을 붙인다.
   */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: ("panel " + (s.className || "")).trim() }, [head, body]);
    return { root: root, body: body };
  }

  /** 단추 한 줄 */
  function btnRow(children) {
    return el("div", { class: "btnrow" }, children);
  }

  /**
   * 가로 막대 하나. 숫자를 «글자로도» 함께 적는다(색만으로 알리지 않기 — 명세 13장).
   */
  function bar(label, value, whole, opts) {
    var o = opts || {};
    var pct = percent(value, whole);
    return el("div", { class: "bar" + (o.strong ? " bar--strong" : "") }, [
      el("p", { class: "bar__label" }, [
        el("span", { class: "bar__name", text: label }),
        el("span", { class: "bar__num", text: value + "명 (" + pct + "%)" })
      ]),
      el("div", { class: "bar__track" }, [
        el("div", { class: "bar__fill", attrs: { style: "width:" + pct + "%" } })
      ])
    ]);
  }

  /** 접었다 펼 수 있는 긴 글 */
  function longText(text) {
    var value = String(text || "");
    var body = el("p", { class: "longtext__body", text: value || "(작성하지 않음)" });
    if (value.length <= 120) return el("div", { class: "longtext" }, [body]);

    body.classList.add("longtext__body--clamp");
    var btn = el("button", {
      class: "btn btn--small btn--ghost",
      text: "펼치기",
      attrs: { type: "button", "aria-expanded": "false" },
      on: {
        click: function () {
          var clamped = body.classList.toggle("longtext__body--clamp");
          btn.textContent = clamped ? "펼치기" : "접기";
          btn.setAttribute("aria-expanded", clamped ? "false" : "true");
        }
      }
    });
    return el("div", { class: "longtext" }, [body, btn]);
  }

  /** 코드 상자 (읽기 전용) */
  function codeBox(source) {
    return el("pre", { class: "codeblock__pre" }, [el("code", { text: String(source || "(작성하지 않음)") })]);
  }

  /** 비어 있을 때의 안내 */
  function empty(message) {
    return el("p", { class: "t-empty", text: message });
  }

  T.core = {
    $: $,
    $$: $$,
    el: el,
    clear: clear,
    fmtTime: fmtTime,
    shorten: shorten,
    percent: percent,
    toast: toast,
    announce: announce,
    statCard: statCard,
    statRow: statRow,
    panel: panel,
    btnRow: btnRow,
    bar: bar,
    longText: longText,
    codeBox: codeBox,
    empty: empty
  };
})();

    <script data-from="teacher/t10-data.js">
/**
 * 자료 불러오기와 통계 (명세 11장)
 *
 * 두 가지 길로 받는다.
 *   ① 업로드   : 학생이 내려받은 JSON 파일 여러 개를 한꺼번에 고른다
 *   ② 서버 목록: Apps Script 웹앱 주소로 물어 본다 (Google Drive 에 쌓인 제출)
 *
 * ★ 받은 자료는 «메모리에만» 둔다. localStorage 에 넣지 않는다(명세 13장).
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var T = PC.teacher || (PC.teacher = {});

  /* 화면이 살아 있는 동안만 갖고 있는 제출 목록 */
  var submissions = [];

  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /* ------------------------------------------------------------------ */
  /* 서버에 물어보기                                                      */
  /*                                                                    */
  /* ★ 두 가지 길로 물어본다. 한 길이 막혀도 다른 길로 간다.               */
  /*                                                                    */
  /*   ① fetch  — 보통 이것으로 된다                                     */
  /*   ② JSONP  — <script> 로 읽어 온다. CORS 를 타지 않는다              */
  /*                                                                    */
  /*   교사용 HTML 은 파일 하나짜리라 선생님이 보통 file:// 로 연다.        */
  /*   그때 출처(origin)가 null 이라 fetch 가 CORS 에 막히는데,            */
  /*   예전에는 그대로 «서버에 물어보고 있어요…» 에서 멈춰 있었다.          */
  /* ------------------------------------------------------------------ */

  /** 아무리 늦어도 이만큼 지나면 «못 했다» 고 알린다 (그냥 멈춰 있으면 안 된다) */
  var TIMEOUT_MS = 12000;

  var jsonpSeq = 0;

  /** 약속이 늦어지면 스스로 끊는다 */
  function withTimeout(promise, ms, message) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error(message));
      }, ms);

      promise.then(
        function (value) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(value);
        },
        function (err) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(err);
        }
      );
    });
  }

  /**
   * JSONP — <script> 태그로 읽어 온다.
   * 서버가 callback 이름으로 감싼 자바스크립트를 돌려주므로 CORS 검사를 받지 않는다.
   */
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      if (typeof document === "undefined") {
        reject(new Error("이 환경에서는 JSONP 를 쓸 수 없습니다."));
        return;
      }

      jsonpSeq += 1;
      var name = "__pcTeacherCb" + jsonpSeq;
      var script = document.createElement("script");
      var done = false;

      function finish(err, data) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try {
          delete root[name];
        } catch (e) {
          root[name] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) reject(err);
        else resolve(data);
      }

      var timer = setTimeout(function () {
        finish(
          new Error(
            "서버가 제때 답하지 않았습니다. 주소가 /exec 로 끝나는지, " +
              "Code.gs 를 고친 뒤 «새 배포» 로 다시 올렸는지 확인해 주세요."
          )
        );
      }, TIMEOUT_MS);

      root[name] = function (data) {
        finish(null, data);
      };

      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + name;
      script.onerror = function () {
        finish(
          new Error(
            "서버에 닿지 못했습니다. 주소가 맞는지, 배포에서 실행을 «나» · 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
          )
        );
      };
      document.head.appendChild(script);

  /**
   * 서버에 한 번 물어본다.
   *   base  : /exec 주소
   *   query : "action=list&key=…"

   * fetch 를 먼저 해 보고, 막히면 JSONP 로 다시 간다.
   * 둘 다 실패하면 «왜 안 되는지» 를 담아 거절한다.
   */
  function askServer(base, query) {
    var url = base + (base.indexOf("?") === -1 ? "?" : "&") + query;
    var f = getFetch();

    var viaFetch = !f
      ? Promise.reject(new Error("이 브라우저에서는 불러올 수 없습니다."))
      : withTimeout(
          f(url, { method: "GET", redirect: "follow" }).then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          }),
          TIMEOUT_MS,
          "서버가 제때 답하지 않았습니다."
        ).then(function (body) {
          try {
            return JSON.parse(body);
          } catch (e) {
            /* 로그인 화면 HTML 이 돌아온 경우다 — 배포 설정이 잘못되었다 */
            throw new Error(
              "서버가 JSON 을 주지 않았습니다. 배포에서 실행을 «나», 액세스를 «모든 사용자» 로 두었는지 확인해 주세요."
            );
          }
        });

    return viaFetch.catch(function (firstErr) {
      /* file:// 에서 열었거나 CORS 에 막힌 것이다 — <script> 로 다시 가 본다 */
      return jsonp(url).catch(function (secondErr) {
        throw new Error(secondErr && secondErr.message ? secondErr.message : firstErr.message);

    });

  /* 담기                                                                */
  /* ------------------------------------------------------------------ */

  /**
   * 제출 하나를 넣는다. 같은 학생의 제출이 이미 있으면 «늦게 낸 것» 만 남긴다.
   * 돌려주는 것 : 'added' | 'updated' | 'kept' | 'skipped'
   */
  function put(raw) {
    if (!PC.schema.isThisLesson(raw)) return "skipped";

    var next = PC.schema.normalizeSubmission(raw);
    if (!next.studentId && !next.studentName) return "skipped";

    var key = PC.schema.dedupeKey(next);
    for (var i = 0; i < submissions.length; i += 1) {
      if (PC.schema.dedupeKey(submissions[i]) !== key) continue;

      var oldAt = submissions[i].serverUpdatedAt || submissions[i].submittedAt || "";
      var newAt = next.serverUpdatedAt || next.submittedAt || "";
      if (newAt >= oldAt) {
        submissions[i] = next;
        return "updated";
      }
      return "kept";
    }
    submissions.push(next);
    return "added";
  }

  /** JSON 글 한 덩어리를 담는다. 배열이어도, 하나여도, {items:[...]} 여도 받는다. */
  function putText(text) {
    var result = { added: 0, updated: 0, kept: 0, skipped: 0, error: "" };
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      result.error = "JSON 형식이 아닙니다.";
      return result;
    }

    var list = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [data];
    list.forEach(function (item) {
      var how = put(item);
      result[how] += 1;
    });
    return result;
  }

  /** 파일 여러 개를 읽어 담는다 (명세 11장 «업로드한 JSON 여러 개») */
  function readFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (files.length === 0) return Promise.resolve({ added: 0, updated: 0, kept: 0, skipped: 0, failed: [] });

    return Promise.all(
      files.map(function (file) {
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({ name: file.name, text: String(reader.result || "") });
          };
          reader.onerror = function () {
            resolve({ name: file.name, text: null });
          };
          reader.readAsText(file, "utf-8");
        });
      })
    ).then(function (results) {
      var total = { added: 0, updated: 0, kept: 0, skipped: 0, failed: [] };
      results.forEach(function (r) {
        if (r.text === null) {
          total.failed.push(r.name + " (읽지 못함)");
          return;
        }
        var one = putText(r.text);
        if (one.error) {
          total.failed.push(r.name + " (" + one.error + ")");
          return;
        }
        total.added += one.added;

        total.kept += one.kept;

  /**

   * 교사 열쇠는 화면에서 받아 그때그때 쓰고 저장하지 않는다.
   */
  function fetchFromServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query =
      "action=list&lessonId=" +
      encodeURIComponent(PC.LESSON_ID) +
      (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query)
      .then(function (data) {
        if (data && data.ok === false) {
          /* 서버가 «무엇이 잘못되었는지» 를 함께 보내면 그대로 붙여 준다.

          var why = [data.message || "서버가 목록을 주지 않았습니다."];
          if (data.reason) why.push("(" + data.reason + ")");
          if (data.hint) why.push(data.hint);
          return { ok: false, message: why.join(" ") };
        }

        var list = Array.isArray(data) ? data : (data && data.items) || [];
        var count = { added: 0, updated: 0, kept: 0, skipped: 0 };
        list.forEach(function (item) {
          count[put(item)] += 1;
        });
        return {
          ok: true,
          count: count,
          total: list.length,
          /* 한 건도 없을 때 무엇을 켜야 하는지 알려 주려고 서버 안내를 그대로 들고 온다 */

  /**
   * 연결 확인 — 주소·열쇠·폴더·Drive API 가 준비되었는지 서버에 물어본다.
   * 목록을 불러오다 막혔을 때 «무엇이 빠졌는지» 를 먼저 짚어 보는 길이다.
   */
  function pingServer(url, teacherKey) {
    var clean = String(url || "").trim();
    if (!clean) return Promise.resolve({ ok: false, message: "서버 주소를 넣어 주세요." });

    var query = "action=ping" + (teacherKey ? "&key=" + encodeURIComponent(teacherKey) : "");

    return askServer(clean, query).catch(function (err) {
      return { ok: false, message: err && err.message ? err.message : "확인하지 못했습니다." };
    });

  function all() {
    return submissions.slice();
  }

  function clearAll() {
    submissions = [];
  }

  function count() {
    return submissions.length;
  }

  /* ------------------------------------------------------------------ */
  /* 통계 (명세 11장 1번)                                                 */
  /* ------------------------------------------------------------------ */

  /**
   * 전체 요약.
   *   expected 는 «수업에 참여한 학생 수». 선생님이 넣으면 제출률을 낼 수 있다.
   */
  function summary(list, expected) {
    var rows = list || [];
    var total = rows.length;
    var scores = rows.map(function (r) {
      return r.assessment.score;
    });
    var passed = rows.filter(function (r) {
      return r.assessment.pass;
    }).length;

    var sum = scores.reduce(function (a, b) {
      return a + b;
    }, 0);

    /* 점수 분포 — 0,2,4,6,8,10 여섯 칸 */
    var buckets = [0, 2, 4, 6, 8, 10].map(function (v) {
      return {
        score: v,
        count: scores.filter(function (s) {
          return s === v;
        }).length
      };
    });

    var maxScore = (PC.ASSESS && PC.ASSESS.total) || 10;

    return {
      total: total,
      expected: Number(expected) || 0,
      submitRate: expected ? T.core.percent(total, Number(expected)) : 0,
      average: total ? Math.round((sum / total) * 10) / 10 : 0,
      /* 교사 화면 2장의 숫자 칸에 그대로 쓴다 */
      maxScore: maxScore,
      highest: total ? Math.max.apply(null, scores) : 0,
      lowest: total ? Math.min.apply(null, scores) : 0,
      perfect: scores.filter(function (v) {
        return v >= maxScore;
      }).length,
      passed: passed,
      failed: total - passed,
      passRate: T.core.percent(passed, total),
      buckets: buckets,

        return r.circuit.completed;
      }).length,
      codeDone: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length

  }

  /**
   * 문항별 분석 (명세 11장 2번)
   *   정답률 · 선택지 분포 · 오답 TOP2 · 주관식 원문
   */
  function questionStats(list) {
    var rows = list || [];
    return PC.quiz.QUESTIONS.map(function (q, index) {
      var answered = [];
      var correct = 0;

      rows.forEach(function (r) {
        var found = null;
        (r.assessment.answers || []).forEach(function (a) {
          if (a && a.id === q.id) found = a;
        });
        var isRight = r.assessment.isCorrect[index] === true;
        if (isRight) correct += 1;
        answered.push({
          studentId: r.studentId,
          studentName: r.studentName,
          value: found ? found.value : null,
          correct: isRight
        });

      var stat = {
        id: q.id,
        no: q.no,
        type: q.type,
        stem: q.stem,
        tag: q.tag,
        total: rows.length,
        correct: correct,
        rate: T.core.percent(correct, rows.length),
        distribution: [],
        worstChoices: [],
        texts: []

      if (q.type === "choice") {
        stat.distribution = q.choices.map(function (label, i) {
          return {
            index: i,
            label: label,
            count: answered.filter(function (a) {
              return a.value === i;
            }).length
          };
        });

        /* 오답 TOP2 — 많이 고른 «틀린» 보기 둘 */
        var answerIndex = PC.quiz.recoverChoiceIndex(q);
        stat.answerIndex = answerIndex;
        stat.worstChoices = stat.distribution
          .filter(function (d) {
            return d.index !== answerIndex && d.count > 0;
          })
          .sort(function (a, b) {
            return b.count - a.count;
          })
          .slice(0, 2);
      } else {
        stat.texts = answered.map(function (a) {
          return {
            studentId: a.studentId,
            studentName: a.studentName,
            text: String(a.value || ""),
            correct: a.correct
          };
        });
      }

      return stat;
    });
  }

  /** 회로 수행 분석 (명세 11장 3번) */
  function circuitStats(list) {
    var rows = list || [];
    var errorCount = {};
    var dangerStudents = 0;

    rows.forEach(function (r) {
      var seen = {};
      (r.circuit.errors || []).forEach(function (e) {
        var code = e && e.code ? e.code : "unknown";
        errorCount[code] = (errorCount[code] || 0) + 1;

      if (Object.keys(seen).length > 0) dangerStudents += 1;

    /* 규칙 이름을 사람 말로 바꾼다 */
    var titleOf = {};
    PC.circuit.DANGER_RULES.forEach(function (rule) {
      titleOf[rule.code] = rule.title;
    });

    var frequent = Object.keys(errorCount)
      .map(function (code) {
        return { code: code, title: titleOf[code] || code, count: errorCount[code] };
      })
      .sort(function (a, b) {
        return b.count - a.count;
      });

    var attempts = rows.map(function (r) {
      return r.circuit.attempts;
    });

    return {
      total: rows.length,
      completed: rows.filter(function (r) {
        return r.circuit.completed;
      }).length,
      avgAttempts: rows.length
        ? Math.round(
            (attempts.reduce(function (a, b) {
              return a + b;
            }, 0) /
              rows.length) *
              10
          ) / 10
        : 0,
      hintUsers: rows.filter(function (r) {
        return r.circuit.hintsUsed > 0;
      }).length,
      dangerStudents: dangerStudents,
      frequent: frequent
    };
  }

  /** 코드 수행 분석 (명세 11장 4번) */
  function codeStats(list) {
    var rows = list || [];
    return {
      total: rows.length,
      allPassed: rows.filter(function (r) {
        return r.code.testsTotal > 0 && r.code.testsPassed === r.code.testsTotal;
      }).length,
      withSyntaxError: rows.filter(function (r) {
        return (r.code.syntaxErrors || []).length > 0;
      }).length,
      withPinMismatch: rows.filter(function (r) {
        return (r.code.pinMismatch || []).length > 0;
      }).length,
      modes: ["assemble", "blank", "edit"].map(function (mode) {
        return {
          mode: mode,
          count: rows.filter(function (r) {
            return r.code.mode === mode;
          }).length
        };
      })
    };
  }

  /**
   * 상위 3명 (명세 11장 마지막 줄)
   *   점수 → 회로 오류 적음 → 코드 테스트 통과 → 제출 시각(빠른 순)
   */
  function topThree(list) {
    return (list || [])
      .slice()
      .sort(function (a, b) {
        if (b.assessment.score !== a.assessment.score) return b.assessment.score - a.assessment.score;

        var aErr = (a.circuit.errors || []).length;
        var bErr = (b.circuit.errors || []).length;
        if (aErr !== bErr) return aErr - bErr;

        if (b.code.testsPassed !== a.code.testsPassed) return b.code.testsPassed - a.code.testsPassed;

        var at = a.serverUpdatedAt || a.submittedAt || "";
        var bt = b.serverUpdatedAt || b.submittedAt || "";
        return at < bt ? -1 : at > bt ? 1 : 0;
      })
      .slice(0, 3);
  }

  T.data = {
    pingServer: pingServer,
    put: put,
    putText: putText,
    readFiles: readFiles,
    fetchFromServer: fetchFromServer,
    all: all,
    clearAll: clearAll,
    count: count,
    summary: summary,
    questionStats: questionStats,
    circuitStats: circuitStats,
    codeStats: codeStats,
    topThree: topThree,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.data;
})();

  /** 끝에서부터 EOCD 시그니처(0x06054b50)를 찾는다 (주석이 붙어 있을 수 있다) */

      if (idCol >= 0 && nameCol >= 0) return { idCol: idCol, nameCol: nameCol, headerRow: r };
    }
    /* 머리글이 없으면 첫 열 = 학번, 둘째 열 = 이름 으로 본다 */
    return { idCol: 0, nameCol: 1, headerRow: -1 };
  }

  /** 행 배열에서 { students, warnings, columns } 를 만든다 (파일 없이도 검사할 수 있게 따로 둔다) */
  function fromRows(rows) {
    var picked = pickColumns(rows || []);
    var students = [];
    var warnings = [];
    var seen = {};

    (rows || []).forEach(function (cells, r) {
      if (r <= picked.headerRow) return;

      var list = cells || [];
      var id = String(list[picked.idCol] === undefined ? "" : list[picked.idCol]).trim();
      var name = String(list[picked.nameCol] === undefined ? "" : list[picked.nameCol]).trim();
      if (!id && !name) return;

      /* 머리글을 못 찾았는데 첫 줄이 「학번/이름」 같은 글자면 건너뛴다 */
      if (picked.headerRow < 0 && r === 0 && (has(ID_HEADERS, norm(id)) || has(NAME_HEADERS, norm(name)))) {
        return;
      }
      if (!id) {
        warnings.push(r + 1 + "행: 학번이 비어 있어 건너뛰었어요. (" + (name || "이름 없음") + ")");
        return;
      }
      if (seen[id]) {
        warnings.push(r + 1 + "행: 학번 " + id + " 이 여러 번 나와 한 번만 썼어요.");
        return;
      }
      seen[id] = true;
      students.push({ id: id, name: name });
    });

    if (!students.length) {
      throw new Error("명단에서 학번을 찾지 못했어요. 첫 줄에 「학번」·「이름」 머리글이 있는지 확인해 주세요.");
    }

    return { students: students, warnings: warnings, columns: picked };
  }

  /** 명단 파일을 읽어 { students, warnings, columns } 를 돌려준다 */
  function parseFile(file) {
    var name = String((file && file.name) || "").toLowerCase();

    if (name.slice(-4) === ".xls") {
      return Promise.reject(
        new Error("예전 형식(.xls)은 읽을 수 없어요. 엑셀에서 .xlsx 또는 CSV 로 저장해 올려 주세요.")
      );
    }

    var readRows = name.slice(-5) === ".xlsx" ? readXlsx(file) : file.text().then(splitDelimited);
    return readRows.then(fromRows);
  }

  /** 학번 비교용 표준형 — 앞의 0 과 공백·기호를 없앤다 */
  function normalizeId(value) {
    var raw = String(value === null || value === undefined ? "" : value).trim();
    var digits = raw.replace(/[^0-9]/g, "");
    if (digits) return String(Number(digits));
    return raw.toLowerCase();
  }

  T.roster = {
    parseFile: parseFile,
    normalizeId: normalizeId,
    /* 아래 둘은 검사에서 쓴다 (파일 없이 판단만 확인한다) */
    fromRows: fromRows,
    splitDelimited: splitDelimited
  };

  if (typeof module !== "undefined" && module.exports) module.exports = T.roster;
})();
