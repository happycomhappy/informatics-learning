/* 나란히 놓일 때는 폭 제한을 칸에 맞긴다 */
.figpair .fig--narrow .fig__canvas {
  max-width: none;
}

/* 세로로 긴 그림 — 폭을 묶어 카드 안에 들어오게 한다 */
.fig--narrow .fig__canvas {
  max-width: 380px;
  margin: 0 auto;
}

.fig--narrow .fig__svg {
  min-width: 0;
}

.fig__cap {
  margin-top: var(--space-2);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.fig__legend {
  list-style: none;
  padding: 0;
  margin-top: var(--space-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.fig__item {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  font-size: var(--fs-small);
}

.fig__no {
  flex: 0 0 auto;
  color: var(--color-primary);
  font-weight: 800;
}

/* 설명 목록의 O · X 표시 — 그림의 배지와 같은 색으로 짝을 맞춘다 */
.fig__no--ok {
  color: var(--color-true-dark);
}

.fig__no--no {
  color: var(--color-error);
}

/* 번호 배지와 지시선 */
.fig__badgebg {
  fill: var(--color-primary);
  stroke: #ffffff;
  stroke-width: 2;
}

.fig__badgeno {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

/* 지시선은 두 겹이다 (s45-figures.js leader 참고)
 * 청록 보드·검은 헤더·흰 종이 «세 바탕» 위에서 모두 보여야 하므로
 * 굵은 흰 선을 깔고 그 위에 진한 주황 선을 얹는다. 보드 색과 확실히 다른 색이다. */
/* O · X 배지 — 글자가 뜻을 지고 색이 거든다 */
.fig__badgebg--ok {
  fill: var(--color-true);
}

.fig__badgebg--no {
  fill: var(--color-error);
}

/* 그 구멍에 부품 다리가 꽂혀 있다 */
.fig__legring {
  fill: none;
  stroke: #b45309;
  stroke-width: 3;
}

/* 같은 전극에 두 다리가 물려 «바로 붙어 버린» 것 */
.fig__shortline {
  stroke: var(--color-error);
  stroke-width: 5;
  stroke-linecap: round;
}

.fig__leaderhalo {
  stroke: #ffffff;
  stroke-width: 6;
  stroke-linecap: round;
}

.fig__leader {
  stroke: #b45309;
  stroke-width: 2.5;
  stroke-linecap: round;
}

/* 가리키는 끝점 — «어디를» 가리키는지 분명히 한다 */
/* ══════════════════════════════════════════════════════════════════
   회로 그림 · 브레드보드 · IDE 설명 그림의 바탕
   ★ 이 묶음을 지우면 SVG 의 글자가 «가운데 정렬» 과 색을 잃는다.
     text-anchor 와 fill 을 CSS 가 지고 있어서, 좌표만 보고는 알 수 없다.
   ══════════════════════════════════════════════════════════════════ */

.ide__title {
  fill: #0f766e;
}

.ide__titletext {
  fill: #ffffff;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__winbtn {
  fill: #a7f3d0;
}

.ide__menu {
  fill: #f1f5f9;
}

.ide__menutext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__toolbar {
  fill: #0f766e;
}

.ide__tool {
  fill: #0d9488;
  stroke: #99f6e4;
  stroke-width: 1.5;
}

.ide__toolicon {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__select {
  fill: #ffffff;
  stroke: #99f6e4;
}

.ide__selecttext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.ide__side {
  fill: #f8fafc;
}

.ide__sideicon {
  fill: #94a3b8;
  font-size: 12px;
  text-anchor: middle;
  font-family: var(--font-sans);
}

.ide__tab {
  fill: #e2e8f0;
}

.ide__tabtext {
  fill: var(--color-text);
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-sans);
}

.ide__code {
  fill: #ffffff;
}

.ide__lineno {
  fill: #94a3b8;
  font-size: 11px;
  text-anchor: end;
  font-family: var(--font-mono);
}

.ide__codetext {
  fill: #1e293b;
  font-size: 11px;
  font-family: var(--font-mono);
  white-space: pre;
}

.ide__status {
  fill: #f1f5f9;
}

.ide__statustext {
  fill: var(--color-text-sub);
  font-size: 10px;
  font-family: var(--font-sans);
}

.circuitpair > .card {
  margin-bottom: 0;
}

.board {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.board__tools {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  justify-content: space-between;
}

.board__toolgroup {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

.board__canvas {
  overflow: auto;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-2);
  max-height: 70vh;
}

.board__svg {
  display: block;
  /* 폭은 s40-board.js 의 applyZoom 이 픽셀로 정한다.
     여기서 min-width 를 주면 확대·축소 단추를 이겨 버린다. */
  height: auto;
}

.board__status {
  min-height: 1.6em;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius);
  padding: var(--space-2) var(--space-3);
}

.board__status:empty {
  display: none;
}

.board__picker {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.board__pickersum {
  min-height: var(--touch-min);
  display: flex;
  align-items: center;
  padding: var(--space-2) var(--space-3);
  font-weight: 700;
  color: var(--color-primary-dark);
  cursor: pointer;
}

.board__pickerhelp {
  padding: 0 var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.board__pickerrow {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
  padding: var(--space-3);
}

.uno__usb,
.uno__jack {
  fill: #b8bec7;
  stroke: #8b939e;
}

.uno__header {
  fill: #17202b;
}

.uno__brand {
  fill: #ffffff;
  font-size: 17px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.uno__brandsub {
  fill: #cfe6e2;
  font-size: 11px;
  font-family: var(--font-sans);
}

.uno__group {
  fill: #ffffff;
  font-size: 10px;
  font-weight: 800;
  font-family: var(--font-sans);
}

.bb__body {
  fill: var(--bb-body);
  stroke: var(--bb-line);
  stroke-width: 2;
}

.bb__railline {
  stroke-width: 2;
}

.bb__railline--plus {
  stroke: var(--rail-plus);
}

.bb__railline--minus {
  stroke: var(--rail-minus);
}

.bb__railline--live {
  stroke-width: 5;
}

.bb__railmark {
  font-size: 12px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-text);
  text-anchor: middle;
}

.bb__raillive {
  font-size: 11px;
  font-weight: 800;
  font-family: var(--font-sans);
  fill: var(--color-true-dark);
  text-anchor: start;
}

.bb__gap {
  fill: #dfe2e7;
}

.bb__gaptext {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.bb__rowlabel {
  font-size: 10px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.bb__colno {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.pin__hit {
  fill: transparent;
}

.pin__dot {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.pin--rail .pin__dot,
.pin--tie .pin__dot {
  fill: #7b838f;
  stroke: #ffffff;
}

/* ── 설명 그림의 공통 글자·부품 ────────────────────────────────
 * ★ 여기를 지우면 그림의 글자가 «가운데 정렬» 을 잃고 오른쪽으로 밀려 잘린다.
 *   text-anchor 를 CSS 가 지고 있으므로, SVG 좌표만 보고 지우면 안 된다.
 * ---------------------------------------------------------------- */
.fig__mini {
  fill: #ffffff;
  stroke: var(--color-border);
  stroke-width: 1.5;
}

.fig__minitext {
  font-size: 13px;
  font-weight: 700;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legname {
  font-size: 15px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__legnote {
  font-size: 11px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
}

.fig__leaderdot {
  fill: #b45309;
  stroke: #ffffff;
  stroke-width: 1.5;
}

.fig__hole {
  fill: var(--pin-hole);
  stroke: #ffffff;
  stroke-width: 1.5;
}

.fig__chip {
  fill: #22262c;
  stroke: #4b5563;
}

.fig__chiptext {
  fill: #cbd5e1;
  font-size: 11px;
  font-weight: 700;
  text-anchor: middle;
  font-family: var(--font-mono);
}

.fig__led {
  fill: #86efac;
  stroke: #16a34a;
}

.fig__part {
  fill: #9ca3af;
  stroke: #6b7280;
}

.fig__reset {
  fill: #c2410c;
  stroke: #7c2d12;
}

.fig__resetin {
  fill: #7c2d12;
}

/* ── 이 차시의 그림 : 피에조 스피커 ───────────────────────────
 * 사진을 복제하지 않고 자체 SVG 로 그린다(명세 13장).
 * 색은 보기 편하라고 있는 것이고, 뜻은 배지 번호와 아래 설명 목록이 진다.
 * ---------------------------------------------------------------- */
/* 네모 물결·사인 물결 (신호 그림과 주파수 그림) */
.figwave__grid {
  stroke: var(--color-border);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}

.figwave__line {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 2.5;
  stroke-linejoin: round;
}

.figwave__span {
  stroke: var(--color-text-sub);
  stroke-width: 1.5;
}

/* 겉모습 — 실물처럼 «검은 원통 + 가운데 소리 구멍» 이다.
   ⊕ 표시는 어두운 몸통 위라 «밝은 바탕 + 어두운 글자» 로 둔다. */
.figpz__case {
  fill: var(--piezo-case);
  stroke: var(--piezo-case-edge);
  stroke-width: 2;
}

.figpz__top {
  fill: var(--piezo-top);
  stroke: var(--piezo-case-edge);
  stroke-width: 1;
}

.figpz__hole {
  fill: var(--piezo-hole);
}

.figpz__markring {
  fill: var(--piezo-markbg);
  stroke: var(--piezo-case-edge);
  stroke-width: 1.5;
}

.figpz__brass {
  fill: var(--piezo-brass);
  stroke: var(--piezo-brass-edge);
  stroke-width: 1.5;
}

.figpz__crystal {
  fill: var(--piezo-crystal);
  stroke: var(--piezo-crystal-edge);
  stroke-width: 1.5;
}

.figpz__center {
  fill: var(--piezo-brass-edge);
}

.figpz__plate {
  fill: var(--piezo-brass);
  stroke: var(--piezo-brass-edge);
  stroke-width: 1;
}

/* 휘어 오른 모습 — 점선이라 «지금 그런 것이 아니라 움직임» 임이 보인다 */
.figpz__bend {
  fill: none;
  stroke: var(--sound-on-edge);
  stroke-width: 2.5;
  stroke-dasharray: 6 5;
}

.figpz__wave {
  fill: none;
  stroke: var(--sound-on);
  stroke-width: 2;
  opacity: 0.45;
}

.figpz__leg {
  stroke: var(--part-lead);
  stroke-width: 5;
  stroke-linecap: round;
}

.figpz__board {
  fill: var(--piezo-board);
  stroke: var(--piezo-board-edge);
  stroke-width: 2;
}

.figpz__pad {
  fill: #d8b26a;
  stroke: #a8853f;
  stroke-width: 1;
}

.figpz__padtext {
  font-size: 12px;
  font-weight: 800;
  text-anchor: middle;
  fill: #1f2937;
}

.figpz__mark {
  font-size: 15px;
  font-weight: 800;
  text-anchor: middle;
  fill: var(--piezo-mark);
  font-family: var(--font-sans);
}

/* ── 케이블 색 범례와 «어느 쪽» 딱지 ─────────────────────────────
 * 색은 회로의 어느 쪽인지로 정해진다. 색을 «읽는 법» 을 옆에 적어 두고,
 * 목록에는 «D11 쪽 / GND 쪽» 을 글자로도 붙인다(명세 6.1 — 색으로 판정하지 않는다).
 * ---------------------------------------------------------------- */
.wirelegend {
  list-style: none;
  margin: var(--space-3) 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
}

.wirelegend__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelegend__dot {
  flex: none;
  width: 22px;
  height: 4px;
  border-radius: 2px;
}

.wirelegend__dot--orange {
  background: #ea580c;
}

.wirelegend__dot--blue {
  background: #1d4ed8;
}

.wirelegend__dot--gray {
  background: #9aa3ae;
}

.wirelist__side {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
}

.wirelist__side--source {
  background: #ffedd5;
  color: #9a3412;
}

.wirelist__side--ground {
  background: #dbeafe;
  color: #1e40af;
}

.wirelist__dot--gray {
  background: #9aa3ae;
}

/* 쓰이지 않는 케이블은 흐리게 — «이건 빠져 있다» 가 보이게 */
.wire--none {
  opacity: 0.55;
  stroke-dasharray: 7 5;
}

/* ── 4단계 A : 프로그램과 함수 설명을 나란히 ──────────────────────
 * 코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않게 한다.
 * 좁은 화면에서는 코드가 위, 설명이 아래로 접힌다.
 * ---------------------------------------------------------------- */
.readpair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.readpair__code,
.readpair__fns {
  min-width: 0;
}

.readpair__fns .subhead {
  margin-top: 0;
}

.readpair__fns .fncards {
  margin-top: var(--space-3);
}

@media (max-width: 900px) {
  .readpair {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ── 3단계 : «지금 이어진 것» 과 «이렇게 이으면 됩니다» ───────────
 * 앞의 것은 늘 보인다 — 앱이 회로를 무엇으로 보고 있는지 되비추는 줄이다.
 * 뒤의 것은 접혀 있다 — 펼쳐야 목표가 보인다(명세 18.2).
 * ---------------------------------------------------------------- */
.nowpath {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-3);
  margin-bottom: var(--space-3);
  background: var(--color-muted-bg);
  border-radius: var(--radius);
}

.nowpath__tag {
  flex: none;
  padding: 1px 8px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.nowpath__text {
  flex: 1 1 240px;
  font-size: var(--fs-small);
}

.goallist {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
  counter-reset: goal;
}

.goallist__item {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.goallist__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.goallist__mark {
  flex: none;
  width: 18px;
  font-weight: 800;
  color: var(--color-text-sub);
  text-align: center;
}

.goallist__item.is-done .goallist__mark {
  color: var(--color-true);
}

.goallist__text {
  flex: 1 1 auto;
  font-size: var(--fs-small);
}

.goallist__state {
  flex: none;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.goallist__item.is-done .goallist__state {
  color: var(--color-true-dark);
}

/* ── 함수 설명 상자 (2단계 «오늘 쓸 함수 세 가지») ────────────────
 * 수업 자료의 크림색 상자를 그대로 옮겼다.
 * 함수마다 «한 줄 정의 → 실제로 적는 꼴 → 언제 쓰는가 → 짚어 줄 것» 차례다.
 * ---------------------------------------------------------------- */
.fncards {
  display: grid;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.fncard {
  padding: var(--space-4) var(--space-5, 20px);
  background: var(--fn-box-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-lg);
}

.fncard__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  margin: 0 0 var(--space-3);
}

.fncard__name {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text);
}

.fncard__summary {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 실제로 적는 꼴 — 학생이 그대로 베껴 쓸 수 있어야 한다 */
.fnforms {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.fnforms__item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--fn-code-bg);
  border: 1px solid var(--fn-box-edge);
  border-radius: var(--radius-sm);
}

.fnforms__label {
  flex: none;
  min-width: 34px;
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.fnforms__code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-text);
  word-break: break-all;
}

.fnforms__comment {
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__means {
  margin: 0 0 var(--space-1);
}

.fncard__when {
  margin: 0 0 var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.fncard__tag {
  display: inline-block;
  padding: 1px 8px;
  margin-right: var(--space-1);
  background: var(--color-muted-bg);
  border-radius: 999px;
  font-weight: 700;
}

.fncard__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 카드마다 붙는 «핵심 정리» */
.keypoints {
  list-style: none;
  margin: var(--space-4) 0 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

.keypoints__item {
  position: relative;
  padding-left: 22px;
  font-size: var(--fs-small);
}

.keypoints__item::before {
  content: "▸";
  position: absolute;
  left: 4px;
  color: var(--color-primary);
  font-weight: 700;
}

/* ── 핀을 적는 두 가지 방법 ───────────────────────────────────────
 * 하나만 보여 주면 «반드시 그렇게 써야 하는 줄» 안다.
 * 둘을 나란히 놓아 무엇이 규칙이고 무엇이 골라 쓰는 것인지 가른다.
 * ---------------------------------------------------------------- */
.twoways {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}

.twoway {
  padding: var(--space-4);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.twoway__label {
  margin: 0 0 var(--space-1);
  font-weight: 800;
}

.twoway__lead {
  display: inline-block;
  margin-bottom: var(--space-3);
  padding: 2px 8px;
  background: var(--color-code-bg);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.twoway__points {
  list-style: none;
  margin: var(--space-3) 0 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

/* 좋은 점·아쉬운 점을 색으로만 가르지 않는다 — ＋ · － 기호가 뜻을 진다 */
.twoway__point {
  display: flex;
  gap: var(--space-2);
  font-size: var(--fs-small);
}

.twoway__mark {
  flex: none;
  width: 18px;
  font-weight: 800;
  text-align: center;
}

.twoway__point--good .twoway__mark {
  color: var(--color-true);
}

.twoway__point--bad .twoway__mark {
  color: var(--color-false-dark);
}

/* ── 실행 화면 : LED 등 · 상태 칸 · 켜짐/꺼짐 시간표 ────────────
 * 켜짐·꺼짐을 색으로만 알리지 않는다(명세 13장).
 * 등에는 ●/○ 와 «켜짐»·«꺼짐» 글자가, 시간표 칸에도 글자가 함께 들어간다.
 * ---------------------------------------------------------------- */
.runpanel {
  display: grid;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--color-surface-alt, #f1f4f9);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.runpanel__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}

.lamp-box {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #ffffff;
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  min-width: 116px;
}

/* 울리기 시작하는 «순간» 이 보이도록 부드럽게 바뀐다.
   음이 갈라지는 것 자체는 재생이 소리 시간표를 그대로 따라가서 생긴다 —
   tone(…, 250) 뒤 delay(400) 이면 1배속에서 실제로 250ms 울리고 150ms 쉰다. */
.lamp-box {
  transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
}

.lamp-box--on {
  border-color: var(--sound-on-edge);
  background: var(--color-primary-soft);
  box-shadow: 0 0 0 4px var(--sound-glow);
}

.lamp {
  font-size: 26px;
  line-height: 1;
  color: #b9c3cf;
  transition: color 0.12s ease, text-shadow 0.12s ease;
}

.lamp-box--on .lamp {
  color: var(--sound-on-edge);
  text-shadow: 0 0 10px var(--sound-on);
}

/* 움직임을 줄여 달라고 한 기기에서는 부드러운 전환을 끈다 */
@media (prefers-reduced-motion: reduce) {
  .lamp-box,
  .lamp {
    transition: none;
  }
}

.lamp__text {
  font-weight: 800;
}

.runstats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--space-2) var(--space-4);
  flex: 1 1 320px;
}

.runstat {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  padding-bottom: 2px;
  border-bottom: 1px dashed var(--color-border);
}

.runstat__label {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.runstat__value {
  font-family: var(--font-mono);
  font-weight: 700;
}

.runpanel__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ── 소리 시간표 ──────────────────────────────────────────────
 * 어떤 음이 얼마 동안 났는지 가로 막대로 보인다.
 * ★ 색만으로 알리지 않는다 — 칸 안에 음이름을 글자로도 적는다(명세 13장).
 * ---------------------------------------------------------------- */
.toneline__cap {
  margin: 0 0 var(--space-1);
  font-weight: 700;
}

.toneline {
  display: flex;
  width: 100%;
  height: 30px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow: hidden;
}

.toneline__seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
}

/* 소리가 «난» 칸 — 사이 칸과 테두리로도 갈린다 */
.toneline__seg--on {
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  border-right: 1px solid var(--sound-on);
}

.toneline__seg--off {
  background: #dde3ea;
  color: var(--color-text-sub);
}

/* ── 피에조 스피커 ────────────────────────────────────────────
 * 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).
 * 극성은 색이 아니라 «몸통의 ＋ 표시 · 이름표 글자» 가 알린다.
 * ★ 다리 «길이» 는 쓰지 않는다 — 실물은 두 다리가 같은 길이인 것이 많다.
 * ---------------------------------------------------------------- */
.part__tray {
  fill: var(--part-tray);
  stroke: var(--bb-line);
  stroke-width: 1;
}

.part__lead {
  stroke: var(--part-lead);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.piezo__case {
  fill: var(--piezo-case);
  stroke: var(--piezo-case-edge);
  stroke-width: 1.5;
}

.piezo__top {
  fill: var(--piezo-top);
  stroke: var(--piezo-case-edge);
  stroke-width: 1;
}

.piezo__hole {
  fill: var(--piezo-hole);
}

.piezo__markring {
  fill: var(--piezo-markbg);
  stroke: var(--piezo-case-edge);
  stroke-width: 1.5;
}

.piezo__board {
  fill: var(--piezo-board);
  stroke: var(--piezo-board-edge);
  stroke-width: 1.5;
}

.piezo__mark {
  font-size: 13px;
  font-weight: 800;
  fill: var(--piezo-mark);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* 울리는 동안 퍼지는 물결 */
.piezo__wave {
  fill: none;
  stroke: var(--sound-on);
  stroke-width: 2;
  opacity: 0.5;
  pointer-events: none;
}

.part--sounding .piezo__top {
  stroke: var(--sound-on-edge);
  stroke-width: 2.5;
}

.part__name {
  font-size: 12px;
  font-weight: 800;
  fill: var(--color-text);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.part__note {
  font-size: 10px;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

/* 켜짐·꺼짐은 «글자» 가 뜻을 진다. 색이 안 보여도 읽을 수 있어야 한다. */
.part__state {
  font-size: 11px;
  font-weight: 700;
  fill: var(--color-text-sub);
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.part--sounding .part__state {
  fill: var(--sound-on-edge);
}

.pin__label--part {
  fill: var(--color-text);
  font-size: 11px;
}

/* ── 그림 속 글씨는 «한 벌» 로 맞춘다 ─────────────────────────────
 * 이름표만 길이에 따라 작아지면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
 * 그래서 이름표·무리 이름·열 번호를 모두 10px 로 두고,
 * 대신 circuit.js 가 헤더 간격을 30 으로 벌려 긴 이름도 닿지 않게 했다.
 * 레일의 + − 만 기호라서 한 단계 크게(12px) 둔다.
 * ---------------------------------------------------------------- */
.pin__label {
  font-size: 10px;
  font-weight: 800;
  fill: #ffffff;
  text-anchor: middle;
  font-family: var(--font-sans);
  pointer-events: none;
}

.pin:hover .pin__dot {
  fill: var(--color-primary);
  r: 8;
}

.pin--selected .pin__dot {
  fill: var(--color-false);
  stroke: #ffffff;
  stroke-width: 3;
  r: 9;
}


.pin--hot .pin__dot {
  fill: var(--rail-plus);
}

.pin--gnd .pin__dot {
  fill: var(--rail-minus);
}

.pin:focus {
  outline: none;
}

.pin:focus-visible .pin__dot {
  stroke: var(--color-primary);
  stroke-width: 4;
  r: 9;
}

.wire {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  opacity: 0.9;
}

/* 케이블 목록 */
.wirelist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.wirelist__empty {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.wirelist__item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 15px;
}

.wirelist__text {
  flex: 1;
}

.wirelist__dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex: 0 0 auto;
  border: 1px solid var(--color-border-strong);
}

.wirelist__dot--red {
  background: var(--rail-plus);
}
.wirelist__dot--black {
  background: #22262c;
}
.wirelist__dot--yellow {
  background: #e3a008;
}
/* 실제로 쓰는 두 가지 — 주황(D11 쪽) · 파랑(GND 쪽) */
.wirelist__dot--orange {
  background: #ea580c;
}
.wirelist__dot--blue {
  background: #1d4ed8;
}

.hintout:empty {
  display: none;
}


/* ================================================================== */
/* 4단계 — 텍스트 코딩                                                 */
/* ================================================================== */

/* ------------------------ 4단계 A : 프로그램 읽기 ------------------------ */

.subhead {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

/* 스케치의 뼈대 두 함수 */
.skel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--space-3);
}

.skel__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.skel__name {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 700;
  color: var(--color-primary-dark);
}

.skel__when {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
}

.skel__what {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 한 줄씩 읽어 보기 */
.walk {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.walk__item {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.walk__no {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-muted-bg);
  color: var(--color-text-sub);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
}

.walk__body {
  flex: 1 1 auto;
  min-width: 0;
}

.walk__code {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  color: var(--color-primary-dark);
  background: var(--color-code-bg);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  white-space: pre-wrap;
}

.walk__code--empty {
  color: var(--color-text-sub);
  font-style: italic;
}

.walk__text {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
}

/* 실행 순서 */
.orderlist {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  font-size: 15px;
}

/* 글쓰기 약속 */
.rules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.rules__item {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  font-size: var(--fs-small);
}

.rules__mark {
  flex: 0 0 auto;
  min-width: 3.4em;
  text-align: center;
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
}

/* ── 두 방식을 «모두» 마쳐야 한다는 표시 (4단계) ────────────────
 *
 * 탭만 있으면 «하나 하면 끝» 으로 보인다. [다음] 이 안 열리는 까닭을
 * 아래에서 찾게 하지 말고 여기서 알린다.
 */
.modedone {
  margin-bottom: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-left: 5px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.modedone__label {
  margin: 0 0 6px;
  font-weight: 700;
}

.modedone__list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.modedone__item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border: 2px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  font-size: var(--fs-small);
}

/* 마친 것 — 색만으로 알리지 않게 ✓ 와 «마침» 글자를 함께 준다(명세 13장) */
.modedone__item.is-done {
  border-color: var(--color-true);
  background: var(--color-true-soft);
  color: var(--color-true-dark);
}

.modedone__mark {
  font-weight: 800;
}

.modedone__name {
  font-weight: 700;
}

.modedone__state {
  color: var(--color-text-sub);
}

.modedone__item.is-done .modedone__state {
  color: var(--color-true-dark);
  font-weight: 700;
}

.modedone__note {
  margin: 6px 0 0;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

/* 마친 방식은 탭에도 표시한다 */
.modetab--done {
  border-color: var(--color-true);
  color: var(--color-true-dark);
}

.modetabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.modetab {
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--color-text-sub);
  cursor: pointer;
}

.modetab--on {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}

.codework {
  margin-top: var(--space-3);
}

.assemble {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.assemble__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-bottom: var(--space-2);
}

.assemble__item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-console-bg);
}

/* ── 끌어 옮기는 손잡이 ────────────────────────────────────────
 * ★ 끄는 곳을 손잡이로 «한정» 한다. 줄 아무 데나 잡히면
 *   손가락으로 화면을 세로로 넘길 수 없다.
 * ★ touch-action: none 은 «여기에만» 둔다 — 손가락으로 끌 때
 *   화면이 함께 밀리지 않게 하는 것이고, 나머지 자리는 그대로 넘어간다.
 * ---------------------------------------------------------------- */
.assemble__grip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 손가락으로 잡기 좋은 크기 (명세 13장 «큰 터치 영역») */
  min-width: 32px;
  min-height: 36px;
  color: var(--tok-comment);
  font-size: 18px;
  line-height: 1;
  cursor: grab;
  touch-action: none;
  user-select: none;
  border-radius: var(--radius-sm, 6px);
}

.assemble__grip:hover {
  color: var(--color-console-text);
  background: rgba(255, 255, 255, 0.08);
}

.assemble__grip:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/*
 * 끌고 있는 줄 — 자리에서 «떼어 내» 손가락을 따라간다(JS 가 position: fixed 를 준다).
 * 색만으로 알리지 않게 «들린 그림자» 와 살짝 기울임을 함께 준다.
 */
.assemble__item--dragging {
  cursor: grabbing;
  border-color: var(--color-primary);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.45);
  transform: rotate(-0.6deg);
  opacity: 0.96;
}

/*
 * ★★ 놓일 자리.
 *   끌고 있는 줄과 «같은 높이» 의 점선 칸이 목록 안에서 움직인다.
 *   「3번째 자리」 라고 적어 두므로, 어디에 놓이는지 색이 아니라 «글자» 로도 안다.
 *   이 규칙을 지우면 끌어 옮기기가 다시 «어디로 가는지 모르는» 조작이 된다.
 */
.assemble__slot {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
  font-weight: 800;
}

.assemble__item--dragging .assemble__grip {
  cursor: grabbing;
  color: var(--color-primary);
}

/* 끌고 있는 동안에는 나머지 줄이 자리를 내주는 것이 보이게 */
.assemble--dragging .assemble__item:not(.assemble__item--dragging) {
  transition: transform 0.12s ease;
}

@media (prefers-reduced-motion: reduce) {
  .assemble--dragging .assemble__item:not(.assemble__item--dragging) {
    transition: none;
  }
}

.assemble__no {
  color: var(--tok-comment);
  font-family: var(--font-mono);
  min-width: 2ch;
}

.assemble__code {
  flex: 1;
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  overflow-x: auto;
  color: var(--color-console-text);
}

.assemble__btns {
  display: flex;
  gap: var(--space-1);
}

.blanks {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  background: var(--color-console-bg);
  padding: var(--space-3);
  border-radius: var(--radius);
  /* 긴 코드 줄(int notes[] = {523, …};)은 «이 상자 안에서» 옆으로 밀린다 */
  overflow-x: auto;
}

/*
 * 한 빈칸 = «이름표 + 입력칸» 두 줄.
 * 이름표를 위에 두어야 긴 힌트가 접히며 다 보인다(placeholder 는 접히지 않는다).
 */
.blanks__row {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 2px 0;
}

.blanks__hint {
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: var(--tok-comment);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.45;
  cursor: pointer;
}

.blanks__hinttext {
  min-width: 0;
}

.blanks__fixed {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  white-space: pre;
  color: var(--color-console-text);
  padding: var(--space-1) 0;
}

/*
 * ★ 힌트가 길다 — 「speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄」.
 *   폭을 420px 로 묶어 두었더니 뒷글자가 잘려 무엇을 적으라는지 알 수 없었다.
 *   글씨를 한 급 줄이고 남은 폭을 «다 쓰게» 한다. min-width: 0 이 있어야
 *   flex 칸이 글자 길이만큼 부풀지 않고 줄어든다.
 */
.blanks__input {
  /* ★ 여백을 여기에 두지 «않는다» — width:100% 와 겹쳐 상자 밖으로 밀려난다.
     들여쓰기는 줄(.blanks__row)의 padding-left 가 맡는다. */
  align-self: stretch;
  max-width: 560px;
  font-size: 13px;
  padding: var(--space-1) var(--space-2);
}

.blanks__input::placeholder {
  color: var(--color-text-sub);
  opacity: 1;
}

.editor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.editor__body {
  display: flex;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  overflow: hidden;
}

.editor__gutter {
  display: flex;
  flex-direction: column;
  padding: var(--space-3) var(--space-2);
  background: #16233a;
  color: var(--tok-comment);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  text-align: right;
  min-width: 3ch;
  overflow: hidden;
  user-select: none;
}

.editor__area {
  flex: 1;
  min-height: 260px;
  padding: var(--space-3);
  border: 0;
  background: transparent;
  color: var(--color-console-text);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  resize: vertical;
  tab-size: 2;
}

.editor__area:focus {
  outline: 2px solid var(--color-primary);
  outline-offset: -2px;
}

.editor__help {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* 가상 시리얼 모니터 */
.monitor {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.monitor__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.monitor__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
}

.monitor__clock {
  font-family: var(--font-mono);
  font-weight: 800;
  color: var(--color-true-dark);
}

.monitor__out {
  min-height: 120px;
  max-height: 260px;
  overflow-y: auto;
  background: var(--color-console-bg);
  border-radius: var(--radius);
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.monitor__line {
  display: flex;
  gap: var(--space-3);
  color: var(--color-console-text);
}

.monitor__t {
  color: var(--tok-comment);
  min-width: 7ch;
}

.monitor__text {
  flex: 1;
  color: var(--tok-number);
  font-weight: 700;
}

.monitor__where {
  color: var(--tok-comment);
  font-size: 13px;
}

.monitor__note {
  color: var(--tok-comment);
  font-style: italic;
  padding: var(--space-1) 0;
}

/* ================================================================== */
/* 5단계 — 실행·탐구                                                   */
/* ================================================================== */

/* ------------------ 5단계 : 입력·출력 장치 알아보기 ------------------ */

/* 장치 표 — 좁은 화면에서는 표만 좌우로 밀린다(본문은 밀리지 않는다) */
.devwrap {
  overflow-x: auto;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.devtable {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-small);
}

.devtable th,
.devtable td {
  padding: var(--space-2) var(--space-3);
  text-align: left;
  border-bottom: 1px solid var(--color-border);
  vertical-align: top;
}

.devtable th {
  background: var(--color-primary-soft);
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: nowrap;
}

.devtable tr:last-child td {
  border-bottom: 0;
}

.devtable td:first-child {
  white-space: nowrap;
}

.devtable__icon {
  display: inline-block;
  min-width: 1.4em;
  margin-right: var(--space-1);
  color: var(--color-primary);
}

/* 어느 핀에 꽂을지 고르는 법 */
.pinrules {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.pinrules__item {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-primary);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.pinrules__q {
  font-weight: 800;
  color: var(--color-primary-dark);
  font-size: var(--fs-small);
}

.pinrules__a {
  margin-top: var(--space-1);
  font-size: var(--fs-small);
  color: var(--color-text);
}

.expform {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: flex-end;
}

.expresult {
  padding: var(--space-3);
  background: var(--color-true-soft);
  border-radius: var(--radius);
}

.expresult__head {
  font-weight: 800;
  color: var(--color-true-dark);
}

.expresult__list {
  margin-top: var(--space-2);
  font-size: 15px;
}

.record {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.record__data {
  font-size: var(--fs-small);
  font-weight: 800;
  color: var(--color-true-dark);
}

.design {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-bottom: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.design__title {
  font-size: 15px;
  font-weight: 800;
  color: var(--color-text);
}

.design__goal {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ================================================================== */
/* 6단계 — 형성평가·제출                                               */
/*                                                                    */
/* 짜임새와 이름을 lesson3_7_1 의 6단계와 «같게» 맞추었다.              */
/*   ① 형성평가(왼쪽) + ② 채점·제출 진행 상황(오른쪽) → ③ 학습 정리     */
/* ================================================================== */

/* ------------------ 좌우 두 쪽 · 판 · 구역 제목 ------------------ */

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.split--wide-left {
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
}

@media (max-width: 900px) {
  .split,
  .split--wide-left {
    grid-template-columns: minmax(0, 1fr);
  }
}

.panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--space-4);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  flex-wrap: wrap;
}

.panel__title {
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.panel__hint {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.panel__body {
  min-width: 0;
}

.section-title {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: var(--space-6) 0 var(--space-3);
  font-size: 19px;
  font-weight: 800;
}

.section-title:first-child {
  margin-top: 0;
}

.section-title__tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 8px;
  background: var(--color-text);
  color: #fff;
  font-size: 13px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-surface);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.badge--true {
  border-color: var(--color-true);
  color: var(--color-true-dark);
  background: var(--color-true-soft);
}

.badge--false {
  border-color: var(--color-false);
  color: var(--color-false-dark);
  background: var(--color-false-soft);
}

.badge--primary {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-primary-soft);
}

/* ---------------------- 진행 상황 콘솔 ---------------------- */

.console {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid #0f172a;
  background: var(--color-console-bg);
}

.console__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: #0f172a;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 700;
}

.console__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #64748b;
}

.console__body {
  min-height: 132px;
  max-height: 320px;
  overflow: auto;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.75;
  color: var(--color-console-text);
  white-space: pre-wrap;
  word-break: break-all;
}

.console__line {
  display: flex;
  gap: 8px;
}

.console__prompt {
  flex: 0 0 auto;
  color: #38bdf8;
  user-select: none;
}

.console__text {
  flex: 1 1 auto;
}

.console__line--error .console__text {
  color: var(--color-error-on-dark);
}

.console__line--hint .console__text {
  color: var(--color-hint-on-dark);
}

.console__line--ok .console__text {
  color: #86efac;
}

.console__line--muted .console__text {
  color: #94a3b8;
}

.console__empty {
  color: #64748b;
}

/* ---------------------- 응시자 정보 ---------------------- */

.student-card {
  padding: var(--space-3);
  border: 2px dashed var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-muted-bg);
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.student-card.is-ready {
  border-style: solid;
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.student-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.student-card__title {
  font-size: 15px;
  font-weight: 800;
}

.student-card__badge {
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.student-card__fields {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  gap: var(--space-3);
}

@media (max-width: 767px) {
  .student-card__fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

.student-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.student-field__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.student-field__input {
  width: 100%;
  min-height: var(--touch-min);
  padding: 0 var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text);
}

.student-field__input:hover {
  border-color: var(--color-primary);
}

.student-field__input:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.student-field__input.is-invalid {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.student-card__note {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-false-dark);
  min-height: 1.4em;
}

.student-card__note.is-ok {
  color: var(--color-true-dark);
}

.student-card__privacy {
  margin-top: 4px;
  font-size: 12px;
  color: var(--color-text-sub);
}

/* 학번·이름을 넣기 전에는 문항을 잠근다 */
.quiz-gate {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-false-soft);
  border: 1px solid var(--color-false);
  font-size: var(--fs-small);
  font-weight: 600;
  color: var(--color-false-dark);
}

.quiz-gate__icon {
  font-size: 18px;
}

.quiz-gate[hidden] {
  display: none;
}

.quiz__body.is-gated {
  opacity: 0.45;
  filter: grayscale(0.35);
  pointer-events: none;
  user-select: none;
}

/* -------------------- 문항 (한 번에 하나) -------------------- */

.quiz__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  font-weight: 700;
}

.quiz__counter {
  flex: 0 0 auto;
  font-weight: 800;
  white-space: nowrap;
}

.quiz__dots {
  display: flex;
  gap: 6px;
}

.quiz__dot {
  position: relative;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  background: transparent;
  padding: 0;
  cursor: pointer;
}

/* 점은 10px 이지만 누르는 자리는 44px 을 확보한다 */
.quiz__dot::after {
  content: "";
  position: absolute;
  inset: -17px;
}

.quiz__dot.is-answered {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.quiz__dot.is-current {
  transform: scale(1.35);
  border-color: var(--color-primary);
}

.quiz__dot:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 4px;
}

.quiz__tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: var(--space-2);
}

.quiz__question {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.6;
}

.quiz__no {
  color: var(--color-primary-dark);
  margin-right: 6px;
}

.quiz__note {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.options {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.option {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  text-align: left;
  transition: border-color var(--dur-highlight) ease, background-color var(--dur-highlight) ease;
}

.option:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-selected {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option.is-correct {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.option.is-wrong {
  border-color: var(--color-error);
  background: var(--color-error-soft);
}

.option:focus-within {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* 답안을 낸 뒤 — 읽기만 된다. 누를 수 있어 보이면 안 된다. */
.option--locked {
  cursor: default;
}

.option--locked:hover {
  border-color: var(--color-border-strong);
  background: var(--color-surface);
}

.option--locked.is-selected:hover {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.option__num {
  flex: 0 0 auto;
  font-weight: 800;
  color: var(--color-primary-dark);
}

.option__text {
  flex: 1 1 auto;
}

/* ------------------------ 채점 결과 ------------------------ */

.score-card {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow);
}

.score-card__title {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text-sub);
}

.score-card__student {
  margin-top: 4px;
  font-size: 15px;
  color: var(--color-text-sub);
}

.score-card__student strong {
  color: var(--color-text);
}

.score-card__value {
  margin-top: var(--space-2);
  font-size: 46px;
  font-weight: 900;
  line-height: 1.1;
  color: var(--color-primary-dark);
}

.score-card__value small {
  font-size: 20px;
  color: var(--color-text-sub);
  font-weight: 700;
}

.score-dots {
  display: flex;
  justify-content: center;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.score-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--color-border-strong);
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
}

.score-dot.is-correct {
  background: var(--color-true);
  border-color: var(--color-true);
  color: #fff;
}

.score-card__count {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

.score-card__level {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.score-card__level strong {
  font-size: 17px;
  color: var(--color-primary-dark);
}

.score-card__comment {
  margin-top: var(--space-4);
  font-size: 16px;
  font-weight: 700;
}

.lint:empty {
  display: none;
}

.review {
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-left: 5px solid var(--color-false);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.review--ok {
  border-left-color: var(--color-true);
}

.review__head {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  font-weight: 800;
}

.review__mark {
  color: var(--color-false-dark);
}

.review--ok .review__mark {
  color: var(--color-true-dark);
}

.review__state {
  margin-left: auto;
  font-size: 13px;
}

.review__stem {
  font-size: 15px;
  color: var(--color-text-sub);
}

.review__answer {
  font-weight: 800;
  color: var(--color-primary-dark);
  white-space: pre-wrap;
}

.review__why {
  font-size: 15px;
}

/* ------------------------ 학습 정리 ------------------------ */

.summary-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.summary-item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border-radius: var(--radius);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.summary-item__num {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
}

.summary-item__text {
  flex: 1 1 auto;
  line-height: 1.7;
}

/* 핵심 문법 카드 */
.syntaxcards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-3);
}

.syntaxcard {
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  overflow: hidden;
}

.syntaxcard__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-primary-soft);
  border-bottom: 1px solid var(--color-border);
}

.syntaxcard__title {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.syntaxcard__code {
  margin: 0;
  padding: var(--space-3);
  font-family: var(--font-mono);
  font-size: var(--fs-code);
  line-height: 1.7;
  white-space: pre;
  overflow-x: auto;
  background: var(--color-muted-bg);
}

.syntaxcard__note {
  padding: var(--space-3);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* 내가 쓴 것 되돌아보기 */
.my-answer {
  padding: var(--space-3);
  border-radius: var(--radius);
  border: 1px dashed var(--color-border-strong);
  background: var(--color-muted-bg);
  white-space: pre-wrap;
  min-height: 56px;
  font-size: var(--fs-small);
  line-height: 1.7;
}

.my-answer.is-empty {
  color: var(--color-text-sub);
}

.my-answer--code {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.privacy {
  font-size: 13px;
  color: var(--color-text-sub);
}

/* ================================================================== */
/* 작은 화면                                                           */
/* ================================================================== */

@media (max-width: 1023px) {
  .stepper__label {
    display: none;
  }
}

@media (max-width: 767px) {
  .app-progress__inner,
  .nav {
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }

  .app-main {
    padding: var(--space-4) var(--space-3) var(--space-6);
  }

  .progressbar {
    width: 72px;
  }

  .stepper__node {
    width: 26px;
    height: 26px;
    font-size: 12px;
  }

  .stepper__node::after {
    inset: -9px;
  }

  .hero .goal-card,
  .hero .safety-card {
    margin-top: var(--space-4);
    padding: var(--space-4);
  }

  .hero .agenda,
  .hero .hero__time {
    margin-top: var(--space-4);
  }

  .hero .agenda__list {
    grid-template-columns: minmax(0, 1fr);
  }

  .hero .hero__cta .btn {
    width: 100%;
  }

  .nav__btns {
    width: 100%;
  }

  .nav__btns .btn {
    flex: 1;
  }

  /* 모바일에서 단자를 크게 하는 일은 applyZoom 이 맡는다 (명세 6.1).
     단자 사이 간격이 24 단위로 고정이라, 누르는 자리만 넓히면 옆 단자와 겹쳐
     엉뚱한 곳이 눌린다. 그래서 «그림 전체» 를 크게 그린다.
     손가락으로 겨누기 쉽게 구멍만 조금 키운다. */
  .pin__dot {
    r: 7.5;
  }
}

/* ══════════════════════════════════════════════════════════════════
   이 차시에서 늘어난 부품 — 소리·파형·가락 (명세 6.3 · 7장 화면5)
   ══════════════════════════════════════════════════════════════════ */

/* ── 소리 조절 상자 ───────────────────────────────────────────
 * 브라우저는 «누르기 전» 에는 소리를 내주지 않는다(명세 12장).
 * 그래서 소리가 필요한 자리마다 이 상자가 함께 나온다.
 * ---------------------------------------------------------------- */
.audiobar {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-2) var(--space-3);
  background: var(--color-primary-soft);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}

.audiobar--off {
  background: var(--color-muted-bg);
}

.audiobar__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

.audiobar__range {
  flex: 1 1 140px;
  min-width: 120px;
  /* 손가락으로 잡기 좋게 (명세 13장 «큰 터치 영역») */
  height: 32px;
}

.audiobar__vol {
  font-family: var(--font-mono);
  font-weight: 700;
  min-width: 48px;
}

/* 지금 상태를 «글자» 로 적는다 — 색이 안 보여도 읽을 수 있어야 한다 */
.audiobar__state {
  font-weight: 700;
  color: var(--color-text-sub);
}

.audiobar__note {
  margin: 0;
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

/* ── 오실로스코프 ─────────────────────────────────────────────
 * 가로축은 «늘 같은 시간(8ms)» 이다. 그래야 주파수를 올릴 때
 * 파형이 촘촘해지는 것이 눈에 보인다(명세 6.3).
 * ---------------------------------------------------------------- */
.scope {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
}

.scope__canvas {
  width: 100%;
  overflow-x: auto;
}

.scope__svg {
  display: block;
  width: 100%;
  min-width: 280px;
  height: auto;
  border-radius: var(--radius);
}

.scope__bg {
  fill: var(--scope-bg);
}

.scope__gridline {
  stroke: var(--scope-grid);
  stroke-width: 1;
}

.scope__level {
  stroke: var(--scope-level);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}

.scope__line {
  fill: none;
  stroke: var(--scope-line);
  stroke-width: 2.5;
  stroke-linejoin: round;
}

.scope__axis {
  fill: var(--scope-axis);
  font-size: 11px;
  font-family: var(--font-sans);
  text-anchor: middle;
}

/* 읽는 값 — 숫자와 음이름을 «글자로» 적는다. 파형만으로 알리지 않는다. */
.scope__readout {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--fs-small);
}

.scope__label {
  color: var(--color-text-sub);
}

.scope__hz {
  font-family: var(--font-mono);
  font-size: var(--fs-body);
  font-weight: 800;
  color: var(--color-primary-dark);
}

.scope__note {
  font-weight: 700;
}

.scope__cycles {
  color: var(--color-text-sub);
}

/* ── 주파수 실험실 ────────────────────────────────────────────── */
.freqlab__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-2);
}

.freqlab__range {
  flex: 1 1 220px;
  min-width: 180px;
  height: 36px;
}

.freqlab__presets {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  margin-top: var(--space-2);
}

/* ── 피에조 종류 고르기 ──────────────────────────────────────── */
.modepick {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

/* ── 가락 재생 (알림음·악보가 함께 쓴다) ──────────────────────── */
.melody {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin: var(--space-2) 0;
}

.solfa {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.solfa__note {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 36px;
  padding: 0 var(--space-1);
  background: #ffffff;
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  font-weight: 800;
}

/* 지금 울리는 음 — 색과 «굵은 테두리» 를 함께 준다(명세 13장) */
.solfa__note--now {
  border-color: var(--sound-on-edge);
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  box-shadow: 0 0 0 3px var(--sound-glow);
}

/* ── 알림음 설계 (성공음·경고음·호출음) ───────────────────────── */
.alertkinds {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-3);
  margin-top: var(--space-2);
}

.alertkind {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-3);
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
}

/* 고른 것 — 테두리와 «✓ 고름» 글자를 함께 쓴다 */
.alertkind--on {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.alertkind__head {
  display: flex;
  align-items: center;
  gap: var(--space-1);
  margin: 0;
}

.alertkind__icon {
  font-size: 22px;
}

.alertkind__name {
  font-weight: 800;
  font-size: var(--fs-h3, 18px);
}

.alertkind__pick {
  margin-left: auto;
  font-weight: 800;
  color: var(--color-primary-dark);
}

.alertkind__when,
.alertkind__recipe,
.alertkind__why {
  margin: 0;
  font-size: var(--fs-small);
}

.alertkind__why {
  color: var(--color-text-sub);
}

/* ── 표 (5단계 비교표 · 음표표) ─────────────────────────────── */
/*
 * ★ 이 규칙이 없던 적이 있다. 5단계 비교표가 «테두리 없는 맨 표» 로 그려져
 *   칸이 어디서 갈리는지 보이지 않았다. 표를 새로 쓸 때 이 이름을 쓴다.
 */
.exptable {
  width: 100%;
  margin: var(--space-2) 0;
  border-collapse: collapse;
  font-size: var(--fs-small);
  display: block;
  overflow-x: auto;
}

.exptable__cap {
  caption-side: top;
  text-align: left;
  padding-bottom: 6px;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.exptable th,
.exptable td {
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  text-align: left;
  vertical-align: top;
  white-space: nowrap;
}

.exptable thead th {
  background: var(--color-muted-bg);
  font-weight: 700;
}

.exptable tbody th {
  background: var(--color-bg);
  font-weight: 700;
}

.exptable tr.is-empty td {
  color: var(--color-text-sub);
}

/* tone 과 delay 를 «다른 색» 으로 — 둘을 갈라 읽게 한다 */
.exptable .is-tone {
  color: var(--color-primary-dark);
  font-weight: 700;
}

.exptable .is-delay {
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 확장 활동의 빈칸 검사 — «확인하고 나서» 실행한다 */
.extcheck {
  padding: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
}

.extcheck__sum {
  margin: 0 0 var(--space-1);
  font-weight: 700;
}

.extcheck__sum.is-ok {
  color: var(--color-true-dark);
}

/* ── 확장 활동 (5단계) ────────────────────────────────────────
 *
 * ★★ 접어 두되 «눈에 띄게» 둔다.
 *   여느 접기와 똑같이 생기면, 알림음을 고른 학생이 그다음 무엇을 해야 하는지
 *   보이지 않는다. 색·테두리·큰 제목을 주고, 고른 것이 있으면 펼친 채 시작한다.
 */
.extbox {
  margin: var(--space-3) 0;
  border: 2px solid var(--color-border-strong);
  border-radius: var(--radius-lg, 12px);
  background: var(--color-surface);
  overflow: hidden;
}

/* 고를 것을 고른 뒤 — 여기가 다음에 할 일이라는 표시 */
.extbox--ready {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px var(--sound-glow);
}

.extbox__sum {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--color-muted-bg);
  cursor: pointer;
  list-style: none;
}

.extbox--ready .extbox__sum {
  background: var(--color-primary-soft);
}

.extbox__sum::-webkit-details-marker {
  display: none;
}

.extbox__sum:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: -3px;
}

.extbox__icon {
  font-size: 26px;
  line-height: 1;
}

.extbox__label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
}

.extbox__title {
  font-size: var(--fs-h3, 18px);
}

.extbox__note {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.extbox--ready .extbox__note {
  color: var(--color-primary-dark);
  font-weight: 700;
}

/* 「펼치기 ▾」 — 열면 「접기 ▴」 로 바뀐다 */
.extbox__more {
  flex: 0 0 auto;
  padding: 4px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 999px;
  background: var(--color-surface);
  color: var(--color-text-sub);
  font-size: var(--fs-small);
  font-weight: 700;
  white-space: nowrap;
}

/* ★ 글자는 JS 가 바꾼다.
 *   CSS 의 content 로 바꾸려면 원래 글자를 font-size:0 으로 숨겨야 하는데,
 *   그러면 같은 상자 안의 화살표까지 함께 사라진다. 낭독기에도 안 읽힌다. */
.extbox[open] .extbox__more {
  background: var(--color-muted-bg);
}

.extbox__body {
  padding: var(--space-3);
  border-top: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.extbox__h {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-h3, 18px);
}

.extbox__lead {
  margin: 0;
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

/* 고른 알림음 — 만들 재료를 손 닿는 곳에 */
.extpick {
  padding: var(--space-2);
  border: 1px solid var(--color-primary);
  border-left-width: 5px;
  border-radius: var(--radius);
  background: var(--color-primary-soft);
}

.extpick__head {
  display: flex;
  align-items: baseline;
  gap: var(--space-1);
  margin: 0 0 4px;
}

.extpick__icon {
  font-size: 18px;
}

.extpick__name {
  font-size: var(--fs-h3, 18px);
  color: var(--color-primary-dark);
}

.extpick__when {
  color: var(--color-text-sub);
  font-size: var(--fs-small);
}

.extpick__recipe {
  margin: 0 0 6px;
  font-weight: 700;
}

.extpick__nums {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px var(--space-2);
  margin: 0;
  font-size: var(--fs-small);
}

.extpick__nums dt {
  color: var(--color-text-sub);
}

.extpick__nums dd {
  margin: 0;
  font-family: var(--font-mono);
}

/* 빈칸 앞의 «몇 번째 차례» 딱지 — 위 차례 목록의 번호와 같다 */
/* 몇 번째 차례의 빈칸인가 — 위 «만드는 차례» 의 번호와 같다 */
.blanks__step {
  flex: 0 0 auto;
  color: var(--color-hint-on-dark);
  font-weight: 800;
}

/* ── 악보 그림 (5단계) ────────────────────────────────────────
 *
 * ★ 오선·음표·기둥·이음줄을 SVG 로 직접 그린다. 그림 파일을 심지 않으므로
 *   단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 * ★ 글자의 정렬은 여기서 정한다 — 지우면 계명과 박자표가 왼쪽으로 밀려 잘린다.
 */
.stfbox {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  overflow-x: auto;
}

.stf {
  display: block;
  width: 100%;
  min-width: 420px;
  height: auto;
}

.stf__line,
.stf__ledger {
  stroke: var(--color-text);
  stroke-width: 1;
}

.stf__bar {
  stroke: var(--color-text);
  stroke-width: 1.6;
}

.stf__bar--end {
  stroke-width: 3;
}

.stf__head {
  fill: var(--color-text);
}

/* 2분음표부터는 «빈» 머리 */
.stf__head--open {
  fill: var(--color-surface);
  stroke: var(--color-text);
  stroke-width: 1.6;
}

.stf__stem,
.stf__beam {
  stroke: var(--color-text);
  stroke-width: 1.6;
  stroke-linecap: round;
}

.stf__beam {
  stroke-width: 4.5;

  display: flex;
  flex-direction: column;
  gap: var(--space-1);

    <script data-from="shared/config.js">
/**
 * 환경 설정 — ★ 고칠 곳은 여기 한 곳뿐이다 (명세 10장)
 *
 * 학생용과 교사용이 같은 파일을 읽는다. 서버 주소를 두 곳에 적는 일이 없다.
 *
 * 결과물은 «파일 하나짜리 HTML» 이라 file:// 로도 열려야 한다.
 * ES 모듈은 file:// 에서 막히므로 고전 스크립트로 담았다.
 */
(function () {
  "use strict";

  var APP_CONFIG = {
    /* ── ① 제출 주소 (Google Apps Script 웹앱 /exec 주소) ───────────
       비워 두면 학생 화면 «6단계 제출» 에 [제출 주소] 칸이 나온다.
       선생님이 링크를 보내 주고 학생이 붙여 넣는 방식이다(권장).
       한 번 넣으면 그 기기에 기억된다.

       주소가 없거나 통신이 실패하면 그 자리에서 «파일로 내기» 가 열린다(명세 10장). */
    apiUrl: "",

    /* ── ② 데모 모드 ──────────────────────────────────────────────
       true  : 서버로 보내지 않고 이 기기 안에만 저장한다. 화면을 미리 볼 때 쓴다.
       false : 실제로 제출한다. */
    demoMode: false,

    /* ── ③ 임시 저장 키 앞머리 ────────────────────────────────────
       localStorage 이름표. 학년도가 바뀌면 v2 로 올린다. */
    autosaveKeyPrefix: "physical3-draft-v1",

    /* ── ④ 시뮬레이터 ────────────────────────────────────────────
       loopLimit  : loop() 를 최대 몇 바퀴 돌려 보는가 (무한 반복 방지)
       stepLimit  : 전체 실행 명령 수 상한 (멈추지 않는 코드 방지)
       playSpeeds : 실행 재생 속도 배수 */
    loopLimit: 12,
    stepLimit: 20000,
    playSpeeds: [1, 4, 0],

    /* ── ⑤ 교사용 자동 새로고침 간격(초) ─────────────────────────── */
    teacherRefreshSeconds: 30
  };

  /** 쓸 만한 주소인가 */
  function looksLikeUrl(value) {
    var url = String(value || "").trim();
    if (!url) return false;
    if (url.indexOf("YOUR_") === 0) return false;
    return /^https?:\/\/.+/i.test(url);
  }

  /** 설정 파일에 미리 적어 둔 주소 (없으면 빈 문자열) */
  function fixedUrl() {
    return looksLikeUrl(APP_CONFIG.apiUrl) ? String(APP_CONFIG.apiUrl).trim() : "";
  }

  function isDemo() {
    return APP_CONFIG.demoMode === true;
  }

  /** 학생 화면에 «제출 주소» 칸을 보여야 하는가? */
  function needsUrlInput() {
    return !isDemo() && !fixedUrl();
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  PC.CONFIG = APP_CONFIG;
  PC.config = {
    looksLikeUrl: looksLikeUrl,
    fixedUrl: fixedUrl,
    isDemo: isDemo,
    needsUrlInput: needsUrlInput
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { APP_CONFIG: APP_CONFIG, isDemo: isDemo, fixedUrl: fixedUrl };
  }
})();

  /*                                                                    */
  /* ★★ 여기까지의 예시는 «모든 음의 길이가 같았다».                       */
  /*   250ms 씩 여덟 번 — 주파수 배열 하나면 끝났다.                       */

  /** 8분음표 한 칸의 길이. 이것이 곧 빠르기다 (250ms → ♩ = 120) */
  var UNIT_MS = 250;

   *
   * ★ 이 값은 delay 에 «더하는» 것이 아니라 tone 의 재생 시간에서 «빼는» 값이다.
   *   더하면 한 음마다 그만큼 밀려 곡 전체가 늘어진다(SHEET.pitfalls).
   */
  var SHEET_GAP = 60;

  /** 음표를 «칸» 으로 — 8분음표 한 개를 1 로 센다 */
  var NOTE_VALUES = [
    { sym: "♪", name: "8분음표", beats: 1 },
    { sym: "♩", name: "4분음표", beats: 2 },
    { sym: "♩.", name: "점4분음표", beats: 3 },
    { sym: "", name: "점2분음표", beats: 6 }
  ];

  /** 빠르기 — 한 칸을 바꾸면 tone 과 delay 가 «함께» 달라진다 */
  var TEMPOS = [
    { id: "slow", label: "느리게", unitMs: 320, tempo: "♩ = 94" },
    { id: "normal", label: "보통", unitMs: UNIT_MS, tempo: "♩ = 120" },
    { id: "fast", label: "빠르게", unitMs: 190, tempo: "♩ = 158" }
  ];

  /** 칸 수로 음표 이름을 찾는다 */
  function valueOf(beats) {
    var found = null;
    NOTE_VALUES.forEach(function (v) {
      if (v.beats === beats) found = v;
    });
    return found || { sym: "", name: beats + "칸", beats: beats };
  }

  /**
   * ★★ 악보에 쓰는 음 — 기준 코드의 한 옥타브(NOTES)보다 «넓다».

   *   악보는 읽기 좋은 자리에 적고 실제로는 한 옥타브 위를 울린다.
   *   그래서 프로그램의 주파수가 악보의 음이름보다 «두 배» 다.
   *   이 둘을 같게 맞추려 하면 안 된다 — 교실에서 들리지 않는다.
   *
   * label — 화면에 적을 이름.
   *   ★ «낮은/높은» 을 붙이지 «않는다»(선생님 요청). 악보에서는 음이 놓인 «자리» 가

   *          dist.test.js 가 «교사용에 학생 그림이 섞이지 않았는가» 를 그 이름으로 본다.

    "낮은미": { label: "미", sci: "E4", hz: 659, step: 0 },
    "낮은파": { label: "파", sci: "F4", hz: 698, step: 1 },
