  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

  function breadboardFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "브레드보드 — 어느 구멍끼리 이어지는가(같은 전극)",
      items: [
        { text: "+ 레일(빨간 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극이라 5V 를 한 곳에만 넣으면 된다." },
        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },
        { text: "가운데 홈 — 여기서 전극이 끊긴다. 위와 아래가 서로 붙지 않게 일부러 끊어 놓은 것이다." },
        { text: "같은 4번 열이지만 F~J (주황 점선) 는 «다른 전극» 이다. 이으려면 점퍼선으로 A4–F4 를 직접 이어 준다." }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* 4번 열을 위(A~E)·아래(F~J)로 나누어 감싼다.
           같은 열이어도 홈을 넘으면 «다른 전극» 이라는 것이 이 그림의 요점이다. */
        wrapColumn(g, "A4", "E4", "fig__hilite");
        wrapColumn(g, "F4", "J4", "fig__hilite--other");

        /* 가리키는 자리는 실제 구멍 좌표에서 가져온다 */
        var railTP = C.terminal("bb", "TP-10");
        var railTN = C.terminal("bb", "TN-10");
        var c4top = C.terminal("bb", "C4");
        var h4 = C.terminal("bb", "H4");
        var gapMid = C.BB.gap.y + C.BB.gap.h / 2;
        var right = 904;

        g.appendChild(leader(right, railTP.y, railTP.x + 14, railTP.y));
        g.appendChild(badge(1, right + 14, railTP.y));

        g.appendChild(leader(right, railTN.y, railTN.x + 14, railTN.y));
        g.appendChild(badge(2, right + 14, railTN.y));

        g.appendChild(leader(right, c4top.y, c4top.x + 11, c4top.y));
        g.appendChild(badge(3, right + 14, c4top.y));

        g.appendChild(leader(right, gapMid, 800, gapMid));
        g.appendChild(badge(4, right + 14, gapMid));

        g.appendChild(leader(right, h4.y, h4.x + 11, h4.y));
        g.appendChild(badge(5, right + 14, h4.y));
      }
    });
  }

  /* ================================================================== */
  /* 2-B. 브레드보드 — 꽂는 자리에 따라 어떻게 달라지는가 (O / X)           */
  /*                                                                    */
  /* 왼쪽 그림(전극 지도)이 «어느 구멍이 이어지는가» 를 알려 준다면        */
  /* 이 그림은 «그래서 꽂을 때 무엇을 조심하는가» 를 알려 준다.            */
  /* 두 장을 나란히 두어야 지도와 쓰임새가 한눈에 이어진다.                */
  /* ================================================================== */

  function breadboardUseFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "꽂는 자리에 따라 이렇게 달라진다",
      marks: ["O", "X"],
      markKinds: ["ok", "no"],
      items: [
        {
          text:
            "올바름 — 부품의 두 다리를 «서로 다른 열»(2번·3번)에 꽂았다. " +
            "두 다리가 다른 전극이라 전류가 부품을 지나간다."
        },
        {
          text:
            "잘못됨 — 두 다리를 «같은 열»(9번)에 꽂았다. 한 전극에 둘 다 물려 " +
            "다리끼리 바로 붙는다. 전류가 부품을 지나가지 않아 켜지지 않는다."
        }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* ── ① 다리를 다른 열에 (2번·3번) ───────────────────────── */
        wrapColumn(g, "A2", "E2", "fig__hilite");
        wrapColumn(g, "A3", "E3", "fig__hilite--other");
        legRing(g, "A2");
        legRing(g, "A3");

        /* ── ② 다리를 같은 열에 (9번) — 붙어 버린 것을 굵은 선으로 ── */
        wrapColumn(g, "A9", "E9", "fig__hilite--bad");
        legRing(g, "C9");
        legRing(g, "E9");
        var c9 = C.terminal("bb", "C9");
        var e9 = C.terminal("bb", "E9");
        g.appendChild(
          UI.svg("line", { x1: c9.x, y1: c9.y, x2: e9.x, y2: e9.y, class: "fig__shortline" })
        );

        /* ── 배지 : 오른쪽에서 각 자리를 가리킨다 ───────────────────── */
        var right = 904;
        var a3 = C.terminal("bb", "A3");

        g.appendChild(leader(right, a3.y, a3.x + 11, a3.y));
        g.appendChild(badgeMark("O", right + 14, a3.y, "ok"));

        g.appendChild(leader(right, c9.y, c9.x + 11, c9.y));
        g.appendChild(badgeMark("X", right + 14, c9.y, "no"));
      }
    });
  }

  /** 두 장을 나란히 — 전극 지도(왼쪽) + 꽂는 법(오른쪽) */
  function breadboardPair() {
    return UI.el("div", { class: "figpair" }, [breadboardFigure(), breadboardUseFigure()]);
  }

  /* ================================================================== */
  /* 4. 피에조 스피커 — 이 차시의 설명 그림                                */
  /*                                                                    */
  /* ★ 실제 부품 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).          */

  /** 피에조 몸통 하나 — 여러 그림이 함께 쓴다 */
  function bigPiezo(g, cx, cy, opts) {
    var o = opts || {};
    var r = o.r || 52;

    /* 놋쇠 판 → 결정체 → 가운데 접점 순으로 겹쳐 그린다 */
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r, class: "figpz__case" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r - 12, class: "figpz__brass" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r - 26, class: "figpz__crystal" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: 5, class: "figpz__center" }));

    if (o.waves) {
      [12, 22, 32].forEach(function (extra) {
        g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r + extra, class: "figpz__wave" }));
      });
    }
    return { cx: cx, cy: cy, r: r };
  }

  /** ② 피에조 안에서는 무슨 일이 일어날까 */
  function piezoInsideFigure() {
    return figure({
      viewBox: "0 0 520 300",
      caption: "피에조 스피커를 잘라 본 모습",
      items: [
        { text: "얇은 놋쇠 판 — 소리를 내는 «북» 이다" },
        { text: "그 위에 붙인 세라믹 결정체 — 전기를 걸면 모양이 살짝 바뀐다" },
        { text: "전기가 오르내리면 판이 «휘었다 돌아왔다» 를 되풀이한다" },
        { text: "판이 둘레의 공기를 밀고 당긴다 — 그 떨림이 곧 소리다" }
      ],
      build: function (g) {
        /* 왼쪽 : 위에서 본 모습 */
        var top = bigPiezo(g, 128, 128, { r: 58 });
        g.appendChild(
          UI.svg("text", { x: top.cx, y: 214, class: "fig__legname" }, [txt("위에서 본 모습")])
        );

        /* 오른쪽 : 옆에서 본 «단면» — 판이 휘는 모습을 두 겹으로 */

   *
   *   markSide : -1 이면 왼쪽, +1 이면 오른쪽
   */
  function piezoCase(g, cx, cy, r, opts) {
    var o = opts || {};
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r, class: "figpz__case" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r - 6, class: "figpz__top" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: Math.max(5, r * 0.16), class: "figpz__hole" }));

    var mark = null;
    if (o.mark !== false) {
      var side = o.markSide === undefined ? -1 : o.markSide;
      /**
       * ★ 자리 : 몸통 «안쪽», 소리 구멍 «옆» 이다 (실물이 그렇다).
       *   가장자리에 붙이면 테두리를 물고 나가 무엇을 가리키는지 흐려진다.
       *   0.42 는 «가운데와 테두리의 사이» — 구멍(0.16)과 겹치지 않으면서 안에 든다.
       */
      mark = { x: cx + side * (r * 0.42), y: cy, r: Math.max(6, r * 0.2) };
      g.appendChild(UI.svg("circle", { cx: mark.x, cy: mark.y, r: mark.r, class: "figpz__markring" }));
      g.appendChild(UI.svg("text", { x: mark.x, y: mark.y + 5, class: "figpz__mark" }, [txt("＋")]));
    }
    return { cx: cx, cy: cy, r: r, mark: mark };
  }

  /* ================================================================== */

  /** 카드 id → 그림. 없는 카드는 글만 둔다. */
  var BY_CARD = {
    piezo: piezoInsideFigure,
    signal: squareWaveFigure,
    freq: freqScaleFigure,
    polarity: piezoPinsFigure
  };

  /* ------------------------------------------------------------------ */
  /* 악보 (5단계 예시 악보)                                                */
  /*                                                                    */
  /* ★ 계명 딱지만으로는 «악보» 가 아니다. 학생이 수업 자료에서 본 것과       */
  /*   같은 모습이라야 「이 악보를 프로그램으로 옮긴다」 가 이어진다.         */
  /*                                                                    */
  /* ★ 그림을 심지 «않는다» — 오선·음표·기둥·이음줄을 SVG 로 직접 그린다.    */
  /*   그래서 단일 HTML 이 가벼운 채로 file:// 에서도 열린다(이 폴더의 규칙). */
  /*                                                                    */
  /* ★ 음의 자리는 lesson.js 의 SHEET_PITCH 가 준 step 하나로 정해진다.     */
  /*   높은음자리표 «맨 아래 줄(E4)» 이 0 이고 한 칸에 1 씩 오른다.          */
  /*   계명을 고치면 악보 그림도 저절로 따라 움직인다.                       */
  /* ------------------------------------------------------------------ */

  /** 오선 한 칸의 높이(줄과 줄 사이) */
  var ST_GAP = 8;
  /** 맨 아래 줄(E4, step 0)의 y */
  var ST_BASE = 74;
  /** 음표 하나가 차지하는 가로 폭 — 긴 음에 넓은 자리를 준다 */
  function stepAdvance(beats) {
    return 20 + beats * 5;
  }

  function stepY(step) {
    return ST_BASE - step * (ST_GAP / 2);
  }

  /** 이 음이 몇 번째 마디에 드는가 — barAt 으로 가른다 */
  function measuresOf(line) {
    var out = [];
    var cur = [];
    line.notes.forEach(function (note, i) {
      cur.push({ note: note, index: i });
      if (line.barAt.indexOf(i + 1) !== -1) {
        out.push(cur);
        cur = [];
      }
    });
    if (cur.length) out.push(cur);
    return out;
  }

  /** 한 박이 몇 칸인가 — 8분음표 둘이 4분음표 하나(한 박)다 */
  var ST_BEAT = 2;

  /**
   * 8분음표(한 칸)가 «이어진» 묶음을 찾는다.
   *
   * ★ «박» 이 바뀌면 이음줄을 끊는다.
   *   한 마디의 8분음표를 통째로 묶으면 여섯 개가 한 줄로 이어져 박이 보이지 않는다.
   *   악보는 박마다 짝으로 묶는다 — 15마디의 ♪ 여섯 개가 (♪♪)(♪♪)(♪♪) 로 보여야 한다.
   *
   * 마디를 넘어 이어 붙이지 않는다 — 마디마다 따로 본다.
   * 혼자 남은 8분음표는 묶지 않고 꼬리를 단다.
   */
  function beamGroups(measure) {
    var groups = [];
    var run = [];
    var beat = -1;
    var pos = 0;

    function flush() {
      if (run.length > 1) groups.push(run);
      run = [];
    }

    measure.forEach(function (item) {
      if (item.note.beats === 1) {
        var now = Math.floor(pos / ST_BEAT);
        if (now !== beat) flush();
        beat = now;
        run.push(item);
      } else {
        flush();
        beat = -1;
      }
      pos += item.note.beats;
    });
    flush();
    return groups;
  }

  /**
   * 악보 한 줄을 그린다.
   *
   * line — SHEET.lines[n] ( { no, notes: [{ name, sci, step, beats }], barAt } )
   */
  function staffLine(line) {
    var kids = [];
    var x = 66;
    var placed = [];

    /* 자리를 먼저 잡는다 — 기둥과 이음줄이 그 자리를 함께 쓴다 */
    var measures = measuresOf(line);
    var bars = [];
    measures.forEach(function (measure) {
      measure.forEach(function (item) {
        placed.push({ note: item.note, index: item.index, x: x, y: stepY(item.note.step) });
        x += stepAdvance(item.note.beats);
      });
      bars.push(x - 8);
    });
    var width = x + 12;

    /* ── 오선 다섯 줄 ── */
    for (var i = 0; i <= 8; i += 2) {
      kids.push(
        UI.svg("line", { x1: 8, y1: stepY(i), x2: width - 10, y2: stepY(i), class: "stf__line" })
      );
    }

    /* ── 높은음자리표 ── */
    kids.push(UI.svg("text", { x: 14, y: ST_BASE + 3, class: "stf__clef" }, [txt("𝄞")]));

    /* ── 박자표 3/4 ── */
    kids.push(UI.svg("text", { x: 46, y: stepY(6) + 3, class: "stf__meter" }, [txt("3")]));
    kids.push(UI.svg("text", { x: 46, y: stepY(2) + 3, class: "stf__meter" }, [txt("4")]));

    /* ── 마디 번호 ── */
    kids.push(UI.svg("text", { x: 8, y: stepY(8) - 12, class: "stf__barno" }, [txt(line.no)]));

    /**
     * ── 이음줄 ──
     *
     * ★ 이음줄을 «수평» 으로 긋고, 묶인 기둥은 모두 그 높이까지 뻗는다.
     *   기둥마다 제 머리에서 같은 길이를 뻗게 하면 가운데 음의 기둥 끝이
     *   이음줄에 닿지 않는다(실제로 10px 떨어져 있었다).
     *   폭넓게 오르내리는 묶음에서는 수평 이음줄이 오히려 읽기 쉽다.
     *
     * ★ 방향은 «가운뎃줄(step 4)에서 가장 먼 음» 이 정한다.
     *   묶음 안에서 방향이 갈리면 이음줄을 그을 수 없다.
     */
    var STEM = 26;
    var MIN_STEM = 16;
    /* 이음줄이 서는 것을 묶는 값 — 음이 옥타브 가까이 뛰면 그대로 두면 너무 급해진다 */
    var MAX_SLANT = 12;
    var stemTo = {};
    var beams = [];

    measures.forEach(function (measure) {
      beamGroups(measure).forEach(function (run) {
        var items = run.map(function (item) {
          return placed[item.index];
        });

        var far = items[0];
        items.forEach(function (p) {
          if (Math.abs(p.note.step - 4) > Math.abs(far.note.step - 4)) far = p;
        });
        var down = far.note.step >= 4;

        var first = items[0];
        var last = items[items.length - 1];
        var y1 = down ? first.y + STEM : first.y - STEM;
        var y2 = down ? last.y + STEM : last.y - STEM;

        /* ② 기울기를 묶는다 */
        var dy = y2 - y1;
        if (Math.abs(dy) > MAX_SLANT) y2 = y1 + (dy > 0 ? MAX_SLANT : -MAX_SLANT);

        function at(x) {
          if (last.x === first.x) return y1;
          return y1 + ((x - first.x) * (y2 - y1)) / (last.x - first.x);
        }

        /* ③ 짧아지는 기둥이 있으면 이음줄을 통째로 민다 */
        var shift = 0;
        items.forEach(function (p) {
          var len = down ? at(p.x) - p.y : p.y - at(p.x);
          if (len < MIN_STEM) shift = Math.max(shift, MIN_STEM - len);
        });
        if (shift > 0) {
          y1 += down ? shift : -shift;
          y2 += down ? shift : -shift;
        }

        items.forEach(function (p) {
          stemTo[p.index] = { y: at(p.x), down: down };
        });
        beams.push({
          x1: down ? first.x - 5 : first.x + 5,
          y1: y1,
          x2: down ? last.x - 5 : last.x + 5,
          y2: y2
        });
      });
    });

    /* ── 음표 ── */
    placed.forEach(function (p) {
      var note = p.note;
      var open = note.beats >= 4;

      /* 덧줄 — 오선 위로 올라간 음(라·높은도) */
      for (var s2 = 10; s2 <= note.step; s2 += 2) {
        kids.push(
          UI.svg("line", { x1: p.x - 9, y1: stepY(s2), x2: p.x + 9, y2: stepY(s2), class: "stf__ledger" })
        );
      }

      /* 머리 — 4분음표보다 짧으면 «찬» 머리, 2분음표부터는 «빈» 머리 */
      kids.push(
        UI.svg("ellipse", {
          cx: p.x,
          cy: p.y,
          rx: 5.4,
          ry: 4,
          transform: "rotate(-20 " + p.x + " " + p.y + ")",
          class: open ? "stf__head stf__head--open" : "stf__head"
        })
      );

      /* 점 — 점4분음표·점2분음표. 줄 위의 음이면 «칸» 으로 올려 찍는다 */
      if (note.beats === 3 || note.beats === 6) {
        var dotY = note.step % 2 === 0 ? p.y - ST_GAP / 2 : p.y;
        kids.push(UI.svg("circle", { cx: p.x + 10, cy: dotY, r: 1.7, class: "stf__dot" }));
      }

      /* 기둥 — 묶인 음은 이음줄까지, 아니면 제 길이만큼 */
      var tied = stemTo[p.index];
      var down = tied ? tied.down : note.step >= 4;
      var sx = down ? p.x - 5 : p.x + 5;
      var sy = tied ? tied.y : down ? p.y + STEM : p.y - STEM;
      kids.push(UI.svg("line", { x1: sx, y1: p.y, x2: sx, y2: sy, class: "stf__stem" }));

      /* 꼬리 — 혼자 있는 8분음표 */
      if (note.beats === 1 && !tied) {
        var d = down
          ? "M " + sx + " " + sy + " c 5 -3 7 -7 6 -12"
          : "M " + sx + " " + sy + " c 5 3 7 7 6 12";
        kids.push(UI.svg("path", { d: d, class: "stf__flag" }));
      }
    });

    beams.forEach(function (beam) {
      kids.push(
        UI.svg("line", { x1: beam.x1, y1: beam.y1, x2: beam.x2, y2: beam.y2, class: "stf__beam" })
      );
    });

    /* ── 세로줄 ── */
    bars.forEach(function (bx, i) {
      var isLast = i === bars.length - 1;
      kids.push(UI.svg("line", { x1: bx, y1: stepY(8), x2: bx, y2: stepY(0), class: "stf__bar" }));
      if (isLast) {
        kids.push(UI.svg("line", { x1: bx + 4, y1: stepY(8), x2: bx + 4, y2: stepY(0), class: "stf__bar stf__bar--end" }));
      }
    });

    /* ── 계명 ── */
    placed.forEach(function (p) {
      kids.push(UI.svg("text", { x: p.x, y: 104, class: "stf__solfa" }, [txt(p.note.label)]));
    });

    return UI.svg(
      "svg",
      {
        viewBox: "0 0 " + width + " 116",
        class: "stf",
        role: "img",
        "aria-label":
          line.no + " — " +
          line.notes.map(function (n) {
            return n.label + " " + n.value.name;
          }).join(", ")
      },
      kids
    );
  }

  /** 악보 두 줄을 한 그림으로 */
  function staffFigure(sheet) {
    return UI.el(
      "div",
      { class: "stfbox" },
      sheet.lines.map(function (line) {
        return staffLine(line);
      })
    );
  }

  S.figures = {
    figure: figure,
    uno: unoFigure,
    breadboard: breadboardFigure,
    breadboardUse: breadboardUseFigure,
    breadboardPair: breadboardPair,
    ide: ideFigure,
    piezoInside: piezoInsideFigure,
    squareWave: squareWaveFigure,
    freqScale: freqScaleFigure,
    piezoPins: piezoPinsFigure,
    staff: staffFigure,
    staffLine: staffLine,
    /** 그 카드에 붙일 그림을 만든다. 없으면 null. */
    forCard: function (id) {
      return BY_CARD[id] ? BY_CARD[id]() : null;
    },
    has: function (id) {
      return !!BY_CARD[id];
    }
  };
})();

    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });

      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;

      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      var after = area.value.slice(area.selectionEnd);

      area.selectionStart = area.selectionEnd = start + 1 + indent.length;

      UI.el("div", { class: "editor__body" }, [gutter, area]),

  function assembler(order, onChange) {

     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */

    function sourceOf() {

        })

    }

      if (onChange) onChange(current.slice(), sourceOf());
    }

    /* 차례 바꾸기 — ▲▼ 단추 (키보드·낭독기가 쓰는 길)                       */
    /* ------------------------------------------------------------------ */

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      tell();
      UI.announce((index + 1) + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;

    /*   줄 아무 데나 잡히게 하면 손가락으로 화면을 세로로 넘길 수 없다.      */
    /*                                                                    */
    /* ★ ▲▼ 단추를 «그대로 둔다».                                          */
    /*   끌어 옮기기는 키보드로 할 수 없다. 두 길이 모두 있어야 한다(명세 13장). */
    /* ------------------------------------------------------------------ */

    var drag = null;

    function itemsNow() {
      return Array.prototype.slice.call(listHost.querySelectorAll(".assemble__item"));
    }

    /** 지금 화면에 놓인 차례를 그대로 읽어 current 로 삼는다 */
    function readOrderFromDom() {
      current = itemsNow().map(function (el) {
        return el.getAttribute("data-id");
      });
    }

    /**
     * ★★ 끌고 있는 동안 «어디에 놓이는가» 를 보여 준다.
     *
     *   전에는 줄을 곧바로 insertBefore 로 옮겼다. 그런데 끌고 있는 줄이
     *   손가락을 따라오지 않으니, 화면이 조금씩 바뀌어도 «내가 어디로 가는지»
     *   를 알 수 없었다. 실제로 「옮겨지는 자리를 판단할 수 없다」는 말을 들었다.
     *
     *   그래서 둘로 갈랐다.
     *     ① 끌고 있는 줄  — 자리에서 떼어 내(position: fixed) 손가락을 따라간다
     *     ② 놓일 자리     — 같은 높이의 «점선 칸» 이 목록 안에서 움직이며
     *                      「3번째 자리」 처럼 몇 번째가 될지 적는다
     *
     *   놓는 순간 ①을 ②가 있던 자리에 끼워 넣는다.
     */
    function dragMove(ev) {
      if (!drag) return;
      /* 손가락으로 끌 때 화면이 함께 밀리지 않게 한다 */
      if (ev.cancelable) ev.preventDefault();

      /* ① 끌고 있는 줄은 손가락을 따라간다 */
      drag.item.style.top = ev.clientY - drag.grabY + "px";

      /* ② 놓일 자리를 옮긴다 — 가운데를 지난 줄 «앞» 으로 */
      var y = ev.clientY;
      var others = itemsNow().filter(function (el) {
        return el !== drag.item;
      });
      var before = null;
      for (var i = 0; i < others.length; i += 1) {
        var r = others[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) {
          before = others[i];
          break;
        }
      }
      if (before) listHost.insertBefore(drag.slot, before);
      else listHost.appendChild(drag.slot);

      /* 몇 번째가 되는지 칸 안에 적는다 — 이것이 «어디로 가는가» 의 답이다 */
      var flow = Array.prototype.slice.call(listHost.children).filter(function (el) {
        return el !== drag.item;
      });
      drag.slot.textContent = flow.indexOf(drag.slot) + 1 + "번째 자리";
    }

    function dragEnd() {
      if (!drag) return;
      var item = drag.item;
      var slot = drag.slot;
      var fromIndex = drag.from;

      try {
        item.releasePointerCapture(drag.pointerId);
      } catch (err) {
        /* 이미 놓인 포인터면 그냥 넘어간다 */
      }

      /* 점선 칸이 있던 «그 자리» 에 줄을 끼워 넣는다 */
      listHost.insertBefore(item, slot);
      listHost.removeChild(slot);

      item.removeAttribute("style");
      item.classList.remove("assemble__item--dragging");
      listHost.classList.remove("assemble--dragging");
      root.removeEventListener("pointermove", dragMove);
      root.removeEventListener("pointerup", dragEnd);
      root.removeEventListener("pointercancel", dragEnd);
      drag = null;

      readOrderFromDom();
      var toIndex = itemsNow().indexOf(item);
      draw();
      tell();

      if (toIndex !== fromIndex) {
        UI.announce(fromIndex + 1 + "번째 줄을 " + (toIndex + 1) + "번째로 옮겼습니다.");
      }
      /* 놓은 뒤에도 그 줄에 초점을 두어, 이어서 ▲▼ 로 다듬을 수 있게 한다 */
      var landed = listHost.querySelectorAll(".assemble__item")[toIndex];
      var handle = landed ? landed.querySelector(".assemble__grip") : null;
      if (handle) handle.focus();
    }

    function dragStart(ev, item, index) {
      /* 왼쪽 단추(또는 손가락)만 받는다 */
      if (ev.button !== undefined && ev.button !== 0) return;
      if (ev.cancelable) ev.preventDefault();

      var rect = item.getBoundingClientRect();

      /* 놓일 자리 — 끌고 있는 줄과 «같은 높이» 라야 목록이 출렁이지 않는다 */
      var slot = UI.el("li", {
        class: "assemble__slot",
        attrs: { "aria-hidden": "true" },
        text: index + 1 + "번째 자리"
      });
      slot.style.height = rect.height + "px";
      listHost.insertBefore(slot, item);

      /* 끌고 있는 줄 — 자리에서 떼어 내 손가락을 따라가게 한다 */
      item.style.position = "fixed";
      item.style.left = rect.left + "px";
      item.style.top = rect.top + "px";
      item.style.width = rect.width + "px";
      item.style.margin = "0";
      item.style.zIndex = "60";

      drag = {
        item: item,
        slot: slot,
        from: index,
        pointerId: ev.pointerId,
        grabY: ev.clientY - rect.top
      };
      item.classList.add("assemble__item--dragging");
      listHost.classList.add("assemble--dragging");
      try {
        item.setPointerCapture(ev.pointerId);
      } catch (err) {
        /* 포인터 잡기를 못 해도 문서에 붙인 듣는 이로 따라간다 */
      }
      root.addEventListener("pointermove", dragMove, { passive: false });
      root.addEventListener("pointerup", dragEnd);
      root.addEventListener("pointercancel", dragEnd);
    }

    /* ------------------------------------------------------------------ */

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];

        /* 손잡이 — 끌어 옮기는 자리. 낭독기에는 «무엇을 옮기는지» 를 알린다. */
        var grip = UI.el("span", {
          class: "assemble__grip",
          text: "⠿",
          attrs: {
            role: "button",
            tabindex: "-1",
            "aria-label": line.text + " — 끌어서 차례 옮기기",
            title: "끌어서 옮기기"
          }
        });

        var item = UI.el("li", { class: "assemble__item", attrs: { "data-id": id } }, [
          grip,
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);

        grip.addEventListener("pointerdown", function (ev) {
          dragStart(ev, item, index);
        });

        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        listHost.appendChild(item);
      });
    }

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", {
          class: "assemble__help",
          text: "⠿ 를 끌어 옮기거나, ▲ ▼ 단추로 줄의 차례를 바로잡으세요."
        }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isSolved: function () {
        return current.every(function (id, i) {
          return byId[id].order === i + 1;
        });
      }
    };
  }


  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 빈칸 채우기 판.
   *
   * ★ template 을 받는다 — 4단계는 A.BLANK_TEMPLATE, 5단계 확장 활동은
   *   L.extensionTemplate(고른 알림음) 을 준다. 안 주면 4단계 판을 쓴다(옛 부름 그대로).
   *
   * ★ line.step 이 있으면 «몇 번째 차례의 빈칸인가» 를 딱지로 붙인다.
   *   차례 목록과 빈칸이 떨어져 있어도 어느 줄을 말하는지 알 수 있다.
   */
  function blanks(values, onChange, template) {
    var tpl = template || A.BLANK_TEMPLATE;
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    tpl.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: {
            type: "text",
            /* ★ 힌트는 «위» 에 따로 적는다 — placeholder 는 줄바꿈이 안 되어
               좁은 화면에서 뒷글자가 잘린다. 여기에는 짧은 안내만 둔다. */
            placeholder: "여기에 코드를 적으세요",
            spellcheck: "false",
            autocapitalize: "off"
          }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        /**
         * ★ 힌트를 «보이는 이름표» 로 둔다.
         *
         *   placeholder 로 두었더니 「speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄」
         *   의 뒷글자가 잘렸다. placeholder 는 한 줄로만 그려져 줄바꿈이 안 되기 때문이다.
         *   글씨를 줄이면 넓은 화면에서는 들어가지만 좁은 화면에서는 여전히 잘린다.
         *   이름표로 올리면 «어느 폭에서든» 줄이 접히며 다 보인다.
         */
        var row = UI.el("div", { class: "blanks__row" }, [
          UI.el("label", { class: "blanks__hint", attrs: { for: id } }, [
            line.step
              ? UI.el("span", { class: "blanks__step", attrs: { "aria-hidden": "true" }, text: line.step })
              : null,
            UI.el("span", { class: "blanks__hinttext", text: line.hint })
          ]),
          input
        ]);
        /* 들여쓰기를 코드와 맞춘다 — 빈칸이 «그 자리» 에 있는 것처럼 보이게 */
        if (line.indent) row.style.paddingLeft = line.indent * 2 + "ch";
        host.appendChild(row);
        return;
      }

      host.appendChild(
        UI.el("div", { class: "blanks__row blanks__row--fixed" }, [
          UI.el("code", { class: "blanks__fixed" }, [lineNode(line.text)])
        ])
      );
    });

    function sourceOf() {
      return tpl.lines
        .map(function (line) {
          if (!line.blank) return line.text;
          var typed = String(current[line.blank] || "").trim();
          return "  ".repeat(line.indent || 0) + typed;
        })
        .join("\n");
    }

    return {
      root: host,
      getSource: sourceOf,
      getValues: function () {
        return current;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — 파형·소리·«누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(400) 이면 0.4초를 기다린다. 그래야 음과 음 사이가 실제 보드처럼 갈라지고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다.
     *
     *     1배속   delay 값 그대로 (delay(400) → 0.4초)
     *     0.5배속 두 배 천천히 — 음이 갈라지는 사이를 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

    <script data-from="student/s60-screens.js">
/**
 * 학생용 여섯 화면 (명세 5장 · 7장)
 *
 *   1 시작하기 · 2 원리 이해 · 3 회로 결선 · 4 텍스트 코딩 · 5 실행·탐구 · 6 형성평가·제출

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;
  var A = PC.arduino;
  var L = PC.lesson;
  var ED = S.editor;

  var el = UI.el;

  /* ================================================================== */
  /* 1단계 — 시작하기                                                    */
  /* ================================================================== */

  /**
   * 모양은 lesson3_7_1 의 시작 화면과 같다.
   *   눈길 문구 → 제목 → 부제 → 학습 목표 → 한 줄 안내 → 학습 순서 →
   *   안전 수칙 → 예상 시간 → [학습 시작] → 도움말

   * ★ 확인 질문을 두지 않는다. 아직 배우지 않은 첫 화면에서 묻지 않는다.
   *   이 단계를 넘어가는 조건은 «안전 수칙 확인» 하나다.
   */
  function renderIntro(state, app) {

    var box = el("div", { class: "hero" });

    box.appendChild(el("p", { class: "hero__eyebrow", text: hero.eyebrow }));

      el("section", { class: "goal-card", attrs: { "aria-labelledby": "goal-card-title" } }, [

        ]),

            el("span", { class: "goal-item__text", text: text })

    /* 부담을 덜어 주는 한 줄 */
    box.appendChild(
      el("p", { class: "hero__note" }, [
        el("span", { text: hero.note.before }),
        el("b", { text: hero.note.strong }),
        el("span", { text: hero.note.after })
      ])
    );

    /* 학습 순서 */
    box.appendChild(
      el("section", { class: "agenda", attrs: { "aria-labelledby": "agenda-title" } }, [
        el("h2", { class: "agenda__title", id: "agenda-title", text: "학습 순서" }),
        el("ol", { class: "agenda__list" }, hero.agenda.map(function (item) {
          return el("li", { class: "agenda__item" }, [
            /* 원문자는 낭독기가 읽기 어려우므로 화면에만 보이고 순서는 <ol> 이 전한다 */
            el("span", { class: "agenda__marker", attrs: { "aria-hidden": "true" }, text: item.marker }),
            el("span", { text: item.text })
          ]);
        }))
      ])
    );

    /* 안전 수칙 — 실물 실습으로 이어지는 차시라 시작 화면에서 약속한다 */
    var safetyId = UI.nextId("safety");
    var safetyBox = el("input", { class: "check__input", id: safetyId, attrs: { type: "checkbox" } });
    safetyBox.checked = state.intro.safetyRead === true;
    safetyBox.addEventListener("change", function () {
      app.update(function (s) {
        s.intro.safetyRead = safetyBox.checked;
      });
    });

    box.appendChild(
      el("section", { class: "safety-card", attrs: { "aria-labelledby": "safety-title" } }, [
        el("h2", { class: "safety-card__title", id: "safety-title" }, [
          el("span", { attrs: { "aria-hidden": "true" }, text: "⚠" }),
          el("span", { text: "안전 수칙" })
        ]),
        el("p", {
          class: "safety-card__desc",
          text: "오늘은 시뮬레이션이지만, 실제 실습에서 지켜야 할 약속을 먼저 읽습니다."
        }),
        el("ul", { class: "safety" }, PC.SAFETY.map(function (line) {
          return el("li", { class: "safety__item" }, [
            el("span", { class: "safety__mark", attrs: { "aria-hidden": "true" }, text: "!" }),
            el("span", { text: line })
          ]);
        })),
        el("div", { class: "check" }, [
          safetyBox,
          el("label", { class: "check__label", attrs: { for: safetyId }, text: "안전 수칙을 읽고 지키겠습니다." })
        ])
      ])
    );

    box.appendChild(el("p", { class: "hero__time", text: hero.time }));

    /* 학습 시작 — 화면에서 가장 큰 단추 */
    var ready = state.intro.safetyRead === true;
    box.appendChild(
      el("div", { class: "hero__cta" }, [
        UI.button("학습 시작", {
          class: "btn btn--primary btn--lg",
          disabled: !ready,
          attrs: { "aria-label": "학습 시작. 2단계 원리 이해 화면으로 이동합니다." },
          click: function () {
            app.goTo(1);
          }
        })
      ])
    );
    if (!ready) {
      box.appendChild(el("p", { class: "hero__ctanote", text: "위 안전 수칙을 확인하면 학습을 시작할 수 있어요." }));
    }

    box.appendChild(el("div", { class: "hero__feedback" }, [UI.alert("info", hero.tip)]));

    return box;
  }

  /* ================================================================== */
  /* 2단계 — 원리 이해                                                   */
  /* ================================================================== */

  /**
   * 함수 설명 상자 세 개 (pinMode · digitalWrite · delay).
   *
   * 2단계 «원리 이해» 와 4단계 «예시 읽기» 가 «같은 것» 을 쓴다.
   * 4단계에서는 예시 코드 «옆» 에 나란히 놓아, 코드를 읽으며 함수 뜻을 바로 볼 수 있게 한다.
   */
  function functionCards() {
    var card = null;
    L.CONCEPT_CARDS.forEach(function (c) {
      if (c.id === "functions") card = c;
    });
    if (!card) return null;

    return el(
      "div",
      { class: "fncards" },
      card.functions.map(function (f) {
        return el("div", { class: "fncard" }, [
          el("p", { class: "fncard__head" }, [
            el("code", { class: "fncard__name", text: f.name }),
            f.summary ? el("span", { class: "fncard__summary", text: f.summary }) : null
          ]),
          el("ul", { class: "fnforms" }, (f.forms || []).map(function (form) {
            return el("li", { class: "fnforms__item" }, [
              form.label ? el("span", { class: "fnforms__label", text: form.label }) : null,
              el("code", { class: "fnforms__code", text: form.code }),
              form.comment ? el("span", { class: "fnforms__comment", text: "// " + form.comment }) : null
            ]);
          })),
          el("p", { class: "fncard__means", text: f.means }),
          el("p", { class: "fncard__when" }, [
            el("span", { class: "fncard__tag", text: "언제" }),
            document.createTextNode(" " + f.when)
          ]),
          el("p", { class: "fncard__note", text: f.note })
        ]);
      })
    );
  }

  /**
   * 주파수 슬라이더 — 올리면 «파형 간격과 음높이 표시가 함께» 바뀐다(명세 6.3).
   *
   * ★ 소리를 켜지 않아도 파형과 음이름은 움직인다.
   *   교실에서 소리를 낼 수 없는 상황에서도 «주파수 ↑ = 음 ↑» 을 배울 수 있어야 한다.
   */
  function freqLab() {
    var LAB = L.FREQ_LAB;
    var notes = PC.NOTES || [];
    var startHz = notes.length ? notes[0].hz : 523;

    var scope = S.audio.scope({ hz: startHz });
    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });
    var playing = false;

    var slider = el("input", {
      class: "freqlab__range",
      attrs: {
        type: "range",
        min: String(PC.FREQ_MIN || 31),
        max: String(PC.FREQ_MAX || 4000),
        step: "1",
        value: String(startHz),
        "aria-label": "주파수 (헤르츠)"
      }
    });

    function apply(hz, andPlay) {
      var freq = Math.max(PC.FREQ_MIN || 31, Math.min(PC.FREQ_MAX || 4000, Math.round(hz)));
      slider.value = String(freq);
      scope.set(freq);
      live.textContent = freq + "헤르츠";
      if (andPlay && playing) S.audio.play(freq);
    }

    slider.addEventListener("input", function () {
      apply(Number(slider.value), true);
    });

    var holdBtn = UI.button("▶ 눌러서 듣기", {
      class: "btn btn--ghost btn--small",
      click: function () {
        S.audio.unlock();
        playing = !playing;
        holdBtn.textContent = playing ? "■ 소리 멈춤" : "▶ 눌러서 듣기";
        if (playing) S.audio.play(Number(slider.value));
        else S.audio.stop();
      }
    });

    /* 눌러 볼 만한 자리 — 슬라이더를 잡기 어려운 학생을 위한 지름길 */
    var presets = el(
      "div",
      { class: "freqlab__presets" },
      (LAB.presets || []).map(function (pre) {
        return UI.button(pre.label + " " + pre.hz, {
          class: "btn btn--ghost btn--small",
          click: function () {
            apply(pre.hz, true);
          }
        });
      })
    );

    return UI.card({ eyebrow: "직접 해 보기", title: LAB.title, desc: LAB.intro }, [
      S.audio.controls({}),
      el("div", { class: "freqlab__row" }, [slider, holdBtn]),
      presets,
      scope.root,
      UI.foldout("주파수를 두 배로 올리면 어떻게 될까? (생각해 본 뒤 열어 보세요)", function () {
        return el("div", {}, [
          el("p", { class: "para", text: LAB.ask }),
          UI.alert("ok", LAB.answer)
        ]);
      }),
      live
    ]);
  }

  /**
   * 2단계 — 원리 이해 (명세 7장 화면2)
   *
   *   ① 생활 속 알림음의 «목적» 추론
   *   ② 피에조 효과   ③ 전기 신호가 소리가 되기까지
   *   ④ 주파수와 음높이 (+ 슬라이더로 직접 바꾸어 보기)
   *   ⑤ 두 단자와 극성   ⑥ tone · noTone 함수 카드
   *   ⑦ 개념 확인 3문항 — «배운 뒤에» 묻는다
   */
  function renderConcept(state, app) {
    var box = el("div");
    var roleInfo = L.SOUND_ROLE;

    /* ① 우리 둘레의 알림음 — 문제 상황 (명세 7장 화면1의 내용) */
    box.appendChild(
      UI.card({ eyebrow: "찾아보기", title: roleInfo.title, desc: roleInfo.story }, [
        el(
          "div",
          { class: "iocards" },
          roleInfo.cases.map(function (c) {
            return el("div", { class: "iocard iocard--role" }, [
              el("p", { class: "iocard__role" }, [
                el("span", { class: "iocard__icon", attrs: { "aria-hidden": "true" }, text: c.icon }),
                el("span", { text: c.name })
              ]),
              el("h3", { class: "iocard__title", text: c.role }),
              el("p", { class: "iocard__device", text: c.what }),
              el("p", { class: "iocard__detail", text: c.detail })
            ]);
          })
        ),
        el("p", { class: "flowline", attrs: { "aria-hidden": "true" }, text: "높이(주파수) · 길이(시간) → 신호" }),
        el("p", { class: "para", text: roleInfo.conclusion })
      ])
    );

    /* ②~⑥ 개념 카드 — 하나씩 열어 읽는다 */
    box.appendChild(
      UI.card({ title: "핵심 개념 탐구", desc: "다섯 장을 모두 열어 읽어 보세요." }, [
        el(
          "div",
          { class: "explore" },
          L.CONCEPT_CARDS.map(function (c) {
            var opened = state.concept.opened[c.id] === true;

            /* 글이 없는 카드(그림·함수 상자만 있는 것)도 있으므로 빈 배열을 받아 준다 */
            var body = (c.body || []).map(function (line) {
              return el("p", { class: "para", text: line });
            });

            /* 그림은 자체 SVG 다 (명세 13장 — 저작권이 불명확한 사진을 쓰지 않는다) */
            body.push(S.figures ? S.figures.forCard(c.id) : null);

            /* 함수 카드 (명세 17.2 ⑥) — 4단계와 «같은 것» 을 쓴다 */
            if (c.functions) {
              body.push(functionCards());
            }

            if (c.keyPoints) {
              body.push(
                el("ul", { class: "keypoints" }, c.keyPoints.map(function (k) {
                  return el("li", { class: "keypoints__item", text: k });
                }))
              );
            }

            var details = el("details", { class: "explore__item", attrs: { "data-card": c.id } }, [
              el("summary", { class: "explore__sum" }, [
                el("span", { class: "explore__mark", attrs: { "aria-hidden": "true" }, text: opened ? "✔" : "＋" }),
                el("span", { class: "explore__title", text: c.title }),
                el("span", { class: "explore__lead", text: c.lead })
              ]),
              el("div", { class: "explore__body" }, body)
            ]);

            if (opened) details.open = true;
            details.addEventListener("toggle", function () {
              if (!details.open || state.concept.opened[c.id]) return;
              app.patch(function (s) {
                s.concept.opened[c.id] = true;
              });
            });
            return details;
          })
        )
      ])
    );

    /* 주파수를 «직접» 바꾸어 보는 자리 (명세 6.3) — 카드를 읽은 바로 뒤에 둔다 */
    box.appendChild(freqLab());

    /* setup / loop 흐름 그림 */
    box.appendChild(
      UI.card({ title: "setup() 은 한 번, loop() 는 계속" }, [
        el("div", { class: "flow" }, L.SKETCH_FLOW.map(function (step, i) {
          return el("div", { class: "flow__step flow__step--" + step.phase }, [
            el("span", { class: "flow__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
            el("p", { class: "flow__label", text: step.label }),
            el("p", { class: "flow__note", text: step.note }),
            step.phase === "loop" ? el("span", { class: "flow__repeat", text: "↻ 되풀이" }) : null
          ]);
        })),
        ED
          ? ED.codeView(A.REFERENCE_CODE, { caption: "오늘 만들 기준 프로그램 — 4단계에서 한 줄씩 읽습니다" }).root
          : UI.codeBlock(A.REFERENCE_CODE, "오늘 만들 기준 프로그램")
      ])
    );

    /**
     * 같은 일을 하는 두 가지 프로그램.
     *
     * ★ 하나만 보여 주면 학생은 «반드시 그렇게 써야 하는 줄» 안다.
     *   둘을 나란히 놓아야 무엇이 규칙이고 무엇이 골라 쓰는 것인지 갈린다.
     */
    var W2 = L.TWO_WAYS;
    box.appendChild(
      UI.card({ eyebrow: "골라 쓰는 것", title: W2.title, desc: W2.intro }, [
        el(
          "div",
          { class: "twoways" },
          W2.ways.map(function (way) {
            /* 좋은 점(＋)과 아쉬운 점(－) 을 한 목록에 모은다.
               색이 아니라 ＋ · － 기호와 낭독용 글이 뜻을 진다(명세 13장). */
            function point(text, kind) {
              return el("li", { class: "twoway__point twoway__point--" + kind }, [
                el("span", {
                  class: "twoway__mark",
                  attrs: { "aria-hidden": "true" },
                  text: kind === "good" ? "＋" : "－"
                }),
                el("span", { class: "sr-only", text: kind === "good" ? "좋은 점 : " : "아쉬운 점 : " }),
                el("span", { text: text })
              ]);
            }

            var points = [];
            (way.good || []).forEach(function (t) {
              points.push(point(t, "good"));
            });
            (way.bad || []).forEach(function (t) {
              points.push(point(t, "bad"));
            });

            /**
             * ★ 시간 배분 — «400ms 가 어떻게 쓰이는가».
             *   코드에는 250 과 400 만 적혀 있고 정작 배워야 할 150 은 적혀 있지 않다.
             *   그 뺄셈을 눈으로 보여 주는 자리다.
             */
            var timing = null;
            if (way.timing) {
              timing = el("div", { class: "timing" }, [
                el("p", { class: "timing__title", text: way.timing.title }),
                el(
                  "ul",
                  { class: "timing__spans" },
                  way.timing.spans.map(function (sp) {
                    return el("li", { class: "timing__span" }, [
                      el("span", { class: "timing__at", text: sp.at }),
                      el("span", { class: "timing__what", text: sp.what }),
                      sp.why ? el("span", { class: "timing__why", text: sp.why }) : null
                    ]);
                  })
                ),
                /* ① 만 뺄셈과 «두 함수의 구실» 을 갖는다. ② 은 줄을 따라 읽는다. */
                way.timing.sum ? el("p", { class: "timing__sum", text: way.timing.sum }) : null,
                way.timing.role ? el("p", { class: "timing__role", text: way.timing.role }) : null
              ]);
            }

            return el("div", { class: "twoway" }, [
              el("p", { class: "twoway__label", text: way.label }),
              el("code", { class: "twoway__lead", text: way.lead }),
              ED ? ED.codeView(way.code, {}).root : UI.codeBlock(way.code, way.label),
              timing,
              /* ★ 좋은 점·아쉬운 점이 없는 쪽도 있다 — 빈 목록을 만들지 않는다 */
              points.length ? el("ul", { class: "twoway__points" }, points) : null
            ]);
          })
        ),
        UI.alert("ok", W2.same),
        UI.alert("info", W2.choose)
      ])
    );

    /* ⑦ 개념 확인 — 오답에는 정답을 알려 주지 않고 «돌아갈 카드» 를 알려 준다(명세 17.2) */
    var checkBox = el("div");
    L.CONCEPT_CHECK.forEach(function (q) {
      var picked = state.concept.checkChoices[q.id];
      var passed = state.concept.checks[q.id] === true;
      var feedback = el("div", { class: "feedback" });

      if (picked !== undefined) {
        if (passed) {
          feedback.appendChild(UI.alert("ok", "맞았습니다."));
        } else {
          var card = null;
          L.CONCEPT_CARDS.forEach(function (c) {
            if (c.id === q.review) card = c;
          });
          feedback.appendChild(
            UI.alert("warn", "다시 골라 보세요. " + q.hint, [
              card
                ? UI.button("«" + card.title + "» 카드 다시 보기", {
                    class: "btn btn--ghost btn--small",
                    click: function () {
                      /* 정답을 알려 주지 않고 «읽을 자리» 로 데려다 준다 */
                      var node = document.querySelector('[data-card="' + card.id + '"]');
                      if (!node) return;
                      node.open = true;
                      node.scrollIntoView({ block: "center" });
                      var sum = node.querySelector("summary");
                      if (sum) sum.focus();
                    }
                  })
                : null
            ])
          );
        }
      }

      checkBox.appendChild(
        el("div", { class: "quizitem" }, [
          UI.choiceGroup(
            { name: "cc-" + q.id, choices: q.choices, legend: q.question },
            picked,
            function (index) {
              app.update(function (s) {
                s.concept.checkChoices[q.id] = index;
                s.concept.checks[q.id] = index === q.answerIndex;
              });
            }
          ),
          feedback
        ])
      );
    });

    var done = L.CONCEPT_CHECK.filter(function (q) {
      return state.concept.checks[q.id] === true;
    }).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "개념 확인",
          title: "세 문항을 모두 맞히면 다음 단계가 열립니다.",
          desc: "지금 " + done + " / " + L.CONCEPT_CHECK.length + " 문항"
        },
        [checkBox]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 3단계 — 회로 결선                                                   */
  /* ================================================================== */

  /**
   * 3단계는 두 판으로 나뉜다.
   *   3-A 단자 찾기  — 보드 위에서 이름을 찾아 누른다
   *   3-B 전원 결선  — 우노의 전원을 브레드보드로 보내고 전압을 재어 확인한다
   *
   * 화면을 짤 때 지킨 것
   *   ① «지금 할 일» 을 맨 위에 한 줄로 적는다. 학생이 무엇을 하는 화면인지 바로 알게.
   *   ② 그 아래 «회로 점검» — 채운 조건과 못 채운 조건. 힌트 단추는 그 줄에 «붙여» 둔다.
   *      (조건 목록과 힌트 줄을 따로 두면 같은 문장이 두 번 나온다)
   *   ③ 그림은 그다음이다. 할 일을 읽고 그림으로 내려가는 순서다.
   */

  /** 작은 진행 표시 — ①②③④ 중 어디까지 왔는지 한 줄로 */
  function taskStrip(items) {
    return el("ol", { class: "tasks" }, items.map(function (item, i) {
      var state = item.done ? "is-done" : item.now ? "is-now" : "";
      return el("li", { class: ("tasks__item " + state).trim() }, [
        el("span", { class: "tasks__no", attrs: { "aria-hidden": "true" }, text: item.done ? "✔" : String(i + 1) }),
        el("span", { class: "tasks__text", text: item.text }),
        el("span", { class: "sr-only", text: item.done ? " 마침" : item.now ? " 지금 할 일" : " 아직" })
      ]);
    }));
  }

  /**
   * 「지금 할 일」 한 줄 — 상태를 보고 다음 행동 «하나만» 고른다.
   *
   * ★ 여러 줄을 한꺼번에 늘어놓지 않는다. 회로가 엉켰을 때 고칠 것이 대여섯 개로 보이면
   *   학생은 어디부터 손대야 할지 알 수 없다. 판정도 그렇게 하도록 circuit.js 가
   *   «아직 판정할 수 없는» 항목을 blocked 로 돌려준다.
   */
  function nowDoing(state, check, dangers) {
    var c = state.circuit;

    /* 위험 연결이 가장 먼저다 — 그것을 고치기 전에는 나머지를 볼 까닭이 없다 */
    if (dangers.length > 0) {
      return { at: 0, text: dangers[0].title + " — 아래 경고를 읽고 그 케이블부터 고치세요." };
    }

    var missing = {};
    check.missing.forEach(function (m) {
      missing[m.id] = true;
    });

    if (missing["c-sig"]) {
      return {
        at: 1,
        text: "우노의 «" + C.SPEAKER_PIN_NAME + "» 에서 피에조의 «" + C.pinTitle("SIG") + "» 로 이으세요."
      };
    }
    if (missing["c-gnd"]) {
      return {
        at: 2,
        text: "피에조의 «" + C.pinTitle("GND") + "» 를 우노의 «GND» 로 이으세요. 전류가 돌아올 길입니다."
      };
    }
    if (missing["c-nopower"]) {
      return { at: 1, text: "피에조가 5V 계열 핀에 물려 있습니다. 그 케이블을 지우세요." };
    }
    if (missing["c-tidy"]) {
      return { at: 2, text: "쓰지 않는 케이블이나 반쯤 꽂힌 다리가 있습니다. 아래 목록에서 정리하세요." };
    }
    if (!c.powerOn) {
      return { at: 3, text: "점검을 모두 통과했습니다. 아래 [전원 켜기] 를 눌러 전기를 넣으세요." };
    }
    return { at: 4, text: "3단계를 마쳤습니다. 아래 [다음] 으로 넘어가세요." };
  }

  /** 회로가 바뀌면 «전원·점검·측정» 은 처음부터 다시 확인한다 */
  function resetPower(s) {
    s.circuit.powerOn = false;
    s.circuit.checked = false;
    if (!C.checkCircuit(s.circuit.connections).ok) s.circuit.checkPassed = false;
  }

  /**
   * 케이블 색이 무엇을 뜻하는지 그림 바로 아래에 적는다.
   * 색을 «읽는 법» 을 모르면 색을 나눈 뜻이 없다.
   */
  function wireLegend() {
    return el("ul", { class: "wirelegend" }, [
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--orange", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "주황 — " + PC.SPEAKER_PIN_NAME + " 에서 피에조 신호 단자까지 (신호가 나가는 길)" })
      ]),
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--blue", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "파랑 — 피에조 접지 단자에서 GND 까지 (전류가 돌아오는 길)" })
      ]),
      el("li", { class: "wirelegend__item" }, [
        el("span", { class: "wirelegend__dot wirelegend__dot--gray", attrs: { "aria-hidden": "true" } }),
        el("span", { text: "회색 — 이 회로에 쓰이지 않는 케이블" })
      ])
    ]);
  }

  /** 「이렇게 이으면 됩니다」 아래에 늘 붙는 한 줄 */
  var WIRING_NOTE =
    "브레드보드를 거쳐 가도 됩니다. 같은 마디(같은 열)라면 어느 구멍에 꽂아도 같은 연결로 봅니다. " +
    "★ LED 차시와 달리 저항은 넣지 않습니다 — 피에조는 전류를 거의 쓰지 않기 때문입니다.";

  /**
   * 피에조 종류 고르기 — 수동 / 모듈형 (명세 6.3)
   *
   * ★ 고르면 «단자에 적히는 글자» 가 바뀐다. 규칙(신호→D8, 접지→GND)은 그대로다.
   *   달라지는 것은 하나뿐이다 — 뒤집어 꽂았을 때 수동은 울리고 모듈형은 울리지 않는다.
   *   그래서 종류를 바꾸어도 이미 이어 둔 케이블은 지우지 않는다.
   */
  function piezoModePicker(state, app) {
    var modes = PC.PIEZO_MODES || [];
    var here = C.modeSpec(state.circuit.piezoMode);

    var row = el("div", { class: "modepick" }, modes.map(function (m) {
      var on = m.id === here.id;
      return UI.button(m.label, {
        class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
        attrs: { "aria-pressed": on ? "true" : "false" },
        click: function () {
          if (on) return;
          app.update(function (s) {
            s.circuit.piezoMode = m.id;
            C.setMode(m.id);
          });
          UI.toast(m.label + " 으로 바꾸었습니다. 단자 이름표가 바뀝니다.");
        }
      });
    }));

    return UI.card(
      {
        eyebrow: "부품 고르기",
        title: "어떤 피에조를 쓰나요?",
        desc: "교실에 있는 부품과 같은 것을 고르세요. 단자에 적히는 글자가 달라집니다."
      },
      [
        row,
        el("p", { class: "para", text: here.note }),
        UI.alert("info", here.reverseNote),
        el("p", {
          class: "para",
          text:
            "어느 쪽이든 규칙은 같습니다 — 신호 단자(" + here.sigLabel + ")는 " +
            C.SPEAKER_PIN_NAME + " 으로, 접지 단자(" + here.gndLabel + ")는 GND 로 갑니다."
        })
      ]
    );
  }

  function renderCircuit(state, app) {
    var box = el("div");
    var circuit = state.circuit;

    /* 판정 쪽에도 지금 종류를 알려 둔다 — 화면을 다시 그릴 때마다 맞춘다 */
    C.setMode(circuit.piezoMode);

    box.appendChild(piezoModePicker(state, app));

    /* ================================================================ */
    /* 3-A 부품과 단자 찾기 (명세 17.3 A)                                 */
    /* ================================================================ */

    if (!circuit.findDone) {
      var task = C.FIND_TASKS[circuit.findIndex] || C.FIND_TASKS[0];
      var findFeedback = el("div", { class: "feedback" });

      var findBoard = S.board.create({
        mode: "find",
        showBoard: true,
        showBread: false,
        showParts: true,
        getState: function () {
          return state.circuit;
        },
        onPick: function (component, pin) {
          var here = C.FIND_TASKS[state.circuit.findIndex];
          var result = C.checkFind(state.circuit.findIndex, component, pin, state.circuit.findPicks);
          UI.clear(findFeedback);
          if (result.ok) {
            app.update(function (s) {
              /* 어느 단자를 눌렀는지 기억한다 — 저항의 «반대쪽 끝» 을 가려내는 데 쓴다 */
              if (here) s.circuit.findPicks[here.id] = component + "/" + pin;
              s.circuit.findIndex += 1;
              if (result.done) s.circuit.findDone = true;
            });
            UI.toast(result.message);
            return;
          }
          app.patch(function (s) {
            s.circuit.findAttempts += 1;
          });
          findFeedback.appendChild(UI.alert("warn", result.message));
        }
      });

      box.appendChild(
        UI.card(
          {
            eyebrow: "3단계 · A 부품과 단자 찾기",
            title: "먼저 부품에서 단자를 찾습니다.",
            desc: "네 곳을 차례로 찾으면 케이블 연결로 넘어갑니다."
          },
          [
            taskStrip(
              C.FIND_TASKS.map(function (t, i) {
                var name =
                  t.id === "f-d8"
                    ? C.SPEAKER_PIN_NAME
                    : t.id === "f-gnd"
                    ? "GND"
                    : t.id === "f-piezo-sig"
                    ? "피에조 " + C.pinMark("SIG")
                    : "피에조 " + C.pinMark("GND");
                return { text: name, done: i < circuit.findIndex, now: i === circuit.findIndex };
              })
            ),
            UI.alert("info", task.prompt),
            el("p", {
              class: "para",
              text:
                "그림에서 그 단자를 누르세요. 화살표 키로 옮기고 Enter 로 고를 수도 있습니다. " +
                "피에조는 몸통에 찍힌 ＋ 표시를 보세요. 다리 길이는 같을 수 있어 기준이 되지 못합니다."
            }),
            findFeedback,
            findBoard.root
          ]
        )
      );
      return box;
    }

    /* ================================================================ */
    /* 3-B 케이블 연결 · 3-C 점검과 전원 인가 (명세 17.3 B·C)              */
    /* ================================================================ */

    var check = C.checkCircuit(circuit.connections);
    var dangers = C.dangers(circuit.connections);
    var powerState = C.canPowerOn(circuit.connections);
    var now = nowDoing(state, check, dangers);

    /* ---------------- 회로 그림 ---------------- */

    var boardWire = S.board.create({
      /* 전원을 켠 뒤에도 «잇는» 자리다. 케이블을 고치면 resetPower 가 전원을 내리고 다시 점검한다. */
      mode: "wire",
      showBoard: true,
      showBread: true,
      showParts: true,
      getState: function () {
        return state.circuit;
      },
      onConnect: function (conn) {
        app.update(function (s) {
          s.circuit.connections.push(conn);
          s.circuit.attempts += 1;
          resetPower(s);
          C.dangers(s.circuit.connections).forEach(function (d) {
            s.circuit.errors.push({ code: d.code, title: d.title, at: new Date().toISOString() });
          });
        });
      },
      onUndo: function () {
        app.update(function (s) {
          s.circuit.connections.pop();
          resetPower(s);
        });
      },
      onReset: function () {
        app.update(function (s) {
          s.circuit.connections = [];
          resetPower(s);
        });
      },
    });

    /* ---------------- ① 점검 항목 + 전원 (맨 위) ---------------- */

    var hintOut = el("div", { class: "hintout" });

    /**
     * 조건 한 줄에 «힌트 보기» 를 붙인다.
     * 힌트는 개념 질문 → 위치 안내 → 구체적 연결 안내 세 단계로 «올라간다»(명세 18.2).
     * 항목마다 따로 세므로, 다른 항목의 힌트를 봤다고 이 항목이 건너뛰지 않는다.
     */
    var conditionList = el("ul", { class: "condlist" });
    check.conditions.forEach(function (cond) {
      var row = cond.blocked
        ? el("li", { class: "condlist__item condlist__item--wait" }, [
            el("span", { class: "condlist__mark", attrs: { "aria-hidden": "true" }, text: "—" }),
            el("span", { class: "condlist__text", text: cond.label }),
            el("span", { class: "condlist__note", text: cond.blockedWhy })
          ])
        : UI.conditionRow(cond.label, cond.ok);

      if (!cond.ok && !cond.blocked) {
        row.appendChild(
          UI.button("힌트 보기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              var level = Math.min(Number(state.circuit.hintLevels[cond.id]) || 0, 2);
              var message = C.hintFor(cond.id, level);
              app.patch(function (s) {
                s.circuit.hintsUsed += 1;
                s.circuit.hintLevels[cond.id] = level + 1;
              });
              UI.clear(hintOut).appendChild(
                UI.alert("info", message, [
                  el("p", {
                    class: "alert__fix",
                    text:
                      level >= 2
                        ? "마지막 힌트입니다."
                        : "아직 모르겠으면 [힌트 보기] 를 한 번 더 누르세요."
                  })
                ])
              );
            }
          })
        );
      }
      conditionList.appendChild(row);
    });

    var powerRow = el("div", { class: "btnrow" });
    if (!circuit.powerOn) {
      powerRow.appendChild(
        UI.button("전원 켜기", {
          disabled: !powerState.ok,
          title: powerState.ok ? "" : "점검 항목을 모두 채워야 전원을 켤 수 있습니다.",
          click: function () {
            app.update(function (s) {
              s.circuit.checkPassed = true;
              s.circuit.powerOn = true;
              /* 회로 판정 결과를 제출 자료에 담아 둔다 */
              var a = C.analyze(s.circuit.connections);
              s.circuit.path = {
                direction: a.direction,
                sigFromSource: a.sigFromSource,
                gndToGround: a.gndToGround,
                onPower: a.onPower,
                shortCircuit: a.shortCircuit
              };
            });
            UI.toast("전원을 켰습니다. 아직 코드가 없으므로 피에조는 조용합니다.");
          }
        })
      );
      powerRow.appendChild(
        UI.button("회로 점검", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.checked = true;
            });
            var left = C.checkCircuit(state.circuit.connections).missing;
            UI.toast(
              left.length === 0
                ? "모든 항목을 채웠습니다. [전원 켜기] 를 누르세요."
                : "아직 " + left.length + "가지가 남았습니다. 위 목록을 보세요."
            );
          }
        })
      );
      if (!powerState.ok) {
        powerRow.appendChild(
          el("p", {
            class: "btnrow__note",
            text:
              powerState.reason === "danger"
                ? "위험한 연결이 있어 전원을 넣을 수 없습니다."
                : "위 항목을 모두 채우면 켤 수 있습니다."
          })
        );
      }
    } else {
      powerRow.appendChild(
        UI.button("전원 끄기", {
          class: "btn btn--ghost",
          click: function () {
            app.update(function (s) {
              s.circuit.powerOn = false;
            });
          }
        })
      );
      powerRow.appendChild(
        el("p", {
          class: "btnrow__note",
          text:
            "전원이 켜졌습니다. " + C.SPEAKER_PIN_NAME + " 은 아직 조용합니다 — " +
            "무엇을 내보낼지 정하는 코드가 없기 때문입니다. 4단계에서 tone() 을 적으면 울립니다."
        })
      );
    }

    /* ------------------------------------------------------------------ */
    /* «지금 이어진 것» 한 줄 — 늘 보인다                                    */
    /*                                                                    */
    /* 앱이 이 회로를 무엇으로 «보고 있는지» 를 그대로 되비춘다.               */
    /* 판정이 왜 그렇게 나왔는지 학생도 선생님도 바로 확인할 수 있다.          */
    /* 정답을 알려 주는 것이 아니므로 늘 내보여도 된다.                       */
    /* ------------------------------------------------------------------ */
    var nowLine = el("div", { class: "nowpath" }, [
      el("span", { class: "nowpath__tag", text: "지금 이어진 것" }),
      el("span", { class: "nowpath__text", text: C.describeCurrent(circuit.connections) })
    ]);

    /* ------------------------------------------------------------------ */
    /* «이렇게 이으면 됩니다» — 접어 둔다                                    */
    /*                                                                    */
    /* ★ 펼쳐야만 보인다(명세 18.2 «정답선을 자동으로 그려 주지 않는다»).      */
    /*   막힌 학생과, 앱이 무엇을 바라는지 확인하려는 선생님을 위한 자리다.     */
    /* ------------------------------------------------------------------ */
    var goal = C.goalStatus(circuit.connections);
    var goalBox = UI.foldout("이렇게 이으면 됩니다 — 막히면 펼쳐 보세요", function () {
      var list = el("ol", { class: "goallist" }, goal.lines.map(function (line) {
        return el("li", { class: "goallist__item" + (line.ok ? " is-done" : "") }, [
          el("span", {
            class: "goallist__mark",
            attrs: { "aria-hidden": "true" },
            text: line.ok ? "✔" : "○"
          }),
          el("span", { class: "sr-only", text: line.ok ? "이어짐 : " : "아직 : " }),
          el("span", { class: "goallist__text", text: line.label }),
          el("span", { class: "goallist__state", text: line.ok ? "이어짐" : "아직" })
        ]);
      }));

      var parts = [
        el("p", {
          class: "para",
          text:
            "케이블 두 줄이면 됩니다. 브레드보드를 거쳐 가도 되고, 같은 마디면 어느 구멍에 꽂아도 같습니다."
        }),
        list,
        UI.alert("info", WIRING_NOTE)
      ];

      if (goal.equivalent) {
        parts.push(
          UI.alert(
            "ok",
            "여러분은 위와 «다르게» 이었지만 전기적으로 같은 회로입니다. 그대로 두어도 정답입니다."
          )
        );
      }
      return el("div", {}, parts);
    });

    var checkBody = [
      nowLine,
      taskStrip([
        {
          text: C.SPEAKER_PIN_NAME + " → 피에조",
          done: !check.missing.some(function (m) {
            return m.id === "c-sig" || m.id === "c-nopower";
          }),
          now: now.at === 1
        },
        {
          text: "피에조 → GND",
          done: !check.missing.some(function (m) {
            return m.id === "c-gnd" || m.id === "c-tidy";
          }),
          now: now.at === 2
        },
        { text: "전원 켜기", done: circuit.powerOn, now: now.at === 3 }
      ]),
      UI.alert(now.at === 0 ? "danger" : now.at === 4 ? "ok" : "info", now.text),
      conditionList,
      hintOut,
      goalBox
    ];

    /* 위험 연결 — 무엇이 어떻게 되는지(effect)까지 함께 적는다.
       «오답» 이라고만 하면 역결선과 전원 직결이 같은 것으로 보인다(명세 12장). */
    dangers.forEach(function (d) {
      checkBody.push(
        UI.alert("danger", d.title + " — " + d.detail, [
          el("p", { class: "alert__fix", text: "시뮬레이션 : " + d.effect }),
          el("p", { class: "alert__fix", text: "고치는 법 : " + d.fix })
        ])
      );
    });

    /* 반쯤 꽂힌 다리와 쓸모없는 케이블을 «이름으로» 짚어 준다 */
    if (check.dangling.length > 0) {
      checkBody.push(
        UI.alert(
          "warn",
          "한쪽만 이어진 다리가 있습니다 : " +
            check.dangling
              .map(function (d) {
                return d.label;
              })
              .join(", ")
        )
      );
    }
    if (check.stray.length > 0) {
      checkBody.push(
        UI.alert("warn", "이 회로에 쓰이지 않는 케이블이 " + check.stray.length + "개 있습니다. 지워 주세요.")
      );
    }

    checkBody.push(powerRow);

    box.appendChild(
      UI.card(
        {
          eyebrow: "3단계 · B 케이블 연결 · C 점검",
          title: "회로 점검",
          desc:
            C.SPEAKER_PIN_NAME + " → 피에조 신호 단자, 피에조 접지 단자 → GND 로 잇습니다. " +
            "저항은 넣지 않습니다."
        },
        checkBody
      )
    );

    /* ---------------- ② 회로 그림 + 케이블 목록 ---------------- */

    var wireList = el("ul", { class: "wirelist" });
    if (circuit.connections.length === 0) {
      wireList.appendChild(el("li", { class: "wirelist__empty", text: "아직 이은 케이블이 없습니다." }));
    }
    /* 색은 «회로의 어느 쪽인가» 로 정해진다. 목록도 같은 값을 써야 그림과 어긋나지 않는다. */
    var wireSides = C.wireSides(circuit.connections);
    circuit.connections.forEach(function (conn, index) {
      var side = wireSides[index] || "";
      var colorName = S.board.SIDE_COLOR[side] || "gray";
      wireList.appendChild(
        el("li", { class: "wirelist__item" }, [
          el("span", { class: "wirelist__dot wirelist__dot--" + colorName, attrs: { "aria-hidden": "true" } }),
          /* ★ 색만으로 알리지 않는다 — «D8 쪽 / GND 쪽» 을 글자로도 적는다(명세 6.1) */
          el("span", { class: "wirelist__side wirelist__side--" + (side || "none"), text: S.board.SIDE_WORD[side] }),
          el("span", {
            class: "wirelist__text",
            text:
              (S.board.COLOR_WORD[colorName] || "") +
              " · " +
              C.describe(conn.fromComponent, conn.fromPin) +
              " → " +
              C.describe(conn.toComponent, conn.toPin)
          }),
          UI.button("지우기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              app.update(function (s) {
                s.circuit.connections.splice(index, 1);
                resetPower(s);
              });
            }
          })
        ])
      );
    });

    var boardCard = UI.card(
      {
        title: "회로 그림",
        desc: circuit.powerOn
          ? "전원이 켜져 있습니다. 케이블을 고치면 전원이 꺼지고 점검을 다시 합니다."
          : "단자를 하나 누르고, 이을 곳을 하나 더 누르면 케이블이 생깁니다. 아래쪽에 피에조가 있습니다."
      },
      [boardWire.root, wireLegend(), wireList]
    );
    box.appendChild(boardCard);

    /**
     * ★ 멀티미터는 이 차시에 두지 않는다 (선생님 요청, 2026-08-19).
     *
     *   소리는 전압이 «오르내리는» 것이라 멀티미터로는 보이지 않는다.
     *   재어 보아야 0V 만 나오므로, 학생에게는 «고장난 것» 처럼 보인다.
     *   이 차시의 관찰 도구는 4단계의 오실로스코프다(명세 6.3).
     */

    return box;
  }

  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
