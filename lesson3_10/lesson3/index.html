    <script data-from="student/s50-editor.js">
/**
 * 코딩 화면 부품 (명세 8장)
 *
 *   · 줄 번호와 들여쓰기 안내
 *   · 구문 색상 (글자를 DOM 으로 하나씩 넣는다 — innerHTML 을 쓰지 않는다)
 *   · 실행 중인 줄 강조와 «가상 시리얼 모니터»
 *   · 코드 조립 / 빈칸 채우기 / 전체 편집 세 가지 방식
 *
 * 실행은 shared/arduino.js 가 만든 «발자취(trace)» 를 되짚어 보여 줄 뿐이다.
 * 브라우저가 학생 코드를 진짜로 실행하는 일은 없다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var A = PC.arduino;

  /* ------------------------------------------------------------------ */
  /* 1. 구문 색상                                                         */
  /* ------------------------------------------------------------------ */

  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "return"];
  var BUILTINS = ["Serial", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "setup", "loop"];
  var CONSTS = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "true", "false"];

  /**
   * 한 줄을 «색을 입힐 조각» 으로 나눈다.
   * 돌려주는 것 : [{ text, cls }]
   */
  function colorize(line) {
    var out = [];
    var text = String(line === null || line === undefined ? "" : line);
    var i = 0;

    function push(value, cls) {
      if (value) out.push({ text: value, cls: cls || "" });
    }

    while (i < text.length) {
      var rest = text.slice(i);

      /* 주석은 줄 끝까지 */
      var comment = rest.match(/^\/\/.*/);
      if (comment) {
        push(comment[0], "tok-comment");
        break;
      }

      /* 문자열 */
      var str = rest.match(/^"(?:[^"\\]|\\.)*"?/);
      if (str) {
        push(str[0], "tok-string");
        i += str[0].length;
        continue;
      }

      /* 숫자 */
      var num = rest.match(/^\d+(?:\.\d+)?/);
      if (num) {
        push(num[0], "tok-number");
        i += num[0].length;
        continue;
      }

      /* 이름 */
      var name = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/);
      if (name) {
        var word = name[0];
        var cls = "";
        if (KEYWORDS.indexOf(word) !== -1) cls = "tok-keyword";
        else if (CONSTS.indexOf(word) !== -1) cls = "tok-const";
        else if (BUILTINS.indexOf(word) !== -1) cls = "tok-builtin";
        push(word, cls);
        i += word.length;
        continue;
      }

      /* 괄호와 기호 */
      var punct = rest.match(/^[{}();,.]/);
      if (punct) {
        push(punct[0], "tok-punct");
        i += 1;
        continue;
      }

      push(text.charAt(i), "");
      i += 1;
    }

    return out;
  }

  /** 색을 입힌 한 줄을 DOM 으로 (학생이 쓴 글은 언제나 textContent 로 들어간다) */
  function lineNode(line) {
    var span = UI.el("span", { class: "codeline__text" });
    colorize(line).forEach(function (part) {
      span.appendChild(UI.el("span", { class: part.cls, text: part.text }));
    });
    return span;
  }

  /**
   * 색을 입힌 «읽기용» 코드 상자.
   * highlightLine 으로 실행 중인 줄을 표시할 수 있다(명세 8장).
   */
  function codeView(source, opts) {
    var o = opts || {};
    var lines = String(source || "").split("\n");
    var rows = [];

    var list = UI.el("div", { class: "codeview__lines" });
    lines.forEach(function (line, i) {
      var no = UI.el("span", { class: "codeline__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) });
      var row = UI.el("div", { class: "codeline", attrs: { "data-line": String(i + 1) } }, [no, lineNode(line)]);
      rows.push(row);
      list.appendChild(row);
    });

    var box = UI.el("figure", { class: "codeview" }, [
      o.caption ? UI.el("figcaption", { class: "codeview__cap", text: o.caption }) : null,
      list
    ]);

    return {
      root: box,
      /** 실행 중인 줄을 표시한다. 0 이면 모두 지운다. */
      highlight: function (lineNo) {
        rows.forEach(function (row, i) {
          var on = i + 1 === lineNo;
          row.classList.toggle("codeline--active", on);
          /* 색만으로 알리지 않는다 — 화살표 글자를 함께 붙인다(명세 13장) */
          var mark = row.querySelector(".codeline__run");
          if (on && !mark) {
            row.insertBefore(
              UI.el("span", { class: "codeline__run", attrs: { "aria-hidden": "true" }, text: "▶" }),
              row.firstChild
            );
          } else if (!on && mark) {
            row.removeChild(mark);
          }
        });
      },
      /** 문제가 있는 줄에 표시 */
      markError: function (lineNo, message) {
        rows.forEach(function (row, i) {
          row.classList.toggle("codeline--error", i + 1 === lineNo);
        });
        if (lineNo > 0 && rows[lineNo - 1] && message) {
          rows[lineNo - 1].setAttribute("title", message);
        }
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 2. 편집기 (③ 전체 편집)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 줄 번호가 붙은 편집기.
   * 돌려주는 것 : { root, textarea, getValue, setValue }
   */
  function editor(value, onChange) {
    var id = UI.nextId("code");
    var gutter = UI.el("div", { class: "editor__gutter", attrs: { "aria-hidden": "true" } });

    var area = UI.el("textarea", {
      class: "editor__area",
      id: id,
      attrs: {
        rows: 12,
        spellcheck: "false",
        autocapitalize: "off",
        autocomplete: "off",
        wrap: "off",
        "aria-describedby": id + "-help",
        maxlength: (PC.LIMITS && PC.LIMITS.codeMax) || 4000
      }
    });
    area.value = value || "";

    function refreshGutter() {
      var count = area.value.split("\n").length;
      UI.clear(gutter);
      for (var i = 1; i <= count; i += 1) {
        gutter.appendChild(UI.el("span", { class: "editor__no", text: String(i) }));
      }
    }

    area.addEventListener("input", function () {
      refreshGutter();
      if (onChange) onChange(area.value);
    });
    area.addEventListener("scroll", function () {
      gutter.scrollTop = area.scrollTop;
    });

    /* Tab 은 «두 칸 들여쓰기» 로. 브라우저 기본대로면 초점이 달아나 코딩을 할 수 없다.
       (Esc 를 누른 뒤 Tab 을 누르면 초점이 넘어가도록 남겨 둔다 — 키보드 사용자를 가두지 않는다) */
    var escaped = false;
    area.addEventListener("keydown", function (evt) {
      if (evt.key === "Escape") {
        escaped = true;
        return;
      }
      if (evt.key !== "Tab" || escaped) {
        escaped = false;
        return;
      }
      evt.preventDefault();
      var start = area.selectionStart;
      var end = area.selectionEnd;
      area.value = area.value.slice(0, start) + "  " + area.value.slice(end);
      area.selectionStart = area.selectionEnd = start + 2;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    /* 여는 중괄호 뒤에서 줄을 바꾸면 한 칸 더 들여쓴다 — 들여쓰기 «안내»(명세 8장) */
    area.addEventListener("keydown", function (evt) {
      if (evt.key !== "Enter") return;
      var start = area.selectionStart;
      var before = area.value.slice(0, start);
      var currentLine = before.slice(before.lastIndexOf("\n") + 1);
      var indent = (currentLine.match(/^\s*/) || [""])[0];
      if (/\{\s*$/.test(currentLine)) indent += "  ";
      if (!indent) return;

      evt.preventDefault();
      var after = area.value.slice(area.selectionEnd);
      area.value = before + "\n" + indent + after;
      area.selectionStart = area.selectionEnd = start + 1 + indent.length;
      refreshGutter();
      if (onChange) onChange(area.value);
    });

    refreshGutter();

    var rootNode = UI.el("div", { class: "editor" }, [
      UI.el("label", { class: "sr-only", attrs: { for: id }, text: "아두이노 코드" }),
      UI.el("div", { class: "editor__body" }, [gutter, area]),
      UI.el("p", {
        class: "editor__help",
        id: id + "-help",
        text: "Tab 을 누르면 두 칸 들여쓰기가 됩니다. 다음 칸으로 넘어가려면 Esc 를 누른 뒤 Tab 을 누르세요."
      })
    ]);

    return {
      root: rootNode,
      textarea: area,
      getValue: function () {
        return area.value;
      },
      setValue: function (next) {
        area.value = next || "";
        refreshGutter();
        if (onChange) onChange(area.value);
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 3. 조립 모드 (① 코드 조립)                                           */
  /* ------------------------------------------------------------------ */

  /**
   * 흩어진 줄을 «위·아래» 로 옮겨 바른 차례로 만든다.
   * 끌어 놓기(drag) 대신 단추를 쓴다 — 키보드와 터치에서 모두 확실하게 동작한다(명세 13장).
   */
  function assembler(order, onChange) {
    var lines = A.ASSEMBLE_LINES;
    var byId = {};
    lines.forEach(function (l) {
      byId[l.id] = l;
    });

    /**
     * 섞인 차례를 만든다.
     *
     * 무작위가 아니라 «정해진 규칙» 으로 섞는다 — 어느 기기에서나 같은 화면이 나와야
     * 수업 중 설명이 어긋나지 않는다.
     *
     * ★ 목록을 손으로 적어 두지 «않는다».
     *   앞 차시의 8줄짜리 목록이 남아 있어 이 차시의 10줄 가운데 두 줄
     *   (두 번째 delay 와 «닫는 중괄호»)이 화면에 아예 나오지 않은 적이 있다.
     *   줄을 늘리거나 줄여도 저절로 따라오도록 줄 목록에서 «만들어» 낸다.
     */
    function scrambled() {
      var ids = lines.map(function (l) {
        return l.id;
      });
      var mid = Math.ceil(ids.length / 2);
      var front = ids.slice(0, mid);
      var back = ids.slice(mid);
      var out = [];
      for (var i = 0; i < mid; i += 1) {
        if (back[i] !== undefined) out.push(back[i]);
        out.push(front[i]);
      }
      return out;
    }

    /* 저장된 차례가 길이까지 맞을 때만 쓴다. 아니면 새로 섞는다. */
    var current = (order && order.length === lines.length ? order : scrambled()).slice();

    var listHost = UI.el("ol", { class: "assemble" });

    /** 지금 차례를 코드 글로 — 들여쓰기는 정답 줄에 적힌 대로 넣어 준다 */
    function sourceOf() {
      return current
        .map(function (id) {
          var line = byId[id];
          return "  ".repeat(line.indent) + line.text;
        })
        .join("\n");
    }

    function tell() {
      if (onChange) onChange(current.slice(), sourceOf());
    }

    /* ------------------------------------------------------------------ */
    /* 차례 바꾸기 — ▲▼ 단추 (키보드·낭독기가 쓰는 길)                       */
    /* ------------------------------------------------------------------ */

    function move(index, delta) {
      var next = index + delta;
      if (next < 0 || next >= current.length) return;
      var tmp = current[index];
      current[index] = current[next];
      current[next] = tmp;
      draw();
      tell();
      UI.announce((index + 1) + "번째 줄을 " + (next + 1) + "번째로 옮겼습니다.");
      var moved = listHost.querySelectorAll(".assemble__item")[next];
      var btn = moved ? moved.querySelector(delta < 0 ? ".js-up" : ".js-down") : null;
      if (btn) btn.focus();
    }

    /* ------------------------------------------------------------------ */
    /* 차례 바꾸기 — 끌어 옮기기 (마우스·손가락이 쓰는 길)                    */
    /*                                                                    */
    /* ★ 포인터 이벤트 하나로 «마우스와 터치» 를 함께 받는다.                */
    /*   HTML5 draggable 은 손가락으로는 동작하지 않아 교실 태블릿에서 못 쓴다. */
    /*                                                                    */
    /* ★ 끄는 곳을 «손잡이(⠿)» 로 한정한다.                                */
    /*   줄 아무 데나 잡히게 하면 손가락으로 화면을 세로로 넘길 수 없다.      */
    /*                                                                    */
    /* ★ ▲▼ 단추를 «그대로 둔다».                                          */
    /*   끌어 옮기기는 키보드로 할 수 없다. 두 길이 모두 있어야 한다(명세 13장). */
    /* ------------------------------------------------------------------ */

    var drag = null;

    function itemsNow() {
      return Array.prototype.slice.call(listHost.querySelectorAll(".assemble__item"));
    }

    /** 지금 화면에 놓인 차례를 그대로 읽어 current 로 삼는다 */
    function readOrderFromDom() {
      current = itemsNow().map(function (el) {
        return el.getAttribute("data-id");
      });
    }

    /**
     * ★★ 끌고 있는 동안 «어디에 놓이는가» 를 보여 준다.
     *
     *   전에는 줄을 곧바로 insertBefore 로 옮겼다. 그런데 끌고 있는 줄이
     *   손가락을 따라오지 않으니, 화면이 조금씩 바뀌어도 «내가 어디로 가는지»
     *   를 알 수 없었다. 실제로 「옮겨지는 자리를 판단할 수 없다」는 말을 들었다.
     *
     *   그래서 둘로 갈랐다.
     *     ① 끌고 있는 줄  — 자리에서 떼어 내(position: fixed) 손가락을 따라간다
     *     ② 놓일 자리     — 같은 높이의 «점선 칸» 이 목록 안에서 움직이며
     *                      「3번째 자리」 처럼 몇 번째가 될지 적는다
     *
     *   놓는 순간 ①을 ②가 있던 자리에 끼워 넣는다.
     */
    function dragMove(ev) {
      if (!drag) return;
      /* 손가락으로 끌 때 화면이 함께 밀리지 않게 한다 */
      if (ev.cancelable) ev.preventDefault();

      /* ① 끌고 있는 줄은 손가락을 따라간다 */
      drag.item.style.top = ev.clientY - drag.grabY + "px";

      /* ② 놓일 자리를 옮긴다 — 가운데를 지난 줄 «앞» 으로 */
      var y = ev.clientY;
      var others = itemsNow().filter(function (el) {
        return el !== drag.item;
      });
      var before = null;
      for (var i = 0; i < others.length; i += 1) {
        var r = others[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) {
          before = others[i];
          break;
        }
      }
      if (before) listHost.insertBefore(drag.slot, before);
      else listHost.appendChild(drag.slot);

      /* 몇 번째가 되는지 칸 안에 적는다 — 이것이 «어디로 가는가» 의 답이다 */
      var flow = Array.prototype.slice.call(listHost.children).filter(function (el) {
        return el !== drag.item;
      });
      drag.slot.textContent = flow.indexOf(drag.slot) + 1 + "번째 자리";
    }

    function dragEnd() {
      if (!drag) return;
      var item = drag.item;
      var slot = drag.slot;
      var fromIndex = drag.from;

      try {
        item.releasePointerCapture(drag.pointerId);
      } catch (err) {
        /* 이미 놓인 포인터면 그냥 넘어간다 */
      }

      /* 점선 칸이 있던 «그 자리» 에 줄을 끼워 넣는다 */
      listHost.insertBefore(item, slot);
      listHost.removeChild(slot);

      item.removeAttribute("style");
      item.classList.remove("assemble__item--dragging");
      listHost.classList.remove("assemble--dragging");
      root.removeEventListener("pointermove", dragMove);
      root.removeEventListener("pointerup", dragEnd);
      root.removeEventListener("pointercancel", dragEnd);
      drag = null;

      readOrderFromDom();
      var toIndex = itemsNow().indexOf(item);
      draw();
      tell();

      if (toIndex !== fromIndex) {
        UI.announce(fromIndex + 1 + "번째 줄을 " + (toIndex + 1) + "번째로 옮겼습니다.");
      }
      /* 놓은 뒤에도 그 줄에 초점을 두어, 이어서 ▲▼ 로 다듬을 수 있게 한다 */
      var landed = listHost.querySelectorAll(".assemble__item")[toIndex];
      var handle = landed ? landed.querySelector(".assemble__grip") : null;
      if (handle) handle.focus();
    }

    function dragStart(ev, item, index) {
      /* 왼쪽 단추(또는 손가락)만 받는다 */
      if (ev.button !== undefined && ev.button !== 0) return;
      if (ev.cancelable) ev.preventDefault();

      var rect = item.getBoundingClientRect();

      /* 놓일 자리 — 끌고 있는 줄과 «같은 높이» 라야 목록이 출렁이지 않는다 */
      var slot = UI.el("li", {
        class: "assemble__slot",
        attrs: { "aria-hidden": "true" },
        text: index + 1 + "번째 자리"
      });
      slot.style.height = rect.height + "px";
      listHost.insertBefore(slot, item);

      /* 끌고 있는 줄 — 자리에서 떼어 내 손가락을 따라가게 한다 */
      item.style.position = "fixed";
      item.style.left = rect.left + "px";
      item.style.top = rect.top + "px";
      item.style.width = rect.width + "px";
      item.style.margin = "0";
      item.style.zIndex = "60";

      drag = {
        item: item,
        slot: slot,
        from: index,
        pointerId: ev.pointerId,
        grabY: ev.clientY - rect.top
      };
      item.classList.add("assemble__item--dragging");
      listHost.classList.add("assemble--dragging");
      try {
        item.setPointerCapture(ev.pointerId);
      } catch (err) {
        /* 포인터 잡기를 못 해도 문서에 붙인 듣는 이로 따라간다 */
      }
      root.addEventListener("pointermove", dragMove, { passive: false });
      root.addEventListener("pointerup", dragEnd);
      root.addEventListener("pointercancel", dragEnd);
    }

    /* ------------------------------------------------------------------ */

    function draw() {
      UI.clear(listHost);
      current.forEach(function (id, index) {
        var line = byId[id];

        /* 손잡이 — 끌어 옮기는 자리. 낭독기에는 «무엇을 옮기는지» 를 알린다. */
        var grip = UI.el("span", {
          class: "assemble__grip",
          text: "⠿",
          attrs: {
            role: "button",
            tabindex: "-1",
            "aria-label": line.text + " — 끌어서 차례 옮기기",
            title: "끌어서 옮기기"
          }
        });

        var item = UI.el("li", { class: "assemble__item", attrs: { "data-id": id } }, [
          grip,
          UI.el("span", { class: "assemble__no", attrs: { "aria-hidden": "true" }, text: String(index + 1) }),
          UI.el("code", { class: "assemble__code" }, [lineNode("  ".repeat(line.indent) + line.text)]),
          UI.el("div", { class: "assemble__btns" }, [
            UI.button("▲", {
              class: "btn btn--ghost btn--icon js-up",
              disabled: index === 0,
              title: "위로",
              click: function () {
                move(index, -1);
              }
            }),
            UI.button("▼", {
              class: "btn btn--ghost btn--icon js-down",
              disabled: index === current.length - 1,
              title: "아래로",
              click: function () {
                move(index, 1);
              }
            })
          ])
        ]);

        grip.addEventListener("pointerdown", function (ev) {
          dragStart(ev, item, index);
        });

        item.setAttribute("aria-label", index + 1 + "번째 줄: " + line.text);
        listHost.appendChild(item);
      });
    }

    draw();

    return {
      root: UI.el("div", { class: "assemble__wrap" }, [
        UI.el("p", {
          class: "assemble__help",
          text: "⠿ 를 끌어 옮기거나, ▲ ▼ 단추로 줄의 차례를 바로잡으세요."
        }),
        listHost
      ]),
      getOrder: function () {
        return current.slice();
      },
      getSource: sourceOf,
      isSolved: function () {
        return current.every(function (id, i) {
          return byId[id].order === i + 1;
        });
      }
    };
  }


  /* ------------------------------------------------------------------ */
  /* 4. 빈칸 모드 (② 빈칸 채우기)                                          */
  /* ------------------------------------------------------------------ */

  /**
   * 빈칸 채우기 판.
   *
   * ★ template 을 받는다 — 4단계는 A.BLANK_TEMPLATE, 5단계 확장 활동은
   *   L.extensionTemplate(고른 알림음) 을 준다. 안 주면 4단계 판을 쓴다(옛 부름 그대로).
   *
   * ★ line.step 이 있으면 «몇 번째 차례의 빈칸인가» 를 딱지로 붙인다.
   *   차례 목록과 빈칸이 떨어져 있어도 어느 줄을 말하는지 알 수 있다.
   */
  function blanks(values, onChange, template) {
    var tpl = template || A.BLANK_TEMPLATE;
    var current = {};
    Object.keys(values || {}).forEach(function (k) {
      current[k] = values[k];
    });

    var host = UI.el("div", { class: "blanks" });

    tpl.lines.forEach(function (line) {
      if (line.blank) {
        var id = UI.nextId("blank");
        var input = UI.el("input", {
          class: "input input--mono blanks__input",
          id: id,
          attrs: {
            type: "text",
            /* ★ 힌트는 «위» 에 따로 적는다 — placeholder 는 줄바꿈이 안 되어
               좁은 화면에서 뒷글자가 잘린다. 여기에는 짧은 안내만 둔다. */
            placeholder: "여기에 코드를 적으세요",
            spellcheck: "false",
            autocapitalize: "off"
          }
        });
        input.value = current[line.blank] || "";
        input.addEventListener("input", function () {
          current[line.blank] = input.value;
          if (onChange) onChange(sourceOf(), current);
        });

        /**
         * ★ 힌트를 «보이는 이름표» 로 둔다.
         *
         *   placeholder 로 두었더니 「speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄」
         *   의 뒷글자가 잘렸다. placeholder 는 한 줄로만 그려져 줄바꿈이 안 되기 때문이다.
         *   글씨를 줄이면 넓은 화면에서는 들어가지만 좁은 화면에서는 여전히 잘린다.
         *   이름표로 올리면 «어느 폭에서든» 줄이 접히며 다 보인다.
         */
        var row = UI.el("div", { class: "blanks__row" }, [

        ])
      );
    });

    function sourceOf() {
      return tpl.lines
        .map(function (line) {
          if (!line.blank) return line.text;

  /* ------------------------------------------------------------------ */
  /* 5. 가상 시리얼 모니터와 실행 재생                                      */
  /* ------------------------------------------------------------------ */

  /** 「0.000초」 처럼 */
  function seconds(ms) {
    return (ms / 1000).toFixed(3) + "초";
  }

  /**
   * 실행 결과를 «시간 순서대로» 보여 준다.
   *   view      : codeView 가 돌려준 것 (실행 중인 줄을 표시할 대상)
   *   onFinish  : 재생이 끝났을 때
   */
  function player(view, opts) {
    var o = opts || {};
    var monitor = UI.el("div", {
      class: "monitor__out",
      attrs: { role: "log", "aria-live": "polite", "aria-label": "시리얼 모니터 출력" }
    });
    var clock = UI.el("span", { class: "monitor__clock", text: "0.000초" });

    var trace = [];
    var index = 0;
    var timer = null;
    var speed = 1;

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }

    function reset() {
      stop();
      index = 0;
      UI.clear(monitor);
      clock.textContent = "0.000초";
      view.highlight(0);
    }

    function appendOutput(entry) {
      var row = UI.el("p", { class: "monitor__line" }, [
        UI.el("span", { class: "monitor__t", text: seconds(entry.t) }),
        UI.el("span", { class: "monitor__text", text: entry.text }),
        UI.el("span", {
          class: "monitor__where",
          text: entry.phase === "setup" ? "setup()" : "loop() " + entry.iteration + "회"
        })
      ]);
      monitor.appendChild(row);
      monitor.scrollTop = monitor.scrollHeight;
    }

    /** 다음 한 칸을 보여 준다 */
    function stepOnce() {
      if (index >= trace.length) {
        view.highlight(0);
        if (o.onFinish) o.onFinish();
        return false;
      }
      var entry = trace[index];
      index += 1;

      if (entry.line) view.highlight(entry.line);
      clock.textContent = seconds(entry.t);
      /* 한 칸 나아갈 때마다 바깥에 알린다 — 파형·소리·«누적 시간» 을 함께 움직이려는 것이다 */
      if (o.onStep) o.onStep(entry);
      if (entry.kind === "print") appendOutput(entry);
      if (entry.kind === "phase-end" || entry.kind === "warn") {
        monitor.appendChild(UI.el("p", { class: "monitor__note", text: entry.text }));
      }
      return true;
    }

    /**
     * ★ delay 줄에서는 «그 시간만큼 실제로» 기다린 뒤 다음 줄로 넘어간다.
     *
     *   delay(400) 이면 0.4초를 기다린다. 그래야 음과 음 사이가 실제 보드처럼 갈라지고,
     *   학생이 «delay 는 다음 명령을 미루는 것» 임을 몸으로 안다.
     *
     *     1배속   delay 값 그대로 (delay(400) → 0.4초)
     *     0.5배속 두 배 천천히 — 음이 갈라지는 사이를 자세히 볼 때
     *     즉시    기다리지 않고 끝난 모습만
     *
     *   시간이 흐르지 않는 줄(pinMode·digitalWrite 같은 것)은 STEP_MS 만 쉰다.
     *   그래야 «실행 중인 줄» 이 움직이는 것이 보이면서도 군더더기가 쌓이지 않는다.
     */
    var STEP_MS = 120;

    /* delay 가 아주 길어도 화면이 멈춘 것처럼 보이지 않게 한 줄에서 기다리는 시간을 막아 둔다 */
    var MAX_WAIT = 5000;

    /**
     * 한 «줄» 을 통째로 지나가고, 그 줄이 «흘려보낸 가상 시간» 을 돌려준다.
     *
     * ★ 발자취 한 칸이 곧 한 줄은 아니다.
     *   digitalWrite 한 줄은 «명령 지나감» 과 «핀 값 바뀜» 두 칸을 남기고,
     *   void loop() { 은 한 칸만 남긴다. 칸 단위로 쉬면 줄마다 머무는 시간이 들쭉날쭉해진다.
     *
     *   delay 줄은 «명령 지나감(t=0)» 과 «delay(t=1000)» 두 칸이라
     *   두 칸의 t 차이가 곧 기다려야 할 시간이다.
     *
     *   돌려주는 것 : 흘려보낸 가상 시간(ms). 더 갈 곳이 없으면 null.
     */
    function stepLine() {
      var first = trace[index];
      if (!first) {
        stepOnce();
        return null;
      }

      var line = first.line;
      var startT = first.t;
      if (!stepOnce()) return null;

      while (index < trace.length) {
        var next = trace[index];
        if (next.line !== 0 && next.line !== line) break;
        if (!stepOnce()) return null;
      }

      var last = trace[index - 1];
      return last ? Math.max(0, last.t - startT) : 0;
    }

    function play() {
      stop();
      if (speed === 0) {
        /* «즉시» — 끝까지 한 번에 */
        while (stepOnce()) {
          /* 되풀이 */
        }
        return;
      }
      function tickOnce() {
        var gap = stepLine();
        if (gap === null) return;
        /* 시간이 흐른 줄은 그만큼, 아닌 줄은 STEP_MS 만 */
        var wait = gap > 0 ? Math.min(MAX_WAIT, gap / speed) : STEP_MS / speed;
        timer = setTimeout(tickOnce, Math.max(16, wait));
      }
      tickOnce();
    }

    return {
      monitor: monitor,
      clock: clock,
      setTrace: function (next) {
        trace = next || [];
        reset();
      },
      setSpeed: function (next) {
        speed = next;
      },
      getSpeed: function () {
        return speed;
      },
      play: play,
      stop: stop,
      reset: reset
    };
  }

  S.editor = {
    colorize: colorize,
    lineNode: lineNode,
    codeView: codeView,
    editor: editor,
    assembler: assembler,
    blanks: blanks,
    player: player,
    seconds: seconds
  };
})();

            var opened = state.concept.opened[c.id] === true;

            /* 글이 없는 카드(그림·함수 상자만 있는 것)도 있으므로 빈 배열을 받아 준다 */
            var body = (c.body || []).map(function (line) {
              return el("p", { class: "para", text: line });
            });

            /* 그림은 자체 SVG 다 (명세 13장 — 저작권이 불명확한 사진을 쓰지 않는다) */
            body.push(S.figures ? S.figures.forCard(c.id) : null);

            /* 함수 카드 (명세 17.2 ⑥) — 4단계와 «같은 것» 을 쓴다 */
            if (c.functions) {
              body.push(functionCards());
            }

            if (c.keyPoints) {
              body.push(
                el("ul", { class: "keypoints" }, c.keyPoints.map(function (k) {
                  return el("li", { class: "keypoints__item", text: k });
                }))
              );
            }

            var details = el("details", { class: "explore__item", attrs: { "data-card": c.id } }, [
              el("summary", { class: "explore__sum" }, [
                el("span", { class: "explore__mark", attrs: { "aria-hidden": "true" }, text: opened ? "✔" : "＋" }),
                el("span", { class: "explore__title", text: c.title }),
                el("span", { class: "explore__lead", text: c.lead })
              ]),
              el("div", { class: "explore__body" }, body)
            ]);

            if (opened) details.open = true;
            details.addEventListener("toggle", function () {
              if (!details.open || state.concept.opened[c.id]) return;
              app.patch(function (s) {
                s.concept.opened[c.id] = true;
              });
            });
            return details;
          })
        )
      ])
    );

    /* 주파수를 «직접» 바꾸어 보는 자리 (명세 6.3) — 카드를 읽은 바로 뒤에 둔다 */
    box.appendChild(freqLab());

    /* setup / loop 흐름 그림 */
    box.appendChild(
      UI.card({ title: "setup() 은 한 번, loop() 는 계속" }, [
        el("div", { class: "flow" }, L.SKETCH_FLOW.map(function (step, i) {
          return el("div", { class: "flow__step flow__step--" + step.phase }, [
            el("span", { class: "flow__no", attrs: { "aria-hidden": "true" }, text: String(i + 1) }),
            el("p", { class: "flow__label", text: step.label }),
            el("p", { class: "flow__note", text: step.note }),
            step.phase === "loop" ? el("span", { class: "flow__repeat", text: "↻ 되풀이" }) : null
          ]);
        })),
        ED
          ? ED.codeView(A.REFERENCE_CODE, { caption: "오늘 만들 기준 프로그램 — 4단계에서 한 줄씩 읽습니다" }).root
          : UI.codeBlock(A.REFERENCE_CODE, "오늘 만들 기준 프로그램")
      ])
    );

    /**
     * 같은 일을 하는 두 가지 프로그램.
     *
     * ★ 하나만 보여 주면 학생은 «반드시 그렇게 써야 하는 줄» 안다.
     *   둘을 나란히 놓아야 무엇이 규칙이고 무엇이 골라 쓰는 것인지 갈린다.
     */
    var W2 = L.TWO_WAYS;
    box.appendChild(
      UI.card({ eyebrow: "골라 쓰는 것", title: W2.title, desc: W2.intro }, [
        el(
          "div",
          { class: "twoways" },
          W2.ways.map(function (way) {
            /* 좋은 점(＋)과 아쉬운 점(－) 을 한 목록에 모은다.
               색이 아니라 ＋ · － 기호와 낭독용 글이 뜻을 진다(명세 13장). */
            function point(text, kind) {
              return el("li", { class: "twoway__point twoway__point--" + kind }, [
                el("span", {
                  class: "twoway__mark",
                  attrs: { "aria-hidden": "true" },
                  text: kind === "good" ? "＋" : "－"
                }),
                el("span", { class: "sr-only", text: kind === "good" ? "좋은 점 : " : "아쉬운 점 : " }),
                el("span", { text: text })
              ]);
            }

            var points = [];
            (way.good || []).forEach(function (t) {
              points.push(point(t, "good"));
            });
            (way.bad || []).forEach(function (t) {
              points.push(point(t, "bad"));
            });

            /**
             * ★ 시간 배분 — «400ms 가 어떻게 쓰이는가».
             *   코드에는 250 과 400 만 적혀 있고 정작 배워야 할 150 은 적혀 있지 않다.
             *   그 뺄셈을 눈으로 보여 주는 자리다.
             */
            var timing = null;
            if (way.timing) {
              timing = el("div", { class: "timing" }, [
                el("p", { class: "timing__title", text: way.timing.title }),
                el(
                  "ul",
                  { class: "timing__spans" },
                  way.timing.spans.map(function (sp) {
                    return el("li", { class: "timing__span" }, [
                      el("span", { class: "timing__at", text: sp.at }),
                      el("span", { class: "timing__what", text: sp.what }),
                      sp.why ? el("span", { class: "timing__why", text: sp.why }) : null
                    ]);
                  })
                ),
                /* ① 만 뺄셈과 «두 함수의 구실» 을 갖는다. ② 은 줄을 따라 읽는다. */
                way.timing.sum ? el("p", { class: "timing__sum", text: way.timing.sum }) : null,
                way.timing.role ? el("p", { class: "timing__role", text: way.timing.role }) : null
              ]);
            }

            return el("div", { class: "twoway" }, [
              el("p", { class: "twoway__label", text: way.label }),
              el("code", { class: "twoway__lead", text: way.lead }),
              ED ? ED.codeView(way.code, {}).root : UI.codeBlock(way.code, way.label),
              timing,
              /* ★ 좋은 점·아쉬운 점이 없는 쪽도 있다 — 빈 목록을 만들지 않는다 */
              points.length ? el("ul", { class: "twoway__points" }, points) : null
            ]);
          })
        ),
        UI.alert("ok", W2.same),
        UI.alert("info", W2.choose)
      ])
    );

    /* ⑦ 개념 확인 — 오답에는 정답을 알려 주지 않고 «돌아갈 카드» 를 알려 준다(명세 17.2) */
    var checkBox = el("div");
    L.CONCEPT_CHECK.forEach(function (q) {
      var picked = state.concept.checkChoices[q.id];
      var passed = state.concept.checks[q.id] === true;
      var feedback = el("div", { class: "feedback" });

      if (picked !== undefined) {
        if (passed) {
          feedback.appendChild(UI.alert("ok", "맞았습니다."));
        } else {
          var card = null;
          L.CONCEPT_CARDS.forEach(function (c) {
            if (c.id === q.review) card = c;
          });
          feedback.appendChild(
            UI.alert("warn", "다시 골라 보세요. " + q.hint, [
              card
                ? UI.button("«" + card.title + "» 카드 다시 보기", {
                    class: "btn btn--ghost btn--small",
                    click: function () {
                      /* 정답을 알려 주지 않고 «읽을 자리» 로 데려다 준다 */
                      var node = document.querySelector('[data-card="' + card.id + '"]');
                      if (!node) return;
                      node.open = true;
                      node.scrollIntoView({ block: "center" });
                      var sum = node.querySelector("summary");
                      if (sum) sum.focus();
                    }
                  })
                : null
            ])
          );
        }
      }

      checkBox.appendChild(
        el("div", { class: "quizitem" }, [
          UI.choiceGroup(
            { name: "cc-" + q.id, choices: q.choices, legend: q.question },
            picked,
            function (index) {
              app.update(function (s) {
                s.concept.checkChoices[q.id] = index;
                s.concept.checks[q.id] = index === q.answerIndex;
              });
            }
          ),
          feedback
        ])
      );
    });

    var done = L.CONCEPT_CHECK.filter(function (q) {
      return state.concept.checks[q.id] === true;
    }).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "개념 확인",
          title: "세 문항을 모두 맞히면 다음 단계가 열립니다.",
          desc: "지금 " + done + " / " + L.CONCEPT_CHECK.length + " 문항"
        },
        [checkBox]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 3단계 — 회로 결선                                                   */
  /* ================================================================== */

  /**
   * 3단계는 «회로 구성 및 결선도» 그림 하나다 (선생님 요청 2026-11-09).
   *
   *   예전에는 3-A 단자 찾기 → 3-B 케이블 연결 → 3-C 점검과 전원 인가 였다.
   *   지금은 그림(src/assets/circuit-wiring.webp — 손대지 않은 원본)을 보고
   *   [확인했습니다] 를 누르면 4단계가 열린다. 실제 결선은 교실의 실물로 한다.
   *   그림은 tools/embed-image.mjs 가 s46-wiring-image.js 에 심는다.
   */
  function renderCircuit(state, app) {
    var done = state.circuit.findDone === true;
    return UI.card({}, [
      el("img", {
        class: "wiringimg",
        attrs: {
          src: S.wiringImage,
          alt:
            "회로 구성 및 결선도 — 아두이노 디지털 8번을 부저(+)에 빨간 전선으로, " +
            "아두이노 GND 를 부저(−)에 검은 전선으로 잇는다. 두 전선은 브레드보드의 같은 행에 연결한다. " +
            "구성 부품: 아두이노 우노, 부저(피에조), 브레드보드, 점퍼선(빨강·검정).",
          style: "display:block;width:100%;height:auto;border-radius:12px"
        }
      }),
      el("div", { attrs: { style: "margin-top:16px" } }, [
        done
          ? UI.alert("ok", "결선도를 확인했습니다. [다음 →] 으로 4단계로 넘어가세요.")
          : UI.button("결선도를 확인했습니다", {
              click: function () {
                app.update(function (s) {
                  s.circuit.findDone = true;
                });
              }
            })
      ])
    ]);
  }


  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */

  /**
   * 4단계는 «읽고 → 돌려 보고 → 만든다» 세 판으로 나뉜다.
   *
   *   A 읽기   예시 프로그램을 한 줄씩 읽는다 (함수 설명·뼈대·실행 순서)
   *   B 확인   그 예시를 그대로 실행해 setup 1회 / loop 반복을 눈으로 본다
   *   C 만들기 조립 → 빈칸 → 편집으로 직접 적는다
   *
   * ★ B 를 마치기 전에는 C 를 «보여 주지 않는다».
   *   스케치를 한 번도 본 적 없는 학생에게 곧바로 작성 화면을 내밀면
   *   무엇을 하는 것인지 알 수 없다.
   */

  /**
   * 실행 결과를 보여 주는 작은 부품 — 예시와 학생 코드가 같은 것을 쓴다.
   *
   * 이 차시에는 시리얼 출력이 없다. 대신 명세 6.3 이 요구하는 것들을 함께 보인다.
   *   현재 실행 줄 · D8 이 내보내는 주파수 · 오실로스코프 파형 · 누적 시간
   *   그리고 «지금 몇 번째 음인가(i)» 와 «실행 중인 tone() 줄»
   *
   * ★ 소리 남·안 남을 색으로만 알리지 않는다(명세 13장).
   *   ♪/○ 와 «523Hz 도» 처럼 숫자·음이름을 늘 글자로 함께 쓴다.
   *
   * ★★ 소리와 파형은 «발자취» 가 아니라 «소리 시간표» 를 따라간다.
   *   tone(…, 250) 뒤 delay(400) 이면 250ms 에 소리가 저절로 멎는데,
   *   그 순간에는 지나가는 «줄» 이 없어 발자취에 자국이 남지 않는다.
   *   발자취만 따라가면 그 150ms 의 조용함이 통째로 사라져
   *   이 차시에서 가장 중요한 «음과 음 사이» 를 못 듣게 된다.
   *   그래서 한 줄을 지날 때마다 «그 줄과 다음 줄 사이에 끼어 있는»
   *   시간표의 자국을 따로 예약해 둔다.
   */
  function makeRunner(opts) {
    var o = opts || {};
    var viewHost = el("div");
    var panelHost = el("div");
    var player = null;

    /* 상태 등 — 다시 그리지 않고 «글자만» 바꾼다 */
    var lamp = el("span", { class: "lamp", attrs: { "aria-hidden": "true" }, text: "○" });
    var lampText = el("span", { class: "lamp__text", text: "조용함" });
    /* 등을 담는 상자를 «미리» 만들어 둔다.
       상자를 화면에 붙이기 전에 setHz 를 부를 때가 있어서, 그때 parentNode 를 찾으면 없다. */
    var lampBox = el("div", { class: "lamp-box" }, [lamp, lampText]);
    var pinText = el("span", { class: "runstat__value", text: "조용함" });
    var lineText = el("span", { class: "runstat__value", text: "—" });
    var timeText = el("span", { class: "runstat__value", text: "0.000초" });
    var phaseText = el("span", { class: "runstat__value", text: "setup()" });
    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });

    /* 오실로스코프 — 실행 중에 파형이 함께 움직인다(명세 6.3) */
    var scope = S.audio.scope({ hz: 0 });

    /* 예약해 둔 «시간표 자국» 타이머 */
    var pending = [];
    var curHz = 0;

    function clearPending() {
      pending.forEach(function (id) {
        clearTimeout(id);
      });
      pending = [];
    }

    function setHz(hz) {
      var freq = Math.max(0, Math.round(Number(hz) || 0));
      curHz = freq;
      var name = freq > 0 ? A.noteNameOf(freq) : "";
      var label = freq > 0 ? freq + "Hz" + (name ? " " + name : "") : "조용함";

      lamp.textContent = freq > 0 ? "♪" : "○";
      lampText.textContent = label;
      pinText.textContent = label;
      lampBox.className = "lamp-box" + (freq > 0 ? " lamp-box--on" : "");
      scope.set(freq);

      /* 소리는 «열려 있을 때만» 난다. 열지 않았으면 조용히 넘어간다(명세 6.3). */
      if (freq > 0) S.audio.play(freq);
      else S.audio.stop();
    }

    function statRow(label, valueNode) {
      return el("div", { class: "runstat" }, [
        el("span", { class: "runstat__label", text: label }),
        valueNode
      ]);
    }

    /**
     * 몇 바퀴를 돌려 보여 줄 것인가.
     *
     * ★ delay 를 «실제 시간» 만큼 기다리므로, 바퀴 수를 고정하면
     *   한 바퀴가 긴 코드는 한참 걸리고 짧은 코드는 눈 깜짝할 사이에 끝난다.
     *   그래서 재생이 6초 안팎이 되도록 바퀴 수를 맞춘다.
     *
     * ★ 이 차시의 기준 프로그램은 loop() 가 비어 있고 setup() 에서 모두 끝난다.
     *   그때는 바퀴 수가 아무것도 바꾸지 않으므로 그냥 적은 값을 쓴다.
     */
    function loopsFor(source) {
      var probe = A.run(source, { loopLimit: 2, speakerPin: PC.SPEAKER_PIN });
      var cycleMs = probe.elapsed / 2;
      if (!cycleMs || cycleMs <= 0) return o.loopLimit || 3;
      return Math.max(2, Math.min(8, Math.round(6000 / cycleMs)));
    }

    /**
     * 실행해 보여 준다.
     *   ro.instant   : 애니메이션 없이 «끝난 모습» 을 바로 보여 준다.
     *                  화면을 다시 그릴 때마다 처음부터 재생되면 눈이 어지럽다.
     *   ro.onCycle() : 첫 음이 «울렸다 멎는 것» 을 끝까지 본 순간 한 번 부른다.
     */
    function run(source, ro) {
      ro = ro || {};
      var result = A.run(source, { loopLimit: loopsFor(source), speakerPin: PC.SPEAKER_PIN });
      var view = ED.codeView(source, { caption: "실행 중인 줄이 ▶ 로 표시됩니다." });
      UI.clear(viewHost).appendChild(view.root);

      if (!result.ok && result.error) {
        clearPending();
        setHz(0);
        UI.clear(panelHost).appendChild(
          UI.alert("warn", (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message)
        );
        return result;
      }

      var marks = (result.speaker && result.speaker.timeline) || [];

      /** 그 시각에 나가고 있는 주파수 */
      function hzAt(t) {
        var hz = 0;
        for (var i = 0; i < marks.length; i += 1) {
          if (marks[i].t <= t) hz = marks[i].hz;
          else break;
        }
        return hz;
      }

      /* 첫 음이 «멎는» 시각 — 소리가 났다가 조용해지는 첫 자리다 */
      var firstStopT = null;
      for (var mi = 0; mi < marks.length; mi += 1) {
        if (marks[mi].hz === 0 && mi > 0 && marks[mi - 1].hz > 0) {
          firstStopT = marks[mi].t;
          break;
        }
      }
      var cycleTold = false;
      var speedNow = ro.instant ? 0 : 1;

      /**
       * 화면이 지금 «어느 가상 시각» 을 보이고 있는가.
       *
       * ★★ 이 한 칸이 이 차시에서 가장 손이 많이 간 자리다.
       *
       *   재생기는 «한 줄» 을 통째로 지나간 뒤에 그 줄이 흘려보낸 시간만큼 쉰다.
       *   그래서 delay(400) 줄에서는 발자취가 먼저 t=400 까지 뛰고, 그다음에
       *   0.4초를 기다린다. 그 «기다리는 동안» 에 소리가 250ms 에서 멎어야 하는데,
       *   발자취만 보고 있으면 이미 t=400 이라 다음 음으로 건너뛰어 버린다.
       *   — 이 차시에서 가장 중요한 «음과 음 사이» 가 통째로 사라지는 것이다.
       *
       *   그래서 시각이 «뛴 만큼» 을 앞으로 기다릴 시간으로 보고,
       *   그 사이에 든 시간표의 자국을 저마다 제 시각에 예약해 둔다.
       */
      var shownT = 0;

      if (player) player.stop();
      clearPending();
      setHz(0);
      shownT = 0;

      player = ED.player(view, {
        onStep: function (entry) {
          if (entry.line) lineText.textContent = entry.line + "번 줄";
          timeText.textContent = (entry.t / 1000).toFixed(3) + "초";
          phaseText.textContent =
            entry.phase === "setup" ? "setup() — 한 번만" : "loop() " + entry.iteration + "회째";

          function tellCycle(t) {
            if (firstStopT === null || cycleTold || t < firstStopT) return;
            cycleTold = true;
            live.textContent = "첫 음이 울렸다 멎는 것을 관찰했습니다.";
            if (ro.onCycle) ro.onCycle();
          }

          if (entry.t > shownT && speedNow > 0) {
            /* 시간이 흐른 줄 — 앞으로 그만큼 기다린다. 그 사이의 자국을 예약해 둔다. */
            var from = shownT;
            marks.forEach(function (m) {
              if (m.t <= from || m.t > entry.t) return;
              var wait = (m.t - from) / speedNow;
              if (wait > 12000) return;
              pending.push(
                setTimeout(function () {
                  setHz(m.hz);
                  tellCycle(m.t);
                }, Math.max(0, wait))
              );
            });
            shownT = entry.t;
            return;
          }

          /* 시간이 흐르지 않은 줄(tone · noTone 같은 것) — 그 자리에서 바로 맞춘다 */
          shownT = Math.max(shownT, entry.t);
          setHz(hzAt(entry.t));
          tellCycle(entry.t);
        },
        onFinish: function () {
          clearPending();
          setHz(0);
        }
      });
      player.setTrace(result.trace);

      /* 소리 시간표 — 어떤 음이 얼마 동안 났는지 눈으로(명세 6.3) */
      var timeline = el("div", { class: "toneline" });
      var total = result.elapsed || 1;
      for (var i = 0; i + 1 < marks.length; i += 1) {
        var ms = marks[i + 1].t - marks[i].t;
        var width = (ms / total) * 100;
        var on = marks[i].hz > 0;
        var noteName = on ? A.noteNameOf(marks[i].hz) : "";
        timeline.appendChild(
          el("span", {
            class: "toneline__seg toneline__seg--" + (on ? "on" : "off"),
            /* el() 은 style 을 따로 받지 않는다. attrs 로 넘겨야 실제로 붙는다. */
            attrs: {
              style: "width:" + width.toFixed(2) + "%",
              title: (on ? marks[i].hz + "Hz " + noteName + " " : "조용함 ") + ms + "ms"
            },
            /* 색만으로 알리지 않는다 — 칸 안에 음이름을 글자로도 적는다(명세 13장) */
            text: width > 5 ? (on ? noteName || marks[i].hz + "Hz" : "쉼") : ""
          })
        );
      }

      function speedButton(label, factor) {
        return UI.button(label, {
          class: "btn btn--ghost btn--small",
          click: function () {
            clearPending();
            setHz(0);
            speedNow = factor;
            shownT = 0;
            player.setSpeed(factor);
            player.reset();
            cycleTold = cycleTold; /* 이미 본 것은 다시 세지 않는다 */
            player.play();
          }
        });
      }

      UI.clear(panelHost).appendChild(
        el("div", { class: "runpanel" }, [
          /* 소리를 켜는 자리 — 브라우저가 «누르기 전» 에는 내주지 않는다(명세 12장) */
          S.audio.controls({
            onUnlock: function () {
              if (curHz > 0) S.audio.play(curHz);
            }
          }),
          el("div", { class: "runpanel__head" }, [
            lampBox,
            el("div", { class: "runstats" }, [
              statRow(PC.SPEAKER_PIN_NAME + " 출력", pinText),
              statRow("실행 중인 줄", lineText),
              statRow("어느 함수", phaseText),
              statRow("누적 시간", timeText)
            ])
          ]),
          scope.root,
          marks.length > 1
            ? el("div", {}, [
                el("p", { class: "toneline__cap", text: "소리 시간표 — " + A.describeMelody(result) }),
                timeline
              ])
            : el("p", { class: "para", text: "소리가 한 번도 나지 않았습니다." }),
          el("div", { class: "btnrow" }, [
            el("span", { class: "btnrow__label", text: "재생 속도" }),
            speedButton("1배속", 1),
            /* 0.5배속 — 음이 갈라지는 «사이» 를 천천히 보고 싶을 때 */
            speedButton("0.5배속", 0.5),
            UI.button("즉시", {
              class: "btn btn--ghost btn--small",
              click: function () {
                clearPending();
                speedNow = 0;
                shownT = 0;
                player.setSpeed(0);
                player.reset();
                player.play();
                setHz(0);
              }
            }),
            UI.button("멈춤", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.stop();
                clearPending();
                setHz(0);
              }
            })
          ]),
          el("p", {
            class: "runpanel__note",
            text:
              "★ tone() 은 기다리지 않습니다. 소리를 시작해 놓고 곧바로 다음 줄로 가고, " +
              "기다리는 것은 delay 입니다. 그래서 delay 값 가운데 앞쪽은 소리가 나고 " +
              "«남은 시간» 이 음과 음 사이가 됩니다 — delay(400) 에 tone 이 250ms 면 사이는 150ms 입니다. " +
              "delay 줄에서는 그 시간만큼 «실제로» 기다립니다. 실제 보드와 같은 빠르기예요."
          }),
          live
        ])
      );

      player.setSpeed(speedNow);
      player.play();
      return result;
    }

    return { viewHost: viewHost, panelHost: panelHost, run: run, setHz: setHz, stop: function () {
      if (player) player.stop();
      clearPending();
      setHz(0);
    } };
  }

  function renderCode(state, app) {
    var box = el("div");
    var code = state.code;
    var W = L.CODE_WALKTHROUGH;

    /* ================================================================ */
    /* A. 예시 읽기 (명세 17.4 A)                                        */
    /* ================================================================ */

    box.appendChild(
      UI.card({ eyebrow: "4단계 · A 먼저 읽기", title: W.title, desc: W.intro }, [
        /* ★ 프로그램과 함수 설명을 «나란히» 둔다.
           코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않아도 된다.
           좁은 화면에서는 코드가 위, 설명이 아래로 접힌다. */
        el("div", { class: "readpair" }, [
          el("div", { class: "readpair__code" }, [
            ED.codeView(W.code, { caption: "오늘 만들 프로그램" }).root
          ]),
          el("div", { class: "readpair__fns" }, [
            el("h3", { class: "subhead", text: "이 프로그램이 쓰는 함수" }),
            functionCards()
          ])
        ]),

        /* 뼈대 — 스케치는 언제나 이 두 함수로 이루어진다 */
        el("h3", { class: "subhead", text: "스케치의 뼈대는 함수 두 개다" }),
        el("div", { class: "skel" }, W.skeleton.map(function (part) {
          return el("div", { class: "skel__item" }, [
            el("code", { class: "skel__name", text: part.name }),
            el("p", { class: "skel__when" }, [
              el("b", { text: "언제 : " }),
              el("span", { text: part.when })
            ]),
            el("p", { class: "skel__what", text: part.what })
          ]);
        })),

        /* 줄마다 무슨 뜻인가 — 줄 수는 코드와 정확히 같다(명세 17.4 A) */
        el("h3", { class: "subhead", text: "한 줄씩 읽어 보기" }),
        el("ol", { class: "walk" }, W.lines.map(function (line) {
          return el("li", { class: "walk__item" }, [
            el("span", { class: "walk__no", attrs: { "aria-hidden": "true" }, text: String(line.no) }),
            el("div", { class: "walk__body" }, [
              line.code
                ? el("code", { class: "walk__code", text: line.code })
                : el("code", { class: "walk__code walk__code--empty", text: "(빈 줄)" }),
              el("p", { class: "walk__text", text: line.text })
            ])
          ]);
        })),

        /* 실행 순서 */
        el("h3", { class: "subhead", text: "어떤 순서로 돌아가는가" }),
        el("ol", { class: "orderlist" }, W.order.map(function (line) {
          return el("li", { text: line });
        })),

        /* 글쓰기 약속 카드는 선생님 요청으로 뺐다(2026-08-19).
           세미콜론·중괄호는 아래 «코드 검사» 가 실제로 틀렸을 때 줄 번호와 함께 짚어 준다. */
      ])
    );

    /* ================================================================ */
    /* B. 돌려 보기 (명세 8장)                                           */
    /*                                                                  */
    /* ★ 첫 음이 «울렸다 멎는 것» 을 끝까지 보아야 C 가 열린다.            */
    /*   그 자리에서 tone 이 기다려 주지 않는다는 것을 눈으로 보게 된다.     */
    /* ================================================================ */

    var demo = makeRunner({ loopLimit: 4 });

    /* 한 주기를 본 순간 나타나는 자리. 화면 전체를 다시 그리면 재생이 끊기므로
       이 칸만 채운다. */
    var afterBox = el("div");

    function showAfterCycle() {
      if (afterBox.childNodes.length > 0) return;
      afterBox.appendChild(UI.alert("ok", W.afterRun));
      if (!state.code.learned) {
        afterBox.appendChild(
          el("div", { class: "btnrow" }, [
            UI.button("이해했어요 · 직접 만들어 보기", {
              class: "btn btn--primary btn--lg",
              click: function () {
                app.update(function (s) {
                  s.code.learned = true;
                });
              }
            })
          ])
        );
      }
    }

    var demoBody = [
      el("div", { class: "btnrow" }, [
        UI.button(code.exampleRun ? "다시 실행" : "예시 프로그램 실행", {
          click: function () {
            app.patch(function (s) {
              s.code.exampleRun = true;
            });
            UI.clear(afterBox);
            demo.run(W.code, { onCycle: showAfterCycle });
          }
        }),
        el("p", {
          class: "btnrow__note",
          text: "브라우저가 코드를 그대로 실행하지 않고, 허용된 문법만 읽어 흉내 냅니다."
        })
      ]),
      demo.viewHost,
      demo.panelHost,
      afterBox
    ];

    box.appendChild(
      UI.card(
        {
          eyebrow: "4단계 · B 돌려 보기",
          title: "예시 프로그램을 실행해 봅시다.",
          desc:
            "실행 중인 줄이 움직이고 파형이 함께 바뀝니다. " +
            "첫 음이 «울렸다 멎는 것» 을 끝까지 보면 아래에 만드는 칸이 열립니다."
        },
        demoBody
      )
    );

    /* 이미 한 번 돌려 본 학생에게는 «즉시» 로 다시 채워 둔다.
       다시 그릴 때마다 처음부터 재생되면 눈이 어지럽고, 결과 칸이 비어 보이지도 않는다. */
    if (code.exampleRun) demo.run(W.code, { instant: true, onCycle: showAfterCycle });

    /* ★ 읽고 돌려 보기 전에는 «작성 화면» 을 만들지 않는다(명세 17.4 C).
       흐리게 비활성으로 미리 보여 주지도 않는다 — 아예 DOM 에 만들지 않는다. */
    if (!code.learned) {
      box.appendChild(
        UI.alert(
          "info",
          "위 예시를 읽고 [예시 프로그램 실행] 으로 한 주기를 관찰하면, 아래에 직접 만드는 칸이 열립니다."
        )
      );
      return box;
    }

    /* ================================================================ */
    /* C. 직접 만들기 (명세 17.4 C)                                      */
    /* ================================================================ */

    /* 검사 결과가 들어갈 자리.
       ★ 아래 «방식별 입력» 이 만들어지자마자 refreshTests 를 부르므로
         이 그릇은 그보다 «먼저» 만들어져 있어야 한다. */
    var testPanel = el("div");

    function setSource(next) {
      app.patch(function (s) {
        s.code.source = next;
      });
      refreshTests(next);
    }

    /* ---- 방식 고르기 ---- */
    var tabs = el("div", { class: "modetabs", attrs: { role: "tablist", "aria-label": "코딩 방식" } });
    /**
     * 그 방식을 마쳤는가 — 조립·빈칸만 따진다(전체 편집은 통과 조건이 아니다).
     *
     * ★ 그려 둔 상태(code)가 아니라 «지금» 상태를 본다.
     *   검사가 다시 돌면서 마침으로 바뀔 수 있는데, 그때 화면을 통째로 다시 그리면
     *   학생이 적고 있던 칸의 초점과 커서가 날아간다. 그래서 표시만 고쳐 준다.
     */
    function modeDone(id) {
      var now = app.getState().code || {};
      if (id === "assemble") return now.assembleDone === true;
      if (id === "blank") return now.blanksDone === true;
      return null;
    }

    var modeTabs = {};

    A.CODE_MODES.forEach(function (m) {
      var active = code.mode === m.id;
      var done = modeDone(m.id);
      var tab = el("button", {
          class: "modetab" + (active ? " modetab--on" : "") + (done ? " modetab--done" : ""),
          text: m.label + (done ? " ✓" : ""),
          attrs: { type: "button", role: "tab", "aria-selected": active ? "true" : "false" },
          on: {
            click: function () {
              app.update(function (s) {
                s.code.mode = m.id;
              });
            }
          }
        });
      modeTabs[m.id] = tab;
      tabs.appendChild(tab);
    });

    var NEED_MODES = [
      { id: "assemble", label: "① 코드 조립" },
      { id: "blank", label: "② 빈칸 채우기" }
    ];
    var needList = el("ul", { class: "modedone__list" });

    /** 마침 표시를 다시 칠한다 — 화면을 통째로 다시 그리지 않고 여기만 고친다 */
    function paintModeDone() {
      UI.clear(needList);
      NEED_MODES.forEach(function (m) {
        var done = modeDone(m.id);
        needList.appendChild(
          el("li", { class: "modedone__item" + (done ? " is-done" : "") }, [
            el("span", { class: "modedone__mark", attrs: { "aria-hidden": "true" }, text: done ? "✓" : "○" }),
            el("span", { class: "modedone__name", text: m.label }),
            el("span", { class: "modedone__state", text: done ? "마침" : "아직" })
          ])
        );
        var tab = modeTabs[m.id];
        if (!tab) return;
        var label = m.id === "assemble" ? A.CODE_MODES[0].label : A.CODE_MODES[1].label;
        tab.textContent = label + (done ? " ✓" : "");
        tab.classList.toggle("modetab--done", !!done);
      });
    }
    paintModeDone();

    var modeDesc = "";
    A.CODE_MODES.forEach(function (m) {
      if (m.id === code.mode) modeDesc = m.desc;
    });

    /* ---- 방식별 입력 ---- */
    var work = el("div", { class: "codework" });

    if (code.mode === "assemble") {
      var asm = ED.assembler(code.assembleOrder, function (order, source) {
        app.patch(function (s) {
          s.code.assembleOrder = order;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(asm.root);
      if (!code.source) setSource(asm.getSource());
    } else if (code.mode === "blank") {
      var bl = ED.blanks(code.blanks, function (source, values) {
        app.patch(function (s) {
          s.code.blanks = values;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(bl.root);
      setSource(bl.getSource());
    } else {
      var starter =
        "const int speakerPin = " + PC.SPEAKER_PIN + ";\n" +
        "int notes[] = {" + (PC.NOTE_HZ || []).join(", ") + "};\n\n" +
        "void setup() {\n  \n}\n\nvoid loop() {}";
      var ed = ED.editor(code.source || starter, function (value) {
        setSource(value);
      });
      work.appendChild(ed.root);
      work.appendChild(
        el("div", { class: "btnrow" }, [
          UI.button("빈 스케치 넣기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              ed.setValue(starter);
            }
          })
        ])
      );
      if (!code.source) setSource(ed.getValue());
    }

    /**
     * ★★ 무엇이 남았는지 «늘» 보이게 한다.
     *
     *   두 방식을 모두 마쳐야 하는데, 탭만 있으면 «하나 하면 끝» 으로 보인다.
     *   [다음] 이 안 열리는 까닭을 아래에서 찾게 하지 말고 여기서 알린다.
     *   ✓ 와 «마침» 을 함께 적는다 — 색만으로 뜻을 전하지 않는다(명세 13장).
     */

    var modeNeed = el("div", { class: "modedone" }, [
      el("p", {
        class: "modedone__label",
        text: "① 코드 조립 과 ② 빈칸 채우기 를 «모두» 마쳐야 다음 단계가 열립니다."
      }),
      needList,
      el("p", {
        class: "modedone__note",
        text: "여덟 항목을 모두 통과하면 그 방식은 마친 것으로 기록됩니다. ③ 전체 편집은 해 보고 싶은 사람만 하세요."
      })
    ]);

    box.appendChild(
      UI.card({ eyebrow: "4단계 · C 직접 만들기", title: "이제 같은 프로그램을 만들어 봅시다.", desc: modeDesc }, [
        modeNeed,
        tabs,
        work
      ])
    );

    /* ---- 코드 검사 여덟 항목 (명세 17.4) ---- */

    function refreshTests(source) {
      /* 8번 항목이 «회로» 를 함께 본다. 그래서 결선 목록을 넘긴다. */
      var wired = C.diagramConnections();   /* 3단계 결선도의 회로 (2026-11-09) */
      var result = A.validate(source, { connections: wired });
      var mismatch = result.ast ? C.pinMismatch(A.pinsUsed(result.ast), wired) : [];

      /* ★ 여덟 항목을 모두 통과한 그 순간, «그 방식» 을 마친 것으로 적어 둔다.
         조립과 빈칸을 둘 다 마쳐야 다음 단계가 열린다(schema.js 의 code 갈래). */
      var allOk = result.tests.length > 0 && result.passed === result.tests.length;

      app.patch(function (s) {
        s.code.testsPassed = result.passed;
        s.code.testsTotal = result.tests.length;
        s.code.syntaxErrors = result.error ? [result.error] : [];
        s.code.pinMismatch = mismatch;
        if (allOk && code.mode === "assemble") s.code.assembleDone = true;
        if (allOk && code.mode === "blank") s.code.blanksDone = true;
      });

      UI.clear(testPanel);

      if (result.error) {
        testPanel.appendChild(UI.alert("warn", result.error.line + "번 줄 — " + result.error.message));
      }

      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        list.appendChild(UI.conditionRow(t.label, t.ok, t.ok ? "" : t.message));
      });
      testPanel.appendChild(list);

      result.warnings.forEach(function (w) {
        testPanel.appendChild(UI.alert("info", w.line + "번 줄 — " + w.message));
      });

      /* 통과 개수가 바뀌었으므로 아래쪽 [다음] 단추도 다시 판단해야 한다 */
      paintModeDone();
      app.rerenderNav();
      return result;
    }

    box.appendChild(
      UI.card(
        { title: "코드 검사", desc: "여덟 항목을 모두 통과해야 다음 단계가 열립니다." },
        [testPanel]
      )
    );

    /* ---- 내 코드 실행 ---- */
    var mine = makeRunner({ loopLimit: 4 });
    box.appendChild(
      UI.card({ title: "내 코드 실행하기", desc: "예시와 같은 결과가 나오는지 견주어 보세요." }, [
        el("div", { class: "btnrow" }, [
          UI.button("내 코드 실행", {
            click: function () {
              mine.run(state.code.source);
              app.patch(function (s) {
                s.code.ran = true;
                s.code.attempts += 1;
              });
              app.rerenderNav();
            }
          })
        ]),
        mine.viewHost,
        mine.panelHost
      ])
    );

    refreshTests(code.source);

    return box;
  }

  /* ================================================================== */
  /* 5단계 — 실행·탐구                                                   */
  /* ================================================================== */

  /**
   * ★ 가락 하나를 «들려주는» 작은 부품 (명세 7장 화면5)
   *
   *   notes  : [{ name, hz }]
   *   소리를 켜지 않았으면 파형과 글자만 움직인다 — 학습이 끊기지 않는다(명세 13장).
   *
   * 돌려주는 것 : { root } — [들어 보기] 단추 + 계명 줄 + 작은 파형
   */
  function melodyPlayer(spec) {
    var o = spec || {};
    var notes = o.notes || [];
    var toneMs = o.toneMs || PC.TONE_MS || 250;
    var stepMs = o.stepMs || PC.STEP_MS || 400;
    var playing = null;

    var scope = S.audio.scope({ hz: 0 });

    /* 계명 — 지금 울리는 음에 표시가 붙는다 */
    var chips = notes.map(function (nt, i) {
      return el("span", {
        class: "solfa__note",
        attrs: { "data-at": String(i), title: nt.hz + "Hz" },
        text: nt.name
      });
    });
    var solfa = el("div", { class: "solfa" }, chips);

    function mark(index) {
      chips.forEach(function (chip, i) {
        chip.className = "solfa__note" + (i === index ? " solfa__note--now" : "");
      });
    }

    var btn = UI.button("▶ 들어 보기", {
      class: "btn btn--ghost btn--small",
      click: function () {
        if (playing) {
          playing.stop();
          playing = null;
          btn.textContent = "▶ 들어 보기";
          mark(-1);
          scope.set(0);
          return;
        }
        /* 브라우저는 «누르기 전» 에는 소리를 내주지 않는다 — 이 자리가 바로 그 «누름» 이다 */
        S.audio.unlock();
        btn.textContent = "■ 멈춤";
        playing = S.audio.melody(notes, {
          toneMs: toneMs,
          stepMs: stepMs,
          onNote: function (index, note, hz) {
            mark(hz > 0 ? index : -1);
            scope.set(hz);
          },
          onDone: function () {
            playing = null;
            btn.textContent = "▶ 들어 보기";
            mark(-1);
            scope.set(0);
          }
        });
      }
    });

    return {
      root: el("div", { class: "melody" }, [
        solfa,
        el("div", { class: "btnrow" }, [
          btn,
          el("p", {
            class: "btnrow__note",
            text: "한 음 " + toneMs + "ms · 다음 음까지 " + stepMs + "ms (사이 " + (stepMs - toneMs) + "ms)"
          })
        ]),
        scope.root
      ])
    };
  }

  /**
   * ★ 방금 [실행] 을 누른 실험.
   *
   *   실행하면 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
   *   그런데 다시 그리면서 결과를 «즉시» 로 채우면, 학생이 보는 것은
   *   «이미 끝난 모습» 뿐이라 아무 일도 일어나지 않은 것처럼 보인다.
   *
   *   그래서 어느 실험을 방금 눌렀는지 기억해 두고, 다시 그린 뒤 그 하나만
   *   «애니메이션으로» 재생한다. 나머지는 즉시로 채운다.
   */
  var justRanExperiment = "";

  /**
   * 예시 악보의 빠르기(8분음표 한 칸의 ms).
   *
   * ★ 모듈 밖에 둔다 — 5단계를 다시 그려도 학생이 고른 빠르기가 남는다.
   *   0 이면 악보가 정한 기본값(L.SHEET.unitMs)을 쓴다.
   */
  var sheetUnitMs = 0;

  /**
   * 5단계 — 실행·탐구 (명세 17.5)
   *
   * 세 실험을 «순서대로» 한다. 실험마다
   *   ① 실행 «전» 에 예상을 적고  ② 실행하고  ③ 관찰과 «예상과 다른 점» 을 적는다
   *
   * ★ 예상을 적기 전에는 [실행] 이 열리지 않는다.
   *   먼저 돌려 보고 나서 «예상» 을 적으면 그것은 예상이 아니라 베끼기다.
   *
   * 통과 조건은 «두 실험 이상 실행 + 관찰 기록» 이다(명세 17.5).
   */
  /**
   * 고른 알림음의 코드를 팝업으로 보인다 (선생님 요청 2026-11-09).
   * [닫기] · Esc 로 닫는다. <dialog> 라 뒷배경 어둡게 하기·초점 잡기를 브라우저가 해 준다.
   */
  function showAlarmCode(kind) {
    var dialog = el("dialog", { class: "modal modal--code", attrs: { "aria-labelledby": "alarm-code-title" } });
    function close() {
      if (dialog.open && dialog.close) dialog.close();
      if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
    }
    var closeBtn = UI.button("닫기", { click: close });
    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", id: "alarm-code-title", text: kind.icon + " " + kind.label + "을 내는 코드" }),
        el("p", {
          class: "modal__text",
          text: "아두이노 IDE 에 옮겨 업로드하면 «" + kind.recipe + "» 소리가 한 번 납니다."
        }),
        UI.codeBlock(L.alarmCode(kind.id)),
        el("div", { class: "modal__actions" }, [closeBtn])
      ])
    );
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      close();
    });
    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", "");
    closeBtn.focus();
  }

  function renderExperiment(state, app) {
    var box = el("div");
    /*
     * 5단계는 «알림음 설계» 와 «예시 악보» 둘이다 (선생님 요청 2026-11-09).
     * 실험 A·B·C · 세 실험 견주어 보기 · 확장 활동(나만의 알림음 만들기)은 걷어 냈다.
     * 통과 조건은 알림음 «하나 고르기» 다 (schema.js 의 experiment 갈래).
     */
    box.appendChild(
      UI.card({
        eyebrow: "5단계 · 실행과 탐구",
        title: "알림음과 악보로 소리를 설계해 볼까?",
        desc:
          "성공음·경고음·호출음을 들어 보고 하나를 고르세요. 그다음 음마다 길이가 다른 악보를 프로그램으로 연주해 봅니다. " +
          "★ 알림음을 하나 골라야 다음 단계가 열립니다."
      })
    );

    /* ------------------------------------------------------------------ */
    /* 알림음 설계 — 성공음 · 경고음 · 호출음 (명세 7장 화면5)               */
    /*                                                                    */
    /* ★ 세 가지를 모두 들어 본 뒤 «하나를 고른다».                        */
    /*   무엇을 알리는 소리인가에 따라 높이와 길이가 달라지는 것을 귀로 안다.  */
    /* ------------------------------------------------------------------ */

    var pickedKind = state.experiment.extensionKind || "";

    box.appendChild(
      UI.card(
        {
          eyebrow: "설계하기",
          title: "어떤 알림음을 만들까요?",
          desc: "셋을 모두 들어 보고 하나를 고르세요."
        },
        [
          S.audio.controls({}),
          el(
            "div",
            { class: "alertkinds" },
            L.ALERT_KINDS.map(function (kind) {
              var chosen = pickedKind === kind.id;
              return el("div", { class: "alertkind" + (chosen ? " alertkind--on" : "") }, [
                el("p", { class: "alertkind__head" }, [
                  el("span", { class: "alertkind__icon", attrs: { "aria-hidden": "true" }, text: kind.icon }),
                  el("span", { class: "alertkind__name", text: kind.label }),
                  chosen ? el("span", { class: "alertkind__pick", text: "✓ 고름" }) : null
                ]),
                el("p", { class: "alertkind__when", text: kind.when }),
                el("p", { class: "alertkind__recipe", text: "만드는 법 : " + kind.recipe }),
                melodyPlayer({ notes: kind.example, toneMs: kind.toneMs, stepMs: kind.stepMs }).root,
                el("p", { class: "alertkind__why", text: kind.why }),
                UI.button(chosen ? "고른 것" : "이것으로 고르기", {
                  class: "btn btn--small " + (chosen ? "btn--ghost" : "btn--primary"),
                  disabled: chosen,
                  click: function () {
                    app.update(function (st) {
                      st.experiment.extensionKind = kind.id;
                    });
                    showAlarmCode(kind);
                  }
                })
              ]);
            })
          )
        ]
      )
    );

    /* ------------------------------------------------------------------ */
    /* 예시 악보 — 음마다 «길이가 다르다» (명세 7장 화면5)                   */
    /*                                                                    */
    /* ★★ 여기까지의 예시는 모든 음이 «같은 길이» 였다. 악보는 그렇지 않다.   */
    /*   ♩ 과 ♪ 과 ♩. 이 섞여 있으므로                                     */
    /*     ① 길이를 담는 배열이 «하나 더» 필요하고                          */
    /*     ② tone 의 재생 시간과 delay 를 «음마다» 함께 정해야 한다.         */
    /*                                                                    */
    /* ★ 빠르기(UNIT)를 바꾸면 tone 과 delay 가 «함께» 달라진다.            */
    /*   하나만 따로 바꿀 수 없다는 것이 눈에 보이도록                        */
    /*   표·딱지·코드를 한꺼번에 다시 그린다.                                */
    /* ------------------------------------------------------------------ */

    var SH = L.SHEET;
    var sheetHost = el("div", { class: "sheet" });

    /**
     * 악보 한 줄.
     *
     * ★ 딱지에 계명과 «몇 ms 인가» 를 함께 적는다.
     *   계명만 있으면 «길이가 다르다» 는 것이 암기가 된다.
     *   숫자가 붙어 있어야 파 가 750, 미 가 250 인 것을 눈으로 본다.
     */
    function sheetLine(line, unitMs) {
      var gap = SH.gapMs;
      var total = 0;
      line.notes.forEach(function (nt) {
        total += nt.beats * unitMs;
      });

      var scope = S.audio.scope({ hz: 0 });
      var chips = [];
      var row = el("div", { class: "sheet__row" });

      line.notes.forEach(function (nt, i) {
        var dur = nt.beats * unitMs;
        var chip = el(
          "span",
          {
            class: "sheet__note",
            attrs: {
              /* ★ 주파수를 함께 적는다 — 악보의 이 음이 프로그램의 «어느 숫자» 인지 잇는다 */
              title:
                nt.label + " " + nt.value.name + " · " + nt.hz + "Hz(악보 " + nt.sci + " 의 한 옥타브 위) · " +
                nt.beats + "칸 · tone " + (dur - gap) + "ms · delay " + dur + "ms"
            }
          },
          [
            el("b", { class: "sheet__name", text: nt.label }),
            el("small", { class: "sheet__ms", text: dur + "ms" })
          ]
        );
        chips.push(chip);
        row.appendChild(chip);
        /* 마디를 갈라 그린다 — 줄 끝에는 세로줄을 두지 않는다 */
        if (line.barAt.indexOf(i + 1) !== -1 && i + 1 < line.notes.length) {
          row.appendChild(el("span", { class: "sheet__bar", attrs: { "aria-hidden": "true" }, text: "│" }));
        }
      });

      function mark(index) {
        chips.forEach(function (chip, i) {
          chip.className = "sheet__note" + (i === index ? " sheet__note--now" : "");
        });
      }

      var playing = null;
      var btn = UI.button("▶ 들어 보기", {
        class: "btn btn--ghost btn--small",
        click: function () {
          if (playing) {
            playing.stop();
            playing = null;
            btn.textContent = "▶ 들어 보기";
            mark(-1);
            scope.set(0);
            return;
          }
          /* 브라우저는 «누르기 전» 에는 소리를 내주지 않는다 */
          S.audio.unlock();
          btn.textContent = "■ 멈춤";
          playing = S.audio.melody(
            line.notes.map(function (nt) {
              /* ★ slotMs — 이 음이 «차지하는» 시간. 사이는 여기서 «빼서» 쓴다. */
              return { name: nt.label, hz: nt.hz, slotMs: nt.beats * unitMs };
            }),
            {
              gapMs: gap,
              onNote: function (index, note, hz) {
                mark(hz > 0 ? index : -1);
                scope.set(hz);
              },
              onDone: function () {
                playing = null;
                btn.textContent = "▶ 들어 보기";
                mark(-1);
                scope.set(0);
              }
            }
          );
        }
      });

      return el("div", { class: "sheet__line" }, [
        el("p", { class: "sheet__no", text: line.no }),
        row,
        el("div", { class: "btnrow" }, [
          btn,
          el("p", {
            class: "btnrow__note",
            text:
              "한 줄 " + (total / 1000).toFixed(1) + "초 · tone 은 «칸 × " + unitMs +
              " − " + gap + "» ms, delay 는 «칸 × " + unitMs + "» ms"
          })
        ]),
        scope.root
      ]);
    }

    /** 빠르기를 바꿀 때마다 표·딱지·코드를 함께 다시 그린다 */
    function fillSheet(unitMs) {
      UI.clear(sheetHost);

      /* ① 빠르기 — 한 칸(UNIT)의 길이를 고른다 */
      sheetHost.appendChild(
        el("div", { class: "tempo" }, [
          el("p", { class: "tempo__label", text: "빠르기 — 8분음표 한 칸(UNIT)" }),
          el(
            "div",
            { class: "tempo__btns" },
            L.TEMPOS.map(function (tp) {
              var on = tp.unitMs === unitMs;
              return UI.button(tp.label + " " + tp.unitMs + "ms", {
                class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
                title: tp.tempo,
                click: function () {
                  sheetUnitMs = tp.unitMs;
                  fillSheet(tp.unitMs);
                }
              });
            })
          ),
          el("p", {
            class: "tempo__note",
            text: "UNIT 하나를 바꾸면 tone 과 delay 가 함께 달라집니다. 한쪽만 바꾸면 박자가 어긋납니다."
          })
        ])
      );

      /* ② 음표를 «칸» 으로 세면 ms 가 나온다 */
      sheetHost.appendChild(
        el("table", { class: "exptable" }, [
          el("caption", {
            class: "exptable__cap",
            text: "음표를 «칸» 으로 세면 ms 가 나옵니다 (한 칸 = UNIT = " + unitMs + "ms, 사이 GAP = " + SH.gapMs + "ms)"
          }),
          el("thead", {}, [
            el("tr", {}, [
              el("th", { attrs: { scope: "col" }, text: "음표" }),
              el("th", { attrs: { scope: "col" }, text: "칸" }),
              el("th", { attrs: { scope: "col" }, text: "dur = 칸 × UNIT" }),
              el("th", { attrs: { scope: "col" }, text: "tone 의 셋째 값" }),
              el("th", { attrs: { scope: "col" }, text: "delay" })
            ])
          ]),
          el(
            "tbody",
            {},
            L.NOTE_VALUES.map(function (v) {
              var dur = v.beats * unitMs;
              return el("tr", {}, [
                el("th", { attrs: { scope: "row" }, text: (v.sym ? v.sym + " " : "") + v.name }),
                el("td", { text: v.beats + "칸" }),
                el("td", { text: dur + "ms" }),
                el("td", { class: "is-tone", text: dur + " − " + SH.gapMs + " = " + (dur - SH.gapMs) + "ms" }),
                el("td", { class: "is-delay", text: dur + "ms" })
              ]);
            })
          )
        ])
      );

      /* ③ 악보 — «그림» 을 먼저 보이고, 그 아래 계명·길이 딱지를 붙인다.
         수업 자료에서 본 것과 같은 모습이라야 «이 악보를 프로그램으로» 가 이어진다. */
      sheetHost.appendChild(S.figures.staff(SH));

      SH.lines.forEach(function (line) {
        sheetHost.appendChild(sheetLine(line, unitMs));
      });

      sheetHost.appendChild(
        el(
          "ul",
          { class: "sheet__reading" },
          SH.reading.map(function (t) {
            return el("li", { text: t });
          })
        )
      );

      /* ④ 프로그램 — 배열이 둘이다 */
      sheetHost.appendChild(
        el("div", { class: "sheet__prog" }, [
          el("h4", { class: "sheet__h", text: "프로그램 — 배열이 «둘» 입니다" }),
          el("p", {
            class: "sheet__lead",
            text: "주파수 배열 notes[] 와 길이 배열 beats[] 를 나란히 놓고, 같은 i 로 함께 꺼냅니다."
          }),
          UI.codeBlock(L.sheetCode(SH.lines[0], unitMs), SH.lines[0].no),
          UI.foldout("둘째 줄(" + SH.lines[1].no + ") 의 배열", function () {
            return UI.codeBlock(L.sheetCode(SH.lines[1], unitMs), SH.lines[1].no);
          })
        ])
      );

      /* ⑤ ★ 사이는 delay 에 더하는 것이 아니라 tone 에서 빼는 것이다 */
      sheetHost.appendChild(
        el("div", { class: "sheet__pit" }, [
          el("h4", {
            class: "sheet__h",
            text: "★ 사이(GAP)는 delay 에 «더하는» 것이 아니라 tone 에서 «빼는» 것입니다"
          }),
          el(
            "div",
            { class: "pitfalls" },
            SH.pitfalls.map(function (pf) {
              return el("div", { class: "pitfall " + (pf.ok ? "pitfall--ok" : "pitfall--bad") }, [
                el("p", { class: "pitfall__mark", text: pf.ok ? "○ 이렇게" : "✗ 이러면" }),
                el("pre", { class: "pitfall__code" }, [el("code", { text: pf.code })]),
                el("p", { class: "pitfall__symptom", text: pf.symptom }),
                el("p", { class: "pitfall__why", text: pf.why })
              ]);
            })
          )
        ])
      );

      sheetHost.appendChild(UI.alert("info", SH.key));
    }

    fillSheet(sheetUnitMs || SH.unitMs);

    box.appendChild(
      UI.card(
        {
          eyebrow: "예시 악보",
          title: "악보를 그대로 연주하기 — 음마다 길이가 다릅니다",
          desc:
            "지금까지는 모든 음이 " + PC.TONE_MS + "ms 로 같았습니다. " +
            "악보에는 ♩ 과 ♪ 과 ♩. 이 섞여 있어, 길이 배열을 하나 더 두고 tone 과 delay 를 음마다 정해야 합니다."
        },
        [sheetHost]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 6단계 — 형성평가·제출                                                */
  /*                                                                    */
  /* 짜임새를 lesson3_7_1 의 6단계와 «같게» 맞추었다.                      */
  /*   ① 형성평가            — 응시자 정보 → 문항 하나씩 → 채점·제출        */
  /*   ② 채점·제출 진행 상황  — 오른쪽 검은 창에 한 줄씩 기록               */
  /*   ③ 학습 정리            — 요약 · 핵심 문법 카드 · 내가 쓴 것 되돌아보기 */
  /*                                                                    */
  /* 문항을 «한 번에 하나» 만 보여 준다. 다섯 개를 한꺼번에 늘어놓으면        */
  /* 화면이 길어져 어디를 보아야 할지 알기 어렵다.                          */
  /* ================================================================== */

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** ①②③ 이 붙은 구역 제목 */
  function sectionTitle(tag, text) {
    return el("h3", { class: "section-title" }, [
      el("span", { class: "section-title__tag", attrs: { "aria-hidden": "true" }, text: tag }),
      el("span", { text: text })
    ]);
  }

  /** 제목이 붙은 판 하나 */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body stack" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: "panel" }, [head, body]);
    return { root: root, body: body };
  }

  /** 왼쪽·오른쪽 두 쪽 — 900px 아래에서는 위아래로 쌓인다 */
  function split(className) {
    var left = el("div", { class: "stack" });
    var right = el("div", { class: "stack" });
    return {
      root: el("div", { class: "split" + (className ? " " + className : "") }, [left, right]),
      left: left,
      right: right
    };
  }

  /** 작은 알림표 */
  function badge(kind, text) {
    var map = { true: "badge--true", false: "badge--false", primary: "badge--primary" };
    return el("span", { class: ("badge " + (map[kind] || "")).trim(), text: text });
  }

  /** 진행 상황을 한 줄씩 쌓는 검은 창 */
  function makeConsole(spec) {
    var s = spec || {};
    var body = el("div", {
      class: "console__body",
      attrs: { role: "log", "aria-live": "polite", "aria-label": s.ariaLabel || "채점·제출 진행 상황", tabindex: "0" }
    });
    var root = el("div", { class: "console" }, [
      el("div", { class: "console__head" }, [
        el("span", { class: "console__dot", attrs: { "aria-hidden": "true" } }),
        el("span", { text: s.title || "진행 기록" })
      ]),
      body
    ]);

    function showEmpty() {
      UI.clear(body).appendChild(el("p", { class: "console__empty", text: s.emptyText || "여기에 기록이 쌓입니다." }));
    }

    function line(text, modifier) {
      if (body.querySelector(".console__empty")) UI.clear(body);
      body.appendChild(
        el("div", { class: ("console__line " + (modifier || "")).trim() }, [
          el("span", { class: "console__prompt", attrs: { "aria-hidden": "true" }, text: ">" }),
          el("span", { class: "console__text", text: text })
        ])
      );
      body.scrollTop = body.scrollHeight;
    }

    showEmpty();

    return {
      root: root,
      write: function (t) { line(t); },
      ok: function (t) { line(t, "console__line--ok"); },
      hint: function (t) { line(t, "console__line--hint"); },
      error: function (t) { line(t, "console__line--error"); },
      muted: function (t) { line(t, "console__line--muted"); }
    };
  }

  function renderAssess(state, app) {
    var box = el("div");
    var Q = PC.quiz;
    var answers = state.assessment.answers;
    var total = Q.QUESTIONS.length;

    /* 답안을 냈는가 — 냈으면 답을 고칠 수 없고, 그때 비로소 채점이 열린다 */
    var sealed = state.assessment.sealed === true;

    /** 이 문항에 답을 했는가 */
    function isAnswered(q) {
      var v = answers[q.id];
      if (q.type === "choice") return typeof v === "number" && v >= 0;
      return String(v === undefined || v === null ? "" : v).trim().length > 0;
    }

    /* ---------------- ② 진행 상황 창 (오른쪽) ---------------- */

    var cons = makeConsole({
      title: "채점·제출 기록",
      emptyText: "학번과 이름을 넣고 문항에 답하면 여기에 기록이 쌓입니다."
    });

    /* ---------------- 응시자 정보 ---------------- */

    var idInput = el("input", {
      class: "student-field__input",
      id: "assess-sid",
      attrs: { type: "text", inputmode: "numeric", maxlength: "5", placeholder: "예) 10312", autocomplete: "off" }
    });
    idInput.value = state.student.studentId || "";

    var nameInput = el("input", {
      class: "student-field__input",
      id: "assess-name",
      attrs: { type: "text", maxlength: "20", placeholder: "예) 홍길동", autocomplete: "off" }
    });
    nameInput.value = state.student.name || "";

    var studentNote = el("p", { class: "student-card__note", attrs: { role: "status" } });

    var studentCard = el("div", { class: "student-card" }, [
      el("div", { class: "student-card__head" }, [
