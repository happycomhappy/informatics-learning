  /* ================================================================== */
  /* 4단계 — 텍스트 코딩                                                 */
  /* ================================================================== */

  /**
   * 4단계는 «읽고 → 돌려 보고 → 만든다» 세 판으로 나뉜다.
   *
   *   A 읽기   예시 프로그램을 한 줄씩 읽는다 (함수 설명·뼈대·실행 순서)
   *   B 확인   그 예시를 그대로 실행해 setup 1회 / loop 반복을 눈으로 본다
   *   C 만들기 조립 → 빈칸 → 편집으로 직접 적는다
   *
   * ★ B 를 마치기 전에는 C 를 «보여 주지 않는다».
   *   스케치를 한 번도 본 적 없는 학생에게 곧바로 작성 화면을 내밀면
   *   무엇을 하는 것인지 알 수 없다.
   */

  /**
   * 실행 결과를 보여 주는 작은 부품 — 예시와 학생 코드가 같은 것을 쓴다.
   *
   * 이 차시에는 시리얼 출력이 없다. 대신 명세 6.3 이 요구하는 것들을 함께 보인다.
   *   현재 실행 줄 · D8 이 내보내는 주파수 · 오실로스코프 파형 · 누적 시간
   *   그리고 «지금 몇 번째 음인가(i)» 와 «실행 중인 tone() 줄»
   *
   * ★ 소리 남·안 남을 색으로만 알리지 않는다(명세 13장).
   *   ♪/○ 와 «523Hz 도» 처럼 숫자·음이름을 늘 글자로 함께 쓴다.
   *
   * ★★ 소리와 파형은 «발자취» 가 아니라 «소리 시간표» 를 따라간다.
   *   tone(…, 250) 뒤 delay(400) 이면 250ms 에 소리가 저절로 멎는데,
   *   그 순간에는 지나가는 «줄» 이 없어 발자취에 자국이 남지 않는다.
   *   발자취만 따라가면 그 150ms 의 조용함이 통째로 사라져
   *   이 차시에서 가장 중요한 «음과 음 사이» 를 못 듣게 된다.
   *   그래서 한 줄을 지날 때마다 «그 줄과 다음 줄 사이에 끼어 있는»
   *   시간표의 자국을 따로 예약해 둔다.
   */
  function makeRunner(opts) {
    var o = opts || {};
    var viewHost = el("div");
    var panelHost = el("div");
    var player = null;

    /* 상태 등 — 다시 그리지 않고 «글자만» 바꾼다 */
    var lamp = el("span", { class: "lamp", attrs: { "aria-hidden": "true" }, text: "○" });
    var lampText = el("span", { class: "lamp__text", text: "조용함" });
    /* 등을 담는 상자를 «미리» 만들어 둔다.
       상자를 화면에 붙이기 전에 setHz 를 부를 때가 있어서, 그때 parentNode 를 찾으면 없다. */
    var lampBox = el("div", { class: "lamp-box" }, [lamp, lampText]);
    var pinText = el("span", { class: "runstat__value", text: "조용함" });
    var lineText = el("span", { class: "runstat__value", text: "—" });
    var timeText = el("span", { class: "runstat__value", text: "0.000초" });
    var phaseText = el("span", { class: "runstat__value", text: "setup()" });
    var live = el("p", { class: "sr-only", attrs: { role: "status", "aria-live": "polite" } });

    /* 오실로스코프 — 실행 중에 파형이 함께 움직인다(명세 6.3) */
    var scope = S.audio.scope({ hz: 0 });

    /* 예약해 둔 «시간표 자국» 타이머 */
    var pending = [];
    var curHz = 0;

    function clearPending() {
      pending.forEach(function (id) {
        clearTimeout(id);
      });
      pending = [];
    }

    function setHz(hz) {
      var freq = Math.max(0, Math.round(Number(hz) || 0));
      curHz = freq;
      var name = freq > 0 ? A.noteNameOf(freq) : "";
      var label = freq > 0 ? freq + "Hz" + (name ? " " + name : "") : "조용함";

      lamp.textContent = freq > 0 ? "♪" : "○";
      lampText.textContent = label;
      pinText.textContent = label;
      lampBox.className = "lamp-box" + (freq > 0 ? " lamp-box--on" : "");
      scope.set(freq);

      /* 소리는 «열려 있을 때만» 난다. 열지 않았으면 조용히 넘어간다(명세 6.3). */
      if (freq > 0) S.audio.play(freq);
      else S.audio.stop();
    }

    function statRow(label, valueNode) {
      return el("div", { class: "runstat" }, [
        el("span", { class: "runstat__label", text: label }),
        valueNode
      ]);
    }

    /**
     * 몇 바퀴를 돌려 보여 줄 것인가.
     *
     * ★ delay 를 «실제 시간» 만큼 기다리므로, 바퀴 수를 고정하면
     *   한 바퀴가 긴 코드는 한참 걸리고 짧은 코드는 눈 깜짝할 사이에 끝난다.
     *   그래서 재생이 6초 안팎이 되도록 바퀴 수를 맞춘다.
     *
     * ★ 이 차시의 기준 프로그램은 loop() 가 비어 있고 setup() 에서 모두 끝난다.
     *   그때는 바퀴 수가 아무것도 바꾸지 않으므로 그냥 적은 값을 쓴다.
     */
    function loopsFor(source) {
      var probe = A.run(source, { loopLimit: 2, speakerPin: PC.SPEAKER_PIN });
      var cycleMs = probe.elapsed / 2;
      if (!cycleMs || cycleMs <= 0) return o.loopLimit || 3;
      return Math.max(2, Math.min(8, Math.round(6000 / cycleMs)));
    }

    /**
     * 실행해 보여 준다.
     *   ro.instant   : 애니메이션 없이 «끝난 모습» 을 바로 보여 준다.
     *                  화면을 다시 그릴 때마다 처음부터 재생되면 눈이 어지럽다.
     *   ro.onCycle() : 첫 음이 «울렸다 멎는 것» 을 끝까지 본 순간 한 번 부른다.
     */
    function run(source, ro) {
      ro = ro || {};
      var result = A.run(source, { loopLimit: loopsFor(source), speakerPin: PC.SPEAKER_PIN });
      var view = ED.codeView(source, { caption: "실행 중인 줄이 ▶ 로 표시됩니다." });
      UI.clear(viewHost).appendChild(view.root);

      if (!result.ok && result.error) {
        clearPending();
        setHz(0);
        UI.clear(panelHost).appendChild(
          UI.alert("warn", (result.error.line ? result.error.line + "번 줄 — " : "") + result.error.message)
        );
        return result;
      }

      var marks = (result.speaker && result.speaker.timeline) || [];

      /** 그 시각에 나가고 있는 주파수 */
      function hzAt(t) {
        var hz = 0;
        for (var i = 0; i < marks.length; i += 1) {
          if (marks[i].t <= t) hz = marks[i].hz;
          else break;
        }
        return hz;
      }

      /* 첫 음이 «멎는» 시각 — 소리가 났다가 조용해지는 첫 자리다 */
      var firstStopT = null;
      for (var mi = 0; mi < marks.length; mi += 1) {
        if (marks[mi].hz === 0 && mi > 0 && marks[mi - 1].hz > 0) {
          firstStopT = marks[mi].t;
          break;
        }
      }
      var cycleTold = false;
      var speedNow = ro.instant ? 0 : 1;

      /**
       * 화면이 지금 «어느 가상 시각» 을 보이고 있는가.
       *
       * ★★ 이 한 칸이 이 차시에서 가장 손이 많이 간 자리다.
       *
       *   재생기는 «한 줄» 을 통째로 지나간 뒤에 그 줄이 흘려보낸 시간만큼 쉰다.
       *   그래서 delay(400) 줄에서는 발자취가 먼저 t=400 까지 뛰고, 그다음에
       *   0.4초를 기다린다. 그 «기다리는 동안» 에 소리가 250ms 에서 멎어야 하는데,
       *   발자취만 보고 있으면 이미 t=400 이라 다음 음으로 건너뛰어 버린다.
       *   — 이 차시에서 가장 중요한 «음과 음 사이» 가 통째로 사라지는 것이다.
       *
       *   그래서 시각이 «뛴 만큼» 을 앞으로 기다릴 시간으로 보고,
       *   그 사이에 든 시간표의 자국을 저마다 제 시각에 예약해 둔다.
       */
      var shownT = 0;

      if (player) player.stop();
      clearPending();
      setHz(0);
      shownT = 0;

      player = ED.player(view, {
        onStep: function (entry) {
          if (entry.line) lineText.textContent = entry.line + "번 줄";
          timeText.textContent = (entry.t / 1000).toFixed(3) + "초";
          phaseText.textContent =
            entry.phase === "setup" ? "setup() — 한 번만" : "loop() " + entry.iteration + "회째";

          function tellCycle(t) {
            if (firstStopT === null || cycleTold || t < firstStopT) return;
            cycleTold = true;
            live.textContent = "첫 음이 울렸다 멎는 것을 관찰했습니다.";
            if (ro.onCycle) ro.onCycle();
          }

          if (entry.t > shownT && speedNow > 0) {
            /* 시간이 흐른 줄 — 앞으로 그만큼 기다린다. 그 사이의 자국을 예약해 둔다. */
            var from = shownT;
            marks.forEach(function (m) {
              if (m.t <= from || m.t > entry.t) return;
              var wait = (m.t - from) / speedNow;
              if (wait > 12000) return;
              pending.push(
                setTimeout(function () {
                  setHz(m.hz);
                  tellCycle(m.t);
                }, Math.max(0, wait))
              );
            });
            shownT = entry.t;
            return;
          }

          /* 시간이 흐르지 않은 줄(tone · noTone 같은 것) — 그 자리에서 바로 맞춘다 */
          shownT = Math.max(shownT, entry.t);
          setHz(hzAt(entry.t));
          tellCycle(entry.t);
        },
        onFinish: function () {
          clearPending();
          setHz(0);
        }
      });
      player.setTrace(result.trace);

      /* 소리 시간표 — 어떤 음이 얼마 동안 났는지 눈으로(명세 6.3) */
      var timeline = el("div", { class: "toneline" });
      var total = result.elapsed || 1;
      for (var i = 0; i + 1 < marks.length; i += 1) {
        var ms = marks[i + 1].t - marks[i].t;
        var width = (ms / total) * 100;
        var on = marks[i].hz > 0;
        var noteName = on ? A.noteNameOf(marks[i].hz) : "";
        timeline.appendChild(
          el("span", {
            class: "toneline__seg toneline__seg--" + (on ? "on" : "off"),
            /* el() 은 style 을 따로 받지 않는다. attrs 로 넘겨야 실제로 붙는다. */
            attrs: {
              style: "width:" + width.toFixed(2) + "%",
              title: (on ? marks[i].hz + "Hz " + noteName + " " : "조용함 ") + ms + "ms"
            },
            /* 색만으로 알리지 않는다 — 칸 안에 음이름을 글자로도 적는다(명세 13장) */
            text: width > 5 ? (on ? noteName || marks[i].hz + "Hz" : "쉼") : ""
          })
        );
      }

      function speedButton(label, factor) {
        return UI.button(label, {
          class: "btn btn--ghost btn--small",
          click: function () {
            clearPending();
            setHz(0);
            speedNow = factor;
            shownT = 0;
            player.setSpeed(factor);
            player.reset();
            cycleTold = cycleTold; /* 이미 본 것은 다시 세지 않는다 */
            player.play();
          }
        });
      }

      UI.clear(panelHost).appendChild(
        el("div", { class: "runpanel" }, [
          /* 소리를 켜는 자리 — 브라우저가 «누르기 전» 에는 내주지 않는다(명세 12장) */
          S.audio.controls({
            onUnlock: function () {
              if (curHz > 0) S.audio.play(curHz);
            }
          }),
          el("div", { class: "runpanel__head" }, [
            lampBox,
            el("div", { class: "runstats" }, [
              statRow(PC.SPEAKER_PIN_NAME + " 출력", pinText),
              statRow("실행 중인 줄", lineText),
              statRow("어느 함수", phaseText),
              statRow("누적 시간", timeText)
            ])
          ]),
          scope.root,
          marks.length > 1
            ? el("div", {}, [
                el("p", { class: "toneline__cap", text: "소리 시간표 — " + A.describeMelody(result) }),
                timeline
              ])
            : el("p", { class: "para", text: "소리가 한 번도 나지 않았습니다." }),
          el("div", { class: "btnrow" }, [
            el("span", { class: "btnrow__label", text: "재생 속도" }),
            speedButton("1배속", 1),
            /* 0.5배속 — 음이 갈라지는 «사이» 를 천천히 보고 싶을 때 */
            speedButton("0.5배속", 0.5),
            UI.button("즉시", {
              class: "btn btn--ghost btn--small",
              click: function () {
                clearPending();
                speedNow = 0;
                shownT = 0;
                player.setSpeed(0);
                player.reset();
                player.play();
                setHz(0);
              }
            }),
            UI.button("멈춤", {
              class: "btn btn--ghost btn--small",
              click: function () {
                player.stop();
                clearPending();
                setHz(0);
              }
            })
          ]),
          el("p", {
            class: "runpanel__note",
            text:
              "★ tone() 은 기다리지 않습니다. 소리를 시작해 놓고 곧바로 다음 줄로 가고, " +
              "기다리는 것은 delay 입니다. 그래서 delay 값 가운데 앞쪽은 소리가 나고 " +
              "«남은 시간» 이 음과 음 사이가 됩니다 — delay(400) 에 tone 이 250ms 면 사이는 150ms 입니다. " +
              "delay 줄에서는 그 시간만큼 «실제로» 기다립니다. 실제 보드와 같은 빠르기예요."
          }),
          live
        ])
      );

      player.setSpeed(speedNow);
      player.play();
      return result;
    }

    return { viewHost: viewHost, panelHost: panelHost, run: run, setHz: setHz, stop: function () {
      if (player) player.stop();
      clearPending();
      setHz(0);
    } };
  }

  function renderCode(state, app) {
    var box = el("div");
    var code = state.code;
    var W = L.CODE_WALKTHROUGH;

    /* ================================================================ */
    /* A. 예시 읽기 (명세 17.4 A)                                        */
    /* ================================================================ */

    box.appendChild(
      UI.card({ eyebrow: "4단계 · A 먼저 읽기", title: W.title, desc: W.intro }, [
        /* ★ 프로그램과 함수 설명을 «나란히» 둔다.
           코드를 읽다가 pinMode 가 무엇인지 궁금할 때 위로 되돌아가지 않아도 된다.
           좁은 화면에서는 코드가 위, 설명이 아래로 접힌다. */
        el("div", { class: "readpair" }, [
          el("div", { class: "readpair__code" }, [
            ED.codeView(W.code, { caption: "오늘 만들 프로그램" }).root
          ]),
          el("div", { class: "readpair__fns" }, [
            el("h3", { class: "subhead", text: "이 프로그램이 쓰는 함수" }),
            functionCards()
          ])
        ]),

        /* 뼈대 — 스케치는 언제나 이 두 함수로 이루어진다 */
        el("h3", { class: "subhead", text: "스케치의 뼈대는 함수 두 개다" }),
        el("div", { class: "skel" }, W.skeleton.map(function (part) {
          return el("div", { class: "skel__item" }, [
            el("code", { class: "skel__name", text: part.name }),
            el("p", { class: "skel__when" }, [
              el("b", { text: "언제 : " }),
              el("span", { text: part.when })
            ]),
            el("p", { class: "skel__what", text: part.what })
          ]);
        })),

        /* 줄마다 무슨 뜻인가 — 줄 수는 코드와 정확히 같다(명세 17.4 A) */
        el("h3", { class: "subhead", text: "한 줄씩 읽어 보기" }),
        el("ol", { class: "walk" }, W.lines.map(function (line) {
          return el("li", { class: "walk__item" }, [
            el("span", { class: "walk__no", attrs: { "aria-hidden": "true" }, text: String(line.no) }),
            el("div", { class: "walk__body" }, [
              line.code
                ? el("code", { class: "walk__code", text: line.code })
                : el("code", { class: "walk__code walk__code--empty", text: "(빈 줄)" }),
              el("p", { class: "walk__text", text: line.text })
            ])
          ]);
        })),

        /* 실행 순서 */
        el("h3", { class: "subhead", text: "어떤 순서로 돌아가는가" }),
        el("ol", { class: "orderlist" }, W.order.map(function (line) {
          return el("li", { text: line });
        })),

        /* 글쓰기 약속 카드는 선생님 요청으로 뺐다(2026-08-19).
           세미콜론·중괄호는 아래 «코드 검사» 가 실제로 틀렸을 때 줄 번호와 함께 짚어 준다. */
      ])
    );

    /* ================================================================ */
    /* B. 돌려 보기 (명세 8장)                                           */
    /*                                                                  */
    /* ★ 첫 음이 «울렸다 멎는 것» 을 끝까지 보아야 C 가 열린다.            */
    /*   그 자리에서 tone 이 기다려 주지 않는다는 것을 눈으로 보게 된다.     */
    /* ================================================================ */

    var demo = makeRunner({ loopLimit: 4 });

    /* 한 주기를 본 순간 나타나는 자리. 화면 전체를 다시 그리면 재생이 끊기므로
       이 칸만 채운다. */
    var afterBox = el("div");

    function showAfterCycle() {
      if (afterBox.childNodes.length > 0) return;
      afterBox.appendChild(UI.alert("ok", W.afterRun));
      if (!state.code.learned) {
        afterBox.appendChild(
          el("div", { class: "btnrow" }, [
            UI.button("이해했어요 · 직접 만들어 보기", {
              class: "btn btn--primary btn--lg",
              click: function () {
                app.update(function (s) {
                  s.code.learned = true;
                });
              }
            })
          ])
        );
      }
    }

    var demoBody = [
      el("div", { class: "btnrow" }, [
        UI.button(code.exampleRun ? "다시 실행" : "예시 프로그램 실행", {
          click: function () {
            app.patch(function (s) {
              s.code.exampleRun = true;
            });
            UI.clear(afterBox);
            demo.run(W.code, { onCycle: showAfterCycle });
          }
        }),
        el("p", {
          class: "btnrow__note",
          text: "브라우저가 코드를 그대로 실행하지 않고, 허용된 문법만 읽어 흉내 냅니다."
        })
      ]),
      demo.viewHost,
      demo.panelHost,
      afterBox
    ];

    box.appendChild(
      UI.card(
        {
          eyebrow: "4단계 · B 돌려 보기",
          title: "예시 프로그램을 실행해 봅시다.",
          desc:
            "실행 중인 줄이 움직이고 파형이 함께 바뀝니다. " +
            "첫 음이 «울렸다 멎는 것» 을 끝까지 보면 아래에 만드는 칸이 열립니다."
        },
        demoBody
      )
    );

    /* 이미 한 번 돌려 본 학생에게는 «즉시» 로 다시 채워 둔다.
       다시 그릴 때마다 처음부터 재생되면 눈이 어지럽고, 결과 칸이 비어 보이지도 않는다. */
    if (code.exampleRun) demo.run(W.code, { instant: true, onCycle: showAfterCycle });

    /* ★ 읽고 돌려 보기 전에는 «작성 화면» 을 만들지 않는다(명세 17.4 C).
       흐리게 비활성으로 미리 보여 주지도 않는다 — 아예 DOM 에 만들지 않는다. */
    if (!code.learned) {
      box.appendChild(
        UI.alert(
          "info",
          "위 예시를 읽고 [예시 프로그램 실행] 으로 한 주기를 관찰하면, 아래에 직접 만드는 칸이 열립니다."
        )
      );
      return box;
    }

    /* ================================================================ */
    /* C. 직접 만들기 (명세 17.4 C)                                      */
    /* ================================================================ */

    /* 검사 결과가 들어갈 자리.
       ★ 아래 «방식별 입력» 이 만들어지자마자 refreshTests 를 부르므로
         이 그릇은 그보다 «먼저» 만들어져 있어야 한다. */
    var testPanel = el("div");

    function setSource(next) {
      app.patch(function (s) {
        s.code.source = next;
      });
      refreshTests(next);
    }

    /* ---- 방식 고르기 ---- */
    var tabs = el("div", { class: "modetabs", attrs: { role: "tablist", "aria-label": "코딩 방식" } });
    /**
     * 그 방식을 마쳤는가 — 조립·빈칸만 따진다(전체 편집은 통과 조건이 아니다).
     *
     * ★ 그려 둔 상태(code)가 아니라 «지금» 상태를 본다.
     *   검사가 다시 돌면서 마침으로 바뀔 수 있는데, 그때 화면을 통째로 다시 그리면
     *   학생이 적고 있던 칸의 초점과 커서가 날아간다. 그래서 표시만 고쳐 준다.
     */
    function modeDone(id) {
      var now = app.getState().code || {};
      if (id === "assemble") return now.assembleDone === true;
      if (id === "blank") return now.blanksDone === true;
      return null;
    }

    var modeTabs = {};

    A.CODE_MODES.forEach(function (m) {
      var active = code.mode === m.id;
      var done = modeDone(m.id);
      var tab = el("button", {
          class: "modetab" + (active ? " modetab--on" : "") + (done ? " modetab--done" : ""),
          text: m.label + (done ? " ✓" : ""),
          attrs: { type: "button", role: "tab", "aria-selected": active ? "true" : "false" },
          on: {
            click: function () {
              app.update(function (s) {
                s.code.mode = m.id;
              });
            }
          }
        });
      modeTabs[m.id] = tab;
      tabs.appendChild(tab);
    });

    var NEED_MODES = [
      { id: "assemble", label: "① 코드 조립" },
      { id: "blank", label: "② 빈칸 채우기" }
    ];
    var needList = el("ul", { class: "modedone__list" });

    /** 마침 표시를 다시 칠한다 — 화면을 통째로 다시 그리지 않고 여기만 고친다 */
    function paintModeDone() {
      UI.clear(needList);
      NEED_MODES.forEach(function (m) {
        var done = modeDone(m.id);
        needList.appendChild(
          el("li", { class: "modedone__item" + (done ? " is-done" : "") }, [
            el("span", { class: "modedone__mark", attrs: { "aria-hidden": "true" }, text: done ? "✓" : "○" }),
            el("span", { class: "modedone__name", text: m.label }),
            el("span", { class: "modedone__state", text: done ? "마침" : "아직" })
          ])
        );
        var tab = modeTabs[m.id];
        if (!tab) return;
        var label = m.id === "assemble" ? A.CODE_MODES[0].label : A.CODE_MODES[1].label;
        tab.textContent = label + (done ? " ✓" : "");
        tab.classList.toggle("modetab--done", !!done);
      });
    }
    paintModeDone();

    var modeDesc = "";
    A.CODE_MODES.forEach(function (m) {
      if (m.id === code.mode) modeDesc = m.desc;
    });

    /* ---- 방식별 입력 ---- */
    var work = el("div", { class: "codework" });

    if (code.mode === "assemble") {
      var asm = ED.assembler(code.assembleOrder, function (order, source) {
        app.patch(function (s) {
          s.code.assembleOrder = order;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(asm.root);
      if (!code.source) setSource(asm.getSource());
    } else if (code.mode === "blank") {
      var bl = ED.blanks(code.blanks, function (source, values) {
        app.patch(function (s) {
          s.code.blanks = values;
          s.code.source = source;
        });
        refreshTests(source);
      });
      work.appendChild(bl.root);
      setSource(bl.getSource());
    } else {
      var starter =
        "const int speakerPin = " + PC.SPEAKER_PIN + ";\n" +
        "int notes[] = {" + (PC.NOTE_HZ || []).join(", ") + "};\n\n" +
        "void setup() {\n  \n}\n\nvoid loop() {}";
      var ed = ED.editor(code.source || starter, function (value) {
        setSource(value);
      });
      work.appendChild(ed.root);
      work.appendChild(
        el("div", { class: "btnrow" }, [
          UI.button("빈 스케치 넣기", {
            class: "btn btn--ghost btn--small",
            click: function () {
              ed.setValue(starter);
            }
          })
        ])
      );
      if (!code.source) setSource(ed.getValue());
    }

    /**
     * ★★ 무엇이 남았는지 «늘» 보이게 한다.
     *
     *   두 방식을 모두 마쳐야 하는데, 탭만 있으면 «하나 하면 끝» 으로 보인다.
     *   [다음] 이 안 열리는 까닭을 아래에서 찾게 하지 말고 여기서 알린다.
     *   ✓ 와 «마침» 을 함께 적는다 — 색만으로 뜻을 전하지 않는다(명세 13장).
     */

    var modeNeed = el("div", { class: "modedone" }, [
      el("p", {
        class: "modedone__label",
        text: "① 코드 조립 과 ② 빈칸 채우기 를 «모두» 마쳐야 다음 단계가 열립니다."
      }),
      needList,
      el("p", {
        class: "modedone__note",
        text: "여덟 항목을 모두 통과하면 그 방식은 마친 것으로 기록됩니다. ③ 전체 편집은 해 보고 싶은 사람만 하세요."
      })
    ]);

    box.appendChild(
      UI.card({ eyebrow: "4단계 · C 직접 만들기", title: "이제 같은 프로그램을 만들어 봅시다.", desc: modeDesc }, [
        modeNeed,
        tabs,
        work
      ])
    );

    /* ---- 코드 검사 여덟 항목 (명세 17.4) ---- */

    function refreshTests(source) {
      /* 8번 항목이 «회로» 를 함께 본다. 그래서 결선 목록을 넘긴다. */
      var result = A.validate(source, { connections: state.circuit.connections });
      var mismatch = result.ast ? C.pinMismatch(A.pinsUsed(result.ast), state.circuit.connections) : [];

      /* ★ 여덟 항목을 모두 통과한 그 순간, «그 방식» 을 마친 것으로 적어 둔다.
         조립과 빈칸을 둘 다 마쳐야 다음 단계가 열린다(schema.js 의 code 갈래). */
      var allOk = result.tests.length > 0 && result.passed === result.tests.length;

      app.patch(function (s) {
        s.code.testsPassed = result.passed;
        s.code.testsTotal = result.tests.length;
        s.code.syntaxErrors = result.error ? [result.error] : [];
        s.code.pinMismatch = mismatch;
        if (allOk && code.mode === "assemble") s.code.assembleDone = true;
        if (allOk && code.mode === "blank") s.code.blanksDone = true;
      });

      UI.clear(testPanel);

      if (result.error) {
        testPanel.appendChild(UI.alert("warn", result.error.line + "번 줄 — " + result.error.message));
      }

      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        list.appendChild(UI.conditionRow(t.label, t.ok, t.ok ? "" : t.message));
      });
      testPanel.appendChild(list);

      result.warnings.forEach(function (w) {
        testPanel.appendChild(UI.alert("info", w.line + "번 줄 — " + w.message));
      });

      /* 통과 개수가 바뀌었으므로 아래쪽 [다음] 단추도 다시 판단해야 한다 */
      paintModeDone();
      app.rerenderNav();
      return result;
    }

    box.appendChild(
      UI.card(
        { title: "코드 검사", desc: "여덟 항목을 모두 통과해야 다음 단계가 열립니다." },
        [testPanel]
      )
    );

    /* ---- 내 코드 실행 ---- */
    var mine = makeRunner({ loopLimit: 4 });
    box.appendChild(
      UI.card({ title: "내 코드 실행하기", desc: "예시와 같은 결과가 나오는지 견주어 보세요." }, [
        el("div", { class: "btnrow" }, [
          UI.button("내 코드 실행", {
            click: function () {
              mine.run(state.code.source);
              app.patch(function (s) {
                s.code.ran = true;
                s.code.attempts += 1;
              });
              app.rerenderNav();
            }
          })
        ]),
        mine.viewHost,
        mine.panelHost
      ])
    );

    refreshTests(code.source);

    return box;
  }

  /* ================================================================== */
  /* 5단계 — 실행·탐구                                                   */
  /* ================================================================== */

  /**
   * ★ 가락 하나를 «들려주는» 작은 부품 (명세 7장 화면5)
   *
   *   notes  : [{ name, hz }]
   *   소리를 켜지 않았으면 파형과 글자만 움직인다 — 학습이 끊기지 않는다(명세 13장).
   *
   * 돌려주는 것 : { root } — [들어 보기] 단추 + 계명 줄 + 작은 파형
   */
  function melodyPlayer(spec) {
    var o = spec || {};
    var notes = o.notes || [];
    var toneMs = o.toneMs || PC.TONE_MS || 250;
    var stepMs = o.stepMs || PC.STEP_MS || 400;
    var playing = null;

    var scope = S.audio.scope({ hz: 0 });

    /* 계명 — 지금 울리는 음에 표시가 붙는다 */
    var chips = notes.map(function (nt, i) {
      return el("span", {
        class: "solfa__note",
        attrs: { "data-at": String(i), title: nt.hz + "Hz" },
        text: nt.name
      });
    });
    var solfa = el("div", { class: "solfa" }, chips);

    function mark(index) {
      chips.forEach(function (chip, i) {
        chip.className = "solfa__note" + (i === index ? " solfa__note--now" : "");
      });
    }

    var btn = UI.button("▶ 들어 보기", {
      class: "btn btn--ghost btn--small",
      click: function () {
        if (playing) {
          playing.stop();
          playing = null;
          btn.textContent = "▶ 들어 보기";
          mark(-1);
          scope.set(0);
          return;
        }
        /* 브라우저는 «누르기 전» 에는 소리를 내주지 않는다 — 이 자리가 바로 그 «누름» 이다 */
        S.audio.unlock();
        btn.textContent = "■ 멈춤";
        playing = S.audio.melody(notes, {
          toneMs: toneMs,
          stepMs: stepMs,
          onNote: function (index, note, hz) {
            mark(hz > 0 ? index : -1);
            scope.set(hz);
          },
          onDone: function () {
            playing = null;
            btn.textContent = "▶ 들어 보기";
            mark(-1);
            scope.set(0);
          }
        });
      }
    });

    return {
      root: el("div", { class: "melody" }, [
        solfa,
        el("div", { class: "btnrow" }, [
          btn,
          el("p", {
            class: "btnrow__note",
            text: "한 음 " + toneMs + "ms · 다음 음까지 " + stepMs + "ms (사이 " + (stepMs - toneMs) + "ms)"
          })
        ]),
        scope.root
      ])
    };
  }

  /**
   * ★ 방금 [실행] 을 누른 실험.
   *
   *   실행하면 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
   *   그런데 다시 그리면서 결과를 «즉시» 로 채우면, 학생이 보는 것은
   *   «이미 끝난 모습» 뿐이라 아무 일도 일어나지 않은 것처럼 보인다.
   *
   *   그래서 어느 실험을 방금 눌렀는지 기억해 두고, 다시 그린 뒤 그 하나만
   *   «애니메이션으로» 재생한다. 나머지는 즉시로 채운다.
   */
  var justRanExperiment = "";

  /**
   * 예시 악보의 빠르기(8분음표 한 칸의 ms).
   *
   * ★ 모듈 밖에 둔다 — 5단계를 다시 그려도 학생이 고른 빠르기가 남는다.
   *   0 이면 악보가 정한 기본값(L.SHEET.unitMs)을 쓴다.
   */
  var sheetUnitMs = 0;

  /**
   * 5단계 — 실행·탐구 (명세 17.5)
   *
   * 세 실험을 «순서대로» 한다. 실험마다
   *   ① 실행 «전» 에 예상을 적고  ② 실행하고  ③ 관찰과 «예상과 다른 점» 을 적는다
   *
   * ★ 예상을 적기 전에는 [실행] 이 열리지 않는다.
   *   먼저 돌려 보고 나서 «예상» 을 적으면 그것은 예상이 아니라 베끼기다.
   *
   * 통과 조건은 «두 실험 이상 실행 + 관찰 기록» 이다(명세 17.5).
   */
  function renderExperiment(state, app) {
    var box = el("div");
    var minChars = PC.LIMITS.observationMin;

    /** 실험 하나의 기록 (없으면 빈 칸으로) */
    function runOf(id) {
      return state.experiment.runs[id] || { predict: "", ran: false, observation: "", surprise: "" };
    }

    /**
     * 그 실험의 코드 — 학생이 만든 코드에서 «한 가지만» 바꾼다.
     *
     *   exp-a(freq)   : 배열의 주파수를 모두 factor 배로 → 높이만 달라진다
     *   exp-b(toneMs) : tone 의 세 번째 값만        → 길이만 달라진다
     *   exp-c(stepMs) : delay 값만                  → 사이만 달라진다
     *
     * ★ 두 가지를 함께 바꾸면 무엇 때문에 달라졌는지 알 수 없다.
     *   그래서 실험마다 손대는 곳을 하나로 묶어 두었다.
     */
    function sourceFor(item) {
      var base = String(state.code.source || A.REFERENCE_CODE);

      if (item.change === "freq") {
        var f = Number(item.factor) || 2;
        /* int notes[] = { … } 안의 숫자만 곱한다. tone 의 길이나 delay 는 건드리지 않는다. */
        return base.replace(/(\[\s*\]\s*=\s*\{)([^}]*)(\})/, function (all, head, body, tail) {
          return head + body.replace(/\d+/g, function (num) {
            return String(Math.round(Number(num) * f));
          }) + tail;
        });
      }

      if (item.change === "toneMs") {
        return base.replace(/tone\s*\(([^)]*)\)/g, function (all, args) {
          var parts = args.split(",");
          if (parts.length >= 3) parts[2] = " " + item.toneMs;
          else parts.push(" " + item.toneMs);
          return "tone(" + parts.join(",") + ")";
        });
      }

      if (item.change === "stepMs") {
        return base.replace(/delay\s*\(\s*\d+\s*\)/g, "delay(" + item.stepMs + ")");
      }

      return base;
    }

    /** 실험 카드의 제목 — 무엇을 바꾼 실험인지 한 줄로 */
    function titleFor(item) {
      if (item.change === "freq") return "모든 주파수를 " + item.factor + "배로";
      if (item.change === "toneMs") return "한 음의 길이를 " + item.toneMs + "ms 로";
      return "delay 를 " + item.stepMs + "ms 로 (tone 길이 " + item.toneMs + "ms)";
    }

    /** 그 실험을 «끝냈는가» — 실행 + 세 칸을 모두 채웠는가 */
    function isDone(item) {
      var r = runOf(item.id);
      return (
        r.ran === true &&
        PC.schema.contentLength(r.predict) >= 4 &&
        PC.schema.contentLength(r.observation) >= minChars &&
        PC.schema.contentLength(r.surprise) >= 2
      );
    }

    var doneCount = L.EXPERIMENTS.filter(isDone).length;

    box.appendChild(
      UI.card(
        {
          eyebrow: "5단계 · 실행과 탐구",
          title: "주파수·길이·사이를 바꾸면 소리가 어떻게 달라질까?",
          desc:
            "세 가지 조건을 차례로 실험합니다. 실행하기 «전» 에 예상을 적고, 실행한 뒤 관찰을 적으세요. " +
            "★ 세 실험을 모두 실행하고 «빈칸을 다 채워야» 다음 단계가 열립니다. (지금 " +
            doneCount +
            " / " +
            L.EXPERIMENTS.length +
            ")"
        },
        [
          el("p", {
            class: "para",
            text:
              "쓰는 코드는 4단계에서 만든 여러분의 코드입니다. 실험마다 «한 가지» 만 바꾸어 넣습니다 — " +
              "A 는 높이, B 는 길이, C 는 사이입니다."
          })
        ]
      )
    );

    /* ------------------------------------------------------------------ */
    /* 실험 A · B · C                                                      */
    /* ------------------------------------------------------------------ */

    L.EXPERIMENTS.forEach(function (item, index) {
      var rec = runOf(item.id);
      var runner = makeRunner({ loopLimit: 6 });
      var afterHost = el("div");

      /* 앞 실험을 아직 실행하지 않았으면 이 실험은 잠근다 — 순서대로 하기 위해서다 */
      var prev = index === 0 ? null : L.EXPERIMENTS[index - 1];
      var locked = prev ? !runOf(prev.id).ran : false;

      var body = [];

      if (locked) {
        body.push(UI.alert("info", "먼저 " + prev.label + " 을(를) 실행해 주세요. 실험은 차례대로 합니다."));
        box.appendChild(
          UI.card(
            {
              eyebrow: item.label,
              title: titleFor(item),
              desc: item.ask
            },
            body
          )
        );
        return;
      }

      /* ① 예상 — 실행 전에 적는다 */
      var predictField = UI.field(
        {
          label: "① 실행하기 전 예상 : " + item.ask,
          min: 4,
          multiline: true,
          rows: 2,
          placeholder: "예) 켜진 시간이 짧아서 …"
        },
        rec.predict,
        function (value) {
          app.patch(function (s) {
            if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
            s.experiment.runs[item.id].predict = value;
          });
          /* 예상을 적으면 [실행] 이 열려야 하므로 그 단추만 다시 판단한다.
             왜 잠겼는지 알려 주던 설명도 함께 지운다 — 열린 단추에 남아 있으면 헷갈린다. */
          var tooShort = PC.schema.contentLength(value) < 4;
          runBtn.disabled = tooShort;
          runBtn.title = tooShort ? "먼저 예상을 적어 주세요." : "";
        }
      );
      body.push(predictField.root);

      /* ② 실행 */
      var runBtn = UI.button(rec.ran ? "다시 실행" : "실행하기", {
        disabled: PC.schema.contentLength(rec.predict) < 4,
        title: PC.schema.contentLength(rec.predict) < 4 ? "먼저 예상을 적어 주세요." : "",
        click: function () {
          /* 결과 값만 먼저 재어 둔다 — 그림은 다시 그린 뒤에 «애니메이션으로» 재생한다 */
          var result = A.run(sourceFor(item), { loopLimit: 6, speakerPin: PC.SPEAKER_PIN });

          app.patch(function (s) {
            if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
            s.experiment.runs[item.id].ran = true;
            s.experiment.runs[item.id].notes = (result.speaker && result.speaker.notes) || 0;
            s.experiment.runs[item.id].elapsed = result.elapsed;
          });

          /* 관찰 칸이 새로 생기고 다음 실험이 열리므로 화면을 다시 그려야 한다.
             ★ 다시 그린 뒤 이 실험 하나만 애니메이션으로 재생한다. */
          justRanExperiment = item.id;
          app.update(function () {});
        }
      });

      body.push(
        el("div", { class: "btnrow" }, [
          runBtn,
          el("p", {
            class: "btnrow__note",
            text: "여러분의 코드에서 " + titleFor(item) + " 바꾸어 실행합니다. 나머지는 그대로입니다."
          })
        ])
      );
      body.push(runner.viewHost);
      body.push(runner.panelHost);
      body.push(afterHost);

      /* ③ 관찰과 «예상과 다른 점» — 실행한 뒤에만 연다 */
      if (rec.ran) {
        body.push(
          UI.field(
            {
              label: "② 실행한 뒤 관찰 (" + minChars + "자 이상)",
              min: minChars,
              multiline: true,
              rows: 3,
              placeholder: "예) 같은 가락인데 훨씬 높게 들렸다."
            },
            rec.observation,
            function (value) {
              app.patch(function (s) {
                if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
                s.experiment.runs[item.id].observation = value;
              });
              /* 통과 조건이 바뀌므로 아래 [다음] 단추를 다시 판단한다 */
              app.rerenderNav();
            }
          ).root
        );

        body.push(
          UI.field(
            {
              label: "③ 예상과 다른 점 (없으면 «예상과 같았다» 라고 적으세요)",
              min: 2,
              multiline: true,
              rows: 2,
              placeholder: "예) 생각보다 훨씬 빨라 보였다."
            },
            rec.surprise,
            function (value) {
              app.patch(function (s) {
                if (!s.experiment.runs[item.id]) s.experiment.runs[item.id] = runOf(item.id);
                s.experiment.runs[item.id].surprise = value;
              });
              /* 이 칸도 통과 조건이므로 [다음] 단추를 다시 판단한다 */
              app.rerenderNav();
            }
          ).root
        );
      }

      box.appendChild(
        UI.card(
          {
            eyebrow: item.label + (isDone(item) ? " · 끝남" : rec.ran ? " · 실행함 (빈칸을 채우세요)" : ""),
            title: titleFor(item),
            desc: item.note
          },
          body
        )
      );

      /**
       * 이미 실행한 실험은 결과를 채워 둔다 — 다시 그려도 빈 칸이 되지 않게.
       * 방금 [실행] 을 누른 하나만 «애니메이션» 으로 재생하고 나머지는 즉시로 둔다.
       */
      if (rec.ran) {
        var animate = justRanExperiment === item.id;
        if (animate) justRanExperiment = "";
        runner.run(sourceFor(item), { instant: !animate });
        if (animate) {
          UI.clear(afterHost);
          afterHost.appendChild(
            UI.alert(
              "info",
              "실행 중입니다. 파형과 소리 시간표를 보고 아래에 관찰을 적어 주세요. " +
                "소리를 들으려면 [소리 켜기] 를 누르세요."
            )
          );
        }
      }
    });

    /* ------------------------------------------------------------------ */
    /* 세 실험 견주어 보기                                                  */
    /* ------------------------------------------------------------------ */

    var ranAny = L.EXPERIMENTS.filter(function (item) {
      return runOf(item.id).ran;
    });

    if (ranAny.length >= 2) {
      box.appendChild(
        UI.card({ title: "세 조건을 나란히 놓고 보기", desc: "같은 코드인데 숫자 하나씩만 달라졌습니다." }, [
          el("table", { class: "exptable" }, [
            el("thead", {}, [
              el("tr", {}, [
                el("th", { attrs: { scope: "col" }, text: "실험" }),
                el("th", { attrs: { scope: "col" }, text: "바꾼 것" }),
                el("th", { attrs: { scope: "col" }, text: "울린 음" }),
                el("th", { attrs: { scope: "col" }, text: "걸린 시간" }),
                el("th", { attrs: { scope: "col" }, text: "내가 적은 관찰" })
              ])
            ]),
            el(
              "tbody",
              {},
              L.EXPERIMENTS.map(function (item) {
                var r = runOf(item.id);
                return el("tr", { class: r.ran ? "" : "is-empty" }, [
                  el("th", { attrs: { scope: "row" }, text: item.label }),
                  el("td", { text: titleFor(item) }),
                  el("td", { text: r.ran ? (r.notes || 0) + "개" : "—" }),
                  el("td", { text: r.ran ? (r.elapsed || 0) + "ms" : "—" }),
                  el("td", { text: r.ran ? r.observation || "(아직 적지 않음)" : "(아직 실행하지 않음)" })
                ]);
              })
            )
          ])
        ])
      );
    }

    /* ------------------------------------------------------------------ */
    /* 알림음 설계 — 성공음 · 경고음 · 호출음 (명세 7장 화면5)               */
    /*                                                                    */
    /* ★ 세 가지를 모두 들어 본 뒤 «하나를 고른다».                        */
    /*   무엇을 알리는 소리인가에 따라 높이와 길이가 달라지는 것을 귀로 안다.  */
    /* ------------------------------------------------------------------ */

    var pickedKind = state.experiment.extensionKind || "";

    box.appendChild(
      UI.card(
        {
          eyebrow: "설계하기",
          title: "어떤 알림음을 만들까요?",
          desc: "셋을 모두 들어 보고 하나를 고르세요. 고른 것을 아래에서 직접 만들어 봅니다."
        },
        [
          S.audio.controls({}),
          el(
            "div",
            { class: "alertkinds" },
            L.ALERT_KINDS.map(function (kind) {
              var chosen = pickedKind === kind.id;
              return el("div", { class: "alertkind" + (chosen ? " alertkind--on" : "") }, [
                el("p", { class: "alertkind__head" }, [
                  el("span", { class: "alertkind__icon", attrs: { "aria-hidden": "true" }, text: kind.icon }),
                  el("span", { class: "alertkind__name", text: kind.label }),
                  chosen ? el("span", { class: "alertkind__pick", text: "✓ 고름" }) : null
                ]),
                el("p", { class: "alertkind__when", text: kind.when }),
                el("p", { class: "alertkind__recipe", text: "만드는 법 : " + kind.recipe }),
                melodyPlayer({ notes: kind.example, toneMs: kind.toneMs, stepMs: kind.stepMs }).root,
                el("p", { class: "alertkind__why", text: kind.why }),
                UI.button(chosen ? "고른 것" : "이것으로 만들기", {
                  class: "btn btn--small " + (chosen ? "btn--ghost" : "btn--primary"),
                  disabled: chosen,
                  click: function () {
                    app.update(function (st) {
                      st.experiment.extensionKind = kind.id;
                    });
                    UI.toast(kind.label + " 을(를) 골랐습니다. 아래에서 만들어 보세요.");
                  }
                })
              ]);
            })
          )
        ]
      )
    );

    /* ------------------------------------------------------------------ */
    /* 확장 활동 — 나만의 알림음 만들기 (명세 7장 화면5)                     */
    /*                                                                    */
    /* ★ «설계하기» 바로 아래에 둔다 — 셋 가운데 하나를 고른 학생이          */
    /*   그 자리에서 이어서 만들 수 있어야 한다.                             */
    /*                                                                    */
    /* ★★ 접어 두되 «눈에 띄게» 둔다.                                      */
    /*   여느 접기와 똑같이 생기면, 고르고 나서 무엇을 해야 하는지 보이지     */
    /*   않는다. 그래서 ① 색과 테두리를 주고 ② 고른 것이 있으면 «펼친 채»    */
    /*   시작하며 ③ 제목 옆에 고른 알림음을 적는다.                          */
    /*                                                                    */
    /* ★★ 코드 자리는 «하나» 다 — 빈칸 채우기.                             */
    /*   자유 편집기와 실행 화면에 같은 프로그램이 두 번 나오던 것을 걷어 냈다. */
    /*   그리고 뼈대는 주고 «정해야 하는 다섯 자리» 만 비운다.               */
    /*   빈 화면은 막막하고, 다 채워 주면 고칠 곳이 보이지 않기 때문이다.     */
    /* ------------------------------------------------------------------ */

    var X = L.EXTENSION;
    var extKind = null;
    L.ALERT_KINDS.forEach(function (k) {
      if (k.id === state.experiment.extensionKind) extKind = k;
    });

    var extRunner = makeRunner({ loopLimit: 3 });
    var extTpl = L.extensionTemplate(state.experiment.extensionKind);

    /**
     * ★★ 빈칸을 «정확히 채웠는지» 먼저 본다.
     *
     *   4단계의 코드 검사를 그대로 쓸 수 «없다» — 그쪽은 정해진 여덟 음의 음계를
     *   맞대어 보므로 «무엇을 적었는가» 까지 따진다. 여기는 학생이 자기 알림음을
     *   만드는 자리라 «짜임새가 맞는가» 만 본다(A.validateAlarm).
     *
     *   마지막 항목은 «실제로 돌려» 본다. delay 가 tone 보다 길어야 음이 갈라진다는
     *   이 차시의 알맹이는 줄을 세어서는 알 수 없고 시간표를 보아야 안다.
     */
    var extCheckHost = el("div", { class: "extcheck" });

    /* ★ 단추를 검사보다 «먼저» 만들어 둔다 — 검사가 곧바로 이 단추를 잠그거나 연다 */
    var extRunBtn = UI.button("확장 코드 실행", {
      class: "btn btn--ghost",
      disabled: true,
      click: function () {
        var source = extBlanks.getSource();
        extRunner.run(source, {});
        app.patch(function (s) {
          s.experiment.extensionTried = true;
          s.experiment.extensionBlanks = extBlanks.getValues();
          s.experiment.extensionSource = source;
        });
      }
    });

    function refreshExtCheck(source) {
      var result = A.validateAlarm(source);
      UI.clear(extCheckHost);

      extCheckHost.appendChild(
        el("p", {
          class: "extcheck__sum" + (result.ok ? " is-ok" : ""),
          text: result.ok
            ? "모두 통과했습니다 — 아래에서 실행해 보세요."
            : "여섯 항목 가운데 " + result.passed + "개 통과 — 아래에서 남은 것을 고쳐 보세요."
        })
      );

      if (result.error) {
        extCheckHost.appendChild(
          UI.alert("warn", result.error.line + "번 줄 — " + result.error.message)
        );
      }

      var list = el("ul", { class: "condlist" });
      result.tests.forEach(function (t) {
        list.appendChild(UI.conditionRow(t.label, t.ok, t.ok ? "" : t.message));
      });
      extCheckHost.appendChild(list);

      /* ★ 다 맞기 «전» 에는 실행하지 않는다 — 확인하고 나서 들어 본다 */
      if (extRunBtn) {
        extRunBtn.disabled = !result.ok;
        extRunBtn.className = "btn " + (result.ok ? "btn--primary" : "btn--ghost");
      }
      return result;
    }

    var extBlanks = ED.blanks(
      state.experiment.extensionBlanks,
      function (source, values) {
        app.patch(function (s) {
          s.experiment.extensionBlanks = values;
          s.experiment.extensionSource = source;
        });
        refreshExtCheck(source);
      },
      extTpl
    );

    refreshExtCheck(extBlanks.getSource());

    /* 고른 것 — 만들 재료를 «손 닿는 곳» 에 둔다. 힌트에 숫자를 적지 않는 까닭이다. */
    var extPicked = extKind
      ? el("div", { class: "extpick" }, [
          el("p", { class: "extpick__head" }, [
            el("span", { class: "extpick__icon", attrs: { "aria-hidden": "true" }, text: extKind.icon }),
            el("b", { class: "extpick__name", text: extKind.label }),
            el("span", { class: "extpick__when", text: extKind.when })
          ]),
          el("p", { class: "extpick__recipe", text: extKind.recipe }),
          el("dl", { class: "extpick__nums" }, [
            el("dt", { text: "보기 가락" }),
            el("dd", {
              text:
                extKind.example.map(function (nt) { return nt.name; }).join(" ") +
                " = " + extKind.example.map(function (nt) { return nt.hz; }).join(", ")
            }),
            el("dt", { text: "한 음" }),
            el("dd", { text: extKind.toneMs + "ms" }),
            el("dt", { text: "다음 음까지" }),
            el("dd", { text: extKind.stepMs + "ms (사이 " + (extKind.stepMs - extKind.toneMs) + "ms)" })
          ])
        ])
      : UI.alert("warn", "위 [어떤 알림음을 만들까요?] 에서 하나를 고르면, 그 알림음의 주파수와 길이가 여기에 나옵니다.");

    /* 펼쳤는지 접었는지를 «글자로» 알린다 — 화살표만으로는 뜻이 전해지지 않는다(명세 13장) */
    var extMore = el("span", { class: "extbox__more", attrs: { "aria-hidden": "true" } });

    var extSum = el("summary", { class: "extbox__sum" }, [
      el("span", { class: "extbox__icon", attrs: { "aria-hidden": "true" }, text: "🛠" }),
      el("span", { class: "extbox__label" }, [
        el("b", { class: "extbox__title", text: X.title }),
        el("small", {
          class: "extbox__note",
          text: extKind
            ? extKind.label + "을 골랐습니다 — 여기서 직접 코드로 만들어 보세요."
            : "고른 알림음을 직접 코드로 만들어 봅니다."
        })
      ]),
      extMore
    ]);

    var extBox = el(
      "details",
      {
        /* ★ 고른 것이 있으면 «펼친 채» 시작한다 — 이어서 할 일이 있다는 뜻이다 */
        class: "extbox" + (extKind ? " extbox--ready" : ""),
        attrs: extKind ? { open: "" } : {}
      },
      [
        extSum,
        el("div", { class: "extbox__body" }, [
          el("p", { class: "para", text: X.intro }),
          el("p", { class: "para", text: X.goal }),
          extPicked,
          el("ol", { class: "orderlist" }, X.steps.map(function (line) {
            return el("li", { text: line });
          })),
          UI.alert("info", X.hint),
          el("h4", { class: "extbox__h", text: "빈칸을 채워 만들어 보세요" }),
          el("p", {
            class: "extbox__lead",
            text: "회색 줄은 그대로 두고, 빈칸 다섯 곳만 적으면 됩니다. 딱지의 번호는 위 차례의 번호와 같습니다."
          }),
          extBlanks.root,
          el("h4", { class: "extbox__h", text: "빈칸을 정확히 채웠는지 확인합니다" }),
          extCheckHost,
          el("div", { class: "btnrow" }, [
            extRunBtn,
            el("p", { class: "btnrow__note", text: X.check })
          ]),
          extRunner.panelHost
        ])
      ]
    );

    function extLabel() {
      extMore.textContent = extBox.open ? "접기 ▴" : "펼치기 ▾";
    }
    extBox.addEventListener("toggle", extLabel);
    extLabel();
    box.appendChild(extBox);

    /* ------------------------------------------------------------------ */
    /* 예시 악보 — 음마다 «길이가 다르다» (명세 7장 화면5)                   */
    /*                                                                    */
    /* ★★ 여기까지의 예시는 모든 음이 «같은 길이» 였다. 악보는 그렇지 않다.   */
    /*   ♩ 과 ♪ 과 ♩. 이 섞여 있으므로                                     */
    /*     ① 길이를 담는 배열이 «하나 더» 필요하고                          */
    /*     ② tone 의 재생 시간과 delay 를 «음마다» 함께 정해야 한다.         */
    /*                                                                    */
    /* ★ 빠르기(UNIT)를 바꾸면 tone 과 delay 가 «함께» 달라진다.            */
    /*   하나만 따로 바꿀 수 없다는 것이 눈에 보이도록                        */
    /*   표·딱지·코드를 한꺼번에 다시 그린다.                                */
    /* ------------------------------------------------------------------ */

    var SH = L.SHEET;
    var sheetHost = el("div", { class: "sheet" });

    /**
     * 악보 한 줄.
     *
     * ★ 딱지에 계명과 «몇 ms 인가» 를 함께 적는다.
     *   계명만 있으면 «길이가 다르다» 는 것이 암기가 된다.
     *   숫자가 붙어 있어야 파 가 750, 미 가 250 인 것을 눈으로 본다.
     */
    function sheetLine(line, unitMs) {
      var gap = SH.gapMs;
      var total = 0;
      line.notes.forEach(function (nt) {
        total += nt.beats * unitMs;
      });

      var scope = S.audio.scope({ hz: 0 });
      var chips = [];
      var row = el("div", { class: "sheet__row" });

      line.notes.forEach(function (nt, i) {
        var dur = nt.beats * unitMs;
        var chip = el(
          "span",
          {
            class: "sheet__note",
            attrs: {
              /* ★ 주파수를 함께 적는다 — 악보의 이 음이 프로그램의 «어느 숫자» 인지 잇는다 */
              title:
                nt.label + " " + nt.value.name + " · " + nt.hz + "Hz(악보 " + nt.sci + " 의 한 옥타브 위) · " +
                nt.beats + "칸 · tone " + (dur - gap) + "ms · delay " + dur + "ms"
            }
          },
          [
            el("b", { class: "sheet__name", text: nt.label }),
            el("small", { class: "sheet__ms", text: dur + "ms" })
          ]
        );
        chips.push(chip);
        row.appendChild(chip);
        /* 마디를 갈라 그린다 — 줄 끝에는 세로줄을 두지 않는다 */
        if (line.barAt.indexOf(i + 1) !== -1 && i + 1 < line.notes.length) {
          row.appendChild(el("span", { class: "sheet__bar", attrs: { "aria-hidden": "true" }, text: "│" }));
        }
      });

      function mark(index) {
        chips.forEach(function (chip, i) {
          chip.className = "sheet__note" + (i === index ? " sheet__note--now" : "");
        });
      }

      var playing = null;
      var btn = UI.button("▶ 들어 보기", {
        class: "btn btn--ghost btn--small",
        click: function () {
          if (playing) {
            playing.stop();
            playing = null;
            btn.textContent = "▶ 들어 보기";
            mark(-1);
            scope.set(0);
            return;
          }
          /* 브라우저는 «누르기 전» 에는 소리를 내주지 않는다 */
          S.audio.unlock();
          btn.textContent = "■ 멈춤";
          playing = S.audio.melody(
            line.notes.map(function (nt) {
              /* ★ slotMs — 이 음이 «차지하는» 시간. 사이는 여기서 «빼서» 쓴다. */
              return { name: nt.label, hz: nt.hz, slotMs: nt.beats * unitMs };
            }),
            {
              gapMs: gap,
              onNote: function (index, note, hz) {
                mark(hz > 0 ? index : -1);
                scope.set(hz);
              },
              onDone: function () {
                playing = null;
                btn.textContent = "▶ 들어 보기";
                mark(-1);
                scope.set(0);
              }
            }
          );
        }
      });

      return el("div", { class: "sheet__line" }, [
        el("p", { class: "sheet__no", text: line.no }),
        row,
        el("div", { class: "btnrow" }, [
          btn,
          el("p", {
            class: "btnrow__note",
            text:
              "한 줄 " + (total / 1000).toFixed(1) + "초 · tone 은 «칸 × " + unitMs +
              " − " + gap + "» ms, delay 는 «칸 × " + unitMs + "» ms"
          })
        ]),
        scope.root
      ]);
    }

    /** 빠르기를 바꿀 때마다 표·딱지·코드를 함께 다시 그린다 */
    function fillSheet(unitMs) {
      UI.clear(sheetHost);

      /* ① 빠르기 — 한 칸(UNIT)의 길이를 고른다 */
      sheetHost.appendChild(
        el("div", { class: "tempo" }, [
          el("p", { class: "tempo__label", text: "빠르기 — 8분음표 한 칸(UNIT)" }),
          el(
            "div",
            { class: "tempo__btns" },
            L.TEMPOS.map(function (tp) {
              var on = tp.unitMs === unitMs;
              return UI.button(tp.label + " " + tp.unitMs + "ms", {
                class: "btn btn--small " + (on ? "btn--primary" : "btn--ghost"),
                title: tp.tempo,
                click: function () {
                  sheetUnitMs = tp.unitMs;
                  fillSheet(tp.unitMs);
                }
              });
            })
          ),
          el("p", {
            class: "tempo__note",
            text: "UNIT 하나를 바꾸면 tone 과 delay 가 함께 달라집니다. 한쪽만 바꾸면 박자가 어긋납니다."
          })
        ])
      );

      /* ② 음표를 «칸» 으로 세면 ms 가 나온다 */
      sheetHost.appendChild(
        el("table", { class: "exptable" }, [
          el("caption", {
            class: "exptable__cap",
            text: "음표를 «칸» 으로 세면 ms 가 나옵니다 (한 칸 = UNIT = " + unitMs + "ms, 사이 GAP = " + SH.gapMs + "ms)"
          }),
          el("thead", {}, [
            el("tr", {}, [
              el("th", { attrs: { scope: "col" }, text: "음표" }),
              el("th", { attrs: { scope: "col" }, text: "칸" }),
              el("th", { attrs: { scope: "col" }, text: "dur = 칸 × UNIT" }),
              el("th", { attrs: { scope: "col" }, text: "tone 의 셋째 값" }),
              el("th", { attrs: { scope: "col" }, text: "delay" })
            ])
          ]),
          el(
            "tbody",
            {},
            L.NOTE_VALUES.map(function (v) {
              var dur = v.beats * unitMs;
              return el("tr", {}, [
                el("th", { attrs: { scope: "row" }, text: (v.sym ? v.sym + " " : "") + v.name }),
                el("td", { text: v.beats + "칸" }),
                el("td", { text: dur + "ms" }),
                el("td", { class: "is-tone", text: dur + " − " + SH.gapMs + " = " + (dur - SH.gapMs) + "ms" }),
                el("td", { class: "is-delay", text: dur + "ms" })
              ]);
            })
          )
        ])
      );

      /* ③ 악보 — «그림» 을 먼저 보이고, 그 아래 계명·길이 딱지를 붙인다.
         수업 자료에서 본 것과 같은 모습이라야 «이 악보를 프로그램으로» 가 이어진다. */
      sheetHost.appendChild(S.figures.staff(SH));

      SH.lines.forEach(function (line) {
        sheetHost.appendChild(sheetLine(line, unitMs));
      });

      sheetHost.appendChild(
        el(
          "ul",
          { class: "sheet__reading" },
          SH.reading.map(function (t) {
            return el("li", { text: t });
          })
        )
      );

      /* ④ 프로그램 — 배열이 둘이다 */
      sheetHost.appendChild(
        el("div", { class: "sheet__prog" }, [
          el("h4", { class: "sheet__h", text: "프로그램 — 배열이 «둘» 입니다" }),
          el("p", {
            class: "sheet__lead",
            text: "주파수 배열 notes[] 와 길이 배열 beats[] 를 나란히 놓고, 같은 i 로 함께 꺼냅니다."
          }),
          UI.codeBlock(L.sheetCode(SH.lines[0], unitMs), SH.lines[0].no),
          UI.foldout("둘째 줄(" + SH.lines[1].no + ") 의 배열", function () {
            return UI.codeBlock(L.sheetCode(SH.lines[1], unitMs), SH.lines[1].no);
          })
        ])
      );

      /* ⑤ ★ 사이는 delay 에 더하는 것이 아니라 tone 에서 빼는 것이다 */
      sheetHost.appendChild(
        el("div", { class: "sheet__pit" }, [
          el("h4", {
            class: "sheet__h",
            text: "★ 사이(GAP)는 delay 에 «더하는» 것이 아니라 tone 에서 «빼는» 것입니다"
          }),
          el(
            "div",
            { class: "pitfalls" },
            SH.pitfalls.map(function (pf) {
              return el("div", { class: "pitfall " + (pf.ok ? "pitfall--ok" : "pitfall--bad") }, [
                el("p", { class: "pitfall__mark", text: pf.ok ? "○ 이렇게" : "✗ 이러면" }),
                el("pre", { class: "pitfall__code" }, [el("code", { text: pf.code })]),
                el("p", { class: "pitfall__symptom", text: pf.symptom }),
                el("p", { class: "pitfall__why", text: pf.why })
              ]);
            })
          )
        ])
      );

      sheetHost.appendChild(UI.alert("info", SH.key));
    }

    fillSheet(sheetUnitMs || SH.unitMs);

    box.appendChild(
      UI.card(
        {
          eyebrow: "예시 악보",
          title: "악보를 그대로 연주하기 — 음마다 길이가 다릅니다",
          desc:
            "지금까지는 모든 음이 " + PC.TONE_MS + "ms 로 같았습니다. " +
            "악보에는 ♩ 과 ♪ 과 ♩. 이 섞여 있어, 길이 배열을 하나 더 두고 tone 과 delay 를 음마다 정해야 합니다."
        },
        [sheetHost]
      )
    );

    return box;
  }

  /* ================================================================== */
  /* 6단계 — 형성평가·제출                                                */
  /*                                                                    */
  /* 짜임새를 lesson3_7_1 의 6단계와 «같게» 맞추었다.                      */
  /*   ① 형성평가            — 응시자 정보 → 문항 하나씩 → 채점·제출        */
  /*   ② 채점·제출 진행 상황  — 오른쪽 검은 창에 한 줄씩 기록               */
  /*   ③ 학습 정리            — 요약 · 핵심 문법 카드 · 내가 쓴 것 되돌아보기 */
  /*                                                                    */
  /* 문항을 «한 번에 하나» 만 보여 준다. 다섯 개를 한꺼번에 늘어놓으면        */
  /* 화면이 길어져 어디를 보아야 할지 알기 어렵다.                          */
  /* ================================================================== */

  var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

  /** ①②③ 이 붙은 구역 제목 */
  function sectionTitle(tag, text) {
    return el("h3", { class: "section-title" }, [
      el("span", { class: "section-title__tag", attrs: { "aria-hidden": "true" }, text: tag }),
      el("span", { text: text })
    ]);
  }

  /** 제목이 붙은 판 하나 */
  function panel(spec) {
    var s = spec || {};
    var body = el("div", { class: "panel__body stack" });
    var head =
      s.title || s.hint
        ? el("div", { class: "panel__head" }, [
            s.title ? el("h3", { class: "panel__title", text: s.title }) : null,
            s.hint ? el("p", { class: "panel__hint", text: s.hint }) : null
          ])
        : null;
    var root = el("section", { class: "panel" }, [head, body]);
    return { root: root, body: body };
  }

  /** 왼쪽·오른쪽 두 쪽 — 900px 아래에서는 위아래로 쌓인다 */
  function split(className) {
    var left = el("div", { class: "stack" });
    var right = el("div", { class: "stack" });
    return {
      root: el("div", { class: "split" + (className ? " " + className : "") }, [left, right]),
      left: left,
      right: right
    };
  }

  /** 작은 알림표 */
  function badge(kind, text) {
    var map = { true: "badge--true", false: "badge--false", primary: "badge--primary" };
    return el("span", { class: ("badge " + (map[kind] || "")).trim(), text: text });
  }

  /** 진행 상황을 한 줄씩 쌓는 검은 창 */
  function makeConsole(spec) {
    var s = spec || {};
    var body = el("div", {
      class: "console__body",
      attrs: { role: "log", "aria-live": "polite", "aria-label": s.ariaLabel || "채점·제출 진행 상황", tabindex: "0" }
    });
    var root = el("div", { class: "console" }, [
      el("div", { class: "console__head" }, [
        el("span", { class: "console__dot", attrs: { "aria-hidden": "true" } }),
        el("span", { text: s.title || "진행 기록" })
      ]),
      body
    ]);

    function showEmpty() {
      UI.clear(body).appendChild(el("p", { class: "console__empty", text: s.emptyText || "여기에 기록이 쌓입니다." }));
    }

    function line(text, modifier) {
      if (body.querySelector(".console__empty")) UI.clear(body);
      body.appendChild(
        el("div", { class: ("console__line " + (modifier || "")).trim() }, [
          el("span", { class: "console__prompt", attrs: { "aria-hidden": "true" }, text: ">" }),
          el("span", { class: "console__text", text: text })
        ])
      );
      body.scrollTop = body.scrollHeight;
    }

    showEmpty();

    return {
      root: root,
      write: function (t) { line(t); },
      ok: function (t) { line(t, "console__line--ok"); },
      hint: function (t) { line(t, "console__line--hint"); },
      error: function (t) { line(t, "console__line--error"); },
      muted: function (t) { line(t, "console__line--muted"); }
    };
  }

  function renderAssess(state, app) {
    var box = el("div");
    var Q = PC.quiz;
    var answers = state.assessment.answers;
    var total = Q.QUESTIONS.length;

    /* 답안을 냈는가 — 냈으면 답을 고칠 수 없고, 그때 비로소 채점이 열린다 */
    var sealed = state.assessment.sealed === true;

    /** 이 문항에 답을 했는가 */
    function isAnswered(q) {
      var v = answers[q.id];
      if (q.type === "choice") return typeof v === "number" && v >= 0;
      return String(v === undefined || v === null ? "" : v).trim().length > 0;
    }

    /* ---------------- ② 진행 상황 창 (오른쪽) ---------------- */

    var cons = makeConsole({
      title: "채점·제출 기록",
      emptyText: "학번과 이름을 넣고 문항에 답하면 여기에 기록이 쌓입니다."
    });

    /* ---------------- 응시자 정보 ---------------- */

    var idInput = el("input", {
      class: "student-field__input",
      id: "assess-sid",
      attrs: { type: "text", inputmode: "numeric", maxlength: "5", placeholder: "예) 10312", autocomplete: "off" }
    });
    idInput.value = state.student.studentId || "";

    var nameInput = el("input", {
      class: "student-field__input",
      id: "assess-name",
      attrs: { type: "text", maxlength: "20", placeholder: "예) 홍길동", autocomplete: "off" }
    });
    nameInput.value = state.student.name || "";

    var studentNote = el("p", { class: "student-card__note", attrs: { role: "status" } });

    var studentCard = el("div", { class: "student-card" }, [
      el("div", { class: "student-card__head" }, [
        el("h4", { class: "student-card__title", text: "응시자 정보" }),
        el("span", { class: "student-card__badge", text: "제출 전 필수" })
      ]),
      el("div", { class: "student-card__fields" }, [
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-sid" }, text: "학번 (5자리)" }),
          idInput
        ]),
        el("div", { class: "student-field" }, [
          el("label", { class: "student-field__label", attrs: { for: "assess-name" }, text: "이름" }),
          nameInput
        ])
      ]),
      studentNote,
      el("p", { class: "student-card__privacy", text: "1학년 3반 12번이면 10312 입니다. 학번과 이름은 제출한 답을 알아보는 데에만 씁니다." })
    ]);

    var gate = el("div", { class: "quiz-gate" }, [
      el("span", { class: "quiz-gate__icon", attrs: { "aria-hidden": "true" }, text: "🔒" }),
      el("span", { text: "학번과 이름을 넣으면 문항이 열립니다." })
    ]);

    /* ---------------- 화면이 들어갈 자리 ---------------- */

    var quizBody = el("div", { class: "quiz__body" });
    /* 단추 넷을 «한 줄» 에 놓는다.
       이동 단추의 글자를 「← 이전」·「다음 →」 로 줄여 자리를 만들었다.
       바로 위에 「문항 N / 5」 가 있어 무엇을 옮기는 것인지 알 수 있다.
       (이 이름은 교사용 아래쪽 이동 단추와도 같다) */
    var actionRow = el("div", { class: "btnrow btnrow--one" });
    var actionNote = el("p", { class: "quiz__note" });
    var messageHost = el("div");

    /* 지금 보고 있는 문항 — 아직 답하지 않은 첫 문항에서 시작한다 */
    var current = 0;
    for (var qi = 0; qi < total; qi++) {
      if (!isAnswered(Q.QUESTIONS[qi])) {
        current = qi;
        break;
      }
    }

    function ready() {
      return PC.schema.validateStudent(state.student).ok;
    }

    /* ---------------- 단추들 ---------------- */

    var prevBtn = UI.button("← 이전", {
      class: "btn btn--ghost",
      click: function () {
        if (current > 0) {
          current -= 1;
          drawQuestion();
        }
      }
    });

    var nextBtn = UI.button("다음 →", {
      class: "btn btn--ghost",
      click: function () {
        if (current < total - 1) {
          current += 1;
          drawQuestion();
        }
      }
    });

    /**
     * ★ 채점은 «답안을 낸 뒤에만» 열린다.
     *
     * 정답과 해설을 먼저 본 뒤에 답을 고쳐 내면 형성평가가 아무 뜻이 없어진다.
     * 그래서 답안을 잠근(`assessment.sealed`) 다음에 비로소 이 단추가 열린다.
     * 잠기는 길은 두 가지 — 서버로 제출하거나, JSON 파일로 받아 내는 것.
     */
    var gradeBtn = UI.button("채점하기", {
      click: function () {
        if (state.assessment.sealed !== true) return; /* 두 겹으로 막는다 */
        app.update(function (s) {
          s.assessment.graded = true;
          s.assessment.attempts += 1;
        });
      }
    });

    /* 답안을 낸 뒤에는 «고치기» 가 아니라 «다시 보기» 다 */
    var retryBtn = UI.button(sealed ? "내 답 다시 보기" : "답 고치기", {
      class: "btn btn--ghost",
      click: function () {
        app.update(function (s) {
          s.assessment.graded = false;
        });
      }
    });

    /* 제출 주소 칸 — 설정에 주소가 없을 때만 (명세 10장) */
    var endpointField = null;
    if (PC.config.needsUrlInput()) {
      endpointField = UI.field(
        {
          label: "제출 주소",
          help: "선생님이 알려 주신 주소를 붙여 넣으세요. 한 번 넣으면 이 기기에 기억됩니다.",
          placeholder: "https://script.google.com/.../exec"
        },
        S.store.loadEndpoint(),
        function (value) {
          S.store.saveEndpoint(value);
        }
      );
    }

    /* -------------- 제출 — «한 번만» 이므로 한 번 더 물어본다 -------------- */

    var busy = false;

    /* 제출 전에 눈에 띄게 알린다. 잠긴 뒤에는 감춘다. */
    var onceNote = UI.alert("warn", "답안은 «한 번만» 제출할 수 있습니다.", [
      el("p", {
        class: "alert__fix",
        text:
          "제출한 뒤에는 답을 고칠 수 없습니다. 다섯 문항을 모두 다시 살펴본 뒤에 누르세요. " +
          "제출하면 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다."
      })
    ]);

    /* 되묻는 상자가 놓이는 자리 — 단추 바로 아래에 나타난다 */
    var confirmHost = el("div");

    function closeConfirm() {
      UI.clear(confirmHost);
      refreshActions();
    }

    /**
     * 되돌릴 수 없는 일을 하기 전에 한 번 더 묻는다.
     * 브라우저 confirm() 을 쓰지 않는다 — 화면 읽기 도구와 잘 맞지 않고 모양도 다르다.
     */
    function askConfirm(spec) {
      UI.clear(confirmHost);
      submitBtn.disabled = true;
      downloadBtn.disabled = true;

      var okBtn = UI.button(spec.okLabel, {
        click: function () {
          UI.clear(confirmHost);
          spec.onOk();
        }
      });

      confirmHost.appendChild(
        UI.alert("warn", spec.message, [
          el("p", { class: "alert__fix", text: spec.detail }),
          el("div", { class: "btnrow" }, [
            okBtn,
            UI.button("아니요, 더 확인하겠습니다", { class: "btn btn--ghost", click: closeConfirm })
          ])
        ])
      );
      okBtn.focus();
    }

    /** 낼 수 있는 상태인가 — 서버 제출과 파일 제출이 같은 조건을 쓴다 */
    function guard() {
      var check = PC.schema.validateStudent(state.student);
      if (!check.ok) {
        refreshGate();
        cons.error("학번과 이름을 먼저 바르게 넣어 주세요.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "학번과 이름을 먼저 바르게 넣어 주세요."));
        return false;
      }
      if (!Q.gradeAll(state.assessment.answers).allAnswered) {
        cons.error("답하지 않은 문항이 있습니다.");
        UI.clear(messageHost).appendChild(UI.alert("warn", "다섯 문항에 모두 답해야 제출할 수 있습니다."));
        return false;
      }
      return true;
    }

    function doSend() {
      busy = true;
      UI.clear(messageHost);
      refreshActions();
      submitBtn.textContent = "제출 중…";

      var payload = PC.schema.buildPayload(state);
      S.store.saveStudent(state.student);
      cons.write("제출을 시작합니다 — " + S.api.fileNameFor(payload));

      S.api.submit(payload, endpointField ? endpointField.input.value : "").then(function (result) {
        busy = false;

        if (result.ok) {
          cons.ok(
            (result.updated ? "이전 제출을 덮어썼습니다 — " : "저장을 마쳤습니다 — ") +
              (result.fileName || S.api.fileNameFor(payload))
          );
          cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
          app.update(function (s) {
            s.submissionId = result.submissionId || "";
            s.submitted = {
              at: result.serverUpdatedAt || new Date().toISOString(),
              demo: result.demo === true,
              via: "server"
            };
            /* ★ 여기서 답안이 잠긴다 */
            s.assessment.sealed = true;
          });
          UI.toast("제출했습니다. 이제 채점할 수 있습니다.");
          return;
        }

        /* 실패했을 때는 «잠그지 않는다». 고쳐서 다시 낼 수 있어야 한다.
           답안도 버리지 않는다 — 임시 저장에 남기고 «파일로 내는 길» 을 그 자리에서 준다.
           단추를 늘 내보이지 않는 까닭 : 평소에는 서버로 내는 길 하나만 보이는 것이 헷갈리지 않다. */
        S.store.queuePending(payload);
        cons.error("제출 실패 — " + result.message);
        cons.hint("[파일로 내기] 로 파일을 받아 선생님께 내도 됩니다.");
        UI.clear(messageHost).appendChild(
          UI.alert("warn", result.message, [
            el("p", {
              class: "alert__fix",
              text: "아래 [파일로 내기] 로 파일을 받아 선생님께 내도 됩니다. 아직 제출되지 않았으니 답은 그대로 남아 있습니다."
            }),
            el("div", { class: "btnrow" }, [downloadBtn])
          ])
        );
        refreshActions();
      });
    }

    function doDownload() {
      var payload = PC.schema.buildPayload(state);
      if (!S.api.download(payload)) {
        cons.error("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        UI.toast("이 브라우저에서는 내려받기를 쓸 수 없습니다.");
        refreshActions();
        return;
      }

      cons.write("파일로 냈습니다 — " + S.api.fileNameFor(payload));
      UI.toast("파일을 내려받았습니다. 선생님께 내 주세요.");

      if (state.assessment.sealed !== true) {
        cons.hint("이제 [채점하기] 로 점수와 해설을 볼 수 있습니다.");
        S.store.saveStudent(state.student);
        app.update(function (s) {
          /* ★ 파일로 내는 것도 제출이다. 여기서도 답안이 잠긴다. */
          s.assessment.sealed = true;
        });
        return;
      }
      refreshActions();
    }

    var submitBtn = UI.button("답안 제출하기", {
      click: function () {
        if (busy) return;

        if (state.submitted) {
          UI.clear(messageHost).appendChild(
            UI.alert("info", "이미 제출을 마쳤습니다. 답안은 한 번만 제출할 수 있습니다.")
          );
          return;
        }
        if (!guard()) return;

        askConfirm({
          message: "정말 제출할까요? 답안은 한 번만 제출할 수 있습니다.",
          detail: "제출한 뒤에는 답을 고칠 수 없습니다. 대신 [채점하기] 가 열려 점수와 해설을 볼 수 있습니다.",
          okLabel: "예, 제출합니다",
          onOk: doSend
        });
      }
    });

    /**
     * 파일로 내는 길 (명세 10장).
     *
     * ★ 단추 줄에는 놓지 않는다. 서버 제출이 실패했을 때 그 알림 상자 안에 나타난다.
     *   평소에는 «답안 제출하기» 하나만 보이는 것이 학생에게 헷갈리지 않고,
     *   주소가 없는 학생도 제출을 눌러 보면 이 길을 만나므로 막다른 길이 되지 않는다.
     *
     * 누르는 자리를 44px 로 지키려고 btn--small 을 쓰지 않는다 (명세 접근성).
     */
    var downloadBtn = UI.button("파일로 내기", {
      class: "btn btn--ghost",
      click: function () {
        if (busy) return;
        if (!guard()) return;

        /* 이미 잠긴 뒤라면 그냥 한 번 더 받는 것이므로 되묻지 않는다 */
        if (state.assessment.sealed === true) {
          doDownload();
          return;
        }

        askConfirm({
          message: "이 파일이 곧 제출물입니다. 내려받으면 답을 고칠 수 없습니다.",
          detail: "받은 파일을 선생님께 내야 합니다. 내려받으면 [채점하기] 가 열립니다.",
          okLabel: "예, 내려받습니다",
          onOk: doDownload
        });
      }
    });

    /* ---------------- 잠금·단추 상태 새로 고치기 ---------------- */

    function refreshGate() {
      var check = PC.schema.validateStudent(state.student);
      var ok = check.ok;

      studentCard.className = "student-card" + (ok ? " is-ready" : "");
      idInput.className = "student-field__input" + (state.student.studentId && check.errors.studentId ? " is-invalid" : "");
      nameInput.className = "student-field__input" + (state.student.name && check.errors.name ? " is-invalid" : "");

      studentNote.className = "student-card__note" + (ok ? " is-ok" : "");
      studentNote.textContent = ok
        ? "확인되었습니다 — " + state.student.studentId + " " + state.student.name
        : check.errors.studentId || check.errors.name || "학번과 이름을 넣어 주세요.";

      gate.hidden = ok;
      quizBody.className = "quiz__body" + (ok ? "" : " is-gated");

      refreshActions();
    }

    function refreshActions() {
      var now = Q.gradeAll(state.assessment.answers);
      var ok = ready();
      var locked = state.assessment.sealed === true; /* 답안을 냈다 */
      var sentToServer = !!state.submitted;
      var canHandIn = ok && now.allAnswered;

      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === total - 1;

      /* ★ 채점은 답안을 낸 뒤에만 열린다 */
      gradeBtn.disabled = !locked;
      gradeBtn.title = locked ? "" : "답안을 제출한 뒤에 채점 결과를 볼 수 있습니다.";

      submitBtn.disabled = busy || sentToServer || !canHandIn;
      submitBtn.title = sentToServer
        ? "답안은 한 번만 제출할 수 있습니다."
        : canHandIn
          ? ""
          : "학번·이름을 넣고 다섯 문항에 모두 답해야 제출할 수 있습니다.";
      if (!busy) submitBtn.textContent = sentToServer ? "제출 완료" : "답안 제출하기";

      downloadBtn.disabled = busy || !canHandIn;
      downloadBtn.title = canHandIn ? "" : "학번·이름을 넣고 다섯 문항에 모두 답해야 파일로 낼 수 있습니다.";

      /* 제출 전 경고는 아직 내지 않았을 때만 */
      onceNote.hidden = locked;

      var lines = [];
      if (!ok) lines.push("학번과 이름을 넣어야 제출할 수 있습니다.");
      if (!now.allAnswered) {
        lines.push("답한 문항 " + now.answeredCount + " / " + total + " — 모두 답하면 [답안 제출하기] 가 열립니다.");
      }
      if (locked) {
        lines.push("답안을 냈으므로 답을 고칠 수 없습니다. [채점하기] 로 점수와 해설을 볼 수 있습니다.");
      } else if (canHandIn) {
        lines.push("다섯 문항에 모두 답했습니다. 제출은 «한 번만» 할 수 있고, 제출한 뒤에 [채점하기] 가 열립니다.");
      }
      actionNote.textContent = lines.join(" ");
    }

    /* ---------------- 문항 하나 그리기 ---------------- */

    function pick(q, index) {
      if (state.assessment.sealed === true) return; /* 낸 뒤에는 고칠 수 없다 */
      app.patch(function (s) {
        s.assessment.answers[q.id] = index;
      });
      cons.write(q.no + "번 — " + (CIRCLED[index] || index + 1) + " 선택");
      app.rerenderNav();
      drawQuestion();
    }

    function drawQuestion() {
      UI.clear(quizBody);
      var q = Q.QUESTIONS[current];

      /* 문항 번호와 진행 점 */
      var dots = el("div", { class: "quiz__dots" });
      Q.QUESTIONS.forEach(function (item, i) {
        var done = isAnswered(item);
        dots.appendChild(
          el("button", {
            class: "quiz__dot" + (done ? " is-answered" : "") + (i === current ? " is-current" : ""),
            attrs: {
              type: "button",
              "aria-label": item.no + "번 문항으로 이동" + (done ? " (답함)" : " (아직 답하지 않음)"),
              "aria-current": i === current ? "true" : null
            },
            on: {
              click: function () {
                current = i;
                drawQuestion();
              }
            }
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "quiz__meta" }, [
          el("span", { class: "quiz__counter", text: "문항 " + (current + 1) + " / " + total }),
          dots
        ])
      );

      /* 무엇을 묻는 문항인지 알려 주는 딱지.
         5번은 tag 가 이미 «완성형» 이라 형식 딱지와 겹친다 — 겹치면 하나만 붙인다. */
      var kind = q.type === "choice" ? "객관식" : "완성형";
      quizBody.appendChild(
        el("div", { class: "quiz__tags" }, [
          badge("primary", q.tag),
          kind === q.tag ? null : badge("", kind),
          badge("", q.points + "점")
        ].filter(Boolean))
      );

      quizBody.appendChild(
        el("p", { class: "quiz__question" }, [
          el("span", { class: "quiz__no", text: q.no + "." }),
          el("span", { text: q.stem })
        ])
      );

      if (q.code) quizBody.appendChild(ED.codeView(q.code, {}).root);

      /* 답안을 낸 뒤에는 «읽기만» 된다. 정답을 본 뒤 고쳐 내는 일을 막는다. */
      var locked = state.assessment.sealed === true;

      if (q.type === "choice") {
        var options = el("div", { class: "options" });
        q.choices.forEach(function (choice, i) {
          var picked = answers[q.id] === i;
          var radio = el("input", { attrs: { type: "radio", name: "quiz-" + q.id, value: String(i) } });
          radio.checked = picked;
          radio.disabled = locked;
          radio.addEventListener("change", function () {
            pick(q, i);
          });
          options.appendChild(
            el("label", { class: "option" + (picked ? " is-selected" : "") + (locked ? " option--locked" : "") }, [
              radio,
              el("span", { class: "option__num", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
              el("span", { class: "option__text", text: choice })
            ])
          );
        });
        quizBody.appendChild(options);
      } else {
        quizBody.appendChild(UI.codeBlock(q.template, "빈칸 두 줄을 채우세요."));

        var lint = el("div", { class: "lint" });
        function drawLint(value) {
          UI.clear(lint);
          Q.lintCodeAnswer(value).forEach(function (note) {
            lint.appendChild(UI.alert(note.level === "warn" ? "warn" : "info", note.message));
          });
        }

        var codeField = UI.field(
          { label: "빠진 두 줄", help: q.help, multiline: true, rows: 3, mono: true, placeholder: q.placeholder },
          answers[q.id] || "",
          function (value) {
            app.patch(function (s) {
              s.assessment.answers[q.id] = value;
            });
            drawLint(value);
            app.rerenderNav();
            refreshActions();
            /* 점을 채우려면 다시 그려야 하지만, 글을 쓰는 중에 다시 그리면
               글자를 넣던 자리를 잃는다. 점만 손으로 고친다. */
            var marks = quizBody.querySelectorAll(".quiz__dot");
            if (marks[current]) {
              marks[current].className =
                "quiz__dot is-current" + (String(value || "").trim() ? " is-answered" : "");
            }
          }
        );
        codeField.input.readOnly = locked;
        quizBody.appendChild(codeField.root);
        quizBody.appendChild(lint);
        drawLint(answers[q.id] || "");
      }

      quizBody.appendChild(
        el("p", {
          class: "quiz__note",
          text: locked
            ? "답안을 냈으므로 고칠 수 없습니다. 점을 눌러 내가 낸 답을 확인할 수 있어요."
            : q.type === "choice"
              ? "고른 답은 곧바로 저장됩니다. 점을 눌러 다른 문항으로 건너갈 수 있어요."
              : "세미콜론(;) 과 대소문자까지 그대로 지켜야 맞습니다."
        })
      );

      refreshActions();
    }

    /* ---------------- 채점 결과 그리기 ---------------- */

    function drawResult() {
      UI.clear(quizBody);
      quizBody.className = "quiz__body";

      var revealed = Q.reveal(state.assessment.answers);
      if (!revealed.allowed) {
        quizBody.appendChild(UI.alert("info", revealed.reason));
        return;
      }

      var g = revealed.graded;
      var okCount = 0;
      revealed.items.forEach(function (item) {
        if (item.correct) okCount += 1;
      });

      var marks = el("div", { class: "score-dots" });
      revealed.items.forEach(function (item) {
        marks.appendChild(
          el("span", {
            class: "score-dot" + (item.correct ? " is-correct" : ""),
            attrs: { "aria-label": item.no + "번 " + (item.correct ? "맞음" : "틀림") },
            text: item.correct ? "○" : "✕"
          })
        );
      });

      quizBody.appendChild(
        el("div", { class: "score-card" }, [
          el("p", { class: "score-card__title", text: "형성평가 결과" }),
          el("p", { class: "score-card__student" }, [
            el("strong", { text: state.student.studentId || "학번 미입력" }),
            el("span", { text: " " + (state.student.name || "") })
          ]),
          el("p", { class: "score-card__value" }, [
            el("span", { text: String(g.score) }),
            el("small", { text: " / " + g.total + "점" })
          ]),
          marks,
          el("p", { class: "score-card__count", text: "맞힌 문항 " + okCount + " / " + total }),
          el("p", { class: "score-card__level" }, [
            el("span", { text: "판정 : " }),
            el("strong", { text: g.pass ? "이수" : "미이수" }),
            el("span", { text: g.pass ? "" : " (6점 이상 필요)" })
          ]),
          el("p", {
            class: "score-card__comment",
            text: g.pass
              ? "잘했어요. 아래 해설로 한 번 더 확인해 보세요."
              : "괜찮아요. 해설을 읽고 [답 고치기] 로 다시 풀 수 있습니다."
          })
        ])
      );

      quizBody.appendChild(el("h4", { class: "subhead", text: "문항별 해설" }));
      revealed.items.forEach(function (item) {
        quizBody.appendChild(
          el("div", { class: "review" + (item.correct ? " review--ok" : "") }, [
            el("p", { class: "review__head" }, [
              el("span", { class: "review__mark", attrs: { "aria-hidden": "true" }, text: item.correct ? "✔" : "✘" }),
              el("span", { class: "review__no", text: item.no + "번" }),
              el("span", { class: "review__state", text: item.correct ? "맞음" : "틀림" })
            ]),
            el("p", { class: "review__stem", text: item.stem }),
            el("p", { class: "review__answer", text: "정답 : " + item.answerText }),
            el("p", { class: "review__why", text: item.explanation })
          ])
        );
      });
    }

    /* ---------------- ① 형성평가 ---------------- */

    box.appendChild(sectionTitle("①", "형성평가"));

    var top = split("split--wide-left");

    var quizPanel = panel({
      title: "5문항 · 총 10점",
      hint: "6점 이상이면 이수입니다."
    });
