    <!-- 소리 내기와 오실로스코프 (이 차시에서 새로 늘었다) -->
    <script data-from="student/s35-audio.js">
/**
 * 소리 내기와 오실로스코프 (명세 6.3 · 13장)
 *
 * ★ 브라우저는 «학생이 누르기 전» 에는 소리를 내주지 않는다(자동 재생 제한).
 *   그래서 소리를 내는 길은 반드시 [소리 켜기] 를 한 번 거치게 되어 있다(명세 12장).
 *   unlock() 을 부르기 전에는 play() 를 불러도 아무 일도 일어나지 않는다.
 *
 * ★ 소리는 «곁들이는 것» 이다. 소리가 나지 않는 기기에서도 학습이 끊기지 않도록
 *   파형·음이름·주파수 숫자가 늘 함께 나온다(명세 13장 «색만으로 뜻을 전하지 않는다» 와 같은 뜻).
 *
 * ★ 실제 피에조는 «네모 물결(구형파)» 을 낸다. 사인파보다 거칠고 날카로운 그 소리를
 *   그대로 들려주어야 실물과 같은 인상을 준다. 그래서 oscillator 를 square 로 둔다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  var UI = S.ui;

  /** SVG 안의 글자 — UI.svg 는 문자열 자식을 받지 않으므로 마디로 만들어 넘긴다 */
  function txt(value) {
    return document.createTextNode(String(value));
  }

  var FREQ_MIN = PC.FREQ_MIN || 31;
  var FREQ_MAX = PC.FREQ_MAX || 4000;

  /* ------------------------------------------------------------------ */
  /* 1. 소리 만들기                                                       */
  /* ------------------------------------------------------------------ */

  var ctx = null;
  var master = null;
  var osc = null;
  var unlocked = false;
  var muted = false;
  var volume = 0.25; /* 교실에서 여럿이 켜므로 «작게» 시작한다 */
  var listeners = [];

  /** 이 브라우저가 소리를 만들 수 있는가 */
  function supported() {
    return typeof root.AudioContext === "function" || typeof root.webkitAudioContext === "function";
  }

  function notify() {
    listeners.forEach(function (fn) {
      try {
        fn(status());
      } catch (err) {
        /* 듣는 이 하나가 잘못되어도 소리는 계속 나야 한다 */
      }
    });
  }

  /**
   * 소리를 연다 — 반드시 «학생이 누른» 자리에서 불러야 한다(명세 6.3).
   * 돌려주는 것 : 열렸는가(boolean)
   */
  function unlock() {
    if (!supported()) return false;
    if (unlocked && ctx) {
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      return true;
    }
    try {
      var Ctor = root.AudioContext || root.webkitAudioContext;
      ctx = new Ctor();
      master = ctx.createGain();
      master.gain.value = 0; /* 조용한 상태로 열어 둔다 — 여는 순간 «삑» 하지 않게 */
      master.connect(ctx.destination);
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      unlocked = true;
      notify();
      return true;
    } catch (err) {
      ctx = null;
      unlocked = false;
      return false;
    }
  }

  function isUnlocked() {
    return unlocked === true && ctx !== null;
  }

  /** 지금 실제로 소리가 나갈 세기 */
  function gainNow() {
    return muted ? 0 : volume;
  }

  /**
   * 그 주파수로 울린다. hz 가 0 이하면 멈춘다.
   * 소리를 열지 않았으면 «아무 일도 하지 않는다» — 조용히 넘어간다.
   */
  function play(hz) {
    if (!isUnlocked()) return false;
    var freq = Math.round(Number(hz) || 0);
    if (!(freq > 0)) {
      stop();
      return false;
    }
    freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, freq));

    var now = ctx.currentTime;
    if (!osc) {
      osc = ctx.createOscillator();
      /* 실제 피에조와 같은 네모 물결 */
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, now);
      osc.connect(master);
      osc.start();
    } else {
      osc.frequency.setValueAtTime(freq, now);
    }
    /* 갑자기 켜면 «툭» 소리가 난다. 아주 짧게 올린다. */
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(gainNow(), now + 0.006);
    return true;
  }

  /** 소리를 멈춘다 (진동자는 남겨 두었다가 다시 쓴다) */
  function stop() {
    if (!isUnlocked() || !master) return;
    var now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + 0.008);
  }

  /** 화면을 떠날 때 — 소리가 남지 않게 확실히 끊는다 */
  function shutdown() {
    stop();
    if (osc) {
      try {
        osc.stop(ctx.currentTime + 0.02);
      } catch (err) {
        /* 이미 멈춘 것은 그냥 둔다 */
      }
      osc = null;
    }
  }

  function setMuted(value) {
    muted = value === true;
    if (muted) stop();
    notify();
  }

  function setVolume(value) {
    var v = Number(value);
    volume = isNaN(v) ? 0.25 : Math.max(0, Math.min(1, v));
    if (isUnlocked() && master && master.gain.value > 0) {
      master.gain.setValueAtTime(gainNow(), ctx.currentTime);
    }
    notify();
  }

  function status() {
    return {
      supported: supported(),
      unlocked: isUnlocked(),
      muted: muted,
      volume: volume
    };
  }

  function onChange(fn) {
    if (typeof fn === "function") listeners.push(fn);
  }

  /* ------------------------------------------------------------------ */
  /* 2. 소리 조절 상자 — [소리 켜기] · 음소거 · 볼륨 (명세 6.3)             */
  /* ------------------------------------------------------------------ */

  /**
   * 어느 화면에나 붙일 수 있는 조절 상자를 만든다.
   *   opts.note  : 상자 아래에 덧붙일 한 줄
   *   opts.onUnlock : 소리가 열린 순간 한 번 부른다 (미리 듣기 등)
   */
  function controls(opts) {
    var o = opts || {};
    var MSG = PC.MESSAGES || {};

    if (!supported()) {
      return UI.el("div", { class: "audiobar audiobar--off" }, [
        UI.el("p", { class: "audiobar__note", text: MSG.audioUnsupported || "이 브라우저에서는 소리를 만들 수 없습니다." })
      ]);
    }

    var stateText = UI.el("span", { class: "audiobar__state", text: "" });

    var unlockBtn = UI.button("🔈 소리 켜기", {
      class: "btn btn--primary btn--small",
      click: function () {
        if (unlock()) {
          UI.toast("소리를 켰습니다. 볼륨을 낮게 두고 시작하세요.");
          if (o.onUnlock) o.onUnlock();
        } else {
          UI.toast("이 브라우저에서는 소리를 만들 수 없습니다.");
        }
        paint();
      }
    });

    var muteBtn = UI.button("음소거", {
      class: "btn btn--ghost btn--small",
      click: function () {
        setMuted(!muted);
        paint();
      }
    });

    var slider = UI.el("input", {
      class: "audiobar__range",
      attrs: {
        type: "range",
        min: "0",
        max: "100",
        step: "5",
        value: String(Math.round(volume * 100)),
        "aria-label": "소리 크기"
      }
    });
    slider.addEventListener("input", function () {
      setVolume(Number(slider.value) / 100);
      paint();
    });

    var volText = UI.el("span", { class: "audiobar__vol", text: "" });

    function paint() {
      var st = status();
      unlockBtn.disabled = st.unlocked;
      unlockBtn.textContent = st.unlocked ? "🔈 소리 켜짐" : "🔈 소리 켜기";
      muteBtn.disabled = !st.unlocked;
      muteBtn.textContent = st.muted ? "🔇 음소거 해제" : "🔊 음소거";
      slider.disabled = !st.unlocked || st.muted;
      volText.textContent = Math.round(st.volume * 100) + "%";
      /* 색만으로 알리지 않는다 — 지금 상태를 «글자» 로 적는다(명세 13장) */
      stateText.textContent = !st.unlocked
        ? "소리 꺼짐 — 아직 들리지 않습니다"
        : st.muted
        ? "음소거 — 파형만 움직입니다"
        : "소리 켜짐";
    }

    var bar = UI.el("div", { class: "audiobar" }, [
      UI.el("div", { class: "audiobar__row" }, [unlockBtn, muteBtn, slider, volText, stateText]),
      UI.el("p", {
        class: "audiobar__note",
        text: o.note || MSG.audioLocked || "브라우저는 «누르기 전» 에는 소리를 내지 않습니다."
      })
    ]);

    paint();
    onChange(paint);
    return bar;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 가상 오실로스코프 (명세 6.3)                                       */
  /*                                                                    */
  /* ★ 주파수를 올리면 «파형 간격이 좁아지는 것» 이 눈에 보여야 한다.        */
  /*   그래서 가로축을 «늘 같은 시간(ms)» 으로 두고 그 안에 물결을 채운다.   */
  /*   축이 함께 늘어나면 파형이 그대로 보여 아무것도 배울 수 없다.          */
  /* ------------------------------------------------------------------ */

  /** 화면에 보여 줄 시간 폭(ms). 이 안에 몇 개의 물결이 들어오는지가 곧 주파수다. */
  var SCOPE_MS = 8;

  /**
   * 오실로스코프 하나를 만든다.
   * 돌려주는 것 : { root, set(hz), setNote(text) }
   */
  function scope(opts) {
    var o = opts || {};
    var W = 520;
    var H = 150;
    var pad = 26;

    var path = UI.svg("path", { class: "scope__line", d: "" });
    var hzText = UI.el("span", { class: "scope__hz", text: "—" });
    var noteText = UI.el("span", { class: "scope__note", text: "조용함" });
    var cycleText = UI.el("span", { class: "scope__cycles", text: "" });

    var svgNode = UI.svg(
      "svg",
      {
        viewBox: "0 0 " + W + " " + H,
        class: "scope__svg",
        role: "img",
        "aria-label": "주파수 파형 — " + SCOPE_MS + "밀리초 동안의 모습"
      },
      [
        UI.svg("rect", { x: 0, y: 0, width: W, height: H, class: "scope__bg" }),
        /* 눈금 — 1ms 마다 세로줄 */
        UI.svg("g", { class: "scope__grid" }, (function () {
          var lines = [];
          for (var i = 0; i <= SCOPE_MS; i += 1) {
            var x = pad + ((W - pad * 2) * i) / SCOPE_MS;
            lines.push(UI.svg("line", { x1: x, y1: 12, x2: x, y2: H - 26, class: "scope__gridline" }));
          }
          return lines;
        })()),
        UI.svg("line", { x1: pad, y1: 30, x2: W - pad, y2: 30, class: "scope__level" }),
        UI.svg("line", { x1: pad, y1: H - 44, x2: W - pad, y2: H - 44, class: "scope__level" }),
        UI.svg("text", { x: 6, y: 34, class: "scope__axis" }, [txt("5V")]),
        UI.svg("text", { x: 6, y: H - 40, class: "scope__axis" }, [txt("0V")]),
        UI.svg("text", { x: W / 2, y: H - 8, class: "scope__axis" }, [
          txt("가로축 : " + SCOPE_MS + "ms (늘 같음)")
        ]),
        path
      ]
    );

    /** hz 로 네모 물결을 그린다. 0 이면 평평한 줄. */
    function set(hz) {
      var freq = Math.max(0, Math.round(Number(hz) || 0));
      var x0 = pad;
      var x1 = W - pad;
      var hi = 30;
      var lo = H - 44;

      if (!(freq > 0)) {
        path.setAttribute("d", "M " + x0 + " " + lo + " L " + x1 + " " + lo);
        hzText.textContent = "—";
        noteText.textContent = "조용함";
        cycleText.textContent = "";
        svgNode.setAttribute("aria-label", "파형 없음 — 조용한 상태");
        return;
      }

      /* SCOPE_MS 동안 몇 번 오르내리는가 */
      var cycles = (freq * SCOPE_MS) / 1000;
      /* 너무 촘촘하면 선이 새까매진다. 그때는 «촘촘함» 만 보이면 된다. */
      var drawn = Math.max(0.5, Math.min(cycles, 40));
      var span = x1 - x0;
      var d = "M " + x0 + " " + lo;
      var half = span / (drawn * 2);
      var x = x0;
      var up = true;
      while (x < x1) {
        var y = up ? hi : lo;
        d += " L " + x.toFixed(1) + " " + y;
        x += half;
        if (x > x1) x = x1;
        d += " L " + x.toFixed(1) + " " + y;
        up = !up;
      }
      path.setAttribute("d", d);

      var name = PC.arduino ? PC.arduino.noteNameOf(freq) : "";
      hzText.textContent = freq + "Hz";
      noteText.textContent = name ? "음이름 " + name : "음이름에 딱 맞지 않는 높이";
      cycleText.textContent = SCOPE_MS + "ms 안에 " + cycles.toFixed(1) + "번 오르내림";
      svgNode.setAttribute(
        "aria-label",
        freq + "헤르츠 파형. " + SCOPE_MS + "밀리초 동안 " + cycles.toFixed(1) + "번 오르내립니다." +
          (name ? " 음이름은 " + name + " 입니다." : "")
      );
    }

    var rootEl = UI.el("div", { class: "scope" }, [
      UI.el("div", { class: "scope__canvas" }, [svgNode]),
      UI.el("div", { class: "scope__readout" }, [
        UI.el("span", { class: "scope__label", text: "지금 주파수" }),
        hzText,
        noteText,
        cycleText
      ])
    ]);

    set(o.hz || 0);
    return { root: rootEl, set: set };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 가락 재생 — 음을 차례로 들려준다 (명세 7장 화면5)                    */
  /* ------------------------------------------------------------------ */

  /**
   * 음 목록을 차례로 울린다.
   *
   *   notes   : [{ name, hz }, ...]
   *   toneMs  : 한 음이 울리는 시간
   *   stepMs  : 다음 음까지의 간격 (toneMs 보다 길어야 «사이» 가 생긴다)
   *   onNote(index, note, hz) : 음이 바뀔 때마다 부른다 — 파형·글자를 함께 움직이려는 것
   *
   * ★ 아두이노의 tone(…, toneMs) + delay(stepMs) 와 «같은 규칙» 으로 울린다.
   *   그래야 화면에서 들은 것과 실물에서 들을 것이 같다.
   *
   * 돌려주는 것 : { stop() }
   */
  function melody(notes, opts) {
    var o = opts || {};
    var toneMs = Math.max(20, Number(o.toneMs) || 250);
    var stepMs = Math.max(toneMs, Number(o.stepMs) || toneMs + 150);
    var list = (notes || []).filter(function (nt) {
      return nt && nt.hz > 0;
    });
    var timers = [];
    var alive = true;

    function at(ms, fn) {
      timers.push(setTimeout(fn, ms));
    }

    function stopAll() {
      alive = false;
      timers.forEach(function (id) {
        clearTimeout(id);
      });
      timers = [];
      stop();
      if (o.onNote) o.onNote(-1, null, 0);
    }

    /**
     * ★★ 음마다 길이가 «다를» 수 있다.
     *
     *   음계 여덟 개나 알림음은 모든 음이 같은 길이라 stepMs 하나로 넉넉했다.
     *   그런데 악보에는 ♩ 과 ♪ 과 ♩. 이 섞여 있다(5단계 예시 악보).
     *   그래서 음이 slotMs 를 들고 오면 «그 음만» 그 길이로 울린다.
     *
     *   ★ 사이(gapMs)는 slotMs 에서 «빼서» 쓴다 — 더하지 «않는다».
     *     더하면 음마다 밀려 곡 전체가 늘어진다. 실물 코드도 같은 규칙이다:
     *       tone(pin, hz, dur - GAP);  delay(dur);
     */
    var gapMs = Math.max(0, Number(o.gapMs) || 0);
    var cursor = 0;

    list.forEach(function (note, i) {
      var slot = note.slotMs > 0 ? note.slotMs : stepMs;
      var sound = note.slotMs > 0 ? Math.max(20, slot - gapMs) : toneMs;
      var start = cursor;
      cursor += slot;

      at(start, function () {
        if (!alive) return;
        play(note.hz);
        if (o.onNote) o.onNote(i, note, note.hz);
      });
      at(start + sound, function () {
        if (!alive) return;
        stop();
        if (o.onNote) o.onNote(i, note, 0);
      });
    });

    var totalMs = cursor;

    /* 다 끝나면 확실히 조용하게 */
    at(totalMs + 60, function () {
      if (!alive) return;
      stopAll();
      if (o.onDone) o.onDone();
    });

    return { stop: stopAll, totalMs: totalMs };
  }

  S.audio = {
    supported: supported,
    unlock: unlock,
    isUnlocked: isUnlocked,
    play: play,
    stop: stop,
    shutdown: shutdown,
    setMuted: setMuted,
    setVolume: setVolume,
    status: status,
    onChange: onChange,
    controls: controls,
    scope: scope,
    melody: melody,
    SCOPE_MS: SCOPE_MS
  };
})();
    </script>
    <script data-from="student/s40-board.js">
/**
 * 회로 그림과 조작 (명세 6.1 · 13장)
 *
 * 부품 그림은 «자체 SVG» 로 그린다. 사진을 베끼지 않는다(명세 13장).
 * 그리는 좌표는 shared/circuit.js 가 갖고 있고, 여기서는 그 좌표대로 그리기만 한다.
 *
 * 세 가지 방식으로 모두 조작할 수 있어야 한다 (명세 13장)
 *   마우스 · 터치 : 단자를 차례로 누른다
 *   키보드        : 화살표로 단자 사이를 옮기고 Enter 로 고른다.
 *                  더 빠른 길로 «목록에서 골라 잇기» 도 함께 둔다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  /**
   * 케이블 색.
   *
   * ★ 두 갈래를 «주황» 과 «파랑» 으로 둔다.
   *   검정은 청록 보드와 검은 헤더 위에서 잘 보이지 않았다(선생님 지적).
   *   주황–파랑은 밝은 바탕에서 둘 다 또렷하고, 서로 «따뜻한 색 / 찬 색» 이라
   *   적록색약에서도 갈라 보인다. 명세 6.1 이 GND 를 «검정/파랑» 으로 허용한다.
   */
  var WIRE_COLORS = {
    red: "#d63b2f",
    black: "#22262c",
    yellow: "#e3a008",
    /* 실제로 쓰는 두 가지 */
    orange: "#ea580c",
    blue: "#1d4ed8",
    /* 회로에 쓰이지 않는 케이블 — 흐리게 두어 «이건 빠져 있다» 가 보이게 */
    gray: "#9aa3ae"
  };

  /** 케이블 색을 말로 — 색만으로 뜻을 전하지 않기 위해(명세 13장) */
  var COLOR_WORD = {
    red: "빨강",
    black: "검정",
    yellow: "노랑",
    orange: "주황",
    blue: "파랑",
    gray: "회색"
  };

  /**
   * ★ 케이블 색은 «회로의 어느 쪽인가» 로 정한다.
   *
   *   D8 → 피에조 신호 단자      가 모두 «주황»  (신호가 나가는 길)
   *   피에조 접지 단자 → GND     가 모두 «파랑»  (전류가 돌아오는 길)
   *
   *   두 끝만 보고 색을 정하면 가운데 케이블(브레드보드를 거치는 사이)이
   *   양쪽 다 같은 색이 되어 «어디까지가 어느 쪽인지» 가 보이지 않는다.
   *
   *   색은 판정에 쓰지 않는다(명세 6.1). 그래서 옆에 «D11 쪽/GND 쪽» 글자를 함께 적는다.
   */
  var SIDE_COLOR = { source: "orange", ground: "blue", "": "gray" };
  var SIDE_WORD = { source: (PC.SPEAKER_PIN_NAME || "D8") + " 쪽", ground: "GND 쪽", "": "쓰이지 않음" };

  /**
   * 그림 폭을 정한다 — 이 계산은 «한 곳» 에만 둔다.
   *
   * 폭을 픽셀로 직접 적는 까닭 : CSS 의 min-width 와 함께 쓰면
   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   *
   * 좁은 칸에서는 바닥값을 두어 단자가 손가락보다 작아지지 않게 한다(명세 6.1).
   * 그래도 [−] 로 줄이면 전체를 한눈에 볼 수 있다.
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    var available = host.clientWidth || 320;
    var base = available < 560 ? Math.max(available, 640) : available;
    svgNode.style.width = Math.round(base * zoom) + "px";
  }

  /**
   * 창 크기가 바뀌면 폭을 다시 맞춘다.
   *
   * 픽셀로 적어 둔 폭은 창이 바뀌어도 그대로 남는다.
   * 그러면 화면을 돌리거나 창을 줄였을 때 단자가 손가락보다 작아진 채로 있다.
   * 그림마다 듣는 이를 붙이면 화면을 다시 그릴 때 쌓이므로, «한 번만» 붙이고
   * 그때그때 화면에 놓인 그림을 찾아 고친다.
   */
  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /**
   * 회로 화면 하나를 만든다.
   *
   *   opts.mode        'find'(단자 찾기) · 'wire'(결선)
   *   opts.showBoard   우노를 보일 것인가 (기본 true)
   *   opts.showBread   브레드보드를 보일 것인가
   *   opts.getState    () => 회로 상태 { connections, powerOn, ... }
   *   opts.onPick      (component, pin) => void        — 단자를 하나 눌렀을 때 (find 모드)
   *   opts.onConnect   (connection) => void            — 케이블이 하나 생겼을 때
   *   opts.onMessage   (text) => void                  — 안내 문구를 바깥에 알릴 때
   */
  function create(opts) {
    var o = opts || {};
    var mode = o.mode || "wire";
    var showBoard = o.showBoard !== false;
    var showBread = o.showBread === true;
    /* 이 차시에는 피에조가 있다. 3A(찾기)와 3B(결선) 모두 부품을 보여 준다. */
    var showParts = o.showParts !== false;

    var zoom = 1;
    var pending = null; /* 첫 번째로 고른 단자 */
    var focusKey = showBoard ? "uno/" + C.SPEAKER_PIN_NAME : showBread ? "bb/TP-1" : "piezo/SIG";

    var svgHost = UI.el("div", { class: "board__canvas" });
    var statusLine = UI.el("p", {
      class: "board__status",
      attrs: { role: "status", "aria-live": "polite" },
      text: ""
    });

    /* ------------------------------------------------------------------ */
    /* 그리기                                                              */
    /* ------------------------------------------------------------------ */

    function keyOf(componentId, pinId) {
      return componentId + "/" + pinId;
    }

    function splitKey(key) {
      var i = String(key).indexOf("/");
      return { component: key.slice(0, i), pin: key.slice(i + 1) };
    }

    /** 지금 이 단자가 선택 상태인가 */
    function isPending(componentId, pinId) {
      return pending && pending.component === componentId && pending.pin === pinId;
    }

    /** 화면 낭독기가 읽을 단자 설명 */
    function terminalLabel(componentId, pin, net, powerOn) {
      var parts = [C.describe(componentId, pin.id)];
      parts.push(C.KIND_WORD[pin.kind] || "단자");
      if (powerOn && net) {
        var v = net.potentialAt(componentId, pin.id);
        if (v === 5) parts.push("5V 전원");
        else if (v === 0) parts.push("0V 접지");
      }
      if (isPending(componentId, pin.id)) parts.push("선택됨");
      return parts.join(", ");
    }

    function drawUno(state, net, powerOn) {
      var g = UI.svg("g", { class: "uno" });
      var box = C.UNO.box;

      g.appendChild(
        UI.svg("rect", {
          x: box.x, y: box.y, width: box.w, height: box.h,
          rx: 12, class: "uno__body"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.usbBox.x, y: C.UNO.usbBox.y,
          width: C.UNO.usbBox.w, height: C.UNO.usbBox.h,
          rx: 3, class: "uno__usb"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.jackBox.x, y: C.UNO.jackBox.y,
          width: C.UNO.jackBox.w, height: C.UNO.jackBox.h,
          rx: 4, class: "uno__jack"
        })
      );

      /* 헤더 띠 */
      [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
        g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
      });

      /* 보드 이름 — 두 머리띠 사이의 빈 자리에 */
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 162, class: "uno__brandsub" }, [txt("오픈 소스 하드웨어")]));

      /* 무리 이름 — 핀 이름표와 겹치지 않도록 머리띠 «바깥쪽» 에 둔다 */
      g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
      g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
      g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

      C.UNO.pins.forEach(function (pin) {
        g.appendChild(drawPin("uno", pin, state, net, powerOn));
      });
      return g;
    }

    function drawBreadboard(state, net, powerOn) {
      var g = UI.svg("g", { class: "bb" });
      var box = C.BB.box;

      g.appendChild(
        UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" })
      );

      /* 전원 레일 줄무늬 — 어느 레일에 전기가 왔는지 색과 «글자» 로 함께 보인다 */
      C.BB.rails.forEach(function (rail) {
        var live = powerOn && net ? net.potentialOf("bb:rail:" + rail.id) : null;
        var cls = "bb__railline bb__railline--" + rail.polarity + (live !== null ? " bb__railline--live" : "");
        g.appendChild(
          UI.svg("line", { x1: box.x + 10, y1: rail.y, x2: box.x + box.w - 10, y2: rail.y, class: cls })
        );
        g.appendChild(
          UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)])
        );
        /* 전압 표시는 판 «바깥» 오른쪽에 적는다.
           판 안에 적으면 마지막 구멍과 겹치고 글자가 판 밖으로 잘린다. */
        if (live !== null) {
          g.appendChild(
            UI.svg("text", { x: box.x + box.w + 8, y: rail.y + 5, class: "bb__raillive" }, [
              txt(live === 5 ? "5V" : "0V")
            ])
          );
        }
      });

      /* 가운데 홈 */
      g.appendChild(
        UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
      );
      g.appendChild(
        UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 17, class: "bb__gaptext" }, [
          txt("여기서 전극이 끊긴다 — 위 A~E 와 아래 F~J 는 다른 전극")
        ])
      );

      /* 열 번호 — 자리는 A 줄 구멍의 x 를 그대로 쓴다 */
      for (var c = 1; c <= C.BB.cols; c += 1) {
        var aPin = C.terminal("bb", "A" + c);
        if (aPin) {
          g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
        }
      }


      /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
         구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
         이 글자는 눈으로 볼 때만 필요하다. */
      C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
        var pin = C.terminal("bb", row + "1");
        if (!pin) return;
        g.appendChild(
          UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
        );
      });
      C.BB.pins.forEach(function (pin) {
        g.appendChild(drawPin("bb", pin, state, net, powerOn));
      });
      return g;
    }

    /* ------------------------------------------------------------------ */
    /* 부품 — 피에조 스피커 (명세 6.1 · 13장)                               */
    /*                                                                    */
    /* ★ 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).                   */
    /* ★ 극성을 «색으로만» 알리지 않는다. 몸통의 ＋ 표시와 단자 이름표를 함께 쓴다.
       ★★ 다리 «길이» 는 쓰지 않는다 — 실물은 두 다리가 같은 길이인 것이 많다. */
    /* ★ 수동/모듈형에 따라 «단자에 적히는 글자» 가 달라진다(명세 6.3).       */
    /* ------------------------------------------------------------------ */

    /**
     * 소리가 나는 것을 «색으로만» 알리지 않는다.
     * 울리는 동안에는 몸통 둘레에 물결을 그리고, 아래에 «♪ 523Hz» 라고 적는다.
     */
    function drawPiezo(st, net, powerOn) {
      var P = C.PIEZO;
      var spec = C.modeSpec(st.piezoMode);
      var isModule = spec.id === "module";
      var hz = powerOn ? Number(st.hz) || 0 : 0;
      var sounding = hz > 0;

      var g = UI.svg("g", {
        class: "part part--piezo" + (sounding ? " part--sounding" : "")
      });
      var b = P.body;

      g.appendChild(
        UI.svg("rect", {
          x: P.box.x, y: P.box.y, width: P.box.w, height: P.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 이름과 «울림/조용함» 은 몸통 «위» 에 적는다.
         아래에 두면 다리 끝의 ＋ / − 이름표와 부딪힌다. */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: P.nameY, class: "part__name" }, [
          txt("피에조 스피커 (" + spec.short + ")")
        ])
      );
      /* 소리 남·안 남을 색이 아니라 글자로도 (명세 13장) */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: P.stateY, class: "part__state" }, [
          txt(powerOn ? (sounding ? "♪ " + hz + "Hz 울림" : "○ 조용함") : "전원 꺼짐")
        ])
      );

      /* 모듈형이면 몸통 «뒤» 에 기판을 깐다 — 종류가 눈에 보이게 */
      if (isModule) {
        var bd = P.boardBox;
        g.appendChild(
          UI.svg("rect", {
            x: bd.x, y: bd.y, width: bd.w, height: bd.h, rx: 5, class: "piezo__board"
          })
        );
      }

      /* 다리 — 둘의 길이가 «같다». 극성은 몸통의 ⊕ 표시와 이름표가 알린다. */
      ["SIG", "GND"].forEach(function (id) {
        var leg = P.legs[id];
        g.appendChild(
          UI.svg("line", {
            x1: leg.from.x, y1: leg.from.y, x2: leg.to.x, y2: leg.to.y,
            class: "part__lead part__lead--" + id
          })
        );
      });

      /* 몸통 — 실물처럼 검은 원통. 가운데에 소리 구멍이 뚫려 있다. */
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r, class: "piezo__case" }));
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r - 5, class: "piezo__top" }));
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: 5, class: "piezo__hole" }));

      /**
       * ⊕ 극성 표시.
       * ★★ 신호 다리와 «같은 쪽» 에 찍는다(circuit.js 의 PIEZO.mark).
       *   표시와 다리가 어긋나 있으면 어느 다리를 말하는지 알 수 없다.
       */
      var m = P.mark;
      g.appendChild(UI.svg("circle", { cx: m.x, cy: m.y, r: m.r, class: "piezo__markring" }));
      g.appendChild(UI.svg("text", { x: m.x, y: m.y + 4, class: "piezo__mark" }, [txt("＋")]));

      /* 울리는 동안 퍼지는 물결 — 소리를 «그림으로» 도 알린다 */
      if (sounding) {
        [9, 17].forEach(function (extra) {
          g.appendChild(
            UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r + extra, class: "piezo__wave" })
          );
        });
      }
      return g;
    }

    function drawParts(st, net, powerOn) {
      var g = UI.svg("g", { class: "parts" });
      g.appendChild(drawPiezo(st, net, powerOn));
      C.PARTS.forEach(function (part) {
        part.pins.forEach(function (pin) {
          g.appendChild(drawPin(part.id, pin, st, net, powerOn));
        });
      });
      return g;
    }

    /** 단자 하나 — 눌리는 자리는 보이는 원보다 넉넉하게 잡는다(터치용) */
    function drawPin(componentId, pin, state, net, powerOn) {
      var key = keyOf(componentId, pin.id);
      var selected = isPending(componentId, pin.id);
      var volts = powerOn && net ? net.potentialAt(componentId, pin.id) : null;

      var classes = ["pin", "pin--" + pin.kind];
      if (selected) classes.push("pin--selected");
      if (volts === 5) classes.push("pin--hot");
      if (volts === 0) classes.push("pin--gnd");

      var g = UI.svg("g", {
        class: classes.join(" "),
        role: "button",
        tabindex: focusKey === key ? "0" : "-1",
        "data-key": key,
        "aria-label": terminalLabel(componentId, pin, net, powerOn)
      });

      /* 넓은 투명 판 — 손가락으로 눌러도 빗나가지 않게 */
      g.appendChild(
        UI.svg("rect", {
          x: pin.x - C.PITCH / 2, y: pin.y - C.PITCH / 2,
          width: C.PITCH, height: C.PITCH,
          class: "pin__hit"
        })
      );
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "pin__dot" }));

      /* 부품 다리 이름표 — 피에조의 두 단자를 «글자로» 알린다(명세 6.1).
         ★ 수동이면 ＋ / −, 모듈형이면 SIG / GND 로 적힌다(명세 6.3).
         이름을 적지 않으면 어느 다리가 신호 쪽인지 그림만으로 헷갈린다. */
      if (componentId === "piezo") {
        g.appendChild(
          UI.svg("text", { x: pin.x, y: pin.y + 18, class: "pin__label pin__label--part" }, [
            txt(C.pinMark(pin.id, state ? state.piezoMode : null))
          ])
        );
      }

      /* 이름표 — 모든 사용 가능 단자에 실제 명칭을 적는다(명세 6.1).
         위 핀은 아래쪽에, 아래 핀은 위쪽에 적어 무리 이름과 겹치지 않게 한다. */
      if (componentId === "uno") {
        g.appendChild(
          UI.svg(
            "text",
            {
              x: pin.x,
              y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
              /* 이름표는 «모두 같은 크기» 다.
                 긴 이름을 줄이면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
                 대신 circuit.js 가 헤더 간격을 30 으로 벌려 두었다. */
              class: "pin__label"
            },
            [txt(pin.label)]
          )
        );
      }

      g.addEventListener("click", function () {
        pick(componentId, pin.id);
      });
      g.addEventListener("keydown", function (evt) {
        onPinKey(evt, componentId, pin);
      });
      g.addEventListener("focus", function () {
        focusKey = key;
        say(terminalLabel(componentId, pin, net, powerOn));
      });

      return g;
    }

    /** 꽂힌 케이블 */
    function drawWires(state) {
      var g = UI.svg("g", { class: "wires" });
      /* 색은 그릴 때 «회로 전체를 보고» 정한다 — 두 끝만으로는 알 수 없다 */
      var sides = C.wireSides(state.connections || []);

      (state.connections || []).forEach(function (conn, i) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;

        /* 살짝 휘어지게 그려 여러 줄이 겹쳐도 구분된다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
        var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;

        var side = sides[i] || "";
        g.appendChild(
          UI.svg("path", {
            d: d,
            class: "wire wire--" + (side || "none"),
            stroke: WIRE_COLORS[SIDE_COLOR[side]] || WIRE_COLORS.gray,
            "data-index": String(i)
          })
        );
      });
      return g;
    }

    function txt(value) {
      return document.createTextNode(String(value));
    }

    /* ------------------------------------------------------------------ */
    /* 조작                                                                */
    /* ------------------------------------------------------------------ */

    function say(message) {
      statusLine.textContent = message;
      if (o.onMessage) o.onMessage(message);
    }

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }

    /** 단자 하나를 눌렀다 */
    function pick(componentId, pinId) {
      focusKey = keyOf(componentId, pinId);

      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      /* wire 모드 */
      if (!pending) {
        pending = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 을(를) 골랐습니다. 이을 곳을 하나 더 누르세요.");
        render();
        return;
      }

      if (pending.component === componentId && pending.pin === pinId) {
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }

      var conn = C.makeConnection(pending, { component: componentId, pin: pinId });
      pending = null;
      if (!conn) {
        say("이을 수 없는 자리입니다.");
        render();
        return;
      }
      if (C.hasConnection(state().connections, conn)) {
        say("이미 이어져 있는 곳입니다.");
        render();
        return;
      }
      if (o.onConnect) o.onConnect(conn);
      say(
        C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 을(를) " +
          (COLOR_WORD[conn.color] || "") +
          " 케이블로 이었습니다."
      );
      render();
    }

    /** 화살표로 옮겨 다니기 — 지금 위치에서 그 방향으로 가장 가까운 단자 */
    function nearestPin(fromComponent, fromPin, dx, dy) {
      var here = C.terminal(fromComponent, fromPin);
      if (!here) return null;

      var best = null;
      var bestScore = Infinity;

      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;

        comp.pins.forEach(function (pin) {
          if (comp.id === fromComponent && pin.id === fromPin) return;
          var vx = pin.x - here.x;
          var vy = pin.y - here.y;
          /* 가려는 방향으로 나아간 거리 */
          var along = vx * dx + vy * dy;
          if (along <= 0) return;
          /* 옆으로 벗어난 거리 — 많이 벗어날수록 나쁜 후보 */
          var across = Math.abs(vx * dy - vy * dx);
          var score = along + across * 3;
          if (score < bestScore) {
            bestScore = score;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return best;
    }

    function onPinKey(evt, componentId, pin) {
      var dirs = {
        ArrowRight: [1, 0],
        ArrowLeft: [-1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };

      if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
        evt.preventDefault();
        pick(componentId, pin.id);
        return;
      }
      if (evt.key === "Escape" && pending) {
        evt.preventDefault();
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }
      if (!dirs[evt.key]) return;

      evt.preventDefault();
      var target = nearestPin(componentId, pin.id, dirs[evt.key][0], dirs[evt.key][1]);
      if (!target) return;
      focusKey = keyOf(target.component, target.pin);
      render();
      var node = svgHost.querySelector('[data-key="' + cssEscape(focusKey) + '"]');
      if (node) node.focus();
    }

    /** 속성 선택자에 넣어도 안전하게 */
    function cssEscape(value) {
      return String(value).replace(/["\\]/g, "\\$&");
    }

    /* ------------------------------------------------------------------ */
    /* 키보드·화면낭독기용 «목록으로 잇기» (명세 6.1)                        */
    /* ------------------------------------------------------------------ */

    function terminalOptions() {
      var list = [];
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        comp.pins.forEach(function (pin) {
          list.push({ value: keyOf(comp.id, pin.id), label: C.describe(comp.id, pin.id) });
        });
      });
      return list;
    }

    function buildPicker() {
      if (mode === "find") return null;

      var options = terminalOptions();
      function makeSelect(labelText) {
        var id = UI.nextId("sel");
        var select = UI.el("select", { class: "input input--select", id: id });
        options.forEach(function (opt) {
          select.appendChild(UI.el("option", { text: opt.label, attrs: { value: opt.value } }));
        });
        return {
          root: UI.el("div", { class: "field field--inline" }, [
            UI.el("label", { class: "field__label", attrs: { for: id }, text: labelText }),
            select
          ]),
          select: select
        };
      }

      var from = makeSelect("여기에서");
      var to = makeSelect("여기까지");
      /* 두 칸이 같은 곳을 가리키면 쓸모가 없으므로 두 번째는 다른 곳으로 미리 옮겨 둔다 */
      if (options.length > 1) to.select.selectedIndex = Math.min(options.length - 1, 1);

      var go = UI.button("이 둘을 잇기", {
        class: "btn btn--ghost",
        click: function () {
          var a = splitKey(from.select.value);
          var b = splitKey(to.select.value);
          pending = a;
          pick(b.component, b.pin);
        }
      });

      return UI.el("details", { class: "board__picker" }, [
        UI.el("summary", { class: "board__pickersum", text: "목록에서 골라 잇기" }),
        UI.el("p", {
          class: "board__pickerhelp",
          text: "그림을 누르기 어려울 때 씁니다. 그림 위에서는 화살표 키로 옮기고 Enter 로 고를 수도 있습니다."
        }),
        UI.el("div", { class: "board__pickerrow" }, [from.root, to.root, go])
      ]);
    }

    /* ------------------------------------------------------------------ */
    /* 도구 막대                                                           */
    /* ------------------------------------------------------------------ */

    function buildTools() {
      if (mode !== "wire") {
        return UI.el("div", { class: "board__tools" }, [zoomGroup()]);
      }

      var connections = state().connections || [];
      var undo = UI.button("한 단계 되돌리기", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onUndo) o.onUndo();
        }
      });
      var reset = UI.button("전체 초기화", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onReset) o.onReset();
        }
      });

      return UI.el("div", { class: "board__tools" }, [
        UI.el("div", { class: "board__toolgroup" }, [undo, reset]),
        zoomGroup()
      ]);
    }

    function zoomGroup() {
      function setZoom(next) {
        /* 하한을 넉넉히 둔다. 좁은 화면에서는 바닥값(640) 에 곱하므로
           0.5 로는 화면 폭에 몇 픽셀 모자라 «전체 보기» 가 되지 않는다. */
        zoom = Math.max(0.4, Math.min(2.4, next));
        applyZoom();
      }
      return UI.el("div", { class: "board__toolgroup", attrs: { role: "group", "aria-label": "확대·축소" } }, [
        UI.button("−", {
          class: "btn btn--ghost btn--icon",
          title: "축소",
          click: function () {
            setZoom(zoom - 0.2);
          }
        }),
        UI.button("기본", {
          class: "btn btn--ghost btn--small",
          click: function () {
            setZoom(1);
          }
        }),
        UI.button("+", {
          class: "btn btn--ghost btn--icon",
          title: "확대",
          click: function () {
            setZoom(zoom + 0.2);
          }
        })
      ]);
    }

    /** 지금 확대 배수로 폭을 맞춘다. 배수를 그림에 적어 두어 창이 바뀔 때도 쓴다. */
    function applyZoom() {
      svgHost.setAttribute("data-zoom", String(zoom));
      fitSvg(svgHost, zoom);
    }

    /* ------------------------------------------------------------------ */
    /* 조립                                                                */
    /* ------------------------------------------------------------------ */

    var toolHost = UI.el("div");
    var pickerHost = UI.el("div");

    function render() {
      var st = state();
      var net = C.solve(st.connections);
      var powerOn = st.powerOn === true;

      /* 우노는 왼쪽, 브레드보드는 오른쪽에 나란히 놓인다(circuit.js 좌표).
         단자 찾기(3A)에서는 브레드보드가 없으므로 보드만 담는 좁은 틀을 쓴다. */
      /* 보이는 부품에 따라 틀을 고른다. 아래쪽 100px 은 피에조 자리다. */
      /* ★ 아래쪽 여백 : 피에조 다리 끝의 «＋ / −» 이름표가 pin.y + 18 에 그려진다.
         가장 아래 단자가 y=406 이므로 틀이 424 에서 끊기면 그 글자가 잘린다.
         (틀 높이 = 시작 18 + 높이 → 아래 끝. 420 이면 아래 끝이 438 이다) */
      var viewBox = showBread
        ? "0 18 920 420"
        : showParts
        ? "0 18 560 420"
        : "0 18 560 268";

      var svgNode = UI.svg("svg", {
        viewBox: viewBox,
        class: "board__svg",
        role: "img",
        "aria-label":
          (showBread ? "왼쪽에 아두이노 우노, 오른쪽에 브레드보드" : "아두이노 우노 보드") +
          (showParts ? ", 아래쪽에 피에조 스피커" : "")
      });

      if (showBoard) svgNode.appendChild(drawUno(st, net, powerOn));
      if (showBread) svgNode.appendChild(drawBreadboard(st, net, powerOn));
      if (showParts) svgNode.appendChild(drawParts(st, net, powerOn));
      svgNode.appendChild(drawWires(st));

      UI.clear(svgHost).appendChild(svgNode);
      applyZoom();

      UI.clear(toolHost).appendChild(buildTools());
      var picker = buildPicker();
      UI.clear(pickerHost);
      if (picker) pickerHost.appendChild(picker);
    }

    var rootNode = UI.el("div", { class: "board" }, [toolHost, svgHost, statusLine, pickerHost]);

    render();

    return {
      root: rootNode,
      render: render,
      setMode: function (next) {
        mode = next;
        pending = null;
        render();
      },
      cancelPending: function () {
        pending = null;
        render();
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_COLOR: SIDE_COLOR,
    SIDE_WORD: SIDE_WORD
  };
})();
    </script>
    <script data-from="student/s45-figures.js">
/**
 * 설명 그림 (명세 13장)
 *
 * 2단계 «원리 이해» 의 카드가 글만 있어서 장치 그림을 함께 넣는다.
 *
 * ★ 실제 사진을 «복제하지 않는다».
 *   명세 13장 — 「실제 부품 사진을 참고하되 저작권이 불명확한 이미지는
 *   복제하지 말고 자체 SVG로 그린다」.
 *   그래서 실물 사진을 보고 같은 배치로 «직접» 그렸다.
 *   덧붙여, 그림 파일을 심지 않으므로 단일 HTML 이 가벼운 채로 file:// 에서도 열린다.
 *
 * 보드와 브레드보드의 좌표는 shared/circuit.js 에서 가져온다.
 * 3단계 시뮬레이터와 «같은 그림» 이어야 학생이 헷갈리지 않기 때문이다.
 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,
 * 화면 낭독기에는 그 목록이 그림의 대체 설명이 된다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  if (typeof document === "undefined") return;

  var UI = S.ui;
  var C = PC.circuit;

  function txt(value) {
    return document.createTextNode(String(value));
  }

  /** 번호 배지 — 그림 위에 얹는 동그란 번호 */
  function badge(no, x, y) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 11, class: "fig__badgebg" }),
      UI.svg("text", { x: x, y: y + 4, class: "fig__badgeno" }, [txt(String(no))])
    ]);
  }

  /**
   * O · X 배지 — «이렇게 꽂는다 / 이렇게 꽂으면 안 된다» 를 나타낸다.
   * 색만으로 알리지 않는다. 동그라미 안의 O·X 글자가 뜻을 지고,
   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.
   */
  function badgeMark(mark, x, y, kind) {
    return UI.svg("g", {}, [
      UI.svg("circle", { cx: x, cy: y, r: 12, class: "fig__badgebg fig__badgebg--" + kind }),
      UI.svg("text", { x: x, y: y + 5, class: "fig__badgeno" }, [txt(mark)])
    ]);
  }

  /**
   * 배지에서 가리키는 곳까지 잇는 선.
   *
   * ★ 두 겹으로 그린다.
   *   아래 : 굵은 «흰» 선 — 청록 보드와 검은 헤더 위에서 선이 묻히지 않게 한다
   *   위   : 가는 «진한 주황» 선 — 흰 종이 위에서도 보이고, 보드 색과 확실히 다르다
   *
   * 한 겹으로는 어느 한쪽 바탕에서 반드시 묻힌다(파란 점선이 청록 보드에서 안 보였다).
   */
  function leader(x1, y1, x2, y2) {
    return UI.svg("g", {}, [
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leaderhalo" }),
      UI.svg("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: "fig__leader" }),
      /* 가리키는 끝에 점을 찍어 «어디를» 가리키는지 분명히 한다 */
      UI.svg("circle", { cx: x2, cy: y2, r: 3.5, class: "fig__leaderdot" })
    ]);
  }

  /**
   * 그림 한 덩어리를 만든다.
   *   opts : { viewBox, caption, items:[{text}], build(g) }
   *
   * items 의 차례가 곧 배지 번호다. build 안에서 badge(n, x, y) 로 같은 번호를 얹는다.
   */
  function figure(opts) {
    var o = opts || {};
    var items = o.items || [];

    /* 배지에 쓸 표시. 따로 주지 않으면 1, 2, 3 … 을 쓴다.
       그림의 배지와 아래 설명 목록은 반드시 «같은 표시» 여야 한다.
       그림에는 O 인데 목록에는 다른 글자가 있으면 짝을 지을 수 없다. */
    var marks = o.marks || items.map(function (_, i) {
      /* 배지에 그리는 것과 «똑같은» 숫자를 목록에도 쓴다 */
      return String(i + 1);
    });

    /* 그림의 «대체 설명» — 낭독기는 이 글을 읽는다 */
    var alt =
      o.caption +
      ". 표시된 곳 : " +
      items
        .map(function (item, i) {
          return marks[i] + " " + item.text;
        })
        .join(", ");

    var svgNode = UI.svg("svg", {
      viewBox: o.viewBox,
      class: "fig__svg",
      role: "img",
      "aria-label": alt
    });
    if (o.build) o.build(svgNode);

    var legend = UI.el("ol", { class: "fig__legend" }, items.map(function (item, i) {
      var kind = (o.markKinds || [])[i];
      return UI.el("li", { class: "fig__item" }, [
        UI.el("span", {
          class: "fig__no" + (kind ? " fig__no--" + kind : ""),
          attrs: { "aria-hidden": "true" },
          text: marks[i]
        }),
        UI.el("span", { class: "fig__text", text: item.text })
      ]);
    }));

    /* 브레드보드처럼 «세로로 긴» 그림은 그대로 두면 화면을 다 차지한다.
       narrow 를 주면 폭을 묶어 카드 안에 들어오는 크기로 줄인다. */
    return UI.el("figure", { class: "fig" + (o.narrow ? " fig--narrow" : "") }, [
      UI.el("div", { class: "fig__canvas" }, [svgNode]),
      UI.el("figcaption", { class: "fig__cap", text: o.caption }),
      legend
    ]);
  }

  /* ================================================================== */
  /* 1. 아두이노 우노 보드                                                */
  /* ================================================================== */

  /** 3단계 시뮬레이터와 같은 좌표로 보드를 그린다(누를 수는 없는 «설명용») */
  function drawUnoBody(g) {
    var box = C.UNO.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 12, class: "uno__body" }));
    [C.UNO.usbBox, C.UNO.jackBox].forEach(function (b) {
      g.appendChild(UI.svg("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 3, class: "uno__usb" }));
    });
    [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
      g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
    });

    /* 보드 위의 큰 부품들 — 실물을 보고 자리만 맞추어 단순하게 */
    var chip = C.UNO.chip;
    g.appendChild(UI.svg("rect", { x: chip.x, y: chip.y, width: chip.w, height: chip.h, rx: 3, class: "fig__chip" }));
    g.appendChild(
      UI.svg("text", { x: chip.x + chip.w / 2, y: chip.y + 28, class: "fig__chiptext" }, [txt("ATmega328P")])
    );
    /* 리셋 버튼 — 헤더 띠(y 44~72) 를 피해 보드 빈자리에 둔다 */
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 9, class: "fig__reset" }));
    g.appendChild(UI.svg("circle", { cx: 74, cy: 106, r: 4, class: "fig__resetin" }));
    g.appendChild(UI.svg("rect", { x: 110, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("rect", { x: 140, y: 152, width: 22, height: 30, rx: 2, class: "fig__part" }));
    g.appendChild(UI.svg("circle", { cx: 460, cy: 106, r: 5, class: "fig__led" }));
    g.appendChild(UI.svg("text", { x: 474, y: 110, class: "uno__brandsub" }, [txt("ON")]));

        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },

      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;

        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));

        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));
        g.appendChild(badge(4, vcc.x, 315));

        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }

  function drawBreadboardBody(g) {
    var box = C.BB.box;

    g.appendChild(UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" }));

    /* 전원 레일 줄무늬 */
    C.BB.rails.forEach(function (rail) {
      g.appendChild(
        UI.svg("line", {
          x1: box.x + 10,
          y1: rail.y,
          x2: box.x + box.w - 10,
          y2: rail.y,
          class: "bb__railline bb__railline--" + rail.polarity
        })
      );
      g.appendChild(UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)]));
    });

    /* 가운데 홈 — 여기서 전극이 끊긴다는 것을 글로도 적는다 */
    g.appendChild(
      UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
    );
    g.appendChild(
      UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 15, class: "bb__gaptext" }, [
        txt("여기서 전극이 끊긴다")
      ])
    );

    /* 열 번호 */
    for (var c = 1; c <= C.BB.cols; c += 1) {
      var aPin = C.terminal("bb", "A" + c);
      if (aPin) g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
    }


    /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
       구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
       이 글자는 눈으로 볼 때만 필요하다. */
    C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
      var pin = C.terminal("bb", row + "1");
      if (!pin) return;
      g.appendChild(
        UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
      );
    });
    /* 구멍 */
    C.BB.pins.forEach(function (pin) {
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6, class: "fig__hole" }));
    });

    /* 전극 강조는 그림마다 다르다 — 모듈 위쪽의 wrapColumn 을 쓴다 */
  }

  /**
   * 열 하나를 감싸 «이 구멍들이 한 전극» 임을 보여 준다.
   *   wrapColumn(g, "A4", "E4", "fig__hilite")
   */
  function wrapColumn(g, topId, bottomId, cls) {
    var a = C.terminal("bb", topId);
    var b = C.terminal("bb", bottomId);
    if (!a || !b) return;
    g.appendChild(
      UI.svg("rect", {
        x: a.x - 11,
        y: a.y - 11,
        width: 22,
        height: b.y - a.y + 22,
        rx: 11,
        class: cls
      })
    );
  }

  /** 그 구멍에 «부품 다리가 꽂혀 있다» 는 표시 */
  function legRing(g, holeId) {
    var pin = C.terminal("bb", holeId);
    if (!pin) return;
    g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 9, class: "fig__legring" }));
  }

        { text: "− 레일(파란 줄) — 가로로 길게 이어진다. 레일 전체가 한 전극. GND 를 여기에 넣는다." },
        { text: "같은 열 A~E (파란 테두리) — 세로 다섯 구멍이 한 전극이다. 여기 꽂은 다리끼리는 서로 이어진다." },

        g.appendChild(leader(right, railTN.y, railTN.x + 14, railTN.y));

        g.appendChild(badge(5, right + 14, h4.y));
      }
    });

  /* 2-B. 브레드보드 — 꽂는 자리에 따라 어떻게 달라지는가 (O / X)           */
  /*                                                                    */
  /* 왼쪽 그림(전극 지도)이 «어느 구멍이 이어지는가» 를 알려 준다면        */
  /* 이 그림은 «그래서 꽂을 때 무엇을 조심하는가» 를 알려 준다.            */
  /* 두 장을 나란히 두어야 지도와 쓰임새가 한눈에 이어진다.                */

  function breadboardUseFigure() {
    return figure({
      viewBox: "568 14 384 400",
      narrow: true,
      caption: "꽂는 자리에 따라 이렇게 달라진다",
      marks: ["O", "X"],
      markKinds: ["ok", "no"],
      items: [
        {
          text:
            "올바름 — 부품의 두 다리를 «서로 다른 열»(2번·3번)에 꽂았다. " +
            "두 다리가 다른 전극이라 전류가 부품을 지나간다."
        },
        {
          text:
            "잘못됨 — 두 다리를 «같은 열»(9번)에 꽂았다. 한 전극에 둘 다 물려 " +
            "다리끼리 바로 붙는다. 전류가 부품을 지나가지 않아 켜지지 않는다."
        }
      ],
      build: function (g) {
        drawBreadboardBody(g);

        /* ── ① 다리를 다른 열에 (2번·3번) ───────────────────────── */
        wrapColumn(g, "A2", "E2", "fig__hilite");
        wrapColumn(g, "A3", "E3", "fig__hilite--other");
        legRing(g, "A2");
        legRing(g, "A3");

        /* ── ② 다리를 같은 열에 (9번) — 붙어 버린 것을 굵은 선으로 ── */
        wrapColumn(g, "A9", "E9", "fig__hilite--bad");
        legRing(g, "C9");
        legRing(g, "E9");
        var c9 = C.terminal("bb", "C9");
        var e9 = C.terminal("bb", "E9");
        g.appendChild(
          UI.svg("line", { x1: c9.x, y1: c9.y, x2: e9.x, y2: e9.y, class: "fig__shortline" })
        );

        /* ── 배지 : 오른쪽에서 각 자리를 가리킨다 ───────────────────── */
        var right = 904;
        var a3 = C.terminal("bb", "A3");

        g.appendChild(leader(right, a3.y, a3.x + 11, a3.y));
        g.appendChild(badgeMark("O", right + 14, a3.y, "ok"));

        g.appendChild(leader(right, c9.y, c9.x + 11, c9.y));
        g.appendChild(badgeMark("X", right + 14, c9.y, "no"));
      }
    });
  }

  /** 피에조 몸통 하나 — 여러 그림이 함께 쓴다 */
  function bigPiezo(g, cx, cy, opts) {
    var o = opts || {};
    var r = o.r || 52;

    /* 놋쇠 판 → 결정체 → 가운데 접점 순으로 겹쳐 그린다 */
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r, class: "figpz__case" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r - 12, class: "figpz__brass" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: r - 26, class: "figpz__crystal" }));
    g.appendChild(UI.svg("circle", { cx: cx, cy: cy, r: 5, class: "figpz__center" }));

  /* ================================================================== */

  /** 카드 id → 그림. 없는 카드는 글만 둔다. */
  var BY_CARD = {
    piezo: piezoInsideFigure,
    signal: squareWaveFigure,
    freq: freqScaleFigure,
    polarity: piezoPinsFigure
  };

  /* ------------------------------------------------------------------ */
  /* 악보 (5단계 예시 악보)                                                */
  /*                                                                    */
  /* ★ 계명 딱지만으로는 «악보» 가 아니다. 학생이 수업 자료에서 본 것과       */
  /*   같은 모습이라야 「이 악보를 프로그램으로 옮긴다」 가 이어진다.         */
  /*                                                                    */
  /* ★ 그림을 심지 «않는다» — 오선·음표·기둥·이음줄을 SVG 로 직접 그린다.    */
  /*   그래서 단일 HTML 이 가벼운 채로 file:// 에서도 열린다(이 폴더의 규칙). */
  /*                                                                    */
  /* ★ 음의 자리는 lesson.js 의 SHEET_PITCH 가 준 step 하나로 정해진다.     */
  /*   높은음자리표 «맨 아래 줄(E4)» 이 0 이고 한 칸에 1 씩 오른다.          */
  /*   계명을 고치면 악보 그림도 저절로 따라 움직인다.                       */
  /* ------------------------------------------------------------------ */

  /** 오선 한 칸의 높이(줄과 줄 사이) */
  var ST_GAP = 8;
  /** 맨 아래 줄(E4, step 0)의 y */
  var ST_BASE = 74;
  /** 음표 하나가 차지하는 가로 폭 — 긴 음에 넓은 자리를 준다 */
  function stepAdvance(beats) {
    return 20 + beats * 5;
  }

  function stepY(step) {
    return ST_BASE - step * (ST_GAP / 2);
  }

  /** 이 음이 몇 번째 마디에 드는가 — barAt 으로 가른다 */
  function measuresOf(line) {
    var out = [];
    var cur = [];
    line.notes.forEach(function (note, i) {
      cur.push({ note: note, index: i });
      if (line.barAt.indexOf(i + 1) !== -1) {
        out.push(cur);
        cur = [];
      }
    });
    if (cur.length) out.push(cur);
    return out;
  }

  /** 한 박이 몇 칸인가 — 8분음표 둘이 4분음표 하나(한 박)다 */
  var ST_BEAT = 2;

  /**
   * 8분음표(한 칸)가 «이어진» 묶음을 찾는다.
   *
   * ★ «박» 이 바뀌면 이음줄을 끊는다.
   *   한 마디의 8분음표를 통째로 묶으면 여섯 개가 한 줄로 이어져 박이 보이지 않는다.
   *   악보는 박마다 짝으로 묶는다 — 15마디의 ♪ 여섯 개가 (♪♪)(♪♪)(♪♪) 로 보여야 한다.
   *
   * 마디를 넘어 이어 붙이지 않는다 — 마디마다 따로 본다.
   * 혼자 남은 8분음표는 묶지 않고 꼬리를 단다.
   */
  function beamGroups(measure) {
    var groups = [];
    var run = [];
    var beat = -1;
    var pos = 0;

    function flush() {
      if (run.length > 1) groups.push(run);
      run = [];
    }

    measure.forEach(function (item) {
      if (item.note.beats === 1) {
        var now = Math.floor(pos / ST_BEAT);
        if (now !== beat) flush();
        beat = now;
        run.push(item);
      } else {
        flush();
        beat = -1;
      }
      pos += item.note.beats;
    });
    flush();
    return groups;
  }

  /**
   * 악보 한 줄을 그린다.
   *
   * line — SHEET.lines[n] ( { no, notes: [{ name, sci, step, beats }], barAt } )
   */
  function staffLine(line) {
    var kids = [];
    var x = 66;
    var placed = [];

    /* 자리를 먼저 잡는다 — 기둥과 이음줄이 그 자리를 함께 쓴다 */
    var measures = measuresOf(line);
    var bars = [];
    measures.forEach(function (measure) {
      measure.forEach(function (item) {
        placed.push({ note: item.note, index: item.index, x: x, y: stepY(item.note.step) });
        x += stepAdvance(item.note.beats);
      });
      bars.push(x - 8);
    });
    var width = x + 12;

    /* ── 오선 다섯 줄 ── */
    for (var i = 0; i <= 8; i += 2) {
      kids.push(
        UI.svg("line", { x1: 8, y1: stepY(i), x2: width - 10, y2: stepY(i), class: "stf__line" })
      );
    }

    /* ── 높은음자리표 ── */
    kids.push(UI.svg("text", { x: 14, y: ST_BASE + 3, class: "stf__clef" }, [txt("𝄞")]));

    /* ── 박자표 3/4 ── */
    kids.push(UI.svg("text", { x: 46, y: stepY(6) + 3, class: "stf__meter" }, [txt("3")]));
    kids.push(UI.svg("text", { x: 46, y: stepY(2) + 3, class: "stf__meter" }, [txt("4")]));

    /* ── 마디 번호 ── */
    kids.push(UI.svg("text", { x: 8, y: stepY(8) - 12, class: "stf__barno" }, [txt(line.no)]));

    /**
     * ── 이음줄 ──
     *
     * ★ 이음줄을 «수평» 으로 긋고, 묶인 기둥은 모두 그 높이까지 뻗는다.
     *   기둥마다 제 머리에서 같은 길이를 뻗게 하면 가운데 음의 기둥 끝이
     *   이음줄에 닿지 않는다(실제로 10px 떨어져 있었다).
     *   폭넓게 오르내리는 묶음에서는 수평 이음줄이 오히려 읽기 쉽다.
     *
     * ★ 방향은 «가운뎃줄(step 4)에서 가장 먼 음» 이 정한다.
     *   묶음 안에서 방향이 갈리면 이음줄을 그을 수 없다.
     */
    var STEM = 26;
    var MIN_STEM = 16;
    /* 이음줄이 서는 것을 묶는 값 — 음이 옥타브 가까이 뛰면 그대로 두면 너무 급해진다 */
    var MAX_SLANT = 12;
    var stemTo = {};
    var beams = [];

    measures.forEach(function (measure) {
      beamGroups(measure).forEach(function (run) {
        var items = run.map(function (item) {
          return placed[item.index];
        });

        var far = items[0];
        items.forEach(function (p) {
          if (Math.abs(p.note.step - 4) > Math.abs(far.note.step - 4)) far = p;
        });
        var down = far.note.step >= 4;

        var first = items[0];
        var last = items[items.length - 1];
        var y1 = down ? first.y + STEM : first.y - STEM;
        var y2 = down ? last.y + STEM : last.y - STEM;

        /* ② 기울기를 묶는다 */
        var dy = y2 - y1;
        if (Math.abs(dy) > MAX_SLANT) y2 = y1 + (dy > 0 ? MAX_SLANT : -MAX_SLANT);

        /* 이음줄의 어느 x 에서의 높이 — 기둥은 모두 여기까지 뻗는다 */
        function at(x) {
          if (last.x === first.x) return y1;
          return y1 + ((x - first.x) * (y2 - y1)) / (last.x - first.x);
        }

        /* ③ 짧아지는 기둥이 있으면 이음줄을 통째로 민다 */
        var shift = 0;
        items.forEach(function (p) {
          var len = down ? at(p.x) - p.y : p.y - at(p.x);
          if (len < MIN_STEM) shift = Math.max(shift, MIN_STEM - len);
        });
        if (shift > 0) {
          y1 += down ? shift : -shift;
          y2 += down ? shift : -shift;
        }

        items.forEach(function (p) {
          stemTo[p.index] = { y: at(p.x), down: down };
        });
        beams.push({
          x1: down ? first.x - 5 : first.x + 5,
          y1: y1,
          x2: down ? last.x - 5 : last.x + 5,
          y2: y2
        });
      });
    });

    /* ── 음표 ── */
    placed.forEach(function (p) {
      var note = p.note;
      var open = note.beats >= 4;

      /* 덧줄 — 오선 위로 올라간 음(라·높은도) */
      for (var s2 = 10; s2 <= note.step; s2 += 2) {
        kids.push(
          UI.svg("line", { x1: p.x - 9, y1: stepY(s2), x2: p.x + 9, y2: stepY(s2), class: "stf__ledger" })
        );
      }

      /* 머리 — 4분음표보다 짧으면 «찬» 머리, 2분음표부터는 «빈» 머리 */
      kids.push(
        UI.svg("ellipse", {
          cx: p.x,
          cy: p.y,
          rx: 5.4,
          ry: 4,
          transform: "rotate(-20 " + p.x + " " + p.y + ")",
          class: open ? "stf__head stf__head--open" : "stf__head"
        })
      );

      /* 점 — 점4분음표·점2분음표. 줄 위의 음이면 «칸» 으로 올려 찍는다 */
      if (note.beats === 3 || note.beats === 6) {
        var dotY = note.step % 2 === 0 ? p.y - ST_GAP / 2 : p.y;
        kids.push(UI.svg("circle", { cx: p.x + 10, cy: dotY, r: 1.7, class: "stf__dot" }));
      }

      /* 기둥 — 묶인 음은 이음줄까지, 아니면 제 길이만큼 */
      var tied = stemTo[p.index];
      var down = tied ? tied.down : note.step >= 4;
      var sx = down ? p.x - 5 : p.x + 5;
      var sy = tied ? tied.y : down ? p.y + STEM : p.y - STEM;
      kids.push(UI.svg("line", { x1: sx, y1: p.y, x2: sx, y2: sy, class: "stf__stem" }));

      /* 꼬리 — 혼자 있는 8분음표 */
      if (note.beats === 1 && !tied) {
        var d = down
          ? "M " + sx + " " + sy + " c 5 -3 7 -7 6 -12"
          : "M " + sx + " " + sy + " c 5 3 7 7 6 12";
        kids.push(UI.svg("path", { d: d, class: "stf__flag" }));
      }
    });

    beams.forEach(function (beam) {
      kids.push(
        UI.svg("line", { x1: beam.x1, y1: beam.y1, x2: beam.x2, y2: beam.y2, class: "stf__beam" })
      );
    });

    /* ── 세로줄 ── */
    bars.forEach(function (bx, i) {
      var isLast = i === bars.length - 1;
      kids.push(UI.svg("line", { x1: bx, y1: stepY(8), x2: bx, y2: stepY(0), class: "stf__bar" }));
      if (isLast) {
        kids.push(UI.svg("line", { x1: bx + 4, y1: stepY(8), x2: bx + 4, y2: stepY(0), class: "stf__bar stf__bar--end" }));
      }
    });

    /* ── 계명 ── */
    placed.forEach(function (p) {
      kids.push(UI.svg("text", { x: p.x, y: 104, class: "stf__solfa" }, [txt(p.note.label)]));
    });

    return UI.svg(
      "svg",
      {
        viewBox: "0 0 " + width + " 116",
        class: "stf",
        role: "img",
        "aria-label":
          line.no + " — " +
          line.notes.map(function (n) {
            return n.label + " " + n.value.name;
          }).join(", ")
      },
      kids
    );
  }

  /** 악보 두 줄을 한 그림으로 */
  function staffFigure(sheet) {
    return UI.el(
      "div",
      { class: "stfbox" },
      sheet.lines.map(function (line) {
        return staffLine(line);
      })
    );
  }

  S.figures = {
    figure: figure,
    uno: unoFigure,
    breadboard: breadboardFigure,
    breadboardUse: breadboardUseFigure,
    breadboardPair: breadboardPair,
    ide: ideFigure,
    piezoInside: piezoInsideFigure,
    squareWave: squareWaveFigure,
    freqScale: freqScaleFigure,
    piezoPins: piezoPinsFigure,
    staff: staffFigure,
    staffLine: staffLine,
    /** 그 카드에 붙일 그림을 만든다. 없으면 null. */
    forCard: function (id) {
      return BY_CARD[id] ? BY_CARD[id]() : null;
    },
    has: function (id) {
      return !!BY_CARD[id];
    }
  };
})();
    </script>
