  /**
   * 학번을 학년·반·번호로 가른다.  "10312" → { grade:1, classNumber:3, studentNumber:12 }
   * 다섯 자리가 아니거나 범위를 벗어나면 null.
   */
  function parseStudentId(value) {
    var s = text(value);
    var digits = LIMITS.studentIdDigits || 5;
    if (!new RegExp("^\\d{" + digits + "}$").test(s)) return null;

    var grade = parseInt(s.slice(0, 1), 10);
    var classNumber = parseInt(s.slice(1, 3), 10);
    var studentNumber = parseInt(s.slice(3, 5), 10);

    if (!isRange(grade, LIMITS.gradeMin, LIMITS.gradeMax)) return null;
    if (!isRange(classNumber, LIMITS.classMin, LIMITS.classMax)) return null;
    if (!isRange(studentNumber, LIMITS.numberMin, LIMITS.numberMax)) return null;

    return { grade: grade, classNumber: classNumber, studentNumber: studentNumber };
  }

  /** 「1학년 3반 12번」 처럼 사람이 읽는 말로 (학번이 이상하면 빈 문자열) */
  function describeStudentId(value) {
    var p = parseStudentId(value);
    if (!p) return "";
    return p.grade + "학년 " + p.classNumber + "반 " + p.studentNumber + "번";
  }

  /**
   * 돌려주는 것 : { ok, errors: { 항목이름: "메시지" } }
   * 메시지는 그 항목 «바로 아래» 에 붙인다.
   */
  function validateStudent(student) {
    var errors = {};
    var s = student || {};
    var digits = LIMITS.studentIdDigits || 5;

    var id = text(s.studentId);
    if (!id) {
      errors.studentId = "학번을 입력해 주세요.";
    } else if (!/^\d+$/.test(id)) {
      errors.studentId = "학번은 숫자만 넣어 주세요.";
    } else if (id.length !== digits) {
      errors.studentId = "학번은 " + digits + "자리입니다. 예) 10312 (1학년 3반 12번)";
    } else if (!parseStudentId(id)) {
      errors.studentId = "학번을 다시 확인해 주세요. 앞에서부터 학년 1자리, 반 2자리, 번호 2자리입니다.";
    }

    var name = text(s.name);
    if (name.length < LIMITS.nameMin || name.length > LIMITS.nameMax) {
      errors.name = "이름은 " + LIMITS.nameMin + "~" + LIMITS.nameMax + "자로 입력해 주세요.";
    }

    return { ok: Object.keys(errors).length === 0, errors: errors };
  }

  /* ------------------------------------------------------------------ */
  /* 단계별 통과 조건 (명세 5장 표)                                        */
  /* ------------------------------------------------------------------ */

  /**
   * 각 단계를 마쳤는가?
   *   돌려주는 것 : { ok, reasons: ["아직 못 한 일", ...] }
   *
   * 이전 단계로 가는 것은 «언제나» 허용한다. 이 검사는 «다음으로» 갈 때만 본다(명세 5장).
   */
  function checkStep(stepKey, state) {
    var s = state || {};
    var reasons = [];

    switch (stepKey) {
      case "intro":
        /* 시작 화면에서는 «묻지 않는다». 아직 배우지 않았으므로
           확인 질문 대신 안전 수칙 확인만으로 다음 단계를 연다. */
        if (!s.intro || s.intro.safetyRead !== true) {
          reasons.push("안전 수칙을 읽고 확인해 주세요.");
        }
        break;

      case "concept": {
        var checks = (s.concept && s.concept.checks) || {};
        var total = (PC.lesson && PC.lesson.CONCEPT_CHECK ? PC.lesson.CONCEPT_CHECK.length : 3);
        var passed = Object.keys(checks).filter(function (k) {
          return checks[k] === true;
        }).length;
        if (passed < total) {
          reasons.push("개념 확인 " + total + "문항을 모두 맞혀 주세요. (지금 " + passed + "/" + total + ")");
        }
        break;
      }

      case "circuit": {
        var c = s.circuit || {};
        if (c.findDone !== true) reasons.push("부품과 단자 찾기(3A)를 마쳐 주세요.");
        if (c.checkPassed !== true) reasons.push("[회로 점검] 의 다섯 항목을 모두 채워 주세요.");
        if (c.powerOn !== true) reasons.push("[전원 켜기] 로 회로에 전기를 넣어 주세요.");
        break;
      }

      case "code": {
        var code = s.code || {};
        /* 스케치를 배우기 «전» 에 작성으로 넘어가지 않게 한다.
           읽기·돌려 보기를 마치기 전에는 작성 칸 자체가 화면에 나오지 않는다. */
        if (code.learned !== true) {
          reasons.push("예시 프로그램을 먼저 읽고, 한 주기(켜짐 → 꺼짐)를 끝까지 관찰해 주세요.");
          break;
        }
        /**
         * ★ 조립과 빈칸을 «둘 다» 마쳐야 한다 (선생님 요청 2026-08-20).
         *
         *   방식을 하나 고르고 끝내면, 고르지 않은 쪽의 학습이 통째로 빠진다.
         *   조립은 «차례» 를 익히는 것이고 빈칸은 «줄을 직접 적는» 것이라
         *   배우는 것이 서로 다르다. 전체 편집은 그대로 «해 보고 싶은 사람» 의 자리다.
         */
        if (code.assembleDone !== true) reasons.push("[① 코드 조립] 을 완성해 주세요 — 여덟 항목을 모두 통과해야 합니다.");
        if (code.blanksDone !== true) reasons.push("[② 빈칸 채우기] 를 완성해 주세요 — 여덟 항목을 모두 통과해야 합니다.");

        if (!text(code.source)) reasons.push("코드를 작성해 주세요.");
        else if (code.testsPassed !== code.testsTotal || !code.testsTotal) {
          reasons.push(
            "코드 검사를 모두 통과해야 합니다. (지금 " + (code.testsPassed || 0) + "/" + (code.testsTotal || 0) + ")"
          );
        }
        if (code.ran !== true) reasons.push("[실행] 을 눌러 결과를 확인해 주세요.");
        break;
      }

      case "experiment": {
        /**
         * ★ 세 실험을 «모두» 실행하고 «세 칸을 모두» 채워야 통과한다.
         *
         *   명세 17.5 는 «최소 두 실험» 이지만, 선생님 요청으로 셋 다로 올렸다(2026-08-19).
         *   A·B·C 를 견주어 보는 것이 이 단계의 목적이라 하나라도 빠지면 견줄 것이 없다.
         *
         *   확장 활동(나만의 알림음 만들기)은 통과 조건이 «아니다» — 접어 둔 자리다.
         */
        var e = s.experiment || {};
        var runs = e.runs || {};
        var items = (PC.lesson && PC.lesson.EXPERIMENTS) || [];

        var notRun = [];
        var notWritten = [];

        items.forEach(function (item) {
          var r = runs[item.id] || {};
          if (r.ran !== true) {
            notRun.push(item.label);
            return;
          }
          /* 실행한 실험만 «빈칸» 을 따진다 — 아직 못 한 실험까지 나무라면 할 일이 겹쳐 보인다 */
          var blanks = [];
          if (contentLength(r.predict) < 4) blanks.push("예상");
          if (contentLength(r.observation) < (LIMITS.observationMin || 10)) blanks.push("관찰");
          if (contentLength(r.surprise) < 2) blanks.push("예상과 다른 점");
          if (blanks.length > 0) notWritten.push(item.label + "(" + blanks.join("·") + ")");
        });

        if (notRun.length > 0) {
          reasons.push("아직 실행하지 않은 실험이 있습니다 : " + notRun.join(", "));
        }
        if (notWritten.length > 0) {
          reasons.push(
            "아직 비어 있는 칸이 있습니다 : " +
              notWritten.join(", ") +
              " (관찰은 " +
              (LIMITS.observationMin || 10) +
              "자 이상)"
          );
        }
        break;
      }

      case "assess": {
        var a = s.assessment || {};
        var answers = a.answers || {};
        var questions = (PC.quiz && PC.quiz.QUESTIONS) || [];
        var missing = questions.filter(function (q) {
          return !PC.quiz.isAnswered(q, answers[q.id]);
        });
        if (missing.length > 0) {
          reasons.push(
            "아직 답하지 않은 문항이 있습니다 : " +
              missing
                .map(function (q) {
                  return q.no + "번";
                })
                .join(", ")
          );
        }
        break;
      }

      default:
        break;
    }

    return { ok: reasons.length === 0, reasons: reasons };
  }

  /** 지금 열 수 있는 가장 뒤 단계 (명세 5장 «통과 조건 충족 시 활성화») */
  function furthestStep(state) {
    var steps = PC.STEPS || [];
    for (var i = 0; i < steps.length; i += 1) {
      if (!checkStep(steps[i].key, state).ok) return i;
    }
    return steps.length - 1;
  }

  /** 해당 단계로 갈 수 있는가 — 뒤로 가는 것은 늘 열려 있다 */
  function canGoTo(index, state) {
    return index <= furthestStep(state);
  }

  /* ------------------------------------------------------------------ */
  /* 제출 자료 만들기 (명세 10장)                                          */
  /* ------------------------------------------------------------------ */

  /** 케이블 하나를 제출용으로 다듬는다 — 좌표가 아니라 «연결 그래프» 다(명세 6.2) */
  function cleanConnection(c) {
    return {
      fromComponent: text(c.fromComponent),
      fromPin: text(c.fromPin),
      toComponent: text(c.toComponent),
      toPin: text(c.toPin)
    };
  }

  /**
   * 보낼 자료를 만든다.
   *
   * 명세 10장의 항목 이름을 그대로 쓴다. 거기에 «누가·언제·어느 차시» 를 붙인다.
   * 학년·반·번호는 학번에서 갈라 낸 값이다. 교사 화면에서 반별로 거르는 데 쓴다.
   */
  function buildPayload(state, options) {
    var s = state || {};
    var o = options || {};
    var student = s.student || {};
    var seat = parseStudentId(student.studentId) || {};
    var quiz = PC.quiz;

    var circuit = s.circuit || {};
    var code = s.code || {};
    var experiment = s.experiment || {};
    var assessment = s.assessment || {};
    var answers = assessment.answers || {};

    var graded = quiz ? quiz.gradeAll(answers) : { isCorrect: [], score: 0, pass: false };
    var questions = quiz ? quiz.QUESTIONS : [];

    return {
      /* 누구의, 어느 차시 제출인가 */
      schemaVersion: SCHEMA_VERSION,
      lessonId: LESSON_ID,
      studentId: text(student.studentId),
      studentName: clip(student.name, LIMITS.nameMax),
      grade: seat.grade || 0,
      classNumber: seat.classNumber || 0,
      studentNumber: seat.studentNumber || 0,
      submittedAt: o.now || new Date().toISOString(),

      /* 3단계 — 회로 (명세 10장) */
      circuit: {
        connections: (circuit.connections || []).map(cleanConnection),
        attempts: Number(circuit.attempts) || 0,
        errors: (circuit.errors || []).slice(0, 50).map(function (e) {
          return { code: text(e.code), title: clip(e.title, 60), at: text(e.at) };
        }),
        completed: circuit.checkPassed === true,
        findAttempts: Number(circuit.findAttempts) || 0,
        hintsUsed: Number(circuit.hintsUsed) || 0,
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 피에조 종류 — 수동인지 모듈형인지에 따라 «뒤집힘» 의 뜻이 달라진다 */
        piezoMode: text(circuit.piezoMode),
        /* 회로 판정 결과를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              direction: text(circuit.path.direction),
              sigFromSource: circuit.path.sigFromSource === true,
              gndToGround: circuit.path.gndToGround === true,
              onPower: circuit.path.onPower === true,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      /* 4단계 — 코드 (명세 10장) */
      code: {
        source: clip(code.source, LIMITS.codeMax || 4000),
        testsPassed: Number(code.testsPassed) || 0,
        testsTotal: Number(code.testsTotal) || 0,
        attempts: Number(code.attempts) || 0,
        mode: text(code.mode),
        syntaxErrors: (code.syntaxErrors || []).slice(0, 20).map(function (e) {
          return { line: Number(e.line) || 0, message: clip(e.message, 200) };
        }),
        pinMismatch: (code.pinMismatch || []).slice(0, 20).map(function (p) {
          return { codePin: text(p.codePin), circuitPin: text(p.circuitPin), message: clip(p.message, 200) };
        })
      },

      /* 5단계 — 실험 (명세 10장 · 17.5) */
      experiment: {
        conditions: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              label: clip(item.label, 60),
              /* 무엇을 바꾼 실험인가 — 높이(freq) · 길이(toneMs) · 사이(stepMs) */
              change: text(item.change),
              factor: Number(item.factor) || 1,
              toneMs: Number(item.toneMs) || 0,
              stepMs: Number(item.stepMs) || 0,
              ran: r.ran === true,
              /* 실제로 울린 음의 수와 걸린 시간 */
              notes: Number(r.notes) || 0,
              elapsed: Number(r.elapsed) || 0
            };
          }),
        observations: (PC.lesson && PC.lesson.EXPERIMENTS ? PC.lesson.EXPERIMENTS : [])
          .filter(function (item) {
            return (experiment.runs || {})[item.id];
          })
          .map(function (item) {
            var r = (experiment.runs || {})[item.id] || {};
            return {
              id: item.id,
              predict: clip(r.predict, LIMITS.textMax),
              observation: clip(r.observation, LIMITS.textMax),
              surprise: clip(r.surprise, LIMITS.textMax)
            };
          }),
        /* 확장 활동 — 나만의 알림음 만들기 (명세 7장 화면5) */
        extension: {
          source: clip(experiment.extensionSource, LIMITS.codeMax || 4000),
          tried: experiment.extensionTried === true,
          /* 어떤 알림음을 골랐는가 — 성공음·경고음·호출음 */
          kind: text(experiment.extensionKind)
        }
      },

      /* 6단계 — 형성평가 (명세 10장) */
      assessment: {
        answers: questions.map(function (q) {
          var v = answers[q.id];
          return {
            id: q.id,
            no: q.no,
            type: q.type,
            value: q.type === "code" ? clip(v, LIMITS.textMax) : v === undefined || v === "" ? null : Number(v)
          };
        }),
        isCorrect: graded.isCorrect,
        score: graded.score,
        total: graded.total,
        pass: graded.pass,
        attempts: Number(assessment.attempts) || 0
      }
    };
  }

  /**
   * 같은 제출인지 가리는 열쇠 (명세 10장 «같은 학번·이름의 기존 JSON을 덮어쓴다»)
   * 학번과 이름과 차시가 같으면 같은 제출로 본다.
   */
  function dedupeKey(payload) {
    var p = payload || {};
    return [
      text(p.lessonId) || LESSON_ID,
      text(p.studentId),
      text(p.studentName).replace(/\s+/g, "")
    ].join("|");
  }

  /* ------------------------------------------------------------------ */
  /* 받은 자료 다듬기 — 교사용이 쓴다                                       */
  /* ------------------------------------------------------------------ */

  /**
   * 밖에서 들어온 JSON 을 믿지 않고 «있어야 할 모양» 으로 다듬는다.
   * 항목이 빠져 있어도 교사 화면이 깨지지 않게 한다.
   */
  function normalizeSubmission(raw) {
    var r = raw || {};
    var circuit = r.circuit || {};
    var code = r.code || {};
    var experiment = r.experiment || {};
    var assessment = r.assessment || {};
    var seat = parseStudentId(r.studentId) || {};

    function num(v) {
      var n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    return {
      schemaVersion: num(r.schemaVersion) || 1,
      lessonId: text(r.lessonId),
      studentId: text(r.studentId),
      studentName: text(r.studentName),
      grade: num(r.grade) || seat.grade || 0,
      classNumber: num(r.classNumber) || seat.classNumber || 0,
      studentNumber: num(r.studentNumber) || seat.studentNumber || 0,
      submittedAt: text(r.submittedAt),
      serverUpdatedAt: text(r.serverUpdatedAt),
      submissionId: text(r.submissionId),

      circuit: {
        connections: Array.isArray(circuit.connections) ? circuit.connections.map(cleanConnection) : [],
        attempts: num(circuit.attempts),
        errors: Array.isArray(circuit.errors) ? circuit.errors : [],
        completed: circuit.completed === true,
        findAttempts: num(circuit.findAttempts),
        hintsUsed: num(circuit.hintsUsed),
        powerOn: circuit.powerOn === true,
        findDone: circuit.findDone === true,
        /* 피에조 종류 — 수동인지 모듈형인지에 따라 «뒤집힘» 의 뜻이 달라진다 */
        piezoMode: text(circuit.piezoMode),
        /* 회로 판정 결과를 그대로 담는다 — 교사 화면이 이것을 읽는다 */
        path: circuit.path
          ? {
              direction: text(circuit.path.direction),
              sigFromSource: circuit.path.sigFromSource === true,
              gndToGround: circuit.path.gndToGround === true,
              onPower: circuit.path.onPower === true,
              shortCircuit: circuit.path.shortCircuit === true
            }
          : null
      },

      code: {
        source: text(code.source),
        testsPassed: num(code.testsPassed),
        testsTotal: num(code.testsTotal),
        attempts: num(code.attempts),
        mode: text(code.mode),
        syntaxErrors: Array.isArray(code.syntaxErrors) ? code.syntaxErrors : [],
        pinMismatch: Array.isArray(code.pinMismatch) ? code.pinMismatch : []
      },

      experiment: {
        conditions: Array.isArray(experiment.conditions) ? experiment.conditions : [],
        observations: Array.isArray(experiment.observations) ? experiment.observations : [],
        extension: experiment.extension || { source: "", tried: false }
      },

      assessment: {
        answers: Array.isArray(assessment.answers) ? assessment.answers : [],
        isCorrect: Array.isArray(assessment.isCorrect) ? assessment.isCorrect : [],
        score: num(assessment.score),
        total: num(assessment.total) || (PC.ASSESS ? PC.ASSESS.total : 10),
        pass: assessment.pass === true,
        attempts: num(assessment.attempts)
      }
    };
  }

  /** 이 차시의 제출이 맞는가 — 다른 차시 파일을 잘못 올렸을 때 걸러 낸다 */
  function isThisLesson(raw) {
    return text((raw || {}).lessonId) === LESSON_ID;
  }

  /* ------------------------------------------------------------------ */

  PC.schema = {
    text: text,
    clip: clip,
    contentLength: contentLength,
    parseStudentId: parseStudentId,
    describeStudentId: describeStudentId,
    validateStudent: validateStudent,
    checkStep: checkStep,
    furthestStep: furthestStep,
    canGoTo: canGoTo,
    buildPayload: buildPayload,
    dedupeKey: dedupeKey,
    normalizeSubmission: normalizeSubmission,
    isThisLesson: isThisLesson
  };

  if (typeof module !== "undefined" && module.exports) module.exports = PC.schema;
})();
    </script>

    <!-- 학생용 화면 -->
    <script data-from="student/s00-core.js">
/**
 * 학생용 코어 — 이름 공간과 상태 그릇
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.PC 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → constants → lesson → circuit → arduino → quiz → schema
 *   → s00-core → s10-ui → s20-store → s30-api → s40-board → s50-editor → s60-screens → s90-app
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /** 빈 상태 — 처음 열었을 때의 출발점 */

    var r = plainObject(raw);

    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

       (저장 자료를 손으로 고쳐 단계를 건너뛰지 못하게) */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;

  function hasContent(state) {
    if (!state) return false;
    if (state.circuit.connections.length > 0) return true;
    if (state.code.source) return true;
    if (Object.keys(state.experiment.runs || {}).length > 0) return true;
    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.intro.safetyRead || Object.keys(state.concept.checks).length > 0) return true;

    var d = new Date(iso);

      return (n < 10 ? "0" : "") + n;

    return (
      d.getFullYear() +
      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())

  }

      return el("div", { class: "choice" }, [
        input,
        el("label", { class: "choice__label", attrs: { for: id } }, [
          s.numbered === false
            ? null
            : el("span", { class: "choice__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
          el("span", { class: "choice__text", text: label })
        ])
      ]);
    });

    return el("fieldset", { class: "choices" }, [
      s.legend ? el("legend", { class: "choices__legend", text: s.legend }) : null
    ].concat(items));
  }

  function button(label, opts) {
    var o = opts || {};
    var attrs = {
      type: "button",
      disabled: o.disabled ? true : null,
      "aria-pressed": o.pressed === undefined ? null : o.pressed ? "true" : "false",
      title: o.title || null
    };
    /* 부르는 곳에서 aria-label 같은 것을 더 붙일 수 있게 */
    Object.keys(o.attrs || {}).forEach(function (k) {
      attrs[k] = o.attrs[k];
    });

    return el("button", {
      class: o.class && o.class.indexOf("btn") === 0 ? o.class : "btn " + (o.class || "btn--primary"),
      text: label,
      attrs: attrs,
      on: o.on || (o.click ? { click: o.click } : null)
    });
  }

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,
   * 초점을 상자 안에 잡아 준다. file:// 에서도 그대로 동작한다.
   *
   * spec = {
   *   title, lines[], okLabel, cancelLabel,
   *   onOk, onCancel,
   *   dismiss : "ok" | "cancel"   — Esc 로 닫았을 때 어느 쪽으로 볼지
   * }
   *
   * ★ Esc 로 닫으면 «지우지 않는 쪽» 이 되게 부르는 곳에서 dismiss 를 정한다.
   *   실수로 눌러 기록이 사라지는 일은 되돌릴 수 없다.
   */
  function askDialog(spec) {
    var s = spec || {};
    var dialog = el("dialog", { class: "modal" });
    var settled = false;

    function done(which) {
      if (settled) return;
      settled = true;
      if (dialog.open && dialog.close) dialog.close();
      /* 닫는 애니메이션이 끝난 뒤 치운다 */
      setTimeout(function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
      }, 0);
      if (which === "ok" && s.onOk) s.onOk();
      if (which === "cancel" && s.onCancel) s.onCancel();
    }

    var okBtn = button(s.okLabel || "확인", {
      click: function () {
        done("ok");
      }
    });

    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", text: s.title || "" }),
        el(
          "p",
          { class: "modal__text" },
          (s.lines || []).map(function (line, i) {
            /* 줄바꿈을 innerHTML 없이 만든다 (명세 15장 — 글은 textContent 로만) */
            return el("span", { class: "modal__line", text: line, id: i === 0 ? null : undefined });
          })
        ),
        el("div", { class: "modal__actions" }, [
          button(s.cancelLabel || "취소", {
            class: "btn btn--ghost",
            click: function () {
              done("cancel");
            }
          }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */
    okBtn.focus();

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 화면 낭독기에 조용히 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  S.ui = {
    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();
    </script>
    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical3-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();
    </script>
    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {

    <script data-from="student/s35-audio.js">
/**
 * 소리 내기와 오실로스코프 (명세 6.3 · 13장)
 *
 * ★ 브라우저는 «학생이 누르기 전» 에는 소리를 내주지 않는다(자동 재생 제한).
 *   그래서 소리를 내는 길은 반드시 [소리 켜기] 를 한 번 거치게 되어 있다(명세 12장).
 *   unlock() 을 부르기 전에는 play() 를 불러도 아무 일도 일어나지 않는다.
 *
 * ★ 소리는 «곁들이는 것» 이다. 소리가 나지 않는 기기에서도 학습이 끊기지 않도록
 *   파형·음이름·주파수 숫자가 늘 함께 나온다(명세 13장 «색만으로 뜻을 전하지 않는다» 와 같은 뜻).
 *
 * ★ 실제 피에조는 «네모 물결(구형파)» 을 낸다. 사인파보다 거칠고 날카로운 그 소리를
 *   그대로 들려주어야 실물과 같은 인상을 준다. 그래서 oscillator 를 square 로 둔다.

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});
  var UI = S.ui;

  /** SVG 안의 글자 — UI.svg 는 문자열 자식을 받지 않으므로 마디로 만들어 넘긴다 */
  function txt(value) {
    return document.createTextNode(String(value));
  }

  var FREQ_MIN = PC.FREQ_MIN || 31;
  var FREQ_MAX = PC.FREQ_MAX || 4000;

  /* ------------------------------------------------------------------ */
  /* 1. 소리 만들기                                                       */
  /* ------------------------------------------------------------------ */

  var ctx = null;
  var master = null;
  var osc = null;
  var unlocked = false;
  var muted = false;
  var volume = 0.25; /* 교실에서 여럿이 켜므로 «작게» 시작한다 */
  var listeners = [];

  /** 이 브라우저가 소리를 만들 수 있는가 */
  function supported() {
    return typeof root.AudioContext === "function" || typeof root.webkitAudioContext === "function";
  }

  function notify() {
    listeners.forEach(function (fn) {
      try {
        fn(status());
      } catch (err) {
        /* 듣는 이 하나가 잘못되어도 소리는 계속 나야 한다 */
      }
    });
  }

  /**
   * 소리를 연다 — 반드시 «학생이 누른» 자리에서 불러야 한다(명세 6.3).
   * 돌려주는 것 : 열렸는가(boolean)
   */

    if (!supported()) return false;
    if (unlocked && ctx) {
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      return true;

    try {
      var Ctor = root.AudioContext || root.webkitAudioContext;
      ctx = new Ctor();
      master = ctx.createGain();
      master.gain.value = 0; /* 조용한 상태로 열어 둔다 — 여는 순간 «삑» 하지 않게 */
      master.connect(ctx.destination);
      if (ctx.state === "suspended" && ctx.resume) ctx.resume();
      unlocked = true;
      notify();
      return true;
    } catch (err) {
      ctx = null;
      unlocked = false;
      return false;
    }
  }

  function isUnlocked() {
    return unlocked === true && ctx !== null;
  }

  /** 지금 실제로 소리가 나갈 세기 */
  function gainNow() {
    return muted ? 0 : volume;
  }

  /**
   * 그 주파수로 울린다. hz 가 0 이하면 멈춘다.
   * 소리를 열지 않았으면 «아무 일도 하지 않는다» — 조용히 넘어간다.
   */
  function play(hz) {
    if (!isUnlocked()) return false;
    var freq = Math.round(Number(hz) || 0);
    if (!(freq > 0)) {
      stop();
      return false;

    freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, freq));

    var now = ctx.currentTime;

      osc.type = "square";

      osc.start();

      osc.frequency.setValueAtTime(freq, now);

    /* 갑자기 켜면 «툭» 소리가 난다. 아주 짧게 올린다. */

    master.gain.setValueAtTime(master.gain.value, now);

  /** 소리를 멈춘다 (진동자는 남겨 두었다가 다시 쓴다) */
  function stop() {

  /** 화면을 떠날 때 — 소리가 남지 않게 확실히 끊는다 */

  function status() {
    return {
      supported: supported(),
      unlocked: isUnlocked(),
      muted: muted,
      volume: volume

  }

  function onChange(fn) {
    if (typeof fn === "function") listeners.push(fn);
  }

  /* ------------------------------------------------------------------ */
  /* 2. 소리 조절 상자 — [소리 켜기] · 음소거 · 볼륨 (명세 6.3)             */
  /* ------------------------------------------------------------------ */

  /**
   * 어느 화면에나 붙일 수 있는 조절 상자를 만든다.
   *   opts.note  : 상자 아래에 덧붙일 한 줄
   *   opts.onUnlock : 소리가 열린 순간 한 번 부른다 (미리 듣기 등)
   */
  function controls(opts) {
    var o = opts || {};
    var MSG = PC.MESSAGES || {};

    if (!supported()) {
      return UI.el("div", { class: "audiobar audiobar--off" }, [
        UI.el("p", { class: "audiobar__note", text: MSG.audioUnsupported || "이 브라우저에서는 소리를 만들 수 없습니다." })
      ]);
    }

    var stateText = UI.el("span", { class: "audiobar__state", text: "" });

    var unlockBtn = UI.button("🔈 소리 켜기", {
      class: "btn btn--primary btn--small",
      click: function () {
        if (unlock()) {
          UI.toast("소리를 켰습니다. 볼륨을 낮게 두고 시작하세요.");
          if (o.onUnlock) o.onUnlock();
        } else {
          UI.toast("이 브라우저에서는 소리를 만들 수 없습니다.");
        }
        paint();
      }
    });

    var muteBtn = UI.button("음소거", {
      class: "btn btn--ghost btn--small",
      click: function () {
        setMuted(!muted);
        paint();
      }
    });

    var slider = UI.el("input", {
      class: "audiobar__range",
      attrs: {
        type: "range",
        min: "0",
        max: "100",
        step: "5",
        value: String(Math.round(volume * 100)),
        "aria-label": "소리 크기"
      }
    });
    slider.addEventListener("input", function () {
      setVolume(Number(slider.value) / 100);
      paint();
    });

    var volText = UI.el("span", { class: "audiobar__vol", text: "" });

    function paint() {
      var st = status();
      unlockBtn.disabled = st.unlocked;
      unlockBtn.textContent = st.unlocked ? "🔈 소리 켜짐" : "🔈 소리 켜기";
      muteBtn.disabled = !st.unlocked;
      muteBtn.textContent = st.muted ? "🔇 음소거 해제" : "🔊 음소거";
      slider.disabled = !st.unlocked || st.muted;
      volText.textContent = Math.round(st.volume * 100) + "%";
      /* 색만으로 알리지 않는다 — 지금 상태를 «글자» 로 적는다(명세 13장) */
      stateText.textContent = !st.unlocked
        ? "소리 꺼짐 — 아직 들리지 않습니다"
        : st.muted
        ? "음소거 — 파형만 움직입니다"
        : "소리 켜짐";
    }

    var bar = UI.el("div", { class: "audiobar" }, [
      UI.el("div", { class: "audiobar__row" }, [unlockBtn, muteBtn, slider, volText, stateText]),
      UI.el("p", {
        class: "audiobar__note",
        text: o.note || MSG.audioLocked || "브라우저는 «누르기 전» 에는 소리를 내지 않습니다."

  /* ------------------------------------------------------------------ */
  /* 3. 가상 오실로스코프 (명세 6.3)                                       */
  /*                                                                    */
  /* ★ 주파수를 올리면 «파형 간격이 좁아지는 것» 이 눈에 보여야 한다.        */
  /*   그래서 가로축을 «늘 같은 시간(ms)» 으로 두고 그 안에 물결을 채운다.   */
  /*   축이 함께 늘어나면 파형이 그대로 보여 아무것도 배울 수 없다.          */
  /* ------------------------------------------------------------------ */

  /** 화면에 보여 줄 시간 폭(ms). 이 안에 몇 개의 물결이 들어오는지가 곧 주파수다. */
  var SCOPE_MS = 8;

  /**
   * 오실로스코프 하나를 만든다.
   * 돌려주는 것 : { root, set(hz), setNote(text) }

  function scope(opts) {

    var W = 520;
    var H = 150;
    var pad = 26;

    var path = UI.svg("path", { class: "scope__line", d: "" });
    var hzText = UI.el("span", { class: "scope__hz", text: "—" });
    var noteText = UI.el("span", { class: "scope__note", text: "조용함" });
    var cycleText = UI.el("span", { class: "scope__cycles", text: "" });

    var svgNode = UI.svg(
      "svg",
      {
        viewBox: "0 0 " + W + " " + H,
        class: "scope__svg",
        role: "img",
        "aria-label": "주파수 파형 — " + SCOPE_MS + "밀리초 동안의 모습"
      },
      [
        UI.svg("rect", { x: 0, y: 0, width: W, height: H, class: "scope__bg" }),
        /* 눈금 — 1ms 마다 세로줄 */
        UI.svg("g", { class: "scope__grid" }, (function () {
          var lines = [];
          for (var i = 0; i <= SCOPE_MS; i += 1) {
            var x = pad + ((W - pad * 2) * i) / SCOPE_MS;
            lines.push(UI.svg("line", { x1: x, y1: 12, x2: x, y2: H - 26, class: "scope__gridline" }));
          }
          return lines;
        })()),
        UI.svg("line", { x1: pad, y1: 30, x2: W - pad, y2: 30, class: "scope__level" }),
        UI.svg("line", { x1: pad, y1: H - 44, x2: W - pad, y2: H - 44, class: "scope__level" }),
        UI.svg("text", { x: 6, y: 34, class: "scope__axis" }, [txt("5V")]),
        UI.svg("text", { x: 6, y: H - 40, class: "scope__axis" }, [txt("0V")]),
        UI.svg("text", { x: W / 2, y: H - 8, class: "scope__axis" }, [
          txt("가로축 : " + SCOPE_MS + "ms (늘 같음)")
        ]),
        path
      ]
    );

    /** hz 로 네모 물결을 그린다. 0 이면 평평한 줄. */
    function set(hz) {
      var freq = Math.max(0, Math.round(Number(hz) || 0));
      var x0 = pad;
      var x1 = W - pad;
      var hi = 30;
      var lo = H - 44;

      if (!(freq > 0)) {
        path.setAttribute("d", "M " + x0 + " " + lo + " L " + x1 + " " + lo);

        noteText.textContent = "조용함";
        cycleText.textContent = "";
        svgNode.setAttribute("aria-label", "파형 없음 — 조용한 상태");
        return;
      }

      /* SCOPE_MS 동안 몇 번 오르내리는가 */
      var cycles = (freq * SCOPE_MS) / 1000;
      /* 너무 촘촘하면 선이 새까매진다. 그때는 «촘촘함» 만 보이면 된다. */
      var drawn = Math.max(0.5, Math.min(cycles, 40));
      var span = x1 - x0;
      var d = "M " + x0 + " " + lo;
      var half = span / (drawn * 2);
      var x = x0;
      var up = true;
      while (x < x1) {
        var y = up ? hi : lo;
        d += " L " + x.toFixed(1) + " " + y;
        x += half;
        if (x > x1) x = x1;
        d += " L " + x.toFixed(1) + " " + y;
        up = !up;
      }
      path.setAttribute("d", d);

      var name = PC.arduino ? PC.arduino.noteNameOf(freq) : "";
      hzText.textContent = freq + "Hz";
      noteText.textContent = name ? "음이름 " + name : "음이름에 딱 맞지 않는 높이";
      cycleText.textContent = SCOPE_MS + "ms 안에 " + cycles.toFixed(1) + "번 오르내림";
      svgNode.setAttribute(
        "aria-label",
        freq + "헤르츠 파형. " + SCOPE_MS + "밀리초 동안 " + cycles.toFixed(1) + "번 오르내립니다." +
          (name ? " 음이름은 " + name + " 입니다." : "")
      );
    }

    var rootEl = UI.el("div", { class: "scope" }, [
      UI.el("div", { class: "scope__canvas" }, [svgNode]),
      UI.el("div", { class: "scope__readout" }, [
        UI.el("span", { class: "scope__label", text: "지금 주파수" }),
        hzText,
        noteText,

    set(o.hz || 0);

  }

  /* ------------------------------------------------------------------ */
  /* 4. 가락 재생 — 음을 차례로 들려준다 (명세 7장 화면5)                    */
  /* ------------------------------------------------------------------ */

  /**
   * 음 목록을 차례로 울린다.
   *
   *   notes   : [{ name, hz }, ...]
   *   toneMs  : 한 음이 울리는 시간
   *   stepMs  : 다음 음까지의 간격 (toneMs 보다 길어야 «사이» 가 생긴다)
   *   onNote(index, note, hz) : 음이 바뀔 때마다 부른다 — 파형·글자를 함께 움직이려는 것
   *
   * ★ 아두이노의 tone(…, toneMs) + delay(stepMs) 와 «같은 규칙» 으로 울린다.
   *   그래야 화면에서 들은 것과 실물에서 들을 것이 같다.

    var stepMs = Math.max(toneMs, Number(o.stepMs) || toneMs + 150);
    var list = (notes || []).filter(function (nt) {
      return nt && nt.hz > 0;
    });
    var timers = [];
    var alive = true;

    function at(ms, fn) {
      timers.push(setTimeout(fn, ms));
    }

    function stopAll() {
      alive = false;
      timers.forEach(function (id) {
        clearTimeout(id);
      });
      timers = [];
      stop();
      if (o.onNote) o.onNote(-1, null, 0);
    }

    /**
     * ★★ 음마다 길이가 «다를» 수 있다.
     *
     *   음계 여덟 개나 알림음은 모든 음이 같은 길이라 stepMs 하나로 넉넉했다.
     *   그런데 악보에는 ♩ 과 ♪ 과 ♩. 이 섞여 있다(5단계 예시 악보).
     *   그래서 음이 slotMs 를 들고 오면 «그 음만» 그 길이로 울린다.
     *
     *   ★ 사이(gapMs)는 slotMs 에서 «빼서» 쓴다 — 더하지 «않는다».
     *     더하면 음마다 밀려 곡 전체가 늘어진다. 실물 코드도 같은 규칙이다:
     *       tone(pin, hz, dur - GAP);  delay(dur);
     */
    var gapMs = Math.max(0, Number(o.gapMs) || 0);
    var cursor = 0;

    list.forEach(function (note, i) {
      var slot = note.slotMs > 0 ? note.slotMs : stepMs;
      var sound = note.slotMs > 0 ? Math.max(20, slot - gapMs) : toneMs;
      var start = cursor;
      cursor += slot;

      at(start, function () {
        if (!alive) return;
        play(note.hz);
        if (o.onNote) o.onNote(i, note, note.hz);
      });
      at(start + sound, function () {
        if (!alive) return;
        stop();
        if (o.onNote) o.onNote(i, note, 0);
      });
    });

    var totalMs = cursor;

    /* 다 끝나면 확실히 조용하게 */
    at(totalMs + 60, function () {
      if (!alive) return;
      stopAll();
      if (o.onDone) o.onDone();
    });

    return { stop: stopAll, totalMs: totalMs };
  }

  S.audio = {
    supported: supported,
    unlock: unlock,
    isUnlocked: isUnlocked,
    play: play,
    stop: stop,
    shutdown: shutdown,
    setMuted: setMuted,
    setVolume: setVolume,
    status: status,
    onChange: onChange,
    controls: controls,
    scope: scope,
    melody: melody,
    SCOPE_MS: SCOPE_MS
  };
})();

  var WIRE_COLORS = {

    orange: "#ea580c",
    blue: "#1d4ed8",
    /* 회로에 쓰이지 않는 케이블 — 흐리게 두어 «이건 빠져 있다» 가 보이게 */
    gray: "#9aa3ae"
  };

  /** 케이블 색을 말로 — 색만으로 뜻을 전하지 않기 위해(명세 13장) */
  var COLOR_WORD = {
    red: "빨강",
    black: "검정",
    yellow: "노랑",
    orange: "주황",
    blue: "파랑",
    gray: "회색"
  };

  /**
   * ★ 케이블 색은 «회로의 어느 쪽인가» 로 정한다.
   *
   *   D8 → 피에조 신호 단자      가 모두 «주황»  (신호가 나가는 길)
   *   피에조 접지 단자 → GND     가 모두 «파랑»  (전류가 돌아오는 길)
   *
   *   두 끝만 보고 색을 정하면 가운데 케이블(브레드보드를 거치는 사이)이
   *   양쪽 다 같은 색이 되어 «어디까지가 어느 쪽인지» 가 보이지 않는다.
   *
   *   색은 판정에 쓰지 않는다(명세 6.1). 그래서 옆에 «D11 쪽/GND 쪽» 글자를 함께 적는다.
   */
  var SIDE_COLOR = { source: "orange", ground: "blue", "": "gray" };
  var SIDE_WORD = { source: (PC.SPEAKER_PIN_NAME || "D8") + " 쪽", ground: "GND 쪽", "": "쓰이지 않음" };

  /**
   * 그림 폭을 정한다 — 이 계산은 «한 곳» 에만 둔다.
   *
   * 폭을 픽셀로 직접 적는 까닭 : CSS 의 min-width 와 함께 쓰면
   * 좁은 화면에서 min-width 가 이겨 확대·축소 단추가 아무 일도 하지 않는다.
   *
   * 좁은 칸에서는 바닥값을 두어 단자가 손가락보다 작아지지 않게 한다(명세 6.1).
   * 그래도 [−] 로 줄이면 전체를 한눈에 볼 수 있다.
   */
  function fitSvg(host, zoom) {
    var svgNode = host.querySelector("svg");
    if (!svgNode) return;
    var available = host.clientWidth || 320;
    var base = available < 560 ? Math.max(available, 640) : available;
    svgNode.style.width = Math.round(base * zoom) + "px";
  }

  /**
   * 창 크기가 바뀌면 폭을 다시 맞춘다.
   *
   * 픽셀로 적어 둔 폭은 창이 바뀌어도 그대로 남는다.
   * 그러면 화면을 돌리거나 창을 줄였을 때 단자가 손가락보다 작아진 채로 있다.
   * 그림마다 듣는 이를 붙이면 화면을 다시 그릴 때 쌓이므로, «한 번만» 붙이고
   * 그때그때 화면에 놓인 그림을 찾아 고친다.
   */
  if (root.addEventListener) {
    root.addEventListener("resize", function () {
      UI.$$(".board__canvas[data-zoom]").forEach(function (host) {
        fitSvg(host, Number(host.getAttribute("data-zoom")) || 1);
      });
    });
  }

  /**
   * 회로 화면 하나를 만든다.
   *
   *   opts.mode        'find'(단자 찾기) · 'wire'(결선)
   *   opts.showBoard   우노를 보일 것인가 (기본 true)
   *   opts.showBread   브레드보드를 보일 것인가
   *   opts.getState    () => 회로 상태 { connections, powerOn, ... }
   *   opts.onPick      (component, pin) => void        — 단자를 하나 눌렀을 때 (find 모드)
   *   opts.onConnect   (connection) => void            — 케이블이 하나 생겼을 때
   *   opts.onMessage   (text) => void                  — 안내 문구를 바깥에 알릴 때
   */
  function create(opts) {
    var o = opts || {};
    var mode = o.mode || "wire";
    var showBoard = o.showBoard !== false;
    var showBread = o.showBread === true;
    /* 이 차시에는 피에조가 있다. 3A(찾기)와 3B(결선) 모두 부품을 보여 준다. */
    var showParts = o.showParts !== false;

    var zoom = 1;
    var pending = null; /* 첫 번째로 고른 단자 */
    var focusKey = showBoard ? "uno/" + C.SPEAKER_PIN_NAME : showBread ? "bb/TP-1" : "piezo/SIG";

    var svgHost = UI.el("div", { class: "board__canvas" });
    var statusLine = UI.el("p", {
      class: "board__status",
      attrs: { role: "status", "aria-live": "polite" },
      text: ""
    });

    /* ------------------------------------------------------------------ */
    /* 그리기                                                              */
    /* ------------------------------------------------------------------ */

    function keyOf(componentId, pinId) {
      return componentId + "/" + pinId;
    }

    function splitKey(key) {
      var i = String(key).indexOf("/");
      return { component: key.slice(0, i), pin: key.slice(i + 1) };
    }

    /** 지금 이 단자가 선택 상태인가 */
    function isPending(componentId, pinId) {
      return pending && pending.component === componentId && pending.pin === pinId;
    }

    /** 화면 낭독기가 읽을 단자 설명 */
    function terminalLabel(componentId, pin, net, powerOn) {
      var parts = [C.describe(componentId, pin.id)];
      parts.push(C.KIND_WORD[pin.kind] || "단자");
      if (powerOn && net) {
        var v = net.potentialAt(componentId, pin.id);
        if (v === 5) parts.push("5V 전원");
        else if (v === 0) parts.push("0V 접지");
      }
      if (isPending(componentId, pin.id)) parts.push("선택됨");
      return parts.join(", ");
    }

    function drawUno(state, net, powerOn) {
      var g = UI.svg("g", { class: "uno" });
      var box = C.UNO.box;

      g.appendChild(
        UI.svg("rect", {
          x: box.x, y: box.y, width: box.w, height: box.h,
          rx: 12, class: "uno__body"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.usbBox.x, y: C.UNO.usbBox.y,
          width: C.UNO.usbBox.w, height: C.UNO.usbBox.h,
          rx: 3, class: "uno__usb"
        })
      );
      g.appendChild(
        UI.svg("rect", {
          x: C.UNO.jackBox.x, y: C.UNO.jackBox.y,
          width: C.UNO.jackBox.w, height: C.UNO.jackBox.h,
          rx: 4, class: "uno__jack"
        })
      );

      /* 헤더 띠 */
      [C.UNO.headerTop, C.UNO.headerBottom].forEach(function (h) {
        g.appendChild(UI.svg("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 4, class: "uno__header" }));
      });

      /* 보드 이름 — 두 머리띠 사이의 빈 자리에 */
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 140, class: "uno__brand" }, [txt("ARDUINO UNO")]));
      g.appendChild(UI.svg("text", { x: box.x + 16, y: 162, class: "uno__brandsub" }, [txt("오픈 소스 하드웨어")]));

      /* 무리 이름 — 핀 이름표와 겹치지 않도록 머리띠 «바깥쪽» 에 둔다 */
      g.appendChild(UI.svg("text", { x: 300, y: C.UNO.groupY.top, class: "uno__group" }, [txt("DIGITAL (PWM ~)")]));
      g.appendChild(UI.svg("text", { x: 88, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("POWER")]));
      g.appendChild(UI.svg("text", { x: 400, y: C.UNO.groupY.bottom, class: "uno__group" }, [txt("ANALOG IN")]));

      C.UNO.pins.forEach(function (pin) {
        g.appendChild(drawPin("uno", pin, state, net, powerOn));
      });
      return g;
    }

    function drawBreadboard(state, net, powerOn) {
      var g = UI.svg("g", { class: "bb" });
      var box = C.BB.box;

      g.appendChild(
        UI.svg("rect", { x: box.x, y: box.y, width: box.w, height: box.h, rx: 8, class: "bb__body" })
      );

      /* 전원 레일 줄무늬 — 어느 레일에 전기가 왔는지 색과 «글자» 로 함께 보인다 */
      C.BB.rails.forEach(function (rail) {
        var live = powerOn && net ? net.potentialOf("bb:rail:" + rail.id) : null;
        var cls = "bb__railline bb__railline--" + rail.polarity + (live !== null ? " bb__railline--live" : "");
        g.appendChild(
          UI.svg("line", { x1: box.x + 10, y1: rail.y, x2: box.x + box.w - 10, y2: rail.y, class: cls })
        );
        g.appendChild(
          UI.svg("text", { x: box.x + 6, y: rail.y + 5, class: "bb__railmark" }, [txt(rail.label)])
        );
        /* 전압 표시는 판 «바깥» 오른쪽에 적는다.
           판 안에 적으면 마지막 구멍과 겹치고 글자가 판 밖으로 잘린다. */
        if (live !== null) {
          g.appendChild(
            UI.svg("text", { x: box.x + box.w + 8, y: rail.y + 5, class: "bb__raillive" }, [
              txt(live === 5 ? "5V" : "0V")
            ])
          );
        }
      });

      /* 가운데 홈 */
      g.appendChild(
        UI.svg("rect", { x: box.x + 8, y: C.BB.gap.y, width: box.w - 16, height: C.BB.gap.h, class: "bb__gap" })
      );
      g.appendChild(
        UI.svg("text", { x: box.x + box.w / 2, y: C.BB.gap.y + 17, class: "bb__gaptext" }, [
          txt("여기서 전극이 끊긴다 — 위 A~E 와 아래 F~J 는 다른 전극")
        ])
      );

      /* 열 번호 — 자리는 A 줄 구멍의 x 를 그대로 쓴다 */
      for (var c = 1; c <= C.BB.cols; c += 1) {
        var aPin = C.terminal("bb", "A" + c);
        if (aPin) {
          g.appendChild(UI.svg("text", { x: aPin.x, y: C.BB.colNoY, class: "bb__colno" }, [txt(String(c))]));
        }
      }


      /* 행 문자 A~J — 실물처럼 구멍 왼쪽에 적는다.
         구멍마다 낭독기용 이름("브레드보드 A1 구멍")이 이미 있으므로
         이 글자는 눈으로 볼 때만 필요하다. */
      C.BB.rowsUpper.concat(C.BB.rowsLower).forEach(function (row) {
        var pin = C.terminal("bb", row + "1");
        if (!pin) return;
        g.appendChild(
          UI.svg("text", { x: C.BB.rowLabelX, y: pin.y + 4, class: "bb__rowlabel" }, [txt(row)])
        );
      });
      C.BB.pins.forEach(function (pin) {
        g.appendChild(drawPin("bb", pin, state, net, powerOn));
      });
      return g;
    }

    /* ------------------------------------------------------------------ */
    /* 부품 — 피에조 스피커 (명세 6.1 · 13장)                               */
    /*                                                                    */
    /* ★ 사진을 베끼지 않고 자체 SVG 로 그린다(명세 13장).                   */
    /* ★ 극성을 «색으로만» 알리지 않는다. 몸통의 ＋ 표시와 단자 이름표를 함께 쓴다.
       ★★ 다리 «길이» 는 쓰지 않는다 — 실물은 두 다리가 같은 길이인 것이 많다. */
    /* ★ 수동/모듈형에 따라 «단자에 적히는 글자» 가 달라진다(명세 6.3).       */
    /* ------------------------------------------------------------------ */

    /**
     * 소리가 나는 것을 «색으로만» 알리지 않는다.
     * 울리는 동안에는 몸통 둘레에 물결을 그리고, 아래에 «♪ 523Hz» 라고 적는다.
     */
    function drawPiezo(st, net, powerOn) {
      var P = C.PIEZO;
      var spec = C.modeSpec(st.piezoMode);
      var isModule = spec.id === "module";
      var hz = powerOn ? Number(st.hz) || 0 : 0;
      var sounding = hz > 0;

      var g = UI.svg("g", {
        class: "part part--piezo" + (sounding ? " part--sounding" : "")
      });
      var b = P.body;

      g.appendChild(
        UI.svg("rect", {
          x: P.box.x, y: P.box.y, width: P.box.w, height: P.box.h,
          rx: 10, class: "part__tray"
        })
      );

      /* 이름과 «울림/조용함» 은 몸통 «위» 에 적는다.
         아래에 두면 다리 끝의 ＋ / − 이름표와 부딪힌다. */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: P.nameY, class: "part__name" }, [
          txt("피에조 스피커 (" + spec.short + ")")
        ])
      );
      /* 소리 남·안 남을 색이 아니라 글자로도 (명세 13장) */
      g.appendChild(
        UI.svg("text", { x: b.cx, y: P.stateY, class: "part__state" }, [
          txt(powerOn ? (sounding ? "♪ " + hz + "Hz 울림" : "○ 조용함") : "전원 꺼짐")
        ])
      );

      /* 모듈형이면 몸통 «뒤» 에 기판을 깐다 — 종류가 눈에 보이게 */
      if (isModule) {
        var bd = P.boardBox;
        g.appendChild(
          UI.svg("rect", {
            x: bd.x, y: bd.y, width: bd.w, height: bd.h, rx: 5, class: "piezo__board"
          })
        );
      }

      /* 다리 — 둘의 길이가 «같다». 극성은 몸통의 ⊕ 표시와 이름표가 알린다. */
      ["SIG", "GND"].forEach(function (id) {
        var leg = P.legs[id];
        g.appendChild(
          UI.svg("line", {
            x1: leg.from.x, y1: leg.from.y, x2: leg.to.x, y2: leg.to.y,
            class: "part__lead part__lead--" + id
          })
        );
      });

      /* 몸통 — 실물처럼 검은 원통. 가운데에 소리 구멍이 뚫려 있다. */
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r, class: "piezo__case" }));
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r - 5, class: "piezo__top" }));
      g.appendChild(UI.svg("circle", { cx: b.cx, cy: b.cy, r: 5, class: "piezo__hole" }));

      /**
       * ⊕ 극성 표시.
       * ★★ 신호 다리와 «같은 쪽» 에 찍는다(circuit.js 의 PIEZO.mark).
       *   표시와 다리가 어긋나 있으면 어느 다리를 말하는지 알 수 없다.
       */
      var m = P.mark;
      g.appendChild(UI.svg("circle", { cx: m.x, cy: m.y, r: m.r, class: "piezo__markring" }));
      g.appendChild(UI.svg("text", { x: m.x, y: m.y + 4, class: "piezo__mark" }, [txt("＋")]));

      /* 울리는 동안 퍼지는 물결 — 소리를 «그림으로» 도 알린다 */
      if (sounding) {
        [9, 17].forEach(function (extra) {
          g.appendChild(
            UI.svg("circle", { cx: b.cx, cy: b.cy, r: b.r + extra, class: "piezo__wave" })
          );
        });
      }
      return g;
    }

    function drawParts(st, net, powerOn) {
      var g = UI.svg("g", { class: "parts" });
      g.appendChild(drawPiezo(st, net, powerOn));
      C.PARTS.forEach(function (part) {
        part.pins.forEach(function (pin) {
          g.appendChild(drawPin(part.id, pin, st, net, powerOn));
        });
      });
      return g;
    }

    /** 단자 하나 — 눌리는 자리는 보이는 원보다 넉넉하게 잡는다(터치용) */
    function drawPin(componentId, pin, state, net, powerOn) {
      var key = keyOf(componentId, pin.id);
      var selected = isPending(componentId, pin.id);
      var volts = powerOn && net ? net.potentialAt(componentId, pin.id) : null;

      var classes = ["pin", "pin--" + pin.kind];
      if (selected) classes.push("pin--selected");
      if (volts === 5) classes.push("pin--hot");
      if (volts === 0) classes.push("pin--gnd");

      var g = UI.svg("g", {
        class: classes.join(" "),
        role: "button",
        tabindex: focusKey === key ? "0" : "-1",
        "data-key": key,
        "aria-label": terminalLabel(componentId, pin, net, powerOn)
      });

      /* 넓은 투명 판 — 손가락으로 눌러도 빗나가지 않게 */
      g.appendChild(
        UI.svg("rect", {
          x: pin.x - C.PITCH / 2, y: pin.y - C.PITCH / 2,
          width: C.PITCH, height: C.PITCH,
          class: "pin__hit"
        })
      );
      g.appendChild(UI.svg("circle", { cx: pin.x, cy: pin.y, r: 6.5, class: "pin__dot" }));

      /* 부품 다리 이름표 — 피에조의 두 단자를 «글자로» 알린다(명세 6.1).
         ★ 수동이면 ＋ / −, 모듈형이면 SIG / GND 로 적힌다(명세 6.3).
         이름을 적지 않으면 어느 다리가 신호 쪽인지 그림만으로 헷갈린다. */
      if (componentId === "piezo") {
        g.appendChild(
          UI.svg("text", { x: pin.x, y: pin.y + 18, class: "pin__label pin__label--part" }, [
            txt(C.pinMark(pin.id, state ? state.piezoMode : null))
          ])
        );
      }

      /* 이름표 — 모든 사용 가능 단자에 실제 명칭을 적는다(명세 6.1).
         위 핀은 아래쪽에, 아래 핀은 위쪽에 적어 무리 이름과 겹치지 않게 한다. */
      if (componentId === "uno") {
        g.appendChild(
          UI.svg(
            "text",
            {
              x: pin.x,
              y: pin.side === "top" ? C.UNO.labelY.top : C.UNO.labelY.bottom,
              /* 이름표는 «모두 같은 크기» 다.
                 긴 이름을 줄이면 학생 눈에는 «왜 이것만 작지?» 로 보인다.
                 대신 circuit.js 가 헤더 간격을 30 으로 벌려 두었다. */
              class: "pin__label"
            },
            [txt(pin.label)]
          )
        );
      }

      g.addEventListener("click", function () {
        pick(componentId, pin.id);
      });
      g.addEventListener("keydown", function (evt) {
        onPinKey(evt, componentId, pin);
      });
      g.addEventListener("focus", function () {
        focusKey = key;
        say(terminalLabel(componentId, pin, net, powerOn));
      });

      return g;
    }

    /** 꽂힌 케이블 */
    function drawWires(state) {
      var g = UI.svg("g", { class: "wires" });
      /* 색은 그릴 때 «회로 전체를 보고» 정한다 — 두 끝만으로는 알 수 없다 */
      var sides = C.wireSides(state.connections || []);

      (state.connections || []).forEach(function (conn, i) {
        var a = C.terminal(conn.fromComponent, conn.fromPin);
        var b = C.terminal(conn.toComponent, conn.toPin);
        if (!a || !b) return;

        /* 살짝 휘어지게 그려 여러 줄이 겹쳐도 구분된다 */
        var mx = (a.x + b.x) / 2;
        var my = (a.y + b.y) / 2 - Math.min(40, Math.abs(a.x - b.x) / 3 + 12);
        var d = "M " + a.x + " " + a.y + " Q " + mx + " " + my + " " + b.x + " " + b.y;

        var side = sides[i] || "";
        g.appendChild(
          UI.svg("path", {
            d: d,
            class: "wire wire--" + (side || "none"),
            stroke: WIRE_COLORS[SIDE_COLOR[side]] || WIRE_COLORS.gray,
            "data-index": String(i)
          })
        );
      });
      return g;
    }

    function txt(value) {
      return document.createTextNode(String(value));
    }

    /* ------------------------------------------------------------------ */
    /* 조작                                                                */
    /* ------------------------------------------------------------------ */

    function say(message) {
      statusLine.textContent = message;
      if (o.onMessage) o.onMessage(message);
    }

    function state() {
      return (o.getState && o.getState()) || { connections: [], powerOn: false };
    }

    /** 단자 하나를 눌렀다 */
    function pick(componentId, pinId) {
      focusKey = keyOf(componentId, pinId);

      if (mode === "find") {
        if (o.onPick) o.onPick(componentId, pinId);
        return;
      }

      /* wire 모드 */
      if (!pending) {
        pending = { component: componentId, pin: pinId };
        say(C.describe(componentId, pinId) + " 을(를) 골랐습니다. 이을 곳을 하나 더 누르세요.");
        render();
        return;
      }

      if (pending.component === componentId && pending.pin === pinId) {
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }

      var conn = C.makeConnection(pending, { component: componentId, pin: pinId });
      pending = null;
      if (!conn) {
        say("이을 수 없는 자리입니다.");
        render();
        return;
      }
      if (C.hasConnection(state().connections, conn)) {
        say("이미 이어져 있는 곳입니다.");
        render();
        return;
      }
      if (o.onConnect) o.onConnect(conn);
      say(
        C.describe(conn.fromComponent, conn.fromPin) +
          " 와(과) " +
          C.describe(conn.toComponent, conn.toPin) +
          " 을(를) " +
          (COLOR_WORD[conn.color] || "") +
          " 케이블로 이었습니다."
      );
      render();
    }

    /** 화살표로 옮겨 다니기 — 지금 위치에서 그 방향으로 가장 가까운 단자 */
    function nearestPin(fromComponent, fromPin, dx, dy) {
      var here = C.terminal(fromComponent, fromPin);
      if (!here) return null;

      var best = null;
      var bestScore = Infinity;

      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;

        comp.pins.forEach(function (pin) {
          if (comp.id === fromComponent && pin.id === fromPin) return;
          var vx = pin.x - here.x;
          var vy = pin.y - here.y;
          /* 가려는 방향으로 나아간 거리 */
          var along = vx * dx + vy * dy;
          if (along <= 0) return;
          /* 옆으로 벗어난 거리 — 많이 벗어날수록 나쁜 후보 */
          var across = Math.abs(vx * dy - vy * dx);
          var score = along + across * 3;
          if (score < bestScore) {
            bestScore = score;
            best = { component: comp.id, pin: pin.id };
          }
        });
      });
      return best;
    }

    function onPinKey(evt, componentId, pin) {
      var dirs = {
        ArrowRight: [1, 0],
        ArrowLeft: [-1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };

      if (evt.key === "Enter" || evt.key === " " || evt.key === "Spacebar") {
        evt.preventDefault();
        pick(componentId, pin.id);
        return;
      }
      if (evt.key === "Escape" && pending) {
        evt.preventDefault();
        pending = null;
        say("선택을 취소했습니다.");
        render();
        return;
      }
      if (!dirs[evt.key]) return;

      evt.preventDefault();
      var target = nearestPin(componentId, pin.id, dirs[evt.key][0], dirs[evt.key][1]);
      if (!target) return;
      focusKey = keyOf(target.component, target.pin);
      render();
      var node = svgHost.querySelector('[data-key="' + cssEscape(focusKey) + '"]');
      if (node) node.focus();
    }

    /** 속성 선택자에 넣어도 안전하게 */
    function cssEscape(value) {
      return String(value).replace(/["\\]/g, "\\$&");
    }

    /* ------------------------------------------------------------------ */
    /* 키보드·화면낭독기용 «목록으로 잇기» (명세 6.1)                        */
    /* ------------------------------------------------------------------ */

    function terminalOptions() {
      var list = [];
      C.COMPONENTS.forEach(function (comp) {
        if (comp.id === "uno" && !showBoard) return;
        if (comp.id === "bb" && !showBread) return;
        comp.pins.forEach(function (pin) {
          list.push({ value: keyOf(comp.id, pin.id), label: C.describe(comp.id, pin.id) });
        });
      });
      return list;
    }

    function buildPicker() {
      if (mode === "find") return null;

      var options = terminalOptions();
      function makeSelect(labelText) {
        var id = UI.nextId("sel");
        var select = UI.el("select", { class: "input input--select", id: id });
        options.forEach(function (opt) {
          select.appendChild(UI.el("option", { text: opt.label, attrs: { value: opt.value } }));
        });
        return {
          root: UI.el("div", { class: "field field--inline" }, [
            UI.el("label", { class: "field__label", attrs: { for: id }, text: labelText }),
            select
          ]),
          select: select
        };
      }

      var from = makeSelect("여기에서");
      var to = makeSelect("여기까지");
      /* 두 칸이 같은 곳을 가리키면 쓸모가 없으므로 두 번째는 다른 곳으로 미리 옮겨 둔다 */
      if (options.length > 1) to.select.selectedIndex = Math.min(options.length - 1, 1);

      var go = UI.button("이 둘을 잇기", {
        class: "btn btn--ghost",
        click: function () {
          var a = splitKey(from.select.value);
          var b = splitKey(to.select.value);
          pending = a;
          pick(b.component, b.pin);
        }
      });

      return UI.el("details", { class: "board__picker" }, [
        UI.el("summary", { class: "board__pickersum", text: "목록에서 골라 잇기" }),
        UI.el("p", {
          class: "board__pickerhelp",
          text: "그림을 누르기 어려울 때 씁니다. 그림 위에서는 화살표 키로 옮기고 Enter 로 고를 수도 있습니다."
        }),
        UI.el("div", { class: "board__pickerrow" }, [from.root, to.root, go])
      ]);
    }

    /* ------------------------------------------------------------------ */
    /* 도구 막대                                                           */
    /* ------------------------------------------------------------------ */

    function buildTools() {
      if (mode !== "wire") {
        return UI.el("div", { class: "board__tools" }, [zoomGroup()]);
      }

      var connections = state().connections || [];
      var undo = UI.button("한 단계 되돌리기", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onUndo) o.onUndo();
        }
      });
      var reset = UI.button("전체 초기화", {
        class: "btn btn--ghost btn--small",
        disabled: connections.length === 0,
        click: function () {
          if (o.onReset) o.onReset();
        }
      });

      return UI.el("div", { class: "board__tools" }, [
        UI.el("div", { class: "board__toolgroup" }, [undo, reset]),
        zoomGroup()
      ]);
    }

    function zoomGroup() {
      function setZoom(next) {
        /* 하한을 넉넉히 둔다. 좁은 화면에서는 바닥값(640) 에 곱하므로
           0.5 로는 화면 폭에 몇 픽셀 모자라 «전체 보기» 가 되지 않는다. */
        zoom = Math.max(0.4, Math.min(2.4, next));
        applyZoom();
      }
      return UI.el("div", { class: "board__toolgroup", attrs: { role: "group", "aria-label": "확대·축소" } }, [
        UI.button("−", {
          class: "btn btn--ghost btn--icon",
          title: "축소",
          click: function () {
            setZoom(zoom - 0.2);
          }
        }),
        UI.button("기본", {
          class: "btn btn--ghost btn--small",
          click: function () {
            setZoom(1);
          }
        }),
        UI.button("+", {
          class: "btn btn--ghost btn--icon",
          title: "확대",
          click: function () {
            setZoom(zoom + 0.2);
          }
        })
      ]);
    }

    /** 지금 확대 배수로 폭을 맞춘다. 배수를 그림에 적어 두어 창이 바뀔 때도 쓴다. */
    function applyZoom() {
      svgHost.setAttribute("data-zoom", String(zoom));
      fitSvg(svgHost, zoom);
    }

    /* ------------------------------------------------------------------ */
    /* 조립                                                                */
    /* ------------------------------------------------------------------ */

    var toolHost = UI.el("div");
    var pickerHost = UI.el("div");

    function render() {
      var st = state();
      var net = C.solve(st.connections);
      var powerOn = st.powerOn === true;

      /* 우노는 왼쪽, 브레드보드는 오른쪽에 나란히 놓인다(circuit.js 좌표).
         단자 찾기(3A)에서는 브레드보드가 없으므로 보드만 담는 좁은 틀을 쓴다. */
      /* 보이는 부품에 따라 틀을 고른다. 아래쪽 100px 은 피에조 자리다. */
      /* ★ 아래쪽 여백 : 피에조 다리 끝의 «＋ / −» 이름표가 pin.y + 18 에 그려진다.
         가장 아래 단자가 y=406 이므로 틀이 424 에서 끊기면 그 글자가 잘린다.
         (틀 높이 = 시작 18 + 높이 → 아래 끝. 420 이면 아래 끝이 438 이다) */
      var viewBox = showBread
        ? "0 18 920 420"
        : showParts
        ? "0 18 560 420"
        : "0 18 560 268";

      var svgNode = UI.svg("svg", {
        viewBox: viewBox,
        class: "board__svg",
        role: "img",
        "aria-label":
          (showBread ? "왼쪽에 아두이노 우노, 오른쪽에 브레드보드" : "아두이노 우노 보드") +
          (showParts ? ", 아래쪽에 피에조 스피커" : "")
      });

      if (showBoard) svgNode.appendChild(drawUno(st, net, powerOn));
      if (showBread) svgNode.appendChild(drawBreadboard(st, net, powerOn));
      if (showParts) svgNode.appendChild(drawParts(st, net, powerOn));
      svgNode.appendChild(drawWires(st));

      UI.clear(svgHost).appendChild(svgNode);
      applyZoom();

      UI.clear(toolHost).appendChild(buildTools());
      var picker = buildPicker();
      UI.clear(pickerHost);
      if (picker) pickerHost.appendChild(picker);
    }

    var rootNode = UI.el("div", { class: "board" }, [toolHost, svgHost, statusLine, pickerHost]);

    render();

    return {
      root: rootNode,
      render: render,
      setMode: function (next) {
        mode = next;
        pending = null;
        render();
      },
      cancelPending: function () {
        pending = null;
        render();
      }
    };
  }

  S.board = {
    create: create,
    WIRE_COLORS: WIRE_COLORS,
    COLOR_WORD: COLOR_WORD,
    SIDE_COLOR: SIDE_COLOR,
    SIDE_WORD: SIDE_WORD
  };
})();

 * (핀 자리를 고치면 설명 그림도 저절로 따라 바뀐다)
 *
 * 그림만으로 뜻을 전하지 않는다. 번호(또는 O·X) 배지마다 «글로 적은 설명» 을 아래에 붙이고,

(function () {

  /**

   * 아래 설명 목록에도 «올바름 / 잘못됨» 을 글로 적는다.

  function badgeMark(mark, x, y, kind) {

  function leader(x1, y1, x2, y2) {

  function unoFigure() {

        { text: "아날로그 핀 A0~A5 — 오른쪽 아래 줄에 있다(가리킨 곳은 A0). 0~1023 의 단계 값을 읽는다." },
        { text: "5V — 부품에 전기를 보내 주는 «+» 자리." },
        { text: "GND — 전기가 돌아오는 길이자 0V 기준점. 세 곳이 보드 안에서 이어져 있다." },
        { text: "ATmega328P — 프로그램이 담겨 «처리» 를 맡는 칩." }
      ],
      build: function (g) {
        drawUnoBody(g);

        /* 가리키는 자리는 «실제 단자 좌표» 에서 가져온다.
           눈대중으로 더하고 빼면 엉뚱한 핀을 가리킨다(A0 대신 A2 를 가리키던 적이 있다). */
        var usb = C.UNO.usbBox;
        var chip = C.UNO.chip;
        var d13 = C.terminal("uno", "D13");
        var vcc = C.terminal("uno", "5V");
        var gnd = C.terminal("uno", "GND2");
        var a0 = C.terminal("uno", "A0");

        /* ① USB — 보드 왼쪽 밖에서 가로로 */
        g.appendChild(leader(-27, usb.y + usb.h / 2, usb.x - 2, usb.y + usb.h / 2));
        g.appendChild(badge(1, -40, usb.y + usb.h / 2));

        /* ② 디지털 핀 — «D13 구멍» 을 바로 위에서 가리킨다.
              무리 이름은 x 300 으로 비켜 두었으므로 이 선과 겹치지 않는다. */
        g.appendChild(leader(d13.x, -7, d13.x, d13.y - 14));
        g.appendChild(badge(2, d13.x, -20));

        /* ③ 아날로그 핀 — «A0 구멍» 을 바로 아래에서.
              A0~A5 가운데를 가리키면 A2·A3 사이를 짚어 어느 핀인지 알 수 없다. */
        g.appendChild(leader(a0.x, 302, a0.x, a0.y + 14));
        g.appendChild(badge(3, a0.x, 315));

        /* ④ 5V — 그 구멍을 바로 아래에서 */
        g.appendChild(leader(vcc.x, 302, vcc.x, vcc.y + 14));
        g.appendChild(badge(4, vcc.x, 315));

        /* ⑤ GND — 세 곳 중 아래 줄의 GND 구멍을 바로 아래에서 */
        g.appendChild(leader(gnd.x, 302, gnd.x, gnd.y + 14));
        g.appendChild(badge(5, gnd.x, 315));

        /* ⑥ 처리 칩 — 보드 오른쪽 밖에서 가로로 */
        g.appendChild(leader(587, chip.y + chip.h / 2, chip.x + chip.w + 4, chip.y + chip.h / 2));
        g.appendChild(badge(6, 600, chip.y + chip.h / 2));
      }
    });
  }
