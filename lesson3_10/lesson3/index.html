          y: 100 + i * PITCH
        });
      }
    });

    lower.forEach(function (r, i) {
      for (var c = 1; c <= COLS; c += 1) {
        pins.push({
          id: r + c,
          label: r + c,
          kind: "tie",
          half: "L",
          col: c,
          x: colX(c),
          y: 246 + i * PITCH
        });
      }
    });

    return {
      id: "bb",
      name: "브레드보드",
      box: { x: 580, y: 24, w: 300, h: 380 },
      cols: COLS,
      rails: rails,
      gap: { y: 210, h: 22 },
      /* 열 번호를 적는 줄 */
      colNoY: 92,
      /* 행 문자(A~J)를 적는 x.
         실물 브레드보드처럼 구멍 왼쪽에 적는다. 오른쪽에도 적으면
         설명 그림의 지시선(오른쪽에서 들어온다)과 겹치므로 왼쪽만 쓴다. */
      rowLabelX: 596,
      rowsUpper: upper,
      rowsLower: lower,
      pins: pins
    };
  }

  /**
   * 피에조 스피커 — 이 차시의 주인공 (명세 4장 · 6.3)
   *
   * 다리가 둘뿐이고 «바꾸어 꽂으면 안 되는» 부품이다.
   *   SIG (신호) : 수동은 «＋», 모듈형은 «SIG». D8 로 간다.
   *   GND (접지) : 수동은 «−», 모듈형은 «GND». GND 로 간다.
   *
   * ★★ 다리 «길이» 로 극성을 알리지 않는다.
   *   실물 수동 피에조는 두 다리의 길이가 같은 것이 많다(LED 와 다른 점이다).
   *   길이로 가르치면 교실의 부품과 어긋나므로, 두 다리를 «같은 길이» 로 그리고
   *   몸통의 ＋ 표시와 단자 이름표(＋ / − · SIG / GND)가 뜻을 지게 한다(명세 13장).
   */
  function buildPiezo() {
    return {
      id: "piezo",
      name: "피에조 스피커",
      kind: "device",
      /**
       * 몸통 — 실물처럼 «검은 원통» 이다. 가운데에 소리 구멍이 있고
       * 그 옆에 ⊕ 극성 표시가 찍혀 있다.
       *
       * ★ 자리를 이렇게 잡은 까닭
       *   · 위쪽 284 : 우노 보드(아래 끝 276)와 겹치지 않게 내려 잡았다.
       *   · 이름(302)·상태(320)를 «몸통 위» 에 둔다.
       *     아래에 두면 다리 끝의 ＋ / − 이름표(424)와 부딪힌다.
       */
      body: { cx: 176, cy: 356, r: 30 },
      /* 이름과 «울림/조용함» 을 적는 자리 — 다리 이름표와 부딪히지 않게 위에 둔다 */
      nameY: 302,
      stateY: 320,
      /* 모듈형일 때 몸통 뒤에 그리는 기판 */
      boardBox: { x: 118, y: 334, w: 116, h: 60 },
      box: { x: 84, y: 284, w: 192, h: 150 },
      /**
       * ★★ 두 다리를 «같은 길이» 로 그린다.
       *
       *   LED 는 «다리 길이» 가 곧 극성 표시였지만, 피에조는 다르다 —
       *   실물 수동 피에조는 두 다리의 길이가 같은 것이 많다.
       *   길이가 다르게 그려져 있으면 학생이 교실의 부품에서 없는 것을 찾게 된다.
       *
       *   극성은 몸통의 ＋ 표시와 단자 이름표(＋/− · SIG/GND)가 진다(명세 13장).
       */
      legs: {
        SIG: { from: { x: 166, y: 384 }, to: { x: 158, y: 406 } },
        GND: { from: { x: 186, y: 384 }, to: { x: 194, y: 406 } }
      },
      /**
       * ⊕ 표시를 찍는 자리.
       *
       * ★★ «신호 다리와 같은 쪽» 이어야 한다 — 실물이 그렇고,
       *   표시와 다리가 어긋나 있으면 어느 다리를 말하는지 알 수 없다.
       *
       * ★ 몸통 «안쪽», 소리 구멍 «옆» 에 둔다.
       *   가장자리(cx - r + α)에 붙이면 테두리를 물고 나가 흐려진다.
       *   cx 176 · r 30 · 구멍 반지름 5 이므로 163 이면
       *   표시(157~169)와 구멍(171~181)이 겹치지 않는다.
       */
      mark: { x: 163, y: 356, r: 6 },
      pins: [
        {
          id: "SIG",
          label: "신호 단자", /* 화면에 적는 글자는 modeSpec() 이 붙인다 */
          short: "S",
          kind: "signal",
          x: 158,
          y: 406,
          note: "신호 — " + SPEAKER_PIN_NAME + " 쪽 (몸통에 ＋ 표시가 있는 쪽)"
        },
        {
          id: "GND",
          label: "접지 단자",
          short: "G",
          kind: "sink",
          x: 194,
          y: 406,
          note: "접지 — GND 쪽"
        }
      ]
    };
  }

  var UNO = buildUno();
  var BB = buildBreadboard();
  var PIEZO = buildPiezo();

  /** 화면에 그릴 부품 전부. 판정은 이 목록을 훑는다. */
  var COMPONENTS = [UNO, BB, PIEZO];
  var BY_ID = { uno: UNO, bb: BB, piezo: PIEZO };

  /** 케이블이 아니라 «소자» 인 부품 */
  var PARTS = [PIEZO];

  /** 지금 종류에서 그 단자에 적히는 글자 —  "＋" 또는 "SIG" */
  function pinMark(pinId, modeId) {
    var spec = modeSpec(modeId);
    return pinId === "SIG" ? spec.sigLabel : spec.gndLabel;
  }

  /** 「피에조 ＋ 단자」 처럼 «지금 종류» 에 맞춘 이름 */
  function pinTitle(pinId, modeId) {
    var spec = modeSpec(modeId);
    if (pinId === "SIG") return spec.sigFull || spec.sigLabel + " 단자";
    return spec.gndFull || spec.gndLabel + " 단자";
  }

  /** 화면이 종류를 바꾸면 부른다 */
  function setMode(id) {
    var ok = false;
    PIEZO_MODES.forEach(function (m) {
      if (m.id === id) ok = true;
    });
    if (ok) currentMode = id;
    return currentMode;
  }

  function getMode() {
    return currentMode;
  }

  /** 부품·단자 이름으로 단자를 찾는다. 없으면 null. */
  function terminal(componentId, pinId) {
    var comp = BY_ID[componentId];
    if (!comp) return null;
    for (var i = 0; i < comp.pins.length; i += 1) {
      if (comp.pins[i].id === pinId) return comp.pins[i];
    }
    return null;
  }

  /** 「우노 5V」 처럼 사람이 읽는 이름 */
  function describe(componentId, pinId) {
    var comp = BY_ID[componentId];
    var pin = terminal(componentId, pinId);
    if (!comp || !pin) return String(componentId) + " " + String(pinId);
    if (comp.id === "uno") return "우노 " + pin.label;
    if (comp.id === "piezo") return "피에조 " + pinTitle(pin.id);
    if (pin.kind === "rail") return "브레드보드 " + pin.label + " " + pin.short;
    return "브레드보드 " + pin.label + " 구멍";
  }

  /* ------------------------------------------------------------------ */
  /* 2. 하드웨어가 이미 이어 놓은 «마디»                                    */
  /* ------------------------------------------------------------------ */

  /**
   * 단자 하나가 속한 마디 이름.
   * 케이블을 하나도 꽂지 않아도 부품 안에서 이미 이어져 있는 것들을 나타낸다.
   */
  function nodeOf(componentId, pinId) {
    var pin = terminal(componentId, pinId);
    if (!pin) return null;
    if (componentId === "uno") {
      if (pin.kind === "ground") return "uno:GND";
      return "uno:" + pin.id;
    }
    /* 피에조의 두 다리는 «저마다 따로인» 마디다.
       부품이 두 마디를 이어 주지 «않는다» — 걸쳐 있을 뿐이다. */
    if (componentId === "piezo") return "piezo:" + pin.id;
    if (pin.kind === "rail") return "bb:rail:" + pin.rail;
    return "bb:col:" + pin.col + ":" + pin.half;
  }

  /** 마디 이름을 사람 말로 (진단 메시지에 쓴다) */
  function nodeLabel(node) {
    if (!node) return "";
    if (node === "uno:GND") return "우노 GND";
    if (node.indexOf("uno:") === 0) return "우노 " + node.slice(4);
    if (node === "piezo:SIG") return "피에조 " + pinTitle("SIG");
    if (node === "piezo:GND") return "피에조 " + pinTitle("GND");

    var railMatch = node.match(/^bb:rail:(\w+)$/);
    if (railMatch) {
      var found = null;
      BB.rails.forEach(function (r) {
        if (r.id === railMatch[1]) found = r;
      });
      return found ? "브레드보드 " + found.where + " " + found.label + " 레일" : node;
    }

    var colMatch = node.match(/^bb:col:(\d+):(U|L)$/);
    if (colMatch) {
      return "브레드보드 " + colMatch[1] + "번 열(" + (colMatch[2] === "U" ? "A~E" : "F~J") + ")";
    }
    return node;
  }

  /* ------------------------------------------------------------------ */
  /* 3. 연결 자료 (명세 6.2 — 좌표가 아니라 연결 그래프로 저장)              */
  /* ------------------------------------------------------------------ */

  /**
   * 케이블 색을 골라 준다 — 신호 노랑, 5V 빨강, GND 검정(명세 6.1).
   * ★ 색은 «보기 편하라고» 정할 뿐, 판정에는 절대 쓰지 않는다.
   */
  function suggestColor(from, to) {
    var a = terminal(from.component, from.pin);
    var b = terminal(to.component, to.pin);
    var kinds = [a ? a.kind : "", b ? b.kind : ""];
    var polarities = [a ? a.polarity : null, b ? b.polarity : null];
    if (kinds.indexOf("ground") !== -1 || polarities.indexOf("minus") !== -1) return "black";
    if (kinds.indexOf("sink") !== -1) return "black";
    if (kinds.indexOf("power") !== -1 || polarities.indexOf("plus") !== -1) return "red";
    return "yellow";
  }

  /** { fromComponent, fromPin, toComponent, toPin, color } 로 다듬는다 */
  function makeConnection(from, to, color) {
    if (!from || !to) return null;
    if (!terminal(from.component, from.pin)) return null;
    if (!terminal(to.component, to.pin)) return null;
    if (from.component === to.component && from.pin === to.pin) return null;
    return {
      fromComponent: from.component,
      fromPin: from.pin,
      toComponent: to.component,
      toPin: to.pin,
      color: color || suggestColor(from, to)
    };
  }

  /** 같은 케이블인지 — 방향은 상관없다 */
  function connectionKey(conn) {
    if (!conn) return "";
    var a = conn.fromComponent + "/" + conn.fromPin;
    var b = conn.toComponent + "/" + conn.toPin;
    return a < b ? a + "|" + b : b + "|" + a;
  }

  function sameConnection(a, b) {
    return connectionKey(a) === connectionKey(b);
  }

  /** 이미 꽂혀 있는 케이블인가 */
  function hasConnection(list, conn) {
    var key = connectionKey(conn);
    return (list || []).some(function (c) {
      return connectionKey(c) === key;
    });
  }

  /* ------------------------------------------------------------------ */
  /* 4. 회로 풀이 — 마디 합치기와 전위                                     */
  /* ------------------------------------------------------------------ */

  function solve(connections) {
    var parent = {};

    function find(node) {
      if (parent[node] === undefined) parent[node] = node;
      while (parent[node] !== node) {
        parent[node] = parent[parent[node]];
        node = parent[node];
      }
      return node;
    }

    function union(a, b) {
      var ra = find(a);
      var rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    /* 모든 단자의 마디를 미리 등록한다(케이블이 없어도 존재하는 마디들) */
    COMPONENTS.forEach(function (comp) {
      comp.pins.forEach(function (pin) {
        find(nodeOf(comp.id, pin.id));
      });
    });

    (connections || []).forEach(function (c) {
      var a = nodeOf(c.fromComponent, c.fromPin);
      var b = nodeOf(c.toComponent, c.toPin);
      if (a && b) union(a, b);
    });

    var vccRoot = find("uno:5V");
    var gndRoot = find("uno:GND");
    var shorted = vccRoot === gndRoot;

    /**
     * 마디의 전위(V). 5 · 0 · null(떠 있음).
     * 단락이면 전원을 넣지 않으므로 모두 null 이다(명세 6.2 «전원 인가를 막는다»).
     */
    function potentialOf(node) {
      if (shorted) return null;
      var r = find(node);
      if (r === vccRoot) return 5;
      if (r === gndRoot) return 0;
      return null;
    }

    function potentialAt(componentId, pinId) {
      var n = nodeOf(componentId, pinId);
      return n ? potentialOf(n) : null;
    }

    /** 같은 마디인가 — «이 두 구멍은 이어져 있나?» */
    function connected(nodeA, nodeB) {
      return find(nodeA) === find(nodeB);
    }

    return {
      find: find,
      connected: connected,
      potentialOf: potentialOf,
      potentialAt: potentialAt,
      shorted: shorted
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. 화면 3A — 부품과 단자 찾기 (명세 6.1)                              */
  /* ------------------------------------------------------------------ */

  /**
   * 지시한 단자를 «순서대로» 누른다.
   * 정답을 여러 개 두는 까닭 : GND 는 세 자리 모두 맞기 때문이다.
   */
  var FIND_TASKS = [
    {
      id: "f-d8",
      prompt: "소리 신호를 내보낼 디지털 핀 «" + SPEAKER_PIN_NAME + "» 을 찾아 누르세요.",
      accept: [{ component: "uno", pin: SPEAKER_PIN_NAME }],
      why:
        SPEAKER_PIN_NAME + " 은(는) 디지털 출력 핀이다. tone() 은 이 핀의 전압을 " +
        "1초에 수백~수천 번 HIGH·LOW 로 바꾸어 «떨림» 을 만든다."
    },
    {
      id: "f-gnd",
      prompt: "전류가 돌아올 기준 자리 «GND» 를 찾아 누르세요. (세 곳 중 아무 곳이나)",
      accept: [
        { component: "uno", pin: "GND0" },
        { component: "uno", pin: "GND1" },
        { component: "uno", pin: "GND2" }
      ],
      why: "GND 는 전기가 «없는» 핀이 아니라 전류가 돌아오는 길이다. 이 길이 없으면 회로가 끊긴다."
    },
    {
      id: "f-piezo-sig",
      prompt: "피에조의 «신호 단자» 를 찾아 누르세요. 수동은 ＋, 모듈형은 SIG 라고 적혀 있습니다.",
      accept: [{ component: "piezo", pin: "SIG" }],
      why: "신호 단자는 " + SPEAKER_PIN_NAME + " 쪽으로 간다. 여기로 들어온 떨림이 소리가 된다."
    },
    {
      id: "f-piezo-gnd",
      prompt: "피에조의 «접지 단자» 를 찾아 누르세요. 수동은 −, 모듈형은 GND 라고 적혀 있습니다.",
      accept: [{ component: "piezo", pin: "GND" }],
      why: "접지 단자는 우노의 GND 로 간다. 이 길이 있어야 한 바퀴가 닫혀 전류가 흐른다."
    }
  ];

  var KIND_WORD = {
    power: "전원(+) 계열 단자",
    ground: "접지(GND) 계열 단자",
    digital: "디지털 신호 단자",
    analog: "아날로그 입력 단자",
    rail: "브레드보드 전원 레일",
    tie: "브레드보드 연결 구멍",
    signal: "피에조 신호 단자",
    sink: "피에조 접지 단자",
    other: "그 밖의 단자"
  };

  /** 틀렸을 때 «정답을 알려 주지 않고» 방향만 잡아 준다 (명세 6.2) */
  function findHint(componentId, pin) {
    var got = KIND_WORD[pin.kind] || "다른 단자";
    return (
      "지금 누른 " +
      describe(componentId, pin.id) +
      " 은(는) " +
      got +
      " 입니다. 이 단자가 전원·접지·신호 중 무엇인지 생각하고 다시 찾아보세요."
    );
  }

  /**
   * 누른 단자가 지금 차례의 답인지 본다.
   *   history : { 과제id: 누른 단자 } — «반대쪽 끝» 을 가려내는 데 쓴다
   *
   * 돌려주는 것 : { ok, done, message, kind:'right'|'wrong' }
   */
  function checkFind(taskIndex, componentId, pinId, history) {
    var task = FIND_TASKS[taskIndex];
    if (!task) return { ok: false, done: true, message: "", kind: "wrong" };

    var hit = task.accept.some(function (a) {
      return a.component === componentId && a.pin === pinId;
    });

    if (hit && task.distinctFrom) {
      var before = (history || {})[task.distinctFrom];
      if (before && before === componentId + "/" + pinId) {
        return {
          ok: false,
          done: false,
          kind: "wrong",
          message: "방금 누른 곳과 «같은» 자리입니다. 다른 단자를 눌러 주세요."
        };
      }
    }

    if (hit) {
      return {
        ok: true,
        done: taskIndex + 1 >= FIND_TASKS.length,
        message: "맞았습니다. " + task.why,
        kind: "right"
      };
    }

    var pin = terminal(componentId, pinId);
    return {
      ok: false,
      done: false,
      kind: "wrong",
      message: pin ? findHint(componentId, pin) : "부품 위의 단자를 눌러 주세요."
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. 화면 3B — 피에조 결선과 경로 판정 (명세 6.2)                        */
  /* ------------------------------------------------------------------ */

  /**
   * «소자» 목록 — 케이블과 달리 마디를 합치지 않고 «걸쳐» 있다.
   * 이 차시에는 피에조 하나뿐이지만, 부품이 늘어도 이 배열만 고치면 된다.
   */
  var DEVICES = [
    { id: "piezo", kind: "piezo", a: "piezo:SIG", b: "piezo:GND", directional: true }
  ];

  var SOURCE_NODE = "uno:" + SPEAKER_PIN_NAME;
  var SINK_NODE = "uno:GND";

  /** 전원 계열 마디 — 피에조를 여기에 물리면 위험이다 */
  var POWER_NODES = ["uno:5V", "uno:3V3", "uno:VIN"];

  /**
   * 두 마디 사이의 «소자를 건너는 길» 을 모두 찾는다.
   *   block : 이 소자는 건너지 않는다 (피에조를 뺀 채 앞뒤를 따로 보려는 것)
   *
   * 돌려주는 것 : [[{ id, kind, dir }], ...]
   */
  function pathsBetween(net, fromNode, toNode, block) {
    var from = net.find(fromNode);
    var to = net.find(toNode);
    var found = [];
    if (from === to) return [[]]; /* 소자를 거치지 않고 이미 이어져 있다 */

    var used = {};
    var steps = [];

    function walk(node) {
      if (steps.length > DEVICES.length) return;
      DEVICES.forEach(function (d) {
        if (used[d.id] || d.id === block) return;
        var ra = net.find(d.a);
        var rb = net.find(d.b);
        /* 두 다리가 같은 마디면 «건널» 수 없다. 소자 양단이 단락된 것이다. */
        if (ra === rb) return;

        var next = null;
        var dir = "";
        if (ra === node) {
          next = rb;
          dir = "forward";
        } else if (rb === node) {
          next = ra;
          dir = "reverse";
        }
        if (next === null) return;

        used[d.id] = true;
        steps.push({ id: d.id, kind: d.kind, dir: dir });
        if (next === to) found.push(steps.slice());
        else walk(next);
        steps.pop();
        used[d.id] = false;
      });
    }

    walk(from);
    return found;
  }

  /**
   * 회로를 전기적으로 읽어 낸다.
   *
   * ★ 앞뒤를 «따로» 본다.
   *   피에조를 뺀 채  D8 → 신호 단자 와  접지 단자 → GND 를 나누어 보면
   *   GND 만 빠뜨린 학생에게 «신호선도 틀렸다» 는 엉뚱한 말을 하지 않는다.
   */
  function analyze(connections) {
    var net = solve(connections);
    var src = net.find(SOURCE_NODE);
    var sink = net.find(SINK_NODE);

    /* D8 과 GND 가 소자 없이 곧바로 이어졌는가 */
    var directShort = src === sink;

    /* 피에조 두 다리가 같은 마디 — 양단 전압 0V, 떨림이 생기지 않는다 */
    var legsSameNode = net.find("piezo:SIG") === net.find("piezo:GND");

    /* 바른 방향 : D8 → SIG ,  GND단자 → GND */
    var toSig = pathsBetween(net, SOURCE_NODE, "piezo:SIG", "piezo");
    var fromGnd = pathsBetween(net, "piezo:GND", SINK_NODE, "piezo");

    /* 뒤집어 꽂았을 때 : D8 → GND단자 ,  SIG → GND */
    var toGndPin = pathsBetween(net, SOURCE_NODE, "piezo:GND", "piezo");
    var fromSig = pathsBetween(net, "piezo:SIG", SINK_NODE, "piezo");

    var sigFromSource = toSig.length > 0; /* D8 → SIG */
    var gndFromSource = toGndPin.length > 0; /* D8 → GND단자 */
    var gndToGround = fromGnd.length > 0; /* GND단자 → GND */
    var sigToGround = fromSig.length > 0; /* SIG → GND */

    /**
     * 방향은 «피에조가 어느 쪽을 보고 꽂혔는가» 다.
     * 회로가 아직 완성되지 않았어도 정해진다 — GND 를 빠뜨린 학생에게
     * «극성도 틀렸다» 는 엉뚱한 말을 하지 않으려는 것이다.
     */
    var direction = "none";
    if (!legsSameNode) {
      if (sigFromSource && !gndFromSource) direction = "forward";
      else if (gndFromSource && !sigFromSource) direction = "reverse";
      else if (gndToGround && !sigToGround) direction = "forward";
      else if (sigToGround && !gndToGround) direction = "reverse";
    }

    /* 한 바퀴가 «닫혔는가» — 방향과 따로 본다 */
    var connectedPath =
      !legsSameNode &&
      ((direction === "forward" && sigFromSource && gndToGround) ||
        (direction === "reverse" && gndFromSource && sigToGround));

    /* 피에조 단자가 전원(5V·3V3·VIN)에 물려 있는가 — 소리가 나지 않고 위험하다 */
    var onPower = false;
    var poweredPin = "";
    POWER_NODES.forEach(function (p) {
      if (net.find(p) === net.find("piezo:SIG")) {
        onPower = true;
        poweredPin = poweredPin || "SIG";
      }
      if (net.find(p) === net.find("piezo:GND")) {
        onPower = true;
        poweredPin = poweredPin || "GND";
      }
    });

    return {
      sourcePin: SPEAKER_PIN_NAME,
      sinkPin: "GND",
      /* 각 반쪽이 이어졌는가 — 점검 항목이 이 값을 그대로 쓴다 */
      sigFromSource: sigFromSource,
      gndToGround: gndToGround,
      gndFromSource: gndFromSource,
      sigToGround: sigToGround,
      /* 진단 */
      direction: direction,
      shortCircuit: directShort,
      legsSameNode: legsSameNode,
      onPower: onPower,
      poweredPin: poweredPin,
      connected: connectedPath,
      open: !connectedPath && !directShort,
      /**
       * 실제로 소리가 날 조건 : 한 바퀴가 닫히고 + 단락 아님 + 전원 직결 아님
       * 방향은 «종류» 에 따라 다르다 — 수동은 뒤집어도 울리고, 모듈형은 울리지 않는다.
       */
      wouldSound:
        connectedPath &&
        !directShort &&
        !onPower &&
        (direction === "forward" || modeSpec().id === "passive")
    };
  }

  /**
   * ★ 케이블이 회로의 «어느 쪽» 에 있는가 — 색을 정하는 데 쓴다.
   *
   *   "source" : D8 에서 피에조까지 가는 쪽   (신호가 나가는 길)
   *   "ground" : 피에조에서 GND 로 돌아오는 쪽 (전류가 돌아오는 길)
   *   ""       : 어느 쪽도 아니거나(쓰이지 않는 케이블) 양쪽이 붙어 버린 경우(단락)
   *
   *   ★ 색은 «보기 편하라고» 정하는 것이고 판정에는 쓰지 않는다(명세 6.1).
   *     그래서 이 함수는 checkCircuit·analyze 어디에서도 부르지 않는다.
   */
  function wireSides(connections) {
    var list = connections || [];
    var net = solve(list);

    return list.map(function (c) {
      /* 케이블 한 줄의 두 끝은 이미 같은 마디다. 어느 쪽을 보아도 같다. */
      var node = nodeOf(c.fromComponent, c.fromPin) || nodeOf(c.toComponent, c.toPin);
      if (!node) return "";

      var toSource = pathsBetween(net, node, SOURCE_NODE, "piezo").length > 0;
      var toGround = pathsBetween(net, node, SINK_NODE, "piezo").length > 0;

      if (toSource && !toGround) return "source";
      if (toGround && !toSource) return "ground";
      return "";
    });
  }

  /** 케이블이 하나라도 닿아 있는 단자인가 — «떠 있는 다리» 를 가려낸다 */
  function isWired(connections, componentId, pinId) {
    return (connections || []).some(function (c) {
      return (
        (c.fromComponent === componentId && c.fromPin === pinId) ||
        (c.toComponent === componentId && c.toPin === pinId)
      );
    });
  }

  /** 아직 아무 데도 닿지 않은 부품 다리 목록 */
  function floatingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * «반쯤 꽂힌» 부품의 다리 — 한쪽 다리는 이었는데 다른 쪽이 비어 있는 것.
   *
   * 피에조의 두 다리는 여기서 세지 않는다. 그 둘은 c-sig·c-gnd 가 이미 정확히
   * 짚어 주므로, 같은 실수를 두 항목이 겹쳐 나무라면 무엇을 고쳐야 할지 흐려진다.
   */
  function danglingLeads(connections) {
    var out = [];
    PARTS.forEach(function (part) {
      if (part.id === "piezo") return;
      var wired = part.pins.filter(function (pin) {
        return isWired(connections, part.id, pin.id);
      });
      if (wired.length === 0 || wired.length === part.pins.length) return;
      part.pins.forEach(function (pin) {
        if (!isWired(connections, part.id, pin.id)) {
          out.push({ component: part.id, pin: pin.id, label: describe(part.id, pin.id) });
        }
      });
    });
    return out;
  }

  /**
   * 회로에 쓰이지 않는 케이블 (명세 6.1 «전체 초기화·선택 삭제»와 짝을 이룬다)
   * 양쪽 끝이 모두 «D8–피에조–GND 경로 밖» 인 케이블만 짚는다.
   */
  function strayWires(connections) {
    var list = connections || [];
    var net = solve(list);

    /* 경로에 쓰이는 마디들 */
    var live = {};
    [SOURCE_NODE, SINK_NODE, "piezo:SIG", "piezo:GND"].forEach(function (n) {
      live[net.find(n)] = true;
    });

    return list.filter(function (c) {
      var a = net.find(nodeOf(c.fromComponent, c.fromPin));
      var b = net.find(nodeOf(c.toComponent, c.toPin));
      return !live[a] && !live[b];
    });
  }

  /**
   * 점검 항목 (명세 6.2 «충족 조건 목록과 미충족 항목만»)
   *
   * ★ 항목마다 «서로 겹치지 않는» 한 가지만 본다.
   *   label 은 화면에서 지금 종류(수동/모듈형)에 맞추어 다시 쓴다 — labelOf() 참고.
   */
  var REQUIRED = [
    {
      id: "c-sig",
      label: "피에조 신호 단자가 " + SPEAKER_PIN_NAME + " 과 이어진다",
      role: "신호",
      hints: [
        "소리를 만드는 «떨림» 은 어느 단자로 들어가야 할까요? 전원일까요, 신호일까요?",
        "피에조에서 ＋(또는 SIG) 라고 적힌 단자를 찾으세요. 우노에서는 " + SPEAKER_PIN_NAME + " 입니다.",
        "우노 " + SPEAKER_PIN_NAME + " 과 피에조 신호 단자를 케이블 한 줄로 이으세요. 브레드보드를 거쳐도 됩니다."
      ]
    },
    {
      id: "c-gnd",
      label: "피에조 접지 단자가 GND 와 이어진다",
      role: "귀환 경로",
      hints: [
        "전류가 피에조를 지난 뒤에는 어디로 돌아가야 할까요?",
        "피에조에서 −(또는 GND) 라고 적힌 단자를 찾으세요. 우노에는 GND 가 세 곳 있습니다.",
        "피에조 접지 단자를 우노의 GND 핀(세 곳 중 아무 곳)에 이으세요."
      ]
    },
    {
      id: "c-nopower",
      label: "피에조가 5V 에 직접 물려 있지 않다",
      role: "안전",
      hints: [
        "5V 는 «늘 같은 높이» 로 나오는 전압입니다. 늘 같은 값이면 떨림이 생길까요?",
        "피에조 단자에서 5V·3V3·VIN 으로 가는 케이블이 있는지 케이블 목록에서 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우고, 신호 단자는 " + SPEAKER_PIN_NAME + " 으로 옮기세요."
      ]
    },
    {
      id: "c-noshort",
      label: SPEAKER_PIN_NAME + " 과 GND 가 곧바로 이어지지 않았다",
      role: "안전",
      hints: [
        "부품을 하나도 거치지 않고 출력 핀과 GND 를 이으면 무슨 일이 생길까요?",
        SPEAKER_PIN_NAME + " 과 GND 를 바로 잇는 케이블이 있는지 케이블 목록에서 찾아보세요.",
        "그 케이블을 골라 [선택 케이블 지우기] 로 지우세요. 사이에는 반드시 피에조가 있어야 합니다."
      ]
    },
    {
      id: "c-tidy",
      label: "떠 있는 단자나 쓸모없는 케이블이 없다",
      role: "정리",
      hints: [
        "회로에서 «아무 데도 닿지 않은» 다리가 있으면 그 길로는 전류가 흐를 수 있을까요?",
        "부품 목록에서 케이블이 하나도 닿지 않은 다리를 찾아보세요.",
        "쓰지 않는 케이블은 지우고, 피에조의 두 다리를 모두 회로에 이으세요."
      ]
    }
  ];

  /** 지금 종류에 맞춘 점검 항목 이름 — 수동이면 «＋», 모듈형이면 «SIG» 로 적힌다 */
  function labelOf(req, modeId) {
    if (req.id === "c-sig") {
      return "피에조 " + pinTitle("SIG", modeId) + " 가 " + SPEAKER_PIN_NAME + " 과 이어진다";
    }
    if (req.id === "c-gnd") {
      return "피에조 " + pinTitle("GND", modeId) + " 가 GND 와 이어진다";
    }
    return req.label;
  }

  /**
   * 회로 점검 (명세 6.2)
   * 돌려주는 것 : { conditions, missing, ok, shorted, analysis, floating, stray, powered }
   *
   * ★ «아직 판정할 수 없는» 항목은 blocked 로 둔다.
   *   두 단자가 단락되어 있거나 피에조 두 다리가 한 마디면, 신호선이 옳은지 그른지를
   *   전기적으로 말할 수 없다. 그때 ✗ 를 찍으면 «그것도 틀렸다» 는 거짓말이 된다.
   *   화면에는 ✗ 가 아니라 «—» 로 나오고, 위험 상자가 진짜 원인을 짚는다.
   *
   * ★ 뒤집어 꽂았을 때도 마찬가지다. 원인이 «하나» 이므로 c-sig 만 ✗ 로 두고
   *   c-gnd 는 «—» 로 미룬다. 두 줄이 함께 빨개지면 두 군데를 고쳐야 하는 줄 안다.
   */
  function checkCircuit(connections) {
    var net = solve(connections);
    var a = analyze(connections);
    var floating = floatingLeads(connections);
    var dangling = danglingLeads(connections);
    var stray = strayWires(connections);

    var tangled = a.shortCircuit || net.shorted || a.legsSameNode;
    var reversed = a.direction === "reverse";

    /* 왜 판정할 수 없는지도 함께 알린다 — «위 경고를 고치라» 고만 하면
       아직 아무것도 잇지 않은 학생에게는 없는 경고를 찾게 만든다. */
    var tangledWhy = "위 경고를 먼저 고치면 판정합니다";
    var reversedWhy = "피에조를 돌려 꽂으면 함께 판정합니다";

    var results = {
      "c-sig": {
        ok: a.sigFromSource && !a.gndFromSource,
        blocked: tangled,
        why: tangledWhy
      },
      "c-gnd": {
        ok: a.gndToGround && !a.sigToGround,
        blocked: tangled || reversed,
        why: tangled ? tangledWhy : reversedWhy
      },
      "c-nopower": { ok: !a.onPower, blocked: false, why: "" },
      "c-noshort": { ok: !a.shortCircuit && !net.shorted, blocked: false, why: "" },
      "c-tidy": { ok: dangling.length === 0 && stray.length === 0, blocked: false, why: "" }
    };

    var conditions = REQUIRED.map(function (req) {
      var r = results[req.id] || { ok: false, blocked: false, why: "" };
      return {
        id: req.id,
        label: labelOf(req),
        role: req.role,
        ok: r.blocked ? false : r.ok === true,
        blocked: r.blocked === true,
        blockedWhy: r.blocked ? r.why : ""
      };
    });

    var missing = conditions.filter(function (c) {
      return !c.ok;
    });

    /* 전원이 «살아 있는» 레일 목록 — 5V 를 쓰는 학생을 위해 그대로 둔다 */
    var powered = { plus: [], minus: [] };
    BB.rails.forEach(function (rail) {
      var v = net.potentialOf("bb:rail:" + rail.id);
      if (v === 5) powered.plus.push(rail.id);
      else if (v === 0) powered.minus.push(rail.id);
    });

    return {
      conditions: conditions,
      missing: missing,
      ok: missing.length === 0,
      shorted: net.shorted || a.shortCircuit,
      analysis: a,
      floating: floating,
      dangling: dangling,
      stray: stray,
      powered: powered
    };
  }

  /**
   * ★ «이렇게 이으면 됩니다» — 목표 회로를 케이블 두 줄로 적은 것.
   *
   *   화면에는 «접어» 두고 학생이 펼칠 때만 보인다(명세 6.2 «정답선을 대신 그리지 말고»).
   *   펼치면 두 줄이 저마다 «이어짐/아직» 으로 나오므로, 어디까지 했는지 한눈에 보인다.
   */
  var GOAL = [
    { id: "g1", from: SOURCE_NODE, to: "piezo:SIG", label: "우노 " + SPEAKER_PIN_NAME + " ↔ 피에조 신호 단자(＋ / SIG)" },
    { id: "g2", from: "piezo:GND", to: SINK_NODE, label: "피에조 접지 단자(− / GND) ↔ 우노 GND" }
  ];

  /**
   * 목표 두 줄이 저마다 이어졌는가.
   * 브레드보드를 몇 번 거쳐 가도, 구멍이 달라도, 같은 마디면 이어진 것으로 센다.
   *
   * 돌려주는 것 : { lines, allDone, passed, equivalent }
   */
  function goalStatus(connections) {
    var net = solve(connections);

    var lines = GOAL.map(function (g) {
      return {
        id: g.id,
        label: g.id === "g1"
          ? "우노 " + SPEAKER_PIN_NAME + " ↔ 피에조 " + pinTitle("SIG")
          : "피에조 " + pinTitle("GND") + " ↔ 우노 GND",
        ok: net.connected(net.find(g.from), net.find(g.to))
      };
    });

    var allDone = lines.every(function (l) {
      return l.ok;
    });
    var passed = checkCircuit(connections).ok;

    return {
      lines: lines,
      allDone: allDone,
      passed: passed,
      /* 통과했는데 위 두 줄과 다르다 = «다르게 이었지만 맞다» */
      equivalent: passed && !allDone
    };
  }

  /**
   * ★ «지금 이어진 것» 을 사람 말 한 줄로.
   *
   *   판정이 왜 그렇게 나왔는지 학생과 선생님이 바로 볼 수 있게 한다.
   *   정답을 알려 주는 것이 아니라 «앱이 지금 무엇으로 보고 있는지» 를 되비추는 것이다.
   */
  function describeCurrent(connections) {
    var a = analyze(connections);
    var sigName = "피에조 " + pinTitle("SIG");
    var gndName = "피에조 " + pinTitle("GND");

    if (a.shortCircuit) {
      return SPEAKER_PIN_NAME + " 과 GND 가 부품 없이 곧바로 이어져 있습니다 (단락).";
    }
    if (a.legsSameNode) {
      return "피에조의 두 다리가 같은 마디에 있습니다. 양단 전압이 0V 라 떨림이 생기지 않습니다.";
    }
    if (a.onPower) {
      return "피에조 단자가 전원(5V 계열)에 곧바로 물려 있습니다. 늘 같은 전압이라 소리가 만들어지지 않습니다.";
    }
    if (a.direction === "none") {
      return SPEAKER_PIN_NAME + " 에서 피에조로 가는 길이 아직 없습니다.";
    }

    var head = a.direction === "forward" ? sigName : gndName;
    var tail = a.direction === "forward" ? gndName : sigName;

    if (!a.connected) {

        SPEAKER_PIN_NAME + " → " + head + " 까지 이어졌습니다. " +

   *   역결선은 «모듈형이면 무음», 전원 직결은 «떨림 없음», GND 누락은 «열린 회로» 로 서로 다르다.

  var DANGER_RULES = [
    {

      },

        "5V 와 GND 가 곧바로 이어졌습니다. 실제 보드라면 큰 전류가 흘러 전선이 뜨거워지고 " +
        "보드가 상합니다. 두 단자 사이에는 반드시 부품이 있어야 합니다.",

          (c.toComponent === "uno" && c.toPin === pin.id)

        circuitPin: id,

  }

  PC.circuit = {

    PITCH: PITCH,
    HEADER_PITCH: HEADER_PITCH,
    UNO: UNO,
    BB: BB,

   *
   * 빈칸을 «핵심 줄» 에만 둔다 (명세 8장 «코드 조립 → 빈칸 입력 → 전체 편집»).
   *   b1 : 되풀이를 여는 줄  — 여덟 음을 어떻게 차례로 지나가는가
   *   b2 : 소리를 내는 줄    — tone 의 세 값(핀·주파수·길이)이 무엇인지
   *   b3 : 소리를 멈추는 줄  — noTone 이 «멈추는» 함수임을 짚는다
   *
   * ★ 셋이 모두 for 문 «안» 에 있다. 한 바퀴가 곧 «한 음» 이다.
   */
  var BLANK_TEMPLATE = {
    lines: [
      { text: "const int speakerPin = 8;" },
      { text: "int notes[] = {523, 587, 659, 698, 784, 880, 987, 1046};" },
      { text: "" },
      { text: "void setup() {" },
      { blank: "b1", indent: 1, hint: "i 를 0 부터 7 까지 늘리며 여덟 번 되풀이하는 줄" },
      { blank: "b2", indent: 2, hint: "speakerPin 으로 notes[i] 를 250ms 동안 내보내는 줄" },
      { text: "    delay(400);" },
      { blank: "b3", indent: 2, hint: "speakerPin 의 소리를 멈추는 줄 — 이 줄로 한 음이 끝난다" },
      { text: "  }" },
      { text: "}" },
      { text: "" },
      { text: "void loop() {}" }
    ]
  };

  /* ------------------------------------------------------------------ */
  /* 1. 토큰 나누기                                                       */
  /* ------------------------------------------------------------------ */

  /* ★ 이 차시에서 «for» 가 늘었다 (명세 4장 «음 배열과 반복문»). */
  var KEYWORDS = ["void", "int", "long", "float", "double", "bool", "boolean", "char", "const", "if", "else", "for", "return", "unsigned"];
  var TYPES = ["int", "long", "float", "double", "bool", "boolean", "char", "unsigned"];
  var CONSTANTS = {
    HIGH: 1,
    LOW: 0,
    OUTPUT: "OUTPUT",
    INPUT: "INPUT",
    INPUT_PULLUP: "INPUT_PULLUP",
    true: 1,
    false: 0
  };

  /* 아날로그 핀 이름도 «상수» 다. analogRead(A0) 처럼 적으므로
     이것을 빠뜨리면 «A0 라는 변수를 만들지 않았다» 는 엉뚱한 오류가 난다. */
  ["A0", "A1", "A2", "A3", "A4", "A5"].forEach(function (name) {
    CONSTANTS[name] = name;
  });

  /* 긴 연산자를 먼저 시도해야 «>=» 가 «>» 와 «=» 로 쪼개지지 않는다 */
  var OPERATORS = ["==", "!=", "<=", ">=", "&&", "||", "++", "--", "+=", "-=", "+", "-", "*", "/", "%", "<", ">", "=", "!"];

  function ParseError(message, line, code) {
    this.name = "ParseError";
    this.message = message;
    this.line = line || 0;
    this.code = code || "syntax";
  }

  function tokenize(source) {
    var tokens = [];
    var text = String(source || "");
    var i = 0;
    var line = 1;

    function peek(offset) {
      return text.charAt(i + (offset || 0));
    }

    while (i < text.length) {
      var ch = text.charAt(i);

      /* 줄바꿈과 공백 */
      if (ch === "\n") {
        line += 1;
        i += 1;
        continue;
      }
      if (/\s/.test(ch)) {
        i += 1;
        continue;
      }

      /* 주석 */
      if (ch === "/" && peek(1) === "/") {
        while (i < text.length && text.charAt(i) !== "\n") i += 1;
        continue;
      }
      if (ch === "/" && peek(1) === "*") {
        i += 2;
        while (i < text.length && !(text.charAt(i) === "*" && peek(1) === "/")) {
          if (text.charAt(i) === "\n") line += 1;
          i += 1;
        }
        if (i >= text.length) throw new ParseError("주석 /* 를 닫지 않았습니다. */ 를 적어 주세요.", line, "comment");
        i += 2;
        continue;
      }

      /* 문자열 */
      if (ch === '"') {
        var startLine = line;
        var value = "";
        i += 1;
        while (i < text.length && text.charAt(i) !== '"') {
          if (text.charAt(i) === "\n") {
            throw new ParseError("문자열을 같은 줄에서 닫아 주세요. 따옴표(\") 짝이 맞지 않습니다.", startLine, "string");
          }
          if (text.charAt(i) === "\\") {
            var esc = peek(1);
            value += esc === "n" ? "\n" : esc === "t" ? "\t" : esc;
            i += 2;
            continue;
          }
          value += text.charAt(i);
          i += 1;
        }
        if (i >= text.length) {
          throw new ParseError("문자열을 닫는 따옴표(\") 가 없습니다.", startLine, "string");
        }
        i += 1;
        tokens.push({ type: "string", value: value, line: startLine });
        continue;
      }

      /* 숫자 */
      if (/[0-9]/.test(ch)) {
        var num = "";
        while (i < text.length && /[0-9.]/.test(text.charAt(i))) {
          num += text.charAt(i);
          i += 1;
        }
        tokens.push({ type: "number", value: parseFloat(num), line: line });
        continue;
      }

      /* 이름 (변수·함수·상수) */
      if (/[A-Za-z_]/.test(ch)) {
        var name = "";
        while (i < text.length && /[A-Za-z0-9_]/.test(text.charAt(i))) {
          name += text.charAt(i);
          i += 1;
        }
        tokens.push({
          type: KEYWORDS.indexOf(name) !== -1 ? "keyword" : "name",
          value: name,
          line: line
        });
        continue;
      }

      /* 괄호와 구두점 — 이 차시에서 대괄호 [ ] 가 늘었다(배열) */
      if ("(){}[],;.".indexOf(ch) !== -1) {
        tokens.push({ type: "punct", value: ch, line: line });
        i += 1;
        continue;
      }

      /* 연산자 */
      var matched = null;
      for (var k = 0; k < OPERATORS.length; k += 1) {
        if (text.substr(i, OPERATORS[k].length) === OPERATORS[k]) {
          matched = OPERATORS[k];
          break;
        }
      }
      if (matched) {
        tokens.push({ type: "op", value: matched, line: line });
        i += matched.length;
        continue;
      }

      throw new ParseError("여기서는 쓸 수 없는 기호 «" + ch + "» 입니다.", line, "char");
    }

    tokens.push({ type: "eof", value: "", line: line });
    return tokens;
  }

  /* ------------------------------------------------------------------ */
  /* 2. 구문 나무 만들기                                                   */
  /* ------------------------------------------------------------------ */

  function parse(source) {
    var tokens = tokenize(source);
    var pos = 0;

    function peek(offset) {
      return tokens[pos + (offset || 0)] || tokens[tokens.length - 1];
    }
    function at(type, value) {
      var t = peek();
      return t.type === type && (value === undefined || t.value === value);
    }
    function next() {
      var t = peek();
      pos += 1;
      return t;
    }
    function expect(type, value, what) {
      if (!at(type, value)) {
        var t = peek();
        var got = t.type === "eof" ? "코드가 끝났습니다" : "«" + t.value + "»";

        /**
         * ★ 세미콜론은 «앞 줄» 을 가리킨다.
         *
         *   delay(400) 처럼 세미콜론을 빠뜨리면 파서는 다음 줄의 «}» 에서야 알아챈다.
         *   그런데 학생이 고쳐야 할 줄은 «}» 가 아니라 delay 가 적힌 줄이다.
         *   찾은 자리를 그대로 알리면 멀쩡한 줄을 들여다보며 헤매게 된다.
         */
        var line = t.line;
        if (value === ";" && pos > 0 && tokens[pos - 1] && tokens[pos - 1].line < t.line) {
          line = tokens[pos - 1].line;
        }

        throw new ParseError(
          (what || "«" + value + "»") + " 가 있어야 하는 자리에 " + got + " 이(가) 있습니다.",
          line,
          value === ";" ? "semicolon" : value === "}" || value === "{" ? "brace" : "syntax"
        );
      }
      return next();
    }

    /* ----- 식(expression) : 우선순위가 낮은 것부터 ----- */

    function parseExpression() {
      return parseOr();
    }
    function parseOr() {
      var left = parseAnd();
      while (at("op", "||")) {
        var line = next().line;
        left = { kind: "binary", op: "||", left: left, right: parseAnd(), line: line };
      }
      return left;
    }
    function parseAnd() {
      var left = parseEquality();
      while (at("op", "&&")) {
        var line = next().line;
        left = { kind: "binary", op: "&&", left: left, right: parseEquality(), line: line };
      }
      return left;
    }
    function parseEquality() {
      var left = parseComparison();
      while (at("op", "==") || at("op", "!=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseComparison(), line: t.line };
      }
      return left;
    }
    function parseComparison() {
      var left = parseAdditive();
      while (at("op", "<") || at("op", ">") || at("op", "<=") || at("op", ">=")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseAdditive(), line: t.line };
      }
      return left;
    }
    function parseAdditive() {
      var left = parseMultiplicative();
      while (at("op", "+") || at("op", "-")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseMultiplicative(), line: t.line };
      }
      return left;
    }
    function parseMultiplicative() {
      var left = parseUnary();
      while (at("op", "*") || at("op", "/") || at("op", "%")) {
        var t = next();
        left = { kind: "binary", op: t.value, left: left, right: parseUnary(), line: t.line };
      }
      return left;
    }
    function parseUnary() {
      if (at("op", "!") || at("op", "-")) {
        var t = next();
        return { kind: "unary", op: t.value, arg: parseUnary(), line: t.line };
      }
      return parsePrimary();
    }

    function parseArguments() {
      var args = [];
      expect("punct", "(", "여는 괄호 «(»");
      if (!at("punct", ")")) {
        args.push(parseExpression());
        while (at("punct", ",")) {
          next();
          args.push(parseExpression());
        }
      }
      expect("punct", ")", "닫는 괄호 «)»");
      return args;
    }

    function parsePrimary() {
      var t = peek();

      if (t.type === "number") {
        next();
        return { kind: "number", value: t.value, line: t.line };
      }
      if (t.type === "string") {
        next();
        return { kind: "string", value: t.value, line: t.line };
      }
      if (at("punct", "(")) {
        next();
        var inner = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        return inner;
      }
      if (t.type === "name" || (t.type === "keyword" && t.value === "true") || (t.type === "keyword" && t.value === "false")) {
        next();
        var name = t.value;

        /* Serial.println(...) 처럼 «점» 으로 이어지는 호출 */
        if (at("punct", ".")) {
          next();
          var member = expect("name", undefined, "함수 이름").value;
          var args = parseArguments();
          return { kind: "call", target: name, name: member, args: args, line: t.line };
        }
        if (at("punct", "(")) {
          var callArgs = parseArguments();
          return { kind: "call", target: "", name: name, args: callArgs, line: t.line };
        }
        /* 배열 읽기 :  notes[i]  ·  notes[0]  (명세 8장 기준 프로그램) */
        if (at("punct", "[")) {
          next();
          var indexExpr = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          return { kind: "index", name: name, index: indexExpr, line: t.line };
        }
        if (Object.prototype.hasOwnProperty.call(CONSTANTS, name)) {
          return { kind: "constant", name: name, value: CONSTANTS[name], line: t.line };
        }
        return { kind: "variable", name: name, line: t.line };
      }

      throw new ParseError(
        t.type === "eof" ? "코드가 갑자기 끝났습니다. 빠진 부분이 있는지 살펴보세요." : "여기에 «" + t.value + "» 이(가) 올 수 없습니다.",
        t.line,
        "syntax"
      );
    }

    /* ----- 문장(statement) ----- */

    function parseBlock() {
      var open = expect("punct", "{", "여는 중괄호 «{»");
      var body = [];
      while (!at("punct", "}")) {
        if (at("eof")) {
          throw new ParseError(
            "중괄호 «{» 를 닫지 않았습니다. " + open.line + "번 줄에서 열린 괄호에 짝이 되는 «}» 를 적어 주세요.",
            open.line,
            "brace"
          );
        }
        body.push(parseStatement());
      }
      expect("punct", "}", "닫는 중괄호 «}»");
      return body;
    }

    function parseStatement() {
      var t = peek();

      /* if / else */
      if (t.type === "keyword" && t.value === "if") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        var cond = parseExpression();
        expect("punct", ")", "닫는 괄호 «)»");
        var thenBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        var elseBody = null;
        if (peek().type === "keyword" && peek().value === "else") {
          next();
          if (peek().type === "keyword" && peek().value === "if") elseBody = [parseStatement()];
          else elseBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        }
        return { kind: "if", cond: cond, then: thenBody, otherwise: elseBody, line: t.line };
      }

      /* 되풀이 :  for (int i=0; i<8; i++) { ... }   (명세 4장 · 8장) */
      if (t.type === "keyword" && t.value === "for") {
        next();
        expect("punct", "(", "여는 괄호 «(»");
        /* ① 처음에 한 번 : int i = 0;  (세미콜론까지 parseStatement 가 먹는다) */
        var init = at("punct", ";") ? null : parseStatement();
        if (init === null) next();
        /* ② 언제까지 : i < 8 */
        var cond = at("punct", ";") ? null : parseExpression();
        expect("punct", ";", "세미콜론 «;»");
        /* ③ 한 바퀴마다 : i++  (여기에는 세미콜론이 없다) */
        var stepStmt = null;
        if (!at("punct", ")")) {
          var vTok = expect("name", undefined, "변수 이름");
          var sOp = next();
          if (["=", "+=", "-=", "++", "--"].indexOf(sOp.value) === -1) {
            throw new ParseError(
              "for 의 셋째 자리에는 i++ 처럼 «값을 바꾸는 식» 을 적습니다.",
              sOp.line,
              "syntax"
            );
          }
          var stepValue;
          if (sOp.value === "++" || sOp.value === "--") {
            stepValue = {
              kind: "binary",
              op: sOp.value === "++" ? "+" : "-",
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: { kind: "number", value: 1, line: vTok.line },
              line: vTok.line
            };
          } else if (sOp.value === "+=" || sOp.value === "-=") {
            stepValue = {
              kind: "binary",
              op: sOp.value.charAt(0),
              left: { kind: "variable", name: vTok.value, line: vTok.line },
              right: parseExpression(),
              line: vTok.line
            };
          } else {
            stepValue = parseExpression();
          }
          stepStmt = { kind: "assign", name: vTok.value, value: stepValue, line: vTok.line };
        }
        expect("punct", ")", "닫는 괄호 «)»");
        var forBody = at("punct", "{") ? parseBlock() : [parseStatement()];
        return { kind: "for", init: init, cond: cond, step: stepStmt, body: forBody, line: t.line };
      }

      /* 변수 선언 :  int x = 5;  /  const int PIN = 13;  /  int notes[] = {…}; */
      if (t.type === "keyword" && (t.value === "const" || TYPES.indexOf(t.value) !== -1)) {
        var isConst = false;
        if (t.value === "const") {
          next();
          isConst = true;
        }
        if (peek().type === "keyword" && peek().value === "unsigned") next();
        var typeTok = peek();
        if (typeTok.type !== "keyword" || TYPES.indexOf(typeTok.value) === -1) {
          throw new ParseError("자료형(int, long, float, bool …) 이 있어야 합니다.", typeTok.line, "syntax");
        }
        next();
        var nameTok = expect("name", undefined, "변수 이름");

        /* ★ 배열 선언 :  int notes[] = {523, 587, …};  또는 int notes[8] = {…}; */
        if (at("punct", "[")) {
          next();
          var sized = null;
          if (!at("punct", "]")) sized = parseExpression();
          expect("punct", "]", "닫는 대괄호 «]»");
          var items = [];
          if (at("op", "=")) {
            next();
            expect("punct", "{", "여는 중괄호 «{»");
            if (!at("punct", "}")) {
              items.push(parseExpression());
              while (at("punct", ",")) {
                next();
                /* {1, 2, 3, } 처럼 쉼표 뒤에 바로 닫는 것도 봐준다 */
                if (at("punct", "}")) break;
                items.push(parseExpression());
              }
            }
            expect("punct", "}", "닫는 중괄호 «}»");
          }
          expect("punct", ";", "세미콜론 «;»");
          return {
            kind: "declare-array",
            name: nameTok.value,
            varType: typeTok.value,
            isConst: isConst,
            size: sized,
            items: items,
            line: t.line
          };
        }

        var init2 = null;
        if (at("op", "=")) {
          next();
          init2 = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return {
          kind: "declare",
          name: nameTok.value,
          varType: typeTok.value,
          isConst: isConst,
          init: init2,
          line: t.line
        };
      }

      /* 함수 정의가 함수 안에 들어온 경우 — 흔한 실수라 따로 알려 준다 */
      if (t.type === "keyword" && t.value === "void") {
        throw new ParseError(
          "함수 안에 또 다른 함수를 만들 수 없습니다. 앞의 «}» 를 빠뜨리지 않았는지 보세요.",
          t.line,
          "brace"
        );
      }

      /* 대입 :  x = 5;   x += 1;   x++; */
      if (t.type === "name" && peek(1).type === "op" && ["=", "+=", "-=", "++", "--"].indexOf(peek(1).value) !== -1) {
        next();
        var opTok = next();
        var value = null;
        if (opTok.value === "++" || opTok.value === "--") {
          value = {
            kind: "binary",
            op: opTok.value === "++" ? "+" : "-",
            left: { kind: "variable", name: t.value, line: t.line },
            right: { kind: "number", value: 1, line: t.line },
            line: t.line
          };
        } else if (opTok.value === "+=" || opTok.value === "-=") {
          value = {
            kind: "binary",
            op: opTok.value.charAt(0),
            left: { kind: "variable", name: t.value, line: t.line },
            right: parseExpression(),
            line: t.line
          };
        } else {
          value = parseExpression();
        }
        expect("punct", ";", "세미콜론 «;»");
        return { kind: "assign", name: t.value, value: value, line: t.line };
      }

      /* 그 밖에는 «식 하나로 이루어진 문장» — 대개 함수 호출이다 */
      var expr = parseExpression();
      expect("punct", ";", "세미콜론 «;»");
      return { kind: "express", expr: expr, line: t.line };
    }

    /* ----- 프로그램 전체 ----- */

    var functions = {};
    var order = [];
    var globals = [];

    while (!at("eof")) {
      /* 전역 변수 선언 */
      if (peek().type === "keyword" && (peek().value === "const" || TYPES.indexOf(peek().value) !== -1)) {
        globals.push(parseStatement());
        continue;
      }

      var head = peek();
      if (head.type !== "keyword" || head.value !== "void") {
        throw new ParseError(
          "함수는 «void 이름() { }» 모양으로 적습니다. setup 과 loop 두 함수가 필요합니다.",
          head.line,
          "structure"
        );
      }
      next();
      var fnName = expect("name", undefined, "함수 이름");
      expect("punct", "(", "여는 괄호 «(»");
      /* 1차시에서는 매개변수를 쓰지 않는다 */
      while (!at("punct", ")") && !at("eof")) next();
      expect("punct", ")", "닫는 괄호 «)»");
      var body = parseBlock();

      if (functions[fnName.value]) {
        throw new ParseError("«" + fnName.value + "» 함수를 두 번 만들었습니다.", fnName.line, "structure");
      }
      functions[fnName.value] = { name: fnName.value, body: body, line: head.line };
      order.push(fnName.value);
    }

    return { functions: functions, order: order, globals: globals };
  }

  /** 예외를 던지지 않는 파싱 — { ok, ast, error } */
  function tryParse(source) {
    try {
      return { ok: true, ast: parse(source), error: null };
    } catch (err) {
      if (err && err.name === "ParseError") {
        return { ok: false, ast: null, error: { line: err.line, message: err.message, code: err.code } };
      }
      return { ok: false, ast: null, error: { line: 0, message: "코드를 읽지 못했습니다.", code: "unknown" } };
    }
  }

  /* ------------------------------------------------------------------ */
  /* 3. 검사 항목 (명세 8장 마지막 문단 · 명세 5장 4단계 통과 조건)          */
  /* ------------------------------------------------------------------ */

  /** 나무 전체를 훑으며 함수 호출을 모은다 */
  function walkCalls(nodes, visit) {
    (nodes || []).forEach(function walkOne(node) {
      if (!node || typeof node !== "object") return;
      if (node.kind === "call") {
        visit(node);
        (node.args || []).forEach(walkOne);
        return;
      }
      ["expr", "value", "init", "left", "right", "arg", "cond", "index", "step"].forEach(function (key) {
        if (node[key]) walkOne(node[key]);
      });
      /* body : for 문 안쪽 · items : 배열 선언의 값들 */
      ["then", "otherwise", "args", "body", "items"].forEach(function (key) {
        if (Array.isArray(node[key])) node[key].forEach(walkOne);
      });
    });
  }

  function callsIn(ast, fnName) {
    var found = [];
    var fn = ast && ast.functions ? ast.functions[fnName] : null;
    if (!fn) return found;
    walkCalls(fn.body, function (call) {
      found.push(call);
    });
    return found;
  }

  function callName(call) {
    return call.target ? call.target + "." + call.name : call.name;
  }

  /** 문자열 인수 하나를 그대로 꺼낸다 (없으면 null) */
  function firstStringArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "string" ? a.value : null;
  }
  function firstNumberArg(call) {
    var a = (call.args || [])[0];
    return a && a.kind === "number" ? a.value : null;
  }

  /**
   * loop() 몸통의 명령을 «적힌 차례대로» 늘어놓는다.
   * if 안에 든 것도 함께 센다 — 순서만 지켜 준다.
   */
  function statementCalls(body) {
    var out = [];
    (body || []).forEach(function (stmt) {
      if (!stmt) return;
      if (stmt.kind === "express" && stmt.expr && stmt.expr.kind === "call") out.push(stmt.expr);
      else if (stmt.kind === "if") {
        out = out.concat(statementCalls(stmt.then));
        if (stmt.otherwise) out = out.concat(statementCalls(stmt.otherwise));
      }
    });
    return out;
  }

  /**
   * 코드가 «스피커 핀으로 쓰는» 번호. tone() 의 첫 인수를 본다.
   * speakerPin 처럼 이름을 붙였으면 맨 위 선언에서 숫자를 찾아 푼다.
   * 알 수 없으면 이 차시의 기본 핀을 쓴다.
   */
  function codeSpeakerPin(ast) {
    var known = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    var found = null;
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (c) {
        if (found !== null || callName(c) !== "tone") return;
        var a = (c.args || [])[0];
        if (!a) return;
        if (a.kind === "number") found = a.value;
        else if (a.kind === "variable" && known[a.name] !== undefined) found = known[a.name];
      });
    });
    return found === null ? (PC.SPEAKER_PIN === undefined ? 8 : PC.SPEAKER_PIN) : found;
  }

  /** setup() 과 loop() 를 통틀어 그 이름의 호출을 모두 모은다 */
  function allCalls(ast, fnName) {
    return callsIn(ast, "setup").concat(callsIn(ast, "loop")).filter(function (c) {
      return callName(c) === fnName;
    });
  }

  /** 전역에서 «숫자 배열» 로 선언한 이름들 */
  function arraysIn(ast) {
    var out = {};
    ((ast && ast.globals) || []).forEach(function (g) {
      if (g.kind === "declare-array") out[g.name] = g.items || [];
    });
    return out;
  }

  /**
   * 검사 항목 — 화면에는 이 목록이 «통과/미통과» 로 보인다.
   * 정답 코드를 통째로 보여 주지 않고 «무엇이 빠졌는지» 만 알려 준다.
   *
   * 코드 검사 여덟 항목 (명세 8장 «검사 항목»)
   *   ① speakerPin 선언   ② 음 배열   ③ setup/loop   ④ 반복문
   *   ⑤ tone 세 값        ⑥ delay ≥ tone 길이       ⑦ noTone   ⑧ 회로 핀 대조
   *
   * 마지막 항목만 «회로» 를 함께 본다. 그래서 run(ast, ctx) 로 상황을 함께 넘긴다.
   *   ctx.connections : 3단계에서 학생이 이은 케이블 목록
   */
  var TESTS = [
    {
      id: "t-speakerpin",
      label: "speakerPin 변수를 선언했다",
      run: function (ast) {
        var found = (ast.globals || []).filter(function (g) {
          return g.kind === "declare" && g.name === "speakerPin";
        });
        if (found.length === 0) {
          return {
            ok: false,
            message:
              "speakerPin 을 만들지 않았습니다. 맨 위에 const int speakerPin = ...; 처럼 핀 번호에 이름을 붙여 주세요."
          };
        }
        var value = found[0].init && found[0].init.kind === "number" ? found[0].init.value : null;
        if (value === null) {
          return { ok: false, message: "speakerPin 에는 핀 «번호» 를 숫자로 적어 주세요. 예) const int speakerPin = 8;" };
        }
        return { ok: true };
      }
    },
    {
      id: "t-notes",
      label: "음 높이를 담은 배열이 있다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var names = Object.keys(arrays);
        if (names.length === 0) {
          return {
            ok: false,
            message:
              "음을 담을 배열이 없습니다. int notes[] = {523, 587, ...}; 처럼 여러 값을 한 이름에 담아 주세요."
          };
        }
        var items = arrays[names[0]];
        if (items.length < 2) {
          return {
            ok: false,
            message: "배열 안에 값이 " + items.length + "개뿐입니다. 여러 음을 차례로 내려면 값이 두 개 이상 있어야 합니다."
          };
        }
        var allNumbers = items.every(function (item) {
          return item && item.kind === "number";
        });
        if (!allNumbers) {
          return { ok: false, message: "배열에는 주파수를 «숫자» 로 적습니다. 예) {523, 587, 659}" };
        }
        return { ok: true };
      }
    },
    {
      id: "t-setup",
      label: "setup() 과 loop() 함수가 모두 있다",
      run: function (ast) {
        if (!ast.functions.setup) {
          return { ok: false, message: "void setup() { } 가 없습니다. 처음 한 번만 할 일을 여기에 적습니다." };
        }
        if (!ast.functions.loop) {
          return {
            ok: false,
            message:
              "void loop() { } 가 없습니다. 되풀이할 일이 없어도 아두이노는 이 함수를 찾으므로 void loop() {} 처럼 비워서라도 적어야 합니다."
          };

      }
    },
    {
      id: "t-for",
      label: "반복문으로 배열의 음을 차례로 지나간다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var arrayName = Object.keys(arrays)[0] || "";

        var hasFor = false;
        ["setup", "loop"].forEach(function (fnName) {
          var fn = ast.functions[fnName];
          if (!fn) return;
          (fn.body || []).forEach(function walk(stmt) {
            if (!stmt) return;
            if (stmt.kind === "for") hasFor = true;
            if (Array.isArray(stmt.body)) stmt.body.forEach(walk);
            if (Array.isArray(stmt.then)) stmt.then.forEach(walk);
            if (Array.isArray(stmt.otherwise)) stmt.otherwise.forEach(walk);
          });
        });

        if (!hasFor) {
          return {
            ok: false,
            message:
              "for 문이 없습니다. 여덟 줄을 따로 적는 대신 for (int i=0; i<8; i++) { ... } 로 되풀이해 보세요."
          };
        }

        /* 되풀이는 하는데 «배열을 읽지 않는» 코드 — 같은 음만 여덟 번 난다 */
        var readsArray = false;
        allCalls(ast, "tone").forEach(function (c) {
          var freq = (c.args || [])[1];
          if (freq && freq.kind === "index" && (!arrayName || freq.name === arrayName)) readsArray = true;
        });
        if (!readsArray) {
          return {
            ok: false,
            message:
              "되풀이는 하는데 tone() 이 늘 같은 값을 씁니다. 두 번째 값에 " +
              (arrayName || "notes") + "[i] 처럼 «i 번째 음» 을 적어야 음이 바뀝니다."
          };

      }
    },
    {
      id: "t-tone",
      label: "tone(핀, 주파수, 길이) 으로 소리를 낸다",
      run: function (ast) {
        var tones = allCalls(ast, "tone");
        if (tones.length === 0) {
          return {
            ok: false,
            message: "tone(...) 이 없습니다. 소리를 내는 함수는 tone 입니다. 예) tone(speakerPin, 523, 250);"
          };
        }
        var bad = tones.filter(function (c) {
          return (c.args || []).length < 2;
        });
        if (bad.length > 0) {
          return {
            ok: false,
            message:
              "tone 에는 적어도 «핀» 과 «주파수» 두 값이 필요합니다. (" + bad[0].line + "번 줄)"
          };
        }
        var noDuration = tones.filter(function (c) {
          return (c.args || []).length < 3;
        });
        if (noDuration.length === tones.length) {
          return {
            ok: false,
            message:
              "tone 에 «길이» 를 적지 않으면 noTone 을 부를 때까지 한 음이 계속 울립니다. " +

          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-gap",
      label: "음과 음 사이에 delay() 로 사이를 둔다",
      run: function (ast, ctx) {
        var tones = allCalls(ast, "tone");
        if (tones.length === 0) return { ok: false, message: "tone(...) 을 먼저 적어 주세요." };

        var delays = allCalls(ast, "delay");
        if (delays.length === 0) {
          return {
            ok: false,
            message:
              "delay(...) 가 없습니다. tone 은 «기다리지 않고» 다음 줄로 가므로, " +
              "delay 가 없으면 여덟 음이 거의 동시에 시작해 마지막 음만 들립니다."

         *   돌려 보아 소리가 난 구간이 두 개 미만이면 음이 뭉개진 것이다.
         */
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var result = run(source, { loopLimit: 2, speakerPin: codeSpeakerPin(ast) });
        var phases = tonePhases(result).filter(function (p) {
          return p.hz > 0;
        });

        if (phases.length < 2) {
          return {
            ok: false,
            message:
              "돌려 보니 소리가 " + phases.length + "번밖에 나지 않습니다. " +
              "delay 를 tone 의 길이보다 «길게» 두어야 음과 음이 갈라집니다. 예) tone(…, 250); 뒤에 delay(400);"
          };

        var gaps = tonePhases(result).filter(function (p) {
          return p.hz === 0 && p.ms > 0;
        });
        if (gaps.length === 0) {
          return {
            ok: false,
            message:
              "음과 음이 빈틈없이 이어져 있습니다. delay 를 tone 의 길이보다 조금 길게 두면 " +
              "그 차이만큼 조용한 사이가 생겨 음이 또렷이 갈라집니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "t-notone",
      label: "다 울린 뒤 noTone() 으로 멈춘다",
      run: function (ast) {
        var stops = allCalls(ast, "noTone");
        if (stops.length === 0) {
          return {
            ok: false,
            message:
              "noTone(...) 이 없습니다. 소리를 멈추는 함수는 noTone 입니다. 예) noTone(speakerPin);"
          };
        }
        var wrongPin = stops.filter(function (c) {
          return (c.args || []).length === 0;
