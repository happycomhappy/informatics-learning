<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="고등학교 1학년 정보 · 피에조 스피커로 소리 내기 학습 활동"
    />
    <meta name="robots" content="noindex" />
    <title>피에조 스피커로 소리 내기</title>

    <!-- 스타일은 적은 순서대로 겹쳐 쌓인다. 뒤에 오는 파일이 앞의 값을 덮는다. -->
    <style data-from="styles/tokens.css">
/* ------------------------------------------------------------------
 * 색·간격·글꼴의 «기준값»
 *
 * ★ 이 값들은 lesson3_7_1(「조건에 따라 달라지는 프로그램」) 과 «일부러 같게» 맞추었다.
 *   학생이 여러 차시를 오갈 때 화면이 달라 보이면 매번 새로 익혀야 하기 때문이다.
 *   색·글꼴·모서리·간격을 고칠 때는 그 차시의 tokens.css 도 함께 본다.
 *
 * 색만으로 뜻을 전하지 않는다(명세 13장). 아래 색들은 늘 «아이콘·글자» 와 함께 쓴다.
 * ------------------------------------------------------------------ */
:root {
  /* ── 기본 색 (lesson3_7_1 과 동일) ───────────────────────────── */
  --color-bg: #f7f9fc;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-text-sub: #6b7280;
  --color-primary: #2563eb;
  --color-primary-dark: #1d4ed8;
  --color-primary-soft: #eff6ff;

  /* 참·거짓 / 통과·주의 */
  --color-true: #059669;
  --color-true-dark: #047857;
  --color-true-soft: #ecfdf5;
  --color-false: #d97706;
  --color-false-dark: #b45309;
  --color-false-soft: #fffbeb;
  --color-error: #dc2626;
  --color-error-soft: #fef2f2;

  /* 테두리·바탕 */
  --color-border: #d7dee8;
  --color-border-strong: #b6c2d2;
  --color-muted-bg: #eef2f7;

  /* 코드 상자 */
  --color-console-bg: #1e293b;
  --color-console-text: #e2e8f0;
  --color-code-bg: #f1f5f9;
  --color-error-on-dark: #fca5a5;
  --color-hint-on-dark: #fcd34d;

  /* 구문 색상 (어두운 바탕 위) */
  --tok-keyword: #f9a8d4;
  --tok-builtin: #7dd3fc;
  --tok-string: #fcd34d;
  --tok-number: #86efac;
  --tok-const: #d8b4fe;
  --tok-comment: #94a3b8;
  --tok-punct: #cbd5e1;

  /* ── 이 차시에만 있는 것 : 회로 그림 ────────────────────────── */
  --board-teal: #1f7a6d;
  --board-teal-dark: #145c52;
  --bb-body: #f0f1f3;
  --bb-line: #c6cbd3;
  --rail-plus: #d63b2f;
  --rail-minus: #2a63c4;
  --pin-hole: #2c3542;

  /* ── 이 차시의 부품 : LED 와 저항 ────────────────────────────
     ★ 색은 «보기 편하라고» 있는 것이다. 극성·정오·위험을 색으로만 알리지 않는다
       (명세 13장). 몸통의 ＋ 표시와 단자 이름표 글자를 언제나 함께 쓴다. */
  --part-tray: #eef1f6;
  --part-lead: #9aa3ae;
  /* ── 피에조 (이 차시) ────────────────────────────────────────
     ★ 소리를 «색으로만» 알리지 않는다(명세 13장). 아래 색들은 늘
       ♪ 표시·주파수 숫자·음이름 글자와 «함께» 쓴다. */
  /* 겉모습 — 실물은 «검은 원통» 이고 가운데에 소리 구멍이 있다.
     ＋ 표시는 몸통 위에 찍혀 있으므로 어두운 바탕에 밝게 둔다. */
  --piezo-case: #2f343b;
  --piezo-case-edge: #14171b;
  --piezo-top: #454b54;       /* 윗면 */
  --piezo-hole: #101215;      /* 가운데 소리 구멍 */
  --piezo-markbg: #f3f4f6;    /* ⊕ 표시 바탕 */
  --piezo-mark: #1f2937;      /* ⊕ 글자 */
  --piezo-brass: #d8b26a;     /* 놋쇠 판 */
  --piezo-brass-edge: #a8853f;
  --piezo-crystal: #e6e0f2;   /* 세라믹 결정체 */
  --piezo-crystal-edge: #a99cc4;
  --piezo-board: #2f7d4f;     /* 모듈형의 기판 */
  --piezo-board-edge: #1e5a37;

  /* 울리는 동안 퍼지는 물결과 켜진 표시 */
  --sound-on: #2563eb;
  --sound-on-edge: #1d4ed8;
  --sound-glow: rgba(37, 99, 235, 0.28);
  --sound-off: #b9c3cf;

  /* 오실로스코프 */
  --scope-bg: #10192b;
  --scope-grid: rgba(148, 163, 184, 0.28);
  --scope-level: rgba(148, 163, 184, 0.55);
  --scope-line: #4ade80;
  --scope-axis: #94a3b8;

  /* 함수 설명 상자 — 수업 자료의 «크림색 상자» 를 그대로 옮긴 것.
     본문 카드(흰색)와 갈라 보이되 경고(노랑)와는 헷갈리지 않을 만큼만 옅게 둔다. */
  --fn-box-bg: #f7f6e3;
  --fn-box-edge: #e4e2c4;
  --fn-code-bg: #fffef5;

  /* ── 타이포그래피 (lesson3_7_1 과 동일) ─────────────────────── */
  --font-sans: Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: D2Coding, "D2Coding ligature", Consolas, "Cascadia Mono", "SFMono-Regular",
    Menlo, "Nanum Gothic Coding", monospace;
  --fs-body: 16px;
  --fs-h1: 32px;
  --fs-h2: 24px;
  --fs-code: 15px;
  --fs-small: 14px;

  /* ── 간격·형태 ─────────────────────────────────────────────── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.16);
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* 애니메이션 시간 */
  --dur-highlight: 200ms;
  --dur-screen: 300ms;
  --dur-progress: 300ms;

  /* 터치 대상 최소 크기 (명세 13장) */
  --touch-min: 44px;

  /* ── 화면 너비 ─────────────────────────────────────────────── */
  /* 껍데기(상단 스테퍼·본문 바탕)는 넓게, 글은 읽기 좋은 너비로 좁게 */
  --shell-width: 1080px;
  --hero-width: 760px;
  --read-width: 860px;
}

@media (max-width: 767px) {
  :root {
    --fs-body: 15px;
    --fs-h1: 24px;
    --fs-h2: 20px;
    --fs-code: 14px;
    --fs-small: 13px;
  }
}

/* 움직임을 줄여 달라고 설정한 사용자에게는 전환을 없앤다 */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-highlight: 0ms;
    --dur-screen: 0ms;
    --dur-progress: 0ms;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
    </style>
    <style data-from="styles/common.css">
/* ------------------------------------------------------------------
 * 학생용·교사용이 함께 쓰는 부품 (버튼 · 입력 · 카드 · 코드 상자 · 알림)
 *
 * 모양은 lesson3_7_1 과 같게 맞추었다. 차시가 바뀌어도 «같은 앱» 처럼 보이게 하려는 것이다.
 * ------------------------------------------------------------------ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

/* hidden 속성이 display 보다 세게 듣게 한다.
   .alert 나 .quiz-gate 처럼 display: flex 로 놓은 것은 hidden 만으로는 사라지지 않는다. */
[hidden] {
  display: none !important;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: 1.7;
  overflow-x: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

/* 초점 표시를 없애지 않는다 (명세 13장) */
:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  background: var(--color-primary);
  color: #fff;
  border-radius: 0 0 var(--radius-sm) 0;
}
.skip-link:focus {
  left: 0;
}

/* ------------------------------ 카드 ------------------------------ */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: var(--space-5);
  overflow: hidden;
}

.card__head {
  padding: var(--space-5) var(--space-5) 0;
}

.card__eyebrow {
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--color-primary);
  margin-bottom: var(--space-1);
}

.card__title {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.4;
  color: var(--color-text);
}

.card__desc {
  margin-top: var(--space-2);
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.card__body {
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.para {
  color: var(--color-text);
}

/* ------------------------------ 버튼 ------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--touch-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius);
  border: 2px solid transparent;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, color var(--dur-highlight) ease,
    border-color var(--dur-highlight) ease, transform var(--dur-highlight) ease;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-dark);
}

.btn--ghost {
  border-color: var(--color-primary);
  color: var(--color-primary-dark);
  background: var(--color-surface);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-primary-soft);
}

.btn--quiet {
  color: var(--color-text-sub);
  background: transparent;
}
.btn--quiet:hover:not(:disabled) {
  background: var(--color-muted-bg);
  color: var(--color-text);
}

.btn--lg {
  min-height: 56px;
  padding: 0 var(--space-6);
  font-size: 18px;
  border-radius: var(--radius-lg);
}

.btn--small {
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 14px;
}

.btn--icon {
  min-width: var(--touch-min);
  padding: 0 var(--space-2);
}

.btnrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
}

/* 단추 넷을 «한 줄» 에 놓는 줄.
   사이와 좌우 여백을 조금 줄여 자리를 만든다. 누르는 높이 44px 은 그대로 지킨다.
   휴대전화처럼 좁은 화면에서는 어쩔 수 없이 접힌다 — 그때도 순서는 그대로다. */
.btnrow--one {
  gap: var(--space-2);
}

.btnrow--one .btn {
  padding: 0 var(--space-3);
}

@media (max-width: 767px) {
  /* 넷이 한 줄에 들어가지 않는 좁은 화면에서는 «2 + 2» 로 접는다.
     하나만 아래로 떨어지는 것보다 짝지어 접히는 편이 읽기 쉽다. */
  .btnrow--one .btn {
    flex: 1 1 calc(50% - var(--space-2));
  }
}

.btnrow__note {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.btnrow__label {
  font-size: var(--fs-small);
  font-weight: 700;
  color: var(--color-text-sub);
}

/* ------------------------------ 입력 ------------------------------ */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.field--inline {
  flex: 1 1 180px;
}

.field__label {
  font-weight: 700;
  color: var(--color-text);
  font-size: 15px;
}

.field__help {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.input {
  width: 100%;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: var(--fs-body);
  color: var(--color-text);
  background: var(--color-surface);
}

.input:focus {
  border-color: var(--color-primary);
}

.input[aria-invalid="true"] {
  border-color: var(--color-false);
  background: var(--color-false-soft);
}

.input--area {
  min-height: 84px;
  resize: vertical;
  line-height: 1.6;
}

.input--mono {
  font-family: var(--font-mono);
  font-size: var(--fs-code);
}

.input--number {
  max-width: 140px;
}

.field__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: space-between;
}

.field__count {
  font-size: 13px;
  color: var(--color-text-sub);
}

.field__count--ok {
  color: var(--color-true-dark);
  font-weight: 700;
}

.field__error {
  font-size: var(--fs-small);
  color: var(--color-false-dark);
  font-weight: 700;
}

/* 고르기 */
.choices {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choices__legend {
  padding: 0;
  font-weight: 800;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}

/* 물음이 카드 제목에 이미 적혀 있을 때는 화면에서 감춘다(낭독기는 읽는다) */
.choices__legend--sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.choice {
  position: relative;
}

.choice__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.choice__label {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  min-height: var(--touch-min);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
  cursor: pointer;
  transition: background-color var(--dur-highlight) ease, border-color var(--dur-highlight) ease;
}

.choice__label:hover {
  background: var(--color-primary-soft);
}

.choice__input:checked + .choice__label {
  border-color: var(--color-primary);
  border-width: 2px;
  background: var(--color-primary-soft);
  padding: calc(var(--space-3) - 1px);
  font-weight: 700;
}

.choice__input:focus-visible + .choice__label {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

.choice__no {
  color: var(--color-primary);
  font-weight: 800;
}

/* 확인란 */
.check {
  display: flex;
  gap: var(--space-3);
  align-items: center;
  min-height: var(--touch-min);
}

.check__input {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  accent-color: var(--color-primary);
}

.check__label {
  font-weight: 700;
  cursor: pointer;
}

/* ------------------------------ 알림 ------------------------------ */

.alert {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid var(--color-border);
  border-left-width: 5px;
  background: var(--color-surface);
  font-size: 15px;
  min-height: 56px;
  align-items: flex-start;
}

.alert__icon {
  flex: 0 0 auto;
  font-size: 18px;
  line-height: 1.5;
}

.alert__word {
  font-weight: 800;
}

.alert__body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.alert__fix {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
}

.alert--info {
  border-left-color: var(--color-primary);
  background: var(--color-primary-soft);
}
.alert--info .alert__word {
  color: var(--color-primary-dark);
}

.alert--ok {
  border-left-color: var(--color-true);
  background: var(--color-true-soft);
}
.alert--ok .alert__word {
  color: var(--color-true-dark);
}

.alert--warn {
  border-left-color: var(--color-false);
  background: var(--color-false-soft);
}
.alert--warn .alert__word {
  color: var(--color-false-dark);
}

.alert--danger {
  border-left-color: var(--color-error);
  background: var(--color-error-soft);
}
.alert--danger .alert__word {
  color: var(--color-error);
}

/* 조건 목록 (명세 6.2) */
.condlist {
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.cond {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-surface);
}

.cond--ok {
  border-color: var(--color-true);
  background: var(--color-true-soft);
}

.cond__mark {
  font-weight: 800;
  color: var(--color-text-sub);
}

.cond--ok .cond__mark {
  color: var(--color-true-dark);
}

.cond__body {
  flex: 1;
}

.cond__label {
  font-weight: 700;
}

.cond__detail {
  font-size: var(--fs-small);
  color: var(--color-text-sub);
  margin-top: var(--space-1);
}

.cond__state {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-text-sub);
  white-space: nowrap;
}

.cond--ok .cond__state {
  color: var(--color-true-dark);
}
