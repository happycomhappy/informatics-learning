        if (wrongPin.length > 0) {
          return { ok: false, message: "noTone 에는 «어느 핀» 을 멈출지 적습니다. 예) noTone(speakerPin);" };
        }
        return { ok: true };
      }
    },
    {
      id: "t-pin-match",
      label: "코드의 핀 번호가 결선도의 핀(D8)과 같다",
      run: function (ast, ctx) {
        /* 3단계에서 케이블을 잇지 않으므로(2026-11-09) 넘겨받은 것이 없으면 결선도 회로와 맞댄다 */
        var conns = (ctx && ctx.connections) || [];
        if (conns.length === 0 && PC.circuit && PC.circuit.diagramConnections) {
          conns = PC.circuit.diagramConnections();
        }
        var problems = PC.circuit ? PC.circuit.pinMismatch(pinsUsed(ast), conns) : [];
        if (problems.length === 0) return { ok: true };
        return { ok: false, message: problems[0].message };
      }
    }
  ];

  /** 아는 함수인지 — 모르는 함수를 조용히 넘기지 않는다 */
  var KNOWN_CALLS = [
    "Serial.begin",
    "Serial.print",
    "Serial.println",
    "pinMode",
    "digitalWrite",
    "digitalRead",
    "analogRead",
    "analogWrite",
    "delay",
    "millis",
    /* 이 차시에서 늘어난 둘 (명세 4장) */
    "tone",
    "noTone"
  ];

  var PIN_CALLS = ["pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "tone", "noTone"];

  /**
   * 코드가 쓰는 핀 번호를 모은다 (회로와 대조할 때 쓴다 — 명세 6.2 · 17.4 8번)
   *
   * ★ speakerPin 처럼 «맨 위에서 숫자로 정해 둔» 이름은 그 숫자로 풀어 준다.
   *   풀지 않으면 회로와 맞대어 볼 수 없어 8번 검사가 늘 실패한다.
   */
  function pinsUsed(ast) {
    var uses = [];

    /* 전역에서 숫자로 초기화한 이름만 모은다. 나중에 바뀌는 값은 알 수 없으므로 세지 않는다. */
    var known = {};
    (ast.globals || []).forEach(function (g) {
      if (g.kind === "declare" && g.init && g.init.kind === "number") known[g.name] = g.init.value;
    });
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (PIN_CALLS.indexOf(callName(call)) === -1) return;
        var arg = (call.args || [])[0];
        if (!arg) return;
        if (arg.kind === "number") {
          uses.push({ pin: arg.value, line: call.line, call: callName(call) });
        } else if (arg.kind === "constant" && /^A\d$/.test(arg.name)) {
          /* analogRead(A0) — 아날로그 핀은 이름이 곧 핀이다 */
          uses.push({ pin: arg.name, line: call.line, call: callName(call) });
        } else if (arg.kind === "variable") {
          if (known[arg.name] !== undefined) {
            uses.push({ pin: known[arg.name], line: call.line, call: callName(call), viaName: arg.name });
          } else {
            uses.push({ pin: arg.name, line: call.line, call: callName(call), fromVariable: true });
          }
        }
      });
    });
    return uses;
  }

  /**
   * 문법·필수 함수·핀 검사를 한꺼번에 (명세 8장)
   * 돌려주는 것 : { ok, parsed, error, tests:[{id,label,ok,message}], passed, warnings:[] }
   */
  /* ------------------------------------------------------------------ */
  /* 확장 활동 검사 (5단계 «나만의 알림음»)                                 */
  /*                                                                    */
  /* ★ 4단계의 TESTS 를 그대로 쓸 수 «없다».                              */
  /*   그쪽은 정해진 여덟 음의 음계를 맞대어 보는 검사라 «notes[] 에 무엇이   */
  /*   적혀 있는가» 까지 따진다. 확장 활동은 학생이 «자기 알림음» 을 만드는   */
  /*   자리이므로, 무엇을 적었는지가 아니라 «짜임새가 맞는가» 만 본다.       */
  /*                                                                    */
  /* ★ 마지막 항목은 «실제로 돌려» 본다. delay 가 tone 보다 길어야 음이      */
  /*   갈라진다는 이 차시의 알맹이는, 눈으로 세는 것으로는 확인할 수 없다.    */
  /* ------------------------------------------------------------------ */

  var ALARM_TESTS = [
    {
      id: "x-pin",
      label: "speakerPin 에 핀 번호를 적었다",
      run: function (ast) {
        var found = (ast.globals || []).filter(function (g) {
          return g.kind === "declare" && g.name === "speakerPin";
        });
        if (found.length === 0) {
          return { ok: false, message: "맨 윗줄의 const int speakerPin = ...; 를 지우지 마세요." };
        }
        return { ok: true };
      }
    },
    {
      id: "x-array",
      label: "쓸 음의 주파수를 배열에 적었다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var names = Object.keys(arrays);
        if (names.length === 0) {
          return {
            ok: false,
            message: "주파수 배열이 없습니다. int alarm[] = {523, 659, 784}; 처럼 «중괄호 안에» 적어 주세요."
          };
        }
        var items = arrays[names[0]] || [];
        if (items.length === 0) {
          return { ok: false, message: "배열이 비어 있습니다. 쓸 음의 주파수를 하나 이상 적어 주세요." };
        }
        /* items 는 «해석된 나무» 다 — 숫자만 꺼내 견준다 */
        var bad = items
          .map(function (it) {
            return it && it.kind === "number" ? it.value : null;
          })
          .filter(function (v) {
            return v === null || !(v >= PC.FREQ_MIN && v <= PC.FREQ_MAX);
          });
        if (bad.length > 0) {
          return {
            ok: false,
            message:
              "«" + bad[0] + "» 은(는) 이 스피커가 낼 수 있는 " + PC.FREQ_MIN + " ~ " + PC.FREQ_MAX +
              "Hz 를 벗어납니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-for",
      label: "for 문의 횟수가 음의 개수와 같다",
      run: function (ast) {
        var arrays = arraysIn(ast);
        var name = Object.keys(arrays)[0] || "";
        var count = (arrays[name] || []).length;

        var loops = [];
        ["setup", "loop"].forEach(function (fnName) {
          var fn = ast.functions[fnName];
          if (!fn) return;
          (fn.body || []).forEach(function walk(stmt) {
            if (!stmt) return;
            if (stmt.kind === "for") loops.push(stmt);
            if (Array.isArray(stmt.body)) stmt.body.forEach(walk);
            if (Array.isArray(stmt.then)) stmt.then.forEach(walk);
            if (Array.isArray(stmt.otherwise)) stmt.otherwise.forEach(walk);
          });
        });
        if (loops.length === 0) {
          return {
            ok: false,
            message: "for 문이 없습니다. for (int i=0; i<" + (count || 3) + "; i++) { 처럼 적어 주세요."
          };
        }

        /* 되풀이 횟수를 읽어 «배열의 개수» 와 맞대어 본다 */
        var test = loops[0].cond;
        var limit =
          test && test.right && test.right.kind === "number" ? test.right.value : null;
        if (limit === null) return { ok: true };
        if (count && limit !== count) {
          return {
            ok: false,
            message:
              "배열에는 음이 " + count + "개인데 for 문은 " + limit + "번 돕니다. " +
              (limit > count
                ? "배열에 없는 자리를 읽으려 해서 도중에 멈춥니다."
                : "뒤의 음이 울리지 않습니다.") +
              " i<" + count + " 로 맞춰 주세요."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-tone",
      label: "for 문 안에서 배열의 음을 하나씩 낸다",
      run: function (ast) {
        var tones = allCalls(ast, "tone");
        if (tones.length === 0) {
          return { ok: false, message: "tone(...) 이 없습니다. 예) tone(speakerPin, alarm[i], 150);" };
        }
        var arrays = arraysIn(ast);
        var name = Object.keys(arrays)[0] || "";
        var reads = tones.filter(function (c) {
          var freq = (c.args || [])[1];
          return freq && freq.kind === "index" && (!name || freq.name === name);
        });
        if (reads.length === 0) {
          return {
            ok: false,
            message:
              "tone 의 두 번째 값이 늘 같습니다. " + (name || "alarm") +
              "[i] 처럼 «i 번째 음» 을 적어야 음이 바뀝니다."
          };
        }
        var noDuration = reads.filter(function (c) {
          return (c.args || []).length < 3;
        });
        if (noDuration.length === reads.length) {
          return {
            ok: false,
            message:
              "tone 의 세 번째 값(길이)을 적지 않았습니다. 이 수업에서는 길이를 적는 방법으로 만듭니다."
          };
        }
        return { ok: true };
      }
    },
    {
      id: "x-notone",
      label: "for 문 안에서 noTone() 으로 한 음을 마무리한다",
      run: function (ast) {
        var stops = allCalls(ast, "noTone");
        if (stops.length === 0) {
          return { ok: false, message: "noTone(...) 이 없습니다. 예) noTone(speakerPin);" };
        }
        if ((stops[0].args || []).length === 0) {
          return { ok: false, message: "noTone 에는 «어느 핀» 을 멈출지 적습니다. 예) noTone(speakerPin);" };
        }
        return { ok: true };
      }
    },
    {
      id: "x-gap",
      label: "돌려 보니 음이 «갈라져» 들린다",
      run: function (ast, ctx) {
        /**
         * ★ 이 항목만 «실제로 돌려» 본다.
         *   delay 가 tone 의 길이보다 길어야 음이 갈라진다는 것은
         *   줄을 세어서는 알 수 없고 시간표를 보아야 안다.
         */
        var source = (ctx && ctx.source) || "";
        if (!source) return { ok: true };
        var result = run(source, { loopLimit: 2, speakerPin: codeSpeakerPin(ast) });
        if (result.error) {
          return { ok: false, message: result.error.message };
        }
        var phases = tonePhases(result);
        var sounds = phases.filter(function (p) {
          return p.hz > 0;
        });
        if (sounds.length === 0) {
          return { ok: false, message: "돌려 보니 소리가 한 번도 나지 않았습니다." };
        }
        var gaps = phases.filter(function (p) {
          return p.hz === 0 && p.ms > 0;
        });
        if (sounds.length > 1 && gaps.length === 0) {
          return {
            ok: false,
            message:
              "음은 여러 개인데 «사이» 가 없어 하나로 이어 들립니다. " +
              "delay 를 tone 의 길이보다 «길게» 두세요."
          };
        }
        return { ok: true };
      }
    }
  ];

  /**
   * 확장 활동 코드를 살펴본다. validate() 와 돌려주는 모양이 같다.
   *   { ok, parsed, error, tests: [{id,label,ok,message}], passed }
   */
  function validateAlarm(source) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        tests: ALARM_TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0
      };
    }
    var ast = parsed.ast;
    var results = ALARM_TESTS.map(function (t) {
      var r = t.run(ast, { source: source });
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;
    return {
      ok: passed === results.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed
    };
  }

  function validate(source, ctx) {
    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        parsed: false,
        error: parsed.error,
        ast: null,
        tests: TESTS.map(function (t) {
          return { id: t.id, label: t.label, ok: false, message: "먼저 문법 오류를 고쳐 주세요." };
        }),
        passed: 0,
        warnings: []
      };
    }

    var ast = parsed.ast;
    /* 검사 항목이 «실제로 돌려 보아야» 알 수 있는 것도 있어서 원본 글을 함께 넘긴다 */
    var runCtx = { connections: (ctx && ctx.connections) || [], source: source };
    var results = TESTS.map(function (t) {
      var r = t.run(ast, runCtx);
      return { id: t.id, label: t.label, ok: r.ok === true, message: r.message || "" };
    });
    var passed = results.filter(function (r) {
      return r.ok;
    }).length;

    /* 경고 — 틀린 것은 아니지만 짚어 줄 것들 */
    var warnings = [];
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        var full = callName(call);
        if (KNOWN_CALLS.indexOf(full) === -1) {
          warnings.push({
            line: call.line,
            message: "«" + full + "» 은(는) 이 수업에서 아직 다루지 않는 함수입니다. 시뮬레이터가 실행하지 못합니다."
          });
        }
      });
    });

    /* pinMode 의 두 번째 값은 INPUT / OUTPUT / INPUT_PULLUP 중 하나여야 한다 */
    ["setup", "loop"].forEach(function (fnName) {
      callsIn(ast, fnName).forEach(function (call) {
        if (callName(call) !== "pinMode") return;
        var mode = (call.args || [])[1];
        var okMode = mode && mode.kind === "constant" && ["INPUT", "OUTPUT", "INPUT_PULLUP"].indexOf(mode.name) !== -1;
        if (!okMode) {
          warnings.push({
            line: call.line,
            message: "pinMode 의 두 번째 값은 INPUT, OUTPUT, INPUT_PULLUP 중 하나여야 합니다."
          });
        }
      });
    });

    /* 핀 번호가 보드에 있는 번호인지 */
    pinsUsed(ast).forEach(function (use) {
      if (use.fromVariable) return;
      var n = use.pin;
      if (typeof n === "number" && (n < 0 || n > 13 || Math.floor(n) !== n)) {
        warnings.push({ line: use.line, message: "디지털 핀 번호는 0~13 입니다. 지금 값 : " + n });
      }
    });

    return {
      ok: passed === TESTS.length,
      parsed: true,
      error: null,
      ast: ast,
      tests: results,
      passed: passed,
      warnings: warnings
    };
  }

  /* ------------------------------------------------------------------ */
  /* 4. 시뮬레이터 — 상태 모델 위에서 흉내 내기                             */
  /* ------------------------------------------------------------------ */

  function StopRun(reason) {
    this.name = "StopRun";
    this.reason = reason;
  }

  /**
   * 실행해 본다.
   *   opts.loopLimit : loop() 를 몇 바퀴까지 돌 것인가
   *   opts.stepLimit : 전체 명령 수 상한
   *   opts.sensors   : { A0: 512 } 처럼 아날로그 입력을 정해 준다
   *   opts.inputs    : { 2: 1 } 처럼 디지털 입력을 정해 준다
   *   opts.speakerPin : 어느 핀에 피에조가 달렸는가 (기본 8)
   *
   * 돌려주는 것 : { ok, trace, console, pins, led, elapsed, stopped, error }
   *   trace 의 한 칸 = { t, line, kind, text, phase, iteration, ledOn }
   *
   * ★ led.timeline 은 «불이 바뀐 순간» 만 담는다(명세 19장 ledOn).
   *   5단계에서 켜짐·꺼짐 시간을 재고, 4단계에서 LED 그림을 물들이는 데 쓴다.
   */
  function run(source, opts) {
    var o = opts || {};
    var loopLimit = o.loopLimit || CONFIG.loopLimit || 12;
    var stepLimit = o.stepLimit || CONFIG.stepLimit || 20000;

    var parsed = tryParse(source);
    if (!parsed.ok) {
      return {
        ok: false,
        trace: [],
        console: [],
        pins: {},
        elapsed: 0,
        stopped: "parse",
        error: parsed.error
      };
    }
    var ast = parsed.ast;

    var speakerPin =
      o.speakerPin === undefined ? (PC.SPEAKER_PIN === undefined ? 8 : PC.SPEAKER_PIN) : o.speakerPin;

    var state = {
      t: 0,
      steps: 0,
      vars: {},
      /** 배열은 변수와 따로 담는다 — notes[i] 로만 읽는다 */
      arrays: {},
      pinModes: {},
      pinValues: {},
      serial: null,
      trace: [],
      out: [],
      phase: "setup",
      iteration: 0,
      /** 지금 스피커 핀에서 나가는 주파수(Hz). 0 이면 조용하다. */
      hz: 0,
      /** tone(핀, 주파수, 길이) 의 «길이» 가 끝나는 시각. null 이면 멈추라고 할 때까지 울린다. */
      toneStopAt: null,
      toneTimeline: []
    };

    function record(kind, line, text) {
      state.trace.push({
        t: state.t,
        line: line,
        kind: kind,
        text: text || "",
        phase: state.phase,
        iteration: state.iteration,
        hz: state.hz
      });
    }

    /** 주파수가 «바뀐 순간» 만 timeline 에 한 칸 남긴다 */
    function setTone(hz, line) {
      var v = Math.max(0, Math.round(Number(hz) || 0));
      if (state.toneTimeline.length > 0 && state.hz === v) return;
      state.hz = v;
      state.toneTimeline.push({ t: state.t, hz: v, line: line || 0 });
    }

    /**
     * ★ 시간을 흘려보낸다 — 이 차시에서 가장 중요한 부분이다.
     *
     *   tone(핀, 주파수, 길이) 는 «기다리지 않는다». 소리를 시작해 놓고 바로 다음 줄로 간다.
     *   그래서 tone(…, 250); delay(400); 은
     *       0~250ms 소리 → 250~400ms 조용 → 다음 음
     *   이 된다. 이 «150ms 의 조용함» 이 음과 음을 가르는 것이고,
     *   delay 를 tone 의 길이보다 짧게 두면 음이 서로 뭉개진다.
     *
     *   시간을 한 번에 더하지 않고 «멈출 시각» 을 지나며 더하는 까닭이 이것이다.
     */
    function advanceTime(ms) {
      var end = state.t + Math.max(0, Number(ms) || 0);
      while (state.toneStopAt !== null && state.toneStopAt <= end) {
        state.t = state.toneStopAt;
        state.toneStopAt = null;
        setTone(0, 0);
      }
      state.t = end;
    }

    function tick(line) {
      state.steps += 1;
      if (state.steps > stepLimit) throw new StopRun("steps");
      record("stmt", line, "");
    }

    /**
     * 아날로그 입력을 읽는다.
     * 핀은 analogRead(A0) 처럼 «이름» 으로도, analogRead(0) 처럼 «번호» 로도 올 수 있다.
     * 둘 다 sensors 의 A0 칸을 보게 맞춘다.
     */
    function readSensor(pin) {
      var name = /^A\d$/.test(String(pin)) ? String(pin) : "A" + pin;
      var sensors = o.sensors || {};
      if (sensors[name] !== undefined) return Number(sensors[name]);
      if (sensors[pin] !== undefined) return Number(sensors[pin]);
      return 0;
    }

    function readDigital(pin) {
      if (o.inputs && o.inputs[pin] !== undefined) return Number(o.inputs[pin]) ? 1 : 0;
      if (state.pinValues[pin] !== undefined) return state.pinValues[pin] ? 1 : 0;
      return 0;
    }

    /** 값을 시리얼 모니터에 적을 때의 모양 */
    function toText(value) {
      if (typeof value === "number") {
        return Number.isInteger(value) ? String(value) : String(Math.round(value * 100) / 100);
      }
      if (typeof value === "boolean") return value ? "1" : "0";
      return String(value);
    }

    function evaluate(node) {
      if (!node) return 0;
      switch (node.kind) {
        case "number":
          return node.value;
        case "string":
          return node.value;
        case "constant":
          return node.value;
        case "variable":
          if (Object.prototype.hasOwnProperty.call(state.vars, node.name)) return state.vars[node.name];
          throw new StopRun("변수 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)");
        case "index": {
          /* 배열 읽기 :  notes[i] */
          var arr = state.arrays[node.name];
          if (!arr) {
            throw new StopRun(
              "배열 «" + node.name + "» 을(를) 아직 만들지 않았습니다. (" + node.line + "번 줄)"
            );
          }
          var at = Math.floor(Number(evaluate(node.index)));
          if (!(at >= 0 && at < arr.length)) {
            /* 실물 아두이노는 조용히 엉뚱한 값을 읽는다. 시뮬레이터는 그 자리에서 멈춰 알려 준다. */
            throw new StopRun(
              node.name + " 에는 값이 " + arr.length + "개뿐인데 " + at + "번째를 읽으려 했습니다. " +
              "칸 번호는 0 부터 " + (arr.length - 1) + " 까지입니다. (" + node.line + "번 줄)"
            );
          }
          return arr[at];
        }
        case "unary": {
          var v = evaluate(node.arg);
          return node.op === "!" ? (v ? 0 : 1) : -v;
        }
        case "binary": {
          var a = evaluate(node.left);
          var b = evaluate(node.right);
          switch (node.op) {
            case "+":
              return typeof a === "string" || typeof b === "string" ? toText(a) + toText(b) : a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b === 0 ? 0 : a / b;
            case "%":
              return b === 0 ? 0 : a % b;
            case ">":
              return a > b ? 1 : 0;
            case "<":
              return a < b ? 1 : 0;
            case ">=":
              return a >= b ? 1 : 0;
            case "<=":
              return a <= b ? 1 : 0;
            case "==":
              return a === b ? 1 : 0;
            case "!=":
              return a !== b ? 1 : 0;
            case "&&":
              return a && b ? 1 : 0;
            case "||":
              return a || b ? 1 : 0;
            default:
              return 0;
          }
        }
        case "call":
          return callFunction(node);
        default:
          return 0;
      }
    }

    function callFunction(node) {
      var full = callName(node);
      var args = (node.args || []).map(evaluate);

      switch (full) {
        case "Serial.begin":
          state.serial = args[0] || 9600;
          record("serial-open", node.line, String(state.serial));
          return 0;

        case "Serial.print":
        case "Serial.println": {
          var text = args.length ? toText(args[0]) : "";
          if (state.serial === null) {
            record("warn", node.line, "Serial.begin 을 먼저 부르지 않아 시리얼 모니터에 아무것도 보이지 않습니다.");
            return 0;
          }
          var line = {
            t: state.t,
            text: text,
            newline: full === "Serial.println",
            phase: state.phase,
            iteration: state.iteration,
            line: node.line
          };
          state.out.push(line);
          record("print", node.line, text);
          return 0;
        }

        case "pinMode":
          state.pinModes[args[0]] = node.args[1] && node.args[1].name ? node.args[1].name : String(args[1]);
          record("pin-mode", node.line, "D" + args[0] + " → " + state.pinModes[args[0]]);
          return 0;

        case "digitalWrite": {
          var value = args[1] ? 1 : 0;
          state.pinValues[args[0]] = value;
          record("pin-write", node.line, "D" + args[0] + " = " + (value ? "HIGH" : "LOW"));
          return 0;
        }

        /**
         * tone(핀, 주파수)          — 멈추라고 할 때까지 울린다
         * tone(핀, 주파수, 길이ms)  — 그 길이만큼 울리고 «저절로» 멈춘다
         *
         * ★ 어느 쪽이든 «기다리지 않는다». 바로 다음 줄로 간다(명세 12장 오개념).
         */
        case "tone": {
          var tonePin = args[0];
          var freq = Math.round(Number(args[1]) || 0);
          var dur = node.args && node.args.length >= 3 ? Math.max(0, Number(args[2]) || 0) : null;

          if (freq <= 0) {
            record("warn", node.line, "주파수가 0 이하라 소리가 나지 않습니다.");
            return 0;
          }
          if (String(tonePin) !== String(speakerPin)) {
            /* 다른 핀으로 소리를 내라고 한 것 — 스피커는 조용하다. 오류는 아니다. */
            record("tone-other", node.line, "D" + tonePin + " ← " + freq + "Hz (스피커 핀이 아님)");
            return 0;
          }

          setTone(freq, node.line);
          state.toneStopAt = dur === null ? null : state.t + dur;
          record(
            "tone",
            node.line,
            "D" + tonePin + " ← " + freq + "Hz" + (dur === null ? " (멈출 때까지)" : " · " + dur + "ms")
          );
          return 0;
        }

        case "noTone": {
          if (String(args[0]) === String(speakerPin)) {
            state.toneStopAt = null;
            setTone(0, node.line);
          }
          record("no-tone", node.line, "D" + args[0] + " 소리 멈춤");
          return 0;
        }

        case "analogWrite":
          state.pinValues[args[0]] = args[1];
          record("pin-write", node.line, "D" + args[0] + " = " + args[1]);
          return 0;

        case "digitalRead":
          return readDigital(args[0]);

        case "analogRead":
          return readSensor(args[0]);

        case "delay": {
          var ms = Math.max(0, Number(args[0]) || 0);
          advanceTime(ms);
          record("delay", node.line, String(ms));
          return 0;
        }

        case "millis":
          return state.t;

        default:
          throw new StopRun("«" + full + "» 은(는) 시뮬레이터가 모르는 함수입니다. (" + node.line + "번 줄)");
      }
    }

    function execBlock(body) {
      (body || []).forEach(function (stmt) {
        execStatement(stmt);
      });
    }

    function execStatement(stmt) {
      tick(stmt.line);
      switch (stmt.kind) {
        case "declare":
          state.vars[stmt.name] = stmt.init ? evaluate(stmt.init) : 0;
          return;
        case "declare-array":
          state.arrays[stmt.name] = (stmt.items || []).map(function (item) {
            return evaluate(item);
          });
          return;
        case "assign":
          state.vars[stmt.name] = evaluate(stmt.value);
          return;
        case "express":
          evaluate(stmt.expr);
          return;
        case "if":
          if (evaluate(stmt.cond)) execBlock(stmt.then);
          else if (stmt.otherwise) execBlock(stmt.otherwise);
          return;
        case "for": {
          /**
           * ① 처음에 한 번 → ② 조건을 본다 → ③ 안쪽 → ④ 값을 바꾼다 → ② 로
           *
           * ★ 조건이 늘 참인 코드를 막는 것은 stepLimit 하나뿐이다.
           *   tick() 이 명령을 셀 때마다 올라가므로 여기서 따로 셀 필요가 없다.
           */
          if (stmt.init) execStatement(stmt.init);
          while (stmt.cond === null || evaluate(stmt.cond)) {
            state.steps += 1;
            if (state.steps > stepLimit) throw new StopRun("steps");
            execBlock(stmt.body);
            if (stmt.step) execStatement(stmt.step);
          }
          return;
        }
        default:
          return;
      }
    }

    var stopped = "";
    var error = null;

    try {
      (ast.globals || []).forEach(function (g) {
        if (g.kind === "declare-array") {

    <script data-from="student/s00-core.js">

 * 학생용 코어 — 이름 공간과 상태 그릇
 *
 * 이 앱의 JS 는 ES 모듈이 아니라 «고전 스크립트» 다.
 * import/export 없이 각 파일이 즉시실행 함수로 자신을 감싸고 window.PC 아래에만 붙인다.
 * 그래서 빌드가 파일들을 한 HTML 안에 순서대로 넣기만 하면 되고, file:// 로도 열린다.
 *
 * 로드 순서
 *   shared/config → constants → lesson → circuit → arduino → quiz → schema
 *   → s00-core → s10-ui → s20-store → s30-api → s40-board → s50-editor → s60-screens → s90-app
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /** 빈 상태 — 처음 열었을 때의 출발점 */
  function emptyState() {
    return {
      version: 1,
      /* STEPS 의 자리 번호 (0 = 시작하기) */
      step: 0,
      student: { studentId: "", name: "" },

      /* 1단계 — 시작 화면. 넘어가는 조건은 «안전 수칙 확인» 하나다. */
      intro: { safetyRead: false },

      /* 2단계 */
      concept: { opened: {}, checkChoices: {}, checks: {} },

      /* 3단계 — A 부품·단자 찾기 → B 케이블 연결 → C 점검과 전원 인가 (명세 6장) */
      circuit: {
        /* 수동 피에조인가 모듈형인가 — 단자 이름표와 «뒤집힘» 판정이 함께 달라진다(명세 6.3) */
        piezoMode: PC.DEFAULT_PIEZO_MODE || "passive",
        findIndex: 0,

        findAttempts: 0,
        findPicks: {},
        connections: [],
        attempts: 0,
        errors: [],
        hintsUsed: 0,
        hintLevels: {},
        checkPassed: false,
        checked: false,
        powerOn: false,
        /* 회로 판정 결과 — 제출 자료에 그대로 담긴다 */
        path: null
      },

      code: {
        exampleRun: false,
        learned: false,
        mode: "assemble",
        assembleOrder: [],
        blanks: {},
        /* ★ 방식마다 «따로» 기록한다 — 조립과 빈칸을 둘 다 마쳐야 다음이 열린다.

        assembleDone: false,
        blanksDone: false,
        source: "",
        testsPassed: 0,
        testsTotal: 0,
        attempts: 0,
        ran: false,
        syntaxErrors: [],
        pinMismatch: []
      },

      /* 5단계 — 실험 A·B·C 를 저마다 «예상 → 실행 → 관찰» 로 기록한다 (명세 7장 화면5)
         runs 의 한 칸 = { predict, ran, notes, elapsed, observation, surprise }
         notes 는 «실제로 울린 음의 수» 다 */
      experiment: {
        runs: {},
        lastRun: null,
        extensionSource: "",
        /* 빈칸 채우기에 적은 것 — 다시 열었을 때 그대로 남아 있어야 한다 */
        extensionBlanks: {},
        extensionTried: false,
        /* 어떤 알림음을 골랐는가 — 성공음·경고음·호출음 */
        extensionKind: ""

      assessment: { answers: {}, attempts: 0, graded: false, sealed: false },

  function bool(value) {
    return value === true;

  function num(value) {

  function str(value) {

  function plainObject(value) {

  function array(value) {

   * 예전에 저장한 자료에 빠진 칸이 있어도 화면이 깨지지 않게 한다.
   */
  function normalizeState(raw) {
    var base = emptyState();
    var r = plainObject(raw);
    var steps = PC.STEPS || [];

    base.step = num(r.step);
    if (base.step < 0 || base.step >= steps.length) base.step = 0;

    var student = plainObject(r.student);
    base.student.studentId = str(student.studentId);
    base.student.name = str(student.name);

    var intro = plainObject(r.intro);
    base.intro.safetyRead = bool(intro.safetyRead);

    var concept = plainObject(r.concept);
    base.concept.opened = plainObject(concept.opened);
    base.concept.checkChoices = plainObject(concept.checkChoices);
    base.concept.checks = plainObject(concept.checks);

    var circuit = plainObject(r.circuit);

    base.circuit.piezoMode = PC.piezoMode

    base.circuit.findIndex = num(circuit.findIndex);
    base.circuit.findDone = bool(circuit.findDone);
    base.circuit.findAttempts = num(circuit.findAttempts);

      .filter(Boolean);

    base.circuit.errors = array(circuit.errors);

    base.circuit.hintLevels = plainObject(circuit.hintLevels);
    base.circuit.findPicks = plainObject(circuit.findPicks);
    base.circuit.checkPassed = bool(circuit.checkPassed);
    base.circuit.checked = bool(circuit.checked);
    base.circuit.powerOn = bool(circuit.powerOn);
    base.circuit.path = circuit.path || null;

    var code = plainObject(r.code);
    base.code.exampleRun = bool(code.exampleRun);
    base.code.learned = bool(code.learned);
    base.code.mode = str(code.mode) || "assemble";
    base.code.assembleOrder = array(code.assembleOrder).map(str);
    base.code.assembleDone = bool(code.assembleDone);
    base.code.blanksDone = bool(code.blanksDone);
    base.code.blanks = plainObject(code.blanks);
    base.code.source = str(code.source);
    base.code.testsPassed = num(code.testsPassed);
    base.code.testsTotal = num(code.testsTotal);
    base.code.attempts = num(code.attempts);
    base.code.ran = bool(code.ran);
    base.code.syntaxErrors = array(code.syntaxErrors);
    base.code.pinMismatch = array(code.pinMismatch);

    var experiment = plainObject(r.experiment);
    var runs = plainObject(experiment.runs);
    base.experiment.runs = {};
    Object.keys(runs).forEach(function (id) {
      var item = plainObject(runs[id]);
      base.experiment.runs[id] = {

       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* ★ 전원은 «켰다» 는 기록만으로 유지하지 않는다.
       전원을 켠 뒤 케이블을 뽑아 위험한 회로로 바꾸면 그대로 켜져 있어서는 안 된다.
       저장 자료를 손으로 고쳐 전원을 켜 두는 길도 이 두 줄이 막는다. */
    if (base.circuit.powerOn && !PC.circuit.canPowerOn(base.circuit.connections).ok) {
      base.circuit.powerOn = false;
    }
    if (!PC.circuit.checkCircuit(base.circuit.connections).ok) base.circuit.checkPassed = false;

    /* 저장된 step 이 «지금 열 수 있는 곳» 보다 앞서 있으면 되돌린다.
       (저장 자료를 손으로 고쳐 단계를 건너뛰지 못하게) */
    var furthest = PC.schema.furthestStep(base);
    if (base.step > furthest) base.step = furthest;

    return base;
  }

  /** 작성한 것이 하나라도 있는가? — 페이지 이탈 경고에 쓴다 */
  function hasContent(state) {

    if (state.circuit.connections.length > 0) return true;

    if (Object.keys(state.assessment.answers).length > 0) return true;
    if (state.intro.safetyRead || Object.keys(state.concept.checks).length > 0) return true;

  }

  /** 시각을 「2026-08-18 10:20:31」 로 */

      "-" +
      two(d.getMonth() + 1) +
      "-" +
      two(d.getDate()) +
      " " +
      two(d.getHours()) +
      ":" +
      two(d.getMinutes()) +
      ":" +
      two(d.getSeconds())
    );
  }

  S.normalizeState = normalizeState;
  S.hasContent = hasContent;
  S.formatTime = formatTime;

/**
 * 화면 부품 (명세 13장)
 *
 * 여기서 만드는 요소는 모두 «텍스트로» 넣는다(textContent).

 *   · 정답/오답·위험은 색이 아니라 «아이콘 + 글자» 로도 알린다

(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  /* 화면이 없는 곳(테스트)에서는 이 파일이 하는 일이 없다 */

    if (o.on) {

      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

      if (v === false || v === null || v === undefined) return;
      node.setAttribute(k, String(v));

    if (o.eyebrow) head.push(el("p", { class: "card__eyebrow", text: o.eyebrow }));
    if (o.title) head.push(el("h2", { class: "card__title", text: o.title }));
    if (o.desc) head.push(el("p", { class: "card__desc", text: o.desc }));

          el("b", { class: "alert__word", text: mark.word + " " }),

        ])

    ]);
  }

  /** 조건 목록 한 줄 — 「✔ 통과」 또는 「○ 아직」 (명세 6.2 · 13장) */
  function conditionRow(label, ok, detail) {

      el("span", { class: "cond__mark", attrs: { "aria-hidden": "true" }, text: ok ? "✔" : "○" }),

        ]),
        detail ? el("p", { class: "cond__detail", text: detail }) : null

  /**
   * 접어 두는 덧자료 — «마쳐야 하는 것» 과 «더 보고 싶은 것» 을 갈라 놓는다.
   *
   * 닫힌 채로 나온다. 펼칠 때 만들므로 열지 않으면 그리지도 않는다.
   * 통과 조건이 아닌 활동을 늘 펼쳐 두면, 학생은 그것도 해야 하는 줄 안다.

      ? el("textarea", {

    function countText() {

      return s.min ? "공백 제외 " + len + "자 / 최소 " + s.min + "자" : "공백 제외 " + len + "자";

    var error = el("p", { class: "field__error", id: errId, attrs: { role: "alert", hidden: true } });

        error.hidden = true;
        input.removeAttribute("aria-invalid");
        input.setAttribute("aria-describedby", cntId);
      }
    }

    var rootNode = el("div", { class: "field" }, [
      el("label", { class: "field__label", attrs: { for: id }, text: s.label || "" }),
      s.help ? el("p", { class: "field__help", text: s.help }) : null,
      input,
      el("div", { class: "field__foot" }, [counter, error])
    ]);

    return { root: rootNode, input: input, setError: setError, refresh: refresh };
  }

  /**
   * 보기 고르기 (라디오). 색이 아니라 «글자» 로 고른 것을 알린다.
   * spec : { name, legend, choices:[문자열], numbered }
   */
  function choiceGroup(spec, selected, onPick) {
    var s = spec || {};
    var name = s.name || nextId("q");
    var CIRCLED = ["①", "②", "③", "④", "⑤", "⑥"];

    var items = (s.choices || []).map(function (label, i) {
      var id = name + "-" + i;
      var input = el("input", {
        class: "choice__input",
        id: id,
        attrs: { type: "radio", name: name, value: String(i) }
      });
      if (String(selected) === String(i)) input.checked = true;
      input.addEventListener("change", function () {
        if (onPick) onPick(i);
      });

      return el("div", { class: "choice" }, [
        input,
        el("label", { class: "choice__label", attrs: { for: id } }, [
          s.numbered === false
            ? null
            : el("span", { class: "choice__no", attrs: { "aria-hidden": "true" }, text: CIRCLED[i] || String(i + 1) }),
          el("span", { class: "choice__text", text: label })
        ])
      ]);
    });

    return el("fieldset", { class: "choices" }, [
      s.legend ? el("legend", { class: "choices__legend", text: s.legend }) : null
    ].concat(items));
  }

  function button(label, opts) {
    var o = opts || {};
    var attrs = {
      type: "button",
      disabled: o.disabled ? true : null,
      "aria-pressed": o.pressed === undefined ? null : o.pressed ? "true" : "false",
      title: o.title || null
    };
    /* 부르는 곳에서 aria-label 같은 것을 더 붙일 수 있게 */
    Object.keys(o.attrs || {}).forEach(function (k) {
      attrs[k] = o.attrs[k];
    });

    return el("button", {
      class: o.class && o.class.indexOf("btn") === 0 ? o.class : "btn " + (o.class || "btn--primary"),
      text: label,
      attrs: attrs,
      on: o.on || (o.click ? { click: o.click } : null)
    });
  }

  /* ------------------------------ 물어보기 ------------------------------ */

  /**
   * 화면 가운데에 띄워 «둘 중 하나» 를 고르게 한다.
   *
   * `<dialog>` 를 쓴다 — 브라우저가 뒷배경을 어둡게 하고, 바깥을 누를 수 없게 하고,
   * 초점을 상자 안에 잡아 준다. file:// 에서도 그대로 동작한다.
   *
   * spec = {
   *   title, lines[], okLabel, cancelLabel,
   *   onOk, onCancel,
   *   dismiss : "ok" | "cancel"   — Esc 로 닫았을 때 어느 쪽으로 볼지
   * }
   *
   * ★ Esc 로 닫으면 «지우지 않는 쪽» 이 되게 부르는 곳에서 dismiss 를 정한다.
   *   실수로 눌러 기록이 사라지는 일은 되돌릴 수 없다.
   */
  function askDialog(spec) {
    var s = spec || {};
    var dialog = el("dialog", { class: "modal" });
    var settled = false;

    function done(which) {
      if (settled) return;
      settled = true;
      if (dialog.open && dialog.close) dialog.close();
      /* 닫는 애니메이션이 끝난 뒤 치운다 */
      setTimeout(function () {
        if (dialog.parentNode) dialog.parentNode.removeChild(dialog);
      }, 0);
      if (which === "ok" && s.onOk) s.onOk();
      if (which === "cancel" && s.onCancel) s.onCancel();
    }

    var okBtn = button(s.okLabel || "확인", {
      click: function () {
        done("ok");
      }
    });

    dialog.appendChild(
      el("div", { class: "modal__body" }, [
        el("h2", { class: "modal__title", text: s.title || "" }),
        el(
          "p",
          { class: "modal__text" },
          (s.lines || []).map(function (line, i) {
            /* 줄바꿈을 innerHTML 없이 만든다 (명세 15장 — 글은 textContent 로만) */
            return el("span", { class: "modal__line", text: line, id: i === 0 ? null : undefined });
          })
        ),
        el("div", { class: "modal__actions" }, [
          button(s.cancelLabel || "취소", {
            class: "btn btn--ghost",
            click: function () {
              done("cancel");
            }
          }),
          okBtn
        ])
      ])
    );

    /* Esc·바깥 닫기 — 어느 쪽으로 볼지는 부르는 곳이 정한다 */
    dialog.addEventListener("cancel", function (evt) {
      evt.preventDefault();
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });
    dialog.addEventListener("close", function () {
      done(s.dismiss === "ok" ? "ok" : "cancel");
    });

    document.body.appendChild(dialog);
    if (typeof dialog.showModal === "function") dialog.showModal();
    else dialog.setAttribute("open", ""); /* 아주 옛 브라우저 */
    okBtn.focus();

    return dialog;
  }

  /* ------------------------------ 알려 주기 ------------------------------ */

  function toast(message) {
    var region = $("#toast-region");
    if (!region) return;
    var box = el("div", { class: "toast", text: message });
    region.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) box.parentNode.removeChild(box);
    }, 4000);
  }

  /** 화면 낭독기에 조용히 알린다 */
  function announce(message) {
    var live = $("#sr-live");
    if (live) live.textContent = message;
  }

  S.ui = {
    nextId: nextId,
    $: $,
    $$: $$,
    el: el,
    svg: svg,
    clear: clear,
    card: card,
    codeBlock: codeBlock,
    alert: alert,
    conditionRow: conditionRow,
    foldout: foldout,
    field: field,
    choiceGroup: choiceGroup,
    button: button,
    askDialog: askDialog,
    toast: toast,
    announce: announce
  };
})();
    </script>
    <script data-from="student/s20-store.js">
/**
 * 임시 저장 (명세 5장 마지막 줄 · 15장)
 *
 * localStorage 는 «작성 중» 을 잃지 않기 위한 임시 보관함이다.
 * 학생 답안의 최종 저장소가 아니다. 최종 저장은 서버(또는 내려받은 JSON)가 한다.
 *
 * 담는 것
 *   <앞머리>:student    학생 정보
 *   <앞머리>:draft      진행 상태 · 회로 · 코드 · 실험 기록 · 평가 응답
 *   <앞머리>:endpoint   선생님이 알려 준 제출 주소
 *   <앞머리>:pending    서버로 못 보낸 제출 (재시도용)
 *
 * ★ 성공 응답을 받기 전에는 draft 를 지우지 않는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var PREFIX = (PC.CONFIG && PC.CONFIG.autosaveKeyPrefix) || "physical3-draft-v1";

  /** localStorage 가 막혀 있어도(시크릿 창 등) 앱이 죽지 않게 감싼다. */
  function safeGet(key) {
    try {
      return root.localStorage ? root.localStorage.getItem(key) : null;
    } catch (e) {
      return null;
    }
  }

  function safeSet(key, value) {
    try {
      if (root.localStorage) root.localStorage.setItem(key, value);
      return true;
    } catch (e) {
      /* 저장 공간이 가득 찼거나 막혀 있다 — 화면은 그대로 쓸 수 있게 둔다 */
      return false;
    }
  }

  function safeRemove(key) {
    try {
      if (root.localStorage) root.localStorage.removeItem(key);
    } catch (e) {
      /* 지우지 못해도 할 수 있는 일이 없다 */
    }
  }

  function readJson(key, fallback) {
    var raw = safeGet(key);
    if (!raw) return fallback;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  var keys = {
    student: function () {
      return PREFIX + ":student";
    },
    draft: function () {
      return PREFIX + ":draft";
    },
    endpoint: function () {
      return PREFIX + ":endpoint";
    },
    pending: function () {
      return PREFIX + ":pending";
    }
  };

  /* ------------------------------ 제출 주소 ------------------------------ */

  function loadEndpoint() {
    var v = safeGet(keys.endpoint());
    return v ? String(v) : "";
  }

  function saveEndpoint(url) {
    var clean = String(url || "").trim();
    if (clean) safeSet(keys.endpoint(), clean);
    else safeRemove(keys.endpoint());
  }

  /* ------------------------------ 학생 정보 ------------------------------ */

  function loadStudent() {
    var v = readJson(keys.student(), null);
    if (!v || typeof v !== "object") return null;
    return { studentId: String(v.studentId || ""), name: String(v.name || "") };
  }

  function saveStudent(student) {
    safeSet(keys.student(), JSON.stringify(student || {}));
  }

  /* ------------------------------ 작성 내용 ------------------------------ */

  function loadDraft() {
    var raw = readJson(keys.draft(), null);
    if (!raw) return null;
    return S.normalizeState(raw);
  }

  function saveDraft(state) {
    if (!state) return false;
    return safeSet(keys.draft(), JSON.stringify(state));
  }

  /** 제출에 «성공했을 때만» 부른다. */
  function clearDraft() {
    safeRemove(keys.draft());
  }

  /**
   * 이 기기의 «내 흔적» 을 모두 지운다 — 공용 태블릿에서 다음 학생에게 넘길 때.
   *
   * 남기는 것 : «아직 보내지 못한 제출»
   *   앞 학생이 통신이 끊겨 못 보낸 답안까지 지우면 그 답안은 영영 사라진다.
   */
  function clearAll() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    return loadPending().length;
  }

  /**
   * «처음부터 시작» 을 골랐을 때 — 이 차시의 학습 기록을 남김없이 지운다.
   *
   *   지우는 것 : 진행 기록(draft) · 학번·이름 · 데모로 낸 제출
   *   남기는 것 : 제출 주소 · 아직 보내지 못한 제출
   *
   * 주소는 선생님이 알려 준 «기기 설정» 이고, 못 보낸 제출은 지우면 그 답안이 영영 사라진다.
   * 둘 다 학습 기록이 아니므로 처음부터 시작해도 그대로 둔다.
   */
  function resetLearning() {
    safeRemove(keys.student());
    safeRemove(keys.draft());
    safeRemove(PC.DEMO_STORE_KEY);
    return loadPending().length;
  }

  /* ------------------------------ 못 보낸 제출 ------------------------------ */

  /** 같은 학생의 같은 차시는 하나만 남긴다(재시도할 때 여러 번 올라가지 않게) */
  function queuePending(payload) {
    var list = loadPending();
    var key = PC.schema.dedupeKey(payload);
    list = list.filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    list.push(payload);
    safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  function loadPending() {
    var list = readJson(keys.pending(), []);
    return Array.isArray(list) ? list : [];
  }

  function removePending(payload) {
    var key = PC.schema.dedupeKey(payload);
    var list = loadPending().filter(function (p) {
      return PC.schema.dedupeKey(p) !== key;
    });
    if (list.length === 0) safeRemove(keys.pending());
    else safeSet(keys.pending(), JSON.stringify(list));
    return list.length;
  }

  S.store = {
    prefix: PREFIX,
    keys: keys,
    loadStudent: loadStudent,
    saveStudent: saveStudent,
    loadEndpoint: loadEndpoint,
    saveEndpoint: saveEndpoint,
    loadDraft: loadDraft,
    saveDraft: saveDraft,
    clearDraft: clearDraft,
    clearAll: clearAll,
    resetLearning: resetLearning,
    queuePending: queuePending,
    loadPending: loadPending,
    removePending: removePending,
    /* 테스트에서 쓰는 낮은 수준 도구 */
    _readJson: readJson,
    _safeSet: safeSet
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.store;
})();
    </script>
    <script data-from="student/s30-api.js">
/**
 * 제출 보내기 (명세 10장)
 *
 * 길은 셋이다.
 *   ① 데모 모드      — 이 기기 안(localStorage)에만 담는다. 실제 저장이 아니다.
 *   ② 실제 서버 모드 — config.js 의 apiUrl(또는 학생이 넣은 주소)로 보낸다.
 *   ③ 파일로 내기    — 주소가 없거나 통신이 실패했을 때 파일로 받아 선생님께 낸다.
 *
 * 실패해도 답안을 버리지 않는다. 임시 저장에 남기고 그 자리에서 [파일로 내기] 를 연다.
 *
 * Apps Script 로 보낼 때 Content-Type 을 text/plain 으로 하는 까닭
 *   application/json 으로 보내면 브라우저가 먼저 «사전 확인 요청(preflight)» 을 보내는데
 *   Apps Script 웹앱은 그 요청에 답하지 못해 통신이 막힌다.
 *   text/plain 은 사전 확인이 없어 그대로 통과한다. 서버는 본문을 JSON 으로 읽는다.
 */
(function () {
  "use strict";

  var root = typeof window !== "undefined" ? window : globalThis;
  var PC = root.PC || (root.PC = {});
  var S = PC.student || (PC.student = {});

  var TIMEOUT_MS = 15000;

  /** 테스트에서 갈아 끼울 수 있게 한 번 감싼다. */
  var fetchImpl = null;
  function getFetch() {
    if (fetchImpl) return fetchImpl;
    return typeof root.fetch === "function" ? root.fetch.bind(root) : null;
  }

  /** 제출 번호를 만든다(데모 모드용). 서버 모드에서는 서버가 만든 값을 쓴다. */
  function makeId() {
    var rand = Math.random().toString(36).slice(2, 8);
    return "demo_" + Date.now().toString(36) + rand;
  }

  /* ------------------------------------------------------------------ */
  /* 데모 모드 저장소                                                     */
  /* ------------------------------------------------------------------ */

  function readDemoAll() {
    try {
      var raw = root.localStorage ? root.localStorage.getItem(PC.DEMO_STORE_KEY) : null;
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeDemoAll(list) {
    try {
      if (root.localStorage) root.localStorage.setItem(PC.DEMO_STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 데모 저장 — 서버와 «같은 규칙» 으로 같은 학생의 제출은 덮어쓴다(명세 10장).
   * 그래야 데모로 확인한 동작이 실제 서버에서도 같다.
   */
  function saveDemo(payload) {
    var list = readDemoAll();
    var key = PC.schema.dedupeKey(payload);
    var nowIso = new Date().toISOString();

    var found = -1;
    for (var i = 0; i < list.length; i += 1) {
      if (PC.schema.dedupeKey(list[i]) === key) {
        found = i;
        break;
      }
    }

    var record = JSON.parse(JSON.stringify(payload));
    record.demo = true;

    if (found >= 0) {
      record.submissionId = list[found].submissionId || makeId();
      record.serverSubmittedAt = list[found].serverSubmittedAt || nowIso;
      record.serverUpdatedAt = nowIso;
      list[found] = record;
    } else {
      record.submissionId = makeId();
      record.serverSubmittedAt = nowIso;
      record.serverUpdatedAt = nowIso;
      list.push(record);
    }
    writeDemoAll(list);

    return {
      ok: true,
      demo: true,
      submissionId: record.submissionId,
      serverSubmittedAt: record.serverSubmittedAt,
      serverUpdatedAt: record.serverUpdatedAt,
      updated: found >= 0,
      /* 데모도 실제와 같은 이름을 알려 준다 — 어디에 무엇으로 저장되는지 보이게 */
      fileName: fileNameFor(payload)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 실제 서버로 보내기                                                    */
  /* ------------------------------------------------------------------ */

  function postJson(url, payload) {
    var f = getFetch();
    if (!f) return Promise.reject(new Error("이 브라우저에서는 제출 기능을 쓸 수 없습니다."));

    var options = {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    };

    var controller = null;
    var timer = null;
    if (typeof root.AbortController === "function") {
      controller = new root.AbortController();
      options.signal = controller.signal;
      timer = setTimeout(function () {
        controller.abort();
      }, TIMEOUT_MS);
    }

    return f(url, options)
      .then(function (res) {
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          /* 로그인 화면 HTML 등이 돌아온 경우 — 학생에게 내부 내용을 보여 주지 않는다 */
          throw new Error("서버 응답을 읽지 못했습니다.");
        }
      })
      .catch(function (err) {
        if (timer) clearTimeout(timer);
        throw err;
      });
  }

  /**
   * 지금 쓸 제출 주소를 정한다.
   *   ① 학생이 넣은 주소 (선생님이 링크로 알려 준 것)
   *   ② 설정 파일에 미리 적어 둔 주소
   */
  function endpointOf(given) {
    var typed = String(given || "").trim();
    if (typed) return typed;
    var saved = S.store ? S.store.loadEndpoint() : "";
    if (saved) return saved;
    return PC.config.fixedUrl();
  }

  /**
   * 제출한다.
   * 성공 : { ok:true, submissionId, serverSubmittedAt, updated, demo }
   * 실패 : { ok:false, message, kind:'network'|'server'|'no-url' }
   */
  function submit(payload, endpoint) {
    if (PC.config.isDemo()) {
      /* 데모는 즉시 끝나지만 실제와 같은 «기다림» 을 짧게 흉내 내
         제출 중 표시와 이중 클릭 방지가 실제로 동작하는지 확인할 수 있게 한다. */
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(saveDemo(payload));
        }, 250);
      });
    }

    var url = endpointOf(endpoint);
    if (!url) {
      return Promise.resolve({ ok: false, kind: "no-url", message: PC.MESSAGES.noUrl });
    }

    return postJson(url, payload).then(
      function (data) {
        if (data && data.ok === true) {
          return {
            ok: true,
            demo: false,
            submissionId: data.submissionId || "",
            serverSubmittedAt: data.serverSubmittedAt || "",
            serverUpdatedAt: data.serverUpdatedAt || data.serverSubmittedAt || "",
            updated: data.updated === true,
            /* 서버가 실제로 저장한 파일 이름 — 학생 화면의 진행 기록에 그대로 보여 준다 */
            fileName: data.fileName || fileNameFor(payload)
          };
        }
        return {
          ok: false,
          kind: "server",
          /* 서버가 준 «학생이 고칠 수 있는» 메시지만 보여 준다 */
          message: (data && data.message) || PC.MESSAGES.serverFail
        };
      },
      function () {
        return { ok: false, kind: "network", message: PC.MESSAGES.networkFail };
      }
    );
  }

  /* ------------------------------------------------------------------ */
  /* 파일로 내기 (명세 10장)                                              */
  /* ------------------------------------------------------------------ */

  /**
   * 파일 이름 : 10312_홍길동.json
   *
   * 서버(Apps Script)가 공유 드라이브에 저장할 때 쓰는 이름과 «똑같이» 맞춘다.
   * 그래야 인터넷이 끊겨 파일로 받아 낸 제출도 선생님이 폴더에 그대로 넣을 수 있다.
   * 이름의 공백을 빼므로 «홍길동» 과 «홍 길동» 은 같은 파일이 된다.
   */
  function fileNameFor(payload) {
    var p = payload || {};
    var safeName = String(p.studentName || "이름없음").replace(/[\\/:*?"<>|\s]/g, "");
    return String(p.studentId || "00000") + "_" + (safeName || "이름없음") + ".json";
  }

  /**
   * 브라우저에서 파일로 내려받는다.
   * file:// 에서도 동작하도록 Blob + a[download] 만 쓴다.
   */
  function download(payload) {
    if (typeof document === "undefined") return false;
    var text = JSON.stringify(payload, null, 2);
    try {
      var blob = new Blob([text], { type: "application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(payload);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  /** 데모 저장분을 모두 지운다(수업 준비용) */
  function clearDemo() {
    writeDemoAll([]);
  }

  S.api = {
    submit: submit,
    endpointOf: endpointOf,
    saveDemo: saveDemo,
    readDemoAll: readDemoAll,
    clearDemo: clearDemo,
    makeId: makeId,
    download: download,
    fileNameFor: fileNameFor,
    _setFetch: function (fn) {
      fetchImpl = fn;
    }
  };

  if (typeof module !== "undefined" && module.exports) module.exports = S.api;
})();
